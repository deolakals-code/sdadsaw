l_english: 

 #Pillow Talk, by Sean Hughes
 intrigue_temptation.2201.t:0 "สนทนาบนหมอน"
 intrigue_temptation.2201.desc:0 "หลังจากการพบปะส่วนตัวครั้งล่าสุดของเรา ข้าและ[my_lover.GetFirstName]นอนเคียงข้างกัน สนทนาเรื่อยเปื่อย\n\n"และท่านคงไม่เชื่อแน่—" [my_lover.GetSheHe] หยุดพูดกะทันหันและหน้าแดง "ข้าขออภัย ที่รักของข้า เรื่องนี้คงจะน่าเบื่ออย่างยิ่งสำหรับท่าน...""
 intrigue_temptation.2201.a:0 "หามิได้เลย โปรดเล่าให้ข้าฟังอีกเถิด..."
 intrigue_temptation.2201.a.success:0 "[my_lover.GetFirstName] แบ่งปันข่าวซุบซิบจากราชสำนักของ[court_owner.GetTitledFirstNamePossessive]"
 intrigue_temptation.2201.a.success.tt:0 "ข้าได้เรียนรู้[secret|E]ของตัวละครแบบสุ่ม"
 intrigue_temptation.2201.a.failure:0 "[my_lover.GetFirstName] ปฏิเสธที่จะพูดอะไรอีก"
 intrigue_temptation.2201.b:0 "การฟังเสียงของเจ้าไม่เคยน่าเบื่อเลย ที่รักของข้า"
 intrigue_temptation.2201.d.sadistic:0 "เจ้ากำลังปิดบังบางอย่าง... บอกข้ามา #EMP เดี๋ยวนี้#!!"

 #Matchmaking, by Mathilda Bjarnehed
 intrigue_temptation_special.1001.t:0 "ว่าด้วยรักและใคร่"
 intrigue_temptation_special.1001.desc:0 "สีหน้าเพ้อฝันและเสียงถอนหายใจโหยหาเหล่านั้นมีความหมายได้อย่างเดียว – [wants_love.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังโหยหาความรัก!\n\nบางทีข้าควรจะทดสอบทักษะการจับคู่ของข้าและบรรเทาความทุกข์ของ[wants_love.GetHerHis]? [wants_love.GetSheHe|U] คงจะรู้สึกขอบคุณอย่างแน่นอน!"
 intrigue_temptation_special.1001.a:0 "[wants_love.GetFirstNameNoTooltip] จะไม่อ้างว้างอีกนาน!"
 intrigue_temptation_special.1001.a.tt:0 "[wants_love.GetTitledFirstName] อาจกลายเป็นคนรักของคู่ที่ข้าเลือก"
 intrigue_temptation_special.1001.b:0 "ข้าต้องให้ความสำคัญกับการสมรสของข้าเอง"
 intrigue_temptation_special.1001.c:0 "ข้าต้องให้ความสำคัญกับชีวิตรักของข้าเอง"

 intrigue_temptation_special.1002.t:0 "เรื่องของรสนิยม"
 intrigue_temptation_special.1002.desc:0 "เพื่อที่จะหาคู่ที่สมบูรณ์แบบให้[wants_love.GetTitledFirstNamePossessive] ข้าต้องรู้เพิ่มเติมเกี่ยวกับความชอบของ[wants_love.GetHerHis] ด้วยการสังเกตการณ์ปฏิสัมพันธ์ของ[wants_love.GetHerHis]ในราชสำนักอย่างสุขุม ข้าอาจจะได้เห็นความปรารถนาส่วนลึกของ[wants_love.GetHerHis]...\n\nก่อนที่ข้าจะเริ่ม ข้าควรจะมีทฤษฎีรองรับ ข้าคิดว่า[wants_love.GetFirstNameNoTooltip]ต้องการอะไรในคู่ครอง?"
 intrigue_temptation_special.1002.a:0 "หัวใจที่เข้ากันได้ บุคลิกที่เข้ากับ[wants_love.GetHerHis]"
 intrigue_temptation_special.1002.a.tt:0 "#F คนส่วนใหญ่ โดยเฉพาะผู้ที่เห็นอกเห็นใจและใจดี มักชอบคู่ครองที่มีบุคลิกคล้ายคลึงกับตนเอง\n\nหากสมมติฐานของข้าผิด ข้าสามารถสันนิษฐานได้ว่า [wants_love.GetFirstName] ชอบความน่าดึงดูดหรืออำนาจ#!"
 intrigue_temptation_special.1002.b:0 "ความน่าดึงดูด ไม่ว่าจะเป็นรูปร่างหรืออารมณ์"
 intrigue_temptation_special.1002.b.tt:0 "#F ผู้ที่มักมากในกาม เย่อหยิ่ง หรือน่าดึงดูด มักจะชอบคู่ครองที่หน้าตาดี เป็นมิตร กล้าหาญ หรือเจ้าชู้\n\nหากสมมติฐานของข้าผิด ข้าสามารถสันนิษฐานได้ว่า [wants_love.GetFirstName] ชอบบุคลิกที่เข้ากันหรืออำนาจ#!"
 intrigue_temptation_special.1002.c:0 "อำนาจและอิทธิพล"
 intrigue_temptation_special.1002.c.tt:0 "#F ผู้ที่ปรารถนาความมั่งคั่งและความสำเร็จมักจะชอบคู่ครองที่มีอำนาจ\n\nหากสมมติฐานของข้าผิด ข้าสามารถสันนิษฐานได้ว่า [wants_love.GetFirstName] ชอบบุคลิกที่เข้ากันหรือความน่าดึงดูด#!"
 intrigue_temptation_special.1002.d:0 "ข้าอยากจะค้นหาว่า [wants_love.GetSheHe] ชอบบุรุษหรือสตรีมากกว่า "
 intrigue_temptation_special.1002.d.tt:1 "#F คนส่วนใหญ่ชอบคู่ครองเพศตรงข้าม แต่ก็ไม่ใช่เรื่องแปลกที่จะชอบคนเพศเดียวกัน หรือทั้งสองเพศ#!"

 intrigue_temptation_special.1003.t:0 "การจับคู่"
 intrigue_temptation_special.1003.start.desc:0 "ข้าได้สังเกตการณ์ [wants_love.GetTitledFirstName] มาระยะหนึ่งแล้ว และข้อสรุปของข้าก็แน่นอน"
 intrigue_temptation_special.1003.personality_success.desc:0 "ดังที่ข้าสงสัย [wants_love.GetSheHe] ชอบผู้ที่มีอารมณ์คล้ายคลึงกับ[wants_love.GetHerHis]"
 intrigue_temptation_special.1003.personality_failure.desc:0 "ข้าคิดผิด [wants_love.GetSheHe|U] ดูเหมือนจะใส่ใจเรื่องบุคลิกน้อย [wants_love.GetSheHe|U] คงจะชอบอำนาจหรือความน่าดึงดูดในคู่ครองมากกว่า"
 intrigue_temptation_special.1003.sex_appeal_success.desc:0 "[wants_love.GetSheHe|U] ถูกดึงดูด ดุจแมลงเม่าบินเข้ากองไฟ ไปยังผู้ที่มีเสน่ห์และความงามอันยิ่งใหญ่"
 intrigue_temptation_special.1003.sex_appeal_failure.desc:0 "ข้าเข้าใจผิด – [wants_love.GetSheHe|U] ดูเหมือนจะไม่แยกแยะระหว่างผู้ที่ได้รับพรด้านหน้าตาดีกับผู้ที่หน้าตาธรรมดา [wants_love.GetSheHe|U] คงจะใส่ใจเรื่องบุคลิก... หรืออำนาจมากกว่า"
 intrigue_temptation_special.1003.power_success.desc:0 "ดังที่ข้าคาดเดา [wants_love.GetSheHe] ชอบการอยู่ร่วมกับเหล่าขุนนางและสุภาพสตรีผู้ทรงอิทธิพลที่สุดในราชสำนัก"
 intrigue_temptation_special.1003.power_failure.desc:0 "ข้าคิดผิด [wants_love.GetSheHe|U] มีปฏิสัมพันธ์กับผู้คนทั้งยศสูงและต่ำ มันต้องเป็นองค์ประกอบอื่นนอกเหนือจากอำนาจที่ ทำให้[wants_love.GetHerHim]สนใจ – บุคลิกที่เข้ากันหรือรูปลักษณ์ที่สง่างาม บางที?"
 intrigue_temptation_special.1003.end.desc:0 "\n\nบัดนี้ข้าคุ้นเคยกับความปรารถนาของ[wants_love.GetFirstNamePossessiveNoTooltip]มากขึ้นเล็กน้อยแล้ว ข้าได้ทำรายชื่อคู่ที่มีศักยภาพไว้ ใครจะเหมาะสมกับ[ROOT.GetCharacter.Custom2('RelationToMe' , wants_love )]ของข้าที่สุด?"
 intrigue_temptation_special.1003.a:0 "[target_list_member_a.GetTitledFirstNameNoTooltip] ผู้[target_list_member_a.Custom('ComplimentAdjective')]"
 intrigue_temptation_special.1003.a.tt:0 "ข้าพยายามจับคู่ [wants_love.GetFirstName] กับ [target_list_member_a.GetTitledFirstName]"
 intrigue_temptation_special.1003.b:0 "[target_list_member_b.GetTitledFirstNameNoTooltip], [target_list_member_b.GetWomanMan] ผู้[target_list_member_b.Custom('ComplimentAdjective')]"
 intrigue_temptation_special.1003.b.tt:0 "ข้าพยายามจับคู่ [wants_love.GetFirstName] กับ [target_list_member_b.GetTitledFirstName]"
 intrigue_temptation_special.1003.c:0 "[ROOT.GetCharacter.Custom2('RelationToMe' , target_list_member_c )] ผู้[target_list_member_c.Custom('ComplimentAdjective')]ของข้า, [target_list_member_c.GetTitledFirstNameNoTooltip]"
 intrigue_temptation_special.1003.c.tt:0 "ข้าพยายามจับคู่ [wants_love.GetFirstName] กับ [target_list_member_c.GetTitledFirstName]"
 intrigue_temptation_special.1003.tt:0 "คู่ที่ดีคือผู้ที่ตอบสนองความชอบของ[wants_love.GetFirstNamePossessive]"

 intrigue_temptation_special.1004.t:0 "การสร้างบรรยากาศ"
 intrigue_temptation_special.1004.start.desc:0 "เพื่อประเมินคุณภาพของคู่ที่ข้าเลือก ข้าได้จัดงานเลี้ยงอาหารค่ำเล็กๆ โดยมีทั้ง [wants_love.GetTitledFirstName] และ [chosen_match.GetTitledFirstName] อยู่ในรายชื่อแขก"
 intrigue_temptation_special.1004.great.desc:0 "พวกเขาใช้เวลาส่วนใหญ่ของอาหารค่ำพูดคุยกัน และลอบมองกันอย่างสงสัยใคร่รู้เมื่อไม่ได้คุยกัน"
 intrigue_temptation_special.1004.good.desc:0 "ข้าไม่เห็นสัญญาณที่ชัดเจน แต่พวกเขาก็เข้ากันได้ดีมาก"
 intrigue_temptation_special.1004.bad.desc:0 "น่าเศร้าที่เคมีที่ข้าคาดหวังไว้ไม่มีให้เห็นเลย ข้าหวังว่ามันเป็นเพียงความประหม่า"
 intrigue_temptation_special.1004.end.desc:0 "\n\nข้าต้องตีเหล็กเมื่อยังร้อน ให้โอกาส [wants_love.GetFirstNameNoTooltip] และ [chosen_match.GetFirstNameNoTooltip] ได้พบกันอีกครั้ง คราวนี้ ข้าจะจัดเตรียมสิ่งที่น่าตื่นเต้นกว่า โอกาสให้พวกเขาได้แบ่งปันความสนใจร่วมกัน! "
 intrigue_temptation_special.1004.a:0 "การเต้นรำอันรื่นเริง"
 intrigue_temptation_special.1004.b:0 "การล่าสัตว์อันน่าตื่นเต้น"
 intrigue_temptation_special.1004.c:0 "การเดินทางไปตรวจสอบโครงสร้างพื้นฐานในท้องถิ่น"
 intrigue_temptation_special.1004.d:0 "งานเลี้ยงอาหารค่ำส่วนตัวเพื่อแบ่งปัน "ข่าวซุบซิบ""
 intrigue_temptation_special.1004.e:0 "ค่ำคืนแห่งบทกวี"
 intrigue_temptation_special.1004.tt:0 "ข้าควรเลือกกิจกรรมที่ทั้ง [wants_love.GetFirstName] และ [chosen_match.GetFirstName] จะพบว่าคุ้นเคยและเพลิดเพลินตามทักษะของพวกเขา"

 intrigue_temptation_special.1005.t:0 "การทดสอบความรู้สึก"
 intrigue_temptation_special.1005.great_diplomacy.desc:1 "ปกติข้าไม่ใช่คนชอบโอ้อวด แต่ข้าต้องขอบอกว่า — อีกหลายปีทีเดียวกว่าการเต้นรำครั้งนี้จะถูกลืม! อันที่จริง ข้าสงสัยว่าคืนที่ผ่านมาจะกลายเป็นความทรงจำอันล้ำค่าของ[wants_love.GetFirstNamePossessive] เช่นเดียวกับ [chosen_match.GetFirstNamePossessive] พวกเขาเต้นรำด้วยกันเกือบทุกเพลงและไม่อาจละสายตาจากกันได้!"
 intrigue_temptation_special.1005.great_martial.desc:0 "ปกติข้าไม่พูด เช่นนี้ แต่บางครั้ง ข้าก็เป็นอัจฉริยะทีเดียว! ทั้ง [wants_love.GetFirstName] และ [chosen_match.GetFirstName] สนุกสนานกันอย่างมากในการล่าสัตว์ พวกเขาทำงานร่วมกันราวกับรู้จักกันมาทั้งชีวิตและเป็นคู่ที่ประสบความสำเร็จที่สุดอย่างเห็นได้ชัด"
 intrigue_temptation_special.1005.great_stewardship.desc:0 "[wants_love.GetFirstName] และ [chosen_match.GetFirstName] ขี่ม้าเคียงข้างกันเป็นภาพที่น่าชื่นชม! พวกเขาพูดคุยกันหลายชั่วโมงเกี่ยวกับสะพาน โรงสี และระบบชลประทานก่อนที่จะตามหลังกลุ่มที่เหลือ ใครจะรู้ว่าบทสนทนาของพวกเขาเดินทางเข้าไปสู่ดินแดนใด แต่[wants_love.GetFirstName] ดูเหมือนต้องมนต์สะกด"
 intrigue_temptation_special.1005.great_intrigue.desc:0 "[wants_love.GetFirstName] และ [chosen_match.GetFirstName] เข้ากันได้ดีกับเฒ่าเจ้าเล่ห์! ไม่นานนัก พวกเขาก็ครอบงำบทสนทนา แลกเปลี่ยนความคิดเห็นกันด้วยความเร็วอันน่าประทับใจ นานๆ ครั้งข้าจะได้เห็นสองจิตใจที่ประสานกันอย่างยิ่ง!"
 intrigue_temptation_special.1005.great_learning.desc:0 "นานๆ ครั้งข้าจะได้เห็น[wants_love.GetWomanMan]ต้องมนต์เหมือน [wants_love.GetFirstName] เมื่อ[wants_love.GetSheHe]ฟัง [chosen_match.GetFirstName] ท่องบทกวีของ[wants_love.GetHerHis]! [wants_love.GetSheHe|U] แทบจะน้ำตาไหลในบทสุดท้าย\n\nหลังจากการแสดง พวกเขาพูดคุยกันหลายชั่วโมง – นานหลังจากแขกคนอื่นๆ กลับไปหมดแล้ว"
 intrigue_temptation_special.1005.good_diplomacy.desc:0 "การเต้นรำดูเหมือนจะ ทำให้[wants_love.GetFirstName] และ [chosen_match.GetFirstName] มีกำลังใจขึ้น ด้วยการกระตุ้นอย่างสุขุมของข้า พวกเขาใช้เวลาส่วนใหญ่อยู่ด้วยกัน และจากสีหน้าของพวกเขา ข้ามั่นใจว่าพวกเขาเพลิดเพลินกับมัน"
 intrigue_temptation_special.1005.good_martial.desc:0 "ดังที่ข้าสงสัย ทั้ง [wants_love.GetFirstName] และ [chosen_match.GetFirstName] เป็นนักล่าที่คุ้นเคย สบายทั้งบนหลังม้าและบนพื้นดิน พวกเขาดูเหมือนจะสนุกสนาน และข้าได้ยินโดยบังเอิญว่า [chosen_match.GetFirstNameNoTooltip] ชมเชย [wants_love.GetFirstNameNoTooltip] อย่างดีเกี่ยวกับฝีมือการยิงธนูของ[wants_love.GetHerHis]"
 intrigue_temptation_special.1005.good_stewardship.desc:0 "แม้ว่าการเดินทางไปตรวจสอบโครงสร้างพื้นฐานอาจไม่ใช่บรรยากาศที่โรแมนติกที่สุด แต่ข้ามั่นใจว่าทั้ง [wants_love.GetFirstName] และ [chosen_match.GetFirstName] พบว่ามันน่าสนใจ พวกเขาพูดคุยกันยืดยาวเกี่ยวกับโรงสีและระบบชลประทาน และดูเหมือนพอใจอย่างยิ่งกับการอยู่ร่วมกัน"
 intrigue_temptation_special.1005.good_intrigue.desc:0 "[wants_love.GetFirstName] และ [chosen_match.GetFirstName] เป็นแขกผู้เป็นที่ต้อนรับในการรวมตัวส่วนตัวของเรา มอบข่าวซุบซิบที่น่าดึงดูดให้เรา พวกเขาเปิดเผยความลับน่าอายเดียวกันเกี่ยวกับขุนนางบางคนและพูดคุยถึงรายละเอียดสกปรกด้วยความยินดีอย่างไม่สะทกสะท้าน"
 intrigue_temptation_special.1005.good_learning.desc:0 "[wants_love.GetFirstName] และ [chosen_match.GetFirstName] นั่งอย่างต้องมนต์ขณะที่แขกผู้มีเกียรติของข้าท่องบทกวีของนาง มันคงจะสะท้อนความรู้สึกส่วนลึกของพวกเขา เพราะพวกเขาพูดคุยกันเกี่ยวกับเรื่องนั้นเกือบหนึ่งชั่วโมงหลังจากนั้น"
 intrigue_temptation_special.1005.bad_diplomacy.desc:0 "น่าเสียดายที่ การเต้นรำกลับกลายเป็นความคิดที่แย่มาก"
 intrigue_temptation_special.1005.bad_martial.desc:0 "ข้าเกรงว่าข้าเข้าใจผิดเมื่อคิดว่าการล่าสัตว์จะเป็นกิจกรรมที่เหมาะสม"
 intrigue_temptation_special.1005.bad_stewardship.desc:0 "เมื่อมองย้อนกลับไป การเดินทางไปตรวจสอบโครงสร้างพื้นฐานในท้องถิ่นเป็นความคิดที่ไม่ดี"
 intrigue_temptation_special.1005.bad_intrigue.desc:0 "ข้าคิดว่าอาหารค่ำส่วนตัวเล็กๆ พร้อมบทสนทนาที่น่าสนใจจะ ทำให้ [wants_love.GetFirstName] และ [chosen_match.GetFirstName] ใกล้ชิดกันมากขึ้น แต่เรื่องทั้งหมดกลับกลายเป็นน่าอึดอัดอย่างยิ่ง"
 intrigue_temptation_special.1005.bad_learning.desc:0 "ปรากฏว่า บทกวีไม่ใช่สำหรับทุกคน"
 intrigue_temptation_special.1005.wants_love_struggled.desc:0 "มันเจ็บปวดที่ต้องมองดู [wants_love.GetFirstName] ลำบาก [wants_love.GetSheHe|U] เก็บตัวอยู่กับ[wants_love.GetHerselfHimself]ตลอดเรื่องน่าเศร้านี้ ไม่แม้ แต่จะเหลือบมองไปทาง[chosen_match.GetFirstNamePossessive]"
 intrigue_temptation_special.1005.chosen_match_struggled.desc:0 "มันเจ็บปวดที่ต้องมองดู [chosen_match.GetFirstName] ลำบาก [chosen_match.GetSheHe|U] เก็บตัวอยู่กับ[chosen_match.GetHerselfHimself]ตลอดเรื่องน่าเศร้านี้ ไม่แม้ แต่จะเหลือบมองไปทาง[wants_love.GetFirstNamePossessive]"
 intrigue_temptation_special.1005.great_status.desc:0 "\n\nข้าหวังว่ากิจการเล็กๆ ของข้าจะ ทำให้อารมณ์ของ[wants_love.GetFirstNamePossessiveNoTooltip]ดีขึ้น แต่ไม่คาดคิดว่าจะเห็นผลเร็วขนาดนี้! หากข้าไม่ใช่ผู้ประเมินนิสัยที่แย่มาก มีบางอย่างเกิดขึ้นระหว่างสองคนนั้นอย่างแน่นอน"
 intrigue_temptation_special.1005.good_status_despite_bad_activity.desc:0 "\n\nโชคดีที่ดูเหมือนว่าเหตุการณ์น่าอึดอัดนั้นไม่ได้ทำลายความรู้สึกที่กำลังก่อตัวระหว่างพวกเขา แม้จะยังเร็วเกินไปที่จะบอก ข้าคิดว่าข้าอาจจะประสบความสำเร็จแล้ว"
 intrigue_temptation_special.1005.good_status.desc:0 "\n\nข้าเฝ้าดูพวกเขาสองคนมาสองสามวันแล้ว และข้าค่อนข้างแน่ใจ มีบางอย่างที่นั่น ซึ่งไม่เคยมีมาก่อน"
 intrigue_temptation_special.1005.bad_status.desc:0 "\n\nถึงเวลาเผชิญหน้ากับความพ่ายแพ้ของข้า – [wants_love.GetFirstNameNoTooltip] และ [chosen_match.GetFirstNameNoTooltip] จะไม่มีวันเป็นไปได้"
 intrigue_temptation_special.1005.a:0 "เป็นการจับคู่ที่ยอดเยี่ยมจริงๆ!"
 intrigue_temptation_special.1005.b:0 "ข้าเป็นผู้ประเมินนิสัยที่ดีอย่างแน่นอน"
 intrigue_temptation_special.1005.c:0 "ความรักคือปริศนาที่ยิ่งใหญ่ที่สุด"

 intrigue_temptation_special.1006.t:0 "ความผิดพลาดอันโอหัง"
 intrigue_temptation_special.1006.desc:0 "เพื่อประเมินคุณภาพของคู่ที่ข้าเลือก ข้าได้จัดงานเลี้ยงอาหารค่ำเล็กๆ โดยมีทั้ง [wants_love.GetTitledFirstName] และ [chosen_match.GetTitledFirstName] อยู่ในรายชื่อแขก\n\nข้าพยายามกระตุ้นให้พวกเขาเริ่มบทสนทนา แต่ [not_interested.GetFirstNameNoTooltip] ทำตัวเย็นชาและไม่แยแสต่อคู่ที่ตั้งใจไว้ แต่ [not_interested.GetSheHe] กลับเหลือบมอง[interesting_ladylord.GetLadyLord]รูปงามที่อยู่ไกลออกไปตามโต๊ะ บางที...?"
 intrigue_temptation_special.1006.a:0 "ข้าจะศึกษาผู้คนอย่างระมัดระวังมากขึ้นในอนาคต"

 intrigue_temptation_special.1007.t:0 "ภาพอันน่าพึงพอใจ"
 intrigue_temptation_special.1007.desc:0 "เป็นเวลาหลายเดือน ข้าจับตาดู [wants_love.GetTitledFirstName] และ [chosen_match.GetTitledFirstName] ค้นหาสัญญาณแห่งความสำเร็จของข้า คืนนี้ ความอยากรู้อยากเห็นของข้าได้รับการตอบสนอง\n\nบนม้านั่งที่ซ่อนอยู่ในมุมที่เขียวชอุ่มและมืดมิดที่สุดในสวนของข้า ข้าเห็นคู่รักทั้งสอง ด้วยรอยยิ้มพึงพอใจบนริมฝีปาก ข้าถอยกลับไปตามทางที่รก พวกเขาจมอยู่กับการจูบจนไม่สังเกตเห็นข้า"
 intrigue_temptation_special.1007.a:0 "ข้าขอให้พวกเขาทั้งสองโชคดี"
 
 #Guest, by Alexander Oltner
 intrigue_temptation.3000.t:0 "การอำลาอันแสนหวาน"
 intrigue_temptation.3000.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] มัน... มันเคย... ข้าหมายถึง มันเป็นความยินดีที่ได้เป็นแขกของท่านที่นี่ใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..." [guest_lover.GetFirstName] พูดตะกุกตะกัก ขณะที่ [guest_lover.GetSheHe] เตรียมตัวจากไป\n\n"ข้าได้พบ #emphasis ท่าน#! นั่นเพียงอย่างเดียวก็ ทำให้การมาพักของข้าคุ้มค่าแล้ว แต่ถึงกระนั้น ข้าขอร้องท่าน... ท่านจะใช้ค่ำคืนอันเร่าร้อนกับข้า ก่อนที่ข้าจะจากไปหรือไม่"\n\n[guest_lover.GetFirstName] ตกหลุมพรางการชักใยอันแนบเนียนของข้าแล้ว! ทีนี้ ข้าควรจะฉวยโอกาสนี้อย่างไรดี?"
 intrigue_temptation.3000.a:0 "ใช่ ที่รักของข้า ข้ายอมทำ #emphasis ทุกอย่าง#! เพื่อเจ้า!"
 intrigue_temptation.3000.b:1 "แล้ว ที่รัก ข่าวลือนั่นเกี่ยวกับข้าหลวงของข้าล่ะ?"
 intrigue_temptation.3000.c:1 "ที่รักของข้า เจ้าจะพูดคุยกับ [guest_lovers_friend.GetFirstNameNoTooltip] ได้หรือไม่?"
 intrigue_temptation.3000.d:0 "อา ข้าทำไม่ได้... ตอนนี้เจ้าไปได้แล้ว!"
 intrigue_temptation.3000.c.tt:0 "ข้าใช้ [guest_lover.GetFirstName] เพื่อเข้าใกล้เพื่อนของ[guest_lover.GetHerHis], [guest_lovers_friend.GetFullName]"
 intrigue_temptation.3000.b.tt:0 "ข้าพยายาม ทำให้ [guest_lover.GetHerHim] เปิดเผยความลับของข้าหลวงของข้า"
 intrigue_temptation.3000.b.success:0 "[guest_lover.GetFirstName] เปิดเผยความลับให้ข้า!"
 intrigue_temptation.3000.b.failure:0 "[guest_lover.GetFirstName] ไม่ได้เปิดเผยสิ่งใดระหว่างการร่วมรักของเรา..."
 yearly.3000.b.success.desc:0 "ข้าเกลี้ยกล่อม [guest_lover.GetHerHim] ได้สำเร็จ"
 yearly.3000.b.success.tt:0 "ข้าได้เรียนรู้[secret|E]ของข้าหลวง"
 yearly.3000.b.failure.desc:0 "ข้าเกลี้ยกล่อม [guest_lover.GetHerHim] ไม่สำเร็จ"

 #Wing(wo)man, by Mathilda Bjarnehed
 intrigue_temptation.3010.t:0 "ดอกไม้บานในป่าเปลี่ยว"
 intrigue_temptation.3010.start.desc:0 "เป็นคืนที่สามติดต่อกันแล้ว ที่ข้านั่งอยู่ที่โต๊ะเดิม ในโรงเตี๊ยมเดิม มันมีมุมมองที่ยอดเยี่ยมไปยังบาร์ — และ[bar_servant.Custom('bar_servant')]ผู้น่าหลงใหลที่อยู่หลังบาร์นั้น\n\nฝันกลางวันของข้าถูกขัดจังหวะเมื่อ [wingman.Custom2('MyCharacterIntroduction', ROOT.Char)] กระแทกเหยือกของ[wingman.GetHerHis]ลงบนโต๊ะ "ข้าเห็นเจ้าจ้องมอง [bar_servant.GetFirstName] ตลอดทั้งคืน" [wingman.GetSheHe] กระซิบด้วยรอยยิ้มเจ้าเล่ห์ "ข้าไม่โทษเจ้าหรอก [bar_servant.GetSheHe] เป็น"
 intrigue_temptation.3010.end.desc:1 "[bar_servant.GetWomanMan] ผู้[bar_servant.Custom('RomanticComplimentAdjective')] เจ้าอยากให้ข้าแนะนำให้รู้จักหรือไม่?""
 intrigue_temptation.3010.a:0 "เจ้ารู้จัก[bar_servant.GetHerHim]รึ? นั่นจะยอดเยี่ยมมาก!"
 intrigue_temptation.3010.b:0 "ข้าอยากทำสิ่งนี้ด้วยตนเอง"
 intrigue_temptation.3010.c:0 "ข้ามาที่นี่เพื่อดื่มเท่านั้น..."
 intrigue_temptation.3010.success.tt:0 "ข้าจะสามารถตัดสินใจว่าจะดำเนินการอย่างไรต่อไป"
 intrigue_temptation.3010.a.success:0 "ด้วยความช่วยเหลือเล็กน้อย ข้า ทำให้ [bar_servant.GetFirstNameNoTooltip] อยู่ในกำมือข้า"
 intrigue_temptation.3010.a.failure:0 "[bar_servant.GetFirstNameNoTooltip] ไม่ตอบสนองต่อการเข้าหาของข้า"
 intrigue_temptation.3010.b.success:0 "ข้า ทำให้ [bar_servant.GetFirstNameNoTooltip] อยู่ในกำมือข้า"

 intrigue_temptation.3011.help.desc:0 "ข้าเห็น [bar_servant.GetFirstName] ปฏิเสธการเข้าหามากกว่าที่ข้านับได้ แต่ด้วยการแนะนำและท่าทีผ่อนคลายของ[wingman.GetTitledFirstNamePossessive] [bar_servant.GetSheHe] ก็เปิดใจในไม่ช้า\n\nบทสนทนาไหลลื่น — ข้าไม่คาดคิดว่าจะมีอะไรเหมือนกันมากมายกับ[bar_servant.Custom('bar_servant')]! ข้าเพิ่งรู้ตัวว่า [wingman.GetFirstNameNoTooltip] จากไปแล้วเมื่อ [bar_servant.GetFirstNameNoTooltip] วางมือของ[bar_servant.GetHerHis]บนแขนข้าและถามว่าข้าต้องการห้องพักสำหรับคืนนี้หรือไม่ ห้องสำหรับสองคน ตัดสินจากแววตาของ[bar_servant.GetHerHis]"
 intrigue_temptation.3011.alone.desc:0 "ข้าเห็น [bar_servant.GetFirstName] ปฏิเสธการเข้าหามากกว่าที่ข้านับได้ [ROOT.Char.GetWomanMan] ที่ด้อยกว่าคงจะหวาดกลัว แต่ข้าฉวยโอกาสศึกษาความผิดพลาดของพวกเขาอย่างยินดี ข้าพร้อมแล้ว\n\nบทสนทนาของเราไหลลื่น — ข้าไม่คาดคิดว่าจะมีอะไรเหมือนกันมากมายกับ[bar_servant.Custom('bar_servant')]! ขณะที่ข้าลุกขึ้นจะจากไป [bar_servant.GetFirstNameNoTooltip] วางมือของ[bar_servant.GetHerHis]บนแขนข้าและถามว่าข้าต้องการห้องพักสำหรับคืนนี้หรือไม่ ห้องสำหรับสองคน ตัดสินจากแววตาของ[bar_servant.GetHerHis]"
 intrigue_temptation.3011.a:0 "แค่คืนเดียวรึ? แล้ว #EMP ทุก#! คืนล่ะ?"
 intrigue_temptation.3011.b:0 "นำทางข้าไปเถิด [bar_servant.Custom('LoverPetName')]"
 intrigue_temptation.3011.c:0 "ข้ารู้สึกเป็นเกียรติ แต่ข้าเพียงต้องการพูดคุย"

 # Medieval tinder, by Mathilda Bjarnehed
 intrigue_temptation.3020.t:0 "เปลวไฟรักครั้งใหม่"
 intrigue_temptation.3020.start.desc:0 "ในช่วงหลายปีที่ผ่านมา ข้าได้รับภาพวาดบุคคลจำนวนมากจากหลากหลาย"
 intrigue_temptation.3020.nobles.desc:0 "ขุนนาง,"
 intrigue_temptation.3020.noblemen.desc:0 "ขุนนางชาย,"
 intrigue_temptation.3020.noblewomen.desc:0 "ขุนนางหญิง,"
 intrigue_temptation.3020.end.desc:0 "ทั้งต่างชาติและท้องถิ่น จนถึงตอนนี้ พวกมันส่วนใหญ่เก็บฝุ่นอยู่ในห้องใต้หลังคาบางแห่ง\n\nบางทีข้าควรจะนำพวกมันออกมาและเลือกเป้าหมายรักครั้งต่อไปของข้า?"
 intrigue_temptation.3020.a:0 "ข้าจินตนาการถึงตัวเองกับคนใหม่ได้..."
 intrigue_temptation.3020.b:0 "พวกเขาเสแสร้งเกินไปสำหรับรสนิยมของข้า"
 intrigue_temptation.3020.a.tt:0 "ข้านำภาพวาดออกมา"

 intrigue_temptation.3021.beauty.desc:0 "หลายคนบอกข้าว่า [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] เป็นอาหารตา! ข้าสงสัยว่าภาพวาดของ[potential_date.GetHerHis]แสดงความงามของ[potential_date.GetHerHim]ได้สมจริงหรือไม่?"
 intrigue_temptation.3021.generic1.desc:0 "แล้ว [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ล่ะ? [potential_date.GetSheHe|U] เป็นที่รู้จักอย่างกว้างขวางในฐานะ[potential_date.GetWomanMan]ผู้[potential_date.Custom('ComplimentAdjective')] อย่างไรก็ตาม ข้าก็ได้ยินมาว่า [potential_date.GetSheHe] อาจจะค่อนข้าง[potential_date.Custom('InsultAdjective')]..."
 intrigue_temptation.3021.generic2.desc:0 "อา [potential_date.GetFullName] ผู้[potential_date.Custom('ComplimentAdjective')]! ข้าสงสัยว่าเราจะเป็นคู่ที่เหมาะสมกันหรือไม่?"
 intrigue_temptation.3021.ugly.desc:0 "นี่ต้องเป็น [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ภาพวาดของ[potential_date.GetHerHis|U]ทำได้ดีอย่างแน่นอน แต่ข้าได้ยินมาว่ามันอาจจะไม่ใช่ความคล้ายคลึงที่แท้จริง..."
 intrigue_temptation.3021.generic3.desc:0 "ภาพวาดนี้ไม่ใช่ใครอื่นนอกจาก [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] กล่าวกันว่า[potential_date.GetSheHe|U]เป็นคน[potential_date.Custom('ComplimentAdjective')] แต่ข้าก็ได้ยินข่าวลือเกี่ยวกับธรรมชาติอัน[potential_date.Custom('InsultAdjective')]ของ[potential_date.GetHerHis]..."
 intrigue_temptation.3021.generic4.desc:0 "อา [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] [potential_date.GetSheHe] อาจจะเป็นคนนั้นหรือไม่?"
 intrigue_temptation.3021.arrogant.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ส่งห่อของมาให้ข้าพร้อมภาพวาด #EMP [ROOT.Char.Custom('ThreeToTwelve')]#! ภาพ พวกมันดูเหมือนกันหมดเลย...?"
 intrigue_temptation.3021.impatient.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ส่งภาพวาดมาให้ข้าหลายภาพในช่วงหลายปีที่ผ่านมา ภาพล่าสุดมาพร้อมกับบันทึกที่ค่อนข้างใจร้อนแนบมาด้วย"
 intrigue_temptation.3021.tall.desc:0 "นี่คือภาพวาดของ [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ผู้ส่งสารที่นำมาส่งเน้นย้ำที่จะอธิบายว่า [potential_date.GetTitledFirstNameNoTooltip] สูงเท่าใด หลายครั้ง"
 intrigue_temptation.3021.adventurous.desc:0 "ภาพวาดของ [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] มีจดหมายแนบอยู่ด้านหลัง ในนั้น [potential_date.GetSheHe] อธิบาย[potential_date.GetHerselfHimself]ว่าเป็น "จิตวิญญาณอิสระที่โหยหาการผจญภัย""
 intrigue_temptation.3021.fish.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ส่งภาพวาดของ[potential_date.GetHerselfHimself]ริมทะเลสาบ ถือปลาตัวใหญ่มาให้ข้า"
 intrigue_temptation.3021.dog.desc:0 "ในภาพวาดของ[potential_date.GetHerHis] [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] โพสท่ากับสุนัขน้อยน่ารัก"
 intrigue_temptation.3021.do_not_believe.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] แนบบันทึกที่ค่อนข้างประชดประชันมากับภาพวาดของ[potential_date.GetHerHis] "ข้าไม่ค่อยเชื่อในการพบเจอคู่ครองในอนาคตด้วยวิธีนี้ แต่ลองดูก็ไม่เสียหาย""
 intrigue_temptation.3021.lewd.desc:0 "[ROOT.Char.GetFaith.FertilityGodName|U] ข้าลืมไปว่ามีสิ่งนี้อยู่! ภาพวาดที่ [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] ส่งมาให้ข้าแทบไม่ต้องจินตนาการเลย ไม่มีอะไรเลย พูดตามตรง"
 intrigue_temptation.3021.must_be_tall.desc:0 "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] แนบจดหมายยาวและเป็นมิตรมากับภาพวาดของ[potential_date.GetHerHis] ในตอนท้ายสุด [potential_date.GetSheHe] เร่งเร้าให้ข้าเขียนตอบกลับเร็วๆ "แต่เฉพาะในกรณีที่ท่านสูงเกินหกฟุตเท่านั้น""
