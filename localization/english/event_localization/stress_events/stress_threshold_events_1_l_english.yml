l_english: 
 stress_threshold.1701.t:0 "สติแตก: ผลกรรมตามสนอง"
 stress_threshold.1701.desc.intro:0 "ขณะที่ข้าเดินข้าม [ROOT.Char.Custom('GetCourt')] ของข้าด้วยความขุ่นเคือง เหล่า [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าหลายคนดูเหมือนจะพร่ำบ่นไม่หยุดหย่อนเกี่ยวกับปัญหาบางอย่างที่พวกเขากำลังประสบใน [capital_province.GetNameNoTooltip]\n\n"
 stress_threshold.1701.desc.lazy:0 "ข้าแค่ไม่มีเรี่ยวแรงจะใส่ใจ และข้าอยากกลับไปนอนบนแท่นบรรทมใจจะขาด!"
 stress_threshold.1701.desc.wrathful:0 "ในวัน เช่นนี้ เมื่อคำพูดของพวกเขากลายเป็นเสียงหึ่งๆ น่ารำคาญในหูของข้า ข้ารู้สึกอยากจะแขวนคอพวกมันให้หมดสิ้น"
 stress_threshold.1701.desc.impatient:0 "ข้าหวังว่าพวกเขาจะรีบๆ แก้ไขเรื่องต่างๆ ด้วยตนเองเสียที โดยไม่ต้องให้ข้ามาจัดการทุกเรื่องหยุมหยิมด้วยตัวเอง"
 stress_threshold.1701.desc.arrogant:0 "บอกตามตรง บางครั้งข้ารู้สึกราวกับว่า [ROOT.Char.Custom('GetRealmOrDomicile')|l] ทั้งหมดจะล่มสลายหากข้าไม่ได้บริหารทุกอย่างด้วยตนเอง"
 stress_threshold.1701.desc.arbitrary:0 "บางทีมันอาจไม่ใช่ปัญหาจริงๆ ก็ได้ อาจเป็นแค่ปัญหาเล็กๆ น้อยๆ ในท้องถิ่นที่ไม่มีผลกระทบอะไรมากนักกระมัง"
 stress_threshold.1701.desc.trusting:0 "ด้วยสถานการณ์ที่เป็นอยู่ช่วงนี้ ข้าพบว่าเป็นการยากที่จะจดจ่อ แต่ข้ามั่นใจว่าคงไม่มีใครพูดจารุนแรง เช่นนี้หากเรื่องนั้นไม่เป็นความจริง"
 stress_threshold.1701.desc.stubborn:0 "ตามจริงแล้ว เรื่องนี้ฟังดูไม่ได้มีปัญหาอะไรเป็นพิเศษ หากพวกเขาพยายามให้หนักกว่านี้ พวกเขาคงไม่สังเกตเห็นความล้มเหลวด้วยซ้ำ"
 stress_threshold.1701.desc.fallback:0 "บางครั้งการเป็นข้ามันก็เหนื่อยใจเหลือเกิน"
 stress_threshold.1701.desc.rump:0 "\n\nมีบางอย่างในการสนทนานั้นฟังดู... คุ้นเคย แ-แผนนั้นไม่ใช่ความคิด #EMP ของข้า#! หรอกหรือ? นี่เป็นความผิด #EMP ของข้า#! หรือ?"
 stress_threshold.1701.a.rakish.gain:0 "ช่างหัวมันปะไร! ข้าจะไปหอนางโลม"
 stress_threshold.1701.a.rakish.effect:0 "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1701.b.irritable.gain:0 "ข้าขอสาบานต่อ [ROOT.GetCharacter.GetFaith.HighGodName] ข้าจะต่อยใครสักคน"
 stress_threshold.1701.b.irritable.effect:0 "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1701.c.flagellant.gain:0 "ข้าจะโบยตีตนเองเพื่อไถ่บาป!"
 stress_threshold.1701.c.flagellant.effect:0 "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1701.d.profligate.gain:0 "บางทีเสื้อคลุมตัวใหม่อาจ ทำให้ข้ารู้สึกดีขึ้น..."
 stress_threshold.1701.d.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1701.g.journaller.gain:0 "ข้าต้องขจัดความคิดเหล่านี้ออกไปด้วยปลายปากกา"
 stress_threshold.1701.g.journaller.effect:0 "$stress_threshold.1701.g.journaller.gain$"
 stress_threshold.1701.h.confider.gain:0 "บางที [friend.GetFirstNameNoTooltip] อาจจะสนับสนุนข้า?"
 stress_threshold.1701.h.confider.effect:0 "[friend.GetFirstNameNoTooltip] จะต้องสนับสนุนข้าอย่างแน่นอน!"
 stress_threshold.1701.i.drunkard.gain:0 "สุราเข้มๆ แก้ปัญหาได้เกือบทุกอย่าง..."
 stress_threshold.1701.i.drunkard.effect:0 "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1701.j.hashishiyah.gain:0 "ฮาชิชจะช่วยปลอบประโลมประสาทที่ว้าวุ่นของข้า..."
 stress_threshold.1701.j.hashishiyah.effect:0 "$stress_threshold.1701.j.hashishiyah.gain$"
 #NOTE: Discuss w/ Sean?
 stress_threshold.1701.k:0 "มันเป็นแค่การพูดพล่อยๆ ไร้สาระ ไม่เกี่ยวกับข้าเลย"

 stress_threshold.1711.t:0 "สติแตก: ยุ่งเกินไป"
 stress_threshold.1711.desc.intro:0 "ขอสาบานต่อ [ROOT.GetCharacter.GetFaith.FateGodName] เหล่า [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าช่างไม่หยุดหย่อนในการร้องขอช่วงนี้ งานนี้รู้สึก #EMP ไม่มีที่สิ้นสุด#!. อีกคนหนึ่งกำลังเข้ามา เห็นได้ชัดว่ากำลังทุกข์ใจกับเรื่องเล็กน้อยบางอย่าง\n\n"
 stress_threshold.1711.desc.greedy:0 ""เจ้ามีภาษีมาให้ข้าหรือไม่? ไม่? ถ้า เช่นนั้นข้าก็ไม่สนใจเท่าใดนัก""
 stress_threshold.1711.desc.diligent:0 ""ข้าจะจัดการปัญหาของเจ้าในอีกไม่กี่สัปดาห์ แต่เจ้าไม่สำคัญพอที่จะได้รับอะไรเร็วกว่านี้""
 stress_threshold.1711.desc.patient:0 "$stress_threshold.1711.desc.diligent$"
 stress_threshold.1711.desc.deceitful:0 ""เจ้าดูไม่เหมือนหนึ่งในไพร่ฟ้าของข้า ไปรบกวนคนอื่นเถิด""
 stress_threshold.1711.desc.ambitious:0 ""เจ้าคิดว่าจะหลอกล่อเอาตราประทับหลวงจากข้าได้รึ ชาวเมือง? ข้าคือ [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]!""
 stress_threshold.1711.desc.just:0 ""หากเจ้ามาเพื่อความยุติธรรม จงรู้ไว้ว่าข้าไม่กลับคำตัดสินของตุลาการเพียงเพื่อเศษเงินเล็กน้อย""
 stress_threshold.1711.desc.zealous:0 ""ข้าแทบจะได้กลิ่นบาปโชยมาจากตัวเจ้า ชาวเมือง!""
 stress_threshold.1711.desc.fallback:0 ""ขอความเมตตาจาก [ROOT.GetCharacter.GetFaith.HealthGodNamePossessive] ไม่ใช่อีกคนนะ!""
 stress_threshold.1711.desc.rump:0 "\n\n[courtier.GetFirstName] อ้าปากค้างมองข้า กะพริบตาถี่ๆ ด้วยความตกใจ เป็น เพราะสิ่งที่ข้าพูดหรือ?"
 stress_threshold.1711.a.reclusive.gain:0 "คนสุดท้าย แล้วข้าต้องการอยู่คนเดียว"
 stress_threshold.1711.a.reclusive.effect:0 "$stress_threshold.1711.a.reclusive.gain$"
 stress_threshold.1711.b.flagellant.gain:0 "การโบยตีตนเองจะขับไล่บาป..."
 stress_threshold.1711.b.flagellant.effect:0 "$stress_threshold.1711.b.flagellant.gain$"
 stress_threshold.1711.c.profligate.gain:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.c.profligate.effect:0 "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.d.improvident.gain:0 "เชิญหยิบฉวยจากท้องพระคลังได้ตามสบาย ชาวเมือง เจ้าต้องการมัน"
 stress_threshold.1711.d.improvident.effect:0 "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.1711.e.journaller.gain:0 "ข้าจะแสวงหาการปลอบประโลมในสมุดบันทึกของข้า"
 stress_threshold.1711.e.journaller.effect:0 "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1711.f.athletic.gain:0 "ข้าจะไปขี่ม้า เดี๋ยวนี้"
 stress_threshold.1711.f.athletic.effect:0 "$stress_threshold.1711.f.athletic.gain$"
 stress_threshold.1711.g.drunkard.gain:0 "ดื่ม! นี่มันมากเกินไปสำหรับจิตใจที่ปกติ"
 stress_threshold.1711.g.drunkard.effect:0 "$stress_threshold.1711.g.drunkard.gain$"
 stress_threshold.1711.h.hashishiyah.gain:0 "ฮาชิช! นี่มันมากเกินไปสำหรับจิตใจที่ปกติ"
 stress_threshold.1711.h.hashishiyah.effect:0 "$stress_threshold.1711.h.hashishiyah.gain$"
 stress_threshold.1711.i:0 "ข้าคือ [ROOT.GetCharacter.GetTitleAsNameNoTooltip] ข้าทำได้!"

 stress_threshold.1721.t:0 "สติแตก: ตัวปลอม!"
 stress_threshold.1721.desc.intro:1 "ช่วงนี้ ข้ารู้สึกว่าข้าไม่คู่ควรที่จะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ผู้อื่นสงสัยในตนเองเหมือนที่ข้าสงสัยในตัวเองหรือไม่?\n\nข้าพยายามที่จะดี "
 stress_threshold.1721.desc.chaste:0 "บริสุทธิ์ แต่รู้สึกเหมือนข้าถูกล่อลวงด้วยกามสุขอยู่เสมอ คน เช่นข้าควรจะสามารถต่อสู้กับกามารมณ์เหล่านี้ได้"
 stress_threshold.1721.desc.temperate:0 "รู้จักประมาณตน แต่ปากของข้าดูเหมือนจะน้ำลายสออยู่ตลอดเวลา ทุกสิ่ง ทำให้ข้าหิว ทำไมข้าถึงหิวโหยอย่างน่าสาปแช่ง ผิดมนุษย์ เช่นนี้?"
 stress_threshold.1721.desc.generous:0 "มีเมตตา แต่ไม่ว่าข้าจะให้ไปมากเท่าใด ก็มักจะมีคนอื่นยื่นชามขอทานมาเสมอ ผู้อื่นดูเหมือนจะไม่มีปัญหาเหล่านี้"
 stress_threshold.1721.desc.calm:0 "สงบ แต่ #EMP ทุกคน#! ในหมู่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าดูเหมือนจะตั้งใจกวนประสาทข้า วิกฤตเล็กๆ ครอบงำวันเวลาของข้า และข้ารู้สึกว่าตัวเองกำลังสติแตกอย่างที่ไม่มีใครเป็น"
 stress_threshold.1721.desc.humble:0 "ถ่อมตน แต่รู้สึกเหมือนทุกการกระทำของข้าอบอวลไปด้วยความหยิ่งผยอง ผู้อื่นดูเหมือนจะใช้ชีวิตอย่างสมถะ แต่ข้ากลับดูเหมือนจะโอ้อวดความยิ่งใหญ่ของข้าในทุกโอกาส และข้าทนไม่ได้"
 stress_threshold.1721.desc.honest:0 "ซื่อสัตย์ แต่ในทุกการตัดสินใจ ข้าเห็นการโกหกโดยละเว้นความจริงและข้อผิดพลาดเล็กๆ น้อยๆ บิดเบือนความหมายของข้า ผู้อื่นดูเหมือนจะขยันหมั่นเพียรและเปิดเผย เหตุใดข้าจึงต้องถูกสาปด้วยนิสัยหลอกลวง เช่นนี้?"
 stress_threshold.1721.desc.craven:0 "สูงส่ง แต่ข้าขี้ขลาดเกินกว่าจะทำตัวกล้าหาญเหมือนผู้อื่น และดูเหมือนว่า [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าจะสังเกตเห็นอยู่ตลอดเวลา"
 stress_threshold.1721.desc.content:0 "สูงส่ง พอใจในสิ่งที่ตนมี และไม่เป็นภาระด้วยความทะเยอทะยานที่ไม่จำเป็น แต่ข้ารู้สึกว่าข้าทำตัวอิจฉาริษยาและหยิ่งผยองมากกว่าผู้อื่น"
 stress_threshold.1721.desc.cynical_no_collide:0 "มีเหตุผล แต่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าดูเหมือนจะชื่นชอบปรัชญาของผู้อื่นเสมอ และไม่เคยชอบความคิดของข้าเลย"
 stress_threshold.1721.desc.paranoid:0 "ระมัดระวัง แต่ข้าไม่สามารถคาดการณ์ทุกอย่างได้ ยังมีผู้ทรยศให้ค้นหาอีกเสมอ มีอุบายซ่อนเร้นอีกมาก ผู้อื่นดูเหมือนจะไม่ต้องรับมือกับการทรยศมากเท่านี้ และข้าทำได้เพียงโทษตัวเองที่เป็นแรงบันดาลใจให้เกิดเรื่องนี้"
 stress_threshold.1721.desc.callous:0 "มองตามความเป็นจริง แต่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าตีความทุกสิ่งที่ข้าทำว่าเป็นความใจร้าย จู้จี้จุกจิกเกี่ยวกับเรื่องหยุมหยิมเล็กน้อย ผู้อื่นดูเหมือนจะไม่มีปัญหาในการควบคุมผู้ใต้บังคับบัญชา เช่นนี้"
 stress_threshold.1721.desc.compassionate:0 "เห็นอกเห็นใจ แต่ผู้อื่นดูเหมือนจะเป็นที่รักมากกว่าข้ามาก ข้าแค่ไม่สามารถสร้างสัมพันธ์กับผู้คนได้ดีเท่าที่ข้าต้องการ"
 stress_threshold.1721.desc.fickle:0 "ยืดหยุ่น แต่ไม่ว่าข้าจะเปลี่ยนใจกี่ครั้ง ไม่ว่าข้าจะได้รับข้อมูลใหม่มากเพียงใด ผู้อื่นดูเหมือนจะสามารถเปลี่ยนแปลงได้ดีกว่าข้า"
 stress_threshold.1721.desc.vengeful:0 "ยุติธรรม แก้แค้นการดูหมิ่นและลงทัณฑ์ตอบโต้ แต่ผู้อื่นดูเหมือนจะแก้แค้นได้รวดเร็วกว่าเสมอ"
 stress_threshold.1721.desc.forgiving:0 "ให้อภัย แต่ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าก็ยังกลัวที่จะมาหาข้าพร้อมปัญหาของพวกเขา ผู้อื่นดูเหมือนจะมีคนสนิทเป็นร้อย และข้าไม่รู้ว่าจะ ทำให้คนของข้าเชื่อใจข้า เช่นนั้นได้อย่างไร"
 stress_threshold.1721.desc.fallback:0 "สูงส่ง แต่ข้าเต็มไปด้วยความไม่สมบูรณ์แบบ"
 stress_threshold.1721.desc.rump:0 "\n\nสาปแช่งจักรวาลนี้ ที่มอบความรับผิดชอบ เช่นนี้ให้กับคนอาภัพ เช่นข้า!"
 stress_threshold.1721.a.reclusive.gain:0 "ข้าต้องการอยู่คนเดียวเพื่อคิดเกี่ยวกับเรื่องนี้"
