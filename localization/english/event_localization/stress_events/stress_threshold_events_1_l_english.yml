 stress_threshold.2311.t:0 "สติแตก: อดีตตามหลอกหลอน"
 stress_threshold.2311.desc.intro:0 "ข้านั่งครุ่นคิดอยู่คนเดียว หัวใจหนักอึ้งด้วยความทรงจำ ใคร่ครวญถึงสิ่งที่ข้าทำไปเมื่อหลายปีก่อน"
 stress_threshold.2311.desc.generous:0 "ข้าเป็น [ROOT.GetCharacter.GetTitleAsNameNoTooltip] ที่มีเมตตาอย่างแท้จริงหรือไม่? ข้าได้ช่วยเหลือผู้คนจริงๆ หรือ?"
 stress_threshold.2311.desc.diligent:0 "ตอนนั้นข้าทำงานหนักพอหรือไม่? ความเหนื่อยยากของข้าช่วยปัดเป่าปัญหา หรือก่อให้เกิดปัญหากันแน่?"
 stress_threshold.2311.desc.wrathful:0 "บ่อยครั้งแค่ไหนที่ข้าอาละวาดด้วยความโกรธ? ความพิโรธของข้าถูกใช้ไปอย่างคุ้มค่า หรือใช้ไปผิดทาง?"
 stress_threshold.2311.desc.patient:0 "ข้าระมัดระวังเกินไปหรือไม่? ความอดทนของข้าเป็นอะไรมากกว่าการตัดสินใจไม่ได้ที่ถูกยกย่องเกินจริงหรือไม่?"
 stress_threshold.2311.desc.arrogant:0 "ความหยิ่งผยองของข้านำข้ามาถึงจุดนี้หรือไม่? ข้ามีการตกต่ำที่สาสมรอคอยที่จะ ทำให้ข้าพินาศอยู่หรือไม่?"
 stress_threshold.2311.desc.humble:0 "ข้าดีพอจริงๆ หรือ? [ROOT.GetCharacter.GetTitleAsNameNoTooltip] คนอื่นจะไม่เหมาะสมกว่าหรือ?"
 stress_threshold.2311.desc.deceitful:0 "ข้าพัวพันอยู่ในคำโกหกของตัวเองมากเกินไปหรือไม่? ข้าคิดว่าข้าฉลาด แต่บางทีการหลอกลวงของข้ากำลังตามทันข้าอยู่แม้กระทั่งตอนนี้?"
 stress_threshold.2311.desc.zealous:0 "ข้าอยู่ในสายพระเนตรของ [ROOT.GetCharacter.GetFaith.HighGodNamePossessive] อย่างแท้จริงหรือไม่? ศรัทธาของข้าเป็นคบเพลิงในความมืด หรือเป็นกองไฟเผาความโง่เขลาของตัวเอง?"
 stress_threshold.2311.desc.fallback:0 "ข้าถูกหรือ? ข้าผิดหรือ?"
 stress_threshold.2311.desc.rump:0 "ข้าเคยทำสิ่งที่ถูกต้องอย่างแท้จริงหรือไม่?\n\nศีรษะของข้าปวดตุบๆ เหตุใด [ROOT.GetCharacter.GetFaith.HighGodName] จึงนำข้ามาสู่เส้นทางนี้ หาก [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] รู้ว่ามันจะ ทำให้ข้าทุกข์ทรมาน เช่นนี้?"
