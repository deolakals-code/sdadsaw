 scars_over_scars_modifier:0 "แผลทับแผล"
 scars_over_scars_modifier_desc:0 "ตัวละครนี้กลบอดีตของตนด้วยความเจ็บปวดทางโลก"
 trying_to_buy_happiness_modifier:0 "พยายามซื้อความสุข"
 trying_to_buy_happiness_modifier_desc:0 "ตัวละครนี้กลบอดีตของตนด้วยการซื้อของฟุ่มเฟือยอยู่ตลอดเวลา"
 outer_monologue_modifier:0 "การเปิดเผยความคิด"
 outer_monologue_modifier_desc:0 "ตัวละครนี้แสวงหาการให้อภัยสำหรับอดีตของตนด้วยการเปิดเผยมันอยู่ตลอดเวลา"
 sated_by_mistakes_modifier:0 "อิ่มเอมด้วยความผิดพลาด"
 sated_by_mistakes_modifier_desc:0 "ตัวละครนี้ดำรงอยู่ด้วยความเสียใจมากกว่าอาหาร"
 refuge_in_words_modifier:0 "หลบภัยในถ้อยคำ"
 refuge_in_words_modifier_desc:0 "ตัวละครนี้กลบอดีตของตนด้วยบันทึกที่เปื้อนหมึก"
 sorely_needed_confidant_modifier:0 "ผู้เปิดเผยเรื่องส่วนตัวมากเกินไป"
 sorely_needed_confidant_modifier_desc:0 "ตัวละครนี้พูดถึงอดีตของตนกับคนสนิทอยู่ตลอดเวลา"
 long_walks_of_the_mind_modifier:0 "การเดินทอดน่องทางความคิด"
 long_walks_of_the_mind_modifier_desc:0 "ตัวละครนี้หวนนึกถึงอดีตของตนด้วยการเดินเพียงลำพังเป็นเวลานาน"
 bottom_of_a_bottle_modifier:0 "ก้นขวด"
 bottom_of_a_bottle_modifier_desc:0 "ตัวละครนี้กลบอดีตของตนด้วยก้นขวด"
 fogging_hard_memories_modifier:0 "ทำให้ความทรงจำอันหนักหน่วงเลือนลาง"
 fogging_hard_memories_modifier_desc:0 "ตัวละครนี้กลบอดีตของตนด้วยเค้กฮาชิชจำนวนมหาศาล"
 high_blood_pressure_modifier:0 "ความดันโลหิตสูง"
 high_blood_pressure_modifier_desc:0 "ความหงุดหงิดของตัวละครนี้ไม่ดีต่อหัวใจของพวกเขา"
 regular_walking_routes_modifier:0 "เส้นทางเดินประจำ"
 regular_walking_routes_modifier_desc:0 "ตัวละครนี้ใช้เวลาเดินตามเส้นทางบางเส้นทางเป็นประจำ เพียงลำพัง..."
 symbol_of_folly_modifier:0 "สัญลักษณ์แห่งความโง่เขลา"
 symbol_of_folly_modifier_desc:0 "เสื้อคลุมที่หรูหราฟู่ฟ่าที่สุดของตัวละครนี้เป็นสัญลักษณ์ของหน้าที่ที่ถูกละทิ้ง"
 deserted_halls_modifier:0 "โถงที่ว่างเปล่า"
 deserted_halls_modifier_desc:0 "มีคนเพียงไม่กี่คนที่อยู่ร่วมกับตัวละครนี้ ทำให้พวกเขาอยู่ตามลำพัง..."
 glut_of_furniture_modifier:0 "เฟอร์นิเจอร์ล้นเกิน"
 glut_of_furniture_modifier_desc:0 "พื้นที่อยู่อาศัยของตัวละครนี้เต็มไปด้วยเฟอร์นิเจอร์คุณภาพต่ำและไร้รสนิยมมากขึ้นเรื่อยๆ"
 strange_recluse_modifier:0 "ผู้สันโดษประหลาด"
 strange_recluse_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่าซ่อนตัวอยู่อย่างสันโดษ และพูดจาแปลกๆ กับผู้มาเยือน..."
 grouchy_ruler_modifier:0 "ผู้นำขี้หงุดหงิด"
 grouchy_ruler_modifier_desc:0 "ตัวละครนี้ขี้หงุดหงิดและพูดจาห้วนๆ กับทุกคนที่รบกวนพวกเขา"
 suspicious_sketcher_modifier:0 "นักวาดภาพร่างน่าสงสัย"
 suspicious_sketcher_modifier_desc:0 "ตัวละครนี้ดูเหมือนจะกำลังร่างภาพและจดบันทึกอยู่เสมอระหว่างการสนทนา..."
 carrion_writer_modifier:0 "นักเขียนซากศพ"
 carrion_writer_modifier_desc:0 "ตัวละครนี้เขียนบันทึกโดยใช้หมึกอันเป็นส่วนตัวยิ่ง"
 pickled_human_head_footstool:0 "หัวมนุษย์ดอง"
 pickled_human_head_footstool_desc:0 "ตัวละครนี้ยืนกรานที่จะใช้ที่วางเท้าอันน่าสยดสยอง"
 ostentatious_follies_modifier:0 "สิ่งก่อสร้างโอ้อวดที่ไร้ประโยชน์"
 ostentatious_follies_modifier_desc:0 "อาณาเขตของตัวละครนี้ประดับประดาไปด้วยอนุสาวรีย์น่าเกลียดที่สร้างไม่เสร็จเพื่อแสดงความยิ่งใหญ่ของพวกเขา"
 extreme_tax_rebates_modifier:0 "การคืนภาษีสุดขั้ว"
 extreme_tax_rebates_modifier_desc:0 "เป็นที่ทราบกันดีว่าตัวละครนี้คืนภาษีให้กับสามัญชนทุกคนที่ร้องขอ!"
 obsessed_autobiographer_modifier:0 "นักเขียนอัตชีวประวัติที่หมกมุ่น"
