 stress_threshold.2301.t:0 "สติแตก: ความต้องการที่เพิ่มพูน"
 stress_threshold.2301.desc.intro:0 "แต่ละวันดูเหมือนจะผ่านพ้นไปจากข้าเมื่อเร็วๆ นี้ เป็นขบวนการตัดสินใจที่ยากลำบากไม่รู้จบ หน้าอกของข้าแน่นขึ้น ปลายนิ้วของข้าคันและรู้สึกซ่า ดวงตาของข้ารู้สึกเล็กเกินไปสำหรับกะโหลกศีรษะ\n\nข้าต้องหนีไป เพียงชั่วครู่ ข้าต้องการ"
 stress_threshold.2301.desc.lustful:0 "รู้สึกถึงความอบอุ่นของผู้อื่นในอ้อมแขนของข้า เพียงเพื่อเชื่อมต่อกับใครสักคนเล็กน้อย"
 stress_threshold.2301.desc.gluttonous:0 "กินอะไรสักอย่าง อะไรก็ได้ เพื่อดับความว่างเปล่าไร้ความหมายนี้"
 stress_threshold.2301.desc.greedy:0 "รู้สึกถึงความแข็งที่น่าอุ่นใจของเหรียญเย็นๆ ระหว่างนิ้วของข้า บางสิ่งที่น่าเชื่อถือ บางสิ่งที่สมเหตุสมผล"
 stress_threshold.2301.desc.gregarious:0 "คุยกับใครสักคน ใครก็ได้ #EMP คุย#! จริงๆ และรู้สึกเหมือนพวกเขาเข้าใจข้า"
 stress_threshold.2301.desc.fallback:0 "แค่หายใจโดยไม่รู้สึกกดดัน ยิ้มโดยไม่รู้สึกว่างเปล่า"
 stress_threshold.2301.desc.rump:0 "\n\nนั่นเป็นการขอที่มากเกินไปหรือ?"
