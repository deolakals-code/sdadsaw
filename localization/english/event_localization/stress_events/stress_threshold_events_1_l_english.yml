 stress_threshold.2321.desc.compassionate:0 "[ROOT.Char.Custom('GetCourtier')|l] ของข้าเล่นกับความเห็นอกเห็นใจของข้าตลอดเวลา กระตือรือร้นที่จะขูดรีดทุกหยาดหยดของความเห็นอกเห็นใจในตับของข้า!"
 stress_threshold.2321.desc.forgiving:0 "ความเมตตาของข้าถูกทดสอบทุกวัน บางครั้งวันละสองครั้ง โดยกองทัพของพวกเนรคุณที่น่ารังเกียจ!"
