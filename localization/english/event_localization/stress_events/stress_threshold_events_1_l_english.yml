 stress_threshold.1731.t:0 "สติแตก: ไม่มีเวลาให้ตัวเอง"
 stress_threshold.1731.desc.intro:1 "ช่วงนี้ช่างเป็นงานที่เหน็ดเหนื่อยเหลือเกิน ราวกับว่าข้าไม่มี [ROOT.Char.Custom('GetCourtier')|l] สักคนเดียวที่สามารถจัดการธุระส่วนตัวได้โดยปราศจากคำสั่งที่ชัดเจนและละเอียดจากข้า!\n\nท่ามกลางการวางแผนการเดินทางเล็กๆ น้อยๆ"
 stress_threshold.1731.desc.lustful:0 "ไปยังหอนางโลมในท้องถิ่น ที่ ซึ่งข้าตั้งใจจะอยู่จนกว่าจะถลอกและปวดเมื่อย"
 stress_threshold.1731.desc.gluttonous:0 "ไปยังโรงเตี๊ยมที่มีชื่อเสียง ที่ ซึ่งข้าจะลองชิมอาหารต่างแดนที่แปลกใหม่"
 stress_threshold.1731.desc.brave:0 "ไปยังการประลองในท้องถิ่นที่มีชื่อเสียงด้านความดุเดือดเป็นพิเศษ"
 stress_threshold.1731.desc.shy:0 "ไปยังสถานที่ในท้องถิ่น ซึ่งเป็นที่รู้จักในด้านความสงบเงียบ"
 stress_threshold.1731.desc.gregarious:0 "เพื่อไปเที่ยวเตร่กับคนท้องถิ่นอัธยาศัยดีบางคน"
 stress_threshold.1731.desc.sadistic:0 "ไปยังคุกในท้องถิ่นที่อัดแน่นไปด้วยอาชญากรและไพร่"
