 stress_threshold.2351.i:0 "ขออภัย ตอนนี้ โปรดเล่าเรื่องของท่านอีกครั้ง..."

 stress_threshold.3401.t:0 "สติแตก: ประหารผู้ส่งสาร"
 stress_threshold.3401.desc.intro:0 "ศีรษะของข้ารู้สึกเหมือนพายุฝนฟ้าคะนองที่ติดอยู่ในเปลือกไข่ ข้าบิดตัว พยายามหาท่าที่สบายบนบัลลังก์ ขณะที่ผู้ส่งสารคนหนึ่งเล่าเรื่องคร่ำครวญไร้สาระเกี่ยวกับโจรสลัด หรือโจรป่า หรือผู้บุกรุก หรือเรื่องไร้สาระของพวกไพร่บางอย่าง\n\nความดันในกะโหลกศีรษะของข้าก่อตัวขึ้น เรียกร้องหาทางระบาย และเกือบจะโดยไม่ตั้งใจ ปากของข้าก็เปิดออกเพื่อพูด"
 stress_threshold.3401.desc.vengeful:0 ""เจ้าไม่ได้ขว้างไข่ใส่ข้าเมื่อหลายปีก่อนหรือ?"
 stress_threshold.3401.desc.wrathful:0 ""เจ้ากล้าดียังไงนำเรื่องหยุมหยิม เช่นนี้มาให้ข้า?!"
 stress_threshold.3401.desc.impatient:0 ""พูดออกมาสิ ไอ้โง่! โธ่เอ๊ย ช้าเกินไป!"
 stress_threshold.3401.desc.arbitrary:0 ""ขอสาบานต่อ [ROOT.GetCharacter.GetFaith.HighGodName] ข้าว่ากลิ่นตัวเจ้าช่างรุนแรงนัก"
 stress_threshold.3401.desc.paranoid:0 ""เจ้าคิดว่าข้าจะหลงเชื่อคำโกหกที่เห็นได้ชัดเหล่านี้รึ? เจ้าเป็นนักฆ่ารับจ้างอย่างแน่นอน!"
 stress_threshold.3401.desc.callous:0 ""ข้าไม่สนใจปัญหาเล็กน้อย เช่นนี้"
 stress_threshold.3401.desc.sadistic:0 ""การบริการที่ย่ำแย่ของเจ้าเป็นตัวอย่างที่ไม่ดี"
 stress_threshold.3401.desc.fallback:0 "$stress_threshold.3401.desc.wrathful$"
 stress_threshold.3401.desc.rump:0 "#EMP ตัดหัวไอ้โง่นี่ซะ!#!"\n\nราชสำนักรอบตัวเราเงียบกริบ"
 stress_threshold.3401.a.reclusive.gain:0 "แล้วพวกเจ้าทุกคนก็ออกไปให้พ้นสายตาข้า!"
 stress_threshold.3401.a.reclusive.effect:0 "$stress_threshold.3401.a.reclusive.gain$"
 stress_threshold.3401.a.reclusive.list:0 "ทุก [character|E] ที่อยู่นอกครัวเรือนใกล้ชิดของท่าน"
 stress_threshold.3401.b.irritable.gain:0 "และตัดหัวใครก็ตามที่พยายามจะพูดกับข้า!"
 stress_threshold.3401.b.irritable.effect:0 "$stress_threshold.3401.b.irritable.gain$"
 stress_threshold.3401.c.journaller.gain:0 "รีดเลือดออกจากศพ! #EMP ข้าจะเอาของเหลวมาทำหมึก!#!"
 stress_threshold.3401.c.journaller.effect:0 "$stress_threshold.3401.c.journaller.gain$"
 stress_threshold.3401.d.confider.gain:0 "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.3401.d.confider.effect:0 "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.3401.e.drunkard.gain:0 "และนำสุรามาให้ข้า! และอีกขวดสำรอง!"
 stress_threshold.3401.e.drunkard.effect:0 "$stress_threshold.3401.e.drunkard.gain$"
 stress_threshold.3401.f.hashishiyah.gain:0 "และนำเค้กฮาชิชออกมา!"
 stress_threshold.3401.f.hashishiyah.effect:0 "$stress_threshold.3401.f.hashishiyah.gain$"
 stress_threshold.3401.g:0 "และนำหัวมันมาทำที่วางเท้าให้ข้า!"

 stress_threshold.3411.t:0 "สติแตก: ข้าไม่คู่ควร!"
 stress_threshold.3411.desc.intro:0 "ข้าทำไม่ได้ ข้าทำไม่ได้จริงๆ ข้าไม่สามารถเป็น [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L] ต่อไปได้อีกแม้ แต่วินาทีเดียว! มีใครเคย #EMP รับมือ#! กับกองความเครียดที่คุกรุ่นนี้ได้อย่างไร? ไม่ว่าข้าจะ"
 stress_threshold.3411.desc.generous:0 "ให้ไปมากเท่าใด ไม่ว่าข้าจะมีเมตตาต่อไพร่ฟ้าของข้าเพียงใด บางคนก็ดูเหมือนจะยากจนอยู่เสมอ และบางคนก็ดูเหมือนจะเกลียดชังข้าอยู่เสมอ"
 stress_threshold.3411.desc.diligent:0 "ทำงานหนักเพียงใด กี่คืนที่ไม่ได้นอนที่ข้าอ้อยอิ่งจากเตียง ปัญหาของอาณาจักรดูเหมือนจะเพิ่มพูนและเน่าเฟะมากขึ้นเท่านั้น"
 stress_threshold.3411.desc.patient:0 "อดทนรับฟังปัญหาแล้วปัญหาเล่าเพียงใด ข้าก็ดูเหมือนจะไม่มีทางแก้ปัญหาที่ดีพอเลย"
 stress_threshold.3411.desc.humble:0 "ปล่อยให้ความหยิ่งผยองเข้ามาขวางทางหน้าที่ของข้าน้อยเพียงใด ข้าก็ยังรู้สึกราวกับว่ากำลังถูกความโอหังของตัวเองกลืนกินทั้งเป็น"
 stress_threshold.3411.desc.shy:0 "พยายามออกว่าราชการมากเพียงใด การเห็นข้าราชบริพารที่เนืองแน่นก็ ทำให้ข้าตกใจกลัวสุดขีด"
 stress_threshold.3411.desc.just:0 "ยุติธรรมเพียงใด ไม่ว่าข้าจะยึดมั่นในหลักนิติธรรมอย่างแรงกล้าเพียงใด อาชญากรรมก็ยังคงเน่าเฟะอยู่ในทุกมุมของอาณาเขตของข้า"
 stress_threshold.3411.desc.trusting:0 "ให้อภัยผู้คนกี่ครั้ง หรือให้พวกเขากู้ยืม หรือให้ประโยชน์แก่พวกเขา บางสิ่งที่หายนะและคาดเดาไม่ได้ก็ดูเหมือนจะเกิดขึ้นเสมอ"
 stress_threshold.3411.desc.compassionate:0 "พยายามออกว่าราชการบ่อยเพียงใด เพื่อรับฟังประชาชนทั่วไปของแผ่นดิน ก็มักจะมีอีกหลายร้อยคนรอที่จะร้องขอความช่วยเหลือจากข้าเสมอ"
 stress_threshold.3411.desc.forgiving:0 "$stress_threshold.3411.desc.trusting$"
 stress_threshold.3411.desc.fallback:0 "พยายามหนักเพียงใด ทุกสิ่งที่ข้าทำดูเหมือนจะเป็นความผิดพลาด ทุกความสำเร็จกลายเป็นเถ้าถ่านในกำมือของข้า"
 stress_threshold.3411.desc.rump:0 "\n\nเป็นที่ชัดเจนว่าข้าจะ #EMP ไม่มีวัน#! ดีพอที่จะปกครอง บางอย่าง #EMP ต้อง#! เปลี่ยนแปลง"
