 stress_threshold.2341.t:0 "สติแตก: ละทิ้งหน้าที่"
 stress_threshold.2341.desc.intro:0 "ให้ตายสิ ข้าก็ต้องการเวลาให้ตัวเองเหมือนกัน! แล้วจะเป็นไรไปถ้าข้าจะออกจาก [ROOT.Char.Custom('GetCourt')|l] สักสองสามวัน หรือแม้กระทั่งหนึ่งเดือน? การนำเป็นสิทธิพิเศษของข้า และข้าจะใช้มัน หรือละทิ้งมัน ตามใจข้า\n\nข้าคือ [ROOT.GetCharacter.GetTitleAsNameNoTooltip]"
 stress_threshold.2341.desc.lazy:0 "และข้าต้องการพักผ่อน!"
 stress_threshold.2341.desc.craven:0 "และถ้าข้าเลือกที่จะไม่เผชิญหน้ากับอันตราย มันก็ไม่ใช่เรื่องของใครนอกจากตัวข้าเอง!"
 stress_threshold.2341.desc.shy:0 "และถ้าข้าไม่ต้องการเผชิญหน้ากับ [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้า ข้าก็ไม่ต้องทำ!"
 stress_threshold.2341.desc.arbitrary:0 "และข้าไม่มีพันธะใดๆ เว้น แต่ที่ข้าเลือกที่จะรักษาไว้!"
 stress_threshold.2341.desc.fickle:0 "$stress_threshold.2341.desc.arbitrary$"
 stress_threshold.2341.desc.fallback:0 "และการตัดสินใจของข้าล่วงละเมิดมิได้!"
 stress_threshold.2341.a.reclusive.gain:0 "ไปให้พ้น! พวกเจ้าทุกคน!"
