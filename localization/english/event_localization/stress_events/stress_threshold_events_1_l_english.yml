 stress_threshold.2351.t:0 "สติแตก: วาจาไม่เหมาะสม"
 stress_threshold.2351.desc.intro:0 "ข้านั่งฟังอย่างไม่ค่อยใส่ใจนัก ขณะที่ชาวบ้านในท้องถิ่นคนหนึ่งเล่าเรื่องราวความทุกข์ยากของตนจบลง บอกตามตรง ข้าแทบไม่ได้ใส่ใจเลยว่าพวกเขากำลังพูดถึงอะไร จิตใจของข้าเต็มไปด้วยปัญหา #EMP ของข้าเอง#! จนแทบระเบิด\n\n"
 stress_threshold.2351.desc.content:0 ""เจ้าแค่พอใจ #EMP กับสิ่งที่เจ้ามีเหลืออยู่ไม่ได้หรือ?""
 stress_threshold.2351.desc.cynical:0 ""หึ ข้าจะรู้ได้อย่างไรว่าเจ้าไม่ได้ #EMP โกหก#!?""
 stress_threshold.2351.desc.paranoid:0 ""เรื่อง #EMP เหลวไหล#! ชัดๆ เจ้าคงเป็นแค่สายลับเจ้าเล่ห์!"
 stress_threshold.2351.desc.sadistic:0 ""เจ้ารู้ไหม ข้าคิดว่ามีจุดที่ #EMP เหมาะสม#! ใน [ROOT.Char.Custom('GetDungeon')] ของข้าสำหรับเจ้า""
 stress_threshold.2351.desc.vengeful:0 ""ข้ามั่นใจว่าเจ้าสมควรได้รับ #EMP ทุกอย่าง#! ที่เกิดขึ้นกับเจ้า""
 stress_threshold.2351.desc.fallback:0 ""ขอสาบานต่อ [ROOT.GetCharacter.GetFaith.HighGodName] เจ้า #EMP เหม็น#! เหลือเกิน""
 stress_threshold.2351.desc.rump:0 "ข้าตอบโดยไม่คิด\n\n[ROOT.Char.Custom('GetRoom')] เงียบสงัด ทุกสายตาจับจ้องไปที่สามัญชนผู้สับสนและข้า เห็นได้ชัดว่านั่นไม่ใช่คำตอบที่พวกเขาคาดหวัง"
 stress_threshold.2351.a.reclusive.gain:0 "#EMP ออกไป#! พวกเจ้าทุกคน!"
 stress_threshold.2351.a.reclusive.effect:0 "$stress_threshold.2351.a.reclusive.gain$"
 stress_threshold.2351.b.irritable.gain:0 "พวกเจ้าต้องการอะไรจากข้า พวกขี้ขลาดตาขาว?"
