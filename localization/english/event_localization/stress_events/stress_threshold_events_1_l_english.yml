 stress_threshold.2321.desc.intro:0 "ทุกสิ่งที่ข้าทำ ผู้คนเอาเปรียบ!"
 stress_threshold.2321.desc.impatient:0 "ชีวิตของข้าคือขบวนคำอธิบายที่ยืดยาวและวกวน ซึ่งข้าไม่มีเวลาให้!"
 stress_threshold.2321.desc.honest:0 "[ROOT.Char.Custom('GetCourt')|l] ของข้าโกหกต่อหน้าข้า ตลอดทั้งวัน ทุกวัน ทั้งสามัญชนและขุนนาง!"
