 stress_threshold.2331.t:0 "สติแตก: อำนาจที่ห่างเหิน"
 stress_threshold.2331.desc.intro:0 "ช่วงหลังนี้ เหล่า [ROOT.Char.Custom('GetCourtierPlural')|l] ของข้าดูเหมือนจะหลีกเลี่ยงข้าทุกวิถีทาง ข้าได้ยินเสียงกระซิบว่า "
 stress_threshold.2331.desc.calm:0 "พวกเขาถือว่ามุมมองที่สงบของข้าน่ารำคาญ ไร้ ซึ่งอารมณ์"
 stress_threshold.2331.desc.brave:0 "ความกล้าหาญของข้าถูกเข้าใจผิดว่าเป็นความกระหายเลือด"
 stress_threshold.2331.desc.ambitious:0 "พวกเขาคิดว่าข้าจะไม่หยุดยั้งเพื่อบรรลุความทะเยอทะยานของข้า ว่าไม่มีสิ่งใดศักดิ์สิทธิ์สำหรับข้า"
 stress_threshold.2331.desc.just:0 "พวกเขาคิดว่าข้าเข้มงวดเกินไป ว่าข้ายึดติดกับตัวบทกฎหมายมากเกินไปแทนที่จะเป็นเจตนารมณ์ของมัน"
 stress_threshold.2331.desc.callous:0 "พวกเขาบอกว่าข้าไร้หัวใจ ว่าข้าไม่ใส่ใจใครนอกจากตัวเอง"
 stress_threshold.2331.desc.stubborn:0 "พวกเขาถือว่าข้าดื้อรั้นเกินไป ไม่ยืดหยุ่นเกินไป ไม่ประนีประนอมเกินไป"
 stress_threshold.2331.desc.fallback:0 "พวกเขาคิดว่าข้าเย็นชาเกินไป ห่างเหินเกินไป"
 stress_threshold.2331.desc.rump:0 "แต่นั่นหมายความว่าข้านำด้วยมือที่มั่นคง ไม่ได้หมายความว่าข้าเป็นปีศาจ\n\n... ใช่หรือไม่?"
 stress_threshold.2331.a.reclusive.gain:0 "ข้าก็ไม่อยากเห็นหน้า #EMP พวกเขา#! เหมือนกัน!"
 stress_threshold.2331.a.reclusive.effect:0 "$stress_threshold.2331.a.reclusive.gain$"
