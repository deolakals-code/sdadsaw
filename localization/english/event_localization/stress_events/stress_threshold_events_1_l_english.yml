 stress_threshold.3421.t:0 "สติแตก: ดินแดนแห่งความเสเพล"
 stress_threshold.3421.desc.intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" คนรับใช้อ้อนวอน "โปรดทำอะไรสักอย่างเถิด! [burning_holding.GetNameNoTier] กำลังลุกเป็นไฟ! ท่านต้องส่งความช่วยเหลือไป!"\n\n"
 stress_threshold.3421.desc.lustful:0 "ข้ายืดตัว มือทั้งสองข้างสัมผัสกับเนื้อหนังอันงดงามของหญิงสาวได้อย่างง่ายดาย เสียงครางประสานจากด้านหลังข้าดูเหมือนจะไม่เดือดร้อนกับผู้มาเยือน"
 #Go full Denethor:
 stress_threshold.3421.desc.gluttonous:0 "ข้ายังคงตักอาหารเข้าปากต่อไป หยุดงานเลี้ยง[ROOT.GetCharacter.GetWomanMan]คนเดียวของข้าเพียงชั่วครู่หลังจากผ่านไปหลายนาทีที่น่าอึดอัด และเป็นที่ชัดเจนว่าผู้ส่งสารจะไม่จากไปหากไม่มีคำสั่งที่ชัดเจน"
 stress_threshold.3421.desc.greedy:0 "ข้าเพียงแค่นับเหรียญของข้าต่อไปอย่างไม่หวั่นไหว กองเงินและทองที่ส่องประกายล้อมรอบข้าราวกับป้อมปราการของปราสาทเล็กๆ จัดเรียงตามขนาดและความบริสุทธิ์ และประกอบเป็นส่วนสำคัญของความมั่งคั่งของข้า"
 stress_threshold.3421.desc.lazy:0 "ดวงตาของข้ายังคงปิดสนิท ข้าแกว่งตัวเบาๆ ในเปลผ้า อยู่เพียงลำพังบนหอคอยที่สูงที่สุดที่ข้าครอบครอง เว้น แต่ผู้ส่งสารและค่าไถ่ [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip|L] ในกองหมอนนุ่มและผ้าห่ม"
 stress_threshold.3421.desc.arrogant:0 "ข้ายังคงสร้างแบบจำลองพระราชวังในอุดมคติเวอร์ชันใหม่ที่สมบูรณ์แบบต่อไป มันเหมือนข้าในทุกรายละเอียด และ เพราะข้ากำลังสร้างมัน ทุกรายละเอียดสุดท้ายจึงถูกต้องโดยเนื้อแท้"
 stress_threshold.3421.desc.craven:0 "ข้ายังคงปลอดภัยอย่างแน่นหนาอยู่หลังประตูเสริมเหล็กที่หนักอึ้ง ต้องใช้ทหารร่างกำยำนับสิบคนจึงจะพังเข้ามาได้ และในห้องที่ปลอดภัยไร้หน้าต่างนี้ ข้าอยู่ห่างจากอันตรายมากขึ้น"
 stress_threshold.3421.desc.gregarious:0 "ข้าแทบไม่ได้ยินเสียงพวกเขาเลยท่ามกลางเสียงหัวเราะดังลั่นและความรื่นเริงที่ดังมาจากด้านหลังข้า งานเลี้ยงของข้ากำลังดำเนินไปอย่างเต็มที่ และเป็น เช่นนั้นมาหลายวันแล้ว"
 stress_threshold.3421.desc.cynical:0 "ข้าจ้องมองพวกเขากลับจากประตูที่หลบภัยของข้า ใบหน้าของข้าเป็นหน้ากากแห่งความไม่เชื่อ ไฟไหม้ จริงๆ เหรอ? คำโกหกที่ชัดเจนและโจ่งแจ้ง ข้าจะรู้ได้อย่างไรว่านี่เป็นหนึ่งในคนรับใช้ #EMP ของข้า#! จริงๆ? พวกเขาอาจเป็นใครก็ได้! ทางที่ดีควรกำจัดพวกเขาไปเสียโดยเร็ว"
 stress_threshold.3421.desc.zealous:0 "ข้ายังคงอ่านจาก [ROOT.GetCharacter.GetFaith.ReligiousText] ต่อไป ล้อมรอบด้วยสัญลักษณ์ศักดิ์สิทธิ์แห่งศรัทธาของข้า วิงวอนขอการชี้แนะจาก [ROOT.GetCharacter.GetFaith.HighGodName] ต่อเมื่อเป็นที่ชัดเจนว่าผู้ส่งสารจะไม่จากไป ข้าจึงหันไป"
 stress_threshold.3421.desc.stubborn:0 "ดวงตาของข้ายังคงปิดอยู่ เตียงของข้าไม่ยุ่งเหยิง กิจวัตรของข้าคือกิจวัตรของข้า และข้าจะไม่เปลี่ยนแปลงมันหากไม่มีเหตุผลที่ดี #EMP อย่างยิ่ง#! ต่อเมื่อผู้ส่งสารเริ่มถามอีกครั้ง ข้าจึงขยับตัว"
 stress_threshold.3421.desc.fallback:0 "ข้ายืนอยู่ในหอคอยที่สูงที่สุดใน [capital_holding.GetNameNoTier] มองลงไปยังเมืองหลวง ริมฝีปากของข้าเม้มแน่น รู้สึกเหมือนข้าไม่ได้ออกจากที่นี่มาหลายวันแล้ว และทุกครั้งที่ข้าออกไป ก็มีเรื่องผิดพลาดอย่างใหญ่หลวงเกิดขึ้นอีก"
 stress_threshold.3421.desc.rump:0 "\n\n"ข้าเชื่อว่าข้าได้ให้คำสั่งที่เข้มงวดแล้วว่าห้ามรบกวน" ข้าตอบ มีเพียงห้องนี้ ความเป็นจริงนี้เท่านั้น ที่สมเหตุสมผลต่อจิตใจที่ใกล้สลายของข้าอีกต่อไป"
 stress_threshold.3421.a.rakish.gain:0 "นำคู่นอนมาให้ข้า แล้วข้าจะส่งความช่วยเหลือไป"
