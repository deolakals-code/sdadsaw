 realm_maintenance.1001.granted:0 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน เนื่องจากการได้รับพระราชทาน [titles|E] ใหม่"
 realm_maintenance.1001.revoked:1 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน เนื่องจาก [old_liege.GetTitledFirstName] ถูกเพิกถอนบรรดาศักดิ์ของ [old_liege.GetHerHis]"
 realm_maintenance.1001.election:0 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่านหลังจากชนะการเลือกตั้งเพื่อแทนที่ [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.independency:0 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน เนื่องจากการได้รับเอกราช"
 realm_maintenance.1001.returned:0 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] คนใหม่ของท่านหลังจากได้รับบรรดาศักดิ์ของ [new_liege.GetHerHis] คืนให้กับ [new_liege.GetHerHim] จาก [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.leased_out:0 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน เนื่องจากการให้ยืมใช้ [title|E] จาก [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.lease_revoked:0 "[new_liege.GetTitledFirstName] กลายเป็น [liege|E] ใหม่ของท่าน เนื่องจากการเพิกถอนสัญญาเช่าตำแหน่งของ [old_liege.GetTitledFirstNamePossessive] จาก [old_liege.GetHerHis]"
 realm_maintenance.1001.faction_demand:0 "[new_liege.GetTitledFirstName] ได้แทนที่ [old_liege.GetTitledFirstName] ในฐานะ [liege|E] ของท่านหลังจากได้รับการ แต่งตั้งโดย [faction|E]"
 realm_maintenance.1001.swear_fealty:0 "ท่านได้ถวายสัตย์ปฏิญาณต่อ [new_liege.GetTitledFirstName] และกลายเป็น [vassal|E] ของพวกเขา"
 realm_maintenance.1001.appointment: "[new_liege.GetTitledFirstName] ได้แทนที่ [old_liege.GetTitledFirstName] ในฐานะ [liege|E] ของท่านในฐานะผู้มีสิทธิ์สืบทอดลำดับถัดไป"
 realm_maintenance.1001.appointment_succession: "$realm_maintenance.1001.appointment$"
 realm_maintenance.1001.stepped_down: "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน เนื่องจาก [old_liege.GetTitledFirstName] ลงจากตำแหน่ง"
 realm_maintenance.1001.error:1 "[new_liege.GetTitledFirstName] ได้กลายเป็น [liege|E] องค์ใหม่ของท่าน แต่ท่านไม่ทราบว่า เพราะเหตุใด!"
 
 realm_maintenance.2001.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip|U] องค์ใหม่"
 realm_maintenance.2001.t_ceremonial_regent: "ผู้ดูแลแห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 realm_maintenance.2001.desc_murdered:0 "ภายหลังการสิ้นพระชนม์อันน่าเศร้าและ #EMP โชคร้าย #! ของ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] บัดนี้ภาระหน้าที่ในการนำ [title.GetTierAsNameNoTooltip] อันกว้างใหญ่จึงตกอยู่บนบ่าของข้าพเจ้า"
 realm_maintenance.2001.desc_dead:0 "ด้วยการจากไปของ [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] ภาระหน้าที่ในการเป็นผู้นำของ [title.GetTierAsNameNoTooltip|l] อันกว้างใหญ่บัดนี้ตกอยู่บนบ่าของข้า"
 realm_maintenance.2001.desc_alive:0 "บัดนี้เป็นหน้าที่ของข้าที่จะนำพากลไกการบริหารที่ [previous_holder.GetTitledFirstName] ผู้ดำรงตำแหน่งก่อนหน้าข้า ได้ทิ้งไว้"
 realm_maintenance.2001.desc:0 "\n\nข้าขัดเกลากิริยาท่าทางให้คู่ควรกับ[ROOT.Char.GetTitleAsNameNoTooltip] ยืนตระหง่านต่อหน้าเหล่าข้าหลวงของข้า และ[ROOT.Char.Custom('quirk_pos_personal_present')] โอ้ สิ่งที่ข้าจักกระทำช่างมากมายนัก!"
 realm_maintenance.2001.desc_ceremonial_regent: "พร้อมกันนี้คือหน้าที่อันศักดิ์สิทธิ์ของข้าที่จะดูแล [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ในนามของ [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitledFirstName]\n\nข้านั่งอย่างสง่างามต่อหน้าขุนนางที่มาชุมนุมกัน ดื่มด่ำกับช่วงเวลานี้ และ [ROOT.Char.Custom('quirk_pos_personal_present')] โอ้ สิ่งต่างๆ ที่ข้าจะ ทำให้สำเร็จ!"
 realm_maintenance.2001.a:0 "ทรงพระเจริญ [ROOT.Char.GetTitleAsNameNoTooltip]!"
 realm_maintenance.2001.a.ceremonial_regent: "นับเป็นเกียรติอย่างยิ่งของข้าที่ได้ช่วยเหลือ [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitleAsNameNoTooltip]!"
