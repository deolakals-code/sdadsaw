l_english: 
 # Tourney Troubles
 #  Initial Event:
 relation_upgrade.0001.t:0 "ปัญหาการประลองยุทธ์"
 relation_upgrade.0001.desc.opening:0 "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าจำต้องเข้าร่วมการประลองยุทธ์ [ROOT.Char.Custom('MartialTournamentAdjective')] ท้องถิ่น แต่ผู้เข้าแข่งขันมาช้า — การประลองยุทธ์จะไม่เริ่มไปอีกอย่างน้อยหนึ่งชั่วโมง\n\n"
 relation_upgrade.0001.desc.rival:0 "[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] อยู่ที่นี่ และ เช่นเคย กำลังทำตัวเป็นคนหยาบคายเหลือทน การพร่ำบ่นไม่หยุดของ[rival.GetHerHis|U] ทำให้ทุกคน #EMP ยิ่ง#! ทุกข์ระทมกว่าปกติ"
 relation_upgrade.0001.desc.friend:0 "เมื่อมองไปรอบๆ ข้าสังเกตเห็น [friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] นั่งอยู่ใต้พลับพลาใกล้ๆ เห็นได้ชัดว่าเบื่อแทบตาย"
 relation_upgrade.0001.desc.lover:0 "เมื่อมองไปรอบๆ ข้าสังเกตเห็น [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] นั่งอยู่ตามลำพัง[lover.GetHerselfHimself]บนอัฒจันทร์ ดูเปล่าเปลี่ยวอย่างแท้จริง"
 relation_upgrade.0001.desc.second_friend:0 "\n\nขณะเดียวกัน [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังนั่งอยู่ใต้พลับพลา เห็นได้ชัดว่าเบื่อแทบตาย..."
 relation_upgrade.0001.desc.second_lover:0 "\n\nขณะเดียวกัน [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังนั่งอยู่ตามลำพัง[lover.GetHerselfHimself]บนอัฒจันทร์ ดูเปล่าเปลี่ยวอย่างแท้จริง..."
 relation_upgrade.0001.desc.second_bridge:0 "\n\nในทางกลับกัน,"
 relation_upgrade.0001.desc.drink:0 "ข้าเพิ่งสังเกตเห็นพ่อค้ากำลังลงรถเข็นที่บรรทุก [ROOT.Char.Custom('GetExpensiveDrink')]..."
 relation_upgrade.0001.desc.food:0 "ข้าเพิ่งได้กลิ่นหอมยวนใจของ [ROOT.Char.Custom('GetExpensiveMeal')] ลอยมาจากครัว..."
 relation_upgrade.0001.desc.prowess:0 "นี่อาจเป็นโอกาสอันดีที่จะได้ทั้งอวดความเก่งกาจของข้าและสร้างความบันเทิงให้ฝูงชนในเวลาเดียวกัน"
 relation_upgrade.0001.desc.gossip:0 "นี่อาจเป็นโอกาสอันดีที่จะได้แอบฟังบทสนทนาของผู้เข้าร่วมคนอื่นๆ"
 relation_upgrade.0001.desc.book:0 "ข้าอาจจะใช้เวลาไปกับการอ่าน [ROOT.Char.GetFaith.ReligiousText] ขณะที่รอ"

 relation_upgrade.0001.rival:0 "ผลัก [rival.GetFirstNameNoTooltip] ลงไปในรางน้ำม้าเพื่อสร้างสีสัน"
 relation_upgrade.0001.friend:0 "ใช้เวลากับ [friend.GetFirstNameNoTooltip] ใต้พลับพลา"
 relation_upgrade.0001.lover:0 "ชวน [lover.GetFirstNameNoTooltip] มาร่วม "[ROOT.Char.Custom('MartialTournamentAdjective')]" แบบของเราเอง"
 relation_upgrade.0001.drink:0 "เครื่องดื่มดีๆ ช่วยให้อารมณ์ข้าดีขึ้นเสมอ!"
 relation_upgrade.0001.food:0 "อาหารดีๆ ช่วยให้อารมณ์ข้าดีขึ้นเสมอ!"
 relation_upgrade.0001.prowess:0 "ข้าจะ ทำให้ฝูงชนโห่ร้องให้กำลังใจข้า!"
 relation_upgrade.0001.gossip:0 "ข้ามั่นใจว่ามีใครบางคนที่นี่รู้อะไรบางอย่าง..."
 relation_upgrade.0001.gossip.tt:0 "ท่านค้นพบความลับแบบสุ่มจากภายในอาณาจักร"
 relation_upgrade.0001.book:0 "การพิจารณา [ROOT.Char.GetFaith.ReligiousText] เป็นการใช้เวลาที่ดีเสมอ"
 relation_upgrade.0001.opt_out:0 "ข้าเสียเวลากับหายนะนี้มากพอแล้ว..."

 # Tourney Troubles
 #  Follow-Up Event:
 relation_upgrade.0011.t:0 "$relation_upgrade.0001.t$"
 relation_upgrade.0011.desc.opening:0 "$relation_upgrade.0001.desc.opening$"
 relation_upgrade.0011.desc.rival:0 "ขณะที่ข้าคร่ำครวญว่าการประลองยุทธ์นี้จัดได้แย่เพียงใด [source.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เดินเข้ามาหาข้าและผลักข้าลงไปในรางน้ำม้าทันที ทำให้ทุกคนรอบข้างหัวเราะลั่น!"
 relation_upgrade.0011.desc.friend:0 "ขณะที่ข้ารออยู่ใต้พลับพลาให้มีอะไรเกิดขึ้น [source.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เดินมาที่โต๊ะของข้าและนั่งลง "ประลองยุทธ์ไม่เลวเลย ใช่ไหม? ว่า แต่ ท่านเป็นอย่างไรบ้าง?""
 relation_upgrade.0011.desc.lover:0 "ขณะที่ข้ารอให้ผู้เข้าแข่งขันปรากฏตัว [source.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็เดินเข้ามาหาข้าและชวนให้ข้าเข้าร่วม "[ROOT.Char.Custom('MartialTournamentAdjective')]" แบบของเราเองกับ[source.GetHerHim]"

 relation_upgrade.0011.rival.accept:1 "#EMP กล้าดีอย่างไร#! [source.GetSheHe]!?"
 relation_upgrade.0011.rival.accept.toast:0 "[rival.GetFirstNameNoTooltip] ขุ่นเคือง"
 relation_upgrade.0011.rival.decline:0 "ข้าว่ามันก็ #EMP ค่อนข้าง#! ตลกดีนะ..."
 relation_upgrade.0011.rival.decline.toast:0 "[rival.GetFirstNameNoTooltip] หัวเราะกลบเกลื่อน"
 relation_upgrade.0011.friend.accept:0 "อา ดีใจที่ได้พบท่าน [source.GetFirstNameNoTooltip]!"
 relation_upgrade.0011.friend.accept.toast:0 "ท่านและ [friend.GetFirstNameNoTooltip] ทำความรู้จักกัน"
 relation_upgrade.0011.friend.decline:0 "โอ้ ขออภัย ข้ากำลังจะไปพอดี..."
 relation_upgrade.0011.friend.decline.toast:0 "[friend.GetFirstNameNoTooltip] ไม่สนใจ"
 relation_upgrade.0011.lover.accept:0 "ฟังดูน่าสนุกกว่านี่นะ..."
 relation_upgrade.0011.lover.accept.toast:0 "[lover.GetFirstNameNoTooltip] ยอมรับข้อเสนอของข้า"
 relation_upgrade.0011.lover.decline:0 "ฮ่า ตลกดี... ท่าน #EMP ล้อเล่น#! ใช่ไหม?"
 relation_upgrade.0011.lover.decline.toast:0 "[lover.GetFirstNameNoTooltip] หัวเราะใส่ข้า"

# relation_upgrade.1001-1999

# Attending a Terrible Party
#	Initial Event:
 relation_upgrade.1001.t:0 "ค่ำคืนที่ควรลืม"
 relation_upgrade.1001.desc.intro:0 "ขอสาบานต่อ [ROOT.GetCharacter.GetFaith.HighGodName] งานเลี้ยงนี้ #EMP น่าเบื่อ#! สิ้นดี! [terrible_party_host.GetFirstName] ต้องเป็นเจ้าภาพที่แย่ที่สุดเท่าที่โลกเคย #EMP เห็น#! มาแน่ๆ [ROOT.GetCharacter.GetWomanMan] มนุษย์ปุถุชนจะทนการเฉลิมฉลองอันแสนธรรมดาและน่าเบื่อนี้ได้อย่างไร?\n\nสายตาข้ากวาดไปทั่วห้อง มองหาสิ่งเบี่ยงเบนความสนใจ อะไรก็ได้"
 relation_upgrade.1001.desc.friend:0 "[potential_friend.GetFirstName] โบกมือทักทายข้าอย่างเป็นมิตรจากระเบียงใกล้ๆ"
 relation_upgrade.1001.desc.lover:0 "[potential_lover.GetFirstName] ถอนหายใจอย่างอาลัยอาวรณ์ขณะที่[potential_lover.GetSheHe]เดินผ่านข้าไป"
 relation_upgrade.1001.desc.rival:0 "ที่มุมห้อง [potential_rival.GetFirstName] จ้องมองข้าอย่างกับจะกินเลือดกินเนื้อ"
 relation_upgrade.1001.desc.outro:0 "ข้าต้องทำ #EMP อะไรสักอย่าง#! เพื่อหยุดค่ำคืนอันยืดเยื้อนี้"
 relation_upgrade.1001.a:0 "บางทีข้าอาจจะทำความรู้จัก [potential_friend.GetFirstNameNoTooltip] ให้มากขึ้นได้?"
 relation_upgrade.1001.a.tt:0 "ท่านรอคำตอบ..."
 relation_upgrade.1001.b:0 "[potential_lover.GetFirstNameNoTooltip] ท่านสนใจเดินเล่นใต้แสงจันทร์หรือไม่?"
 relation_upgrade.1001.b.tt:0 "$relation_upgrade.1001.a.tt$"
 relation_upgrade.1001.c:0 "นี่ [potential_rival.GetFirstNameNoTooltip] อยากฟังไหมว่าข้าคิดกับเจ้า #EMP อย่างไร#! จริงๆ?"
 relation_upgrade.1001.c.tt:0 "[potential_rival.GetFirstNameNoTooltip] ตอบโต้ต่อคำด่าทอของท่าน..."
 relation_upgrade.1001.d:0 "มาเต้นรำกันเถอะ!"
 relation_upgrade.1001.d.tt_success:0 "ท่าน ทำให้งานเลี้ยงมีชีวิตชีวา!"
 relation_upgrade.1001.d.tt_success.list:0 "[guests|E] และ [courtiers|E] ทั้งหมดในงานเลี้ยง"
 relation_upgrade.1001.d.tt_fail:0 "เห็นได้ชัดว่า #EMP ท่าน#! ทำลายงานเลี้ยงของ [terrible_party_host.GetFirstNamePossessiveNoTooltip]"
 relation_upgrade.1001.e:0 "ถ้ามีใครขวางประตูไว้ ที่นี่คงไหม้ได้ง่ายๆ..."
 relation_upgrade.1001.e.list:0 "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.f:0 "ข้าคงต้องทำใจยอมรับสถานการณ์"
 relation_upgrade.1001.g:0 "บางทีข้าอาจจะคุยกับคนใหม่ๆ?"
 relation_upgrade.1001.h:0 "[terrible_party_host.GetFirstName] ท่านเป็นเจ้าภาพที่แย่มาก!"
 relation_upgrade.1001.h.list:0 "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.i:0 "ค่อยๆ หลบหนีไปอย่างเงียบๆ"

#	Follow-Up, Friend:
 relation_upgrade.1002.t:0 "$relation_upgrade.1001.t$: ที่ไหนก็ได้ที่ไม่ใช่ที่นี่"
 relation_upgrade.1002.desc:0 "ข้าติดอยู่ในงานเลี้ยงอันน่าทรมานนี้ ( ซึ่ง [terrible_party_host.GetFirstName] ล้มเหลวในการจัดโดยสิ้นเชิง) มานานเหมือน #EMP หลายชั่วโมง#! แล้ว ได้ แต่โบกมืออย่างอ่อนแรงให้ทุกคนที่เดินผ่านไปมา\n\nความคิดที่จะกระโดดลงจากระเบียงนี้เริ่มน่าสนใจขึ้นมา เมื่อข้ารู้สึกว่ามีคนแตะไหล่\n\n"ขออภัย [potential_friend.GetFirstNameNoTooltip]?" [party_root.GetTitledFirstName] กล่าว "ท่านสนใจจะเดินออกไปจากที่นี่หรือไม่?""
 relation_upgrade.1002.a:0 "[ROOT.GetCharacter.GetFaith.HighGodName] ใช่แล้ว ที่ไหนก็ได้ที่ไม่ใช่ที่นี่!"
 relation_upgrade.1002.a.tt:0 "[potential_friend.GetFirstNameNoTooltip] ยอมรับข้อเสนอของท่าน"
 relation_upgrade.1002.b:0 "เอ่อ ขอบคุณ แต่ไม่เป็นไร"
 relation_upgrade.1002.b.tt:0 "[potential_friend.GetFirstNameNoTooltip] ปฏิเสธท่านอย่างสุภาพ"
 relation_upgrade.1002.c:0 "กับ #EMP ท่าน#! น่ะหรือ? ท่านเป็นคนที่น่าเบื่อที่สุดที่นี่!"
 relation_upgrade.1002.c.tt:0 "[potential_friend.GetFirstNameNoTooltip] ใส่ร้ายท่านแทน"

#	Follow-Up, Lover:
 relation_upgrade.1003.t:0 "$relation_upgrade.1001.t$: เดินเล่นใต้แสงจันทร์"
 relation_upgrade.1003.desc:0 "ข้าไม่รู้เลยว่า [terrible_party_host.GetFirstName] เกลี้ยกล่อมให้ข้าเข้าร่วมงานเลี้ยงอันยุ่งเหยิง น่าสะพรึงกลัว และน่าหดหู่ของ[terrible_party_host.GetHerHis]ได้อย่างไร ข้าคิดได้เพียงว่ามันต้องเป็นช่วงเวลาแห่งความบ้าคลั่ง หรืออาจเป็นคำสัญญาว่า [party_root.GetTitledFirstName] อาจจะมาร่วมงานด้วย\n\nข้าเดินผ่าน[party_root.GetHerHis]ไปเมื่อตอนหัวค่ำ แต่[party_root.GetSheHe]ดูเหมือนจะไม่สังเกตเห็นเสียงถอนหายใจอย่างจงใจแสดงความเหงาของข้า หรืออย่างน้อย [party_root.GetSheHe]ก็ไม่ได้ตอบสนอง-\n\n"[potential_lover.GetFirstNameNoTooltip] ที่รักของข้า! สนใจเดินเล่นใต้แสงจันทร์หรือไม่?""
 relation_upgrade.1003.a:0 "[party_root.GetFirstNameNoTooltip] ข้านึกว่าท่านจะไม่ชวนเสียแล้ว!"
 relation_upgrade.1003.a.tt:0 "[potential_lover.GetFirstNameNoTooltip] ยินดียิ่ง"
 relation_upgrade.1003.b:0 "อันที่จริง ข้าคิดว่าข้าชอบท่านในฐานะสหายมากกว่า..."
 relation_upgrade.1003.b.tt_custom_relation:0 "[party_root.GetFirstNameNoTooltip] จะไม่พยายามเป็น [lover|E] ของท่านอีกต่อไป"
 relation_upgrade.1003.b.tt:0 "[potential_lover.GetFirstNameNoTooltip] แค่อยากเป็นสหาย"
 relation_upgrade.1003.c:0 "ไม่ ตอนนี้ข้าไม่รับผู้มาเกี้ยวพาราสี"
 relation_upgrade.1003.c.tt:0 "[potential_lover.GetFirstNameNoTooltip] ไม่ตอบสนองท่าน"

#	Follow-Up, Rival:
 relation_upgrade.1004.t:0 "$relation_upgrade.1001.t$: เสียงกรีดร้องไม่สิ้นสุด"
 relation_upgrade.1004.desc:0 "สาบานต่อ [ROOT.GetCharacter.GetFaith.HighGodName] เถอะ [terrible_party_host.GetFirstName] จัดงานเลี้ยงไม่ได้เรื่องพอจะช่วยชีวิต [terrible_party_host.GetHerHis] เลยจริงๆ! ไม่มีดนตรี อาหารจืดชืด ไม่มีการเต้นรำ แทบไม่มีแสงสว่าง และ [terrible_party_host.GetSheHe] ยังเชิญเจ้าคนถ่อยนั่น [party_root.GetTitledFirstName] มาอีก!\n\n"$relation_upgrade.1001.c$" [party_root.GetWomanMan] ที่น่ารำคาญตะโกนข้ามห้อง ดึงดูดความสนใจของแขกที่ง่วงเหงาทั้งหมด และเดินตรงมาหาข้า เห็นได้ชัดว่าตั้งใจจะมาต่อว่าข้าด้วยความคิดเห็น [party_root.GetHerHis]"
 relation_upgrade.1004.a:0 "โอ้ เจ้าอยากฟังความจริง #EMP แท้ๆ#! บ้างไหม ไอ้คนพาล?"
 relation_upgrade.1004.a.tt:0 "[potential_rival.GetFirstNameNoTooltip] โกรธเกรี้ยวกลับ"
 relation_upgrade.1004.b:0 "นี่มันต่ำชั้นเกินไปสำหรับข้า"
 relation_upgrade.1004.b.tt:0 "[potential_rival.GetFirstNameNoTooltip] ปฏิเสธที่จะลดตัวลงมาเทียบเท่าท่าน"
 relation_upgrade.1004.c:0 "บางที... บางทีเราอาจเป็นสหายกันแทนได้?"

#	Other:
 aloof_but_alluring_modifier:0 "เย็นชา แต่เย้ายวน"
 aloof_but_alluring_modifier_desc:0 "ตัวละครนี้ดูเหมือนจะเข้าถึงยาก แต่กลับสร้างความลึกลับน่าค้นหาอย่างปฏิเสธไม่ได้..."
 inured_to_boredom_modifier:0 "ชินชากับความเบื่อหน่าย"
 inured_to_boredom_modifier_desc:0 "ตัวละครนี้คุ้นเคยกับความน่าเบื่อหน่ายทางสังคมแล้ว"

# relation_upgrade.2001-2999

 relation_upgrade.2101.t:0 "ความสัมพันธ์อันไม่ดีงาม"
 relation_upgrade.2101.desc_opening:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U], โรคนี้ติดต่อได้, โปรดระวัง!"\n\n"
 relation_upgrade.2101.desc_opening_physician:0 "[physician.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('physician'))] ของข้ารั้งตัวข้าไว้ ศพที่เป็นโรคของสามัญชน –"
 relation_upgrade.2101.desc_opening_other:0 "ศพที่เป็นโรคของสามัญชน –"
 relation_upgrade.2101.desc_bubonic_plague:0 "ปกคลุมไปด้วยฝีขนาดใหญ่ที่มีหนองและเลือดไหลซึม –"
 relation_upgrade.2101.desc_smallpox:0 "ผิวหนังมีผื่นและตุ่มขึ้นเต็มไปหมด –"
 relation_upgrade.2101.desc_ending:0 "วางอยู่บนโต๊ะ ใครก็ตามที่สัมผัสศพเสี่ยงต่อการติดเชื้อ และ... และข้า #EMP กำลัง#! วางแผนการเดินทางที่จะพาข้าไปใกล้ [rival_capital.GetNameNoTierNoTooltip] ที่พำนักของ [rival.Custom2('MyCharacterIntroduction', ROOT.Char)]..."
 relation_upgrade.2101.a:0 "ยิงมันไปทาง [rival_capital.GetNameNoTierNoTooltip]!"
 relation_upgrade.2101.a_tt:0 "ใครบางคนในราชสำนักของ[rival.GetHerHis]อาจติดโรคได้!"
 relation_upgrade.2101.a_tt_rival:0 "[rival.GetTitledFirstName] อาจจะกลายเป็นคู่ปรับของท่าน"
 relation_upgrade.2101.a_tt_nemesis:0 "[rival.GetTitledFirstName] อาจจะกลายเป็นศัตรูคู่อาฆาตของท่าน"
 relation_upgrade.2101.b:0 "ศพอาจมีเบาะแสเกี่ยวกับต้นกำเนิดของโรค"
 relation_upgrade.2101.b_tt:0 "ข้าราชสำนักคนหนึ่งของท่านติดโรค"
 relation_upgrade.2101.b_tt_2:0 "การระบาดของโรคใน [capital.GetNameNoTooltip]"
 relation_upgrade.2101.c:0 "[peasant.GetSheHe|U] จะได้รับการฝังอย่างสมเกียรติ"

 relation_upgrade.2102.desc_opening:1 "ขบวนผู้ติดตามของ [corpse_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] หยุดอยู่ห่างจาก [rival_capital.GetNameNoTier] พอสมควร ก่อนที่ข้าจะมีเวลาส่งทูตออกไป บางสิ่งก็ถูกยิงจากค่ายของพวกเขามายัง [rival.Custom('ResidenceBuilding')] ของข้า\n\nศพที่แหลกเหลว ถูกทำลายโดยโรคภัย ตกลงมาจากท้องฟ้า;"
 relation_upgrade.2102.desc_bubonic_plague:0 "ปกคลุมไปด้วยฝีขนาดใหญ่ที่มีหนองและเลือดไหลซึม ซึ่งมองเห็นได้แม้จากที่ที่ข้ายืนอยู่"
 relation_upgrade.2102.desc_smallpox:0 "ผิวหนังมีผื่นและตุ่มขึ้นเต็มไปหมด ซึ่งมองเห็นได้แม้จากที่ที่ข้ายืนอยู่"
 relation_upgrade.2102.desc_ending:0 "\n\nมันตกลงมาพร้อมเสียงแฉะๆ กระจายเลือด ลำไส้ และความตื่นตระหนก"
 relation_upgrade.2102.a:0 "เก็บ[peasant.GetHerHim]ขึ้นมา – เราจะยิงศพกลับไป!"
 relation_upgrade.2102.b:0 "ศพนี้ควรได้รับการศึกษา"
 relation_upgrade.2102.tt:0 "ข้าราชสำนักคนหนึ่งของ[rival.GetTitledFirstNamePossessive]ติดโรค"
 relation_upgrade.2102.b_tt_2:0 "การระบาดของโรคใน [rival_capital.GetNameNoTooltip]"


 # Character is very passionate about something
 relation_upgrade.2001.t:0 "ความสนใจอันแรงกล้า"
 relation_upgrade.2001.lover_dinner.desc:0 "ในมื้อค่ำ,"
 relation_upgrade.2001.lover_party.desc:0 "ในงานเลี้ยงอาหารค่ำที่ [lover_1_location.GetNameNoTooltip],"
 relation_upgrade.2001.lover.desc:0 "ข้าเลือกที่นั่งอย่างมีกลยุทธ์ถัดจาก [lover_1.GetTitledFirstName] ผู้ [lover_1.Custom('ComplimentAdjective')] [lover_1.GetSheHe|U] ได้ชวนข้าสนทนาเกี่ยวกับ [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.soulmate.desc:0 "[lover_1.GetTitledFirstName] [lover_1.Custom('LoverPetName')] ของข้า กำลังเล่นผมของข้าอย่างเหม่อลอยขณะที่[lover_1.GetSheHe]เล่าให้ข้าฟังเกี่ยวกับ [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.relates.desc:0 "\n\nมุมมองของ[lover_1.GetHerHis|U]นั้นน่าสนใจ แต่ความหลงใหลในหัวข้อนั้นของ[lover_1.GetHerHis]ต่างหากที่ข้าชื่นชมมากที่สุด ยิ่ง[lover_1.GetSheHe]เจาะลึกลงไปเท่าไร [lover_1.GetSheHe]ก็ยิ่งมีชีวิตชีวามากขึ้นเท่านั้น และดวงตาอันงดงามของ[lover_1.GetHerHis]ก็เปล่งประกาย #EMP เจิดจ้า#! อย่างแท้จริง ข้าคิดว่าข้าสามารถฟัง[lover_1.GetHerHim]ได้ตลอดไป"
 relation_upgrade.2001.does_not_relate.desc:0 "\n\nแม้ว่าข้าจะรู้เรื่อง เช่นนี้น้อยนัก แต่ข้ากลับรู้สึกหลงใหลในความมุ่งมั่นของ[lover_1.GetHerHis]ที่มีต่อหัวข้อนั้น ดวงตาอันงดงามของ[lover_1.GetHerHis|U]เปล่งประกาย #EMP เจิดจ้า#! อย่างแท้จริง และความเข้าใจอันลึกซึ้งเบื้องหลังคำพูดของ[lover_1.GetHerHis]ก็ชัดเจน แม้กระทั่งกับมือใหม่อย่างข้า ข้าคิดว่าข้าสามารถฟัง[lover_1.GetHerHim]ได้ตลอดไป"
 relation_upgrade.2001.a:0 "เราจะคุยกันต่อในที่ที่เป็นส่วนตัวกว่านี้ดีหรือไม่?"
 relation_upgrade.2001.a.success:0 "[lover_1.GetShortUIName|U] ยอมรับข้อเสนอของท่าน"
 relation_upgrade.2001.a.failure:0 "[lover_1.GetShortUIName|U] ไม่เข้าใจนัยยะ"
 relation_upgrade.2001.b:0 "[lover_1.GetFirstNameNoTooltip] — ข้าคิดว่าข้ารักท่าน"
 relation_upgrade.2001.b.success:0 "[lover_1.GetShortUIName|U] รู้สึก เช่นเดียวกัน"
 relation_upgrade.2001.b.failure:0 "[lover_1.GetShortUIName|U] ไม่ได้รู้สึก เช่นเดียวกัน"
 relation_upgrade.2001.c:0 "น่าสนใจยิ่งนัก! ท่านช่วยอธิบายอีกครั้งได้หรือไม่?"

 relation_upgrade.2002.lover_dinner.desc:0 "ในมื้อค่ำ ข้าพบว่าตนนั่งอยู่ถัดจาก [lover_2.GetTitledFirstName] ผู้ [lover_2.Custom('ComplimentAdjective')]"
 relation_upgrade.2002.lover_party.desc:0 "[lover_2.GetTitledFirstName] ผู้ [lover_2.Custom('ComplimentAdjective')] เป็นแขกที่ไม่คาดคิด แต่ยินดีต้อนรับในงานเลี้ยงอาหารค่ำของข้า"
 relation_upgrade.2002.lover.desc:0 "เราลงเอยด้วยการพูดคุยเกี่ยวกับ [lover_1.Custom('my_subject_of_interest')] — หัวข้อที่ข้าสามารถใช้เวลาหลายชั่วโมงได้ เป็นที่น่ายินดีของข้า [lover_2.GetFirstNameNoTooltip] เป็นผู้ฟังที่ยอดเยี่ยม ความสนใจของ[lover_2.GetHerHis|U]ในสิ่งที่ข้าพูดดูเหมือนจะจริงใจอย่างแท้จริง และคำถามติดตามของ[lover_2.GetHerHis]ก็รอบคอบและชาญฉลาด\n\nไม่ทันรู้ตัว เราก็เป็นเพียงสองคนที่เหลืออยู่ที่โต๊ะอาหารค่ำ ขณะที่ [lover_2.GetFirstNameNoTooltip] เอนตัวเข้ามาใกล้เพื่อฟังข้าชัดขึ้น ข้าสัมผัสได้ถึงชีพจรที่เต้นเร็วขึ้น..."
 relation_upgrade.2002.c.lover:0 "เอ่อ ใช่ อย่างที่ข้ากำลังพูด..."
 relation_upgrade.2002.soulmate.desc:0 "ข้ากำลังเล่นกับ [lover_2.GetTitledFirstNamePossessive] [lover_2.Custom('LoverPetName')] ของข้าอย่างเหม่อลอย ศีรษะของ[lover_2.GetHerHis]พิงอยู่กับอกข้า ขณะที่ข้าเล่าให้[lover_2.GetHerHim]ฟังเกี่ยวกับ [lover_1.Custom('my_subject_of_interest')] [lover_2.GetSheHe|U] เป็นผู้ฟังที่ยอดเยี่ยม — ให้กำลังใจข้าด้วยเสียงฮัมเบาๆ และการพยักหน้า และถามคำถามที่รอบคอบ วิธีที่[lover_2.GetSheHe]ใส่ใจอย่างแท้จริงเกี่ยวกับหัวข้อที่ใกล้หัวใจข้ามาก ทำให้ข้ารู้สึกอบอุ่นใจ"
 relation_upgrade.2002.c.soulmate:0 "ท่านเป็นผู้ฟังที่ดีมาก รู้ตัวหรือไม่?"

 relation_upgrade.2003.lover.desc:0 "ขณะที่ข้าเอนตัวเข้าไปและเสนอแนะ ประกายในดวงตาของ[lover_1.GetFirstNamePossessive]ก็เปลี่ยนเป็นประกายแห่งความปรารถนาอีกแบบหนึ่ง [lover_1.GetSheHe|U] ลังเลอยู่ครู่หนึ่ง แก้มของนางแดงขึ้น แต่ความขัดแย้งในใจของ[lover_1.GetHerHis]ก็คลี่คลายอย่างรวดเร็ว\n\n"รอที่นี่สักครู่ เพื่อไม่ให้ใครสงสัย แล้วค่อยมาที่ห้องของข้า" ขณะที่ [lover_1.GetFirstNameNoTooltip] รีบจากไป ข้าไม่อาจละสายตาจาก[lover_1.GetHerHim]ได้"
 relation_upgrade.2003.soulmate_start.desc:0 "คำประกาศความรักของข้า ทำให้ [lover_1.GetFirstName] ประหลาดใจ มือของ[lover_1.GetHerHis|U]ที่อยู่ในผมของข้านิ่งไป และข้าสัมผัสได้ถึงหัวใจของ[lover_1.GetHerHis]ที่เต้นแรงกระทบแก้มข้า หัวใจของข้าเองก็เต้นแรงไม่แพ้กัน\n\n"
 relation_upgrade.2003.soulmate_end.desc:0 ""จริงหรือ [lover_2.GetFirstNameNoTooltip]? ข้ารู้สึก เช่นเดียวกันมานานแล้ว แต่ข้าไม่เคยคิดเลยว่า..."\n\nจุมพิตที่ตามมาคือสิ่งที่หอมหวานที่สุดที่ข้าเคยรู้จัก"
 relation_upgrade.2003.a:0 "ช่างเป็น [lover_1.GetWomanMan] ที่ยอดเยี่ยม!"
 relation_upgrade.2003.b:0 "ข้าคือ [lover_2.GetWomanMan] ที่มีความสุขที่สุดใน [realm.GetNameNoTierNoTooltip]!"

 relation_upgrade.2004.lover.desc:0 "[lover_1.GetFirstName] ไม่เข้าใจนัยยะของข้า — หรือบางที[lover_1.GetSheHe]อาจแสร้งทำเป็นไม่รู้เพื่อช่วยข้าจากความอับอายที่จะถูกปฏิเสธ\n\nบทสนทนาของเราเกี่ยวกับ [lover_1.Custom('my_subject_of_interest')] ดำเนินต่อไป โชคดีที่ความสนใจของ [lover_1.GetFirstNameNoTooltip] ในหัวข้อนั้นบดบังความอึดอัดของข้า"
 relation_upgrade.2004.soulmate_end.desc:0 ""ข้าห่วงใยท่าน [lover_2.GetFirstNameNoTooltip] และข้ามีความสุขกับเวลาที่เราอยู่ด้วยกัน เราปล่อยมันไว้แค่นั้นได้หรือไม่?"\n\nหลังจากคำขอโทษที่น่าอึดอัด ข้าก็กลับไปสู่บทสนทนาเกี่ยวกับ [lover_1.Custom('my_subject_of_interest')] อย่างสิ้นหวังเพื่อขจัดความตึงเครียดระหว่างเรา"
 relation_upgrade.2004.a:0 "ข้าช่างโง่เขลาที่คิดไปเอง เช่นนั้น..."
 
 relation_upgrade.3000.t:0 "ความเกลียดชังที่ผลิบาน"
 relation_upgrade.3000.desc:0 "[rival_to_be.GetFirstName] เจ้า[rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.Custom2('InsultNoun', ROOT.Char)] ทำให้ข้าเลือดขึ้นหน้า! [ROOT.GetCharacter.GetFaith.HighGodName] ทรงเห็นสมควรสาปแผ่นดินนี้ด้วย [rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.Custom2('InsultNounPlural', ROOT.Char)] ของ[rival_to_be.GetFirstNamePossessiveNoTooltip] ได้อย่างไร!? ไม่, มันชัดเจนอยู่แล้ว — [rival_to_be.GetSheHe] คือญาติของ[ROOT.GetCharacter.GetFaith.DevilNamePossessive] [rival_to_be.GetSheHe|U] เลวร้ายยิ่งกว่าฝีหนองเน่าเฟะและตั๊กแตนที่ตะกละตะกลาม\n\nข้าทนไม่ได้แม้ แต่ #EMP แค่คิด#! ว่าต้องหายใจร่วมอากาศ[rival_to_be.Custom2('InsultAdjective', ROOT.Char)] เดียวกับ[rival_to_be.GetHerHim]! ข้าต้องทำอะไรสักอย่าง, ข้าต้องลงมือ\n\nสติสัมปชัญญะของข้าขึ้นอยู่กับมัน"
 relation_upgrade.3000.a:0 "ข้าจะไม่หยุดพักจนกว่า [rival_to_be.GetFirstNameNoTooltip] จะตายและถูกฝัง..."
 relation_upgrade.3000.b:0 "ไม่! ข้าไม่สามารถปล่อยให้การแก้แค้นครอบงำชีวิตข้าได้!"
 
 driven_by_vengeance_modifier:0 "ขับเคลื่อนด้วยการแก้แค้น"
 driven_by_vengeance_modifier_desc:0 "ตัวละครนี้พบแรงจูงใจในการมุ่งหมายความตายของคู่ปรับ"
