l_english: 
 trait_specific_ongoing.1001.t:0 "การเปิดเผยอันแตกสลาย"
 trait_specific_ongoing.1001.desc:0 "ข้าตบมือลงบนโครงเตียงเพื่อความแน่ใจ ขณะที่ข้ามองลงไป, ข้าเห็นรอยร้าวพาดผ่านมือข้างหนึ่ง – ความกลัวของข้าเป็นจริงแล้ว! ข้าทำมาจากแก้ว!\n\nข้าจะต้องเคลื่อนไหวอย่างนุ่มนวลและช้าๆ, ไม่มีการเคลื่อนไหวที่รุนแรง, ไม่มีการร้องเพลงเสียงสูง..."
 trait_specific_ongoing.1001.a:0 "อย่าให้ผู้ใดแตะต้องข้า!"

 trait_specific_ongoing.1003.t:0 "สหายหมีของข้า"
 trait_specific_ongoing.1003.desc:0 "ข้าเข้าไปใน [ROOT.Char.Custom('GetChamber')] ของข้าและพบว่าตัวเองกำลังเผชิญหน้ากับหมีตัวใหญ่\n\n"โอ้, เจ้าขนปุยน้ำตาล! เจาทิ้งเพื่อนของเจ้าหรือ?" ข้าถามนาง, เกลี้ยกล่อมให้นางตามมา\n\nขณะที่เราก้าวออกไปข้างนอก, เสียงอึกทึกครึกโครมก็ดังขึ้น — สัตว์ทุกตัวที่ข้าสามารถหามาได้ทักทายข้าพร้อมกัน!"
 trait_specific_ongoing.1003.a:0 "เจ้าพวกน่ารักของข้า! ข้าจะหาเพื่อนให้พวกเจ้าเพิ่มอีก!"
 trait_specific_ongoing.1003.a.flavor:0 "ขณะที่เราออกไป, เจ้าขนปุยน้ำตาลตามข้ามา"
 trait_specific_ongoing.1003.b:0 "ข้า... ข้าควรขายพวกมันไป, ใช่หรือไม่?"

 trait_specific_ongoing.1004.t:0 "ห่อความสุขเล็กๆ"
 trait_specific_ongoing.1004.desc:0 "ตามคำสั่งของข้า สัตว์ทุกตัวที่เข้ามาใน [court_location.Custom('BaronyTownType')] แห่ง [court_location.GetNameNoTier] จะถูกนำมาให้ข้า\n\n"
 trait_specific_ongoing.1004.desc_cat:0 "คนรับใช้ของข้านำสิ่งที่จับมาล่าสุดใส่ตะกร้าสานใบเล็กมาให้ข้า ดวงตา [ROOT.Char.Custom('RandomCatEyeColor')] ของลูกแมวตัวหนึ่งมองลอดขอบตะกร้าออกมาและได้ยินเสียงร้องเหมียวเบาๆ จากข้างใน"
 trait_specific_ongoing.1004.desc_dog:0 "คนรับใช้ของข้านำสิ่งที่จับมาล่าสุดใส่ตะกร้าสานใบเล็กมาให้ข้า ขณะที่ข้ามองเข้าไปข้างใน ข้าพบลูกสุนัขตัวหนึ่งที่เห่าเมื่อเห็นข้าและเริ่มกระดิกหาง!"
 trait_specific_ongoing.1004.a:0 "แมวตัวนี้เป็นของข้าแล้ว!"
 trait_specific_ongoing.1004.b:0 "สุนัขตัวนี้เป็นของข้าแล้ว!"
 trait_specific_ongoing.1004.c_cat:0 "แมว! ขายมันให้ห้องครัว"
 trait_specific_ongoing.1004.c_dog:0 "สุนัข! ขายมันให้คอกสุนัข"

 trait_specific_ongoing.1005.t:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_person'))|U] ผู้ล่วงลับอันเป็นที่รัก"
 trait_specific_ongoing.1005.desc:0 "ขณะที่ข้าเดินอยู่ข้างนอกในคืนที่มีหมอกลงจัด ร่างมายาก็ปรากฏขึ้นทันที, และพูดด้วยเสียงดังกึกก้อง\n\n"[ROOT.Char.GetFirstNameNoTooltip]! นานเกินไปแล้ว!"\n\nนั่นคือ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )] ของข้า, [dead_person.GetTitledFirstName], ผู้ ซึ่งข้าเชื่อว่าได้ [dead_person.GetDeathReason]!"
 trait_specific_ongoing.1005.a:0 "ดีใจที่ท่านไม่ได้เป็น เช่นนั้น!"

 trait_specific_ongoing.1006.desc:0 "เป็นเวลาหนึ่งปีแล้วที่ข้าได้รับการมาเยือนบ่อยครั้งจาก [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )] [dead_person.GetTitledFirstName] ของข้า, วันแล้ววันเล่า [dead_person.GetSheHe|U] ยืนกรานว่าไม่อนุญาตให้ผู้ใดเห็น [dead_person.GetHerHim], แต่ผู้คนเริ่มกังวล...\n\nข้าควรจะจดจ่อกับ [ROOT.Char.Custom('child_object_of_interest')] ของข้าได้อย่างไรเมื่อ [dead_person.GetSheHe] ทำตัว เช่นนี้?!"
 trait_specific_ongoing.1006.a:0 "ปล่อยข้าไว้ตามลำพัง!"

 trait_specific_ongoing.1007.t:0 "ความฝันแห่งแก้ว"
 trait_specific_ongoing.1007.desc:0 "ข้าคลานกลับสู่ความรู้สึกตัวหลังจากหลับลึกจนเกือบสูญเสียตัวเองไป\n\nข้าฝันถึงแผ่นกระจกบานใหญ่ที่พาข้าเข้าใกล้ดวงอาทิตย์มากขึ้นในวังวนแห่งดวงดาว เอื้อมมือไปให้ไกลที่สุดเท่าที่จะทำได้ ข้าคว้าเทหวัตถุบนท้องฟ้าและความรุ่งโรจน์อันลุกโชนของมันได้ — ดึง จนกระทั่งมันโค่นลงและตกลงสู่พื้นโลก การโอบกอดมัน, ข้ารู้สึกถึงความสงบและความอบอุ่นที่ไม่เคยประสบมาก่อน!"
 trait_specific_ongoing.1007.a:0 "ช่างงดงาม, ช่างยิ่งใหญ่!"
 trait_specific_ongoing.1007.a.tt:0 "บัดนี้ข้าสามารถตัดสินใจสร้าง #bold อนุสาวรีย์แก้ว#!"

 trait_specific_ongoing.1008.t:0 "สูญเสียความเป็นจริง "
 trait_specific_ongoing.1008.desc:0 "ข้ากำลังใช้เวลาหนึ่งวันกับสหายของข้า [friend.GetTitledFirstName] เมื่อทันใดนั้นทุกสิ่งก็เริ่มหมุนวน...\n\nสีเทาเหล็ก, สีแดงเลือด, ใบหน้าที่กรีดร้อง, ทะเลสีแดงเข้ม...\n\nข้ารู้สึกตัวในท่าคุดคู้อยู่เหนือร่างของ [friend.GetHerHis], มีดเปื้อนเลือดอยู่ในมือ"
 trait_specific_ongoing.1008.a:0 "[friend.GetFirstNameNoTooltip]! โอ้ ไม่นะ... ข้าต้องซ่อนศพ"
 trait_specific_ongoing.1008.b:0 "ข้าต้องสารภาพ!"

 trait_specific_ongoing.1009.t:0 "เป็นไปไม่ได้ที่จะบาดเจ็บ"
 trait_specific_ongoing.1009.desc:0 ""อย่ากลัว!" ข้าตะโกนจากยอดตึกเพื่อปลอบผู้คนที่รวมตัวกันอยู่เบื้องล่าง "ข้าไม่สามารถได้รับอันตราย!"\n\nข้ากระโดดลงจากขอบอย่างสง่างามและหัวเราะขณะที่ท้องของข้าเสียวซ่าจากการตก"
 trait_specific_ongoing.1009.a:0 "ฮ่าฮ่าฮ่า – อ๊ากกกก!"
 trait_specific_ongoing.1009.a.success:0 "ข้าลงพื้นได้อย่างสมบูรณ์แบบ"
 trait_specific_ongoing.1009.a.failure:0 "ข้าไม่ได้อยู่ยงคงกระพันอย่างที่ข้าคิด"

 trait_specific_ongoing.1010.t:0 "ม้าของข้า [ROOT.Char.Custom('WarhorseStoryName')]"
 trait_specific_ongoing.1010.desc:0 "ม้าศึกที่สวยงามของข้า [ROOT.Char.Custom('WarhorseStoryName')] แบกข้าอย่างง่ายดายต่อหน้า [ROOT.Char.Custom('GetCourt')] ที่รวมตัวกันของข้า\n\n"ม้าตัวนี้คือความสมบูรณ์แบบ! พวกเจ้าทุกคนจะต้องใช้เวลาอย่างน้อยหนึ่งชั่วโมงใน แต่ละวันดูแล [ROOT.Char.Custom('HorseStoryHerHim')], ไม่ว่าจะเป็นการฝึกหรือการดูแลขน [ROOT.Char.Custom('HorseStorySheHe')|U] เป็นที่รักของข้ายิ่งกว่าผู้ใด เลิกแถว""
 trait_specific_ongoing.1010.a:0 "ทุกคนจงคำนับต่อหน้า [ROOT.Char.Custom('HorseStoryHerHim')]!"

 trait_specific_ongoing.1011.t:0 "การสร้างกฎหมาย"
 trait_specific_ongoing.1011.desc:0 "ขณะที่ข้าว่าราชการ ข้าถูกรบกวนสมาธิอยู่เรื่อยๆ ด้วยอาภรณ์อันงดงามของทุกคน ผ้าหรูหรา, อัญมณี – ปัดโธ่!\n\nเหตุใดพวกเขาต้องพยายาม เช่นนั้น? พวกเขาไม่รู้หรือว่าข้ามองเห็นทะลุถึงแก่นแท้ของพวกเขาอยู่แล้ว? สิ่งต่างๆ คงจะง่ายขึ้นหากมีใครสักคน... ห้ามการสวมเสื้อผ้า\n\n...เดี๋ยวก่อน"
 trait_specific_ongoing.1011.a:0 "บัดนี้ห้ามสวมเสื้อผ้า ถอดมันออกไป!"
 all_adult_courtiers:0 "ข้าราชสำนักผู้ใหญ่ทุกคน"

 trait_specific_ongoing.1012.t:0 "นิมิตแห่งความมืด"
 trait_specific_ongoing.1012.desc:0 "ข้าจำไม่ได้ว่ามันเกิดขึ้น, แต่เมื่อข้ากลับไปที่ [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('GetCourtierPlural')] ของข้าบอกข้าทุกอย่าง\n\nข้าวิ่งไปรอบๆ, เตือนผู้คนว่าค้างคาวกำลังมา มากพอที่จะบดบังดวงอาทิตย์, และพา [capital.GetNameNoTier] ไปกับพวกมันยังสถานที่อันน่าสะพรึงกลัวบางแห่งที่ [ROOT.Char.GetFaith.PositiveAfterLife] ไม่สามารถไปถึงได้"
 trait_specific_ongoing.1012.a:0 "เกิดอะไรขึ้นกับข้า..."
 trait_specific_ongoing.1012.b:0 "โอ้, ข้าจะเตรียมพร้อมเมื่อพวกมันมา!"

 ### DIVINE OR WITCHY VISIONS? ###
 trait_specific_ongoing.2001.t:0 "สารจากแดนไกล"
 trait_specific_ongoing.2001.start.desc:0 "ข้ารู้ว่าพวกเขากำลังมา ก่อนที่ข้าจะเห็นพวกเขา ความรู้สึกพลุ่งพล่านอย่างกะทันหันของ"
 trait_specific_ongoing.2001.dread.desc:0 "ความหวาดกลัว,"
 trait_specific_ongoing.2001.anxiety.desc:0 "ความวิตกกังวล,"
 trait_specific_ongoing.2001.euphoria.desc:0 "ความรู้สึกเคลิบเคลิ้ม,"
 trait_specific_ongoing.2001.joy.desc:0 "ความปิติยินดี,"
 trait_specific_ongoing.2001.nausea.desc:0 "ความคลื่นไส้,"
 trait_specific_ongoing.2001.walls.desc:0 "[ROOT.Char.Custom('GetChamber')] ของข้าบีบเข้ามา,"
 trait_specific_ongoing.2001.sulfur.desc:0 "กลิ่นกำมะถันฉุน"
 trait_specific_ongoing.2001.smoke.desc:0 "กลิ่นควันฉุนแสบจมูก"
 trait_specific_ongoing.2001.citrus.desc:0 "รสเปรี้ยวแหลมของส้มบนลิ้นข้า"
 trait_specific_ongoing.2001.lavender.desc:0 "กลิ่นลาเวนเดอร์สดชื่นโชยมา"
 trait_specific_ongoing.2001.bile.desc:0 "กลิ่นน้ำดีฉุนแสบจมูก"
 trait_specific_ongoing.2001.incense.desc:0 "กลิ่นเครื่องหอมที่เอียน"
 trait_specific_ongoing.2001.blood.desc:0 "กลิ่นคาวเลือด"
 trait_specific_ongoing.2001.stand_before_me.desc:0 "- และแล้วพวกเขาก็ยืนอยู่ต่อหน้าข้า\n\n[ROOT.Char.Custom('one_syllable_number')|U]"
 trait_specific_ongoing.2001.glowing.desc:0 "สิ่งมีชีวิตเรืองแสง,"
 trait_specific_ongoing.2001.hazy.desc:0 "เงาร่างเลือนราง,"
 trait_specific_ongoing.2001.dark.desc:0 "สิ่งมีชีวิตมืด,"
 trait_specific_ongoing.2001.shaking.desc:0 "สิ่งมีชีวิตสั่นเทา,"
 trait_specific_ongoing.2001.shimmering.desc:0 "สิ่งมีชีวิตระยิบระยับ,"
 trait_specific_ongoing.2001.speaking.desc:0 "พูดเป็นเสียงประสานของ"
 trait_specific_ongoing.2001.whispers.desc:0 "เสียงกระซิบ"
 trait_specific_ongoing.2001.screeches.desc:0 "เสียงกรีดร้อง"
 trait_specific_ongoing.2001.chimes.desc:0 "เสียงระฆัง"
 trait_specific_ongoing.2001.raindrops.desc:0 "เสียงหยาดฝน"
 trait_specific_ongoing.2001.thunder.desc:0 "เสียงฟ้าร้อง"
 trait_specific_ongoing.2001.end.desc:0 "สิ่งมีชีวิตเหล่านี้คือใคร, และพวกเขาต้องการอะไรจากข้า?"
 trait_specific_ongoing.2001.a:0 "พวกเขาต้องเป็นผู้ส่งสารของ [ROOT.Char.GetFaith.HighGodName]!"
 trait_specific_ongoing.2001.a.success:0 "ท่านโน้มน้าว [clergy.GetCouncilTitle] [clergy.GetShortUIName] ว่านิมิตของท่านศักดิ์สิทธิ์"
 trait_specific_ongoing.2001.a.failure:0 "[clergy.GetCouncilTitle|U] [clergy.GetShortUIName] รู้สึกไม่สบายใจกับเรื่องเล่าของท่าน"
 trait_specific_ongoing.2001.b:0 "นี่คือสิ่งอื่น, พลังที่ลึกซึ้งกว่า, และข้า #EMP ต้องการ#! มัน"
 trait_specific_ongoing.2001.c:0 "ข้า... ข้าแค่เหนื่อย ข้าต้องดูแลตัวเองให้ดีขึ้น"

 trait_specific_ongoing.2001.b.success:0 "ท่านค้นพบความรู้ลับ"
 trait_specific_ongoing.2001.b.success.tt:0 "ท่านมีทางเลือกที่จะยอมรับความจริงใหม่, หรือยังคงศรัทธาต่อ [clergy.GetFaith.HighGodName]"
 trait_specific_ongoing.2001.b.failure:0 "ท่านพบบางเล่มที่น่าสนใจ, แต่เป็นหนังสือธรรมดา"

 trait_specific_ongoing.2002.desc:0 "การค้นหาความรู้ที่สัญญาไว้โดยผู้ส่งสารได้พาข้าไปยังสถานที่ที่ไม่ธรรมดาบางแห่ง ตรอกมืด, โรงเตี๊ยมซอมซ่อ, ร้านหนังสือฝุ่นเขรอะ — ข้าได้ไปในที่ที่ไม่มี [ROOT.Char.GetTitleAsNameNoTooltip] คนใดเคยไปมาก่อน, และรางวัลของข้าก็ยิ่งใหญ่แท้จริง\n\nข้าได้ค้นพบตำราจำนวนหนึ่งเกี่ยวกับ [ROOT.Char.GetFaith.WitchGodName] และพลังอำนาจที่ [ROOT.Char.GetFaith.WitchGodSheHe] ประทานแก่ผู้ติดตามของ [ROOT.Char.GetFaith.WitchGodHerHis] ข้าถูกล่อใจ, นั่นข้าปฏิเสธไม่ได้"
 trait_specific_ongoing.2002.a:0 "[ROOT.Char.GetFaith.WitchGodMistressMaster] แห่งความมืด, ข้าคือผู้รับใช้ที่ต่ำต้อยของท่าน!"
 trait_specific_ongoing.2002.b:0 "ข้าถลำลึกเกินไปแล้ว นี่มันอันตรายเกินไป"

 trait_specific_ongoing.2003.desc:0 "ข้าพบตำราที่น่าสนใจมากมายในการค้นหาความรู้ที่ซ่อนเร้น, แต่ไม่มีอะไรพิเศษอย่างแท้จริง\n\nข้าเกรงว่าข้าอาจตีความเจตจำนงของสิ่งมีชีวิตแปลกประหลาดเหล่านั้นผิดไป — หรือจินตนาการไปเองทั้งหมด!"
 trait_specific_ongoing.2003.a:0 "จิตใจข้ากำลังเล่นตลกกับข้าหรือ?"

 ### WHICH GOD/SAINT IS SPEAKING TO ME? ###
 trait_specific_ongoing.2010.t:0 "การเพ่งจิตถึงพระเจ้า"
 trait_specific_ongoing.2010.possessed_start.desc:0 "ข้าได้รับสารบ่อยครั้งจากสิ่งศักดิ์สิทธิ์สามตน พวกเขามาหาข้าเกือบทุกคืน, ใบหน้าของพวกเขาถูกปกคลุมด้วยแสงศักดิ์สิทธิ์ ข้าคิดว่าพวกเขาต้องเป็นวิญญาณของ"
 trait_specific_ongoing.2010.zeal_start.desc:0 "ตั้งแต่ประมาณหนึ่งเดือนที่ผ่านมา, ข้าฝันซ้ำๆ, ซึ่งข้าสนทนาเรื่องเทววิทยากับ"
 trait_specific_ongoing.2010.health.desc:0 "[ROOT.Char.GetFaith.HealthGodName],"
 trait_specific_ongoing.2010.fertility.desc:0 "[ROOT.Char.GetFaith.FertilityGodName],"
 trait_specific_ongoing.2010.wealth.desc:0 "[ROOT.Char.GetFaith.WealthGodName],"
 trait_specific_ongoing.2010.household.desc:0 "[ROOT.Char.GetFaith.HouseholdGodName],"
 trait_specific_ongoing.2010.knowledge.desc:0 "[ROOT.Char.GetFaith.KnowledgeGodName],"
 trait_specific_ongoing.2010.war.desc:0 "[ROOT.Char.GetFaith.WarGodName],"
 trait_specific_ongoing.2010.trickster.desc:0 "[ROOT.Char.GetFaith.TricksterGodName],"
 trait_specific_ongoing.2010.and_health.desc:0 "และ [ROOT.Char.GetFaith.HealthGodName]"
 trait_specific_ongoing.2010.and_fertility.desc:0 "และ [ROOT.Char.GetFaith.FertilityGodName]"
 trait_specific_ongoing.2010.and_wealth.desc:0 "และ [ROOT.Char.GetFaith.WealthGodName]"
 trait_specific_ongoing.2010.and_household.desc:0 "และ [ROOT.Char.GetFaith.HouseholdGodName]"
 trait_specific_ongoing.2010.and_knowledge.desc:0 "และ [ROOT.Char.GetFaith.KnowledgeGodName]"
 trait_specific_ongoing.2010.and_war.desc:0 "และ [ROOT.Char.GetFaith.WarGodName]"
 trait_specific_ongoing.2010.and_trickster.desc:0 "และ [ROOT.Char.GetFaith.TricksterGodName]"
 trait_specific_ongoing.2010.end.desc:0 "\n\nบางทีพวกเขาอาจเลือกข้าให้เผยแพร่คำสอนของพวกเขา, และตอบแทนข้าด้วยพรของพวกเขาเป็นการตอบแทน? ข้าจะสวดอ้อนวอนต่อ..."
 trait_specific_ongoing.2010.health:0 "[ROOT.Char.GetFaith.HealthGodName] เพื่อสุขภาพและอายุยืน"
 trait_specific_ongoing.2010.fertility:0 "[ROOT.Char.GetFaith.FertilityGodName] เพื่อชีวิตใหม่และความอุดมสมบูรณ์"
 trait_specific_ongoing.2010.wealth:0 "[ROOT.Char.GetFaith.WealthGodName] เพื่อความมั่งคั่งและความอุดมสมบูรณ์"
 trait_specific_ongoing.2010.household:0 "[ROOT.Char.GetFaith.HouseholdGodName] เพื่อครอบครัวที่มีความสุข"
 trait_specific_ongoing.2010.household.tt:0 "[close_family_members|E] และ [spouses|E] ทั้งหมดของท่าน"
 trait_specific_ongoing.2010.knowledge:0 "[ROOT.Char.GetFaith.KnowledgeGodName] เพื่อความรู้และปัญญา"
 trait_specific_ongoing.2010.war:0 "[ROOT.Char.GetFaith.WarGodName] เพื่อความแข็งแกร่งในการรบ.."
 trait_specific_ongoing.2010.trickster:0 "[ROOT.Char.GetFaith.TricksterGodName] เพื่อไหวพริบและโชค"
 trait_specific_ongoing.2010.fallback:0 "ข้าไม่อาจทึกทักเอาว่าตนเองถูกเลือก"


 ### COURT CHAPLAIN WANTS TO TREAT YOU ###
 trait_specific_ongoing.2015.t:0 "โดย [ROOT.Char.GetFaith.HighGodName] จงได้รับการรักษา"
 trait_specific_ongoing.2015.desc:0 "เสาหลักของ [ROOT.Char.GetFaith.HouseOfWorship] เริ่มบิดเบี้ยวยามที่อาการอีกครั้งถาโถมเข้าใส่ข้า ข้ามิได้ส่งเสียงใด แต่ข้ารู้ว่า [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] สังเกตได้ว่ามีบางสิ่งผิดปกติ\n\nภายหลัง [ROOT.Char.Custom('GetReligiousRite')], [chaplain.GetSheHe] ก็เข้ามาหาด้วยสีหน้ากังวลบนใบหน้าของ[chaplain.GetHerHis] "จะต้องเป็น [ROOT.Char.GetFaith.DevilName] และเหล่าสมุนของ [ROOT.Char.GetFaith.DevilHerHis] ที่เข้าครอบงำร่างของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านต้องหันเข้าหา [ROOT.Char.GetFaith.HighGodName] เพื่อความรอดพ้น ก่อนที่ทุกอย่างจะสายเกินไป!""
 trait_specific_ongoing.2015.physician.desc:0 "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ต้องได้ยิน [chaplain.GetHerHim] แน่ๆ "สิ่งที่ [ROOT.Char.GetTitleAsNameNoTooltip] ต้องการคือความสงบและความเงียบ, ไม่ใช่คำขู่เรื่องการลงทัณฑ์!""
 trait_specific_ongoing.2015.a:0 "ข้าจะสวดอ้อนวอนขับไล่ความมืดออกไป"
 trait_specific_ongoing.2015.a.success:0 "การสวดอ้อนวอนได้ผล"
 trait_specific_ongoing.2015.a.failure:0 "อาการชักของท่านยังคงเกิดขึ้น"
 trait_specific_ongoing.2015.b:0 "การอดอาหารจะชำระล้างจิตวิญญาณของข้า"
 trait_specific_ongoing.2015.b.success:0 "การอดอาหารได้ผล"
 trait_specific_ongoing.2015.b.failure_health:0 "การอดอาหาร ทำให้ท่านอ่อนแอลง"
 trait_specific_ongoing.2015.b.failure_eating:0 "ท่านดิ้นรนกับกฎเกณฑ์ที่เข้มงวด"
 trait_specific_ongoing.2015.b.failure_eating.tt:0 "ทัศนคติของท่านต่ออาหารจะเปลี่ยนไป"
 trait_specific_ongoing.2015.c:0 "ท่านจะแนะนำอะไร, [physician.GetFirstNameNoTooltip]?"
 trait_specific_ongoing.2015.c.success:0 "การรักษาของแพทย์ได้ผล"
 trait_specific_ongoing.2015.e:0 "ปล่อยข้าไว้ตามลำพัง!"

 trait_specific_ongoing.2016.physician1.desc:0 "[physician.GetTitledFirstName] บอกให้ข้าพักผ่อนให้เพียงพอและหลีกเลี่ยงวัตถุแวววาว, เสียงดัง และสภาพอากาศที่รุนแรง"
 trait_specific_ongoing.2016.physician2.desc:0 "\n\nคำแนะนำของ [physician.GetHerHis|U] ต้องได้ผล, เพราะข้าไม่มีอาการกำเริบอีกเลยตั้งแต่นั้นมา!"
 trait_specific_ongoing.2016.fasting1.desc:0 "[chaplain.GetTitledFirstName] แนะนำให้ข้ารับประทานอาหารมื้อเล็กเพียงมื้อเดียวในตอนเย็น, และให้รายการอาหารยาวเหยียดที่ต้องงดเว้น ผลิตภัณฑ์นม, เนื้อสัตว์, ไข่, ของหวาน, แอลกอฮอล์, น้ำมัน, เครื่องเทศรสฉุน, ผักที่เติบโตใต้ดิน..."
 trait_specific_ongoing.2016.fasting2.desc:0 "\n\nมันเป็นระเบียบวินัยที่ยากที่จะปฏิบัติตาม, แต่มันต้องได้ผล, เพราะข้าไม่มีอาการกำเริบอีกเลยตั้งแต่นั้นมา!"
 trait_specific_ongoing.2016.prayer1.desc:0 "[chaplain.GetTitledFirstName] บอกให้ข้าใช้เวลาอย่างน้อยสามชั่วโมงต่อวันในการสวดอ้อนวอนอย่างมีสมาธิและชี้แนะข้าไปยังส่วนต่างๆ นับสิบใน [ROOT.Char.GetFaith.ReligiousText] เพื่อการศึกษาเพิ่มเติม"
 trait_specific_ongoing.2016.prayer2.desc:0 "\n\nความทุ่มเทของข้าได้รับรางวัลตอบแทน, เพราะข้าไม่มีอาการกำเริบอีกเลยตั้งแต่นั้นมา!"
 trait_specific_ongoing.2016.a.physician:0 "ข้าขอขอบคุณท่าน, [physician.GetFirstNameNoTooltip]!"
 trait_specific_ongoing.2016.a.chaplain:0 "[ROOT.Char.GetFaith.HighGodName] ทรงฤทธานุภาพ!"

 trait_specific_ongoing.2017.prayer2.desc:0 "\n\nข้าได้พยายามอย่างสุดความสามารถแล้ว, แต่ดูเหมือนว่าข้าไม่คู่ควรกับความเมตตาของ [ROOT.Char.GetFaith.HighGodNamePossessive] อาการกำเริบของข้ายังคงเกิดขึ้นเป็นปกติเหมือนเดิม"
 trait_specific_ongoing.2017.physician2.desc:0 "\n\nข้าได้พยายามอย่างสุดความสามารถที่จะทำตามคำแนะนำของ [physician.GetHerHis], แต่อาการกำเริบของข้ายังคงเกิดขึ้นเป็นปกติเหมือนเดิม"
 trait_specific_ongoing.2017.a:0 "บางทีข้าอาจทำอะไรผิดไป?"

 trait_specific_ongoing.2018.fasting2.desc:1 "\n\nข้าได้พยายามอย่างสุดความสามารถที่จะปฏิบัติตามระเบียบวินัยที่เข้มงวด, แต่ข้ากลับรู้สึกอ่อนแอลงเท่านั้น อาการกำเริบของข้ายังคงเกิดขึ้นเป็นปกติเหมือนเดิม, และความเหนื่อยล้าที่ตามมานั้นจัดการได้ยากยิ่งกว่าเดิม"
 trait_specific_ongoing.2018.a:0 "ข้ายอมแพ้ ข้าต้องการกำลังของข้า"

 trait_specific_ongoing.2019.fasting2.desc:0 "\n\nกฎเกณฑ์นั้นยากที่จะปฏิบัติตาม, และข้าพบว่าตัวเองหมกมุ่นอยู่กับทุกรายละเอียดเล็กน้อย อาหารอยู่ในความคิดคำนึงของข้าตลอดเวลา"
 trait_specific_ongoing.2019.a:0 "ไม่มีใครรู้หรอกถ้าข้าแหกกฎ... แค่นิดหน่อย!"
 trait_specific_ongoing.2019.b:0 "ข้าล้มเหลวไม่ได้ — มีเดิมพันสูงเกินไป!"


 ### POSSESSED REOCCURANCE EVENT ### 
 trait_specific_ongoing.2020.t:0 "ความรู้สึกที่คุ้นเคย"
 trait_specific_ongoing.2020.a:0 "ไม่นะ! ข้า #EMP ปฏิเสธ#!! นี่ #EMP ไม่ได้#! เกิดขึ้น..."
 trait_specific_ongoing.2020.start.desc:0 "ความรู้สึกพลุ่งพล่านอย่างกะทันหันของ"
 trait_specific_ongoing.2020.dread.desc:0 "ความหวาดกลัว"
 trait_specific_ongoing.2020.fear.desc:0 "ความกลัว"
 trait_specific_ongoing.2020.anxiety.desc:0 "ความวิตกกังวล"
 trait_specific_ongoing.2020.nausea.desc:0 "ความคลื่นไส้"
 trait_specific_ongoing.2020.anger.desc:0 "ความโกรธ"
 trait_specific_ongoing.2020.end.desc:0 "ถาโถมเข้าใส่ข้าขณะที่พื้นเริ่มบิดเบี้ยวใต้ฝ่าเท้าของข้า แม้ว่าข้าจะรอดพ้นมาได้ระยะหนึ่งแล้ว, ข้าก็จำสัญญาณได้ทันที\n\nข้าหนีไปยังห้องพักของข้าก่อนที่ข้าจะเริ่มร้องไห้ — หรือสูญเสียการควบคุมร่างกายไปโดยสิ้นเชิง..."

 trait_specific_ongoing.2025.t:0 "ไม่มีที่ซ่อน"
 trait_specific_ongoing.2025.start.desc:0 "[dummy_gender.GetWomanMan] ที่อยู่ตรงหน้าข้าดูแปลกๆ ใบหน้าของ [dummy_gender.GetHerHis|U] บิดเบี้ยว... กำลังบิดเบี้ยว? [dummy_gender.GetSheHe] เป็นมนุษย์หรือเปล่า?\n\nความเป็นจริง #EMP เซถลา#!, และข้าตระหนักว่าข้ากำลังมี [ROOT.Char.Custom('PossessedEpisode')] อีกครั้ง — และต่อหน้า [ROOT.Char.Custom('GetCourt')] ที่รวมตัวกันของข้า ขณะที่"
 trait_specific_ongoing.2025.end.desc:0 "เต็มรูจมูกข้า, ข้าพยายามพูด, แต่ริมฝีปากข้าไม่ขยับ"
 trait_specific_ongoing.2025.a:0 "ข้าต้องออกไปจากที่นี่, ก่อนที่มันจะแย่ลง!"
 trait_specific_ongoing.2025.b:0 "ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] — ข้าไม่สนใจว่าพวกเขาจะคิดอย่างไร"
 trait_specific_ongoing.2025.b.success:0 "[ROOT.Char.Custom('GetCourtierPlural')] ของท่านประทับใจในความกล้าหาญของท่าน"
 trait_specific_ongoing.2025.b.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] ของท่านรู้สึกขยะแขยง"
 trait_specific_ongoing.2025.c:0 "[helper.GetFirstNameNoTooltip] อยู่ที่ไหน? ข้าต้องการความช่วยเหลือจาก [helper.GetHerHis]!"
 trait_specific_ongoing.2025.d:0 "มันเป็นสารจาก [ROOT.Char.GetFaith.HighGodName]! ข้าจะบอกพวกเขา!"
 trait_specific_ongoing.2025.d.success:0 "[ROOT.Char.Custom('GetCourtierPlural')] ของท่านเชื่อท่าน"
 trait_specific_ongoing.2025.d.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] ของท่านคิดว่าท่านกำลังโกหก"
 trait_specific_ongoing.2025.e:0 "ข้าอาจแสร้งทำเป็นนิมิตจาก [ROOT.Char.GetFaith.HighGodName]..."
 trait_specific_ongoing.2025.e.failure:0 "[ROOT.Char.Custom('GetCourtierPlural')] ของท่านมองทะลุแผนการของท่าน"
 trait_specific_ongoing.2025.every_courtier:0 "ทุก [actor.Custom('GetCourtier')]"



 trait_specific_ongoing.3001.t:0 "ความทุกข์รักพวกพ้อง"
 trait_specific_ongoing.3001.desc:0 "[sympathetic_character.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sympathetic_character') )] ของข้า เข้ามาหาขณะที่ข้ากล่าวปราศรัยต่อ [ROOT.Char.Custom('GetCourt')] เสร็จสิ้น โดยที่ผู้คนยังคงสังสรรค์กันอยู่\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าได้ยินมาว่าท่านเองก็ทนทุกข์จากช่วงเวลา... หดหู่เศร้าหมอง เช่นกัน บางทีเราอาจหารือถึงประสบการณ์ของเราได้กระมัง?""
 trait_specific_ongoing.3001.a:0 "มาเถิด, เรามีเรื่องต้องคุยกันมาก"
 trait_specific_ongoing.3001.b:0 "ข้าไม่มีปัญหา เช่นนั้น! ท่านกำลังพูดถึงอะไร?!"
 trait_specific_ongoing.3001.b.tt:0 "อะฮ่าฮ่า... ฮ่า"

 trait_specific_ongoing.3002.t:0 "ทางแก้ระยะยาว"
 trait_specific_ongoing.3002.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [court_physician.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] ของข้า เข้ามาหาข้าในเย็นวันหนึ่ง "ข้ามีตัวยาบางอย่างที่เราอาจลองใช้กับอาการเศร้าซึมเรื้อรังของท่าน มันอาจจะแย่ลงเล็กน้อยก่อนจะดีขึ้น แต่มันก็คุ้มที่จะลองนะ!""
 trait_specific_ongoing.3002.a:0 "ข้าจะทำทุกอย่างเพื่อกำจัดสิ่งนี้ออกไป"
 trait_specific_ongoing.3002.b:0 "ทั้งหมดที่ข้าต้องการคือการงีบหลับยาวๆ หรือสามครั้ง"

 trait_specific_ongoing.3003.desc:0 ""เพื่อรักษาความทุกข์ทรมานประเภทนี้ สิ่งสำคัญอย่างยิ่งคือการระบายความคิดที่ไม่ดีออกมา," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้ารับรองกับข้า "มาหาข้าสองสามครั้งทุกสัปดาห์, และเราจะพูดคุยเกี่ยวกับสิ่งที่ถ่วงใจท่าน""
 trait_specific_ongoing.3003.a:0 "ข้าจะสละเวลา"
 trait_specific_ongoing.3003.b:0 "นี่มันมากเกินไปสำหรับข้า – ข้าจะกลับไปนอน"

 trait_specific_ongoing.3004.desc:0 ""เพื่อให้ท่านรู้สึกดีขึ้น เราต้องจัดการทั้งความคิดและกิจวัตรของท่าน," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้าแจ้งให้ข้าทราบ "ข้าจะช่วยท่านระบุความคิดและนิสัยเชิงลบของท่านและทำงานเพื่อเปลี่ยนแปลงสิ่งเหล่านี้""
 trait_specific_ongoing.3004.a:0 "สมเหตุสมผล!"

 trait_specific_ongoing.3005.desc:0 ""การออกกำลังกายและการกระตุ้นร่างกายมีประสิทธิภาพในการปรับสมดุลธาตุในร่างกายของท่าน," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้าบอกข้า "ท่านจะต้องเดินรอบ [ROOT.Char.Custom('ResidenceBuilding')] ของท่านสามรอบทุกวัน""
 trait_specific_ongoing.3005.a:0 "ข้าจะ ทำให้ดีที่สุด"

 trait_specific_ongoing.3006.desc:0 ""ความคิดที่ไม่ดีเหล่านี้และความเศร้าโศกนี้เป็นผลมาจากวิญญาณชั่วร้ายหรือปีศาจอย่างชัดเจน," [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้าบอกข้า "เราจะมอบหมายให้ [ROOT.Char.Custom('DefaultPriestTitle')] สวดอ้อนวอนให้ท่านเพื่อขับไล่ความชั่วร้ายภายใน""
 trait_specific_ongoing.3006.a:0 "พลังของ [ROOT.Char.GetFaith.HighGodName] จะรักษาข้า!"

 trait_specific_ongoing.3007.desc:0 "หลังจากทุกสิ่งที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้าได้ให้ข้าผ่านพ้นมา ข้าค่อยๆ ตระหนักว่าข้ากำลัง #EMP รู้สึก#! ถึงสิ่งต่างๆ อีกครั้ง"
 trait_specific_ongoing.3007.desc_ending:0 "\n\nเหมือนดวงอาทิตย์ที่ส่องผ่านเมฆหนาทึบ ข้ารู้สึกถึงความสุขที่ซึมซาบกลับเข้ามาในจิตวิญญาณของข้า"
 trait_specific_ongoing.3007.a:0 "ข้า... ข้ามีความสุข!"

 trait_specific_ongoing.3008.desc_physician_died:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้าเสียชีวิตก่อนที่ [court_physician.GetSheHe] จะสามารถรักษาความเศร้าโศกของข้าให้เสร็จสิ้นได้, แต่คำแนะนำที่ [court_physician.GetSheHe] ทิ้งไว้ช่วยให้ข้าทำการรักษาด้วยตนเองจนสำเร็จ"
 trait_specific_ongoing.3008.desc_no_depression:0 "ข้าไม่จำเป็นต้องทำตามกิจวัตรที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] ของข้ากำหนดไว้เพื่อกำจัดความเศร้าโศกของข้า เนื่องจากข้าพ้นจากความทุกข์ทรมานนั้นแล้ว!"
 trait_specific_ongoing.3008.desc_fallback: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] ของข้า [court_physician.GetTitledFirstName] ยังไม่เสร็จสิ้นการรักษาของ[court_physician.GetHerHis]เกี่ยวกับอาการเศร้าโศกของข้า แต่ข้ารู้สึกว่าความมืดมนกำลังจางหายไป"

 trait_specific_ongoing.3009.t:0 "วันอันหนักอึ้ง"
 trait_specific_ongoing.3009.desc:0 "วันหนึ่งผ่านไปอีกวันหนึ่ง, อย่างไม่หยุดยั้ง, แม้ว่าจิตใจของข้าจะจมอยู่ในความเหนื่อยล้าและความสิ้นหวัง\n\nบางครั้งแม้ แต่การลุกจากเตียงในตอนเช้าก็มากเกินไปสำหรับข้า"
 trait_specific_ongoing.3009.a:0 "ข้าแค่ต้องนอนลง..."

 ### Someone thinks you're slothful ###
 trait_specific_ongoing.3015.t:0 "คำพูดเสียดสี"
 trait_specific_ongoing.3015.start.desc: "ไม่ว่าจะเป็นคำพูดประชดประชันหรือสายตาที่ไม่เห็นด้วย [unsympathetic.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็แสดงความรังเกียจของ[unsympathetic.GetHerHis]ต่ออาการของข้าอยู่เสมอ ขณะที่ข้า"
 trait_specific_ongoing.3015.council.desc:0 "รีบไปประชุมสภา, สายอีกแล้ว,"
 trait_specific_ongoing.3015.withdraw.desc:0 "ลุกขึ้นเพื่อออกจากอาหารค่ำก่อนเวลา,"
 trait_specific_ongoing.3015.book.desc:0 "ตระหนักว่าข้าลืมหนังสือที่ [unsympathetic.GetSheHe] ให้ข้ายืม,"
 trait_specific_ongoing.3015.end.desc:0 "ข้ารู้แน่ชัดว่า [unsympathetic.GetSheHe] จะตอบสนองอย่างไร\n\n"ทำไมข้าถึงยังต้องแปลกใจอีก," [unsympathetic.GetTitledFirstNameNoTooltip] พูดพร้อมถอนหายใจ, และหัวใจข้าก็ห่อเหี่ยว "
 trait_specific_ongoing.3015.a:0 "ข้าจะพิสูจน์ให้ [unsympathetic.GetHerHim] เห็นว่าคิดผิด!"
 trait_specific_ongoing.3015.b:0 ""หุบปาก ไอ้ [unsympathetic.Custom2('InsultNoun', ROOT.Char)] [unsympathetic.Custom2('InsultAdjective', ROOT.Char)]!""
 trait_specific_ongoing.3015.c:0 "[unsympathetic.GetSheHe|U] พูดถูก ข้าไร้ค่า..."
 trait_specific_ongoing.3015.a.success:0 "ข้าเอาชนะความเซื่องซึมของข้าได้"
 trait_specific_ongoing.3015.a.neutral:0 "ข้ายังคงเหนื่อย"
 trait_specific_ongoing.3015.a.failure:0 "การฝืนตัวเองนั้นเหนื่อยล้า"
 

 trait_specific_ongoing.5001.t:0 "การพบปะเนื้อส่วนตัว"
 trait_specific_ongoing.5001.desc_opening:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim') )] [victim.GetTitledFirstName] ของข้าและข้าพบว่าตัวเองอยู่ตามลำพังขณะที่ส่วนที่เหลือของ [ROOT.Char.Custom('GetCourt')] ได้เดินทอดน่องไปนอนหลับแล้ว\n\n"
 trait_specific_ongoing.5001.desc_small:0 "ขณะที่เราพูดคุยกัน ข้าอดไม่ได้ที่จะสังเกตเห็นแขนที่เต็มไปด้วยเส้นเอ็นของ [victim.GetHerHis], เนื้อหนังที่ตึงอยู่ข้างใต้..."
 trait_specific_ongoing.5001.desc_big:0 "ขณะที่เราพูดคุยกัน ข้าอดไม่ได้ที่จะสังเกตเห็นแขนอวบอ้วนของ [victim.GetHerHis], เนื้อและไขมันที่กองรวมกันเป็นเนินชุ่มฉ่ำ..."
 trait_specific_ongoing.5001.desc:0 "ขณะที่เราพูดคุยกัน ข้าอดไม่ได้ที่จะสังเกตเห็นผิวหนังของ [victim.GetHerHis], และการเคลื่อนไหวข้างใต้ขณะที่ [victim.GetSheHe] ขยับ..."
 trait_specific_ongoing.5001.a:0 "ของว่างยามเที่ยงคืนคงจะดีไม่น้อย"
 trait_specific_ongoing.5001.b:0 ""ได้โปรด, [victim.GetFirstNameNoTooltip], พูดต่อเถิด""

 trait_specific_ongoing.5002.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer') )] [murderer.GetTitledFirstName] ของข้าและข้าพบว่าตัวเองอยู่ตามลำพังขณะที่ส่วนที่เหลือของราชสำนักได้เดินทอดน่องไปนอนหลับแล้ว\n\nเมื่อค่ำคืนดำเนินไป [murderer.GetSheHe] ก็ยิ่งทวีความรุนแรงมากขึ้นเรื่อยๆ, ดวงตาของ [murderer.GetHerHis] ไม่เคยละไปจากเนื้อหนังที่เปิดเผยบนร่างกายข้าเลย ทันทีที่ข้ากำลังจะตั้งคำถามถึงเจตนาของ [murderer.GetHerHis] [murderer.GetSheHe] ก็ชักมีดออกมาและยิ้ม"
 trait_specific_ongoing.5002.a:0 "ไม่, ไม่, ได้โปรด– ไม่! อ๊ากกก!"

 trait_specific_ongoing.5003.t:0 "สิ่งล่อใจแห่งเนื้อหนัง"
 trait_specific_ongoing.5003.desc_opening:0 "คนรับใช้ของข้า [servant.GetTitledFirstName] ได้ดึงดูดความสนใจข้า – รูปทรงแขนของ [servant.GetHerHis], ความโค้งของคอ [servant.GetHerHis]... ขณะที่ข้าต้อน [servant.GetHerHim] จนมุมตามลำพังท่ามกลางห้องเก็บอาหาร, [servant.GetSheHe] ถามว่าข้าต้องการอะไรจาก [servant.GetHerHim], รอยยิ้มเจ้าชู้อยู่บนริมฝีปาก [servant.GetHerHis]\n\n"ข้าปรารถนาร่างกายเจ้า," ข้าตอบขณะที่ข้าเบียดตัวเข้าหา [servant.GetHerHim]"
 trait_specific_ongoing.5003.desc_big:0 ""มันช่างอวบอ้วน – เต็มไปด้วย #EMP ชีวิต#!!""
 trait_specific_ongoing.5003.desc:0 ""มันเต็มไปด้วย #EMP ชีวิต#!!""
 trait_specific_ongoing.5003.a:0 "ด้วยการเคลื่อนไหวที่ราบรื่นครั้งเดียว ข้าปาดคอ [servant.GetHerHis]"
 trait_specific_ongoing.5003.b:0 "ข้าดึง [servant.Custom('GetUpperClothingArticle')] ของ [servant.GetHerHis] ให้เปิดออก"

 trait_specific_ongoing.5004.t:0 "จุดแวะพักของว่าง"
 trait_specific_ongoing.5004.desc:0 "ขณะที่ข้าเดินทางพร้อมผู้ติดตามใน [county.GetNameNoTier] เราบังเอิญพบบ้านอันเงียบสงบหลังหนึ่ง ซึ่งมีหญิงชราอาศัยอยู่ตามลำพัง\n\nข้าขอให้ผู้ติดตามรออยู่ข้างถนนและเข้าไปในบ้านตามลำพัง"
 trait_specific_ongoing.5004.a:0 "ได้โปรด ท่านหญิง, ข้าขอมือท่านหน่อย!"
 trait_specific_ongoing.5004.b:0 "เอาล่ะ, บอกข้าที, แถวนี้เป็นอย่างไรบ้าง?"

 trait_specific_ongoing.5005.t:0 "ของว่างยามดึก"
 trait_specific_ongoing.5005.desc:0 "เย็นวันหนึ่ง ข้าบังเอิญเจอ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] ของข้ากำลังงีบหลับ\n\nข้าไม่เคยสังเกตมาก่อน, แต่ [courtier.GetSheHe] มีร่างกายที่น่าอร่อยจริงๆ..."
 trait_specific_ongoing.5005.a:0 "มัน #EMP เกือบจะ#! มากเกินกว่าที่ข้าจะทนกินได้!"
 trait_specific_ongoing.5005.b:0 "ข้าจะปลุก [courtier.GetHerHim] – [courtier.GetSheHe] คงไม่สบายตัวอยู่ข้างนอกนี้"

 trait_specific_ongoing.6001.t:0 "ถูกจับได้คาหนังคาเขา"
 trait_specific_ongoing.6001.desc:0 "เพื่อกระตุ้นตัวเองก่อนพบกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] [lover.GetTitledFirstName] ของข้า ข้านำ [ROOT.Char.Custom('DeviantObjectArticle')] ออกมา – #EMP โอ้...!#!\n\nข้าหมกมุ่นอยู่กับมันมาก, สำรวจส่วนต่างๆ ของมัน, จนข้าไม่ได้ยินเสียงใครบางคนเข้ามาใน [ROOT.Char.Custom('GetRoom')] สิ่งที่ข้าได้ยินคือเสียงหอบหายใจดังของ [lover.GetFirstNamePossessiveNoTooltip] เมื่อ [lover.GetSheHe] เห็นและตระหนักว่าข้ากำลังทำอะไร"
 trait_specific_ongoing.6001.a:0 "ข้ามีอันสำรอง... หากท่านต้องการเข้าร่วม?"
 trait_specific_ongoing.6001.a.success:0 "[lover.GetSheHe|U] สนใจมัน"
 trait_specific_ongoing.6001.a.failure:0 "[lover.GetSheHe|U] ไม่ได้มี... รสนิยมเหมือนท่าน"
 trait_specific_ongoing.6001.b_woman:0 "ข้า... ห– หมอแนะนำมันเพื่อความมีชีวิตชีวา!"
 trait_specific_ongoing.6001.b_man:0 "ข้า... ห– หมอแนะนำมันเพื่อความแข็งแรงทางเพศ!"

 trait_specific_ongoing.6002.t:0 "เจ้าเหนือหัวผู้เบี่ยงเบน"
 trait_specific_ongoing.6002.desc:0 "ขณะที่ข้าไปเยี่ยม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege') )] [liege.GetTitledFirstName] ของข้า, ข้าถูกนำไปยังห้องพักของ [liege.GetHerHis]\n\nข้าเปิดประตูและพบ [liege.GetHerHim] กำลังอยู่ในห้วงแห่งความสุขสุดยอด, โดยได้รับความช่วยเหลือจาก [ROOT.Char.Custom('DeviantObjectArticle')] – ข้าไม่เคยรู้มาก่อนเลยว่ามันสามารถใช้ในลักษณะนั้นได้!"
 trait_specific_ongoing.6002.a:0 "โอ้ โอ้ โอ้, นี่สิ #EMP น่าสนใจ#!"
 trait_specific_ongoing.6002.b:0 "โอ้, นี่... นี่ดู #EMP น่าสนใจ#!."
 trait_specific_ongoing.6002.c:0 "นี่มันหมายความว่าอย่างไร?!"
 trait_specific_ongoing.6002.d:0 "ข้าจะออกไปเดี๋ยวนี้"

 trait_specific_ongoing.6003.t:0 "ความเบี่ยงเบน"
 trait_specific_ongoing.6003.desc_opening:0 "ข้ากำลังอยู่ในห้วงแห่งความสุขสุดยอด, โดยได้รับความช่วยเหลือจาก [ROOT.Char.Custom('DeviantObjectArticle')], ขณะที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal') )] [vassal.GetTitledFirstName] ของข้าเดินเข้ามาในห้อง\n\n"
 trait_specific_ongoing.6003.desc_deviant:0 "ดวงตาของ [vassal.GetHerHis|U] เบิกกว้าง – ไม่ใช่ด้วยความขยะแขยง, แต่ด้วยความสนใจ "โอ้, ข้าไม่เคยคิดถึงการใช้มันแบบ #EMP นั้น#! เลย ท่านเป็นแรงบันดาลใจ!""
 trait_specific_ongoing.6003.desc_joined:0 "ข้าเห็น [vassal.GetHerHim] ลังเล, แต่แล้ว [vassal.GetSheHe] ก็ปิดประตูและเดินเข้ามาข้างใน "โอ้, [liege.GetTitledFirstNameNoTooltip], นั่นดู... นั่นดู #EMP น่าสนใจ#!! นี่, ให้ข้าช่วยท่าน""
 trait_specific_ongoing.6003.desc_exposed:0 "[vassal.GetSheHe] ตกใจกลัว เปิดประตูออกกว้าง, "[liege.GetTitledFirstNameNoTooltip], นี่มันหมายความว่าอย่างไร?!""
 trait_specific_ongoing.6003.desc_ew:0 "[vassal.GetSheHe] ตกใจกลัว ถอยออกจากห้อง, "เอาเป็นว่า... เอาเป็นว่าข้าไม่เห็นอะไรเลย, ตกลงไหม?""
 trait_specific_ongoing.6003.a:0 "#EMP อึ่ก...!#!"
