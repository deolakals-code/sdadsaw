l_english: 
 trait_specific.1001.desc:0 "ช่วงนี้มีผู้คนแปลกประหลาดปรากฏตัวอยู่รอบ [ROOT.Char.Custom('GetCourt')|l] – บ้างข้าเห็นเพียงเงาที่หางตา บ้างก็เห็นแวบเดียวแล้วดูเหมือนจะหายไป\n\nไม่ว่าข้าจะมอบหมายให้คนไปตามหากี่คนก็ตาม ก็หาคนประหลาดเหล่านี้ไม่พบ แต่การเย้ยหยันของพวกเขากลับทวีความรุนแรงขึ้นเรื่อยๆ!"
 trait_specific.1001.a:0 "นั่น–! ข้านึกว่า..."

 trait_specific.1002.desc:0 "ช่วงนี้ข้าคิดอะไรไม่ค่อยออก – ความคิดข้ากระจัดกระจายดุจเมฆาในคิมหันตฤดู\n\nเหล่านกการ้องเพลงผิดแผกไปจากเดิมนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ผู้คนอื่นพูดจาเป็นปริศนาโดยเจตนา และ #EMP ไม่มีใคร#! ยอมรับว่าผักชีเป็นเครื่องเทศที่แย่มากจริงๆ"
 trait_specific.1002.a:0 "เดี๋ยวนะ ข้ากำลังคิดเรื่องอะไรอยู่?"

 trait_specific.1010.t:0 "อาการวิปลาสเริ่มปรากฏ"
 trait_specific.1010.desc:0 "สัปดาห์ที่ผ่านมานี้ข้าหมุนคว้าง ดุจใบไม้ในพายุทอร์นาโด วนไปวนมา อะไรคือความจริง? อะไรคือ #EMP ของจริง#!? ข้าตอบคำถามนี้ไม่ได้อีกต่อไป\n\nทั้งหมดที่ข้ารู้คือสตรีในหมู่เมฆเข้าใจข้า — แต่เงาที่ม้วนตัวแผ่ขยายออกไปไกลขึ้นทุกวัน"
 trait_specific.1010.a:0 "ตะครุบเหมือนหนู... ชิ่ว ไปให้พ้น!"

 trait_specific.2001.t:0 "อาการเริ่มแรก"
 trait_specific.2001.desc:0 "ความรู้สึกคลื่นไส้ตีขึ้นมาในท้องข้า ข้าพยายามกลับไปยัง [ROOT.Char.Custom('GetChamber')] ของข้า แต่ทางเข้ากลับหดเล็กลงต่อหน้าต่อตาข้า! ม-มันเกิด #EMP อะไรขึ้น?!#!\n\nทันใดนั้นข้าก็ได้กลิ่นบางอย่าง... บางอย่างที่ข้ารู้ว่าเคยได้กลิ่นมาก่อน แต่... #EMP ที่ไหน#!? มีคนถามว่าข้าสบายดีหรือไม่ แต่ข้าตอบไม่ได้ ข้าทำอะไรไม่ได้เลย..."
 trait_specific.2001.a:0 "ข้า... ข้าหายไปนานแค่ไหน?"

 trait_specific.2002.desc:0 "ช่วงนี้ข้าประสบกับ... อาการบางอย่าง มีบางอย่างเข้าสิงข้า ควบคุมร่างกายข้า และทิ้งให้ข้าเหนื่อยล้าและสับสน\n\nข้าพยายามเก็บเรื่องนี้จากผู้คน พยายามซ่อนมันไว้ แต่เป็นการยากที่จะควบคุมบางสิ่งที่มาและไปตามใจชอบ"
 trait_specific.2002.a:0 "พวกเขามองข้าราวกับว่าข้า... #EMP ถูกสิง#!."

 trait_specific.3001.desc:0 "ลูกธนูหลงดอกหนึ่งพุ่งผ่านศีรษะข้าไป และข้าไม่รู้สึก #EMP อะไรเลย#! – ไม่กลัว ไม่ตื่นตระหนก ไม่แม้กระทั่งโกรธ\n\nนี่กลายเป็นบรรทัดฐานใหม่ที่น่ากังวล – ข้ารู้สึกราวกับว่าข้าดำรงอยู่หลังม่าน กีดกันข้าจากความรู้สึก กีดกันข้าจากโลก และข้า #EMP เหนื่อย#! เหลือเกิน..."
 trait_specific.3001.a:0 "ข้าคิดว่าข้าจะกลับไปนอน"

 trait_specific.3002.desc_opening:0 "ความหมายของทั้งหมดนี้คืออะไร? เหตุใดเราจึงต้องทำสิ่งเหล่านี้ซ้ำแล้วซ้ำเล่า วันแล้ววันเล่า..."

 trait_specific.3999.t:0 "วันสีเทา"
 trait_specific.3999.desc:0 "ตลอดชีวิตข้ารู้สึกว่าความสุขไม่ได้มาหาข้าโดยง่ายเหมือนผู้อื่น และบัดนี้ความรู้สึกนั้นแปลกแยกสำหรับข้าราวกับอากาศสำหรับปลา"
 trait_specific.3999.desc_end:0 "\n\nแรงจูงใจและพลังงานหลุดลอยไปจากข้า ขณะที่ชีวิตข้าจมดิ่งสู่ความมัวหม่นสีเทา ข้ารู้สึกว่าควรจะตื่นตระหนก แต่แม้กระทั่งสิ่งนั้นก็เกินกำลังข้าแล้วในตอนนี้"
 trait_specific.3999.a:0 "มันมากเกินไปแล้ว..."

 trait_specific.4001.t:0 "ตำรานอกรีต"
 trait_specific.4001.landed: "ในมุมฝุ่นเขรอะของห้องสมุด ข้าพบตำราเล่มหนึ่ง"
 trait_specific.4001.adventurer: "ในมุมหีบที่เก่าซอมซ่อ ข้าพบตำราเล่มหนึ่ง"
 trait_specific.4001.desc:0 "– หุ้มด้วยหนังและจารึกสัญลักษณ์ประหลาด – ซ่อนอยู่บางส่วนหลังหนังสือเล่มอื่น มันเก่าแก่ แต่เห็นได้ชัดว่ามีการใช้งานเมื่อไม่นานมานี้\n\nขณะที่ข้าพลิกดูผ่านๆ ข้าตระหนักได้อย่างรวดเร็วว่ามันเกี่ยวข้องกับความรู้... #EMP นอกรีต#! บางอย่าง"
 trait_specific.4001.a:0 "น่าสนใจ... ข้ามองไปรอบๆ ก่อนจะนั่งลงอ่าน"
 trait_specific.4001.a_tt:0 "หวังว่าคนที่เพิ่งอ่านหนังสือเล่มนี้ไปจะไม่อยู่แถวนี้เพื่อเห็นข้า..."
 trait_specific.4001.b:0 "นอกรีต! ข้าจะมอบมันให้กับ [ROOT.Char.GetFaith.PriestNeuterPlural]"

 trait_specific.5001.t:0 "นักชิม"
 trait_specific.5001.desc:0 "เนื้อกวาง เนื้อเอลก์ นกกระทา... มีของแปลกใหม่มากมายให้ลองในโลกนี้!\n\nเมื่อได้ลิ้มรสเนื้ออันเลิศรสมากมายตลอดหลายปีที่ผ่านมา ข้าอดสงสัยไม่ได้ว่ามีอะไรอีกบ้าง? การผจญภัยแห่งรสชาติใดอาจรอคอยลิ้นของข้าอยู่?"
 trait_specific.5001.a:0 "ข้าต้องลองให้หมด!"
 trait_specific.5001.a.tt:0 "ข้าจะมองหาเนื้อชนิดที่แปลกใหม่ยิ่งขึ้น"
 trait_specific.5001.b:0 "ความหลากหลายที่ข้ามีอยู่ตรงนี้ก็ดีแล้ว"

 trait_specific.5002.desc:0 "ในการแสวงหาเนื้อหายากของข้า ความคิดหนึ่งได้หยั่งรากลึกในใจข้า ข้าแทบไม่กล้ายอมรับแม้กระทั่งกับตัวเอง แต่ข้าอดสงสัยไม่ได้ว่าเนื้อ #EMP มนุษย์#! อาจมีรสชาติเป็นอย่างไร...\n\nขณะที่คนรับใช้ใน [ROOT.Char.Custom('GetCourt')|l] คนหนึ่งล้มป่วย ยืนอยู่บนปากประตูแห่งความตาย ข้าพบว่าตัวเองสั่งให้เขามารับการดูแลส่วนตัวจากข้า"
 trait_specific.5002.a:0 "ให้อภัยข้าด้วย – ข้าต้องหาคำตอบให้ได้!"
 trait_specific.5002.b:0 "ข้าจะไม่ทำอะไรนอกจากสวดภาวนาให้วิญญาณของเขา"

 trait_specific.5003.t:0 "สุดโต่งเกินไป"
 trait_specific.5003.desc:0 "มันควรจะเป็นเพียงการเดินทางสั้นๆ การท่องเที่ยวที่น่ารื่นรมย์ในชนบท บัดนี้เป็นเวลาหลายวันแล้วที่เราไม่เห็นคนมีชีวิตอื่น และเสบียงของเราหมดไปนานแล้ว – เรากินม้าไปแล้วด้วยซ้ำ\n\nผู้นำทางของเราสัญญาว่าเราจะไปถึงอารยธรรมภายในสัปดาห์นี้ แต่คนรับใช้บางคนถึงขีดจำกัดแล้ว และท้องของข้าก็ร้องดังขึ้นทุกชั่วโมงที่ผ่านไป"
 trait_specific.5003.a:0 "ข้าจะทำในสิ่งที่ต้องทำเพื่อความอยู่รอด..."
 trait_specific.5003.b:0 "เราผ่านเรื่องนี้ไปได้!"

 trait_specific.6001.t:0 "รสนิยมวิปลาส"
 trait_specific.6001.desc:0 "ช่วงนี้กิจกรรมปกติไม่ได้... #EMP ทำให้ข้าพอใจ#! อีกต่อไป หมอแนะนำขี้ผึ้งต่างๆ แต่ไม่มีอะไรกระตุ้นอารมณ์\n\nขณะที่ข้าสิ้นหวังมากขึ้นเรื่อยๆ ข้าบังเอิญไปเจอหนังสือบางเล่ม ซ่อนอยู่ที่ก้นกองในแผงของพ่อค้า ที่พรรณนาถึงกิจกรรม... ที่ไม่ธรรมดาบางอย่าง ข้าพบว่าข้าหยุดพลิกหน้าไม่ได้ และความร้อนรุ่มก็ก่อตัวขึ้นในกายข้า"
 trait_specific.6001.a:0 "เอาล่ะ ถ้ามันต้องเป็น เช่นนี้..."
 trait_specific.6001.b:0 "ข้าดีกว่านี้!"

 trait_specific.6002.t:0 "การทดลอง"
 trait_specific.6002.desc:0 "ข้ากำลังเอื้อมมือไปคลาย [lover.Custom('GetUpperClothingArticle')] ของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] [lover.GetTitledFirstNamePossessive] เมื่อ [lover.GetSheHe] พลันดึงตัวออกห่าง\n\n\"ข้าอยากจะลองอะไร #EMP ใหม่ๆ#! นะ [ROOT.Char.Custom('LoverPetName')] ของข้า\" [lover.GetSheHe] พูดเสียงออดอ้อน เอื้อมมือไปใต้เตียงพร้อมรอยยิ้มเจ้าเล่ห์\n\nมือของ [lover.GetHerHis|U] ปรากฏขึ้น พร้อมกับกำ [ROOT.Char.Custom('DeviantObjectArticle')] ไว้ \"ข้าคิดว่าเราน่าจะใช้ #EMP สิ่งนี้#! กัน\""
 trait_specific.6002.a:0 "ดีมาก อย่าปล่อยให้ข้ารอนาน!"
 trait_specific.6002.b:0 "เจ้าชอบอะไรแบบ... #EMP นี้?!#!"
 trait_specific.6002.b_known:0 "ข้ารู้ว่า [lover.GetSheHe] ชอบอะไรแปลกๆ แต่ถึงขนาดนี้?!"

 trait_specific.7001.t:0 "หมดแก้ว!"
 trait_specific.7001.desc:0 "ไม่มีอะไรสามารถ ทำให้ข้าสงบลงได้อย่างมีประสิทธิภาพเท่ากับการดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] ดีๆ สักแก้ว หลังวันที่เหน็ดเหนื่อย หลังวันที่ดี หลัง #EMP วันไหนๆ#! ก็ตาม... ข้ามั่นใจเสมอว่าจะพบการปลอบประโลมที่ก้นแก้วของข้า"
 trait_specific.7001.a:0 "เอามาอีก!"
 trait_specific.7002.b:0 "ข้าแข็งแกร่งกว่านี้"

 trait_specific.8001.t:0 "ความสนใจที่งอกเงย"
 trait_specific.8001.desc:0 "พ่อค้าร่าเริงคนหนึ่งยัดถุงเมล็ดพืชใส่มือข้า – พืชที่ [ROOT.Char.Custom('RandomSheHe')] อ้างว่าเสริมสร้างทั้งสุขภาพและจิตใจ\n\nข้าต้องยอมรับว่าข้ามีประสบการณ์น้อยในการบำรุงเลี้ยงพืช แต่มันจะยากสักแค่ไหนเชียว?"
 trait_specific.8001.a:0 "ข้าจะใช้สิ่งเหล่านี้เพื่อเริ่มสวนส่วนตัว!"
 trait_specific.8001.a.success:0 "ท่านปลูกสวนอันเขียวชอุ่ม"
 trait_specific.8001.a.small_success:0 "โครงการล้มเหลว แต่ท่านได้เรียนรู้มากมาย"
 trait_specific.8001.a.failure:0 "เมล็ดพืชไม่ยอมงอก"
 trait_specific.8002.b:0 "พวกมันต้องมีค่าอะไรบางอย่าง..."

 trait_specific.9001.t:0 "การครุ่นคิดยามเย็น"
 trait_specific.9001.desc:0 "ข้าจิบ [ROOT.Char.Custom('GetExpensiveDrink_Singular')] จากแก้ว สายตากวาดมองข้อความที่ข้าขีดเขียนล่าสุด\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')|U]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nแท้จริงแล้ว ข้าคือหนึ่งในจิตใจทางศิลปะอันยิ่งใหญ่แห่งยุคของข้า!"
 trait_specific.9001.a:0 "บทกวีชั้นเลิศ! ข้าจะครุ่นคิดถึงสิ่งใดต่อไปดี?"
 trait_specific.9001.b:0 "การเขียนเป็นเรื่องสนุก แต่ข้าไม่รู้เรื่อง #EMP การสัมผัสคล้องจอง#!."
 trait_specific.9001.c:0 "บางทีข้าจะให้เตรียมอ่างอาบน้ำแทน..."


 trait_specific.8501.t:0 "การหัวเราะคิกคักน่าสงสัย"
 trait_specific.8501.desc:0 "ข้ากำลังพูดคุยกับ [ROOT.Char.Custom('GetCourtierPlural')] หลายคนของข้าในหัวข้อที่ค่อนข้างจริงจัง เมื่อข้าอดไม่ได้ที่จะสังเกตเห็น [mean_courtier.GetTitledFirstName] หัวเราะคิกคัก\n\nต่อเมื่อข้าเผชิญหน้ากับ [mean_courtier.GetHerHim] และ [mean_courtier.GetSheHe] ขอให้ข้าพูดคำว่า 'น่าสงสัย' ซ้ำ ข้าจึงตระหนักว่า [mean_courtier.GetSheHe] กำลังล้อเลียนอาการพูดไม่ชัดของข้า"
 trait_specific.8501.a:0 "หยาบคาย แต่ข้าจะทำอะไรได้?"
 trait_specific.8501.b:0 "จองจำ [mean_courtier.GetHerHim]!"
 trait_specific.8501.c:0 "ถ้าเจ้าคิดว่ามันตลกนัก บางทีเจ้าอาจอยากมีเป็นของตัวเองบ้าง"
 trait_specific.8501.d:0 "พูดอีกทีสิ ข้าท้าเจ้า"
 trait_specific.8501.e:0 "บางทีเจ้าอาจอยากดูใกล้ๆ"
 trait_specific.8501.f:0 "อันที่จริง ข้าคิดว่าเจ้าจะพบว่า [ROOT.Char.GetFaith.HealthGodName] ก็พูดไม่ชัดเหมือนกัน"
 trait_specific.8501.g:0 "เจ้าจะ #EMP ไม่เชื่อ#! ว่าข้าทำอะไรกับลิ้นนี้ได้บ้าง..."
 trait_specific.8501.d.tt:0 "[mean_courtier.GetTitledFirstName] และท่านมี [single_combat_duel|E]"
 trait_specific.8501.h:0 "ทุกอย่างเรียบร้อยดีหรือไม่?"
