l_english: 
 legitimize_bastard_interaction:1 "รับรองบุตรนอกสมรส #weak (ตระกูล)#!"
 legitimize_bastard_interaction_extra_icon:0 "$hook_extra_icon$"
 legitimize_bastard_interaction_desc_house_head:1 "$house_head_interaction_header$ประกาศให้[secondary_recipient.GetShortUINameNoTooltip]เป็น[legitimized_bastard|E]\n\n#weak สิ่งนี้สามารถทำได้เนื่องจาก[secondary_recipient.GetSheHe]เป็น[bastard|E]ของ[house|E]ของข้า#!"
 legitimize_bastard_interaction_desc_not_house_head:0 "ร้องขอให้[recipient.GetShortUINameNoTooltip]ยอมรับ[bastard|E]ของท่านว่าเป็น[legitimate|E]\n#weak ([recipient.GetShortUINameNoTooltip]คือ[house_head_head|E]ของ[house|E]ของท่าน)#!"
 legitimize_bastard_interaction_notification:0 "บุตรนอกสมรสได้รับการรับรอง"
 legitimize_bastard_interaction_decline_notification:0 "บุตรนอกสมรสไม่ได้รับการรับรอง"
 I_AM_HOUSE_HEAD_MODIFIER:0 "ในฐานะประมุขแห่งตระกูล ข้ามีอิสระที่จะตัดสินใจ"
 PRESTIGOUS_IN_OUR_HOUSE:0 "ระดับชื่อเสียง: $VALUE|+0$"
 house_bastard_was_legitimized:0 "บุตรนอกสมรสของตระกูลได้รับการรับรอง"
 dynasty_bastard_was_legitimized:0 "บุตรนอกสมรสของราชวงศ์ได้รับการรับรอง"

 bastard_interaction.0001.t:0 "ตระกูล[actor.GetHouse.GetBaseName]"
 bastard_interaction.0001.desc.standard:0 "หลังจากเวลาทั้งหมดนี้ ในที่สุด[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]ของข้าก็ได้ตัดสินใจมอบการยอมรับที่ข้าปรารถนามาโดยตลอด นับจากวันนี้เป็นต้นไป ข้าคือ[secondary_recipient.Custom('DaughterSon')]ที่ถูกต้องตามกฎหมายของ[actor.GetHerHis] ด้วยคำพูดเพียงไม่กี่คำ [actor.GetSheHe]ได้เปลี่ยนแปลงเส้นทางอนาคตของข้าไปอย่างสิ้นเชิง"
 bastard_interaction.0001.desc.child:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U]ได้ 'รับรอง' ข้าแล้ว — ตอนนี้ข้าคือ[secondary_recipient.Custom('DaughterSon')]ที่แท้จริงของ[actor.GetHerHis] [actor.GetSheHe]กล่าว ข้าไม่แน่ใจนักว่ามันหมายความว่าอย่างไร แต่ข้าสังเกตเห็นขุนนางและสตรีบางคนในราชสำนักมองข้าเปลี่ยนไป ส่วนใหญ่ใจดีขึ้น บางคนก็ไม่ค่อย..."
 bastard_interaction.0001.a.standard:0 "ความฝันทั้งหมดของข้าดูเหมือนใกล้เข้ามามากขึ้นแล้ว"
 bastard_interaction.0001.a.child:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U]บอกว่านี่เป็นสิ่งที่ดี"
 bastard_interaction.0002.t:0 "ยินดีต้อนรับสู่ครอบครัว"
 bastard_interaction.0002.house_head:0 "ข้าได้ประกาศให้[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))]ของข้า [legitimized_bastard.GetFirstName] เป็นบุตรที่ถูกต้องตามกฎหมายของข้าและเป็นสมาชิกของตระกูล[actor.GetHouse.GetBaseName] ข้าใช้ความคิดอย่างมากในการตัดสินใจครั้งนี้ และ แม้ว่าบางคนอาจไม่เห็นด้วย แต่มันเป็นสิ่งที่ถูกต้องที่ควรทำ"
 bastard_interaction.0002.dynast:0 "ข้าได้ประกาศให้[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))]ของข้า [legitimized_bastard.GetFirstName] เป็นทายาทที่ถูกต้องตามกฎหมายของราชวงศ์[actor.GetDynasty.GetBaseName]"
 bastard_interaction.0002.approved:0 "ข้าได้ประกาศให้[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))]ของข้า [legitimized_bastard.GetFirstName] เป็นบุตรที่ถูกต้องตามกฎหมายของข้าและเป็นสมาชิกของตระกูล[actor.GetHouse.GetBaseName] ข้าใช้ความคิดอย่างมากในการตัดสินใจครั้งนี้ และ แม้ว่าบางคนอาจไม่เห็นด้วย แต่มันเป็นสิ่งที่ถูกต้องที่ควรทำ"
 bastard_interaction.0002.a:1 "อนาคตของเจ้ารุ่งโรจน์นัก, [legitimized_bastard.GetFullNameNoTooltip]"
 bastard_interaction.0003.t:0 "จบลงด้วยดี"
 bastard_interaction.0003.desc:0 "ต้องใช้เวลาสักพักกว่า[actor.GetHerHim]จะตัดสินใจได้ แต่ในที่สุด[actor.GetTitledFirstName]ก็ได้ให้การรับรอง[secondary_recipient.Custom('DaughterSon')]ของเรา [secondary_recipient.GetFirstName] ในฐานะสมาชิกของตระกูล[actor.GetHouse.GetBaseName] ตอนนี้[secondary_recipient.GetFirstName]มีอนาคตที่สดใสกว่าที่ข้าเคยกล้าหวังไว้"
 bastard_interaction.0003.a:0 "ทำให้เราภูมิใจ!"
 bastard_interaction.0004.t:0 "ภูตผีเก่ากลับมา"
 bastard_interaction.0004.desc:0 "ข้าช่างโง่เขลานักที่หลงเชื่อว่า [secondary_recipient.GetTitledFirstName] เป็นปัญหาในอดีตไปแล้ว ว่า [secondary_recipient.GetSheHe] จะไม่กลับมาหลอกหลอนข้าอีก เหตุใดข้าถึงมิอาจล่วงรู้ได้ว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] [actor.Custom2('InsultAdjective', ROOT.Char)] ของข้าจะรับรอง [secondary_recipient.GetHerHim] ให้ถูกกฎหมาย? ข้าคิดว่าข้าทนทุกข์มามากพอแล้ว..."
 bastard_interaction.0004.newborn_desc:0 "ไม่เพียง แต่[actor.GetFirstName]จะมีบุตรนอกสมรสเท่านั้น แต่[actor.GetSheHe]ยังเลือกที่จะรับรองให้เป็นของ[actor.GetHerHis]เองอีกด้วย!\n\n[legitimized_bastard.GetTitledFirstName]ตัวน้อยจะหลอกหลอนชีวิตข้าตลอดไป..."
 bastard_interaction.0004.a:0 "ข้าจะไม่ลืมการทรยศครั้งนี้"
 bastard_interaction.0005.t:0 "วันสำคัญของ[secondary_recipient.GetFirstNamePossessiveNoTooltip]"
 bastard_interaction.0005.desc.bastard:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U]ได้ตัดสินใจรับรอง[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]ของข้า [secondary_recipient.GetTitledFirstName] ข้าอดไม่ได้ที่จะรู้สึกขมขื่นเล็กน้อย... ข้าจะเคยได้รับการยอมรับ เช่นเดียวกันหรือไม่?"
 bastard_interaction.0005.desc.approve:0 "นี่เป็นวันที่ดีสำหรับ [secondary_recipient.GetTitledFirstName]! ในที่สุด [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))] ของเราก็ได้สติ [actor.GetHerHis] และรับรอง [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))] ของข้าแล้ว ตอนนี้ [secondary_recipient.GetSheHe|U] เป็นส่วนหนึ่งของครอบครัวอย่างแท้จริง"
 bastard_interaction.0005.desc.disapprove:1 "ข้าไม่อยากจะเชื่อเลย — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]ได้ตัดสินใจรับรอง[secondary_recipient.GetTitledFirstName]! เมื่อเวลาผ่านไป ข้าก็ยอมรับการมีอยู่ของ[secondary_recipient.GetHerHis]ได้แล้ว แต่นี่มันมากเกินไป [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]คาดหวังจริงๆ หรือว่าข้าจะต้อนรับ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))]นอกสมรสของข้าเข้าสู่ครอบครัว?"
 bastard_interaction.0005.a.approve:0 "ขอให้โชคดีในชีวิตใหม่ของเจ้า"
 bastard_interaction.0005.a.disapprove:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]นึกถึงข้าบ้างหรือไม่?"
 every_child_adult_non_bastard_dislike:0 "บุตรที่ไม่ใช่บุตรนอกสมรสและเป็นผู้ใหญ่ทั้งหมดของข้าที่ไม่ชอบบุตรนอกสมรส"
 every_child_adult_non_bastard_dislike_me:0 "บุตรที่ไม่ใช่บุตรนอกสมรสและเป็นผู้ใหญ่ทั้งหมดของ[THIS.Char.GetFirstNamePossessive]ที่ไม่ชอบข้า"
 
 bastard_interaction.0006.t:0 "[legitimized_bastard.GetFirstNameNoTooltip]ได้รับการรับรอง"
 bastard_interaction.0006.desc:0 "[legitimized_bastard.GetTitledFirstName]ได้รับการรับรองโดยประมุขแห่งตระกูลของ[legitimized_bastard.GetHerHis], [actor.GetTitledFirstName]!"
 bastard_interaction.0006.a:0 "ในที่สุด [legitimized_bastard.GetSheHe]ก็มีครอบครัว"

 bastard_interaction.0007.desc:0 "[legitimized_bastard.Custom('GetDaughterSon')]นอกสมรสของ[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))]ข้า, [legitimized_bastard.GetTitledFirstName], ได้รับการรับรองโดย[actor.GetTitledFirstName], ประมุขแห่งตระกูลของ[actor.GetHerHis]"
 bastard_interaction.0007.newborn_desc:0 "[parent.GetTitledFirstName]ได้นำบุตรนอกสมรสมาสู่โลกนี้ และได้รับการรับรองโดย[actor.GetTitledFirstName], [legitimized_bastard.Custom2('RelationToMe', SCOPE.sC('actor'))]ของ[legitimized_bastard.GetHerHis]"
 bastard_interaction.0007.a:0 "ขอให้[legitimized_bastard.GetSheHe]ออกไปจากชีวิตข้าตลอดไป"

 bastard_interaction.0008.desc:0 "[legitimized_bastard.GetTitledFirstName], [legitimized_bastard.Custom('GetDaughterSon')]นอกสมรสของ[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))]ข้า, ได้รับการรับรองโดยประมุขแห่งตระกูลใหม่ของ[legitimized_bastard.GetHerHis]!"
 bastard_interaction.0008.a:0 "ราวกับว่า[legitimized_bastard.GetSheHe]จะเคย "ถูกต้องตามกฎหมาย" ได้"

 bastard_interaction.0009.t:0 "ทายาทแห่งราชวงศ์"
 bastard_interaction.0009.desc:0 "[actor.GetTitledFirstName], ประมุขแห่งราชวงศ์ทั้งหมดของเรา, ได้ประกาศให้ข้าเป็นทายาทที่ถูกต้องตามกฎหมายของชื่อเรา!\n\nข้าเป็น[ROOT.Char.GetDynasty.GetBaseName]ที่แท้จริงมาโดยตลอด และตอนนี้โลกที่เหลือต้องยอมรับมัน"
 bastard_interaction.0009.a:0 "ในที่สุด!"

 bastard_interaction.0010.t:0 "ทายาทอีกคนแห่งราชวงศ์"
 bastard_interaction.0010.desc:0 "[actor.GetTitledFirstName], ประมุขแห่งราชวงศ์ทั้งหมดของเรา, ได้ประกาศให้[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))]ของข้าเป็นทายาทที่ถูกต้องตามกฎหมายของชื่อเรา!\n\nตอนนี้[recipient.GetSheHe|U]เป็นทายาทที่คู่ควรของราชวงศ์[ROOT.Char.GetDynasty.GetBaseName]เท่ากับบุตรที่เกิดโดยชอบธรรมคนใด"
 bastard_interaction.0010.a:0 "อีกคนหนึ่งในสาย"
 bastard_interaction.0010.a.tt:0 "ตอนนี้[recipient.GetShortUIName|U]มีสิทธิ์สืบทอดมรดก"

 every_father_house_member:0 "สมาชิกทุกคนของ[house|E]ของ[father.GetFirstNamePossessiveNoTooltip]"
 every_mother_house_member:0 "สมาชิกทุกคนของ[house|E]ของ[mother.GetFirstNamePossessiveNoTooltip]"
