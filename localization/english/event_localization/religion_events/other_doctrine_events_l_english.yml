l_english: 
 #False conversion events.
 false_conversion.0020.t:0 "ผู้แอบนับถือ[old_faith.GetNameNoTooltip]"
 false_conversion.0020.desc:0 "ในชีวิตสาธารณะ ข้าปฏิบัติตาม [ROOT.Char.GetFaith.GetNameNoTooltip] อย่างเคร่งครัด ข้ายึดมั่นในค่านิยม [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] อ่าน [ROOT.Char.GetFaith.ReligiousText] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] และไป [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]\n\nทว่าเบื้องหลังประตูที่ปิดสนิท ข้าพบว่ายากที่จะละทิ้งคำสอนของ [old_faith.GetNameNoTooltip] และส่วนหนึ่งในใจข้าปรารถนาที่จะปฏิบัติตามวิถีเก่าอย่างเปิดเผย\n\nบางทีอาจถึงเวลาแล้วที่จะยืนยันอัตลักษณ์ [old_faith.GetAdherentNameNoTooltip] ของข้าอีกครั้ง โดยนำพาผู้แอบนับถือคนอื่นๆ และผู้เปลี่ยนศาสนาใหม่ๆ ที่ข้าสามารถทำได้ไปด้วย?"
 false_conversion.0020.desc_landless: "จนถึงบัดนี้ ข้าได้ปฏิบัติตาม [ROOT.Char.GetFaith.GetNameNoTooltip] อย่างเคร่งครัด ข้ายึดมั่นในค่านิยม [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] อ่าน [ROOT.Char.GetFaith.ReligiousText] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] และไป [ROOT.Char.GetFaith.HouseOfWorshipPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]\n\nทว่าเบื้องหลังประตูที่ปิดสนิท ข้าพบว่ายากที่จะละทิ้งคำสอนของ [old_faith.GetNameNoTooltip] และส่วนหนึ่งในใจข้าปรารถนาที่จะกลับไปสู่วิถีเก่า\n\nบางทีอาจถึงเวลาแล้วที่จะยืนยันอัตลักษณ์ [old_faith.GetAdherentNameNoTooltip] ของข้าอีกครั้ง และฝังรากสิ่งนี้ไว้ใน [ROOT.Char.Custom('GetCourt')|l] ของข้า?"
 false_conversion.0020.a:0 "[old_faith.HighGodName] ทรงทราบถึงใจข้า!"
 false_conversion.0020.b:0 "ไม่ ไม่ เวลายังไม่เหมาะสม"
 false_conversion.0020.c: "$false_conversion.0020.a$"
 false_conversion.0030.t:0 "นิรโทษกรรมสำหรับผู้แอบนับถือศาสนา"
 false_conversion.0030.desc_start:0 "มีเรื่องเล่ามาถึงหูข้าว่ามีบางคนในอาณาจักรของข้าที่แอบปฏิบัติตามศรัทธาที่ซ่อนเร้นอยู่ ไม่ว่าจะทั้งหมดหรือบางส่วน\n\n"
 false_conversion.0030.desc_no_secret_faith:0 "แม้ว่าข้าจะเป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ที่มั่นคง ศรัทธาของข้าก็สนับสนุนอุดมการณ์แห่งพหุนิยมเสมอมา และดูเหมือนน่าเสียดายที่บางคนรู้สึกว่าต้องเก็บงำการบูชาของตนไว้เป็นความลับ เพราะกลัวการกดขี่ข่มเหง\n\n"
 false_conversion.0030.desc_no_secret_faith_not_pluralist:0 "ผู้เชื่อที่ซ่อนเร้นเหล่านี้บางคนอาจเป็น [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ซึ่งถูกบังคับให้อยู่ในเงามืดมานานแล้วจากการกดขี่ทางศาสนา\n\n"
 false_conversion.0030.desc_has_secret_faith:0 "ตัวข้าเองก็มีปัญหาในการละทิ้งพิธีกรรมและความเชื่อหลายอย่างของ [old_faith.GetNameNoTooltip] แม้ว่าข้าจะไม่ยอมรับการบูชาอย่างต่อเนื่องในที่สาธารณะ แต่ใจข้าก็ยังคงเจ็บปวดด้วยความเห็นอกเห็นใจต่อชะตากรรมของกลุ่มผู้แอบนับถือศาสนาที่ซ่อนเร้นเหล่านี้\n\n"
 false_conversion.0030.desc_end:0 "แน่นอน ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าสามารถออกประกาศนิรโทษกรรมสาธารณะสำหรับผู้เปลี่ยนศาสนาจอมปลอมทั้งหมดได้..."
 false_conversion.0030.a:0 "ทุกคนควรมีอิสระในการบูชาสิ่งศักดิ์สิทธิ์!"
 false_conversion.0030.a.tt:0 "ข้าจะได้รับแจ้งว่ามีผู้แอบนับถือศาสนากี่คน (ถ้ามี) ที่รับข้อเสนอของข้า"
 false_conversion.0030.b_no_secret_faith:0 "ผู้แอบนับถืออะไรนะ? นี่มันเรื่องไร้สาระ"
 false_conversion.0030.b_has_secret_faith:0 "ความลับบางอย่างเก็บไว้ดีกว่า"
 false_conversion.0031.t:0 "$false_conversion.0030.t$"
 false_conversion.0031.desc:0 "เจ้าเหนือหัวของข้า [ROOT.Char.GetLiege.GetTitledFirstName] ได้ออกประกาศทั่วไปทั่วทั้ง [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] ว่าพวกเขาปรารถนาให้ทุกคนบูชาสิ่งศักดิ์สิทธิ์อย่างเปิดเผย โดยไม่คำนึงถึงลักษณะของศรัทธาของพวกเขา [ROOT.Char.GetLiege.GetSheHe|U] กำลังเสนอนิรโทษกรรมแก่ผู้ที่ปฏิบัติตามศาสนาของตนอย่างลับๆ"
 false_conversion.0031.a:0 "ในที่สุด เราก็ออกมาจากเงามืด!"
 false_conversion.0031.b:0 "เราเคยได้ยินคำโกหกเรื่องความอดทนอดกลั้นมาก่อนแล้ว..."

 false_conversion.1000.t: "อวสานของ [ROOT.Char.GetFaith.GetName]"
 false_conversion.1000.desc_intro: "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เรียกร้องในที่สุดให้ข้า"
 false_conversion.1000.desc_has_family: "และครอบครัวที่เหลือของข้า"
 false_conversion.1000.desc_convert: "เปลี่ยนไปนับถือ [actor.GetFaith.GetName]\n\n"
 false_conversion.1000.desc_forced: "[actor.GetSheHe|U] แทบจะจ่อดาบที่คอข้าในการเรียกร้องสิ่งนี้โดยใช้ข้อผูกมัดของ [actor.GetHerHis] ต่อข้า ถึงกระนั้น หากข้ายอมเสี่ยงต่อผลที่ตามมา ข้าก็สามารถปฏิบัติตาม [ROOT.Char.GetFaith.GetName] ต่อไปได้ "
 false_conversion.1000.desc_voluntary: "ข้าได้ยอมรับข้อเรียกร้องของ [actor.GetHerHis] ไม่มากก็น้อย แต่บางทีอาจมีวิธีที่จะประกาศ [actor.GetFaith.GetNameNoTooltip] อย่างเปิดเผย แต่ยังคงปฏิบัติตาม [ROOT.Char.GetFaith.GetName] "
 false_conversion.1000.desc_bold: "อย่างท้าทายในความลับ"
 false_conversion.1000.desc_cowardly: "ภายใต้ม่านบังตา"
 false_conversion.1000.desc_outro: "\n\nนี่เป็นการตัดสินใจที่หนักหน่วงที่จะทำเพียงลำพัง..."
 false_conversion.1000.a: "วิถีเก่าตายไปในวันนี้"
 false_conversion.1000.b_single: "ข้าจะเอ่ย [actor.GetFaith.GetNameNoTooltip] ด้วยริมฝีปาก แต่ [ROOT.Char.GetFaith.GetNameNoTooltip] อยู่ในใจข้า"
 false_conversion.1000.b_sanctioned_single: "[ROOT.Char.GetFaith.HighGodName] จะทรงอภัยให้ข้าที่ปฏิบัติตาม [ROOT.Char.GetFaith.GetName] อย่างลับๆ"
 false_conversion.1000.b_plural: "เราจะเอ่ย [actor.GetFaith.GetNameNoTooltip] ด้วยริมฝีปาก แต่ [ROOT.Char.GetFaith.GetNameNoTooltip] อยู่ในใจเรา"
 false_conversion.1000.b_sanctioned_plural: "[ROOT.Char.GetFaith.HighGodName] จะทรงอภัยให้เราที่ปฏิบัติตาม [ROOT.Char.GetFaith.GetName] อย่างลับๆ"

 false_conversion.1010.desc_has_no_family: "และ [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 false_conversion.1010.desc_spouse_intro: "[spouse.GetFirstNameNoTooltip] และข้าใช้เวลาหลายคืนพยายามหลีกเลี่ยงข้อเรียกร้องของ [actor.GetTitledFirstNamePossessiveNoTooltip] แต่ไม่เป็นผล ในที่สุด [spouse.GetFirstNameNoTooltip] ก็พูดสิ่งที่อยู่ในใจ [spouse.GetHerHis] ออกมา:\n\n"
 false_conversion.1010.desc_spouse_advises_secrecy: ""เราไม่สามารถละทิ้ง [spouse.GetFaith.HighGodName] ได้ ไม่ว่า [actor.GetTitledFirstNameNoTooltip] จะเรียกร้องอะไรก็ตาม เราต้องบูชา [spouse.GetFaith.HighGodName] ต่อไป แม้จะเป็นเพียงความลับก็ตาม""
 false_conversion.1010.desc_spouse_advises_conversion_cynical: ""ไม่ว่าเราจะบูชา [actor.GetFaith.GetNameNoTooltip] หรือ [spouse.GetFaith.GetNameNoTooltip] ก็ไม่ต่างกันสำหรับข้า แต่ถ้า [actor.GetTitledFirstNameNoTooltip] ประสงค์ให้เราปฏิบัติตาม [actor.GetFaith.GetNameNoTooltip] แล้วทำไมเราจะไม่ทำล่ะ?""
 false_conversion.1010.desc_spouse_advises_conversion_neutral: ""แม้จะเจ็บปวดที่ต้องพูด เช่นนี้ แต่เราไม่สามารถที่จะปฏิบัติตาม [spouse.GetFaith.GetNameNoTooltip] ได้ แม้จะอยู่ในความลับก็ตาม เราต้องทำตามพระประสงค์ของ [actor.GetTitledFirstNameNoTooltip] และเปลี่ยนไปนับถือ [actor.GetFaith.GetNameNoTooltip]""
 false_conversion.1010.desc_outro_demure: "\n\nข้าควรรับคำแนะนำของ "
 false_conversion.1010.desc_spouse_disliked: "[spouse.Custom2('InsultAdjective', ROOT.Char)] "
 false_conversion.1010.desc_spouse_liked: "[spouse.Custom('ComplimentAdjective')] "
 false_conversion.1010.desc_outro_wife_husband: "[spouse.GetWifeHusband] ของข้าหรือไม่?"

 false_conversion.2000.t: "ช่วงเวลาแห่งความอ่อนแอ"
 false_conversion.2000.desc_intro: "ยิ่งข้าใช้เวลากับ [vulnerable_relation.Custom2('MyCharacterIntroduction', owner)] มากเท่าใด ความท่วมท้นของ [vulnerable_relation.GetHerHis] ก็ยิ่ง"
 false_conversion.2000.desc_descriptor_grief: "เศร้าโศก"
 false_conversion.2000.desc_descriptor_depression: "หดหู่"
 false_conversion.2000.desc_descriptor_stress: "เครียด"
 false_conversion.2000.desc_bridge: "ปรากฏชัดเจนขึ้น\n\n"
 false_conversion.2000.desc_quote_grief: ""แม้ แต่สิ่งเล็กน้อยที่สุดก็ ทำให้ข้านึกถึง [deceased_character.GetFirstName]" [vulnerable_relation.GetTitledFirstNameNoTooltip] คร่ำครวญ "บัดนี้ข้าจะมีชีวิตอยู่ในโลกนี้ได้อย่างไรหากไม่มีพวกเขา?""
 false_conversion.2000.desc_quote_depression: ""แต่ละวันยากลำบากกว่าวันก่อน" [vulnerable_relation.GetTitledFirstNameNoTooltip] สารภาพกับข้า "ข้าจะดำเนินชีวิตต่อไป เช่นนี้ได้อย่างไร โดยที่ความปรารถนาที่จะมีชีวิตอยู่ค่อยๆ เลือนหายไปจากดวงตาของข้า?""
 false_conversion.2000.desc_quote_stress: ""ความทุกข์ยากประจำวันของชีวิตกลายเป็นเรื่องทรมานสำหรับข้า"" [vulnerable_relation.GetTitledFirstNameNoTooltip] คร่ำครวญ "ทุกวันข้าสวดอ้อนวอนขอการปลดปล่อยจากชะตากรรมที่ไม่อาจหลีกเลี่ยงได้ของข้า""
 false_conversion.2000.desc_outro: "\n\nบางที [owner.GetSecretFaith.HighGodName] อาจจะเติมชีวิตใหม่ให้กับร่างอันไร้วิญญาณนี้..."
 false_conversion.2000.a: ""[owner.GetSecretFaith.GetName] จะเยียวยาความเศร้าโศกของท่าน""
 false_conversion.2000.a_flavor: "[vulnerable_relation.GetTitledFirstNameNoTooltip] จะพิจารณาเปลี่ยนไปนับถือ [owner.GetSecretFaith.GetNameNoTooltip] อย่างลับๆ"
 false_conversion.2000.a_success: "[vulnerable_relation.GetTitledFirstNameNoTooltip] พบการปลอบประโลมใน [owner.GetSecretFaith.HighGodName]"
 false_conversion.2000.a_failure: "[vulnerable_relation.GetTitledFirstNameNoTooltip] รู้สึกขุ่นเคืองกับคำแนะนำของข้า"
 false_conversion.2000.b: "เป็นการผิดที่จะทำมากกว่าปลอบโยน [vulnerable_relation.GetTitledFirstNameNoTooltip]"

 false_conversion.2001.t: "ยามข้าต้องการ"
 false_conversion.2001.desc_grief: "ไม่มีวันใดผ่านไปโดยที่ข้าไม่ระลึกถึง [deceased_character.GetTitledFirstName] ทุกสิ่งที่เตือนให้นึกถึงชีวิตของ [deceased_character.GetHerHis] ในโลกนี้ล้วนก่อให้เกิดบ่อแห่งความเศร้าโศกใหม่"
 false_conversion.2001.desc_depression: "วันเวลาผ่านไปอย่างไม่รู้จบพร้อมกับความสุขและความเศร้าใหม่ๆ จากทุกคนรอบตัวข้า แต่ข้ายังคงอยู่ที่นี่ หลงทางอยู่ในทะเลสีเทา จมดิ่งอยู่กับอดีตมา [vulnerable_relation.GetAge] ปีแล้ว"
 false_conversion.2001.desc_stress: "ข้ามีอาการกระตุกโดยไม่สมัครใจ ข้ากัดเล็บ ขบฟัน เดินไปมาด้วยความเหนื่อยล้าก่อนจะนอนลืมตาบนเตียง แต่ถึงกระนั้น ข้าก็ยังคงรู้สึกท่วมท้นไปด้วยความเครียดเกินกว่าจะเข้าใจได้"
 false_conversion.2001.desc_outro: "\n\nขณะที่ข้ากำลังครุ่นคิดว่าจะมีชีวิตอยู่ต่อไปได้อย่างไร [owner.Custom2('RelationToMeAddress', vulnerable_relation)] ก็กระซิบข้างหูข้า "ท่านเพียงแค่ต้องน้อมรับพลังแห่งการเยียวยาของ [owner.GetSecretFaith.GetName] [vulnerable_relation.Custom2('RelationToMeAddress', owner)] แล้วความทุกข์ระทมของท่านจะถูกลบเลือนไป""
 false_conversion.2001.a: "เช่นนั้นข้าจะน้อมรับ [owner.GetSecretFaith.GetNameNoTooltip] ด้วยสุดใจ!"
 false_conversion.2001.b: "ท่านกำลังพูดเป็นนัยถึงอะไรกันแน่ [owner.GetTitledFirstNameNoTooltip]?"
 false_conversion.2001.b_flavor: "[owner.GetTitledFirstNameNoTooltip] ไม่พูดอะไรอีก... ในตอนนี้"

 false_conversion.8000.t: "ศรัทธาของข้าถูกเปิดโปง"
 false_conversion.8000.desc_intro: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เปิดเผยว่าข้าปฏิบัติตาม [ROOT.Char.GetSecretFaith.GetName] อย่างลับๆ!"
 false_conversion.8000.desc_disapproving_chaplain: "[disapproving_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กำลังเรียกร้องให้ข้าสำนึกผิดอย่างเปิดเผยและยอมจำนนต่อหน้า [disapproving_chaplain.GetFaith.HighGodName]"
 false_conversion.8000.desc_silent_chaplain: "[silent_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] นิ่งเงียบในเรื่องนี้ ดังนั้นข้าจึงต้องรับมือกับข้อเรียกร้องให้สำนึกผิดด้วยตนเอง"
 false_conversion.8000.desc_outro: ""
 false_conversion.8000.a: "ข้าจะไม่สงสัยใน [ROOT.Char.GetFaith.GetNameNoTooltip] อีกต่อไป!"
 false_conversion.8000.b: "[ROOT.Char.GetSecretFaith.GetNameNoTooltip] คือศรัทธาที่แท้จริงเพียงหนึ่งเดียว!"

 event_false_convert_my_vassal.t:0 "ข้าหลวงเปิดเผยศรัทธาที่ซ่อนเร้น"
 event_false_convert_my_liege.t:0 "เจ้าเหนือหัวเปิดเผยศรัทธาที่ซ่อนเร้น"
 event_false_convert_interface.desc:0 "[ROOT.Char.GetShortUIName] ได้ละทิ้งศรัทธาสาธารณะของ [ROOT.Char.GetHerHis] เพื่อ [ROOT.Char.GetFaith.GetName] เปิดเผยว่า [ROOT.Char.GetHerHim] เป็นผู้แอบนับถือศาสนา"
 event_false_converts.t:0 "ผู้แอบนับถือศาสนาที่ถูกเปิดเผย"
 event_false_converts_plus_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] คนจากข้าหลวงเจ้าของที่ดินของข้าได้เพิกถอนศรัทธาสาธารณะของพวกเขา\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] คนจากตัวละครที่ไม่มีที่ดินในราชสำนักของข้าได้เพิกถอนศรัทธาสาธารณะของพวกเขา\n\n[ROOT.Var('num_false_converts_counties').GetValue|V0] เคาน์ตีของข้ามีชุมชนผู้แอบนับถือศาสนาจำนวนมากที่ได้เปิดเผยศรัทธาที่ซ่อนเร้นของตนต่อสาธารณะ"
 event_false_converts_without_counties.desc:0 "[ROOT.Var('num_false_converts_vassal').GetValue|V0] คนจากข้าหลวงเจ้าของที่ดินของข้าได้เพิกถอนศรัทธาสาธารณะของพวกเขา\n\n[ROOT.Var('num_false_converts_landless').GetValue|V0] คนจากตัวละครที่ไม่มีที่ดินในราชสำนักของข้าได้เพิกถอนศรัทธาสาธารณะของพวกเขา"
 event_false_converts_counties_only.desc:0 "[ROOT.Var('num_false_converts_counties').GetValue|V0] เคาน์ตีในอาณาจักรของข้ามีชุมชนผู้แอบนับถือ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] จำนวนมาก และหลายแห่งได้ประกาศศรัทธาของตนพร้อมกับข้า"

 false_convert_modifier:0 "ผู้ต้องสงสัยว่าเป็นผู้เปลี่ยนศาสนาจอมปลอม"
 false_convert_modifier_desc:0 "เชื่อกันว่าหลายชุมชนในเคาน์ตีนี้ยังคงปฏิบัติตามศรัทธาเก่าของตนอย่างลับๆ"
 relieved_cryptos_modifier:0 "ผู้แอบนับถือศาสนาที่โล่งใจ"
 relieved_cryptos_modifier_desc:0 "ประชากรที่นี่รู้สึกขอบคุณที่ได้รับอนุญาตให้ปฏิบัติตามศรัทธาของตนในที่เปิดเผยได้อีกครั้ง"

 # Spreading the crypto-faith events
 convert_to_crypto_religion_key: "เปลี่ยนไปเป็นผู้แอบนับถือ[ROOT.Char.GetSecretFaith.GetNameNoTooltip]"
 convert_to_crypto_religion_interaction_key: "เปลี่ยนไปเป็นผู้แอบนับถือ[actor.GetSecretFaith.GetNameNoTooltip]"
 convert_to_crypto_religion_interaction: "$convert_to_crypto_religion_interaction_key$ #weak (แผนการ)#!"
 convert_to_crypto_religion_interaction_desc: "พยายาม ทำให้ [recipient.GetShortUINameNoTooltip] เป็นผู้เชื่ออย่างลับๆ ใน [actor.GetSecretFaith.GetName]"
 convert_to_crypto_religion: "เปลี่ยนไปเป็นผู้แอบนับถือ#D ศาสนา#!"
 convert_to_crypto_religion_desc: "ข้าจะเผยแพร่ปัญญาของ [SCHEME.GetOwner.GetSecretFaith.KnowledgeGodName] ไปยัง [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] และ ทำให้ [SCHEME.GetTargetCharacter.GetHerHim] เป็นผู้เชื่ออย่างลับๆ ใน [SCHEME.GetOwner.GetSecretFaith.GetNameNoTooltip]"
 convert_to_crypto_religion_desc_general: "สอนเป้าหมายให้กลายเป็นผู้เชื่ออย่างลับๆ ใน [CHARACTER.GetSecretFaith.GetName]"
 convert_to_crypto_religion_action: "เปลี่ยนศาสนา"
 convert_to_crypto_religion_interaction_notification: "$convert_to_crypto_religion_interaction_key$"
 convert_to_crypto_religion_scheme_invalidated_title: "@scheme_icon! แผนการ "$convert_to_crypto_religion$" สิ้นสุดลง"
 convert_to_crypto_religion_general_desc: "[scheme|E] เพื่อแนะนำศรัทธาที่ซ่อนเร้นให้กับเป้าหมายโดยหวังว่าจะขยายกลุ่มผู้เชื่ออย่างลับๆ ของเจ้าของแผนการ"
 convert_to_crypto_religion_no_more_secret: "ข้าไม่ได้ปฏิบัติตามการแอบนับถือ [CHARACTER.GetSecretFaith.GetName] อีกต่อไป"
 convert_to_crypto_religion_invalid: "ข้าไม่สามารถเปลี่ยน [target.GetShortUIName|U] ให้เป็นผู้แอบนับถือ [CHARACTER.GetSecretFaith.GetName] ได้อีกต่อไป"
