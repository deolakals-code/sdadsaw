l_english: 
 head_of_faith.0000.new_faith_submitted_for_hook:0 "[ROOT.Char.GetTitledFirstName] ได้ยอมสวามิภักดิ์ต่อคอลีฟะฮ์ของท่านแล้ว"
 head_of_faith.0000.wishes_to_schism_caliphate_flag_added:0 "การละทิ้งคอลีฟะฮ์ที่ท่านเลือกจะง่ายขึ้นตลอดช่วงชีวิตของท่าน"
 head_of_faith.0000.t:0 "ทายาทแห่งนบี"
 head_of_faith.0000.desc:0 "และผู้ศรัทธาที่แท้จริงทั้งหลายคาดหวังให้ข้า ในฐานะสมาชิกผู้ทรงเกียรติสูงสุดแห่งศรัทธา ให้สัตย์ปฏิญาณตนต่อคอลีฟะฮ์ที่มีอยู่\n\nเพียงการยอมสวามิภักดิ์ต่ออำนาจสูงสุดภายใต้ [ROOT.Char.GetFaith.HighGodName] เท่านั้น ข้าจึงจะสามารถสถาปนาอำนาจของตนเองได้ ไม่ว่าความแตกต่างทางเทววิทยาอื่นใดของเราจะเป็น เช่นไร\n\nคำถามหลักที่อยู่เบื้องหน้าข้าคือ แน่นอนว่า #EMP แด่ผู้ใด#! — แม้ว่าผู้ที่ฉลาดที่สุดในหมู่พวกเรายังถามด้วยว่า #EMP อย่างจริงใจเพียงใด#! — ที่ข้าจะให้สัตย์ปฏิญาณ..."

 head_of_faith.0001.t:0 "$head_of_faith.0000.t$: สุนหนี่"
 head_of_faith.0001.desc:0 "พวกเรา [ROOT.Char.GetFaith.GetAdherentName] ได้เลือกที่จะดำเนินตามเส้นทางของทายาทแห่งอบูบักร์ $head_of_faith.0000.desc$"
 head_of_faith.0001.a:0 "การปรับเข้ากับแนวทางดั้งเดิมของสุนหนี่เป็นทางเลือกเดียวของเรา"
 head_of_faith.0001.b:0 "เราต้องยึดมั่นในอำนาจของ [old_caliph.GetFaith.GetAdjectiveNoTooltip] ต่อไป!"
 head_of_faith.0001.c:0 "[sunni_caliph.GetTitledFirstNameNoTooltip] ได้รับความภักดี #EMP ในปัจจุบัน#! ของเรา..."
 head_of_faith.0001.d:0 "เราจะติดตาม [old_caliph.GetTitledFirstNameNoTooltip]... สำหรับตอนนี้..."

 head_of_faith.0011.t:0 "$head_of_faith.0000.t$: ชีอะฮ์"
 head_of_faith.0011.desc:0 "[ROOT.Char.GetFaith.GetName] ดำเนินตามสายเลือดอันไร้ข้อผิดพลาดของอาลี $head_of_faith.0000.desc$"
 head_of_faith.0011.a:0 "แนวคิดหลักของชีอะฮ์เรียกร้องเรา"
 head_of_faith.0011.b:0 "$head_of_faith.0001.b$"
 head_of_faith.0011.c:0 "[shia_caliph.GetTitledFirstNameNoTooltip] บัญชาเรา ในขณะนี้"
 head_of_faith.0011.d:0 "$head_of_faith.0001.d$"

 head_of_faith.0021.t:0 "$head_of_faith.0000.t$: มุฮักกิมะฮ์"
 head_of_faith.0021.desc:0 "การปฏิเสธการเมืองอันไร้ค่าของสุนหนี่และชีอะฮ์ได้ ทำให้ [ROOT.Char.GetFaith.GetName] เป็นผู้ยึดมั่นในสายมุฮักกิมะฮ์ของอิสลาม แม้ว่าสมาชิกทั่วไปของขบวนการจะไม่คาดหวังให้ข้าให้สัตย์ปฏิญาณยอมจำนนต่อคอลีฟะฮ์ที่มีอยู่ พวกเขาอาจยอมรับได้หากข้าแสดงความจงรักภักดีอย่างชัดเจน"
 head_of_faith.0021.a:0 "เราสามารถเลือกผู้นำของเราเองได้"
 head_of_faith.0021.b:0 "$head_of_faith.0001.b$"

 head_of_faith.0031.t:0 "$head_of_faith.0000.t$: ซันดะเกาะฮ์"
 head_of_faith.0031.desc:0 "ในฐานะซันดะเกาะฮ์ เราไม่สนใจว่านิกายอิสลามอื่น ๆ จะสืบสายการสืบทอดของนบีอย่างไร และพวกเขาก็ไม่ชอบเราเป็นการตอบแทน เพื่อน [ROOT.Char.GetFaith.GetAdherentNamePlural] ของข้าไม่คาดหวังให้ข้าประกาศการยอมจำนนต่อคอลีฟะฮ์ที่มีอยู่ใด ๆ อย่างแน่นอน\n\nกระนั้น บางทีโดยการให้สัตย์ปฏิญาณความจงรักภักดีต่อหนึ่งในมหาอำนาจแห่งอิสลาม อาจสามารถซื้อความมั่นคงและความอดทนอดกลั้นให้กับศรัทธาของเราได้..."
 head_of_faith.0031.a:0 "$head_of_faith.0021.a$"
 head_of_faith.0031.b:0 "$head_of_faith.0001.a$"
 head_of_faith.0031.c:0 "$head_of_faith.0011.a$"
 head_of_faith.0031.d:0 "$head_of_faith.0001.b$"
 head_of_faith.0031.rejection_body:0 "ปฏิเสธคำสัตย์ปฏิญาณ"
 head_of_faith.0031.acceptance_body:0 "ยอมรับคำสัตย์ปฏิญาณ"
 head_of_faith.0031.rejection.outcome:0 "ท่านถูกบังคับให้เลือกเส้นทางของตนเองโดยไม่คำนึงถึงสิ่งใด"
 head_of_faith.0031.b.rejection:0 "@piety_level_0_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.b.acceptance:0 "@piety_level_3_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.c.rejection:0 "@piety_level_0_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.c.acceptance:0 "@piety_level_3_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.d.rejection:0 "@piety_level_0_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.d.acceptance:0 "@piety_level_3_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0032.t:0 "สัตย์ปฏิญาณแห่งศรัทธา"
 head_of_faith.0032.desc:0 "ถึง [pledge_target.GetTitledFirstNameNoTooltip] พวกเรา [pledgeing_individual.GetFaith.GetAdherentNamePlural] ปรารถนาที่จะให้สัตย์ปฏิญาณความภักดีต่อท่านและมีท่านเป็น [head_of_faith|E] ของเรา\n\nโปรดรับพวกเราไว้ภายใต้การชี้นำของท่านได้หรือไม่?"
 head_of_faith.0032.a:0 "@piety_level_3_icon_islam! แน่นอน ข้าจะปฏิเสธได้อย่างไร?"
 head_of_faith.0032.b:0 "@piety_level_0_icon_islam! ไปให้พ้น พวกขอทานชั้นต่ำ!"
 head_of_faith.0032.notif.a:0 "[pledge_target.GetTitledFirstNameNoTooltip] ยอมรับคำสัตย์ปฏิญาณของท่านแล้ว!"
 head_of_faith.0032.notif.b:0 "[pledge_target.GetTitledFirstNameNoTooltip] ปฏิเสธคำสัตย์ปฏิญาณของท่าน!"
