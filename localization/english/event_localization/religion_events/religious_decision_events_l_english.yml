l_english: 
 religious_decision.0001.t:0 "พิธีอ้อนวอนวิญญาณ"
 religious_decision.0001.desc: "[ROOT.Char.Custom('MyPriestTitle')] [realm_priest.GetFirstName] ของข้า พาข้าไปยังแอ่งสงบใกล้ลำธารเล็ก ๆ เสียงน้ำไหลรินสม่ำเสมอเหนือโขดหินสร้างบรรยากาศผ่อนคลาย\n\n"เหล่าวิญญาณชอบที่นี่ [ROOT.Char.GetFirstNameNoTooltip] นี่คือสถานที่ที่ดีที่สุดสำหรับเราในการร้องขอความช่วยเหลือจากพวกเขา""\n\nพลางชูตะกร้าสองใบที่ [realm_priest.GetFirstNameNoTooltip] นำมากับ [realm_priest.GetHerHim] [realm_priest.GetSheHe] กล่าวเสริมว่า: "บัดนี้เราต้องตัดสินใจว่าจะทิ้งเครื่องเซ่นไหว้ประเภทใดไว้ให้พวกเขา"""
 religious_decision.0001.desc_landless: "ขณะเดินท่องไปในป่าพร้อมกระเช้าเครื่องเซ่น ข้าก็พบกับลำธารอันเงียบสงบซ่อนตัวอยู่ในปากถ้ำอย่างรวดเร็ว\n\nอากาศอบอวลไปด้วยการสถิตอยู่ของเหล่าดวงวิญญาณ\n\nทว่า เมื่อไม่รู้แน่ชัดว่ามีดวงวิญญาณตนใดอยู่บ้าง ข้าจึงครุ่นคิดถึงสิ่งที่อยู่ในกระเช้า ข้าควรจะมอบสิ่งใดให้แก่พวกเขากัน?"
 religious_decision.0001.a:0 "เครื่องเซ่นอันยิ่งใหญ่ ประกอบด้วยเบี้ยหอย ผลไม้ และมดยอบ"
 religious_decision.0001.b:0 "เครื่องดื่มเซ่นไหว้ตามประเพณี ทำจากธัญพืชและเหล้าตาล"
 religious_decision.0001.c:0 "เครื่องเซ่นรึ? บ๊ะ! แค่การมาของข้ายังไม่พออีกหรือ?"
 religious_decision.0001.d:0 "คิดดูอีกที อย่าไปรบกวนพวกเขาเลยดีกว่า..."
 religious_decision.0001.a.tt.1:0 "เหล่าดวงวิญญาณจะ #P ต้องสังเกตเห็น#! เครื่องเซ่นนี้อย่างแน่นอน"
 religious_decision.0001.a.tt.2:1 "สิ่งนี้อาจดึงดูดความสนใจของ #Z วิญญาณทรงพลัง#! ไม่ว่าจะดีหรือร้าย"
 religious_decision.0001.b.tt:0 "เหล่าดวงวิญญาณ #P น่าจะสังเกตเห็น#! เครื่องเซ่นนี้"
 religious_decision.0001.c.tt:0 "เหล่าดวงวิญญาณ #N น่าจะขุ่นเคือง#! แต่ความอาจหาญอย่างแท้จริงอาจ #P ทำให้พวกเขาประทับใจ#! แทนก็ได้"
 religious_decision.0001.d.flavor:0 "เหล่าดวงวิญญาณนั้นเอาแน่เอานอนไม่ได้ เป็นการดีที่สุดที่จะไม่เสี่ยง ทำให้พวกเขาโกรธเคือง"

 religious_decision.0002.t:0 "พิธีอ้อนวอนวิญญาณ"
 religious_decision.0002.desc.start_offering:0 "[realm_priest.GetFirstName] เทเครื่องเซ่นของข้าลงบนพื้นและเริ่มเดินวนรอบเป็นวงกลม"
 religious_decision.0002.desc.start_offering_alone: "ข้าเทเครื่องเซ่นของข้าลงบนพื้นและเริ่มเดินวนรอบเป็นวงกลม"
 religious_decision.0002.desc.start_no_offering:0 "[realm_priest.GetFirstName] จ้องมองข้าอย่างงุนงง "ท่านถวาย... ตัวท่านเองหรือ? ข้าว่าคงใช้ได้กระมัง..." [realm_priest.GetSheHe] กล่าว ขณะที่ [realm_priest.GetSheHe] เริ่มเดินวนรอบตัวข้า"
 religious_decision.0002.desc.start_no_offering_alone: "ข้าลังเลอยู่ครู่หนึ่ง ขณะพิจารณาถึงความอาจหาญที่อาจเกิดขึ้นจากการเสนอเพียงแค่ตัวข้าเองแก่เหล่าดวงวิญญาณ จากนั้นข้าก็เริ่มเดินเป็นวงกลมเพื่อเริ่มพิธีกรรม"
 religious_decision.0002.desc:0 "\n\n"โอ้ เหล่าวิญญาณ โปรดฟังข้า ข้าขอวิงวอนท่านโปรดประทานความช่วยเหลือแก่ผู้ร้องขอนี้!" [realm_priest.GetFirstNameNoTooltip] สวดภาวนา\n\n[realm_priest.GetSheHe|U] เริ่มเคลื่อนไหวเร็วขึ้น ร่ายรำแล้วบัดนี้ ท่าทางของ [realm_priest.GetHerHis] เริ่มบ้าคลั่งมากขึ้น เหงื่อส่องประกายบนใบหน้าของ [realm_priest.GetHerHis] ในที่สุด [realm_priest.GetSheHe] ก็ถึงจุดสูงสุด แทบจะไม่จบการร่ายรำก่อนที่จะล้มลงกับพื้นด้วยความเหนื่อยล้า"
 religious_decision.0002.desc_alone: "\n\n"เหล่าดวงวิญญาณ โปรดสดับฟัง โปรดพิจารณาเครื่องเซ่นของข้าและช่วยเหลือข้าตามคำวิงวอนด้วยเถิด!" ข้าเปล่งเสียงก้องเข้าไปในโพรงไม้ที่บัดนี้พลบค่ำแล้ว\n\nขณะที่ข้ายังคงเดินวนอยู่ พลังงานอันพลุ่งพล่านก็ถาโถมเข้าใส่ข้า เหงื่อแตกพลั่กบนหน้าผาก และแขนขาของข้าเคลื่อนไหวอย่างบ้าคลั่ง — เร็วขึ้นและเร็วขึ้น ข้าเคลื่อนไหว เคลื่อนไหว #EMP เคลื่อนไหว#! — จนกระทั่งในที่สุดข้าก็ล้มลงกับพื้น หอบหายใจ"
 religious_decision.0002.desc.end_changed:0 "\n\nเมื่อพิธีกรรมสิ้นสุดลง ข้ารู้สึกเปลี่ยนไป เปลี่ยนแปลงไปอย่างใดอย่างหนึ่ง..."
 religious_decision.0002.desc.end_no_change: "\n\nความนิ่งและความเงียบสงัดกลับคืนสู่โพรงไม้ ทุกสิ่งดูเหมือนเดิมทุกประการ"
 religious_decision.0002.shrewd:0 "จิตใจของข้าไม่เคยปลอดโปร่ง เช่นนี้มาก่อน!"
 religious_decision.0002.strong:0 "ช่างเปี่ยมพลัง! ช่างแข็งขัน!"
 religious_decision.0002.good:0 "ความรู้สึกประหลาดนี้คืออะไรกัน?"
 religious_decision.0002.bad:0 "นี่ต้องไม่ใช่เรื่องดีแน่..."
 religious_decision.0002.possessed:0 "ข้ารู้สึกเหมือนถูกกักขังอยู่ในร่างของตัวเอง!"
 religious_decision.0002.no_change.zealous:0 "ข้าได้ล่วงเกินเหล่าดวงวิญญาณไปอย่างใดหรือไม่?"
 religious_decision.0002.no_change:0 "ช่างเสียเวลาโดยแท้"

 religious_decision.0101.t:0 "ภักติ"
 religious_decision.0101.desc.start:0 "ภักติอาจเปรียบได้กับความรู้สึกรักใคร่ การอุทิศตน และการบูชา แต่ไม่มีคำใดครอบคลุมแนวคิดนี้ได้อย่างสมบูรณ์ การอุทิศตนให้กับอวตารแห่งเทพเจ้านั้น ข้ากำลังมอบกายและใจให้กับพวกเขา\n\n[ROOT.Char.GetFaith.GetNameNoTooltip] มุ่งเน้นไปที่การบูชา"
 religious_decision.0101.desc.generic:0 "เพียงไม่กี่องค์เท่านั้น"
 religious_decision.0101.desc.vaishnavism:0 "อวตารปางต่างๆ ของพระวิษณุ ผู้รักษา"
 religious_decision.0101.desc.shaivism:0 "อวตารปางต่างๆ ของพระศิวะ ผู้ทำลาย"
 religious_decision.0101.desc.smartism:0 "แง่มุมต่างๆ ของความเป็นจริงสูงสุด"
 religious_decision.0101.desc.end:0 "ในบรรดาแง่มุมเหล่านี้ ต้องมีองค์หนึ่งที่สื่อสารกับข้าได้มากกว่าองค์อื่นๆ..."
 religious_decision.0101.ganga:0 "พระแม่คงคา เทพแห่งความบริสุทธิ์และการไถ่บาป"
 religious_decision.0101.saraswati:0 "พระสุรัสวดี เทพีแห่งการเรียนรู้และศิลปะ"
 religious_decision.0101.kali:0 "พระแม่กาลี เทพีแห่งการทำลายล้างความชั่วร้าย"
 religious_decision.0101.kubera:0 "ท้าวกุเวร เทพแห่งความมั่งคั่งและความยุติธรรม"
 religious_decision.0101.lakishmi:0 "พระลักษมี เทพีแห่งโชคลาภและความเจริญรุ่งเรือง"
 religious_decision.0101.jagganath:0 "พระชคันนาถ เจ้าแห่งจักรวาล"
 religious_decision.0101.hayagriva:0 "พระหยครีวะ เทพแห่งความรู้และปัญญา"
 religious_decision.0101.parvati:0 "พระปารวตี เทพีแห่งความอุดมสมบูรณ์และความงาม"
 religious_decision.0101.virabhadra:0 "พระวีรภัทร เทพแห่งความโกรธที่ชอบธรรม"
 religious_decision.0101.munishwarar:0 "พระมุนีศวร เทพแห่งบ้านและครอบครัว"
 religious_decision.0101.dakshinamoorthy:0 "พระทักษิณามูรติ เทพแห่งการเรียนรู้ทุกรูปแบบ"
 religious_decision.0101.ganesha:0 "พระพิฆเนศ เทพแห่งปัญญาและการเริ่มต้นใหม่"
 religious_decision.0101.vishnu:0 "พระวิษณุ เทพผู้ดูแลการสร้างสรรค์"
 religious_decision.0101.shiva:0 "พระศิวะ เทพผู้ไล่ล่าความชั่วร้าย"
 religious_decision.0101.optout:0 "ข้ายังไม่พร้อมที่จะตัดสินใจ"
 religious_decision.0101.flavor:0 "ไม่มีความน่าละอายใดในการรอจนกว่าข้าจะแน่ใจ"

 religious_decision.0102.t:0 "การเลือกเทพเจ้าองค์ประธาน"
 religious_decision.0102.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] มีมากมายและหยั่งรู้ได้ยาก แต่ข้าก็ไม่อาจกล่าวได้ว่าไม่มีบางองค์ที่ดึงดูดใจข้าเป็นพิเศษ หากข้าจะอุทิศตนอย่างเปิดเผยเพื่อบูชาเทพเจ้าองค์ใดองค์หนึ่งเป็นหลัก ข้าก็จะดึงดูดผู้ที่มีจิตวิญญาณคล้ายคลึงกันมาอยู่เคียงข้างข้าอย่างไม่ต้องสงสัย\n\nไม่ว่าพรใดที่องค์อุปถัมภ์ของข้าประทานให้ การอยู่ร่วมกับชาว [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ที่คล้ายคลึงกันย่อมนำมา ซึ่งสุขภาพ ความมั่งคั่ง และเกียรติยศแก่ข้าเท่านั้น"
 religious_decision.0102.odin:0 "โอดิน ประมุขแห่งแอซีร์!"
 religious_decision.0102.ullr:0 "อุลล์ นักล่า นักรบ ตัวแทนแห่งเกียรติยศ!"
 religious_decision.0102.tyr:0 "ทีร์ มือเดียว นักรบ!"
 religious_decision.0102.thor:0 "ธอร์ สหายแห่งมนุษยชาติ!"
 religious_decision.0102.freyr:0 "เฟรย์ เจ้าและผู้พิทักษ์!"
 religious_decision.0102.optout:0 "$religious_decision.0101.flavor$"
 religious_decision.0102.flavor:0 "$religious_decision.0101.flavor$"

 religious_decision.0201.t:0 "บำเพ็ญสมาธิในที่วิเวก"
 religious_decision.0201.desc:0 "การเดินทางภายในผ่านการทำสมาธิไม่ใช่เรื่องเล็กน้อย ต้องมีการเตรียมการมากมาย อย่างน้อยที่สุดคือการตัดสินใจว่าข้าจะไปปลีกวิเวกที่ใด\n\nสถานที่ที่ข้าเลือกทำสมาธิจะมีอิทธิพลอย่างมากต่อผลลัพธ์ของการเดินทางของข้า"
 religious_decision.0201.home:0 "ความสะดวกสบายใน [ROOT.Char.Custom('ResidenceBuilding')] ของข้าเอง"
 religious_decision.0201.plains:1 "ที่ราบอันนุ่มนวลแห่ง [plains_location.GetNameNoTooltip]"
 religious_decision.0201.hills:1 "เนินเขาที่ทอดตัวแห่ง [hills_location.GetNameNoTooltip]"
 religious_decision.0201.steppe:1 "ภายใต้ผืนฟ้าสีครามกว้างใหญ่แห่ง [steppe_location.GetNameNoTooltip]"
 religious_decision.0201.forest:1 "ผืนป่าอันเงียบสงบแห่ง [forest_location.GetNameNoTooltip]"
 religious_decision.0201.drylands:1 "พุ่มไม้ในดินแดนแห้งแล้งแห่ง [drylands_location.GetNameNoTooltip]"
 religious_decision.0201.mountains:1 "เทือกเขาอันห่างไกลแห่ง [mountains_location.GetNameNoTooltip]"
 religious_decision.0201.wetlands:1 "หนองบึงอันอับชื้นแห่ง [wetlands_location.GetNameNoTooltip]"
 religious_decision.0201.jungle:1 "ป่าดงดิบอันอึกทึกแห่ง [jungle_location.GetNameNoTooltip]"
 religious_decision.0201.desert:1 "ความร้อนแผดเผาแห่ง [desert_location.GetNameNoTooltip]"
 religious_decision.0201.optout:0 "ข้ายุ่งเกินกว่าจะทำสมาธิในตอนนี้"
 religious_decision.0201.optout.flavor:0 "ไม่ต้องรีบร้อน โลกไม่ได้ไปไหน"
 religious_decision.0201.difficulty.easy:0 "[tooltip_loc.GetName] เป็นสถานที่ #P ปลอดภัยและง่ายดาย#! ในการทำสมาธิ"
 religious_decision.0201.difficulty.medium:1 "[tooltip_loc.GetName] เป็นสถานที่ #Z ท้าทายปานกลาง#! ในการทำสมาธิ"
 religious_decision.0201.difficulty.hard:0 "[tooltip_loc.GetName] เป็นสถานที่ #N ยากลำบากและอันตราย#! ในการทำสมาธิ"
 religious_decision.0201.stress:0 "ข้ามีแนวโน้มที่จะสูญเสีย [stress|e] มากขึ้น ณ สถานที่แห่งนี้"
 religious_decision.0201.trait:0 "ข้ามีแนวโน้มที่จะได้รับข้อมูลเชิงลึกส่วนบุคคลมากขึ้น ณ สถานที่แห่งนี้"
 religious_decision.0201.learning:0 "ข้ามีแนวโน้มที่จะได้รับข้อมูลเชิงลึกทางเทววิทยามากขึ้น ณ สถานที่แห่งนี้"

 religious_decision.0210.toast:0 "ท่านเริ่มบำเพ็ญสมาธิ"

 religious_decision.0211.t:0 "$religious_decision.0201.t$"
 religious_decision.0211.desc.beginning.home:0 "เมื่อกลับไปยังห้องส่วนตัว ข้าก็เริ่มช่วงเวลาแห่งการอดอาหารและทำสมาธิอันยาวนาน"
 religious_decision.0211.desc.beginning.plains:1 "เมื่อเดินทางไปยังที่ราบกว้างใหญ่แห่ง [meditation_location.GetName] ข้าพบว่าจิตใจของข้าปลอดโปร่งและเป็นอิสระที่จะท่องเที่ยวไป"
 religious_decision.0211.desc.beginning.hills:1 "ทิวทัศน์อันแจ่มชัดจากยอดเนินเขาใน [meditation_location.GetName] เอื้ออำนวยต่อการครุ่นคิดอย่างลึกซึ้ง"
 religious_decision.0211.desc.beginning.steppe:1 "ภายใต้ท้องฟ้าอันกว้างใหญ่ของทุ่งหญ้าสเตปป์ [meditation_location.GetName] ข้าพบว่าจิตใจของข้าปลอดโปร่งและเป็นอิสระที่จะท่องเที่ยวไป"
 religious_decision.0211.desc.beginning.forest:1 "หลังจากมาถึงป่ารกทึบแห่ง [meditation_location.GetName] ข้าก็พบที่โล่งอันเงียบสงบเพื่อทำสมาธิ"
 religious_decision.0211.desc.beginning.drylands:1 "อากาศแห้งของพุ่มไม้ [meditation_location.GetName] เติมเต็มปอดของข้าและเสียดสีผิวหนังของข้า"
 religious_decision.0211.desc.beginning.mountains:1 "อากาศบนภูเขาที่เบาบางใน [meditation_location.GetName] ทำให้ความคิดของข้าแจ่มชัดขณะที่ข้ามุ่งความสนใจไปภายใน"
 religious_decision.0211.desc.beginning.wetlands:1 "อากาศชื้นของพื้นที่ชุ่มน้ำ [meditation_location.GetName] ทำให้เสื้อผ้าของข้าแนบติดกับผิวหนังขณะที่ข้านั่งลงและเพ่งมองเข้าไปในจิตวิญญาณของข้า"
 religious_decision.0211.desc.beginning.jungle:1 "เสียงแมลงหึ่งๆ และเสียงนกร้องเพลงของป่าดิบชื้น [meditation_location.GetName] เป็นเสียงพื้นหลังอย่างต่อเนื่องขณะที่ข้าพยายามมองเข้าไปในตัวเอง"
 religious_decision.0211.desc.beginning.desert:1 "ด้วยแสงแดดอันร้อนแรงของทะเลทรายใน [meditation_location.GetName] ที่แผดเผาข้า ข้ามองเข้าไปภายในเพื่อแสวงหาความเข้าใจที่ลึกซึ้งยิ่งขึ้นเกี่ยวกับตำแหน่งของข้าในจักรวาล"
 religious_decision.0211.desc.result.impatient:0 "\n\nทว่าในไม่ช้าข้าก็เริ่มหมดความอดทน เพราะไม่ว่าข้าจะนั่งนิ่งเพียงใดหรือพยายามหนักแค่ไหน ข้าก็ไม่สามารถรู้สึกอะไรได้นอกจากความเบื่อหน่าย"
 religious_decision.0211.desc.result.secret:0 "\n\nน่าเสียดายที่ข้าหยุดคิดถึงความลับดำมืดที่ข้าเก็บไว้ไม่ได้ จะเกิดอะไรขึ้นหากโลกรู้? เมื่อมัว แต่หมกมุ่นอยู่กับความคิด เช่นนั้น ข้าก็ไม่อาจพบความสงบได้"
 religious_decision.0211.desc.result.hungry:0 "\n\nทว่าในไม่ช้าความหิวก็ครอบงำข้า และข้าตระหนักว่าเสบียงที่ข้านำมานั้นไม่เพียงพออย่างน่าเศร้า วันที่เหลือของการเดินทางของข้าเต็มไปด้วยการดิ้นรนหาอาหารในป่า ทำให้เหลือเวลาเพียงน้อยนิดสำหรับการครุ่นคิดถึงตนเอง"
 religious_decision.0211.desc.result.thirsty:0 "\n\nไม่นานข้าก็พบว่าริมฝีปากของข้าแตกแห้งและความกระหายที่เพิ่มขึ้น ซึ่งข้าไม่สามารถดับได้นานด้วยเพียงกระติกน้ำของข้า ในไม่ช้าข้าก็ตระหนักว่าข้าจำเป็นต้องล่าถอยไปยังที่พักพิงเพื่อเอาชีวิตรอดจากความร้อน แต่โรงเตี๊ยมที่ข้าพบนั้นวุ่นวายเกินกว่าที่ข้าจะพบความสงบและความเงียบที่ข้าต้องการได้"
 religious_decision.0211.desc.result.headache:0 "\n\nน่าเสียดายที่ไม่นานข้าก็เริ่มมีอาการปวดศีรษะอย่างรุนแรง ซึ่งไม่ยอมหยุด ในไม่ช้าข้าก็ไม่สามารถคิดถึงสิ่งใดได้นอกจากความเจ็บปวด"
 religious_decision.0211.desc.result.distraction:0 "\n\nน่าเสียดายที่เสียงอึกทึกครึกโครมที่ไม่สิ้นสุดทำหน้าที่เป็นสิ่งรบกวนอย่างต่อเนื่อง และข้าพบว่าความรำคาญที่เพิ่มขึ้นของข้าเป็นอุปสรรคทางจิตใจที่ข้าไม่สามารถเอาชนะได้"
 religious_decision.0211.desc.result.minor_stress: "\n\nเมื่อปราศจากภาระจากความกังวลอันซ้ำซากจำเจของชีวิตประจำวันใน[ROOT.Char.Custom('GetCourt')|l] ในไม่ช้าข้าก็พบว่าตัวเองใช้เวลามากขึ้นในการเพลิดเพลินกับความสุขเรียบง่ายในชีวิต"
 religious_decision.0211.desc.result.medium_stress: "\n\nสถานที่ห่างไกลเป็นประโยชน์อย่างยิ่ง ทำให้ข้าได้พักผ่อนจากปัญหาประจำวันที่ข้ามักจะต้องเผชิญใน[ROOT.Char.Custom('GetCourt')|l]"
 religious_decision.0211.desc.result.major_stress: "\n\nเมื่ออยู่โดดเดี่ยวห่างไกลในป่า ข้าพบว่าปัญหาที่เคยเป็นภาระแก่ข้าใน[ROOT.Char.Custom('GetCourt')|l] ไม่มีน้ำหนักอีกต่อไป เป็นครั้งแรกในรอบนานเกินไปที่ข้าได้พบกับความสงบ"
 religious_decision.0211.desc.result.reflection:0 "\n\nเมื่อมองลึกลงไปในตัวเอง ข้าตระหนักว่าชีวิตที่ข้าดำเนินมานี้ช่างตื้นเขินและไม่สมบูรณ์แบบ ถูกแปดเปื้อนด้วยความปรารถนาที่ไม่ดีต่อสุขภาพ เมื่อกลับจากการเดินทาง ข้าพบว่าสิ่งเหล่านี้ไม่มีเสน่ห์ดึงดูดใจเหมือนเคยอีกต่อไป"
 religious_decision.0211.desc.result.epiphany:0 "\n\nขณะทำสมาธิในที่โดดเดี่ยว ข้าก็เกิดการรู้แจ้งขึ้นมาทันที การดำรงอยู่ของมนุษย์ในโลกและวิธีที่เราเข้ากับระเบียบธรรมชาติ... ชิ้นส่วนอีกชิ้นของปริศนาจักรวาล ได้เข้าที่เข้าทางแล้ว!"
 religious_decision.0211.desc.result.fugue:0 "\n\nหลังจากผ่านไปหลายวัน ข้าพบว่าตัวเองเข้าสู่สภาวะภวังค์ สูญเสียความรู้สึกตัวตนไปโดยสิ้นเชิง เมื่อปราศจากความปรารถนาและอคติ ข้าเห็นความจริงของจักรวาลจารึกอยู่ในเนื้อแท้ของโลกรอบตัวข้า ข้ามองเห็นทุกสิ่ง... เข้าใจทุกสิ่ง... จักรวาลและข้า เป็นหนึ่งเดียวกัน\n\nในที่สุดข้าก็กลับมาเป็นตัวของตัวเองคนเดิม แม้ว่าข้าจะยังคงจำเศษเสี้ยวของสิ่งที่ข้าเรียนรู้ในสภาวะภวังค์ได้ก็ตาม"
 religious_decision.0211.a.critical_success:0 "ประสบการณ์นี้จะอยู่กับข้าตลอดไป"
 religious_decision.0211.a.success:0 "ข้ายินดีที่ได้สละเวลาทำสิ่งนี้"
 religious_decision.0211.a.failure:0 "อนิจจา..."
 religious_decision.0211.experience:0 "ท่านพัฒนาทักษะในการทำสมาธิ"
 religious_decision.0291.toast:1 "ท่านเสร็จสิ้นการบำเพ็ญสมาธิ"

 religious_decision.0302.t:0 "พิธีศพทิเบต"
 religious_decision.0302.desc.wilderness: "ตามประเพณี กลุ่มเล็กๆ จาก[ROOT.Char.Custom('GetCourt')|l]ของข้าได้รวมตัวกันเพื่อแห่ร่างของ[ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive]ออกไปยังป่า เพื่อที่เราจะได้ทำพิธีฝังศพให้[ROOT.Var('ancestor_to_bury').Char.GetHerHim]อย่างเหมาะสม\n\nเมื่อสังเกตเห็นขบวนแห่ ไม่นานนักนกกินซากก็เริ่มบินวนอยู่เหนือศีรษะ พวกมันกระตือรือร้น แต่ไม่อดทน รอให้เรากล่าวคำอำลาครั้งสุดท้ายและจากไปก่อนที่จะลงมากินเลี้ยง"
 religious_decision.0302.desc.zoroastrian:0 "เพื่อหลีกเลี่ยงการปนเปื้อนจากปีศาจซากศพนาสุ ข้าจึงไม่ได้รับอนุญาตให้เข้าไปในหอคอยดัคมา ซึ่งร่างของ[ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive]จะถูกชำแหละ\n\nแต่[ROOT.Char.GetFaith.PriestNeuterPlural]หลายรูปที่ได้รับการฝึกฝนมาโดยเฉพาะในการจัดการศพ จะนำศพของ[ROOT.Var('ancestor_to_bury').Char.GetHerHis]ไป และนำไปยังยอดหอคอย\n\nหลังจากนั้นครู่หนึ่ง [ROOT.Char.GetFaith.PriestNeuterPlural]ก็กลับมา "เสร็จสิ้นแล้ว ใต้เท้า[ROOT.Char.GetTitleAsNameNoTooltip] บัดนี้นกกินซากจะแทะเล็มเนื้อหนังของร่าง[ROOT.Var('ancestor_to_bury').Char.GetHerHis] และแสงอาทิตย์จะฟอกกระดูกของ[ROOT.Var('ancestor_to_bury').Char.GetHerHis]ให้ขาว"
 religious_decision.0302.a:0 "หลับให้สบายเถิด [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)]"


 religious_decision.0401.t:0 "การทำนายดวงดาว"
 religious_decision.0401.desc.beginning:1 "ข้าใช้เวลาหลายคืนมองดูท้องฟ้ายามค่ำคืน ติดตามการเคลื่อนที่ของเทหวัตถุบนท้องฟ้า\n\nเมื่อเวลาผ่านไป ข้าสังเกตเห็นรูปแบบ และหลังจากวิเคราะห์มาหลายวัน บัดนี้ข้ามั่นใจในคำทำนายของข้าแล้ว สัญญาณชัดเจน —"
 religious_decision.0401.desc.great_battle:0 "การสัประยุทธ์ครั้งใหญ่รอคอยข้าอยู่"
 religious_decision.0401.desc.new_friends:0 "ถึงเวลาสมานแผลเก่าและสร้างมิตรใหม่"
 religious_decision.0401.desc.hard_work:0 "การทำงานหนักจะนำข้าไปสู่โชคลาภอันยิ่งใหญ่ในอนาคต"
 religious_decision.0401.desc.betrayal:0 "พันธมิตรของข้าไม่ใช่คนที่ข้าคิด"
 religious_decision.0401.desc.new_beginnings:0 "เป็นเวลาแห่งการเริ่มต้นใหม่และเปิดใจกว้าง"
 religious_decision.0401.a:0 "ข้าสงสัยว่าอนาคตจะมีอะไรรออยู่อีกบ้าง?"
 
 religious_decision.0501.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip]และศรัทธา[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0501.desc:1 "เป็นเวลาหลายชั่วอายุคนแล้วที่ขุนนางแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ได้ประกาศความจงรักภักดีต่อศรัทธา[ROOT.Char.GetFaith.GetAdherentNameNoTooltip] แต่พหุนิยมทางศาสนากับเทพเจ้าท้องถิ่นเป็นเรื่องปกติในสังคม[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] อย่างไรก็ตาม ด้วยการฟื้นฟูตำแหน่งมหาปุโรหิต [ROOT.Char.GetFaith.ReligiousHeadTitleName] [ROOT.Char.GetFaith.ReligiousHeadName] ยืนกรานว่าการปฏิบัติเยี่ยงคนนอกศาสนานี้ต้องสิ้นสุดลง และเรียกร้องให้ทุกคนที่สาบานความจงรักภักดีต่อข่านต้องสาบานความจงรักภักดีต่อพระเจ้าและนมัสการพระองค์ในทางที่ถูกต้องด้วย\n\nอย่างไรก็ตาม ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้ามีอำนาจสูงสุดในการตัดสินใจเกี่ยวกับอนาคตของศรัทธาใน[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]ของข้า และอนาคตของทุ่งหญ้าสเตปป์ขึ้นอยู่กับคำพูดของข้า"
 religious_decision.0501.a:0 "[ROOT.Char.GetTitleAsNameNoTooltip] ที่ดี ย่อมอนุญาตให้ผู้คนของ [ROOT.Char.GetHerHis] ดำเนินตามวิถีของตน"
 religious_decision.0501.b:0 "บางทีการปฏิรูปอย่างพอประมาณอาจเป็นที่พอใจของทั้งสองฝ่าย"
 religious_decision.0501.c:1 "[ROOT.Char.GetFaith.GetNameNoTooltip]จะต้องได้รับการเผยแผ่ไปทั่วโลก!"
 religious_decision.0501.jewish.tt:2 "[vassal|E]ชาวยิวทุกคน"
 religious_decision.0501.nonjewish.tt:2 "[vassal|E]ที่ไม่ใช่ชาวยิวทุกคน"
 religious_decision.0501.diff_culture.tt:0 "[vassal|E]ที่มี[culture|E]แตกต่างกันทุกคน"
 can_never_reform_kuzarism_tt:0 "[GetFaithByKey('kabarism').GetName] จะรักษาหลักคำสอนที่มีอยู่เดิมไว้เป็นการถาวร"
 religious_decision.0502.t:0 "[khazar_khan.GetTitleAsNameNoTooltip]และศรัทธา[khazar_khan.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0501.d:0 "[ROOT.Char.GetFaith.GetNameNoTooltip]คือศรัทธาที่แท้จริงเพียงหนึ่งเดียว และชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]คือผู้ส่งสารของ[ROOT.Char.GetFaith.HighGodNamePossessive]"
 religious_decision.0502.desc.intro:0 "เป็นเวลาหลายชั่วอายุคนแล้วที่ขุนนางแห่ง [khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] ได้ประกาศความจงรักภักดีต่อศรัทธา[ROOT.Char.GetFaith.GetAdherentNameNoTooltip] แต่พหุนิยมทางศาสนากับเทพเจ้าท้องถิ่นเป็นเรื่องปกติในสังคม[khazar_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 religious_decision.0502.desc.body:0 "อย่างไรก็ตาม เมื่อเร็วๆ นี้ [khazar_khan.GetTitleAsNameNoTooltip] และเหล่ารับบีแห่งอาณาจักรได้มีการถกเถียงกันอย่างเผ็ดร้อนเกี่ยวกับธรรมชาติของศาสนาพื้นบ้านและผู้ที่ไม่เชื่อใน[khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip]\n\nทว่า [khazar_khan.GetTitleAsNameNoTooltip] ได้ตัดสินใจแล้ว "
 religious_decision.0502.desc.righteous:1 "ในพระราชกฤษฎีกา ผู้ที่ยังคงบูชาวิถีทางเก่าแก่จะไม่ได้รับการปฏิบัติเป็นพิเศษภายใน[khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip]อีกต่อไป และทุกคนที่สาบานความจงรักภักดีต่อ[khazar_khan.GetTitleAsNameNoTooltip]จะต้องสาบานความจงรักภักดีต่อ[khazar_khan.GetFaith.HighGodName]ด้วย"
 religious_decision.0502.desc.fundamentalist:0 "ไม่เพียง แต่พหุนิยมทางศาสนาจะสิ้นสุดลงเท่านั้น แต่ผู้ใดก็ตามที่ไม่ปฏิบัติตามหลัก[khazar_khan.GetFaith.GetNameNoTooltip]ดั้งเดิมถือเป็นศัตรูของ[khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip]โดยปริยาย [khazar_khan.GetTitleAsNameNoTooltip]พยายามที่จะเผยแผ่[khazar_khan.GetFaith.GetNameNoTooltip]ไปทั่วทุ่งหญ้าสเตปป์และไกลออกไป โดยประกาศว่าเป็นหน้าที่ของชาว[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]ที่ดีทุกคนที่จะเข้าร่วมในยุคใหม่แห่งสงครามศาสนานี้"
 religious_decision.0502.a:0 "ช่างเป็นวันที่มืดมนสำหรับ[ROOT.Char.GetFaith.GetNameNoTooltip]โดยแท้"
 religious_decision.0502.b:0 "ถึงเวลาเสียที!"
 religious_decision.0503.t:0 "ภาษาฮีบรู"
 religious_decision.0503.desc:0 "ในฐานะผู้ปกครองที่มีอิทธิพลมากที่สุดของวัฒนธรรม[hebrew_language_adopter_scope.GetCulture.GetName] และผู้ปกครองอาณาจักรยิวอันกว้างใหญ่ [hebrew_language_adopter_scope.GetName] ได้ประกาศว่าภาษาฮีบรูเป็นทั้งภาษาทางศาสนาและภาษาทั่วไปของชาว[hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip]แล้ว!\n\nภาษาฮีบรูเป็นภาษาทางศาสนาของชาวยิวมานับพันปี แต่บัดนี้เมื่อ[hebrew_language_adopter_scope.GetNameNoTooltip]ปกครองเหนือประชากรส่วนใหญ่ที่เป็นชาวยิว ความจำเป็นในการใช้ภาษาอื่นในชีวิตประจำวันจึงลดน้อยลง แม้ว่าไม่ใช่ชาว[hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip]ทุกคนที่นับถือศาสนายิว แต่ก็มีแนวโน้มว่าจะใช้เวลาเพียงหนึ่งหรือสองชั่วอายุคนก่อนที่ทุกคนจะพูดภาษาฮีบรู"
 religious_decision.0503.a.jewish:0 "เลอไคม์!"
 religious_decision.0503.a.non_jewish:0 "ข้าควรเริ่มฝึกฝนได้แล้ว"
 religious_decision.0503.b:0 "ข้าพูดภาษาประหลาดนี้ไม่ได้!"

 religious_decision.0601.t:0 "การแบ่งแยกอุมมะฮ์: [founder.GetFaith.ReligiousHeadTitleName|U]ชาว[founder.GetFaith.GetAdjectiveNoTooltip]"
 religious_decision.0601.desc:0 "หากปราศจากผู้นำที่ #EMP แท้จริง#! พวกเราย่อมหลงทาง\n\n[old_caliph.GetTitledFirstName] ไม่ได้ให้การชี้นำ เช่นนั้นแก่พวกเราชาว [founder.GetFaith.GetAdherentNamePlural] ตั้งแต่ [old_caliph.GetSheHe] ได้รับตำแหน่ง และผู้อื่นในศรัทธาของข้าต้องทนทุกข์ เพราะการขาดคำแนะนำ อำนาจ และหลักนิติธรรมของ [old_caliph.GetHerHis]\n\nด้วยใจที่หนักอึ้ง และการสนับสนุนจากนักบวชผู้ทรงอิทธิพลที่สุดบางส่วนในโลก [founder.GetFaith.GetAdjectiveNoTooltip] ข้าได้ประกาศว่า เป็นพระประสงค์อันไม่ย่อท้อของ [founder.GetFaith.HighGodName] ที่ข้าจะเข้ารับตำแหน่ง [founder.GetFaith.ReligiousHeadTitleName]\n\nทายาทของข้าและข้าจะดำรงตำแหน่งนี้ตั้งแต่วันนี้จนถึงวันพิพากษา และภายใต้มืออันมั่นคงของข้า ผู้ศรัทธาที่แท้จริงของโลกจะเจริญรุ่งเรือง!"
 religious_decision.0601.a:0 "บัดนี้ข้าแบกรับภาระอันหนักอึ้งนี้..."
 religious_decision.0601.b:0 "ฮ่า เอาไปเลย #EMP นั่น#! [old_caliph.GetFirstNameNoTooltip]"
 religious_decision.0601.tt.some_rulers_converted_away:0 "[rulers|E] [THIS.Var('schismed_caliphate_major_ruler_converted_count').GetValue|0] คน จะเปลี่ยนไปนับถือ [old_caliph.GetFaith.GetName] เพื่อประท้วง"
 religious_decision.0601.tt.all_rulers_stayed:0 "ไม่มี[rulers|E]ชาว[founder.GetFaith.GetAdjective]รายใหญ่คนใดจะเปลี่ยนไปนับถือ [old_caliph.GetFaith.GetName] เพื่อประท้วง"

 religious_decision.0602.t:0 "$religious_decision.0601.t$"
 religious_decision.0602.desc:0 "[founder.GetFirstName] ไม่ได้ปิดบังความจริงที่ว่า [founder.GetSheHe] #EMP เกลียดชัง#! วิธีที่ [old_caliph.GetTitledFirstName] ใช้อำนาจในตำแหน่งอันศักดิ์สิทธิ์ของ [old_caliph.GetFaith.ReligiousHeadName] แต่ข้าสงสัยว่าจะมีใครคิดว่า [founder.GetSheHe] จะไปไกลถึง #EMP เพียงนี้#!.\n\n[founder.GetWomanMan] บ้าผู้นั้นได้รวบรวมการสนับสนุนเพียงพอที่จะประกาศให้ #EMP [founder.GetHerselfHimself]#! เป็น [founder.GetFaith.ReligiousHeadName] ทำให้ประชาชาติอิสลามแตกแยก!\n\nน่าเศร้าใจที่สามัญชนส่วนใหญ่ยอมรับการตัดสินใจนี้ว่าเป็นเพียงส่วนหนึ่งของแผนการของผู้ที่เหนือกว่าพวกเขา ในฐานะหนึ่งในผู้นำของ [founder.GetFaith.GetName] อย่างไรก็ตาม มันตกเป็นหน้าที่ของข้าที่จะตัดสินใจว่าอาณาจักรของข้าจะยอมทำตามหรือคัดค้าน"
 religious_decision.0602.a:0 "[founder.GetTitledFirstNameNoTooltip] จะพิสูจน์ตนว่าคู่ควรอย่างแน่นอน"
 religious_decision.0602.a.tt:0 "ท่านยอมรับระเบียบใหม่อย่างเงียบๆ"
 religious_decision.0602.b:0 "ความภักดีของข้าต่อ [old_caliph.GetTitledFirstNameNoTooltip] นั้นไม่สั่นคลอน!"
 religious_decision.0602.c:0 "ผู้คนดูเหมือนจะสิ้นหวังต้องการผู้นำที่แท้จริง..."
 fp2_opportunistic_schismatic_modifier:0 "ผู้ฉวยโอกาสสร้างความแตกแยก"
 fp2_opportunistic_schismatic_modifier_desc:0 "ตัวละครนี้กำลังมุ่งหน้าสู่การตรัสรู้..."

 religious_decision.0603.t:0 "$religious_decision.0601.t$"
 religious_decision.0603.desc:0 "ความตึงเครียดระหว่าง [founder.GetFirstName] และ [old_caliph.GetShortUINameNoFormat] ทวีความรุนแรงขึ้นในช่วงหลังนี้ แต่ [founder.GetFirstNameNoTooltip] ได้ยกระดับไปสู่ระดับที่ดุเดือดอย่างไม่คาดคิด\n\nด้วยการสนับสนุนจากนักบวชชั้นนำจำนวนมากของ [founder.GetFaith.GetName] [founder.GetFirstNameNoTooltip] ได้ประกาศ [founder.GetHerselfHimself] ให้เป็น [founder.GetFaith.ReligiousHeadName] ที่ #EMP แท้จริง#! ของศรัทธาของ [founder.GetHerHis] ได้สำเร็จ แทนที่อำนาจของ [old_caliph.GetShortUINamePossessiveNoTooltipNoFormat] เหนือผู้ที่หันเหออกจากแนวทางดั้งเดิมของ [old_caliph.GetFaith.GetName]\n\n$islam_religion_adherent_plural$ ที่คำนึงถึงส่วนรวมมากขึ้นจำนวนมากของโลกร่ำไห้อย่างเปิดเผยต่อการปรากฏของรอยร้าวอีกครั้งในประชาชาติอิสลาม"
 religious_decision.0603.a:0 "ปีศาจ! คนเลว! ผู้หมิ่นศาสนา!"
 religious_decision.0603.b:0 "[old_caliph.GetTitledFirstNameNoTooltip] ไม่สามารถรักษาความเป็นระเบียบในบ้านของ [old_caliph.GetHerHis] ได้..."
 religious_decision.0603.c:0 "ฮ่า! ช่างเป็นละครที่ยิ่งใหญ่เสียนี่กระไร!"
