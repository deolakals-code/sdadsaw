l_english: 
 #Scandal Event Localization
 fervor.1002.t:0 "นักบวชผู้อื้อฉาว"
 fervor.1002.desc.start:0 "โลก [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] [sinful_theocrat.Custom('GetShockedExpression')] เมื่อได้ทราบว่า [sinful_theocrat.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 fervor.1002.desc.start_hof:0 "โลก [sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] ตกตะลึงเมื่อได้ทราบว่า [sinful_theocrat.GetTitledFirstName] [sinful_theocrat.GetHerselfHimself]"
 fervor.1002.desc.lustful:0 "ถูกจับได้คาหนังคาเขาขณะ 'ร่วมรักอย่างโจ่งแจ้ง' กับคนรับใช้หนุ่มสาวหลายคนในบ้านของ [sinful_theocrat.GetHerHis]! ผู้ช่วยที่น่าสงสาร ซึ่งไปพบเข้าต้องเบือนหน้า [dummy_clergy_gender.GetHerHis] หนี ขณะที่ผู้กระทำผิดรีบคว้าเสื้อผ้ามาสวมใส่"
 fervor.1002.desc.chaste:0 "ถูกค้นพบว่าไม่ได้มีเพศสัมพันธ์มานานหลายปี! แม้จะได้รับข้อเสนอมากมาย แต่ [sinful_theocrat.Custom('GetCouncilOrTitleName')] ดูเหมือนจะไม่สนใจมีความสัมพันธ์ทางเนื้อหนังกับผู้ใดเลย"
 fervor.1002.desc.gluttonous:0 "ถูกพบว่ากำลังสวาปาม [sinful_theocrat.GetHerselfHimself] ในงานเลี้ยงหรูหราด้วย [sinful_theocrat.Custom('GetExpensiveMeal')], [sinful_theocrat.Custom('GetExpensiveMealAlt')], [sinful_theocrat.Custom('GetExpensiveDessert')], และ [sinful_theocrat.Custom('GetExpensiveDrink')] การเสพสุขอย่างเกินพอดีในงานเลี้ยงได้ทอดเงาดำมืดลงบนความชอบธรรมของ [sinful_theocrat.GetHerHis]"
 fervor.1002.desc.temperate:0 "ดำเนินชีวิตแบบสมถะอยู่หลังประตูที่ปิดสนิท! มีรายงานว่า [sinful_theocrat.GetSheHe] หลีกเลี่ยงความหรูหราและความสะดวกสบายทั้งปวง โดยเลือกที่จะใช้ชีวิตอย่างเรียบง่ายที่สุดเท่าที่จะเป็นไปได้"
 fervor.1002.desc.greedy:0 "ได้ยักยอกเงินที่ผู้ติดตามของ [sinful_theocrat.GetHerHis] บริจาคเพื่อการกุศล นำไปใช้เพื่อประโยชน์ส่วนตัวของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.generous:0 "ได้แอบใช้เงินส่วนตัวของ [sinful_theocrat.GetHerHis] เพื่อเลี้ยงดูคนยากจนและขัดสน!"
 fervor.1002.desc.lazy:0 "ได้หาข้ออ้างเพื่อผัดวันประกันพรุ่งและหลีกเลี่ยงความรับผิดชอบของ [sinful_theocrat.GetHerHis] ทุกวิถีทาง!"
 fervor.1002.desc.diligent:0 "ได้ทำงานจนดึกดื่นเพื่อทำโครงการส่วนตัวโครงการหนึ่งของ [sinful_theocrat.GetHerHis] ให้เสร็จสิ้น!"
 fervor.1002.desc.wrathful:0 "ได้ทุบตีคนรับใช้ที่ไม่สามารถ ทำให้ [sinful_theocrat.GetHerHim] พอใจได้ ทำให้พวกเขาได้รับบาดเจ็บสาหัส!"
 fervor.1002.desc.calm:0 "ไม่สามารถแสดงอารมณ์รุนแรงใดๆ ได้ กลับเลือกที่จะวางเฉยและไม่แสดงความรู้สึกแม้ในยามที่พฤติกรรม เช่นนั้นไม่เหมาะสมอย่างชัดเจน!"
 fervor.1002.desc.patient:0 "มีนิสัยลังเลและรีรอเมื่อต้องตัดสินใจเรื่องสำคัญ ทำให้เกิดความล่าช้าโดยไม่จำเป็นในการทำงานของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.impatient:0 "ไม่สามารถรอให้สิ่งต่างๆ เสร็จสิ้นอย่างถูกต้องได้ คอยเร่งเร้าผู้ช่วยและคนรับใช้ของ [sinful_theocrat.GetHerHis] อยู่ตลอดเวลา!"
 fervor.1002.desc.arrogant:0 "ถือว่า [sinful_theocrat.GetHerselfHimself] เหนือกว่าคนรอบข้างของ [sinful_theocrat.GetHerHis] โดยเนื้อแท้ ไม่สามารถทำเรื่องโง่เขลาได้ และอยู่เหนือความสงสัยทั้งปวง"
 fervor.1002.desc.humble:0 "ถูกพบว่าเป็นคนอ่อนน้อมและเต็มไปด้วยความไม่มั่นใจในตนเอง คิดว่าคนรอบข้าง [sinful_theocrat.GetHerHim] มีความสามารถมากกว่าเสมอ และ [sinful_theocrat.GetSheHe] ไม่สมควรได้รับตำแหน่งของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.deceitful:0 "ได้โกหก [sinful_theocrat.Custom('DefaultPriestTitlePlural')] ในท้องถิ่นเป็นประจำ เห็นได้ชัดว่า [sinful_theocrat.GetSheHe|U] หลอกลวงให้พวกเขาดำเนินการตามข้อมูลเท็จเพื่อขับเคลื่อนแผนการลับๆ ของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.honest:0 "ถูกพบว่าเป็นคนโกหกที่แย่มาก แผนการและการชี้นำที่พยายามทำนั้นน่าหัวเราะเยาะและขาดความน่าเชื่อถืออย่างสิ้นเชิง"
 fervor.1002.desc.craven:0 "ถูกพบว่าเป็นคนขี้ขลาดและอ่อนแอ เป็นคนที่ยอมจำนนต่อข้อเรียกร้องของผู้อื่นมากกว่าที่จะยืนหยัดเพื่อสิ่งที่ถูกต้อง"
 fervor.1002.desc.brave:0 "ได้นำพา [sinful_theocrat.GetHerselfHimself] และผู้ช่วยของ [sinful_theocrat.GetHerHis] ไปสู่อันตรายโดยไม่จำเป็นอย่างบ้าบิ่น เพียงเพื่อความตื่นเต้นราคาถูกไม่กี่ครั้ง!"
 fervor.1002.desc.shy:0 "ได้หาข้ออ้างเพื่อหลีกเลี่ยงการไปร่วมงานสังคม โดยเลือกที่จะเก็บตัวอยู่ตามลำพังในบ้านของ [sinful_theocrat.GetHerHis] แทน!"
 fervor.1002.desc.gregarious:0 "ถูกพบว่าจงใจเข้าไปรบกวนผู้อื่นด้วยการปรากฏตัวของ [sinful_theocrat.GetHerHis] ละเมิดพื้นที่ส่วนตัวและ ทำให้พวกเขาเสียเวลา!"
 fervor.1002.desc.ambitious:0 "ได้วางแผน เพื่อให้ได้มา ซึ่งทรัพย์สินและบรรดาศักดิ์เพิ่มเติมสำหรับ [sinful_theocrat.GetHerselfHimself] เห็นได้ชัดว่าไม่พอใจกับทรัพย์สมบัติมากมายที่ [sinful_theocrat.GetSheHe] ครอบครองอยู่แล้ว"
 fervor.1002.desc.content:0 "ล้มเหลวในการไขว่คว้าโอกาสหลายครั้งเพื่อเพิ่มอำนาจและทรัพย์สมบัติส่วนตัวของ [sinful_theocrat.GetHerHis] เห็นได้ชัดว่าพอใจกับสิ่งที่ [sinful_theocrat.GetSheHe] มีอยู่แล้ว"
 fervor.1002.desc.arbitrary:0 "ได้ยกเว้นขั้นตอนสำคัญเพื่อเอื้อประโยชน์แก่ผู้ที่ [sinful_theocrat.GetSheHe] ชอบเป็นการส่วนตัวมากกว่าผู้ที่ [sinful_theocrat.GetSheHe] ไม่ชอบ"
 fervor.1002.desc.just:0 "ถูกพบว่ายึดมั่นในหลักเกียรติยศที่เข้มงวดและไม่ยืดหยุ่นอย่างเหลือเชื่อ ซึ่ง [sinful_theocrat.GetSheHe] ปฏิเสธที่จะกระทำการฝ่าฝืน ไม่ว่าจะมีสถานการณ์ผ่อนปรนใดๆ ก็ตาม!"
 fervor.1002.desc.cynical:0 "ถูกพบว่าไม่ได้เชื่อในคำสอน [sinful_theocrat.GetFaith.GetAdjective] จริงๆ มองว่าเป็นเพียงเครื่องมือทางการเมืองที่สะดวกเท่านั้น "
 fervor.1002.desc.zealous:0 "ถูกพบว่ามีความเชื่อมั่นอย่างไม่สั่นคลอนในโลกเหนือธรรมชาติและจิตวิญญาณ แม้จะขาดหลักฐานที่มีเหตุผลสำหรับสิ่งเหล่านั้นก็ตาม"
 fervor.1002.desc.paranoid:0 "ถูกพบว่าเป็นคนหวาดระแวงและไม่ไว้วางใจอย่างเหลือเชื่อ คิดอยู่เสมอว่าทุกคนรอบตัว [sinful_theocrat.GetHerHim] กำลังวางแผนโค่นล้ม [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.trusting:0 "ถูกพบว่าเป็นคนซื่อและไว้ใจคนง่ายอย่างเหลือเชื่อ ไม่แม้ แต่จะตั้งคำถามกับคำโกหกที่โจ่งแจ้งที่สุดที่ผู้ช่วยของ [sinful_theocrat.GetHerHis] ป้อนให้ [sinful_theocrat.GetHerHim]"
 fervor.1002.desc.compassionate:0 "เห็นอกเห็นใจผู้อื่นมากเกินไป มอบความเมตตาในสถานการณ์ที่ไม่สมควร เพียง เพราะ [sinful_theocrat.GetSheHe] ทนเห็นผู้คนทุกข์ทรมานไม่ได้"
 fervor.1002.desc.callous:0 "ใจดำอย่างเหลือเชื่อ ไม่สามารถหรือไม่เต็มใจที่จะแสดงความเห็นอกเห็นใจใดๆ แม้ แต่กับผู้ที่อยู่ในสถานการณ์เลวร้าย"
 fervor.1002.desc.sadistic:0 "ถูกพบว่ากำลังทรมานคนรับใช้ [sinful_theocrat.Custom('GirlBoy')] ในห้องลับใต้ห้องของ [sinful_theocrat.GetHerHis] ดูเหมือนจะพอใจในเสียงกรีดร้องด้วยความเจ็บปวดของ [sinful_theocrat.Custom('GirlBoyPossessive')] ผู้น่าสงสาร!"
 fervor.1002.desc.stubborn:0 "ได้โยนรายงานจากผู้ช่วยของ [sinful_theocrat.GetHerHis] ทิ้งไปโดยไม่อ่านด้วยซ้ำ ปฏิเสธที่จะพิจารณาข้อมูลใหม่ใดๆ เกี่ยวกับการตัดสินใจที่ [sinful_theocrat.GetSheHe] ได้ทำไปแล้ว"
 fervor.1002.desc.fickle:0 "ไม่สามารถยืนหยัดในจุดยืนของ [sinful_theocrat.GetHerHis] ได้เมื่อสถานการณ์ยากลำบาก ยอมแพ้เมื่อมีสัญญาณแรกของการต่อต้านการตัดสินใจของ [sinful_theocrat.GetHerHis]"
 fervor.1002.desc.vengeful:0 "ได้เก็บรายชื่อทุกคนที่เคยทำผิดต่อ [sinful_theocrat.GetHerHim] ไว้ โดยให้รายละเอียดเกี่ยวกับวิธีการมากมายที่เขาวางแผนจะแก้แค้นและสนองความกระหายในการแก้แค้นของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.desc.forgiving:0 "ล้มเหลวในการลงโทษผู้ที่ไม่ปฏิบัติตามความรับผิดชอบอย่างเหมาะสมเป็นประจำ โดยเลือกที่จะให้โอกาสครั้งที่สอง หรือแม้แต่ครั้งที่สามแก่พวกเขาก่อนที่จะลงโทษ!"
 fervor.1002.desc.fallback:0 "ไม่เลื่อมใสศรัทธาอย่างเหลือเชื่อ ล้มเหลวในการปฏิบัติตามแม้กระทั่งมาตรฐานพื้นฐานที่คาดหวังจาก [sinful_theocrat.Custom('GetCouncilOrTitleName')]"
 fervor.1002.desc.end:0 "\n\nแม้ว่าเรื่องอื้อฉาวในหมู่ [sinful_theocrat.GetFaith.AltPriestTermPlural] จะไม่ใช่เรื่องใหม่ แต่ก็น่ากังวลที่เรื่อง เช่นนี้เกิดขึ้นใกล้ตัว..."
 fervor.1002.desc.end_hof:0 "\n\nแม้ว่าเรื่องอื้อฉาวในหมู่ [sinful_theocrat.GetFaith.AltPriestTermPlural] จะไม่ใช่เรื่องใหม่ แต่หลายคนตกตะลึงที่ประมุขแห่งศรัทธาของเราจะยอมจำนนต่อสิ่งล่อใจ เช่นนั้น"
 fervor.1002.b:0 "ประณาม [sinful_theocrat.GetHerHim] สำหรับการล่วงละเมิดของ [sinful_theocrat.GetHerHis]!"
 fervor.1002.c:0 "ปกป้องชื่อเสียงของ [sinful_theocrat.GetHerHis] ต่อสาธารณะ แม้จะต้องเสี่ยงต่อตนเอง!"
 fervor.1002.d:0 "บางทีข้าควรจะเงียบเกี่ยวกับเรื่องนี้..."

 #Exaltation Event Localization
 fervor.2002.t:0 "การเชิดชู [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 fervor.2002.desc.lustful:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นแรงบันดาลใจให้แก่ [virtuous_theocrat.GetWomenMen] ผู้ทรงคุณธรรมนับไม่ถ้วน และเป็นที่หมายปองของ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] หนุ่มสาวอีกมากมาย \n\nเรื่องราวการพิชิตใจทางกามารมณ์ของ [virtuous_theocrat.GetHerHis] ได้แพร่กระจายไปไกล ทำให้หลายคนถือว่า [virtuous_theocrat.GetHerHim] เป็นแบบอย่างแห่งความรักอันไม่มีที่สิ้นสุดของ [ROOT.Char.GetFaith.FertilityGodNamePossessive]"
 fervor.2002.desc.chaste:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้รับชื่อเสียงอันไร้ที่ติจากการปฏิเสธความสุขทางเนื้อหนังทั้งปวงอย่างเด็ดขาด\n\nวินัยอันแน่วแน่ของ [virtuous_theocrat.GetHerHis|U] ได้เป็นแบบอย่างให้ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] หนุ่มสาวจำนวนมากที่พยายามต่อต้านสิ่งล่อใจอันต่ำทรามของตัณหา"
 fervor.2002.desc.gluttonous:0 "หลายคนได้เล่าขานเรื่องราวอันน่าอัศจรรย์เกี่ยวกับงานเลี้ยงอันหรูหราฟุ่มเฟือยของ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] ในฐานะ [virtuous_theocrat.GetWomanMan] ผู้มีรสนิยมอันประณีต [virtuous_theocrat.Custom('GetCouncilOrTitleName')] แห่ง [scoped_primary_title.GetNameNoTier] ได้น้อมรับคุณธรรมแบบสุขนิยมอย่างแท้จริง ซึ่งผู้ติดตามที่ดีของ [ROOT.Char.GetFaith.WealthGodName] ควรปฏิบัติตาม"
 fervor.2002.desc.temperate:0 "ในฐานะแบบอย่างของการบำเพ็ญตบะอันแน่วแน่ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้แสดงให้เห็นว่าจิตวิญญาณที่มีวินัยสามารถค้นพบสันติสุขและความกระจ่างแจ้งที่แท้จริงได้ผ่านการทำสมาธิและการละเว้นเท่านั้น\n\nแม้จะมีตำแหน่งอันสูงส่ง [virtuous_theocrat.GetFirstNameNoTooltip] ก็ยังชีพ [virtuous_theocrat.GetHerselfHimself] ด้วยเพียงอาหารที่ประหยัดที่สุด เพื่อแสดงความมุ่งมั่นอันแน่วแน่ของ [virtuous_theocrat.GetHerHis] ต่อหลักคำสอนของ [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]"
 fervor.2002.desc.greedy:0 "มี [virtuous_theocrat.GetFaith.HouseOfWorshipPlural] เพียงไม่กี่แห่งที่สามารถเทียบเคียงความงดงามและความเอื้อเฟื้อเผื่อแผ่ของ [scoped_primary_title.GetName] ได้ \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้ ทำให้ภารกิจในชีวิตของ [virtuous_theocrat.GetHerHis] คือการพิสูจน์ความภักดีอันยั่งยืนของ [virtuous_theocrat.GetHerHis] โดยการอุทิศทองคำและทรัพย์สมบัติอย่างไม่สิ้นสุดเพื่อความรุ่งโรจน์ของ [ROOT.Char.GetFaith.WealthGodName]"
 fervor.2002.desc.generous:0 "คนยากจนและขัดสนได้รับการต้อนรับเสมอใน [virtuous_theocrat.GetFaith.HouseOfWorship] ของ [virtuous_theocrat.GetFirstNamePossessive] \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] แห่ง [scoped_primary_title.GetNameNoTier] มีชื่อเสียงในด้านธรรมชาติอันเอื้อเฟื้อและงานการกุศลมากมายของ [virtuous_theocrat.GetHerHis] แบบอย่างของ [virtuous_theocrat.GetHerHis|U] ได้กระตุ้นให้ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] จำนวนมากละทิ้งทรัพย์สินทางวัตถุเพื่อแสวงหารางวัลอันศักดิ์สิทธิ์"
 fervor.2002.desc.generous.pope:0 "คนยากจนและขัดสนได้รับการต้อนรับเสมอใน [virtuous_theocrat.GetFaith.HouseOfWorship] ของ [virtuous_theocrat.GetFirstNamePossessive] \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] แห่ง [scoped_primary_title.GetNameNoTier] จะเป็นที่จดจำไปอีกนานในด้านธรรมชาติอันเอื้อเฟื้อและงานการกุศลมากมายของ [virtuous_theocrat.GetHerHis] แบบอย่างของ [virtuous_theocrat.GetHerHis|U] ได้กระตุ้นให้ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] จำนวนมากละทิ้งทรัพย์สินทางวัตถุเพื่อแสวงหารางวัลอันศักดิ์สิทธิ์"
 fervor.2002.desc.lazy:0 "มีเพียงการหลุดพ้นอย่างสิ้นเชิงจากงานหยาบของโลกนี้เท่านั้นที่จิตวิญญาณจะค้นพบตำแหน่งที่ถูกต้องในภพหน้า และมีเพียงไม่กี่คนที่แสดงคุณธรรมนี้ได้อย่าง [virtuous_theocrat.Custom('GetCouncilOrTitleName')] แห่ง [scoped_primary_title.GetNameNoTier] \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ใช้เวลาส่วนใหญ่ของวัน [virtuous_theocrat.GetHerHis] ไปกับการทำสมาธิอันสงบ ละทิ้งเกมการเมืองอันไร้สาระและความยุ่งยากอันน่าดูแคลนของงานใช้แรงงาน เพื่อบรรลุสภาวะแห่งความสงบอันศักดิ์สิทธิ์"
 fervor.2002.desc.diligent:0 "เรื่องเล่ามากมายได้รับแรงบันดาลใจจากงานอันไม่รู้จักเหน็ดเหนื่อยของ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] ในการรับใช้ [ROOT.Char.GetFaith.HighGodName] \n\nแม้ว่า [virtuous_theocrat.GetHerHis] จะมีตำแหน่งอันทรงเกียรติ [virtuous_theocrat.GetFirstNameNoTooltip] ก็พร้อมเสมอที่จะลงมือทำงานด้วยตนเองและปฏิบัติภารกิจที่เหน็ดเหนื่อยและหนักหนาสาหัสที่สุด เป็นแบบอย่างที่แท้จริงของคุณธรรมแบบ [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]"
 fervor.2002.desc.wrathful:0 "ในฐานะ [virtuous_theocrat.GetWomanMan] ผู้เปี่ยมด้วยอารมณ์ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] มีชื่อเสียงไปทั่วเมืองใกล้ไกลในด้านอารมณ์ร้อนและธรรมชาติอันรุนแรงของ [virtuous_theocrat.GetHerHis]\n\nบาปจะได้รับการชำระล้างได้ก็ต่อเมื่อลงโทษการดูหมิ่นศาสนาอย่างรวดเร็วและชัดเจนเท่านั้น และ [virtuous_theocrat.GetFirstNameNoTooltip] ได้ ทำให้ผู้นมัสการนับไม่ถ้วนเกรงกลัว [ROOT.Char.GetFaith.WarGodName] อย่างไม่ต้องสงสัยด้วยการระเบิดอารมณ์บ่อยครั้งของ [virtuous_theocrat.GetHerHis]"
 fervor.2002.desc.wrathful.pope:0 "ในฐานะ [virtuous_theocrat.GetWomanMan] ผู้เปี่ยมด้วยอารมณ์ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] มีชื่อเสียงฉาวโฉ่ในด้านอารมณ์ร้อนและธรรมชาติอันรุนแรงของ [virtuous_theocrat.GetHerHis]\n\nบาปจะได้รับการชำระล้างได้ก็ต่อเมื่อลงโทษการดูหมิ่นศาสนาอย่างรวดเร็วและชัดเจนเท่านั้น และ [virtuous_theocrat.GetFirstNameNoTooltip] ได้ ทำให้ผู้นมัสการนับไม่ถ้วนเกรงกลัว [ROOT.Char.GetFaith.WarGodName] อย่างแน่นอนด้วยการระเบิดอารมณ์บ่อยครั้งของ [virtuous_theocrat.GetHerHis]"
 fervor.2002.desc.calm:0 "หลายคนมองว่า [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] เป็นศูนย์รวมแห่งความสงบดุจทิพย์ ซึ่งมีเพียงไม่กี่คนเท่านั้นที่หวังจะบรรลุได้ในช่วงชีวิตของตน\n\nในฐานะ [virtuous_theocrat.GetWomanMan] ผู้มีวินัยอย่างยิ่ง [virtuous_theocrat.GetFirstNameNoTooltip] เป็นแบบอย่างอันเจิดจรัสของชัยชนะแห่งเหตุผลเหนืออารมณ์"
 fervor.2002.desc.impatient:0 "มนุษย์ได้รับเวลาเพียงสั้น ๆ ในโลกนี้ และเป็นพระประสงค์ของ [ROOT.Char.GetFaith.HighGodName] ที่เราจะไม่เสียเวลาไปแม้ แต่วินาทีเดียว\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้ยึดมั่นในหลักการนี้อย่างจริงจัง จนกระทั่ง [virtuous_theocrat.GetSheHe] มีชื่อเสียงโด่งดังไปทั่วในเรื่องความไม่อดทนต่อความเกียจคร้านและงานที่ไม่จำเป็นของ [virtuous_theocrat.GetHerHis]"
 fervor.2002.desc.impatient.pope:0 "มนุษย์ได้รับเวลาเพียงสั้น ๆ ในโลกนี้ และเป็นพระประสงค์ของ [ROOT.Char.GetFaith.HighGodName] ที่เราจะไม่เสียเวลาไปแม้ แต่วินาทีเดียว\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้ยึดมั่นในหลักการนี้อย่างจริงจัง จนกระทั่ง [virtuous_theocrat.GetSheHe] จะเป็นที่จดจำไปอีกนานในเรื่องความไม่อดทนต่อความเกียจคร้านและงานที่ไม่จำเป็นของ [virtuous_theocrat.GetHerHis]"
 fervor.2002.desc.arrogant:0 "การดูหมิ่นทูตของ [ROOT.Char.GetFaith.HighGodName] ไม่ต่างจากการดูหมิ่นศาสนาต่อหน้าเทพเจ้าเอง\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] รู้เรื่องนี้ดีเกินไป และในช่วงเวลาที่ [virtuous_theocrat.GetHerHis] อยู่ที่ [scoped_primary_title.GetName] [virtuous_theocrat.GetSheHe] แสดงความอดทนน้อยนิดต่อคนถากถางและคนโง่เขลาเสมอมา"
 fervor.2002.desc.humble:0 "งานทั้งหมดของมนุษย์นั้นด้อยค่าเมื่อเทียบกับความยิ่งใหญ่ของ [ROOT.Char.GetFaith.HighGodNamePossessive]\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] รู้เรื่องนี้มากกว่านักบวชคนอื่นๆ มากมาย: เรื่องราวมากมายได้แพร่กระจายเกี่ยวกับธรรมชาติที่อ่อนน้อมและถ่อมตนของ [virtuous_theocrat.GetHerHis] โดยหลีกเลี่ยงชีวิตที่สะดวกสบาย ซึ่งตำแหน่งของ [virtuous_theocrat.GetHerHis] จะให้สิทธิ์แก่ [virtuous_theocrat.GetHerHim] [virtuous_theocrat.GetFirstNameNoTooltip] มักถูกพบเห็นเดินเท้าเปล่าท่ามกลางสมาชิกที่ยากจนที่สุดในฝูงแกะของ [virtuous_theocrat.GetHerHis]"
 fervor.2002.desc.deceitful:0 "เหตุผลคือของประทานอันยิ่งใหญ่ที่สุดของ [ROOT.Char.GetFaith.KnowledgeGodName] แก่มนุษยชาติ ซึ่งแยกเราออกจากสัตว์เดรัจฉาน\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] เป็นแบบอย่างอันเจิดจรัสของความจริงนี้ ด้วยปฏิภาณไหวพริบและวาจาคมคายของ [virtuous_theocrat.GetHerHis] [virtuous_theocrat.GetSheHe] ได้เอาชนะและเยาะเย้ยคนถากถาง ผู้ดูหมิ่นศาสนา และบางคนกล่าวว่าแม้กระทั่งปีศาจนับไม่ถ้วน"
 fervor.2002.desc.honest:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นบุคคลที่มีชื่อเสียงและเป็นที่เคารพนับถืออย่างสูงในหมู่ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] จำนวนมากในด้านความซื่อสัตย์ของ [virtuous_theocrat.GetHerHis]\n\nไม่มีคำโกหกใดเล็กน้อยเกินไป ไม่มีสัจธรรมใดน่าอึดอัดเกินไปสำหรับ [virtuous_theocrat.GetWomanMan] ผู้เคร่งศาสนาผู้นี้ ซึ่งแบบอย่างของเขากำลังสร้างแรงบันดาลใจให้ผู้ศรัทธาอีกนับไม่ถ้วนทุกวัน"
 fervor.2002.desc.honest.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] จะเป็นที่จดจำไปอีกนานโดย [virtuous_theocrat.GetFaith.GetAdherentNamePlural] ส่วนใหญ่ในด้านความซื่อสัตย์ของ [virtuous_theocrat.GetHerHis]\n\nไม่มีคำโกหกใดเล็กน้อยเกินไป ไม่มีสัจธรรมใดน่าอึดอัดเกินไปสำหรับ [virtuous_theocrat.GetWomanMan] ผู้เคร่งศาสนาผู้นี้ ซึ่งแบบอย่างของเขากำลังสร้างแรงบันดาลใจให้ผู้ศรัทธาอีกนับไม่ถ้วนทุกวัน"
 fervor.2002.desc.craven:0 "ชีวิตเป็นของขวัญอันล้ำค่า และ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กระตุ้นให้ผู้ติดตามจำนวนมากของ [virtuous_theocrat.GetHerHis] น้อมรับคุณธรรมแห่งความระมัดระวังและการมองการณ์ไกลเพื่อหลีกเลี่ยงความเสี่ยงที่ไม่จำเป็นและมีชีวิตยืนยาวในการรับใช้ [ROOT.Char.GetFaith.HighGodNamePossessive]\n\n[virtuous_theocrat.GetSheHe|U] แทบไม่ออกจาก [virtuous_theocrat.GetFaith.HouseOfWorship] ของ [virtuous_theocrat.GetHerHis] ซึ่งกล่าวกันว่าปลอดภัยกว่าคลังสมบัติใดๆ และแข็งแกร่งดุจป้อมปราการใดๆ"
 fervor.2002.desc.brave:0 "นักเทศน์ผู้มุ่งมั่นจำนวนมากเดินทางทุกวันไปยัง [virtuous_theocrat.GetFaith.HouseOfWorship] ของ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] เพื่อขอคำแนะนำจากนักบวชผู้เป็นที่นับถือผู้นี้\n\n[virtuous_theocrat.GetFirstNamePossessiveNoTooltip] มีชื่อเสียงในด้านความมุ่งมั่นอันแน่วแน่และความไม่เกรงกลัวของ [virtuous_theocrat.GetHerHis] ไม่ว่าจะเป็นเรื่องการล่าสัตว์ป่า หรือการเผชิญหน้ากับพวกนอกรีตและผู้ดูหมิ่นศาสนา [virtuous_theocrat.GetFirstNameNoTooltip] ก็พร้อมและกระตือรือร้นที่จะพุ่งเข้าใส่ศัตรูของ [virtuous_theocrat.GetHerHis] เสมอ"
 fervor.2002.desc.shy:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นแบบอย่างอันเจิดจรัสว่าการปลีกวิเวกเป็นพื้นฐานสำคัญเพียงใดในการชำระล้างจิตวิญญาณ\n\nโดยหลีกเลี่ยงความยุ่งยากของสังคมทั่วไป นักบวชผู้เป็นที่เคารพนับถือผู้นี้ได้บรรลุถึงสภาวะแห่งการสื่อสารกับสิ่งศักดิ์สิทธิ์ ซึ่ง [virtuous_theocrat.GetFaith.GetAdherentNamePlural] ส่วนใหญ่ทำได้เพียงฝันถึง"
 fervor.2002.desc.gregarious:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นเสาหลักของชุมชนของ [virtuous_theocrat.GetHerHis]\n\nพร้อมเสมอที่จะรับฟังและมีส่วนร่วมกับฝูงแกะของ [virtuous_theocrat.GetHerHis] [virtuous_theocrat.GetSheHe] เป็นศูนย์รวมจิตวิญญาณแห่งการรวมกลุ่ม ซึ่งมักมีการเทศนาสั่งสอน แต่ไม่ค่อยมีเพื่อนร่วมงานของ [virtuous_theocrat.GetHerHis] ปฏิบัติตาม"
 fervor.2002.desc.gregarious.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] แสดงระดับการมีส่วนร่วมกับชุมชนเป็นประจำ ซึ่ง [virtuous_theocrat.GetFaith.GetAdherentNamePlural] ทุกคนปรารถนาที่จะเอาอย่าง\n\nพร้อมเสมอที่จะรับฟังฝูงแกะของ [virtuous_theocrat.GetHerHis] [virtuous_theocrat.GetSheHe] เป็นศูนย์รวมจิตวิญญาณแห่งการรวมกลุ่ม ซึ่งมักมีการเทศนาสั่งสอน แต่ไม่ค่อยมีเพื่อนร่วมงานของ [virtuous_theocrat.GetHerHis] ปฏิบัติตาม"
 fervor.2002.desc.ambitious:0 "มีเพียงไม่กี่คนที่แสวงหาความโปรดปรานของ [ROOT.Char.GetFaith.HighGodName] ด้วยความกระตือรือร้นและความมุ่งมั่นยิ่งกว่า [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName]\n\nการแสวงหาเกียรติยศอย่างไม่หยุดยั้งของ [virtuous_theocrat.GetHerHis|U] ได้กลายเป็นแรงบันดาลใจให้แก่ [virtuous_theocrat.GetFaith.GetAdherentNamePlural] หนุ่มสาวนับไม่ถ้วนทั้งใกล้และไกล"
 fervor.2002.desc.content:0 "ตามที่หลายคนกล่าว [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้น้อมรับการไม่ยึดติดกับเรื่องทางโลกอย่างแท้จริง ซึ่งเป็นหัวใจสำคัญของหลักคำสอน [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]\n\n[virtuous_theocrat.GetWomanMan] ไม่แสดงความสนใจในชื่อเสียงหรือเกียรติยศ พอใจที่จะใช้ชีวิตในการรับใช้ [ROOT.Char.GetFaith.HighGodName]"
 fervor.2002.desc.arbitrary:0 "นักปราชญ์ผู้มีเหตุผลทุกคนรู้ดีว่าพระประสงค์ของพระเจ้าเป็นสิ่งที่หยั่งรู้ไม่ได้และเปลี่ยนแปลงตลอดเวลา แต่มีเพียงไม่กี่คนที่แสดงให้เห็นถึงธรรมชาติของมันได้เหมือน [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] แห่ง [scoped_primary_title.GetNameNoTier] ได้รับชื่อเสียงในด้านการตัดสินที่รวดเร็วและลึกลับของ [virtuous_theocrat.GetHerHis] จนหลายคนคิดว่า [virtuous_theocrat.GetSheHe] ได้รับการสัมผัสจาก [ROOT.Char.GetFaith.HighGodName]"
 fervor.2002.desc.just:0 "ชื่อเสียงที่มั่นคงและไร้ข้อตำหนิของ [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] ทำให้ [virtuous_theocrat.GetHerHim] ได้รับความเคารพจากผู้คนมากมาย\n\nมักถูกเรียกตัวไปตัดสินข้อพิพาท [virtuous_theocrat.GetSheHe] ถูกมองโดยหลายคนว่าเป็นศูนย์รวมจิตวิญญาณแห่งความยุติธรรมอันศักดิ์สิทธิ์ ซึ่งเป็นหัวใจสำคัญของหลักคำสอน [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip]"
 fervor.2002.desc.cynical:0 "ในช่วงหลายปีแห่งการศึกษาและเทศนา [virtuous_theocrat.GetHerHis] [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้สร้างชื่อเสียงอันโด่งดังให้แก่ [virtuous_theocrat.GetHerselfHimself] ในฐานะนักคิดเชิงวิพากษ์\n\n[ROOT.Char.GetFaith.HighGodName] ได้เติมเต็มโลกนี้ด้วยความลึกลับ และมีเพียงการตั้งคำถามอย่างต่อเนื่องและทัศนคติที่มีเหตุผลเท่านั้นที่ผู้ศรัทธาจะบรรลุการรู้แจ้งได้อย่างแท้จริง"
 fervor.2002.desc.zealous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ยืนหยัดในสายตาของหลายคนในฐานะปราการปกป้องศรัทธาจากการทุจริตและการนอกรีต\n\nในฐานะ [virtuous_theocrat.GetWomanMan] ผู้มีความภักดีอันไม่ย่อท้อ [virtuous_theocrat.GetSheHe] ต่อสู้ทั้งวันทั้งคืน เพื่อให้แน่ใจว่าสมาชิกทุกคนในฝูงแกะของ [virtuous_theocrat.GetHerHis] ปฏิบัติตามหลักคำสอน [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] อย่างเคร่งครัด"
 fervor.2002.desc.zealous.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ยืนหยัดในสายตาของหลายคนในฐานะปราการปกป้องศรัทธาจากการทุจริตและการนอกรีต\n\nในฐานะ [virtuous_theocrat.GetWomanMan] ผู้มีความภักดีอันไม่ย่อท้อ [virtuous_theocrat.GetSheHe] ต่อสู้ทั้งวันทั้งคืน เพื่อให้แน่ใจว่าความสมบูรณ์ของ [virtuous_theocrat.GetFaith.GetName] ได้รับการรักษาไว้ และคณะสงฆ์ยึดมั่นในสัจธรรมตามหลักคำสอนของ [virtuous_theocrat.GetFaith.ReligiousText] อย่างเคร่งครัด"
 fervor.2002.desc.paranoid:0 "เมื่อพวกนอกรีตและผู้ดูหมิ่นศาสนาซ่อนตัวอยู่ทุกมุม จิตใจที่เฉียบแหลมและใฝ่รู้คือเครื่องมือที่ดีที่สุดของผู้ติดตามที่ศรัทธาใน [ROOT.Char.GetFaith.HighGodName]\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้สร้างแรงบันดาลใจให้นักเทศน์นับไม่ถ้วนด้วยการบรรยายของ [virtuous_theocrat.GetHerHis] เกี่ยวกับการเปิดโปงการนอกรีต ทำให้มั่นใจได้ถึงความสมบูรณ์อย่างต่อเนื่องของศรัทธาของเรา"
 fervor.2002.desc.trusting:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้ทำงานอย่างหนักในช่วงไม่กี่ปีที่ผ่านมาเพื่อเผยแพร่สัจธรรมที่เปิดเผยว่าชาย [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ทุกคนซื่อสัตย์และตรงไปตรงมา\n\nความซื่อสัตย์จะได้รับการส่งเสริมตอบแทนได้ก็ต่อเมื่อเชื่อในคำพูดของเพื่อนมนุษย์โดยปริยายเท่านั้น"
 fervor.2002.desc.compassionate:0 "ในฐานะจิตวิญญาณที่ได้รับพรอย่างแท้จริง [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นแบบอย่างที่แท้จริงของความเมตตา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] นำฝูงแกะของ [virtuous_theocrat.GetHerHis] ด้วยมืออันอ่อนโยน พร้อมเสมอที่จะรับฟังและช่วยเหลือจิตวิญญาณที่โชคดีน้อยกว่า ซึ่งมาหา [virtuous_theocrat.GetHerHim] เพื่อขอคำแนะนำ"
 fervor.2002.desc.callous:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้แสดงให้เพื่อนร่วมงานและผู้ติดตามจำนวนมากของ [virtuous_theocrat.GetHerHis] เห็นครั้งแล้วครั้งเล่าว่าการรักษาท่าทีที่ไม่ยึดติดต่อทั้งสิ่งล่อใจและความเจ็บปวดนั้นสำคัญเพียงใดสำหรับผู้ศรัทธา [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]\n\nอารมณ์ที่ได้รับแรงบันดาลใจจากโลกวัตถุนั้นเป็นเพียงสิ่งชั่วคราวและไม่สำคัญเมื่อเทียบกับความรุ่งโรจน์แห่งสวรรค์"
 fervor.2002.desc.sadistic:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้รับความเคารพและเกรงกลัวจากฝูงแกะของ [virtuous_theocrat.GetHerHis] ในระดับเท่าๆ กัน ในฐานะ [virtuous_theocrat.GetWomanMan] ผู้ไร้ความปรานี [virtuous_theocrat.GetSheHe] ใช้เวลาใน แต่ละวันลงโทษคนบาปทุกที่ที่ [virtuous_theocrat.GetSheHe] พบเจอ ทำให้มั่นใจได้ถึงการชำระล้างจิตวิญญาณของพวกเขาผ่านการชำระล้างจิตวิญญาณผ่านความเจ็บปวดอย่างที่สุด"
 fervor.2002.desc.sadistic.pope:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้รับความเคารพและหวาดกลัวจากผู้ศรัทธาในระดับเท่าๆ กัน เป็น [virtuous_theocrat.GetWomanMan] ที่โหดเหี้ยม [virtuous_theocrat.GetSheHe] ใช้เวลาวัน [virtuous_theocrat.GetHerHis] ลงโทษคนบาปทุกที่ที่ [virtuous_theocrat.GetSheHe] พบเจอ เพื่อให้แน่ใจว่าจิตวิญญาณของพวกเขาจะได้รับการชำระล้างผ่านจุดสูงสุดแห่งความเจ็บปวด"
 fervor.2002.desc.forgiving:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้กลายเป็นสัญลักษณ์ของการให้อภัยอันไม่มีที่สิ้นสุดของ [ROOT.Char.GetFaith.HighGodNamePossessive]\n\nพร้อมเสมอที่จะยื่นมือช่วยเหลือและเปิดใจรับผู้ที่ต้องการความช่วยเหลือ [virtuous_theocrat.GetFirstNameNoTooltip] มีบทบาทสำคัญในการรักษาหลักคำสอน [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ที่ว่าไม่มีใครบริสุทธิ์อย่างแท้จริง และ ดังนั้นจึงไม่มีใครสามารถตัดสินผู้อื่นได้นอกจาก [ROOT.Char.GetFaith.HighGodName]"
 fervor.2002.desc.fallback:0 "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] ได้รับการพิจารณาจากหลายคนว่าเป็นแบบอย่างของคุณธรรม [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]\n\nความประพฤติอันไร้ที่ติและการทำงานอย่างไม่รู้จักเหน็ดเหนื่อยในฐานะนักปราชญ์และนักเทศน์ของ [virtuous_theocrat.GetHerHis|U] ได้ช่วยฟื้นฟูศรัทธาอย่างมีนัยสำคัญในช่วงไม่กี่ปีที่ผ่านมา"
 fervor.2001.a.a:0 "[virtuous_theocrat.GetSheHe|U] เป็นแบบอย่างแก่เราทุกคน!"
 fervor.2001.a.b:0 "ช่างน่าสรรเสริญยิ่งนัก"
 fervor.2001.a.c:0 "แต่ [virtuous_theocrat.GetSheHe] ทำเพื่อ [ROOT.Char.GetFaith.HighGodName] หรือเพื่อชื่อเสียงกันแน่?"
