 # Event localization
 artifact.0011.t:1 "[this_artifact.Custom('InventoryCourtArtifact')] สูญหาย!"
 artifact.0011.tooltip:0 "ท่านสูญเสีย [this_artifact.GetName] ให้แก่ [owner.GetTitledFirstNameNoTooltip]"
 artifact.0012.t_1: "ได้รับวัตถุล้ำค่า!"
 artifact.0012.t: "ได้รับวัตถุล้ำค่า!"
 artifact.0012.tooltip:0 "ท่านได้รับ [this_artifact.GetName] จาก [old_owner.GetTitledFirstNameNoTooltip]"
 msg_artifact_gained_acquired_desc_1: "ท่านได้รับ [PlayerMessageItem.GetRightArtifact.GetName]"
 msg_artifact_gained_acquired_desc_2: "ท่านได้รับ [PlayerMessageItem.GetRightArtifact.GetName] และ [PlayerMessageItem.GetLeftArtifact.GetName]"
 msg_artifact_gained_acquired_desc: "ท่านได้รับ [PlayerMessageItem.GetRightArtifact.GetName], [PlayerMessageItem.GetLeftArtifact.GetName], และ $msg_artifact_gained_desc_others$"
 msg_artifact_gained_desc_others: "#tooltip:message_consolidation_names อีก #L ชิ้น#!#!"
 artifact.0021.t:1 "[this_artifact.Custom('InventoryCourtArtifact')] ถูกทำลาย!"

 artifact.1001.t:0 "เถ้าสู่เถ้า สนิมสู่...?"
 artifact.1001.desc.antiquarian:1 "นักสะสมโบราณวัตถุของข้า [antiquarian.GetTitledFirstName] เข้ามาหาข้า ถือ [this_artifact.GetName] ของข้าไว้ในมือ[antiquarian.GetHerHis]"
 artifact.1001.desc.servant:2 "คนรับใช้คนหนึ่งของข้าเข้ามาหาข้า ถือ [this_artifact.GetName] ของข้าไว้ในมือ[dummy_servant_gender.GetHerHis]"
 artifact.1001.desc.weapon:0 "\n\n\"ฝ่าบาท ขณะที่ข้ากำลังทำความสะอาดคลังอาวุธ ข้าสังเกตเห็นว่า [SCOPE.Custom('ThisArtifactType')] ชิ้นนี้ขึ้นสนิมจนแทบไม่เหลือชิ้นดี เราควรทำอย่างไรกับมันดีพ่ะย่ะค่ะ/เพคะ?'\"\n\nข้าพิจารณา [SCOPE.Custom('ThisArtifactType')] ชิ้นนั้น แม้การตีขึ้นรูปใหม่เท่าใดก็ไม่อาจ ทำให้มันกลับมาใช้รบได้อีกครั้ง แต่ก็เป็นไปได้ที่จะทำความสะอาดและเก็บรักษาไว้เพื่อจัดแสดงโดยเสียค่าใช้จ่ายเพียงเล็กน้อย"
 artifact.1001.desc.other:0 "\n\n\"ฝ่าบาท ขณะที่ข้ากำลังทำความสะอาดห้องเก็บของ ข้าสังเกตเห็นว่า [SCOPE.Custom('ThisArtifactType')] ชิ้นนี้เก่าแก่มากจนแทบจะผุพัง! เราควรทำอย่างไรกับมันดีพ่ะย่ะค่ะ/เพคะ?'\"\n\nข้าพิจารณา [SCOPE.Custom('ThisArtifactType')] ชิ้นนั้น แม้การซ่อมแซมเท่าใดก็ไม่อาจ ทำให้มันกลับมาสวมใส่ได้อีกครั้ง แต่ก็เป็นไปได้ที่จะทำความสะอาดและเก็บรักษาไว้เพื่อจัดแสดงโดยเสียค่าใช้จ่ายเพียงเล็กน้อย"
 artifact.1001.a:0 "เป็นความพยายามที่คุ้มค่า"
 artifact.1001.a.tt.free:0 "#instruction [artifact|E]ชิ้นนี้สามารถแปลงสภาพได้ฟรี!#!"
 artifact.1001.a.tt:1 "[this_artifact.GetName] ถูกแปลงเป็น[court_artifact|E] ซึ่งให้เพียง[grandeur|E]และ[prestige|E]"
 artifact.1001.b:0 "ไม่ มันแพงเกินไป"

 manhunter:0 "#EMP \"นักล่ามนุษย์\"#!"
 heartseeker:0 "#EMP \"ผู้เสาะหาหัวใจ\"#!"

 artifact.1001.desc.kills_none:0 "[this_artifact.GetDesc]\n\nเนื่องจากไม่เคยถูกใช้ในการรบ อาวุธชิ้นนี้จึงทำหน้าที่เป็นเพียงเครื่องประดับแขวนบนผนังของขุนนางน้อยบางคนเท่านั้น"
 artifact.1001.desc.kills_one:0 "[this_artifact.GetDesc]\n\nเมื่อเคยถูกใช้สังหารศัตรูในสนามรบ อาวุธชิ้นนี้ได้พิสูจน์คุณค่าของมันเพียงพอที่จะจัดแสดงในห้องโถงของผู้ปกครอง"
 artifact.1001.desc.kills_some:0 "[this_artifact.GetDesc]\n\nหลังจากสังหารศัตรูไป [ROOT.Var('num_kills').GetValue|V0] คนในสนามรบ อาวุธชิ้นนี้สมควรได้รับตำแหน่งในห้องโถงของนักรบผู้ยิ่งใหญ่หรือผู้ปกครองคนอื่นๆ"
 artifact.1001.desc.kills_many:0 "[this_artifact.GetDesc]\n\nแม้จะไม่เหมาะแก่การรบอีกต่อไป แต่ชีวิต [ROOT.Var('num_kills').GetValue|V0] ชีวิตที่อาวุธนี้ได้คร่าไป ทำให้มันกลายเป็นสัญลักษณ์แห่งความเก่งกาจทางการทหาร เหมาะที่จะจัดแสดงในห้องโถงของนักรบผู้ยิ่งใหญ่"
 artifact.1001.desc.kills_tons:0 "[this_artifact.GetDesc]\n\nแม้จะไม่เหมาะแก่การรบอีกต่อไป แต่ชีวิต [ROOT.Var('num_kills').GetValue|V0] ชีวิตที่อาวุธนี้ได้คร่าไป ทำให้มันกลายเป็นสัญลักษณ์แห่งความเก่งกาจทางการทหารในตำนาน สร้างความน่าเกรงขามหรือความหวาดกลัวให้กับทุกคนที่ได้เห็น"

 #Degraded Artifact Events
 artifact.3000.t:0 "วัตถุโบราณเสื่อมสภาพ: นำกลับมาใช้ใหม่"
 artifact.3000.desc.armorer_intro:0 "$armorer_camp_officer$ [antiquarian.GetTitledFirstName] ของข้า เข้ามาหาข้าด้วยสีหน้ากังวล [antiquarian.GetHerHis]\n\n"[ROOT.GetCharacter.GetLadyLord] ของข้า ข้ากังวลมากขึ้นเรื่อยๆ เกี่ยวกับ [this_artifact.GetName] ของท่านและสภาพที่ทรุดโทรมอย่างสิ้นเชิง มันกำลังจะพังแล้ว!"
 artifact.3000.desc.antiquarian_intro:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstName] ของข้า เข้ามาหาข้าด้วยสีหน้ากังวล [antiquarian.GetHerHis]\n\n"[ROOT.GetCharacter.GetLadyLord] ของข้า ข้ากังวลมากขึ้นเรื่อยๆ เกี่ยวกับ [this_artifact.GetName] ของท่านและสภาพที่ทรุดโทรมอย่างสิ้นเชิง มันกำลังจะพังแล้ว!"
 artifact.3000.desc.antiquarian:0 "\n\n\"อาจจะสายเกินไปที่จะบูรณะมันในตอนนี้ แต่ก็ยังไม่สูญเสียทั้งหมด หากท่านอนุญาต ข้าสามารถแยกชิ้นส่วนที่มีประโยชน์เพื่อนำไปใช้ในวัตถุโบราณในอนาคตได้!\""
 artifact.3000.desc.servant_intro:1 "คนรับใช้คนหนึ่งเข้ามาหาข้าด้วยสีหน้ารู้สึกผิดและมีบางอย่างซ่อนอยู่ข้างหลัง[dummy_servant_gender.GetHerHis]\n\n\"ท่าน[ROOT.GetCharacter.GetLadyLord] ข้ากำลังทำความสะอาดคอลเลกชันวัตถุโบราณของท่านตามปกติเมื่อข้าสังเกตเห็นสภาพที่ทรุดโทรมอย่างยิ่งของ [this_artifact.GetName] ของท่าน\""
 artifact.3000.desc.servant:0 "\"หากไม่มีผู้เชี่ยวชาญในราชสำนัก อาจเป็นไปไม่ได้ที่จะบูรณะให้กลับคืนสู่ความรุ่งโรจน์ดังเดิม แต่เราอาจจะเก็บเศษซากไว้เพื่อนำกลับมาใช้ใหม่ในวัตถุโบราณชิ้นใหม่...\""
 artifact.3000.a:0 "มัน ทำให้ข้าเจ็บปวด แต่จงดำเนินการต่อไป"
 artifact.3000.b:0 "มันยังสามารถกู้คืนได้!"
 artifact.3000.c:0 "ข้าพนันได้เลยว่าเป็น #EMP เจ้า#! ที่ทำมันพัง!"
 
 artifact.3001.t:0 "แรงบันดาลใจ: นำกลับมาใช้ใหม่"
 artifact.3001.desc:0 "ด้วยย่างก้าว [inspiration_owner.GetHerHis] ที่กระฉับกระเฉง [inspiration_owner.GetFirstName] เข้ามาหาข้าในวันนี้\n\n"ท่าน [ROOT.GetCharacter.GetLadyLord] ของข้า! ข้ากำลังค้นหาของที่ถูกทิ้งและของจุกจิกที่แตกหักในห้องเก็บของของท่านเพื่อหาแรงบันดาลใจ เมื่อข้าบังเอิญพบสมบัติที่ไม่คาดคิด ดูเหมือนว่าท่านจะทิ้งวัสดุสำรองบางส่วนจากวัตถุโบราณที่ถูกรื้อถอนไว้ในที่เก็บของสำหรับอนาคต... เอาล่ะ อนาคตมาถึงแล้ว!\n\nหากข้าจะใช้อะไหล่สำรองเหล่านี้สำหรับโครงการของข้า คุณภาพจะไม่ลดลง และข้าสามารถคืนทองคำส่วนหนึ่งที่ท่านกันไว้สำหรับซื้อวัสดุให้ท่านได้!""
 artifact.3001.a:0 "นี่เป็นข่าวที่ยอดเยี่ยม!"

 artifact.3010.t:0 "วัตถุโบราณเสื่อมสภาพ: ขาย"
 artifact.3010.desc.antiquarian:0 "\n\n\"เป็นไปได้ว่า พ่อค้าเศษเหล็กอาจสนใจซื้อชิ้นส่วนในราคาที่เหมาะสม...\""
 artifact.3010.desc.servant:0 "\n\n\"ตอนนี้มันไร้ประโยชน์และจำไม่ได้โดยสิ้นเชิง! ท่านอาจจะขายมันให้กับคนเก็บเศษเหล็กและทำเหรียญทองจากมัน...\""
 artifact.3010.a:0 "ก็ได้ ข้าไม่ต้องการมันอยู่แล้ว"
 artifact.3010.a.tt:0 "[this_artifact.GetNameNoTooltip|U] ถูกขายให้กับพ่อค้าและสูญหายไปตลอดกาล"
 artifact.3010.b:0 "วัตถุโบราณนั้นเป็น #EMP ของข้า!#!"

 artifact.3020.t:0 "วัตถุโบราณเสื่อมสภาพ: ดัดแปลง"
 artifact.3020.desc:0 "\n\n\"มันอาจจะไม่มีวันกลับมาใช้งานได้เหมือนเดิม แต่หากท่านอนุญาต อย่างน้อยข้าก็สามารถกอบกู้ส่วนหนึ่งของมันไว้เป็นของที่ระลึกถึงความรุ่งโรจน์ในอดีตได้! ท้ายที่สุดแล้ว มันเคยเป็นสัญลักษณ์อันยิ่งใหญ่แห่งอำนาจของท่านมาระยะหนึ่งแล้ว...\""
 artifact.3020.a:0 "อย่างน้อยมันก็ยังดีสำหรับบางสิ่ง..."
 artifact.3020.b:0 "แค่ทำงานของเจ้าและซ่อมมัน!"
 keepsake_trinket_name:0 "ของที่ระลึกจาก [this_artifact.GetNameNoTooltip]"
 keepsake_trinket_description:0 "เศษเสี้ยวของ [this_artifact.GetNameNoTooltip] ที่สูญหายไป ซึ่ง $antiquarian_court_position$ ของ[owner.GetHerHis]ได้กอบกู้ไว้ให้ [owner.GetTitledFirstNameNoTooltip] เป็นของที่ระลึก"

 artifact.3030.t:0 "วัตถุโบราณเสื่อมสภาพ: เก็บรักษา"
 artifact.3030.desc:0 "\n\n\"เพื่อที่จะรักษามันไว้ ข้ามีข้อเสนอ เมื่อเร็วๆ นี้ข้าชนะม้วนคัมภีร์ที่เต็มไปด้วยฝุ่นจากการทอยลูกเต๋ากับตัวละครที่น่าสงสัยในงานออกร้านเคลื่อนที่ – เป็นข้อตกลงที่โชคดีมาก เนื่องจากเนื้อหาของมันเข้ากันได้ดีกับความสนใจที่กำลังผลิบานของข้าในด้านการเล่นแร่แปรธาตุ! ม้วนคัมภีร์เก่าแก่บรรยายถึงยาอายุวัฒนะลับที่รับประกันว่าจะ ทำให้ #EMP วัตถุโบราณใดๆ#! ดีขึ้นกว่าเดิม โปรดให้ข้าลองเถิด!\""
 artifact.3030.a:0 "แน่นอน มันคงไม่แย่ไปกว่านี้แล้ว..."
 artifact.3030.b:0 "เจ้าจะ #EMP ไม่#! แตะต้องมันด้วยยาปรุงนั้น!"
 artifact.3030.a.bigsuccess:0 "วัตถุโบราณสะอาดและแข็งแกร่งกว่าที่เคย"
 artifact.3030.a.bigsuccess.t:0 "วัตถุโบราณได้รับการบูรณะและปรับปรุง"
 artifact.3030.a.success:0 "วัตถุโบราณได้รับการซ่อมแซม"
 artifact.3030.a.success.t:0 "วัตถุโบราณได้รับการซ่อมแซม"
 artifact.3030.a.failure:0 "การรักษาไม่ประสบผลสำเร็จ"
 artifact.3030.a.failure.t:0 "การรักษาที่ไร้ประโยชน์"
 artifact.3030.a.bigfailure:0 "วัตถุโบราณถูกทำลาย"
 artifact.3030.a.bigfailure.t:0 "วัตถุโบราณถูกทำลาย!"

 artifact.3040.t:0 "วัตถุโบราณเสื่อมสภาพ: ข้อเสนอ"
 artifact.3040.desc.antiquarian:0 "$antiquarian_court_position$ ของข้า [antiquarian.GetTitledFirstName] เข้ามาหาข้าพร้อมกับ [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\n\"ท่าน[ROOT.GetCharacter.GetLadyLord] มีผู้แจ้งให้ข้าทราบว่า [this_artifact.GetName] ของท่านอยู่ในสภาพที่ย่ำแย่... แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว ข้าก็ไม่สามารถทำอะไรได้อีกเพื่อรักษามันไว้หากไม่มีเงินทุนที่เพียงพอ!\n\nอย่างไรก็ตาม ข้าได้พบวิธีแก้ปัญหาที่เป็นไปได้เพื่อประหยัดคลังของท่าน [vassal.GetTitledFirstNameNoTooltip|U] ได้เสนอที่จะแบกรับค่าใช้จ่ายเพื่อแลกกับเพียงของแสดงความขอบคุณเล็กน้อยจากท่าน\""
 artifact.3040.desc.no_antiquarian:0 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยสีหน้าสำนึกผิดจอมปลอมจนข้ากลัวคำพูดต่อไปของ[vassal.GetHerHis]แล้ว\n\n\"ท่าน[ROOT.GetCharacter.GetLadyLord] ช่างเป็นเรื่อง #EMP น่าอับอาย#! อย่างยิ่งที่สมบัติล้ำค่า เช่น [this_artifact.GetName] ของท่านถูกลืมเลือนและทิ้งร้างให้ฝุ่นจับ! โปรดอนุญาตให้ข้าจ่ายค่าบูรณะ – เพื่อแลกกับบุญคุณเล็กน้อย\""
 artifact.3040.a:0 "ข้ารู้อยู่แล้วว่ามีเงื่อนไข... แต่ก็ได้!"
 artifact.3040.b:0 "งั้นเราถือว่าหายกัน"
 artifact.3040.c:0 "ข้าไม่ต้องการความช่วยเหลือจากเจ้า"
 artifact.3050.t:0 "วัตถุโบราณเสื่อมสภาพ!"
 artifact.3050.desc:0 "วัตถุโบราณคุณภาพสูงในครอบครองของท่าน – [this_artifact.GetName] – กำลังใกล้ถึง #N 0#! [durability|E] และอาจถูกทำลาย!"
 artifact.4000.t:0 "ข่าวลือต้องสาป"
 artifact.4000.desc.antiquarian_intro:0 "$antiquarian_court_position$ [antiquarian.GetTitledFirstName] ของข้า มีท่าทีวิตกมาหลายวัน ก่อนที่ [antiquarian.GetSheHe] จะตัดสินใจเข้ามาหาข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้ามีข่าวที่น่ากังวลเกี่ยวกับหนึ่งในสมบัติล้ำค่าของท่าน นั่นคือ [this_artifact.GetName] ของท่าน บัดนี้ในท้องพระโรงมีเสียงร่ำลือหนาหูเกี่ยวกับของสิ่งนั้น ทั้งแขกเหรื่อและข้ารับใช้ต่างมองมันด้วยความหวาดกลัวและคลางแคลงใจ... พวกเขาเชื่อว่ามัน #EMP ต้องคำสาป!#! ตามข่าวลือนั้นว่ากันว่า,"
 artifact.4000.desc.servant_intro:0 "ในช่วงสองสามวันที่ผ่านมา ข้าอดสังเกตมิได้ว่าในครัวเรือนของข้ามีเสียงร่ำลือหนาหูกว่าปกติ แม้ว่าทุกเสียงจะเงียบกริบลงเมื่อข้าเดินเข้าไปในห้อง\n\nเมื่อข้าดึงตัวคนรับใช้มาเพื่อซักถามหาคำอธิบายได้ในที่สุด [dummy_servant_gender.GetHerHis] ก็ตอบว่า: "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านมิทราบหรือ? ก็เรื่อง [this_artifact.GetName] ของท่านน่ะสิ! ใคร ๆ ก็รู้ว่ามัน #EMP ต้องคำสาป!#! เป็นที่ประจักษ์แล้วว่า"
 artifact.4000.desc.stolen:0 "ไม่มีใครสามารถเป็นเจ้าของมันได้อย่างแท้จริง เพราะมันถูกลิขิตให้ถูกขโมยและก่อให้เกิดความขัดแย้งไม่รู้จบ!"
 artifact.4000.desc.assassinated:0 "มันนำมา ซึ่งโชคร้ายครั้งใหญ่และความตายอย่างทารุณแก่ผู้ที่เป็นเจ้าของ!"
 artifact.4000.desc.ghost:0 "มันถูกสิงสู่โดยวิญญาณโกรธแค้นของผู้ตาย!"
 artifact.4000.desc.fallback:0 "มันถูกหล่อหลอมด้วยพลังอันร้ายกาจของ[ROOT.Char.GetFaith.DevilName]!"
 artifact.4000.desc.end:0 "\n\n\"บางทีการแทรกแซงของผู้ทรงศีลชายหรือหญิงอาจ ทำให้ทุกคนสบายใจขึ้น...\""
 artifact.4000.cursed_name:1 "[this_artifact.GetNameNoTooltip] ต้องสาป"
 artifact.4000.cursed_desc:1 "[this_artifact.GetDesc]\n\nขุนนางและชาวบ้านต่างเงียบกริบหรือร้องขอการคุ้มครองจากสวรรค์เมื่ออยู่ต่อหน้าสิ่งของชิ้นนี้ ซึ่งมีชื่อเสียงว่าต้องสาป"
 artifact.4000.a:0 "ส่งคนไปตามบุคคลผู้นี้ทันที!"
 artifact.4000.b:0 "ให้ทุกคนตัวสั่นด้วยความกลัวเมื่อเห็นมัน!"
 artifact.4001.t:0 "ข่าวลือต้องสาป: การแทรกแซงจากผู้ศักดิ์สิทธิ์"
 artifact.4001.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ของข้า ต้องการเข้าพบข้า,"
 artifact.4001.desc.servant_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" คนรับใช้ท่าทางรีบร้อนเข้ามาหาข้า พร้อมกับบุคคลท่าทางเคร่งขรึมผู้หนึ่ง,"
 artifact.4001.desc:0 "\"ตามที่ท่านร้องขอ ได้พบผู้ทรงศีล[holy_man.GetWomanMan]เพื่อมาให้พรแก่ [this_artifact.GetName] ของท่านแล้ว \n\n\"ให้ข้าแนะนำท่านให้รู้จักกับ [holy_man.GetFirstName] ข้ามั่นใจว่าการแทรกแซงของ[holy_man.GetHerHis]จะถอนคำสาปและ ทำให้จิตใจของข้าราชบริพารของท่านสงบลง\""
 artifact.4001.a:0 "พยายามให้ดีที่สุด [holy_man.GetFirstNameNoTooltip]..."
 artifact.4001.a.success:0 "คำสาปถูกถอน"
 artifact.4001.a.failure:0 "คำสาปยังคงอยู่"
 artifact.4001.a.success.desc:0 "คำสาปถูกถอน"
 artifact.4001.a.failure.desc:0 "คำสาปยังคงอยู่"
 artifact.4002.t:0 "ข่าวลือต้องสาป: ชื่อเสียงอันมืดมน"
 artifact.4002.desc.antiquarian_intro:0 "[ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ของข้า กล่าวกับข้าด้วยสีหน้าครุ่นคิด [antiquarian.GetHerHis]""
 artifact.4002.desc.servant_intro:0 "กลุ่มคนรับใช้ที่หวาดกลัวหยุดข้าขณะเดินทางไปยังห้องพักของข้า หนึ่งในนั้นพูดขึ้น:"
 artifact.4002.desc:0 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านคงตระหนักดีว่าชื่อเสียงอันเลวร้ายของ [this_artifact.GetName] ของท่านในฐานะของต้องสาปนั้น ได้เพิ่มพูนขึ้นตลอดหลายปีที่ผ่านมา... เหล่าข้ารับใช้ บริวาร และแม้กระทั่งแขกเหรื่อต่างหวาดผวากับมัน!\n\nท่านจะยินยอมให้เรียกนักบวชชายหรือหญิงมาทำพิธีประสาทพรแก่ของสิ่งนี้ และมอบความสงบสุขแก่เหล่าผู้อยู่ใต้ปกครองที่หวาดกลัวของท่านในที่สุดหรือไม่?"
 artifact.4010.t:0 "อาวุธสังหารอันเลื่องชื่อ"
 artifact.4010.desc.antiquarian_intro:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านได้ยินข่าวหรือไม่?" [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ของข้า เดินเข้ามาหาข้า"
 artifact.4010.desc.servant_intro:0 "ข้าอดไม่ได้ที่จะฟังเสียงตื่นเต้นที่ดังมาจากกลุ่มคนรับใช้เล็กๆ ในห้องโถง"
 artifact.4010.desc:1 "\n\n\"ชื่อเสียงของ [this_artifact.GetName] ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]ไปไกลและกว้างขวางและยังคงเติบโตต่อไป! ทุกคนพูดถึง [SCOPE.Custom('ThisArtifactType')] ที่อยู่ยงคงกระพัน ซึ่งฟันศัตรูได้ง่ายดายราวกับดอกไม้ในทุ่ง และถึงเจ้าของอันรุ่งโรจน์ของมัน!\""
 artifact.4010.a:0 "ข่าวดีเยี่ยม!"
 artifact_killer_1_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle1')]"
 artifact_killer_2_name:1 "[this_artifact.Custom('RandomWeaponTitle2')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_3_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle3')]"
 artifact_killer_4_name:1 "[this_artifact.Custom('RandomWeaponTitle4')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_1_desc:0 "[this_artifact.GetDesc]\n\nหลังจากถูกใช้ในชัยชนะอย่างน้อย 15 ครั้งในสนามรบ อาวุธชิ้นนี้มีชื่อเสียงในการแสดงความกล้าหาญที่แท้จริงของเจ้าของ"
 artifact_killer_2_desc:0 "[this_artifact.GetDesc]\n\nหลังจากถูกใช้ในชัยชนะอย่างน้อย 30 ครั้งในสนามรบ อาวุธชิ้นนี้มีชื่อเสียงในการนำความเจ็บปวดมาสู่ศัตรู"
 artifact_killer_3_desc:0 "[this_artifact.GetDesc]\n\nหลังจากถูกใช้ในชัยชนะอย่างน้อย 50 ครั้งในสนามรบ อาวุธชิ้นนี้มีชื่อเสียงในการนำชัยชนะมาสู่เจ้าของเสมอ"
 artifact_killer_4_desc:0 "[this_artifact.GetDesc]\n\nหลังจากถูกใช้ในชัยชนะอย่างน้อย 100 ครั้งในสนามรบ อาวุธชิ้นนี้ถูกกล่าวถึงในตำนาน"
 artifact.4020.t:0 "เกราะอันเลื่องชื่อ"
 artifact.4020.desc:1 "\n\n\"ทุกคนจำ [this_artifact.GetName] ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]ได้ ซึ่งส่องแสงในสนามรบไม่เหมือนใคร และ ทำให้ทั้งมิตรและศัตรูรู้ว่าวีรบุรุษอมตะเดินอยู่ท่ามกลางพวกเขา!\""
 artifact.4020.a:0 "ข่าวดีเยี่ยม!"
 artifact_armor_1_name:1 "[this_artifact.Custom('RandomArmorTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_2_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle2')]"
 artifact_armor_3_name:1 "[this_artifact.Custom('RandomArmorTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_4_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle4')]"
 artifact_armor_1_desc:0 "[this_artifact.GetDesc]\n\nหลังจากปกป้องเจ้าของให้ปลอดภัยอย่างน้อย 15 การรบ เกราะชิ้นนี้เริ่มเป็นที่รู้จักในสนามรบ"
 artifact_armor_2_desc:0 "[this_artifact.GetDesc]\n\nหลังจากปกป้องเจ้าของให้ปลอดภัยอย่างน้อย 30 การรบ เกราะชิ้นนี้กำลังสร้างชื่อเสียงในสนามรบ"
 artifact_armor_3_desc:0 "[this_artifact.GetDesc]\n\nหลังจากปกป้องเจ้าของให้ปลอดภัยอย่างน้อย 50 การรบ เกราะชิ้นนี้เป็นที่รู้จักและน่าเกรงขามทั้งมิตรและศัตรู"
 artifact_armor_4_desc:0 "[this_artifact.GetDesc]\n\nหลังจากปกป้องเจ้าของให้ปลอดภัยอย่างน้อย 100 การรบ เกราะชิ้นนี้ถือเป็นสิ่งของในตำนาน"
 artifact.4030.t:0 "มงกุฎแห่งปวงชนของเรา"
 artifact.4030.desc.antiquarian_intro:0 "[ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ของข้าเข้ามาหาข้าด้วยรอยยิ้มกว้างบนใบหน้า[antiquarian.GetHerHis]และ [this_artifact.GetName] ของข้าอยู่ในมือ[antiquarian.GetHerHis]"
 artifact.4030.desc.servant_intro:0 "คนรับใช้ที่มักได้รับมอบหมายให้ทำความสะอาดสมบัติล้ำค่าที่สุดของข้ามาหาข้าพร้อมกับ [this_artifact.GetName] ของข้าอยู่ในมือ[dummy_servant_gender.GetHerHis]"
 artifact.4030.desc_emperor:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านทราบหรือไม่ว่า หลังจากที่ตกเป็นของ [ROOT.Char.GetTitleTierName] มาหลายชั่วอายุคน บัดนี้มงกุฎองค์นี้เป็นที่รู้จักกันทั่วไปในฐานะสัญลักษณ์แห่งอำนาจของจักรวรรดิ?""
 artifact.4030.desc_kingdom:1 "\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านทราบหรือไม่ว่า หลังจากที่ตกเป็นของ [ROOT.Char.GetTitleAsNameNoTooltip] มาหลายชั่วอายุคน บัดนี้มงกุฎองค์นี้ถูกนับว่าเป็นส่วนสำคัญในอัตลักษณ์ของ [primary_title_scope.GetBaseNameNoTierNoTooltip]?""
 artifact_emperors_crown_name:1 "มงกุฎจักรพรรดิ[this_artifact.GetNameNoTooltip]"
 artifact_emperors_crown_desc:1 "[this_artifact.GetDesc]\n\nเป็นเวลาหลายชั่วอายุคนแล้วที่มงกุฎนี้เป็นของจักรพรรดิ จึงได้รับอำนาจพิเศษ"
 artifact_crown_special_name:1 "[this_artifact.GetNameNoTooltip] แห่ง [primary_title_scope.GetNameNoTierNoTooltip]"
 artifact_crown_special_desc:1 "[this_artifact.GetDesc]\n\nมงกุฎนี้ได้รับการสืบทอดผ่านผู้ปกครองหลายชั่วอายุคนในตำแหน่งเดียวกัน จึงกลายเป็นสัญลักษณ์แห่งอำนาจของพวกเขา"
 artifact.4040.t:0 "สายตาของผู้เชี่ยวชาญ"
 artifact.4040.desc:0 "[helpful.Custom2('MyCharacterIntroduction', ROOT.Char)] เข้ามาหาข้าพร้อมประกายในดวงตาของ [helpful.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าอดสังเกตมิได้ถึงฝีมืองานช่างอันประณีตของ [this_artifact.GetName] ของท่าน... อย่างไรก็ตาม มีเพียงผู้เชี่ยวชาญที่แท้จริงแห่งสมรภูมิ เช่นข้าเท่านั้นที่สามารถระบุถึงการปรับ แต่งเล็ก ๆ น้อย ๆ ที่จะ ทำให้มันเป็นเครื่องมือสงครามที่มีประสิทธิภาพยิ่งขึ้นไปอีก!"\n\nข้าเลิกสนใจ [helpful.GetHerHim] เมื่อ [helpful.GetSheHe] เริ่มพูดพร่ำเกี่ยวกับ #EMP ความสมมาตร#!, #EMP ความสมดุล#!, และ #EMP การใช้คมดาบ#! แต่ข้าจับใจความสำคัญได้ว่า [helpful.GetFirstNameNoTooltip] สามารถพัฒนาวัตถุล้ำค่าของข้าได้เพื่อแลกกับ #EMP สินน้ำใจเชิงสัญลักษณ์จากข้า#!."
 artifact.4040.a:0 "ก็ได้ ทำตามที่เจ้าต้องการ"
 artifact.4040.a.tt:0 "[this_artifact.GetName|U] ได้รับการปรับปรุง!"
 artifact.4040.b:0 "ข้าไม่ต้องการความช่วยเหลือจากเจ้า"
 artifact.4050.t:0 "ระเบิดอารมณ์"
 artifact.4050.desc:0 "ความเครียดถาโถมใส่ข้าราวกับกองอิฐมาระยะหนึ่งแล้ว ข้ารู้สึกเหมือนอารมณ์ของข้ากำลังเดือดพล่านถึงขีดสุด เพียงแค่มองหาข้ออ้างที่จะระเบิดออกมาอย่างน่าตื่นตา\n\nทุกอย่างพังทลายลงเมื่อข้าก้าวเข้าไปในห้องโถงใหญ่ และคนรับใช้กำลังซุบซิบนินทา ข้าราชบริพารกำลังพูดพล่าม ที่ปรึกษาของข้ากำลังแย่งชิงความสนใจจากข้าพร้อมกัน และทุกอย่างมันมากเกินกว่าที่ข้าจะทนได้\n\n\"#EMP พอได้แล้ว!#!" ข้ากรีดร้องพร้อมกับคว้าสิ่งแรกที่มือข้าคว้าได้แล้วขว้างมันใส่ผนังที่ใกล้ที่สุด\n\nความเงียบเข้าปกคลุมห้อง และเมื่อข้าเห็น [this_artifact.GetName] ของข้าตกอยู่บนพื้นเสียหาย บิดเบี้ยวและแตกหัก ข้าก็รู้สึกว่าความโกรธทั้งหมดของข้าระเหยไป ถูกแทนที่ด้วยความรู้สึกหวาดกลัว..."
 artifact.4050.a:0 "บ้าจริง!"
 artifact.4060.t:0 "[SCOPE.Custom('ThisArtifactType')|U]ศักดิ์สิทธิ์แห่ง[ROOT.Char.GetFaith.HighGodName]"
 artifact.4060.desc:0 "\"ให้ข้าแนะนำท่านให้รู้จักกับ [holy_man.GetFirstName] [holy_man.GetWomanMan]ผู้ศักดิ์สิทธิ์ยิ่ง มีชื่อเสียงไปทั่วดินแดนของท่าน\n\n\"[holy_man.GetSheHe|U]มายังราชสำนักของท่านโดยดึงดูดจากชื่อเสียงของท่านในฐานะผู้ปกครองที่เคร่งศาสนาและยุติธรรม และประสงค์จะมอบการคุ้มครองจากสวรรค์แก่สมบัติชิ้นหนึ่งของท่าน\n\n\"ท่านจะอนุญาตหรือไม่?\""
 artifact.4060.a:0 "ข้าขอรับข้อเสนอของท่านด้วยความนอบน้อม [holy_man.GetFirstNameNoTooltip]"
 artifact.4060.b:0 "นี่ไม่จำเป็น"
 artifact_4060_blessed_artifact_name:1 "[this_artifact.GetNameNoTooltip]ศักดิ์สิทธิ์"
 artifact_4060_blessed_artifact_desc:0 "[this_artifact.GetDesc]\n\nตามเรื่องเล่าดั้งเดิม สิ่งของชิ้นนี้ได้รับการประทานพรจากผู้ทรงศีลชายหรือหญิง จึงได้รับการคุ้มครองจากสวรรค์ ผู้มีปัญญาไม่ยุ่งเกี่ยวกับเรื่องเหนือธรรมชาติ ไม่ว่าพวกเขาจะเชื่อหรือไม่ก็ตาม"
 artifact.4070.t:0 "วัตถุมงคลถูกลบหลู่"
 artifact.4070.desc:0 "การแย่งชิง [this_artifact.GetName] อันล้ำค่าของเรากลับมาจากพวก [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] จะต้อง ทำให้ข้าเป็นที่โปรดปรานในสายพระเนตรของ [ROOT.Char.GetFaith.HighGodName] อย่างแน่นอน กระนั้นก็ตาม ความรู้สึกไม่สบายใจยังคงอยู่ในตัวข้า โหมกระพือโดยหลายเสียงในราชสำนักของข้า\n\n#EMP "พวก [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] ทำให้วัตถุมงคลของเราแปดเปื้อน!" "พวกมันสาปแช่งของสิ่งนั้น!" "ใครจะรู้ว่าพวกมันใช้ประกอบพิธีกรรมวิปริตอันใดกับมันบ้าง!"#!\n\nพวกเขาน่าจะพูดเกินจริง แต่ข้าเดาว่าการจัดขบวนแห่ทางศาสนาอย่างหรูหราเพื่อ "ชำระล้าง" มันก็คงไม่เสียหายกระมัง?"
 artifact.4070.a:0 "มาจัดกันเลยทันที!"
 artifact.4070.b:0 "ไม่ พวกเขาแค่เชื่อเรื่องงมงาย"
 artifact.4080.t:0 "อาวุธของนักประลองชั้นครู"
 artifact.4080.desc:0 "\n\n\"ทุกคนกำลังพูดถึง [this_artifact.GetName] ของ[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]! เห็นได้ชัดว่าใครก็ตามที่ถือมันจะไม่แพ้การประลองใดๆ! ข้ายังได้ยินมาว่ามันเลือกเฉพาะผู้ที่คู่ควรที่สุดที่จะเป็นเจ้าของมัน! และข้าได้พูดคุยกับพ่อค้าเร่เมื่อวันก่อน: ชื่อเสียงของอาวุธที่อยู่ยงคงกระพันนี้ไปถึงบ้านเกิดของเขาแล้ว!\""
 artifact_duel_weapon_1_name:1 "[this_artifact.Custom('RandomDuelTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_2_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle2')]"
 artifact_duel_weapon_3_name:1 "[this_artifact.Custom('RandomDuelTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_4_name:1 "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle4')]"
 artifact_duel_weapon_1_desc:0 "[this_artifact.GetDesc]\n\nหลังจากเอาชนะศัตรูอย่างน้อย 5 คนในการประลอง อาวุธชิ้นนี้ได้พิสูจน์ตัวเองว่าน่าเชื่อถือและนำโชค"
 artifact_duel_weapon_2_desc:0 "[this_artifact.GetDesc]\n\nหลังจากเอาชนะศัตรูอย่างน้อย 10 คนในการประลอง อาวุธชิ้นนี้กำลังได้รับชื่อเสียงบางส่วน"
 artifact_duel_weapon_3_desc:0 "[this_artifact.GetDesc]\n\nหลังจากเอาชนะศัตรูอย่างน้อย 20 คนในการประลอง อาวุธชิ้นนี้ได้รับชื่อเสียงที่น่าเกรงขาม"
 artifact_duel_weapon_4_desc:0 "[this_artifact.GetDesc]\n\nหลังจากเอาชนะศัตรูอย่างน้อย 30 คนในการประลอง อาวุธชิ้นนี้ได้ทิ้งมรดกในตำนานไว้เบื้องหลัง"
 
 artifact.6001.t:0 "ธงศัตรู"
 artifact.6001.desc.commander:1 "ข้าสำรวจสนามรบ ใคร่ครวญว่าการรบครั้งนี้จะถูกจดจำอย่างไร และมองไปยังผู้เสียชีวิตที่ยังคงอยู่ ข้าสังเกตเห็นกลุ่มทหารของข้าเข้ามาใกล้และพวกเขาก็โค้งคำนับอย่างสุภาพต่อหน้าข้า\n\n"
 artifact.6001.desc:0 "การรบที่ [combat_location.GetName] จบลงด้วยชัยชนะอันน่าทึ่ง! ข้าฟังผู้ส่งสารอย่างกระตือรือร้นขณะที่เขาอ่านรายงานจากผู้บัญชาการของข้า [friendly_commander.GetTitledFirstName] จากนั้นก็หันไปหาทหารที่อยู่ตรงหน้าข้า\n\n"
 artifact.6001.desc.looting:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! พวกเราไปเจอธงของศัตรูระหว่างที่กำลัง... 'สะสาง' สนามรบ! พวกเราคิดว่าคงน่าเสียดายหากทิ้งมันไว้ บางทีท่านอาจต้องการเก็บมันไว้เป็นของที่ระลึกแห่งชัยชนะ?""
 artifact.6001.desc.killed_defender:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! พวกเราต้อนศัตรูที่เหลือจนมุมขณะที่พวกมันยืนหยัดสู้อย่างกล้าหาญ พวกมันสละชีวิตเพื่อปกป้องธงผืนนี้""
 artifact.6001.a:0 "มันจะเป็นส่วนเสริมที่ยอดเยี่ยมในคอลเลกชันของข้า!"
 artifact.6001.b:0 "วางมันบนกองไฟฉลอง เราไม่ต้องการสัญลักษณ์ที่ไร้ประโยชน์นี้"
 artifact.6001.toast:0 "สูญเสียธงชัยที่ [combat_location.GetNameNoTooltip]"
 
 artifact.7000.a.boil_skull:0 "[skull_boiler.GetFirstName] ต้มกะโหลกของ[skull_to_boil.GetFirstNamePossessive] เปลี่ยนให้เป็น[court_artifact|E]"
 artifact_rival_skull:0 "กะโหลกของ [skull_to_boil.GetTitledFirstName] ศัตรูคู่อาฆาตของ [ROOT.Char.GetTitledFirstName] ที่ถูกประหารชีวิต ต้มและทำความสะอาดโดย [skull_boiler.GetFirstName] บนหน้าผากสลักถ้อยคำไว้ว่า: "[skull_to_boil.Custom2('InsultAdjective', ROOT.Char)|U] [skull_to_boil.Custom2('InsultNoun', ROOT.Char)]"."
 artifact.7000.t:0 "คู่แข่งคงอยู่ตลอดไป"
 artifact.7000.desc:0 "อา ขอบคุณ[ROOT.Char.GetFaith.HighGodName]ที่ [skull_to_boil.GetFirstName] ตายแล้ว และถูกประหารชีวิตตามคำสั่ง #EMP ของข้า#! ไม่น้อย!\n\nข้าต้องยอมรับว่าข้าจะคิดถึงการฟังเสียงครวญครางอันน่าสมเพชของ[skull_to_boil.GetHerHis]ในคุกใต้ดินของข้า... บางทีข้าควรเก็บส่วนหนึ่งของ[skull_to_boil.GetHerHim]ไว้ เพื่อที่ข้าจะได้มีบางอย่างไว้สบประมาทขณะพักผ่อนบนบัลลังก์ของข้า?\n\nไม่ใช่ว่า [skull_boiler.GetFirstName] กำลังทำอะไรสำคัญอยู่แล้ว..."
 artifact.7000.a:0 "[skull_boiler.GetFirstNameNoTooltip] ต้มและทำความสะอาดกะโหลกของ[skull_to_boil.GetFirstNamePossessiveNoTooltip]ให้ข้า เดี๋ยวนี้"
 artifact.7000.b:0 "ไม่ ข้า #EMP รอไม่ไหว#! ที่จะลืมทุกอย่างเกี่ยวกับการดำรงอยู่ของ[skull_to_boil.GetFirstNamePossessiveNoTooltip]!"


 artifact.4090.t:0 "วัตถุมงคลในมือ..."
 artifact.4090.desc.antiquarian:0 "นักสะสมโบราณวัตถุของข้า [antiquarian.GetTitledFirstName] ได้เข้ามาหาข้าพร้อมกับความคิด โดยการผนึก [that_artifact.GetName] ของข้าไว้ในด้ามจับของ [this_artifact.GetName] ของข้า ข้าจะใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] มากขึ้นเสมอเมื่อข้าถือมัน\n\n\"ท่านจะได้สัมผัสชิ้นส่วนของ[ROOT.Char.GetFaith.PositiveAfterLife]อย่างแท้จริงทุกครั้งที่ท่านถือ [this_artifact.GetType] ของท่าน\" [antiquarian.GetTitledFirstNameNoTooltip] กล่าวด้วยแววตาแห่งความปีติยินดีทางศาสนาที่เปล่งประกายในดวงตา[antiquarian.GetHerHis]"
 artifact.4090.desc:0 "ขณะที่จ้องมอง [that_artifact.GetName] ของข้าในวันหนึ่ง ข้าก็เกิดแรงบันดาลใจขึ้นมา หากข้าฝังวัตถุมงคลไว้ในด้ามจับของ [this_artifact.GetName] ของข้า ข้าจะใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] มากขึ้นเสมอเมื่อข้าถือมัน"
 artifact.4090.a:0 "ข้าจะใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodName] เสมอ"
 artifact.4090.b:0 "มันคงไม่เหมาะสม"

 artifact.4090.a.tt:0 "วัตถุมงคลและอาวุธรวมกัน"

