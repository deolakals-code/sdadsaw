l_english: 
# Captured prisoner notifications, by Mathilda Bjarnehed
 siege.0002.one_captured.t:1 "เชลยที่ถูกจับได้ในการล้อม"
 siege.0002.several_captured.t:1 "เชลยหลายคนที่ถูกจับได้ในการล้อม"
 siege.0002.one_captured:0 "ท่านจับกุม [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] ได้ระหว่าง[siege|E]ที่ [barony.GetNameNoTier]"
 siege.0002.two_captured:0 "ท่านจับกุม [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] และ [prisoner_2.Custom2('HerHisCharacterIntroduction', SCOPE.sC('holder'))] ได้ระหว่าง[siege|E]ที่ [barony.GetNameNoTier]"
 siege.0002.several_captured:0 "ท่านจับกุม [prisoner_1.Custom2('NamePossessiveCharacterIntroduction', SCOPE.sC('holder'))] และคนอื่นๆ อีก [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] คน ได้ระหว่าง[siege|E]ที่ [barony.GetNameNoTier]"
	
 siege.0003.one_captured.t:1 "ข้าราชสำนักถูกจับกุมในการล้อม"
 siege.0003.several_captured.t:1 "ข้าราชสำนักหลายคนถูกจับกุมในการล้อม"
 siege.0003.one_captured:0 "[prisoner_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกจับกุม"
 siege.0003.two_captured:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)]ของข้า [prisoner_1.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', prisoner_2)]ของข้า [prisoner_2.GetFirstName] ถูกจับกุม"
 siege.0003.several_captured:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)]ของข้า [prisoner_1.GetFirstName] และคนอื่นๆ อีก [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] คน ถูกจับกุม"
 siege.0003.end:0 "โดย [occupant.Custom2('MyCharacterIntroduction', ROOT.Char)] ระหว่าง[siege|E]ที่ [barony.GetNameNoTier]"

 siege.0004.relation_captured.t:0 "[ROOT.Char.Custom2('RelationToMeShort', prisoner_1)|U] ถูกจับเป็นเชลย"
 siege.0004.one_captured:0 "$siege.0003.one_captured$"
 siege.0004.two_captured:0 "$siege.0003.two_captured$"
 siege.0004.several_captured:0 "$siege.0003.several_captured$"
 siege.0004.end:0 "$siege.0003.end$"

 siege.0013.one_killed.t:1 "ข้าราชสำนักถูกสังหารในการล้อม"
 siege.0013.several_killed.t:1 "ข้าราชสำนักหลายคนถูกสังหารในการล้อม"
 siege.0013.one_killed:0 "ข้าราชสำนักของข้า [casualty_1.GetFirstName] ถูกสังหาร"
 siege.0013.two_killed:0 "ข้าราชสำนักของข้า [casualty_1.GetFirstName] และ [casualty_2.GetFirstName] ถูกสังหาร"
 siege.0013.several_killed:0 "[casualty_1.GetFirstName] และข้าราชสำนักคนอื่นๆ ของข้าอีก [ROOT.Var('num_other_relevant_slain_combatants').GetValue|V0] คน ถูกสังหาร"
 siege.0013.end:0 "$siege.0003.end$"

 siege.0014.one_killed.t:1 "[ROOT.Char.Custom2('RelationToMeShort', casualty_1)|U] ถูกสังหารในการล้อม"
 siege.0014.one_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกสังหาร"
 siege.0014.two_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และ [casualty_2.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกสังหาร"
 siege.0014.several_killed.t:0 "ผู้คนถูกสังหารในการล้อม"
 siege.0014.several_killed:0 "[casualty_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และคนอื่นๆ อีก [ROOT.Var('num_other_relevant_slain_combatants').GetValue|V0] คน ถูกสังหาร"
 siege.0014.end:0 "$siege.0013.end$"

 siege.0102.title:0 "การล้อม [barony.GetNameNoTierNoTooltip] พ่ายแพ้"
 siege.0102.message.foe:0 "$siege.0103.message$"
 siege.0102.message.neutral:1 "บัดนี้ที่ดินดังกล่าว[occupied|E]โดย [occupant.Custom2('MyCharacterIntroduction', ROOT.Char)] ใน[war.GetName]"
 siege.0103.title:0 "$siege.0102.title$"
 siege.0103.message:1 "บัดนี้ที่ดินดังกล่าว[occupied|E]โดยศัตรูของข้า [occupant.GetTitledFirstName] ใน[war.GetName]"

 siege.1005.pow_toast.t:1 "จับกุมเชลยคนสำคัญได้"
