 siege.1005.pow_toast.desc.primary:2 "ข้าจับศัตรูของข้า [valuable_prisoner.GetTitledFirstName] เป็นเชลยระหว่างการล้อมที่ [barony.GetNameNoTier]"
 siege.1006.pow_toast.t:2 "เชลยคนสำคัญถูกจับกุม"
 siege.1006.pow_toast.desc:2 "[occupant.GetTitledFirstName] จับ [valuable_prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)] เป็นเชลยหลังการล้อมที่ [barony.GetNameNoTier]"
 siege.1007.pow_toast.t:0 "$siege.1005.pow_toast.t$"
 siege.1007.pow_toast.desc:2 "[occupant.GetTitledFirstName] จับ [valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_siege_defender)] เป็นเชลยหลังการล้อมที่ [barony.GetNameNoTier]"
 siege.1007.pow_toast.desc.primary:2 "[occupant.GetTitledFirstName] จับศัตรูของข้า [valuable_prisoner.GetTitledFirstName] เป็นเชลยหลังการล้อมที่ [barony.GetNameNoTier]"
