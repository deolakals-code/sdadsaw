 death_management.3006.d:0 "$death_management.1006.f$"
 death_management.1006.d:0 "มี [dead_character.GetHouse.GetBaseNameNoTooltip] ให้กังวลน้อยลงหนึ่งคน!"
 death_management.1006.e:0 "ในที่สุด ข้าคิดว่าข้าสามารถทิ้งเรื่องนี้ไว้เบื้องหลังได้แล้ว"
 death_management.1006.f:0 "อย่าได้ข้ามหน้าตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"

