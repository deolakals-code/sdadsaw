l_english: 
 death_management.1000.killed.tt:1 "[dead_character.GetTitledFirstName] ถูกสังหารโดย [killer.GetTitledFirstName]"
 death_management.1000.t:0 "จนกว่าความตายจะพรากเราจากกัน"
 death_management.1000.murder:0 "[dead_character.GetTitledFirstName] ถูกฆาตกรรม!\n\n"
 death_management.1000.plaguestart: "โรคภัยไข้เจ็บยังคงเดินหน้าอย่างน่าสะพรึงกลัวผ่าน [realm.GetNameNoTier] ทำให้ทั้งชาวนาและขุนนางล้มป่วย ความจริงอันโหดร้ายและไม่เลือกหน้านี้แทบจะไม่ปรากฏให้เห็น จนกระทั่งช่วงเวลา เช่นนี้\n\n"
 death_management.1000.plaguespouse: "ข้าทำได้เพียงเฝ้ามองอย่างเงียบงันขณะที่เหล่าแพทย์ถอยห่างจากร่างของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] ของข้า ข้าขยับเข้าไปใกล้ ยื่นมือออกไปจับมือของ [dead_character.GetHerHis] มันยังคงอุ่นอยู่\n\n"
 death_management.1000.like:0 "หัวใจจะทนความเจ็บปวด เช่นนี้ได้อย่างไรโดยไม่แตกสลาย? มันเป็นไปไม่ได้! แต่ถึงกระนั้น ข้าก็ยังอยู่ที่นี่ หัวใจของข้ายังคงเต้นต่อไป ในขณะที่หัวใจของท่านเงียบสงัดไปแล้ว โอ้ [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] ของข้า ชีวิตคงไม่เหมือนเดิมหากไม่มีท่าน"
 death_management.1000.neutral:0 "[dead_character.GetFirstName] ที่รักของข้า ข้าอาจไม่ได้รักท่าน แต่ข้ารู้สึกถึงการจากไปของท่านอย่างรุนแรงกว่าที่ข้าเคยคิดไว้ ท่านอยู่ตรงนั้นเสมอ สหายคู่ใจของข้า ข้าเคยเห็นท่านเป็นของตายหรือไม่? มีหลายสิ่งที่ข้ายังไม่ได้พูด..."
 death_management.1000.dislike:0 "[dead_character.GetFirstName|U], ขณะที่ท่านหายใจเฮือกสุดท้าย ความโล่งใจก็ถาโถมเข้ามาหาข้า บางทีข้าควรจะละอายใจ แต่ความจริงแล้วไม่มีความรักใด ๆ หลงเหลืออยู่ระหว่างเรา ในที่สุด ข้าก็เป็นอิสระที่จะเริ่มต้นชีวิตใหม่!"
 death_management.1000.murder_wedding:0 "อา ช่างเป็นการตายที่ไม่คาดฝันโดยสิ้นเชิง ไม่ได้วางแผนไว้เลย ไม่มีใครคาดคิด!"
 death_management.1000.a:0 "อย่างน้อยความทรงจำก็ยังคงอยู่"
 death_management.1000.b:0 "ข้าหวังว่าท่านจะพบความสงบ, [dead_character.GetFirstNameNoTooltip]"
 death_management.1000.c:0 "ไม่เร็วไปสักวัน!"
 death_management.1000.tt:1 "คู่สมรสของท่าน, [dead_character.GetTitledFirstName], ได้ [dead_character.GetDeathReasonHideKiller]"

 death_management.1001.t:0 "การมีชีวิตอยู่ยืนยาวกว่าลูก"
 death_management.1001.murder:0 "[dead_character.GetTitledFirstName] ถูกฆาตกรรม!\n\n"
 death_management.1001.tt:1 "[THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] ของท่าน, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]"
 death_management.1001.plaguechild: "ท้องของข้าบิดเกร็งด้วยความทรมานเงียบ ๆ ขณะที่ร่างของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] [dead_character.GetFirstName] ของข้าถูกหามผ่านไป เหล่าแพทย์และผู้รักษาทำงานตั้งแต่เช้าจรดค่ำเพื่อช่วย [dead_character.GetHerHim] แต่ใบหน้าอันเคร่งขรึมของพวกเขาบอกทุกคนได้มากกว่าที่พวกเขาจะพูด\n\nช่างเยาว์วัย ช่างเปี่ยมไปด้วยความหวัง ยังมีอีกมากมายที่ต้องตาย เช่นนี้\n\nขอ [ROOT.Char.GetFaith.HighGodName] โปรดช่วยเราด้วย"
 death_management.1001.child:0 "ข้ามีความหวังมากมายสำหรับเจ้า ลูกรักที่แสนหวานของข้า ทุกสิ่งที่เจ้าจะได้เรียนรู้ ประสบ และทำ มีความเป็นไปได้มากมาย ชีวิตทั้งชีวิตให้ใช้ บางทีเจ้าอาจจะมีลูกของตัวเองในวันหนึ่ง แต่ตอนนี้ สิ่งเหล่านั้นจะไม่มีวันเกิดขึ้น..."
 death_management.1001.like:0 "โอ้ [ROOT.Char.GetFaith.HighGodName], ท่านทำ เช่นนี้กับ [dead_character.GetFirstName] ได้อย่างไร? หากข้าทำบาป เหตุใดท่านจึงไม่ลงโทษข้าแทน? [dead_character.GetSheHe|U] ไร้เดียงสา [dead_character.Custom('GetDaughterSon')] ที่สมบูรณ์แบบของข้า! ชีวิตยังมีอะไรอีกมากมายรอ [dead_character.GetHerHim] อยู่..."
 death_management.1001.neutral:0 "ข้าคิดว่าข้าแก่เกินกว่าจะประหลาดใจกับความโหดร้ายของโลกนี้แล้ว แต่ข้าไม่เคยคาดคิดว่าจะต้องประสบกับการตายของ [dead_character.Custom('GetDaughterSon')] ของข้าเอง ข้าหวังเพียงว่าตอนนี้ [dead_character.GetSheHe] จะรอดพ้นจากความทุกข์ทรมานที่ข้าต้องทน..."
 death_management.1001.dislike:0 "ไม่ใช่หน้าที่ของ [ROOT.Char.Custom('MotherFather')] หรือที่จะรักลูก ๆ ของ [ROOT.Char.GetHerHis]? แต่ถึงกระนั้น ข้าก็ไม่สามารถร้องไห้ให้กับการจากไปของ [dead_character.GetFirstNamePossessive] ได้ ระหว่างทางข้าคงทำผิดพลาดไป บังคับ [dead_character.GetHerHim] ให้เดินไปในเส้นทางที่ข้าไม่สามารถยอมรับได้ แม้ว่าข้าอาจจะต้องรับผิดชอบต่อสิ่งที่ [dead_character.GetSheHe] กลายเป็น แต่มันก็เป็นอดีตไปแล้ว ในที่สุด"
 death_management.1001.a:0 "[dead_character.GetSheHe|U] ไม่สมควรได้รับสิ่งนี้"
 death_management.1001.c:0 "มันสายเกินไปที่จะเสียใจ"
 death_management.1001.d:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip] ตัวน้อย"

 death_management.1004.t:0 "ความว่างเปล่าที่ทิ้งไว้เบื้องหลัง"
 death_management.1004.desc:0 "มีการปรากฏตัวอยู่บนเตียงของข้า รุนแรงทางกายภาพพอ ๆ กับที่ร่างกายของท่านเคยรู้สึกเมื่อท่านโอบกอดข้าด้วยแขนขาของท่าน แต่ถึงกระนั้น การปรากฏตัวนี้ไม่ใช่ท่าน [dead_character.GetFirstName] แต่เป็นความปรารถนาและความปวดร้าวทั้งหมดที่ท่านทิ้งไว้เบื้องหลัง ในระหว่างวันข้า ทำให้ตัวเองยุ่งอยู่ แต่ที่นี่ ที่ ซึ่งความทรงจำชัดเจนเหลือเกิน ไม่มีทางหนี"
 death_management.1004.a:0 "ความเจ็บปวดนี้จะจางหายไปหรือไม่?"
 death_management.1004.a.tt:1 "คนรักของท่าน, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]"
 death_management.lover.desc:1 "คนรักของท่าน, [dead_character.GetTitledFirstName], เสียชีวิตแล้ว"

 death_management.1005.t:0 "ความทรงจำยังคงอยู่"
 death_management.1005.desc:0 "โอ้ [dead_character.GetFirstName] หากท่านยังอยู่กับข้า ข้ารู้ว่าท่านจะบอกให้ข้าเข้มแข็ง ว่าสิ่งต่าง ๆ จะดีขึ้น และท่านก็จะพูดถูก เหมือนที่ท่านพูดถูกเสมอ แต่ก่อนอื่นข้าต้องสาปแช่งและร้องไห้ ข้าจะไม่ทำได้อย่างไรเมื่อท่านจากโลกนี้ไปแล้ว?"
 death_management.1005.desc.ritual_best_friend:0 "[dead_character.GetFirstName] ตายแล้ว! สหายที่ดีที่สุดและแท้จริงที่สุดของข้าถูกพรากไป ถูกโอบกอดอันเย็นเยียบของ [ROOT.Char.GetFaith.DeathDeityName] พรากไปก่อนเวลาอันควรของ [dead_character.GetHerHis] ข้าร้องไห้ ข้าคร่ำครวญ ข้าทึ้งผมและเสื้อผ้าของข้า แต่ข้ารู้ว่าข้าจะไม่มีวันได้เห็น [dead_character.GetHerHim] อีก\n\nข้า... ข้าจะดำเนินชีวิตต่อไปได้อย่างไร?\n\n[dead_character.GetFirstNameNoTooltip], [dead_character.GetFirstNameNoTooltip] ที่รัก ที่แสนหวาน คงอยากให้ข้าทำ เช่นนั้น และข้าต้องหวังว่าความทรงจำของ [dead_character.GetHerHis] จะค้ำจุนข้าผ่านช่วงเวลาอันมืดมนเหล่านี้ได้ แต่ชีวิตดูเหมือนเทียนไขที่ไร้เปลวไฟหากไม่มี [dead_character.GetHerHim]"
 death_management.1005.a:0 "ท่านจะไม่มีวันถูกลืม สหายเก่า"
 death_management.1005.a.tt:3 "สหายของท่าน, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]"
 death_management.friend.desc:4 "สหายของท่าน, [dead_character.GetTitledFirstName], เสียชีวิตแล้ว"

 death_management.1007.t:0 "ชะตาพลิกผัน"
 death_management.1007.start_murder:1 "[dead_character.GetTitledFirstName] ถูกฆาตกรรม!"
 death_management.1007.start:3 "วันนี้ ด้วยการจากไปของ [dead_character.GetTitledFirstName] อนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้เปลี่ยนเส้นทางไปแล้ว"
 death_management.1007.same_or_higher_tier:0 "เราจะไม่มีวันรู้ว่ารัชสมัยของ [dead_character.GetHerHis] จะรวมแผ่นดินของเราเข้าด้วยกันหรือไม่"
 death_management.1007.mytitle:2 "เราจะไม่มีวันรู้ว่า [dead_character.GetSheHe] จะกลายเป็น [ROOT.Char.GetTitleTierName] แบบใด"
 death_management.1007.ruler:1 "เราจะไม่มีวันรู้ว่า [dead_character.GetSheHe] จะกลายเป็นผู้ปกครองแบบใด"
 death_management.1007.end:4 "หรือว่าการตายของ [dead_character.GetHerHis] เป็นพรหรือคำสาปต่อ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] นี้"
 death_management.1007.a:0 "เรื่องราวหนึ่งจบลง และอีกเรื่องราวหนึ่งเริ่มต้นขึ้น"
 death_management.1007.a.tt:1 "ทายาทของท่าน, [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]"

 death_management.1006.t:0 "คำสาปที่คลคลายลง"
 death_management.1006.desc:0 "ความพลิกผันแห่งโชคชะตาใช่จะเข้าข้างข้าเสมอไป – [ROOT.Char.GetFaith.HighGodName] ทรงทราบดีว่าข้าต้องคำสาปตั้งแต่วันที่ได้พบกับ [dead_character.GetTitledFirstName]\n\nทว่าวันนี้ คำสาปนั้นได้ถูกลบล้างแล้ว! โชคชะตาได้แย้มยิ้มให้ข้า และนำพา [dead_character.Custom2('InsultNoun', ROOT.Char)] [dead_character.Custom2('InsultAdjective', ROOT.Char)] ผู้นั้นไปสู่หลุมศพของ[dead_character.GetHerHis]เสียที!"
 death_management.1006.a.tt:1 "[rival|E] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReasonHideKiller]"

 death_management.parent.desc:2 "[dead_character.Custom('MotherFather')] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.sibling.desc:2 "[dead_character.Custom('SisterBrother')] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.betrothed.desc:2 "[betrothed|E] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.liege_councillor.desc:2 "[councillor|E] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.liege.desc:2 "[vassal|E] ของท่าน, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.pinned.desc:2 "บุคคลที่คุณสนใจ, [dead_character.GetFullName], [dead_character.GetDeathReason]"

 death_management.elder.desc: "[elder|E] ของท่าน [deceased_elder.GetFullName] [deceased_elder.GetDeathReason]"

 death_management.1008.desc:0 "[dead_character.GetTitledFirstName], คู่สมรสของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_of_dead_character'))] [spouse_of_dead_character.GetFirstName] ของข้า, ได้ถึงแก่กรรมแล้ว แผนการที่สร้างขึ้นอย่างระมัดระวังทั้งหมดถูกบดขยี้ด้วยแรงกระตุ้นอันไม่แน่นอนของ [ROOT.Char.GetFaith.DeathDeityNamePossessive] แม้ว่าการร้องเรียน เช่นนั้นอาจดูเล็กน้อยและไม่มีสาระเมื่อเทียบกับความเจ็บปวดของครอบครัวของ [dead_character.GetHerHis]..."
 death_management.1008.a:0 "หลับให้สบาย"
 death_management.1008.a.tt:1 "คู่สมรสของ [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]"
 death_management.spouse_child.desc:1 "คู่สมรสของทายาทของท่าน [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]"

 death_management.1009.t:0 "โศกนาฏกรรมที่ไม่คาดฝัน"
 death_management.1009.desc:1 "[dead_character.GetTitledFirstName], คู่หมั้นของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('betrothed_of_dead_character'))] [betrothed_of_dead_character.GetFirstName] ของข้า, ได้ถึงแก่กรรมแล้ว แผนการที่สร้างขึ้นอย่างระมัดระวังทั้งหมดถูกบดขยี้ด้วยแรงกระตุ้นอันไม่แน่นอนของ [ROOT.Char.GetFaith.DeathDeityNamePossessive] แม้ว่าการร้องเรียน เช่นนั้นอาจดูเล็กน้อยและไม่มีสาระเมื่อเทียบกับความเจ็บปวดของครอบครัวของ [dead_character.GetHerHis]..."
 death_management.1009.a:0 "หลับให้สบายนะ เจ้าตัวน้อย"
 death_management.1009.a.tt:0 "คู่หมั้นของ [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], ได้ [THIS.Char.Custom('DiedHouse_arrest')] และข้อตกลงการ แต่งงานถือเป็นโมฆะ"
 death_management.betrothed_child.desc:2 "คู่หมั้นของ [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]"

 death_management.1010.t:0 "ไม่มีบทเรียนอีกต่อไป"
 death_management.1010.murderer:0 "ขณะที่ข่าวการจากไปของ [dead_character.GetTitledFirstName] แพร่กระจายไปทั่วห้องโถง ข้าต้องพยายามควบคุมสีหน้าของตนเอง\n\nจนกระทั่งข้าอยู่ในรถม้าที่มุ่งหน้ากลับบ้านนั่นแหละที่ข้าตระหนักได้อย่างแท้จริง... [dead_character.GetSheHe] จากไปแล้ว"
 death_management.1010.under_12:0 "มันค่อนข้างเลือนลาง — ว่าทุกอย่างเปลี่ยนไปอย่างไร จากการที่ [dead_character.GetTitledFirstName] ไม่มาเรียกข้าเข้าเรียนในเช้าวันหนึ่ง จนถึงตอนนี้ ที่นั่งอยู่ในรถม้าผูกติดกับบ้าน\n\nเมื่อข้าถามว่าทำไม [dead_character.GetFirstName] ถึงไม่มาส่งข้า เสียงพึมพำรอบตัวข้าค่อย ๆ ทำให้ชัดเจนว่าข้าจะไม่ได้เห็น [dead_character.GetHerHim] อีกแล้ว"
 death_management.1010.12_or_over:0 "พวกเขานำข่าวมาให้ข้าขณะที่ข้ากำลังเตรียมตัวสำหรับบทเรียน และข้าก็ไม่รู้ว่าจะทำอย่างไรกับตัวเองอีกต่อไป อาจารย์ของข้า, [dead_character.GetTitledFirstName], ได้ถึงแก่กรรมแล้ว\n\nแม้ขณะที่ข้าเดินทางกลับบ้าน ก็ยังรู้สึกแปลกที่ข้าจะไม่มีวันได้เห็น [dead_character.GetHerHim] อีก"
 death_management.1010.under_12_liked_educator:0 "ข้าหวังว่า [dead_character.GetSheHe] จะกล่าวคำอำลา อย่างน้อยก็สักคำ"
 death_management.1010.under_12_disliked_educator:0 "ข้าอยากได้อาจารย์คนใหม่อยู่แล้ว!"
 death_management.1010.over_12_liked_educator:0 "ท่านสอนข้ามากมาย, [dead_character.GetFirstName]"
 death_management.1010.over_12_disliked_educator:0 "ไปให้พ้น ๆ เสียทีเถอะ"
 death_management.1010.a.tt:1 "ด้วยการตายของ [dead_character.GetTitledFirstName] ท่านจึงไม่ได้รับการสอนอีกต่อไป"

 death_management.educator.desc:2 "อาจารย์ของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward_of_dead_character'))] ของท่าน, [ward_of_dead_character.GetTitledFirstNamePossessive], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]"

 death_management.2000.t:0 "จนกว่า [prison_holder.GetFirstNameNoTooltip] จะพรากเราจากกัน"
 death_management.2000.t.root_killer:0 "จนกว่าข้าจะพรากเราจากกัน"
 death_management.2000.t.no_killer:0 "ถูกพรากไป"
 death_management.2000.murderer:0 "โอ้ [dead_character.GetFirstName], ชีวิตอาจจะยืนยาวกว่านี้ด้วยกัน แต่ก็ต้องเป็น เช่นนี้\n\nข้าไม่ยินดีที่มีเลือดของท่านเปื้อนมือ แต่ข้ารู้ว่าหากท่านพูดได้ ท่านคงอยากให้ข้าก้าวต่อไปและพบความสุข"
 death_management.2000.like:0 "หัวใจจะทนความเจ็บปวด เช่นนี้ได้อย่างไรโดยไม่แตกสลาย? มันเป็นไปไม่ได้! แต่ถึงกระนั้น ข้าก็ยังอยู่ที่นี่ หัวใจของข้ายังคงเต้นต่อไป ในขณะที่หัวใจของท่านเงียบสงัดไปแล้ว\n\nโอ้ [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] ของข้า"
 death_management.2000.like_end_killer:0 "ข้าไม่สามารถลบภาพ [prison_holder.GetTitledFirstName] สังหารท่านออกจากหัวได้"
 death_management.2000.like_end:0 "ข้าไม่สามารถลบภาพท่านที่ซูบผอมลง ถูกขังอยู่ในคุกใต้ดินของ [prison_holder.GetTitledFirstNamePossessive] ออกจากหัวได้"
 death_management.2000.neutral:0 "[dead_character.GetFirstName] ที่รักของข้า ข้าอาจไม่ได้รักท่าน แต่ข้ารู้สึกถึงการจากไปของท่านอย่างรุนแรงกว่าที่ข้าเคยคิดไว้ ท่านอยู่ตรงนั้นเสมอ สหายคู่ใจของข้า"
 death_management.2000.neutral_end_killer:0 "ไม่น่าเชื่อว่า [prison_holder.GetTitledFirstName] จะพรากท่านไปจากข้าด้วยวิธีที่รุนแรง เช่นนี้..."
 death_management.2000.neutral_end:0 "ไม่น่าเชื่อว่าท่านจะสิ้นใจในคุกใต้ดินของ [prison_holder.GetTitledFirstNamePossessive]..."
 death_management.2000.dislike:0 "[dead_character.GetWifeHusband|U], ขณะที่ท่านหายใจเฮือกสุดท้าย ความโล่งใจก็ถาโถมเข้ามาหาข้าพร้อมกับความโกรธ บางทีข้าควรจะละอายใจ แต่ความจริงแล้วไม่มีความรักใด ๆ หลงเหลืออยู่ระหว่างเรา"
 death_management.2000.dislike_end_killer:0 "ทว่า ความน่าอดสูที่เจ้าต้องมาสิ้นชีพด้วยน้ำมือของ [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] อย่าง [prison_holder.GetTitledFirstName]..."
 death_management.2000.dislike_end_unknown_killer:1 "อย่างไรก็ตาม การดูหมิ่นที่ท่านต้องตายด้วยน้ำมือของฆาตกร..."
 death_management.2000.dislike_end_no_killer:0 "$death_management.2000.dislike_end$"
 death_management.2000.dislike_end:0 "ทว่า ความน่าอดสูที่เจ้าต้องมาสิ้นชีพในคุกใต้ดินของ [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] อย่าง [prison_holder.GetFirstName]..."
 death_management.2000.a:0 "ที่ [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] เช่นนั้น พรากเจ้าไปจากข้าได้..."
 death_management.2000.b:0 "มันเป็นอาชญากรรมที่ไม่อาจให้อภัยได้!"
 death_management.2000.c:0 "มันไม่อาจให้อภัยได้!"
 death_management.2000.d:0 "ช่างเป็นการจากไปที่..."
 death_management.2000.tt:1 "คู่สมรสของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของ [prison_holder.GetTitledFirstName]"

 death_management.2007.t:0 "ชะตาพลิกผัน"
 death_management.2007.start:1 "วันนี้ ด้วยการจากไปของ [dead_character.GetTitledFirstName] ในคุกใต้ดินของ [prison_holder.GetTitledFirstName] อนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้เปลี่ยนเส้นทางไปแล้ว เราจะไม่มีวันรู้ว่า"
 death_management.2007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
 death_management.2007.ruler:0 "ผู้ปกครอง"
 death_management.2007.end:1 "[dead_character.GetSheHe] จะกลายเป็นแบบใด หรือว่าการตายของ [dead_character.GetHerHis] เป็นพรหรือคำสาปต่อ [ROOT.Char.GetPrimaryTitle.GetType.GetName] นี้\n\nสิ่งที่ข้ารู้คือ [prison_holder.GetFirstName] จะต้องชดใช้ความผิดของ [prison_holder.GetHerHis]"
 death_management.2007.a:0 "[prison_holder.GetSheHe|U] ได้กระทำการอันไม่อาจให้อภัยได้"
 death_management.2007.a.tt:1 "ทายาทของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของ [prison_holder.GetTitledFirstName]"
 death_management.2007.a.new_heir.tt:1 "[new_heir.GetTitledFirstName] คือทายาทคนใหม่ของท่าน"

 death_management.2001.t:0 "การมีชีวิตอยู่ยืนยาวกว่าลูก"
 death_management.2001.opening:1 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] ของข้า, [dead_character.GetTitledFirstName], เสียชีวิตแล้ว!\n\n"
 death_management.2001.child:0 "ข้ามีความหวังมากมายสำหรับเจ้า ลูกรักที่แสนหวานของข้า ทุกสิ่งที่เจ้าจะได้เรียนรู้ ประสบ และทำ มีความเป็นไปได้มากมาย ชีวิตทั้งชีวิตให้ใช้ บางทีเจ้าอาจจะมีลูกของตัวเองในวันหนึ่ง แต่ตอนนี้ สิ่งเหล่านั้นจะไม่มีวันเกิดขึ้น ทั้งหมดเป็น เพราะ [prison_holder.GetTitledFirstName]..."
 death_management.2001.like:0 "โอ้ [ROOT.Char.GetFaith.HighGodName], ท่านปล่อยให้ [prison_holder.GetTitledFirstName] ทำ เช่นนี้กับ [dead_character.GetFirstName] ได้อย่างไร?"
 death_management.2001.like_end_killer:0 "ข้าภาวนาให้ไอ้ [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] จงอย่าได้พบกับความสงบ, สันติ, หรือ #EMP รัก#! ใดเลย, เพื่อเป็นการชดใช้ที่มันพรากชีวิต[dead_character.Custom('GetDaughterSon')]ของข้าไป"
 death_management.2001.like_end:0 "ข้าภาวนาให้ไอ้ [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] จงอย่าได้พบกับความสงบ, สันติ, หรือ #EMP รัก#! ใดเลย, เพื่อเป็นการชดใช้ที่มันปล่อยให้[dead_character.Custom('GetDaughterSon')]ของข้าต้องสิ้นใจอย่างอเนจอนาถในคุกใต้ดินของ[prison_holder.GetHerHis]"
 death_management.2001.neutral:0 "ข้าคิดว่าข้าแก่เกินกว่าจะประหลาดใจกับความโหดร้ายของโลกนี้แล้ว แต่ข้าไม่เคยคาดคิดว่าจะต้องประสบกับการตายของ [dead_character.Custom('GetDaughterSon')] ของข้าเองด้วยน้ำมือของ [prison_holder.GetTitledFirstName] ข้าหวังเพียงว่าตอนนี้ [dead_character.GetSheHe] จะรอดพ้นจากความทุกข์ทรมานที่ [dead_character.GetSheHe] ต้องทน..."
 death_management.2001.dislike:0 "ไม่ใช่หน้าที่ของ [ROOT.Char.Custom('MotherFather')] หรือที่จะรักลูก ๆ ของ [ROOT.Char.GetHerHis]? แต่ถึงกระนั้น ข้าก็ไม่สามารถร้องไห้ให้กับการจากไปของ [dead_character.GetFirstNamePossessive] ได้"
 death_management.2001.dislike_end_killer:0 "ข้ารู้สึกเพียงความโกรธต่อการดูหมิ่นที่ [prison_holder.GetTitleTierName] ได้มอบให้แก่ข้าโดยการให้ [dead_character.Custom('GetDaughterSon')] ของข้าต้องตายด้วยน้ำมือของ [prison_holder.GetHerHis]"
 death_management.2001.dislike_end:0 "ข้ารู้สึกเพียงความโกรธต่อการดูหมิ่นที่ [prison_holder.GetTitleTierName] ได้มอบให้แก่ข้าโดยการให้ [dead_character.Custom('GetDaughterSon')] ของข้าต้องตายในคุกใต้ดินของ [prison_holder.GetHerHis]"
 death_management.2001.a:0 "[dead_character.GetSheHe|U] ไม่สมควรได้รับสิ่งนี้"
 death_management.2001.c:0 "มันสายเกินไปที่จะเสียใจ"
 death_management.2001.d:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip] ตัวน้อย"
 death_management.2001.tt:1 "[dead_character.Custom('GetDaughterSon')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของ [prison_holder.GetTitledFirstName]"

 death_management.2002.t:0 "การพักผ่อนอันยาวนาน"
 death_management.2002.child:0 "[dead_character.Custom('MotherFather')|U]? ทำไมท่านถึงจากไป? พวกเขาบอกว่าท่านช่วยไม่ได้ นั่นคือ [prison_holder.GetTitledFirstName] เป็นเหตุผลที่ท่านต้องจากไป แต่ทำไม [prison_holder.GetSheHe] ถึงพรากท่านไปจากข้าล่ะ [dead_character.Custom('MotherFather')]?"
 death_management.2002.like:0 "โอ้ [dead_character.Custom('MotherFather')] ข้าอาจจะโตแล้ว แต่ข้าก็ยังเป็นลูกของท่านเสมอ ข้าจะทำอย่างไรตอนนี้ เมื่อ [prison_holder.GetTitledFirstName] ได้พรากท่านไปจากข้า และจากโลกนี้? ใครจะกอดข้า ในขณะที่น้ำตาบดบังดวงตาของข้า?"
 death_management.2002.neutral:0 "เราอาจจะไม่สนิทกัน [dead_character.GetFirstName] แต่ท่านก็ยังคงเป็น [dead_character.Custom('MotherFather')] ของข้าเสมอ ไม่น่าเชื่อว่า [prison_holder.GetTitledFirstName] จะพรากท่านไปจากข้าด้วยวิธีที่โหดร้าย เช่นนี้ ทิ้งคำถามมากมายไว้ให้ข้า อะไรดลใจให้ [prison_holder.GetTitleTierName] ก่ออาชญากรรมอันชั่วร้าย เช่นนี้? ข้าเคยเห็นท่านเป็นของตายหรือไม่? [dead_character.Custom('MotherFather')|U]... ท่านรักข้าจริง ๆ หรือ?"
 death_management.2002.dislike:0 "เลือดของท่านอาจไหลเวียนอยู่ในเส้นเลือดของข้า แต่ท่านไม่ใช่ [dead_character.Custom('MotherFather')] ที่แท้จริงของข้า หากการตายของท่านด้วยน้ำมือของ [prison_holder.GetTitledFirstName] ไม่ใช่การดูหมิ่น เช่นนี้ ข้าคงไม่รู้สึกอะไรเลยนอกจากความโล่งใจเมื่อท่านจากไป"
 death_management.2002.a:0 "ข้าจะรักท่านเสมอ [dead_character.Custom('MotherFather')]"
 death_management.2002.b:0 "ข้าคงไม่มีวันรู้..."
 death_management.2002.c:0 "ข้าจะ ทำให้แน่ใจว่า [prison_holder.GetSheHe] ต้องชดใช้"
 death_management.2002.d:0 "ข้า... ข้าต้องการ [dead_character.Custom('MotherFather')] ของข้า!"
 death_management.2002.tt:1 "[dead_character.Custom('MotherFather')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของ [prison_holder.GetTitledFirstName]"

 death_management.2008.t:0 "ทุกสิ่งที่อาจเป็นไปได้"
 death_management.2008.desc.like:0 "ข้าเริ่มจินตนาการถึงอนาคตของ [dead_character.GetTitledFirstNamePossessive] และข้า — สิ่งที่เราจะประสบความสำเร็จร่วมกันและครอบครัวที่เราจะสร้างขึ้น"
 death_management.2008.like_end_killer:0 "ความฝันเหล่านั้นพังทลายลง เพราะ [prison_holder.GetTitledFirstName] ผู้ ซึ่งฆาตกรรมคู่หมั้นของข้า จบความฝันก่อนที่มันจะเริ่มต้น"
 death_management.2008.like_end:0 "ความฝันเหล่านั้นพังทลายลง เพราะ [prison_holder.GetTitledFirstName] ผู้ ซึ่งปล่อยให้คู่หมั้นของข้าตายในคุกใต้ดินของ [prison_holder.GetHerHis]"
 death_management.2008.dislike_killer:0 "เมื่อข้าได้รับแจ้งข่าวการตายของคู่หมั้น [dead_character.GetTitledFirstName] ด้วยน้ำมือของ [prison_holder.GetTitledFirstName] ข้าปฏิเสธไม่ได้ว่าข้ารู้สึกโล่งใจ แน่นอน ข้ายังคงรู้สึกโกรธต่อ [prison_holder.GetTitleTierName] ที่สังหารชีวิตคู่หมั้นของข้าด้วยวิธีที่รุนแรง เช่นนี้ แต่ข้าดีใจที่ไม่ต้อง แต่งงานกับ [dead_character.GetHerHim] แล้ว"
 death_management.2008.dislike:0 "เมื่อข้าได้รับแจ้งข่าวการตายของคู่หมั้น [dead_character.GetTitledFirstName] ในคุกใต้ดินของ [prison_holder.GetTitledFirstName] ข้าปฏิเสธไม่ได้ว่าข้ารู้สึกโล่งใจ แน่นอน ข้ายังคงรู้สึกโกรธต่อ [prison_holder.GetTitleTierName] ที่ปล่อยให้คู่หมั้นของข้าตายในการดูแลของ [prison_holder.GetHerHis] แต่ข้าดีใจที่ไม่ต้อง แต่งงานกับ [dead_character.GetHerHim] แล้ว"
 death_management.2008.desc.neutral:0 "นับตั้งแต่การหมั้นหมายของข้ากับ [dead_character.GetTitledFirstName] เป็นทางการ ข้าก็ประสบทั้งความตื่นเต้นและความกลัวเมื่อนึกถึงการ แต่งงานที่กำลังจะมาถึง ตอนนี้ที่ [prison_holder.GetTitledFirstName] ได้ ทำให้คู่หมั้นของข้าเสียชีวิต ข้าคิดถึง [dead_character.GetHerHim] แม้ว่าจะไม่เคยรู้จัก [dead_character.GetHerHim] จริง ๆ ก็ตาม ใครจะรู้ว่าเราอาจจะมีอะไรร่วมกันได้บ้าง?"
 death_management.2008.a.tt:1 "คู่หมั้นของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของ [prison_holder.GetTitledFirstName] และข้อตกลงการ แต่งงานถือเป็นโมฆะ"
 death_management.2008.a:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip]"
 death_management.2008.b:0 "เราข้ามไปที่ #EMP จนกว่าความตายจะพรากเราจากกัน#! เลย!"

 death_management.3000.t:0 "จนกว่าข้าจะพรากเราจากกัน"
 death_management.3000.like:0 "โอ้ [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] ของข้า ไม่น่าเชื่อว่าท่านจะจากไปในคุกใต้ดินของข้า... ข้าสงสัยว่า [dead_character.GetSheHe] จะเชื่อข้าหรือไม่หากข้าบอก [dead_character.GetHerHim] ว่าข้ายังคงรัก [dead_character.GetHerHim] แม้กระทั่งตอนนี้"
 death_management.3000.neutral:0 "[dead_character.GetFirstName] ที่รักของข้า ข้าอาจไม่ได้รักท่าน และข้าอาจเป็นสาเหตุของการตายของท่าน แต่ข้ารู้สึกถึงการจากไปของท่านอย่างรุนแรงกว่าที่ข้าเคยคิดไว้ ท่านอยู่ตรงนั้นเสมอ สหายคู่ใจของข้า ไม่น่าเชื่อว่าคุกใต้ดินของข้าจะเป็นที่ตายของท่าน..."
 death_management.3000.dislike:0 "[dead_character.GetWifeHusband] ผู้ล่วงลับที่รัก ความโล่งใจถาโถมเข้ามาหาข้าขณะที่ท่านหายใจเฮือกสุดท้ายในคุกใต้ดินของข้า บางทีข้าควรจะละอายใจ แต่ความจริงแล้วไม่มีความรักใด ๆ หลงเหลืออยู่ระหว่างเรา"
 death_management.3000.a:0 "ขอให้ [dead_character.GetSheHe] ไปสู่สุคติ"
 death_management.3000.b:0 "ใครจะเดาได้?"
 death_management.3000.c:0 "ไปให้พ้น ๆ เสียที!"
 death_management.3000.tt:1 "คู่สมรสของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของท่าน"

 death_management.3007.t:0 "ชะตาพลิกผัน"
 death_management.3007.start:1 "วันนี้ ด้วยการจากไปของ [dead_character.GetTitledFirstName] ในคุกใต้ดินของข้า อนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้เปลี่ยนเส้นทางไปแล้ว เราจะไม่มีวันรู้ว่า"
 death_management.3007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
 death_management.3007.ruler:0 "ผู้ปกครอง"
 death_management.3007.end:1 "[dead_character.GetSheHe] จะกลายเป็นแบบใด หรือว่าการตายของ [dead_character.GetHerHis] เป็นพรหรือคำสาปต่อ [ROOT.Char.GetPrimaryTitle.GetType.GetName] นี้\n\nสิ่งที่ข้ารู้คือสิ่งที่ทำไปแล้วก็คือทำไปแล้ว และเรื่องราวของ [dead_character.GetFirstNamePossessive] ได้มาถึงจุดสิ้นสุดแล้ว"
 death_management.3007.a:0 "เรื่องราวหนึ่งจบลง และอีกเรื่องราวหนึ่งเริ่มต้นขึ้น"
 death_management.3007.a.tt:1 "ทายาทของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของท่าน\n[new_heir.GetTitledFirstName] คือทายาทคนใหม่ของท่าน"
 
 death_management.3001.t:0 "การมีชีวิตอยู่ยืนยาวกว่าลูก"
 death_management.3001.tt:1 "[dead_character.Custom('GetDaughterSon')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของท่าน"
 death_management.3001.child:0 "ข้ามีความหวังมากมายสำหรับเจ้า ลูกรักที่แสนหวานของข้า ทุกสิ่งที่เจ้าจะได้เรียนรู้ ประสบ และทำ มีความเป็นไปได้มากมาย ชีวิตทั้งชีวิตให้ใช้ บางทีเจ้าอาจจะมีลูกของตัวเองในวันหนึ่ง แต่ตอนนี้ สิ่งเหล่านั้นจะไม่มีวันเกิดขึ้น ทั้งหมดเป็น เพราะการกระทำของข้า..."
 death_management.3001.like:0 "โอ้ [ROOT.Char.GetFaith.HighGodName], ท่านปล่อยให้ [dead_character.GetFirstName] จากไปได้อย่างไร?\n\nข้าภาวนาให้ [dead_character.GetSheHe] พบความสงบในชีวิตหลังความตาย และขอให้ [ROOT.Char.GetFaith.HighGodName] ทรงอภัยบาปของข้า"
 death_management.3001.neutral:0 "ข้าคิดว่าข้าแก่เกินกว่าจะประหลาดใจกับความโหดร้ายของโลกนี้แล้ว แต่ข้าไม่เคยคาดคิดถึงความเจ็บปวดที่จะเกิดขึ้นจากการประสบกับการตายของ [dead_character.Custom('GetDaughterSon')] ของข้าเอง ข้าหวังเพียงว่าตอนนี้ [dead_character.GetSheHe] จะรอดพ้นจากความทุกข์ทรมานที่ข้าต้องทน..."
 death_management.3001.dislike:0 "ไม่ใช่หน้าที่ของ [ROOT.Char.Custom('MotherFather')] หรือที่จะรักลูก ๆ ของ [ROOT.Char.GetHerHis]? แต่ถึงกระนั้น ข้าก็ไม่สามารถร้องไห้ให้กับการจากไปของ [dead_character.GetFirstNamePossessive] ด้วยน้ำมือของข้าเองได้"
 death_management.3001.a:0 "[dead_character.GetSheHe|U] ไม่สมควรได้รับสิ่งนี้"
 death_management.3001.c:0 "มันสายเกินไปที่จะเสียใจ"
 death_management.3001.d:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip] ตัวน้อย"

 death_management.3002.t:0 "การพักผ่อนอันยาวนาน"
 death_management.3002.child:0 "[dead_character.Custom('MotherFather')|U]? ทำไมท่านถึงจากไป? พวกเขาบอกว่าท่านช่วยไม่ได้ นั่นคือข้าเป็นเหตุผลที่ท่านต้องจากไป แต่นั่นมันไม่สมเหตุสมผลเลย ใช่ไหม [dead_character.Custom('MotherFather')]?"
 death_management.3002.like:0 "โอ้ [dead_character.Custom('MotherFather')] ข้าอาจจะโตแล้ว แต่ข้าก็ยังเป็นลูกของท่านเสมอ ข้าจะทำอย่างไรตอนนี้ เมื่อข้าเป็นสาเหตุให้ท่านจากไป? ใครจะกอดข้า ในขณะที่น้ำตาบดบังดวงตาของข้า?"
 death_management.3002.neutral:0 "เราอาจจะไม่สนิทกัน และข้าอาจเป็นสาเหตุของการตายของท่าน [dead_character.GetFirstName] แต่ท่านก็ยังคงเป็น [dead_character.Custom('MotherFather')] ของข้าเสมอ\n\nขณะที่ท่านจากโลกนี้ไป คำถามนับพันถาโถมเข้ามาในใจข้า ข้าเคยเห็นท่านเป็นของตายหรือไม่? การตายของท่านเป็นความผิดพลาดที่ข้าควรหลีกเลี่ยงหรือไม่? [dead_character.Custom('MotherFather')|U]... ท่านรักข้าจริง ๆ หรือ?"
 death_management.3002.dislike:0 "เลือดของท่านอาจไหลเวียนอยู่ในเส้นเลือดของข้า แต่ท่านไม่ใช่ [dead_character.Custom('MotherFather')] ที่แท้จริงของข้า ข้าไม่รู้สึกอะไรเลยเมื่อท่านจากไปนอกจากความโล่งใจ ไม่แม้ แต่ความรู้สึกผิดที่ได้เป็นสาเหตุ ในที่สุด เงาของท่านก็ไม่คอยหลอกหลอนข้าอีกต่อไป"
 death_management.3002.a:0 "ข้าจะรักท่านเสมอ [dead_character.Custom('MotherFather')]"
 death_management.3002.b:0 "ข้าคงไม่มีวันรู้..."
 death_management.3002.c:0 "ไปให้พ้น ๆ เสียที!"
 death_management.3002.d:0 "ข้า... ข้าต้องการ [dead_character.Custom('MotherFather')] ของข้า!"
 death_management.3002.tt:1 "[dead_character.Custom('MotherFather')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของท่าน"

 death_management.3006.t:0 "การมีชีวิตอยู่ยืนยาวกว่าศัตรูของข้า"
 death_management.3006.desc:1 "เมื่อนายคุกนำข่าวอันน่ายินดีนี้มาแจ้ง ข้าแทบไม่เชื่อหูตนเอง! ศัตรูคู่อาฆาตของข้า, [dead_character.GetTitledFirstName], ในที่สุดมันก็สิ้นใจตายในคุกใต้ดินของข้า\n\nไม่นึกไม่ฝันว่าข้าจะได้อยู่ในโลกที่ปราศจากไอ้ [dead_character.Custom2('InsultNoun', ROOT.Char)] นั่น, และไม่นึกว่าข้าคือผู้อยู่เบื้องหลังเรื่องนี้ ข้าสุขใจเสียจนแทบจะเต้นรำ!"
 death_management.3006.a:0 "บนหลุมศพตื้น ๆ ของ [dead_character.GetHerHis]!"
 death_management.3006.a.tt:2 "[rival|E] ของท่าน [dead_character.GetFirstNameNoTooltip] ตายแล้ว!"

 death_management.3008.t:0 "ทุกสิ่งที่อาจเป็นไปได้"
 death_management.3008.desc.like:0 "ข้าเริ่มจินตนาการถึงอนาคตของ [dead_character.GetTitledFirstNamePossessive] และข้า — สิ่งที่เราจะประสบความสำเร็จร่วมกันและครอบครัวที่เราจะสร้างขึ้น ความฝันเหล่านั้นพังทลายลง เพราะการกระทำของข้าเมื่อข้าปล่อยให้คู่หมั้นของข้าตายในคุกใต้ดินของข้า"
 death_management.3008.desc.dislike:0 "เมื่อข้าได้รับแจ้งข่าวการตายของคู่หมั้น [dead_character.GetTitledFirstName] ในคุกใต้ดินของข้า ข้าปฏิเสธไม่ได้ว่าข้ารู้สึกโล่งใจ ข้าดีใจที่ไม่ต้อง แต่งงานกับ [dead_character.GetHerHim] แล้ว!"
 death_management.3008.desc.neutral:0 "นับตั้งแต่การหมั้นหมายของข้ากับ [dead_character.GetTitledFirstName] เป็นทางการ ข้าก็ประสบทั้งความตื่นเต้นและความกลัวเมื่อนึกถึงการ แต่งงานที่กำลังจะมาถึง ตอนนี้ที่คู่หมั้นของข้าได้ตายในคุกใต้ดินของข้า ข้าคิดถึง [dead_character.GetHerHim] แม้ว่าจะไม่เคยรู้จัก [dead_character.GetHerHim] จริง ๆ ก็ตาม ใครจะรู้ว่าเราอาจจะมีอะไรร่วมกันได้บ้าง?"
 death_management.3008.a.tt:1 "คู่หมั้นของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของท่าน และข้อตกลงการ แต่งงานถือเป็นโมฆะ"
 death_management.3008.a:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip]"
 death_management.3008.b:0 "เราข้ามไปที่ #EMP จนกว่าความตายจะพรากเราจากกัน#! เลย"

 death_management.prisoner.desc:0 "นักโทษของข้า, [dead_character.GetTitledFirstName], ได้เสียชีวิตในคุกใต้ดินของข้า"

 death_management.4000.t:0 "จนกว่าความตายจะพรากเราจากกัน"
 death_management.4000.like_opening:0 "หัวใจจะทนความเจ็บปวด เช่นนี้ได้อย่างไรโดยไม่แตกสลาย? มันเป็นไปไม่ได้! แต่ถึงกระนั้น ข้าก็ยังอยู่ที่นี่ หัวใจของข้ายังคงเต้นต่อไป ในขณะที่หัวใจของท่านเงียบสงัดไปแล้ว\n\n"
 death_management.4000.like_my_prison:0 "โอ้ [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] ของข้า ท่านจะเชื่อข้าหรือไม่หากข้าบอกท่านว่าข้ายังคงรักท่านอยู่? แม้หลังจากทุกสิ่งที่ข้าได้ทำลงไป?"
 death_management.4000.like:0 "โอ้ [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')] ของข้า ข้าไม่สามารถลบภาพท่านที่ซูบผอมลง ถูกขังโดย [house_arrest_holder.GetTitledFirstName] ออกจากหัวได้"
 death_management.4000.neutral_opening:0 "[dead_character.GetFirstName] ที่รักของข้า ข้าอาจไม่ได้รักท่าน แต่ข้ารู้สึกถึงการจากไปของท่านอย่างรุนแรงกว่าที่ข้าเคยคิดไว้\n\n"
 death_management.4000.neutral_my_prison:0 "ข้าหวังว่าท่านจะสามารถให้อภัยบาปของข้าได้ ทั้งสิ่งที่ข้าทำกับท่านและทุกสิ่งที่ข้าไม่ได้พูด"
 death_management.4000.neutral:0 "ท่านอยู่ตรงนั้นเสมอ สหายคู่ใจของข้า ไม่น่าเชื่อว่าท่านจะตายในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName]... มีหลายสิ่งที่ข้ายังไม่ได้พูด!"
 death_management.4000.dislike_my_prison:0 "[dead_character.GetWifeHusband|U], ขณะที่ท่านหายใจเฮือกสุดท้ายในฐานะนักโทษของข้า ความโล่งใจก็ถาโถมเข้ามาหาข้า บางทีข้าควรจะละอายใจ แต่ความจริงแล้วไม่มีความรักใด ๆ หลงเหลืออยู่ระหว่างเรา ในที่สุด ข้าก็เป็นอิสระที่จะเริ่มต้นชีวิตใหม่!"
 death_management.4000.dislike:0 "[dead_character.GetWifeHusband|U], ขณะที่ท่านหายใจเฮือกสุดท้ายในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] ความโล่งใจก็ถาโถมเข้ามาหาข้า บางทีข้าควรจะละอายใจ แต่ความจริงแล้วไม่มีความรักใด ๆ หลงเหลืออยู่ระหว่างเรา ในที่สุด ข้าก็เป็นอิสระที่จะเริ่มต้นชีวิตใหม่!"
 death_management.4000.a:0 "อย่างน้อยความทรงจำก็ยังคงอยู่"
 death_management.4000.b:0 "ข้าหวังว่าท่านจะพบความสงบ, [dead_character.GetFirstNameNoTooltip]"
 death_management.4000.c:0 "ไม่เร็วไปสักวัน!"
 death_management.4000.tt:1 "คู่สมรสของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในการกักบริเวณในบ้าน"

 death_management.4007.t:0 "ชะตาพลิกผัน"
 death_management.4007.start_my_prison:1 "วันนี้ ด้วยการจากไปของนักโทษของข้า [dead_character.GetTitledFirstName] อนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้เปลี่ยนเส้นทางไปแล้ว เราจะไม่มีวันรู้ว่า"
 death_management.4007.start:1 "วันนี้ ด้วยการจากไปของ [dead_character.GetTitledFirstName] ในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] อนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ได้เปลี่ยนเส้นทางไปแล้ว เราจะไม่มีวันรู้ว่า"
 death_management.4007.mytitle:1 "[ROOT.Char.GetTitleTierName]"
 death_management.4007.ruler:0 "ผู้ปกครอง"
 death_management.4007.end_adventurer: "[dead_character.GetSheHe] จะกลายเป็นแบบใด หรือว่าการตายของ [dead_character.GetHerHis] เป็นพรหรือคำสาปสำหรับผู้ติดตามของ [dead_character.GetHerHis]"
 death_management.4007.end:1 "[dead_character.GetSheHe] จะกลายเป็นแบบใด หรือว่าการตายของ [dead_character.GetHerHis] เป็นพรหรือคำสาปต่อ [ROOT.Char.GetPrimaryTitle.GetType.GetName] นี้"
 death_management.4007.end.heir:0 "\n\nความหวังเดียวของข้าคือทายาทคนใหม่ [new_heir.GetTitledFirstName] จะสามารถรับมือกับภารกิจนี้ได้"
 death_management.4007.a:0 "เรื่องราวหนึ่งจบลง และอีกเรื่องราวหนึ่งเริ่มต้นขึ้น"
 death_management.4007.b:0 "ข้าหวังว่าการกระทำของข้าถูกต้องแล้ว"
 death_management.4007.a.tt:1 "ทายาทของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในการกักบริเวณในบ้าน"
 death_management.4007.a.tt.heir:1 "[new_heir.GetTitledFirstName] คือทายาทคนใหม่ของท่าน"

 death_management.4001.t:0 "การมีชีวิตอยู่ยืนยาวกว่าลูก"
 death_management.4001.tt:1 "[dead_character.Custom('GetDaughterSon')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในการกักบริเวณในบ้าน"
 death_management.4001.child_my_prison:0 "โอ้ [dead_character.GetTitledFirstName] ที่แสนหวานของข้า! ข้าหวังว่าข้าตัดสินใจถูกแล้ว ที่บังคับให้เจ้าใช้ชีวิตวันสุดท้ายถูกขังไว้\n\nทุกสิ่งที่เจ้าจะไม่มีวันได้เรียนรู้ ประสบ หรือทำ... "
 death_management.4001.child:0 "โอ้ [dead_character.GetTitledFirstName] ที่รักของข้า! ช่างไร้เดียงสา ช่างเยาว์วัย แต่กลับถูกบังคับให้ใช้ชีวิตวันสุดท้ายในคุกของ [house_arrest_holder.GetTitledFirstNamePossessive]?\n\nโลกนี้ช่างโหดร้ายจริง ๆ... แต่อย่างน้อยตอนนี้ข้ารู้แล้วว่าเจ้าจะไม่มีวันประสบกับความน่าสะพรึงกลัวที่เลวร้ายที่สุดของมัน"
 death_management.4001.like:0 "โอ้ [ROOT.Char.GetFaith.HighGodName], ท่านปล่อยให้ [dead_character.Custom('GetDaughterSon')] [dead_character.GetFirstName] ที่รักของข้าจากไปในคุกของ [house_arrest_holder.GetTitledFirstNamePossessive] ได้อย่างไร? [dead_character.GetSheHe|U] ไร้เดียงสา [dead_character.Custom('GetDaughterSon')] ที่สมบูรณ์แบบของข้า!\n\nข้าภาวนาให้ [dead_character.GetFirstName] พบทั้งความสงบและอิสรภาพในชีวิตหลังความตาย"
 death_management.4001.like_my_prison:0 "โอ้ [ROOT.Char.GetFaith.HighGodName], ท่านปล่อยให้ [dead_character.Custom('GetDaughterSon')] [dead_character.GetFirstName] ที่รักของข้าจากไปได้อย่างไร? ข้าภาวนาให้ [dead_character.GetSheHe] พบทั้งความสงบ และความเข้มแข็งที่จะให้อภัยข้า ในชีวิตหลังความตาย"
 death_management.4001.neutral_opening:0 "ข้าคิดว่าข้าแก่เกินกว่าจะประหลาดใจกับความโหดร้ายของโลกนี้แล้ว แต่ข้าไม่เคยคาดคิดว่าจะต้องประสบกับการตายของ [dead_character.Custom('GetDaughterSon')] ของข้าเอง\n\n"
 death_management.4001.neutral_my_prison:0 "แม้ว่า [dead_character.GetSheHe] จะต้องใช้เวลาช่วงสุดท้ายของ [dead_character.GetHerHis] บนโลกนี้ในฐานะนักโทษของข้า ข้าก็หวังว่าบัดนี้ [dead_character.GetSheHe] จะสามารถพบความสงบได้"
 death_management.4001.neutral:0 "ข้าเจ็บปวดที่ [dead_character.GetSheHe] ต้องใช้เวลาช่วงสุดท้ายของ [dead_character.GetHerHis] บนโลกนี้ในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] แต่ข้าหวังว่าบัดนี้ [dead_character.GetSheHe] จะสามารถพบความสงบได้"
 death_management.4001.dislike_opening:0 "ไม่ใช่หน้าที่ของ [ROOT.Char.Custom('MotherFather')] หรือที่จะรักลูก ๆ ของ [ROOT.Char.GetHerHis]?"
 death_management.4001.dislike_my_prison:0 "แต่ถึงกระนั้น ข้าก็ไม่สามารถร้องไห้ให้กับการจากไปของ [dead_character.GetFirstNamePossessive] ขณะถูกข้าจองจำได้"
 death_management.4001.dislike:0 "แต่ถึงกระนั้น ข้าก็ไม่สามารถร้องไห้ให้กับการจากไปของ [dead_character.GetFirstNamePossessive] ขณะถูก [house_arrest_holder.GetTitledFirstName] จองจำได้"
 death_management.4001.dislike_end:0 "\n\nระหว่างทางข้าคงทำผิดพลาดไป บังคับ [dead_character.Custom('GetDaughterSon')] ของข้าให้เดินไปในเส้นทางที่ข้าไม่สามารถยอมรับได้ แม้ว่าข้าอาจจะต้องรับผิดชอบต่อสิ่งที่ [dead_character.GetSheHe] กลายเป็น แต่มันก็เป็นอดีตไปแล้ว ในที่สุด"
 death_management.4001.a:0 "[dead_character.GetSheHe|U] ไม่สมควรได้รับสิ่งนี้"
 death_management.4001.c:0 "มันสายเกินไปที่จะเสียใจ"
 death_management.4001.d:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip] ตัวน้อย"

 death_management.4002.t:0 "การพักผ่อนอันยาวนาน"
 death_management.4002.child:0 "[dead_character.Custom('MotherFather')|U]? ทำไมท่านถึงจากไป? พวกเขาบอกว่าท่านช่วยไม่ได้ และข้าไม่ควรร้องไห้ เพราะตอนนี้ท่านอยู่ในที่ที่ดีกว่าคุกของ [house_arrest_holder.GetTitledFirstNamePossessive] แล้ว แต่ทำไมข้าถึงไปกับท่านไม่ได้ล่ะ [dead_character.Custom('MotherFather')]? ท่านไม่รักข้าแล้วเหรอ? ท่านเคยบอกว่าจะรักตลอดไป..."
 death_management.4002.like_opening:0 "โอ้ [dead_character.Custom('MotherFather')] ข้าอาจจะโตแล้ว แต่ข้าก็ยังเป็นลูกของท่านเสมอ"
 death_management.4002.like_my_prison:0 "ข้าจะทำอย่างไรตอนนี้ เมื่อท่านจากไปในฐานะนักโทษของข้า? ใครจะกอดข้า ในขณะที่น้ำตาบดบังดวงตาของข้า? ท่านจะให้อภัยข้าหรือไม่?"
 death_management.4002.like:0 "ข้าจะทำอย่างไรตอนนี้ เมื่อท่านจากไปในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstNamePossessive]? ใครจะกอดข้า ในขณะที่น้ำตาบดบังดวงตาของข้า?"
 death_management.4002.neutral_opening:0 "เราอาจจะไม่สนิทกัน [dead_character.GetFirstName] แต่ท่านก็ยังคงเป็น [dead_character.Custom('MotherFather')] ของข้าเสมอ"
 death_management.4002.neutral_my_prison:0 "ไม่น่าเชื่อว่าท่านจะจากไปในฐานะนักโทษของข้า ทิ้งคำถามมากมายไว้ให้ข้า... ข้าเคยเห็นท่านเป็นของตายหรือไม่? ท่านภูมิใจในตัวข้าหรือไม่? [dead_character.Custom('MotherFather')|U]... ท่านรักข้าจริง ๆ หรือ?"
 death_management.4002.neutral:0 "ไม่น่าเชื่อว่าท่านจะจากไปในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] ทิ้งคำถามมากมายไว้ให้ข้า... ข้าเคยเห็นท่านเป็นของตายหรือไม่? ท่านภูมิใจในตัวข้าหรือไม่? [dead_character.Custom('MotherFather')|U]... ท่านรักข้าจริง ๆ หรือ?"
 death_management.4002.dislike_opening:0 "เลือดของท่านอาจไหลเวียนอยู่ในเส้นเลือดของข้า แต่ท่านไม่ใช่ [dead_character.Custom('MotherFather')] ที่แท้จริงของข้า"
 death_management.4002.dislike_my_prison:0 "ข้าไม่รู้สึกอะไรเลยนอกจากความโล่งใจเมื่อท่านจากไปในฐานะนักโทษของข้า ในที่สุด เงาของท่านก็ไม่คอยหลอกหลอนข้าอีกต่อไป"
 death_management.4002.dislike:0 "ข้าไม่รู้สึกอะไรเลยเมื่อท่านจากไปในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] นอกจากความโล่งใจ ในที่สุด เงาของท่านก็ไม่คอยหลอกหลอนข้าอีกต่อไป"
 death_management.4002.a:0 "ข้าจะรักท่านเสมอ [dead_character.Custom('MotherFather')]"
 death_management.4002.b:0 "ข้าคงไม่มีวันรู้..."
 death_management.4002.c:0 "หลับให้สบายนะ [dead_character.Custom('MotherFather')]"
 death_management.4002.d:0 "ข้า... ข้าต้องการ [dead_character.Custom('MotherFather')] ของข้า!"
 death_management.4002.tt:1 "[dead_character.Custom('MotherFather')] ของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในการกักบริเวณในบ้าน"

 death_management.4008.t:0 "ทุกสิ่งที่อาจเป็นไปได้"
 death_management.4008.desc.like_my_prison:0 "แม้จะมีการกระทำของข้า ข้าก็ไม่เคยเกลียด [dead_character.GetTitledFirstName] ข้าถึงกับจินตนาการถึงอนาคตของเราร่วมกันเป็นครั้งคราว — สิ่งที่เราจะประสบความสำเร็จและครอบครัวที่เราจะสร้างขึ้น ความฝันเหล่านั้นพังทลายลงเมื่อข้าได้รับแจ้งว่าคู่หมั้นของข้าได้ตายในฐานะนักโทษของข้า นี่ไม่ใช่สิ่งที่ควรจะเกิดขึ้น!"
 death_management.4008.desc.like:0 "เมื่อข้าได้รับแจ้งข่าวการตายของคู่หมั้น [dead_character.GetTitledFirstName] ในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] ความฝันทั้งหมดของข้าเกี่ยวกับชีวิตกับ [dead_character.GetTitledFirstName] ก็พังทลายลง ตอนนี้ไม่มีสิ่งใดที่ข้าจินตนาการไว้จะเกิดขึ้น ความหวัง ความฝัน และครอบครัวที่เราจะได้สร้าง... หายไปหมดแล้ว"
 death_management.4008.desc.dislike:0 "เมื่อข้าได้รับแจ้งข่าวการตายของคู่หมั้น [dead_character.GetTitledFirstName] ในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] ข้าปฏิเสธไม่ได้ว่าข้ารู้สึกโล่งใจ แน่นอน ข้าไม่มีความสุขที่ [dead_character.GetSheHe] ตาย แต่ข้าดีใจที่ไม่ต้อง แต่งงานกับ [dead_character.GetHerHim] แล้ว ข้าคงจะทุกข์ทรมาน และ 'จนกว่าความตายจะพรากเราจากกัน' มันช่างยาวนานเหลือเกิน..."
 death_management.4008.desc.dislike_my_prison:0 "เมื่อข้าได้รับแจ้งว่าคู่หมั้น [dead_character.GetTitledFirstName] ของข้าได้จากไปในฐานะนักโทษของข้า ข้าปฏิเสธไม่ได้ว่าข้ารู้สึกโล่งใจ แน่นอน ข้าไม่มีความสุขที่ [dead_character.GetSheHe] ตาย แต่ข้าดีใจที่ไม่ต้อง แต่งงานกับ [dead_character.GetHerHim] แล้ว ข้าคงจะทุกข์ทรมาน และ 'จนกว่าความตายจะพรากเราจากกัน' ดูเหมือนจะเป็นแนวคิดที่ห่างไกลเหลือเกิน..."
 death_management.4008.desc.neutral_my_prison:0 "นับตั้งแต่การหมั้นหมายของข้ากับ [dead_character.GetTitledFirstName] เป็นทางการ ข้าก็ประสบทั้งความตื่นเต้นและความกลัวเมื่อนึกถึงการ แต่งงานที่กำลังจะมาถึง ตอนนี้ที่ [dead_character.GetSheHe] ได้จากไปในฐานะนักโทษของข้า ข้าคิดถึง [dead_character.GetHerHim] แม้ว่าจะไม่เคยรู้จัก [dead_character.GetHerHim] จริง ๆ ก็ตาม ใครจะรู้ว่าเราอาจจะมีอะไรร่วมกันได้บ้าง?"
 death_management.4008.desc.neutral:0 "นับตั้งแต่การหมั้นหมายของข้ากับ [dead_character.GetTitledFirstName] เป็นทางการ ข้าก็ประสบทั้งความตื่นเต้นและความกลัวเมื่อนึกถึงการ แต่งงานที่กำลังจะมาถึง ตอนนี้ที่ [dead_character.GetSheHe] ได้จากไปในฐานะนักโทษของ [house_arrest_holder.GetTitledFirstName] ข้าคิดถึง [dead_character.GetHerHim] แม้ว่าจะไม่เคยรู้จัก [dead_character.GetHerHim] จริง ๆ ก็ตาม ใครจะรู้ว่าเราอาจจะมีอะไรร่วมกันได้บ้าง?"
 death_management.4008.a.tt:1 "คู่หมั้นของท่าน, [dead_character.GetTitledFirstName], ได้เสียชีวิตในการกักบริเวณในบ้าน และข้อตกลงการ แต่งงานถือเป็นโมฆะ"
 death_management.4008.a:0 "หลับให้สบายนะ [dead_character.GetFirstNameNoTooltip]"
 death_management.4008.b:0 "เราข้ามไปที่ #EMP จนกว่าความตายจะพรากเราจากกัน#! เลย!"

 death_management.9998.t:0 "รู้ตนเอง: ใกล้ถึงจุดสิ้นสุด"
 death_management.9998.desc:0 "ข้ารู้สึกได้ถึงกระดูกสันหลัง [ROOT.Char.GetFaith.DeathDeityName] จะมาหาข้าในไม่ช้า เหมือนสหายเก่า [ROOT.Char.GetFaith.DeathDeitySheHe] กำลังรอคอยที่จะรับข้าอย่างอดทน"
 death_management.9998.a:0 "ข้าจะตายภายในหนึ่งปี"
 death_management.9998.a.tt:1 "ท่านควรจัดการเรื่องต่าง ๆ ให้เรียบร้อย"
 
 #### Battle Death Events ####
 # Intro 1
 death_management.intro.witnessed:0 "ท่ามกลางความโกลาหลที่ปกคลุม [battle_death_location.GetTerrain.GetNameNoTooltip|l] ของ [battle_death_location.GetNameNoTooltip] ข้าพยายามตั้งสติ"
 death_management.intro.war:0 "ข่าวจาก [battle_death_location.GetTerrain.GetNameNoTooltip|l] ของ [battle_death_location.GetNameNoTooltip] มาถึงในมือของผู้ส่งสารที่เหนื่อยล้าในที่สุด"
 death_management.intro:0 "ความขัดแย้งระหว่าง [battle_death_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] และ [battle_death_leader.GetPrimaryTitle.GetNameNoTierNoTooltip] ไม่ได้ ทำให้ข้าสนใจมากนัก จนกระทั่งบทสรุปการรบที่ [battle_death_location.GetNameNoTooltip] ของสภาข้าปรากฏขึ้น"
 # Intro 2
 death_management.intro.enemy:0 "ข้างหน้าข้า [dead_character.GetFirstName] บุกเข้าหาศัตรู\n\n"
 death_management.intro.friendly:0 "ข้ามสนามรบ ข้าเห็น [dead_character.GetFirstName] กำลังต่อสู้อย่างสิ้นหวัง\n\n"
 death_management.intro.letter.lover:0 "ท้องของข้าปั่นป่วน เต็มไปด้วยความกลัวต่อคนรักของข้า ขณะที่ข้ารับม้วนสาร\n\n$death_management.intro.letter$"
 death_management.intro.letter.spouse:0 "ข้าคว้าเศษกระดาษ สแกนหาข่าวของ [dead_character.GetWifeHusband] ของข้า\n\n$death_management.intro.letter$"
 death_management.intro.letter.family:0 "ข้ารู้ทันทีว่ามีเรื่องเลวร้ายเกิดขึ้นกับ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] ของข้า\n\n$death_management.intro.letter$"
 death_management.intro.letter.friend:0 "ข้าอดไม่ได้ที่จะกังวลเกี่ยวกับชะตากรรมของสหายที่ใกล้ชิดที่สุดของข้า\n\n$death_management.intro.letter$"
 death_management.intro.letter.rival:0 "ไม่รู้ทำไมข้ารู้ แม้กระทั่งก่อนที่จะเปิดมัน ว่ามันมีข่าวดี\n\n$death_management.intro.letter$"
 death_management.intro.letter.heir:0 "ข้าหายใจเข้าลึก ๆ; หลายอย่างขึ้นอยู่กับชะตากรรมของทายาทของข้า\n\n$death_management.intro.letter$"
 death_management.intro.letter:0 "ที่นั่น ท่ามกลางเอกสาร มันอ่านว่า:\n"
 # Death flavor
 death_management.death.witnessed.enemy:0 "[battle_death_leader.Custom('GetRandomEmployedMAA')] ของเราไล่ต้อน [dead_character.GetHerHim] อย่างไม่ลดละ และเห็นได้ชัดว่า [dead_character.GetSheHe] หมดแรงแล้ว ขณะที่ [dead_character.GetWomenMen] คนอื่น ๆ ล้มตายเหมือนใบไม้ร่วงรอบตัว [dead_character.GetHerHim]"
 death_management.death.witnessed.friendly:0 "[battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')] กำลังค่อย ๆ ล้อม [dead_character.GetHerHim] ความเหนื่อยล้าของ [dead_character.GetHerHis] ชัดเจนเกินไป"
 death_management.death.war.enemy:0 "'#EMP เรายืนยันว่า [dead_character.GetTitledFirstName] ถูกสังหารขณะต่อต้าน [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')] อย่างแข็งขัน"
 death_management.death.war.friendly:0 "'#EMP [dead_character.GetTitledFirstName] ผู้กล้าหาญของเราถูกสังหารขณะนำการโจมตีต่อต้าน [battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')]"
 death_management.death.uninvolved:0 "'#EMP เรายืนยันว่า [dead_character.GetTitledFirstName] ถูกสังหารขณะต่อต้าน [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')] อย่างแข็งขัน"
 # Killer
 death_management.killer.witnessed.enemy:0 "ในชั่วพริบตา [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] ของ [battle_death_killer.GetLiege.GetTitledFirstName], บุกไปข้างหน้าอย่างมุ่งมั่น ถือ [battle_death_killer.Custom('signature_weapon')] ของ [battle_death_killer.GetHerHis] ไว้สูง เอาชนะกำลังที่เหลืออยู่ของ [dead_character.GetFirstNameNoTooltip] ได้อย่างง่ายดายและปลิดชีพ "
 death_management.killer.witnessed.friendly:0 "แสงสะท้อนจาก [battle_death_killer.Custom('signature_weapon')] จับตาข้าทันที และข้าเฝ้าดูขณะที่ [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] ของ [battle_death_killer.GetLiege.GetTitledFirstName], ฟาดฟันอย่างโหดเหี้ยม"
 death_management.killer:0 "[dead_character.GetSheHe|U] ถูกสังหารโดย [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] ของ [battle_death_killer.GetLiege.GetTitledFirstName], ในการเผชิญหน้าที่ดุเดือด'#!"
 death_management.no_killer:0 "[dead_character.GetSheHe|U] ถูกลูกธนูหลงยิงระหว่างการปะทะกันอย่างดุเดือด'#!"
 # Spouse
 death_management.1200.t:0 "คู่ครองผู้ล่วงลับ"
 death_management.1200.desc_sad: "\n\nข้าไม่ควรปล่อยให้ [dead_character.GetHerHim] ไป... ไม่ใช่แบบนี้..."
 death_management.1200.desc_happy: "\n\nในที่สุด ไอ้ [dead_character.Custom2('InsultNoun', ROOT.Char)] นั่นก็ตายเสียที!"
 death_management.1200.a:0 "[battle_death_killer.GetFirstNameNoTooltip] เป็น [battle_death_killer.GetWomanMan] ที่ตายแล้ว! ตายแล้ว!"
 death_management.1200.b:0 "ข้าจะไม่มีวันลืมท่าน..."
 death_management.1200.c:0 "ท่านได้พิสูจน์ความกล้าหาญของท่านแล้ว ที่รักของข้า..."
 death_management.1200.d:0 "ในที่สุด ข้าก็เป็นอิสระ!"
 # Child
 death_management.1201.t:0 "[dead_character.Custom('GetDaughterSon')|U] ผู้ล่วงลับ"
 death_management.1201.desc:0 "\n\nข้าไม่สามารถช่วย [dead_character.GetHerHim] ได้... แต่ไม่มีพ่อแม่คนไหนควรมีชีวิตอยู่ยืนยาวกว่าลูก..."
 death_management.1201.a:0 "[battle_death_killer.GetFirstNameNoTooltip] จะไม่รอดพ้นไปได้!"
 death_management.1201.b:0 "#EMP [dead_character.Custom('GetDaughterSon')] ผู้กล้าหาญของข้า...#!"
 death_management.1201.c:0 "ยังไม่ถึงเวลาของเจ้า ลูกข้า..."
 death_management.1201.d:0 "หลับให้สบายนะ ลูก"
 # Parent
 death_management.1202.t:0 "บิดามารดาผู้ล่วงลับ"
 death_management.1202.desc:0 "\n\nมันสายเกินไปที่จะเปลี่ยนแปลงสิ่งต่าง ๆ ข้าหวังเพียงว่า [dead_character.GetSheHe] จะพบความสงบใน [dead_character.GetFaith.PositiveAfterLife]"
 death_management.1202.a:0 "#EMP ทำไมต้องเป็นท่าน [dead_character.Custom('GetMamaPapa')]?#!"
 death_management.1202.b:0 "[battle_death_killer.GetFirstNameNoTooltip] จะต้องชดใช้"
 # Lover
 death_management.1204.t:0 "คนรักผู้ล่วงลับ"
 death_management.1204.desc:0 "\n\nหัวใจของข้ากลายเป็นน้ำแข็ง เมื่อข้าตระหนักว่าจะไม่มีวันได้สัมผัสความอบอุ่นจากอ้อมกอดของคนรักอีกต่อไป..."
 death_management.1204.a:0 "#EMP [dead_character.GetFirstNameNoTooltip] ผู้กล้าหาญของข้า#!..."
 death_management.1204.b:0 "...ท่านจะได้รับการแก้แค้น!"
 # Best Friend
 death_management.1205.t:0 "สหายผู้ล่วงลับ"
 death_management.1205.desc:0 "\n\nข้าจะไม่มีวันได้ร่วมสังสรรค์อันล้ำค่าของ [dead_character.GetHerHis] อีกต่อไป..."
 death_management.1205.a:0 "ไม่ใช่ [dead_character.GetFirstNameNoTooltip]!"
 death_management.1205.b:0 "[battle_death_killer.GetFirstNameNoTooltip] จะต้องชดใช้!"
 # Rival
 death_management.1206.t:0 "ศัตรูผู้ล่วงลับ"
 death_management.1206.desc:0 "\n\nข้าอดไม่ได้ที่จะยิ้มเมื่อนึกถึง [dead_character.GetFirstNameNoTooltip] ที่ตายในการต่อสู้ในสงคราม #EMP ของข้า#! สิ่งนี้จะ ทำให้ข้ามีกำลังใจไปอีกหลายวัน!"
 death_management.1206.a:0 "ไปให้พ้น ๆ เสียที"
 death_management.1206.b:0 "[dead_character.GetFirstNameNoTooltip] ควรจะเป็นของข้า!"
 death_management.1206.c:2 "#EMP วีรบุรุษของข้า!#! ข้าจะส่ง [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] ให้ [battle_death_killer.GetFirstNameNoTooltip]!"
 # Heir
 death_management.1207.t:0 "ทายาทผู้ล่วงลับ"
 death_management.1207.desc:0 "\n\nการสืบทอดตำแหน่งของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จะต้องได้รับการพิจารณาอีกครั้ง..."
 death_management.1207.a:0 "ท่านยังไม่พร้อม..."
 death_management.1207.b:0 "... แต่ [battle_death_killer.GetFirstNameNoTooltip] ก็ เช่นกัน!"
 death_battle_new_rivalry_title:0 "[avenger.GetTitledFirstNameNoTooltip] แสวงหาการแก้แค้น"
