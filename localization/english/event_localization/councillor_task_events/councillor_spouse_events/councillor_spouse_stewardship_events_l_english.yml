 councillor_spouse_stewardship.1011.desc.guilds:0 "สมาคมพ่ายแพ้"
 councillor_spouse_stewardship.1011.desc.serfs:0 "ทาสติดที่ดินสงบลง"
 councillor_spouse_stewardship.1011.desc.corruption:0 "การควบคุมผู้เก็บภาษี"

 councillor_spouse_stewardship.2001.t:1 "[councillor.GetCouncilTitle]:  การไต่สวนด้านการลงทุน"
 councillor_spouse_stewardship.2001.desc:0 "ด้วยการบริหารการเงินของครัวเรือนอย่างขยันขันแข็งของ[councillor.GetTitledFirstNamePossessive] ทำให้มีทองคำเหลือมากกว่าที่คาดไว้เมื่อสิ้นสุดฤดูกาลนี้\n\n"เราควรนำมันไปใช้อย่างไรให้เกิดประโยชน์สูงสุด [ROOT.Char.GetWifeHusband]?""
 councillor_spouse_stewardship.2001.a:0 "จัดงานเลี้ยงอาหารค่ำอันงดงามเพื่อความสุขของทุกคน!"
 councillor_spouse_stewardship_2001_every_powerful_vassal:0 "ข้าหลวงผู้ทรงอำนาจทุกคน"
 councillor_spouse_stewardship.2001.b:0 "ลงทุนเงินในพื้นที่ท้องถิ่น"
 councillor_spouse_stewardship.2001.c:0 "หากมีสิ่งหนึ่งที่เงินซื้อได้ นั่นคือหูตา!"
 councillor_spouse_stewardship.2001.d:0 "เก็บไว้ก่อนเถิด"

 councillor_spouse_stewardship.2002.t:1 "[councillor.GetCouncilTitle]:  โอกาสอันเรืองรอง"
 councillor_spouse_stewardship.2002.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [courtier_lender.GetTitledFirstName] เดินสับขาเข้ามาหาข้าและยิ้ม [courtier_lender.Custom('quirk_pos_adverb')] "ข้าได้รับการทาบทามจาก [councillor.GetTitledFirstName] ผู้ ซึ่งด้วยสติปัญญาของ [councillor.GetHerHis] ได้แนะนำข้อตกลงระหว่างเราสองคน ในเมื่อท่านพอจะใช้ความช่วยเหลือทางการเงินได้บ้าง, และข้าก็พอจะใช้ความช่วยเหลือทางสังคมได้บ้าง...""
 councillor_spouse_stewardship.2002.a:0 "ข้าจะชดใช้ให้ท่าน ข้าสัญญา"
 councillor_spouse_stewardship.2002.money_loan_tooltip:0 "ข้าจะยืมทองคำ[gold_i] #bold [THIS.Var('amount_to_loan').GetValue]#! จาก[courtier_lender.GetFirstNameNoTooltip]"
 councillor_spouse_stewardship.2002.b:0 "เหตุใดท่านไม่บริจาคให้กับ[ROOT.Char.GetFaith.HouseOfWorship]แทนเล่า?"
 councillor_spouse_stewardship.2002.c:0 "ท่านควรบริจาคให้กับคนยากจน"
 councillor_spouse_stewardship.2002.d:0 "ข้าจะรับเครื่องบรรณาการนี้ด้วยความยินดี!"

 councillor_spouse_stewardship.2003.t:1 "[councillor.GetCouncilTitle]:  โอกาสทางการค้า"
 councillor_spouse_stewardship.2003.desc:0 "[councillor.GetTitledFirstName] เข้ามาหาข้าพร้อมกับม้วนกระดาษหนังสามม้วนในอ้อมแขนของ [councillor.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าได้ร่างข้อเสนอทางการค้าสำหรับผู้ปกครองเพื่อนบ้านแล้ว ข้ามั่นใจว่าจะสามารถบรรลุข้อตกลง อันจะเป็นประโยชน์ต่อทั้งสองฝ่ายได้!""
 councillor_spouse_stewardship.2003.a:0 "[ruler_1.GetTitledFirstNameNoTooltip]ดูมีเหตุผล"
 councillor_spouse_stewardship.2003.b:0 "ทำข้อตกลงกับ[ruler_2.GetTitledFirstNameNoTooltip]"
 councillor_spouse_stewardship.2003.c:0 "ทำข้อตกลงกับ[ruler_3.GetTitledFirstNameNoTooltip]"
 councillor_spouse_stewardship.2003.d_greedy:0 "ไม่มีใครเข้าใกล้ทองคำของข้าได้!"
 councillor_spouse_stewardship.2003.d_arrogant:0 "ไม่มีใครคู่ควรที่จะทำข้อตกลงกับ#EMP ข้า#!!"
 councillor_spouse_stewardship.2003.d:0 "ไม่มีใครเสนอโอกาสที่น่าดึงดูดใจพอ..."

 councillor_spouse_stewardship.2004.t:1 "[councillor.GetCouncilTitle]:  ความช่วยเหลือ"
 councillor_spouse_stewardship.2004.desc:0 ""[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('on_my_hook'))] ของท่าน [on_my_hook.GetTitledFirstName] เพิ่งพบว่า [on_my_hook.GetHerselfHimself] ตกอยู่ในปัญหานิดหน่อย"\n\n[councillor.GetTitledFirstName] ยิ้ม [councillor.Custom('quirk_pos_adverb')] ขณะที่ [councillor.GetSheHe] พูดต่อ "ข้า ทำให้แน่ใจว่าสถานการณ์คลี่คลายไปเอง และกล่าวถึงท่านในฐานะผู้มีพระคุณ""
 councillor_spouse_stewardship.2004.a:0 "ยอดเยี่ยมมาก!"
 councillor_spouse_stewardship.2004.b:0 "การทำความดีไม่ต้องการการตอบแทน"

 councillor_spouse_stewardship.2005.t:1 "[councillor.GetCouncilTitle]:  การลงทุนใน [county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship.2005.desc:1 ""[ROOT.Char.GetLadyLord|U] ของข้า เป็นที่ทราบกันดีว่ามีโอกาสหายากที่จะลงทุนใน [county_to_boost.GetName]"\n\n[councillor.Custom('WifeHusband')] ของข้า [councillor.GetFirstName] ร่างรายละเอียดสำหรับการลงทุนทางธุรกิจ และดูเหมือนว่าข้อตกลงนี้จะเป็นประโยชน์อย่างยิ่งต่อ [county_to_boost.GetNameNoTierNoTooltip] หากประสบความสำเร็จ"
 councillor_spouse_stewardship.2005.a:0 "มันเป็นความเสี่ยงที่คุ้มค่า!"
 councillor_spouse_stewardship.2005.a_1:0 "ข้อตกลง ส่งผลให้เกิดผลตอบแทนที่ดีเยี่ยมสำหรับ[county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship.2005.a_2:0 "ข้อตกลงล้มเหลว"
 councillor_spouse_stewardship.2005.b:0 "ปล่อยโอกาสนี้ให้กับผู้คนใน[county_to_boost.GetNameNoTierNoTooltip]เถิด"
 councillor_spouse_stewardship.2005.c:0 "การพูดคุยเรื่องกิจการท้องถิ่น เช่นนี้ต่ำต้อยเกินไปสำหรับข้า!"
