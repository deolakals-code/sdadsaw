 councillor_spouse_stewardship.1005.desc:0 "ครัวเรือนอันไร้ที่ติ"
 councillor_spouse_stewardship.1006.desc:0 "ราชสำนักที่จัดระเบียบอย่างดี"
 councillor_spouse_stewardship_1006_every_courtier:0 "ข้าราชสำนักทุกคน"
 councillor_spouse_stewardship.1007.desc:0 "ความเป็นอยู่ที่สะดวกสบาย"
 councillor_spouse_stewardship.1008.desc:0 "ราชสำนักที่แข็งแรง"
 councillor_spouse_stewardship.1009.desc:0 "การเจรจาการพัฒนา"
