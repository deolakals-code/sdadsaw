l_english: 
 marshal_task.0301.t:0 "ผู้บัญชาการได้รับการเลื่อนตำแหน่ง"
 marshal_task.0301.desc:0 "[councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] ได้นำเสนอนายทหารใหม่ที่มีแววรุ่ง\n\n"[commander.GetSheHe|U]อาจมิได้มีเชื้อสายสูงศักดิ์เท่าท่าน [councillor.Custom2('RelationToMe', ROOT.Char)]ของข้า แต่ข้าขอเอาชื่อข้าเป็นประกันว่า[commander.GetTitledFirstName]คือผู้ที่ท่านต้องการให้อยู่เคียงข้าง""
 marshal_task.0301.a:0 "ดีมาก [commander.GetFirstNameNoTooltip]จงรับใช้ข้า"
 marshal_task.0301.b:0 "เอาไอ้กากเดนนี่ออกไปจาก[ROOT.Char.Custom('ResidenceBuilding')]ของข้า!"
 
 marshal_task.0302.opening:0 "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 marshal_task.0302.desc:1 "ข้าได้เห็น[commander.GetTitledFirstName]แสดงความถนัดในด้าน[commander.Custom('CommanderTraitSkillDescription')]"
 marshal_task.0302.desc.known:0 "มันเป็นหนึ่งในความเชี่ยวชาญของข้า และข้าสามารถสอน[commander.GetHerHim]ถึงวิธีใช้ทักษะเหล่านี้ให้เกิดประโยชน์สูงสุดได้"
 marshal_task.0302.desc.unknown:0 "แม้ว่าข้าจะไม่ชำนาญในด้านนั้น แต่ข้าก็ยังสามารถพยายามช่วย[commander.GetHerHim]ขัดเกลาทักษะของ[commander.GetHerHis]ได้"
 marshal_task.0302.a:0 "แน่นอน สอน[commander.GetHerHim]เถิด"
 marshal_task.0302.b:0 "ไม่ [commander.GetFirstNameNoTooltip]ควรเน้นการต่อสู้ส่วนตัว"

 marshal_task.0304.t: "เลื่อนตำแหน่งผู้บัญชาการ?"
 marshal_task.0304.desc: "[councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] พา[beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', ROOT.Char)]มาหาข้าอย่างลังเลใจยิ่งนัก\n\n"[advocate_of_nepotism.GetTitledFirstName|U]ได้ขอให้ข้าเลื่อนตำแหน่ง[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip]ให้ได้รับเกียรติเป็นผู้บัญชาการ แต่ข้าเชื่อว่าท่านอาจประสงค์จะมีส่วนร่วมในการตัดสินใจเรื่องนี้ก่อน..."\n\n[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] [beneficiary_of_nepotism.Custom('quirk_neg_present')]."
 marshal_task.0304.a_clan: "บุตรหลานแห่ง[ROOT.Char.GetHouse.GetBaseNameNoTooltip]ทุกคนล้วนยินดีต้อนรับสู่กองทัพ"
 marshal_task.0304.a_neutral: "[beneficiary_of_nepotism.Custom('GetDaughterSon')]ของท่านยินดีต้อนรับสู่กองทัพของข้า "
 marshal_task_0304_a_tt: "@warning_icon! #X [CHARACTER.GetShortUINameNoTooltip|U]จะขุ่นเคืองหาก[TARGET_CHARACTER.GetShortUINameNoTooltip|U]ถูกไล่ออกภายใน 20 ปี#!"
 marshal_task.0304.b: "[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip]จะไม่พอใจที่จะรับใช้ในฐานะข้าราชสำนักมากกว่าหรือ?"
 marshal_task.0304.b.success: "[advocate_of_nepotism.GetTitledFirstNameNoTooltip]พอใจกับข้อเสนอของท่าน"
 marshal_task.0304.b.failure: "[advocate_of_nepotism.GetTitledFirstNameNoTooltip]รู้สึกถูกดูหมิ่นโดยข้อเสนอของท่าน"
 marshal_task.0304.c: "กองทัพของข้า#EMP มิใช่#! สถานเลี้ยงเด็ก!"

 marshal_task.0306.opening: "[advocate_of_nepotism.Custom2('AppropriateGreetingNegative', SCOPE.sC('councillor_liege'))]"
 marshal_task.0306.desc: "ข้าเชื่อคำพูดของท่านเมื่อท่านสัญญาว่าจะ แต่งตั้ง[beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', advocate_of_nepotism)]เป็น[ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]ของท่าน แต่บัดนี้ข้าเห็นแล้วว่าความไว้วางใจของข้าผิดที่ผิดทาง โปรดอภัยให้ข้าที่เชื่อในคำพูดของท่านมากเกินไป"
 marshal_task.0306.a: "นี่เป็นเพียงความเข้าใจผิด!"

 marshal_task.1001.t:0 "การหนีทัพของทหารเกณฑ์"
 marshal_task.1001.desc:0 "วิธีการเกณฑ์ทหารอันเข้มงวดของ[councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] ดูเหมือนจะส่งผลตรงกันข้ามกับที่ตั้งใจไว้\n\nขณะที่ชาวนาจำนวนมากขึ้นถูกรวบรวมในเมืองและหมู่บ้าน แต่จำนวนมากก็กำลังหลบหนีจากกองทหารของ[councillor.GetFirstNamePossessive]เพื่อหลีกเลี่ยงภาระหน้าที่ในการรับใช้!"
 marshal_task.1001.a:0 "ข้าต้องการทหารเพิ่ม ไม่ใช่ลดลง!"
 marshal_task.1001.notification:0 "การหนีทัพของทหารเกณฑ์"

 marshal_task.1002.t:0 "พื้นที่เกษตรกรรมที่ไม่ได้ใช้"
 marshal_task.1002.desc:0 "จำนวนทหารเกณฑ์ที่ถูกนำมารับใช้โดย[councillor.GetCouncilTitle]ของข้า ซึ่งมากเป็นประวัติการณ์ได้ส่งผลกระทบที่ไม่คาดฝันบางประการ\n\nการเกณฑ์ทหารอย่างไม่เลือกหน้าของ[councillor.GetTitledFirstNamePossessive]ได้ทิ้งพื้นที่เกษตรกรรมหลายเอเคอร์ใน[county.GetName]ให้รกร้าง"
 marshal_task.1002.a:0 "สิ่งนี้ไม่ควรเกิดขึ้น"
 marshal_task.1002.notification:0 "ทหารเกณฑ์ทิ้งพื้นที่เกษตรกรรมให้ว่างเปล่า"

 marshal_task.1003.t:0 "ทหารยามไม่เพียงพอ"
 marshal_task.1003.desc:0 "การขับเคลื่อนการเกณฑ์ทหารอย่างกระตือรือร้นของ[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))]ของข้า [councillor.GetTitledFirstName] ได้ ส่งผลให้เกิดการขาดแคลนชายฉกรรจ์ใน[county.GetName]\n\nเมื่อมีคนน้อยลงที่จะทำหน้าที่เป็นทหารยามท้องถิ่น อาชญากรรมจึงเพิ่มสูงขึ้น"
 marshal_task.1003.a:0 "เจ้าทำอะไรลงไป [councillor.GetFirstNameNoTooltip]..."
 marshal_task.1003.notification:0 "ทหารยามถูกเกณฑ์เป็นทหารเกณฑ์"

 marshal_task.1101.t:0 "การรับใช้ที่จัดระเบียบอย่างดี"
 marshal_task.1101.desc:0 "ด้วยการตรวจสอบและคัดเลือกทหารเกณฑ์อย่างรอบคอบ [councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] ได้ ทำให้แน่ใจว่าไม่มีฟาร์มแม้ แต่แห่งเดียวใน[county.GetName]ถูกทิ้งร้าง\n\nบันทึกที่[councillor.GetSheHe]เก็บไว้จะเป็นประโยชน์อย่างยิ่งเมื่อถึงฤดูเก็บภาษี เช่นกัน..."
 marshal_task.1101.a:0 "ยอดเยี่ยมมาก [councillor.GetFirstNameNoTooltip]"
 marshal_task.1101.notification:0 "การรับใช้ของทหารเกณฑ์ที่จัดระเบียบอย่างดี"

 marshal_task.1102.t:0 "การปรากฏตัวของทหารที่เพิ่มขึ้น"
 marshal_task.1102.desc:0 "งานของ[councillor.GetTitledFirstNamePossessive]ในการจัดระเบียบทหารเกณฑ์ของข้าได้ดำเนินต่อไปยัง[county.GetName] ที่ ซึ่งการปรากฏตัวของทหารที่เพิ่มขึ้นได้สร้างผลลัพธ์อันน่าอัศจรรย์\n\nโจรถูกกำจัดจนสิ้นซาก และพวกค้าของเถื่อนและผู้ลักพาตัวก็หวาดกลัวเกินกว่าจะปฏิบัติการ"
 marshal_task.1102.a:0 "ราษฎรของข้าสามารถรู้สึกปลอดภัยได้เสมอ"
 marshal_task.1102.notification:0 "การปรากฏตัวของทหารที่เพิ่มขึ้น"
 marshal_task.1103.notification:0 "ทหารเกณฑ์เตรียมพร้อมสำหรับการรบ"

 marshal_task.2001.t:0 "ผู้บัญชาการบาดเจ็บ"
 marshal_task.2001.opening:0 "ในระหว่างการประลองซ้อม [commander.GetTitledFirstName]ถูกโจมตี!"
 marshal_task.2001.ending:0 "\n\n[councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] สามารถห้ามเลือดได้ แต่คงต้องใช้เวลาสักพักกว่า[commander.GetFirstName]จะฟื้นตัว"
 marshal_task.2001.a:0 "พวกเขาใช้อาวุธจริงหรือ?!"
 marshal_task.2001.notification:0 "นักรบบาดเจ็บระหว่างการฝึก"
 
 marshal_task.2101.notification:0 "ได้รับลักษณะนิสัย [commander.Custom('CommanderTraitBeingTaughtNoTooltip')]"
 marshal_task.2102.notification:0 "อัศวินได้รับการพัฒนา"
 marshal_task.2103.notification:0 "ฝึกซ้อมการประลองบนหลังม้า"
 marshal_task.0302.notification.a:0 "ผู้บัญชาการได้รับการพัฒนาอย่างมีนัยสำคัญ"
 marshal_task.0302.notification.b:0 "ผู้บัญชาการได้รับการพัฒนา"
 marshal_task.0303.notification.a:0 "อัศวินได้รับการพัฒนาอย่างมีนัยสำคัญ"
 marshal_task.0303.notification.c:0 "อัศวินกลายเป็นยอดนักดาบ"

 marshal_task.2002.t:0 "ผู้บัญชาการบาดเจ็บสาหัส"
 marshal_task.2002.eye:0 "\n\n[councillor.GetCouncilTitle]ของข้ารีบเรียกแพทย์มา แต่ไม่มีทางรักษาการมองเห็นของ[commander.GetHerHis]ได้"
 marshal_task.2002.leg:0 "\n\n[councillor.GetCouncilTitle]ของข้ารีบเรียกแพทย์มา แต่ไม่มีทางรักษาทั้งชีวิตและขาของ[commander.GetHerHis]ไว้ได้"
 marshal_task.2002.hand:0 "\n\n[councillor.GetCouncilTitle]ของข้ารีบเรียกแพทย์มา แต่ไม่มีทางรักษาทั้งชีวิตและแขนของ[commander.GetHerHis]ไว้ได้"
 marshal_task.2002.a:0 "อย่างน้อยสติปัญญาของ[commander.GetHerHis]ก็ยังคงอยู่"
 marshal_task.2002.b:0 "ม้าของ[commander.GetHerHis]จะต้องแบก[commander.GetHerHim]เข้าสู่สนามรบ"
 marshal_task.2002.c:0 "ได้โปรดบอกข้าทีว่า[commander.GetSheHe]ยังมีมือข้างที่ถือดาบอยู่!"
 marshal_task.2002.generic_title:0 "นักรบบาดเจ็บระหว่างการฝึก"
 marshal_task.2002.notification_eye:0 "[commander.GetTitledFirstName]สูญเสียดวงตาไปข้างหนึ่งขณะฝึกซ้อมภายใต้การดูแลของ[councillor.GetCouncilTitle]ของข้า!"
 marshal_task.2002.notification_leg:0 "[commander.GetTitledFirstName]สูญเสียขาไปข้างหนึ่งขณะฝึกซ้อมภายใต้การดูแลของ[councillor.GetCouncilTitle]ของข้า!"
 marshal_task.2002.notification_hand:0 "[commander.GetTitledFirstName]พิการขณะฝึกซ้อมภายใต้การดูแลของ[councillor.GetCouncilTitle]ของข้า!"

 marshal_task.2003.t:0 "การตายของผู้บัญชาการ"
 marshal_task.2003.ending:0 "\n\n[councillor.GetCouncilTitle]ของข้าเรียกแพทย์มาทันที แต่[commander.GetFirstName]เสียเลือดจนหมดตัวภายในไม่กี่อึดใจ"
 marshal_task.2003.a:0 "เป็นการสูญเสียอันน่าเศร้าสำหรับกองทัพของข้า"

 marshal_task.2101.desc:0 "[councillor.GetCouncilTitle]ของข้า [councillor.GetTitledFirstName] มาหาข้าพร้อมข้อเสนอ\n\n"ข้าสังเกตเห็นว่า[commander.GetTitledFirstName]มีศักยภาพในด้าน[commander.Custom('CommanderTraitSkillDescription')]เหมือนกับที่[teacher.GetTitledFirstName]เคยมี ข้าเชื่อว่า[commander.GetFirstName]อาจเรียนรู้ได้มากจากการสอนอย่างทุ่มเทจาก[teacher.GetFirstName]""
 marshal_task.2101.a:0 "จงทำ เช่นนั้น"
 marshal_task.2101.b:0 "[commander.GetFirstNameNoTooltip] ควรให้ความสำคัญกับการต่อสู้ส่วนบุคคลมากกว่านี้!"

 marshal_task.3001.t:0 "การต่อต้านในท้องถิ่น"
 marshal_task.3001.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)]ผู้เป็นที่เคารพของข้า\n แม้ว่าความพยายามของข้าในการจัดระเบียบ[county.GetName]จะดำเนินไปอย่างรวดเร็ว แต่ไม่ใช่ทุกคนที่เชื่อมั่นในประโยชน์ของมัน\nดูเหมือนว่าข้าจะไปเหยียบตาปลาของนายกเทศมนตรีและผู้ใหญ่บ้านหลายคนเข้าแล้ว ทุกคนเลยก็ว่าได้"
 marshal_task.3001.a:0 "เจ้าทำอะไรลงไป [councillor.GetFirstNameNoTooltip]..."
 marshal_task.3001.notification:0 "สูญเสียความเคารพจากประชาชน"

 marshal_task.3002.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)]ผู้เป็นที่เคารพของข้า...\n\nดูเหมือนว่าข้าได้ตัดสินใจผิดพลาดไปบ้าง การปฏิรูปที่ข้าได้นำมาใช้ใน[county.GetName]มีจุดมุ่งหมายเพื่อเสริมสร้างอำนาจของท่านในภูมิภาค แต่กลับกลายเป็นว่าผู้คนแทบจะไม่รู้ว่าใครคือ[ROOT.Char.GetTitleTierName]ของพวกเขา..."
 marshal_task.3002.a:0 "เจ้า ทำให้สถานการณ์#EMP แย่ลงไปอีกหรือ?!#!"
 marshal_task.3002.notification:0 "[councillor.GetCouncilTitle]สูญเสียการควบคุม"

 marshal_task.3003.t:0 "ความผิดหวัง"
 marshal_task.3003.desc:0 "คารวะ [baron.Custom2('RelationToMe', ROOT.Char)]ของข้า\n ข้าต้องร้องเรียนเกี่ยวกับพฤติกรรมของ[councillor.GetCouncilTitle]ของท่าน [councillor.GetTitledFirstName]!\n [councillor.GetSheHe|U]ได้ปรากฏตัวใน[county.GetName]และเริ่มเปลี่ยนแปลงสิ่งต่างๆ ตามอำเภอใจ โดยไม่คำนึงถึงประเพณีหรือธรรมเนียมปฏิบัติอันเก่าแก่ของเรา!"
 marshal_task.3003.a:0 "เจ้าจะละเอียดอ่อนกว่านี้หน่อยไม่ได้หรือ [councillor.GetFirstNameNoTooltip]?"
 marshal_task.3003.notification:0 "บารอนไม่พอใจ"

 marshal_task.3101.t:0 "ประโยชน์ในท้องถิ่น"
 marshal_task.3101.desc:0 "[councillor.Custom2('RelationToMe', ROOT.Char)]ผู้เป็นที่เคารพของข้า\n ข้ายินดีที่จะรายงานว่าการจัดระเบียบ[county.GetName]ของข้าดำเนินไปด้วยดี\n มิใช่เพียงท่านเท่านั้นที่ได้รับประโยชน์จากการปรับปรุงเหล่านี้ ผู้คนใน[county.GetNameNoTier]ภักดีต่อ[ROOT.Char.GetTitleTierName]ของพวกเขาตลอดไปอยู่แล้ว แต่พวกเขาก็ไม่ค่อยรู้สึกขอบคุณ เช่นนี้มาก่อน"
 marshal_task.3101.a:0 "ทำได้ดีมาก [councillor.GetCouncilTitle]!"
 marshal_task.3101.notification:0 "[councillor.GetCouncilTitle]ได้รับความเคารพ"

 marshal_task.3102.t:0 "ความกตัญญู"
 marshal_task.3102.desc:0 "[baron.Custom2('RelationToMe', ROOT.Char)]ของข้า\n [councillor.GetCouncilTitle]ของท่าน [councillor.GetTitledFirstName] ได้ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อจัดระเบียบ[county.GetName] และเรากำลังเก็บเกี่ยวผลประโยชน์แล้ว\nข้าปรารถนาที่จะขอบคุณท่านเป็นการส่วนตัวที่ส่ง[councillor.GetWomanMan]ผู้มีความสามารถ เช่นนี้มาช่วยเหลือเรา!"
