l_english: 
 murders_at_court.1001.t:1 "ฆาตกรรมในราชสำนัก: สวดภาวนาแด่ผู้ตายไร้นาม"
 murders_at_court.1001.desc_physician:1 ""พบชิ้นส่วนของร่างกายเมื่อเช้านี้ [ROOT.Char.Custom('FormOfAddressForLiege')]" [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] กล่าว พลางผายมือไปยังโต๊ะตรงหน้าเรา แอ่งเลือดนองอยู่บนโต๊ะรอบกองเนื้อเล็กๆ เส้นสายของเนื้อเยื่อวางอยู่ในของเหลวสีเข้ม\n\n"ดังที่ท่านเห็น มันมิใช่... มนุษย์ ทั้งร่าง ไม่เพียงพอที่จะระบุตัวตนได้""
 murders_at_court.1001.desc:1 ""พบชิ้นส่วนของร่างกายเมื่อเช้านี้ [ROOT.Char.Custom('FormOfAddressForLiege')]" ทหารยามกล่าว พลางผายมือไปยังโต๊ะตรงหน้าเรา แอ่งเลือดนองอยู่บนโต๊ะรอบกองเนื้อเล็กๆ เส้นสายของเนื้อเยื่อวางอยู่ในของเหลวสีเข้ม\n\n"ดังที่ท่านเห็น มันมิใช่... มนุษย์ ทั้งร่าง ไม่เพียงพอที่จะระบุตัวตนได้""
 murders_at_court.1001.a:0 "ข้าจะสวดภาวนาให้เหยื่อ"
 murders_at_court.1001.b:0 "ตรวจสอบให้แน่ใจว่าทุกคนยังอยู่ครบถ้วน ตลอด #EMP ทุก#! เวลา"
 murders_at_court.1001.b.tt:0 "ข้าจะจำกัดการเคลื่อนไหวของทุกคนในราชสำนัก — หวังว่าจะกดดันให้ฆาตกรเปิดเผยตัวตน"
 murder_at_court_movement_restricted_courtiers_craven:0 "ข้าราชบริพารขี้ขลาดทุกคน"
 murder_at_court_movement_restricted_courtiers_other:0 "ข้าราชบริพารอื่นๆ ทุกคน"
 murder_at_court_movement_restricted_courtiers:0 "ข้าราชบริพารทุกคน"
 murders_at_court.1001.c:0 "เพิ่มทหารยามเป็นสองเท่า!"
 murders_at_court.1001.c.tt:0 "ทหารยามพิเศษจะช่วยยับยั้งฆาตกรได้อย่างแน่นอน – หรืออย่างน้อยก็ขัดขวางพวกเขา"
 murders_at_court.1001.d:0 "มีใครเห็นอะไรบ้างหรือไม่? ได้โปรด ข้าต้องการความช่วยเหลือจากพวกท่าน!"
 murders_at_court.1001.d.tt:0 "ข้าประกาศให้ทั่วทั้งอาณาจักรทราบว่าข้ากำลังมองหาข้อมูลและเบาะแส"
 murders_at_court.1001.e:0 "ข้าจะสืบสวนเรื่องนี้ ด้วยตนเอง"
 murders_at_court.1001.e.tt:0 "ข้าจะนำความรู้ของข้ามาใช้ในคดีนี้"

 murders_at_court.1002.t:1 "ฆาตกรรมในราชสำนัก: ฆาตกรรมยามรุ่งอรุณ"
 murders_at_court.1002.desc_named:0 "เมื่อรุ่งอรุณมาถึง ข้าได้รับข่าวว่า [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกสังหารเมื่อคืนนี้ ถูกคว้านท้องอย่างโหดเหี้ยมและวางทิ้งไว้ให้ใครก็ตามที่เดินผ่านได้เห็น...\n\nศพถูกนำออกไปอย่างรวดเร็ว และเมื่ออาทิตย์ตกดิน ก็ไม่พบร่องรอยของการกระทำอันน่าสยดสยองนั้นอีก"
 murders_at_court.1002.desc:0 "อีกวัน อีกศพ ด้วยใจที่หนักอึ้ง ข้าตระหนักว่าความรู้สึกคุ้นชินได้เข้ามาปกคลุม [ROOT.Char.Custom('ResidenceBuilding')] หลังจากการฆาตกรรมที่เกิดขึ้นล่าสุด\n\nศพ — [ROOT.Char.Custom('RandomWomanMan')] หนุ่มสาวที่ถูกคว้านท้อง – ถูกนำออกไปอย่างรวดเร็ว และเมื่ออาทิตย์ตกดิน ก็ไม่พบร่องรอยของการกระทำอันน่าสยดสยองนั้นอีก"

 murders_at_court.1003.t:1 "ฆาตกรรมในราชสำนัก: จนกว่าความตายจะพรากเรา"
 murders_at_court.1003.desc_opening:0 "ข้าพบ [spouse.GetTitledFirstName] ในห้องพักของเรา นอนแผ่หลาอยู่บนพื้นท่ามกลางกองเลือดของ [spouse.GetHerHis] เอง"
 murders_at_court.1003.desc_like:0 "ข้าร่ำไห้พลางทรุดลงกับพื้น กอดร่าง [spouse.GetHerHim] ไว้แนบอก"
 murders_at_court.1003.desc:1 "ข้าทรุดลงกับพื้น กอดร่าง [spouse.GetHerHim] ไว้แนบอก"
 murders_at_court.1003.desc_end:0 "– [spouse.GetSheHe] ช่างเย็นเหลือเกิน... โอ้ [ROOT.Char.GetFaith.HighGodName] เหตุใด [spouse.GetSheHe] จึงเย็น เช่นนี้?!"

 murders_at_court.1004.t:1 "ฆาตกรรมในราชสำนัก: บุตรของข้า"
 murders_at_court.1004.desc:0 "ข้าพบ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))] ของข้า [child.GetTitledFirstName] บนเตียงของ [child.GetHerHis] เอง — ร่างเย็นชืดและไร้ชีวิต เครื่องนอนชุ่มโชกไปด้วยเลือด และเสียง #EMP หยด ติ๋งๆ#! ช้าๆ ของมันที่กระทบพื้นใต้เตียงดูเหมือนจะดังก้องอยู่ในห้อง"

 murders_at_court.2001.t:1 "ฆาตกรรมในราชสำนัก: การบานปลาย"
 murders_at_court.2001.desc:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] ของข้า [victim.GetTitledFirstName] นอนแผ่หลาอยู่บนพื้นเย็นเฉียบ โลหิตไหลซึมจากบาดแผลถูกแทงหลายแห่งทั่วร่างของ [victim.GetHerHis]\n\nเหตุใดฆาตกรผู้นี้จึงเย้ยหยันข้า เช่นนี้?!"

 murders_at_court.2002.t:1 "ฆาตกรรมในราชสำนัก: ก้าวล้ำหน้าหนึ่งก้าว"
 murders_at_court.2002.desc:0 "ศีรษะที่ถูกตัดขาดของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] ข้า [heir.GetTitledFirstName] วางอยู่บนโต๊ะทำงานเมื่อข้ากลับถึงห้องพัก ปากอ้าค้างกรีดร้องอย่างเงียบงัน ทายาท [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('heir'))] ของข้า... โอ้ [ROOT.Char.GetFaith.HighGodName] เหตุใดกัน? ฆาตกรที่รังควานเราผู้นี้ต้องถูกหยุดยั้ง!"
 murders_at_court.2002.a:0 "ข้าต้องสวดภาวนาเพื่อ [ROOT.Char.Custom('RealmType')] ของเรา!"

 murders_at_court.2003.t:1 "ฆาตกรรมในราชสำนัก: ฆาตกรถูกเปิดโปง"
 murders_at_court.2003.desc:0 "ความเจ็บปวดเฉียบพลันที่หลังข้า— ข้าสูดหายใจเข้า และความทรมานที่เพิ่มพูน ทำให้ข้ากรีดร้อง ขณะที่ข้าพยายามหันตัว ข้าก็ทรุดลง ตามเสียง #EMP หยด#! #EMP หยด#! ของเลือดข้าที่ไหลลงสู่พื้น\n\nภาพของข้าเริ่มมืดลง แต่ข้าเห็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] ข้า [murderer.GetTitledFirstName] ยืนคร่อมข้าด้วยรอยยิ้มกว้าง ข้ายื่นมือไปหา [murderer.GetHerHim] และ [murderer.GetSheHe] ก็ตอบแทนข้าด้วยการเตะที่ ทำให้ห้องหมุนคว้าง; หมุนวนไปมา– สว่างและมืด มืดลง และมืดลง..."
 murders_at_court.2003.a:0 "[murderer.GetFirstNameNoTooltip]... เหตุใด...?"

 murders_at_court.2101.t:1 "ฆาตกรรมในราชสำนัก: ผู้สืบทอดที่ถูกสังหาร"
 murders_at_court.2101.desc_opening:0 "ข้าจ้องมองร่างไร้ชีวิตของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_heir'))] ข้า [other_heir.GetTitledFirstName] และรู้สึกหน้ามืด แน่นอนว่าเป็นเลือดของข้าเองที่เคลือบพื้นอยู่ใต้ร่าง [other_heir.GetHerHim] เพราะไม่มีเลือดไปเลี้ยงสมองข้าเลย\n\n"
 murders_at_court.2101.desc_family:0 "ข้านั่งยองๆ ลงข้าง [other_heir.GetHerHim] ประคองแก้มเย็นชืดไว้ในมือข้า – ดวงตาของ [other_heir.GetHerHis] เบิกกว้าง แต่ด้วยความประหลาดใจมากกว่าความสยดสยอง "มีใครที่เจ้ารู้จักทำสิ่งนี้กับเจ้ารึ?""
 murders_at_court.2101.desc:0 "[other_heir.GetSheHe|U] ดูประหลาดใจมากกว่าหวาดกลัว... บางที [other_heir.GetSheHe] อาจรู้จักฆาตกรของ [other_heir.GetHerHis]?"

 murders_at_court.2201.t:1 "ฆาตกรรมในราชสำนัก: สิ่งที่ไม่อาจมองเห็น"
 murders_at_court.2201.desc:0 ""แต่... ดวงตาหายไป! ถูกควักออกไปเหมือนก้อนหินในทุ่ง!" [ROOT.GetCharacter.Custom('lowly_servant_type')] ผู้พบเหยื่อรายล่าสุดของฆาตกรถูกนำตัวออกไป — ใบหน้าซีดขาว มือสั่นเทา และยังคงกรีดร้องไม่หยุด\n\nขณะที่ข้ามองเข้าไปในเบ้าตาสีแดงและไร้แววตาที่ควรจะมีดวงตาอยู่ ข้าก็สั่นสะท้านด้วยความไม่สบายใจ ฆาตกรต้องการดวงตาไปเพื่ออะไร? พิธีกรรมบางอย่างหรือ?"

 murders_at_court.5001.t:0 "ฆาตกรรมในราชสำนัก: ผู้ช่วย"
 murders_at_court.5001.desc:0 "ชายผู้สงสัยใคร่รู้ผู้หนึ่งได้ตามหาข้าจนพบหลังจากได้ยินเรื่องฆาตกรรมที่รบกวนราชสำนักของข้า\n\n"ข้าคือ [watson.GetTitledFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าคิดว่าข้าสามารถช่วยเหลือท่านได้""
 murders_at_court.5001.a:0 "ข้าต้องการความช่วยเหลือทุกอย่างที่หาได้!"
 #murders_at_court.5001.b: ""
 murders_at_court.5001.c:0 "เรื่องนี้ไม่เกี่ยวกับเจ้า!"

 murders_at_court.8001.t:1 "ฆาตกรรมในราชสำนัก: เครื่องเตือนความตาย"
 murders_at_court.8001.desc:1 "ขณะที่เรานำร่าง [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ไปพักผ่อนชั่วนิรันดร์ ข้าขอสาบานว่าจะตามหาผู้ที่ทำสิ่งนี้กับ [story_owner.GetHerHim] ให้พบ ฆาตกรดูเหมือนจะหยุดการอาละวาดแล้ว และข้าอดสงสัยไม่ได้ว่า [story_owner.GetTitleAsNameNoTooltip] คือเป้าหมายมาโดยตลอดหรือไม่..."
 murders_at_court.8001.a:0 "ขอให้ท่านไปสู่สุคติ [story_owner.GetFirstNameNoTooltip]"

 murders_at_court.8002.desc:1 "ขณะที่เรานำร่าง [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ไปพักผ่อนชั่วนิรันดร์ ข้าแทบจะกลั้นหัวเราะไว้ไม่อยู่ สีหน้าที่ [story_owner.GetSheHe] ทำตอนสุดท้ายนั้นช่างประเมินค่ามิได้! [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('story_owner'))] [story_owner.GetWomanMan] พวกเขากล่าวกัน– ถุย\n\nอย่างน้อยสถานการณ์ก็น่าจะสงบลงแล้วในตอนนี้ที่ฆาตกรผู้น่าสะพรึงกลัวกำลังยุ่งอยู่กับเรื่องอื่น"
 murders_at_court.8002.a:0 "เช่นการปกครอง [ROOT.Char.Custom('RealmType')]!"

 murders_at_court.8003.t:1 "ฆาตกรรมในราชสำนัก: การสืบทอด"
 murders_at_court.8003.desc:0 "[predecessor.GetTitledFirstName] มักจะพูดถึงการฆาตกรรมที่รังควานราชสำนักของ [predecessor.GetHerHis]; การสังหารที่โหดเหี้ยมและน่าสะพรึงกลัว\n\nทุกย่างก้าวที่ [predecessor.GetSheHe] ดำเนินการเพื่อยับยั้งการฆาตกรรมยังคงอยู่ และข้าทำได้เพียงหวังว่ามันจะเพียงพอ..."
 murders_at_court.8003.a:0 "ขอให้คำสาปที่รังควานราชสำนักจงตายไปพร้อมกับ [predecessor.GetHerHim]"

 murders_at_court.9001.t:1 "ฆาตกรรมในราชสำนัก: การเผชิญหน้า"
 murders_at_court.9001.desc_opening_watson:0 "จดหมายฉบับหนึ่งรอข้าและ [watson.GetTitledFirstName] อยู่เมื่อเรากลับถึงห้องพัก เขียนด้วยหมึกสีแดง — ไม่ใช่สิ ด้วย #EMP เลือด#!.\n\n"
 murders_at_court.9001.desc_opening:0 "จดหมายฉบับหนึ่งรอข้าอยู่เมื่อข้ากลับถึงห้องพัก เขียนด้วยหมึกสีแดง — ไม่ใช่สิ ด้วย #EMP เลือด#!.\n\n"
 murders_at_court.9001.desc_heir:1 "#EMP เพื่อเห็นแก่ [ROOT.Char.Custom('RealmType')] เจ้าจงหยุดการค้นหานี้เสีย ข้าใช้ชีวิตอยู่ใต้จมูกเจ้ามาตลอด แต่เจ้าก็ยังคงตาบอดเช่นนี้ การเปิดเผยตัวตนของข้ามีแต่จะนำความเจ็บปวดมาสู่เจ้าเท่านั้น#!."
 murders_at_court.9001.desc_rival:1 "#EMP ข้าได้ตั้งปณิธานในชีวิตที่จะ #EMP กำจัด#! เจ้า — กำจัดตระกูลและการปกครองของเจ้า ไม่มีสิ่งใดที่เจ้าทำจะหยุดยั้งข้าได้ แต่หากเจ้าไม่หยุดยุ่งเรื่องนี้ เจ้าก็บังคับให้ข้าต้องก่อกรรมอันดำมืดยิ่งกว่าเดิม#!."
 murders_at_court.9001.desc_witch:1 "#EMP เจ้าคิดว่าการยุ่งของเจ้าจะทำอะไรได้งั้นหรือ? พลังอำนาจมืดได้เคลื่อนไหวแล้ว และด้วยการขวางทางข้า เจ้ามีแต่จะทำให้ตนเอง และคนที่เจ้ารัก ตกอยู่ในอันตราย#!."
 murders_at_court.9001.desc_cannibal:1 "#EMP เจ้าไม่เข้าใจ ข้าต้องการสิ่งนี้เพื่อดำรงชีวิต เพื่ออยู่รอด เพื่อหา #EMP อาหาร#! จงยุติการค้นหานี้ทันที มิฉะนั้นความหิวโหยของข้าจะกลืนกินทุกสิ่ง!#!."
 murders_at_court.9001.desc_vassal:0 "#EMP เพื่อเห็นแก่ [ROOT.Char.Custom('RealmType')] เจ้าจงหยุดการค้นหานี้เสีย ข้าเป็นที่ต้องการ– #EMP มีคุณค่า#! และเจ้าจะต้องเสียใจหากเปิดเผยตัวตนของข้า#!."
 murders_at_court.9001.desc_fallback:1 "#EMP เจ้าจงยุติการค้นหานี้ทันที ไม่มีสิ่งใดดีจากการเปิดเผยตัวตนของข้า และข้าจะทำให้แน่ใจว่าไม่มีสิ่งใดดีมาถึงเจ้าหากเจ้ายังคงพยายามต่อไป#!."
 murders_at_court.9001.desc_ending:1 "\n\nลายมือนี้... มันดูคล้ายกับของ [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] เกือบจะเหมือนกัน!"
 murders_at_court.9001.a:0 "จะเป็นไปได้หรือ...?"
 murders_at_court.9001.a.tt:0 "ข้าจะเผชิญหน้ากับ [murderer.GetTitledFirstNameNoTooltip] เกี่ยวกับเรื่องนี้"
 murders_at_court.9001.b:0 "ข้าคิดว่าฆาตกรรมเหล่านี้จะยังคงไม่คลี่คลาย"
 murders_at_court.9001.b.tt:0 "อะไรคือสิ่งที่เลวร้ายที่สุดที่อาจเกิดขึ้นได้?"
 murders_at_court.9001.c:0 "[watson.GetFirstNameNoTooltip] ท่านคิดว่าอย่างไร?"
 murders_at_court.9001.c.tt:0 "ข้าไม่คิดว่ามันจะง่าย เช่นนี้..."

 murders_at_court.9002.t:0 "ฆาตกรรมในราชสำนัก: ผลที่ตามมา"
 murders_at_court.9002.desc:0 "ข้าพบ [the_one_to_kill.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกแขวนอยู่นอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ร่างของ [the_one_to_kill.GetHerHis|U] เย็นชืด ซีดเซียว ไร้การเคลื่อนไหว... แต่นั่นอะไร? มีกระดาษโน้ตเล็กๆ ซ่อนอยู่ในรอยพับเสื้อผ้าของ [the_one_to_kill.GetHerHis]!\n\n#EMP นี่คือเหยื่อรายสุดท้ายของข้า – ของขวัญชิ้นสุดท้ายของข้าแด่ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] แต่อย่าได้กลัวไปเลย ข้าจะยังคงอยู่แถวนี้ คอยเฝ้ามองท่านอยู่#!."
 murders_at_court.9002.a:0 "ไม่น่าเชื่อว่าสัตว์ประหลาด เช่นนี้จะลอยนวลอยู่ได้..."

 murders_at_court.9003.t:1 "ฆาตกรรมในราชสำนัก: มรดกอันมืดมิด"
 murders_at_court.9003.a:0 "เจ้าจะต้องถูกลงโทษสำหรับอาชญากรรมของเจ้า!"
 murders_at_court.9003.b:0 "ตาต่อตา ชีวิตต่อชีวิต...!"
 murders_at_court.9003.c:0 "ไปเสียเถิด [murderer.GetTitledFirstNameNoTooltip]"
 murders_at_court.9003.d:0 "คงจะน่าเบื่อสินะ ที่ต้องก่อการเหล่านี้ตามลำพัง..."
 murders_at_court.9003.e:0 "โอ้... ข้า– ข้าขอโทษจริงๆ"

 murders_at_court.9004.t:0 "ฆาตกรรมในราชสำนัก: จับได้คาหนังคาเขา"
 murders_at_court.9004.desc_letter_event:0 "[watson.GetTitledFirstName] และข้าใช้เวลาหลายชั่วโมงคร่ำเคร่งกับจดหมายฉบับนั้น แต่กลิ่นนี้... โอ้ มันเหมือนกลิ่นของ [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] ข้า [murderer.GetTitledFirstName]!"
 murders_at_court.9004.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า [victim.GetTitledFirstName] และ [murderer.GetTitledFirstName] หายตัวไปทั้งคู่"\n\nข้าโบกมือให้ทหารยามออกไปและพบความตื่นตระหนกแบบเดียวกันในดวงตาของ [watson.GetTitledFirstNamePossessive] ดังที่ข้ารู้สึกในใจตนเอง [murderer.GetTitledFirstNameNoTooltip] อาจจะ..."
 murders_at_court.9004.desc_ending:1 "\n\nเมื่อเราตามรอย [murderer.GetTitleAsNameNoTooltip] พบในที่สุด [murderer.GetSheHe] กำลังคืบคลานเข้าหา [victim.GetTitledFirstName] โดยมีมีดอยู่ในมือ\n\n"หยุดอยู่ตรงนั้น!""

 murders_at_court.9021.t:1 "ฆาตกรรมในราชสำนัก: เวทมนตร์มืด"
 murders_at_court.9021.desc:3 "เมื่อทหารยามของข้าและข้าตามรอย [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] พบในที่สุด [murderer.GetSheHe] กำลังคุกเข่าเปลือยเปล่าอยู่หน้าตำราเก่าแก่เล่มหนึ่ง หน้าผากกดแนบกับพื้นและแขนยกขึ้นเหนือศีรษะของ [murderer.GetHerHis] ในมุมที่แทบจะผิดธรรมชาติ\n\n"

 murders_at_court.9031.t:1 "ฆาตกรรมในราชสำนัก: ความหิวโหย"
 murders_at_court.9031.desc:2 "เมื่อทหารยามของข้าและข้าตามรอย [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] พบในที่สุด [murderer.GetSheHe] กำลังแทะสิ่งที่ดูเหมือน #EMP นิ้วมือ#! มนุษย์อยู่"

 murders_at_court.9041.t:0 "ฆาตกรรมในราชสำนัก: หลบหนีไปได้"
 murders_at_court.9041.desc_opening:0 "สิ่งเดียวที่รอข้าอยู่เมื่อข้าตามรอย [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] พบในที่สุดคือ"
 murders_at_court.9041.desc_witch:0 "เศษกระดูก สิ่งที่ดูคล้ายดวงตามนุษย์อย่างน่าสงสัย และ"
 murders_at_court.9041.desc_cannibal:0 "เศษกระดูกที่ดูเหมือนถูกแทะ และ"
 murders_at_court.9041.desc:0 "จดหมายเย้ยหยันความพยายามของข้า ไม่พบตัว [murderer.GetTitledFirstNameNoTooltip] [murderer.GetHerselfHimself] เลย"
 murders_at_court.9041.a:0 "ทุกคนจะรู้ถึงการกระทำผิดของพวกเขา!"
 murders_at_court.9041.b:0 "เป็นการดีที่สุดที่จะเก็บเรื่องนี้เงียบไว้..."

 murders_at_court.9099.t:1 "ฆาตกรรมในราชสำนัก: การต่อรองอันเปื้อนเลือด"
 murders_at_court.9099.t_wrong:0 "ฆาตกรรมในราชสำนัก: ความผิดพลาด"
 murders_at_court.9099.desc_wrong:0 "เมื่อข้าตามรอย [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] พบในที่สุด [murderer.GetSheHe] ไม่แม้ แต่จะพยายามหนี อันที่จริง [murderer.GetSheHe] มองข้าด้วยความสับสนอย่างที่สุด\n\n"ในที่สุดข้าก็พบเจ้า ฆาตกร!"\n\n"ขออภัย อะไรนะ? ท่านคิดว่า #EMP ข้า#! สังหารคนเหล่านั้นทั้งหมดงั้นหรือ?!"
 murders_at_court.9099.desc_nothing:1 "เมื่อข้าตามรอย [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] พบในที่สุด [murderer.GetSheHe] ไม่แม้ แต่จะพยายามหนีข้าและทหารยาม\n\n"
 murders_at_court.9099.desc:1 ""สวัสดี [ROOT.Char.GetFirstNameNoTooltip]" [murderer.GetSheHe] กล่าว มองข้าตั้งแต่หัวจรดเท้า "ถึงเวลาเสียทีที่เจ้าจะหาข้าพบ ข้าถือว่าเจ้าคงเพลิดเพลินกับ... #EMP ของขวัญ#! ของข้าสินะ?"\n\nรอยยิ้มที่ปรากฏขึ้นบนใบหน้าของ [murderer.GetHerHis] ทำให้ข้าเสียวสันหลังวาบ"

 murders_at_court.9989.desc:0 "อย่างไรก็ตาม ข้าอดสังเกตไม่ได้ว่าการฆาตกรรมหยุดลงทันทีที่ [murderer.GetTitledFirstName] ออกจากราชสำนักไป..."
 murders_at_court.9989.a:0 "ข้าจะจับตาดูคนผู้นั้นไว้"

 murders_at_court.9999.t:1 "ฆาตกรรมในราชสำนัก: คำสาปถูกถอน"
 murders_at_court.9999.desc_opening:1 "เมื่อเวลาผ่านไปและไม่มีศพใหม่ปรากฏขึ้น ข้าก็ค่อยๆ ผ่อนคลายลงอีกครั้ง ฆาตกรหยุดแล้ว!\n\n"
 murders_at_court.9999.desc:1 "อย่างไรก็ตาม ข้าอดสังเกตไม่ได้ว่าการฆาตกรรมหยุดลงทันทีที่ [murderer.GetTitledFirstName] ตาย..."
 murders_at_court.9999.a:0 "บัดนี้เมื่อ [murderer.GetSheHe] จากไปแล้ว ข้าอาจไม่มีวันรู้แน่ชัด..."
