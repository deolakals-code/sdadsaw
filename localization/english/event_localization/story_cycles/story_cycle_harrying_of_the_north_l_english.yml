 #Maintenance
 ep3_story_cycle_harrying.0001.t: "ค้อนทุบลงมา"
 ep3_story_cycle_harrying.0001.desc: "เมื่อผู้ปกครองเอเธลลิงคนสุดท้ายถูกถอดถอนจากอำนาจ, การกวาดล้างแดนเหนืออาจกล่าวได้อย่างแท้จริงว่าสิ้นสุดลงแล้ว\n\n"
 ep3_story_cycle_harrying.0001.desc.hereward: "จะไม่มีผู้ใดท้าทายบัลลังก์แห่ง[england.GetName] อีกต่อไป เหล่าขุนนางแองโกล-แซกซอนกระจัดกระจาย อ่อนน้อมและสงบนิ่ง ถูกริบยศถาบรรดาศักดิ์และอำนาจไปสิ้น ทุกผู้ล้วนหมอบคลานแทบเท้าของ[ruler_england.GetTitledFirstNamePossessive]\n\nจุดมุ่งหมายของข้าสูญสิ้นแล้ว เมื่อพวกนอร์มันมาตั้งรกราก ณ ที่นี้แล้ว ก็ไร้ ซึ่งความหวังสำหรับอนาคตของชาวแองโกล-แซกซอน อย่างดีที่สุด เราจะหลอมรวมและกลายเป็นส่วนหนึ่งของผืนแผ่นดินนี้ อย่างเลวร้ายที่สุด เราจะหายสาบสูญไปจากหน้าประวัติศาสตร์โดยสิ้นเชิง"
 ep3_story_cycle_harrying.0001.desc.william: "ข้าขึ้นสู่อำนาจสูงสุด: ไม่มีผู้ใดกล้าท้าทายอำนาจของข้าใน [england.GetName] เหล่าขุนนางแองโกล-แซกซันกระจัดกระจาย, อ่อนน้อมและสงบเสงี่ยม, แสดงความเคารพต่อข้าด้วยความกลัวการลงทัณฑ์เพิ่มเติม แต่ละคนจะจุมพิตแหวนของข้าและยอมจำนนต่อหน้าข้าก่อนสิ้นปี\n\nการปกครองของข้าไม่มีผู้ใดโต้แย้ง, และบัดนี้ข้าสามารถก้าวไปสู่ความทะเยอทะยานที่ยิ่งใหญ่กว่าเดิมได้แล้ว"
 ep3_story_cycle_harrying.0001.desc.therest: "การต่อต้านอันดุเดือดที่ [ruler_england.GetTitledFirstName] เผชิญหน้าได้สลายไปในที่สุดเมื่อเผชิญกับการลงทัณฑ์อันขมขื่น บัดนี้การปกครองของนอร์มันเหนือ [england.GetName] ไม่มีผู้ใดโต้แย้งแล้ว"
 ep3_story_cycle_harrying.0001.a: "อุดมการณ์ของข้าล้มเหลวแล้ว"
 ep3_story_cycle_harrying.0001.b: "แผ่นดินของข้ามิได้แตกแยกอีกต่อไป"
 ep3_story_cycle_harrying.0001.c: "น่าสนใจ"

 ep3_story_cycle_harrying.0002.t: "การกลับมา"
 ep3_story_cycle_harrying.0002.desc: "เมื่อชาวแองโกล-แซกซันกลับขึ้นสู่บัลลังก์แห่ง [england.GetName] อีกครั้ง, การกวาดล้างแดนเหนืออาจกล่าวได้อย่างแท้จริงว่าสิ้นสุดลงแล้ว\n\n"
 ep3_story_cycle_harrying.0002.desc.hereward: "อุดมการณ์ของเราชอบธรรม, ความท้าทายยิ่งใหญ่, การลงทัณฑ์ขมขื่น ทว่าจิตวิญญาณแองโกล-แซกซันยังคงอยู่, และบัดนี้เรากลับคืนสู่ตำแหน่งอันชอบธรรมในศูนย์กลางอำนาจในดินแดนเหล่านี้\n\nบัดนี้ข้าต้องวางดาบลง บางทีอาจยังไม่ถึงกับตีมันเป็นคันไถ, เพราะศัตรูของอาณาจักรยังคงมีอยู่มากมาย, แต่ตำนานแห่งเวกต้องค่อยๆ เลือนหายไปจากความทรงจำ"
 ep3_story_cycle_harrying.0002.desc.ruler: "ผู้บุกรุกชาวนอร์มันละลายหายไปต่อหน้าเรา บ้างยังคงยึดมั่นในอำนาจของตน, บ้างกลับสู่บ้านเกิดเมืองนอน, และอีกมากนอนอยู่ใต้ผืนหญ้าอันงดงามของอังกฤษ\n\nไม่มีผู้ใดกล้าท้าทายตำแหน่งของข้า"
 ep3_story_cycle_harrying.0002.desc.therest: "การรุกรานที่ประสบความสำเร็จได้กลายเป็นฝันร้ายอย่างรวดเร็วสำหรับผู้บุกรุกชาวนอร์มัน, และการขึ้นสู่อำนาจของ [ruler_england.GetTitledFirstName] ได้ยุติความทะเยอทะยานของต่างชาติที่มีต่อบัลลังก์ในที่สุด สำหรับตอนนี้"
 ep3_story_cycle_harrying.0002.a: "ขอให้มันเลือนหายไปอย่างรวดเร็ว, และอย่างมีความสุข"
 ep3_story_cycle_harrying.0002.b: "แผ่นดินของข้ามิได้แตกแยกอีกต่อไป"
 ep3_story_cycle_harrying.0002.c: "น่าสนใจ"

 ep3_story_cycle_harrying.0003.t: "ช่วงเวลาที่ไม่แน่นอน"
 ep3_story_cycle_harrying.0003.desc: "ความขัดแย้งอันขมขื่นที่โหมกระหน่ำระหว่างผู้ปกครองชาวนอร์มันและขุนนางแองโกล-แซกซันได้ทำลายล้างทั้งสองฝ่าย, พร้อมผลลัพธ์ที่คาดไม่ถึงอย่างแท้จริง\n\nบัดนี้ [ruler_england.GetCulture.GetCollectiveNounNoTooltip] ควบคุมบัลลังก์แห่ง [england.GetName], โดย [ruler_england.GetTitledFirstName] ปกครองจากศูนย์กลางอำนาจเหนือดินแดนที่เสียหายและแตกสลาย การกวาดล้างแดนเหนือได้จางหายไปเป็นผล, สองฝ่ายที่ทำสงครามกันไม่สามารถดำเนินความขัดแย้งต่อไปได้อีก\n\nอนาคตของอาณาจักรไม่แน่นอน, และหลายสิ่งยังคงไม่แน่นอนในช่วงเวลาแห่งการเปลี่ยนแปลงนี้"
 ep3_story_cycle_harrying.0003.a: "ยังคงต้องรอดูว่านี่คือการปรับปรุงที่ดีขึ้นหรือไม่..."
 ep3_story_cycle_harrying.0003.b: "ข้าจักรวมดินแดนที่แตกต่างเหล่านี้ให้เป็นหนึ่งเดียว"
 ep3_story_cycle_harrying.0003.c: "น่าสนใจ"

 ep3_story_cycle_harrying.0004.t: "ยุคสมัยที่ผ่านพ้น"
 ep3_story_cycle_harrying.0004.desc: "หลายปีผ่านไปนับตั้งแต่การรุกรานอังกฤษของชาวนอร์มัน\n\n"
 ep3_story_cycle_harrying.0004.desc.ruler: "นานมาก, อันที่จริง, จนชาวบ้านท้องถิ่นแทบจำไม่ได้แล้วว่าเหตุใดพวกเขาจึงโกรธแค้นต่อการปกครองของข้าอย่างรุนแรง พวกเขาวางดาบลงมากขึ้นเรื่อยๆ, ไม่เต็มใจที่จะสานต่อการต่อสู้ของปู่ย่าตายายอีกต่อไป\n\nบัดนี้การปกครองของข้าแทบไม่มีผู้ใดตั้งคำถาม, และข้าไม่จำเป็นต้องดำเนินโครงการปราบปรามนี้ต่อไปอีกแล้ว การกวาดล้างแดนเหนือสิ้นสุดลงแล้ว"
 ep3_story_cycle_harrying.0004.desc.anglo_saxon: "ผู้ที่เคยอยู่เมื่อหลายสิบปีก่อนได้จากไปแล้ว, ร่างกายของพวกเขากลายเป็นปุ๋ยให้แก่ทุ่งนา แม้ แต่ลูกๆ ของพวกเขาก็ผมขาวและแก่ชราแล้ว ลูกๆ ของพวกเขาในทางกลับกันก็ละทิ้งการต่อสู้ของบรรพบุรุษมากขึ้นเรื่อยๆ เพื่อการอยู่ร่วมกันอย่างสันติ ในทางกลับกัน, [ruler_england.GetCulture.GetCollectiveNounNoTooltip] บนบัลลังก์ก็ถอนมือแห่งการกดขี่, ไม่เห็นประโยชน์ของความขัดแย้ง เช่นนั้นอีกต่อไป\n\nการกวาดล้างแดนเหนือสิ้นสุดลงแล้ว"
 ep3_story_cycle_harrying.0004.desc.therest: "เวลาผ่านไปนานพอที่ชาวแองโกล-แซกซันรุ่นปัจจุบันในอังกฤษแทบจำไม่ได้แล้วว่าพวกเขากำลังต่อสู้เพื่อสิ่งใด ผู้ปกครอง [ruler_england.GetCulture.GetCollectiveNounNoTooltip] เป็นส่วนหนึ่งของผืนแผ่นดิน, และน้อยคนนักในทั้งสองฝ่ายที่มีเหตุผลมากพอที่จะดำเนินความขัดแย้งต่อไป\n\nการกวาดล้างแดนเหนือสิ้นสุดลงแล้ว"
 ep3_story_cycle_harrying.0004.a: "พวกเขาเป็นส่วนหนึ่งของอาณาจักรนี้, เช่นเดียวกับเรา"
 ep3_story_cycle_harrying.0004.b: "ให้เราก้าวไปข้างหน้า, ด้วยมิตรภาพ"
 ep3_story_cycle_harrying.0004.c: "น่าสนใจ"

 ### WILLIAM EVENTS
 ep3_story_cycle_harrying.1000.t: "ลุกเป็นไฟ"
 ep3_story_cycle_harrying.1000.desc: "ด้วยเหล่าขุนนางแองโกล-แซกซันผู้ขุ่นเคืองกำลังดำเนินตามอุดมการณ์อันถึงกาลอวสานของตน ข้าใช้เวลายามเย็นหลายคราใคร่ครวญหาวิถีทางที่จะถอดถอนอำนาจของพวกเขา\n\nการบุกเข้าไปและริบตำแหน่งของพวกเขาย่อมก่อให้เกิดความโกลาหล แต่ชีวิตของ [ROOT.Char.GetLadyLord] นั้นขึ้นอยู่กับการทำงานของเหล่าไพร่ เราอยู่เหนือพวกเขา ได้รับการ แต่งตั้งโดย [ROOT.Char.GetFaith.HighGodName] หาก แต่เป็นผ่านแรงงานอันหนักหน่วงของพวกเขาที่อำนาจของเราเฟื่องฟู\n\nธัญพืชนั้น ก็คือสายเลือดหล่อเลี้ยงชีวิตของเหล่าไพร่ ธัญพืชน้อยลงหมายถึงไพร่ที่น้อยลง ยิ่งไพร่มีน้อยลงเท่าใด [ROOT.Char.GetLadyLord] ก็ยิ่งอ่อนแอลงเท่านั้น และยิ่ง [ROOT.Char.GetLadyLord] อ่อนแอลง..."
 ep3_story_cycle_harrying.1000.a: "ธัญพืชทุกเมล็ดใน [crop_duchy.GetNameNoTooltip] จักต้องถูกทำลาย"
 ep3_story_cycle_harrying.1000.b: "เหลือไว้เพียงขั้นต่ำสุด ที่เหลือเผาทิ้งให้หมด"
 ep3_story_cycle_harrying.1000.c: "หากพวกเขาต้องการธัญพืช, พวกเขาต้องจ่ายเพื่อมัน"
 every_county_in_duchy_aetheling: "ทุก [county|E] ใน [crop_duchy.GetName]"

 ep3_story_cycle_harrying.1005.t: "ถนนเกรทนอร์ธโรด"
 ep3_story_cycle_harrying.1005.desc: ""แดนเหนือรึ?" [marshal.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] ของข้า, ครุ่นคิดอยู่ครู่หนึ่ง "การรุกรานจากโพ้นทะเลนานหลายปีได้มอบวัฒนธรรมที่แตกต่างจากที่ท่านจะพบเจอทางใต้นี้ให้แก่พวกเขา" [marshal.GetSheHe|U] ลากนิ้วไปบนแผนที่ที่กางอยู่เบื้องหน้าเรา\n\n"ท่านเห็นเส้นนี้หรือไม่? พวกเขาเรียกมันว่าถนนเกรทนอร์ธโรด" [marshal.GetSheHe|U] ลูบคางของ [marshal.GetHerHis] อย่างครุ่นคิด "ตามธรรมเนียมแล้ว มันเป็นเส้นทางบกที่เชื่อถือได้เพียงเส้นทางเดียวสู่แดนเหนือ, แต่มันทรุดโทรมลงมาก"\n\nข้าเห็นปัญหาที่แก้ไม่ตก เส้นทาง เช่นนี้เป็นทั้งพรและคำสาป การรับประกันความปลอดภัยในการเดินทางสำหรับตัวเรานั้นสำคัญยิ่ง, แต่ถนนใดๆ ก็สามารถใช้ได้โดยทั้งสองฝ่าย..."
 ep3_story_cycle_harrying.1005.a: "บูรณะถนน, และเพิ่มยามติดอาวุธ"
 ep3_story_cycle_harrying.1005.b: "เราต้องการถนนที่มีคุณภาพดี"
 ep3_story_cycle_harrying.1005.c: "ทำลายทุกๆ หลาของมันที่อยู่ในการควบคุมของแองโกล-แซกซัน"
 ep3_story_cycle_harrying.1005.a.tt: "ทุก [county|E] บน [Glossary( 'เกรตนอร์ทโรด', 'GNR_GLOSS' )]"
 ep3_story_cycle_harrying.1005.c.tt1: "[counties|E] ทั้งหมดที่ถือครองโดยแองโกล-แซกซันบน [Glossary( 'เกรตนอร์ทโรด', 'GNR_GLOSS' )]:"
 ep3_story_cycle_harrying.1005.c.tt2: "[counties|E] ทั้งหมดที่ถือครองโดยนอร์มันบน [Glossary( 'เกรตนอร์ทโรด', 'GNR_GLOSS' )]:"
 GNR_GLOSS: "ถนนที่สร้างโดยชาวโรมันทอดยาวไปตามแนวกระดูกสันหลังส่วนใหญ่ของอังกฤษ ถนนเกรทนอร์ธโรดวิ่งผ่าน [counties|E] ต่อไปนี้:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_middlesex').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_hertfordshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_bedford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_northamptonshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_leicestershire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_nottinghamshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_west_riding').GetBaseName]""

 ep3_story_cycle_harrying.1010.t: "ตัดสินชะตากรรม"
 ep3_story_cycle_harrying.1010.desc: "ช่างโชคร้ายเสียจริงที่ต้องเป็นเชลยศึก สัตว์โลก เช่นนั้นตนหนึ่งมองข้าอย่างบึ้งตึงผ่านลูกกรงห้องขังของ [captured.GetHerHis]\n\n"ข้ามีค่า, ท่านรู้หรือไม่" เสียงของ [captured.GetHerHis|U] เบาและแหลม, แหบแห้งจากการอยู่ในคุกใต้ดินหลายวัน "ข้าคือ [captured.GetFirstName], แห่งตระกูล [captured.GetHouse.GetBaseName] หากท่านส่งข่าวไปยังครอบครัวของข้า ท่านจะได้ค่าไถ่ราคาดี"\n\nค่าไถ่งั้นรึ? นั่นก็คงจะดีอยู่หรอก, แต่ในช่วงเวลาแห่งความทุกข์ยาก เช่นนี้ [captured.GetWomanMan] ที่มีสถานะ เช่นนี้อาจมีประโยชน์ในฐานะสารมากกว่าเป็นเครื่องต่อรองเพื่อเพียงแค่ทองคำ..."
 ep3_story_cycle_harrying.1010.a: ""เจ้าเลือกต่อต้าน [ROOT.Char.GetWomanMan] ผิดคนแล้ว, [captured.Custom('GirlBoy')]""
 ep3_story_cycle_harrying.1010.b: ""ข้าจะปล่อยเจ้าไป แต่ข้าจะทิ้งเครื่องเตือนใจถึง #EMP การต้อนรับขับสู้#! ของข้าไว้ให้""
 ep3_story_cycle_harrying.1010.c: ""เจ้ามีกิริยาท่าทางที่ดี กิริยาท่าทางแบบ #EMP [ROOT.Char.GetCulture.GetNameNoTooltip] เสียด้วยซ้ำ...""
 ep3_story_cycle_harrying.1010.c.success: "[captured.GetSheHe|U] ยอมรับข้อเสนอของท่าน"
 ep3_story_cycle_harrying.1010.c.failure: "[captured.GetSheHe|U] เยาะเย้ยข้อเสนอของท่าน"
 ep3_story_cycle_harrying.1010.d: ""เจ้าจงเน่าเปื่อยอยู่ในนี้จนกว่าค่าไถ่ของเจ้าจะถูกจ่าย""

 ep3_story_cycle_harrying.1011.t: "[ROOT.Char.GetCulture.GetNameNoTooltip] ที่แท้จริง"
 ep3_story_cycle_harrying.1011.desc: "น่าประหลาดใจที่ [captured.GetWomanMan] ผู้นั้นพิจารณาข้อเสนอของข้า\n\n"ข้าจะกลายเป็น... ชาว [ROOT.Char.GetCulture.GetName] รึ?" [captured.GetSheHe|U] เอ่ยคำนั้นออกมา, พิจารณาถึงผลกระทบ "และข้าจะได้รับการยอมรับเป็นหนึ่งในพวกท่านรึ?"\n\nข้าใช้เวลาครู่หนึ่งเพื่อสำรวจผลกระทบของข้อเสนอที่ข้าทำไปอย่างเร่งรีบ เช่นกัน หากข้าจะปกครองดินแดนนี้, ข้าต้องการเพื่อนร่วมชาติ [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] รอบตัวข้าให้มากที่สุดเท่าที่จะเป็นไปได้ การยอมรับอดีตผู้ปกครองเข้ามาในกลุ่มอาจช่วยเร่งการยอมรับของเราจากเหล่าไพร่ได้, แม้ว่าเราจะมีท่าทีเป็นชาวต่างชาติก็ตาม"
 ep3_story_cycle_harrying.1011.desc.spouse: "\n\nความคิดหนึ่งผุดขึ้นมาโดยไม่คาดคิด [spouse_courtier.GetFirstName]! บางที [spouse_courtier.GetSheHe] อาจเป็นคู่สมรสที่เหมาะสม..."
 ep3_story_cycle_harrying.1011.a.spouselanguage: ""[spouse_courtier.GetWifeHusband] คนใหม่ของเจ้าจะช่วยให้เจ้าเรียนรู้ภาษาได้อย่างรวดเร็ว เช่นกัน""
 ep3_story_cycle_harrying.1011.a.language: ""และเจ้าจะเป็นคนที่ดี เช่นกัน, เมื่อเจ้าเรียนรู้ [ROOT.Char.GetCulture.GetLanguage.GetName]""
 ep3_story_cycle_harrying.1011.b: ""ไปเสียเถิด, และจงเป็นอิสระ""

 ep3_story_cycle_harrying.1015.t: "เปลวไฟริบหรี่"
 ep3_story_cycle_harrying.1015.desc: "#EMP นั่นแหละ#!, ข้าคิดขณะที่ไฟลุกโชนสูงขึ้น, คือสิ่งที่เจ้าได้รับจากการปลุกระดม\n\n[offending_village.GetName] เคยเป็นรังของการปลุกปั่นต่อต้านการปกครองของข้า อาคารที่ถูกเผา ซึ่ง จนกระทั่งเมื่อไม่นานมานี้เคยเป็นที่หลบภัยสำหรับผู้เห็นต่างเหล่านั้น บัดนี้ปล่อยควันบางๆ ขึ้นสู่อากาศ ข้ามองดูมัน, รู้สึกถึงความโกรธของตนเองที่พลุ่งพล่านขึ้นพร้อมกับมัน\n\nพวกมัน #EMP กล้า#! ท้าทายข้าได้อย่างไร? ส่วนที่เหลือของสถานที่แห่งนี้ก็สมรู้ร่วมคิดด้วย: พวกเขาทุกคนย่อมรู้ดีว่ากลุ่มนั้นกำลังวางแผนอะไรอยู่ ไม่มีผู้ใดพ้นจากความผิด!"
 ep3_story_cycle_harrying.1015.a: "เผาอาคารอีกหลัง"
 ep3_story_cycle_harrying.1015.b: "พวกเขาต้องเรียนรู้การเชื่อฟัง ย้ายถิ่นฐานประชากรครึ่งหนึ่ง"
 ep3_story_cycle_harrying.1015.c: "ข้าต้องควบคุมตนเอง"
 ep3_story_cycle_harrying.1015.c.tt: "มิฉะนั้นแล้ว, จะเหลืออาณาจักรอันใดให้ปกครองเล่า?"
 all_neighbouring_villages: "[holdings|E] ทั้งหมดที่อยู่ติดกับ [offending_village.GetName]"

 ###AETHELING EVENTS
 ep3_story_cycle_harrying.2000.t: "วิญญาณที่แตกสลาย"
 ep3_story_cycle_harrying.2000.desc: "ชาวเมือง [location.GetName] กำลังทุกข์ทรมาน: ข้อจำกัดด้านธัญพืชที่กำหนดโดย [william.GetTitledFirstNameRegnal] เริ่มส่งผลกระทบอย่างแท้จริง, ดูดไขมันออกจากกระดูกของพวกเขา สัตว์โลกผู้น่าสงสาร เช่นนั้นตนหนึ่งจำท่าทางของข้าได้, และทิ้งตัว [starving_man.GetHerselfHimself] ลงเบื้องหน้าข้าเพื่อขอทาน\n\n"ได้โปรด!" [starving_man.GetSheHe|U] ประกาศ, นิ้วผอมเกร็งเกาะกุมขาของข้า "ข้าไม่ได้กินอะไรมาสองวันแล้ว สองวันก่อนหน้านั้นข้ากินเพียงมื้อเดียว ได้โปรด, ได้โปรด... #DIE1 ท่านต้องทำ #EMP อะไรสักอย่าง...#!#!""
 ep3_story_cycle_harrying.2000.notcallous: "\n\n[starving_man.GetWomanMan] ผู้น่าสงสารนี้"
 ep3_story_cycle_harrying.2000.a: "จ่ายค่าสินค้านำเข้า, ด้วยเหรียญของข้าเอง"
 ep3_story_cycle_harrying.2000.b: ""มากับข้า ข้าจะเลี้ยงเจ้าเอง""
 ep3_story_cycle_harrying.2000.c: "บางทีข้าอาจหาวิธีแก้ไขปัญหานี้ได้?"
 ep3_story_cycle_harrying.2000.c.success: "วิธีการเพิ่มผลผลิตทางการเกษตรของท่านได้ผล"
 ep3_story_cycle_harrying.2000.c.failure: "วิธีการของท่านไม่ได้ผล"

 ep3_story_cycle_harrying.2001.opening: "[marshal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_story_cycle_harrying.2001.desc: "เมื่อการผลิตอาหารในพื้นที่เริ่มมีเสถียรภาพ, ผู้คนจำนวนมากที่เคยอ่อนแอเกินกว่าจะทำงานได้ บัดนี้เสนอตัวเข้ารับใช้\n\nผู้ที่มีร่างกายแข็งแรงที่สุดในหมู่พวกเขาเสนอตัวเป็นนักรบเพื่ออุดมการณ์ของท่าน!"
 ep3_story_cycle_harrying.2001.a: "รับพวกเขาเข้ามา!"
 ep3_story_cycle_harrying.2001.b: "บัดนี้ข้าไม่ต้องการนักรบ"
 ep3_story_cycle_harrying.2001.b.tt: "แต่บางทีในอนาคต..."

 ep3_story_cycle_harrying.2005.t: "การรอการประหาร"
 ep3_story_cycle_harrying.2005.desc: "เมื่อท่านเป็น [ROOT.Char.GetLadyLord] ที่มีสถานะ เช่นข้า, บางครั้งท่านต้องตัดสินใจเรื่องยากลำบาก ด้วยเหตุนี้เอง เมื่อฆาตกรท้องถิ่นผู้ฉาวโฉ่ถูกนำตัวมาเบื้องหน้าข้าในโซ่ตรวน, ข้าจึงสั่งให้ [spymaster.GetFirstName] มัดตัว [murderer.GetHerHim] ลงไปที่คลังอาวุธ เพื่อให้เราสามารถพูดคุยกันเป็นการส่วนตัวได้\n\n[murderer.GetWomanMan] ผู้นั้นมองข้าอย่างสงสัย ไม่ต้องสงสัยเลยว่าหากไม่มีการแทรกแซงของข้า [murderer.GetSheHe] จะต้องแกว่งไกวอยู่บนตะแลงแกงภายในสิ้นสัปดาห์นี้ ข้ามองไปที่ [spymaster.GetFirstNameNoTooltip] เพื่อยืนยันและได้รับการพยักหน้าตอบกลับ\n\n"ข้าต้องการ [murderer.GetWomanMan] ที่มีความสามารถ เช่นเจ้า...""
 ep3_story_cycle_harrying.2005.a: "เราต้องมุ่งเป้าไปที่เป้าหมายสูงสุดที่เป็นไปได้"
 ep3_story_cycle_harrying.2005.b: "รับทองคำนี้ไป, จ้างอันธพาลบางส่วน..."
 ep3_story_cycle_harrying.2005.b.tt: "และสังหารชาวนอร์มันทุกคนที่เจ้าพบใน [willy_vassal.GetName]"
 ep3_story_cycle_harrying.2005.c: "เจ้าดูเหมือนเป็น [murderer.GetWomanMan] ที่มีประโยชน์ควรเก็บไว้ใกล้ตัว"

 ep3_story_cycle_harrying.2010.t: "ความพยายามในสงคราม"
 ep3_story_cycle_harrying.2010.desc: "ในฐานะหนึ่งในเอเธลลิงที่ทรงอำนาจที่สุด, เป็นหน้าที่ของข้าที่จะรวบรวมเหล่าขุนนางผู้น้อยเพื่อสนับสนุนอุดมการณ์อันชอบธรรมของเรา ด้วยเดิมพันที่สูง เช่นนี้, พวกเขาทุกคนต่างประหม่าที่จะทุ่มเทกำลังสนับสนุนอย่างเต็มที่, แต่เราต้องการพวกเขาเพื่อบรรลุภารกิจของเรา\n\nคำถามเดียวคือ, เราต้องการการสนับสนุนประเภทใดกันแน่? ทองคำย่อมเป็นที่ต้อนรับเสมอ, แน่นอน, แต่บางทีข้าอาจกระตุ้นให้เกิดการปลุกระดมที่แข็งขันมากขึ้นได้? หรือบางที, เราต้องการการต่อต้านที่จัดตั้งขึ้นอย่างเหมาะสม?"
 ep3_story_cycle_harrying.2010.a: "การต่อต้านที่จัดตั้งขึ้นคือหนทางที่ควรไป"
 ep3_story_cycle_harrying.2010.a.critsuccess: "การต่อต้านทวีความรุนแรงขึ้นอย่างรวดเร็ว"
 ep3_story_cycle_harrying.2010.a.success: "การต่อต้านเพิ่มขึ้น"
 ep3_story_cycle_harrying.2010.a.failure: "คำร้องขอของท่านถูกเพิกเฉย"
 ep3_story_cycle_harrying.2010.a.critfailure: "ข้อความของท่านถูกสกัดกั้นโดยชาวนอร์มัน"
 ep3_story_cycle_harrying.2010.b: "ข้าจักขอของขวัญเป็นทองคำบางส่วน"
 ep3_story_cycle_harrying.2010.b.success: "ทองคำมาถึงอย่างรวดเร็ว"
 ep3_story_cycle_harrying.2010.b.failure: "เหล่าขุนนางเพิกเฉยต่อคำวิงวอนของท่าน"
 ep3_story_cycle_harrying.2010.c: "พวกเขาควรส่งเสริมให้ชาวบ้านลุกฮือขึ้น"
 county_list_tt: "[county|E] ทุกแห่งที่ชาวนอร์มันเป็นเจ้าของภายใน[realm|E]ของ[william.GetTitledFirstNamePossessive]"

 ep3_story_cycle_harrying.2015.t: "การสร้างสถานะ"
 ep3_story_cycle_harrying.2015.desc: "ขณะที่เอกสารที่ข้าร้องขอถูกส่งมอบให้ข้า ข้าแทบจะรู้สึกได้ว่ามือของข้าสั่นเทา เอกสารปลอมนั้นยอดเยี่ยมมาก ไม่มีใครสามารถสงสัยได้เลย ด้วยสิ่งนี้ การอ้างสิทธิ์ในดินแดนเหล่านี้ของข้าจึงไม่อาจปฏิเสธได้ และเรายังมีอีกมากสำหรับ Ætheling คนอื่นๆ\n\nอย่างไรก็ตาม คำถามที่ใหญ่กว่านั้นอยู่ใกล้แค่เอื้อม ข้าต้องการใช้ประโยชน์จากข้อได้เปรียบนี้เพื่ออะไรกันแน่? มีหลายวิธีที่จะโจมตีตำแหน่งของ[william.GetTitledFirstNamePossessive] และที่สำคัญกว่านั้นคือเสริมสร้างความแข็งแกร่งของเรา"
 ep3_story_cycle_harrying.2015.a: "มาดูกันว่า [william.GetHerHim] จะกำจัดเราได้อย่างไรหลังจากนี้..."
 ep3_story_cycle_harrying.2015.a.success: "[william.GetSheHe|U] ยอมจำนนอย่างโกรธเคือง"
 ep3_story_cycle_harrying.2015.a.failure: "[william.GetSheHe|U] ปฏิเสธอย่างแข็งขัน"
 ep3_story_cycle_harrying.2015.b: "อิสรภาพที่เพิ่มขึ้นบางส่วนอาจช่วยอุดมการณ์ของเราได้"
 ep3_story_cycle_harrying.2015.c: "ข้อตกลงพิเศษ, บางที..."

 ###HEREWARD EVENTS
 ep3_story_cycle_harrying.3000.t: "เพื่อประโยชน์ส่วนรวม"
 ep3_story_cycle_harrying.3000.desc: "ช่างเป็นโบสถ์น้อยที่สวยงามเสียนี่กระไร! ข้ายินดีที่การเดินทางไปยัง [neighboring_church.GetName] ของข้าได้นำข้ามาที่นี่ มันไม่ใช่โบสถ์เล็กๆ ที่ถ่อมตนด้วย, พิจารณาจากลวดลายอันงดงามบนของตก แต่ง ข้าสะดุ้งตื่นจากภวังค์ด้วยเสียงของ [bishop.GetFaith.PriestNeuter] ผู้หนึ่งพูดขึ้น\n\n"ข้ารู้ว่าท่านคือใคร" [bishop.GetSheHe|U] ยกมือขึ้นเพื่อห้ามการโต้แย้งใดๆ "ข้ารู้ด้วยว่าเหตุใดท่านจึงมาที่นี่ ชื่อเสียงของท่านมาก่อนท่าน, [ROOT.Char.GetFirstNameNoTooltip] หนุ่มน้อย, มีโอกาสน้อยมากที่ท่านจะไม่พบทางมาที่นี่ในไม่ช้า"\n\n"ทั้งหมดที่ข้าขอ — และสิ่งนี้ข้าขอร้องท่าน, ในฐานะ [bishop.GetWomanMan] แห่ง [bishop.GetFaith.HighGodName] — โปรดทิ้งวัตถุมงคลของเราไว้ที่เดิม เอาเหรียญไปหากท่านจำเป็นต้องเอาไป""
 ep3_story_cycle_harrying.3000.a: "...วัตถุมงคล, ท่านว่ารึ?"
 ep3_story_cycle_harrying.3000.b: "ข้าจักไม่ลดตัวลงต่ำถึงขั้นขโมยวัตถุมงคลจากโบสถ์"
 ep3_story_cycle_harrying.3000.b.tt: "... แต่ถุงเหรียญ, อย่างไรก็ตาม..."
 ep3_story_cycle_harrying.3000.c: ""[bishop.GetMotherFather|U]! ใจเย็นๆ ข้าไม่คิดฝันที่จะขโมยของจากท่าน""
 artifact_church_saint_brooch_name: "เข็มกลัดนักบุญ"
 artifact_church_saint_brooch_description: "เข็มกลัดเก่าแก่ทำจากดีบุกผสมตะกั่วประดับเงิน, กล่าวกันว่าเคยสวมใส่โดยนักบุญ [ROOT.Char.Custom('GetCatholicSaint')] มันถูกขโมยไปจากโบสถ์น้อยที่ [neighboring_church.GetName] โดย [ROOT.Char.GetFirstName]"

 ep3_story_cycle_harrying.3005.t: "คมดาบในสายหมอก"
 ep3_story_cycle_harrying.3005.desc: "ข้าย่อตัวลง, ชักดาบออกมา, ขณะที่หมอกปกคลุมรอบตัวข้าและกลุ่ม [ROOT.Char.GetWomenMen] ติดอาวุธหนัก แต่กลุ่มเล็กของข้า พวกเราทุกคนอยู่ห่างจากถนนเพียงไม่กี่หลา, ซึ่งบนถนนนั้นทหารรับจ้างชาวนอร์มันผู้หนึ่งกำลังหรี่ตามองเข้าไปในความมืดมัว\n\n[norman_soldier.GetSheHe|U] อยู่ที่หัวขบวนของสิ่งที่เสียงกระซิบในท้องถิ่นบอกเราว่าเป็นคาราวานที่เต็มไปด้วยอาวุธและชุดเกราะ, มุ่งหน้าไปยัง [vassal_county.GetName] การสกัดกั้นมันอาจเป็นการโจมตีครั้งใหญ่ต่อศัตรู, และของที่ปล้นมาได้อาจนำไปแจกจ่ายให้กับพันธมิตรของเราได้\n\nดาบที่ดูน่าเกรงขามของ [norman_soldier.GetWomanMan] ส่องประกายทึบๆ ขณะที่ข้าตรวจสอบดาบของตนเอง การต่อสู้ใดๆ ที่รออยู่ข้างหน้าจะเป็นงานที่หนักหนาสาหัสอย่างแท้จริง"
 ep3_story_cycle_harrying.3005.a: "บุกเข้าไปอย่างหนักหน่วงและรวดเร็ว; อาวุธเหล่านั้นเป็นของเรา!"
 ep3_story_cycle_harrying.3005.a.success: "การซุ่มโจมตีได้ผลอย่างสมบูรณ์แบบ"
 ep3_story_cycle_harrying.3005.a.failure: "การซุ่มโจมตีล้มเหลว"
 ep3_story_cycle_harrying.3005.b: "พันธมิตรของเราต้องการยุทโธปกรณ์นั้น"
 ep3_story_cycle_harrying.3005.b.tt: "ดาบทุกเล่มจะถูกส่งไปให้พวกเขา"
 ep3_story_cycle_harrying.3005.c: "เราต้องใช้สภาพอากาศนี้ให้เป็นประโยชน์"
 ep3_story_cycle_harrying.3005.c.tt: "หากเราสามารถหลบหนีไปและก่อวินาศกรรมบนถนนข้างหน้าได้, เราสามารถชะลอการมาถึงของพวกเขาได้อย่างมากโดยไม่ต้องต่อสู้"
 every_knight: "ทุก [knight|E]"
 every_anglo_vassal: "ทุก [vassal|E] ชาวแองโกล-แซกซันของ [william.GetTitledFirstName]"
 norman_sword_name: "ดาบนอร์มัน"
 stolen_norman_sword_name: "ดาบนอร์มันที่ถูกขโมย"
 stolen_norman_sword_description: "ดาบเล่มนี้มีลักษณะเด่นของงานฝีมือชาวนอร์มัน, พร้อมร่องดาบเด่นชัดทอดยาวไปตามความยาวที่เรียวลงของดาบอันงดงามเล่มนี้"

 ep3_story_cycle_harrying.3010.t: "เงินของเจ้าหรือชีวิตของเจ้า"
 ep3_story_cycle_harrying.3010.desc: "ลมพัดใบไม้สั่นไหวขณะที่ [norman_noble.GetTitledFirstName] โผล่ออกมาจากสะพานที่ [norman_noble.GetSheHe] กำลังเดินทางข้าม เสียงเบาๆ นั้นไม่ได้บดบังเสียงผิวปากแหลมที่ข้าเปล่งออกมา, และทันใดนั้นทางสัญจรทั้งหมดก็อาบไปด้วยเลือด\n\n[norman_noble.GetFirstNameNoTooltip|U] ร่วงหล่นจากอานม้าของ [norman_noble.GetHerHis] ขณะที่ลูกธนูปักเข้าที่สีข้างของม้า, หนึ่งในลูกธนูหลายดอกที่พุ่งออกมาจากแนวต้นไม้ขณะที่กับดักถูกใช้งาน\n\nอัศวินของข้าบุกไปข้างหน้าเพื่อต่อสู้และจับกุมคู่ต่อสู้ของพวกเขา ข้าเข้าใกล้ [norman_noble.GetTitleAsNameNoTooltip] ขณะที่ [norman_noble.GetSheHe] พยายามลุกขึ้นยืน, ชักดาบออกมาขณะที่ [norman_noble.GetSheHe] ทำ เช่นนั้น"
 ep3_story_cycle_harrying.3010.a: ""เตรียมอาวุธของเจ้าให้พร้อม, เจ้าหมานอร์มัน""
 ep3_story_cycle_harrying.3010.a.tt: "#V ดวล#! [norman_noble.GetFirstName] จนตาย\n[prowess|E]ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E]ของ[norman_noble.GetFirstNamePossessive]: [prowess_i]#V [norman_noble.GetProwess]#!"
 ep3_story_cycle_harrying.3010.b: ""ยอมมอบทรัพย์สมบัติของเจ้ามา แล้วข้าจะเรียกอัศวินของข้ากลับ""

 ep3_story_cycle_harrying.3011.t: "ทางรอด"
 ep3_story_cycle_harrying.3011.desc: "เลือดหยดจากดาบของข้าขณะที่ข้าเช็ดมันออก วันนี้เงียบสงัดแล้ว, การซุ่มโจมตีพิสูจน์แล้วว่ารวดเร็วและโหดร้าย เมื่อ [norman_noble.GetFirstName] ล้มลง, หลายคนในกลุ่มของ [norman_noble.GetHerHis] ก็ยกมือยอมจำนน การปกป้องขุนนางท้องถิ่นเป็นงาน, อย่างไรก็ตาม, ไม่ใช่สิ่งที่ต้องสละชีวิตให้ หนึ่งในนั้นทักทายข้าขณะที่ข้าเดินผ่าน\n\n"จะเกิดอะไรขึ้นกับพวกเรา?" [saxon_soldier_1.GetSheHe|U] ถาม, ด้วยน้ำเสียงประหม่าเล็กน้อย อีกคนหนึ่ง, ทางขวาของ [saxon_soldier_1.GetHerHis], พยักหน้าอย่างแรงเห็นด้วย\n\nข้าพิจารณาทั้งคู่ พวกเขาทั้งสองเป็นคนแข็งแรง, เห็นได้ชัดว่าสู้เก่ง, แต่ความดุร้ายของการโจมตีของเรา ทำให้พวกเขาประหลาดใจ พิจารณาจากสำเนียงแล้ว, พวกเขาไม่ใช่ชาวนอร์มัน เช่นกัน"
 ep3_story_cycle_harrying.3011.a: "พวกเจ้าสองคนอยากได้งานหรือไม่?"
 ep3_story_cycle_harrying.3011.b: ""กลับไปบ้านของพวกเจ้า ใช้ชีวิตให้ดี""

 ep3_story_cycle_harrying.3015.t: "จากทะเล"
 ep3_story_cycle_harrying.3015.desc: "เราไม่ใช่คนแปลกหน้าต่อการรุกรานจากต่างแดนในดินแดนเหล่านี้ ทว่าชาวต่างชาติกลุ่มสุดท้ายที่ปกครองได้กลายเป็นส่วนหนึ่งของผืนแผ่นดินนี้ ชาวเดนส์กลายเป็นเราและเรากลายเป็นพวกเขา, และจากการผสมผสาน เช่นนั้นก็เกิดครอบครัวของข้าขึ้นมา\n\nข้านั่งครุ่นคิด อังกฤษเป็นรางวัลที่ยิ่งใหญ่, และเป็นสิ่งที่ [danish_king.GetTitledFirstName] ไม่ต้องสงสัยเลยว่าจะอยากได้ ชาวเดนส์ปกครองอังกฤษไม่ใช่เรื่องใหม่; บัดนี้พวกเขาเป็นส่วนหนึ่งของเราแล้ว\n\nมือของข้ากระตุกไปทางแผ่นหนังและปากกาขนนก..."
 ep3_story_cycle_harrying.3015.a: "ชาวเดนส์ควรปกครอง, หากชาวแองโกล-แซกซันทำไม่ได้"
 ep3_story_cycle_harrying.3015.a.success: "[danish_king.GetFirstNameNoTooltip] ใช้คำร้องขอของท่านเพื่ออ้างสิทธิ์"
 ep3_story_cycle_harrying.3015.a.failure: "[danish_king.GetFirstNameNoTooltip] ปฏิเสธที่จะเข้ามาเกี่ยวข้อง"
 ep3_story_cycle_harrying.3015.b: "การขอทหารเป็นการเริ่มต้นที่ดี"
 ep3_story_cycle_harrying.3015.b.success: "[danish_king.GetFirstNameNoTooltip] ส่งทหารมาให้ท่าน"
 ep3_story_cycle_harrying.3015.b.failure: "[danish_king.GetFirstNameNoTooltip] ไม่สามารถแบ่งใครมาได้"
 ep3_story_cycle_harrying.3015.c: "ไม่มีจดหมาย นี่คือการต่อสู้ของเราเพียงลำพัง"

 ep3_story_cycle_harrying.3020.t: "ความสบายของคนทรยศ"
 ep3_story_cycle_harrying.3020.desc: "เสียงกระซิบที่มาถึงหูข้าใน [location.GetName] บัดนี้ดังเกินกว่าจะเพิกเฉยได้แล้ว เจ้าหนู [willy_vassal.GetTitledFirstName] นั่น เห็นได้ชัดว่ากำลังสบายเกินไปกับชีวิตภายใต้การปกครองของต่างชาติ, สบายเกินไปมาก\n\nสิ่งเดียวที่เลวร้ายยิ่งกว่าชาวนอร์มันคือผู้สมรู้ร่วมคิดชาวแองโกล-แซกซัน บางทีข้าควรไปเยี่ยม [willy_vassal.GetHerHim] และ ทำให้ [willy_vassal.GetHerHim] เห็นความผิดพลาดในวิถีทางของ [willy_vassal.GetHerHis]..."
 ep3_story_cycle_harrying.3020.a: "ข้าจะออกเดินทางทันที"
 ep3_story_cycle_harrying.3020.a.tt: "เริ่มเดินทางไปยัง [willy_vassal_capital.GetName]"
 ep3_story_cycle_harrying.3020.b: "ข้าควรปล่อยให้ [willy_vassal.GetHerHim] เน่าเปื่อยไป"

 ep3_story_cycle_harrying.3021.t: "เผชิญหน้ากับอสรพิษ"
 ep3_story_cycle_harrying.3021.desc: "ข่าวลือเป็นความจริง [willy_vassal.GetFirstName] เข้ากันได้ดีกับเจ้านายชาวนอร์มันของ [willy_vassal.GetHerHis] อย่างลึกซึ้ง ช่างมั่นใจเสียจริง, กำลังเดินทางกลับจากการประชุมลับบางอย่างกับพวกเขา, มีเพียงยามติดอาวุธไม่กี่คนกับ [willy_vassal.GetHerHim]\n\nข้าให้สัญญาณ เรากระโดดออกจากเงามืด, สหายของข้าจู่โจมยามของ [willy_vassal.GetHerHis] โดยไม่ทันตั้งตัว, จ่อดาบที่พวกเขา ข้าเข้าใกล้ [willy_vassal.GetFirstNameNoTooltip] [willy_vassal.GetHerselfHimself]\n\n"เจ้า... เจ้าคือ [ROOT.Char.GetHerHim], ใช่หรือไม่?" [willy_vassal.GetSheHe|U] พูดตะกุกตะกัก "คนที่พวกเขาพูดถึง คนที่อยู่ในเฟนส์...""
 ep3_story_cycle_harrying.3021.a: ""ชักดาบของเจ้าออกมา, เจ้าหนอนบ่อนไส้""
 ep3_story_cycle_harrying.3021.a.tt: "#V ดวล#! [willy_vassal.GetFirstName] จนตาย\n[prowess|E]ของท่าน: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E]ของ[willy_vassal.GetFirstNamePossessive]: [prowess_i]#V [willy_vassal.GetProwess]#!"
 ep3_story_cycle_harrying.3021.b: ""ข้าเพียงต้องการพูดคุย, [willy_vassal.GetFirstNameNoTooltip]""
 ep3_story_cycle_harrying.3021.b.success: "[willy_vassal.GetSheHe|U] เข้าร่วมฝ่ายท่าน"
 ep3_story_cycle_harrying.3021.b.failure: "[willy_vassal.GetSheHe|U] ปฏิเสธที่จะยอมรับข้อโต้แย้งของท่าน"
 ep3_story_cycle_harrying.3021.c: ""เจ้ากลัว #EMP [willy.GetHerHim]?#! รอจนกว่าเจ้าจะเห็นสิ่งที่ข้าทำได้...""
 ep3_story_cycle_harrying.3021.c.success: "[willy_vassal.GetSheHe|U] เข้าร่วมฝ่ายท่าน"
 ep3_story_cycle_harrying.3021.c.failure: "[willy_vassal.GetSheHe|U] จะไม่ยอมถูกข่มขู่"
 ep3_story_cycle_harrying.3021.d: ""ชาวแองโกล-แซกซันผู้ภักดีคนใดที่นี่, เจ้ามีที่อยู่เคียงข้างข้า""
 ep3_story_cycle_harrying.3021.d.flavour: "ข้ายอมแลกชีวิตเขาเพื่อชีวิตพวกเขาเป็นพันครั้ง"

 ep3_story_cycle_harrying.3022.t: "ไม่มีอีกแล้ว"
 ep3_story_cycle_harrying.3022.desc: "ข้าก้าวข้ามร่างไร้ชีวิตของ[willy_vassal.GetFirstNamePossessive] องครักษ์[willy_vassal.GetHerHis|U] กระจัดกระจายไป ไม่มีเหตุผลที่จะอยู่ที่นี่อีกต่อไป\n\n[willy_vassal.GetFirstNameNoTooltip] เป็น[willy_vassal.GetWomanMan] ที่มีความมั่งคั่งไม่น้อย และคงน่าเสียดายหากปล่อยให้สูญเปล่า นิ้วมือของข้าล้วงค้นกระเป๋าและถุง หยิบเหรียญบางส่วนที่นี่ [newly_created_artifact.GetName][willy_vassal.GetHerHis] ที่นั่น\n\nข้ายืนขึ้นอีกครั้ง มองลงไปที่ศพ\n\nถึงเวลาส่งสารแล้ว"
 ep3_story_cycle_harrying.3022.a: "ข้ารู้จักใครบางคนที่อาจชอบของขวัญ..."
 ep3_story_cycle_harrying.3022.b: "ผู้คนควรรู้ถึงความยุติธรรมที่เรามอบให้"

 ep3_story_cycle_harrying.3050.opening: "ถึงเฮริเวิร์ด, เจ้าหนูแห่งเฟนส์ผู้ฉาวโฉ่,"
 ep3_story_cycle_harrying.3050.desc: "ข้ามีข้อเสนอให้เจ้า\n\nเดินทางไปยัง [london.GetNameNoTier] โดยเร็วที่สุด; เจ้าจะอยากได้ยินสิ่งที่ข้าจะเสนอ\n\nอย่าให้ข้ารอนาน"
 ep3_story_cycle_harrying.3050.a: "ข้าจะฟัง [william.GetHerHim] พูด"
 ep3_story_cycle_harrying.3050.a.tt: "กำหนดเส้นทางไปยัง $cn_lunden$\n#Weak ข้าคงตายไปนานแล้วก่อนที่จะเรียกมันว่า "#EMP $cn_londres$"... #!#!"
 ep3_story_cycle_harrying.3050.b: "นี่เป็นกับดักอย่างชัดเจน"

 ep3_story_cycle_harrying.3051.t: "ไอ้ลูกนอกคอกบนบัลลังก์"
 ep3_story_cycle_harrying.3051.desc: "ช่างยิ่งใหญ่เสียจริงคือโถงแห่งอำนาจ [william.GetTitledFirstNameRegnal] นั่งอย่างแข็งทื่อบนบัลลังก์ขณะที่ข้าถูกนำตัวเข้าไปพบ [william.GetHerHim], แต่ความหรูหราของสภาพแวดล้อมของ [william.GetHerHis] ก็ช่วยบรรเทาท่าทางที่ไม่สบายนั้นได้บ้าง\n\n"[ROOT.Char.GetFirstNameNoTooltip] [ROOT.Char.GetWomanMan] ผู้เปลี่ยนดินแดนทางใต้ของวอชให้กลายเป็นโรงฆ่าสัตว์ เช่นนี้" ริมฝีปากของ [william.GetHerHis|U] บิดเบี้ยวด้วยความโกรธขณะที่ข้าไม่สามารถซ่อนความพอใจในคำอธิบายนั้นได้อย่างเต็มที่\n\n"ข้าไม่คิดว่าเจ้าจะมา คิดว่าเจ้าจะซ่อนตัวอยู่บนเกาะของเจ้า เห็นได้ชัดว่า, เจ้าเป็น [ROOT.Char.GetWomanMan] ที่มีเรื่องน่าประหลาดใจมากมาย"\n\nข้ามองกลับขึ้นไปที่ [william.GetHerHim], ไอ้ลูกนอกคอกชาวต่างชาติบนที่นั่งอันโด่ง ดังนั้น"
 ep3_story_cycle_harrying.3051.a: ""บัลลังก์นั้นดูใหญ่ไปหน่อยสำหรับเจ้า, ใช่หรือไม่?""
 ep3_story_cycle_harrying.3051.a.success: "[william.GetSheHe|U] ปล่อยผ่านไป"
 ep3_story_cycle_harrying.3051.a.failure: "[william.GetSheHe|U] เรียกร้องให้ท่านเงียบ"
 ep3_story_cycle_harrying.3051.b: ""ข้อเสนอของท่านคืออะไร?""
 ep3_story_cycle_harrying.3051.b.tt: "ไม่มีประโยชน์ที่จะต่อปากต่อคำ"

 ep3_story_cycle_harrying.3052.t: "ข้อตกลงกับปีศาจ"
 ep3_story_cycle_harrying.3052.desc: ""ข้ารู้จักเจ้า, [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDaughterSon')] ของ [father.GetFirstName] ข้ารู้ว่าเหตุใดเจ้าจึงทำสิ่งที่เจ้ากำลังทำอยู่ ข้ารู้ด้วยซ้ำว่าเหตุใดเจ้าจึงมาที่นี่" [william.GetFirstName] เอนตัวไปข้างหน้าขณะที่ [william.GetSheHe] พูด, จ้องมองข้าด้วยสายตาของ [william.GetHerHis]\n\n"ข้ารู้ว่าสิ่งใดขับเคลื่อนเจ้า, และข้ารู้ว่าเจ้าต้องการอะไร" [william.GetSheHe|U] หยิบม้วนกระดาษจากข้างๆ [william.GetHerHim] ขณะที่ [william.GetSheHe] พูด, ส่งให้ยาม [william.GetSheHe|U] พูดต่อขณะที่ยามเข้าใกล้ข้า, พร้อมม้วนกระดาษในมือ\n\n"โฉนดนี้สำหรับ [cambridgeshire.GetName] ทั้งหมด ไม่ใช่แค่สำหรับอีลี ทั้งหมดเลย" [william.GetFirstNameNoTooltip], ผู้ปกครองคนใหม่ของดินแดนเหล่านี้, เอนหลังอย่างมีชัย\n\n"นี่อาจเป็นของเจ้า, ตราบใดที่เจ้าวางอาวุธลงและไม่ชักดาบต่อต้านข้าอีกเลย""
 ep3_story_cycle_harrying.3052.a: "บ้านของข้า! บ้านบรรพบุรุษของข้า..."
 ep3_story_cycle_harrying.3052.a.flavor: "นี่เป็นข้อเสนอที่ดีเกินกว่าจะปฏิเสธได้"
 ep3_story_cycle_harrying.3052.a.tt: "[william.GetFirstNameNoTooltip] เรียกอาลักษณ์มา..."
 ep3_story_cycle_harrying.3052.b: ""...คืนน้องชายข้ามา, เจ้าหนอนนอร์มัน""

 ep3_story_cycle_harrying.3053.t: "สามสิบเหรียญเงิน"
 ep3_story_cycle_harrying.3053.desc: "รอยยิ้มกว้างอย่างชั่วร้ายที่แผ่กระจายบนใบหน้าของ[william.GetTitledFirstNamePossessive] ทำให้ข้าคลื่นไส้จนถึงท้อง [william.GetSheHe|U] กวักมือเรียกอาลักษณ์\n\n"เป็นทางเลือกที่ยอดเยี่ยม ความสะดวกสบายและความเจริญรุ่งเรืองของเจ้าและครอบครัวของเจ้าในรุ่นต่อๆ ไปจะได้รับการรับรอง!" [william.GetSheHe|U] ลุกขึ้นจากบัลลังก์[william.GetHerHis] มองข้าอย่างตรงไปตรงมา\n\n"จำไว้ เจ้าได้ทั้งหมดนี้เป็นการแลกเปลี่ยนกับการไม่ยกนิ้วต่อต้านข้าตลอดชีวิตที่เหลือของเจ้า หากข้าได้ยินแม้ แต่ข่าวลือเพียงเล็กน้อยว่ามีการลับหินลับมีดกับสิ่งใดที่ใหญ่กว่ามีดแล่เนื้อของคนขายเนื้อในเคมบริดจ์เชอร์..."\n\nข้าพยักหน้ายอมรับอย่างมึนงง ข้ามองลงไปที่มือของข้า เอื้อมหยิบเอกสาร แล้วมองกลับไปที่รอยยิ้มเจ้าเล่ห์ของ[william.GetFirstNamePossessiveNoTooltip]"
 ep3_story_cycle_harrying.3053.a: "... ข้าทำไม่ได้"
 ep3_story_cycle_harrying.3053.b: ""ข้าจะลงนามที่ไหน?""
 ep3_story_cycle_harrying.3053.b.tt: "@warning_icon! #X สิ่งนี้จะยุติการต่อต้านชาวนอร์มันและการมีส่วนร่วมใน [harrying_widget_i]การกวาดล้างแดนเหนือ ของท่าน!#!"

 ep3_story_cycle_harrying.3054.t: "ค่าตอบแทนของปีศาจ"
 ep3_story_cycle_harrying.3054.desc: "ใบหน้าของ[william.GetTitledFirstNamePossessive] บิดเบี้ยวทันที เต็มไปด้วยความโกรธ\n\n"เจ้าคนโง่" [william.GetSheHe] ถ่มน้ำลายอย่างอาฆาต "เจ้าคนโง่เขลา สายตาสั้น #EMP โง่เง่า!#!" [william.GetSheHe|U] โบกมือให้ทหารรักษาการณ์[william.GetHerHis] ก้าวไปข้างหน้า\n\n"เจ้ามองไม่เห็นหรือ? เจ้ายึดติดกับประวัติศาสตร์! เจ้าไล่ตามการดำรงอยู่ที่ถูกปฏิเสธโดย[ROOT.Char.GetFaith.HighGodName] แล้ว! เจ้ายืนหยัดในหลักการที่เจ้าถือไว้โดยไม่มีเหตุผลอื่นใดนอกจากการยึดถือมัน!"\n\nข้ามองไปรอบๆ อย่างตื่นตระหนก ประตูที่ข้าเข้ามายังคงมีการป้องกันเบาบาง บางทีถ้าข้าสามารถผ่านพวกเขาไปได้...\n\n"#EMP จับตัวเขาไว้!#!""
 ep3_story_cycle_harrying.3054.a: "ข้าจะไม่ยอมแพ้โดยไม่ต่อสู้!"
 ep3_story_cycle_harrying.3054.a.success: "ท่านหนีรอดไปได้!"
 ep3_story_cycle_harrying.3054.a.failure: "ท่านถูกจับและถูกทุบตี เพราะปัญหาของท่าน"
 ep3_story_cycle_harrying.3054.b: "ไม่มีประโยชน์"
 ep3_story_cycle_harrying.3054.b.tt: "เก็บแรงไว้ดีกว่า ข้าจะต้องใช้มัน"

 ep3_story_cycle_harrying.3055.t: "ราคาเหล็ก"
 ep3_story_cycle_harrying.3055.desc: "หมัดที่ท้อง ทำให้ข้าตัวงอขณะถูกจับกุม และแขนของข้าก็ถูกบิดไปด้านหลังอย่างรวดเร็ว ใบหน้า เคร่งขรึม โกรธเกรี้ยว — แม้ แต่[sympathetic_courtier.GetWomanMan] คนหนึ่งที่ด้านหลัง ซึ่งดูเหมือนจะเห็นใจ — ลอยผ่านสายตาของข้าขณะที่ข้าถูกนำตัวไป\n\nการเดินนั้นสั้น แต่เต็มไปด้วยอันตราย แสงธรรมชาติจางหายไปเมื่อเราลงบันได ไม่นานเกินรอ ข้าก็พบว่าตัวเองถูกล่ามโซ่ ตรวนติดกับผนังในห้องขัง\n\n"จงถือว่าโชคดีที่ยังมีชีวิตอยู่ เจ้าโจร" เสียงของ[william.GetTitledFirstNamePossessive] สะท้อนก้องผนังหินชื้นแฉะ [william.GetSheHe|U] พิจารณาสภาพแวดล้อมครู่หนึ่ง "หรือ... บางทีอาจจะไม่โชคดีนัก"\n\n[william.GetSheHe|U] หันกลับ[william.GetHerHis] และเดินออกจากห้องไปพร้อมกับคณะผู้ติดตาม[william.GetHerHis] และข้าก็อยู่ตามลำพัง"
 ep3_story_cycle_harrying.3055.a: "เอ่อ... ให้ตายสิ"

 ep3_story_cycle_harrying.3056.opening: "ถึงลอร์ดเฮริเวิร์ดผู้กล้าหาญ,"
 ep3_story_cycle_harrying.3056.desc: "ท่านต้องเชื่อใจเรา\n\nสามคืนนับจากนี้, ห้องขังของท่านจะยังคงปลดล็อกหลังจากการให้อาหาร จงอยู่ที่นั่นจนถึงพลบค่ำ\n\nขึ้นบันไดไปและเลี้ยวซ้ายที่สอง, จากนั้นเลี้ยวขวาแรกหลังจากนั้น\n\n#BOL ท่านไม่ได้อยู่คนเดียว#!#"
 ep3_story_cycle_harrying.3056.a: "อะไรนะ?"

 ep3_story_cycle_harrying.3057.t: "อิสรภาพ"
 ep3_story_cycle_harrying.3057.desc: "ตามคำสั่ง, ข้ารอจนพลบค่ำผ่านไปก่อนที่จะลองเปิดกลอนที่ป้องกันไว้บนห้องขังของข้า มันเปิดออกพร้อมเสียงเอี๊ยดเบาๆ, และข้าก็รีบวิ่งขึ้นบันไดทันที เลี้ยวซ้ายที่สอง, เลี้ยวขวาแรก, บันไดอีกขั้นและ...\n\nข้าพุ่งออกสู่อากาศยามค่ำคืนอันสดชื่น ห่างออกไปไม่ไกลมีร่างคลุมศีรษะหมอบอยู่, กำลังมองดูข้า ข้าจำ [sympathetic_courtier.GetHerHim] ได้ว่าเป็นใบหน้าที่เห็นใจ ซึ่งข้าเห็นขณะถูกลากไปยังห้องขัง\n\n"ท่านทำได้!" [sympathetic_courtier.GetSheHe|U] ทักทายข้าอย่างมีความสุข, และชี้ไปยังเส้นทางที่คดเคี้ยวผ่านเมือง "นั่นคือถนนสู่แดนเหนือ หากท่านออกไปตอนนี้ท่านจะไปได้ไกลก่อนที่พวกเขาจะสังเกตเห็น""
 ep3_story_cycle_harrying.3057.a: "มากับข้า!"
 ep3_story_cycle_harrying.3057.a.success: "[sympathetic_courtier.GetFirstNameNoTooltip] ตกลงอย่างมีความสุข"
 ep3_story_cycle_harrying.3057.a.failure: "[sympathetic_courtier.GetSheHe|U] ปฏิเสธท่านอย่างไม่เต็มใจ"
 ep3_story_cycle_harrying.3057.b: "ข้าจะไม่มีวันลืมท่าน ไปเถิด, เร็วเข้า, ก่อนที่ท่านจะถูกพบตัว"
