 pet_animal.3040.desc: "เมื่ออายุได้ [ROOT.Char.MakeScope.Var('eagle_age_variable').GetValue] ปี [ROOT.Char.Custom('EagleStoryName')]ได้กลายเป็นนักล่าผู้ชำนาญ แต่ก็ยังมีช่องทางให้พัฒนาได้อีก ข้าตัดสินใจใช้เวลาฝึกฝน[ROOT.Char.Custom('EagleStoryHerHim')] และดูว่า[ROOT.Char.Custom('EagleStorySheHe')]จะเก่งขึ้นได้อีกหรือไม่ หรือข้าจะได้เรียนรู้สิ่งใหม่ๆ เกี่ยวกับ[ROOT.Char.Custom('EagleStoryHerHim')]"
