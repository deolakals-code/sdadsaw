l_english: 
##############
## CAT
##############
 pet_animal.0001.t:0 "เจ้าแมว"
 pet_animal.0001.desc:1 "ขณะที่เจ้าแมวนอนอยู่บนตักข้า ส่งเสียงครางอย่างพึงพอใจ ข้าครุ่นคิดว่าจะตั้งชื่อ [ROOT.Char.Custom('CatStoryHerHim')] ว่ากระไรดี ชื่อทางประวัติศาสตร์? ชื่อที่สื่อถึงขนสี [ROOT.Char.Custom('CatStoryHerHis')] [ROOT.Char.Custom('CatFurColor')]? หรือชื่อที่บรรยายความรู้สึกผ่อนคลายที่ข้าสัมผัสได้ยามเกาหลังใบหูให้ [ROOT.Char.Custom('CatStoryHerHim')]?\n\nโอ้ ข้ารู้แล้ว! ข้าจะตั้งชื่อ [ROOT.Char.Custom('CatStoryHerHim')] ว่า..."
 pet_animal.0001.a:1 "ช่างเป็นชื่อที่ยอดเยี่ยม!"

 pet_animal.0101.t:0 "[ROOT.Char.Custom('CatStoryName')]: ผู้มอบของขวัญ"
 pet_animal.0101.desc:0 "ดวงตาสี [ROOT.Char.Custom('CatEyeColor')] สองดวงจับจ้องข้ายามข้าเดินผ่าน และเสียงเหมียวเล็กๆ ทำลายความเงียบเมื่อ [ROOT.Char.Custom('CatStoryName')] ตะครุบข้อเท้าข้า"
 pet_animal.0101.desc_old:0 "[ROOT.Char.Custom('CatStorySheHe')|U] ผ่านช่วงเวลาที่ดีกว่านี้มาแล้ว แต่ความชราไม่เคยหยุดยั้ง [ROOT.Char.Custom('CatStoryHerHim')] ได้!"
 pet_animal.0101.desc_young:0 "[ROOT.Char.Custom('CatStorySheHe')|U] อาจยังเยาว์วัย แต่ถึงกระนั้น [ROOT.Char.Custom('CatStorySheHe')] ก็ดุร้ายยิ่งนัก!"
 pet_animal.0101.desc_middle:0 "แมวในวัยฉกรรจ์ของ [ROOT.Char.Custom('CatStoryHerHis')] ถึงกระนั้น [ROOT.Char.Custom('CatStorySheHe')] ก็ไม่ทิ้งร่องรอยใดๆ ไว้บนตัวข้า"
 pet_animal.0101.desc_ending:0 "\n\nขณะที่ [ROOT.Char.Custom('CatStorySheHe')] เยื้องย่างจากไป ข้าเห็นว่า [ROOT.Char.Custom('CatStorySheHe')] ได้ทิ้งของขวัญอันแวววาวไว้ให้ข้าในที่ ซึ่ง [ROOT.Char.Custom('CatStorySheHe')] ซ่อนตัวอยู่"
 pet_animal.0101.a_female:0 "ขอบใจนะ แม่นางผู้เลอโฉม!"
 pet_animal.0101.a_male:0 "ขอบใจนะ พ่อคุณผู้ใจดี!"

 pet_animal.0103.t:0 "[ROOT.Char.Custom('CatStoryName')]: ข้าหลวงผู้ต้องมนตร์"
 pet_animal.0103.desc:0 "ขณะที่ข้าเดินออกไปข้างนอก ข้าก็พบกับภาพของ [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] ของข้า กำลังคุกเข่าอยู่ข้าง [ROOT.Char.Custom('CatStoryName')] แมวของข้า พลางลูบหัวของ [ROOT.Char.Custom('CatStoryHerHis')] อย่างอ่อนโยน\n\n"แมวของท่านช่างน่ารักยิ่งนัก [ROOT.Char.Custom('FormOfAddressForLiege')]""
 pet_animal.0103.a:0 "ท่านช่างสังเกตเสียจริง!"

 pet_animal.0104.t:0 "[ROOT.Char.Custom('CatStoryName')]: เสียงครางปลอบประโลม"
 pet_animal.0104.desc:0 "หลังจากวันอันแสนเคร่งเครียดอีกวัน ข้าทรุดตัวลงนั่งบนเก้าอี้ – ข้าจะทนต่อไปได้อีกนานเพียงใด?\n\nพลันข้าได้ยินเสียงเหมียวเบาๆ และแมวของข้า [ROOT.Char.Custom('CatStoryName')] ก็กระโดดขึ้นมาบนตักแล้วเริ่มส่งเสียงคราง ข้านั่งอยู่กับ [ROOT.Char.Custom('CatStoryHerHim')] สักพัก เพียงแค่ฟังเสียงอันน่าสงบและลูบไล้ขนสี [ROOT.Char.Custom('CatStoryHerHis')] [ROOT.Char.Custom('CatFurColor')]"
 pet_animal.0104.a:0 "ข้าคิดว่าข้าคงทำต่อไปได้อีกสักหน่อย"

 pet_animal.0105.t:0 "[ROOT.Char.Custom('CatStoryName')]: ความลับถูกเปิดเผย"
 pet_animal.0105.desc_opening:0 "#EMP เหมียว!#!\n\nข้ามองลงไปเห็นแมวของข้า [ROOT.Char.Custom('CatStoryName')] ได้ทิ้งม้วนสารไว้ที่เท้าข้า – ผนึกด้วยตราอันเป็นเอกลักษณ์ของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('person'))] ของข้า [person.GetTitledFirstNamePossessive] ด้วยความอยากรู้ ข้าจึงกวาดตาอ่านข้อความ...\n\n"
 pet_animal.0105.desc_murder:0 ""... การฆาตกรรมที่ข้าก่อขึ้นถ่วงใจข้า และ...""
 pet_animal.0105.desc_lover:0 ""... ความรักที่ข้ามีต่อผู้อื่น...""
 pet_animal.0105.desc_homosexual:0 ""... แรงกระตุ้นที่ข้ารู้สึกต่อคนเพศเดียวกัน...""
 pet_animal.0105.desc_deviant:0 ""... ความวิปริตที่ข้าได้กระทำลงไป...""
 pet_animal.0105.desc_cannibal:0 ""... เพราะข้าได้ลิ้มรสเนื้อมนุษย์...""
 pet_animal.0105.desc_murder_attempt:0 ""... เมื่อข้าพยายามจบชีวิตของผู้อื่น...""
 pet_animal.0105.desc_non_believer:0 ""... เพราะข้าไม่เชื่อใน [person.GetFaith.HighGodName]...""
 pet_animal.0105.desc_incest:0 ""... ที่ข้ารู้สึกถึงแรงกระตุ้นเหล่านี้ต่อคนในครอบครัวของข้าเอง...""
 pet_animal.0105.desc_witch:0 ""... ชุมนุมแม่มดของข้าจะ...""
 pet_animal.0105.desc_fallback:0 ""... การเก็บความลับนี้ไว้ถ่วงใจข้า...""
 pet_animal.0105.a:0 "ไม่น่าเชื่อว่า [person.GetSheHe] จะซ่อนเรื่อง เช่นนี้ไว้...!"
 pet_animal.0105.b:0 "โลกต้องรับรู้เรื่องนี้"

 pet_animal.0106.t:0 "[ROOT.Char.Custom('CatStoryName')]: ความอ่อนไหว"
 pet_animal.0106.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip] แมวตัวนี้ต้องไป!"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้า [spouse.GetTitledFirstName] กำลังหิ้วคอ [ROOT.Char.Custom('CatStoryName')] ไว้ ตาแดงก่ำและน้ำมูกไหล "ข้าทนไม่ไหวแล้ว ข้าแทบหายใจไม่ออกเมื่อ [ROOT.Char.Custom('CatStorySheHe')] อยู่ใกล้ๆ!""
 pet_animal.0106.a:0 "ข้าจะให้ [ROOT.Char.Custom('CatStoryHerHim')] แก่ [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.0106.b:0 "[receiver_2.GetFirstNameNoTooltip] น่าจะมีเพื่อนคู่ใจสักตัว..."
 pet_animal.0106.c:0 "[receiver_3.GetFirstNameNoTooltip] คงจะดูแล [ROOT.Char.Custom('CatStoryHerHim')] ได้..."
 pet_animal.0106.d:0 "ข้าจะไม่ยอมยก [ROOT.Char.Custom('CatStoryName')] ให้ใคร!"
 pet_animal.0106.e:0 "ข้า... ข้าเดาว่าข้าคงต้องกำจัด [ROOT.Char.Custom('CatStoryHerHim')] ทิ้ง..."

 pet_animal.0107.t:0 "[ROOT.Char.Custom('CatStoryName')]: เจ้าแมว"
 pet_animal.0107.desc:0 ""[giver.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้าทนอยู่ร่วมกับ [ROOT.Char.Custom('CatStoryNamePossessive')] ที่น่าสงสารต่อไปไม่ไหวแล้ว... ดังนั้นข้าจึงวางใจให้ท่านดูแล [ROOT.Char.Custom('CatStoryHerHim')] แทนข้า"\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('giver'))] ของข้า [giver.GetTitledFirstName] ยื่นแมวสี [receiver.Custom('CatFurColor')] มาให้ข้า "[ROOT.Char.Custom('CatStoryName')] เป็นเพื่อนคู่ใจที่ยอดเยี่ยม... ยอดเยี่ยมมาก""
 pet_animal.0107.a:0 "ขอบใจท่าน ข้าจะทะนุถนอม [ROOT.Char.Custom('CatStoryHerHim')] อย่างดี!"
 pet_animal.0107.b:0 "ขอบใจท่าน ข้ามั่นใจว่า [ROOT.Char.Custom('CatStorySheHe')] จะมีประโยชน์"

 pet_animal.0108.t:0 "[receiver.Custom('CatStoryName')]: ชีวิตที่ปราศจากเจ้า"
 pet_animal.0108.t_dead:0 "ชีวิตที่ปราศจากเจ้า"
 pet_animal.0108.desc_opening:0 "ข้าไปเยี่ยม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] ของข้า [receiver.GetTitledFirstName] เพื่อดูว่า [receiver.Custom('CatStoryName')] ตัวน้อยเป็นอย่างไรบ้างในการดูแลของ [receiver.GetHerHis]\n\n"
 pet_animal.0108.desc_alive_landed:0 "[receiver.GetSheHe|U] พบข้านอก [receiver.Custom('ResidenceBuilding')] ของ [receiver.GetHerHis] โดยมีแมวสี [receiver.Custom('CatFurColor')] อยู่ในอ้อมแขน "[receiver.Custom('CatStorySheHe')|U] สบายดี –"
 pet_animal.0108.desc_alive:0 "[receiver.GetSheHe|U] พบข้าข้างนอก แมว[receiver.Custom('CatFurColor')] อยู่ในอ้อมแขน[receiver.GetHerHis] "[receiver.Custom('CatStorySheHe')|U] สบายดี –"
 pet_animal.0108.desc_alive_1:0 "[receiver.Custom('CatStorySheHe')] ชอบล่านกแถวนี้!""
 pet_animal.0108.desc_alive_2:0 "[receiver.Custom('CatStorySheHe')] ชอบพยายามเลียขนให้แม่ไก่!""
 pet_animal.0108.desc_dead_opening:1 "ข้าไปเยี่ยม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] ของข้า [receiver.GetTitledFirstName] เพื่อดูว่าแมวเป็นอย่างไรบ้างในการดูแลของ [receiver.GetHerHis]\n\n"
 pet_animal.0108.desc_dead_landed:0 "[receiver.GetSheHe|U] พบข้านอก [receiver.Custom('ResidenceBuilding')] ของ [receiver.GetHerHis] ไม่เห็นแมวเลย"
 pet_animal.0108.desc_dead:0 "[receiver.GetSheHe|U] พบข้านอกบ้าน ไม่เห็นแมวเลย"
 pet_animal.0108.desc_dead_ending:0 ""โอ้ มันคงออกไปเล่นที่ไหนสักแห่ง..."\n\n[receiver.GetSheHe|U] มองไปทุกที่ยกเว้นที่ข้า"
 pet_animal.0108.a:0 "ข้าโล่งใจ!"
 pet_animal.0108.b:1 "แมวของข้าอยู่ที่ไหน?!"

 pet_animal.0109.t:1 "[ROOT.Char.Custom('CatStoryName')]: นักฆ่าหนู"
 pet_animal.0109.desc:1 "ขณะที่ [ROOT.Char.Custom('CatStoryName')] เข้ามาหาข้าพร้อมกับหนูตายอีกตัว ข้าทำอะไรไม่ได้นอกจากชื่นชม [ROOT.Char.Custom('CatStoryHerHim')] [ROOT.Char.Custom('ResidenceBuilding')] ไม่เคยปลอดหนู เช่นนี้มาก่อน!"
 pet_animal.0109.a:0 "ทำดีต่อไป!"

 pet_animal.0110.t:1 "[ROOT.Char.Custom('CatStoryName')]: ตัวป่วน"
 pet_animal.0110.desc:2 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้า ความโกรธเกรี้ยวฉายในดวงตาของ [vassal.GetHerHis] และมีแมวอยู่ในมือของ [vassal.GetHerHis] ถูกหิ้วคออยู่ ขณะที่ [vassal.GetSheHe] ยื่นแมวมาที่หน้าข้า ข้าเห็นว่าเป็น [ROOT.Char.Custom('CatStoryName')] สุดที่รักของข้า!\n\n"ข้าพบเจ้าสัตว์ประหลาดตัวน้อยนี้ท่ามกลางข้าวของของข้า – สิ่งที่ไม่ถูกข่วนจนขาดวิ่นก็เต็มไปด้วยฉี่!""
 pet_animal.0110.a:0 "ข้าจะชดใช้ให้ท่าน!"
 pet_animal.0110.b:0 "[ROOT.Char.Custom('CatStorySheHe')|U] ก็แค่แมวตัวหนึ่ง..."

 pet_animal.0197.t:0 "[ROOT.Char.Custom('CatStoryName')]: จากไป"
 pet_animal.0197.desc_court_5020:0 "นับตั้งแต่ข้าเริ่มจำกัดการเข้าออกของ [ROOT.Char.Custom('CatStoryName')] ข้าก็เห็น [ROOT.Char.Custom('CatStoryHerHim')] น้อยลงเรื่อยๆ\n\nบัดนี้เป็นเวลาหลายสัปดาห์แล้วที่ข้าเห็น [ROOT.Char.Custom('CatStoryHerHim')] ครั้งสุดท้าย และข้าเกรงว่า [ROOT.Char.Custom('CatStorySheHe')] ได้จากข้าไปแล้วจริงๆ\n\nข้าราชบริพารของข้าดูมีความสุขกับห้องที่ปราศจากขนสัตว์ แต่ตักของข้าไม่เคยรู้สึกว่างเปล่าเท่านี้มาก่อน..."
 pet_animal.0197.desc:0 "[ROOT.Char.Custom('CatStoryName')] เริ่มออกไปไกลบ้านมากขึ้นเรื่อยๆ ในช่วงหลัง และหายไปนานขึ้น\n\nบัดนี้เป็นเวลาหลายสัปดาห์แล้วที่ข้าเห็น [ROOT.Char.Custom('CatStoryHerHim')] ครั้งสุดท้าย และข้าเกรงว่า [ROOT.Char.Custom('CatStorySheHe')] ได้จากข้าไปแล้วจริงๆ"
 pet_animal.0197.a:0 "โปรดกลับมาเถิด [ROOT.Char.Custom('CatStoryName')]!"

#Cat dies :(
 pet_animal.0199.t:0 "[ROOT.Char.Custom('CatStoryName')]: วันแห่งความโศกเศร้า"
 pet_animal.0199.desc:0 "[ROOT.Char.Custom('CatStoryName')] หาได้เยาว์วัยเหมือน เช่นเคยไม่ และขณะที่ [ROOT.Char.Custom('CatStorySheHe')] คลานขึ้นมาบนตัก ข้าสัมผัสได้ถึงอาการสั่นเทาของ [ROOT.Char.Custom('CatStoryHerHim')]\n\nข้าค่อยๆ ลูบไล้ขนสี [ROOT.Char.Custom('CatStoryHerHis')] [ROOT.Char.Custom('CatFurColor')] และฟังเสียงครางของ [ROOT.Char.Custom('CatStoryHerHim')] ยาวนานไปจนค่ำคืน แต่เมื่อความเงียบเข้าปกคลุม ข้าก็รู้ว่า [ROOT.Char.Custom('CatStorySheHe')] จะไม่ตื่นขึ้นมาอีกแล้ว"
 pet_animal.0199.a:0 "ข้าจะคิดถึงเจ้านะ [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0199.b:0 "ข้าจะ ทำให้แน่ใจว่าเจ้าจะอยู่เคียงข้างข้าตลอดไป!"
 pet_animal.0199.b.tt:0 "ท่านได้รับ หนังฟอกผืนเล็ก [court_artifact|E]"

#Extra cat events

 pet_animal.0200.t: "[ROOT.Char.Custom('CatStoryName')]: ตุ้บ!"
 pet_animal.0200.desc: "ข้าอยู่ที่โต๊ะ กำลังอ่านรายงานบางฉบับที่ส่งมาจากทั่วอาณาจักร [ROOT.Char.Custom('CatStoryName')] กระโดดขึ้นมาข้างๆ ข้า ไล่ตามความอบอุ่นของแสงแดด และขดตัวอย่างพึงพอใจข้างกองงานของข้า\n\nข้ายื่นมือออกไปลูบขนสี [ROOT.Char.Custom('CatStoryHerHis')] [ROOT.Char.Custom('CatFurColor')] และ [ROOT.Char.Custom('CatStorySheHe')] ก็บิดขี้เกียจอย่างเชื่องช้าตอบสนอง ช่างเป็นการบิดขี้เกียจที่ทรงพลัง!\n\n#EMP ทรงพลังเกินไป#! อย่างที่เห็น [ROOT.Char.Custom('CatStoryName')] กลิ้งตัวหล่นจากโต๊ะไปทั้งตัว ลงสู่พื้นด้วยเท้าของ [ROOT.Char.Custom('CatStoryHerHis')] ด้วยสายตาหยิ่งผยอง — ราวกับว่านี่เป็นความผิด #EMP ของข้า#! อย่างไรอย่างนั้น — [ROOT.Char.Custom('CatStorySheHe')] ก็เดินจากไปอย่างงอนๆ"
 pet_animal.0200.a: "ฮ่า! เจ้าโง่น้อยเอ๊ย!"

 pet_animal.0201.t: "[ROOT.Char.Custom('CatStoryName')]: โอนเอน"
 pet_animal.0201.desc: "ช่างเป็นวันที่ยาวนาน ข้ายืดขาออกไปข้างหน้าขณะผ่อนคลายที่โต๊ะเขียนหนังสือ กระดูกที่อ่อนล้าของข้าได้พักผ่อนเป็นครั้งแรกในวันนี้ อีกฟากหนึ่งของห้อง [ROOT.Char.Custom('CatStoryName')] เดินทอดน่องไปตามหิ้ง สำรวจส่วนที่สูงขึ้นของห้อง [ROOT.Char.Custom('CatStorySheHe')|U] ช่างชอบขึ้นที่สูงเสียจริง—\n\n[cat_artifact.GetName] ของข้า! วางอยู่ปลายหิ้ง [ROOT.Char.Custom('CatStoryName')] กำลังมุ่งตรงไปหามัน ดวงตาแมวเบิกกว้างด้วยความสนใจ ข้ามองด้วยความสยดสยองเมื่ออุ้งเท้าหนึ่งยื่นออกไป..."
 pet_animal.0201.a: "ไม่นะ!"
 pet_animal.0201.a.tt: "คว้ามันไว้!"
 pet_animal.0201.a.success: "ท่านคว้ามันไว้ได้สำเร็จ"
 pet_animal.0201.a.failure: "[cat_artifact.GetNameNoTooltip] ตกลงสู่พื้น"
 pet_animal.0201.b: "โอ้ ไม่นะ เจ้าตัวเล็ก—"
 pet_animal.0201.b.success: "ท่านคว้า [ROOT.Char.Custom('CatStoryName')] ไว้ได้สำเร็จ"
 pet_animal.0201.b.failure: "[ROOT.Char.Custom('CatStoryName')] ไม่พอใจท่าน"
 pet_animal.0201.b.tt: "คว้า [ROOT.Char.Custom('CatStoryHerHim')] ไว้!"

 pet_animal.0202.t: "[ROOT.Char.Custom('CatStoryName')]: ความพยายามอันเร่าร้อน"
 pet_animal.0202.desc: "แสงเทียนริบหรี่และผ้าปูที่นอนเสียดสีขณะที่ [cat_lover.GetFirstName] และข้าสอดประสานกันบนเตียง เราพยายามเงียบเสียง แต่บางครั้งเสียงก็ดังเกินไป! เสียงหอบ เสียงถอนหายใจ เสียง... เหมียว?\n\nข้าผุดลุกขึ้นนั่ง พบว่า [ROOT.Char.Custom('CatStoryName')] นั่งอย่างมีความสุขอยู่บนหมอนข้างๆ เรา ส่งเสียงครางอย่างพึงพอใจ ขณะที่ข้าครุ่นคิดว่าจะทำอย่างไร ปากอ้าค้าง [ROOT.Char.Custom('CatStorySheHe')] ก็เริ่มเลียอุ้งเท้าอย่างเสียงดัง\n\n[cat_lover.GetFirstNameNoTooltip|U] มองข้าอย่างหยิ่งผยอง ข้าผลักเจ้าแมวเหมียวที่ดูพอใจนั้นเบาๆ อย่างไม่เต็มใจนัก [ROOT.Char.Custom('CatStorySheHe')] พลิกตัวหงายท้อง พร้อมที่จะเล่น"
 pet_animal.0202.a: "\"โอ้ ให้ตาย— #EMP ชิ่วไป!#!\""
 pet_animal.0202.a.success: "ท่านไล่แมวไปได้สำเร็จ"
 pet_animal.0202.a.failure: "[ROOT.Char.Custom('CatStoryName')] ดื้อดึงปฏิเสธที่จะขยับ"
 pet_animal.0202.b: "เอาเถอะ คงจะเสียมารยาทหากไปรบกวน [ROOT.Char.Custom('CatStoryHerHim')]..."

 pet_animal.0203.t: "[ROOT.Char.Custom('CatStoryName')]: การทรยศ!"
 pet_animal.0203.desc: "นั่นเสียง #EMP โอ๋เอ๋#! หรือเปล่าที่ข้าได้ยิน? และเสียง... เหมียวอู้อี้?\n\nนั่งอยู่ในซุ้มคือ [random_courtier.GetFirstName] โดยมี [ROOT.Char.Custom('CatStoryName')] อยู่ในอ้อมแขนของ [random_courtier.GetHerHis] เจ้าแมวเหมียวมองขึ้นไปหา [random_courtier.GetHerHim] อย่างชื่นชม แขนขาซุกเหมือนทารก และ [random_courtier.GetFirstNameNoTooltip] ผู้หลงใหลก็โยก [ROOT.Char.Custom('CatStoryHerHim')] อย่างรักใคร่\n\nข้าทักทาย แต่ แม้ว่ามนุษย์จะตอบกลับ เจ้าแมวกลับเพียงส่งเสียงครางอย่างพึงพอใจและซุกหน้าของ [ROOT.Char.Custom('CatStoryHerHis')] เข้าไปในซอกแขน แม้จะห้ามใจตัวเอง ข้าก็รู้สึกเจ็บแปลบด้วยความอิจฉา"
 pet_animal.0203.a: "เฮ้! ส่งแมวข้ามานี่!"
 pet_animal.0203.b: "เอาเถอะ ข้าเดาว่าข้าคงไม่ใช่คนโปรดของ [ROOT.Char.Custom('CatStoryHerHis')]..."

 pet_animal.0204.t: "[ROOT.Char.Custom('CatStoryName')]: หมอแมว"
 pet_animal.0204.desc: "ข้าสั่นเล็กน้อยและดึงผ้าห่มเข้ามาใกล้ตัวมากขึ้น ความเจ็บป่วยอันน่ารังเกียจนี้ ทำให้ข้ารู้สึกทุกข์ทรมานมาหลายวันแล้ว และไม่มีทีท่าว่าจะบรรเทาลงในเร็วๆ นี้\n\nขณะที่ข้าขยับผ้าห่ม เสียงเหมียวอย่างมีความสุขก็ประกาศการมาถึงของแมวข้า [ROOT.Char.Custom('CatStoryName')] [ROOT.Char.Custom('CatStorySheHe')|U] มองข้าด้วยท่าทีกังวลเล็กน้อย เดินวนรอบเตียงป่วยของข้าอย่างละเอียด\n\nในที่สุด ด้วยเสียง #EMP เมี้ยว!#! เล็กๆ ที่พอใจในตัวเอง [ROOT.Char.Custom('CatStorySheHe')] ก็ลงหลักปักฐานนวดผ้าห่ม ในที่สุดก็ขดตัวอยู่ในซอกข้อศอกของข้า"
 pet_animal.0204.a: "โอ๋ เจ้ามาอยู่เป็นเพื่อนข้ารึ [ROOT.Char.Custom('CatStoryName')]?"

 pet_animal.0205.t: "[ROOT.Char.Custom('CatStoryName')]: การขัดจังหวะ"
 pet_animal.0205.desc: "ข้านั่งลง โบกมือให้สภาของข้านั่งตาม ผู้มีอำนาจสูงสุดในอาณาจักรอยู่ที่นี่แล้ว ข้าอ้าปากจะพูด และ—\n\n#EMP \"เหมียว!\"#! ข้ามองหาต้นเสียง #EMP \"เหมียว!\"#!\n\n[ROOT.Char.Custom('CatStoryName')] กระโดดขึ้นมาบนโต๊ะยาว ส่งเสียงครางอย่างพึงพอใจ [ROOT.Char.Custom('CatStorySheHe')|U] เอาหัวของ [ROOT.Char.Custom('CatStoryHerHis')] ดันมือข้าอย่างมีความสุข ขณะเดียวกัน [cat_disapprover.GetFirstName] ก็เม้มปากของ [cat_disapprover.GetHerHis] อย่างไม่เห็นด้วย\n\n\"บางทีเราควรจะนำสัตว์ตัวนี้ออกไปนะ [ROOT.Char.GetLadyLord] ของข้า? เรามีเรื่องสำคัญอย่างยิ่งที่ต้องหารือกัน\""
 pet_animal.0205.a: "จงเคารพ [ROOT.Char.Custom('CatStoryName')] มิฉะนั้นลิ้นเจ้าจะหลุดจากปาก"
 pet_animal.0205.b: "คนรับใช้! มาเอาแมวตัวนี้ไป!"
 pet_animal.0205.c: "โอ้ ไม่เอาน่า [ROOT.Char.Custom('CatStorySheHe')] ไม่สร้างปัญหาหรอก [ROOT.Char.Custom('CatStorySheHe')|U] อยู่ได้"
 pet_animal.0205.c.tt: "มานี่ เจ้าก้อนขน!"

##############
## DOG
##############
 dog_got_pregnant_tooltip:0 "นางกำลังตั้งท้องลูกสุนัข!"
 pet_animal.1001.t:0 "เจ้าสุนัข"
 pet_animal.1001.desc:0 "ขณะที่ข้าลูบหัวเจ้าสุนัข [ROOT.Char.Custom('DogStorySheHe')] ก็กระดิกหางของ [ROOT.Char.Custom('DogStoryHerHis')] อย่างมีความสุข ชื่อใดจะเหมาะกับ [ROOT.Char.Custom('DogStoryHerHim')]? ชื่อทางประวัติศาสตร์? ชื่อที่สื่อถึงขนสี [ROOT.Char.Custom('DogStoryHerHis')] [ROOT.Char.Custom('DogFurColor')]? มันเป็นการตัดสินใจที่สำคัญ และขณะที่สุนัขพลิกตัวให้ข้าลูบท้องของ [ROOT.Char.Custom('DogStoryHerHis')] ข้าก็วอกแวกไปชั่วครู่\n\nแต่เดี๋ยวก่อน ข้ารู้แล้ว! ข้าจะตั้งชื่อ [ROOT.Char.Custom('DogStoryHerHim')] ว่า..."

 pet_animal.1101.t:0 "[ROOT.Char.Custom('DogStoryName')]: เท้าและอุ้งเท้า"
 pet_animal.1101.desc:0 "การพา [ROOT.Char.Custom('DogStoryName')] เดินเล่นทุกวันกลายเป็นกิจวัตรไปแล้ว และข้าไม่แน่ใจว่าระหว่างเราสองคน ใครกันที่เพลิดเพลินกับอากาศบริสุทธิ์และแสงแดดมากกว่ากัน!\n\n[ROOT.Char.Custom('DogStoryName')] กระโดดนำหน้าไปแล้วมองกลับมาเห่าใส่ข้า ราวกับจะบอกว่า #EMP ตามมาเร็วเข้า!#!"
 pet_animal.1101.a:0 "และเราก็เดินต่อไป!"

 pet_animal.1102.t:0 "[ROOT.Char.Custom('DogStoryName')]: หนีไป"
 pet_animal.1102.desc:0 "ข้ากำลังขี่ม้าออกไป โดยมีสุนัขของข้า [ROOT.Char.Custom('DogStoryName')] อยู่ข้างๆ เมื่อ [ROOT.Char.Custom('DogStorySheHe')] พลันวิ่งหายเข้าไปใน [ROOT.Char.Custom('TerrainType')]\n\nคณะผู้ติดตามของข้ามั่นใจว่า [ROOT.Char.Custom('DogStorySheHe')] จะกลับมา แต่ถ้าหาก [ROOT.Char.Custom('DogStorySheHe')] ไม่กลับมาล่ะ?!"
 pet_animal.1102.a:0 "มานี่! [ROOT.Char.Custom('DogStoryName')] ข้าบอกให้มานี่! รอข้าด้วย!"
 pet_animal.1102.a.tt:0 "ท่านพยายามจับ [ROOT.Char.Custom('DogStoryHerHim')]"
 pet_animal.1102.b:0 "ข้าจะอดทนรอ"
 pet_animal.1102.b.tt:0 "[ROOT.Char.Custom('DogStorySheHe')|U] จะกลับมา...!"

 pet_animal.1103.desc_followed:0 "ข้าพบ [ROOT.Char.Custom('DogStoryName')] หลังจากค้นหาอยู่ไม่กี่นาที กระดิกหางของ [ROOT.Char.Custom('DogStoryHerHis')] อย่างมีความสุขและแสร้งทำเป็นไม่มีอะไรผิดปกติ"
 pet_animal.1103.desc:0 "ในที่สุด [ROOT.Char.Custom('DogStoryName')] ก็เดินกลับมา แสร้งทำเป็นไม่มีอะไรผิดปกติ"
 pet_animal.1103.desc_ending:0 "\n\n[ROOT.Char.Custom('DogStorySheHe')|U] คาบบางอย่างไว้ในปากของ [ROOT.Char.Custom('DogStoryHerHis')] และขณะที่ [ROOT.Char.Custom('DogStorySheHe')] ค่อยๆ วางมันลงตรงหน้าข้า ข้าเห็นว่าเป็นเหรียญทองสองสามเหรียญ"
 pet_animal.1103.a:0 "ขอบใจนะ!"

 pet_animal.1104.desc_followed:0 "ข้าค้นหาอยู่นาน แต่ไม่พบร่องรอยของ [ROOT.Char.Custom('DogStoryName')] เลย"
 pet_animal.1104.desc:0 "ไม่ว่าข้าจะรอนานเท่าใด [ROOT.Char.Custom('DogStoryName')] ก็ไม่กลับมา"
 pet_animal.1104.desc_ending:0 "\n\nขณะที่เราขี่ม้ากลับ พื้นที่ว่างเปล่าข้างม้าของข้า ทำให้บางอย่างในใจข้าเจ็บปวด"
 pet_animal.1104.a:0 "[ROOT.Char.Custom('DogStoryName')] เหตุใดเจ้าจึงทิ้งข้าไป?"

 pet_animal.1105.desc_ending:0 "\n\nขณะที่ข้ากำลังจะยอมแพ้ พลขับม้าคนหนึ่งจากคณะผู้ติดตามของข้ากลับมาพร้อมข่าวที่น่ากังวล – [dummy_gender.GetSheHe] สาบานว่า [dummy_gender.GetSheHe] เห็น [rival.Custom2('MyCharacterIntroduction', ROOT.Char)] ด้อมๆ มองๆ อยู่แถวนั้น!"
 pet_animal.1105.a:1 "หาก [rival.GetSheHe] มีส่วนเกี่ยวข้องกับเรื่องนี้..."

 pet_animal.1106.desc_ending:0 "\n\nขณะที่ข้ากำลังจะจากไป [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ปรากฏตัวขึ้นจากที่ไหนไม่รู้ พร้อมกับ [ROOT.Char.Custom('DogStoryName')] ในจูง\n\n"สหายข้า ข้าเชื่อว่าท่านทำใครบางคนหายไป!""
 pet_animal.1106.a:0 "ช่างโชคดีอะไร เช่นนี้! ขอบใจท่านมาก!"

 pet_animal.1107.t:0 "[ROOT.Char.Custom('DogStoryName')]: ข้าหลวงผู้ต้องมนตร์"
 pet_animal.1107.desc:0 "ข้าบังเอิญไปพบ [vassal.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] ของข้า กำลังคุกเข่าอยู่ข้าง [ROOT.Char.Custom('DogStoryName')] สุนัขของข้า พลางเกาหน้าท้องของ [ROOT.Char.Custom('DogStoryHerHis')] อย่างเมามัน\n\n"สุนัขของท่านนี่ช่างมีเสน่ห์เสียจริง [ROOT.Char.Custom('FormOfAddressForLiege')]!""
 pet_animal.1107.a_female:0 "นางเป็นเด็กดี!"
 pet_animal.1107.a_male:0 "เขาเป็นเด็กดี!"

 pet_animal.1108.t:0 "[ROOT.Char.Custom('DogStoryName')]: ผู้พิทักษ์ขนปุย"
 pet_animal.1108.desc:0 "ข้าอยู่ในห้องพักเมื่อสุนัขของข้า [ROOT.Char.Custom('DogStoryName')] พลันเริ่มเห่าใส่ประตู ข้าได้ยินเสียงร้องตกใจ และเมื่อข้ากระชากประตูเปิดออก [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))] ของข้า [agent.GetFirstName] ก็ตัวแข็งทื่อกลางคัน"
 pet_animal.1108.a:0 "เจ้ามาทำอะไรที่นี่? บอกข้ามา!"

 pet_animal.1109.t:0 "[ROOT.Char.Custom('DogStoryName')]: การพบปะ"
 pet_animal.1109.desc:0 "ข้ากำลังพา [ROOT.Char.Custom('DogStoryName')] เดินเล่น ทันใดนั้นข้าเห็น [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] เดินเข้ามาพร้อมกับสุนัขสี [other_owner.Custom('DogFurColor')] ที่สวยงาม\n\nก่อนที่เราคนใดคนหนึ่งจะทันได้ตอบสนอง [ROOT.Char.Custom('DogStoryName')] และสุนัขอีกตัวก็วิ่งออกไป"
 pet_animal.1109.a:0 "ข้ามั่นใจว่าพวกมันจะไม่เป็นไร"
 pet_animal.1109.a.tt:0 "ข้า #EMP หวังว่า#! พวกมันจะไม่เป็นไร"

 pet_animal.1110.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพบสุนัขทั้งสองหลังจากนั้นครู่หนึ่ง กำลังอยู่ในช่วงผสมพันธุ์กันอย่างดุเดือด\n\n"
 pet_animal.1110.desc_your_dog:0 ""เอาล่ะ [ROOT.Char.GetTitledFirstNameNoTooltip]... ข้าเดาว่าเราคงจะได้เป็นญาติกันในไม่ช้า!""
 pet_animal.1110.desc_their_dog:0 ""[ROOT.Char.Custom('DogStoryName')] เจ้าปล่อยให้เจ้าหมาพันธุ์ทางนั่น...!"\n\n[other_owner.GetSheHe|U] พูดค้างไว้ แต่ข้าเห็นความโกรธในดวงตาของ [other_owner.GetHerHis]"
 pet_animal.1110.a:0 "เอาเถอะ... มันเป็นเรื่องธรรมชาติ"

 pet_animal.1111.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพบสุนัขทั้งสองหลังจากนั้นครู่หนึ่ง กำลังอยู่ในช่วงต่อสู้กันอย่างสนุกสนาน\n\n"เป็นการดีที่ได้เห็น [other_owner.Custom('DogStoryName')] สนุกสนาน เช่นนี้!""
 pet_animal.1111.a:0 "ข้าเห็นด้วยอย่างยิ่ง!"

 pet_animal.1112.desc:0 "[other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] และข้าพบสุนัขทั้งสองหลังจากนั้นครู่หนึ่ง กำลังอยู่ในช่วงต่อสู้กันอย่างดุเดือด\n\n"เรียกหมาพันธุ์ทางของเจ้าออกไป!"\n\n"
 pet_animal.1112.desc_dead:0 "เมื่อข้าสามารถ ทำให้ [ROOT.Char.Custom('DogStoryName')] ถอยออกมาได้ในที่สุด สุนัขของ [other_owner.GetFirstNamePossessiveNoTooltip] ก็เริ่มตัวเย็นลงแล้ว"
 pet_animal.1112.desc_alive:0 "เมื่อข้าสามารถ ทำให้ [ROOT.Char.Custom('DogStoryName')] ถอยออกมาได้ในที่สุด [other_owner.GetTitledFirstNameNoTooltip] ก็จากไปโดยไม่เหลียวหลังมองแม้ แต่น้อย"
 pet_animal.1112.a:0 "เจ้าเป็นอะไรไหม [ROOT.Char.Custom('DogStoryName')]?"

 pet_animal.1113.t:0 "[ROOT.Char.Custom('DogStoryName')]: การประชุมสภา"
 pet_animal.1113.desc:1 "ขณะที่ข้าและสมาชิกสภาของข้ากำลังรวมตัวกันเพื่อประชุม สุนัขของข้า [ROOT.Char.Custom('DogStoryName')] ก็เข้ามาหาข้าด้วยดวงตาอ้อนวอนและหางตก\n\n[ROOT.Char.Custom('DogStorySheHe')|U] ไม่ชอบถูกทิ้งให้อยู่ตามลำพัง แต่นี่เป็นการประชุมที่สำคัญ..."
 pet_animal.1113.a:1 "[ROOT.Char.Custom('DogStorySheHe')|U] จะเข้าร่วมกับข้า"
 pet_animal.1113.a_success:1 "[ROOT.Char.Custom('DogStoryName')] ประพฤติตัวดี"
 pet_animal.1113.a_success.tt:0 "ไม่มีเรื่องร้ายแรงเกิดขึ้น"
 every_councillor:0 "[councillor|E] ทุกคน"
 pet_animal.1113.a_failure:1 "[ROOT.Char.Custom('DogStoryName')] ทำทุกอย่างยกเว้นสิ่งที่ควรทำ"
 pet_animal.1113.a_failure.tt:0 "มีเรื่อง... ไม่ดีเกิดขึ้น"
 pet_animal.1113.b:1 "สุนัขไม่มีที่ในการประชุมสภา"
 pet_animal.1113.b.tt:0 "ท่านกระแทกประตูปิดต่อหน้าดวงตาอ้อนวอนของสุนัข"
 pet_animal.1113.b_success:1 "[ROOT.Char.Custom('DogStoryName')] รออย่างอดทน"
 pet_animal.1113.b_failure:1 "[ROOT.Char.Custom('DogStoryName')] ออกไปผจญภัย"
 
 pet_animal.1114.desc:2 ""ขออภัย [ROOT.Char.GetTitledFirstNameNoTooltip]" [councillor.GetCouncilTitle] ของข้า [councillor.GetTitledFirstName] กล่าว "ข้าจำต้องไม่เห็นด้วยกับสิ่งที่ท่านเพิ่งจะ–"\n\n#EMP *กร๊รรร*#!\n\n[ROOT.Char.Custom('DogStoryName')] ส่งเสียงคำรามในลำคอ และ [councillor.GetTitledFirstNameNoTooltip] ก็ผงะถอยหลัง มองจากสุนัขมาที่ข้าแล้วกลับไปมองสุนัขอีก\n\n"คิดดูอีกที ข้าว่านั่นเป็นความคิดที่ยอดเยี่ยมมาก!""
 pet_animal.1014.a_girl:0 "ช่างเป็นเด็กดีจริงๆ [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1014.a_boy:0 "ช่างเป็นเด็กดีจริงๆ [ROOT.Char.Custom('DogStoryName')]!"

 pet_animal.1115.desc:2 ""ต่อไป ประเด็นถัดไป" [councillor.GetCouncilTitle] ของข้า [councillor.GetTitledFirstName] พูดเสียงยานคาง "เป็นเรื่องสำคัญอย่างยิ่งยวดที่–"\n\n#EMP *พรืดดด*#!\n\nความเงียบที่เข้าปกคลุมถูกทำลายลงเพียงด้วยเสียงเห่าอย่างมีความสุขของ [ROOT.Char.Custom('DogStoryName')] หลังจากได้ทำธุระส่วนตัวของ [ROOT.Char.Custom('DogStoryHerHis')] เรียบร้อยแล้ว"
 pet_animal.1115.a:0 "หมาไม่ดี!"

 pet_animal.1116.desc_opening:0 "ข้าออกจากห้องประชุมเพียงเพื่อพบว่า [ROOT.Char.Custom('DogStoryName')] หายไปแล้ว ข้าตามหา [ROOT.Char.Custom('DogStoryHerHim')] ไปทั่ว ทั้งสูงและต่ำ จะเป็นอย่างไรหาก [ROOT.Char.Custom('DogStorySheHe')] หลงทางและหวาดกลัว?\n\n"
 pet_animal.1116.desc:1 "ทันใดนั้นข้าก็บังเอิญพบ [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] โดยมีสุนัขตัวหนึ่งอยู่บนตักของ [courtier.GetHerHis] เกาท้องสี [ROOT.Char.Custom('DogFurColor')] ของมันอย่างแข็งขัน สุนัขที่ดูคล้ายกับ [ROOT.Char.Custom('DogStoryName')] อย่างน่าสงสัย\n\n"นี่เป็นเพื่อนคู่ใจที่ล้ำค่าที่ท่านมี [ROOT.Char.GetTitledFirstNameNoTooltip]!""
 pet_animal.1116.a:0 "ฮ่า ใช่ [ROOT.Char.Custom('DogStorySheHe')|U] ยอดเยี่ยมมาก..."

 pet_animal.1117.desc:1 "ทันใดนั้นข้าก็บังเอิญพบ [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังตำหนิสุนัขตัวหนึ่ง สุนัขที่ดูคล้ายกับ [ROOT.Char.Custom('DogStoryName')] อย่างน่าสงสัย มีเศษกระดาษและผ้าขาดๆ อยู่รอบตัว [ROOT.Char.Custom('DogStoryHerHim')]\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]! นี่... #EMP สัตว์ร้าย#! ตัวนี้ทำลายห้องพักของข้าจนหมด! ทุกอย่างฉีกเป็นชิ้นๆ!""
 pet_animal.1117.a:0 "เอ่อ... อุปส์ หมาไม่ดี!"

 pet_animal.1118.t:1 "[ROOT.Char.Custom('DogStoryName')]: ตัวป่วน"
 pet_animal.1118.desc:2 "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้า ความโกรธเกรี้ยวฉายในดวงตาของ [vassal.GetHerHis] และมีสุนัขอยู่ในมือของ [vassal.GetHerHis] ถูกลากคอมา ขณะที่ [vassal.GetSheHe] มาถึงตัวข้า ข้าเห็นว่าเป็น [ROOT.Char.Custom('DogStoryName')] สุดที่รักของข้าที่ [vassal.GetSheHe] ถืออยู่!\n\n"ข้าพบเจ้าสัตว์ร้ายนี้ท่ามกลางข้าวของของข้า – สิ่งที่ไม่ถูกกัดจนขาดวิ่นก็เต็มไปด้วยอุจจาระ!""
 pet_animal.1118.a:0 "ข้าจะชดใช้ให้ท่าน!"
 pet_animal.1118.b:0 "[ROOT.Char.Custom('DogStorySheHe')|U] ก็แค่สุนัขตัวหนึ่ง..."

 pet_animal.1190.t:0 "[ROOT.Char.Custom('DogStoryName')]: ลูกสุนัข"
 pet_animal.1190.desc:1 "[ROOT.Char.Custom('DogStoryName')] ได้ให้กำเนิดลูกสุนัขที่น่ารักตัวหนึ่ง! แม้ข้าจะรักมันมาก – และหางเล็กๆ ที่กระดิกไปมาของมัน – ข้าก็ไม่สามารถดูแลมันได้ เช่นกัน..."
 pet_animal.1190.a:0 "ข้าจะให้มันแก่ [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.1190.b:0 "[receiver_2.GetFirstNameNoTooltip] น่าจะมีเพื่อนคู่ใจสักตัว..."
 pet_animal.1190.c:0 "[receiver_3.GetFirstNameNoTooltip] คงจะดูแลมันได้..."
 pet_animal.1190.d:0 "ข้าจะขายมันที่ตลาด"

 pet_animal.1191.t:0 "ลูกสุนัข"
 pet_animal.1191.desc:1 "[giver.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพร้อมกับลูกสุนัขในอ้อมแขนของ [giver.GetHerHis]\n\n"ข้าดูแลมันไม่ได้ แต่บางทีท่านอาจจะให้บ้านแก่มันได้?""
 pet_animal.1191.a:0 "แน่นอน! ส่งมันมาเลย!"
 pet_animal.1191.b:0 "ข้าสามารถ... #EMP ดูแล#! มันได้"

 pet_animal.1192.t:0 "[receiver.Custom('DogStoryName')]: ชีวิตที่ปราศจากเจ้า"
 pet_animal.1192.desc_opening:0 "ข้าไปเยี่ยม [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))] ของข้า [receiver.GetTitledFirstName] เพื่อดูว่า [receiver.Custom('DogStoryName')] ตัวน้อยเป็นอย่างไรบ้างในการดูแลของ [receiver.GetHerHis]\n\n"
 pet_animal.1192.desc_alive_landed:0 "[receiver.GetSheHe|U] พบข้านอก [receiver.Custom('ResidenceBuilding')] ของ [receiver.GetHerHis] โดยมีสุนัขสี [receiver.Custom('DogFurColor')] อยู่ข้าง [receiver.GetHerHim] "[receiver.Custom('DogStorySheHe')|U] สบายดี –"
 pet_animal.1192.desc_alive:0 "[receiver.GetSheHe|U] พบข้านอกบ้าน โดยมีสุนัขสี [receiver.Custom('DogFurColor')] อยู่ข้าง [receiver.GetHerHim] "[receiver.Custom('DogStorySheHe')|U] สบายดี –"
 pet_animal.1192.desc_alive_1:0 "[receiver.Custom('DogStorySheHe')] ชอบไล่ไก่!""
 pet_animal.1192.desc_alive_2:0 "[receiver.Custom('DogStorySheHe')] ชอบเดินตามม้าไปรอบๆ!""
 pet_animal.1192.desc:0 "[receiver.GetSheHe|U] พบข้านอก [receiver.Custom('ResidenceBuilding')] ของ [receiver.GetHerHis] ไม่เห็นสุนัขเลย "โอ้ [receiver.Custom('DogStorySheHe')] คงออกไปเล่นที่ไหนสักแห่ง..."\n\n[receiver.GetSheHe|U] มองไปทุกที่ยกเว้นที่ข้า"
 pet_animal.1192.a:0 "ข้าโล่งใจ!"
 pet_animal.1192.b:0 "[receiver.Custom('DogStoryName')] อยู่ที่ไหน?!"

#Dog dies :(
 pet_animal.1199.t:0 "[ROOT.Char.Custom('DogStoryName')]: วันแห่งความโศกเศร้า"
 pet_animal.1199.desc:1 "[ROOT.Char.Custom('DogStoryName')] ได้เดินเคียงข้างข้ามาหลายปี และกาลเวลาก็ไม่ละเว้นสุนัข ขณะที่ข้าคุกเข่าลงข้าง [ROOT.Char.Custom('DogStoryHerHim')] [ROOT.Char.Custom('DogStorySheHe')] ก็เริ่มกระดิกหางของ [ROOT.Char.Custom('DogStoryHerHis')] ช้าๆ แต่ [ROOT.Char.Custom('DogStorySheHe')] ไม่สามารถเงยหัวของ [ROOT.Char.Custom('DogStoryHerHis')] ขึ้นได้\n\nข้านั่งอยู่กับ [ROOT.Char.Custom('DogStoryHerHim')] ยาวนานไปจนค่ำคืน ลูบหลังสี [ROOT.Char.Custom('DogStoryHerHis')] [ROOT.Char.Custom('DogFurColor')] จนกระทั่งหางหยุดนิ่ง"
 pet_animal.1199.a:0 "ข้าจะคิดถึงเจ้านะ [ROOT.Char.Custom('DogStoryName')]!"

##############
## CAT AND DOG
##############
 pet_animal.2001.t:0 "การกอดกันยามค่ำคืน"
 pet_animal.2001.desc:0 "ข้ากลับเข้าห้องพักเมื่อค่ำคืนมาถึง และพบ [ROOT.Char.Custom('CatStoryName')] และ [ROOT.Char.Custom('DogStoryName')] กอดกันกลมอยู่บนพื้น! ขนสี [ROOT.Char.Custom('DogStoryNamePossessive')] [ROOT.Char.Custom('DogFurColor')] เป็นมันเงา – เห็นได้ชัดว่า [ROOT.Char.Custom('CatStoryName')] ได้ทำความสะอาด [ROOT.Char.Custom('DogStoryHerHim')]"
 pet_animal.2001.a:0 "พวกมันอยู่ด้วยกันแล้วน่ารักจัง!"

 pet_animal.2002.t:0 "เหมือนแมวกับหมา"
 pet_animal.2002.desc:0 "ข้าก้าวเท้าออกไปข้างนอกเมื่อ [ROOT.Char.Custom('CatStoryName')] และ [ROOT.Char.Custom('DogStoryName')] ปรากฏตัวขึ้นจากทิศทางตรงกันข้าม\n\nข้าไม่มีเวลาตอบสนอง – พวกมันกระโจนเข้าใส่คอกันและกันในไม่กี่วินาที ขนสี [ROOT.Char.Custom('DogFurColor')] ปลิวว่อน และข้าได้ยินเสียงคำรามของทั้งคู่ อีกแล้ว การต่อสู้ที่ไม่หยุดหย่อนนี้ต้องยุติลง!"
 pet_animal.2002.a:0 "หยุดเดี๋ยวนี้นะ [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.2002.a.tt:0 "ข้าพยายามควบคุมสุนัข"
 pet_animal.2002.b:0 "[ROOT.Char.Custom('CatStoryName')] พอได้แล้ว!"
 pet_animal.2002.b.tt:0 "ข้าพยายามควบคุมแมว"
 pet_animal.2002.c:0 "ข้าไม่อยากเข้าไปอยู่ตรงกลาง..."
 pet_animal.2002.c.tt:0 "ข้ามั่นใจว่าพวกมันจะจัดการกันเองได้"

 pet_animal.2003.desc:0 "ข้าได้มองหาทั่ว [ROOT.Char.Custom('ResidenceBuilding')] แล้ว โดยมี [ROOT.Char.Custom('CatStoryName')] ตามหลังข้ามา แต่ข้าหาสุนัขของข้า [ROOT.Char.Custom('DogStoryName')] ไม่พบเลย!\n\nข้าหยุดคิด ก้มลงลูบ [ROOT.Char.Custom('CatStoryName')] เมื่อข้าเห็นกระจุกขนสี [ROOT.Char.Custom('DogFurColor')] เปื้อนเลือดติดอยู่ที่ฟันของ [ROOT.Char.Custom('CatStoryHerHis')] ขณะที่ข้าดึงมันออก [ROOT.Char.Custom('CatStorySheHe')] ก็ขู่ฟ่อและกระโดดไปยังมุมหนึ่งของลาน – มุมที่มีบางอย่างสี [ROOT.Char.Custom('DogFurColor')] นอนอยู่บนพื้น"
 pet_animal.2003.a:0 "โอ้ โอ้ ไม่นะ! [ROOT.Char.Custom('CatStoryName')] เจ้าไม่ได้...!"

 pet_animal.2004.desc_opening:0 "ขณะที่ข้ากำลังจะออกจาก [ROOT.Char.Custom('ResidenceBuilding')] [ROOT.Char.Custom('DogStoryName')] ก็เดินเข้ามาหาข้า กระดิกหางของ [ROOT.Char.Custom('DogStoryHerHis')] อย่างมีความสุข\n\n"
 pet_animal.2004.desc_female:0 ""สวัสดี! ใครเป็นเด็กดีกันนะ? ใช่ ใครกัน–""
 pet_animal.2004.desc_male:0 ""สวัสดี! ใครเป็นเด็กดีกันนะ? ใช่ ใครกัน–""
 pet_animal.2004.desc:0 "\n\nขณะที่ [ROOT.Char.Custom('DogStorySheHe')] เข้ามาใกล้ขึ้น ข้าเห็นว่าปากของ [ROOT.Char.Custom('DogStoryHerHis')] เต็มไปด้วยเลือดและเศษเนื้อ ด้วยใจที่หนักอึ้ง ข้าเดินไปยังทิศทางที่ [ROOT.Char.Custom('DogStorySheHe')] มา และในไม่ช้าข้าก็พบบร่างที่ไร้ลมหายใจของแมวข้า [ROOT.Char.Custom('CatStoryName')]"
 pet_animal.2004.a:0 "โอ้ ไม่นะ... [ROOT.Char.Custom('DogStoryName')] เจ้าทำได้อย่างไร?"

 pet_animal.2005.desc_opening:0 "ข้าหาทั้ง [ROOT.Char.Custom('CatStoryName')] และ [ROOT.Char.Custom('DogStoryName')] ไม่พบ ข้าค้นหาทั่ว [ROOT.Char.Custom('ResidenceBuilding')] และบริเวณโดยรอบ แต่ไม่มีใครเห็นพวกมันเลย\n\n"
 pet_animal.2005.desc:0 "ขณะที่ข้ากำลังจะหันหลังกลับ ข้าก็เห็นแอ่งเลือดเล็กๆ บนพื้น แล้วก็อีกแอ่ง และอีกแอ่ง... พวกมันนำข้าไปสู่กองขนเปื้อนเลือด – ร่างสองร่างที่ฉีกขาดพันกันอยู่บนพื้น และไม่ต้องสงสัยเลยว่าพวกมันคือใคร"
 pet_animal.2005.a:0 "ทำไมพวกเจ้าถึงเข้ากันไม่ได้นะ?!"

 pet_animal.2006.desc:0 "ขณะที่ข้ากำลังจะหันหลังกลับ ข้าก็เห็นพวกมัน – นอนกองอยู่บนพื้น โอ้ ไม่นะ! ในที่สุดพวกมันก็... แต่เมื่อข้าเข้าไปใกล้ หัวของ [ROOT.Char.Custom('CatStoryNamePossessive')] ก็เงยขึ้น และ [ROOT.Char.Custom('CatStorySheHe')] ก็มองข้าด้วยดวงตาอ่อนล้าก่อนที่จะกลับไปหลับต่อ"
 pet_animal.2006.a:0 "โอ้ พวกมัน... พวกมันเข้ากันได้แล้วจริงๆ!"

##############
## OTHER PEOPLE
##############
 pet_animal.5001.t:0 "แมวของศัตรู"
 pet_animal.5001.desc:0 "ขณะที่ข้าเดินผ่าน [rival_home.GetName] เพื่อทำธุระ แมวสี [rival.Custom('CatFurColor')] ตัวหนึ่งก็เข้ามาหาข้า ข้าเคยเห็นแมวตัวนี้ที่ไหนมาก่อนนะ...? อ้อ! มันคือแมว [rival.Custom('CatStoryName')] ของ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] ข้า [rival.GetTitledFirstNamePossessive]!\n\nขณะที่มันร้องเหมียวเงยหน้ามองข้าและส่งเสียงคราง ข้ารู้สึกถึงรอยยิ้มอันชั่วร้ายที่ผุดขึ้นบนใบหน้า"
 pet_animal.5001.a:0 "#EMP จุ๊ๆๆ#! – ข้าไม่ทำร้ายเจ้าหรอก..."
 pet_animal.5001.a.tt:0 "แค่กรีดมีดเร็วๆ เท่านั้น"
 pet_animal.5001.b:0 "ข้าจะลูบแมวของเจ้าโง่นั่นให้ดีเลย!"

 pet_animal.5002.t:0 "สุนัขของศัตรู"
 pet_animal.5002.desc:0 "ขณะที่ข้าเดินผ่าน [rival_home.GetName] เพื่อทำธุระ สุนัขสี [rival.Custom('DogFurColor')] ตัวหนึ่งก็เข้ามาหาข้า ข้าเคยเห็นสุนัขตัวนี้ที่ไหนมาก่อนนะ...? อ้อ! มันคือสุนัข [rival.Custom('DogStoryName')] ของ [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))] ข้า [rival.GetTitledFirstNamePossessive]!\n\nข้ารู้สึกถึงรอยยิ้มอันชั่วร้ายที่ผุดขึ้นบนใบหน้าขณะที่มันเห่าใส่ข้าอย่างมีความสุขพร้อมกับกระดิกหาง"
 pet_animal.5002.a:0 "มานี่สิ ข้าไม่ทำร้ายเจ้าหรอก..."
 pet_animal.5002.b:0 "ข้าจะลูบสุนัขของเจ้าโง่นั่นให้ดีเลย!"


##############
## DECISION EVENTS
##############
 pet_animal.6001.t:0 "การลูบ [ROOT.Char.Custom('DogStoryName')|U]"
 pet_animal.6001.desc:0 "ขณะที่ข้าลูบขนสี [ROOT.Char.Custom('DogStoryNamePossessive')] [ROOT.Char.Custom('DogFurColor')] ข้าสัมผัสได้ถึงความกังวลที่ค่อยๆ จางหายไป การมีความภักดีอันแน่วแน่จากใครสักคน และรู้ว่าพวกเขาจะอยู่เคียงข้างข้าเสมอ... หากเพียง แต่ผู้คนรอบตัวข้าจะเป็นเหมือนเจ้ามากกว่านี้ [ROOT.Char.Custom('DogStoryName')]!\n\nเรานั่งด้วยกันหลายนาที หางของ [ROOT.Char.Custom('DogStoryHerHis')] กระดิกไปมาและไหล่ของข้าก็ผ่อนคลายลง จนกระทั่งข้าพร้อมที่จะเผชิญหน้ากับโลกอีกครั้ง"
 pet_animal.6001.a:0 "ขอบใจนะ สหายข้า!"

 pet_animal.6002.desc:0 "ข้าพบ [ROOT.Char.Custom('DogStoryName')] ข้างนอก กำลังเล่นกับเด็กๆ บางคนอยู่ ขณะที่ [ROOT.Char.Custom('DogStorySheHe')] เห็นข้า [ROOT.Char.Custom('DogStorySheHe')] ก็รีบกระโดดเข้ามาหาพร้อมกับหางที่กระดิกไปมา และเมื่อข้านั่งยองๆ ลง [ROOT.Char.Custom('DogStorySheHe')] ก็พลิกตัวหงายท้องทันที\n\nข้าใช้เวลาหลายนาทีลูบท้องสี [ROOT.Char.Custom('DogStoryHerHis')] [ROOT.Char.Custom('DogFurColor')] และเป็นเวลานานแล้วที่ข้าไม่รู้สึกผ่อนคลาย เช่นนี้"

 pet_animal.6003.desc:0 "ขณะที่ข้าเดินออกไปข้างนอก ข้าเห็น [ROOT.Char.Custom('DogStoryName')] วิ่งเข้ามาหาข้า คาบไม้ท่อนหนึ่งอยู่ในปากของ [ROOT.Char.Custom('DogStoryHerHis')] ข้าเดาว่าข้าพอจะเจียดเวลาสักสองสามนาทีเล่นขว้างไม้กับ [ROOT.Char.Custom('DogStoryHerHim')] ได้ ใช่ นั่นคงจะผ่อนคลายดี\n\n#EMP เดี๋ยวก่อนนะ นี่มันอะไรกัน?!#!\n\nขณะที่ข้าก้มลงไปหยิบไม้ ข้าก็เห็นว่ามันไม่ใช่ไม้เลย แต่เป็น #EMP สิทธิ์ในการอ้างสิทธิ์เหนือ [target_county.GetName]!#! เจ้าไปได้สิ่งนี้มาได้อย่างไรกัน [ROOT.Char.Custom('DogStoryName')]!?"
 pet_animal.6003.a:0 "เด็กดี [ROOT.Char.Custom('DogStoryGirlBoy')], [ROOT.Char.Custom('DogStoryName')] #EMP เด็กดี!#!."
 pet_animal.6003.b:0 "[neighboring_ruler.GetTitledFirstNameNoTooltip] จะต้องยินดีเป็นล้นพ้นที่ได้สิ่งนี้คืน!"

 pet_animal.6004.desc:0 "ข้าพบ [ROOT.Char.Custom('DogStoryName')] ข้างนอก กำลังงีบหลับกลางแดด ข้านั่งยองๆ ลงข้าง [ROOT.Char.Custom('DogStoryHerHim')] และปล่อยให้มือลูบไล้ขนสี [ROOT.Char.Custom('DogStoryHerHis')] [ROOT.Char.Custom('DogFurColor')] และ–\n\nคำเตือนเดียวที่ข้าได้รับคือเสียงคำรามต่ำๆ และประกายเขี้ยว ก่อนที่ข้าจะรู้สึกถึงบางอย่าง #EMP ฉีก#! ที่แขนข้า ข้าถอยหลังกรูดก่อนที่ [ROOT.Char.Custom('DogStorySheHe')] จะกระโจนเข้าใส่ข้าอีกครั้ง แต่ความเจ็บปวด...!"
 pet_animal.6004.a:0 "มัน... มันคงเป็นความผิดพลาด!"
 pet_animal.6004.b:0 "เจ้า #EMP สัตว์ร้าย#!!"

 pet_animal.6051.t:0 "การลูบ [ROOT.Char.Custom('CatStoryName')|U]"
 pet_animal.6051.desc:0 "ข้าพบ [ROOT.Char.Custom('CatStoryName')] นอนหลับอยู่บนเตียงของข้า และเมื่อข้านั่งลงข้าง [ROOT.Char.Custom('CatStoryHerHim')] ข้าก็ได้รับการทักทายด้วยเสียงร้องเหมียวเบาๆ อย่างสับสน\n\nอย่างไรก็ตาม ขณะที่ข้าเริ่มสางนิ้วไปตามขนสี [ROOT.Char.Custom('CatStoryHerHis')] [ROOT.Char.Custom('CatFurColor')] [ROOT.Char.Custom('CatStorySheHe')] ก็เริ่มส่งเสียงครางอย่างพึงพอใจอย่างรวดเร็ว และเสียงนั้นดูเหมือนจะ ทำให้ทั้งร่างของข้าผ่อนคลาย"

 pet_animal.6052.desc:0 "ข้าพบ [ROOT.Char.Custom('CatStoryName')] ข้างนอก กำลังเดินอวดโฉมอยู่ในลาน ทันทีที่ [ROOT.Char.Custom('CatStorySheHe')] เห็นข้า [ROOT.Char.Custom('CatStorySheHe')] ก็ร้องเหมียวและเดินเข้ามาถูไถกับขาข้า\n\nข้าใช้เวลาหลายนาทีนั่งยองๆ อยู่ข้าง [ROOT.Char.Custom('CatStoryHerHis')] ลูบ [ROOT.Char.Custom('CatStoryHerHim')] และเกาคางให้ [ROOT.Char.Custom('CatStoryHerHim')] และเมื่อข้ายืนขึ้นอีกครั้ง ข้ารู้สึกตัวเบากว่าที่เคยเป็นมานาน"

##############
## EAGLE
##############
 pet_animal.3001.t: "นกอินทรี"
 pet_animal.3001.desc: "ข้าให้ลูกนกอินทรีตัวใหม่ของข้าเกาะบนถุงมือ และลูบขนของ[ROOT.Char.Custom('EagleStoryHerHis')]อย่างแผ่วเบา ช่างเป็นสัตว์ที่สง่างามและดุร้ายโดยแท้ [ROOT.Char.Custom('EagleStorySheHe')]มิใช่นกธรรมดาสามัญ\n\nขณะฝันกลางวันถึงการล่าที่จะมาถึง ข้าต้องคิดว่าจะเรียก[ROOT.Char.Custom('EagleStoryHerHim')]ว่ากระไร ก่อนที่เราจะออกไปจับสุนัขจิ้งจอกหรือกระต่ายป่าตัวแรกของ[ROOT.Char.Custom('EagleStoryHerHis')]"

 pet_animal.3010.t: "การหายตัวไปของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3010.desc: "[eagle_informer.GetFirstName] เข้ามาหาข้าด้วยสีหน้ากังวล "เรื่อง [ROOT.Char.Custom('EagleStoryName')] ขอรับ [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าหา [ROOT.Char.Custom('EagleStoryHerHim')] ไม่พบที่ใดเลย!"\n\n[eagle_informer.GetSheHe|U] มองไปรอบๆ ราวกับว่า [eagle_informer.GetSheHe] คาดหวังว่า [ROOT.Char.Custom('EagleStoryName')] จะโฉบลงมาจากท้องฟ้าได้ทุกเมื่อ [eagle_informer.GetFirstNameNoTooltip] ชี้ให้ข้าดูคอนเกาะที่ว่างเปล่าของ [ROOT.Char.Custom('EagleStoryHerHis')] และเราทั้งคู่ต่างสงสัยว่า [ROOT.Char.Custom('EagleStorySheHe')] หายไปที่ใด"
 pet_animal.3010.desc_thief: "\n\nเมื่อตรวจสอบที่เกิดเหตุ ข้าสังเกตเห็นขนนกสองสามเส้นบนพื้น และอีกสองสามเส้นติดอยู่ที่กิ่งไม้ใกล้ๆ [ROOT.Char.Custom('EagleStoryName')]จากไปด้วยความสมัครใจของ[ROOT.Char.Custom('EagleStoryHerHis')]เองหรือ?"
 pet_animal.3010.a: "ข้าจะทำทุกวิถีทางเพื่อตามหา[ROOT.Char.Custom('EagleStoryName')]!"
 pet_animal.3010.a_tt: "จะมีคนช่วยตามหานกอินทรีของท่านมากขึ้น และมีโอกาสพบมากขึ้น"
 pet_animal.3010.b: "ต้องมีใครบางคนเอา[ROOT.Char.Custom('EagleStoryHerHim')]ไปแน่ๆ..."
 pet_animal.3010.b_tt: "ท่านรวบรวมผู้ต้องสงสัยและเริ่มการสืบสวนการหายตัวไปของนกอินทรีของท่าน"
 pet_animal.3010.c: "[ROOT.Char.Custom('EagleStorySheHe')|U]จะปรากฏตัวในที่สุด"
 pet_animal.3010.c_tt: "ท่านปล่อยให้การกลับมาของนกอินทรีของท่านเป็นไปตามโชคชะตา"
 pet_animal.3010.d_mean: "ข้าไม่เคยใส่ใจพวกอย่าง[ROOT.Char.Custom('EagleStoryName')]อยู่แล้ว"
 pet_animal.3010.d_old: "[ROOT.Char.Custom('EagleStorySheHe')|U]ก็อายุมากแล้ว"
 pet_animal.3010.d: "บางทีมันอาจจะดีที่สุดแล้ว"
 pet_animal.3010.d_tt: "ท่านล้มเลิกการค้นหานกอินทรี"

 pet_animal.3011.t: "[ROOT.Char.Custom('EagleStoryName')]: การกลับมา"
 pet_animal.3011.desc: "เป็นเวลานานแล้วที่[ROOT.Char.Custom('EagleStoryName')]นกอินทรีสุดที่รักของข้าหายตัวไป และข้าเกือบจะหมดหวังที่จะได้ล่าสัตว์กับ[ROOT.Char.Custom('EagleStoryHerHim')]อีกครั้ง "
 pet_animal.3011.desc_freedom: "ข้าเริ่มหวนรำลึกถึงช่วงเวลาของเราด้วยกัน และเดินทางไปยังคอนไม้ประจำของ[ROOT.Char.Custom('EagleStoryHerHis')] น่าปิติยินดียิ่งนัก [ROOT.Char.Custom('EagleStoryName')]อยู่ที่นั่น มองมาที่ข้าด้วยดวงตาอันเฉียบคมของ[ROOT.Char.Custom('EagleStoryHerHis')] [ROOT.Char.Custom('EagleStorySheHe')|U]กลับมาแล้ว!"
 pet_animal.3011.desc_found: "บังเอิญเหลือเกิน ผู้ส่งสารคนหนึ่งมาพร้อมข่าวการพบเห็นนกที่ตรงกับลักษณะของ[ROOT.Char.Custom('EagleStoryHerHis')] ข้ารีบรุดไปยังสถานที่นั้น และที่นั่น[ROOT.Char.Custom('EagleStorySheHe')]ก็อยู่บนกิ่งไม้ มองมาที่ข้าราวกับไม่มีอะไรเกิดขึ้น"
 pet_animal.3011.desc_stolen: "ข้าพบ[ROOT.Char.Custom('EagleStoryHerHim')]อยู่ในมือของ[eagle_thief.GetName] ซึ่งกำลังพยายามขาย[ROOT.Char.Custom('EagleStoryHerHim')]ให้กับผู้ที่ให้ราคาสูงสุด ข้ารีบเข้าขัดขวาง และ[ROOT.Char.Custom('EagleStoryName')]ก็กลับมาอยู่ในอ้อมแขนของข้า"
 pet_animal.3011.desc_change: "\n\nขณะที่ข้าดีใจอย่างเหลือล้นที่ได้เห็น[ROOT.Char.Custom('EagleStoryName')]อีกครั้ง ข้าอดไม่ได้ที่จะสังเกตว่า[ROOT.Char.Custom('EagleStorySheHe')]เปลี่ยนไป "
 pet_animal.3011.desc_brave: "[ROOT.Char.Custom('EagleStoryName')]ดูอาจหาญขึ้น ราวกับว่า[ROOT.Char.Custom('EagleStorySheHe')]ได้เห็นโลกกว้างและไม่หวาดกลัวมันอีกต่อไป"
 pet_animal.3011.desc_curious: "[ROOT.Char.Custom('EagleStorySheHe')|U]เดินเตร็ดเตร่ไปทั่วค่าย ตรวจสอบทุกสิ่งด้วยสายตาที่กระตือรือร้น"
 pet_animal.3011.desc_loyal: "[ROOT.Char.Custom('EagleStorySheHe')|U]เกาะติดข้าแน่น ทำให้ถุงมือของข้ากลายเป็นคอนไม้ส่วนตัวของ[ROOT.Char.Custom('EagleStoryHerHis')]"
 pet_animal.3011.desc_calm: "ก่อนหน้านี้[ROOT.Char.Custom('EagleStorySheHe')|U]จะกระวนกระวายและอยู่ไม่สุข แต่บัดนี้[ROOT.Char.Custom('EagleStorySheHe')]กลับนั่งนิ่งอย่างสงบ แม้จะไม่ได้สวมหมวกคลุมตา"
 pet_animal.3011.desc_wise: "[ROOT.Char.Custom('EagleStorySheHe')|U]มองข้าด้วยสายตาที่หยั่งรู้ ราวกับว่า[ROOT.Char.Custom('EagleStorySheHe')]ได้พบเห็นสิ่งที่ข้ามิอาจจินตนาการได้"
 pet_animal.3011.desc_cunning: "[ROOT.Char.Custom('EagleStorySheHe')|U]ดูเหมือนจะเรียนรู้กลอุบายสองสามอย่าง และ[ROOT.Char.Custom('EagleStorySheHe')]ก็ไม่กลัวที่จะใช้มัน"
 pet_animal.3011.desc_observant: "[ROOT.Char.Custom('EagleStorySheHe')|U]บินร่อนอยู่เบื้องบน เฝ้ามองทุกสิ่งด้วยสายตาอันเฉียบคม"
 pet_animal.3011.desc_protective: "[ROOT.Char.Custom('EagleStorySheHe')|U]จิกทุกคนที่เข้ามาใกล้เกินไป ทั้งที่เมื่อก่อน[ROOT.Char.Custom('EagleStorySheHe')]ไม่เคยใส่ใจเลย"
 pet_animal.3011.desc_aggressive: "[ROOT.Char.Custom('EagleStorySheHe')|U]เกือบจะจิกทะลุถุงมือของข้าด้วยกรงเล็บของ[ROOT.Char.Custom('EagleStoryHerHis')] และข้าเห็นได้ว่า[ROOT.Char.Custom('EagleStorySheHe')]มิใช่สัตว์ที่จะล้อเล่นด้วยได้"
 pet_animal.3011.a: "ยินดีต้อนรับกลับมา [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3011.b: "[eagle_thief.GetName]จะต้องชดใช้ในเรื่องนี้!"

 pet_animal.3012.desc: "หลังจากการค้นหาเป็นเวลาหลายเดือน ข้าได้ข้อสรุปว่าข้าจะไม่ได้เห็น[ROOT.Char.Custom('EagleStoryName')]นกอินทรีสุดที่รักของข้าอีกแล้ว [eagle_informer.GetName]พยายามปลอบข้าว่า "นายท่าน ข้ามั่นใจว่า[ROOT.Char.Custom('EagleStorySheHe')]ยังคงอยู่ที่ไหนสักแห่ง และจะกลับมา" แต่ข้ารู้ดีกว่านั้น\n\n[ROOT.Char.Custom('EagleStorySheHe')|U]จากไปแล้ว และข้าต้องยอมรับความจริง"
 pet_animal.3012.a: "ลาก่อน [ROOT.Char.Custom('EagleStoryName')]"

 pet_animal.3013.t: "การค้นหา[ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3013.desc: "เมื่อรู้จัก[ROOT.Char.Custom('EagleStoryName')]ดีแล้ว มีโอกาสน้อยมากที่[ROOT.Char.Custom('EagleStorySheHe')]จะจากไปเอง ข้าตรวจสอบสถานที่สุดท้ายที่[ROOT.Char.Custom('EagleStoryHerHis')]อยู่่อย่างละเอียด และสอบถามรอบๆ ถึงการพบเห็น[ROOT.Char.Custom('EagleStoryHerHim')]\n\nบางคนที่ข้าสอบปากคำดูมีพิรุธ และข้าสงสัยว่าพวกเขารู้มากกว่าที่พูด เมื่อคิดดูอีกที "
 pet_animal.3013.desc_thief_1: "ข้าขอระบุชื่อ [accused_thief_1.GetName] ว่าเป็นผู้ต้องสงสัย เนื่องจากสันดาน [accused_thief_1.Custom2('InsultAdjective', ROOT.Char)] ของ [accused_thief_1.GetHerHis]"
 pet_animal.3013.desc_thief_2: "$pet_animal.3013.desc_thief_1$ แต่ [accused_thief_2.GetName] ก็เป็นผู้ต้องสงสัยที่น่าจะเป็นไปได้ เช่นกัน ด้วยความที่ [accused_thief_2.Custom2('InsultAdjective', ROOT.Char)] พอตัว..."
 pet_animal.3013.desc_thief_single: "ข้านึกออกเพียงคนเดียวที่อาจทำเรื่องนี้ได้..."
 pet_animal.3013.desc_thief_none: "ข้าจินตนาการไม่ออกเลยว่าใครจะเอา[ROOT.Char.Custom('EagleStoryName')]ไป"
 pet_animal.3013.a: "[accused_thief_1.GetName]เอานกอินทรีสุดที่รักของข้าไป!"
 pet_animal.3013.b: "หรือบางทีอาจจะเป็น[accused_thief_2.GetName]?"
 pet_animal.3013.d: "ข้าไม่สามารถกล่าวหาใครได้หากไม่มีหลักฐาน"
 pet_animal.3013.tt: "ท่านกล่าวหาว่า[accused_thief.GetNameNoTooltip]ขโมยนกอินทรีของท่าน"
 pet_animal.3013.wrong: "[accused_thief.GetName]ไม่ได้ขโมย[ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3013.unknown: "ชะตากรรมของนกอินทรีของท่านยังคงเป็นปริศนา..."
 rival_stole_from_me_eagle: "[CHARACTER.GetShortUIName|U]พยายามขโมยนกอินทรีล่าเหยื่อของ[TARGET_CHARACTER.GetNamePossessive]"
 rival_stole_from_me_eagle_corresponding: "[TARGET_CHARACTER.GetShortUIName|U]พยายามขโมยนกอินทรีล่าเหยื่อของ[CHARACTER.GetNamePossessive]"

 pet_animal.3020.t: "วัฏจักรยังคงดำเนินต่อไป"
 pet_animal.3020.desc_intro: "ข้ามองดู[ROOT.Char.Custom('EagleStoryName')] หวนรำลึกถึงวันที่ข้า"
 pet_animal.3020.desc_intro_standard: "จับ[ROOT.Char.Custom('EagleStoryHerHim')]มาจากรังของ[ROOT.Char.Custom('EagleStoryHerHis')]"
 pet_animal.3020.desc_intro_lure: "ล่อ[ROOT.Char.Custom('EagleStoryHerHim')]มาหาข้า"
 pet_animal.3020.desc_intro_gift: "ได้รับ[ROOT.Char.Custom('EagleStoryHerHim')]เป็นของขวัญ"
 pet_animal.3020.desc_intro_market: "ซื้อ[ROOT.Char.Custom('EagleStoryHerHim')]มาจากแผงขายของพ่อค้า"
 #pet_animal.3020.desc_intro_rescue: "rescued [ROOT.Char.Custom('EagleStoryHerHim')] from a trap."
 pet_animal.3020.desc_intro_stolen: "เอา[ROOT.Char.Custom('EagleStoryHerHim')]มาจากเงื้อมมือของผู้อื่น"
 pet_animal.3020.desc_intro_none: "พบ[ROOT.Char.Custom('EagleStoryHerHim')]"
 pet_animal.3020.desc: "และความทรงจำทั้งหมดที่เรามีร่วมกัน ตลอดหลายปีที่ผ่านมา[ROOT.Char.Custom('EagleStoryName')]ได้กลายเป็น[ROOT.Char.Custom('EaglePersonalityTrait1')]อย่างมาก [ROOT.Char.Custom('EagleStoryName')]เป็นสหายของข้า และข้าจินตนาการไม่ออกเลยว่าจะล่าสัตว์ได้อย่างไรหากไม่มี[ROOT.Char.Custom('EagleStoryHerHim')]\n\n"
 pet_animal.3020.desc_normal: "แต่สัตว์ เช่นนี้มิได้เกิดมาเพื่อถูกกักขังโดยคนอย่างข้า และคงจะดีที่สุดหาก[ROOT.Char.Custom('EagleStorySheHe')]ได้เป็นอิสระเพื่อสร้างลูกหลานของ[ROOT.Char.Custom('EagleStoryHerHis')]เอง บัดนี้ถึงเวลานั้นแล้วหรือยัง?"
 pet_animal.3020.desc_let_go: "ข้าเคยเผชิญภาวะที่กลืนไม่เข้าคายไม่ออก เช่นนี้มาก่อน และข้าเลือกที่จะเก็บ[ROOT.Char.Custom('EagleStoryName')]ไว้ข้างกาย ข้ารู้ว่า[ROOT.Char.Custom('EagleStorySheHe')]ควรจะมีอิสระ แต่[ROOT.Char.Custom('EagleStorySheHe')]ก็ยังไม่แก่ชรา บางทีข้าควรรออีกสักหน่อยกระมัง?"
 pet_animal.3020.desc_let_go_2: "อย่างไรก็ตาม ข้าได้กักขัง[ROOT.Char.Custom('EagleStoryName')]ไว้นานเกินไปแล้ว ถึงเวลาที่จะปล่อย[ROOT.Char.Custom('EagleStoryHerHim')]ให้เป็นอิสระเสียที"
 pet_animal.3020.a_tt: "ท่านปล่อยนกอินทรีของท่านคืนสู่ป่า"
 pet_animal.3020.a_second: "ไม่ อิสรภาพของ[ROOT.Char.Custom('EagleStoryHerHis')]นั้นล่าช้ามานานแล้ว"
 pet_animal.3020.b: "ข้ายังไม่อาจพรากจาก[ROOT.Char.Custom('EagleStoryHerHim')]ได้ในตอนนี้"
 pet_animal.3020.b_second: "[ROOT.Char.Custom('EagleStorySheHe')|U]ยังมีชีวิตอยู่อีกสองสามปีในตัว[ROOT.Char.Custom('EagleStoryHerHim')]"
 pet_animal.3020.b_tt: "ท่านเก็บนกอินทรีของท่านไว้ข้างกายอีกสักพัก พิจารณาการปล่อยในภายหลัง"
 pet_animal.3020.c: "ข้าจะไม่ปล่อย[ROOT.Char.Custom('EagleStoryName')]ไปเด็ดขาด!"
 pet_animal.3020.c_tt: "ความคิดที่จะปล่อยนกอินทรีของท่านคืนสู่ธรรมชาตินั้นเป็นไปไม่ได้เลยโดยสิ้นเชิง"
 pet_animal.3020.warning_less: "#warning สิ่งนี้มีโอกาสเล็กน้อยที่จะส่งผลกระทบต่อสุขภาพของนกอินทรีของท่าน#! "
 pet_animal.3020.warning: "#warning สิ่งนี้มีโอกาสที่จะส่งผลกระทบต่อสุขภาพของนกอินทรีของท่าน#! "
 pet_animal.eagle_weak_title: "สุขภาพของ[ROOT.Char.Custom('EagleStoryNamePossessive')]แย่ลง"
 pet_animal.eagle_unweak_title: "สุขภาพของ[ROOT.Char.Custom('EagleStoryNamePossessive')]ดีขึ้น"

 pet_animal.3030.t_eye: "ดวงตาของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3030.t_wing: "ปีกของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3030.t_claw: "กรงเล็บของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3030.desc_intro: "เมื่อเร็วๆ นี้ ข้าสังเกตเห็นว่า[ROOT.Char.Custom('EagleStoryName')]ดูเคร่งเครียดทีเดียว"
 pet_animal.3030.desc_training: "หลังจากการฝึกซ้อมครั้งล่าสุด ข้าสังเกตเห็นบางอย่างผิดปกติเกี่ยวกับ[ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3030.desc_eye: "ความแม่นยำตามปกติของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]ขาดหายไป และดวงตาข้างหนึ่งของ[ROOT.Char.Custom('EagleStoryHerHis')]ก็ปิดอยู่บ่อยกว่าปกติ เมื่อสงสัยในสิ่งที่เลวร้ายที่สุด ข้าโบกมือไปหน้าดวงตาที่ใช้การไม่ได้นั้น แต่[ROOT.Char.Custom('EagleStorySheHe')]ก็ไม่แม้ แต่จะสะดุ้ง! มันดูฝ่อลง ซึ่งอธิบายถึงปัญหาล่าสุดของ[ROOT.Char.Custom('EagleStoryHerHis')]"
 pet_animal.3030.desc_wing: "ขนนกสองสามเส้นของ[ROOT.Char.Custom('EagleStoryNamePossessive')]หายไป และ[ROOT.Char.Custom('EagleStorySheHe')]ก็ไม่สามารถบินได้สูงเท่าที่เคยทำได้ เมื่อสัมผัสปีกของ[ROOT.Char.Custom('EagleStoryHerHis')]เบาๆ ข้ารู้สึกได้ว่ามันตกมากกว่าปกติ ซึ่งอธิบายถึงปัญหาล่าสุดของ[ROOT.Char.Custom('EagleStoryHerHis')]"
 pet_animal.3030.desc_claw: "กรงเล็บหนึ่งของ[ROOT.Char.Custom('EagleStoryNamePossessive')]หัก และ[ROOT.Char.Custom('EagleStorySheHe')]ก็ไม่สามารถเกาะถุงมือของข้าได้แน่นเท่าที่เคยทำได้ เมื่อตรวจสอบกรงเล็บ ข้ารู้สึกได้ว่ามันร้าว ซึ่งอธิบายถึงปัญหาล่าสุดของ[ROOT.Char.Custom('EagleStoryHerHis')]"
 pet_animal.3030.desc_weak: "สิ่งนี้ ทำให้ข้ากังวลมากยิ่งขึ้น เนื่องจาก[ROOT.Char.Custom('EagleStorySheHe')]ป่วยอยู่แล้ว"
 pet_animal.3030.desc_outro: "\n\nอาการบาดเจ็บอาจลุกลามได้หากไม่ได้รับการรักษา แต่ข้าจะหายาได้อย่างไร?"
 pet_animal.3030.court_physician: "หาก[court_physician.GetFirstName]สามารถรักษาผู้ป่วยได้ [court_physician.GetSheHe]ก็สามารถรักษานกอินทรีของข้าได้"
 pet_animal.3030.court_huntsman: "เจ้ารู้เรื่องสัตว์ดีมิใช่หรือ [court_huntsman.GetFirstName]?"
 pet_animal.3030.random_smart_courtier: "[random_smart_courtier.GetFirstName]มีความรู้กว้างขวาง บางที[random_smart_courtier.GetSheHe]อาจช่วยได้"
 pet_animal.3030.self: "ข้ารู้วิธีรักษาอาการป่วยนี้"
 pet_animal.3030.none: "ข้าต้องปล่อยให้เป็นไปตามวิถีแห่งธรรมชาติ"
 pet_animal.3030.very_good: "พวกเขารักษานกอินทรีของท่านให้กลับมาแข็งแรงสมบูรณ์ได้สำเร็จ"
 pet_animal.3030.good: "พวกเขารักษาอาการบาดเจ็บของนกอินทรีของท่าน"
 pet_animal.3030.good_self: "ท่านรักษาอาการบาดเจ็บของนกอินทรีของท่านได้สำเร็จ"
 pet_animal.3030.very_good_self: "ท่านรักษานกอินทรีของท่านให้กลับมาแข็งแรงสมบูรณ์ได้สำเร็จ"
 pet_animal.3030.nothing: "ดูเหมือนไม่มีอะไรที่พวกเขาทำจะช่วยได้เลย"
 pet_animal.3030.bad: "ด้วยเหตุผลบางอย่าง พวกเขากลับ ทำให้อาการของนกอินทรีของท่านแย่ลง"

