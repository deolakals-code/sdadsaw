 pet_animal.3050.t: "นกอินทรีของศัตรู"
 pet_animal.3050.desc: "ขณะที่ข้าเดินผ่าน[rival_home.GetName]เพื่อไปทำธุระ ข้าเห็นนกอินทรีที่มีลักษณะนิสัย[rival.Custom('EaglePersonalityTraitTooltip')]ตัวหนึ่งอยู่ในกรง ข้าเคยเห็นนกตัวนี้ที่ไหนมาก่อนนะ...? อ้อ! มันคือนกอินทรี[rival.Custom('EagleStoryName')]ของ[rival.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))]ของข้านี่เอง!\n\nข้ารู้สึกถึงรอยยิ้มอันชั่วร้ายที่ผุดขึ้นบนใบหน้าขณะที่มันส่งเสียงร้องมาทางข้าด้วยสายตาที่เฉียบคม"
 pet_animal.3050.a.tt: "ท่านพยายามทำร้ายนกอินทรีของ[rival.GetFirstNamePossessiveNoTooltip]"
 pet_animal.3050.steal: "ข้าจะเอานกตัวนี้มาเป็นของข้า!"
 pet_animal.3050.steal.tt: "ท่านพยายามขโมยนกอินทรีของ[rival.GetFirstNamePossessiveNoTooltip]"
 pet_animal.3050.b: "ข้าจะเอานกตัวนี้ไปให้[token_child.GetName]!"
 pet_animal.3050.b.flavor: "การขโมยเพื่อการกุศลไม่ใช่เรื่องผิด"
 pet_animal.3050.b.tt: "ท่านพยายามขโมยนกอินทรีของ[rival.GetFirstNamePossessiveNoTooltip]ให้[token_child.GetNameNoTooltip]"
 pet_animal.3050.good: "ท่านประสบความสำเร็จในการทำลายล้าง[rival.GetFirstNameNoTooltip]"
 pet_animal.3050.bad: "นกอินทรีไม่ได้รับอันตราย"
 pet_animal.3050.c: "ข้าคงทำเงินก้อนโตจาก[rival.Custom('EagleStoryName')]ได้..."
 pet_animal.3050.c_tt: "ท่านพยายามขายนกอินทรีของคู่แข่งเพื่อเงินก้อนโต"
