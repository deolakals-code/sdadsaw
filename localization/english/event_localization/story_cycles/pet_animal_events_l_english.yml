 pet_animal.3050.d: "น่ารักจัง!"

 pet_animal.3060.t: "นักล่าฝึกหัด"
 pet_animal.3060.t_girl: "นักล่าหญิงฝึกหัด"
 pet_animal.3060.desc_intro: "[token_child.GetName]เติบโตขึ้นมาเป็นคนที่[token_child.Custom('ComplimentAdjective')]ทีเดียว และข้าก็ภูมิใจในตัว[token_child.GetHerHim]อย่างยิ่ง แม้ว่า[token_child.GetHerHis]จะประสบความสำเร็จมากมาย แต่[token_child.GetSheHe]ก็จะเผชิญปัญหามากมายหากไม่ได้รับการสอนให้ล่าสัตว์อย่างถูกวิธี\n\n"
 pet_animal.3060.desc: "ข้าตัดสินใจใช้นกอินทรีของข้า [ROOT.Char.Custom('EagleStoryName')] เพื่อช่วยเรา และด้วยวิธีนั้น[ROOT.Char.Custom('EagleStorySheHe')]ก็จะชอบ[token_child.GetFirstNameNoTooltip]มากขึ้น"
 pet_animal.3060.desc_child: "โชคดีที่[token_child.GetSheHe]เรียนรู้ได้เร็ว และมีนกอินทรีเป็นของ[token_child.GetHerHis]เองแล้ว [token_child.Custom('EagleStoryName')]คือชื่อของ[ROOT.Char.Custom('EagleStoryHerHis')] และ[token_child.GetNameNoTooltip]ก็ชอบ[ROOT.Char.Custom('EagleStoryHerHim')]อยู่แล้ว"
 pet_animal.3060.a: "หวังว่า[token_child.GetFirstNameNoTooltip]จะเป็นนักล่าที่ยอดเยี่ยมในสักวันหนึ่ง!"
 pet_animal.3060.a_girl: "[token_child.GetFirstNameNoTooltip]จะเป็นนักล่าหญิงที่ยอดเยี่ยมในสักวันหนึ่ง!"
 pet_animal.3060.good: "[token_child.GetFirstNameNoTooltip]ดูแลนกอินทรีได้ดี"
 pet_animal.3060.decent: "ทักษะการใช้นกเหยี่ยวของ[token_child.GetFirstNamePossessiveNoTooltip]ควรได้รับการฝึกฝนเพิ่มเติม"

 pet_animal.3070.t: "เพลงของ[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3070.desc: "ถึง แม้ว่าปกติข้าจะไม่ให้นกอินทรีของข้าอยู่ในสายตาผู้อื่น แต่[ROOT.Char.Custom('EagleStorySheHe')]ก็ร้องเสียงดังลั่นมาทั้งสัปดาห์แล้ว ด้วยความที่ไม่ต้องการได้ยินเสียงน่ารำคาญทั้งวัน บ้านชั่วคราวใหม่ของ[ROOT.Char.Custom('EagleStoryHerHis')]จึงอยู่ที่ลานบ้าน\n\nเมื่อข้ามาตรวจดู[ROOT.Char.Custom('EagleStoryHerHim')]ในภายหลัง ข้าพบ[target.GetName]กำลังฟังเพลงของ[ROOT.Char.Custom('EagleStoryNamePossessive')] "นี่นกของท่านหรือ?" [target.GetFirstNameNoTooltip]สอบถาม และข้าก็พยักหน้าอย่างไม่เต็มใจนัก\n\n"[ROOT.Char.Custom('RandomPositiveLookAdjective')|U]!" [target.GetSheHe]อุทาน ถึงแม้ข้าจะไม่เห็นด้วยก็ตาม"
 pet_animal.3070.a: "ข้าดีใจที่มีคนชอบมัน"
 eagle_funny_sing_modifier: "บทเพลงเดียวดายของวิหค"

 pet_animal.3080.t: "ของขวัญจาก[ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 pet_animal.3080.desc: "ข้าพบว่าตัวเองกำลังรีบวิ่งตาม[ROOT.Char.Custom('EagleStoryName')] ซึ่งจู่ๆ ก็บินหนีข้าไปขณะที่เรากำลังขี่ม้า เมื่อข้าตาม[ROOT.Char.Custom('EagleStoryHerHim')]ทันในที่สุด [ROOT.Char.Custom('EagleStorySheHe')]กำลังจัดการกับสัตว์ขนปุยที่ดิ้นรนอยู่ในกรงเล็บของ[ROOT.Char.Custom('EagleStoryHerHis')]! ประทับใจกับการจับเหยื่อครั้งนี้ ข้าปล่อยให้[ROOT.Char.Custom('EagleStoryHerHim')]ได้รางวัลของ[ROOT.Char.Custom('EagleStoryHerHis')]\n\n"แกร๊วกกก!" [ROOT.Char.Custom('EagleStorySheHe')]ร้องขณะทิ้งซากสัตว์ไร้ชีวิตลงแทบเท้าข้า"
 pet_animal.3080.a: "ช่าง... น่ารักเสียจริง?"

 pet_animal.3199.t: "[ROOT.Char.Custom('EagleStoryName')]: เที่ยวบินสุดท้าย"
 pet_animal.3199.desc_intro: "[ROOT.Char.Custom('EagleStoryName')]ได้โบยบินเคียงข้างข้ามาหลายปี และกาลเวลาก็มิได้ละเว้น[ROOT.Char.Custom('EagleStoryHerHim')]"
 pet_animal.3199.desc: "แม้จะเจ็บปวดที่ต้องกล่าว แต่ขนของ[ROOT.Char.Custom('EagleStoryHerHis')]ก็หม่นหมองลง และ[ROOT.Char.Custom('EagleStorySheHe')]ก็ไม่สามารถบินได้ด้วยพละกำลัง เช่นที่เคยมีอีกต่อไป"
 pet_animal.3199.desc_dying: "ด้วยสุขภาพที่ทรุดโทรมของ[ROOT.Char.Custom('EagleStoryHerHis')] ข้ารู้ว่า[ROOT.Char.Custom('EagleStorySheHe')]จะอยู่กับข้าได้อีกไม่นาน"
 pet_animal.3199.desc_outro: "\n\nข้าถอดหมวกคลุมตาออกจากดวงตาของ[ROOT.Char.Custom('EagleStoryHerHis')] และปล่อย[ROOT.Char.Custom('EagleStoryHerHim')]สู่ท้องนฟ้า [ROOT.Char.Custom('EagleStorySheHe')|U]ทะยานขึ้นสูง และสูงขึ้นไปอีก แต่ข้ารู้ว่า[ROOT.Char.Custom('EagleStorySheHe')]จะไม่กลับมา"
 pet_animal.3199.a: "ข้าจะคิดถึงเจ้า [ROOT.Char.Custom('EagleStoryName')]!"
 artifact_animal_feather_name_eagle: "ขนนกของ[ROOT.Char.Custom('EagleStoryNamePossessive')]"
 artifact_bird_feather_pet_description: "ขนนกอินทรีนักล่าอันเป็นที่รัก ซึ่ง[ROOT.Char.GetTitledFirstName]ถอนมา"
