 diarchies.0000.diarch_mandate_fail.tt.train_self.self:0 "[diarch.GetSheHe|U] มุ่งเน้นฝึกฝน[diarch.GetHerselfHimself]แทนที่จะเป็นกองทหารของท่าน"

 diarchy.0021.t:1 "ถูกเรียกให้เป็น[liege.GetDiarchTitle|U]"
 diarchy.0021.desc.appointment_nature.child:0 "ด้วย[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]เป็นเพียงเด็ก เห็นได้ชัดว่า[liege.GetSheHe]มิอาจปกครอง[liege.GetPrimaryTitle.GetName]ได้อย่างมีประสิทธิภาพ [liege.GetSheHe|U]ต้องการมือที่มั่นคงและแน่วแน่เพื่อนำทาง[liege.GetHerHim] อย่างน้อยก็จนกว่า[liege.GetHerHis]จะบรรลุนิติภาวะ"
 diarchy.0021.desc.appointment_nature.incapable:0 "ด้วย[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]ตกอยู่ในสภาพสั่นเทา อ่อนแอ #EMP ย่ำแย่#! [liege.GetPrimaryTitle.GetName]จึงใกล้จะเกิดอนาธิปไตยอย่างสมบูรณ์ โดยเฉพาะอย่างยิ่ง เมื่อพิจารณาจากสภาพของ[liege.GetHerHis] ใครจะรู้ว่าเราจะขาดอำนาจไปนานเท่าใด?"
 diarchy.0021.desc.appointment_nature.imprisoned:0 "ด้วย[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]ถูกจองจำโดย[liege.GetImprisonedBy.GetTitledFirstName] [liege.GetPrimaryTitle.GetName]จึงไร้หางเสือและล่องลอย การสื่อสารจากเจ้าเหนือหัวของเราเกิดขึ้นได้บ่อยเท่าที่ผู้คุมของ[liege.GetHerHis]จะอนุญาต และจดหมายฉบับใดที่#EMP มา#!จาก[liege.GetTitleAsNameNoTooltip]อย่างแท้จริงนั้นเป็นประเด็นถกเถียงกันอยู่ตลอดเวลา"
 diarchy.0021.desc.appointment_nature.travelling:0 "ด้วย[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]กำลังปฏิบัติภารกิจอยู่ในต่างแดน [liege.GetPrimaryTitle.GetName]จึงตกอยู่ในสภาวะไม่แน่นอนอย่างเงียบๆ การไม่มี[liege.GetTitleAsNameNoTooltip]ประจำการหมายถึงไม่มีอำนาจผูกพัน และ#EMP นั่น#! ทำให้เหล่าข้าหลวงวิตกกังวล"
 diarchy.0021.desc.appointment_nature.war:0 "ด้วย[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]ออกไปรบในสงคราม ความตึงเครียดจึงคุกรุ่นในหมู่พวกเราที่ถูกทิ้งไว้เบื้องหลัง การสื่อสารจาก[liege.GetTitleAsNamePossessiveNoTooltip]ไม่สม่ำเสมอ และกองข้อพิพาทก็เพิ่มสูงขึ้นทุกวัน"
 diarchy.0021.desc.appointment_nature.fallback:0 "เป็นที่ประจักษ์แก่ทุกคนใน[liege.GetPrimaryTitle.GetName]ว่า[liege.Custom2('MyCharacterIntroduction', ROOT.Char)]มิอาจแบกรับภาระการปกครองโดยลำพัง[liege.GetHerselfHimself]ได้ หากไม่ก่อให้เกิดความเสียหายที่ไม่อาจแก้ไขได้ต่อดินแดนของเรา"
 diarchy.0021.desc.diarchy_type.regency_temporary:0 "\n\nแม้ว่าหน้าที่นี้คาดว่าจะไม่นานนัก แต่ต้องมีใครสักคนดูแลอาณาจักร ชี้ขาดข้อพิพาท และรักษาบัลลังก์ให้[liege.GetTitledFirstNameNoTooltip]ในฐานะ"
 diarchy.0021.desc.diarchy_type.regency_entrenched:0 "\n\nเนื่องจากสถานการณ์นี้มีแนวโน้มที่จะดำเนินต่อไปอีกระยะหนึ่ง อาณาจักรจึงจำเป็นต้องรู้ว่าจะหันไปหาใครเมื่อ[liege.GetTitledFirstNameNoTooltip]มิอาจปฏิบัติหน้าที่ยุติธรรมได้ด้วยตนเอง เราต้องการใครสักคนมารับใช้เป็นการถาวร ในฐานะ"
 diarchy.0021.desc.diarchy_type.fallback:0 "\n\nดูเหมือนชัดเจนว่าเราไม่อาจดำเนินต่อไป เช่นนี้ได้ เนื่องจาก[liege.GetTitledFirstNameNoTooltip]มิอาจปกครองโดยลำพัง[liege.GetHerselfHimself]ได้ จึงต้องมีใครสักคนมารับใช้ในฐานะ[liege.GetHerHis]"
 diarchy.0021.desc.outro:0 "[liege.GetDiarchTitle|U].\n\nโดยธรรมชาติแล้ว ผู้นั้นคือข้า"
 diarchy.0021.reminder.diarch_powers:0 "ท่านได้รับสิทธิ์เข้าถึง[diarch_powers|E] ซึ่งสามารถใช้ต่อต้าน[liege|E]และเพื่อน[vassals|E]ของท่านได้"
 diarchy.0021.reminder.scales_of_power:0 "[scales_of_power|E]ได้ถูกเปิดใช้งาน และสามารถแกว่งเพื่อปลดล็อก[diarch_powers|E]เพิ่มเติมได้"
 diarchy.0021.a:0 "ข้าจักเริ่มการปก—#EMP ครอง#!—ของข้าทันที!"
 diarchy.0021.a.sedate:0 "ข้ามีความคิดมากมายสำหรับอาณาจักรนี้แล้ว!"
 diarchy.0021.b:0 "อา การยอมรับ"
 diarchy.0021.c:0 "ข้าเกรงว่าข้ามีภาระผูกพันเร่งด่วนมากเกินไป..."

 ##################################################
 # #Modifiers
 mandate_induced_fines_to_liege_modifier:0 "ค่าปรับอาชญากรรมที่สูงเกินควร"
 mandate_induced_fines_to_liege_modifier_desc:0 "เคาน์ตีนี้ประสบปัญหาภายใต้แอกของค่าปรับอาชญากรรมอันโหดร้าย ซึ่งเรียกเก็บเพื่อเพิ่มพูนความมั่งคั่งให้กับอาณาจักรโดยรวม"
 mandate_induced_fines_split_modifier:0 "ค่าปรับอาชญากรรมที่สูงเกินควร ซึ่งถูกแบ่ง"
 mandate_induced_fines_split_modifier_desc:0 "เคาน์ตีนี้ประสบปัญหาภายใต้แอกของค่าปรับอาชญากรรมอันโหดร้าย ซึ่งส่วนใหญ่ตกเป็นของขุนนางท้องถิ่นโดยตรง"
 mandate_fines_being_ignored_modifier:0 "ค่าปรับอาชญากรรมถูกเพิกเฉย"
 mandate_fines_being_ignored_modifier_desc:0 "เคาน์ตีนี้กำลังเพิกเฉยต่อข้อเรียกร้องให้มีการปรับที่เข้มงวดขึ้นกับอาชญากร และยังคงโกรธเคืองที่ถูกร้องขอด้วยซ้ำ"

 mandate_hated_recruiter_modifier:0 "ผู้เกณฑ์ทหารที่ถูกเกลียดชัง"
 mandate_hated_recruiter_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักว่า#EMP โหดเหี้ยม#!ในการประเมินว่าใครเหมาะสมกับการเกณฑ์ทหาร"
 mandate_failed_to_drum_up_rural_recruits_modifier:0 "ผู้เกณฑ์ทหารที่ล้มเหลว"
 mandate_failed_to_drum_up_rural_recruits_modifier_desc:0 "ตัวละครนี้มีชื่อเสียงที่ไม่ดีในการพยายาม และล้มเหลว ในการระดมพลเกณฑ์มากกว่าที่ถือว่ายุติธรรม"
 mandate_squeezing_recruiting_sources_modifier:0 "การเกณฑ์ทหารแบบอันธพาล"
 mandate_squeezing_recruiting_sources_modifier_desc:0 "หากพวกเขาอยู่ในวัยที่สู้รบได้ พวกเขาจะต้องรับใช้ตามเวลา หรือพวกเขาจะต้องชดใช้ราคา"
 mandate_extra_recruiting_sources_modifier:0 "การเกณฑ์ทหารนอกกฎหมาย"
 mandate_extra_recruiting_sources_modifier_desc:0 "แม้ว่าพวกเขาจะต้องนำกองทหารมาทำสงครามเพียงจำนวนหนึ่ง แต่เคาน์ตีนี้รู้ดีว่าควรจะส่งมาเพิ่มอีกเล็กน้อย มิฉะนั้น..."

 mandate_sellswords_bolster_ranks_modifier:0 "ทหารรับจ้างเสริมกำลังพล"
 mandate_sellswords_bolster_ranks_modifier_desc:0 "เมื่อใดก็ตามที่ทหารในครัวเรือนของตัวละครนี้เสียชีวิตหรือเกษียณ ดูเหมือนว่าจะไม่มีปัญหาขาดแคลนทหารรับจ้างที่กระตือรือร้นพร้อมที่จะเข้ามาแทนที่"
 mandate_sellswords_bolster_recruitment_modifier:0 "ทหารรับจ้างเสริมการเกณฑ์"
 mandate_sellswords_bolster_recruitment_modifier_desc:0 "ทหารรับจ้างที่มองหาแหล่งรายได้ที่#EMP ถาวร#!มากขึ้นต่างกระตือรือร้นที่จะเข้าร่วมครัวเรือนของตัวละครนี้เสมอ"

 mandate_hired_thugs_modifier:0 "อันธพาลรับจ้าง"
 mandate_hired_thugs_modifier_desc:0 "สิ่งเลวร้ายดูเหมือนจะเกิดขึ้นกับผู้ที่ไม่เห็นด้วยกับตัวละครนี้"
 mandate_emptied_gaols_modifier:0 "คุกว่างเปล่า"
 mandate_emptied_gaols_modifier_desc:0 "พวกอันธพาลและโจรต่างหลั่งไหลมายังเคาน์ตี โดยรู้ว่าที่นี่อาชญากรรมของพวกเขาจะได้รับการอภัยโทษเพื่อแลกกับการรับราชการทหาร"

 mandate_baronial_troops_trained_modifier:0 "กองทหารบารอนได้รับการฝึกฝน"
 mandate_baronial_troops_trained_modifier_desc:0 "กองทหารของตัวละครนี้จำนวนมากขึ้นเหมาะสมที่จะนำไปรบมากกว่าที่คาดไว้"
 mandate_baronial_troops_half_trained_modifier:0 "กองทหารบารอนได้รับการฝึกฝนครึ่งหนึ่ง"
 mandate_baronial_troops_half_trained_modifier_desc:0 "$mandate_baronial_troops_trained_modifier_desc$"
 mandate_focused_on_own_training_modifier:0 "มุ่งเน้นที่สมรรถภาพ"
 mandate_focused_on_own_training_modifier_desc:0 "การมุ่งเน้นที่พื้นฐานอย่างสม่ำเสมอช่วยให้ตัวละครนี้อยู่ในสภาพพร้อมรบที่ดี"
 mandate_strained_self_training_modifier:0 "การฝึกตนเองที่ตึงเครียด"
 mandate_strained_self_training_modifier_desc:0 "ตัวละครนี้ได้รับบาดเจ็บจากการฝึกกองเกณฑ์และยังไม่หายดีนัก"

 shift_privileges_monopolies_sold_modifier:0 "การผูกขาดถูกขาย"
 shift_privileges_monopolies_sold_modifier_desc:0 "บุคคลที่ไม่น่าเชื่อถือบางคนได้ขายสิทธิ์ แต่เพียงผู้เดียวในการขายหรือผลิตสินค้าบางอย่าง#EMP โดยไม่ได้รับ#!อนุญาตจากผู้ปกครองท้องถิ่น!"
 shift_privileges_scutage_exemptions_modifier:0 "การยกเว้นค่าทดแทนการเกณฑ์ทหาร"
 shift_privileges_scutage_exemptions_modifier_desc:0 "เอกสารที่มีตราประทับสูงกว่าของผู้ปกครองท้องถิ่นแสดงให้เห็นว่าชาวนาท้องถิ่นส่วนใหญ่ได้รับการยกเว้นจากการรับราชการทหาร"
 shift_privileges_conflicting_deeds_modifier:0 "โฉนดที่ขัดแย้งกัน"
 shift_privileges_conflicting_deeds_modifier_desc:0 "คนพาลเจ้าเล่ห์ได้ขายที่ดินเล็กๆ น้อยๆ ให้กับผู้มีอิทธิพลในท้องถิ่นต่างๆ ซึ่งทับซ้อนหรือลบล้างสิทธิ์ของผู้ปกครองท้องถิ่น"

 ##################################################
 # #Mandates - Fill Coffers
 diarchy.1201.t:0 "เปิดใจ เปิดกระเป๋า"
 diarchy.1201.desc:1 ""ภาษีย้อนหลังรึ? ท่านหมายความว่ากระไร #EMP ภาษีย้อนหลัง#!?" [exploitable_vassal.GetTitledFirstName] เยาะเย้ย "ข้าจ่ายค่าธรรมเนียมให้ราชสำนักตรงเวลาและครบถ้วนทุกเพนนี เช่นเดียวกับผู้อื่น และไม่พอใจที่ถูกขูดรีดเพิ่ม"\n\n[exploitable_vassal.GetSheHe|U] ต่อต้าน... ความคิดที่จะจ่ายสิบชักหนึ่งเพิ่มมากกว่าที่ข้าหวังไว้ แต่คำสั่งของข้าในฐานะ [liege.GetDiarchTitle] กำหนดให้ข้าต้องดำเนินการเรื่อง เช่นนี้เพื่อรับใช้เจ้าเหนือหัวของข้า"
 diarchy.1201.a:0 "ด้วยอำนาจของ[liege.GetTitledFirstNameNoTooltip] ท่าน#EMP จะต้อง#!จ่าย"
 diarchy.1201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1201.b:0 "ท่านพูด เช่นนั้น แต่บันทึกเหล่านี้แสดงรายได้เพียงบางส่วนเท่านั้น..."
 diarchy.1201.b.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] ยอมจ่าย"
 diarchy.1201.b.tt.failure:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] ยังคงยืนกราน"
 diarchy.1201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1201.c:0 "[liege.GetTitleAsNameNoTooltip]และข้าไม่ได้ขอร้อง เรากำลังสั่ง"
 diarchy.1201.c.tt.success:0 "$diarchy.1201.b.tt.success$"
 diarchy.1201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1201.c.tt.failure:0 "$diarchy.1201.b.tt.failure$"
 diarchy.1201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1201.d:0 "ข้าทำ เช่นนี้ไม่ได้ — แน่นอนว่าภาษีของท่านเรียบร้อยดี โปรดอย่าใส่ใจข้าเลย"
 diarchy.1201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1201.e:0 "ท่านพูดถูก ถือว่าหนี้สินเหล่านี้ถูกลืมไปแล้ว"
 diarchy.1201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1211.t:0 "ข้อกำหนดและเงื่อนไข"
 diarchy.1211.desc:1 ""... และพยานหลายคนในคำสาบานแสดงความจงรักภักดีของท่านยืนยันว่าท่านสัญญาว่าจะ #EMP เกิน#! ภาระผูกพันของท่าน ไม่ใช่เพียงแค่เท่าเทียมกัน" ข้ากล่าวจบ [exploitable_vassal.GetTitledFirstName] จ้องมองกลับมาที่ข้าจากอีกฟากของโต๊ะสภา ตะลึงงัน\n\n"ท่านกำลังบอกว่าคำให้การของขุนนางชั้นผู้น้อยที่ไม่มีชื่อเสียงบางคนเป็นเหตุผลให้ข้าเป็นหนี้เจ้าเหนือหัวของเรา #EMP มากขึ้น#! อีกหรือ?" [exploitable_vassal.GetSheHe] พูดตะกุกตะกัก ยังคงตกตะลึงกับความอาจหาญในการอ้างสิทธิ์ของข้า\n\nมันเป็นข้อเสนอที่เสี่ยง แต่คำสั่งของข้าในฐานะ [liege.GetDiarchTitle] เรียกร้องให้ข้าส่งเสริมสถานะของ [liege.GetTitledFirstName]"
 diarchy.1211.a:0 "ใช่แล้ว และหากท่านไม่ชอบพยานเหล่านี้ ข้าก็มีคนอื่นอีก"
 diarchy.1211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1211.b:0 "พยานเป็นสาระสำคัญ — คำสัตย์ปฏิญาณเหล่านี้ศักดิ์สิทธิ์"
 diarchy.1211.b.tt.success:0 "ท่านโต้แย้งจน[exploitable_vassal.GetFirstNameNoTooltip]ยอมจำนน"
 diarchy.1211.b.tt.failure:0 "จุดยืนของท่านพังทลายลงเมื่อถูกตรวจสอบ"
 diarchy.1211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1211.c:0 "อืม หรือจะแสดงความเคารพครั้งใหม่และจ่ายสิบลดเล็กน้อยให้#EMP คลังหลวง#!ก็ได้"
 diarchy.1211.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] ยอมจ่าย"
 diarchy.1211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1211.c.tt.failure:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] ปฏิเสธที่จะถูกแบล็กเมล์"
 diarchy.1211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1211.d:0 "มันคงจะโหดร้ายเกินไปที่จะเอาผิดท่านเพียง เพราะคำพูดผิดพลาดเล็กน้อย..."
 diarchy.1211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1211.e:0 "บางที... บางทีทั้งหมดนี้อาจจะคลุมเครือไปหน่อย..."
 diarchy.1211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1221.t:0 "บ้านใหม่ของท่าน"
 diarchy.1221.desc:0 "ตามคำสั่งจาก [liege.GetTitledFirstName] หน้าที่หลักของข้าในฐานะผู้สำเร็จราชการคือการเติมคลังสมบัติของ [liege.GetHerHis] วิธีง่าย ๆ ในการทำ เช่นนี้คือการช่วยเพิ่มประชากรในเขตชานเมืองของ [recipient_county.GetNameNoTier] โดยย้ายทาสติดที่ดินและผู้ถือครองที่ดินรายย่อยจาก [actor_county.GetName] ของข้าเองไปยังดินแดนของ [liege.GetFirstNamePossessiveNoTooltip]\n\nยก เว้นแต่ว่าชาวนาปฏิเสธที่จะขยับเขยื้อน ทุกครอบครัวที่ถูกบังคับให้ย้ายก็เหมือนกับการถอนฟัน ราวกับว่าพวกเขา #EMP คัดค้าน#! การถูกย้ายโดยผู้ที่ดีกว่าพวกเขา"
 diarchy.1221.a:0 "พวกเขาจะไปในที่ที่ข้าย้ายพวกเขาไป เมื่อข้าย้ายพวกเขาไป"
 diarchy.1221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1221.b:0 "บางทีหากข้าเสนอการรับรองที่เหมาะสม?"
 diarchy.1221.b.tt.success:0 "ทองคำสำเร็จในที่ที่เหล็กกล้าล้มเหลว"
 diarchy.1221.b.tt.failure:0 "คนท้องถิ่นรวมตัวกันด้วยความสามัคคี"
 diarchy.1221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1221.c:0 "ครอบครัวที่ร่ำรวยกว่า#EMP สามารถ#!รับใช้อีกทางหนึ่งได้..."
 diarchy.1221.c.tt.success:0 "ภาษีเล็กน้อยและความสามัคคีในท้องถิ่นถูกทำลาย"
 diarchy.1221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1221.c.tt.failure:0 "ชื่อเสียงของท่านในเรื่องการติดต่อที่ไม่ซื่อสัตย์แพร่กระจายออกไป"
 diarchy.1221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1221.d:0 "งานทั้งหมดนี้เพื่อมอบเหรียญให้#EMP [liege.GetFirstNameNoTooltip]#! เนี่ยนะ?"
 diarchy.1221.d.tt:0 "ท่านหยุดพักผ่อนช่วงบ่ายแทน"
 diarchy.1221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1221.e:0 "ช่างเถอะ ปล่อยให้พวกเขาอยู่ในที่ดินของพวกเขา หากพวกเขารักดินของพวกเขามากนัก!"
 diarchy.1221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1231.t:0 "แลกมาด้วยเพนนี"
 diarchy.1231.desc:0 "คำสั่งที่ [liege.GetTitledFirstName] ออกให้ข้าสั่งให้ข้าแสวงหารายได้สำหรับราชบัลลังก์ และรูปแบบหนึ่งของรายได้ที่ปัจจุบันเจ้าเหนือหัวของข้าไม่ได้ใช้ประโยชน์อย่างน่าเศร้าคือศาล ผู้พิพากษาและขุนนางชั้นผู้น้อยปรับอาชญากรรายย่อยทุกวัน แต่เก็บเงินส่วนใหญ่ที่ได้มาไว้เอง\n\n[exploitable_county.GetNameNoTier] อุดมไปด้วยพวกไร้ค่า เช่นนี้เป็นพิเศษ และการเพิ่มค่าปรับสำหรับความผิดเล็กน้อยของชาวบ้านจะเป็นประโยชน์อย่างยิ่ง หาก แต่ไม่เป็นที่นิยมอย่างยิ่ง เช่นกัน"
 diarchy.1231.a:0 "ใครจะสนว่าพวกเขาคิดอย่างไร? อาชญากรก็คืออาชญากร"
 diarchy.1231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1231.b:0 "เราสามารถหาความสมดุลของข้อกล่าวหาได้ ข้ารู้สึก เช่นนั้น"
 diarchy.1231.b.tt.success:0 "ผู้คนไม่ได้บ่นมากไปกว่าที่เคยเป็น"
 diarchy.1231.b.tt.failure:0 "คนท้องถิ่นปฏิเสธที่จะปฏิบัติตาม"
 diarchy.1231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1231.c:0 "งานทั้งหมดนี้ย่อมต้องการค่าตอบแทนเล็กน้อย..."
 diarchy.1231.c.tt.success:0 "$diarchy.1231.b.tt.success$"
 diarchy.1231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1231.c.tt.failure:0 "$diarchy.1231.b.tt.failure$"
 diarchy.1231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1231.d:0 "เราควรจะ#EMP ลด#!ค่าปรับ ไม่ใช่เพิ่ม!"
 diarchy.1231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1231.e:0 "ทั้งหมดนี้รู้สึกว่าอยู่นอกเหนือขอบเขตอำนาจหน้าที่ของข้ามากเกินไป"
 diarchy.1231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1241.t:0 "เรื่องภาษีที่น่าปวดหัว"
 diarchy.1241.desc:1 "หนึ่งในหน้าที่ของข้าในฐานะ [liege.GetDiarchTitle] คือการปฏิบัติตามคำสั่งที่ [liege.GetTitledFirstName] กำหนดไว้ ซึ่งในปัจจุบันเรียกร้องเงินสดล้วน ๆ\n\nข้าได้ขบคิดหาแหล่งรายได้ใหม่สำหรับราชสำนัก และกลับมาที่ทางออกที่ชัดเจน หาก แต่ไม่เป็นไปตามแบบแผน: [diarch.Custom('GetFaithTaxExemptInstitution')]\n\nตามธรรมเนียมแล้วได้รับการยกเว้นภาษีส่วนใหญ่ การเรียกเก็บภาษีพิเศษจาก [diarch.Custom('GetFaithTaxExemptInstitution')] น่าจะเป็นประโยชน์อย่างยิ่ง เพียง แต่... ไม่ใช่เรื่องเคร่งศาสนาเท่าใดนัก"
 diarchy.1241.a:0 "[diarch.Custom('GetFaithTaxExemptInstitution')|U]? พวกเขาได้ตามใจชอบมานานเกินไปแล้ว!"
 diarchy.1241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1241.b:0 "แน่นอนว่าการเรียกเก็บภาษีพิเศษสำหรับค่าใช้จ่ายที่จำเป็นคงไม่ผิดพลาดกระมัง?"
 diarchy.1241.b.tt.success:0 "แม้จะบ่น แต่พวกเขาก็จ่ายสิบลด"
 diarchy.1241.b.tt.failure:0 "ชื่อของท่านถูกสาปแช่งและกระเป๋าของท่านว่างเปล่า"
 diarchy.1241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1241.c:0 "แน่นอนว่า ต้องมีการชดเชยให้กับผู้ที่ได้รับผลกระทบจากภาษีดังกล่าว..."
 diarchy.1241.c.tt.success:0 "$diarchy.1241.b.tt.success$"
 diarchy.1241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1241.c.tt.failure:0 "$diarchy.1241.b.tt.failure$"
 diarchy.1241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1241.d:0 "ความขัดแย้งทั้งหมดนั้นเพียงเพื่อคลังของ[liege.GetFirstNamePossessiveNoTooltip]? ไม่มีทาง"
 diarchy.1241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1241.e:0 "ข้าทำ เช่นนี้ไม่ได้ ข้า#EMP จะไม่#!ทำ เช่นนี้"
 diarchy.1241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Mandates - Promote Authority
 diarchy.1701.t:0 "สิทธิ์ในการปกครอง"
 diarchy.1701.desc:1 "ในฐานะ [liege.GetDiarchTitle] ของ [liege.GetTitledFirstNamePossessive] ข้ามีหน้าที่ต้องปฏิบัติตามคำสั่งของ [liege.GetHerHis] เพื่อส่งเสริมอำนาจส่วนกลางใน [liege.GetPrimaryTitle.GetNameNoTier]\n\nวันนี้ นั่นนำข้ามาสู่ห้องสภาที่ตึงเครียด ถูกขนาบข้างระหว่าง [councillor_1.GetTitledFirstName] [councillor_1.Custom('CouncilPosition')] และ [councillor_2.GetTitledFirstName] [councillor_2.Custom('CouncilPosition')] ขณะที่พวกเขาตะโกนใส่กันเรื่องธุรกิจส่วนตัวเล็กน้อย\n\nข้าหวังว่าจะได้ข้อตกลงเพื่ออนุมัติสิทธิพิเศษใหม่หลายประการสำหรับ [liege.GetTitleAsNameNoTooltip] แต่ข้าก็ไปไม่ถึงไหนจนกว่าการโต้เถียงนี้จะสิ้นสุดลง"
 diarchy.1701.a:0 "ข้าคิดว่าท่านทั้งสองกำลังพูดกันคนละเรื่อง — โปรดให้ข้า..."
 diarchy.1701.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1701.b:0 "ท่านขุนนางผู้สูงศักดิ์ เรากำลังออกนอกประเด็น... "
 diarchy.1701.b.tt.success:0 "ท่านควบคุมการสนทนาได้"
 diarchy.1701.b.tt.failure:0 "เหล่าที่ปรึกษาเพิกเฉยท่าน"
 diarchy.1701.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1701.c:0 "[councillor_1.GetFirstNameNoTooltip] #EMP ถูกต้อง#! และราชสำนักสนับสนุน[councillor_1.GetHerHim]"
 diarchy.1701.c.tt.success:0 "[councillor_1.GetFirstNameNoTooltip] ยินดีรับการสนับสนุนของท่านอย่างภาคภูมิใจ"
 diarchy.1701.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1701.c.tt.failure:0 "ท่านไม่เข้าใจการโต้เถียงของพวกเขาอย่างชัดเจน"
 diarchy.1701.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1701.d:0 "#EMP เพื่อเห็นแก่[diarch.GetFaith.HighGodName] ท่านทั้งสองจะ#BER หุบปาก?!#!"
 diarchy.1701.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1701.d.custom.both_councillors:0 "ที่ปรึกษาทั้งสอง:"
 diarchy.1701.e:0 "ข้าสงสัยว่าพวกเขาจะสังเกตเห็นหรือไม่หากข้าแอบงีบ..."
 diarchy.1701.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1711.t:0 "วันหมดอายุ"
 diarchy.1711.desc:1 ""ตามจริงแล้ว ข้าคิดว่าปัญหานี้คลี่คลายแล้ว ข้อตกลงของข้ากับ [liege.GetTitledFirstName] ควรจะได้รับการแก้ไขในครั้งสุดท้ายที่เราเจรจาภาระผูกพันของข้าใหม่" [exploitable_vassal.GetTitledFirstName] พึมพำ "ข้าไม่เข้าใจว่าท่านพูดได้อย่างไรว่าข้าสามารถ ทำให้คำสาบานของข้าเป็นโมฆะได้อย่างสิ้นเชิง เช่นนี้? แน่นอนว่าคำพูดควรมีผลผูกพันตลอดไป?"\n\n[exploitable_vassal.GetSheHe|U] ไม่ผิดทั้งหมด ข้ากำลังคว้าอากาศกับเรื่องนี้ แต่ข้าคือ [liege.GetDiarchTitle] และคำสั่งของข้าก็ชัดเจนเหมือนวันฤดูร้อนที่สดใส หากคำสาบานของ [exploitable_vassal.GetFirstNamePossessiveNoTooltip] เป็นโมฆะบางส่วน [liege.GetTitleAsNameNoTooltip] ก็จะมีช่องว่างในการปรับเปลี่ยน และข้าก็จะทำหน้าที่ของข้าสำเร็จ"
 diarchy.1711.a:0 "ข้ามิได้เป็นที่รู้จักในด้านความยุติธรรมและสติปัญญาทางกฎหมายหรอกหรือ?"
 diarchy.1711.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1711.b:0 "เอาล่ะ มาทบทวนข้อโต้แย้งกันอีกครั้ง..."
 diarchy.1711.b.tt.success:0 "ทฤษฎีทางกฎหมายของท่านไม่อาจโต้แย้งได้"
 diarchy.1711.b.tt.failure:0 "ช่องว่างในข้อโต้แย้งของท่านชัดเจน"
 diarchy.1711.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1711.c:0 "ราชสำนัก#EMP สามารถ#!รับค่าชดเชยแทนได้"
 diarchy.1711.c.tt.success:0 "[exploitable_vassal.GetFirstNameNoTooltip] จ่ายเงินให้ท่าน"
 diarchy.1711.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1711.c.tt.failure:0 "อาณาจักรรู้เรื่องความไม่ซื่อสัตย์ของท่าน"
 diarchy.1711.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
