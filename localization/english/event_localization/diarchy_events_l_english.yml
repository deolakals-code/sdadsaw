 diarchy.1721.t:0 "การระงับความคับข้องใจ"
 diarchy.1721.desc:1 ""ข้าไม่เห็นด้วยซ้ำว่าทำไมท่านถึงกระตือรือร้นที่จะเข้ามาเกี่ยวข้อง [diarch.GetFirstName]" [exploitable_vassal.GetTitledFirstName] ถอนหายใจ "ไม่ใช่ว่าความคับข้องใจของเราอยู่ที่ท่าน"\n\nไม่ใช่ความลับที่ [exploitable_vassal.GetTitleAsNameNoTooltip] มีความทะเยอทะยานที่ขัดต่อพระประสงค์ของ [liege.GetTitledFirstName] ความทะเยอทะยานที่อาจลากอาณาจักรเข้าสู่สงครามกลางเมืองที่หายนะหากปล่อยไว้โดยไม่ตรวจสอบ\n\nในฐานะ [liege.GetDiarchTitle] ของเจ้าเหนือหัวของข้า มันอยู่ในขอบเขตอำนาจของข้าที่จะพยายามบรรเทาความตึงเครียดระหว่างทั้งสอง แต่จนถึงตอนนี้ [exploitable_vassal.GetSheHe] ดูเหมือนจะไม่สะทกสะท้านต่อความพยายามของข้า"
 diarchy.1721.a:0 "เราทั้งสองมิได้สาบานตนต่อ[liege.GetTitledFirstNameNoTooltip]หรอกหรือ?"
 diarchy.1721.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1721.b:0 "ท่านพูดถูก ปราสาทของข้าจะไม่ใช่แห่งแรกที่ถูกล้อมแน่นอน"
 diarchy.1721.b.tt.success:0 "[exploitable_vassal.GetTitleAsNameNoTooltip] เข้าใจประเด็นของท่าน"
 diarchy.1721.b.tt.failure:0 "[exploitable_vassal.GetFirstNameNoTooltip] ไม่กังวลกับคำขู่ของท่าน"
 diarchy.1721.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1721.c:0 "ข้าอาจถูกชักจูงให้เพิกเฉยต่อ... กิจกรรม... ของท่านได้"
 diarchy.1721.c.tt.success:0 "ท่านแลกเปลี่ยนเป็นสัญญาผูกมัดและบรรณาการเล็กน้อย"
 diarchy.1721.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1721.c.tt.failure:0 "บางทีพวกเขา#EMP อาจ#!มีความคับข้องใจกับท่าน"
 diarchy.1721.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1721.d:0 "ข้าคิดว่า ท้ายที่สุดแล้ว มันไม่ใช่ปัญหา#EMP ของข้า#!"
 diarchy.1721.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1721.e:0 "เกี่ยวข้องหรือ? แค่อยากรู้อยากเห็น! นี่เป็นเพียงการมาเยี่ยมเยียนทางสังคมเท่านั้น"
 diarchy.1721.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1731.t:0 "การชำระบัญชี"
 diarchy.1731.desc:1 "ฝูงชนเบียดเสียดอยู่เบื้องหน้าข้า กลุ่มตัวแทนที่โกรธแค้นจาก [county_1.GetNameNoTier] [county_2.GetNameNoTier] และ [county_3.GetNameNoTier] เมืองและหมู่บ้านที่แตกต่างกันรวมตัวกันโดยการประณาม [liege.GetTitledFirstName] ในฐานะ [liege.GetDiarchTitle] ที่โชคร้ายของ [liege.GetHerHis] มันตกเป็นหน้าที่ของข้าที่จะพยายามปลอบโยนพวกเขา ตามคำสั่งของข้า\n\nเมื่อไม่มีผู้นำส่วนกลางที่ชัดเจน ฝูงชนก็เยาะเย้ยข้า กรีดร้องแสดงความกังวลและเหตุการณ์ที่ละเอียดเกินไป "
 diarchy_1731.tt.affected_counties_removed:0 "[county_1.GetNameNoTier], [county_2.GetNameNoTier], & [county_3.GetNameNoTier] ออกจาก[faction.GetName|V]"
 diarchy.1731.a:0 "โปรด สุภาพหน่อย! ข้าจะรับฟังปัญหาของท่านทีละคน"
 diarchy.1731.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1731.b:0 "ท่านผู้ใต้ปกครองผู้สูงศักดิ์ เราไม่สามารถหาเหตุผลร่วมกันได้หรือ?"
 diarchy.1731.b.tt.success:0 "ท่านบรรเทาอารมณ์ของพวกเขา"
 diarchy.1731.b.tt.failure:0 "ฝูงชนขว้างปาสิ่งของเน่าเสียใส่ท่าน"
 diarchy.1731.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1731.c:0 "ปัญหาเหล่านี้ร้ายแรง! #EMP ข้า#!จะไม่มีวันยอมให้เกิดเรื่องนี้ขึ้น"
 diarchy.1731.c.tt.success:0 "ผู้คนคิดว่าท่านจะแก้ไขความผิดพลาดของพวกเขา"
 diarchy.1731.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1731.c.tt.failure:0 "นี่ไม่ใช่เรื่องเกี่ยวกับ#EMP ท่าน#!"
 diarchy.1731.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1731.d:0 "ด้วยพระพิโรธอันมิอาจหลีกเลี่ยงของ[diarch.GetFaith.HighGodName] พวกเจ้าคนโง่เขลา#EMP หยุด#!ได้หรือไม่?!"
 diarchy.1731.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1731.e:0 "ใช่ ใช่ เราจะจัดการเรื่องทั้งหมดนี้ ในที่สุด"
 diarchy.1731.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.1741.t:0 "มองในมุมนี้"
 diarchy.1741.desc:1 ""เราไม่ได้ต่อต้านความปรารถนาของ [liege.GetTitledFirstNamePossessive]" [councillor_1.GetTitledFirstName] พูดเนิบนาบ เยาะเย้ยตลอดเวลา "เพียง แต่ไม่ตกเป็นทาสของพวกเขา มันไม่ยากที่จะเข้าใจ"\n\nข้าใช้เวลาเกือบทั้งบ่ายพยายามปรับปรุงความสัมพันธ์ระหว่างเจ้าเหนือหัวของข้ากับที่ปรึกษาของ [liege.GetHerHis] แต่ก็ไร้ผล ต้องขอบคุณความดื้อรั้นของ [councillor_1.GetWomanMan] ผู้โง่เขลาคนนี้ไม่น้อย\n\nข้าถอนหายใจในใจ ข้าคือ [liege.GetDiarchTitle] และคำสั่งของข้าจำเป็นต้องปฏิบัติหน้าที่เหล่านี้"
 diarchy.1741.a:0 "ข้าคิดว่าท่านกำลังพลาดไปว่า[liege.GetTitleAsNameNoTooltip]ทำเพื่อท่านมากเพียงใด..."
 diarchy.1741.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1741.custom.several_councillors:0 "[councillor|E] ทุกคนที่อยู่ ณ ที่นี้\t"
 diarchy.1741.b:0 "ท่านไม่ควรเป็น เช่นนั้น แต่การบริการที่ดีขึ้นย่อมส่งเสริมความเมตตา..."
 diarchy.1741.b.tt.success:0 "ท่านให้ความกระจ่างแก่เพื่อนร่วมงานของท่าน"
 diarchy.1741.b.tt.failure:0 "สภายังคงเต็มไปด้วยหนาม"
 diarchy.1741.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1741.c:0 "ราชบัลลังก์ไม่ได้#EMP อยู่#!กับ[liege.GetTitleAsNameNoTooltip]เพียงผู้เดียว"
 diarchy.1741.c.tt.success:0 "สภาเห็นคุณค่าในประเด็นของท่าน"
 diarchy.1741.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1741.c.tt.failure:0 "ท่านกำลังโอ้อวดอย่างชัดเจน"
 diarchy.1741.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1741.d:0 "ไม่ยากงั้นรึ? เจ้ากำลังจะสื่อ #EMP อะไร#! กันแน่ เจ้า [councillor_1.Custom2('InsultNoun', ROOT.Char)]?"
 diarchy.1741.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1741.e:0 "เราจะไม่มีวันบรรลุข้อตกลงร่วมกัน"
 diarchy.1741.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Mandates - Swell Armies
 diarchy.2201.t:0 "นำเยาวชนของท่านออกมา"
 diarchy.2201.desc:1 "ชาวบ้านใน [exploitable_county.GetNameNoTier] จำเป็นต้องจัดหากองกำลังจำนวนหนึ่งให้กับ [liege.GetTitledFirstName] ซึ่งพวกเขาก็ทำตามหน้าที่ทุกครั้งที่ถูกร้องขอ\n\nนั่นไม่ได้หมายความว่านั่นคือทุกคนที่อยู่ในวัยสู้รบในพื้นที่ และการสืบสวนล่าสุดของข้าในฐานะ [liege.GetDiarchTitle] ได้แสดงให้เห็นว่าภาระผูกพันของพวกเขานั้นเบา #EMP อย่างน่าตกใจ#! จำนวนที่เราสามารถเกณฑ์ได้นั้นมีมากกว่ากองกำลังเล็กน้อยที่ถูกเรียกเก็บจริง ๆ\n\nชาวบ้านต่อต้าน แต่คำสั่งของข้าก็กระตุ้นให้ข้าดำเนินการต่อไปโดยไม่คำนึงถึง"
 diarchy.2201.a:0 "หากพวกเขาเหวี่ยงหอกได้ พวกเขาก็ตายด้วยหอกได้!"
 diarchy.2201.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2201.b:0 "ให้พวกไพร่รู้ว่านี่คือโอกาสของพวกเขาที่จะได้รับ#EMP ของปล้น#!"
 diarchy.2201.b.tt.success:0 "ท่านกระตุ้นจินตนาการของเหล่าไพร่"
 diarchy.2201.b.tt.failure:0 "คนท้องถิ่นขาเป๋ไปหลายร้อยคน"
 diarchy.2201.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2201.c:0 "ข้ามั่นใจว่าคนรวยกว่าจะยอมจ่ายเพื่อถูกเพิกเฉย..."
 diarchy.2201.c.tt.success:0 "ภาษีพิเศษเล็กน้อย กองเกณฑ์พิเศษเล็กน้อย"
 diarchy.2201.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2201.c.tt.failure:0 "ตามมาด้วยการกล่าวโทษอันขมขื่น"
 diarchy.2201.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2201.d:0 "คนเหล่านี้ได้ปฏิบัติตามภาระผูกพันของพวกเขาแล้ว นั่นก็เพียงพอแล้ว"
 diarchy.2201.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2201.e:0 "ข้าจะไม่ทำงานสกปรกของ[liege.GetTitleAsNamePossessiveNoTooltip]ที่นี่"
 diarchy.2201.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.2211.t:0 "พรสวรรค์ที่หายาก"
 diarchy.2211.desc:1 "นักรบผู้มีพรสวรรค์หายากกำลังเดินทางผ่าน [hedge_knight_location.GetNameNoTier] ผู้ ซึ่งดาบของเขาไม่ต้องสงสัยเลยว่าจะได้รับการประเมินค่าอย่างสูงในกองทัพของ [liege.GetTitledFirstNamePossessive]\n\nคำสั่งของข้าในฐานะ [liege.GetDiarchTitle] เรียกร้องให้ข้าคอยมองหาบุคคล เช่นนี้ และข้าได้ส่งคำร้องขอมากมายไปยัง [hedge_knight.GetFirstName] แล้ว พยายามเกณฑ์ [hedge_knight.GetHerHim] ให้กับเจ้าเหนือหัวของข้า\n\nยก เว้นแต่นักสู้พเนจรดูเหมือนจะไม่ค่อยกระตือรือร้นกับความคิดที่จะสาบานดาบของ [hedge_knight.GetHerHis] ให้กับอุดมการณ์ของเรา ปฏิเสธทูตทุกคนไปทีละคน"
 diarchy.2211.a:0 "$knight_culture_player_no_tooltip_lowercase$ธรรมดาๆ #EMP จะต้อง#!ตกลงรับใช้ ในที่สุด"
 diarchy.2211.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2211.b:0 "บางทีข้าอาจจะพูดคุยกับ[hedge_knight.GetFirstNameNoTooltip]เป็นการส่วนตัวได้?"
 diarchy.2211.b.tt.success:0 "คำพูดของท่านโน้มน้าว[hedge_knight.GetHerHim]"
 diarchy.2211.b.tt.failure:0 "คำวิงวอนของท่านไม่เข้าหู"
 diarchy.2211.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2211.c:0 "บางทีอาจเป็น[liege.Custom('MistressMaster')]ที่อาจเป็นปัญหา..."
 diarchy.2211.c.tt.success:0 "ท่านล่อลวง[hedge_knight.GetFirstNameNoTooltip]ให้มารับใช้ท่าน"
 diarchy.2211.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2211.c.tt.failure:0 "[hedge_knight.GetSheHe|U] ไม่ต้องการเกี่ยวข้องกับท่าน"
 diarchy.2211.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2211.d:0 "เรื่องทั้งหมดนี้ ทำให้ข้าวิตกกังวล!"
 diarchy.2211.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2211.e:0 "ปล่อย[hedge_knight.GetHerHim]ไปเถอะ [hedge_knight.GetSheHe]เห็นได้ชัดว่าไม่สนใจ"
 diarchy.2211.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.2221.t:0 "ของบริจาคทางการทหาร"
 diarchy.2221.desc:1 "การตั้งถิ่นฐานที่สำคัญของ [liege.GetPrimaryTitle.GetNameNoTier] มีสถานที่มากมายไม่รู้จบสำหรับเกณฑ์ทหารรับจ้าง ตลาดที่ข้ายืนอยู่ โยนถุงเงินใส่ฝูงชน เป็นเพียงหนึ่งในหลาย ๆ แห่ง\n\nโดยปกติแล้ว กลุ่มนักรบเฉพาะกิจเหล่านี้จะถูกรวมเข้ากับกลุ่มทหารรับจ้างที่ใหญ่กว่า หรือถูกจ้างเพื่อเสริมกำลังกองทหารส่วนตัวของขุนนางชั้นผู้น้อยในสงคราม ซึ่งเป็นการจัดการที่ไม่มีประสิทธิภาพ\n\nคำสั่งของข้าในฐานะ [liege.GetDiarchTitle] กำหนดให้ข้าต้องเพิ่มจำนวนกองทัพของ [liege.GetTitledFirstName] และ ดังนั้นข้าจึงพบว่าตัวเองกำลังพยายามเกณฑ์ทหารโดยตรงมากขึ้น"
 diarchy.2221.a:0 "เหรียญนี้เทียบไม่ได้กับของปล้นที่ท่านจะได้รับ!"
 diarchy.2221.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2221.b:0 "เงินนี้เป็นเพียงรสชาติของคลังสมบัติของ[liege.GetTitledFirstNamePossessiveNoTooltip]!"
 diarchy.2221.b.tt.success:0 "เงินที่ใช้ไปอย่างคุ้มค่า"
 diarchy.2221.b.tt.failure:0 "การลงทุนที่ไม่ดี"
 diarchy.2221.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2221.c:0 "รับใช้ข้า รับใช้[liege.GetTitleAsNameNoTooltip] ไม่ว่าทางใดท่านก็จะได้รับ#EMP ค่าจ้าง#!"
 diarchy.2221.c.tt.success:0 "กองทหารชั้นดี"
 diarchy.2221.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2221.c.tt.failure:0 "มีทหารเกณฑ์เพียงหยิบมือ"
 diarchy.2221.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2221.d:0 "แตกและหนีไปต่อหน้าสายตาของพวกเขา"
 diarchy.2221.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2221.e:0 "แน่นอน ข้ามั่นใจว่าท่านสามารถเลือกนายจ้างของท่านเองได้..."
 diarchy.2221.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.2231.t:0 "ประโยชน์ที่ดีกว่าสำหรับท่าน"
 diarchy.2231.desc:1 "คุกและศาลของ [exploitable_county.GetNameNoTier] กำลังดำเนินการกับผู้กระทำผิดจำนวนมากอย่างน่าเสียดายในช่วงหลัง ภายใต้สถานการณ์ปกติ ความยุติธรรมจะพบผู้กระทำผิดเหล่านี้อย่างรวดเร็ว จากนั้นพวกเขาก็จะถูกปล่อยสู่ป่าหรือหลุมศพ\n\nโชคดีสำหรับพวกเขา หลายคนมีประสบการณ์มากมายกับดาบหรือธนู และคำสั่งของข้าในฐานะ [liege.GetDiarchTitle] กำหนดให้ข้าต้องหาทหารใหม่ ทางออกที่ไม่น่าพอใจของการรับราชการในกองทัพของ [liege.GetTitledFirstNamePossessive] ดูเหมือนจะชัดเจน และ แม้ว่าสิ่งนี้จะเปิดเผยโจรที่แข็งแกร่งและนักล่าสัตว์ตาเหยี่ยวจำนวนมาก แต่แนวคิดนี้ก็ ทำให้ชาวนาลุกฮือขึ้นต่อต้าน"
 diarchy.2231.a:0 "ดำเนินการต่อไป; ข้อร้องเรียนเหล่านี้จะผ่านไปตามกาลเวลา"
 diarchy.2231.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2231.b:1 "บางทีเราอาจต้องการเพียงแค่คนที่ดีที่สุด?"
 diarchy.2231.b.tt.success:0 "บรรลุความสมดุล"
 diarchy.2231.b.tt.failure:0 "อาชญากรส่วนใหญ่หลบหนีไปทันทีที่ทำได้"
 diarchy.2231.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2231.c:0 "พวกเขาอาจมีประโยชน์นอกบัญชีมากกว่าในบัญชี..."
 diarchy.2231.c.tt.success:0 "กองกำลังอันรุนแรงถูกก่อตั้งขึ้น"
 diarchy.2231.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2231.c.tt.failure:0 "$diarchy.2231.b.tt.failure$"
 diarchy.2231.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2231.d:0 "ข้า#EMP ทำไม่ได้#! นี่จะเป็นการบิดเบือนความยุติธรรม!"
 diarchy.2231.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2231.e:0 "นี่เป็นเรื่องที่ขัดแย้งกันเกินไป"
 diarchy.2231.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 diarchy.2241.t:0 "การแยกข้าวสาลีออกจากแกลบ"
 diarchy.2241.desc:1 "คำสั่งที่ [liege.GetTitledFirstName] กำหนดไว้สำหรับข้าเรียกร้องให้ข้า ในฐานะ [liege.GetDiarchTitle] ของ [liege.GetHerHis] หาแหล่งทหารใหม่ให้ [liege.GetHerHim] เป็นประจำ\n\nแล้วจะมีที่ไหนดีไปกว่ากองทหารที่จัดระเบียบไม่ดีของ [exploitable_vassal.GetTitledFirstName] ล่ะ? ผู้ติดตามของข้าและข้าได้รวบรวมชาวบ้านเพื่อประเมินผล แต่ก็ยังคงดิ้นรน เพื่อให้พวกเขาจำนวนมากพอที่จะได้มาตรฐานที่ #EMP คุ้มค่า#! ที่จะเรียกตัวในอนาคต"
 diarchy.2241.a:0 "ตามข้ามา ทหาร! ดู!"
 diarchy.2241.a.t:0 "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2241.b:0 "มาเถอะพวกเจ้าคนโง่ ข้าจะเฆี่ยนตีพวกเจ้าให้เข้ารูปเข้ารอย!"
 diarchy.2241.b.tt.success:0 "ท่าน ทำให้พวกเขารวดเร็วดั่งสายน้ำเชี่ยว"
 diarchy.2241.b.tt.failure:0 "และช่างเป็นกลุ่มคนโง่ที่น่าสมเพชเสียจริง"
 diarchy.2241.b.t:0 "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2241.c:0 "อาจจะลองฝึกตัวเองไปด้วย..."
 diarchy.2241.c.tt.success:0 "การฝึกพิเศษเล็กน้อยไปได้ไกล"
 diarchy.2241.c.t.success:0 "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2241.c.tt.failure:0 "เสียสมาธิ ท่านเคล็ดขัดยอกส่วนสำคัญ"
 diarchy.2241.c.t.failure:0 "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2241.d:0 "จากไปโดยไม่พูดอะไร"
 diarchy.2241.d.t:0 "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2241.e:0 "นี่เป็นการเสียเวลา#EMP อย่างยิ่ง#!ของข้า"
 diarchy.2241.e.t:0 "$diarchies.0000.diarch_lax_with_mandate.t$"

 ##################################################
 # #Overthrow Diarch Scheme Events
 diarchy.0511.t:0 "$overthrow_regent$: ล้มเหลว"
 diarchy.0511.desc.intro:0 "ให้ตายเถอะ หนังเหนียวของ[target.GetHerHis] [target.GetTitledFirstName] หลบหนีอันธพาลของข้าไปได้ "
 diarchy.0511.desc.discovered:0 "และที่แย่กว่านั้นคือ คนร้ายคนหนึ่งถูกจับได้และ#EMP ปากโป้ง#!ขณะถูกสอบสวน ทั้ง[target.GetFirstNameNoTooltip]และ[liege.GetTitledFirstName]รู้แน่ชัดว่าข้าพยายามทำอะไร!"
 diarchy.0511.desc.undiscovered:0 "แต่อย่างน้อยทหารรับจ้างก็จัดการฆ่าตัวตายแทนที่จะถูกจับได้\n\nไม่มีร่องรอยใดๆ ที่จะสาวมาถึงข้า อย่างน้อยก็ไม่โดยตรง และ ดังนั้นจึงไม่มีอะไรที่[target.GetFirstNameNoTooltip]หรือ[liege.GetTitledFirstName]จะปรักปรำข้าได้"
 diarchy.0511.desc.outro:0 "\n\nสำหรับตอนนี้ [target.GetDiarchTitle]ของอาณาจักรยังคงไม่เปลี่ยนแปลง"
 diarchy.0511.a:0 "บาห์ นี่มันไร้ประโยชน์"
 diarchy.0511.b:0 "อีกครั้ง เราจะจัดการ[liege.GetHerHim]ในครั้งต่อไป"
 
 diarchy.0521.t:0 "ถึง[liege.GetTitledFirstName]ผู้สูงศักดิ์,"
 diarchy.0521.desc.discovered:0 "คนพาล[owner.GetTitledFirstName]พยายามลักพาตัวข้า และยึดเครื่องราชอิสริยาภรณ์ของข้าไปด้วย!\n\nเห็นได้ชัดว่า[owner.GetSheHe]ตั้งใจที่จะบังคับข้าออกจากตำแหน่ง ทำให้[owner.GetHerselfHimself]เป็น[liege.GetDiarchTitle]ของท่านในกระบวนการนี้ อาชญากรรมอันน่ารังเกียจนี้ไม่อาจปล่อยไว้โดยไม่ลงโทษได้"
 diarchy.0521.desc.undiscovered:0 "ข้าเขียนมาเพื่อแจ้งให้ท่านทราบว่ามีความพยายามลิดรอนเสรีภาพของข้า — กลุ่มอันธพาลพยายามลักพาตัวข้าและเครื่องราชอิสริยาภรณ์ของข้า\n\nใครเป็นผู้จ่ายเงินให้พวกเขานั้นไม่ชัดเจน แต่กลอุบายดูเหมือนชัดเจนพอ การควบคุมตัวข้าและสัญลักษณ์ของข้าในฐานะ[liege.GetDiarchTitle]อาจ ทำให้นายจ้างของพวกเขาสามารถแย่งชิงตำแหน่งอันชอบธรรมของข้าไปได้"
 diarchy.0521.a:0 "ข้าตกตะลึง!"
 diarchy.0521.b:0 "น่ากังวล..."

 diarchy.0531.t:0 "$overthrow_regent$: ความพยายามที่ล้มเหลว"
 diarchy.0531.desc.intro:0 "ข้าไถลไปตามทางเดิน เสียงการต่อสู้ที่ยังดำเนินอยู่ยังคงดังก้องอยู่ในหู ทหารรับจ้างชั่วร้ายเหล่านั้นดูเหมือนจะโผล่ออกมาจากกำแพง! ปราศจากอาวุธโดยสิ้นเชิง เป็นเพียงการแทรกแซงอย่างทันท่วงทีขององครักษ์ของข้าที่ ทำให้ข้าหลบหนีไปได้\n\n"
 diarchy.0531.desc.discovered:0 "ภายใต้การสอบสวน อันธพาลที่ถูกจับได้เปิดเผยว่าพวกเขากำลังทำงานให้ใคร: ไม่ใช่ใครอื่นนอกจาก[target.Custom2('MyCharacterIntroduction', owner)]!"
 diarchy.0531.desc.undiscovered:0 "ภายในหนึ่งหรือสองนาที พวกเขาทั้งหมดก็ตาย และความลับของนายจ้างของพวกเขาก็ตายไปพร้อมกับพวกเขา"
 diarchy.0531.desc.outro:0 "\n\nเห็นได้ชัดว่าการเป็น[target.GetDiarchTitle]ได้ ทำให้ข้าตกเป็นเป้าหมาย ข้าน่าจะรู้..."
 diarchy.0531.a.paranoid:0 "ดังนั้นจึง#EMP มี#!แผนการ! ข้ารู้อยู่แล้ว!"
 diarchy.0531.a.trusting:0 "ทำไม... ทำไมใครๆ ถึงทำ เช่นนี้ได้?"
 diarchy.0531.a.scheme_discovered:0 "[owner.GetFirstNameNoTooltip] เจ้าคนเลว!"
 diarchy.0531.a.scheme_secret:0 "จะต้องมีความพยายามอีกครั้ง ข้ามั่นใจ"
 
 diarchy.0551.t:0 "$overthrow_regent$: สำเร็จ"
 diarchy.0551.desc:0 "ปฏิบัติการที่เรียบง่ายและแข็งแกร่ง กลุ่มทหารรับจ้างในสังกัดของข้าได้จับกุม[owner.GetDiarchTitle]คนก่อนของเราในห้องทำงานของ[target.GetHerHis] ลักลอบนำ[target.GetWomanMan]ออกจากอาคารโดยใส่กุญแจมือและปิดตาในกระสอบเก่า\n\nด้วยการนองเลือดน้อยที่สุด และใช้ตราประทับที่ยึดมาจากโต๊ะทำงานของ[target.GetTitledFirstNamePossessive]โดยตรง ข้าได้เตรียมคำสารภาพในรายการอาชญากรรมมากมายเพื่อเป็นเหตุผลในการถ่ายโอนอำนาจ เพียงพอที่จะ ทำให้เรื่องเป็นทางการ แม้ว่าจะไม่เพียงพอที่จะก่อให้เกิดปัญหากับ[liege.GetTitledFirstName]ในอนาคตได้\n\nแน่นอน ข้าจะส่งสำเนาร่างให้[target.GetFirstNameNoTooltip]อย่างแน่นอน บางอย่างให้อ่านเล่นในระหว่างการกักขังของ[target.GetHerHis]"
 diarchy.0551.a:0 "ราบรื่นดุจแพรไหม"
 
 diarchy.0561.t:0 "ถึง[liege.GetTitledFirstName]ผู้สูงศักดิ์"
 diarchy.0561.desc:0 "ข้ายินดีที่จะแจ้งให้ท่านทราบว่า[target.GetTitledFirstName]ได้สละตำแหน่ง[liege.GetDiarchTitle]ของ[target.GetHerHis]ให้แก่ข้าแล้ว หลังจากการสนทนาสั้นๆ แต่มีชีวิตชีวา\n\nเนื่องจากหน้าที่นั้นหนักหนาสำหรับ[target.GetHerHim]มาก [target.GetSheHe]จะพักอยู่กับข้าตลอดระยะเวลาที่ข้าดำรงตำแหน่ง[liege.GetDiarchTitle] เพื่อสุขภาพของ[target.GetHerHis]"
 diarchy.0561.a:0 "มันก็เป็น เช่นนั้น สำหรับตอนนี้..."

 diarchy.0571.t:0 "$overthrow_regent$: ถูกจองจำ"
 diarchy.0571.desc.intro:0 "#EMP หัวข้า#! ข้า... ข้าอยู่ที่ไหน? [owner.GetTitledFirstName]?\n\n"ดีใจที่เห็นท่านยังอยู่กับเรา [target.GetFirstName]" [owner.GetSheHe] ยิ้มเยาะ โยนกองกระดาษลงที่เท้าข้า "สำหรับให้ท่านอ่านเล่น มันคือรายการอาชญากรรมที่ท่านยอมรับในฐานะ[owner.GetDiarchTitle]ก่อนที่จะมอบตำแหน่งให้ข้า คิดว่าท่านคงอยากได้สำเนา"\n\n"
 diarchy.0571.desc.outro.blind:0 "ข้าไม่จำเป็นต้องมองเห็นคำโกหกที่เขียนหวัดๆ ก็รู้ถึงขนาดของการกุเรื่องของ[owner.GetHerHis] หรือคาดเดาได้ว่าสิ่งเหล่านี้จะแพร่กระจายไปทั่ว[liege.GetPrimaryTitle.GetBaseNameNoTier]"
 diarchy.0571.desc.outro.sighted:0 "ข้าพลิกดูข้อความที่เขียนหวัดๆ อย่างบ้าคลั่ง หน้าแล้วหน้าเล่าของการกุเรื่องอย่างโจ่งแจ้งและการตีความผิดโดยเจตนา ข้าอยากจะปฏิเสธ ปฏิเสธทั้งหมด แต่ข้ารู้ว่ามันคงจะไปถึงทั่วทั้ง[liege.GetPrimaryTitle.GetBaseNameNoTier]แล้วในตอนนี้"
 diarchy.0571.a:0 "[liege.GetTitledFirstNameNoTooltip] จะต้องได้ยินเรื่องนี้! [liege.GetSheHe|U]จะต้องได้ยิน!"

 ##################################################
 # #Interactions
 diarchy.8001.t: "[recipient.Custom2('AppropriateGreeting', actor )]"
 diarchy.8001.desc: "คำขอของท่านที่จะเป็นผู้นำการกรีธาทัพในนามร่วมของเรานั้นมีเหตุผล ดังนั้นข้าจึงให้การอนุมัติแก่ท่าน ท่านอาจใช้ทรัพยากรของผู้ว่าการของเราตามความเหมาะสม\n\nขอให้ศัตรูสั่นสะท้านและแตกพ่ายต่อหน้ากองทัพของท่าน"
 diarchy.8001.a: "เพื่อ[actor.Custom('GetBestEmpireWithAdjective')]!"
 getbestempirewithadjective.rome: "โรมอันรุ่งโรจน์"
 getbestempirewithadjective.mongolia: "มองโกเลียอันไร้สิ้นสุด"
 getbestempirewithadjective.outremer: "อูเทรแมร์อันศักดิ์สิทธิ์"
 getbestempirewithadjective.slavia: "สลาเวียอันกว้างใหญ่"
 getbestempirewithadjective.great_armenia: "อาร์เมเนียอันยิ่งใหญ่"
 getbestempirewithadjective.india: "อินเดียอันไร้ขอบเขต"
 getbestempirewithadjective.the_empire: "จักรวรรดิอันเกรียงไกร"

 diarchy.8002.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8002.desc: "ข้ายอมเอามีดจ่อคอตัวเองเสียดีกว่าที่จะยอมให้#EMP ท่าน#!ควบคุมกองทัพ เช่นนั้นนอกเหนือการดูแลของข้า\n\nคำขอของท่านถูกปฏิเสธ — และเรื่องนี้ถือเป็น#EMP ที่สิ้นสุด#!."
 diarchy.8002.a: "เจ้าคนโง่เขลาใจแคบ!"

 diarchy.8003.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8003.desc: "แม้ว่าแน่นอนว่าเราปกครองร่วมกัน ท่านคงจำได้ไม่ต้องสงสัยว่าท่าน#EMP เป็นหนี้#!ข้า ข้าจะใช้ประโยชน์จากบุญคุณนั้นในตอนนี้ และเป็นการตอบแทน ท่านจะต้องสนับสนุนการกรีธาทัพที่กำลังจะมาถึงของข้าอย่างสุดใจเพื่อยึดครองดินแดนจากชาวต่างชาติ"
 diarchy.8003.a: "เจ้าคนโง่เขลาอวดดี!"

 diarchy.8004.t.vetoed: "การกรีธาทัพของจักรวรรดิถูกยกเลิก"
 diarchy.8004.t.planned: "การกรีธาทัพของจักรวรรดิถูกวางแผน"
 diarchy.8004.desc.vetoed: "เสียงกระซิบจากราชสำนักจักรวรรดิได้บ่งชี้มาหลายเดือนแล้วว่า ผู้ปกครองร่วม[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] ได้ผลักดันให้มีการเปิดตัวโครงการอันยิ่งใหญ่จากกองทัพของ[recipient.GetPrimaryTitle.GetDefinitiveName] เพื่อยึดครองตำแหน่งจากชายแดน\n\nทันใดนั้น และอย่างเด็ดขาด ข่าวลือเหล่านี้ก็ได้ยุติลงแล้ว\n\nดูเหมือนว่าผู้ปกครองอาวุโส[recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstName] ไม่ไว้วางใจในแรงจูงใจของเพื่อนร่วมงานรุ่นน้องของ[recipient.GetHerHis]"
 diarchy.8004.desc.planned: "ไม่ใช่ความลับที่ราชสำนักจักรวรรดิเต็มไปด้วยการพูดคุยถึงโครงการทางทหารอันยิ่งใหญ่ การส่งกองทัพของจักรวรรดิไปยังประเทศชายแดนที่โชคร้ายบางแห่งเพื่อชิงเกียรติยศและดินแดน\n\nการพูดคุย เช่นนี้ไม่ใช่เรื่องแปลก แต่บ่อยครั้งก็ไร้ความหมาย — เพียง แต่ไม่ใช่ครั้งนี้ ผู้ปกครองร่วม[recipient.GetTitleAsNameNoTooltip] [actor.GetFirstName] ดูเหมือนจะเป็นผู้บงการความพยายามอย่างจริงจัง โดยได้รับอนุญาตจากผู้ปกครองอาวุโส[recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstNamePossessive] เพื่อผลักดันขยายพรมแดน\n\n"
 diarchy.8004.desc.planned.forced: "มีข้อกล่าวหาว่า [actor.GetFirstNameNoTooltip] สามารถบังคับให้เพื่อนร่วมงานอาวุโสของ[actor.GetHerHis]ยอมทำตามได้ อย่างน้อย ข่าวลือก็ว่า เช่นนั้น"
 diarchy.8004.desc.planned.allowed: "การที่ผู้ปกครองอาวุโส[recipient.GetTitleAsNameNoTooltip]เต็มใจที่จะไว้วางใจกองทหารของ[recipient.GetHerHis]ให้กับ[actor.GetFirstNameNoTooltip]นั้น ไม่ต้องสงสัยเลยว่าเป็นเครื่องหมายของความไว้วางใจอย่างมากระหว่างทั้งสอง"
 diarchy.8004.a.vetoed: "อย่างน้อยเราก็หลีกเลี่ยงสงครามได้..."
 diarchy.8004.a.allowed: "ดินแดนใหม่ให้แย่งชิงกัน..."

 diarchy.8005.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8005.desc.boilerplate: "ในฐานะ[attacker.GetLiege.GetTitleAsNameNoTooltip]ของท่าน ข้ากำลังระดมพลกรีธาทัพต่อต้านพวกขี้ขลาดแห่ง[defender.GetPrimaryTitle.GetDefinitiveName]"
 diarchy.8005.desc: "$diarchy.8005.desc.boilerplate$\n\nเขตปกครองของท่านมีพรมแดนติดกับดินแดนที่เราหวังจะยึดครอง ซึ่งหมายความว่าท่านมีหน้าที่ต้องช่วยเหลือเรา ข้าขอเรียกร้องให้ท่านส่งทหารไปยังแนวหน้าโดยทันที!"
 diarchy.8005.a: "สู่สมรภูมิอีกครั้ง!"
 diarchy.8005.b: "ข้าจะไม่มีส่วนร่วมในความโง่เขลาของ#EMP ผู้ร่วม#!ปกครอง[attacker.GetLiege.GetTitleAsNamePossessiveNoTooltip]"

 diarchy.8006.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8006.desc: "$diarchy.8005.desc.boilerplate$ แม้ว่าเขตปกครองของท่านจะไม่ได้ติดกับแนวหน้า แต่ท่าน #EMP ก็คือ#! หนึ่งในผู้บริหารการทหารที่โดดเด่นของเรา\n\nกองกำลังของท่านยินดีเข้าร่วมสงคราม หากท่านปรารถนาส่วนแบ่งแห่งเกียรติยศของท่านเอง"
 diarchy.8006.a: "$diarchy.8005.a$"
 diarchy.8006.b: "$diarchy.8005.b$"
 
 diarchy.8011.t: "การกรีฑาทัพอันรุ่งโรจน์!"
 diarchy.8011.desc.all_titles_legally_yours: "เมื่อสงครามสิ้นสุดและฝุ่นจางหาย ข้าจับตามองดินแดนที่ข้ายึดมาเพื่อจักรวรรดิ... และเห็นว่า แต่ละแห่งนั้น #EMP บังเอิญ#! อยู่ในเขตอำนาจของข้าอย่างชัดเจนอยู่แล้ว\n\nอาจไม่มีเกียรติยศเพิ่มเติมในกลอุบายอันไม่ซื่อ เช่นนี้ แต่ก็ไม่มีข้อร้องเรียนที่ร้ายแรง เช่นกัน\n\nท้ายที่สุดแล้ว ทุกอย่างถูกต้องตามกฎหมายทุกประการ"
 diarchy.8011.desc.fallback: "สงครามสิ้นสุดลงแล้ว ดินแดนของ [defender.GetTitledFirstNamePossessive] แตกสลาย และแนวพรมแดนได้ถูกผลักดันกลับไปอีกครั้ง\n\nสิ่งที่เหลืออยู่ตอนนี้คือการตัดสินใจว่าจะจัดการกับดินแดนที่ยึดครองได้อย่างไร\n\nตามสิทธิ์แล้ว ดินแดนเหล่านั้น #EMP ควรจะ#! ตกเป็นของ [attacker.GetLiege.GetTitledFirstName] ผู้อาวุโสของข้า เพื่อแจกจ่าย — ความสำเร็จที่ #EMP แน่ใจ#! ว่าจะเพิ่มพูนอิทธิพลของข้าใน [attacker.GetLiege.GetCapitalLocation.GetTitle.GetBaseNameNoTier] — แต่ข้าไม่ใช่ผู้ร่วม-[attacker.GetLiege.GetTitleAsNameNoTooltip] หรอกหรือ? ข้าไม่สามารถเก็บและแจกจ่ายดินแดนเหล่านั้นด้วยตนเอง หรือ แต่งตั้งคนท้องถิ่นที่รู้สึกขอบคุณสำหรับโอกาสที่ข้ามอบให้พวกเขาได้หรือ?"
 diarchy.8011.a: "ข้าชนะดินแดนเหล่านี้ และข้าจะเก็บมันไว้เอง"
 diarchy.8011.tt.all_lands_remain_in_your_custody: "ท่านเก็บ [vassals|E] และ [titles|E] ทั้งหมดที่ยึดมาได้ แต่ไม่ได้รับ [influence_i][influence|E]"
 diarchy.8011.b: "เรารบเพื่อจักรวรรดิ และของริบได้ย่อมตกเป็นของจักรวรรดิ!"
 diarchy.8011.tt.distribution.lands_given_to_emperor: "ดินแดนที่ยึดครองได้ถูกโอนไปยัง [attacker.GetLiege.GetTitledFirstName]"
 diarchy.8011.c: "บางทีข้าอาจจะเก็บรางวัลไว้ #EMP ชิ้นหนึ่ง#!..."
 diarchy.8011.tt.distribution.reserve_prize: "ดินแดนที่ยึดครองได้ถูกโอนไปยัง [attacker.GetLiege.GetTitledFirstName] — ยกเว้น [prize_county.GetBaseNameNoTier] และทุกสิ่งใน [duchy|E] ของมัน"
 diarchy.8011.d: "ผู้ว่าการชั่วคราวจะจัดการดินแดนใหม่ของเรา"
 diarchy.8011.tt.distribution.interim_governors: "ดินแดนที่ยึดครองได้ถูกมอบให้แก่ [characters|E] ท้องถิ่นที่เหมาะสม"
 diarchy.8011.tt.distribution.interim_governors.hook_and_opinion: "ท่านได้รับบุญคุณ [hook|E] จากผู้ว่าการคนใหม่ แต่ละคน"
 diarchy.8011.e: "ช่างเป็นอุบัติเหตุที่สะดวกเสียจริง"
 diarchy.8011.e.tt.keep_everything_but_legally: "ท่านเก็บดินแดนทั้งหมดที่ชนะมาได้ — และไม่มีใครสามารถพูดได้ว่ามันไม่ยุติธรรม"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_all: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_full_value')|P0] [influence|E] สำหรับ [counties|E] ที่โอนย้าย"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_all: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_full_value')|P0] [influence|E] สำหรับ [vassals|E] ที่โอนย้าย"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_prize: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_prize_value')|P0] [influence|E] สำหรับ [counties|E] ที่โอนย้าย"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_prize: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_prize_value')|P0] [influence|E] สำหรับ [vassals|E] ที่โอนย้าย"
 diarchy_8011.turn_over_titles.tt.interim_governors.county: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_reduced_value')|P0] [influence|E] สำหรับ [counties|E] ที่โอนย้าย"
 diarchy_8011.turn_over_titles.tt.interim_governors.vassal: "[attacker.GetShortUIName|U] ได้รับ[_s(attacker)] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_reduced_value')|P0] [influence|E] สำหรับ [vassals|E] ที่โอนย้าย"

 diarchy.8012.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8012.desc.keeping_all: "ท่านคงยินดีที่จะทราบว่าสงครามของข้าเป็นไปด้วยดี — #EMP ดีมาก#! ทีเดียว\n\nอย่างไรก็ตาม ดินแดนที่ยึดครองได้ยังคงต้องการการชี้นำอันมั่นคงต่อไปอีกระยะหนึ่ง ดังนั้นข้าจะอยู่เบื้องหลังเพื่อดูแลการปกครองที่ดีของพวกเขา"
 diarchy.8012.desc.turning_over_all: "ความกล้าหาญประดับ [attacker.Custom('GetBestEmpireWithAdjective')] ในวันนี้ และท่านกับข้าเหนือสิ่งอื่นใด! การกรีฑาทัพของเราประสบความสำเร็จอย่างแท้จริง และดินแดนที่ข้าปราบปรามได้ บัดนี้อยู่ในการจัดการของท่านแล้ว\n\nแด่ความร่วมมืออันดี!"
 diarchy.8012.desc.turning_over_most: "วันนี้เราได้ลิ้มรสชัยชนะอันหอมหวานที่สุด! เมื่อสงครามชนะ ข้าได้ส่งผู้บริหารที่ท่านจ่ายค่าจ้างส่วนตัวไปยังดินแดนที่ยึดครองได้ส่วนใหญ่แล้ว\n\nข้าหวังว่าท่านจะไม่ขุ่นเคืองข้าสำหรับรางวัลอันน้อยนิดของ [prize_county.GetBaseNameNoTier] และดินแดนต่างๆ ของมัน ค่าชดเชยเล็กน้อยสำหรับเลือดและทองคำที่ข้าเสียไป"
 # Death to the Corpse Emperor, etc.
 diarchy.8012.desc.interim_governors: "ความโกลาหลของสงครามได้เปิดทางให้ชัยชนะอันหอมหวานของจักรวรรดิ และข้ายินดีที่จะประกาศว่าการกรีฑาทัพของเราประสบความสำเร็จ!\n\nเพื่อความรวดเร็ว ข้าได้มอบดินแดนที่ยึดครองได้ให้กับผู้ว่าการท้องถิ่นที่คัดเลือกมา พวกเขาจะรับใช้เราอย่างภักดีอย่างไม่ต้องสงสัยจนกว่าเราจะเห็นสมควรที่จะแทนที่พวกเขา — ร่วมกัน"
 diarchy.8012.desc.legal_shenanigans: "ข้ายินดีที่จะรายงานความสำเร็จของสงครามของเรา! ดินแดนที่ปลดปล่อย ซึ่งเราทั้งคู่เห็นพ้องกันว่าเป็นส่วนหนึ่งอย่างมั่นคงของดินแดนที่ตำแหน่งของข้าควบคุม จะเจริญรุ่งเรืองภายใต้การบริหารของข้าอย่างแน่นอน\n\nแน่นอน หากมีสิ่งอื่นใด ท่านก็รู้ว่าข้าจะมอบมันให้กับท่าน แต่อนิจจา..."
 diarchy.8012.tt.keeping_all: "[attacker.GetFirstName] เก็บทุกอย่างไว้ #WEAK (ในตอนนี้)#! แต่ไม่ได้รับ [influence|E]"
 diarchy.8012.tt.turning_over_all: "[attacker.GetFirstName] โอน [titles|E] และ [vassals|E] ที่ยึดครองได้ทั้งหมดให้ท่าน"
 diarchy.8012.tt.turning_over_most: "[attacker.GetFirstName] โอน [titles|E] และ [vassals|E] ที่ยึดครองได้ส่วนใหญ่ให้ท่าน แต่เก็บ [duchy|E] ไว้เพื่อ [attacker.GetHerselfHimself]"
 diarchy.8012.tt.interim_governors: "[attacker.GetFirstName] ได้ แต่งตั้งผู้ว่าการท้องถิ่น #WEAK (ในตอนนี้)#! เพื่อควบคุมดินแดนที่ยึดครองได้"
 diarchy.8012.tt.legal_shenanigans: "[attacker.GetFirstName] เก็บทุกอย่างไว้ — [titles|E] และ [vassals|E] ทั้งหมดจะเป็นส่วนหนึ่งของเขตอำนาจของ [attacker.GetHerHis|E] อยู่แล้ว"
 diarchy.8012.desc.a.keeping_all: "#EMP เจ้าคนเนรคุณจองหองนั่น!#!"
 diarchy.8012.desc.a.turning_over_all: "อา การปกครองที่ดีที่สุด"
 diarchy.8012.desc.a.turning_over_most: "พอรับได้"
 diarchy.8012.desc.a.interim_governors: "หืม ข้าพอจะเห็นเหตุผลอยู่"
 diarchy.8012.desc.a.legal_shenanigans: "ฉลาดนัก [attacker.GetFirstNameNoTooltip] ฉลาดมาก"

 diarchy.8022.t: "การ ทำให้พิการทางการเมือง: ถูกปลด"
 diarchy.8022.t.dead: "การประหารชีวิตทางการเมือง"
 diarchy.8022.desc.intro: "มีเพียงสองวิธีที่จะขับไล่ใครบางคนออกจากบัลลังก์จักรพรรดิได้อย่างแท้จริงเมื่อพวกเขาได้นั่งบนนั้นแล้ว: ความตายหรือความพิการ\n\n"
 diarchy.8022.desc.dead: "โชคไม่ดีสำหรับผู้ร่วม-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName] ผู้อาวุโส [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName] ได้เลือกเส้นทางที่ #EMP แน่นอนกว่า#! อย่างเห็นได้ชัดจากทั้งสองทาง"
 diarchy.8022.desc.maimed: "โชคดีสำหรับผู้ร่วม-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName] ผู้อาวุโส [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName] เลือกทางเลือกที่เมตตากว่าจากทั้งสองทาง"
 diarchy.8022.desc.outro: "\n\nเสียงกระซิบแพร่สะพัดเกี่ยวกับเรื่องทะเลาะวิวาทครั้งใดจากหลายครั้งของพวกเขาที่ ทำให้ [actor.GetFirstNameNoTooltip] ใช้มาตรการรุนแรง เช่นนี้ แต่ท้ายที่สุดแล้วมันก็ไม่สำคัญอีกต่อไป สิ่งที่ทำไปแล้วก็คือทำไปแล้ว\n\nบางทีนี่อาจเป็นผลลัพธ์ที่เป็นไปได้มากที่สุดเสมอมา — มงกุฎเดียวไม่เหมาะกับสองหัวอยู่แล้ว"
 diarchy.8022.tt.explanation: "[recipient.GetFirstName] ไม่ถูกพิจารณาว่าเป็น [co_emperor|E] อีกต่อไป"
 diarchy.8022.a: "อาชญากรรมที่อุกอาจ!"
 diarchy.8022.b: "นี่คือจุดจบที่ดีที่สุดเท่าที่จะเป็นไปได้"
 diarchy.8022.c: "มันก็เป็น เช่นนี้ใน [actor.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"

 diarchy.8023.t: "การ ทำให้พิการทางการเมือง: การชิงบัลลังก์!"
 diarchy.8023.t.dead: "$diarchy.8022.t.dead$"
 diarchy.8023.desc.intro: "ในการกระทำอันโหดร้ายอย่างเด็ดขาด [actor.GetFirstName] — อดีตผู้ร่วมปกครอง [actor.GetTitleAsNameNoTooltip] กับสมเด็จพระจักรพรรดินี [recipient.GetHerHis|U] [recipient.GetFirstName] — ได้"
 diarchy.8023.desc.dead: "ประหารชีวิตผู้อาวุโส [actor.GetTitleAsNameNoTooltip] ของ [actor.GetHerHis] อย่างน่าสยดสยอง"
 diarchy.8023.desc.maimed: "ทำให้เนื้อหนังของผู้อาวุโส [actor.GetTitleAsNameNoTooltip] ของ [actor.GetHerHis] พิการ"
 diarchy.8023.desc.outro: "\n\nสัญลักษณ์ของการกระทำนั้นชัดเจนเหมือนประเพณีและกฎหมายของเรา: [actor.GetPrimaryTitle.GetDefinitiveName] บัดนี้คำนับเพียง [actor.GetWomanMan] ผู้เดียว"
 diarchy.8023.desc.outro.alive: "\n\n[recipient.GetFirstNameNoTooltip] คงต้องพอใจกับเพียงชีวิตของ [recipient.GetHerHis] และสิ่งอื่นอีกเล็กน้อย"
 diarchy.8023.tt.explanation: "[actor.GetFirstName] ได้ [deposed|E] [recipient.GetFirstName] บัดนี้ครองราชย์สูงสุดในฐานะ [actor.GetTitleAsName|U] แต่เพียงผู้เดียว"
 diarchy.8023.a: "ตระกูล [actor.GetHouse.GetBaseNameNoTooltip] ได้ครองตำแหน่งอันชอบธรรมในที่สุด!"
 diarchy.8023.b: "นี่คือการชิงบัลลังก์!"
 diarchy.8023.c: "$diarchy.8022.c$"

 diarchy.8031.t: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 diarchy.8031.desc: "คำขอของท่านมีเหตุผลและสมเหตุสมผล: ข้าจะสั่งการผู้ว่าการของ [target.GetDefinitiveName] ว่า นับจากนี้ไป พวกเขาจะต้องเชื่อฟังท่านเป็นอันดับแรกและสำคัญที่สุด\n\nขอให้ท่านนำการปกครองที่มีคุณภาพ เช่นเดียวกับที่ข้ามุ่งมั่นนำมาสู่ส่วนที่เหลือของจักรวรรดิมาสู่พวกเขา"
 diarchy.8031.a: "อา จักรวรรดิของข้าภายในจักรวรรดิ"

 diarchy.8032.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8032.desc: "ท่านเป็นบุคคลผู้มีอำนาจมากที่สุดเป็นอันดับสองใน [recipient.GetPrimaryTitle.GetDefinitiveName] ทั้งหมด และท่านต้องการ #EMP มากกว่านี้#! อีกหรือ?\n\nไม่ เราแบ่งแยกกันมากพอแล้วกับผู้ปกครองสูงสุดสองคน บางทีแม้แค่นั้นก็อาจจะมากเกินไป"
 diarchy.8032.a: "นี่ควรจะเป็นความร่วมมือสิ!"

 diarchy.8033.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8033.desc.intro: "สหาย [recipient.GetTitleAsNameNoTooltip] ข้ารู้สึกเสียใจที่ต้องบังคับให้ท่านรับภาระหน้าที่มากมายในความร่วมมือของเรา นับจากนี้ไป ข้าจะเข้าควบคุม [target.GetName] โดยตรง เพื่อจัดการผู้ว่าการและรวบรวมผู้คน และแบ่งเบาภาระบนบ่าอันสูงส่งของท่าน\n\n"
 diarchy.8033.desc.hook: "ถือว่าหนี้ของท่านที่มีต่อข้าได้ชำระแล้ว"
 diarchy.8033.desc.insufficient_influence: "แน่นอน ข้าซาบซึ้งในความคิดเห็นของท่านในเรื่องนี้และทุกเรื่อง แต่ข้าเกรงว่าข้าได้จัดการเรื่องต่างๆ เรียบร้อยแล้ว"
 diarchy.8033.tt.influence: "ท่านไม่มี [influence_i][influence|E] เพียงพอที่จะต่อต้าน [co_emperor|E] ของท่าน"
 diarchy.8033.a: "อุกอาจ!"

 diarchy.8041.t: "องค์อธิปัตย์ [actor.GetFirstName] ของท่าน ขอประกาศต่อสาธารณะ ณ บัดนี้ว่า"
 diarchy.8041.desc: "ด้วยหัวใจอันหนักอึ้ง ข้าขอยอมรับถึงภัยพิบัติอันแท้จริงที่รุมเร้า [actor.Custom('GetBestEmpireWithAdjective')]: ท่อระบายน้ำของเราอุดตัน ชายแดนของเราระส่ำระสาย และบุตรหลานของเราเกิดมาปัญญาอ่อน\n\nปัญหาเหล่านี้ ทุกประการ ล้วนเป็นความผิดอันสูงสุดของผู้ร่วม-[actor.GetTitleAsNameNoTooltip] [recipient.GetFirstName] ที่ถูกกล่าวหาของข้า คนโง่และคนเลวทรามที่ยั่วยุพระพิโรธของ [actor.GetFaith.FateGodName] ต่อเรา"
 diarchy.8041.a: "เจ้า [actor.Custom2('InsultNoun', ROOT.Char)] ผู้หยิ่งผยอง!"
 diarchy.8041.b: "ทั้งสองคนนี้ควรจะทะเลาะกันอย่างเปิดเผย เช่นนี้จริงหรือ?"
 
 diarchy.8042.t: "$diarchy.8041.t$"
 diarchy.8042.desc: "ให้ทุกคนรู้ว่าความเจ็บป่วยนับพันที่รุมเร้าอาณาจักร — ตั้งแต่ชาวต่างชาติ การไร้ศรัทธา ไปจนถึงภาษีสูง — #EMP ทั้งหมด#! เป็นผลงานของผู้อาวุโส [recipient.GetTopLiege.GetTitleAsNameNoTooltip] ที่ถูกกล่าวหาของข้า\n\nการจัดการที่ไร้ความสามารถของ [recipient.GetHerHis|U] ขัดขวางทุกการกระทำของข้า และ ทำให้ชีวิตของพวกท่านแย่ลงใน แต่ละวันที่ผ่านไป"
 diarchy.8042.a: "เจ้าคนเนรคุณน่ารำคาญ!"
 diarchy.8042.b: "$diarchy.8041.b$"

 ##################################################
 # #Decisions
 betrayed_by_proxy:0 "ถูกทรยศโดยตัวแทน"
 diarch_attempt_to_overthrow_liege.event.t:0 "รัฐประหารที่รอคอยมานาน:"
 diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate:0 "\n\n"[liege.GetFirstName]!" [usurper.GetFirstNameNoTooltip] ร้องตะโกน "ข้าขอประกาศว่าเจ้าคือผู้อ้างสิทธิ์อันจอมปลอม ไม่คู่ควรกับบัลลังก์ของเจ้า! จงยอมจำนนต่อผู้ปกครองที่แท้จริงของอาณาจักร #EMP ข้าผู้นี้!#!"\n\nอัศวินชั้นผู้น้อยหลายคนพยายามขวางทาง [usurper.GetHerHis] แต่ก็ถูกคว้านท้องในเวลาอันสั้น"

 #	Diplomacy: You attempt to bloodlessly coup your liege.
 diarchy.9001.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ ลิ้นเงินลิ้นทอง"
 diarchy.9001.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้องบัลลังก์ของข้า ด้านหลัง [usurper.GetHerHis] คือฝูงชนผู้มีอิทธิพลในราชสำนัก แต่ละคนถืออาวุธด้วยท่าทีสงบนิ่งของผู้ที่รู้ว่าแค่การข่มขู่ก็เพียงพอแล้ว.. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9001.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
 diarchy.9001.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9001.desc.proxy.loyal:0 "$diarchy.9011.desc.proxy.loyal$"
 diarchy.9001.desc.outro:0 "\n\nถึงเวลาแล้ว ช่วงเวลาที่การกบฏเดือดพล่าน"
 diarchy.9001.a:0 "เจ้าคิดว่าข้าหลวงผู้ภักดีของข้าจะทอดทิ้งข้าเพื่อ #EMP เจ้าหรือ?!#!"
 diarchy.9001.a.tt.success:0 "วาทศิลป์ของท่านทำลายข้อตกลงของ [usurper.GetFirstNamePossessiveNoTooltip]"
 diarchy.9001.a.tt.failure:0 "มันสายเกินแก้เสียแล้ว"
 diarchy.9001.b.young:0 "ชี้ไปที่ [proxy.GetFirstNameNoTooltip] เพื่อขอความช่วยเหลือ"
 diarchy.9001.b.fallback:0 "[proxy.GetFirstNameNoTooltip] จัดการเจ้าคนเลวทรามนี่"
 diarchy.9001.b.tt.success:0 "วาทศิลป์ของ [proxy.GetFirstNamePossessiveNoTooltip] ทำลายข้อตกลงของ [usurper.GetFirstNamePossessiveNoTooltip]"
 diarchy.9001.b.tt.failure:0 "มันสายเกินแก้เสียแล้ว"
 diarchy.9001.c:0 "ข้า... ข้าทำอะไรไม่ได้..."
 diarchy.9001.d:0 "#DIE2 ทหาร!#! #DIE1 ทหาร!#! #BER ทหาร!#!"
 diarchy.9001.d.tt.win:0 "ทหารผู้ภักดีมาถึงและเอาชนะผู้สมรู้ร่วมคิดได้"
 diarchy.9001.d.tt.loss:0 "ผู้พิทักษ์คนสุดท้ายที่เป็นไปได้ของท่านถูกสังหารอย่างง่ายดาย"

 #	Diplomacy: Usurper won, liege-side.
 diarchy.9002.t:0 "$diarchy.9001.t$"
 diarchy.9002.desc.intro:0 "ข้าพ่ายแพ้แล้ว พ่ายแพ้อย่างสิ้นเชิง\n\n"
 diarchy.9002.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] พยายามอย่างสุดความสามารถ [proxy.GetHerHis] แล้ว แต่ข้อโต้แย้งของ [usurper.GetFirstNamePossessive] นั้นราบรื่นและเตรียมมาอย่างดี เหล่าผู้ทรยศยังคงภักดีต่อนายจ้างของตน และราชสำนักของข้าก็ถอยห่าง เพื่อให้ [usurper.GetHerHim] เข้ามาได้อย่างไม่มีอุปสรรค"
 diarchy.9002.desc.proxy.self_fought:0 "ความพยายามทั้งหมดของข้าไร้ผล [usurper.GetFirstName|U] ใช้เวลาวางแผนเรื่องนี้นานเกินไป และทุกครั้งที่เราโต้เถียงกัน ข้าเห็นสมาชิกราชสำนักของข้าอีกสองสามคนค่อยๆ เคลื่อนไปทางฝั่ง [usurper.GetHerHis] มันไม่ดีเลย ข้าเสียบัลลังก์ไปแล้ว"
 diarchy.9002.desc.surrendered:0 "ข้ารู้ว่าการต่อสู้ครั้งนี้จะเป็นอย่างไร หากข้าสู้ด้วยคำพูด ข้าจะพิสูจน์ความไม่คู่ควรที่จะปกครอง หากข้าสู้ด้วยเหล็กกล้า ข้าจะถูกจับหรือแย่กว่านั้น ทางเดียวที่จะชนะคือไม่เล่น — #EMP ในตอนนี้#!.\n\nอย่าเข้าใจผิด "[usurper.GetTitleAsName]" [usurper.GetFirstName] ข้าจะกลับมาจัดการเจ้า"
 diarchy.9002.desc.scuffled:0 "ข้าร้องขอความช่วยเหลือ แต่ทหารไม่กี่คนที่มาถึงก็ถูกผู้สมรู้ร่วมคิดของ [usurper.GetFirstNamePossessive] จัดการอย่างง่ายดาย หลังจากนั้นไม่นาน กระแสของผู้ที่อาจมาช่วยก็เหือดหายไป และทุกคนในราชสำนักก็เห็นว่าข้าโดดเดี่ยวอย่างแท้จริงและสิ้นหวังเพียงใด"
 diarchy.9002.desc.outro:0 "\n\nผู้ชิงบัลลังก์ทำท่าทาง และด้วยความลังเลอย่างเห็นได้ชัด ทหารองครักษ์ของข้าเอง ซึ่งเพิ่งจะเป็นของข้าเมื่อไม่นานมานี้ก็เคลื่อนเข้ามานำตัวข้าออกไป น่าเศร้าที่เห็นได้ชัดว่าลมกำลังพัดไปทางไหน"
 diarchy.9002.a:0 "ข้ามีอิสรภาพ แต่มีสิ่งอื่นอีกเพียงน้อยนิด"
 diarchy.9002.b:0 "ชะตากรรมของข้า พังทลายลง"

 #	Diplomacy: Usurper won, usurper-side.
 diarchy.9003.t:0 "$diarchy.9001.t$"
 diarchy.9003.desc.intro:0 "มันจบแล้ว บัดนี้ข้าปกครองอย่างสมบูรณ์ และเพียงลำพัง\n\n"
 diarchy.9003.desc.proxy.proxy_fought:0 "ขณะที่เราเข้าไปในห้องโถง อดีต-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] ส่งลูกสมุนของ [liege.GetHerHis] [proxy.Custom2('MyCharacterIntroduction', ROOT.Char)] มาทำลายความมุ่งมั่นของกลุ่มผู้ติดตามข้า เราสู้กันด้วยคำพูดที่แหลมคมราวกับกริช แต่ในที่สุด ทุกคนก็เห็นว่าราชสำนักอยู่ข้างข้า"
 diarchy.9003.desc.proxy.self_fought:0 "อดีต-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] เผชิญหน้ากับเรา [liege.GetHerselfHimself] ขณะที่กลุ่มผู้ติดตามข้าและข้าย่างก้าวเข้าไปในห้องบัลลังก์ ข้าต้องให้เครดิต [liege.GetHerHim] ในเรื่องนั้น สำหรับการพยายามครั้งสุดท้ายเพื่อเรียกคืนความภักดีจากข้าราชบริพารที่ลังเลของ [liege.GetHerHis] แต่เสียงร้องของ [liege.GetHerHis] ไม่ได้รับการรับฟัง และท่าทางของเขาก็พบเพียงสายตาที่มองไม่เห็น\n\nในไม่ช้า ทุกคนก็เห็นว่าใครคือ [usurper.Custom('MistressMaster')] #EMP ที่แท้จริง#! ในห้องนั้น"
 diarchy.9003.desc.surrendered:0 "ในท้ายที่สุด มันค่อนข้างจะน่าผิดหวังเล็กน้อย ขณะที่กลุ่มผู้ติดตามข้าและข้าย่างก้าวเข้าไปในห้อง ทุกคนรู้ว่าทำไมเราถึงอยู่ที่นั่น เราอยู่ที่นั่นเพื่อทำอะไร ไม่มีการต่อต้านใดๆ โดยเฉพาะอย่างยิ่งจากอดีต-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] และข้าแทบไม่ต้องใช้คำพูดที่วางแผนไว้เลย"
 diarchy.9003.desc.scuffled:0 "วินาทีที่เราเข้าไปในห้องบัลลังก์ อดีต-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstName] ก็เริ่มร้องโวยวายถึงความไม่คู่ควรของ [liege.GetHerHis] ให้ทุกคนได้ยิน กรีดร้องหาใครก็ได้ ใครก็ได้ มาช่วย [liege.GetHerHim] เรายังไม่ได้ชักอาวุธออกมาด้วยซ้ำ แต่นั่นก็ไม่ได้หยุดเราจากการสังหารทหารไม่กี่คนที่มาถึงอย่างรวดเร็วพอ ไม่มีใครเหลืออยู่ข้าง [liege.GetFirstNameNoTooltip] อีกแล้ว"
 diarchy.9003.desc.outro:0 "\n\nทหารองครักษ์สลายตัวไปและเหล่าขุนนางคุกเข่าลง แม้ แต่ตอนนี้ คำพูดก็แพร่กระจายไปทั่ว [usurper.GetPrimaryTitle.GetTierAsName] ความภักดีเปลี่ยนไปเหมือนระลอกคลื่นบนสระน้ำ"
 diarchy.9003.a:0 "และทั้งหมดนี้โดยไม่มีเลือดหยดลงบนบัลลังก์ #EMP ของข้า#! เลย!"
 diarchy.9003.a.some_blood:0 "และข้าอยู่ที่นี่ พยายามหลีกเลี่ยงการนองเลือด"

 #	Diplomacy: Liege won, liege-side.
 diarchy.9004.t:0 "$diarchy.9001.t$"
 diarchy.9004.desc.proxy.proxy_fought:0 "ทันทีที่ [proxy.GetTitledFirstName] เริ่มพูด พวกคนทรยศก็เริ่มแตกสลาย\n\nด้วยความที่รวมตัวกันด้วยความกระหายอำนาจไม่ว่าจะต้องแลกด้วยอะไรก็ตาม มากกว่าที่จะมีความคิดเรื่องความภักดีอย่างจริงจัง จึงใช้เวลาไม่นานที่เหตุผลของ [usurper.GetTitledFirstNamePossessive] จะคลี่คลายต่อหน้าต่อตา [usurper.GetHerHis]"
 diarchy.9004.desc.proxy.self_fought:0 "คำพูดของข้าเข้าเป้าอย่างรวดเร็ว การเหน็บแนมที่คิดมาอย่างดี แต่ละครั้งสลายสายสัมพันธ์แห่งความโลภและความทะเยอทะยาน ซึ่งเป็นสิ่งเดียวที่ผูกมัดแนวร่วมของ [usurper.GetTitledFirstNamePossessive] ไว้ด้วยกัน\n\nหากปราศจากความสามัคคี เหตุผลของพวกเขาก็สูญสิ้น และทั้งคนทรยศและทหารรับจ้างต่างก็เริ่มถอยห่างจาก [usurper.GetFirstNameNoTooltip] เป็นจำนวนมาก"
 diarchy.9004.desc.scuffled:0 "เสียงร้องของข้านำอัศวินชั้นผู้น้อยและทหารผู้มีความหวังทุกคนที่ได้ยินเสียงกรูเข้ามาในห้องโถง เป็นนักรบจำนวนมากกว่าที่กลุ่มของ [usurper.GetTitledFirstNamePossessive] จะรับมือไหว\n\nการปะทะกันสั้นๆ อย่างดุเดือดเกิดขึ้น ผู้สมรู้ร่วมคิดตายหรือถูกจับ และหัวหน้าของพวกเขาถูกปลดอาวุธ"
 diarchy.9004.desc.outro:0 "\n\nข้าแสยะยิ้มขณะที่ทหารองครักษ์จับกุม [usurper.GetHerHim] และโบกมือให้พาเจ้าสารเลวนั่นออกไป"
 diarchy.9004.a:0 "ช่างเป็นคนทรยศตัวน้อยที่น่ารังเกียจ"

 #	Diplomacy: Liege won, usurper-side.
 diarchy.9005.t:0 "$diarchy.9001.t$"
 diarchy.9005.desc.intro:0 "ข้าล้มเหลว ข้าล้มเหลวอย่างสิ้นเชิง\n\nตอนแรกทุกอย่างเป็นไปด้วยดี — "
 diarchy.9005.desc.proxy.proxy_fought:0 "[liege.GetTitledFirstName] ร้องเรียก [proxy.GetTitledFirstName] อย่างบ้าคลั่งเพื่อขอความช่วยเหลือ กลุ่มผู้ติดตามข้าอัดแน่นอยู่ข้างหลังข้า จุดประสงค์ของเราชัดเจนและก้าวย่างของเรายาวไกล\n\nจากนั้นอัครเสนาบดีเจ้ากรรมนั่นก็เปิดปาก [proxy.GetHerHis] และทุกอย่างก็เริ่มคลี่คลาย ทีละคน ขุนนางที่ตามข้าเข้ามาก็ถอยห่างออกไป จนกระทั่งเหลือเพียงข้าคนเดียว อำนาจที่ข้าสร้างขึ้นอย่างยากลำบากพังทลายลงรอบหูข้า\n\nทหารองครักษ์จับกุมข้าอย่างรวดเร็วหลังจากนั้น"
 diarchy.9005.desc.proxy.self_fought:0 "กลุ่มผู้ติดตามข้าและข้ามั่นใจในชัยชนะที่เห็นได้ชัดของเรา นั่นคงอยู่เพียงตราบเท่าที่ [liege.GetFirstNameNoTooltip] เปิดปาก [liege.GetHerHis] เพื่อเริ่มโจมตีเรา เพื่อเปิดเผยจุดอ่อนในแผนของข้า ช่องว่างเล็กๆ ในอำนาจของข้า\n\nข้าคิดว่าข้าควบคุมทุกอย่างได้อย่างสมบูรณ์ ข้าไม่ทันรู้ตัวเลยว่าข้าผิดพลาดไปมากแค่ไหน จนกระทั่งทหารองครักษ์จับตัวข้า"
 diarchy.9005.desc.scuffled:0 "[liege.GetTitledFirstName] ตื่นตระหนกอย่างเห็นได้ชัดเมื่อกลุ่มผู้ติดตามข้าและข้าเข้าไปในห้องบัลลังก์ จุดประสงค์ของเราชัดเจน และเริ่มกรีดร้องอย่างบ้าคลั่ง\n\nข้า... ข้าประเมินต่ำไปว่าทหารรับจ้างและทหารองครักษ์ที่จ้างมาบางคนจะภักดีต่อนายจ้างของพวกเขาเพียงใด พวกเขากรูเข้ามาหาเรา คำพูดอันไพเราะของข้าไม่มีความหมายต่อการทุบด้วยค้อนจากกระบองของทหารรับจ้าง และตอนนี้ข้าก็ถูกจองจำอย่างแน่นหนาที่สุดเท่าที่จะเป็นไปได้"
 diarchy.9005.desc.outro:0 "\n\nน่าขันที่ความหวังเดียวของข้าคือความเมตตาจากเจ้าเหนือหัวที่ข้าพยายามจะชิงบัลลังก์ ขอ [usurper.GetFaith.FateGodName] ทรงเมตตา"
 diarchy.9005.a:0 "แผนการอันรอบคอบทั้งหมดของข้า!"

 #	Intrigue: You attempt to coup your liege with just a little bloodshed, threatened and actual.
 diarchy.9011.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ กริชที่ลับคม"
 diarchy.9011.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้องบัลลังก์ของข้า ด้านหลัง [usurper.GetHerHis] คือกลุ่มขุนนางชั้นผู้น้อยในราชสำนัก ทหารรับจ้าง และนักล้วงกระเป๋า ชักกริชออกมาและคิดถึง แต่เลือด $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9011.desc.proxy.none:0 "ข้ามองไปรอบๆ มองหาที่ปรึกษาเพื่อขอการสนับสนุน ไม่มีใครเลย หรือไม่มีใครเต็มใจและมีคุณสมบัติพอที่จะพูดแทนข้า"
 diarchy.9011.desc.proxy.betrayed:0 "ข้ามองไปรอบๆ มองหาที่ปรึกษาเพื่อขอการสนับสนุน [proxy.GetTitledFirstName] สบตาข้าด้วยแววตาแข็งกร้าว และก้าวไปอยู่ข้างหลัง [usurper.GetFirstNameNoTooltip] การทรยศอีกครั้ง"
 diarchy.9011.desc.proxy.loyal:0 "ข้ามองไปที่ [proxy.GetTitledFirstName] เพื่อขอการสนับสนุน เพียงเพื่อจะเห็น [proxy.GetHerHim] เตรียมพร้อม [proxy.GetHerselfHimself] ที่จะพูดแทนข้าแล้ว"
 diarchy.9011.desc.outro:0 "$diarchy.9001.desc.outro$"
 diarchy.9011.a:0 "เจ้าคิดจริงๆ หรือว่าเจ้าจับข้าได้แล้ว เจ้างูตัวน้อย?"
 diarchy.9011.a.tt.success:0 "ท่านบ่อนทำลายความสามัคคีของข้อตกลง ทำให้มันล่มสลาย"
 diarchy.9011.a.tt.failure:0 "พวกเขาเมินเฉยต่อคำเหน็บแนมของท่าน ท่านถูกจับเป็นเชลย"
 diarchy.9011.b.young:0 "$diarchy.9001.b.young$"
 diarchy.9011.b.fallback:0 "$diarchy.9001.b.fallback$"
 diarchy.9011.b.tt.success:0 "[proxy.GetFirstNamePossessive] บ่อนทำลายความสามัคคีของข้อตกลง ทำให้มันล่มสลาย"
 diarchy.9011.b.tt.failure:0 "พวกเขาเมินเฉยต่อเสียงร้องของ [proxy.GetFirstNamePossessive] ท่านถูกจับเป็นเชลย"
 diarchy.9011.c:0 "$diarchy.9001.c$"
 diarchy.9011.d:0 "$diarchy.9001.d$"
 diarchy.9011.d.tt.win:0 "$diarchy.9001.d.tt.win$"
 diarchy.9011.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"

#	Intrigue: Usurper won, liege-side.
 diarchy.9012.t:0 "$diarchy.9011.t$"
 diarchy.9012.desc.intro:0 "$diarchy.9002.desc.intro$"
 diarchy.9012.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] ก้าวออกมาแทนข้า และ [proxy.GetSheHe] กับ [usurper.GetFirstName] โต้เถียงกันไปมา แต่ก็ไร้ผล [usurper.GetWomanMan] สารเลวนั่นเตรียมพร้อมทุกมุม ติดสินบนทุกคน เรียกใช้ทุกบุญคุณ ในที่สุด [proxy.GetFirstNameNoTooltip] ก็พุ่งเข้าใส่ [usurper.GetFirstNameNoTooltip] แต่ถูกกลุ่มผู้ติดตามของ [usurper.GetHerHis] รวบตัวลงกับพื้น"
 diarchy.9012.desc.proxy.self_fought:0 "[usurper.GetFirstName] และข้าโต้เถียงกันอยู่หลายนาที แต่ข้าสู้ [usurper.GetHerHim] ไม่ได้ [usurper.GetWomanMan] สารเลวนั่นเตรียมพร้อมทุกมุม ติดสินบนทุกคน เรียกใช้ทุกบุญคุณ\n\nมือข้าเอื้อมไปที่ด้ามอาวุธ พร้อมที่จะป้องกันตัวเอง แต่แล้วคมดาบก็เลื้อยมาพันรอบคอข้าจากด้านหลัง ทหารองครักษ์ทรยศที่น่าสาปแช่งบางคน"
 diarchy.9012.desc.surrendered:0 "[usurper.GetFirstName] ดูเหมือนจะผิดหวังเล็กน้อยที่ข้าไม่ต่อต้าน แต่ข้ารู้ว่ามันไร้ประโยชน์ที่จะสู้กับ [usurper.GetHerHim] [usurper.GetSheHe] คงไม่อยู่ที่นี่ เคลื่อนไหวต่อต้านข้าอย่างโจ่งแจ้ง เช่นนี้ หาก [usurper.GetSheHe] ไม่ได้มีดาบทุกเล่มในอาคารอยู่ข้าง [usurper.GetHerHis] และชี้ไปที่คนที่ไม่ใช่พวกเดียวกันแล้ว"
 diarchy.9012.desc.scuffled:0 "ทหารองครักษ์ที่ข้าเรียกมา แต่เมื่อเข้ามาในห้อง กลุ่มแรกก็ถูกกลุ่มที่สองฟันล้มลง ถูกแทงข้างหลังหรือเชือดคอตรงที่พวกเขายืนอยู่ [usurper.GetFirstName] ไม่สามารถปาดรอยยิ้มเยาะที่ปรากฏ [usurper.Custom('MaskFace_BehindAcross')] [usurper.Custom('MaskFace')] ของ [usurper.GetHerHis] ออกไปได้"
 diarchy.9012.desc.outro:0 "\n\nข้าร้องตะโกนขณะที่พวกคนทรยศเข้ามาหาข้า กริชพร้อมในมือ กุญแจมือห้อยต่อง แต่งจากมือของ [usurper.GetFirstNamePossessiveNoTooltip]\n\nไม่มีใครฟัง ไม่มีใครสนใจ ถูกล่ามโซ่ตรวน ข้าถูกลากตัวไป"
 diarchy.9012.a:0 "เจ้าทำอย่างนี้ไม่ได้! ข้าคือ [usurper.GetTitleAsNameNoTooltip]! #EMP [usurper.GetTitleAsNameNoTooltip]!"
 diarchy.9012.b:0 "$diarchy.9002.b$"

#	Intrigue: Usurper won, usurper-side.
 diarchy.9013.t:0 "$diarchy.9011.t$"
 diarchy.9013.desc.intro:0 "$diarchy.9003.desc.intro$"
 diarchy.9013.desc.proxy.proxy_fought:0 "[liege.GetFirstName] ส่งลูกสมุนของ [liege.GetHerHis] [proxy.GetTitledFirstName] มาเกลี้ยกล่อมผู้สมรู้ร่วมคิดของข้าให้ออกห่างจากข้า เราโต้เถียงกันอยู่สองสามนาทีก่อนที่ [proxy.GetWomanMan] ที่โกรธจัดจะพยายามพุ่งเข้าใส่ข้า แต่ถูกทหารรับจ้างคนหนึ่งของข้าจับตัวไว้\n\nเจ้าเหนือหัวของเราในตอนนั้นตกใจเกินกว่าจะต่อต้านอย่างจริงจังขณะที่เราใส่กุญแจมือ"
 diarchy.9013.desc.proxy.self_fought:0 "[liege.GetFirstName] พยายามท้าทายข้า พยายามบ่อนทำลายการสนับสนุนจากกลุ่มผู้ติดตามข้าในช่วงเวลาสำคัญ แต่ข้าปัดป้องคำเหน็บแนมเล็กน้อยของ [liege.GetHerHis] ได้อย่างง่ายดาย [usurper.GetWomanMan] ไม่ควรทำรัฐประหารครึ่งๆ กลางๆ อยู่แล้ว\n\nเมื่อ [liege.GetFirstNameNoTooltip] พยายามชักอาวุธของ [liege.GetHerHis] หวังจะตัดหัวข้าอย่างไม่ต้องสงสัย คนทรยศคนหนึ่งของข้าก็จับ [liege.GetHerHim] จากด้านหลัง การใส่กุญแจมือเป็นเรื่องง่ายดาย"
 diarchy.9013.desc.surrendered:0 "ข้าพบว่าตัวเองเกือบจะผิดหวังเมื่อ [liege.GetFirstName] ไม่ต่อต้านเราเลย อย่างน้อยก็หลังจากเสียงกรีดร้องด้วยความโกรธเล็กน้อยขณะที่เราใส่กุญแจมือ [liege.GetHerHim]\n\nแน่นอนว่าเป็นทางเลือกที่ #EMP ฉลาด#! แต่เมื่อไหร่กันที่ [liege.GetSheHe] เคยเลือก #EMP สิ่งนั้น#!?"
 diarchy.9013.desc.scuffled:0 "[liege.GetFirstName] ร้องขอความช่วยเหลือ แต่โดยธรรมชาติแล้ว ข้าได้คำนึงถึงเรื่องนี้ไว้แล้ว คนโง่เขลาพอที่จะตอบรับการเรียกตัวถูกคนทรยศของข้าฟันล้มลงเกือบจะในทันที\n\nไม่มีใครพยายามช่วยเลยขณะที่เราเคลื่อนเข้าไปหาอดีตเจ้าเหนือหัวของเรา"
 diarchy.9013.desc.outro:0 "\n\nเมื่อฝ่ายค้านในราชสำนักตายหรือถูกจองจำ และอดีต [usurper.GetTitleAsNameNoTooltip] ของข้าถูกจองจำ อนาคตก็ดูสดใส"
 diarchy.9013.a:0 "บัลลังก์ใหม่และตัวประกันสดๆ ร้อนๆ — ข้ารู้สึกปลอดภัยแล้ว"

#	Intrigue: Liege won, liege-side.
 diarchy.9014.t:0 "$diarchy.9011.t$"
 diarchy.9014.desc.proxy.proxy_fought:0 "คำพูดที่เหมาะสมเพียงไม่กี่คำจาก [proxy.GetFirstName] และ $diarchy.9014.desc.proxy.self_fought$"
 diarchy.9014.desc.proxy.self_fought:0 "กลุ่มที่มั่นใจเกินเหตุของ [usurper.GetTitledFirstNamePossessive] แตกสลายในเวลาเพียงชั่วครู่\n\nเช่นเดียวกับรังอสรพิษ พวกเขาต้องการฝังเขี้ยวใส่กันและกันเกือบเท่าๆ กับที่ต้องการฝังเขี้ยวใส่ข้า และใช้การกระตุ้นเพียงเล็กน้อย เพื่อให้บางคนละทิ้ง หรือเริ่มต่อสู้กันเอง\n\nรอยยิ้มของ [usurper.GetFirstNamePossessiveNoTooltip] จางลงเมื่อ [usurper.GetSheHe] ตระหนักว่ารัฐประหารที่พยายามทำนั้นล้มเหลวแล้ว.."
 diarchy.9014.desc.scuffled:0 "เมื่อข้าร้อง ทหารองครักษ์ก็มาถึงในจำนวนที่ ทำให้แม้ แต่ #EMP ข้า#! ตกใจ กรูเข้าหา [usurper.GetTitledFirstName] และกลุ่มผู้สมรู้ร่วมคิดของ [usurper.GetHerHis]\n\nใช้เวลาไม่นานที่พวกคนทรยศจะรู้ว่าพวกเขามีจำนวนน้อยกว่าและด้อยกว่าอย่างสิ้นหวัง และเริ่มวางอาวุธทีละคน [usurper.GetTitledFirstNameNoTooltip] เป็นคนสุดท้ายที่ทำ เช่นนั้น"
 diarchy.9014.desc.outro:0 "\n\nเมื่อทหารองครักษ์ของข้าเคลื่อนเข้าไปจับกุม [usurper.GetHerHim] [usurper.GetSheHe] ก็ยอมให้ [usurper.GetHerselfHimself] ถูกจับไป เมื่อแผนสมคบคิดของ [usurper.GetHerHis] ล่มสลาย การทำอย่างอื่นจะเป็นการฆ่าตัวตาย"
 diarchy.9014.a:0 "ข้าจะตัดสินใจว่าจะทำอย่างไรกับ #EMP เจ้า#! ทีหลัง"

#	Intrigue: Liege won, usurper-side.
 diarchy.9015.t:0 "$diarchy.9011.t$"
 diarchy.9015.desc.intro:0 "$diarchy.9005.desc.intro$"
 diarchy.9015.desc.proxy.proxy_fought:0 "เราแข็งแกร่ง เราเป็นหนึ่งเดียว เราพร้อมสำหรับรางวัลอันชอบธรรมที่แผนการของเราจะนำมาให้เรา จนกระทั่ง [proxy.GetTitledFirstName] ที่น่าสาปแช่งนั่นก้าวออกมาเพื่อสนับสนุนเจ้าเหนือหัวที่โง่เขลาของ [proxy.GetHerHis] ข้า... ข้าไม่ได้เตรียมพร้อมสำหรับข้อโต้แย้งที่ [proxy.GetSheHe] หยิบยกขึ้นมา สำหรับช่องโหว่ที่ถูกชี้ในแผนการอันรอบคอบของข้า พวกเขาทิ้งข้าไป พวกเขาทุกคนทิ้งข้าไป"
 diarchy.9015.desc.proxy.self_fought:0 "เราบุกเข้าไปเป็นกลุ่มเดียวที่ยิ่งใหญ่ กริชในมือและพร้อมสำหรับจุดสุดยอด ข้าไม่ควรปล่อยให้ [liege.GetFirstName] พูด ข้าไม่ควรปล่อยให้ [liege.GetHerHim] พูดเลยแม้ แต่น้อย! ทุกประโยคคือข้อโต้แย้งที่ฉีกทำลายข้อแก้ตัวที่ข้าเตรียมไว้อย่างดี แต่ละประเด็นคือกริชที่แทงเข้าหัวใจของความสามัคคีของเรา ทีละคน เพื่อนร่วมชาติของข้าก็ถอยห่างออกไป"
 diarchy.9015.desc.scuffled:0 "เราบุกเข้าไปในห้องบัลลังก์ พร้อมที่จะทำสิ่งที่ต้องทำ จนกระทั่งเสียงกรีดร้องของ [liege.GetTitledFirstName] นำฝูงผู้พิทักษ์ที่เป็นไปได้เข้ามา มากกว่าที่ข้าเคยจินตนาการไว้ว่าจะอยู่ข้างเจ้าโง่นั่น คนทรยศของข้าแทบจะไม่พยายามต่อสู้เลย โยนอาวุธทิ้งทันทีที่เห็นว่าเรามีจำนวนน้อยกว่ามากเพียงใด"
 diarchy.9015.desc.outro:0 "\n\nเมื่อแผนสมคบคิดสลายไปรอบตัวข้า ข้าไม่เคลื่อนไหวเพื่อต่อต้านเมื่อทหารองครักษ์เคลื่อนเข้ามาใส่กุญแจมือข้า ข้าโชคดีที่ไม่ได้ถูกประหารชีวิตที่นี่และเดี๋ยวนี้"
 diarchy.9015.a:0 "#EMP งาน#! ทั้งหมดนั่น สูญเปล่า"

 #	Prowess: You try to slaughter your way to power.
 diarchy.9021.t:0 "$diarch_attempt_to_overthrow_liege.event.t$ ดาบที่ส่องประกาย"
 diarchy.9021.desc.intro:0 "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้องบัลลังก์ของข้า โดยมีกลุ่มทหารรับจ้าง ทหารรับจ้าง และคนทรยศในราชสำนักหนุนหลัง อาวุธชักออกมาและพร้อมที่จะสังหารผู้คนให้มากที่สุดเท่าที่จำเป็น จุดประสงค์อันนองเลือดของพวกเขาสะท้อนในดวงตา $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9021.desc.proxy.none:0 "$diarchy.9011.desc.proxy.none$"
 diarchy.9021.desc.proxy.betrayed:0 "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9021.desc.proxy.loyal:0 "ข้ามองไปที่ [proxy.GetTitledFirstName] เพื่อขอการสนับสนุน เพียงเพื่อจะเห็น [proxy.GetHerHim] เตรียมพร้อม [proxy.GetHerselfHimself] ที่จะต่อสู้เพื่อข้าแล้ว"
 diarchy.9021.a:0 "เจ้าคนชั่ว! ข้าจะฟันเจ้าลงด้วยตัวเอง!"
 diarchy.9021.a.tt.commence_duel.self:0 "ท่านจะ [single_combat_duel|E] กับ [usurper.GetShortUIName] ทันที"
 diarchy.9021.a.tt.success:0 "ท่านประหารผู้โจมตีของท่าน"
 diarchy.9021.a.tt.failure:0 "[usurper.GetSheHe|U] สังหารท่านบนพื้นห้องบัลลังก์"
 diarchy.9021.b.young:0 "$diarchy.9001.b.young$"
 diarchy.9021.b.fallback:0 "$diarchy.9001.b.fallback$"
 diarchy.9021.b.tt.commence_duel.proxy:0 "[proxy.GetShortUIName] และ [usurper.GetShortUIName] จะ [single_combat_duel|E] ทันที"
 diarchy.9021.c:0 "$diarchy.9001.c$"
 diarchy.9021.d:0 "$diarchy.9001.d$"
 diarchy.9021.d.tt.win:0 "$diarchy.9001.d.tt.win$"
 diarchy.9021.d.tt.loss:0 "$diarchy.9001.d.tt.loss$"

 #	Prowess: Usurper won, liege-side.
 diarchy.9022.t:0 "$diarchy.9021.t$"
 diarchy.9022.desc.intro:0 "$diarchy.9002.desc.intro$"
 diarchy.9022.desc.proxy.proxy_fought:0 "[proxy.GetTitledFirstName] ต่อสู้อย่างสุดความสามารถ แต่ [usurper.GetFirstName] ก็สังหาร [proxy.GetHerHim] อยู่ดี ข้า. ข้าแทบไม่อยากเชื่อว่า [proxy.GetWomanMan] เช่นนั้นจะสละชีวิต [proxy.GetHerHis] เพื่อข้าเพื่อ... #EMP ไม่มีอะไรเลย#!."
 diarchy.9022.desc.scuffled:0 "ทหารองครักษ์ของข้าหลั่งไหลเข้ามาในห้อง แต่ [usurper.GetFirstName] เลือกผู้สมรู้ร่วมคิดของ [usurper.GetHerHis] มาอย่างดี และทหารรับจ้างและทหารรับจ้างในกลุ่มของพวกเขาก็สังหารผู้พิทักษ์ของข้าทุกคนเกือบทันทีที่พวกเขามาถึง พวกเขา... พวกเขามาไม่ทัน พวกเขา #EMP ทำไม่ได้#!."
 diarchy.9022.desc.proxy.surrendered:0 "แม้ข้าจะคัดค้าน ทหารองครักษ์และทหารรับจ้างไม่กี่คนพยายามต่อต้านกองกำลังของ [usurper.GetFirstNamePossessive] แต่พวกเขาก็ถูกสังหารทีละน้อย ด้วยเสียงดัง ทหารองครักษ์ประจำบ้านของข้าจำนวนมากรีบไปที่ห้องบัลลังก์ เพียงเพื่อจะลังเลเมื่อเห็นสิ่งที่เกิดขึ้น"
 diarchy.9022.desc.outro:0 "\n\nไม่เหลือเวลาให้ข้ามีทางเลือกอื่น ผู้ชิงบัลลังก์ก้าวย่างเข้ามาหาข้า [usurper.Custom('signature_weapon')] ยังคงชุ่มโชกไปด้วยเลือด นี่คือจุดจบ"
 diarchy.9022.desc.outro.surrendered:0 "\n\nความหวังสุดท้ายของข้าดับสิ้นเมื่อทหารที่สาบานตนคนแรกของข้าคุกเข่าต่อ [usurper.GetTitleAsName] คนใหม่\n\nมันจบแล้ว"
 diarchy.9022.a:0 "เจ้าจะตรงไปยัง [liege.GetFaith.random_NegativeAfterLife] เพราะเรื่องนี้ [usurper.GetFirstNameNoTooltip]"
 diarchy.9022.b:0 "$diarchy.9002.b$"

 #	Prowess: Usurper won, usurper-side.
 diarchy.9023.t:0 "$diarchy.9021.t$"
 diarchy.9023.desc.intro:0 "$diarchy.9003.desc.intro$"
 diarchy.9023.desc.proxy.proxy_fought:0 "ศพของ [proxy.GetTitledFirstNamePossessive] ทรุดลงข้างๆ ความรุนแรงต้องตอบโต้ด้วยความรุนแรง และ [liege.GetFirstName] เลือกเส้นทางของ [liege.GetHerHis]\n\nขณะที่ [usurper.GetTitleAsNameNoTooltip] ยังคงตกตะลึงกับการตายของแชมเปี้ยนของ [liege.GetHerHis] ข้าก้าวไปข้างหน้าและ [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] ของข้าเข้าที่คอของ [liege.GetHerHis]\n\nความตายนั้นไม่เร็วที่สุด แต่ก็ไม่ช้า ราชสำนักและข้ามองดู [liege.GetHerHim] ตายโดยไม่มีความเห็นใดๆ และข้าก็เหวี่ยง [liege.GetHerHim] ออกจากบัลลังก์"
 diarchy.9023.desc.proxy.self_fought:0 "ด้วยอำนาจของข้าที่มั่นคงและอดีต-[usurper.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip] ตายด้วยน้ำมือข้า จึงแทบไม่มีการต่อต้านอื่นใดต่อการที่ข้าจะนั่งในตำแหน่งอันชอบธรรมของข้า เว้น แต่เสียงกระแอมกระไออย่างอึดอัดเล็กน้อยจากราชสำนักที่รวมตัวกัน"
 diarchy.9023.desc.surrendered:0 "น่าประหลาดใจที่ [liege.GetFirstName] ยอมจำนน ข้าคาดว่าจะต้องฆ่า [liege.GetHerHim] แต่ดูเหมือนว่า [liege.GetSheHe] ให้ความสำคัญกับมงกุฎของ [liege.GetHerHis] มากกว่าชีวิตของ [liege.GetHerHis]\n\nกลุ่มผู้ติดตามส่วนใหญ่ของข้าเยาะเย้ยขณะที่อดีต-[usurper.GetTitleAsNameNoTooltip] ถูกลากผ่านหน้าพวกเขา ถูกโยนออกจากห้องบัลลังก์เพื่อเปิดทางให้ #EMP ข้า#!.\n\nเอาล่ะ ถึงแม้จะไม่ได้คาดคิด การสละราชสมบัติโดยสมัครใจก็ใช้ได้สำหรับข้า เช่นกัน มัน... ถูกต้องตามกฎหมายมากกว่า"
 diarchy.9023.desc.scuffled:0 "ตามคาด [liege.GetFirstName] เรียกทหารองครักษ์ทันทีที่เราบุกเข้าไปในห้องบัลลังก์ โชคไม่ดีสำหรับคนโง่เขลาที่เข้าเวร ข้าคือ [usurper.GetWomanMan] ที่วางแผนล่วงหน้า และกลุ่มผู้ติดตามของข้าก็บุกไปข้างหน้าและสังหารผู้มาใหม่อย่างง่ายดาย\n\nขณะที่ทหารของข้าชนะการปะทะ ข้าก็บุกเข้าไปหา [liege.GetFirstNameNoTooltip] ที่ยังคงกรีดร้องอยู่และ [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] ของข้าเข้าที่คอของ [liege.GetHerHis]\n\nความตายยุติการต่อสู้ที่เหลืออย่างรวดเร็ว ประกาศโดยเสียงที่ข้าเหวี่ยงอดีตเจ้าเหนือหัวของข้าออกจากบัลลังก์"
 diarchy.9023.desc.outro:0 "\n\nซากศพของ [liege.GetFirstNamePossessiveNoTooltip] ที่เย็นลงบนพื้นห้องบัลลังก์อาจเป็นวิธีที่ไม่เหมาะสมในการเริ่มต้นรัชสมัยของข้า แต่มันจำเป็น และท้ายที่สุดก็นองเลือดน้อยกว่าสงครามกลางเมืองมาก\n\nข้าหวังว่าอาณาจักรจะมองเห็น เช่นนั้น"
 diarchy.9023.a:0 "การตายเพียงหยิบมือที่นี่จะช่วยชีวิตผู้คนทั่วทั้ง [usurper.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 diarchy.9023.a.liege_survives:0 "เริ่มต้นรัชสมัยของข้าด้วยความเมตตากรุณา"

 #	Prowess: Liege won, liege-side.
 diarchy.9024.t:0 "$diarchy.9021.t$"
 diarchy.9024.desc.proxy.proxy_fought:0 "น่าเศร้าที่ข้าอยู่ไกลจาก [usurper.GetTitledFirstName] เกินไปเล็กน้อยที่จะได้ยินคำสาปแช่งก่อนตายของ [usurper.GetHerHis] แต่ข้าก็มีความสุขที่ได้เห็น [usurper.GetHerHim] สิ้นใจ\n\n[proxy.GetTitledFirstName] ต่อสู้อย่างดีในการรับใช้ข้า สังหารคนทรยศที่แทบเท้าบัลลังก์ของข้าด้วยความง่ายดายราวกับดูถูก การกระทำนั้น ทำให้ทหารองครักษ์ของข้ามีความมุ่งมั่นและทำลายกลุ่มผู้สมรู้ร่วมคิด และสิ่งที่ตามมาคือการนองเลือดอย่างสิ้นหวังสองสามนาทีขณะที่กบฏถูกสังหาร"
 diarchy.9024.desc.proxy.self_fought:0 "ศพของ [usurper.GetTitledFirstNamePossessive] แหลกสลายอยู่ตรงหน้าข้า ถูกสังหารด้วยมือข้าเอง\n\nด้วยความตื่นตระหนกอย่างบ้าคลั่ง กลุ่มผู้สมรู้ร่วมคิดแตกสลายและพยายามหลบหนี แต่ทหารองครักษ์ของข้าเองก็ได้รับกำลังใจจากความสำเร็จของข้าและบุกเข้าไปท่ามกลางพวกเขา สิ่งที่ตามมาคือการนองเลือดอย่างสิ้นหวังสองสามนาที กบฏถูกสังหารทีละคน"
 diarchy.9024.desc.scuffled:1 "โชคดีที่เสียงร้องขอความช่วยเหลืออย่างรวดเร็วของข้านำ #EMP ฝูงชน#! ที่แท้จริงของกองทหารและทหารรับจ้างผู้ภักดีจากห้องใกล้เคียงมา แม้ว่ากลุ่มคนทรยศของ [usurper.GetTitledFirstNamePossessive] จะต่อสู้อย่างดี แต่ในไม่ช้าพวกเขาก็ถูกครอบงำ\n\nข้ามองดู [usurper.GetFirstNameNoTooltip] ตาย เป็นหนึ่งในคนสุดท้าย ความตื่นตระหนกใน [usurper.Custom('EyeEyes')] ของ [usurper.GetHerHis] ขณะที่เหล็กกล้าส่องประกายรอบตัว [usurper.GetHerHim] จากนั้นก็เข้าสู่ [usurper.GetHerHim] จากนั้นก็ทะลุผ่าน [usurper.GetHerHim]\n\nนี่คือราคาของการทรยศ"
 diarchy.9024.desc.outro:0 "\n\nข้าคาดว่าข่าวจะแพร่กระจายไปทั่วส่วนที่เหลือของ [liege.GetPrimaryTitle.GetTierAsName] ในไม่ช้า และหวังว่านี่จะเป็นบทเรียนสำหรับผู้ที่คิดจะชิงบัลลังก์ในอนาคต"
 diarchy.9024.a:0 "ถูกกำจัดเหมือนหมาขี้เรื้อนที่ [usurper.GetSheHe] เป็น"

 #	Prowess: Liege won, usurper-side.
 diarchy.9025.t:0 "$diarchy.9021.t$"
 diarchy.9025.desc:0 "เกือบทันทีที่เราบุกเข้าไปในห้องบัลลังก์ เสียงกรีดร้องด้วยความตื่นตระหนกจาก [liege.GetTitledFirstName] ก็นำกระแสธารของอัศวินติดอาวุธเข้ามาในห้อง กระตือรือร้นที่จะตายเพื่อ [liege.Custom('MistressMaster')] ของพวกเขา\n\nกลุ่มผู้ติดตามข้าและข้าฟันฝ่าฝูงชนที่กำลังจะกลายเป็นซากศพให้ดีที่สุดเท่าที่จะทำได้ แต่มีจำนวนมากเกินไป เราต้องถอย เราต้องกลับไป — โดย [usurper.GetFaith.FateGodName] พวกเขาอยู่ข้างหลังเราด้วย ไม่มี... ไม่มีทางออก\n\nไม่ ไม่ #EMP ไม่!#! วางแผนมากมาย พยายามมากมาย ทั้งหมดสูญเปล่า!"
 diarchy.9025.a:0 "มันไม่ควรจะจบลงแบบนี้-#BER อ๊ากกกก!#!"

 ##################################################
 # #Vizierate Events
 vizierate.1001.t: "[propositioner.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 vizierate.1001.desc.intro: "ท่านต้องเห็นด้วยว่า [vizier.GetFirstName] กำลังพิสูจน์ตัวเองว่าเป็นวิเซียร์ที่แย่มาก — เป็นความเสื่อมเสียที่ทุจริตอย่างสิ้นเชิงต่อตำแหน่ง แต่ข้าได้ใช้เวลาและเงินจำนวนมากในการเตรียมแผนการที่จะ"
 vizierate.1001.desc.diplomacy: "นำผู้สนับสนุนหลักและสายลับที่ดีที่สุดของ [vizier.GetHerHis] มาอยู่ข้างข้า"
 vizierate.1001.desc.stewardship: "แทรกซึมผลประโยชน์ทางธุรกิจของ [vizier.GetHerHis] และติดสินบนทหารองครักษ์ของ [vizier.GetHerHis]"
