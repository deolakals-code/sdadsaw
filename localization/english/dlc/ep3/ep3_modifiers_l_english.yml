 ep3_life_threatened_modifier: "ชีวิตถูกคุกคาม"
 ep3_life_threatened_modifier_desc: "ตัวละครนี้ไม่ได้คิด พวกเขา #EMP รู้#! ว่ามีคนอื่นต้องการทำร้ายพวกเขา ข้าในบังคับของพวกเขาไม่ประทับใจกับความกังวล เช่นนั้น\n\n#weak [modifier|E] นี้เพิ่มโอกาสที่ข้าในบังคับจะเข้าร่วม [claimant_factions|E]\n#!"

