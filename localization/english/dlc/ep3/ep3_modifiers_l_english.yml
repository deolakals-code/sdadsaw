l_english: 

 ep3_restored_pentarchy_seat_county_modifier: "ฟื้นฟูมุขมณฑลเอก"
 ep3_restored_pentarchy_seat_county_modifier_desc: "เคาน์ตี้นี้ได้กลับมาเป็นมุขมณฑลเอกแห่งเบญจาธิปไตยอีกครั้ง"
 ep3_restored_pentarchy_seat_modifier: "$ep3_restored_pentarchy_seat_county_modifier$"
 ep3_restored_pentarchy_seat_modifier_desc: "ตัวละครนี้ได้พิชิตมุขมณฑลเอกแห่งเบญจาธิปไตยกลับคืนสู่อาณาจักร"
 ep3_maximum_border_county_modifier: "ฟื้นฟูพรมแดนสุดท้าย"
 ep3_maximum_border_county_modifier_desc: "พรมแดนที่ไกลที่สุดของจักรวรรดิโรมันได้รับการสถาปนาขึ้นใหม่แล้ว"
 ep3_maximum_border_modifier: "$ep3_maximum_border_county_modifier$"
 ep3_maximum_border_modifier_desc: "ตัวละครนี้ได้ฟื้นฟูพรมแดนที่ไกลที่สุดของจักรวรรดิโรมัน"
 ep3_new_justinian_county_modifier: "ฟื้นฟูมณฑลแห่งจัสติเนียน"
 ep3_new_justinian_county_modifier_desc: "เคาน์ตี้นี้ ซึ่งครั้งหนึ่งเคยถูกพิชิตโดยกองทัพของจัสติเนียน ได้กลับคืนสู่อ้อมอกของจักรวรรดิโรมันอีกครั้ง"
 ep3_new_justinian_modifier: "$ep3_new_justinian_county_modifier$"
 ep3_new_justinian_modifier_desc: "ตัวละครนี้คือจัสติเนียนองค์ใหม่ ผู้พิชิตมณฑลตะวันตกกลับคืนมา"
 ep3_western_tetrarch_county_modifier: "ฟื้นฟูศูนย์อำนาจจตุราธิปไตยตะวันตก"
 ep3_western_tetrarch_county_modifier_desc: "ศูนย์อำนาจโบราณของจตุราธิปไตยโรมันตะวันตกได้ถูกพิชิตกลับคืนโดยจักรวรรดิโรมัน"
 ep3_western_tetrarch_modifier: "$ep3_western_tetrarch_county_modifier$"
 ep3_western_tetrarch_modifier_desc: "ตัวละครนี้ได้รวมศูนย์อำนาจโบราณของจตุราธิปไตยโรมันตะวันตกกลับคืนสู่จักรวรรดิโรมัน"
 ep3_long_lost_province_county_modifier: "ฟื้นฟูมณฑลที่สาบสูญไปนาน"
 ep3_long_lost_province_county_modifier_desc: "ดินแดนนี้ ซึ่งสาบสูญไปจากชาวโรมันเป็นเวลานาน ได้กลับคืนสู่อาณาจักรแล้ว"
 ep3_long_lost_province_modifier: "$ep3_long_lost_province_county_modifier$"
 ep3_long_lost_province_modifier_desc: "ตัวละครนี้ได้พิชิตมณฑลโรมันที่สาบสูญไปจากอาณาจักรเป็นเวลานานกลับคืนมา"
 ep3_long_contested_province_county_modifier: "ฟื้นฟูมณฑลที่แย่งชิงกันมานาน"
 ep3_long_contested_province_county_modifier_desc: "เคาน์ตี้นี้ ซึ่งอยู่นอกเหนือการเข้าถึงของอาณาจักรมานานเกินไป ได้ถูกพิชิตกลับคืนมาแล้ว"
 ep3_long_contested_province_modifier: "$ep3_long_contested_province_county_modifier$"
 ep3_long_contested_province_modifier_desc: "ตัวละครนี้ได้เสริมสร้างความมั่นคงให้พรมแดนของอาณาจักรโดยการพิชิตดินแดนที่แย่งชิงกันมานานกลับคืนมา"
 ep3_medi_gem_county_modifier: "ฟื้นฟูอัญมณีแห่งเมดิเตอร์เรเนียน"
 ep3_medi_gem_county_modifier_desc: "ฐานที่มั่นอันล้ำค่าในทะเลเมดิเตอร์เรเนียนนี้ได้กลับมาเป็นส่วนหนึ่งของอาณาจักรอีกครั้ง"
 ep3_medi_gem_modifier: "$ep3_medi_gem_county_modifier$"
 ep3_medi_gem_modifier_desc: "ตัวละครนี้ได้ยึดครองฐานที่มั่นโรมันโบราณในทะเลเมดิเตอร์เรเนียน"
 ep3_politics_before_all_modifier: "การเมืองมาก่อนสิ่งอื่นใด"
 ep3_politics_before_all_modifier_desc: "ตัวละครนี้มีแนวทางปฏิบัติต่อการเมืองที่ไม่คำนึงถึงความรู้สึกหรืออคติทางวัฒนธรรม"
 ep3_everything_for_byz_modifier: "เสียสละเพื่อประชาชนของเรา"
 ep3_everything_for_byz_modifier_desc: "ตัวละครนี้ยอมทนต่อ #EMP พวกอนารยชน#! เพื่อประโยชน์สุขของประชาชน"
 ep3_triumph_of_god_modifier: "ชัยชนะร่วมกับพระเจ้า"
 ep3_triumph_of_god_modifier_desc: "ตัวละครนี้ได้อุทิศชัยชนะของตนแด่พระเจ้า โดยมีส่วนร่วมในเกียรติยศนั้นอย่างเท่าเทียม"
 ep3_blessed_in_triumph_modifier: "ได้รับพรในชัยชนะ"
 ep3_triumph_traditional_punishments_modifier: "รักษาการลงโทษตามประเพณี"
 ep3_triumph_traditional_punishments_modifier_desc: "การควักลูกตาศัตรูที่จับได้ กบฏ และคู่แข่งชิงบัลลังก์ เป็นธรรมเนียมปฏิบัติของไบแซนไทน์ที่มีมานาน ดังที่ตัวละครนี้ทราบดี"
 ep3_blessed_in_triumph_modifier_desc: "ชัยชนะของตัวละครนี้ได้รับการประสาทพรจากผู้นำทางศาสนา"
 ep3_triumph_public_executioner_modifier: "จัดการประหารชีวิตในที่สาธารณะ"
 ep3_triumph_public_executioner_modifier_desc: "ตัวละครนี้รู้วิธีรักษาความสงบเรียบร้อยของประชาชน: โดยการ ทำให้การประหารหมู่เป็นที่ประจักษ์"
 ep3_triumph_promised_victories_modifier: "สัญญาแห่งชัยชนะ"
 ep3_triumph_promised_victories_modifier_desc: "ตัวละครนี้ได้กระตุ้นจินตนาการของไพร่ฟ้าข้าแผ่นดินด้วยคำสัญญาถึงชัยชนะทางทหาร"
 ep3_triumph_promised_stability_modifier: "สัญญาแห่งความมั่นคง"
 ep3_triumph_promised_stability_modifier_desc: "ตัวละครนี้ได้กระตุ้นจินตนาการของไพร่ฟ้าข้าแผ่นดินด้วยคำสัญญาถึงความมั่นคงของอาณาจักร"
 ep3_triumph_promised_prosperity_modifier: "สัญญาแห่งความเจริญรุ่งเรือง"
 ep3_triumph_promised_prosperity_modifier_desc: "ตัวละครนี้ได้กระตุ้นจินตนาการของไพร่ฟ้าข้าแผ่นดินด้วยคำสัญญาถึงความเจริญรุ่งเรืองของอาณาจักร"
 ep3_voluntary_laamp_character_modifier: "นักผจญภัยโดยสมัครใจ"
 ep3_voluntary_laamp_character_modifier_desc: "ตัวละครนี้ได้ละทิ้งอาณาจักรเดิมเพื่อแสวงหาที่ทางใหม่ในโลก"
 ep3_emperor_proving_themselves_modifier: "พิสูจน์คุณค่าของตน"
 ep3_emperor_proving_themselves_modifier_desc: "ตัวละครนี้ได้ปฏิญาณว่าจะพิสูจน์คุณค่าของตนในฐานะผู้ปกครองที่ชอบธรรม"
 ep3_blessed_union_modifier: "การสมรสอันศักดิ์สิทธิ์"
 ep3_blessed_union_modifier_desc: "ประมุขแห่งศรัทธาของตัวละครนี้อนุมัติการ แต่งงานครั้งล่าสุดของตัวละครนี้"
 ep3_non_blessed_union_modifier: "การสมรสที่ไม่ชอบธรรม"
 ep3_non_blessed_union_modifier_desc: "ประมุขแห่งศรัทธาของตัวละครนี้ปฏิเสธที่จะรับรองการ แต่งงานครั้งล่าสุดของตัวละครนี้ให้ถูกต้องตามกฎหมาย"
 ep3_ennobled_adventurer_modifier_1: "นักผจญภัยผู้ได้รับบรรดาศักดิ์"
 ep3_ennobled_adventurer_modifier_1_desc: "ตัวละครนี้ได้รับการเลื่อนสถานะสู่ชนชั้นสูงจากต้นกำเนิดอันต่ำต้อย ซึ่งเป็นการบ่อนทำลายลำดับชั้นทางสังคมที่มีมา แต่โบราณ"
 ep3_ennobled_adventurer_modifier_2: "$ep3_ennobled_adventurer_modifier_1$"
 ep3_ennobled_adventurer_modifier_2_desc: "$ep3_ennobled_adventurer_modifier_1_desc$"
 ep3_ennobled_adventurer_modifier_3: "$ep3_ennobled_adventurer_modifier_1$"
 ep3_ennobled_adventurer_modifier_3_desc: "$ep3_ennobled_adventurer_modifier_1_desc$"
 ep3_century_celebration_county_modifier: "การเฉลิมฉลองครบรอบศตวรรษทางประวัติศาสตร์"
 ep3_century_celebration_county_modifier_desc: "เคาน์ตี้นี้กำลังเฉลิมฉลองครบรอบหนึ่งศตวรรษของการก่อตั้งกรุงคอนสแตนติโนเปิล"
 ep3_foundation_celebration_county_modifier: "การเฉลิมฉลองทางประวัติศาสตร์"
 ep3_foundation_celebration_county_modifier_desc: "เคาน์ตี้นี้กำลังเฉลิมฉลองครบรอบการก่อตั้งกรุงคอนสแตนติโนเปิล"
 ep3_exotic_giraffe_modifier: "ยีราฟแปลกตา"
 ep3_exotic_giraffe_modifier_desc: "ตัวละครนี้ได้รับสินค้าและสัตว์แปลกตา – รวมถึงยีราฟ – จากคณะทูต"
 ep3_estate_hired_agents_modifier: "จ้างวานสายลับ"
 ep3_estate_hired_agents_modifier_desc: "ตัวละครนี้ได้จ้างวานสายลับจำนวนหนึ่งเพื่อช่วยให้บรรลุเป้าหมาย"
 ep3_estate_bolster_security_modifier: "หน่วยรักษาความปลอดภัย"
 ep3_estate_bolster_security_modifier_desc: "ตัวละครนี้ได้ล้อมรอบตัวเองและคฤหาสน์ด้วยองครักษ์จำนวนมากในความพยายามที่จะรักษาความปลอดภัยจากอันตราย"
 ep3_estate_governor_patrols_modifier: "การลาดตระเวนเป็นประจำ"
 ep3_estate_governor_patrols_modifier_desc: "ผู้ว่าการของเคาน์ตี้นี้ได้จัดให้มีการลาดตระเวนเป็นประจำภายในพื้นที่ พร้อมที่จะเข้าแทรกแซงได้ทันที"
 ep3_estate_granary_modifier: "ปั่นป่วนตลาดธัญพืช"
 ep3_estate_granary_modifier_desc: "ตัวละครนี้กำลังใช้วิธีการที่น่าสงสัยเพื่อปั่นป่วนตลาดธัญพืช โดยขายธัญพืชในราคา #EMP ขูดรีด#!"
 ep3_eparch_county_opinion_modifier: "เอาใจพลเมือง"
 ep3_eparch_county_opinion_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] กำลังทำงานอย่างหนักเพื่อเอาใจพลเมือง"
 ep3_eparch_troops_modifier: "จัดระเบียบกองทหาร"
 ep3_eparch_troops_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] กำลังดูแลกองทหารที่ประจำการอยู่ในเมืองหลวงด้วยตนเอง"
 ep3_eparch_control_modifier: "บังคับใช้ความสงบเรียบร้อยของประชาชน"
 ep3_eparch_control_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] มีทหารเดินขบวนไปตามถนนในเมืองหลวง เพื่อให้แน่ใจว่ามีความสงบเรียบร้อยของประชาชน"
 ep3_eparch_development_modifier: "ส่งเสริมการพัฒนา"
 ep3_eparch_development_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] มีกองทัพข้าราชการและเสมียนวิ่งวุ่นไปทั่วเมืองเพื่อปรับปรุงโครงสร้างพื้นฐานและพัฒนาเมือง"
 ep3_eparch_fortified_capital_modifier: "ป้อมปราการอันน่าประทับใจ"
 ep3_eparch_fortified_capital_modifier_desc: "ที่ดินผืนนี้อยู่ในมือของผู้มีความสามารถและมีป้อมปราการที่น่าประทับใจ ซึ่งแน่นอนว่าจะสามารถต้านทานผู้โจมตีใดๆ ได้"
 ep3_eparch_somewhat_fortified_capital_modifier: "ปรับปรุงป้อมปราการ"
 ep3_eparch_somewhat_fortified_capital_modifier_desc: "ผู้บริหารที่ดินผืนนี้ได้ทำการปรับปรุงการป้องกันโดยทั่วไปบางประการ"
 ep3_eparch_plague_protection_modifier: "จัดระเบียบแพทย์"
 ep3_eparch_plague_protection_modifier_desc: "[GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] ได้จัดระเบียบแพทย์ที่มีอยู่ทั้งหมดในที่ดินผืนนี้ให้เป็นกำลังคนที่มีประสิทธิภาพ"
 ep3_eparch_physician_at_work_modifier: "หัวหน้าแพทย์ต่อสู้กับโรคระบาด"
 ep3_eparch_physician_at_work_modifier_desc: "[GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()] ส่วนตัวของ [GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] กำลังต่อสู้กับโรคระบาดและช่วยเหลือผู้ป่วย"
 ep3_eparch_university_influence_modifier: "เส้นสายในมหาวิทยาลัย"
 ep3_eparch_university_influence_modifier_desc: "ตระกูลนี้ได้สร้างสายสัมพันธ์ที่มีอิทธิพลในมหาวิทยาลัยของเมืองหลวง\n#high ค่าใช้จ่ายตัวเลือกการศึกษา ส่งไปมหาวิทยาลัย#!: [gold_i]#P -[EmptyScope.ScriptValue('university_cost_reduction_value')|%0]#!"
 scheme_slandered_modifier: "ถูกใส่ร้าย"
 scheme_slandered_modifier_desc: "ชื่อเสียงสาธารณะของตัวละครนี้ ความน่าเชื่อถือสำหรับตำแหน่ง ถูกทำลายโดยกระแสการใส่ร้ายป้ายสี\n$EFFECT_LIST_BULLET$ $scheme_slandered_candidacy_appointment_tt$\n$EFFECT_LIST_BULLET$ $scheme_slandered_candidacy_acclamation_tt$\n$EFFECT_LIST_BULLET$ [governor_efficiency|E]: [governor_efficiency_i]#N [EmptyScope.ScriptValue('efficiency_slandered_value')|0]%#!"
 scheme_promoted_modifier: "ได้รับการส่งเสริม"
 scheme_promoted_modifier_desc: "การลงสมัครรับเลือกตั้งของตัวละครนี้ได้รับการผลักดันไปข้างหน้าโดยแคมเปญส่งเสริมที่ประสบความสำเร็จ\n$EFFECT_LIST_BULLET$ $scheme_promoted_candidacy_appointment_tt$\n$EFFECT_LIST_BULLET$ $scheme_promoted_candidacy_acclamation_tt$"
 admin_emperor_scheme_modifier: "จักรพรรดินักปกครอง"
 admin_dominant_family_scheme_modifier: "$game_concept_dominant_family$"
 admin_powerful_family_scheme_modifier: "$game_concept_powerful_family$"
 admin_target_emperor_scheme_modifier: "จักรพรรดินักปกครอง"
 admin_target_dominant_family_scheme_modifier: "$game_concept_dominant_family$"
 admin_target_powerful_family_scheme_modifier: "$game_concept_powerful_family$"
 ep3_school_building_county_modifier: "กำลังสร้างโรงเรียน"
 ep3_school_building_county_modifier_desc: "ผู้ปกครองของเคาน์ตี้นี้ได้เบี่ยงเบนการผลิตบางส่วนไปยังโรงเรียนสำหรับสามัญชน"
 ep3_grammar_school_county_modifier: "โรงเรียนเพื่อประชาชน"
 ep3_grammar_school_county_modifier_desc: "ผู้ปกครองของเคาน์ตี้นี้ได้ลงทุนในโรงเรียนสำหรับสามัญชน"
 defender_of_values_modifier: "ผู้พิทักษ์ค่านิยมของเรา"
 defender_of_values_modifier_desc: "ตัวละครนี้ได้ปฏิเสธอิทธิพลอันเสื่อมทรามของขนบธรรมเนียมอันหรูหราจากชาวกรีกที่เสื่อมโทรม"
 ep3_mercenaries_abroad_modifier: "สัญญาว่าจะส่งกองทหารไปต่างแดน"
 ep3_mercenaries_abroad_modifier_desc: "ตัวละครนี้สัญญาว่าจะส่งกองทหารของตนไปให้ผู้ปกครองคนอื่นเพื่อแลกกับอิสรภาพของตน"
 ep3_mercenaries_from_abroad_modifier: "กองทหารจากต่างแดน"
 ep3_mercenaries_from_abroad_modifier_desc: "ตัวละครนี้กำลังได้รับกองทหารจากผู้ปกครองคนอื่นที่ตนปล่อยออกจากคุก"
 ep3_bought_the_purple_modifier: "ซื้อสีม่วง"
 ep3_bought_the_purple_modifier_desc: "ตัวละครนี้ได้ซื้อสิทธิ์ในการสวมเสื้อผ้าสีม่วง ซึ่งเป็นสิทธิ์ที่โดยปกติแล้วสงวนไว้สำหรับจักรพรรดิเท่านั้น"
 ep3_development_sacrifice_modifier: "การเสียสละของจักรวรรดิ"
 ep3_development_sacrifice_modifier_desc: "เคาน์ตี้นี้ถูกบังคับให้ส่งกำลังคนไปยังเมืองหลวง"
 ep3_development_waning_modifier: "ความตึงเครียดของจักรวรรดิ"
 ep3_development_waning_modifier_desc: "เมืองหลวงของจักรวรรดิกำลังตึงเครียดภายใต้ภาระแห่งโชคร้าย"

 ep3_leviathan_success_character_modifier: "ปราบอสูรร้าย"
 ep3_leviathan_success_character_modifier_desc: "ตัวละครนี้ได้สังหารอสูรร้ายที่กำลังทำลายล้างช่องแคบบอสพอรัส"
 ep3_leviathan_failure_character_modifier: "พ่ายแพ้ต่ออสูรร้าย"
 ep3_leviathan_failure_character_modifier_desc: "ความพยายามของตัวละครนี้ในการกำจัดอสูรร้ายที่ทำลายล้างช่องแคบบอสพอรัสผิดพลาดอย่างมหันต์"
 ep3_leviathan_loose_county_modifier: "หายนะแห่งช่องแคบ"
 ep3_leviathan_loose_county_modifier_desc: "การค้าของเคาน์ตี้นี้เป็นอัมพาต เพราะอสูรร้ายที่ทำลายล้างช่องแคบบอสพอรัส"
 ep3_leviathan_mandate_county_modifier: "เงาแห่งช่องแคบ"
 ep3_leviathan_mandate_county_modifier_desc: "การค้าของเคาน์ตี้นี้ถูกขัดขวางบ้างเล็กน้อยโดยอสูรร้ายที่ทำลายล้างช่องแคบบอสพอรัส"
 ep3_leviathan_loose_province_modifier: "หายนะแห่งช่องแคบ"
 ep3_leviathan_loose_province_modifier_desc: "ทางน้ำนี้เต็มไปด้วยอันตรายจากอสูรร้ายที่ทำลายล้างช่องแคบบอสพอรัส"
 ep3_leviathan_mandate_province_modifier: "เงาแห่งช่องแคบ"
 ep3_leviathan_mandate_province_modifier_desc: "ทางน้ำนี้ค่อนข้างอันตรายจากอสูรร้ายที่ทำลายล้างช่องแคบบอสพอรัส"

 ep3_iconoclast_modifier: "ผู้ทำลายรูปเคารพ"
 ep3_iconoclast_modifier_desc: "จักรพรรดิองค์นี้ยอมรับหลักคำสอนเรื่องการทำลายรูปเคารพเมื่อเผชิญกับความยากลำบากอย่างใหญ่หลวง"

 ep3_raider_unchecked_modifier: "การปล้นสะดมที่ไม่ถูกตรวจสอบ"
 ep3_raider_unchecked_modifier_desc: "เคาน์ตี้นี้ถูกรุมเร้าโดยผู้บุกรุกจากทางเหนือ ทำลายการขนส่งทางเรือและปล้นสะดมชายฝั่ง"

 ep3_grave_robber_modifier: "โจรปล้นสุสาน"
 ep3_grave_robber_modifier_desc: "ตัวละครนี้มีชื่อเสียงในทางลบจากการปล้นสุสานของจักรพรรดิองค์ก่อนๆ เพื่อนำไปชำระหนี้สิน"
 ep3_imperial_tombs_violated_province_modifier: "สุสานหลวงถูกละเมิด"
 ep3_imperial_tombs_violated_province_modifier_desc: "สุสานอันรุ่งโรจน์ของจักรพรรดิในอดีตถูกปล้นโดยผู้สืบทอดที่ละโมบเพื่อนำไปชำระหนี้สิน"
 land_of_holy_county_modifier: "ดินแดนแห่งนักบุญ"
 land_of_holy_county_modifier_desc: "นักบุญที่แท้จริงเดินอยู่ท่ามกลางผู้คนเหล่านี้"
 no_crooks_county_modifier: "ไม่ทนต่อคนคดโกง"
 no_crooks_county_modifier_desc: "ผู้ว่าการท้องถิ่นได้บังคับใช้นโยบายไม่ยอมผ่อนปรนต่อคนคดโกงที่แสร้งทำเป็นนักบุญ"
 ep3_persecuting_saints_county_modifier: "นักบุญที่ไม่ได้รับการยอมรับ"
 ep3_persecuting_saints_county_modifier_desc: "ผู้ว่าการท้องถิ่นล้มเหลวในการรับรู้สัญญาณของนักบุญที่แท้จริง"
 ep3_conmen_among_us_county_modifier: "คนหลอกลวงท่ามกลางพวกเรา"
 ep3_conmen_among_us_county_modifier_desc: "ผู้ว่าการท้องถิ่นปล่อยให้คนคดโกงยังคงแสร้งทำเป็นนักบุญต่อไป"
 ep3_settling_nomads_county_modifier: "การตั้งถิ่นฐานของชนเผ่าเร่ร่อน"
 ep3_settling_nomads_county_modifier_desc: "เคาน์ตี้นี้กำลังรับผู้คนเร่ร่อนจากข้ามพรมแดนเข้ามาอย่างช้าๆ"
 ep3_tunnels_encouraged_county_modifier: "อุโมงค์ป้องกัน"
 ep3_tunnels_encouraged_county_modifier_desc: "ผู้ว่าการได้ส่งเสริมการขยายเครือข่ายอุโมงค์และที่หลบภัยลับในท้องถิ่นเพื่อปกป้องประชากร"
 ep3_population_control_county_modifier: "ทุกอย่างเปิดเผย"
 ep3_population_control_county_modifier_desc: "ผู้ว่าการกำลังดำเนินการปราบปรามและยุบเครือข่ายอุโมงค์และที่หลบภัยลับในท้องถิ่นอย่างแข็งขัน"
 ep3_bolstered_governor_treasury_modifier: "คลังที่มั่นคง"
 ep3_bolstered_governor_treasury_modifier_desc: "ตัวละครนี้ให้ความสำคัญกับการปกครองที่ดีของมณฑลมากกว่าความร่ำรวยของตนเอง\n[governor_efficiency|E]: @governor_efficiency!#P +5%#!"
 ep3_governor_yearly_8030_stifled_modifier: "กิจกรรมที่ถูกขัดขวาง"
 ep3_governor_yearly_8030_stifled_modifier_desc: "การหลั่งไหลเข้ามาของช่างฝีมือโดยธรรมชาติสู่คฤหาสน์ของตระกูลในเคาน์ตี้นี้ถูกขัดขวาง"
 ep3_governor_yearly_8030_benign_modifier: "การพัฒนาที่ไม่เป็นภัย"
 ep3_governor_yearly_8030_benign_modifier_desc: "เคาน์ตี้นี้ได้เห็นการหลั่งไหลเข้ามาของช่างฝีมือที่กำลังมองหางานในคฤหาสน์ของตระกูล"
 ep3_governor_yearly_8030_benign_char_modifier: "การพัฒนาที่ไม่เป็นภัย"
 ep3_governor_yearly_8030_benign_char_modifier_desc: "เคาน์ตีที่เป็นที่ตั้งคฤหาสน์ของตัวละครนี้ได้เห็นการหลั่งไหลเข้ามาของช่างฝีมือที่กำลังมองหางาน"
 ep3_governor_yearly_8070_ignore_modifier: "ละเลยงาน"
 ep3_governor_yearly_8070_ignore_modifier_desc: "ตัวละครนี้กำลังละเลยความรับผิดชอบในฐานะผู้ว่าการ"

 ep3_governor_yearly_8080_tense_bureaucracy_modifier: "ระบบราชการที่ตึงเครียด"
 ep3_governor_yearly_8080_tense_bureaucracy_modifier_desc: "การลงโทษข้าราชการที่ทุจริตของตัวละครนี้ ทำให้มวลชนพอใจ แต่ไม่ใช่ระบบราชการ"
 ep3_governor_yearly_8080_jumpy_bureaucracy_modifier: "ระบบราชการที่หวาดระแวง"
 ep3_governor_yearly_8080_jumpy_bureaucracy_modifier_desc: "การลงโทษข้าราชการที่ทุจริตของตัวละครนี้ ทำให้มวลชนพอใจ แต่ไม่ใช่ระบบราชการ"
 ep3_governor_yearly_8080_corrupt_bureaucracy_modifier: "ระบบราชการที่ทุจริต"
 ep3_governor_yearly_8080_corrupt_bureaucracy_modifier_desc: "ความล้มเหลวของตัวละครนี้ในการลงโทษการทุจริตในระบบราชการได้หว่านความไม่ไว้วางใจในการบริหารงานของตน"
 ep3_governor_yearly_8050_imperial_recruiter_modifier: "ผู้พิทักษ์จักรวรรดิ"
 ep3_governor_yearly_8050_imperial_recruiter_modifier_desc: "ตัวละครนี้ได้ส่งทหารไปช่วยป้องกันจักรวรรดิอย่างไม่เห็นแก่ตัว\n[governor_efficiency|E]: @governor_efficiency!#P +5%#!"
 ep3_governor_yearly_8050_imperial_fortification_modifier: "การเสริมกำลังของจักรวรรดิ"
 ep3_governor_yearly_8050_imperial_fortification_modifier_desc: "ตัวละครนี้ได้ร้องขอการสนับสนุนเพิ่มเติมสำหรับการป้องกันมณฑลของตน"
 ep3_governor_yearly_8050_imperial_resources_modifier: "ทรัพยากรของจักรวรรดิ"
 ep3_governor_yearly_8050_imperial_resources_modifier_desc: "ตัวละครนี้ได้ร้องขอทรัพยากรเพิ่มเติมสำหรับการป้องกันมณฑลของตน\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"
 ep3_governor_yearly_8040_province_development_modifier: "การพัฒนามณฑล"
 ep3_governor_yearly_8040_province_development_modifier_desc: "ตัวละครนี้ได้ตัดสินใจมุ่งเน้นไปที่การพัฒนามณฑลของตน แทนที่จะเป็นคฤหาสน์"
 ep3_governor_yearly_8040_domicile_development_modifier: "การพัฒนาคฤหาสน์"
 ep3_governor_yearly_8040_domicile_development_modifier_desc: "ตัวละครนี้ใช้เวลาดูแลคฤหาสน์ของตนมากกว่ามณฑล\n[governor_efficiency|E]: @governor_efficiency!#N -10%#!"
 ep3_governor_yearly_8040_overwhelmed_modifier: "หนักเกินรับไหว"
 ep3_governor_yearly_8040_overwhelmed_modifier_desc: "ตัวละครนี้มีปัญหาในการจัดการทั้งคฤหาสน์และมณฑลของตน"
 ep3_governor_yearly_8040_across_things_modifier: "จัดการได้ทั่วถึง"
 ep3_governor_yearly_8040_across_things_modifier_desc: "ตัวละครนี้สามารถจัดการทั้งคฤหาสน์และการบริหารมณฑลของตนได้อย่างดีเยี่ยม"
 ep3_governor_yearly_8040_shirker_modifier: "ละเลยหน้าที่"
 ep3_governor_yearly_8040_shirker_modifier_desc: "ตัวละครนี้ได้ผลักภาระงานของตนไปให้ผู้ใต้บังคับบัญชา"
 ep3_governor_yearly_8120_relief_leader_modifier: "ดูแลการบรรเทาทุกข์"
 ep3_governor_yearly_8120_relief_leader_modifier_desc: "ตัวละครนี้ได้ดูแลความพยายามบรรเทาทุกข์สำหรับมณฑลที่ประสบภัยพิบัติด้วยตนเอง"
 ep3_governor_yearly_8120_relief_botched_modifier: "การบรรเทาทุกข์ที่ผิดพลาด"
 ep3_governor_yearly_8120_relief_botched_modifier_desc: "ตัวละครนี้ทำผิดพลาดในความพยายามบรรเทาทุกข์สำหรับมณฑลที่ประสบภัยพิบัติ"
 ep3_governor_yearly_8120_relief_aid_modifier: "ความช่วยเหลือบรรเทาภัยพิบัติ"
 ep3_governor_yearly_8120_relief_aid_modifier_desc: "ตัวละครนี้ได้ให้ความช่วยเหลือแก่ผู้ประสบภัยในมณฑลที่ประสบภัยพิบัติ"
 ep3_governor_yearly_8120_relief_rejected_modifier: "ปฏิเสธการบรรเทาทุกข์"
 ep3_governor_yearly_8120_relief_rejected_modifier_desc: "ตัวละครนี้ปฏิเสธที่จะตอบสนองต่อมณฑลที่ประสบภัยพิบัติ\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"

 brutal_castration_modifier: "บาดแผลจากการตอน"
 brutal_castration_modifier_desc: "การตอนที่ดำเนินการไม่ดีได้ทิ้งบาดแผลอักเสบลึกและมีเลือดออกตลอดเวลาในบริเวณที่บอบบาง"
 ep3_guides_and_guards_modifier: "ผู้นำทางและองครักษ์ท้องถิ่น"
 ep3_guides_and_guards_modifier_desc: "ผู้อุปถัมภ์ท้องถิ่นได้เสนอองครักษ์และผู้นำทางที่มีประสบการณ์ให้กับการแสวงบุญของตัวละครนี้"
 ep3_lay_of_the_land_modifier: "รู้เส้นทาง"
 ep3_lay_of_the_land_modifier_desc: "ตัวละครนี้เดินทางได้เร็วขึ้นหลังจากได้รับคำแนะนำที่ชัดเจนจากคนท้องถิ่น"
 ep3_pilgrim_protector_same_modifier: "ผู้พิทักษ์ผู้แสวงบุญ"
 ep3_pilgrim_protector_same_modifier_desc: "ตัวละครนี้ได้แสดงความศรัทธาโดยการให้ที่พักและปกป้องผู้แสวงบุญที่เดินทางผ่านดินแดนของตน"
 ep3_pilgrim_protector_other_modifier: "$ep3_pilgrim_protector_same_modifier$"
 ep3_pilgrim_protector_other_modifier_desc: "ตัวละครนี้ได้แสดงความเมตตาโดยการให้ที่พักและปกป้องผู้แสวงบุญต่างศรัทธา"
 ep3_friendly_host_modifier: "เจ้าบ้านผู้เป็นมิตร"
 ep3_friendly_host_modifier_desc: "ผู้แสวงบุญได้รับการต้อนรับเสมอที่โต๊ะอาหารของตัวละครนี้"
 ep3_open_granary_county_modifier: "เปิดยุ้งฉางของเจ้าของที่ดิน"
 ep3_open_granary_county_modifier_desc: "เจ้าของที่ดินท้องถิ่นถูกบังคับให้เปิดยุ้งฉางและแจกจ่ายธัญพืชที่กักตุนไว้"
 ep3_unbeliever_in_signs_modifier: "ไม่เชื่อในสัญญาณ"
 ep3_unbeliever_in_signs_modifier_desc: "ตัวละครนี้ไม่เชื่อในคำทำนายหรือสัญญาณจากเบื้องบน"
 ep3_roaming_shepherds_county_modifier: "คนเลี้ยงแกะเร่ร่อน"
 ep3_roaming_shepherds_county_modifier_desc: "คนเลี้ยงแกะได้รับอนุญาตให้ต้อนฝูงสัตว์ไปได้ทุกที่ตามต้องการ"
 ep3_monastic_quiet_county_modifier: "ความเงียบสงบของอาราม"
 ep3_monastic_quiet_county_modifier_desc: "ความเงียบสงบและความศักดิ์สิทธิ์ของอารามในท้องถิ่นมีความสำคัญเหนือกว่ากิจกรรมการผลิตภายนอก"
 ep3_law_and_order_modifier: "กฎหมายและความสงบเรียบร้อย"
 ep3_law_and_order_modifier_desc: "ตัวละครนี้ได้ปราบปรามความไม่สงบในท้องถิ่นในเมืองหลวงของตนด้วยเลือด"
 ep3_rampaging_disorders_county_modifier: "ความไม่สงบที่อาละวาด"
 ep3_rampaging_disorders_county_modifier_desc: "การจลาจลในท้องถิ่นต่อต้านพ่อค้าต่างชาติถูกปล่อยให้ก่อตัวขึ้นในเคาน์ตี้นี้"
 ep3_crowd_bender_modifier: "ผู้โน้มน้าวฝูงชน"
 ep3_crowd_bender_modifier_desc: "ตัวละครนี้เป็นที่รักของฝูงชน เนื่องจากวาทศิลป์ของตน"
 
 ep3_governor_yearly_8130_raised_taxes_modifier: "ขึ้นภาษี"
 ep3_governor_yearly_8130_raised_taxes_modifier_desc: "ตัวละครนี้ใช้อำนาจในฐานะผู้ว่าการเพื่อขึ้นภาษีมณฑลตามอำเภอใจ\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"
 ep3_governor_yearly_8130_special_levy_modifier: "การเกณฑ์พิเศษ"
 ep3_governor_yearly_8130_special_levy_modifier_desc: "ตัวละครนี้ใช้อำนาจในฐานะผู้ว่าการเพื่อเรียกเก็บภาษีพิเศษตามอำเภอใจ"
 ep3_governor_yearly_8130_raised_almonage_modifier: "การเกณฑ์ทาน"
 ep3_governor_yearly_8130_raised_almonage_modifier_desc: "ตัวละครนี้ได้เก็บภาษีเพื่อแจกจ่ายให้กับผู้ขัดสนในมณฑลของตน\n[governor_efficiency|E]: @governor_efficiency!#P +5%#!"
 ep3_governor_yearly_8140_negotiated_modifier: "การไกล่เกลี่ยของส่วนรวม"
 ep3_governor_yearly_8140_negotiated_modifier_desc: "เคาน์ตี้นี้ได้รับประโยชน์จากการไกล่เกลี่ยกับเจ้าของคฤหาสน์ขุนนางที่กระตือรือร้นเกินเหตุ"
 ep3_governor_yearly_8140_defended_modifier: "ส่วนรวมถูกแสวงหาประโยชน์"
 ep3_governor_yearly_8140_defended_modifier_desc: "การแสวงหาประโยชน์จากทรัพยากรส่วนรวมของเคาน์ตี้นี้โดยขุนนางได้รับการอำนวยความสะดวกจากผู้ว่าการ"
 ep3_governor_yearly_8140_ignored_modifier: "ส่วนรวมถูกละเลย"
 ep3_governor_yearly_8140_ignored_modifier_desc: "การแสวงหาประโยชน์จากทรัพยากรส่วนรวมของเคาน์ตี้นี้โดยขุนนางถูกละเลยโดยผู้ว่าการ"
 ep3_governor_yearly_8170_warning_system_modifier: "ระบบเตือนภัย"
 ep3_governor_yearly_8170_warning_system_modifier_desc: "เคาน์ตี้นี้มีระบบเตือนภัยล่วงหน้า ซึ่งให้การป้องกันจากการบุกปล้นได้ดียิ่งขึ้น"
 ep3_governor_yearly_8170_success_modifier: "มาตรการป้องกัน"
 ep3_governor_yearly_8170_success_modifier_desc: "การป้องกันการบุกปล้นของเคาน์ตี้นี้ได้รับการปรับปรุงอย่างมีนัยสำคัญด้วยมาตรการอันชาญฉลาด"
 ep3_governor_yearly_8170_failure_modifier: "การป้องกันที่บกพร่อง"
 ep3_governor_yearly_8170_failure_modifier_desc: "การป้องกันการบุกปล้นของเคาน์ตี้นี้ถูกบ่อนทำลายโดยพื้นฐานจากมาตรการที่ย่ำแย่"
 ep3_governor_yearly_8160_promoted_modifier: "ส่งเสริมชนกลุ่มน้อย"
 ep3_governor_yearly_8160_promoted_modifier_desc: "สมาชิกของชุมชนนี้ได้รับอนุญาตให้เข้าสู่ตำแหน่งข้าราชการในฝ่ายบริหารของผู้ว่าการ"
 ep3_governor_yearly_8160_suppressed_modifier: "ปราบปรามชนกลุ่มน้อย"
 ep3_governor_yearly_8160_suppressed_modifier_desc: "สมาชิกของชุมชนนี้ถูกปฏิเสธไม่ให้เข้าสู่ตำแหน่งข้าราชการในฝ่ายบริหารของผู้ว่าการและถูกกดขี่"
 ep3_governor_yearly_8150_placated_modifier: "ติดสินบนหัวโจก"
 ep3_governor_yearly_8150_placated_modifier_desc: "ผู้นำของกลุ่มกบฏในเคาน์ตี้นี้ได้ยอมรับสินบนของผู้ว่าการ"
 ep3_governor_yearly_8150_insulted_modifier: "ดูหมิ่นหัวโจก"
 ep3_governor_yearly_8150_insulted_modifier_desc: "ผู้นำของกลุ่มกบฏในเคาน์ตี้นี้โกรธเคืองจากความพยายามของผู้ว่าการที่จะติดสินบนพวกเขา"
 ep3_governor_yearly_8150_concession_modifier: "การผ่อนปรนแก่ชาวนา"
 ep3_governor_yearly_8150_concession_modifier_desc: "กลุ่มกบฏในเคาน์ตี้นี้ได้รับการผ่อนปรนจากผู้ว่าการ"
 ep3_governor_yearly_8150_minority_crackdown_modifier: "การปราบปรามอย่างโหดเหี้ยม"
 ep3_governor_yearly_8150_minority_crackdown_modifier_desc: "ตัวละครนี้ได้ปราบปรามกลุ่มกบฏในมณฑลของตนอย่างรุนแรง"
 ep3_governor_yearly_8150_crackdown_modifier: "การปราบปรามอย่างโหดเหี้ยม"
 ep3_governor_yearly_8150_crackdown_modifier_desc: "กลุ่มกบฏในเคาน์ตี้นี้ถูกปราบปรามอย่างรุนแรงโดยผู้ว่าการ"
 ep3_governor_yearly_8150_peasant_crackdown_modifier: "การปราบปรามอย่างโหดเหี้ยม"
 ep3_governor_yearly_8150_peasant_crackdown_modifier_desc: "ตัวละครนี้ได้ปราบปรามกลุ่มกบฏในมณฑลของตนอย่างรุนแรง"

 pandidakterion_university_modifier: "พันดิแดคเทอเรียน"
 pandidakterion_university_modifier_desc: "มหาวิทยาลัยคอนสแตนติโนเปิล ก่อตั้งขึ้นในปี 425 โดยธีโอโดซิอุสที่ 2 และเพิ่งก่อตั้งขึ้นใหม่เมื่อไม่นานมานี้ มีชื่อเสียงในการผลิตข้าราชการที่มีคุณสมบัติเหมาะสม ซึ่งสนับสนุนการทำงานของราชสำนัก\n[councillor_tasks|E] ต่อไปนี้มีประสิทธิภาพมากขึ้น:\n$BULLET_WITH_TAB$[domestic_affairs|E]\n$BULLET_WITH_TAB$[promote_culture|E]\n$BULLET_WITH_TAB$[organize_levies|E]\n$BULLET_WITH_TAB$[espionage|E]\n$BULLET_WITH_TAB$[fabricate_claim|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'pandidakterion_adult_education_bonus')]"
 ep3_sent_help_to_east_modifier: "ส่งกองทัพไปช่วย"
 ep3_sent_help_to_east_modifier_desc: "ตัวละครนี้ได้ส่งกองกำลังอาสาสมัครไปช่วยพี่น้องชาวคริสต์ในสงครามของพวกเขา"
 grain_providers_county_modifier: "ยุ้งฉางแห่งโรมใหม่"
 grain_providers_county_modifier_desc: "การปันส่วนธัญพืชในคอนสแตนติโนเปิลขึ้นอยู่กับพื้นที่นี้ในการผลิตและส่งออกธัญพืชราคาถูกจำนวนมหาศาลผ่านเครือข่ายพ่อค้า ผู้ขนส่ง ผู้ผลิต และแม้ แต่นักเก็งกำไรที่ก้าวหน้า"
 panem_et_circenses_county_modifier: "ปาเนม เอต เคอร์เคนเซส (ขนมปังและการละเล่น)"
 panem_et_circenses_county_modifier_desc: "การปันส่วนธัญพืชมีผลบังคับใช้: พลเมืองทุกคนมีสิทธิ์ได้รับการแจกจ่ายขนมปังฟรีเป็นประจำ ซึ่งได้รับการสนับสนุนจากจักรพรรดิ"

 ep3_construction_contract_modifier: "สัญญาการก่อสร้าง"
 ep3_construction_contract_modifier_desc: "ผู้ติดตามของตัวละครนี้กำลังช่วยสร้างที่ดินเพื่อแลกกับการจ่ายเงินรายเดือน\n$ep3_contract_event.0011.construction_invalidation$"

 retaken_eastern_provinces_modifier: "สถาปนาพรมแดนธีโอโดเซียนขึ้นใหม่"
 retaken_eastern_provinces_modifier_desc: "ราชวงศ์นี้ได้สถาปนาพรมแดนโบราณของจักรวรรดิโรมันตะวันออกขึ้นใหม่"

 ep3_foraged_plants: "หาพืชป่า"
 ep3_foraged_plants_desc: "ตัวละครนี้ใช้เวลาอยู่ในป่าเพื่อเรียนรู้เกี่ยวกับพืชที่กินได้ ซึ่งนำไปสู่อาหารที่ดีต่อสุขภาพมากขึ้น"

 ep3_tuition_paid: "จ่ายค่าเล่าเรียนแล้ว"
 ep3_tuition_paid_desc: "ตัวละครนี้เป็นที่รู้จักกันดีในเรื่องความใจบุญเมื่อต้องบ่มเพาะพรสวรรค์ของกวีหนุ่มสาว"

 ep3_from_far_and_wide: "จากแดนไกลและกว้าง"
 ep3_from_far_and_wide_desc: "ชื่อเสียงของตัวละครนี้ ทำให้พวกเขาเป็นที่รู้จักไปทั่วแผ่นดิน ดึงดูดผู้อื่นเข้ามาหาและรับประกันการเดินทางที่ปลอดภัย"

 ep3_refreshed_and_relaxed: "สดชื่นและผ่อนคลาย"
 ep3_refreshed_and_relaxed_desc: "ตัวละครนี้เข้าใจคุณค่าของการทำจิตใจให้ปลอดโปร่งและฟื้นฟูจิตใจเป็นครั้งคราว\n\n#weak [modifier|E] นี้เปิดใช้งาน [decision|E] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName]#!"

 ep3_pushed_too_hard: "ผลักดันหนักเกินไป"
 ep3_pushed_too_hard_desc: "ตัวละครนี้ผลักดันตัวเองหนักเกินไป เพื่อให้บรรลุเป้าหมาย และอยู่ในสภาพที่เปราะบางมากขึ้น"

 ep3_star_crossed_modifier: "ดวงดาวไม่เป็นใจ"
 ep3_star_crossed_modifier_desc: "ตัวละครนี้โหยหาความรักที่สูญเสียไป ไม่มีวันได้กลับคืนมา"

 ep3_reunited_modifier: "กลับมาพบกันอีกครั้ง"
 ep3_reunited_modifier_desc: "ตัวละครนี้ได้กลับมาพบกับคนรักเก่าอีกครั้ง สร้างความปิติยินดี"

 ep3_famous_connections_modifier: "เส้นสายที่มีชื่อเสียง"
 ep3_famous_connections_modifier_desc: "ตัวละครนี้มีเพื่อนที่มีชื่อเสียง และใช้ประโยชน์จากชื่อเสียงของพวกเขาอย่างมีประสิทธิภาพ แต่ระมัดระวัง"

 ep3_quality_control_modifier: "การควบคุมคุณภาพ"
 ep3_quality_control_modifier_desc: "ตัวละครนี้ควบคุมผลงานของตนอย่างเข้มงวด\n\n#weak [modifier|E] นี้เพิ่มศักยภาพต่ำสุดของ [gold_i][gold|E] ที่ได้รับจาก [decision|E] [GetDecisionWithKey('write_muwashshah_poem_decision').GetName]#!\n\n"

 ep3_power_couple_modifier: "ความสัมพันธ์แบบพึ่งพาอาศัยกัน"
 ep3_power_couple_modifier_desc: "ตัวละครนี้มีความสัมพันธ์ใกล้ชิดกับผู้อื่น ช่วยเหลืองานและส่งเสริมชื่อเสียงของพวกเขา\n\n#weak [modifier|E] นี้เพิ่มโอกาสที่กวีระดับสูงจะมาถึงจาก [decision|E] [GetDecisionWithKey('invite_poets_decision').GetName] และลดค่าใช้จ่ายของ [decision|E] [GetDecisionWithKey('found_salon_decision').GetName]#!\n\n"

 ep3_founded_salon_modifier: "ก่อตั้งซาลอน"
 ep3_founded_salon_modifier_desc: "ตัวละครนี้ก่อตั้งซาลอนกวีนิพนธ์ถาวร สร้างศูนย์กลางศิลปะสำหรับคนรุ่นต่อไป"

 ep3_poets_salon_modifier: "ซาลอนกวีนิพนธ์"
 ep3_poets_salon_modifier_desc: "มณฑลนี้เป็นที่ตั้งของซาลอนกวีนิพนธ์ ซึ่งเป็นศูนย์กลางศิลปะที่รู้จักกันอย่างกว้างขวาง"

 ep3_friend_to_orphans: "มิตรของเด็กกำพร้า"
 ep3_friend_to_orphans_desc: "ตัวละครนี้เป็นที่รู้จักและยกย่องอย่างกว้างขวางสำหรับงานของพวกเขาในการปกป้องและเลี้ยงดูเด็กกำพร้าที่เปราะบาง"

 ep3_healthy_orphanages_modifier: "สถานเลี้ยงเด็กกำพร้าที่แข็งแรง"
 ep3_healthy_orphanages_modifier_desc: "เคาน์ตี้นี้มีสถานเลี้ยงเด็กกำพร้าที่ได้รับทุนสนับสนุนอย่างดี ทำให้มั่นใจได้ว่าผู้ที่ถูกทอดทิ้งจะได้รับการดูแลอย่างดี"

 ep3_tutoring_noblewoman_modifier: "สอนพิเศษสตรีสูงศักดิ์"
 ep3_tutoring_noblewoman_modifier_desc: "ตัวละครนี้รับเงินเพื่อแลกกับการสอนพิเศษสตรีสูงศักดิ์ในท้องถิ่น แม้ว่าสิ่งนี้จะ ทำให้เวลาสำหรับกิจการอื่นลดลงอย่างเห็นได้ชัด"

 ep3_focused_on_studies_modifier: "มุ่งเน้นไปที่การศึกษา"
 ep3_focused_on_studies_modifier_desc: "ตัวละครนี้ได้เพิ่มความพยายามในการศึกษาของตนเป็นสองเท่า\n\n#weak [modifier|E] นี้เพิ่มศักยภาพสูงสุดของ [prestige_i][prestige|E] ที่ได้รับจาก [decision|E] [GetDecisionWithKey('write_muwashshah_poem_decision').GetName]#!\n\n"

 ep3_efforts_recognized_modifier: "ความพยายามได้รับการยอมรับ"
 ep3_efforts_recognized_modifier_desc: "ความพยายามของตัวละครนี้ในการปกครองที่ดีได้รับการยอมรับและยกย่องจากเจ้าเหนือหัวของพวกเขาในที่สาธารณะ"
 ep3_publicly_recognized_modifier: "ได้รับการยอมรับในที่สาธารณะ"
 ep3_publicly_recognized_modifier_desc: "ตัวละครนี้ได้รับการยอมรับในที่สาธารณะว่าเป็นสมาชิกที่มีค่าของฝ่ายบริหาร"

 ep3_supply_issues_modifier: "ปัญหาเสบียง"
 ep3_supply_issues_modifier_desc: "ค่ายของตัวละครนี้กำลังประสบปัญหาในการหาอาหาร ทำให้เกิดเสียงบ่นจากท้องและผู้ติดตาม"

 ep3_priest_friend_same_modifier: "มิตรของผู้ศักดิ์สิทธิ์"
 ep3_priest_friend_same_modifier_desc: "ตัวละครนี้เป็นที่รู้จักกันดีว่าเป็นมิตรของผู้ศรัทธา"
 ep3_priest_friend_different_modifier: "มิตรของผู้ศักดิ์สิทธิ์ทั้งปวง"
 ep3_priest_friend_different_modifier_desc: "ตัวละครนี้เป็นที่รู้จักกันดีว่าเป็นมิตรของผู้ศรัทธา แม้ว่าจะไม่ได้นับถือศรัทธาเดียวกันเสมอไป..."
 ep3_inflexible_worshipper_modifier: "ผู้นับถือที่ไม่ยืดหยุ่น"
 ep3_inflexible_worshipper_modifier_desc: "ตัวละครนี้แน่วแน่ในความเชื่อของตน และไม่ยอมทนต่อพวกนอกรีต"
 ep3_ungodly_hospitality_modifier: "การต้อนรับที่ไม่ศรัทธา"
 ep3_ungodly_hospitality_modifier_desc: "ตัวละครนี้ได้ขับไล่ผู้ศรัทธา ปฏิเสธการต้อนรับพวกเขาในยามต้องการ"
 ep3_rested_and_refreshed_modifier: "พักผ่อนและสดชื่น"
 ep3_rested_and_refreshed_modifier_desc: "ตัวละครนี้ได้รับประโยชน์จากการพักผ่อนสองสามคืนในสภาพแวดล้อมที่หรูหรากว่าที่คุ้นเคย"
 ep3_cricked_neck_modifier: "คอเคล็ด"
 ep3_cricked_neck_modifier_desc: "ตัวละครนี้มีอาการปวดแปลบที่คอ"
 ep3_friend_to_old_soldiers_modifier: "มิตรของทหารผ่านศึก"
 ep3_friend_to_old_soldiers_modifier_desc: "ตัวละครนี้เป็นที่รู้จักอย่างกว้างขวางในหมู่ทหารผ่านศึกว่าเป็นบุคคลที่เห็นอกเห็นใจในอุดมการณ์ของพวกเขา\n\n#weak [modifier|E] นี้ข้ามข้อกำหนดในตัวเลือกสร้างความประทับใจให้ทหารรับจ้างของ [interaction|E] $reinforce_soldiers_interaction$#!"

 ep3_expanded_culinary_horizons_modifier: "ขยายขอบเขตการทำอาหาร"
 ep3_expanded_culinary_horizons_modifier_desc: "ตัวละครนี้เพิ่งปรับปรุงทัศนคติเกี่ยวกับอาหารที่ไม่คุ้นเคย ทำให้มีรสนิยมการกินที่กว้างขึ้นมาก"
 ep3_new_tastes_modifier: "รสชาติใหม่"
 ep3_new_tastes_modifier_desc: "ตัวละครนี้ได้รับประโยชน์จากอาหารที่หลากหลายมากขึ้นเมื่อเร็วๆ นี้ ช่วยบำรุงทั้งร่างกายและจิตใจ"
 ep3_new_tastes_cannibal_modifier: "รสชาติ'ใหม่'"
 ep3_new_tastes_cannibal_modifier_desc: "ตัวละครนี้ยืนกรานที่จะเสิร์ฟอาหารที่น่าสงสัยบนโต๊ะของพวกเขา เนื้อนั่นมัน #EMP อะไร#! กันแน่...?"
 ep3_lust_for_land_modifier: "ความกระหายในดินแดน"
 ep3_lust_for_land_modifier_desc: "ตัวละครนี้ยินดีทำทุกอย่าง เพื่อให้ได้ครอบครองดินแดน\n\n#weak [modifier|E] นี้ลดค่าใช้จ่ายของ [casus_belli|E] $EP3_LAAMP_INVASION_CB_NAME$ ลงครึ่งหนึ่ง\n#!"
 ep3_comfortable_bed_modifier: "เครื่องประดับที่สะดวกสบาย"
 ep3_comfortable_bed_modifier_desc: "ตัวละครนี้ได้รับประโยชน์จากสภาพแวดล้อมที่สะดวกสบายกว่าปกติ"
 ep3_well_guided_modifier: "ได้รับการนำทางอย่างดี"
 ep3_well_guided_modifier_desc: "ตัวละครนี้มีพรสวรรค์ในการเลือกผู้นำทางท้องถิ่นที่ดีเพื่อนำทางผ่านภูมิประเทศที่ทรหด"
 ep3_sketchy_guides_modifier: "ผู้นำทางที่ไม่น่าไว้ใจ"
 ep3_sketchy_guides_modifier_desc: "ดูเหมือนว่าตัวละครนี้จะเลือกผู้นำทางที่ให้ข้อมูลที่ไม่ถูกต้องอยู่เสมอ ไม่ว่าจะโดยบังเอิญหรือโชคร้ายล้วนๆ"
 ep3_master_of_ceremonies: "เจ้าพิธี"
 ep3_master_of_ceremonies_desc: "ตัวละครนี้ได้พิสูจน์ตัวเองว่าเป็นนักสังสรรค์ตัวยงในงานเลี้ยงฉลองในค่าย!"

 ep3_uneasy_modifier: "ไม่สบายใจ"
 ep3_uneasy_modifier_desc: "ตัวละครนี้รู้สึกถึงลางสังหรณ์และความไม่สบายใจทั่วไปเล็กน้อย"

 ep3_sensible_provisions: "มีเหตุผลกับเสบียง"
 ep3_sensible_provisions_desc: "ตัวละครนี้ไม่อนุญาตให้ตัวเองถูกชักจูงให้ใช้เสบียงอย่างสิ้นเปลืองโดยไม่จำเป็น"

 ep3_life_of_the_party: "ดาวเด่นของงานเลี้ยง"
 ep3_life_of_the_party_desc: "ตัวละครนี้เป็นเหมือนผู้สนับสนุนเมื่อพูดถึงการสังสรรค์!"

 ep3_warm_and_content: "อบอุ่นและพึงพอใจ"
 ep3_warm_and_content_desc: "ตัวละครนี้กำลังดื่มด่ำกับความสุขหลังจากการใช้เวลาในหมู่เพื่อนที่ดีพร้อมกองไฟที่ลุกโชน"

 ep3_responsible_with_money: "รับผิดชอบเรื่องเงิน"
 ep3_responsible_with_money_desc: "แม้จะเสียสติไปบ้างเล็กน้อย ตัวละครนี้ก็ยังคงควบคุมการใช้จ่ายได้อย่างมั่นคง"

 ep3_foreign_affairs_modifier: "ตระหนักถึงกิจการต่างประเทศ"
 ep3_foreign_affairs_modifier_desc: "ตัวละครนี้จับตาดูเหตุการณ์ในต่างประเทศอย่างใกล้ชิด ค่ายของพวกเขาเตรียมพร้อมและพร้อมที่จะเคลื่อนไหวได้ทันที"

 ep3_the_restful_modifier: "ผู้พักผ่อน"
 ep3_the_restful_modifier_desc: "ตัวละครนี้หันหลังให้กับโชคชะตาของตน นำไปสู่ชีวิตที่สงบสุข แต่ไม่สมหวัง"

 ep3_harried_modifier: "ถูกรบกวน"
 ep3_harried_modifier_desc: "ที่ดินผืนนี้ได้รับความเดือดร้อนภายใต้แอกของนอร์มัน ผู้อยู่อาศัยที่ไม่สงบสุขต้องเผชิญกับการปราบปรามอย่างโหดเหี้ยมจากผู้ปกครองของพวกเขา"

 ep3_the_conqueror_modifier: "ผู้พิชิตผู้โหดเหี้ยม"
 ep3_the_conqueror_modifier_desc: "การตอบโต้อย่างโหดเหี้ยมของตัวละครนี้ต่อการลุกฮือทั่วอาณาจักรของตน ทำให้เกิดความเคารพ ความกลัว และความเกลียดชังในระดับที่เท่าเทียมกัน"
 anglo_saxon_opinion: "ความเห็นของชาวแองโกล-แซกซอน"

 ep3_dangerous_fenland_modifier: "พื้นที่ลุ่มอันตราย"
 ep3_dangerous_fenland_modifier_desc: "พื้นที่ลุ่มของมณฑลนี้กำลังถูกคุกคามโดยบุคคลลึกลับ ทำให้เกิดความตื่นตระหนกอย่างกว้างขวาง"

 ep3_plundered_modifier: "ถูกปล้นสะดม"
 ep3_plundered_modifier_desc: "มณฑลนี้เกิดเหตุปล้นทรัพย์อย่างรุนแรงหลายครั้ง ส่งผลให้ความมั่งคั่งค่อยๆ หายไป"

 ep3_hereward_caution_modifier: "นักจัดการผู้รอบคอบ"
 ep3_hereward_caution_modifier_desc: "ตัวละครนี้ใช้เวลาในการเตรียมตัวเสมอ ทำให้มั่นใจว่าพวกเขามีสิ่งที่ดีที่สุดก่อนที่จะลงมือ"

 ep3_gnr_guards_modifier: "ถนนที่มีการป้องกัน"
 ep3_gnr_guards_modifier_desc: "เคาน์ตี้นี้มีส่วนของถนนเกรทนอร์ทโร้ด ซึ่งเพิ่งสร้างขึ้นใหม่และมีการลาดตระเวนโดยองครักษ์ติดอาวุธ"

 ep3_gnr_modifier: "ถนนที่สร้างขึ้นใหม่"
 ep3_gnr_modifier_desc: "เคาน์ตี้นี้มีส่วนของถนนเกรทนอร์ทโร้ดที่เพิ่งปรับปรุงใหม่"

 ep3_gnr_negative_modifier: "ถนนที่ถูกทำลาย"
 ep3_gnr_negative_modifier_desc: "ส่วนของถนนเกรทนอร์ทโร้ดในเคาน์ตี้นี้ถูกทำลายโดยเจตนาเพื่อขัดขวางกิจกรรมทางทหารและ ทำให้ชาวบ้านโกรธเคือง"

 ep3_honourable_jailor_modifier: "ผู้คุมที่น่าเคารพ"
 ep3_honourable_jailor_modifier_desc: "แนวทางการคุมขังนักโทษของตัวละครนี้ได้รับการยกย่องว่าปฏิบัติตามกฎและน่าเคารพ"

 all_crops_burned: "อาหารถูกทำลาย"
 all_crops_burned_desc: "เคาน์ตี้นี้มีอาหารทั้งหมดถูกเผาและปศุสัตว์ทุกตัวถูกฆ่าล่วงหน้า ซึ่งเป็นส่วนหนึ่งของการรณรงค์ลงโทษ"

 crops_burned: "พืชผลถูกเผา"
 crops_burned_desc: "เคาน์ตี้นี้มีพืชผลส่วนใหญ่ถูกเผา ซึ่งเป็นส่วนหนึ่งของการรณรงค์ลงโทษ"

 crop_levy: "การเกณฑ์พืชผล"
 crop_levy_desc: "เคาน์ตี้นี้ถูกบังคับให้จ่ายภาษีพิเศษสำหรับธัญพืช ทำให้ทรัพยากรอาหารไม่มั่นคง"

 ep3_resettled_village: "ที่อยู่อาศัยที่ตั้งถิ่นฐานใหม่"
 ep3_resettled_village_desc: "ผู้อยู่อาศัยจำนวนมากในที่ดินผืนนี้ถูกบังคับให้ย้ายถิ่นฐานไปที่อื่น ทำให้ที่นี่ร้างผู้คน"

 ep3_population_boost: "การเพิ่มขึ้นของประชากร"
 ep3_population_boost_desc: "ที่ดินผืนนี้ได้รับประโยชน์จากการหลั่งไหลเข้ามาของผู้คนที่ถูกบังคับให้ย้ายมาจากที่ดินใกล้เคียง แม้ว่าอารมณ์ของพวกเขาจะไม่ค่อยดีนักก็ตาม"

 ep3_smouldering_village: "อาคารที่คุกรุ่น"
 ep3_smouldering_village_desc: "อาคารในที่ดินผืนนี้ได้รับความเสียหายจากไฟไหม้ที่ลุกลาม ทำให้เกิดความเสียหายทั้งโครงสร้างพื้นฐานและจิตใจ"

 ep3_church_bereft: "โบสถ์ที่ถูกทอดทิ้ง"
 ep3_church_bereft_desc: "ที่ดินผืนนี้มีวัตถุมงคลอันล้ำค่าถูกขโมยไป ซึ่งส่งผลเสียต่อโบสถ์และสร้างความตกใจให้กับชาวบ้าน"

 ep3_man_of_god: "บุรุษแห่งพระเจ้า"
 ep3_man_of_god_desc: "ตัวละครนี้เป็นมิตรกับนักบวช และความศักดิ์สิทธิ์ของเขาได้รับการยกย่องไปทั่วแผ่นดิน"

 ep3_missing_supplies: "เสบียงที่หายไป"
 ep3_missing_supplies_desc: "เคาน์ตี้นี้ขาดอาวุธและชุดเกราะจำนวนมาก และคุณภาพของกองทหารก็ได้รับผลกระทบตามไปด้วย"

 ep3_redistributed_equipment: "อุปกรณ์ที่แจกจ่ายใหม่"
 ep3_redistributed_equipment_desc: "ตัวละครนี้ได้รับประโยชน์จากการหลั่งไหลเข้ามาของอาวุธและชุดเกราะคุณภาพสูง แต่ได้มาโดยมิชอบ"

 ep3_stolen_equipment: "อุปกรณ์ที่ถูกขโมย"
 ep3_stolen_equipment_desc: "ตัวละครนี้ได้ยึดอาวุธและชุดเกราะที่ถูกขโมยมา และกำลังนำไปใช้ประโยชน์อย่างดี"

 ep3_sabotaged_roads: "ถนนที่ถูกก่อวินาศกรรม"
 ep3_sabotaged_roads_desc: "ถนนในที่ดินผืนนี้ได้รับความเสียหายจากการก่อวินาศกรรม ทำให้การเดินทางอันตรายมากขึ้น"

 ep3_delayed_supplies: "เสบียงที่ล่าช้า"
 ep3_delayed_supplies_desc: "เคาน์ตี้นี้มีการขนส่งอาวุธและชุดเกราะจำนวนมากล่าช้า และคุณภาพของกองทหารก็ได้รับผลกระทบตามไปด้วย"

 ep3_defender_of_families: "ผู้พิทักษ์ครอบครัว"
 ep3_defender_of_families_desc: "ตัวละครนี้มีชื่อเสียงในการพยายามรักษาครอบครัวให้สมบูรณ์และมีความสุข"

 ep3_paid_grains: "การนำเข้าธัญพืช"
 ep3_paid_grains_desc: "เคาน์ตี้นี้ได้รับประโยชน์จากธัญพืชนำเข้า ช่วยบรรเทาภาวะข้าวยากหมากแพงที่กำลังก่อตัว"

 ep3_innovative_farming_techniques: "เทคนิคการทำฟาร์มที่เป็นนวัตกรรม"
 ep3_innovative_farming_techniques_desc: ""เคาน์ตี้นี้ได้รับประโยชน์จากเทคนิคการทำฟาร์มที่ก้าวหน้าอย่างน่าประทับใจ ช่วยเพิ่มประสิทธิภาพการผลิตอาหาร"

 ep3_surplus_manpower: "กำลังคนส่วนเกิน"
 ep3_surplus_manpower_desc: "เคาน์ตี้นี้มีชาวนาที่แข็งแรงและอยู่ในวัยสู้รบเกินความต้องการ"

 ep3_counties_restless_modifier: "ไม่สงบ"
 ep3_counties_restless_modifier_desc: "เคาน์ตี้นี้ถูกปลุกปั่นให้เกิดความไม่สบายใจและความไม่สงบอย่างโกรธเคืองต่อผู้กดขี่ชาวนอร์มันคนใหม่"

 ep3_murderers_loose: "ฆาตกรลอยนวล"
 ep3_murderers_loose_desc: "เคาน์ตี้นี้เกิดเหตุฆาตกรรมหลายครั้ง น่าแปลกที่เหยื่อทั้งหมดเป็นชาวนอร์มัน..."

 ep3_unlocked_silk: "สิทธิ์ในการผลิตผ้าไหม"
 ep3_unlocked_silk_desc: "ตระกูลนี้ได้รับการยกเว้นจากจักรพรรดิให้ผลิตผ้าไหมของตนเองได้"
 improve_de_jure_integration_modifier: "ส่งเสริมการรวมตามกฎหมาย"
 improve_de_jure_integration_modifier_desc: "ผู้มีอิทธิพลในท้องถิ่นกำลังลงทุนทรัพยากรจำนวนมากเพื่ออำนวยความสะดวกในการรวมตำแหน่งนี้ของเจ้าเหนือหัว\nโบนัสสำหรับ [councillor_task|E] [integrate_title]"
 improve_promote_culture_modifier: "ส่งเสริมการรวมทางวัฒนธรรม"
 improve_promote_culture_modifier_desc: "ผู้มีอิทธิพลในท้องถิ่นกำลังลงทุนทรัพยากรจำนวนมากเพื่ออำนวยความสะดวกในการเปลี่ยนเคาน์ตี้นี้ไปสู่วัฒนธรรมของเจ้าเหนือหัว\nโบนัสสำหรับ [councillor_task|E] [promote_culture|E]"
 ep3_integration_promoter_modifier: "ผู้ส่งเสริมการรวม"
 ep3_integration_promoter_modifier_desc: "ตัวละครนี้มีความกระตือรือร้นอย่างมากในการส่งเสริมการรวมพื้นที่รอบคฤหาสน์ของตน\nเพิ่ม [candidate_score|E] สำหรับ [governorship|E] ที่ [family_estate|E] ตั้งอยู่"

 hostile_schemes_distracted_modifier: "เสียสมาธิจากแผนการที่เป็นศัตรู"
 hostile_schemes_distracted_modifier_desc: "ประมุขของตระกูลของตัวละครนี้ได้ขอความร่วมมือในแผนการของตนเอง ทำให้ความสนใจและทักษะของตัวละครนี้ถูกผูกขาด\nผลเสียต่อ [success_chance|E] ของ [hostile_scheme|E]"
 personal_schemes_distracted_modifier: "เสียสมาธิจากแผนการส่วนตัว"
 personal_schemes_distracted_modifier_desc: "ประมุขของตระกูลของตัวละครนี้ได้ขอความร่วมมือในแผนการของตนเอง ทำให้ความสนใจและทักษะของตัวละครนี้ถูกผูกขาด\nผลเสียต่อ [success_chance|E] ของ [personal_scheme|E]"
 political_schemes_distracted_modifier: "เสียสมาธิจากแผนการทางการเมือง"
 political_schemes_distracted_modifier_desc: "ประมุขของตระกูลของตัวละครนี้ได้ขอความร่วมมือในแผนการของตนเอง ทำให้ความสนใจและทักษะของตัวละครนี้ถูกผูกขาด\nผลเสียต่อ [success_chance|E] ของ [political_scheme|E]"
 estate_supporting_buildings_modifier: "การสนับสนุนการสร้างคฤหาสน์"
