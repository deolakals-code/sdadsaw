l_english: 

 ep3_landless_admin.1000.t: "ที่หน้าประตู"
 ep3_landless_admin.1000.desc: "เสียงเคาะเบาๆ ที่ประตูคฤหาสน์ ทำให้ข้าประหลาดใจระหว่างเดินเล่น\n\n"เข้ามา"\n\n[proposed_councillor.GetWomanMan] แต่งกายดีคนหนึ่งยืนอยู่ที่ประตู กอดกระเป๋าของ [proposed_councillor.GetHerHis] ไว้แน่น\n\n"ข้ามาเพื่อเสนอตัวรับใช้ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] อันทรงคุณธรรม ข้ามีทักษะความสามารถสูงและจะรับใช้ท่านเป็นอย่างดี""
 ep3_landless_admin.1000.a: ""[proposed_councillor.GetWomanMan] ผู้มีทักษะเป็นที่ต้องการเสมอ""
 ep3_landless_admin.1000.b: ""แน่นอนว่ามันเป็นเกียรติ #EMP ของเจ้า#! ที่ได้รับใช้ข้า""
 ep3_landless_admin.1000.b.success: "[proposed_councillor.GetShortUIName] ประทับใจอย่างยิ่ง"
 ep3_landless_admin.1000.b.mid: "[proposed_councillor.GetShortUIName] ดูเหมือนจะเชื่อ"
 ep3_landless_admin.1000.b.failure: "[proposed_councillor.GetShortUIName] รู้สึกถูกดูหมิ่น"
 ep3_landless_admin.1000.c: ""ข้าไม่ต้องการสมาคมกับคนแปลกหน้า""
 ep3_landless_admin.1010.t: "ในคฤหาสน์อันดีงาม"
 ep3_landless_admin.1010.desc: ""ช่างงดงามอะไร เช่นนี้! ว่ากันว่าข้างในมีสองร้อยห้องและประตูทุกบานทำจากทองคำแท้! และในห้องใต้ดิน— อ๊ะ! สวัสดี [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n[local.GetWomanMan] ธรรมดา ๆ คนหนึ่งหยุดอยู่กลางสวนของข้า มีเด็กน้อยซ่อนอยู่หลังเสื้อผ้าของ [local.GetHerHis]\n\n"พวกเราแค่มาเดินชมคฤหาสน์น่ะ เพราะชาวบ้านแถบนี้ตะลึงในความงดงามของมัน!""
 ep3_landless_admin.1010.a: ""พวกเจ้ากำลังทำอะไรในคฤหาสน์ของข้า...? สายลับ!""
 ep3_landless_admin.1010.b: ""เราคงต้องขอค่าธรรมเนียมสักหน่อย...""
 ep3_landless_admin.1010.c: ""จง ทำให้ #EMP ทุกคน#! รู้""
 ep3_landless_admin.1010.d: ""บางทีพวกเจ้าอาจอยากจะอยู่ต่อ?""
 MODIFIER_DEFINITION_VALUE_PER_ESTATE_BUILDING: "\t#weak เพิ่มขึ้นต่อระดับ [building|E] $estate_main_01_domicile_building$ แต่ละระดับ#!"
 ep3_good_estate_modifier: "คฤหาสน์อันดีงาม"
 ep3_good_estate_modifier_desc: "ชาวบ้านประทับใจกับการบำรุงรักษา $estate_main_01_domicile_building$ ของตัวละครนี้"
 ep3_extra_security_modifier: "กำแพงสูงยิ่งขึ้น!"
 ep3_extra_security_modifier_desc: "ตัวละครนี้ได้เสริมความปลอดภัยของคฤหาสน์ เนื่องจากกังวลเรื่องสายลับ"
 ep3_landless_admin.1020.t: "เพื่อทองคำเล็กน้อย..."
 ep3_landless_admin.1020.desc.intro: "เสียงถุงเหรียญเป็นเสียงที่ยากจะจำผิดได้ [steward.GetTitledFirstName] เปิดประตู [steward.Custom('quirk_pos_pp')]\n\n"นายท่าน! ช่างเป็นคฤหาสน์ที่งดงามอะไร เช่นนี้! เหล่าคนรับใช้ต่างชื่นชม"
 ep3_landless_admin.1020.desc.market: "ตลาด"
 ep3_landless_admin.1020.desc.garden: "สวน"
 ep3_landless_admin.1020.desc.guardhouse: "ป้อมยาม"
 ep3_landless_admin.1020.desc.workshop: "โรงช่าง"
 ep3_landless_admin.1020.desc.barracks: "โรงทหาร"
 ep3_landless_admin.1020.desc.vineyard: "ไร่องุ่น"
 ep3_landless_admin.1020.desc.olive: "สวนมะกอก"
 ep3_landless_admin.1020.desc.tea: "ไร่ชา"
 ep3_landless_admin.1020.desc.outro: "ตั้งแต่เช้าตรู่" [steward.GetFirstNameNoTooltip] ผายมือไปทางนั้นอย่างคร่าวๆ\n\n"จะเป็นเกียรติอย่างยิ่งหากข้าได้ช่วยท่านให้แน่ใจว่าเราจะได้รับประโยชน์สูงสุดจากมัน""
 ep3_landless_admin.1020.a: ""ตลาดคือหัวใจของทุกเมือง""
 ep3_landless_admin.1020.b: ""ข้านึกภาพตัวเองกำลังพักผ่อนอยู่ในสวนเหล่านั้น...""
 ep3_landless_admin.1020.c: ""ความปลอดภัยคือมาตรการที่สำคัญที่สุด""
 ep3_landless_admin.1020.d: ""ช่างฝีมือ! ข้ารักพวกเขาเหลือเกิน!""
 ep3_landless_admin.1020.e: ""คนของข้าจะได้รับการฝึกฝนที่ดีที่สุด""
 ep3_landless_admin.1020.f: ""ข้ารอชิมไวน์นั้นไม่ไหวแล้ว!""
 ep3_landless_admin.1020.g: ""น้ำมันเป็นส่วนประกอบพื้นฐานที่สุด""
 ep3_landless_admin.1020.h: ""เราต้องการ #EMP ทุก#! เหรียญเพื่อรักษามันไว้ เช่นนั้น""
 ep3_landless_admin.1020.h.flavor: "ทองคำนั้นจะปลอดภัยกว่ามากหากอยู่กับข้า..."
 ep3_landless_admin.1020.j: ""ชาที่ดีคือเครื่องหมายที่แท้จริงของความประณีต" # Brit maxxing 101"
 ep3_landless_admin.1030.t: "ความลับแลกความลับ"
 ep3_landless_admin.1030.desc: "แขกผู้หนึ่งมาถึงโดยตรงจากราชสำนักของ [liege.GetTitledFirstNamePossessive] เชียวนะ! [courtier.GetWomanMan] คนหนึ่งยืนอยู่ตรงหน้าข้า [courtier.Custom('quirk_pos_pp')]\n\n"ขอคุยด้วยหน่อย [ROOT.Char.Custom('FormOfAddressForLiege')] ว่ากันว่าท่านสนใจในตัวนายเหนือหัวร่วมของเรา... ข้ารู้จัก [liege.GetHerHim] ทุกคนที่ราชสำนักก็รู้จัก [liege.GetHerHim] ความลับจะแข็งแกร่งเท่ากับจุดที่อ่อนแอที่สุดของมัน" [courtier.GetSheHe] ยิ้มเยาะ\n\n"ข้าขอเสนอ แลกความลับกับความลับ""
 ep3_landless_admin.1030.a: ""อะไรจะหยุดเจ้าจากการเปิดเผยความลับ #EMP ของข้า#!?""
 ep3_landless_admin.1030.b: ""[courtier.GetWomanMan] ไร้เกียรติ ไม่สมควรได้รับรางวัลใดๆ""
 ep3_landless_admin.1030.c: ""ช่างเป็นข้อเสนอที่น่าสนใจ...""
 ep3_landless_admin.1030.d: ""ความกตัญญูของข้าก็น่าจะเพียงพอแล้ว""
 ep3_landless_admin.1030.d.success: "ท่านโน้มน้าว [courtier.GetShortUIName] ได้"
 ep3_landless_admin.1030.d.failure: "[courtier.GetShortUIName] ไม่ประทับใจ"
 ep3_landless_admin.1030.e: ""อย่าเอาข้าไปเกี่ยวข้องกับเรื่องนี้""
 ep3_no_secrets_modifier: "ระแวดระวังความลับ"
 ep3_no_secrets_modifier_desc: "ตัวละครนี้ระมัดระวังเกี่ยวกับความลับของตนเองอย่างมาก"
 ep3_landless_admin.1040.t: "ผู้สืบทอดคนถัดไป"
 ep3_landless_admin.1040.desc.intro: "อากาศอบอวลไปด้วยกลิ่นดอกไม้ และข้าเดินอยู่ข้าง [spymaster.GetTitledFirstName] ผ่านลำธารสายเล็ก ๆ ที่ใสสะอาด\n\n"ท่านเคยคิดบ้างไหม [ROOT.Char.Custom('FormOfAddressForLiege')]? ว่า [rival.GetTitledFirstName] กำลังเข้าใกล้ [my_title.GetName] อย่างเป็นอันตราย บางคนว่า [rival.GetSheHe] ได้วางแผนกฤษฎีกาของ [rival.GetHerHis] ไว้แล้ว..."\n\n"แต่มันไม่จำเป็นต้องเป็น เช่นนั้น ข่าวลือมันหาได้ง่าย"\n\n"
 ep3_landless_admin.1040.desc.child: "ลูกของข้าเอง... ข้าจะกล้าทำ เช่นนั้นหรือ?"
 ep3_landless_admin.1040.desc.spouse: "คู่ครองของข้าเอง... ข้าสาบานว่าจะอยู่เคียงข้างท่านเสมอ"
 ep3_landless_admin.1040.desc.family: "เลือดเนื้อเชื้อไขของข้า... ข้าไม่ควรปกป้องเจ้าหรือ?"
 ep3_landless_admin.1040.a: ""ข่าวลือ! หากไม่ใช่สิ่งที่ข้าทำได้ดีที่สุด!""
 ep3_landless_admin.1040.b: ""อืม ช่างโชคร้าย ข้าจะไปอยู่ที่ห้องของข้า""
 ep3_landless_admin.1040.c: ""มันคุ้มค่าที่จะลอง""
 ep3_landless_admin.1040.d: ""แต่ท่านไม่ได้ยินหรือ... ว่า [rival.GetSheHe] นั้น #EMP ไม่เหมาะสม#!?""
 ep3_landless_admin.1040.d.success: "ท่านทำลายโอกาสของ [rival.GetShortUIName]"
 ep3_landless_admin.1040.d.failure: "อิทธิพลของท่านลดลง"
 ep3_landless_admin.1040.e: ""ปล่อยให้ชะตากรรมตัดสิน""
 ep3_landless_admin.1040.tt: "คะแนนผู้สมัครของ [rival.GetShortUINamePossessive] สำหรับ [my_title.GetName] ลดลง #negative_value [EmptyScope.ScriptValue('appointment_score_medium_value')|0]#!"
 ep3_well_rested_modifier: "พักผ่อนอย่างดี"
 ep3_well_rested_modifier_desc: "ตัวละครนี้ตัดสินใจให้ความสำคัญกับการพักผ่อนมากกว่าการเมือง"
 ep3_landless_admin.1050.t: "อยู่ใต้เท้าเรานี่เอง"
 ep3_landless_admin.1050.desc.intro: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [servant.GetTitledFirstName] ตามข้ามา, เหงื่อไหลโทรมหน้าผากของ[servant.GetHerHis] ขณะที่เราเดิน "เหล่าคนงานได้ค้นพบอุโมงค์บางส่วนใต้"
 ep3_landless_admin.1050.desc.prison: "ห้องขังนักโทษ"
 ep3_landless_admin.1050.desc.servants: "ห้องพักคนรับใช้"
 ep3_landless_admin.1050.desc.wine: "ห้องเก็บไวน์"
 ep3_landless_admin.1050.desc.outro: "แผ่ขยายออกไปทุกทิศทาง"\n\nสิ่งที่ข้าเห็นนั้นน่าทึ่ง นี่ไม่ใช่สิ่งที่ช่างก่อสร้างคนใดของเราจะสร้างขึ้นได้\n\nมีบางสิ่งที่เก่าแก่กว่านั้นมากอยู่ในกำแพงเหล่านี้... หินที่เก่าแก่จนผุพัง"
 ep3_landless_admin.1050.a: "ใคร... ใครสร้างสิ่งนี้!?"
 ep3_landless_admin.1050.b: "คงจะน่าเสียดายหากมีใครหลงเข้าไปในนั้น..."
 ep3_landless_admin.1050.c: "เราไม่อาจเสี่ยงให้นักโทษของเราหนีออกไปได้"
 ep3_landless_admin.1050.c.success: "ท่านเสริมความแข็งแกร่งให้คุกของท่าน"
 ep3_landless_admin.1050.c.failure: "ความพยายามของท่านไม่เกิดผล"
 ep3_landless_admin.1050.d: "ต้องมีสมบัติอยู่ข้างล่างนั่นแน่!"
 ep3_landless_admin.1050.d.success: "ท่านพบบางอย่าง"
 ep3_landless_admin.1050.e: "เราสามารถใช้สิ่งนี้เพื่อสายลับ #EMP ของเรา#!..."
 ep3_landless_admin.1050.e.success: "ท่านเก็บกวาดเศษซากออกจากอุโมงค์"
 ep3_landless_admin.1050.f: "ปล่อยมันไว้อย่างนั้น"
 SCHEME_SECRET_DOMICILE_TUNNEL: "ท่านสามารถใช้อุโมงค์ลับของท่านได้: $VALUE|+0=$"
 ep3_secret_tunnels_abduct: "[schemes|E] [GetScheme('abduct').GetTypeName] ของท่านจะมี [success_chance|E] สูงขึ้น"
 ep3_tunnel_investigation_modifier: "การสำรวจอุโมงค์"
 ep3_tunnel_investigation_modifier_desc: "ตัวละครนี้ค้นพบอุโมงค์บางส่วนใต้คฤหาสน์ของตนและตัดสินใจที่จะสำรวจพวกมัน"
 ep3_tunnel_prison_modifier: "ไม่มีใครหนีรอด"
 ep3_tunnel_prison_modifier_desc: "ตัวละครนี้ได้เสริมความแข็งแกร่งให้คุกของตน"
 ep3_tunnel_servants_modifier: "ทางลัด"
 ep3_tunnel_servants_modifier_desc: "ตัวละครนี้ใช้อุโมงค์ใต้คฤหาสน์ของตนเป็นทางลัด"
