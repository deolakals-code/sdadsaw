l_english: 
 ep3_governor_yearly.8010.opening: "[governor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_governor_yearly.8010.desc: "ข้า แต่ [ROOT.Char.GetTitledFirstNameNoTooltip] ผู้ [ROOT.Char.Custom('ComplimentAdjective')] ข้าพเจ้าเห็นโอกาสที่จะส่งเสริมผลประโยชน์ของตระกูล [ROOT.Char.GetHouse.GetBaseName] เช่นเดียวกับตระกูล [governor.GetHouse.GetBaseName] ของข้าพเจ้า\n\nเพื่อแลกเปลี่ยนกับ"
 ep3_governor_yearly.8010.hook: "คำสัญญาที่ข้าพเจ้าอาจร้องขอได้ในอนาคต"
 ep3_governor_yearly.8010.candidacy: "การสนับสนุนการ แต่งตั้งข้าพเจ้าเหนือ [their_title.GetNameNoTier]"
 ep3_governor_yearly.8010.candidacy_heir: "การสนับสนุนการ แต่งตั้ง [their_title_receiver.GetFirstNamePossessive] [governor.Custom2('RelationToMeShort', SCOPE.sC('their_title_receiver'))] ของข้าพเจ้า เหนือ [their_title.GetNameNoTier]"
 ep3_governor_yearly.8010.influence: "การกล่าวถึงข้าพเจ้าในทางที่ดีในราชสำนัก"
 ep3_governor_yearly.8010.gold: "สินน้ำใจเล็กน้อยเพื่อแสดงไมตรีจิต"
 ep3_governor_yearly.8010.end: "ข้าพเจ้ายินดีที่จะเสียสละเป็นการตอบแทน"
 ep3_governor_yearly.8010.a: "บุญคุณต้องทดแทน"
 ep3_governor_yearly.8010.b: "เป็นข้อเสนอที่ดี หากสลับกัน"
 ep3_governor_yearly.8010.b.success: "[governor.GetSheHe|U] ยอมรับข้อเสนอของท่าน"
 ep3_governor_yearly.8010.b.failure: "[governor.GetSheHe|U] ไม่สนใจ"
 ep3_governor_yearly.8010.c: "ข้าไม่ต้องการสิ่งนี้"

 ep3_governor_yearly.8020.t: "อำนาจต่อรองในมณฑล"
 ep3_governor_yearly.8020.desc: "ท่ามกลางที่ดินผืนเล็ก หมู่บ้าน และเมืองต่างๆ ใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้าพเจ้า ที่ดินของตระกูล [estate_owner.GetHouse.GetBaseName] นับเป็นข้อยกเว้น\n\nทรัพย์สินส่วนตัวในนามของ [estate_owner.GetTitledFirstNamePossessive] ได้รับความคุ้มครองจากข้าพเจ้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] และความเมินเฉยอย่างถือสิทธิ์ของ [estate_owner.GetHerHis] ต่อความเอื้อเฟื้อของข้าพเจ้าอาจแปรเปลี่ยนเป็นความกตัญญูได้อย่างรวดเร็ว หากมีการหยิบยกความเป็นไปได้ที่จะถอนความคุ้มครองนั้นขึ้นมาอย่างแยบยล..."
 ep3_governor_yearly.8020.a: "การดูแลถนนหนทางให้ปลอดภัยนั้น #EMP ช่าง#! สิ้นเปลืองเหลือเกินในทุกวันนี้"
 ep3_governor_yearly.8020.success: "[estate_owner.GetSheHe|U] เข้าใจความนัยของท่าน"
 ep3_governor_yearly.8020.b: "ความพยายามอย่างยิ่งยวดของข้าพเจ้าสมควรได้รับรางวัลตอบแทน"
 ep3_governor_yearly.8020.c: "ความเมตตาของข้าพเจ้าในเรื่องนี้ควรได้รับการกล่าวถึงบ้าง"
 ep3_governor_yearly.8020.d: "ข้าไม่อาจทำลายที่ดินอันงดงาม เช่นนั้นได้"
 ep3_governor_yearly_8020_failure_tt: "หากพวกเขาปฏิเสธ:"
 ep3_governor_yearly.8020.failure: "[estate_owner.GetSheHe|U] ปฏิเสธข้อเรียกร้องของท่าน"
 ep3_governor_yearly.8020.reason: "การยอมรับขึ้นอยู่กับบุคลิกภาพของ [estate_owner.GetFirstNamePossessive] ส่วนหนึ่ง"

 ep3_governor_yearly.8030.t: "ความกรุณาโดยไม่ตั้งใจ"
 ep3_governor_yearly.8030.desc: "ครอบครัวของข้าพเจ้าและข้าพเจ้าได้โต้แย้งมานานแล้ว ต่อชาวบ้านและเจ้าหน้าที่ที่มาร้องเรียน อย่างค่อนข้างน่ากังขา ว่าการพัฒนาที่ดินของตระกูล [ROOT.Char.GetHouse.GetBaseName] ใน [estate.GetLocation.GetBaronyNameExplicitlyNoTooltip] นั้นเป็นประโยชน์ต่อทุกคนใน [estate.GetLocation.GetTitle.GetDeJureLiege.GetNameNoTier] หากไม่ รวมถึงทั้ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ทั้งหมด!\n\nด้วยโชคชะตาอันแปลกประหลาดใดที่ข้าพเจ้าไม่อาจบอกได้ — มันกลับกลายเป็นเรื่องจริง!"
 ep3_governor_yearly.8030.martial: "การปรากฏตัวของทหารยามของข้าพเจ้าได้ขับไล่โจรผู้ร้ายตามปกติไป ซึ่งการหายไปของพวกมันเป็นประโยชน์อย่างยิ่งต่อท้องถิ่นในวงกว้าง"
 ep3_governor_yearly.8030.agriculture: "การปรับปรุงเกษตรกรรมในที่ดินของข้าพเจ้าได้เป็นแรงบันดาลใจให้แก่ผู้ถือครองที่ดินรายย่อย ซึ่งความพยายามของพวกเขาเป็นประโยชน์อย่างยิ่งต่อท้องถิ่นในวงกว้าง"
 ep3_governor_yearly.8030.commerce: "โอกาสทางการค้าได้นำพาพ่อค้าจำนวนมากเข้ามา ซึ่งการปรากฏตัวของพวกเขาเป็นประโยชน์อย่างยิ่งต่อท้องถิ่นในวงกว้าง"
 ep3_governor_yearly.8030.fallback: "การขยายตัวของที่ดินได้ดึงดูดช่างฝีมือทุกประเภท ซึ่งการปรากฏตัวของพวกเขาเป็นประโยชน์อย่างยิ่งต่อท้องถิ่นในวงกว้าง"
 ep3_governor_yearly.8030.a: "ฟังดูเหมือน #EMP ผลกำไร#! ที่รอการเก็บเกี่ยว"
 ep3_governor_yearly.8030.b: "การพัฒนาท้องถิ่นควรได้รับการส่งเสริม"
 ep3_governor_yearly.8030.c: "เป็นเรื่องบังเอิญที่เป็นมงคล เสียที"

 ep3_governor_yearly.8040.t: "สิ่งรบกวนใจจากวงศ์ตระกูล"
 ep3_governor_yearly.8040.desc: "[complainant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', complainant)] ของข้าพเจ้า [complainant.GetTitleAsNameNoTooltip|l] แห่ง [complainant.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [complainant.GetPrimaryTitle.GetNameNoTier] ได้เดินทางมาถึง [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] พร้อมกับปัญหา 'เร่งด่วน'\n\n"[complainant.Custom2('RelationToMeShort', ROOT.Char)] ของข้าพเจ้า ข้ารู้ว่าท่านต้องดูแลกิจการของตนเอง เช่นเดียวกับกิจการของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] แต่ข้าเกรงว่าที่ดินของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] จะดึงความสนใจ — และเงินทุน — ของท่านไปจาก [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] มากเกินไป..."\n\n"มีงานมากพอแล้วในการจัดการกิจการในมณฑลของท่าน โดยไม่ต้องมีภาระเพิ่มเติมจากที่ดินของท่าน""
 ep3_governor_yearly.8040.a: "ข้าคิดว่า [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้าคงต้องการความใส่ใจมากขึ้น"
 ep3_governor_yearly.8040.b: "โอ้ ได้โปรดเถอะ [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] แทบจะจัดการตัวเองได้อยู่แล้ว!"
 ep3_governor_yearly.8040.c: "บางที #EMP ท่าน#! ควรจะรับช่วงต่องานที่หย่อนยานไปนะ [complainant.GetTitleAsNameNoTooltip]"
 ep3_governor_yearly.8040.d: "ท่านกำลัง #EMP บอกเป็นนัย#! ว่าข้าไร้ความสามารถเกินกว่าจะจัดการทั้งสองอย่างหรือ?"
 ep3_governor_yearly.8040.d.success: "ท่านจัดการดูแลทุกอย่างได้"
 ep3_governor_yearly.8040.d.failure: "ท่านไร้ความสามารถเกินกว่าจะจัดการทั้งสองอย่าง"

 ep3_governor_yearly.8050.t: "ศัตรูประชิดประตูเมือง"
 ep3_governor_yearly.8050.desc: "ตั้งแต่ข้าราชการชั้นผู้น้อยไปจนถึง [war_liege.GetTopLiege.GetTitleAsNameNoTooltip] [war_liege.GetHerselfHimself] ทั้ง [war_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ทั้งหมดต่างทุ่มเทเพื่อปกป้อง [target_title.GetBaseNameNoTier] จาก [war_attacker.GetPrimaryTitle.GetDefinitiveName] ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetAdjective] ภัยคุกคามนี้เป็นจริงอย่างยิ่งยวด —"
 ep3_governor_yearly.8050.kingdom: "ภาระการป้องกันส่วนใหญ่ของภูมิภาคตกอยู่กับข้าพเจ้า"
 ep3_governor_yearly.8050.neighbour: "หากไม่ถูกยับยั้ง ผู้รุกรานอาจบุกเข้ามายัง [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier] ต่อไป"
 ep3_governor_yearly.8050.end: "\n\nข้าพเจ้าทำหน้าที่ของตน จัดกำลังพลประจำป้อมปราการ ซ่อมแซมป้อมปราการ เกณฑ์ทหาร แต่ยังสามารถทำอะไรได้มากกว่านี้ ความช่วยเหลือใดๆ น่าจะได้รับการชื่นชมอย่างยิ่งใน [war_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_governor_yearly.8050.a: "กองทัพของจักรวรรดิต้องการกำลังพลทั้งหมดที่เราสามารถรวบรวมได้!"
 ep3_governor_yearly.8050.b: "การป้องกันของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] ยังขาดแคลน..."
 ep3_governor_yearly.8050.c: "...และ #EMP ถึงคราวอวสาน#! หากปราศจากทรัพยากรเพิ่มเติม"
 ep3_governor_yearly.8050.d: "ทุกอย่างอยู่ภายใต้การควบคุม"

 ep3_governor_yearly.8060.t: "คลังสมบัติอันเย้ายวน"
 ep3_governor_yearly.8060.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] กลไกทางราชการของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] อยู่ภายใต้การกำกับดูแลของข้าพเจ้า แต่เพียงผู้เดียว — แม้กระทั่งคลังสมบัติที่ไม่สะดุดตาในใจกลาง [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]\n\nข้าราชการชั้นผู้น้อยเข้าออกสถานที่แห่งนี้ตลอดเวลา แลกเปลี่ยนทองคำของจักรวรรดิกับใบเสร็จรับเงินและขนย้ายไปจ่ายค่าจ้างทหารรักษาการณ์ ซ่อมแซมอาคาร เลี้ยงดูคนยากจน... [ROOT.Char.GetFaith.HighGodName] ทรงทราบดีว่ามีอะไรอีกบ้าง\n\nในฐานะ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! ความต้องการ #EMP ของข้า#! และของ [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] นั้นเป็นสิ่งเดียวกัน... ใช่หรือไม่?"
 ep3_governor_yearly.8060.a: "คงไม่มีใครสังเกตเห็นการเบิกจ่ายเพิ่มเติมบางส่วน"
 ep3_governor_yearly.8060.b: "ตัวเลขผิดพลาด การปัดเศษ สิ่งเหล่านี้เกิดขึ้นได้..."
 ep3_governor_yearly.8060.c: "และ ดังนั้น ความต้องการของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] จึงเป็น #EMP ของข้า#! ที่จะแบ่งปัน"
 ep3_governor_yearly.8060.d: "เหล่าข้าราชการรู้ดีว่าพวกเขากำลังทำอะไร"
 ep3_governor_yearly.8060.a.success: "การหายไปนั้นไม่มีใครสังเกตเห็น"
 ep3_governor_yearly.8060.a.failure: "มีคนสังเกตเห็นเหรียญที่หายไป"
 ep3_governor_yearly.8060.a.failure_tt: "@warning_icon! #N ที่อยู่ของ [gold|E] จะถูกตั้งคำถาม#!"
 ep3_governor_yearly.8060.embezzle_tt: "คลังสมบัติถูกปล้น"
 ep3_governor_yearly.8060.efficiency_tt: "เป็นเวลา 10 ปี: ประสิทธิภาพ [governor|E]: #N -5%#!"
 ep3_otherwise_tt: "มิฉะนั้น:"

 ep3_governor_yearly.8062.desc: "เมื่อ [complainant.GetHerHis] ขอพบเพื่อหารือเรื่อง #EMP บัญชี#! เป็นครั้งแรก ข้าก็รู้ตัวแล้ว ข้าพยายามบ่ายเบี่ยง [complainant.GetHerHim] แต่ในที่สุดก็ตกลงที่จะพบกับ [complainant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', complainant)] ของข้า\n\n[complainant.GetSheHe|U] อธิบายให้ข้าฟังทั้งหมด ทองคำที่หายไป รายการที่ไม่ถูกต้อง ใบเสร็จที่หายไป... ในที่สุด [complainant.GetSheHe] ก็สรุปว่า "ข้าไม่เข้าใจเลย คำอธิบายเดียวคือข้าราชการขี้ขโมย!"\n\n[complainant.GetSheHe|U] ครุ่นคิดอยู่ครู่หนึ่ง มองไปรอบๆ โถงของข้า จากนั้นก็มองข้าอย่างแปลกๆ และซ่อนความตกใจของ [complainant.GetHerHis] พลางขยับปากว่า: "เว้น แต่...""
 ep3_governor_yearly.8062.a: "เรื่องทั้งหมดนี้สามารถอธิบายได้"
 ep3_governor_yearly.8062.a.success: "[complainant.GetSheHe|U] ยอมรับข้อแก้ตัว"
 ep3_governor_yearly.8062.a.failure: "[complainant.GetSheHe|U] เปิดโปงการทุจริตของท่าน"
 ep3_governor_yearly.8062.b: "ไม่จำเป็นต้องแพร่งพรายเรื่องนี้ออกไป"
 ep3_governor_yearly.8062.b.success: "[complainant.GetSheHe|U] เข้าใจความนัย"
 ep3_governor_yearly.8062.b.failure: "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.c: "นี่ รับส่วนแบ่งของท่านไป แล้วเงียบซะ"
 ep3_governor_yearly.8062.c.success: "[complainant.GetSheHe|U] รับสินบน"
 ep3_governor_yearly.8062.c.failure: "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.d: "เป็นความผิดพลาดง่ายๆ ทองคำจะถูกส่งคืน..."

 ep3_governor_yearly.8070.t: "งานของผู้ว่าการ"
 ep3_governor_yearly.8070.desc: "เกียรติยศ, ศักดิ์ศรี, อำนาจ การเป็น [ROOT.Char.GetTitleAsNameNoTooltip] อาจมอบสิ่งเหล่านี้ให้ แต่มันก็ #EMP มี#! ต้นทุนที่ต้องจ่าย...\n\nกอง [ROOT.Char.Custom('GetWritingMaterial')] ดั่งภูเขาตั้งม้วนงอ รอคอยตราประทับหรือการเหลือบมองของข้า ในขณะที่เหล่าข้าราชการไม่รู้จบต่างแย่งชิงกันที่จะกรอกหูข้าด้วยรายละเอียดอันน่าเบื่อหน่าย\n\nไม่มีผู้ใดบอกข้าว่าจะมีงาน #EMP มากมาย#! ถึงเพียงนี้ — และยังเป็นงานที่ดูเหมือนว่าท้ายที่สุดแล้วก็จัดการตัวมันเองได้อีกด้วย"
 ep3_governor_yearly.8070.a: "ข้าสามารถจัดการทั้งหมดนี้ได้ เพียงแค่ต้องมีสมาธิ"
 ep3_governor_yearly.8070.b: "การจ้างคนช่วยคงจะแบ่งเบาภาระได้"
 ep3_governor_yearly.8070.c: "นี่เป็นงานสำหรับข้าราชการ ไม่ใช่สำหรับ #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!"

 ep3_governor_yearly.8080.t: "ผู้พิพากษาผู้มุ่งร้าย"
 ep3_governor_yearly.8080.desc: "ข้อกล่าวหาเรื่องการทุจริตได้เพิ่มสูงขึ้นเมื่อเร็วๆ นี้ใน [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] ซึ่งหลายคนได้ออกมาแสดงความคับข้องใจต่อหนึ่งในหัวหน้าผู้พิพากษา — [magistrate.GetWomanMan] ที่ชื่อ [magistrate.GetFirstName]\n\n[magistrate.GetSheHe|U] ถูกนำตัวมาต่อหน้าข้าพเจ้าเพื่อตอบข้อกล่าวหาเหล่านี้ ซึ่ง รวมถึงการเรียกร้องสินบนที่สูงเกินควรเพื่อแลกกับการปฏิบัติหน้าที่ขั้นพื้นฐานที่สุด\n\n"ขอเดชะ ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip]..." [magistrate.GetSheHe] พูดเสียงแหบ "นี่เป็นเพียงความเข้าใจผิด!"
 ep3_governor_yearly.8080.a: "เจ้าจะต้องชดใช้สินบนเหล่านี้ และถูกปลดออกจากตำแหน่ง"
 ep3_governor_yearly.8080.b: "สัตว์ร้าย เช่นเจ้าต้องการเครื่องยับยั้ง #EMP ที่แท้จริง#!"
 ep3_governor_yearly.8080.c: "เรื่องนี้อาจถูกมองข้ามไปได้ หากการจ่ายเงินนั้น... ถูกแจกจ่ายใหม่"
 ep3_governor_yearly.8080.d: "เจ้าจะชดใช้หนี้ด้วยการรับใช้ข้า... #EMP [magistrate.GetFirstNameNoTooltip]#!"

 ep3_governor_yearly.8090.t: "การเมืองอันมุ่งร้าย"
 ep3_governor_yearly.8090.desc: "วงจรการ แต่งตั้งและโยกย้ายตำแหน่งของจักรวรรดิที่หมุนเวียนอยู่ตลอดอาจ ทำให้ข้าพเจ้าได้ปกครอง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetAdjective] ในตอนนี้ แต่มันไม่ใช่ความลับที่ [old_holder.GetTitledFirstName] ปรารถนาให้มันกลับคืนสู่มือของตระกูล [old_holder.GetHouse.GetBaseName]\n\nแน่นอนว่าผู้ว่าการไม่มีสิทธิ์เรียกร้องตำแหน่งเดิมของตน — อย่างน้อยก็ในทางกฎหมาย — แต่การชักใยของ [old_holder.GetFirstNamePossessiveNoTooltip] ใน [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ยังคงสร้างความปวดหัว..."
 ep3_governor_yearly.8090.a: "สร้างเรื่องปัญหาที่ตระกูล [old_holder.GetHouse.GetBaseNameNoTooltip] ทิ้งไว้"
 ep3_governor_yearly.8090.a.success: "ตระกูล [old_holder.GetHouse.GetBaseNameNoTooltip] เสียหน้า"
 ep3_governor_yearly.8090.a.failure: "คำโกหกของท่านถูกปัดตกไป"
 ep3_governor_yearly.8090.b: "บางที [old_holder.GetSheHe] อาจจะพอพูดคุยกันได้"
 ep3_governor_yearly.8090.c: "ค่าชดเชยบางส่วนอาจ ทำให้ [old_holder.GetHerHim] เงียบลงได้"
 ep3_governor_yearly.8090.d: "ช่างเถอะ ปล่อยให้ [old_holder.GetWomanMan] ผู้นั้นทำสิ่งที่เลวร้ายที่สุดของ [old_holder.GetHerHis] ไป!"

 ep3_governor_yearly.8100.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของเพื่อนบ้านท่าน"
 ep3_governor_yearly.8100.desc: "ในบรรดาข้อความวันนี้จาก [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ข้าโกรธเกรี้ยวที่ได้รู้ว่า [governor.GetFirstName] [governor.GetTitleAsNameNoTooltip] แห่ง [governor.GetPrimaryTitle.GetTierAsNameNoTooltip] [governor.GetPrimaryTitle.GetAdjective] ที่อยู่ข้างเคียง กำลังป่าวประกาศอย่างเปิดเผยถึงความเหมาะสมของ [governor.Custom2('RelationToMePossessive',SCOPE.sC('neighboring_promoted_char'))] ของ[governor.GetHerHis] ต่อตำแหน่งของ #EMP ข้า#!\n\nดูเหมือนว่าไอ้[governor.Custom2('InsultNoun', ROOT.Char)]นั่นจะละโมบมณฑลของข้า และใช้เวลาใน แต่ละวันของ[governor.GetHerHis]ใน [governor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] วางแผนที่จะขับไล่ข้าออกจาก [ROOT.Char.Custom('FortifiedBuilding')] ของข้า..."
 ep3_governor_yearly.8100.a: "#EMP โอ้!#! เกมนี้เล่นกันสองคนได้!"
 ep3_governor_yearly.8100.b: "การวางแผนอันอุกอาจนี้ต้องถูกประณาม"
 ep3_governor_yearly.8100.c: "ห๊ะ? คนโง่นั่นปกครองอารามยังไม่ได้เลย"
 ep3_governor_yearly.8100.d: "แผนการเล็กน้อย เช่นนี้ต่ำกว่าศักดิ์ศรีของ [governor.GetTitleAsNamePossessiveNoTooltip]"

 ep3_governor_yearly.8110.t: "เพื่อนร่วมตำแหน่งผู้ชอบวิวาท"
 ep3_governor_yearly.8110.desc: "เมื่อเร็วๆ นี้มีข่าวลือมากมายเกี่ยวกับความไม่พอใจที่เพิ่มขึ้นระหว่างผู้ว่าการเพื่อนบ้านของข้าพเจ้า [governor_1.GetTitledFirstName] และ [governor_2.GetTitledFirstName] ซึ่ง แต่ละคนต่างวิพากษ์วิจารณ์ความสามารถและความประพฤติของอีกฝ่ายอย่างเปิดเผย\n\nนี่อาจเป็นโอกาสที่จะผลักดันผลประโยชน์ของข้าพเจ้าเอง ในขณะที่ตระกูล [governor_1.GetHouse.GetBaseName] และ [governor_2.GetHouse.GetBaseName] กำลังวอกแวก..."
 
 ep3_governor_yearly.8110.a: "ข่าวลือเท็จบางอย่างอาจ ทำให้เรื่องนี้บานปลายได้ง่าย"
 ep3_governor_yearly.8110.a.success: "ข่าวลือแพร่สะพัด"
 ep3_governor_yearly.8110.a.failure: "คำโกหกของท่านถูกสืบสาวได้"
 ep3_governor_yearly.8110.a.failure_tt: "[governor_1.GetFirstName] และ [governor_2.GetFirstName] สูญเสีย [opinion|E] ต่อท่าน #N 25#! คะแนน"
 ep3_governor_yearly.8110.b: "[governor_1.GetFirstNameNoTooltip] เป็นฝ่ายถูกอย่างชัดเจน"
 ep3_governor_yearly.8110.c: "ข้าปฏิเสธที่จะเชื่อคำพูดใดๆ ที่ต่อต้าน [governor_2.GetFirstNameNoTooltip]"
 ep3_governor_yearly.8110.d: "การเรียกร้องความสามัคคีจะเน้นย้ำความโง่เขลาของพวกเขา"
 ep3_governor_yearly.8110.d.tt: "[governor_1.GetFirstName] และ [governor_2.GetFirstName] สูญเสีย [opinion|E] ต่อท่าน #N 15#! คะแนน"

 ep3_governor_yearly.8120.t: "พระประสงค์ของ [ROOT.Char.GetFaith.HighGodName]"
 ep3_governor_yearly.8120.desc: "วันนี้ข้าพเจ้าได้รับข่าวร้ายเกี่ยวกับภัยพิบัติอันน่าสะพรึงกลัวใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้าพเจ้า:"
 ep3_governor_yearly.8120.earthquake: "แผ่นดินไหวขนาดเล็ก แต่รุนแรงได้ทำลายหมู่บ้านเล็กๆ รอบนอกของ [disaster_county.GetNameNoTierPossessive] จำนวนหนึ่ง"
 ep3_governor_yearly.8120.storm: "พายุที่รุนแรงได้ทำลายหมู่บ้านเล็กๆ รอบนอกของ [disaster_county.GetNameNoTierPossessive] จำนวนหนึ่ง"
 ep3_governor_yearly.8120.ending: "ทำลายบ้านเรือน อาคารสาธารณะ และชีวิต...\n\nข้าพเจ้าระลึกได้อย่างรวดเร็วว่า ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ข้าพเจ้าต้องรับผิดชอบต่อผู้คนและสถานที่เหล่านี้ในท้ายที่สุด"
 ep3_governor_yearly.8120.a: "ข้าจะดูแลการช่วยเหลือประชาชนด้วยตนเอง"
 ep3_governor_yearly.8120.a.success: "ความพยายามของท่านประสบผลสำเร็จ"
 ep3_governor_yearly.8120.a.failure: "ความพยายามนั้นล้มเหลวอย่างสิ้นเชิง"
 ep3_governor_yearly.8120.b: "ผู้ประสบภัยจะได้รับการสนับสนุน"
 ep3_governor_yearly.8120.c: "แม้จะเจ็บปวด แต่เราต้องยอมรับพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNamePossessive]"

 ep3_governor_yearly.8130.t: "ความโลภและโอกาส"
 ep3_governor_yearly.8130.desc: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ได้รับการ แต่งตั้งแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] ข้าพเจ้าเป็นเครื่องมือของ [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] โดยมีอำนาจเต็มที่เหนือระบบราชการของ [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] ไพร่ฟ้าข้าแผ่นดิน และแน่นอน #EMP ภาษี#!.\n\nเมื่อพิจารณาถึงการคลังของมณฑล ข้าพเจ้าก็นึกขึ้นได้ว่ามันอยู่ในขอบเขตอำนาจของข้าพเจ้าที่จะกำหนดภาษีเล็กน้อยใหม่ขึ้นกับประชาชน — เพียงเพื่อประโยชน์ของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] เท่านั้น แน่นอน..."
 ep3_governor_yearly.8130.a: "น่าเศร้าที่ #EMP การบริจาค#! เพิ่มเติมบางส่วน #EMP นั้น#! จำเป็น..."
 ep3_governor_yearly.8130.b: "การเก็บภาษีเล็กน้อยเป็นสิ่งที่จำเป็นเท่านั้น"
 ep3_governor_yearly.8130.c: "ผู้ขัดสนของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip] ต้องการความช่วยเหลือ"
 ep3_governor_yearly.8130.d: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ไม่ใช่กระเป๋าเงินส่วนตัวของข้า!"

 ep3_governor_yearly.8140.t: "ตรวจสอบตระกูล [estate_owner.GetHouse.GetBaseNameNoTooltip]"
 ep3_governor_yearly.8140.desc: "ชาวนาจาก [estate_county.GetNameNoTier] ถูกนำตัวมาหาข้าพเจ้า เพื่อเป็นตัวแทนของชุมชน [peasant.GetHerHis] ในการร้องเรียนมากมายต่อตระกูล [estate_owner.GetHouse.GetBaseName] ที่อยู่ใกล้เคียงใน [estate.GetLocation.GetBaronyNameExplicitly]\n\n"ขอพรของ [peasant.GetFaith.HighGodNamePossessive] จงมีแด่ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] เหล่าขุนนางในที่ดินท้องถิ่นได้ทำการปล้นสะดมที่ดินของเรา ปฏิเสธการเข้าถึงที่ดินส่วนรวม และเรียกร้องภาษี — ทั้งหมดนี้อยู่ภายใต้การข่มขู่ด้วยความรุนแรง!""
 ep3_governor_yearly.8140.a: "ช่างน่าขุ่นเคือง เรื่องนี้จะต้องได้รับการแก้ไข!"
 ep3_governor_yearly.8140.b: "ข้าจะไกล่เกลี่ยข้อตกลงสำหรับทั้งสองฝ่าย"
 ep3_governor_yearly.8140.c: "[estate_owner.GetTitledFirstNameNoTooltip] อาจทำตามที่ [estate_owner.GetSheHe] พอใจก็ได้ เจ้าชาวนา"
 ep3_governor_yearly.8140.d: "น่าเสียดาย แต่ไม่มีอะไรที่ข้าสามารถทำได้"

 ep3_governor_yearly.8150.t: "เดือดพล่านขึ้นมา"
 ep3_governor_yearly.8150.desc: "ความไม่พอใจครอบงำ [rebel_county.GetNameNoTier] และผู้คนก็กระสับกระส่ายมากขึ้นเรื่อยๆ ข้าพเจ้าจะเสียหน้าอย่างมากหาก [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ของข้าพเจ้าถูกคุกคามโดยการก่อความไม่สงบ...\n\n[marshal.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))] ของข้าพเจ้า อ่านรายงานเสียงดังอย่างเหนื่อยอ่อนเกี่ยวกับอาวุธที่ถูกขโมยไปจากคลังอาวุธเทศบาล การระงับภาษี และการโจมตีหน่วยลาดตระเวนที่ไม่ทันระวังตัว\n\n"ต้อง #EMP ทำอะไรสักอย่าง#! เกี่ยวกับพวกนี้"
 ep3_governor_yearly.8150.culture: "พวกก่อปัญหาชาว [targeting_faction.MakeScope.Var('faction_culture').Culture.GetName]!""
 ep3_governor_yearly.8150.faith: "พวกคลั่งศาสนา [targeting_faction.MakeScope.Var('faction_faith').Faith.GetName]!""
 ep3_governor_yearly.8150.peasant: "พวกชาวนาบ้านนอก ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip]!""
 ep3_governor_yearly_8150.end: "[marshal.GetSheHe] คำราม"
 ep3_governor_yearly.8150.a: "เพียงแค่ตัดหัวงูก็พอแล้ว [marshal.GetFirstNameNoTooltip]"
 ep3_governor_yearly.8150.a.success: "พวกเขาสงบลงอย่างรวดเร็ว"
 ep3_governor_yearly.8150.a.failure: "สินบนของท่านมี แต่จะ ทำให้พวกเขาโกรธเคือง"
 ep3_governor_yearly.8150.b: "การยอมผ่อนปรนเล็กน้อยสักหนึ่งหรือสองอย่าง แล้วพวกเขาก็จะกลับบ้านไป"
 ep3_governor_yearly.8150.c: "ใช่ ต้อง ทำให้เป็นเยี่ยงอย่าง"
 ep3_governor_yearly.8150.d: "พวกก่อปัญหาเหล่านี้จะเบื่อไปเองในไม่ช้า"
 ep3_governor_yearly.8150.d.tt: "จะได้รับ [regiments|E] [skirmisher|E] #V 2#! หน่วย เมื่อประกาศ [war|E]"
 ep3_governor_yearly.8150.county_tt: "ทุก [county|E] ของ [faction|E] [targeting_faction.GetName] และ [counties|E] ที่สามารถเข้าร่วมได้ ([SCOPE.ScriptValue('ep3_governor_yearly_8150_total_count_value')|V0])"
 ep3_governor_yearly_8150_troop_name: "การลุกฮือของชาวนา"
 cultural_acceptance_ep3_governor_yearly_8150_crackdown: "[governor|E] ปราบปรามกบฏท้องถิ่นอย่างรุนแรง"

 ep3_governor_yearly.8160.t: "การเข้าถึงอย่างเท่าเทียม"
 ep3_governor_yearly.8160.desc: "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] เป็นดินแดนของผู้คนหลากหลาย และความเชื่อมากมาย ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetAdjective] ข้าพเจ้าต้องรับผิดชอบต่อชาวต่างชาติและพวกนอกรีต เช่นเดียวกับ [ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip]\n\n[councillor.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] ของข้าพเจ้า ไม่ลังเลที่จะแสดงความเห็นว่า: "ระบบราชการเป็นขอบเขตของ"
 ep3_governor_yearly.8160.culture_end: "และการเรียกร้องใดๆ ให้ [minority_county.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] มีส่วนร่วมมากขึ้นจะต้องถูกกำจัดให้สิ้นซาก!""
 ep3_governor_yearly.8160.faith_end: "และการเรียกร้องใดๆ ให้ [minority_county.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] [councillor.Custom2('GetUnbelieverTerm', administrator)] มีส่วนร่วมมากขึ้นจะต้องถูกกำจัดให้สิ้นซาก!""
 ep3_governor_yearly.8160.a: "ตาข่ายที่ใหญ่กว่าย่อมจับปลาได้มากกว่า"
 ep3_governor_yearly.8160.b: "ท่านพูดถูก พวกเขาต้องรู้จักที่ทางของตน"
 ep3_governor_yearly.8160.culture_county_tt: "ทุก [county|E] ที่เป็น [minority_county.GetCountyData.GetCulture.GetName]"
 ep3_governor_yearly.8160.faith_county_tt: "ทุก [county|E] ที่เป็น [minority_county.GetCountyData.GetFaith.GetAdjective]"
 ep3_governor_yearly.8160.culture_councillor: "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — และ [councillor.GetCulture.GetCollectiveNounNoTooltip] โดยธรรมชาติ —"
