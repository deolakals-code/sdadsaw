l_english: 
 ep3_laamps.8000.t: "ความจริง"
 ep3_laamps.8000.desc: "นับตั้งแต่ข้าก้าวเท้ากลับมายัง [claimed_land.GetName] อย่างผู้มีชัยครั้งแรก ข่าวการมาถึงของข้าก็แพร่สะพัดไปอย่างรวดเร็วในหมู่สามัญชน ทุกเมืองที่ข้าผ่าน ปฏิบัติต่อข้าราวกับว่าข้ายังคงเป็นผู้ปกครองดินแดนเหล่านี้ พวกเขามอบของขวัญและคำสรรเสริญให้ข้ามากมาย\n\nผู้คนประณามความชั่วร้ายของ [claim_holder.GetName] และขับขานบทเพลงถึงวันที่ข้าจะโค่นล้ม [claim_holder.GetHerHim] และฟื้นฟูความยุติธรรมและความดีงามกลับคืนสู่ดินแดน\n\n"
 ep3_laamps.8000.desc.outro.sinner: "ข้าสงสัยว่าพวกเขาจำได้จริงๆ หรือไม่ว่าข้าเคยเป็น เช่นไร..."
 ep3_laamps.8000.desc.outro: "แน่นอนว่า พวกเขาเพียง แต่ยืนยันความถูกต้องในการอ้างสิทธิ์ของข้า แต่การส่งเสริมพวกเขาอาจ ทำให้ [claim_holder.GetNameNoTooltip] มองข้าเป็นภัยคุกคามได้"
 ep3_laamps.8000.a: "ข้ามาที่นี่เพื่อทวงคืนสิ่งที่ข้าเป็นเจ้าของ!"
 ep3_laamps.8000.b: "การสนับสนุนของพวกเขาจะช่วยในการเดินทางของข้า"
 ep3_laamps.8010.t: "สหายผู้ภักดี"
 ep3_laamps.8010.desc: "ลูกสุนัขครอกล่าสุดจากคอกสุนัขถูกนำมาเสนอต่อหน้าข้า พวกมันเพิ่งหย่านมจากแม่ คลานไปมาพลางเห่าใส่โลกที่สดใหม่เบื้องหน้า ลูกสุนัขตัวหนึ่งที่ดูแข็งแรงและกำยำไม่สนใจสิ่งอื่นใด คลานตรงมาหาข้า ดวงตาเบิกกว้าง หางสะบัดไปโดนพี่น้องอย่างไม่ใส่ใจขณะจ้องมองข้าด้วยความพิศวงและชื่นชม"
 ep3_laamps.8010.a: "มานี่เถิด"
 ep3_laamps.8020.t: "การเดินทางแห่งชีวิต"
 ep3_laamps.8020.desc: "ขณะที่ข้ากำลังจะเข้านอน ข้าได้ยินเสียงเอะอะโวยวายดังมาจากบริเวณองครักษ์ของข้า ข้าแทบไม่เชื่อสายตาตัวเองเมื่อเห็น [wouldbe_companion.GetName] สมาชิกในราชสำนักของ [holder.GetFirstNamePossessive] เป็นต้นตอของความวุ่นวายนี้ ขณะที่ [wouldbe_companion.GetSheHe] กำลังโต้เถียงกับองครักษ์ของข้า\n\n[wouldbe_companion.GetSheHe|U] ร้องเรียกข้าจากสุดปลายค่าย\n\n"ได้โปรด ฟังข้าก่อน ท่าน [ROOT.Char.GetLadyLord]! ชีวิตในราชสำนักช่างน่าเบื่อ ข้าทนต่อไปอีกวันไม่ไหวแล้ว! ข้าปรารถนาจะร่วมเดินทางไปกับท่านบนเส้นทางอันไม่มีที่สิ้นสุดเบื้องหน้า หากท่านจะรับข้าไว้""
 ep3_laamps.8020.a: ""มากับข้าเถิด""
 ep3_laamps.8020.a.2: ""ข้าจะรับเจ้าไว้ แต่เจ้าต้องทำงานเพื่อสร้างความประทับใจ""
 ep3_laamps.8020.b: ""วิ่งกลับบ้านไปหานายของเจ้าเสีย""
 ep3_laamps.8030.t: "โอกาสทองเรื่องแร่"
 ep3_laamps.8030.desc: "[armorer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าในค่าย พลางขัด [artifact.GetName] ของข้า\n\n"ท่าน [ROOT.Char.GetLadyLord|U], [location.GetName] อุดมไปด้วยแหล่งแร่โลหะคุณภาพสูง ยิ่งใหญ่กว่าที่ข้าเคยเห็นมา หากท่านอนุญาต ข้ายินดีอย่างยิ่งที่จะปรับปรุง [artifact.GetNameNoTooltip] ของท่านด้วยวัสดุอันมีค่าเหล่านี้""
 ep3_laamps.8030.a: ""เป็นความคิดที่ดีเยี่ยม!""
 ep3_laamps.8030.a.win: "สิ่งประดิษฐ์ของท่านได้รับการปรับปรุง"
 ep3_laamps.8030.a.lose: "[armorer.GetFirstNameNoTooltip] ทำพลาด"
 ep3_laamps.8030.b: ""เพียงแค่ซ่อมแซมยุทโธปกรณ์ของข้า""
 ep3_laamps.8030.c: ""แร่ธาตุเหล่านี้ควรนำไปขาย!""
 ep3_laamps.8040.t: "อย่าแกว่งเท้าหาเสี้ยน"
 ep3_laamps.8040.desc: "เสียงกรีดร้องแหลมสูงฉุดข้าจากการหลับใหลกลับสู่ความมืดมิดยามค่ำคืน ข้าตามไปยังต้นตอของเสียง และพบ [frightened_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] หมอบตัวสั่นอยู่หน้ากระโจมของ [frightened_courtier.GetHerHis]\n\n"ท่าน [ROOT.Char.GetFirstName|U]! อย่าเข้าไปข้างใน มีหมาป่าอยู่ในเตียงข้า!"\n\nข้าเปิดผ้าใบกระโจมออกและพบหมาป่าตัวหนึ่ง ท้องของมันเต็มไปด้วยลูก มันคำรามและขู่ใส่ข้า ไม่ต้องสงสัยเลยว่ามันกลัวว่าข้าจะทำอะไรกับลูกในท้องของมัน"
 ep3_laamps.8040.a: "ข้าจะสังหารสัตว์ร้ายตัวนี้"
 ep3_laamps.8040.a.win: "ท่านสังหารหมาป่า"
 ep3_laamps.8040.a.lose: "ท่านถูกโจมตี"
 ep3_laamps.8040.b: "ลูกหมาป่าคงเป็นสัตว์เลี้ยงที่ดีเยี่ยม"
 ep3_laamps.8040.c: "ดูเหมือนจะเป็นจุดเริ่มต้นของคอกสุนัขใหม่ของเรา!"
 ep3_laamps.8040.d: "เราจะต้องหากระโจมใหม่"
 ep3_laamps.8050.t: "ไร้เพื่อนหรือการคุ้มครอง"
 ep3_laamps.8050.desc.intro: "ข้าถูกขัดจังหวะจากการเดินเล่นใกล้ [ROOT.Char.Custom('GetRandomCampBuilding')] โดยการเข้ามาของคนแปลกหน้าท่าทางประหม่า — [minority.GetWomanMan] ผู้แนะนำ [minority.GetHerselfHimself] ว่าชื่อ [minority.GetName] และเห็นได้ชัดว่าเป็นคนต่างถิ่นใน [ROOT.Char.GetCurrentLocation.GetName] เช่นเดียวกับข้า\n\n"ท่าน [ROOT.Char.GetLadyLord|U],"
 ep3_laamps.8050.desc.mid.samefaith: "ท่านและข้าต่างรู้ดีว่า [minority.GetFaith.GetAdherentNamePlural] ไม่เป็นที่ต้อนรับแถวนี้ ไม่ต้องสงสัยเลยว่าท่านเองก็คงเคยประสบกับอคติที่ผู้ศรัทธาใน [minority.GetFaith.HighGodNamePossessive|U] ต้องเผชิญในดินแดนเหล่านี้"
 ep3_laamps.8050.desc.mid.alsohated: "ท่านและข้าต่างรู้ดีว่าดินแดนเหล่านี้ไม่ต้อนรับผู้ที่นับถือศาสนาแตกต่างจากเหล่าขุนนาง"
 ep3_laamps.8050.desc.mid.fallback: "ข้ารู้สึกไม่สบายใจในดินแดนเหล่านี้ และข้า... ข้าหวังว่า [ROOT.Char.GetWomanMan] ผู้เจนโลก เช่นท่านอาจยินดีรับ [minority.GetFaith.GetAdherentName] ไร้บ้านคนนี้ไว้?""
 ep3_laamps.8050.desc.outro: "\n\nชั่วครู่หนึ่ง [minority.GetSheHe] หยุดนิ่ง เตรียมใจ [minority.GetHerselfHimself] สำหรับการปฏิเสธที่คาดไว้อย่างชัดเจน\n\n"ข้าเข้าใจหากท่านมีคนต้องดูแลมากเกินไปแล้ว แต่หากท่านจะรับข้าไว้ ข้าจะรับใช้ท่านอย่างภักดีตลอดชีวิตของท่าน""
 ep3_laamps.8050.a: "แน่นอน!"
 ep3_laamps.8050.b: "ช่วย [minority.GetHerHim] หาบ้านที่อื่น"
 ep3_laamps.8050.c: "ไปให้พ้น เจ้าคนจรจัด"
 ep3_laamps.8060.t: "ไม่เหลือแม้หยดเดียว"
 ep3_laamps.8060.desc: "ข้าอาบแดดทะเลทราย เพลิดเพลินกับช่วงเวลาแห่งความสงบเพียงครู่เดียวในวิถีชีวิตอันวุ่นวายที่ข้าเลือกเอง แต่แล้ว เสียงไม้หัก เสียงกรีดร้อง และเสียงน้ำกระเซ็นก็ ทำให้ใจข้าหล่นวูบ\n\nข้าเห็น [idiot.Custom2('MyCharacterIntroduction', ROOT.Char)] ยืนอยู่ข้างซากถังน้ำที่เปียกโชกและแตกเป็นเสี่ยง เห็นได้ชัดว่า [idiot.GetSheHe] ทำมันหล่นลงบนโขดหินแหลมคมขณะขนถ่าย และบัดนี้น้ำสำรองสุดท้ายของเราก็ซึมลึกลงไปในผืนทราย"
 ep3_laamps.8060.a: "เราต้องหาเพิ่มทันที!"
 ep3_laamps.8060.a.win: "ท่านพบบ่อน้ำพุ"
 ep3_laamps.8060.a.lose: "ท่านไม่พบสิ่งใด"
 ep3_laamps.8060.b: "เอาล่ะ ถึงเวลาที่เราต้องเริ่มรีไซเคิลแล้ว..."
 ep3_laamps.8060.c: ""[idiot.GetFirstNameNoTooltip|U]! เจ้าแก้ไขเรื่องนี้!""
 ep3_laamps.8060.c.win: "[idiot.GetFirstNameNoTooltip|U] พบน้ำ"
 ep3_laamps.8060.c.lose: "[idiot.GetFirstNameNoTooltip|U] ล้มเหลว"
 ep3_laamps.8060.d: "ถึงเวลาปล้นกองคาราวานท้องถิ่นแล้ว"
 ep3_laamps.8060.d.lose: "ท่านถูกจับได้!"
 ep3_laamps.8060.e: "เราจะต้องอยู่รอดต่อไปโดยไม่มีมัน"
 ep3_laamps.8070.t: "ผลไม้ต่างแดน"
 ep3_laamps.8070.desc: "ในการเดินทางนอกค่าย ข้าพบทุ่งโล่งในป่าที่อุดมไปด้วยผลเบอร์รี่หลากสีสันประดับอยู่ตามพุ่มไม้ พวกมันไม่เหมือนกับที่ข้าเคยเห็นมาก่อน ดูน่าอร่อยเย้ายวนใจ และคงใช้เวลาไม่ถึงชั่วโมงสำหรับผู้ติดตามของข้าในการเก็บพวกมันทั้งหมด\n\nนี่อาจเป็นของขวัญที่จำเป็นอย่างยิ่งจาก [ROOT.Char.GetFaith.CreatorName|U] หรือเป็นกลอุบายจาก [ROOT.Char.GetFaith.TricksterGodName|U] ที่มีไว้เพื่อทดสอบเรา?"
 ep3_laamps.8070.a: "ข้าสงสัยว่า [forager.GetFirstNameNoTooltip] จะคิดอย่างไรกับเรื่องนี้"
 ep3_laamps.8070.b: "อ่า! ข้าจำผลไม้เหล่านี้ได้!"
 ep3_laamps.8070.c: "ชีวิตคือการผจญภัย แม้กระทั่งสำหรับกระเพาะอาหาร"
 ep3_laamps.8070.c.win: "ผลไม้อร่อยมาก"
 ep3_laamps.8070.c.lose: "ท่านกินยาพิษเข้าไป"
 ep3_laamps.8070.d: "เราควรอยู่รอดต่อไปโดยไม่มีพวกมัน"
 ep3_laamps.8080.t: "กะลาสีประหลาด"
 ep3_laamps.8080.desc.intro_sea: "เมื่อจอดเรือพักค้างคืน ข้าได้เดินทางไปยังโรงเตี๊ยมท้องถิ่น ที่ ซึ่งในไม่ช้าข้าก็พบว่าตนเองกำลังแลกเปลี่ยนเรื่องราวกับกะลาสีเฒ่าผู้แปลกประหลาดนามว่า [sailor.GetFirstNameNicknamed]\n\n"
 ep3_laamps.8080.desc.intro: "ข้าพบว่าตนเองใช้เวลาช่วงเย็นในโรงเตี๊ยมท้องถิ่น แลกเปลี่ยนเรื่องราวกับกะลาสีเฒ่าช่างพูด [sailor.GetFirstNameNicknamed]\n\n"
 ep3_laamps.8080.desc.outro: ""ท่านเล่านิทานของ [ROOT.Char.Custom('WomanManOpposite')] สินะ [ROOT.Char.Custom('FormOfAddressForLiege')]!" [sailor.GetSheHe] หัวเราะ ขัดจังหวะเรื่องเล่าอีกเรื่องของข้า "ดู [sailor.Custom('GetInjuredBodyPart')] เก่า ๆ ของข้าสิ! จะบอกให้ ครั้งหนึ่งเรือของข้ารั่ว ข้าต้องอุดมัน แต่ข้าไม่มีอะไรใช้อุดเลยนอกจากไอ้นี่!"\n\n"นั่นมันวันคืนอันรุ่งโรจน์ [ROOT.Char.Custom('FormOfAddressForLiege')] ใช่เลย..." [sailor.GetSheHe] คร่ำครวญ "และข้าก็โหยหาที่จะได้ใช้ชีวิตแบบนั้นอีกครั้ง...""
 ep3_laamps.8080.a: ""อ่าห้า! ท่านช่างอัจฉริยะ!""
 ep3_laamps.8080.b: ""เราต้องการกะลาสีเฒ่าสักคนในค่าย""
 ep3_laamps.8080.c: ""ท่านคิดว่า #EMP นั่น#! เป็นเรื่องที่ดีหรือ?""
 ep3_laamps.8080.c.win: "เรื่องเล่าของท่านสร้างความประทับใจ"
 ep3_laamps.8080.c.lose: "เรื่องเล่าของท่านไม่สามารถสร้างความประทับใจได้"
 ep3_laamps.8080.d: ""ไปให้พ้นข้า""
 ep3_laamps.8090.t: "ชายฝั่งอันไกลโพ้น"
 ep3_laamps.8090.desc.intro: "ข้าเดินเล่นผ่านตลาดของดินแดนแปลกประหลาดแห่งนี้ พ่อค้าแม่ค้ากวักมือเรียกด้วยภาษาต่างถิ่น และข้าหลงอยู่ในทะเลแห่งกลิ่นอายต่างแดน แต่แปลกที่ทั้งหมดนี้กลับรู้สึกเหมือนบ้าน\n\n"
 ep3_laamps.8090.desc.world_europe: "ที่ไหนอีกเล่าที่ข้าจะได้สัมผัสกลิ่นหอมสดชื่นของลาเวนเดอร์ หรือชมพระอาทิตย์ตกเหนือซากปรักหักพังของกรุงโรมโบราณ หรือฟังเสียงขับร้องประสานเสียงอันสนุกสนานของคณะนักร้องประสานเสียงในโบสถ์ หรือพักผ่อนในฤดูหนาวอันอบอุ่นข้างเตาผิงของคนแปลกหน้าที่เป็นมิตร? ไม่มีที่ไหนนอกจากยุโรป"
 ep3_laamps.8090.desc.world_middle_east: "การได้เห็นท้องฟ้าทะเลทรายที่เต็มไปด้วยดวงดาว การข้ามผืนทรายท่ามกลางอูฐคาราวาน การได้ยลความยิ่งใหญ่ของอารยธรรมที่เก่าแก่ที่สุดของมนุษย์ในไคโร แบกแดด เปอร์เซโปลิส ดินแดนใดเล่าจะอ้างได้ว่าเป็นศูนย์กลางของมวลมนุษยชาติหากไม่ใช่ที่นี่?"
 ep3_laamps.8090.desc.world_india: "ที่ไหนอีกเล่าที่ข้าจะได้ลิ้มรสความสมดุลอันละเอียดอ่อนของเครื่องเทศหอมกรุ่น และล้างคอด้วยมะม่วงปั่นแสนอร่อย? การได้ฟังท่วงทำนองอันอ่อนโยนของนักเล่นขลุ่ยบันซูรี หรือชมดอกบัวอันงดงามบานสะพรั่งริมฝั่งแม่น้ำคงคา? มีเพียงอินเดียเท่านั้น"
 ep3_laamps.8090.desc.world_africa: "ข้าได้ยินเสียงกลองอันไพเราะดังก้องไปทั่วตลาด เสียงสุนัขเห่าหอนในป่า และข้ารู้สึกว่าตนเองเริ่มเป็นส่วนหนึ่ง เท้าของข้าเหยียบย่ำบนผืนทรายต่างถิ่น และนกแปลกตาบินวนอยู่บนท้องฟ้า และในที่สุดข้าก็รู้สึกพึงพอใจ"
 ep3_laamps.8090.desc.world_steppe: "ที่ไหนอีกเล่าที่ [ROOT.Char.GetWomanMan] จะมีอิสระหากไม่ใช่บนทุ่งหญ้าสเตปป์ที่ทอดยาวสุดลูกหูลูกตาโดยไม่มีสิ่งใดนอกจากท้องฟ้าสีครามอันยิ่งใหญ่ของ [ROOT.Char.GetFaith.CreatorNamePossessive|U] อยู่เหนือ [ROOT.Char.GetHerHim]? ข้าเกือบจะรู้สึกว่าข้าสามารถวิ่งและขี่ม้าไปได้ตลอดชีวิต สัมผัสสายลมบนใบหน้า และหญ้าใต้ฝ่าเท้า และเพียงไล่ตามขอบฟ้าไปตลอดกาล"
 ep3_laamps.8090.desc.world_tibet: "ในระยะไกล ข้าได้ยินเสียงหาได้ยากของผู้คนขับขานจากลำคอ และรู้สึกปรารถนาที่จะเข้าร่วมขับร้องกับพวกเขา ความงามอันไม่มีที่สิ้นสุดของเทือกเขาหิมาลัยทอดยาวอยู่เบื้องหน้าข้า และข้ารู้สึกถูกกระตุ้นให้ออกค้นพบทุกรอยแยกที่ซ่อนอยู่และดินแดนลับแลในอุดมคติที่ซุ่มซ่อนอยู่ภายใน"
 ep3_laamps.8090.desc.world_burma: "ความร้อนที่เพิ่มสูงขึ้น ทำให้ทุกสิ่งรอบตัวเปล่งประกายราวกับสีรุ้งของนกยูง ชายหญิงขวักไขว่อยู่ใต้เจดีย์สูงตระหง่าน กลิ่นหอมของใบชาอบอวลและแผ่ซ่านไปตามถนนเหล่านี้ ผสมผสานกับไม้สักที่เพิ่งเลื่อยใหม่ๆ ก่อให้เกิดกลิ่นหอมอันมึนเมา ดวงอาทิตย์อยู่สูงเหนือหุบเขาที่แกะสลักโดยแม่น้ำอิรวดีอันยิ่งใหญ่ และวัฒนธรรมนับร้อยที่อาศัยอยู่ในนั้นต้อนรับข้าราวกับ [ROOT.Char.Custom('SisterBrother')] ที่หายไปนาน"
 ep3_laamps.8090.desc.world_asia_china: "ภูเขาสูงตระหง่านทอดเงาลงบนนาข้าวเบื้องล่าง อากาศเย็นชื้นปะทะใบหน้าขณะที่ข้าปัดยุงออกไป ข้าได้พบกับความอุดมสมบูรณ์ที่แท้จริงในหุบเขาแห่งนี้ และรู้สึกราวกับได้พบสวรรค์บนดินส่วนตัว"
 ep3_laamps.8090.desc.world_asia_japan: "เสียงคลื่นกระทบฝั่งดังเข้ามาในหู และเมื่อสูดหายใจลึก กลิ่นไอทะเลเค็มก็เต็มโพรงจมูกและปอดของข้า ความสงบแผ่ซ่านไปทั่วร่าง และข้าเปี่ยมไปด้วยความปรารถนาในชีวิต ข้าไม่ต้องการทำสิ่งใดนอกจากอยู่ในดินแดนแห่งนี้ แม้เพียงชั่วครู่ เพื่อซึมซับทุกสิ่ง"
 ep3_laamps.8090.desc.world_asia_korea: "ราวกับกระดูกสันหลังของโลก ข้าเห็นเทือกเขาทอดยาวสุดลูกหูลูกตา หิมะปกคลุมยอดเขา ผู้คนที่นี่ใจดีและมีน้ำใจ พวกเขาพยายามอย่างเต็มที่ เพื่อให้ข้ารู้สึกได้รับการต้อนรับ"
 ep3_laamps.8090.desc.world_asia_southeast: "ใบไม้หนาทึบช่วยบังแดดที่แผดเผาขณะที่ข้าชื่นชมทิวทัศน์อันงดงามเบื้องหน้า ข้าเห็นแมลงปอเกาะบนใบบัว และอดไม่ได้ที่จะนึกถึงการเดินทางของข้า ข้าคือแมลงปอตัวนั้น สถานที่แห่งนี้ช่างมีเอกลักษณ์และมหัศจรรย์อย่างแท้จริง และข้าได้ตกหลุมรักมันอย่างหมดใจ "
 ep3_laamps.8090.desc.outro: "\n\n[ROOT.Char.GetWomanMan] คนหนึ่งเดินผ่าน [county.GetNameNoTierNoTooltip] แต่ [ROOT.Char.GetSheHe] ยังคงเป็น [ROOT.Char.GetFirstNameNicknamed] อยู่หรือไม่?"
 ep3_laamps.8090.a: "[ROOT.Char.GetWomanMan] คนหนึ่งจะเป็นทั้ง [ROOT.Char.GetCulture.GetNameNoTooltip] #EMP และ#! [county.GetCountyData.GetCulture.GetNameNoTooltip] ไม่ได้หรือ?"
 ep3_laamps.8090.b: "ไม่ว่าข้ากำลังจะเป็นใคร [ROOT.Char.GetSheHe] จะต้องยอดเยี่ยม!"
