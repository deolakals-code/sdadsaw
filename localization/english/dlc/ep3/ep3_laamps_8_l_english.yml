 laamp_prepping_for_invasion: "วีรบุรุษชาวบ้าน"
 laamp_prepping_for_invasion_desc: "ชาวนาเริ่มมองว่าตัวละครนี้เป็นวีรบุรุษชาวบ้านที่จะช่วยพวกเขาให้พ้นจากภาษีที่สูงและการปกครองแบบเผด็จการ"
 laamps_8090_preparing_invasion: "เตรียมการรุกราน"
 laamps_8090_preparing_invasion_desc: "ตัวละครนี้กำลังเตรียมการรุกรานดินแดนต่างชาติและสร้างบ้านใหม่ให้แก่ผู้คนของตนที่นั่น"
 laamp_familiar_lands: "ดินแดนที่คุ้นเคย"
 laamp_familiar_lands_desc: "ตัวละครนี้กำลังเพลิดเพลินกับการสนับสนุนจากชาวนาในดินแดนที่พวกเขาเดินทางผ่าน"
