 #Legitimist

 laamp_legitimist_support_contract: "การสนับสนุนผู้ทวงสิทธิ์อันชอบธรรม"
 laamp_legitimist_support_contract_contract: "$laamp_legitimist_support_contract$"
 laamp_legitimist_support_contract_desc_title: "ถึงทายาทผู้ชอบธรรม,"
 laamp_legitimist_support_contract_desc: "ข่าวเกี่ยวกับสิทธิ์อันชอบธรรมของท่านได้แพร่กระจายไปไกลและกว้าง และได้สร้างโอกาสในการหารือเกี่ยวกับการสนับสนุนของเรา"
 laamp_legitimist_support_contract_request: "ท่านได้รับเชิญมาปรากฏตัวต่อหน้าเรา ณ ที่นี้ เราจะพูดคุยกันว่าเราจะสามารถช่วยเหลือท่านในภารกิจอันชอบธรรมของท่านได้อย่างไร เรามั่นใจว่าเราจะบรรลุความเข้าใจเกี่ยวกับการสนับสนุนอันยิ่งใหญ่ที่เราสามารถมอบให้ได้ และการชำระเงินเพียงเล็กน้อยที่เราจะเก็บในอนาคต"


 ep3_laamps.8101.t: "$laamp_legitimist_support_contract$ — การอ้างสิทธิ์ที่มากเกินไป"
 ep3_laamps.8101.desc: ""ยินดีต้อนรับ อา ยินดีต้อนรับ ดีใจเหลือเกินที่ท่านมา" [petitioned_ruler.GetName] กล่าว ขณะที่ข้าถูกนำตัวเข้ามาอย่างลับๆ ต่อหน้า [petitioned_ruler.GetHerHim]\n\n"เรามีเรื่องต้องหารือกันมากมาย แต่ก่อนอื่น ให้เราตัดสินใจเรื่องการเลือกเป้าหมายความพยายามของท่านก่อน ดูเหมือนว่าท่านจะมีการอ้างสิทธิ์ในตำแหน่งต่างๆ หลายตำแหน่ง และ ในขณะที่เราปรารถนาจะเห็นท่านได้ครอบครองทั้งหมดในที่สุด เราต้องเริ่มต้นด้วยเป้าหมายที่ชัดเจน เกรงว่าความพยายามของท่านจะสูญเปล่าไปกับการไล่ตามหางนกหลายตัวพร้อมกัน\n\nข้าได้ยินมาว่า [title_2.GetName] น่าอยู่มากในช่วงเวลานี้ของปี แต่แท้จริงแล้ว ทางเลือกเป็นของท่าน จะเลือกอันไหนดี หืม?""
 ep3_laamps.8101.a: "[title_1.GetName]"
 ep3_laamps.8101.a.desc: "ตัวเลือกนี้ไม่สามารถเปลี่ยนแปลงได้ในภายหลัง การเจรจาเพิ่มเติมกับผู้สนับสนุนรายอื่นก็จะมุ่งเป้าไปที่ตำแหน่งนี้ เช่นกัน"
 ep3_laamps.8101.b: "[title_2.GetName]"
 ep3_laamps.8101.c: "[title_3.GetName]"
 ep3_laamps.8101.d: "[title_4.GetName]"

 ep3_laamps.8102.t: "$laamp_legitimist_support_contract$ — บทนำ"
 ep3_laamps.8102.desc: ""เราสามารถเสนอทองคำและนักรบที่เก่งกาจที่สุดของเราให้ท่านได้ เพื่อแลกกับ สมมติว่า ครึ่งหนึ่งของรายได้ประจำปีของ [claimed_title.GetName]" [petitioned_ruler.GetName] เห็นได้ชัดว่าไม่ต้องการเสียเวลา\n\n"เราแทบรอไม่ไหวที่จะได้เห็นศีรษะของ [claimed_title.GetHolder.GetName] เสียบอยู่บนหอก โอ้ และโปรดอย่า ทำให้เราเบื่อหน่ายจนเกินไปเมื่อท่านร้องขอเพิ่มอย่างหลีกเลี่ยงไม่ได้ ความเมตตาของเรามีขีดจำกัด"\n\n#italic ท่านจะมีเวลา [ROOT.Var('legitimist_turns').GetValue] ตาในการเจรจารายละเอียดของข้อตกลง"
 ep3_laamps.8102.a: ""สิ่งที่สำคัญที่สุด ใต้ฝ่าบาท...""
 ep3_laamps.8102.a.desc: "ท่านจะเริ่มการเจรจาโดยไม่ร้องขอเพิ่มเติม"
 ep3_laamps.8102.b: "ทำให้ [petitioned_ruler.GetHerHim] ตะลึงในความเฉลียวฉลาดของท่าน"
 ep3_laamps.8102.b.desc: "ท่านจะเริ่มการเจรจาด้วยระดับการสนับสนุนที่เพิ่มขึ้น"
 ep3_laamps.8102.c: "ทำให้ [petitioned_ruler.GetHerHim] สับสนด้วยคำพูดไร้สาระ"
 ep3_laamps.8102.c.desc: "ท่านจะได้รับตาเพิ่มในการเจรจากับ [petitioned_ruler.GetName]"
 ep3_laamps.8102.d: "เวลาระหว่างมิตรสหายไม่เคยสูญเปล่า!"
 ep3_laamps.8102.d.desc: "$ep3_laamps.8102.c.desc$"
 ep3_laamps.8102.e: ""ให้เราชำระหนี้เก่าก่อน""
 ep3_laamps.8102.e.desc: "$ep3_laamps.8102.b.desc$"
 ep3_laamps.8102.b.success: "ท่านโน้มน้าว [petitioned_ruler.GetShortUIName] ได้สำเร็จ"
 ep3_laamps.8102.b.failure: "ท่านเสียตาในการเจรจาไปหนึ่งตา"

 ep3_laamps.8103.t: "$laamp_legitimist_support_contract$ — การอภิปราย"
 ep3_laamps.8103.intro_1: "[petitioned_ruler.GetName] ขยับตัวบนเก้าอี้ของ [petitioned_ruler.GetHerHis] สายตาของ [petitioned_ruler.GetHerHis] จ้องมองทะลุตัวท่าน\n\n"
 ep3_laamps.8103.intro_2: "บรรยากาศตึงเครียด เพราะเดิมพันสูง จากท่าทางของ [petitioned_ruler.GetNamePossessive] ท่านรับรู้ได้ว่าเรื่องนี้สำคัญต่อ [petitioned_ruler.GetHerHim] เพียงใด\n\n"
 ep3_laamps.8103.intro_3: "เทียนถูกเปลี่ยนเล่มใหม่ เครื่องดื่มถูกเติม คนรับใช้ของ [petitioned_ruler.GetNamePossessive] จากไปโดยไม่มีคำพูดที่ไม่จำเป็น เพราะผู้เป็นนายกำลังจะสนทนากัน\n\n"
 ep3_laamps.8103.no_more_turns_flavor: ""เราพูดคุยกันพอแล้ว" — [petitioned_ruler.GetSheHe] กล่าวอย่างเคร่งขรึม — "นี่คือข้อเสนอสุดท้ายของเรา ท่านสามารถแสดงปัญญาโดยการยอมรับมัน""
 ep3_laamps.8103.mid_1: ""เรามองว่านี่เป็นรากฐานสำหรับอนาคตอันสดใสรออยู่เบื้องหน้าเรา เราคาดว่าท่านมีความสามารถที่จะทำได้ ไม่ ทำให้ผิดหวัง และเราไม่เคยตัดสินผิดพลาดในเรื่อง เช่นนี้""
 ep3_laamps.8103.mid_2: ""ใช่ ใช่ สิ่งนี้ใช้ได้ ด้วยพระคุณของ [petitioned_ruler.GetFaith.HighGodNamePossessive] มันจะสำเร็จ! เหตุใดท่านจึงไม่มาหาเราเร็วกว่านี้? แน่นอนว่าท่านต้องปรับปรุงเรื่องจังหวะเวลา หากท่านต้องการประสบความสำเร็จ""
 ep3_laamps.8103.mid_3: ""ฮ่า! ข้าหวังว่าเราจะได้เห็นสีหน้าของ [claimed_title.GetHolder.GetName] เมื่อท่านเดินเข้าสู่ [capital_barony.GetNameNoTier] พร้อมกับกองทหารของเรา โปรดกรุณาให้ใครสักคนจดรายละเอียดทุกอย่างไว้ด้วย""
 ep3_laamp.8103.turns_left: "\n\n#italic ท่านเหลือตาในการเจรจาอีก #color_yellow [ROOT.Var('legitimist_turns').GetValue] #!ตา"
 ep3_laamps.8103.support_6: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow อย่างท่วมท้น#! - #color_yellow ทองคำ 1800 และทหารชั้นยอด 3000 นาย.#!"
 ep3_laamps.8103.support_5: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow อย่างมหาศาล#! - #color_yellow ทองคำ 1500 และทหารชั้นยอด 2500 นาย.#!"
 ep3_laamps.8103.support_4: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow จำนวนมาก#! - #color_yellow ทองคำ 1200 และทหารชั้นยอด 2000 นาย.#!"
 ep3_laamps.8103.support_3: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow อย่างมีนัยสำคัญ#! - #color_yellow ทองคำ 900 และทหารชั้นยอด 1500 นาย.#!"
 ep3_laamps.8103.support_2: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow พอประมาณ#! - #color_yellow ทองคำ 600 และทหารชั้นยอด 1000 นาย.#!"
 ep3_laamps.8103.support_1: "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] ได้สัญญาว่าจะให้การสนับสนุน #EMP #color_yellow ตามมาตรฐาน#! - #color_yellow ทองคำ 300 และทหารชั้นยอด 500 นาย.#!"
 ep3_laamps.8103.obligations: "\n#italic หลังจากยึด [claimed_title.GetName] ได้แล้ว ท่านจะต้องจ่าย #color_yellow [ROOT.Var('legitimist_obligations').GetValue] #!ครั้ง ทุกๆ สองปี แต่ละครั้งเป็นจำนวน #color_yellow ครึ่งหนึ่งของรายได้ประจำปีของท่าน.#!"
 ep3_laamps.8103.one_obligations: "\n#italic หลังจากยึด [claimed_title.GetName] ได้แล้ว ท่านจะต้องจ่าย #color_yellow ครึ่งหนึ่งของรายได้ประจำปีของท่าน.#!"
 ep3_laamps.8103.a: "ถึงกระนั้น ก็ยังต้องการมากกว่านี้"
 ep3_laamps.8103.a.desc: "ท่านจะได้รับการสนับสนุนในจำนวนที่สูงขึ้นในตอนนี้ แลกกับการชำระเงินเพิ่มเติมในภายหลัง"
 ep3_laamps.8103.b: "เกียรติยศมีค่ามากกว่าทองคำ!"
 ep3_laamps.8103.b.desc: "ท่านโน้มน้าว [petitioned_ruler.GetNameNoTooltip] ให้การสนับสนุนมากขึ้นโดยไม่ต้องเพิ่มการชำระเงินจากฝั่งท่าน"
 ep3_laamps.8103.b.success: "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.b.failure: "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.c: "ข้าไม่อาจรีดเลือดจากอาณาจักรของข้าจนแห้งเหือดได้!"
 ep3_laamps.8103.c.desc: "ท่านจะพยายามโน้มน้าว [petitioned_ruler.GetNameNoTooltip] ให้ลดจำนวนการชำระเงินลงหนึ่งครั้ง"
 ep3_laamps.8103.c.success: "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.c.failure: "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.d: "มัน... พอรับได้"
 ep3_laamps.8103.d.desc: "@warning_icon! #color_red ตัวเลือกนี้จะสิ้นสุดการเจรจา#!"

 ep3_laamps.8105.t: "$laamp_legitimist_support_contract$ — บทสรุป"
 ep3_laamps.8105.desc: "ผู้ปกครองสองคนติดอยู่ในการเจรจาอันดุเดือด คนหนึ่งมีมงกุฎอยู่บนขมับของ [petitioned_ruler.GetHerHis] ในขณะที่ขมับของข้ายังคงว่างเปล่า แต่มันคือความเหนื่อยล้าที่ข้ารู้สึก น้ำหนักที่เพิ่มขึ้นอย่างกะทันหันบนศีรษะของข้า หรือว่ามงกุฎของ [claimed_title.GetName] อยู่ใกล้แค่เอื้อมแล้ว?\n\nสีหน้าบูดบึ้งคงทรยศความคิดของข้า ขณะที่ [petitioned_ruler.GetName] ยิ้มอย่างรู้ทัน "ท่านจะเป็น [claimed_title.GetHolder.GetTitleAsNameNoTooltip] ที่ดี และในไม่ช้า — อย่างมากที่สุดสี่ปี กองทหารและทองคำของเราจะดูแลเรื่องนั้น และโปรดอย่ากังวล เราจะเตือนท่านหากท่าน... บังเอิญลืมส่วนของท่านในข้อตกลงของเรา"\n\n[petitioned_ruler.GetSheHe|U] ยกถ้วยของ [petitioned_ruler.GetHerHis] ขึ้น เป็นการดื่มอวยพรครั้งสุดท้ายเพื่อปิดผนึกข้อตกลง"
 ep3_laamps.8105.a: "ความอดทนเป็นกุญแจสำคัญในเรื่องการทหาร"
 ep3_laamps.8105.a.desc: "ท่านจะขอเวลาเพิ่มเพื่อเตรียมทำสงคราม"
 ep3_laamps.8105.a.success: "ท่านมีเวลา 8 ปีในการอ้างสิทธิ์ใน [claimed_title.GetName]"
 ep3_laamps.8105.a.failure: "ท่านมีเวลา 4 ปีในการอ้างสิทธิ์ใน [claimed_title.GetName]"
 ep3_laamps.8105.b: "แด่อนาคตของ [claimed_title.GetNameNoTooltip]!"
 ep3_laamps.8105.b.desc: "ท่านยอมรับเงื่อนไข $ep3_laamps.8105.a.failure$"
 ep3_laamps.8105.c: "นี่เป็นการเสียเวลาเปล่า"
 ep3_laamps.8105.c.desc: "@warning_icon! #color_red ท่านยกเลิกการเจรจา#! [petitioned_ruler.GetName] จะไม่สนับสนุนท่าน และจะคิดไม่ดีกับท่านอย่างแน่นอน"
 ep3_laamps.8105.invalidations_reasons: "@warning_icon! #color_red การได้ครอบครองดินแดนด้วยตำแหน่งอื่นที่ไม่ใช่ [claimed_title.GetName] หรือการเปลี่ยนวัตถุประสงค์ของค่ายจะยกเลิกข้อตกลง#! \nทายาทของ [petitioned_ruler.GetPrimaryTitle.GetName] จะสืบทอดภาระผูกพัน #weak อาจมีวิธีที่จะหลีกเลี่ยงการจ่ายเงิน..."

ep3_laamps.8106.t: "$laamp_legitimist_support_contract$ — เวลามาถึงแล้ว"
ep3_laamps.8106.desc: "หลายปีก่อน [petitioned_ruler.GetName] ได้มอบทหารและทองคำชั้นยอดให้แก่ข้า เพื่อช่วยข้าทวงคืนสิ่งที่ชอบธรรมของข้า\n\nบัลลังก์แห่ง [claimed_title.GetName] — ซึ่งถูกครอบครองโดยผู้ช่วงชิงอันชั่วร้าย [claimed_title.GetHolder.GetShortUIName]!\n\n[petitioned_ruler.GetShortUIName] คาดหวังให้ข้าลงมือในไม่ช้า และเริ่มหมดความอดทนมากขึ้นทุกวันที่ผ่านไป แต่กองกำลังของข้าพร้อมแล้วหรือยัง? ข้าได้รับการสนับสนุนเพียงพอแล้วหรือยัง? ผู้คนใน [claimed_title.GetName] ร่ำไห้รอคอยการกลับมาอย่างมีชัยของข้าเพียงพอแล้วหรือยัง?"
ep3_laamps.8106.a: "[claimed_title.GetHolder.GetShortUIName] จะได้ลิ้มรสเหล็กเย็น!"
ep3_laamps.8106.a.desc: "เราจะต้องลงมือ หากเราต้องการอยู่ในโลกที่แตกต่าง"
ep3_laamps.8106.b: "เวลายังไม่เหมาะสม"
ep3_laamps.8106.b.success: "$ep3_laamps.8102.b.success$"
ep3_laamps.8106.b.failure: "ภาระผูกพันของท่านเพิ่มขึ้น"
ep3_laamps.8106.b.desc: "ท่านจะมีเวลาอีก 2 ปีในการอ้างสิทธิ์ใน [claimed_title.GetName]"
ep3_laamps.8106.c: "ข้าเห็นโชคชะตาของข้าอยู่ที่อื่น"
ep3_laamps.8106.c.desc: "@warning_icon! ท่านผิดข้อตกลง [petitioned_ruler.GetName] จะ #EMP ไม่พอใจอย่างยิ่ง"

ep3_laamps.8107.t: "ถึง [ROOT.Char.GetFirstName] ผู้ไม่คู่ควรของเรา,"
ep3_laamps.8107.desc: "คำพูดใดๆ ก็ไม่อาจแสดงความผิดหวังที่เรามีต่อเจ้าได้ #EMP เจ้าหนอนบ่อนไส้#! เรามีอนาคตอันสดใสรออยู่เบื้องหน้า และเจ้าตัดสินใจที่จะละทิ้งมันทั้งหมด\nจงถือว่าเราไม่พอใจอย่างยิ่ง และตัวเจ้าเองก็เป็นเพียงหนอนแมลง โปรดมีไหวพริบพอที่จะหายไปจากโลกนี้อย่างเงียบๆ และน่าสมเพช"
ep3_laamps.8107.a: "โชคชะตามีแผนอื่น"
ep3_laamps.8107.a.desc: "ท่านล้มเหลวในการรักษาการอ้างสิทธิ์ใน [claimed_title.GetName]"

ep3_laamps.8108.t: "$laamp_legitimist_support_contract$ — ค่าตอบแทน"
ep3_laamps.8108.desc: "ช่างเป็นการมาถึง [claimed_title.GetName] อย่างมีชัยที่น่ายินดีเสียนี่กระไร! หลังจากใช้เวลาเดินทางบนถนนที่ไม่เอื้ออำนวยมานาน เป็นแขกในดินแดนต่างถิ่นเสมอมา ไร้บ้าน ไร้สิทธิ์อันชอบธรรม [claimed_title.GetTierAsNameNoTooltip] อันแสนหวานของข้า ในที่สุด ทุกอย่างก็ถูกต้อง อย่างที่ควรจะเป็นตั้งแต่แรก ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่\n\nอย่างไรก็ตาม มีหนามแหลมอยู่ในช่อดอกไม้นี้ [petitioned_ruler.GetName] ผู้ ซึ่งช่วยเหลือข้าอย่างมหาศาล เพื่อให้บรรลุเป้าหมายนี้ เรียกร้องให้ข้าจ่ายตามที่เราตกลงกันไว้เมื่อหลายปีก่อน แน่นอนว่า [ROOT.Char.GetHouse.GetNameNoTooltip] ผู้มีเกียรติย่อมชำระหนี้ของ [ROOT.Char.GetHerHis] เสมอ?"
ep3_laamps.8108.a: "[Glossary( 'สัญญาย่อมต้องเป็นสัญญา', 'PACTA_SUNT_SERVANTA_GLOSS' )]"
PACTA_SUNT_SERVANTA_GLOSS: "ภาษาละตินแปลว่า "สัญญาต้องเป็นสัญญา""
ep3_laamps.8108.payments_left: "เหลือการชำระเงินอีก #color_yellow [petitioned_ruler.MakeScope.Var('legitimist_obligations_left').GetValue] ครั้ง#!"
ep3_laamps.8108.no_payments_left: "นี่คือการชำระเงินครั้งสุดท้ายให้แก่ [petitioned_ruler.GetName]"
ep3_laamps.8108.b: "ข้าจะจ่าย แต่ไม่ใช่ตอนนี้"
ep3_laamps.8108.b.desc: "ท่านเลื่อนการชำระเงินไปปีหน้า ท่านยังคงต้องจ่ายตามจำนวนที่ตกลงกันไว้ในภายหลัง"
ep3_laamps.8108.b.success: "ท่านสร้างข้อโต้แย้งที่น่าเชื่อถือ"
ep3_laamps.8108.b.failure: "ข้อโต้แย้งของท่านถูกมองว่าเป็นข้อแก้ตัวที่แย่"
ep3_laamps.8108.c: "[petitioned_ruler.GetShortUINameNoTooltip] เจ้าคนโง่เง่า!"
ep3_laamps.8108.c.desc: "@warning_icon! ท่านจะไม่จ่ายแม้ แต่เหรียญแตกๆ ให้แก่ [petitioned_ruler.GetName] [petitioned_ruler.GetSheHe|U] น่าจะรู้ดีกว่านี้"
ep3_laamps.8108.legitimist_too_poor: "#italic เนื่องจาก [income|E] อันน้อยนิดของท่าน ท่านจึงจ่ายคืนเพียงจำนวนที่แน่นอนในแต่ละครั้ง: #color_yellow 300 #! [gold_i]"

ep3_laamps.8109.t: "ถึง [ROOT.Char.GetNameNoTooltip]"
ep3_laamps.8109.desc: "ความเศร้าโศก เช่นนี้เติมเต็มหัวใจของเรา ที่ [previous_ruler.GetName] อันเป็นที่รักของเราไม่ได้นั่งอยู่บนบัลลังก์อีกต่อไป ขอ [petitioned_ruler.GetFaith.HighGodName] อวยพรวิญญาณของ [previous_ruler.GetHerHis] อนิจจา ยังมีเรื่องการชำระเงินที่ยังค้างชำระสำหรับการสนับสนุนของเราในการนำ [previous_ruler.GetHerHim] ขึ้นสู่บัลลังก์ดังกล่าว เราหวังว่าท่านจะได้รับแจ้งเกี่ยวกับรายละเอียดแล้ว และท่านมีเกียรติพอที่จะรักษาคำพูดของท่าน"
ep3_laamps.8109.a: "$ep3_laamps.8108.a$"
ep3_laamps.8109.a.desc: "หนึ่งปีนับจากนี้ [petitioned_ruler.GetShortUIName] จะคาดหวังการชำระเงินครึ่งหนึ่งของรายได้ประจำปีของอาณาจักร"

ep3_laamps.8110.t: "$laamp_legitimist_support_contract$ — บทสรุปที่ไม่คาดคิด"
ep3_laamps.8110.desc_intro: "นานมาแล้ว มีการทำข้อตกลงกัน — [petitioned_ruler.GetName] ให้การสนับสนุนสำหรับการทวงคืน [claimed_title.GetName] ในรูปแบบของทหารและทองคำล่วงหน้า เพื่อแลกกับส่วนแบ่งรายได้จำนวนมากจากอาณาจักรของข้า\n\nอย่างไรก็ตาม [petitioned_ruler.GetSheHe] ไม่สามารถคาดการณ์ได้ว่า [petitioned_ruler.GetSheHe] "
ep3_laamps.8110.desc_war: "จะติดอยู่ในสงครามอันดุเดือดกับข้า"
ep3_laamps.8110.desc_imprisoned: "ถูกโยนเข้าไปในคุกใต้ดินของข้า"
ep3_laamps.8110.desc_killer_root: "ถูกสังหารด้วยมือข้า"
ep3_laamps.8110.desc_dead: "ได้จากโลกนี้ไปแล้ว"
ep3_laamps.8110.desc_unlanded: "ได้สูญเสียเกียรติยศและตำแหน่งไปแล้ว"
ep3_laamps.8110.desc_outro: "ก่อนที่หนี้จะได้รับการชำระคืนเต็มจำนวน ดูเหมือนว่าไม่มีใครอื่นที่สำคัญพอในอาณาจักรของ [petitioned_ruler.GetHerHis] ที่รู้รายละเอียดของข้อตกลง เป็นที่ชัดเจนแล้วตอนนี้ — จะไม่มีใครมาทวงหนี้\n\nเหตุการณ์พลิกผันที่แปลกประหลาด เกือบราวกับว่ามืออันชาญฉลาดของใครบางคนได้ชี้นำกระแสแห่งโชคชะตา"
ep3_laamps.8110.a: "ช่างยอดเยี่ยมอะไร เช่นนี้!"

ep3_laamps.8111.t: "การชำระเงินแก่ผู้ทวงสิทธิ์อันชอบธรรมที่กำลังจะมาถึง"
ep3_laamps.8111.desc: "ท่านจะต้องจ่าย [petitioned_ruler.GetShortUINameNoTooltip] เป็นจำนวน [TopScope.GetValue('incoming_payment_value')] [gold_i] ในอีก #color_yellow หก #! เดือน!"

request_laamp_legitimist_support: "ร้องขอการสนับสนุนผู้ทวงสิทธิ์อันชอบธรรม"
request_laamp_legitimist_support_interaction_desc: "ร้องขอคำเชิญเพื่อหารือเกี่ยวกับระดับและเงื่อนไขของการสนับสนุนสำหรับการอ้างสิทธิ์อันชอบธรรมของท่าน"
ep3_legitimist_army: "กองทัพผู้ทวงสิทธิ์อันชอบธรรม"
laamp_legitimist_support_contract_success: "หลังจากยอมรับ [task_contract|E] นี้และเดินทางไปยัง [recipient.GetCurrentLocation.GetName] ท่านจะสามารถเจรจาต่อรองได้ถึง #color_yellow ทองคำ 1800#! และ #color_yellow ทหารชั้นยอด 3000 นาย#! เพื่อแลกกับการชำระเงินจำนวนมากในภายหลัง"
laamp_legitimist_support_contract_failure: "การเจรจาล้มเหลว ท่านจะต้องขอความช่วยเหลือจากที่อื่น"
request_laamp_legitimist_support_already_supporting: "ตัวละครนี้กำลังสนับสนุนผู้ทวงสิทธิ์อันชอบธรรมอยู่แล้ว"
request_laamp_legitimist_have_claim_on_target: "ท่านมี [claim|E] ใน [realm|E] ของตัวละครนี้"
YOU_HAVE_HOOK_REASON: "ท่านมีบุญคุณต่อ [recipient.GetShortUINamePossessive|U]: $VALUE|=+0$"


ep3_laamps.8200.t: "ใบหน้าใหม่ในค่าย"
ep3_laamps.8200.desc_1: "ขณะที่ข้าพยายามประเมินการขนส่งสำหรับการเคลื่อนไหวครั้งต่อไปของเรา คนผ่านทางร่างสูงใหญ่คนหนึ่งยกเกวียนเล่มหนึ่งของเราขึ้นอย่างง่ายดาย ผู้ติดตามคนหนึ่งของข้าวิ่งมาหาข้าและอ้อนวอน:\n\n"ท่าน [ROOT.Char.Custom('MistressMaster')|U], [new_person.GetSheHe] ยกเกวียนทั้งเล่มขึ้นเหนือศีรษะของ [new_person.GetHerHis]! ให้ [new_person.GetSheHe] อยู่ต่อได้ไหม? [new_person.GetSheHe|U] ไม่จำเป็นต้องมีอาวุธด้วยซ้ำ [new_person.GetSheHe] สามารถคว้าและขว้างศัตรูของเราได้เลย!"\n\n[new_person.GetWomanMan] เช่นนี้อาจพิสูจน์ [new_person.GetHerselfHimself] ว่ามีประโยชน์ แบกสัมภาระของข้าได้ด้วย แต่ [new_person.GetSheHe|U] จะกินเสบียงมากทีเดียว"
ep3_laamps.8200.desc_2: "เสียงหัวเราะเดียวทำลายความมืดมนยามค่ำคืน จากนั้นก็มีอีกเสียง และข้าเห็นผู้ติดตามที่เคร่งขรึมของข้ากลายเป็นกลุ่มเด็กๆ ที่หัวเราะคิกคัก อะไร ทำให้เกิดความโกลาหลนี้?\n\n"อา ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip] ในที่สุดเราก็ได้พบกัน! ขอแนะนำตัวเอง ข้าคือ [new_person.GetName] ตัวตลกผู้ยอดเยี่ยม ข้าเคยแสดงให้ [location_top_liege.GetName] ผู้ยิ่งใหญ่ชม แต่ตอนนี้ข้าขอเสนอตัวเองให้ท่านและอารมณ์ขันของท่าน!""
ep3_laamps.8200.desc_3: "เราพักอยู่ใน [location.GetCulture.GetName] [location.GetTerrain.GetNameNoTooltip|l] ของ [location_county.GetNameNoTier] มาระยะหนึ่งแล้ว ชาวบ้านมาเยี่ยมค่ายของเราบ่อยครั้ง เพื่อค้าขาย หรือเพียงแค่มาป้วนเปี้ยน เมื่อเร็วๆ นี้ข้าเห็น [new_person.GetWomanMan] คนหนึ่งวนเวียนอยู่นานกว่าคนอื่นๆ\n\n"มีทั้งปีที่อดอยากและปีที่อุดมสมบูรณ์ที่นี่ใน [location_county.GetNameNoTier] และข้าคาดว่า ปีที่อดอยากกำลังจะกลับมา ข้าไม่ปรารถนาที่จะตายในที่ที่ข้าเกิด อยู่ที่นี่อีกต่อไป ข้าขอร้องอย่างนอบน้อม โปรดอนุญาตให้ข้าเข้าร่วมกลุ่มของท่าน ท่าน [ROOT.Char.GetLadyLord|U] ของข้า""
ep3_laamps.8200.a: "ยินดีต้อนรับ [new_person.GetFirstNameNoTooltip]!"
ep3_laamps.8200.b: "โปรดไปเสียเถิด"
ep3_laamps.8200.c: "ไปเสียและบอกต่อๆ กันไปว่า: อย่าเข้ามาใกล้!"
ep3_laamps.8200.c.tt: "ตัวละครจะไม่พยายามเข้าร่วมค่ายของท่านแบบสุ่มในอีก 20 ปีข้างหน้า"







