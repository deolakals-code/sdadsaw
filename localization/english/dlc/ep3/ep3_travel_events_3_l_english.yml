l_english: 

ep3_travel_events.3000.t: "ธาราแห่งจอร์แดน"
ep3_travel_events.3000.desc: "ผู้คนต่างกล่าวขานถึงความมหัศจรรย์ของ"

ep3_travel_events.3000.israel: "[Glossary( ''Ereṣ Yisrā'ēl', 'ERES_YISRAEL_GLOSS' )] ดินแดนอันชุ่มชื้นด้วยแม่น้ำจอร์แดนอันสูงส่ง ดุจดังสวนของ [ROOT.Char.GetFaith.HighGodName]\n\nณ สถานที่แห่งปาฏิหาริย์นี้ ข้าก้าวลงสู่ธารน้ำ อาบกายในที่ ซึ่งเอลีชาเคยรักษาคนโรคเรื้อน ที่ ซึ่งชาวอิสราเอลของโยชูวาได้ก้าวสุดท้ายสู่บ้านเกิด..."
ep3_travel_events.3000.greek_christian: "ปาเลสไตน์ ที่ ซึ่งทะเลทรายทุกแห่งคือ [Glossary( 'เอเรมอส', 'EREMOS_GLOSS' )] อันศักดิ์สิทธิ์ยิ่ง ทุกก้อนหินศักดิ์สิทธิ์ ทุกสายธารไหลสู่แม่น้ำจอร์แดน\n\nเมื่อก้าวลงสู่ธารน้ำนั้น ข้าอาบกายในที่ ซึ่งยอห์นผู้ให้บัพติศมาเคยประกอบพิธี ที่ ซึ่งพระคริสต์เองทรงรับบัพติศมา..."
ep3_travel_events.3000.christian: "ปาเลสไตน์ ดินแดนที่ผืนดินรับรู้ถึงรอยพระบาทของพระเจ้า ที่ ซึ่งแม่น้ำจอร์แดนอันยิ่งใหญ่รับรู้ถึงพระวรกายของพระองค์\n\nเมื่อก้าวลงสู่ธารน้ำนั้น ข้าอาบกายในที่ ซึ่งยอห์นผู้ให้บัพติศมาเคยประกอบพิธี ที่ ซึ่งพระคริสต์เองทรงรับบัพติศมา..."
ep3_travel_events.3000.muslim: "ปาเลสไตน์ ดินแดนแห่งชัยชนะอันยิ่งใหญ่ของอิสลาม ชุ่มชื้นด้วยแม่น้ำจอร์แดนอันสูงส่ง\n\nบัดนี้ข้าลุยลงสู่แม่น้ำนั้น แสวงหาการเริ่มต้นการชำระล้างร่างกาย เกือบจะอยู่ในสายตาของสถานที่พำนักของสหายแห่งศาสดา — ขอความสันติสุขจงมีแด่พวกเขา — สถานที่นี้เหมาะอย่างยิ่งสำหรับการปฏิบัติ [Glossary( 'ฮะดีษ', 'HADITHS_GLOSS' )] ของข้า..."
ep3_travel_events.3000.outro_rapture: "\n\nและ แม้ว่าจะมีพืชลื่นๆ อยู่ใต้ฝ่าเท้า ฟองขาวขุ่นที่พัดพามาตามกระแสน้ำโคลน — นี่ก็คู่ควรที่จะเป็นหนึ่งในสี่แม่น้ำแห่งสรวงสวรรค์! ข้าไม่เคยรู้สึกสะอาดเท่านี้มาก่อน"
ep3_travel_events.3000.outro: "\n\nและ — ดูเหมือนสกปรก! ผิวของข้าถูกลูบไล้อย่างเกียจคร้านด้วยความขุ่นมัวอุ่นๆ สีน้ำนม ตะไคร่น้ำผุดขึ้นมาระหว่างนิ้วเท้าของข้า ด้วยพิธีรีตองเพียงเล็กน้อย ข้าปีนกลับขึ้นไปบนตลิ่งโคลน"
ERES_YISRAEL_GLOSS: "#bold 'Ereṣ Yisrā'ēl#! คือการถ่ายทอดเสียงภาษาฮีบรูไทบีเรียนของคำว่า "ดินแดนแห่งอิสราเอล""
EREMOS_GLOSS: "#bold Eremos#! เป็นศัพท์ภาษากรีกที่ใช้อ้างอิงถึงสถานที่รกร้างที่เหมาะสำหรับความสันโดษเพื่อการใคร่ครวญ"
HADITHS_GLOSS: "#bold Hadiths#! คือชุดรวบรวมคำพูดและการกระทำที่เชื่อว่าเป็นของศาสดามูฮัมหมัด เป็นแหล่งคำแนะนำที่สำคัญสำหรับนิกายมุสลิมส่วนใหญ่"
ep3_travel_events.3000.a_christian: "น้ำศักดิ์สิทธิ์ที่สุด — สำหรับพิธีศีลจุ่มอันเป็นมงคล!"
ep3_travel_events.3000.a_jewish: "น้ำแห่งปาฏิหาริย์ ควรค่าแก่การเก็บรักษา!"
ep3_travel_events.3000.a_muslim: "อินชาอัลลอฮ์ สักสองสามหยดสำหรับการชำระล้างทุกครั้ง!"
ep3_travel_events.3000.b: "ถึงกระนั้น... ข้าก็ได้รับการชำระล้างด้วยธารน้ำแล้ว"
ep3_travel_events.3000.b_zealot: "ข้าได้รับการชำระล้างด้วยธารน้ำแล้ว!"
ep3_travel_events.3000.b.flavor: "ใช่ นั่นคือสิ่งที่ข้าจะบอกเล่า!"
ep3_travel_events.3000.c: "บางส่วนเข้าปากข้า! ข้าต้อง — #EMP *อ้วก!*#!"
ep3_travel_events.3000.c_zealot: "แต่ — #EMP *อ้วก!*#! — รสชาติมัน #EMP แปลกๆ#!..."
ep3_travel_events.3000.c_flavor: "ท่าน 'ปลดเปลื้องภาระ' ของท่านอย่างสุขุม"

holy_water_mortal_stomach_modifier: "น้ำศักดิ์สิทธิ์ กระเพาะปุถุชน"
holy_water_mortal_stomach_modifier_desc: "นับตั้งแต่ดื่มด่ำกับความปิติยินดีแห่งแม่น้ำจอร์แดน #EMP มากเกินไป#! ตัวละครนี้ก็ป่วยด้วยโรคระบาด"

artifact_water_of_the_jordan: "น้ำจากแม่น้ำจอร์แดน"
artifact_water_of_the_jordan_desc: "หยดน้ำศักดิ์สิทธิ์จากแหล่งน้ำอันเป็นมงคลที่หล่อเลี้ยงดินแดนศักดิ์สิทธิ์ แม่น้ำจอร์แดน สีน้ำตาลเล็กน้อย"

ep3_travel_events.3001.t: "ประตูซิลิเซียน"
ep3_travel_events.3001.intro: "เราดิ้นรนผ่านช่องเขาผู้พิทักษ์ ช่องเขาขรุขระระหว่างเอเชียและยุโรป เบื้องบน ในที่สูงที่ลมพัดแรง ท่ามกลางก้อนหิน สายตาของชาว [current_location.GetCulture.GetName] จับจ้องมาที่เรา"
ep3_travel_events.3001.greek: "\n\nเหล่า [Glossary( 'อคริไท', 'AKRITAI_GLOSS' )] ผู้พิทักษ์ประตูซิลิเซียนในป้อมปราการสูงของพวกเขา ไม่ได้ป้องกันการรุกรานที่ปล้นสะดมในสมัยเฮราเคลียนอีกต่อไป — ถึงกระนั้น พวกเขาก็ยังคงเฝ้าระวังศัตรูที่กำลังจะมาถึง ชนเผ่าเร่ร่อนที่บุกรุก และโจรปล้นเล็กๆ น้อยๆ ที่หลอกหลอนช่องเขาแคบๆ เหล่านี้"
AKRITAI_GLOSS: "คำภาษากรีก #boldakritai#! ซึ่งมาจากคำว่า #EMP akron#! หรือ "ชายแดน" หมายถึงทหารชายแดนที่บางครั้งได้รับการยกย่องว่าเป็นผู้พิทักษ์จากการรุกรานของ #EMP ghazi#! และบางครั้งถูกประณามว่าเป็นโจร"
ep3_travel_events.3001.friend: "\n\nว่ากันว่าผู้พิทักษ์ประตูซิลิเซียนเหล่านี้ ในป้อมปราการสูงของพวกเขา เคยป้องกันการหลั่งไหลของพวกนอกรีตที่ปล้นสะดม บัดนี้ พวกเขาเฝ้าระวังชนเผ่าเร่ร่อนที่บุกรุกและโจรปล้นเล็กๆ น้อยๆ แม้ว่าบางคนจะบอกว่าพวกเขาไม่ได้ดีไปกว่าโจรเองก็ตาม ถึงกระนั้น..."
ep3_travel_events.3001.islamic_arabic: "\n\nชายฉลาดแกมโกงและหยาบคายรบกวนประตูซิลิเซียน เหล่า [Glossary( 'อัล-ซูกูร์', 'AL_THUGHUR_GLOSS')] ในประวัติศาสตร์เหล่านี้ เฝ้าระวังเพื่อ [lords_liege.GetTitleAsName] [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] ในช่วงสมัยคอลีฟะฮ์รอชิดูนอันยิ่งใหญ่ กองทหารชายแดนได้ไล่ล่าผู้ถือศาสนาอิสลามที่นี่ — ผ่านเส้นทางแห่งการสังหารอันทุรกันดารนี้"
AL_THUGHUR_GLOSS: "#bold Al-thughūr#! เป็นคำพรรณนาภาษาอาหรับที่ใช้สำหรับเขตแดนซิลิเซียน เปรียบเทียบป้อมปราการและช่องเขาแคบๆ กับช่องว่างระหว่างฟัน"
ep3_travel_events.3001.foe: "\n\nชายฉลาดแกมโกงและหยาบคายรบกวนประตูซิลิเซียน เฝ้าระวังเพื่อ [lords_liege.GetTitleAsName] [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] จากป้อมปราการสูงของพวกเขา การซุ่มโจมตีพุ่งเข้าใส่ทั้งโจรและผู้บริสุทธิ์ที่น่าสงสาร — ทั้งหมดนี้อ้างว่าเป็นการป้องกันดินแดนใจกลาง"
ep3_travel_events.3001.praise_outro: "\n\nที่นี่ ทหารเกณฑ์ธรรมดาเพียงไม่กี่คนในป้อมเล็กๆ ที่ทรุดโทรมได้ปกป้องจักรวรรดิไว้"
ep3_travel_events.3001.distrust_outro: "\n\nขณะที่เราเดินทางต่อไป รูปร่างลับๆ ล่อๆ เลียนแบบความคืบหน้าของเราบนเนินเขา..."
ep3_travel_events.3001.a_greek: "จงสรรเสริญเหล่า #EMP อคริไท#! เถิด!"
ep3_travel_events.3001.a_non_greek: "สถานที่แห่งโชคชะตา"
ep3_travel_events.3001.b: "เป็นลางร้าย"

haunted_by_hostile_troops_modifier: "หลอกหลอนโดยกองทหารศัตรู"
haunted_by_hostile_troops_modifier_desc: "ตัวละครนี้ไม่สบายใจกับความทรงจำเกี่ยวกับสายตาที่จับจ้องในช่องเขาซิลิเซียน"

ep3_travel_events.3002.t: "ที่ ซึ่ง [local_lord.GetCulture.GetCollectiveNounNoTooltip] ปกครอง"

ep3_travel_events.3002.intro: "ศูนย์กลางอำนาจอยู่ใกล้: [local_lord_capital.GetProvince.GetHolding.GetType.GetName|l] แห่ง [local_lord_capital.GetName] ซึ่ง [local_lord.GetTitledFirstName] เฝ้ามอง [local_lord.GetCulture.GetCollectiveNoun] ในท้องถิ่น\n\n"
ep3_travel_events.3002.admin: "[local_lord.GetTitleAsNameNoTooltip|l] ชาว [local_lord.GetCulture.GetNameNoTooltip] ผู้นี้ โชคดีที่ยอมรับการบริหารแบบ [ROOT.Char.GetCulture.GetName] ที่รู้แจ้ง การเดินทางผ่าน [local_lord.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของ [local_lord.GetHerHis] จึงคุ้นเคยและปลอดภัย\n\n"
ep3_travel_events.3002.non_admin: "ด้วยการพึ่งพาความผูกพันส่วนตัวที่เสแสร้งและกำลังที่น่าเกลียดเพื่อยึดครองผืนดินของ [local_lord.GetHerHis] [local_lord.GetTitleAsNameNoTooltip|l] ชาว [local_lord.GetCulture.GetNameNoTooltip] ผู้นี้เป็นเพียงขุนนาง [local_lord.GetGovernment.GetNameNoTooltip|l] เล็กๆ\n\n"
ep3_travel_events.3002.armenian: "ขณะที่ผู้ขี่ม้าเข้ามาใกล้ ข้าคิดถึงชาวอาร์เมเนียผู้กล้าหาญที่ปกป้องจักรวรรดิในยุคมืด ผู้ไม่เต็มใจที่จะวางดาบลงพอๆ กับที่ไม่เต็มใจที่จะยอมรับหลักคำสอน สหายร่วมเตียงที่แปลกประหลาด... แต่เป็นมิตรและผู้ชื่นชมชาวโรมัน"
ep3_travel_events.3002.georgian: "เป็นเรื่องแปลกที่จะมาเยือน [local_lord.GetCulture.GetCollectiveNounNoTooltip] เช่นเดียวกับเรา พวกเขาขับขานหลักคำสอนที่แท้จริงมานาน สร้างโรงอาบน้ำที่ยิ่งใหญ่ จัดการกับชาวอาร์เมเนีย... แต่พวกเขามองข้ามทุ่งหญ้าสเตปป์อันไม่มีที่สิ้นสุด และไว้วางใจในภูเขาสูงของพวกเขา"
ep3_travel_events.3002.bulgarian: "ขณะที่ [Glossary( 'สิทเธียน', 'SCYTHIAN_GLOSS' )] ที่ถูก ทำให้เชื่องครึ่งหนึ่งกำลังต้อนแพะข้ามถนน ข้าคิดถึง [Glossary( 'นักบุญซีริลและนักบุญเมโทดิอุส', 'CYRIL_AND_METHODIUS_GLOSS' )]... และพวกเขาโชคดีเพียงใดที่มีความรุ่งโรจน์ของจักรวรรดิอยู่เบื้องหลัง: ความรุ่งโรจน์ที่ข้าแบกรับอยู่ในขณะนี้"
SCYTHIAN_GLOSS: "#bold Scythian#!: สมาชิกของวัฒนธรรมทุ่งหญ้าสเตปป์อิหร่านที่สูญพันธุ์ไปแล้ว คำนี้ยังคงใช้โดยชาวกรีกเป็นคำอธิบายที่ไม่เจาะจงสำหรับชนเผ่าเร่ร่อนทางเหนือและชาวสลาฟ"
CYRIL_AND_METHODIUS_GLOSS: "#bold Cyril and Methodius#! หรือที่รู้จักในนาม "อัครสาวกแห่งชาวสลาฟ": สองพี่น้องที่ได้รับการเคารพนับถือในฐานะนักบุญสำหรับการเปลี่ยนศาสนาคริสต์ให้กับชาวสลาฟตอนใต้และการสร้างอักษรกลาโกลิติก"
ep3_travel_events.3002.serbian: "กลุ่มผู้ขี่ม้าทักทายเราที่นี่ ทหารม้าที่ดุร้ายและสวมเกราะเหล่านี้จะเหมาะอย่างยิ่งสำหรับ [Glossary( 'คอนซาริออย', 'CHONSARIOI_GLOSS' )]... แต่ข้าไม่มีคทาบัญชาการ ข้าเป็นเพียงชาวโรมันที่มาเยือน"
CHONSARIOI_GLOSS: "#bold Chonsarioi#! คือหน่วยทหารม้าไบแซนไทน์ที่เกณฑ์มาจากคาบสมุทรบอลข่าน ได้รับการยกย่องในทักษะการลาดตระเวนและการบุกปล้น"
ep3_travel_events.3002.latin: "เสมียนของ [local_lord.GetHerHis|U] เข้ามาหาเรา ครั้งหนึ่ง ชาวละตินเหล่านี้คงจะมีศักดิ์ศรีแบบโรมัน พูดจาและประพฤติตนอย่างดีงาม บัดนี้ พวกเขาพูดจาเหลวไหลเหมือนคนเถื่อนและร้องโวยวายหาความมั่งคั่ง หา [Glossary( 'สิทธิพิเศษ', 'SPECIAL_RIGHTS_GLOSS' )] ในเมืองใหญ่ของเรา..."
SPECIAL_RIGHTS_GLOSS: "#bold สิทธิพิเศษ#! ในการค้าโดยไม่ต้องเสียภาษีและจัดตั้งสิ่งอำนวยความสะดวกเพิ่มเติมในคอนสแตนติโนเปิลเป็นสาเหตุที่ฝังรากลึกของพ่อค้าชาวเวนิส"
ep3_travel_events.3002.vlach: "ความคิดของข้าอยู่ที่เนื้อสัตว์และชีสแกะของชาววลาก — การต้อนรับที่เอ่อล้นของพวกเขา ชนเผ่าเร่ร่อนของ [local_lord.GetTitleAsNamePossessiveNoTooltip] เคยเป็น [Glossary( 'เดเชียน', 'DACIANS_GLOSS' )] ที่ดุร้าย พวกเขากล่าว... จนกระทั่งชาวโรมันมาถึงหน้าประตูบ้านของพวกเขา"
DACIANS_GLOSS: "#bold เดเชียน#!: ผู้อยู่อาศัยโบราณในดินแดนใกล้เทือกเขาคาร์เพเทียน ทางตะวันตกของทะเลดำ หลังจากการพิชิตของทราจัน พวกเขาถูกรวมเข้ากับจักรวรรดิเป็นเวลาสั้นๆ ในฐานะโรมันดาเซีย"
ep3_travel_events.3002.generic: "เมื่อพิจารณาถึงการติดต่อระหว่างประชาชนของเรา เป็นที่คาดหวังว่าข้าจะปรากฏตัวต่อหน้าผู้มีอำนาจ เช่นนี้ สร้างความประทับใจให้พวกเขาด้วยคุณธรรมแบบ [ROOT.Char.GetCulture.GetNameNoTooltip]..."

insulted_by_visiting_emperor: "คำดูถูกของจักรพรรดิผู้มาเยือน"
honored_by_visiting_emperor: "ความสัมพันธ์ทางประวัติศาสตร์ที่ได้รับเกียรติจากจักรพรรดิผู้เดินทาง"

ep3_travel_events.3002.a: "ให้พวกเขาได้เห็น [ROOT.Char.Custom('GetDaughterSon')] แห่งจักรวรรดิ!"
ep3_travel_events.3002.a_byzantine: "ข้ามาในฐานะทายาทแห่งโรมอันยิ่งใหญ่"
ep3_travel_events.3002.a.flavor: "การเยือนที่น่าประทับใจอาจช่วยเสริมสร้างชื่อเสียงของข้าในหมู่คนเหล่านี้... และที่บ้านเกิด"
ep3_travel_events.3002.b: "ข้าจะไปเยือน [local_lord.GetFaith.HouseOfWorshipPlural] ในท้องถิ่นของพวกเขา"
ep3_travel_events.3002.b.flavor: "เป็นวิธีที่ดีในการหลีกเลี่ยงพิธีรีตอง... ข้าเพียงแค่ต้องเพิกเฉยต่อความแตกต่างทางศาสนาใดๆ"
ep3_travel_events.3002.c: "คนต่างจังหวัดเหล่านี้ชื่นชมความอบอุ่นและความอ่อนน้อมถ่อมตน"
ep3_travel_events.3002.c_foreign: "ชาวต่างชาติเหล่านี้ชื่นชมความอบอุ่นและความอ่อนน้อมถ่อมตน"

cultural_acceptance_loss_insulted_by_visiting_emperor: "คำดูถูกของจักรพรรดิผู้มาเยือน"
cultural_acceptance_gain_honored_by_visiting_emperor: "ความเคารพของจักรพรรดิผู้มาเยือน"

impressive_visit_vassalization_acceptance_bonus: "[local_lord.GetShortUIName] ได้เพิ่มการยอมรับ #V $offer_vassalization_interaction$#! เป็นเวลา #V 5 ปี#!"

ep3_travel_events.3002.a_success: "[local_lord.GetTitleAsNameNoTooltip] รู้สึกทึ่ง"
ep3_travel_events.3002.a_failure: "[local_lord.GetTitleAsNameNoTooltip] ดูถูกความโอ่อ่าของข้า"

ep3_travel_events.3010.t: "ความเงียบแห่งอนาโตเลีย"
ep3_travel_events.3010: "เสียงเรียกของเราสะท้อนก้องในตรอกหมู่บ้านร้าง ร้องเรียกอย่างโหยหวนแม้เพียงเสียงพึมพำ แม้เพียงเสียงร้องต้อนรับของแพะ มีเพียงสายลมเท่านั้นที่ตอบกลับ\n\n"
ep3_travel_events.3010.fairy_towers: ""เสาหินที่บิดเบี้ยวอย่างบ้าคลั่งเหล่านั้น หอคอยนางฟ้าโบราณของ [current_location.GetName]: ช่องของพวกมันมีประตูที่ปิดกั้นอยู่" สหายของข้าพึมพำ"
ep3_travel_events.3010.normal_holes: ""ซุกตัวอยู่ในรู ในอุโมงค์ ในที่ซ่อนบนยอดเขา" สหายของข้าพึมพำ"
ep3_travel_events.3010.native_knowledge: ""คนเหล่านี้เรียนรู้ที่จะซ่อนตัวในยามยากลำบากมานานแล้ว จาก [Glossary( 'กาซี', 'GHAZIS_GLOSS' )] ชนเผ่าเร่ร่อน... และพวกเขาน่าจะเข้าใจผิดว่าเราแย่ยิ่งกว่านั้น: พวกเก็บภาษีที่น่ารังเกียจ""
ep3_travel_events.3010.foreigners: ""ชนชาติเหล่านี้เรียนรู้ที่จะอดทนต่อช่วงเวลาที่ยากลำบากด้วยการ ทำให้ตนเองหายากมานานแล้ว และดูเหมือนว่าพวกเขาเข้าใจผิดว่าเราเป็นกลุ่มโจรปล้น""

GHAZIS_GLOSS: "#bold Ghazis#! คือนักรบมุสลิมที่เข้าร่วมในการเดินทางทางทหารเพื่อต่อต้านผู้ที่ไม่ใช่มุสลิม ในช่วงสมัยคอลีฟะฮ์รอชิดูน การบุกปล้นของ #EMP ghazi#! เข้าไปในอนาโตเลียเกิดขึ้นด้วยขอบเขตและความถี่ที่ทำลายล้าง"


ep3_travel_events.3010.a: "ไปปล้นบ้านของพวกเขาโดยไม่มีใครขัดขวางกันเถอะ!"
ep3_travel_events.3010.a.flavor: "อาจจะเป็นเครื่องประดับเล็กๆ น้อยๆ ที่ถูกทิ้งไว้ อาจจะเป็นแพะจรจัดสักสองสามตัวที่จะนำไป! ไม่เห็นมีใครอยู่ที่นี่เลย"

ep3_travel_events.3010.b: "ข้าจะให้พวกเขาออกมา: เราต้องการความเชี่ยวชาญในท้องถิ่น"
ep3_travel_events.3010.b.flavor: "การต้อนรับเล็กน้อยก็ดี ผู้นำทางท้องถิ่นที่จะพาเราผ่านดินแดนอันโหดร้ายเหล่านี้ ยิ่งดีกว่า"

ep3_travel_events.3010.c: "ความเงียบ... ค่อนข้างดีทีเดียว"
ep3_travel_events.3010.c_fairy_towers: "แปลก กว้างใหญ่ เงียบสงัด... แต่สวยงาม"
ep3_travel_events.3010.c.flavor: "ไม่มีชาวบ้านพลุกพล่าน ไม่มีปศุสัตว์ส่งเสียงดัง... หากเพียง แต่โลกทั้งใบเป็น เช่นนี้"

ep3_travel_events.3010.a_success: "ท่านคว้าของมีค่าที่ถูกลืมไปได้"
ep3_travel_events.3010.a_failure: "ท่านไม่พบสิ่งใดที่ควรค่าแก่การเอาไป"
ep3_travel_events.3010.b_success: "ท่านพบและได้รับความช่วยเหลือจากท้องถิ่น"
ep3_travel_events.3010.b_failure: "ท่านตะโกนเข้าไปในความเงียบ"

ep3_guide_from_the_borderlands_modifier: "ผู้นำทางถิ่นทุรกันดารอนาโตเลีย"
ep3_guide_from_the_borderlands_modifier_desc: "ความระมัดระวังอันชาญฉลาดของพรานป่าจากดินแดนอนาโตเลียตอนในอันทุรกันดารนำทางตัวละครนี้ในการเดินทางของพวกเขา"

