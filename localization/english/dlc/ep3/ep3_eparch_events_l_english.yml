l_english: 
 ep3_eparch_event.0001.t: "$eparch_court_position$: การเสริมสร้างความแข็งแกร่งให้เมืองหลวง"
 ep3_eparch_event.0001.desc_intro: "[emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] กำลังอยู่ในภาวะสงคราม ถูกรุมล้อมโดยพวก [attacker.GetCulture.GetCollectiveNounNoTooltip] และ [attacker.GetTitledFirstName] ผู้[attacker.Custom2('InsultAdjective', ROOT.Char)]\n\n"
 ep3_eparch_event.0001.desc_winning_war: "ดูเหมือนว่า [emperor.GetTitledFirstName] จะได้เปรียบ แต่พึงระวังอย่าเพิ่งประกาศชัยชนะก่อนที่สงครามจะจบลงอย่างแท้จริง"
 ep3_eparch_event.0001.desc_losing_war: "[emperor.GetTitledFirstName] กำลังต่อสู้อย่างยากลำบาก มีแนวโน้มว่าอีกไม่นานสงครามจะขยายวงกว้างออกไป"
 ep3_eparch_event.0001.desc_undecided_war: "ยังเร็วเกินไปที่จะบอกว่าผลลัพธ์จะเป็น เช่นไร เนื่องจากยังไม่มีฝ่ายใดได้เปรียบอย่างมีนัยสำคัญ"
 ep3_eparch_event.0001.desc_outro: "\n\n[capital.GetTitle.GetNameNoTier] ยังคงปลอดภัย #EMP ในตอนนี้#! อย่างไรก็ตาม เป็นการรอบคอบที่เราจะเตรียมพร้อมอย่างดีหากสงครามมาถึงหน้าประตูบ้านเรา..."
 ep3_eparch_event.0001.a: "เมืองหลวง #EMP ต้อง#! ได้รับการปกป้อง!"
 ep3_eparch_event.0001.b: "การปรับปรุงเล็กน้อยก็น่าจะเพียงพอแล้ว"
 ep3_eparch_event.0001.c: "แน่นอนว่า [capital.GetTitle.GetNameNoTierNoTooltip] ไม่ได้ตกอยู่ในอันตราย #EMP ที่แท้จริง#! ใด ๆ ใช่หรือไม่?"
 
 ep3_eparch_event.0002.desc: "[eparch.GetTitledFirstName] ซึ่งเป็น [emperor.Custom2('RelationToMeShort',eparch)] ของข้า ได้ใช้มาตรการป้องกันที่สำคัญเพื่อรักษาความปลอดภัยของเมืองหลวงในช่วงเวลาสงครามนี้\n\n"
 ep3_eparch_event.0002.desc_at_home: ""ดูทางนี้สิ!" [eparch.GetFirstNameNoTooltip] กล่าว พลางนำทางไปด้วยย่างก้าวอันกระตือรือร้น "กำแพงเหล่านี้ได้รับการเสริมความแข็งแกร่งและปรับปรุงอย่างมาก ตรงนั้นท่านจะเห็นค่ายทหารใหม่ ซึ่งปูทางไปสู่กองทหารรักษาการณ์ที่ใหญ่ขึ้นมาก"\n\n"ข้ากล้าพูดได้เลยว่า [capital.GetTitle.GetNameNoTier] พร้อมสำหรับการปิดล้อมที่ยาวนานแล้วพ่ะย่ะค่ะ/ขอรับ [emperor.GetLadyLord] หากสงครามมาถึงนครอันเป็นที่รักของเรา""
 ep3_eparch_event.0002.desc_away: "จดหมายในมือข้าบรรยายต่อไปถึงส่วนต่าง ๆ ของกำแพงที่ได้รับการเสริมกำลังและปรับปรุงอย่างมาก รวมถึงรายละเอียดเกี่ยวกับทหารเพิ่มเติมที่ได้รับมอบหมายให้ประจำการในกองทหารรักษาการณ์ ดูเหมือนว่า [capital.GetTitle.GetNameNoTier] จะอยู่ในมือที่ดีและค่อนข้างพร้อมสำหรับการปิดล้อมที่อาจเกิดขึ้น"
 ep3_eparch_event.0002.a: "ความขยันหมั่นเพียร เช่นนี้สมควรได้รับรางวัล!"
 ep3_eparch_event.0002.b: "[eparch.GetSheHe|U] เพียงแค่ทำหน้าที่ของ [eparch.GetHerHis] เท่านั้น"
 
 ep3_eparch_event.0005.t: "$eparch_court_position$: สูญเสียการควบคุม"
 ep3_eparch_event.0005.desc: "การควบคุม [capital.GetTitle.GetNameNoTier] ของเรากำลังหลุดลอยไป...\n\nเหล่าอาชญากรกำลังฉวยโอกาสจากสถานการณ์นี้อย่างรวดเร็วและเคลื่อนไหวอย่างอิสระไปตามท้องถนนในขณะนี้ มันเป็นความรับผิดชอบ #EMP ของข้า#! ที่จะรับรองความปลอดภัยของเมืองและพลเมืองทุกคนที่อาศัยอยู่ภายในกำแพงเหล่านี้"
 ep3_eparch_event.0005.a: "จ้างคนเพิ่มเพื่อลาดตระเวนตามท้องถนนกันเถอะ"
 ep3_eparch_event.0005.b: "บางทีเราอาจยุยงให้อาชญากรหันมาต่อสู้กันเองได้?"
 ep3_eparch_event.0005.b_success_tt: "ท่านประสบความสำเร็จในการชักใยเหล่าอาชญากร"
 ep3_eparch_event.0005.b_success: "ความพยายามชักใยสำเร็จ"
 ep3_eparch_event.0005.b_failure_tt: "ท่านล้มเหลวในการยุยงให้อาชญากรหันมาต่อสู้กันเอง"
 ep3_eparch_event.0005.b_failure: "ความพยายามชักใยล้มเหลว"
 ep3_eparch_event.0005.success_liege: "$eparch_court_position$ เพิ่ม [control|E] ได้สำเร็จ"
 ep3_eparch_event.0005.failure_liege: "$eparch_court_position$ ล้มเหลวในการเพิ่ม [control|E]"
 ep3_eparch_event.0005.c: "[marshal.GetCouncilTitleFirstNameNoTooltip] อาจช่วยได้?"
 ep3_eparch_event.0005.d: "ไม่จำเป็นต้องตื่นตูม สถานการณ์ไม่ได้เลวร้าย #EMP ขนาดนั้น#!"
 
 ep3_eparch_event.0010.t: "$eparch_court_position$: โรคภัยไข้เจ็บมาเยือน"
 ep3_eparch_event.0010.desc: "[capital.GetTitle.GetNameNoTier] ถูกโรคระบาดเล่นงาน!\n\n[capital_plague.GetName] แพร่กระจายไปทั่วเมืองหลวง มันติดเชื้อพลเมืองทั่วทั้งเมือง โดยไม่คำนึงถึงสถานะ ชื่อเสียง หรือตำแหน่งในราชสำนัก เช่นเคย ผู้โชคร้ายที่ขาดแคลนปัจจัยและทองคำในการพบแพทย์จะต้องรับผลกระทบหนักที่สุดจากการระบาดครั้งนี้\n\n[ROOT.Char.GetTopLiege.GetTitledFirstName] จะคาดหวังให้ข้าดำเนินการและทำทุกวิถีทางเพื่อป้องกันหายนะที่อาจเกิดขึ้น"
 ep3_eparch_event.0010.a: "จำเป็นต้องใช้มาตรการขั้นเด็ดขาด กักกันเมือง!"
 ep3_eparch_event.0010.b: "ค้นหาแพทย์ทั่วเมืองและให้พวกเขาทำงาน"
 ep3_eparch_event.0010.c: "แพทย์ของข้า [physician.GetFirstNameNoTooltip] ช่วยได้!"
 ep3_eparch_event.0010.d: "ข้าเกรงว่าจะไม่มีอะไรที่เราทำได้..."
 ep3_eparch_event.0010.c_success_tt: "[physician.GetTitledFirstName] ประสบความสำเร็จในการบรรเทาโรคระบาด"
 ep3_eparch_event.0010.c_success: "[physician.GetTitledFirstName] สำเร็จ"
 ep3_eparch_event.0010.c_failure_tt: "[physician.GetTitledFirstName] ล้มเหลวในการบรรเทาโรคระบาด"
 ep3_eparch_event.0010.c_failure: "[physician.GetTitledFirstName] ล้มเหลว"
 
 ep3_eparch_event.0015.t: "$eparch_court_position$: มหาวิทยาลัยต้องการอาจารย์"
 ep3_eparch_event.0015.desc: "มหาวิทยาลัยใน [capital.GetTitle.GetNameNoTier] ได้ส่งสาส์นแจ้งความต้องการอาจารย์เพิ่ม\n\nสาส์นดังกล่าวลงรายละเอียดอย่างมากเกี่ยวกับความสำคัญสูงสุดของการให้การศึกษาที่มีคุณภาพ และหากไม่มีบุคลากรเพิ่มเติม พวกเขาจะไม่สามารถตอบสนองความคาดหวังของ [emperor.GetTitledFirstNamePossessive] ได้ มหาวิทยาลัยวิงวอนให้ข้าจ้างผู้สมัครที่เหมาะสมโดยเร็วที่สุด"
 ep3_eparch_event.0015.a: "บังเอิญข้ารู้จักผู้ที่เหมาะสมที่สุด!"
 ep3_eparch_event.0015.b: "ตระกูล [powerful_house_head.GetHouse.GetBaseNameNoTooltip] คู่ควรกับตำแหน่งนี้"
 ep3_eparch_event.0015.c: "ต้องมีนักปราชญ์ที่ข้าสามารถจ้างได้ภายในเมืองเป็นแน่"
 ep3_eparch_event.0015.d: "อันที่จริงแล้ว เจ้ามาทำงานให้ข้าเป็นอย่างไร [teacher_local_scholar.GetFirstNameNoTooltip]?"
 ep3_eparch_event.0015.e: "ตอนนี้พวกเขาคงต้องจัดการกันไปก่อน"
 ep3_eparch_event.0015.b.msg.t: "แต่งตั้งอาจารย์"
 ep3_eparch_event.0015.b.msg.desc: "$eparch_court_position$ ได้ แต่งตั้ง [teacher_powerful_family.GetShortUIName] เป็นอาจารย์ที่มหาวิทยาลัยใน [capital.GetTitle.GetNameNoTier]"
 teacher_moves_to_capital_tt: "[teacher_tt.GetShortUIName|U] ย้ายไปยัง [capital.GetTitle.GetNameNoTier] ในฐานะอาจารย์"
 
 ep3_eparch_event.0020.t: "$eparch_court_position$: สำหรับการบริการที่ได้กระทำ"
 ep3_eparch_event.0020.desc_intro: "ขณะที่ข้าเดินไปตามโถงทางเดินที่มีแสงสลัว ความคิดของข้าก็ถูกขัดจังหวะเมื่อได้ยินใครบางคนเรียกชื่อข้า ข้าหันไปเห็น [emperor.GetShortUIName] กำลังเดินเข้ามาพร้อมคนรับใช้\n\n"[eparch.GetFirstNameNoTooltip]! เจ้าได้ปฏิบัติหน้าที่ดูแล [capital.GetTitle.GetNameNoTier] อย่างน่าชื่นชม ความขยันหมั่นเพียร เช่นนี้สมควรได้รับรางวัล และข้ายินดีเป็นอย่างยิ่งที่จะมอบให้"\n\n"
 ep3_eparch_event.0020.desc_gold: "[emperor.GetSheHe|U] ส่งสัญญาณให้คนรับใช้เข้ามาใกล้ คนรับใช้เปิดฝาหีบใบเล็กเพื่อเผยให้เห็นสิ่งที่อยู่ภายใน มันเต็มไปด้วยเหรียญ อัญมณีล้ำค่า และของมีค่าอื่น ๆ!"
 ep3_eparch_event.0020.desc_artifact: "คนรับใช้ก้าวไปข้างหน้า ด้วยการเคลื่อนไหวเพียงครั้งเดียว คนรับใช้ดึงผ้าผืนหนึ่งออก เผยให้เห็นสิ่งประดิษฐ์ที่อยู่ข้างใต้"
 ep3_eparch_event.0020.desc_hook_removal: "[emperor.GetTitleAsNameNoTooltip] กล่าวต่อ "ข้าได้พูดคุยกับ [peer_with_hook.GetShortUIName] และโน้มน้าวให้ [peer_with_hook.GetHerHim] ยกเลิกบุญคุณใด ๆ ที่เจ้าอาจติดค้างอยู่ [peer_with_hook.GetSheHe|U] จะไม่สร้างปัญหาให้เจ้าอีกต่อไป""
 ep3_eparch_event.0020.desc_emperor_hook: ""หากเจ้าต้องการสิ่งใด และข้าหมายถึง #EMP สิ่งใดก็ตาม#! อย่าลังเลที่จะแจ้งให้ข้าทราบ ข้าจะทำทุกอย่างที่ทำได้เพื่อช่วยเหลือเจ้า""
 ep3_eparch_event.0020.a: "ขอบพระทัย/ขอบคุณ [emperor.GetLadyLord]!"
 
 ep3_eparch_event.9000.t: "$eparch_court_position$: ละเลยหน้าที่"
 ep3_eparch_event.9000.desc: "ในฐานะ $eparch_court_position$ เป็นหน้าที่ของ [eparch.GetTitledFirstNamePossessive] ที่จะต้องจัดการและดูแลทุกความต้องการของ [capital.GetTitle.GetNameNoTierPossessive] ราวกับว่าเมืองนี้เป็นบ้านของ [eparch.GetHerHis] เอง!\n\nกระนั้น [eparch.GetSheHe] กลับละเลยหน้าที่สำคัญนี้อย่างร้ายแรง ทรยศต่อความไว้วางใจของข้าในกระบวนการนี้ และผลาญ #EMP สิทธิพิเศษ#! ที่ข้ามอบให้แก่ [eparch.GetHerHim]! และเพื่ออะไร? เพื่อพยายามรับใช้ผลประโยชน์ส่วนตนของ [eparch.GetHerHis]\n\n[eparch.GetFirstNameNoTooltip] กำลังรอคำตัดสินของข้า..."
 ep3_eparch_event.9000.a: "รับไม่ได้โดยสิ้นเชิง! เจ้าถูกไล่ออก! #EMP ออกไปซะ#!!"
 ep3_eparch_event.9000.b: "ถือว่านี่เป็นคำเตือน แต่เจ้าจะ #EMP ติดหนี้#! ข้า!"
 ep3_eparch_event.9000.c: "ข้าจะทำเป็นมองไม่เห็นเรื่องนี้ไปก่อน ในตอนนี้"
 
 ep3_eparch_event.9001.intro: "ข้ามาถึงห้องพระโรงหลังจากถูกเรียกตัวโดย [emperor.GetTitledFirstName] และรีบเข้าไปใกล้แท่นประทับ\n\n"
 ep3_eparch_event.9001.desc_fired: ""เจ้า ทำให้ข้าผิดหวัง [eparch.GetFirstNameNoTooltip] ข้ามอบหมายให้ [capital.GetTitle.GetNameNoTier] อยู่ในความดูแลของเจ้า และเจ้าตอบแทนข้าด้วยการ #EMP ไม่ใส่ใจ#! ต่อความต้องการของเมืองโดยสิ้นเชิง! พฤติกรรมของเจ้ายอมรับไม่ได้"\n\n[emperor.GetTitleAsName] ลุกขึ้นยืน "เจ้าถูกถอดออกจากตำแหน่ง [GetCourtPositionType('eparch_court_position').GetNameNoTooltip()] จงถือว่าโชคดีแล้วที่ข้าละเว้นการดำเนินการเพิ่มเติม""
 ep3_eparch_event.9001.desc_warned: ""ข้าได้ทราบมาว่าเจ้าละเลยหน้าที่ของตน [eparch.GetFirstNameNoTooltip]" [emperor.GetFirstNameNoTooltip] ส่ายพระพักตร์/ศีรษะ [emperor.GetHerHis] "จงถือว่านี่เป็นคำเตือน ข้าตัดสินใจจะปล่อยเจ้าไปง่ายๆ #EMP ในตอนนี้#! ข้าหวังว่าคงไม่ต้องบอกนะว่าเจ้าจะเป็นหนี้ข้า"\n\n[emperor.GetTitleAsNameNoTooltip] โบกพระหัตถ์/มือ [emperor.GetHerHis] ไล่ข้าไป"
 ep3_eparch_event.9001.desc_nothing: "ไม่นานก็ชัดเจนว่ามีบางอย่างไม่ถูกต้อง ความเงียบและความตึงเครียดที่ปกคลุมอยู่ในอากาศนั้นบ่งบอกได้มากมาย\n\n[emperor.GetSheHe|U] #EMP รู้#! ว่าข้ากำลังเพิกเฉยต่อหน้าที่ในฐานะผู้บริหารของ [capital.GetTitle.GetNameNoTierPossessive] ใช่หรือไม่? ข้ารอถึงตาของข้า\n\nนาทีผ่านไป แต่ไม่มีอะไรเกิดขึ้น [emperor.GetFirstNameNoTooltip] มองมาที่ข้าครู่หนึ่งแล้วเดินจากไป ดูเหมือนว่า [emperor.GetTitleAsName] ได้เลือกที่จะเพิกเฉยต่อการล่วงละเมิดของข้า ในตอนนี้"
 ep3_eparch_event.9001.a: "อะไรนะ? #EMP ไล่ออก?!#!"
 ep3_eparch_event.9001.b: "น่าจะจบลงแย่กว่านี้ได้มาก..."
 ep3_eparch_event.9001.c: "บางทีข้าควรจะถือว่าตัวเองโชคดี"
 
 eparch_hook_warning: "@alert_icon! #alert_trial [eparch.GetTitledFirstName] มีบุญคุณติดค้างกับท่าน - การกระทำนี้มีผลกระทบเพิ่มเติม#!"
 
 eparch_neglecting_duty_warning_tt: "@alert_icon! #alert_trial การละเลยหน้าที่อย่างต่อเนื่องอาจทำให้ [liege|E] ของท่านสังเกตเห็นและดำเนินการได้#!"
 eparch_reward_msg_title: "ได้รับรางวัลสำหรับหน้าที่"
 
 duel_aptitude_challenge: "การท้าทาย [aptitude|E]"
