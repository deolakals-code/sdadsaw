l_english: 

 # X Reconquered
 ep3_emperor_yearly.2000.t: "[county.GetNameNoTierNoTooltip] ถูกยึดคืน"
 ep3_emperor_yearly.2000.desc_intro: "กองทัพอันรุ่งโรจน์ของชาวโรมันเคลื่อนทัพเข้าสู่ดินแดนที่บรรพบุรุษของเราเคยครอบครองอีกครั้ง และเกียรติยศในการ ทำให้สิ่งนี้เกิดขึ้นเป็นของข้า แต่เพียงผู้เดียว"
 ep3_emperor_yearly.2000.desc_antioch: "\n\n[county.GetNameNoTier]: ศูนย์กลางแห่งปัญจาธิปไตย, เผยแพร่ศาสนาโดยนักบุญเปโตรเอง, ที่ ซึ่งศาสนาคริสต์ได้เริ่มก้าวแรกอย่างเป็นทางการ ครั้งหนึ่งเคยเป็นนครที่รุ่งเรืองด้วยศรัทธาและการค้า แต่ได้รับผลกระทบอย่างหนักจากการสู้รบตามแนวชายแดนมานานหลายศตวรรษ จนบัดนี้เหลือเพียงเงาของความรุ่งโรจน์ในอดีต\n\nอย่างไรก็ตาม เงาอันรุ่งโรจน์สามารถนำกลับคืนสู่ความยิ่งใหญ่ได้ด้วยมือชี้นำอันแข็งแกร่ง เช่นมือของข้า!"
 ep3_emperor_yearly.2000.desc_antioch_not_christ: "\n\n[county.GetNameNoTier]: ครั้งหนึ่งเคยเป็นนครที่รุ่งเรืองด้วยศรัทธาและการค้า และเป็นเมืองหลวงอันภาคภูมิใจของศาสนาคริสต์ สูญเสียและได้คืนโดยผู้ศรัทธาหลายครั้ง ได้รับผลกระทบอย่างหนักจากการสู้รบตามแนวชายแดนมานานหลายศตวรรษ จนบัดนี้เหลือเพียงเงาของความรุ่งโรจน์ในอดีต\n\nอย่างไรก็ตาม เงาอันรุ่งโรจน์สามารถนำกลับคืนสู่ความยิ่งใหญ่ได้ด้วยมือชี้นำอันแข็งแกร่ง เช่นมือของข้า!"
 ep3_emperor_yearly.2000.desc_jerusalem: "\n\n[county.GetNameNoTier], นครศักดิ์สิทธิ์, ได้กลับคืนสู่พระหัตถ์อันห่วงใยของจักรพรรดิที่แท้จริง ผู้แทนอันชอบธรรมของพระเจ้าบนโลกในที่สุด\n\nศูนย์กลางแห่งปัญจาธิปไตยจะได้รับการฟื้นฟูในไม่ช้า และฝูงชนผู้แสวงบุญจะสามารถเยี่ยมชมถิ่นกำเนิดของศาสนาคริสต์ได้อย่างปลอดภัยอีกครั้ง ภายใต้การคุ้มครองของกองทัพโรมัน"
 ep3_emperor_yearly.2000.desc_jerusalem_not_christ: "\n\n[county.GetNameNoTier], นครศักดิ์สิทธิ์ของสามศาสนา หลายคนปรารถนา แต่ตั้งแต่ยุคแรกเริ่มของจักรวรรดิ มีผู้ปกครองที่ชอบธรรมเพียงผู้เดียวเท่านั้น: จักรพรรดิ\n\nขณะที่เราสร้างความมั่นคงและสันติภาพอีกครั้ง เราสามารถตั้งตารอรับฝูงชนผู้แสวงบุญจากทุกมุมของจักรวรรดิและที่อื่นๆ ได้!"
 ep3_emperor_yearly.2000.desc_alexandria: "\n\n[county.GetNameNoTier], อัญมณีแห่งอียิปต์, กลับคืนสู่มือโรมันแล้ว! ศูนย์กลางแห่งปัญจาธิปไตย, เมืองหลวงแห่งวัฒนธรรมอายุนับพันปี, ครั้งหนึ่งเคยเป็นศูนย์กลางการถกเถียงทางปรัชญาและเทววิทยาคริสเตียนที่คึกคักที่สุดแห่งหนึ่ง ถูกทำลายและทอดทิ้งโดยเงื้อมมืออันละโมบของพวกนอกรีต\n\nนครแห่งอเล็กซานเดอร์จะผงาดขึ้นอีกครั้งพร้อมกับจักรวรรดิที่แท้จริง!"
 ep3_emperor_yearly.2000.desc_alexandria_not_christ: "\n\n[county.GetNameNoTier], อัญมณีแห่งอียิปต์, กลับคืนสู่มือโรมันแล้ว!\n\nครั้งหนึ่งเคยเป็นศูนย์รวมความรู้และปัญญาของโลกทั้งใบ ได้รับผลกระทบอย่างหนักจากการกดขี่ข่มเหงของชาวคริสต์ จนแทบไม่เหลือร่องรอยความรุ่งโรจน์ในอดีต เหลือเพียงน้อยนิด แต่ก็ไม่ใช่ไม่มี และด้วยความเข้าใจนี้ เราจะสร้างนครที่คู่ควรกับอดีตขึ้นมาใหม่!"
 ep3_emperor_yearly.2000.desc_frontier: "\n\nปัจจุบัน คนท้องถิ่นเรียกบริเวณนี้ว่า [county.GetNameNoTier] แม้จะเป็นช่วงเวลาสั้นๆ ชาวโรมันเคยเดินบนชายฝั่งเหล่านี้เมื่อจักรพรรดิ [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName] นำกองทหารผู้กล้าหาญของพระองค์ลึกเข้าไปในเมโสโปเตเมีย\n\nที่นี่เคยเป็นพรมแดนสุดท้ายของจักรวรรดิของเราทางทิศตะวันออก และก็เป็น เช่นนั้นอีกครั้งในวันนี้"
 ep3_emperor_yearly.2000.desc_edessa: "\n\nนครที่มีชื่อเสียงแห่ง [county.GetNameNoTier] — หนึ่งในศูนย์กลางการเผยแพร่ศาสนาคริสต์ยุคแรกสุด, ที่ตั้งของสภาสังคายนาสากล, เวทีแห่งการพลีชีพของนักบุญผู้รุ่งโรจน์หลายองค์ — เป็นที่แย่งชิงระหว่างจักรวรรดิและเพื่อนบ้านผู้รุกรานมานานหลายศตวรรษ\n\nอีกครั้งหนึ่ง บัดนี้ได้กลับคืนสู่การดูแลของจักรพรรดิผู้ชอบธรรม และครั้งนี้จะเป็นไปตลอดกาล หาก [ROOT.Char.GetFaith.HighGodName] ทรงประสงค์"
 ep3_emperor_yearly.2000.desc_edessa_not_christ: "\n\n[county.GetNameNoTier]: ครั้งหนึ่งเคยเป็นเมืองหลวงของมณฑลออสโรเอเน นครแห่งนี้ยืนหยัดอย่างภาคภูมิใจในฐานะปราการกั้นระหว่างชาวโรมันและชาวซาซาเนียนเป็นเวลา 400 ปีก่อนที่จะตกอยู่ภายใต้การรุกคืบของอิสลาม\n\nหลายศตวรรษผ่านไปนับ แต่นั้น และ [county.GetNameNoTierNoTooltip] ก็เป็นที่แย่งชิงระหว่างจักรวรรดิและเพื่อนบ้านของเรามาโดยตลอด ขอให้วันแห่งชัยชนะอันรุ่งโรจน์นี้เป็นครั้งสุดท้ายที่นครแห่งนี้จะได้เห็น!"
 ep3_emperor_yearly.2000.desc_bari: "\n\n[county.GetNameNoTier] เป็นท่าเรือสำคัญในทะเลเมดิเตอร์เรเนียนมาโดยตลอด แต่แทบจะไม่ใช่ฐานที่มั่นทางยุทธศาสตร์ — จนกระทั่งพวกอาหรับมาถึง\n\nการรุกรานของพวกเขา ทำให้เห็นได้ชัดเจนอย่างเจ็บปวดว่า เพื่อรับประกันความปลอดภัยของทั้งอิตาลีตอนใต้และคาบสมุทรบอลข่านจากการพิชิต เราต้องการฐานที่มั่นที่แข็งแกร่งและป้องกันได้ในอิตาลี บัดนี้ [county.GetNameNoTierNoTooltip] กลับมาอยู่ในมือของเราอีกครั้ง เราจะมุ่งมั่นใช้มันเป็นแกนหลักในการป้องกันทางตะวันตกของเรา"
 ep3_emperor_yearly.2000.desc_syracuse: "\n\n[county.GetNameNoTier]: ท่าเรือการค้า, ศูนย์กลางการเผยแพร่ศาสนาคริสต์ในตะวันตก, และเมืองหลวงทางตะวันตกของจักรพรรดิคอนสแตนส์ที่ 2\n\nสิ่งที่เคยเป็นฐานที่มั่นสุดท้ายของโรมันต่อต้านการพิชิตซิซิลีของชาวมุสลิมได้ล่มสลายไปแล้ว เช่นกัน แต่บัดนี้ได้รับการฟื้นฟูแล้ว! เกียรติยศและความร่ำรวยรอคอยผู้พิชิต และก้าวใหม่ได้ถูกดำเนินการไปสู่การฟื้นฟูจักรวรรดิอันชอบธรรม"
 ep3_emperor_yearly.2000.desc_rome: "\n\n[county.GetNameNoTier]. นครอมตะ. เมืองหลวงแห่งแรกและถิ่นกำเนิดของจักรวรรดิของเรา\n\nแม้ว่าอำนาจของจักรพรรดิจะละทิ้งดินแดนนี้ไปสู่คอนสแตนติโนเปิล — โรมใหม่ — มานานแล้ว และปัญจาธิปัตย์ท้องถิ่นที่หลงผิดได้เข้ามาเติมเต็มช่องว่างแห่งอำนาจที่ตามมาอย่างผิดกฎหมาย การส่งมอบนครคืนแก่จักรพรรดิองค์เดียวผู้ชอบธรรมก็เป็นเหตุผลให้ยินดี ความยิ่งใหญ่ครั้งใหม่รอคอยจักรวรรดิอยู่ บัดนี้เราได้ก้าวไปทางตะวันตกอย่างยิ่งใหญ่แล้ว"
 ep3_emperor_yearly.2000.desc_ravenna: "\n\n[county.GetNameNoTier] เป็นที่ประทับของจักรพรรดิองค์สุดท้ายเมื่อจักรพรรดิที่ชอบธรรมยังคงประทับบนบัลลังก์ในดินแดนตะวันตกอันวุ่นวายที่ถูกพวกอนารยชนทำลายล้าง ดังนั้นจึงเป็นเรื่องธรรมดาที่จักรพรรดิจัสติเนียนที่ 1 จะตั้งศูนย์กลางการปกครองโรมันที่สถาปนาขึ้นใหม่ที่นั่น\n\nหลายศตวรรษผ่านไปนับตั้งแต่พวก ลอมบาร์ด ผลักดันชาวโรมันคนสุดท้ายออกจากอิตาลีตอนเหนือ อย่างไรก็ตาม ยุคใหม่แห่งสันติภาพ ความเจริญรุ่งเรือง และความสามัคคีเพิ่งเริ่มต้นขึ้น"
 ep3_emperor_yearly.2000.desc_carthago: "\n\nปัจจุบัน การตั้งถิ่นฐานหลักของบริเวณนี้คือ [county.GetNameNoTier] แต่เรายังไม่ลืมช่วงเวลาที่ชาวโรมันควบคุมชายฝั่งเหล่านี้จากคาร์เธจ — ครั้งหนึ่งเคยเป็นศัตรูตัวฉกาจ ต่อมาเป็นนครที่รุ่งเรืองด้วยศรัทธาและวัฒนธรรม บัดนี้เป็นเพียงซากเปลือกหอยที่ว่างเปล่าของความยิ่งใหญ่ในอดีต\n\nแม้ว่าอาจจะสายเกินไปที่จะฟื้นฟูเมืองให้กลับคืนสู่ความรุ่งโรจน์ในอดีต แต่ตำแหน่งที่สะดวกของบริเวณนี้จะพิสูจน์ได้ว่ามีความสำคัญอย่างยิ่งต่อการฟื้นฟูการมีอยู่ของโรมันในแอฟริกาอย่างแน่นอน"
 ep3_emperor_yearly.2000.desc_tingis: "\n\nปัจจุบัน คนท้องถิ่นเรียกเมืองนี้ว่า [county.GetNameNoTier] แต่เรารู้จักในนาม ทิงกิส เมืองหลวงของมณฑลมอเรเตเนีย ทิงกิตานา\n\nครั้งหนึ่งเคยเป็นศูนย์กลางอำนาจโรมันที่รุ่งเรือง เมืองนี้ได้สูญหายไปจากเราและจากแสงสว่างแห่งศรัทธาที่แท้จริงมานานหลายศตวรรษ หลังจากที่ฝูงชนชาวแวนดัลที่ถูกส่งมาลงโทษความเสื่อมทรามของเราได้กวาดล้างมันไปก่อน ตามด้วยกาหลิบมุสลิม โชคดีสำหรับพวกเขา ยุคอันยาวนานของการครอบครองโดยอนารยชนได้สิ้นสุดลงแล้ว และสันติภาพแห่งจักรวรรดิได้รับการสถาปนาขึ้นใหม่"
 ep3_emperor_yearly.2000.desc_carthago_spartaria: "\n\nปัจจุบัน คนท้องถิ่นเรียกบริเวณนี้ว่า [county.GetNameNoTier] อย่างไรก็ตาม จัสติเนียนที่ 1 ได้ตั้งชื่อว่า คาร์ธาโก สปาร์ตาเรีย และ ทำให้เป็นหนึ่งในศูนย์กลางหลักของการมีอยู่ของโรมันที่สถาปนาขึ้นใหม่ในตะวันตก\n\nหลายศตวรรษผ่านไปนับตั้งแต่เมืองตกอยู่ในมืออนารยชนเป็นครั้งล่าสุด อย่างไรก็ตาม ขณะที่การควบคุมของเราได้รับการสถาปนาขึ้นใหม่ในไอบีเรีย ความรุ่งโรจน์ของจัสติเนียนดูเหมือนจะอยู่ใกล้แค่เอื้อมอีกครั้ง"
 ep3_emperor_yearly.2000.desc_milan: "\n\nบรรพบุรุษของเราตั้งชื่อบริเวณนี้ว่า [county.GetNameNoTier] ตามชื่ออนารยชนที่แย่งชิงไปจากจักรวรรดิเป็นครั้งแรก คือพวก ลอมบาร์ด หนึ่งในศูนย์กลางหลัก เมดิโอลานุม เป็นเมืองหลวงของส่วนตะวันตกของจักรวรรดิภายใต้ระบอบจตุราธิปไตย และคอนสแตนตินมหาราชได้ออกพระราชกฤษฎีกาให้เสรีภาพทางศาสนาแก่ทั้งจักรวรรดิจากเมืองเดียวกันนี้\n\nแม้ว่าพวก ลอมบาร์ด จะย้ายเมืองหลวงออกไป บริเวณนี้ก็ยังคงเจริญรุ่งเรืองและจะเป็นฐานที่มั่นที่ยอดเยี่ยมในอิตาลีตอนเหนือ"
 ep3_emperor_yearly.2000.desc_trier: "\n\nปัจจุบัน คนท้องถิ่นเรียกเมืองนี้ว่า [county.GetNameNoTier] แต่เรายังคงจำได้ว่าผู้คนของเราเคยเรียกมันว่าอย่างไร: ออกุสตา เทรเวโรรัม ที่ประทับของจตุราธิปัตย์ คอนสแตนติอุส คลอรัส พระบิดาของผู้ก่อตั้งโรมใหม่ของเรา คอนสแตนตินมหาราช\n\nผู้รุกรานชาวเจอร์แมนิกได้เข้ายึดครองมานานแล้ว ล่าสุดถึงกับตั้งตนเป็น "จักรพรรดิ" ใช้ตำแหน่งที่ไม่คู่ควรกับอนารยชนอย่างไม่ถูกต้อง มันไม่สำคัญอีกต่อไป ขณะที่กองทหารผู้ภักดีของข้ายึดคืนสิ่งที่เคยเป็นของเราโดยชอบธรรม ผู้แอบอ้างทั้งหมดจะถูกทำลายล้าง และจะเหลือเพียงจักรวรรดิที่ชอบธรรมเพียงแห่งเดียวเท่านั้น"
 ep3_emperor_yearly.2000.desc_hadrians_wall: "\n\nอนารยชนที่ยึดครองบริเวณนี้หลังจากอินทรีโรมันตัวสุดท้ายจากไปได้เรียกมันว่า [county.GetNameNoTier] ครั้งหนึ่ง กำแพงอันยิ่งใหญ่ของจักรพรรดิเฮเดรียนก็เพียงพอที่จะกันอนารยชนให้อยู่นอกจักรวรรดิ และดินแดนเหล่านี้เองที่เป็นพรมแดนสุดท้ายของอารยธรรมทางเหนือ\n\nบัดนี้กำแพงอยู่ในสภาพปรักหักพัง และอนารยชนได้แพร่กระจายไปทั่วดินแดนมานานหลายศตวรรษ แต่ไม่ใช่อีกต่อไป วันนี้ พรมแดนของเฮเดรียนยืนหยัดอีกครั้ง!"
 ep3_emperor_yearly.2000.desc_chandax: "\n\nชาวอาหรับที่พิชิตเกาะครีตเป็นครั้งแรกได้ย้ายเมืองหลวงไปยังเฮราคลีออนโบราณและเรียกมันว่า [county.GetNameNoTier] ในขณะที่เมืองหลวงเดิม กอร์ทินา เสื่อมโทรมลง\n\nการได้ควบคุมหัวใจใหม่ของเกาะกลับคืนมาเป็นขั้นตอนพื้นฐานในการรับประกันความมั่นคงในทะเลเมดิเตอร์เรเนียนและความเจริญรุ่งเรืองของทั้งจักรวรรดิ เนื่องจากพ่อค้าและโจรสลัดสามารถถูกหยุดยั้งและเปลี่ยนเส้นทางได้ และกองเรือรุกรานสามารถถูกสกัดกั้นได้"
 ep3_emperor_yearly.2000.desc_tours: "\n\nปัจจุบัน คนท้องถิ่นเรียกบริเวณนี้ว่า [county.GetNameNoTier] จากชื่อภาษาละตินที่ถูกลืมไปแล้วของการตั้งถิ่นฐานหลัก ซิวิตาส ตูโรนุม ในช่วงปลายของส่วนตะวันตกของจักรวรรดิ เมืองนี้เป็นมหานครที่แท้จริง ครอบครองมณฑลลุกดูนุมทั้งหมด\n\nตั้งแต่นั้นมา ความสำคัญของมันลดลงเพียงบางส่วน เนื่องจากผู้แสวงบุญชาวคริสต์ยังคงหลั่งไหลมาที่นี่ระหว่างทางไปซานติอาโก และมันได้ทำหน้าที่เป็นปราการต่อต้านการรุกรานสองครั้ง: ของชาวอาหรับ และของชาวไวกิ้ง จิตวิญญาณโรมันที่แท้จริงยังคงหลงเหลืออยู่ในดินแดนเหล่านี้ และพวกเขาจะค้นพบมันอีกครั้งไม่ว่าพวกเขาจะชอบหรือไม่ก็ตาม!"
 ep3_emperor_yearly.2000.a: "วันอันรุ่งโรจน์สำหรับชาวโรมันทุกคน!"
 # The Fate of a PrincessPrince
 ep3_emperor_yearly.2010.t: "ชะตากรรมของ[sent_off.Custom('GetPrincessPrince')]"
 ep3_emperor_yearly.2010.desc: "วันนี้มีเสียงซุบซิบที่ชัดเจนในราชสำนัก #EMP น่าละอาย#! การนินทาไม่คู่ควรกับโถงอันสง่างามนี้\n\n"น่าสงสาร [sent_off.GetFirstName]..."\n"... โดดเดี่ยวท่ามกลางพวก #EMP อนารยชน#! [spouse.GetCulture.GetNameNoTooltip] เหล่านั้น..."\n"... ชะตากรรมที่เลวร้ายยิ่งกว่าความตาย..."\n"... ข้าได้ยินมาว่าพวกเขาไม่ใช้ #EMP ส้อม#! ด้วยซ้ำ!!"\n\nกระนั้น ข้าจำ [gossip_1.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [gossip_2.Custom2('MyCharacterIntroduction', ROOT.Char)] ที่กำลังนินทากันอยู่ที่มุมห้องได้อย่างชัดเจน ขณะที่ข้าจ้องมองพวกเขาด้วยสายตาอันเคร่งขรึม พวกเขาก็เงียบลงทันที แต่ข้าได้ยินมากพอที่จะรู้หัวข้อที่แน่นอนของการสนทนาของพวกเขา"
 ep3_emperor_yearly.2010.a: "ความต้องการทางการเมืองของจักรวรรดิอยู่เหนือปัจเจกบุคคล"
 ep3_emperor_yearly.2010.b: "ตัวอย่างอันรุ่งโรจน์ของการเสียสละแบบคริสเตียนของ[sent_off.GetHerHis|U]อยู่ในคำอธิษฐานของข้าเสมอ"
 ep3_emperor_yearly.2010.b2: "ตัวอย่างอันรุ่งโรจน์ของการอุทิศตนเพื่อประโยชน์สุขของประชาชน"
 ep3_emperor_yearly.2010.c: "ไม่ใช่หน้าที่ของเจ้าที่จะตัดสินจักรพรรดิ"
 #A Head Unworthy of the Crown
 ep3_emperor_yearly.2020.t: "ศีรษะที่ไม่คู่ควรกับมงกุฎ"
 ep3_emperor_yearly.2020.desc: "วันแรกๆ ของการครองราชย์ในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip]ของข้าช่างวุ่นวาย แต่ในที่สุดก็ถึงเวลาที่ข้าจะได้รับมงกุฎและพรจาก[patriarch.GetTitleAsNameNoTooltip]อย่างเป็นทางการในโถงอันศักดิ์สิทธิ์ของ[ROOT.Char.Custom('TriumphReligiousLocation')]\n\n[patriarch.GetTitledFirstName|U]รอข้าอยู่ที่ทางเข้า — สีหน้าเคร่งขรึมบนใบหน้าของ[patriarch.GetHerHis] — ประตูปิดสนิทอยู่ข้างหลัง[patriarch.GetHerHim]\n\n"เหตุใดเจ้าจึงมา, [ROOT.Char.GetFirstNameNoTooltip]? เจ้าไม่คู่ควร! ที่นี่ไม่มีที่สำหรับคน เช่นเจ้า!""
 ep3_emperor_yearly.2020.a: "ข้าสำนึกผิดและละทิ้งบาปของข้า!"
 ep3_emperor_yearly.2020.a.tt: "ท่านเริ่มต้นเส้นทางแห่งการสำนึกผิดอย่างเปิดเผยและเป็นทางการ เพื่อให้บาปของท่านได้รับการอภัย!"
 ep3_emperor_yearly.2020.a.tt2: "เมื่อสิ้นสุดระยะเวลาการสำนึกผิด ท่านจะสูญเสีย[target_criminal_trait.GetName(GetPlayer)]"
 ep3_emperor_yearly.2020.b: "[ROOT.Char.GetTitleAsNameNoTooltip]เป็นผู้เลือก[patriarch.GetTitleAsNameNoTooltip] ไม่ใช่ในทางกลับกัน"
 ep3_emperor_yearly.2021.t: "การสำนึกผิด"
 ep3_emperor_yearly.2021.desc: "หนึ่งปีเต็มผ่านไปนับตั้งแต่[patriarch.GetTitledFirstName]ตำหนิข้าอย่างรุนแรงสำหรับบาปของข้า และข้าได้เริ่มชดใช้อย่างถ่อมตน เพื่อให้คู่ควรกับมงกุฎที่ข้าสวมใส่ด้วยพระสิริของ[ROOT.Char.GetFaith.HighGodName]"
 ep3_emperor_yearly.2021.desc_patriarch: "\n\nวันนี้เราพบกันอีกครั้ง แต่รอยยิ้มอันเมตตาปรากฏบนใบหน้าของ[patriarch.GetHerHis]"
 ep3_emperor_yearly.2021.desc_patriarch_new: "\n\n[patriarch.GetTitledFirstNameNoTooltip|U]ได้ล่วงลับไปแล้ว แต่ผู้สืบทอดตำแหน่งของ[patriarch.GetHerHis], [patriarch_portrait.GetFirstName], ยืนอยู่ตรงหน้าข้าบัดนี้เพื่อประทานพรของ[patriarch_portrait.GetHerHis]แก่ข้า"
 ep3_emperor_yearly.2021.desc_end: "\n\n"สันติสุขจงมีแด่ท่าน, [ROOT.Char.GetTitledFirstNameNoTooltip]! การเติบโตทางจิตวิญญาณของท่านนั้นยิ่งใหญ่ การสำนึกผิดของท่านนั้นแท้จริง และบาปของท่านจึงได้รับการอภัยแล้ว การครองราชย์ของท่านได้รับพรจาก[ROOT.Char.GetFaith.HighGodNameAlternate]!""
 ep3_emperor_yearly.2021.a: "ข้าคือ[ROOT.Char.GetTitleAsNameNoTooltip]โดยสิทธิ์แห่งมนุษย์และสวรรค์"
 # Usurper
 ep3_emperor_yearly.2030.t: "ผู้ชิงบัลลังก์"
 ep3_emperor_yearly.2030.desc: "อำนาจเป็นของผู้ที่กล้าพอที่จะคว้ามันไว้ และ[ROOT.Char.GetFaith.HighGodName]ทรงโปรดผู้กล้า [ROOT.Char.GetFaith.HighGodNameSheHe|U]ทรงโปรด #EMP ข้า#! อย่างชัดเจน ในที่สุดข้าก็สามารถเรียกตนเองว่า[ROOT.Char.GetTitleAsNameNoTooltip]ได้ อย่างไรก็ตาม [patriarch.GetTitledFirstName|U] ดูเหมือนจะไม่เห็นด้วยกับวิธีการของข้า\n\n"เจ้าเดินบนเส้นทางโลหิตเพื่อปีนขึ้นสู่จุดสูงสุด, [ROOT.Char.GetFirstNameNoTooltip], และกบฏต่อผู้ปกครองที่ชอบธรรมของเจ้า, [ROOT.Char.GetTitleAsNameNoTooltip] [predecessor.GetFirstName]! เจ้าคิดจริงๆ หรือว่า[ROOT.Char.GetFaith.HighGodNameAlternate]จะประทานพรแก่ #EMP ผู้ชิงบัลลังก์#!?"\n\nข้าไม่ต้องการให้[patriarch.GetTitleAsNameNoTooltip]ชอบข้า แต่ข้าปฏิเสธไม่ได้ว่ามันจะ ทำให้เรื่องยากขึ้น..."
 ep3_emperor_yearly.2030.a: "ถ้า เช่นนั้นก็ถึงเวลาสำหรับการเปลี่ยนแปลง!"
 ep3_emperor_yearly.2030.a.tt: "แทนที่[patriarch.GetTitleAsNameNoTooltip]คนปัจจุบันด้วยคนที่สนับสนุนท่าน"
 ep3_emperor_yearly.2030.b: "ข้าจะพิสูจน์คุณค่าของข้า"
 patriarch_support_2030_desc: "การสนับสนุนจากประมุขแห่งศรัทธา"
 patriarch_support_2030_desc_tt: "[patriarch.GetTitleAsNameNoTooltip]จะสนับสนุนผู้ดำรงตำแหน่งก่อนหน้าท่านจนกว่าท่านจะพิสูจน์ตนเอง"
 # Married Again
 ep3_emperor_yearly.2040.t: "แต่งงานอีกครั้ง"
 ep3_emperor_yearly.2040.desc: "เป็นที่ทราบกันโดยทั่วไปว่า[new_wife.GetTitledFirstName]ไม่ใช่[new_wife.GetWifeHusband]คนแรกของข้า และไม่ใช่คนที่สอง การ แต่งงานครั้งล่าสุดของข้า หลังจากการจากไปอย่างโชคร้ายของคู่ครองคนก่อนๆ ได้ก่อให้เกิดเรื่องอื้อฉาวอย่างใหญ่หลวงในแวดวงศาสนาที่นำโดย[patriarch.GetTitledFirstName]\n\n"พรหมจรรย์! พรหมจรรย์และความซื่อสัตย์ต่อความทรงจำของคู่ครองที่[ROOT.Char.GetFaith.HighGodName]ได้ผูกพันท่านไว้ด้วยกัน! นี่คือกฎที่[ROOT.Char.GetFaith.HighGodNameAlternate]ประทานแก่มนุษยชาติ! ข้าจะอนุมัติสิ่งน่ารังเกียจ เช่นนี้ในสายพระเนตรของ[ROOT.Char.GetFaith.HighGodNamePossessive]ได้อย่างไร?!""
 ep3_emperor_yearly.2040.a: "ถ้า เช่นนั้น คนอื่นก็จะทำ"
 ep3_emperor_yearly.2040.b: "การบริจาคอย่างเอื้อเฟื้ออาจช่วยได้?"
 ep3_emperor_yearly.2040.c: "ข้ามั่นใจว่าเป็นความเข้าใจผิด"
 ep3_emperor_yearly.2040.c.success: "[patriarch.GetTitledFirstNameNoTooltip|U] ประทับใจในความรู้ด้านกฎหมายศาสนาของท่าน"
 ep3_emperor_yearly.2040.c.success.tt: "[patriarch.GetTitledFirstNameNoTooltip|U] ประทานพรแก่การ แต่งงานของท่าน"
 ep3_emperor_yearly.2040.c.failure: "[patriarch.GetTitledFirstNameNoTooltip|U] ไม่เชื่อ"
 ep3_emperor_yearly.2040.c.failure.tt: "[patriarch.GetTitledFirstNameNoTooltip|U] ไม่ได้ประทานพรแก่การ แต่งงานของท่าน"
 # A <Komnenos> on the Throne
 ep3_emperor_yearly.2050.t: "ตระกูล[ROOT.Char.GetHouse.GetBaseNameNoTooltip]ขึ้นครองบัลลังก์"
 ep3_emperor_yearly.2050.t2: "ตระกูล[ROOT.Char.GetHouse.GetBaseNameNoTooltip]กลับคืนสู่บัลลังก์"
 ep3_emperor_yearly.2050.desc: "วันนี้จะถูกจดจำว่าเป็นวันที่ยิ่งใหญ่สำหรับตระกูล[ROOT.Char.GetHouse.GetBaseName] นับตั้งแต่สมัยของ[ROOT.Char.GetTitleAsNameNoTooltip] [last_emperor.GetFirstName] ไม่เคยมีชาว[ROOT.Char.GetHouse.GetBaseNameNoTooltip]คนใดได้นั่งบนบัลลังก์แห่ง[title.GetName]!"
 ep3_emperor_yearly.2050.desc_first: "วันนี้เป็นหมุดหมายทางประวัติศาสตร์สำหรับตระกูล[ROOT.Char.GetHouse.GetBaseName] ไม่เคยมีสมาชิกผู้ภาคภูมิใจในครอบครัวของเราคนใดได้นั่งบนบัลลังก์แห่ง[title.GetName]มาก่อน! ไม่เคยมีสิ่งนี้เกิดขึ้น — และน้อยครั้งที่เราจะฝันถึงมัน — ก่อนหน้า #EMP ข้า#!."
 ep3_emperor_yearly.2050.desc_diplo: "\n\nมีชื่อเสียงโด่งดังในฐานะนักการทูต,"
 ep3_emperor_yearly.2050.desc_martial: "\n\nได้รับความเคารพในฐานะแม่ทัพผู้ชาญฉลาด,"
 ep3_emperor_yearly.2050.desc_stewardship: "\n\nได้รับการยอมรับในระดับสากลในฐานะผู้บริหารดินแดนของ[last_emperor.GetHerHis]ที่มีความสามารถ,"
 ep3_emperor_yearly.2050.desc_intrigue: "\n\nเป็นที่หวาดกลัวในด้านเล่ห์เหลี่ยมและกลยุทธ์ลับๆ ของ[last_emperor.GetHerHis],"
 ep3_emperor_yearly.2050.desc_learning: "\n\nเป็นที่ชื่นชมอย่างกว้างขวางในด้านความรู้และปัญญาของ[last_emperor.GetHerHis],"
 ep3_emperor_yearly.2050.desc_prowess: "\n\nเป็นที่จดจำส่วนใหญ่ในด้านความแข็งแกร่งเหนือมนุษย์และความสามารถในสนามรบของ[last_emperor.GetHerHis],"
 ep3_emperor_yearly.2050.desc_fallback: "\n\nแม้จะไม่ใช่เครื่องหมายที่น่าประทับใจที่สุด,"
 ep3_emperor_yearly.2050.desc_first_accomplish: "\n\nญาติพี่น้องของข้ากระตุ้นให้ข้าสร้างมรดกตกทอดชั่วกาลนาน ในอีกหลายศตวรรษ โลกอาจยังคงเคารพทุกนามของตระกูล[ROOT.Char.GetHouse.GetBaseNameNoTooltip] และเหนือสิ่งอื่นใด — [ROOT.Char.GetTitledFirstNameNoTooltipRegnal]ผู้ยิ่งใหญ่ที่นำพวกเขาไปสู่ความรุ่งโรจน์!"
 ep3_emperor_yearly.2050.desc_body: "[last_emperor.GetFirstNameNoTooltip]ได้ทิ้งร่องรอยไว้ในประวัติศาสตร์ บัดนี้ ข้าก้าวแรกเพื่อทิ้งร่องรอยของข้าเอง!"
 ep3_emperor_yearly.2050.a: "มุ่งหน้าสู่เกียรติยศนิรันดร์!"
 # The Queen of Cities
 ep3_emperor_yearly.2060.t: "ราชินีแห่งนคร"
 ep3_emperor_yearly.2060.desc: "นั่น [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] มาพร้อมกับสีหน้าที่เต็มไปด้วยความหวังบนใบหน้าของ[2060_councillor.GetHerHis]\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip]ของข้า ดังที่ท่านทราบดีอยู่แล้ว วันครบรอบการก่อตั้งราชินีแห่งนครอันรุ่งโรจน์ของเรา, [queen_city.GetNameNoTier], ตรงกับวันที่ 11 พฤษภาคม ซึ่งเร็วกว่าที่คิดไว้มาก! ผู้คนต่างพูดคุยและบ่นกัน เนื่องจากไม่มีการเฉลิมฉลองมาหลายปีแล้ว\n\n"เราควรจัดงานเฉลิมฉลองที่คู่ควรกับนครอันยิ่งใหญ่ของคอนสแตนตินหรือไม่?""
 ep3_emperor_yearly.2060.desc_century: "นั่น [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] มาพร้อมกับก้าวย่างที่ตื่นเต้นของ[2060_councillor.GetHerHis]\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip]ของข้า ดังที่ท่านทราบดีอยู่แล้ว วันครบรอบการก่อตั้งราชินีแห่งนครอันรุ่งโรจน์ของเราครั้งต่อไป, [queen_city.GetNameNoTier], จะเป็น #EMP ศตวรรษ#! จากปี 324 อันห่างไกล เมื่อคอนสแตนตินมหาราชทรงเลือกให้เป็นโรมใหม่ของพระองค์\n\n"นี่เป็นโอกาสที่สมบูรณ์แบบสำหรับการเฉลิมฉลองครั้งยิ่งใหญ่ที่ไม่เหมือนใคร! ประชาชนจะรักท่าน และประวัติศาสตร์จะจดจำการมีส่วนร่วมของท่าน""
 ep3_emperor_yearly.2060.a: "มีเพียงการเฉลิมฉลองที่ยิ่งใหญ่ที่สุดเท่านั้นที่จะเพียงพอ!"
 ep3_emperor_yearly.2060.b: "ถ้า เช่นนั้น การเฉลิมฉลองอันยิ่งใหญ่ก็สมควรแล้ว!"
 ep3_emperor_yearly.2060.c: "การเฉลิมฉลองใดๆ ก็ตามจะต้องรอไปก่อน"
 constantinople_birthday_flag_desc: "การเฉลิมฉลองวันครบรอบการก่อตั้งคอนสแตนติโนเปิล"
 constantinople_birthday_flag_tt: "การจัดกิจกรรม[GetActivityType('activity_chariot_race').GetName]ในอีก 5 ปีข้างหน้าจะถูกลง 50%"
 # Exotic Gifts
 ep3_emperor_yearly.2070.t: "ของขวัญแปลกตา"
 ep3_emperor_yearly.2070.desc: "[ambassador.GetWomanMan]ที่อยู่ตรงหน้าข้าดูเหมือนจะมาจากแดนไกล พิจารณาจากเครื่อง แต่งกายที่แปลกตาและลักษณะของขวัญที่[ambassador.GetSheHe]นำมา: ทองคำ, งาช้าง, เกลือ...\n\nอย่างไรก็ตาม ขณะที่ของถวายชิ้นสุดท้ายเดินผ่านประตูเข้ามา ความคิดที่มีเหตุผลทั้งหมดของข้าก็หยุดชะงัก — #EMP ในนามของ[ROOT.Char.GetFaith.HealthGodName] สัตว์นั่นคืออะไรกัน?!#! ข้าสามารถอธิบายได้เพียงว่าเป็น #EMP ม้า#! ลายจุดยักษ์ที่มีคอยาว...\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip]ผู้ยิ่งใหญ่ ข้านำของขวัญมาจากดินแดนแห่ง[ambassador_liege.GetPrimaryTitle.GetBaseNameNoTier] รวมถึงสัตว์สง่างามนี้ที่เราเรียกว่า #EMP ยีราฟ#! โปรดรับเครื่องบรรณาการอันต่ำต้อยของ[ambassador_liege.GetLadyLord]ของข้าด้วย""
 ep3_emperor_yearly.2070.a: "ของขวัญทุกชิ้นเป็นที่ต้อนรับ"
 ep3_emperor_yearly.2070.b: "ทำไม #EMP ท่าน#! ไม่พักอยู่ที่นี่แทนล่ะ?"
 ep3_emperor_yearly.2070.b.tt: "[ambassador.GetFirstNameNoTooltip|U] เป็นนักการทูตที่ยอดเยี่ยม ซึ่งสามารถรับใช้ข้าได้เป็นอย่างดี!"
 ep3_emperor_yearly.2070.b.success: "[ambassador.GetFirstNameNoTooltip|U] ประทับใจในอาณาจักรของท่านและยอมรับข้อเสนอของท่านที่จะอยู่ต่อ"
 ep3_emperor_yearly.2070.b.success.tt: "รับ[ambassador.GetFirstNameNoTooltip|U]เข้าสังกัด"
 ep3_emperor_yearly.2070.b.failure: "[ambassador.GetFirstNameNoTooltip|U] ต้องการ #EMP การโน้มน้าวประเภททองคำ#! เพื่อที่จะอยู่ต่อ"
 ep3_emperor_yearly.2070.b.failure.tt: "$ep3_emperor_yearly.2070.b.success.tt$"
 ep3_emperor_yearly.2070.c: "แน่นอน, ดี... ไปได้แล้ว"
 ep3_emperor_yearly.2070.c.tt: "โยนของขวัญลงกองรวมกับของอื่นๆ แล้วส่งสัตว์ร้ายไปที่ห้องครัว หรืออะไรทำนองนั้น"
 # A School for the People
 ep3_emperor_yearly.2080.t: "โรงเรียนเพื่อประชาชน"
 ep3_emperor_yearly.2080.desc: "[school_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กล่าวขึ้น พลางเลือกใช้ถ้อยคำของ[school_proposer.GetHerHis]อย่างสุขุมนุ่มนวล\n\n"ผู้คนแห่ง [school_county.GetNameNoTier] ได้สังเกตเห็นถึงการลงทุนที่หลั่งไหลเข้ามาในโครงการก่อสร้างล่าสุดของท่าน ในขณะที่ทุกคนย่อมภาคภูมิใจในการเติบโตของนครอันเป็นที่รักของเรา การปรับปรุงบางอย่างย่อมจะเข้าถึงจิตใจเหล่าไพร่ฟ้าข้าแผ่นดินของท่านทั้งสูงศักดิ์และต่ำต้อยได้มากกว่า""
 ep3_emperor_yearly.2080.desc_byz: "\n\nข้าขอแนะนำให้ท่านสร้างโรงเรียนที่ได้รับทุนสนับสนุนจากจักรวรรดิพร้อมด้วย[Glossary( 'แกรมมาติคอย', 'GRAMMATIKOS_GLOSS' )]ที่ได้รับการยอมรับอย่างสูง ยิ่งสามัญชนสามารถได้รับการศึกษาที่ดีมากเท่าใด ก็ยิ่งมีผู้เข้าร่วมในตำแหน่งบริหารของจักรวรรดิมากขึ้นเท่านั้น — เป็นประโยชน์ต่อเรา และเป็นการปรับปรุงสภาพทางสังคมสำหรับพวกเขา!""
 ep3_emperor_yearly.2080.desc_gen: "\n\nตัวอย่าง เช่น การให้ทุนสนับสนุนโรงเรียนที่ผู้คนจากทุกภูมิหลังทางสังคมสามารถศึกษาเพื่อเข้ารับราชการในฝ่ายบริหารของจักรวรรดิ!"
 ep3_emperor_yearly.2080.a: "ระบบราชการที่ทำงานได้ดีต้องการข้าราชการใหม่เสมอ"
 ep3_emperor_yearly.2080.a.tt: "ท่านจะได้รับผลประโยชน์เมื่อการก่อสร้างโรงเรียนเสร็จสิ้น ในอีก 5 ปี"
 ep3_emperor_yearly.2080.b: "ตอนนี้เรามีลำดับความสำคัญอื่น"
 GRAMMATIKOS_GLOSS: "ระบบการศึกษาของไบแซนไทน์ส่วนใหญ่สืบทอดมาจากโรมยุคคลาสสิก และแบ่งออกเป็น 3 ระดับ: #EMP grammatistes#! สอนเด็กเล็กเกี่ยวกับพื้นฐานการอ่าน การเขียน และการนับเลข; #EMP grammatikos#! สอนเด็กโตเกี่ยวกับวรรณคดีและภาษากรีกคลาสสิก; สุดท้าย #EMP rhetor#! สอนวัยรุ่นเกี่ยวกับวาทศิลป์ — ศิลปะการพูดอย่างชัดเจนและโน้มน้าวใจ"
 # A Popular Mime
 ep3_emperor_yearly.2090.t: "นักแสดงใบ้ยอดนิยม"
 ep3_emperor_yearly.2090.desc: "ตรงหน้าข้าคือใบหน้าที่คุ้นเคย มันคือ[mime.GetFirstName], [Glossary( 'นิมอส', 'MIMOS_GLOSS' )]ที่ได้รับความนิยมสูงสุดในหมู่ประชาชน\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip]ผู้ยิ่งใหญ่ ข้าไม่ต้องการการแนะนำตัว — ชื่อของข้าเป็นที่รู้จักและเป็นที่รักของทุกคน สนามฮิปโปโดรมเงียบสงัดเมื่อข้าแสดง และโห่ร้องเมื่อข้าบอกให้พวกเขาทำ ท่านทราบถึงอิทธิพลของข้าที่มีต่อฝูงชน เราทั้งคู่มีบางสิ่งที่จะได้รับจากการร่วมมือกันอย่างใกล้ชิดยิ่งขึ้น""
 ep3_emperor_yearly.2090.a: "เจ้าสามารถช่วยเอาชนะใจชาว[control_target.GetNameNoTooltip]ได้"
 ep3_emperor_yearly.2090.b: "มีเพียงราชสำนักของข้าเท่านั้นที่คู่ควรกับความบันเทิงระดับนี้"
 ep3_emperor_yearly.2090.c: "ข้าไม่มีเวลาสำหรับ #EMP พวกนักแสดงเร่#!."
 ep3_emperor_yearly.2090.a.tt: "ความช่วยเหลือของ[mime.GetFirstNamePossessiveNoTooltip]เพิ่มประสิทธิภาพของภารกิจสภา $task_increase_control$ ของ $councillor_marshal$ ของท่าน"
 ep3_emperor_yearly.2090.b.tt: "พรสวรรค์และชื่อเสียงของ[mime.GetFirstNamePossessiveNoTooltip]เพิ่มความถนัดของ[mime.GetHerHis]ในฐานะ $court_jester_court_position$"
 court_position_famous_mime: "นักแสดงใบ้ยอดนิยม"
 MARSHAL_INCREASE_CONTROL_MIME_MODIFIER: "ได้รับการสนับสนุนจากนักแสดงใบ้ยอดนิยม"
 MIMOS_GLOSS: "ลักษณะที่แท้จริงของ นิมอส ไบแซนไทน์ ซึ่งมักแปลว่า #EMP นักแสดงใบ้#! เพื่อความเรียบง่ายนั้นยากที่จะนิยาม ชื่อนี้ครอบคลุมนักแสดงตลกหลากหลายประเภท: นักแสดงละครใบ้เกี่ยวกับเทพปกรณัม, นักเล่นกล, นักกายกรรม, นักเต้น, ตัวตลก และแม้ แต่ผู้ประกอบอาชีพรูปแบบแรกเริ่มของการแสดงล้อเลียน"
 # A Border Treaty
 ep3_emperor_yearly.2100.t: "สนธิสัญญาชายแดน"
 ep3_emperor_yearly.2100.desc: "[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้าเฝ้ายังบัลลังก์ พร้อมด้วยกองเอกสารในอ้อมแขนของ[chancellor.GetHerHis]\n\n"ข้า แต่[ROOT.Char.Custom('FormOfAddressForLiege')]ของข้า ข้าได้วิเคราะห์สนธิสัญญาบางฉบับกับเพื่อนบ้านของเรา [neighbor.GetTitledFirstName] ปรากฏว่าสนธิสัญญาพรมแดนที่เกี่ยวข้องกับ [contested_county.GetName] นั้นมีอยู่หลายฉบับที่ไม่ตรงกัน ซึ่งบางฉบับนั้นเป็นประโยชน์ต่อเราอย่างมากยิ่งกว่าฉบับที่เรากำลังยึดถืออยู่ในปัจจุบัน!\n\n"หากท่านอนุญาต ข้าใคร่ขอพยายามบังคับใช้ฉบับที่เป็นประโยชน์สูงสุดให้เป็นสนธิสัญญาอย่างเป็นทางการที่ทุกฝ่ายที่เกี่ยวข้องต้องยึดถือ!""
 ep3_emperor_yearly.2100.a: "จงทำ"
 ep3_emperor_yearly.2100.a.success: "สนธิสัญญาฉบับของเราได้รับการยอมรับ"
 ep3_emperor_yearly.2100.a.success.tt: "ยอมรับฉบับ"
 ep3_emperor_yearly.2100.a.failure: "สนธิสัญญาฉบับของเราถูกปฏิเสธ"
 ep3_emperor_yearly.2100.a.failure.tt: "ปฏิเสธฉบับ"
 ep3_emperor_yearly.2100.a.crit_fail: "พวกเขาใช้ฉบับที่เก่ากว่ามาต่อต้านเรา"
 ep3_emperor_yearly.2100.a.crit_fail.tt: "พบฉบับที่เป็นปฏิปักษ์"
 ep3_emperor_yearly.2100.b: "แจ้ง[neighbor.GetFirstNameNoTooltip]: มาหาข้อตกลงกันเถอะ"
 ep3_emperor_yearly.2100.c: "ฝังหลักฐานทั้งหมด"
 TRUCE_COLLABORATION: "ข้อตกลงสันติภาพ"
 ep3_emperor_yearly.2100.angry_error_log: ""
 # Mediators of X
 ep3_emperor_yearly.2110.t: "ผู้ไกล่เกลี่ยแห่ง[provincial_county.GetNameNoTierNoTooltip]"
 ep3_emperor_yearly.2110.desc_same: "ข้าจำที่มาของผู้ร้องทุกข์ที่ยืนอยู่ตรงหน้าได้ทันที: [merchant.GetSheHe]เป็นชาว[merchant.GetCulture.GetNameNoTooltip] เช่นเดียวกับข้า ทันทีที่[merchant.GetSheHe]เริ่มพูด ข้าก็สัมผัสได้ถึงสำเนียงที่คุ้นเคย"
 ep3_emperor_yearly.2110.desc_other: "ผู้ร้องทุกข์ที่อยู่ตรงหน้าข้าตอนนี้ดูเหมือนจะไม่ใช่ชาว[ROOT.Char.GetCulture.GetNameNoTooltip] คงเป็น #EMP คนต่างจังหวัด#! บางคนกระมัง ทันทีที่[merchant.GetSheHe]เริ่มพูด ข้าก็สัมผัสได้ถึงสำเนียงป่าเถื่อน แต่คุ้นเคยเล็กน้อย"
 ep3_emperor_yearly.2110.desc: "\n\n"[ROOT.Char.GetTitleAsNameNoTooltip|U], ข้าเป็นตัวแทนของกลุ่มพ่อค้าจาก[provincial_county.GetNameNoTier] เนื่องจากอาศัยอยู่ในดินแดนนี้มานาน ค้าขายกับคนท้องถิ่นและกับข้าราชการจากเมืองหลวง เราตระหนักดีถึงความยากลำบากในการติดต่อกับประชากรที่ยังไม่ถูกผนวกรวม และมีความพร้อมเป็นพิเศษที่จะช่วยเหลือ\n\nดังนั้น เราจึงขอเสนอตัวให้บริการในฐานะนักแปลและล่ามอย่างเป็นทางการ""
 ep3_emperor_yearly.2110.a: "บริการของท่านเป็นที่ต้องการอย่างยิ่งในการบริหารท้องถิ่น"
 ep3_emperor_yearly.2110.b: "เราต้องการท่านที่นี่ในเมืองหลวง"
 ep3_emperor_yearly.2110.c: "เป็นหน้าที่ของชาว[merchant.GetCulture.GetCollectiveNounNoTooltip]ที่ควรเรียนรู้วิถีของเมืองหลวง"
 # Foreign Pretentiousness
 ep3_emperor_yearly.2120.t: "ความโอ้อวดของชาวต่างชาติ"
 ep3_emperor_yearly.2120.desc: "[complainer.GetTitledFirstName]ดูเหมือนจะรำคาญอะไรบางอย่าง\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ของข้า ราชสำนักกำลังเดือดดาลกับ[the_byz.Custom2('YourCharacterIntroduction', ROOT.Char)]! พฤติกรรมหยิ่งยโสและโอ้อวดของ[the_byz.GetHerHis|U]นั้นเห็นได้ชัดเจน และตั้งแต่[the_byz.GetHerHis]มาถึง [the_byz.GetSheHe]ก็ได้นำธรรมเนียม #EMP หรูหรา#! เข้ามาในราชสำนัก: [the_byz.GetSheHe]รับประทานอาหารด้วยส้อมทองคำ ปฏิเสธที่จะอาบน้ำร่วมกับเราเหมือนคนอื่น ใส่น้ำหอมในห้องของ[the_byz.GetHerHis]ด้วยสมุนไพรน่าสงสัย และสวมเสื้อผ้าไหมที่นุ่มนวลอย่างบาปหนา!\n\n"ท่านต้องยุติความบ้าคลั่งนี้ ก่อนที่ความเสื่อมทรามทางศีลธรรมของ[the_byz.GetHerHis]จะแพร่กระจาย!""
 ep3_emperor_yearly.2120.a: "เราทุกคนควรเรียนรู้จาก[the_byz.GetFirstNameNoTooltip]!"
 ep3_emperor_yearly.2120.b: "เราจะไม่ทนต่อเรื่องไร้สาระของชาวต่างชาตินี้"
 ep3_emperor_yearly.2120.c: "พูดตามตรง? ไม่มีใครสนใจหรอก"
 # A Plea for Freedom
 ep3_emperor_yearly.2130.t: "คำร้องขออิสรภาพ"
 ep3_emperor_yearly.2130.desc: ""ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ผู้ทรงเมตตาและสูงศักดิ์ โปรดฟังคำร้องของข้า" ผู้ร้องทุกข์ผู้นี้ถูกขนาบข้างด้วยทหารยามสองคน และมือของ[prisoner.GetHerHis]ถูกมัดไว้อย่างแน่นหนา ข้าจำนักโทษของข้าได้, [prisoner.GetTitledFirstName]\n\n"ข้าทนทุกข์ทรมานในที่คุมขังมานานเกินไปแล้ว โปรดแสดงความเมตตาและปล่อยข้าไปเถิด! ไม่มีสิ่งใดมีค่าต่อหัวใจของข้ามากไปกว่าอิสรภาพ ดังนั้นจึงไม่มีราคาใดจะสูงเกินไปสำหรับมัน เรียกร้องสิ่งใดก็ได้จากข้า แล้วข้าจะเชื่อฟัง!""
 ep3_emperor_yearly.2130.a: "เจ้าได้รับการอภัยโทษโดยสมบูรณ์ ณ บัดนี้"
 ep3_emperor_yearly.2130.b: "เจ้าจะต้องสนับสนุนข้า"
 ep3_emperor_yearly.2130.c: "ชีวิตของเจ้าเป็นของข้าแล้วตอนนี้"
 ep3_emperor_yearly.2130.c.tt: "[prisoner.GetFirstNameNoTooltip] จะถูกบังคับให้ยอมรับการเป็นสายลับในแผนการทั้งหมดของท่าน"
 ep3_emperor_yearly.2130.d: "เจ้าจะต้องส่งกองกำลังมาให้ข้า"
 ep3_emperor_yearly.2130.e: "ปฏิเสธ ออกไปให้พ้นสายตาข้าบัดนี้"
 SCHEME_OWE_FREEDOM: "ข้าเป็นหนี้อิสรภาพของข้าแก่ท่าน: $VALUE|+0=$"
 # Empty Coffers, Empty Mausoleums
 ep3_emperor_yearly.2140.t: "คลังว่างเปล่า สุสานว่างเปล่า"
 ep3_emperor_yearly.2140.desc: "การจัดการ[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]เป็นธุรกิจที่มีค่าใช้จ่ายสูง และข้าอาจจะประมาทเรื่องการเงินของเราไปหน่อย หนี้สินทับถมหนี้สิน และคลังก็ว่างเปล่า\n\nข้าจะหาทองคำได้จากที่ไหน #EMP ตอนนี้เลย#!?\n\nความคิดที่น่าละอาย ดูหมิ่นศาสนา แต่ #EMP ยอดเยี่ยม#! ก็ผุดขึ้นมาในหัวข้าทันที: จักรพรรดิผู้ยิ่งใหญ่ในอดีตมักถูกฝังพร้อมกับเครื่องประกอบพิธีศพที่หรูหรา! ข้าเพียงแค่ต้องนำสิ่งของเหล่านี้บางส่วนกลับมาใช้ใหม่เพื่อชำระหนี้ของเรา ทรัพย์สมบัติทั้งหมดนี้เป็นของจักรวรรดิอยู่แล้วไม่ใช่หรือ?"
 ep3_emperor_yearly.2140.a: "ข้ามั่นใจว่าคนตายคงไม่ว่าอะไร"
 ep3_emperor_yearly.2140.b: "ข้าจะไม่ตกต่ำถึงเพียงนี้!"
 # The Saint of X
 ep3_emperor_yearly.2150.t: "นักบุญแห่ง[capital.GetNameNoTooltip]"
 ep3_emperor_yearly.2150.desc: "ผู้คนใน[capital.GetName]กำลังพูดถึง[saint.GetWomanMan]ผู้ศักดิ์สิทธิ์คนหนึ่ง ชื่อ [saint.GetFirstName] ผู้ ซึ่งดำเนินชีวิตตามแบบนักบุญในสมัยโบราณ"
 ep3_emperor_yearly.2150.desc.stylite: "\n\nเช่นเดียวกับผู้ที่เรามักเรียกว่า "สไตไลต์" [saint.GetSheHe]ได้เลือกเสาเก่าในเมืองเป็นบ้านของ[saint.GetHerHis] [saint.GetSheHe]ใช้ชีวิตทั้งหมดอยู่บนยอดเสา ผูกมัดแน่นหนาเพื่อไม่ให้ตก นุ่งห่มด้วยผ้าขี้ริ้ว กินเพียงอาหารที่ศิษย์ผู้ใจบุญชักรอกขึ้นไปให้[saint.GetHerHim]ด้วยเชือกและรอก"
 ep3_emperor_yearly.2150.desc.grazer: "\n\nเช่นเดียวกับผู้ที่เรามักเรียกว่า "ผู้กินหญ้า" [saint.GetSheHe]อาศัยอยู่ในถิ่นทุรกันดาร เป็นสัตว์ป่าท่ามกลางสัตว์ป่า เปลือยกาย โดดเดี่ยว [saint.GetSheHe]ดำรงชีวิตอยู่ด้วยสิ่งที่แผ่นดินมอบให้โดยเสรี และเงินบริจาคจากผู้คนที่ผ่านไปมาเป็นครั้งคราว"
 ep3_emperor_yearly.2150.desc.iron: "\n\nเช่นเดียวกับผู้ที่เรามักเรียกว่า "ผู้สวมเหล็ก" [saint.GetSheHe]ใช้ชีวิตอยู่นิ่งๆ ปกคลุมด้วยโซ่หนักเพื่อทรมานเนื้อหนัง เหล็กบาดลึกเข้าไปในข้อมือที่แตกของ[saint.GetHerHis] แต่ไม่มีเสียงถอนหายใจเล็ดลอดออกมาจากริมฝีปากของ[saint.GetHerHis] มีเพียงความเมตตาของผู้คนที่ผ่านไปมาเท่านั้นที่ให้อาหารและปกคลุมร่างกายที่เปื้อนเลือดของ[saint.GetHerHis]"
 ep3_emperor_yearly.2150.desc.end: "\n\nไม่ใช่เรื่องแปลกที่นักต้มตุ๋นจะหาเลี้ยงชีพจากการกุศลที่ผิดพลาดของพลเมืองของเรา ปลอมแปลงบาดแผลและแสดงท่าทีศักดิ์สิทธิ์ที่ฝึกฝนมาอย่างดี แต่ถ้า[saint.GetFirstNameNoTooltip]เป็นนักบุญจริงๆ ล่ะ?"
 ep3_emperor_yearly.2150.a: "[saint.GetWomanMan]ผู้นี้ได้รับพรจาก[ROOT.Char.GetFaith.HighGodName]!"
 ep3_emperor_yearly.2150.a.tt: "ข้าจะสนับสนุนการทรงเรียกอันศักดิ์สิทธิ์ของ[saint.GetHerHis]!"
 ep3_emperor_yearly.2150.b: "ข้าจะทดสอบ[saint.GetHerHim]ด้วยตนเอง!"
 ep3_emperor_yearly.2150.c: "[saint.GetWomenMen]ผู้ศักดิ์สิทธิ์ได้หยุดเดินท่ามกลางพวกเราไปนานแล้ว"
 ep3_emperor_yearly.2150.c.tt: "[governor_efficiency|E]ของท่านเพิ่มขึ้น #P 3%#!"
 ep3_emperor_yearly.2150.b.tt.success: "ท่านค้นพบความจริง"
 ep3_emperor_yearly.2150.b.tt.holy: "[saint.GetFirstNameNoTooltip]เป็น[saint.GetWomanMan]ผู้ศักดิ์สิทธิ์อย่างแท้จริง"
 ep3_emperor_yearly.2150.b.tt.crook: "[saint.GetFirstNameNoTooltip]เป็นนักต้มตุ๋นธรรมดา"
 ep3_emperor_yearly.2150.b.tt.failure: "ท่านไม่รู้อะไรมากขึ้นเลย"
 ep3_emperor_yearly.2150.b.tt.continue: "ท่านต้องปล่อยให้[saint.GetFirstNameNoTooltip]ดำเนินตามการแสวงหาอันศักดิ์สิทธิ์ของ[saint.GetHerHis]ต่อไป"
 ep3_emperor_yearly.2150.b.tt: "[governor_efficiency|E]ของท่านเพิ่มขึ้น #P 10%#!"
 ep3_emperor_yearly.2151.desc: "หลายปีแล้วที่ข้าได้ยินเรื่อง[saint.GetFirstNameNicknamed] นักบุญของประชาชนแห่ง[capital.GetName]ครั้งสุดท้าย ข้าสงสัยว่าทำไมมันถึงเข้ามาในความคิดของข้าตอนนี้...\n\n"[chaplain.GetTitledFirstName|U], ท่านจำฤาษีประหลาดคนนั้นได้ไหม, [saint.GetFirstNameNoTooltip]? เกิดอะไรขึ้นกับ[saint.GetHerHim]?""
 ep3_emperor_yearly.2151.desc_saint: "\n\n"นักบุญที่แท้จริง ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ผู้ยิ่งใหญ่! ผลแห่งการกระทำอันศักดิ์สิทธิ์ของ[saint.GetHerHis]ยังคงรู้สึกได้ทั่วแผ่นดิน!""
 ep3_emperor_yearly.2151.desc_crook: "\n\n"เป็นเพียงนักต้มตุ๋นธรรมดา ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ของข้า เพียงไม่กี่เดือนหลังจากเรื่องนี้ถูกส่งมาให้ท่าน ก็มีการค้นพบว่า[saint.GetSheHe]ปลอมแปลงบาดแผลของ[saint.GetHerHis]ด้วยเลือดแกะและกินอย่างอิ่มหนำสำราญในโรงเตี๊ยมใกล้เคียง!""
 ep3_emperor_yearly.2151.a: "ใครจะคาดคิดได้!"
 # People of the Frontier
 ep3_emperor_yearly.2160.t: "ผู้คนแห่งชายแดน"
 ep3_emperor_yearly.2160.desc: "เพื่อนบ้านชาว[nomad_neighbor.GetCulture.GetNameNoTooltip]ของเรากลายเป็นเรื่องน่ารำคาญพอสมควรเมื่อเร็วๆ นี้ วิถีชีวิตเร่ร่อนและ #EMP ไร้ระเบียบ#! ของพวกเขา ทำให้พรมแดนเป็นแนวคิดที่ค่อนข้างสัมพัทธ์และซึมผ่านได้ง่าย จนกระทั่งมีจำนวนมากขึ้นเรื่อยๆ เริ่มย้ายจาก[nomad_county.GetNameNoTier]ไปยัง[our_county.GetNameNoTier]อย่างสม่ำเสมอมากขึ้น\n\nตอนแรกเป็นเพียงม้าพเนจรที่เล็มหญ้าในดินแดนของเราเป็นครั้งคราว จากนั้นฝูงทั้งฝูงก็มาถึง และตอนนี้หมู่บ้านที่เหมาะสม พร้อมทั้งครอบครัวและสินค้าทั้งหมดของพวกเขาได้เข้ามาใน[our_county.GetNameNoTooltip]แล้ว\n\nแรงกดดันของประชากรอนารยชนบนพรมแดนของจักรวรรดิไม่ใช่ปัญหาใหม่ แต่เวลาเปลี่ยนไปแล้ว"
 ep3_emperor_yearly.2160.a: "พวกเขายินดีที่จะตั้งรกรากที่นี่"
 ep3_emperor_yearly.2160.a.tt: "จักรวรรดิมีประเพณีโบราณในการยอมรับและผนวกรวมอนารยชนทุกคนที่ต้องการตั้งรกรากในดินแดนของเรา"
 ep3_emperor_yearly.2160.b: "นี่เป็นสิ่งที่ยอมรับไม่ได้!"
 ep3_emperor_yearly.2160.b.flavor: "ท่านหยิบยกประเด็นนี้กับผู้นำของพวกเขา, [nomad_neighbor.GetTitledFirstNameNoTooltip]"
 ep3_emperor_yearly.2160.b.tt.success: "ท่านได้รับชัยชนะจากการยกระดับทางการทูต"
 ep3_emperor_yearly.2160.b.tt.failure: "กระแสการทูตพลิกผันต่อต้านท่าน"
 ep3_emperor_yearly.2160.b.success: "การแลกเปลี่ยนทางการทูตในเชิงบวก"
 ep3_emperor_yearly.2160.b.failure: "การแลกเปลี่ยนทางการทูตในเชิงลบ"
 ep3_emperor_yearly.2160.b.tt: "[governor_efficiency|E]ของท่านเพิ่มขึ้น #P 5%#!"
 ep3_emperor_yearly.2160.b.tt2: "[governor_efficiency|E]ของท่านลดลง #N 5%#!"
 # Secret Tunnels
 ep3_emperor_yearly.2170.t: "อุโมงค์ลับ"
 ep3_emperor_yearly.2170.desc: "[our_county.GetNameNoTier] เป็นพื้นที่ที่ยากลำบาก และการควบคุมของเราเหนือดินแดนแห่งนี้ก็ช่างเปราะบางเสียเหลือเกิน ผู้คนในนั้นคือผู้รอดชีวิตที่แข็งแกร่ง ผู้ ซึ่งมีความรู้และความชำนาญในภูมิประเทศที่ทุรกันดารและป่าเถื่อนของตนอย่างหาตัวจับยาก\n\nในการนี้ พวกเขาได้รับความช่วยเหลือจากสิ่งที่ตนสร้างขึ้น: เครือข่ายอุโมงค์อันกว้างขวาง ที่ซ่อนภัยลับ และถิ่นฐานใต้ดิน ซึ่งพวกเขาสามารถหายตัวไปได้อย่างง่ายดาย เมื่อใดก็ตามที่อากาศแปรปรวน ศัตรูโจมตี หรือคนเก็บภาษีของเรามาถึง เพื่อทวงถามสิ่งที่พึงต้องชำระแก่ [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]"
 ep3_emperor_yearly.2170.a: "นี่อาจจะมีประโยชน์..."
 ep3_emperor_yearly.2170.b: "การปฏิบัติที่ผิดกฎหมายนี้ต้องยุติลง"
 # A Warm Meal?
 ep3_emperor_yearly.2180.t: "อาหารอุ่นๆ สักมื้อ?"
 ep3_emperor_yearly.2180.desc: "พลบค่ำมาถึงขณะที่เราเดินทางผ่าน[location.Custom('GetTerrainTypePlural')]รอบๆ [location.GetName] ยังคงอยู่ห่างจากชุมชนที่ใกล้ที่สุดพอสมควร\n\nสัญญาณเดียวของการมีอยู่ของมนุษย์ที่เราเห็นเป็นระยะทางหลายไมล์คือกำแพงด้านนอกที่น่าเกรงขามของสิ่งที่ดูเหมือนจะเป็นคฤหาสน์ส่วนตัวบางประเภท"
 ep3_emperor_yearly.2180.desc_capital: "พลบค่ำมาถึงยังคงอยู่ห่างจากกำแพงที่ปลอดภัยของ[location.GetName]พอสมควร\n\nอาคารภายนอกของคฤหาสน์หรูหราปรากฏแก่สายตา ช่างผ่อนคลายเพียงใดที่จะได้พักค้างคืนที่นี่ ห่างจากถนนที่เต็มไปด้วยฝุ่นและก่อนที่จะดำดิ่งสู่ความอึกทึกของเมืองหลวงอันยิ่งใหญ่!"
 ep3_emperor_yearly.2180.desc_fellow: "\n\nหากความทรงจำของข้าไม่ทรยศ ดินแดนเหล่านี้ควรเป็นของ[event_host.GetTitledFirstName] [event_host.GetSheHe|U]จะต้องแสดงความเมตตาต่อเราบ้าง!"
 ep3_emperor_yearly.2180.desc_foreigner: "\n\nน่าเสียดาย ข้าไม่คุ้นเคยกับเจ้าเมืองหรือท่านหญิงแห่งดินแดนนี้ หวังว่าพวกเขาจะไม่ปฏิเสธอาหารอุ่นๆ และเตียงนอนอันต่ำต้อยแก่ผู้แสวงบุญที่น่าสงสาร!"
 ep3_emperor_yearly.2180.a: "เราควรขอที่พักพิง"
 ep3_emperor_yearly.2180.a.tt: "เราจะได้เห็นว่าเราจะได้รับการตอบสนองแบบใด"
 ep3_emperor_yearly.2180.b: "ไม่มีเวลาให้เสียที่นี่"
 ep3_emperor_yearly.2181.desc: "ดวงอาทิตย์เพิ่งลับขอบฟ้าเหนือทรัพย์สินของข้าใน[location.GetName] เมื่อกลุ่มนักเดินทางที่ดูซอมซ่อปรากฏตัวที่ประตูบ้านข้า"
 ep3_emperor_yearly.2181.desc_fellow: "\n\n"[ROOT.Char.GetFirstNameNoTooltip], สหายของข้า, ในนามของ[ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U]อันเป็นที่รักของเรา ซึ่งเราทั้งคู่รับใช้อย่างซื่อสัตย์ โปรดเปิดประตูต้อนรับผู้แสวงบุญที่ต่ำต้อยบางส่วนที่กำลังข้ามผ่านดินแดนของท่าน!""
 ep3_emperor_yearly.2181.desc_foreigner: "\n\n"เจ้าเมืองหรือท่านหญิงแห่งบ้านอันงดงามนี้ นามของข้าคือ[pilgrim.GetTitledFirstNameNoTooltip] แต่วันนี้ข้าเป็นเพียงผู้แสวงบุญที่ต่ำต้อยที่กำลังข้ามผ่านดินแดนของท่าน! ท่านจะกรุณาเสนออาหารอุ่นๆ และเตียงนอนให้เราสำหรับคืนนี้ได้หรือไม่?""
 ep3_emperor_yearly.2181.a: "แน่นอน, ขอ[ROOT.Char.GetFaith.HighGodName]อวยพรท่าน!"
 ep3_emperor_yearly.2181.a_flavor: "นั่งที่โต๊ะของข้าสิ! และหลังอาหารเย็น ข้าจะแสดงทางลัดให้ท่านด้วย เพื่อที่ท่านจะได้บอกทุกคนตลอดทางว่าข้าใจดีแค่ไหน!"
 ep3_emperor_yearly.2181.b: "ท่านยินดีต้อนรับที่บ้านของข้า และให้ข้าช่วยท่านด้วย"
 ep3_emperor_yearly.2181.b_flavor: "คนรับใช้ของข้าจะนำทางท่าน และทหารยามของข้าจะคุ้มกันท่านตั้งแต่วันพรุ่งนี้เป็นต้นไป"
 ep3_emperor_yearly.2181.c: "การต้อนรับไม่ได้มาฟรีๆ"
 ep3_emperor_yearly.2181.a.tt: "การต้อนรับที่เป็นมิตร"
 ep3_emperor_yearly.2181.b.tt: "การต้อนรับที่ยอดเยี่ยม"
 ep3_emperor_yearly.2181.c.tt: "ปฏิเสธการต้อนรับ"
 # The Granaries of the Powerful
 ep3_emperor_yearly.2190.t: "ยุ้งฉางของผู้ทรงอำนาจ"
 ep3_emperor_yearly.2190.desc: "ยุ้งฉางของ[Glossary( 'ดูนาทอย', 'DYNATOI_GLOSS')]เต็มเสมอ ชาวนาผู้โหยหากล่าว\n\nในบางกรณี นี่เป็นความจริงยิ่งกว่าที่เคย ในวันนี้ ข้าได้เรียกตัว[landowner.GetTitledFirstName] เจ้าของที่ดินใน[capital.GetName] อย่างเป็นทางการ เกี่ยวกับการจัดการที่ดินของ[landowner.GetHerHis] ตามแหล่งข่าวของข้า [landowner.GetFirstNameNoTooltip]ได้ซื้อธัญพืชจำนวนมหาศาลในราคาถูกและกักตุนไว้ในยุ้งฉางของ[landowner.GetHerHis] เพื่อนำไปขายต่อในราคาสูงขึ้นในช่วงเวลาที่ขาดแคลน\n\nการปฏิบัตินี้เป็นสิ่งต้องห้ามโดยจักรวรรดิ เนื่องจากเป็นการทำลายรายได้ของเจ้าของที่ดินรายย่อย"
 ep3_emperor_yearly.2190.a: "เจ้าจะได้รับการลงโทษที่เป็นแบบอย่าง!"
 ep3_emperor_yearly.2190.b: "ข้า #EMP อาจจะ#! มองข้ามไป..."
 ep3_emperor_yearly.2190.c: "เจ้าไม่ควรทำ เช่นนั้นจริงๆ"
 DYNATOI_GLOSS: "ผู้ทรงอำนาจ โดยเฉพาะขุนนางต่างจังหวัดที่ผูกขาดที่ดินและตำแหน่งราชการ"
 # The Emperor's Gold
 ep3_emperor_yearly.2200.t: "ทองคำของจักรพรรดิ"
 ep3_emperor_yearly.2200.desc: "หากเคยมีใครที่ไม่คู่ควรอย่างยิ่งที่จะนั่งบนบัลลังก์จักรพรรดิ ก็ต้องเป็น[liege.GetFirstName]\n\n[governorship.GetName]ทำงานหนักและทนทุกข์ และภาษีทั้งหมดของเราก็ไปสู่คนเกียจคร้านใน[capital.GetNameNoTier] เว้น แต่...\n\nภาษีของเราไม่ #EMP จำเป็น#! ต้องไปที่นั่น ข้าสามารถใช้ประโยชน์จากมันได้ดีกว่ามาก..."
 ep3_emperor_yearly.2200.desc.c_monarch: "[liege.GetTitledFirstName] ช่างไม่คู่ควรอย่างยิ่งที่จะชี้นำ [ceremonial_monarch.GetTitleAsName]!\n\n[governorship.GetName] ต้องตรากตรำและทนทุกข์ และภาษีทั้งหมดของเรากลับไปสู่คนเกียจคร้านใน [capital.GetNameNoTier] เว้น แต่ว่า...\n\nภาษีของเราไม่#EMPจำเป็น#!ต้องไปที่นั่น ข้าสามารถใช้ประโยชน์จากมันได้ดีกว่านี้มาก..."
 ep3_emperor_yearly.2200.a: "[liege.GetSheHe|U]ไม่สมควรได้รับทองคำของเรา"
 ep3_emperor_yearly.2200.b: "ความภักดีของข้ามีต่อ[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] ไม่ใช่[ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]"
 ep3_emperor_yearly.2200.a.tt: "ความภักดีที่ไม่คู่ควร"
 ep3_emperor_yearly.2200.b.tt: "ภักดีต่อจักรวรรดิ"
 # A Prophecy of Power
 ep3_emperor_yearly.2210.t: "คำทำนายแห่งอำนาจ"
 ep3_emperor_yearly.2210.desc: "เมื่อคืนข้าฝัน: มืออันไม่มีตัวตนยื่นลงมาจากท้องฟ้าและสวมมงกุฎบนศีรษะของข้า ขณะที่เสียงอันทรงอำนาจบอกข้าว่า: "ไป! ข้ามอบ[potential_title.GetName]ให้เจ้า!""\n\nมันอาจเป็นเพียงผลผลิตจากความทะเยอทะยานของข้า... แต่กระนั้น จะเป็นอย่างไรถ้าข้าสามารถโน้มน้าว[liege.GetTitledFirstName]ได้ว่ามันเป็นสัญญาณที่แท้จริงจากเบื้องบน เป็นคำทำนายบางประเภท?"
 ep3_emperor_yearly.2210.desc_believe: "คนโง่นั่นคงเชื่อ #EMP ทุกอย่าง#! ใช่ไหม[liege.GetSheHe]?"
 ep3_emperor_yearly.2210.desc_jacob: "\n\nท้ายที่สุดแล้ว พระเจ้าไม่ได้ปรากฏแก่ยาโคบในความฝันเพื่อมอบดินแดนแห่งพันธสัญญาให้เขาหรอกหรือ?"
 ep3_emperor_yearly.2210.a: "มันคุ้มค่าที่จะลอง!"
 ep3_emperor_yearly.2210.a.tt: "ขึ้นอยู่กับการตัดสินใจของเจ้าเหนือหัวของท่าน"
 ep3_emperor_yearly.2210.a.success: "ท่านโน้มน้าวเจ้าเหนือหัวของท่านได้สำเร็จ"
 ep3_emperor_yearly.2210.a.success.tt: "เชื่อคำทำนาย"
 ep3_emperor_yearly.2210.a.failure: ""คำทำนาย" ของท่านไม่เป็นที่เชื่อถือ"
 ep3_emperor_yearly.2210.a.failure.tt: "ไม่เชื่อคำทำนาย"
 ep3_emperor_yearly.2210.b: "ข้าไม่ต้องการเรื่องไร้สาระนี้"
 ep3_emperor_yearly.2211.desc: "ข้าประหลาดใจมากเมื่อ[vassal.GetTitledFirstName]ปรากฏตัวต่อหน้าข้า บังคับให้ข้าเข้าเฝ้าเป็นการส่วนตัว\n\n"ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ผู้ยิ่งใหญ่ ความฝันจาก[vassal.GetFaith.HighGodName]เกิดขึ้นกับข้า — ไม่ใช่ #EMP แค่#! ความฝันเท่านั้น — แต่เป็น #EMP คำทำนาย#! ที่แท้จริง!!"\n\n"ข้าได้รับเลือกให้เป็น[potential_title.GetHolder.GetTitleAsNameNoTooltip]คนต่อไปของ[potential_title.GetName]! [vassal.GetFaith.PriestNeuterPlural]ที่ฉลาดที่สุดได้ยืนยันแล้ว""
 ep3_emperor_yearly.2211.a: "#EMP สัญญาณที่แท้จริงจากเบื้องบน!#!"
 ep3_emperor_yearly.2211.b: "ข้าคิดว่าข้าไม่สามารถเพิกเฉยต่อสัญญาณนี้ได้"
 ep3_emperor_yearly.2211.c: "คุณค่าของเจ้าควรพิสูจน์ด้วยการกระทำ ไม่ใช่ความฝัน!"
 ep3_emperor_yearly.2211.d: "[vassal.GetFirstNameNoTooltip]ต้องการให้ความบันเทิงแก่เราด้วยเรื่องไร้สาระบางอย่าง!"
 # Crowded Lands
 ep3_emperor_yearly.2220.t: "ดินแดนแออัด"
 ep3_emperor_yearly.2220.desc: ""ฝ่าบาท[ROOT.Char.GetTitleAsNameNoTooltip|U]ของข้า จดหมายร้องเรียนเพิ่งมาถึงจากชุมชนสงฆ์ใน[monastery.GetName]" [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U]เข้ามาใกล้ข้า\n\n"เห็นได้ชัดว่า คนเลี้ยงแกะจาก[shepherd_province.GetName]ที่อยู่ใกล้เคียงได้บุกรุกเข้าไปในที่ดินของอาราม ไม่เพียง แต่นำฝูงสัตว์ของพวกเขามาเท่านั้น แต่ยัง รวมถึงครอบครัวของพวกเขาด้วย!"\n\n"พระสงฆ์ตกตะลึงกับความสกปรก เสียงดัง และ #EMP ความลามกอนาจาร#! ของเพื่อนบ้านใหม่ของพวกเขา และขอให้ท่านเข้าแทรกแซง""
 ep3_emperor_yearly.2220.a: "คนเลี้ยงแกะมีสิทธิ์ที่จะสัญจรไปมา"
 ep3_emperor_yearly.2220.b: "พระสงฆ์ต้องการความสันโดษ!"
 ep3_emperor_yearly.2220.c: "มันเป็นปัญหาของพวกเขา"
 # The Value of Coin
 ep3_emperor_yearly.2230.t: "คุณค่าของเหรียญ"
 ep3_emperor_yearly.2230.desc: "เช่นเดียวกับทุกเมืองที่มีความสำคัญ [city.GetNameNoTier]ได้ดึงดูดฝูงชนพ่อค้าหลากสีสันจากทั่วทุกมุมของ[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] และนอกพรมแดน\n\nที่ใดมีโอกาสทำกำไร พ่อค้าก็มา นำสินค้าและเหรียญต่างประเทศมา แต่ยัง รวมถึงขนบธรรมเนียม ความเชื่อ และภาษาที่แปลกประหลาดของพวกเขาด้วย ในทางกลับกัน ฝูงชนในท้องถิ่นนั้นไม่แน่นอน พวกเขารักผู้ที่นำ[ROOT.Char.Custom('GetExpensiveDessert')]ที่แปลกใหม่มาให้ แต่ก็ยังคงดูถูกพวกเขาอยู่ลึกๆ\n\nไม่ชัดเจนว่าเหตุการณ์กระตุ้นในวันนี้คืออะไร — อาจเป็นความเข้าใจผิดเล็กน้อย — แต่พลเมืองได้หยิบอาวุธชั่วคราวขึ้นมาและกำลังก่อจลาจลในย่านพ่อค้า"
 ep3_emperor_yearly.2230.a: "ข้าจะส่งกองกำลังออกไป"
 ep3_emperor_yearly.2230.b: "ความโกลาหลมี แต่จะสร้างโอกาส!"
 ep3_emperor_yearly.2230.c: "พลเมืองจะฟังข้า"
 ep3_emperor_yearly.2230.c_success: "ท่าน ทำให้ฝูงชนสงบลง"
 ep3_emperor_yearly.2230.c_success.tt: "เมืองสงบลง"
 ep3_emperor_yearly.2230.c_failure: "ผู้คนไม่ฟังท่าน"
 ep3_emperor_yearly.2230.c_failure.tt: "การจลาจลยังคงดำเนินต่อไป"
 # As The Philosopher Said...
 ep3_emperor_yearly.2240.t: "ดังที่นักปราชญ์กล่าวไว้..."
 ep3_emperor_yearly.2240.desc_quote_a: ""[Glossary( 'ปันตาร์ไฮ (ทุกสิ่งล้วนไหลเวียน)', 'PANTA_RHEI_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )]อุทานอย่างเศร้าสร้อยขณะที่คนรับใช้สะดุดและเหยือกน้ำในมือของพวกเขาเทเนื้อหาลงบนพื้น นั่น #EMP ไม่ใช่#! ความหมายของประโยคนั้น!"
 ep3_emperor_yearly.2240.desc_quote_b: ""[Glossary( 'Ho bíos brakhús, he dè tékhne makré', 'ARS_LONGA_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] ถอนหายใจขณะที่[the_scholar.GetSheHe]ขีดฆ่าบรรทัดออกจากบันทึกยุ่งๆ บางส่วน [the_scholar.GetSheHe]มาเข้าร่วมกับข้าตั้งแต่เมื่อไหร่กัน?!"
 ep3_emperor_yearly.2240.desc_quote_c: ""[Glossary( 'โซฟอน โท ซาเฟส', 'SOPHON_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )]บ่นพึมพำขณะที่[the_scholar.GetSheHe]ล้มเหลว — อีกครั้ง — ในการทำตามคำแนะนำพื้นฐานบางอย่าง"
 ep3_emperor_yearly.2240.desc_quote_latin: ""[Glossary( 'ออมเนีย วินซิต อมอร์ (ความรักชนะทุกสิ่ง)', 'AMOR_GLOSS')]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )]เทศนาด้วยสีหน้าเคร่งขรึม นั่นเกี่ยวข้องอะไรกับสิ่งที่เรากำลังพูดถึงกัน?!"
 ep3_emperor_yearly.2240.desc_quote_confucius: ""[Glossary( 'The superior man is modest in his speech, but exceeds in his actions.', 'CONFUCIUS_GLOSS' )]" [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] กล่าวอย่างวางท่าด้วยสีหน้าเคร่งขรึม มันเกี่ยวข้องอะไรกับสิ่งที่เรากำลังพูดถึงกันอยู่?!"
 ep3_emperor_yearly.2240.desc_outro: "\n\n[the_scholar.GetSheHe|U]ทำ เช่นนี้ #EMP เสมอ#! และข้าเกลียดมัน! มักจะยกคำพูดจากคนโบราณมาและยัดเยียดใส่หน้าคนอื่นโดยไม่ได้ร้องขอ — และบ่อยครั้งในบริบทที่ไม่ถูกต้องหรือใช้คำพูดที่ไม่ถูกต้องด้วย...\n\nหลายคนรอบตัวเราคร่ำครวญและกลอกตา การศึกษาคลาสสิกที่มั่นคงเป็นสิ่งจำเป็นสำหรับบุคคลสาธารณะ แต่มันก็สูญเปล่าหากปราศจากปัญญาที่จะใช้มันอย่างเหมาะสม"
 ep3_emperor_yearly.2240.a: "#EMP จริงๆ แล้ว#! คำพูดนั้นคือ..."
 ep3_emperor_yearly.2240.a.flavor: "ท่านพยายาม ทำให้ [the_scholar.GetFirstNameNoTooltip] รู้สำนึกถึงสถานะของ[the_scholar.GetHerHis] โดยแสดงให้เห็นว่า [the_scholar.GetSheHe] ผิดเพียงใด"
 ep3_emperor_yearly.2240.a_success: "ความรู้ของท่านโดดเด่นกว่าของ[the_scholar.GetHersHis]"
 ep3_emperor_yearly.2240.a_success.tt: "[the_scholar.GetFirstNameNoTooltip] ถูก ทำให้อับอาย!"
 ep3_emperor_yearly.2240.a_failure: "ท่านดูโง่เขลากว่า[the_scholar.GetHerHim]"
 ep3_emperor_yearly.2240.a_failure.tt: "ความอัปยศในที่สาธารณะ"
 ep3_emperor_yearly.2240.b: "#EMP หุบปากไปเลย!#!"
 ep3_emperor_yearly.2240.c: "ข้าไม่มีเวลาสำหรับเรื่องนี้"
 PANTA_RHEI_GLOSS: ""ทุกสิ่งไหลไป" เป็นบทสรุปที่มีชื่อเสียงของปรัชญาของเฮราคลิตุสเกี่ยวกับจักรวาล"
 ARS_LONGA_GLOSS: ""ชีวิตสั้น ศิลปะยืนยาว" เป็นคำพังเพยที่เชื่อว่าเป็นของฮิปโปเครตีส"
 SOPHON_GLOSS: ""ปัญญาอยู่ในความชัดเจน" จากยูริพิดีส"
 AMOR_GLOSS: ""ความรักชนะทุกสิ่ง" เป็นบทกวีที่มีชื่อเสียงและมักถูกอ้างผิดจากเวอร์จิล"
 # The Times Are Changing
 ep3_emperor_yearly.2300.t: "กาลเวลาเปลี่ยนไป"
 ep3_emperor_yearly.2300.desc: "ด้วยพิธีอันศักดิ์สิทธิ์ใน[capital.GetBaronyNameExplicitly], [liege_loc.GetTitledFirstName]ได้ประกาศอย่างเป็นทางการให้[liege_loc.GetFaith.GetName]เป็นศรัทธาอย่างเป็นทางการของ[liege_loc.GetPrimaryTitle.GetName]\n\nทันทีทันใด ผู้ส่งสารที่เร็วที่สุดได้เดินทางไปยังทุกมุมของจักรวรรดิ เผยแพร่ข่าวสารและเรียกร้องให้ราษฎรทุกคนเปลี่ยนศาสนา"
 ep3_emperor_yearly.2300.a: "ช่างน่าเดือดดาล! การดูหมิ่นศาสนา!"
 ep3_emperor_yearly.2300.b: "[liege_loc.GetTitleAsNameNoTooltip]คงจะถูกต้อง"
 ep3_emperor_yearly.2300.c: "ในที่สุด!"
 # Unfaithful People
 ep3_emperor_yearly.2310.t: "[liege_loc.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_emperor_yearly.2310.desc: "ข้าได้รับทราบว่าพลเมืองจำนวนมากเกินไปในเขตปกครองที่ได้รับมอบหมายของท่านยังไม่ได้ปฏิบัติตามศรัทธาที่แท้จริง, [liege_loc.GetFaith.GetName] เป็นหน้าที่ของท่านที่จะต้องแก้ไขสถานการณ์"
 ep3_emperor_yearly.2310.desc_you_too: "และแก้ไขความเชื่อของท่านเองด้วย!"
 ep3_emperor_yearly.2310.a: "พวกเขาจะยอมรับศรัทธาที่ถูกต้องในไม่ช้า"
 ep3_emperor_yearly.2310.b: "ไม่ล่ะ ขอบคุณ"
 ep3_emperor_yearly.2310.c: "ข้าจะเริ่มที่ตัวเองก่อน"
 ep3_emperor_yearly.2310.d: "ข้าจะคิดดูก่อน"
 # A Matter of Faith
 ep3_emperor_yearly.2320.t: "เรื่องของศรัทธา"
 ep3_emperor_yearly.2320.desc: ""ข้ารู้สึกเป็นเกียรติที่ท่านมาเยือน" ข้าเริ่มต้นอย่างแข็งกระด้างขณะที่ข้ารับ[hof.GetTitledFirstName] "แต่ข้าเป็นหนี้เกียรตินี้ด้วยเหตุใด?"\n\n"ข้าได้รับทราบว่า แม้จะมีการนำของท่าน [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]ก็ยังคงคลำหาทางในความมืด ปฏิบัติตามศรัทธาอย่างเป็นทางการที่ไม่ถูกต้อง" [hof.GetTitleAsNameNoTooltip]หยุดพูดอย่างมีความหมาย\n\n"ดังนั้น ข้าจึงตัดสินใจที่จะเข้าร่วมกับท่านในความพยายามนี้และเสนอความช่วยเหลือทั้งหมดของข้าเพื่อนำพารัฐนาวาไปในทิศทางที่ถูกต้อง""
 ep3_emperor_yearly.2320.a: "ขอบคุณ ท่านนักบุญ"
 ep3_emperor_yearly.2320.b: "แต่ถ้าศรัทธาอย่างเป็นทางการนั้นถูกต้องล่ะ?"
 hof_state_faith_discount: "การสนับสนุนจากประมุขแห่งศรัทธา"
 ep3_emperor_yearly.2320.a.tt: "รับส่วนลด #P 30%#! สำหรับการตัดสินใจเปลี่ยนศรัทธาแห่งรัฐเป็นเวลา 10 ปี"
 every_vassal_state_faith: "ข้าในบังคับทุกคนที่ปฏิบัติตามศรัทธาแห่งรัฐ"
 # Heresy Brewing
 ep3_emperor_yearly.2330.t: "การก่อตัวของพวกนอกรีต"
 ep3_emperor_yearly.2330.desc: "ปฏิเสธไม่ได้ ศรัทธาอย่างเป็นทางการของ[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]กำลังเผชิญกับวิกฤต\n\n"
 ep3_emperor_yearly.2330.desc_hof: "[hof.GetTitledFirstName|U]ได้เข้าร่วมกับข้าในวันนี้เพื่อหารือเกี่ยวกับประเด็นที่ร้ายแรงที่สุด: วิกฤตของศรัทธาอย่างเป็นทางการของ[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]\n\n"ท่านปฏิเสธไม่ได้, [ROOT.Char.GetFirstNameNoTooltip]! ท่านต้องเห็นมันด้วย!"
 ep3_emperor_yearly.2330.desc_end: "สัญญาณมีอยู่ทุกหนทุกแห่ง: ผู้คนใช้ชีวิตอยู่ในบาป, [ROOT.Char.GetFaith.ReligiousText]ถูกลืมเลือนและไม่แยแส, และพวกนอกรีตกำลังก่อตัวขึ้นในทุกมุมมืด!""
 ep3_emperor_yearly.2330.desc_end_hof: "อำนาจทางโลกและทางศาสนาต้องร่วมมือกันเพื่อช่วยผู้คนที่ดีของ[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]""
 ep3_emperor_yearly.2330.a: "เราต้องทำอะไรสักอย่าง!"
 ep3_emperor_yearly.2330.a.tt: "ข้าจะลงทุนในการส่งเสริมศรัทธาที่แท้จริงในหมู่ประชาชน!"
 ep3_emperor_yearly.2330.b: "มันคงไม่เป็นไรหรอก..."
 state_faith_fervor_campaign: "การสนับสนุนศรัทธาแห่งรัฐ"
 # Heresy Among Us?
 ep3_emperor_yearly.2340.t: "พวกนอกรีตท่ามกลางพวกเรา?"
 ep3_emperor_yearly.2340.desc: ""เป็นที่ทราบกันดีว่าท่านไม่ได้ปฏิบัติตามศรัทธาที่จักรวรรดิและบรรพบุรุษผู้สร้างความยิ่งใหญ่กำหนดไว้ให้เรา" [complainer.GetTitledFirstName]ตำหนิข้าด้วยความดูถูก\n\n"หลายคนสงสัยว่าท่านคู่ควรกับตำแหน่งที่ท่านดำรงอยู่หรือไม่ ท้ายที่สุดแล้ว ท่านจะนำทางพลเมืองของเราไปสู่แสงสว่างได้อย่างไรหากท่านเองเดินอยู่ในความมืด?"\n\n"ข้าขอร้องท่าน โปรดยอมรับศรัทธาที่แท้จริง, [complainer.GetFaith.GetName]!""
 ep3_emperor_yearly.2340.a: "บางทีข้าควรจะทำตาม..."
 ep3_emperor_yearly.2340.b: "คำพูดพล่ามไร้สาระนอกรีตของเจ้าจะไม่ ทำให้ข้าหวั่นไหว"
 every_fellow_vassal_state_faith: "ข้าในบังคับเพื่อนร่วมงานทุกคนที่ปฏิบัติตามศรัทธาแห่งรัฐ"
 # In the Bud - You are not a Powerful family version
 ep3_emperor_yearly.2400.t: "$ep3_powerful_families.8020.t$"
 ep3_emperor_yearly.2400.desc: "ทั่วทั้งอาณาจักร อำนาจของตระกูลใหม่ดูเหมือนจะหยั่งราก เหมือนวัชพืช พวกเขาได้แผ่อิทธิพลไปยังทุกมุมของสังคมของเรา และแทบจะไม่มีวันใดผ่านไปโดยไม่ได้ยินชื่อ "[new_family.GetHouse.GetBaseName]"\n\nตระกูลที่ทรงอำนาจเกิดขึ้นและล่มสลายตลอดเวลาในจักรวรรดิอันยิ่งใหญ่ ไม่จำเป็นที่เราจะต้องกังวลหรือริเริ่มใดๆ แต่กระนั้น เสียงที่คอยรบกวนในใจข้าก็กระซิบว่า: "จะเป็นอย่างไรถ้าเป็นเรา?""
 ep3_emperor_yearly.2400.a: "วันของเราจะมาถึง"
 8020_powerful_family_tt: "ตระกูลทรงอำนาจใหม่"
 8020_powerful_family_desc: "[house|E] [new_family.GetHouse.GetBaseName|V] บัดนี้ถือเป็น[powerful_family|E][new_family.GetTopLiege.GetPrimaryTitle.GetAdjective]"
 # In the Bud - Your family version
 ep3_emperor_yearly.2401.t: "$ep3_powerful_families.8020.t$"
 ep3_emperor_yearly.2401.desc: "มีตระกูลมากมายที่มีรากเหง้าสูงศักดิ์และเปี่ยมเกียรติภูมิในหมู่พลเมืองแห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l] ทว่า มีเพียงน้อยนิดที่ได้ร่วมโต๊ะกับ [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] แบ่งปันทั้งความรับผิดชอบและเกียรติยศในการชี้นำนาวาแห่งรัฐ\n\nน้อยคนนักที่จะมี #EMP อำนาจ#! ที่แท้จริง แต่ในวันนี้ ตระกูล [ROOT.Char.GetHouse.GetBaseName] คือหนึ่งในนั้น!"
 ep3_emperor_yearly.2401.a: "เวลาของตระกูล[ROOT.Char.GetHouse.GetBaseNameNoTooltip]มาถึงแล้ว!"
 # New Nobility
 ep3_emperor_yearly.2410.t: "ขุนนางใหม่"
 ep3_emperor_yearly.2410.desc: "มีชื่อใหม่ปรากฏขึ้นในหมู่ผู้ทรงอิทธิพลแห่ง [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l]: ตระกูล [new_title.GetHolder.GetHouse.GetBaseName] ได้รับสิทธิ์ที่จะถูกนับให้เป็นส่วนหนึ่งของเหล่าขุนนาง — ไม่ว่าจะด้วยการทุจริต การวางแผนลับ หรือด้วยคุณค่าที่แท้จริง ข้ามิอาจบอกได้\n\nมันไม่สำคัญดอก ข้ามั่นใจว่าพวกมันก็เป็นได้เพียงแค่เม็ดทราย ที่พร้อมจะถูกพัดพาไปด้วยสายลมอันปั่นป่วนแห่งประวัติศาสตร์ — และการรุกคืบอันมิอาจหยุดยั้งได้ของตระกูล [ROOT.Char.GetHouse.GetBaseName]!"
 ep3_emperor_yearly.2410.a: "ชิ. #EMP พวกบ้านนอก.!#"
 2410_noble_family_tt: "ตระกูลขุนนางใหม่"
 2410_noble_family_tt_desc: "[new_title.GetHolder.GetShortUIName|U]ได้สถาปนา[noble_family|E][new_title.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjective]แห่ง[new_title.GetHolder.GetHouse.GetBaseName|V]"
 # The Shadow Behind The Throne
 ep3_emperor_yearly.2420.t: "เงาหลังบัลลังก์"
 ep3_emperor_yearly.2420.desc: "ละโมบและทรงอำนาจ มือของตระกูล[noble_family_head.GetHouse.GetBaseName]แผ่ขยายเหมือนหนวดปลาหมึกไปทั่วทุกมุมของ[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetName]\n\nบัดนี้เห็นได้ชัดเจนว่าแม้ แต่ผู้ที่นั่งบนบัลลังก์จักรพรรดิก็ไม่ได้สูงส่งไปกว่าพวกเขา พวกเขาคือเจ้านายที่แท้จริงของดินแดนของเรา ผู้ครอบงำชีวิตทางการเมืองและเศรษฐกิจของ[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 2420_noble_family_tt: "ตระกูลครอบงำใหม่"
 2420_noble_family_tt_desc: "ตระกูล[noble_family_head.GetHouse.GetBaseName]บัดนี้ถือเป็น[dominant_family|E]ใน[noble_family_head.GetTopLiege.GetPrimaryTitle.GetName|l]"
 ep3_emperor_yearly.2420.a: "ข่าวที่น่ากังวล"
