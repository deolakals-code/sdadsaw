l_english: 
 #Drassanes
 building_type_drassanes_01: "$building_drassanes_01$"
 building_type_drassanes_01_desc: "$building_drassanes_01_desc$"
 building_drassanes_01: "ดราสซาเนส"
 building_drassanes_01_desc: "นอกกำแพงเมืองบาร์เซโลนา ณ เชิงเขา #italic มงฌูอิก#! คลังแสงอู่แห้งอันยิ่งใหญ่นี้เป็นที่ติดตั้งอาวุธและปกป้องกองเรือรบแกลลีย์\nภายใต้หลังคาหินโค้งแหลม คนงานทำงานอย่างไม่รู้จักเหน็ดเหนื่อย หอคอยสูงและกำแพงยาวปกป้องความลับของงานพวกเขาจากคนภายนอก"
 #Great Kyz Kala
 building_type_kyz_kala_01: "$building_kyz_kala_01$"
 building_type_kyz_kala_01_desc: "$building_kyz_kala_01_desc$"
 building_kyz_kala_01: "คิซ คาลา อันยิ่งใหญ่"
 building_kyz_kala_01_desc: "พระราชวังขนาดมหึมานี้ตั้งตระหง่านเหนือโอเอซิสอันเขียวชอุ่มของเมิร์ฟ กำแพงร่องล้อมรอบโรงงาน คลังแสง และโถงถ้ำขนาดใหญ่ที่ทูตและข้าราชการดำเนินกิจการของตน\nอาคารอันยิ่งใหญ่นี้เป็นทั้งที่พำนักและป้อมปราการ สามารถจัดงานเลี้ยงที่หรูหราที่สุดได้พอๆ กับการขับไล่การบุกรุกที่ป่าเถื่อนที่สุด"
 #Cluny Abbey
 building_type_cluny_abbey_01: "อารามคลูนี"
 building_type_cluny_abbey_01_desc: "$building_cluny_abbey_01_desc$"
 building_cluny_abbey_01: "แอบบีย์คลูนี"
 building_cluny_abbey_01_desc: "ของขวัญแห่งที่ดินและสิทธิ์ แลกกับความรอดนิรันดร์ นั่นคือพันธสัญญาที่ก่อตัวขึ้นระหว่างชุมชนสงฆ์แห่งคลูนีและขุนนางท้องถิ่น\nเมื่อเวลาผ่านไป ได้เติบโตเป็นชุมชนที่มีชีวิตชีวาและมีอิทธิพล ปราศจากการแทรกแซงทางโลก บังคับใช้วินัยเบเนดิกตินไปทั่วทุกสารทิศ\n\nภายใต้หลังคาสีแดงจำนวนมาก นักบวชสวดมนต์ ทำงาน และสร้างสรรค์เอกสารตัวเขียนสีวิจิตร - เป็นแบบอย่างให้ผู้อื่นปฏิบัติตามทั่วทั้งทวีป"
 building_cluny_abbey_02: "มาโยร์ เอ็กเกลเซีย"
 building_cluny_abbey_02_desc: "สิ่งที่เคยเป็นเพียงบ้านพักนักบวชไม่กี่หลัง บัดนี้ถูกแทนที่ด้วยศูนย์รวมศาสนาอันกว้างขวาง\nเพื่อตอกย้ำมรดกนี้ เหล่าอธิการได้เริ่มโครงการก่อสร้างขนาดมหึมา คือ #italic มาโยร์ เอ็กเกลเซีย#! ซึ่งตั้งใจให้เป็นโบสถ์ที่ใหญ่ที่สุดในคริสต์ศาสนจักร โถงกลางทั้งห้ามีความยาวกว่าของวาติกัน และหลังคาหินโค้งขนาดใหญ่เป็นความสำเร็จทางสถาปัตยกรรม อุดมไปด้วยหอคอยและหลังคา"
 #Walls of York
 building_type_york_walls_01: "$building_york_walls_01$"
 building_type_york_walls_01_desc: "$building_york_walls_01_desc$"
 building_york_walls_01: "กำแพงเมืองยอร์ก"
 building_york_walls_01_desc: "กำแพงอันกว้างใหญ่นี้มีความยาวหลายไมล์ ปกป้องเมืองมาตั้งแต่สมัยซีซาร์ กำแพงใช้ประโยชน์จากแม่น้ำสองสายที่ไหลคดเคี้ยวผ่านทุ่งหญ้าอย่างชาญฉลาด ป้องกันศัตรูจากทิศตะวันออกและตะวันตก การจราจรทั้งหมดถูกส่งผ่านจุดคับขันเฉพาะ คือ #italic บาร์#! ซึ่งสามารถเก็บค่าผ่านทาง หรือยิงธนูและไฟลงมาได้"
 #Great Mosque of Damascus
 building_type_damascus_mosque_01: "$building_damascus_mosque_01$"
 building_type_damascus_mosque_01_desc: "$building_damascus_mosque_01_desc$"
 building_damascus_mosque_01: "มัสยิดใหญ่แห่งดามัสกัส"
 building_damascus_mosque_01_desc: "มัสยิดแห่งนี้มีเรื่องราวอันน่าเคารพเล่าขาน ที่นี่ จิตวิญญาณหลายศตวรรษและความเฉลียวฉลาดอันน่าอัศจรรย์ถูกทับถมกันเป็นชั้นๆ เนื่องจากสร้างขึ้นบนวิหารโรมันและมหาวิหารคริสเตียนยุคแรก\nอาคารนี้มีชื่อเสียงในด้านหินอ่อนที่หรูหราและมีสีสัน ตลอดจนกระเบื้องโมเสกสีทองที่ประกอบขึ้นโดยศิลปินจากแดนไกลถึงคอนสแตนติโนเปิล"
 #Jokhang Temple
 building_type_jokhang_01: "$building_jokhang_01$"
 building_type_jokhang_01_desc: "$building_jokhang_01_desc$"
 building_jokhang_01: "วัดโจคัง"
 building_jokhang_01_desc: "ตำนานเล่าว่าวัดโจคังสร้างขึ้นเหนือทะเลสาบศักดิ์สิทธิ์โบราณ หัวใจของนางปีศาจรูปร่างทิเบต มันถูกสร้างขึ้นสามครั้ง และถูกกลืนหายไปในความพิโรธของทะเลสาบสามครั้ง ก่อนที่คำอธิษฐานและเครื่องบูชายัญโดยมเหสีของจักรพรรดิองค์แรกจะสามารถ ทำให้สงบลงได้ในที่สุด\nวัดนี้เป็นวัดที่ศักดิ์สิทธิ์ที่สุดในดินแดน เป็นศูนย์รวมที่ซับซ้อนเหมือนเขาวงกตของลานและที่พักสงฆ์ ผ่านทางเดินและโถงถ้ำที่ปกคลุมด้วยเนยจามรี"
 #Wartburg
 building_type_wartburg_01: "$building_wartburg_01$"
 building_type_wartburg_01_desc: "$building_wartburg_01_desc$"
 building_wartburg_01: "วาร์ทบวร์ก"
 building_wartburg_01_desc: "ในป่าทูรินเจีย ตั้งอยู่บนหน้าผาหินสูงตระหง่าน ป้อมปราการแห่งนี้ควบคุมการเคลื่อนย้ายสินค้าและผู้คนทั้งหมดผ่านภูมิภาค\nป้อมปืนใหญ่หนักหนาป้องกันทางเข้าปราสาทเพียงทางเดียว และกำแพงสีขาวสูงคดเคี้ยวไปตามรอยแยกของภูเขา #italic พาลาส#! เป็นอาคารที่สำคัญที่สุดในศูนย์รวม เป็นโถงหินเย็นขนาดใหญ่ที่ได้รับความอบอุ่นจากเตาผิงจำนวนมากภายใน"
 #Beta Giyorgis
 building_type_beta_giyorgis_01: "$building_beta_giyorgis_01$"
 building_type_beta_giyorgis_01_desc: "$building_beta_giyorgis_01_desc$"
 building_beta_giyorgis_01: "นักบุญจอร์จแห่งลาลิเบลา"
 building_beta_giyorgis_01_desc: "#italic เบตา กิยอร์กิส#! ถูกแกะสลักขึ้นทั้งหมดจากหินภูเขาไฟสีแดงอบอุ่น ล้อมรอบด้วยวัดและอาคารในเครืออีกสิบสองแห่ง ซึ่งหมายถึงเยรูซาเล็มทั้งบนโลกและบนสวรรค์ นี่คือข้อพิสูจน์ที่มีชีวิตถึงความเชื่อมโยงระหว่างอาณาจักรอันศักดิ์สิทธิ์และดินแดนนี้\nโถงหลักของโบสถ์ ซึ่งขุดลึกลงไปในหิน ถูกทาสีอย่างหรูหราด้วยภาพปูนเปียกที่สวยงาม ในขณะที่รูปเคารพศักดิ์สิทธิ์ประดับผนัง"
 #Holy Wisdom of Novgorod 
 building_type_holy_wisdom_01: "$building_holy_wisdom_01$"
 building_type_holy_wisdom_01_desc: "$building_holy_wisdom_01_desc$"
 building_holy_wisdom_01: "พระปัญญาศักดิ์สิทธิ์แห่งพระเจ้า"
 building_holy_wisdom_01_desc: "โบสถ์อันงดงามแห่งนี้สร้างตามแบบฮาเกียโซเฟีย เพื่อแสดงถึงแสงสว่าง ความมั่งคั่ง และอำนาจเดียวกันในดินแดนทางเหนืออันหนาวเหน็บ หินปูนสีขาวที่ดูเคร่งขรึมขัดแย้งกับสีสันอันท่วมท้นของภาพปูนเปียกภายใน สว่างไสวอย่างอบอุ่นด้วยแสงเทียน เงาเต้นรำรอบกระเบื้องโมเสกสีทองของโดมจำนวนมากของมหาวิหาร"
 #Kano Earthworks
 building_type_kano_walls_01: "$building_kano_walls_01$"
 building_type_kano_walls_01_desc: "$building_kano_walls_01_desc$"
 building_kano_walls_01: "กำแพงดินคาโน"
 building_kano_walls_01_desc: "กำแพงดินและโคลนขนาดใหญ่ สูงหลายฟุต ล้อมรอบเมืองโบราณคาโน\nกำแพงดินครอบคลุมพื้นที่กว้างใหญ่กว่าที่ชาวเมืองอาศัยอยู่มาก ล้อมรอบทุ่งข้าวสาลีเพื่อหล่อเลี้ยงประชากรตลอดการล้อมเมืองอันยาวนาน"
 #Somapura University
 building_type_somapura_university_01: "$building_somapura_university_01$"
 building_type_somapura_university_01_desc: "$building_somapura_university_01_desc$"
 building_somapura_university_01: "มหาวิทยาลัยโสมปุระ"
 building_somapura_university_01_desc: "เป็นเวลาหลายศตวรรษที่โสมปุระทำหน้าที่เป็นหนึ่งในศูนย์การเรียนรู้ที่สำคัญที่สุดในอินเดีย ดึงดูดนักวิชาการจากภูมิภาคอันห่างไกลด้วยความเชื่อมโยงมากมายกับอารามพุทธ เชน และฮินดู\nแผนผังรูปสี่เหลี่ยมจัตุรัสแสดงถึงความสามัคคีและความบริสุทธิ์ที่แท้จริงของจักรวาล เป็นสถานที่ที่สมบูรณ์แบบสำหรับจิตใจที่จะเจริญงอกงาม"
 #Duomo of Florence
 building_type_duomo_florence_01: "ดูโอโมแห่งฟลอเรนซ์"
 building_type_duomo_florence_01_desc: "ที่ประทับของอาร์ชบิชอปท้องถิ่นและแหล่งความภาคภูมิใจของพลเมืองฟลอเรนซ์ทุกคน ดูโอโมเป็นหนึ่งในความสำเร็จทางสถาปัตยกรรมที่ยิ่งใหญ่ที่สุดเท่าที่เคยมีมา"
 building_duomo_florence_01: "ซานตา เรปาราตา"
 building_duomo_florence_01_desc: "มหาวิหารคริสเตียนยุคแรกนี้ตั้งอยู่ตามแนวกำแพงโรมันโบราณใกล้ประตูทิศเหนือ เป็นที่พำนักของชาวคริสต์ในฟลอเรนซ์มาตั้งแต่ก่อนสมัยคอนสแตนติน เคยประสบกับการลอบวางเพลิงและการปล้นสะดม การบูรณะและการให้พร แต่ยังคงรักษาโถงกลางสามโถงและซุ้มโค้งมนอันสง่างามไว้ได้\nถึงกระนั้น เมื่อเมืองเติบโตขึ้น มหาวิหารเก่าอาจต้องเติบโตไปพร้อมกับมัน"
 building_duomo_florence_02: "หอศีลจุ่มนักบุญยอห์น"
 building_duomo_florence_02_desc: "นี่คือหอศีลจุ่มแปดเหลี่ยมขนาดมหึมาใจกลางเมือง อุทิศให้กับนักบุญยอห์นองค์อุปถัมภ์\nอาคารนี้ปูด้วยหินอ่อนราคาแพงและตก แต่งด้วยประติมากรรมชั้นครูและกระเบื้องโมเสกสีทอง เป็นเครื่องพิสูจน์ความมั่งคั่งของเมืองอย่างแท้จริง ตำนานเล่าว่าเคยเป็นวิหารแห่งมาร์ส และรูปลักษณ์ของมันคล้ายกับแพนธีออนในกรุงโรมอย่างน่าทึ่ง"
 building_duomo_florence_03: "ซานตา มาเรีย เดล ฟิโอเร"
 building_duomo_florence_03_desc: "มหาวิหารอันยิ่งใหญ่ - #italic ดูโอโม#! - คู่ควรกับฟลอเรนซ์อันมั่งคั่ง บัดนี้ตั้งตระหง่านเหนือเมือง\nโถงกลางยาวและมุขโค้งแปดเหลี่ยมขนาดใหญ่ประดับด้วยหินอ่อนสีสันสดใส และเล่นเกมลวงตาเรื่องความลึก ซึ่งกันและกัน ส่วนหน้าอาคารตก แต่งด้วยรูปปั้นของศาสดาพยากรณ์ เทพเจ้า และผู้อุปถัมภ์ หอระฆังสูงตระหง่านบอกเวลาทำงานและสวดมนต์สำหรับชาวเมือง"
 building_duomo_florence_04: "โดมคูโปลา"
 building_duomo_florence_04_desc: "#italic คูโปลา#! ตั้งตระหง่านเหนือศูนย์รวมอาคาร ดูเพรียวบางและโปร่งเบาตัดกับท้องฟ้าสีคราม เป็นความสำเร็จที่ยิ่งใหญ่ที่สุดของช่างก่อสร้างชาวฟลอเรนซ์\nหอคอยสูงและกว้างกว่าที่เคยคิดไว้ โดยไม่มีค้ำยันภายนอกหรือระบบรองรับเพื่อป้องกันไม่ให้ถล่มลงมา ด้วยการใช้อิฐและปูนก่อเป็นเปลือกสองชั้นอย่างชาญฉลาด"
 #Konarak Sun Temple
 building_type_konark_temple_01: "$building_konark_temple_01$"
 building_type_konark_temple_01_desc: "$building_konark_temple_01_desc$"
 building_konark_temple_01: "เทวาลัยสุริยะโกนาร์ก"
 building_konark_temple_01_desc: "สร้างโดยช่างฝีมือหลายพันคน เทวาลัยสุริยะโกนาร์กเป็นเทวาลัยขนาดใหญ่ที่อุทิศให้กับเทพสุริยะ สุริยา ทั้งศูนย์รวมสร้างขึ้นเพื่อเลียนแบบราชรถอันยิ่งใหญ่ของเทพเจ้า นำแสงสว่างจากทะเลไปทางทิศตะวันออก\nตัวอย่างอันน่าอัศจรรย์ของสถาปัตยกรรมกลิงคะ เทวาลัยปกคลุมไปด้วยภาพนูนต่ำและประติมากรรม มีเทพเจ้า ทหาร นักดนตรี และสิ่งมีชีวิตในตำนาน เล่าเรื่องราวในคัมภีร์ฮินดู"
 #University of al-Qarawiyyin
 building_type_al_qarawiyyin_university_01: "$building_al_qarawiyyin_university_01$"
 building_type_al_qarawiyyin_university_01_desc: "$building_al_qarawiyyin_university_01_desc$"
 building_al_qarawiyyin_university_01: "มหาวิทยาลัยอัล-กอรอวียีน"
 building_al_qarawiyyin_university_01_desc: "ก่อตั้งโดยพ่อค้าและผู้อพยพจากไครวน ศูนย์รวมอันกว้างขวางได้กลายเป็นหนึ่งในศูนย์การเรียนรู้ระดับสูงที่มีชื่อเสียงที่สุดในโลกอิสลามตะวันตก ดึงดูดนักวิชาการจากภูมิภาคอันห่างไกลและให้การศึกษาแก่ชนชั้นสูงในท้องถิ่นในวิชาที่ละเอียดอ่อน\n#italic มัดรอซะฮ์#! ประกอบด้วยโถงและห้องหลายห้อง - เสนอเตียงและที่พักให้กับนักศึกษาต่างชาติ โดยมี #italic ซาห์น#! เป็นลานกลางสำหรับการสนทนาสาธารณะ"
 #Kairouan Basins
 building_type_kairouan_basins_01: "$building_kairouan_basins_01$"
 building_type_kairouan_basins_01_desc: "$building_kairouan_basins_01_desc$"
 building_kairouan_basins_01: "อ่างเก็บน้ำไครวน"
 building_kairouan_basins_01_desc: "สร้างขึ้นเพื่อจัดหาน้ำจืดให้กับเมืองในยามจำเป็น อ่างเก็บน้ำขนาดใหญ่นี้ ทำให้น้ำฝนบริสุทธิ์โดยทำหน้าที่เป็นถังตกตะกอนและกรองตะกอนลง\nระบบประกอบด้วยส่วนที่เชื่อมต่อกันหลายส่วน ตั้งแต่อ่างขนาดเล็ก ไปจนถึงอ่างขนาดใหญ่ ไปจนถึงถังเก็บน้ำก่ออิฐที่ตก แต่งอย่างสวยงาม"
 #Ghana Palace
 building_type_ghana_palace_01: "$building_ghana_palace_01$"
 building_type_ghana_palace_01_desc: "$building_ghana_palace_01_desc$"
 building_ghana_palace_01: "พระราชวังกานา"
 building_ghana_palace_01_desc: "ล้อมรอบด้วยป่าศักดิ์สิทธิ์คือพระราชวังของ #italic กานา#! - หัวหน้าเผ่าผู้ครองนคร\nศูนย์รวมประกอบด้วยอาคารหินทรายและอิฐโคลน และได้รับการปกป้องด้วยรั้วรอบขอบชิดที่มีประตู กำแพงปกคลุมด้วยภาพนูนต่ำและงานแกะสลักสีสันสวยงาม พระราชวังขนาดใหญ่นี้โดดเด่นเหนือเมืองโดยรอบ"
 #Visegrad Citadel
 building_type_visegrad_castle_01: "$building_visegrad_castle_01$"
 building_type_visegrad_castle_01_desc: "$building_visegrad_castle_01_desc$"
 building_visegrad_castle_01: "ป้อมปราการวิเชกราด"
 building_visegrad_castle_01_desc: "ป้อมปราการนี้เป็นระบบกำแพงและหอคอยที่ยิ่งใหญ่และไม่อาจเจาะเข้าไปได้ ปกป้องโค้งแม่น้ำดานูบและควบคุมการค้าอันมั่งคั่ง\nป้อมปราการวิเชกราดประกอบด้วยส่วนล่างที่มีหอคอยหกเหลี่ยมอันทรงพลังหันหน้าไปทางแม่น้ำ และอะโครโพลิสส่วนบนที่อยู่เหนือเนินเขาสูง ป้อมปราการสามเหลี่ยมขนาดใหญ่ทำหน้าที่เป็นทั้งที่พำนักและตำหนักล่าสัตว์อันหรูหรา"
 #Archcollegiate Church of St. Mary and St. Alexius in Tum
 building_type_wawel_cathedral_01: "$building_wawel_cathedral_01$"
 building_type_wawel_cathedral_01_desc: "$building_wawel_cathedral_01_desc$"
 building_wawel_cathedral_01: "มหาวิหารนักบุญเวนเซสลาส"
 building_wawel_cathedral_01_desc: "สร้างขึ้นด้วยความช่วยเหลือของช่างฝีมือจากทั่วคริสต์ศาสนจักร มหาวิหารหินอันยิ่งใหญ่นี้เป็นแห่งแรกในดินแดนโปแลนด์และเป็นเครื่องพิสูจน์ถึงอำนาจของขุนนาง\nตลอดหลายศตวรรษ มหาวิหารแห่งนี้เป็นสถานที่ประกอบพระราชพิธีบรมราชาภิเษกและพระราชพิธีศพ"
 building_wawel_cathedral_02: "โบสถ์อัครสมทัยาจารย์นักบุญมารีย์และนักบุญอเล็กซิอุส"
 building_wawel_cathedral_02_desc: "$building_wawel_cathedral_01_desc$\nหลังจากได้รับการยกฐานะขึ้นเป็นอัครวิหาร บัดนี้ได้รับการดูแลโดยคณะแคนนอน ซึ่งเป็นองค์กรที่ประกอบด้วยนักบวชล้วน ขนาดและความวิจิตรตระการตานั้นยิ่งใหญ่ยิ่งนัก ทว่าเนื่องจากมิใช่ที่พำนักของบิชอป จึงมิได้รับบรรดาศักดิ์เป็นอาสนวิหาร"
 building_wawel_cathedral_03: "อาสนวิหารนักบุญมารีย์และนักบุญอเล็กซิอุส"
 building_wawel_cathedral_03_desc: "$building_wawel_cathedral_01_desc$\nหลังจากทรงทุ่มเททรัพยากรอันมหาศาล ในที่สุดองค์พระสันตะปาปาได้ทรงสถาปนาสังฆมณฑลแห่งใหม่ขึ้น ณ ที่นี้ พร้อมด้วยอาสนะแห่งมุขนายก ในที่สุด อาคารอันสง่างามนี้จึงสามารถขนานนามได้ว่าเป็นอาสนวิหาร"
 #Vatapi Caves
 building_type_vatapi_caves_01: "$building_vatapi_caves_01$"
 building_type_vatapi_caves_01_desc: "$building_vatapi_caves_01_desc$"
 building_vatapi_caves_01: "ถ้ำวาตาปิ"
 building_vatapi_caves_01_desc: "สร้างขึ้นโดยราชวงศ์จาลุกยะยุคแรก ถ้ำศักดิ์สิทธิ์เหล่านี้ถูกตัดลึกเข้าไปในชั้นหินทรายที่สง่างาม ภายในเป็นโลกภายในที่ศักดิ์สิทธิ์และเงียบสงบที่สุด\nประตูชัยนำผู้แสวงบุญเข้าสู่หน้าผาหินใหญ่ของภูเขา ถ้ำตก แต่งด้วยรูปเคารพจากทุกศาสนาหลักของอินเดีย"
 #Golden fort of Jaisalmer
 building_type_jaisalmer_fort_01: "$building_jaisalmer_fort_01$"
 building_type_jaisalmer_fort_01_desc: "$building_jaisalmer_fort_01_desc$"
 building_jaisalmer_fort_01: "ป้อมทองคำ"
 building_jaisalmer_fort_01_desc: "กำแพงสีทองของจัยซัลแมร์ไม่ได้เป็นเพียงที่ตั้งของป้อมปราการป้องกันเท่านั้น แต่ยังเป็นเมืองทั้งเมืองกลางทะเลทรายธาร์\nเมื่อพระอาทิตย์ตกดิน ว่ากันว่ากำแพงจะเปลี่ยนเป็นสีน้ำผึ้งหวานอบอุ่น ในขณะที่ตอนกลางวันสามารถ ทำให้เมืองกลมกลืนไปกับสภาพแวดล้อมได้"

