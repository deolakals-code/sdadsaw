 pious_parent_lvl_2: "เงาแห่งศรัทธา: ยามรุ่งอรุณ"
 pious_parent_lvl_2_desc: "ตัวละครนี้มุ่งมั่นอย่างยิ่งที่จะมีความศรัทธาให้มากที่สุดเท่าที่จะเป็นไปได้"
 pious_parent_lvl_3: "เงาแห่งศรัทธา: ยามกลางวัน"
 pious_parent_lvl_3_desc: "ตัวละครนี้มุ่งเน้นเกือบทั้งหมดไปที่การมีความศรัทธาให้มากที่สุดเท่าที่จะเป็นไปได้"
 pious_parent_conclusion: "แสงแห่งศรัทธา: จุดสูงสุด"
