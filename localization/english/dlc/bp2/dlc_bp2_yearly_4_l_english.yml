 famed_parent_opt_out_base: "เงาแห่งชื่อเสียง: ยามพลบค่ำ"
 famed_parent_opt_out_base_desc: "ตัวละครนี้พึงพอใจที่จะอยู่ในเงาของบิดา/มารดาผู้มีชื่อเสียงของตน"
 famed_parent_opt_out_advanced: "แสงแห่งชื่อเสียง: ยามอาทิตย์อัสดง"
 famed_parent_opt_out_advanced_desc: "ตัวละครนี้พึงพอใจกับชื่อเสียงที่ได้รับ"

 pious_parent_lvl_1: "เงาแห่งศรัทธา: ยามสนธยา"
