l_english: 
 bp2_yearly.4000.t: "ความกลัวจากอดีต"
 bp2_yearly.4000.desc: "ขณะที่ข้าอุ้ม [first_babby.Custom('GetDaughterSon')] แรกเกิดของข้า [first_babby.GetName] ความปิติยินดีอย่างล้นพ้นก็ผสมปนเปไปกับความเศร้า และความกลัวอันเจ็บปวดที่คืบคลานขึ้นมาตามสันหลัง\n\n[ROOT.Char.GetMotherFather] ของข้าเคยอุ้มข้า เช่นนี้หรือไม่ ก่อนที่ทั้ง [ROOT.Char.GetSheHe] และมารดาจะจากไป ขณะที่ข้ายังเด็ก และทิ้งให้ข้าอยู่ตามลำพัง?\n\nนี่คือคำสาปหรือไม่? [ROOT.Char.GetFaith.FateGodName] จะพรากบิดามารดาไปจากลูกน้อยของ [first_babby.GetHerHis] หรือไม่ เช่นเดียวกับที่ [ROOT.Char.GetFaith.FateGodSheHe] ทำกับข้า?"
 bp2_yearly.4000.a: "ข้าสัญญา! ข้าจะไม่ทอดทิ้งเจ้า!"
 bp2_yearly.4000.a.flavor: "ข้าจะรักษาสัญญานั้นได้หรือไม่?"
 bp2_yearly.4000.b: "โลกนี้โหดร้ายนัก ลูกข้า"
 bp2_yearly.4000.b.flavor: "และเราทุกคนต่างดำเนินชีวิตไปเพียงลำพัง"
 bp2_yearly.4000.c: "ใน[ROOT.Char.GetFaith.HighGodNameAlternate] ข้าฝากความหวังไว้"

 bp2_yearly.4001.t: "ความยุติธรรมที่ล่าช้า"
 bp2_yearly.4001.desc: "ข้าเป็นเพียงเด็กเมื่อชีวิตของ[ROOT.Char.Custom2('RelationToMeShort', murdered_relative)]ของข้า [murdered_relative.GetName] ถูกพรากไปอย่างกะทันหันตามคำสั่งของ[imprisoned_murderer.GetName] ข้าไร้อำนาจที่จะหยุดยั้ง ไร้อำนาจที่จะบังคับใช้ความยุติธรรมในตอนนั้น\n\nวันนี้ เป็น[imprisoned_murderer.GetNameNoTooltip]ที่ไร้อำนาจ ถูกพันธนาการและอยู่ใต้อาณัติของข้า ข้าสงสัยว่า [murdered_relative.GetFirstNameNoTooltip]ต้องการสิ่งใด? การแก้แค้น เอาชีวิตแลกกับชีวิตของ[murdered_relative.GetHersHis] หรือการแสดงความเมตตา?"
 bp2_yearly.4001.a: "ตอนนี้ [murdered_relative.GetSheHe|U] ไม่ต้องการสิ่งใดอีกแล้ว ต้องขอบใจเจ้า ไอ้ [imprisoned_murderer.Custom2('InsultNoun', ROOT.Char)]!"
 bp2_yearly.4001.b: "มีความเข้มแข็งอยู่ในการให้อภัย ในการเลือกสิ่งที่ถูกต้อง"

 bp2_yearly.4002.t: "เสียงเรียกจากวิญญาณ"
 bp2_yearly.4002.desc:1 "อีกคืนหนึ่ง อีกวงเหล้าหนึ่ง ข้าดื่มมานานเท่าใดแล้ว? หลายวัน? หลายสัปดาห์? มันสำคัญด้วยหรือ? ในฟองวนของเหยือกเหล้าที่พร่องไปครึ่งหนึ่ง ข้าเห็นสิ่งที่แปลกประหลาดและพิสดารที่สุด ใบหน้าที่กังวลของญาติที่ล่วงลับไปนานแล้วของข้า [first_aa_relative.GetFirstNameNoTooltip] และ [second_aa_relative.GetFirstNameNoTooltip] มองขึ้นมาที่ข้า\n\nความทรงจำวัยเด็กที่ลืมเลือนไปนานแทรกผ่านม่านหมอกแห่งความมึนเมา ความทรงจำที่พบพวกเขาสิ้นใจจากการดื่มสุราจนเกินพอดี ร่างกายที่อืดบวมและยังคงมึนเมาของพวกเขา\n\nข้าจะต้องมีชะตากรรม เช่นเดียวกับพวกเขาหรือไม่?"
 bp2_yearly.4002.a: "บรรพชน โปรดประทานความเข้มแข็งให้ข้า! ข้าจะไม่ดื่มอีกต่อไป!"
 bp2_yearly.4002.b: "แด่ท่านทั้งสอง [first_aa_relative.GetFirstNameNoTooltip] และ [second_aa_relative.GetFirstNameNoTooltip]!"

 bp2_yearly.4003.t: "วิถีของผู้ปกครอง"
 bp2_yearly.4003.desc: "[child_ruler.GetName|U]บัดนี้มีอายุเท่ากับข้าเมื่อครั้งขึ้นครองบัลลังก์ วิถีของข้าเต็มไปด้วยความยากลำบาก การต้องรับผิดชอบทั้งอาณาจักรตั้งแต่อายุยังน้อย แต่มันก็หล่อหลอมให้ข้าเป็น[ROOT.Char.GetWomanMan]อย่างที่เป็นอยู่ทุกวันนี้ วัยเด็กของข้าแตกต่างจากเพื่อนรุ่นเดียวกันมากนัก: แทนที่จะเล่นเกมของเด็ก ข้ากลับเล่นเกมของผู้ใหญ่ ข้าเล่นมันและเรียนรู้มันเป็นอย่างดี\n\nมีดินแดนที่เหมาะสม [giveaway_county.GetDefinitiveName] ที่ ซึ่ง[child_ruler.GetFirstNameNoTooltip]สามารถเป็นผู้ปกครองได้ เช่นเดียวกับข้า แต่[child_ruler.GetSheHe]พร้อมแล้วหรือ? วิถีของข้าเป็นหนทางเดียวที่จะเตรียมพร้อมสำหรับอนาคตอันโหดร้ายหรือไม่?"
 bp2_yearly.4003.a: "เจ้าจงเดินตามวิถีของข้า [child_ruler.GetFirstNameNoTooltip]"
 bp2_yearly.4003.b: "เราจะไม่ทำผิดพลาดซ้ำรอยอดีต"
 bp2_yearly.4003.c: "เคาน์ตี้นี้มีค่ามากกว่าการศึกษาของ[child_ruler.GetHerHis]!"

 #parental prestige event chain
 bp2_yearly.4010.t: "เงาแห่งชื่อเสียง: ยามสนธยา"
 bp2_yearly.4010.desc:1 "มีเสียงกระซิบเกี่ยวกับเรื่องเล่าและการกระทำของ[famous_parent.GetMotherFather]ของข้า [ROOT.Char.Custom('ParentPrestigeLevelText')] [famous_parent.GetTitledFirstName] ในทุกหนแห่งที่ข้าไป ไม่ว่าจะใกล้หรือไกล ดูเหมือนจะไม่มีใครที่ไม่เคยได้ยินชื่อของ[famous_parent.GetHerHis]\n\nข้าสงสัยว่า ข้าจะต้องอยู่ในเงาของ[famous_parent.GetMotherFather]ตลอดไปหรือไม่? หรือข้าจะสามารถบรรลุชื่อเสียงได้มากเท่า[famous_parent.GetHerHim]ในชีวิตของข้า? ข้าจะสามารถไต่เต้าขึ้นไปได้สูงเพียงใด?"
 bp2_yearly.4010.a: "อย่างถ่อมตนรึ? ข้าไม่ใช่คนถ่อมตน!"
 bp2_yearly.4010.b: "สักวันข้าจะเป็นเหมือนท่าน [famous_parent.GetFirstNameNoTooltip]!"
 bp2_yearly.4010.b.flavor: "ข้าจะมีชื่อเสียง ข้าจะส่องสว่างเจิดจ้า ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 bp2_yearly.4010.c: "ข้ายินดีที่มี[famous_parent.GetMotherFather]ผู้มีชื่อเสียง เช่นนี้!"
 bp2_yearly.4010.c.flavor: "และข้าพึงพอใจที่จะอยู่ในเงาของ[famous_parent.GetHerHis]"

 bp2_yearly.4011.t: "เงาแห่งชื่อเสียง: ยามรุ่งอรุณ"
 bp2_yearly.4011.desc:1 "[famous_dead_parent.GetMotherFather]ของข้า [famous_dead_parent.GetTitledFirstName]ผู้ยิ่งใหญ่ [famous_dead_parent.GetDeathReason]ไปนานแล้ว ทว่าเปลวไฟแห่งชีวิตของ[famous_dead_parent.GetHerHis]ยังคงส่องสว่างเจิดจ้า สิ่งที่เคยห้อมล้อม[famous_dead_parent.GetHerHim]อยู่ทุกหนแห่ง บัดนี้ดูเหมือนจะติดตามข้ามา\n\nหลายคนยังคงถือว่าข้าเป็น[ROOT.Char.Custom('GetDaughterSon')]ของ[famous_dead_parent.GetHerHis] มากกว่าที่จะเป็น[ROOT.Char.GetWomanMan]ในสิทธิ์ของข้าเอง! เมื่อวานนี้เอง ชาวนาชราคนหนึ่งยังคงสรรเสริญ[famous_dead_parent.GetHerHim]ราวกับว่า[famous_dead_parent.GetSheHe]ยังมีชีวิตอยู่!\n\nถึงเวลาแล้วที่จะก้าวออกจากเงาของ[famous_dead_parent.GetHerHis]! เพื่อสร้างชื่อเสียงของข้าให้ประจักษ์แก่โลก! เพื่อให้ได้รับการยอมรับในฐานะ[ROOT.Char.GetTitledFirstName]ผู้ยิ่งใหญ่!"
 bp2_yearly.4011.a: "โลกจะจดจำ[famous_dead_parent.GetFirstNameNoTooltip]ในฐานะ[famous_dead_parent.GetMotherFather]#EMP ของข้า#! "
 bp2_yearly.4011.b: "อนิจจา ข้าคงจะเป็น[ROOT.Char.Custom('GetDaughterSon')]ของ[famous_dead_parent.GetHerHis]ตลอดไป"
 bp2_yearly.4011.c: "ข้าประสบความสำเร็จมากพอแล้ว"
 bp2_yearly.4011.d: "$bp2_yearly.4011.a$"

 bp2_yearly.4012.t: "เงาแห่งชื่อเสียง: ยามกลางวัน"
 bp2_yearly.4012.desc: "เวลาผ่านไปนานนับตั้งแต่ข้าตัดสินใจมุ่งมั่นที่จะสร้างชื่อเสียงให้ทัดเทียม[famous_dead_parent.GetMotherFather]ผู้ล่วงลับของข้า และนานยิ่งกว่านั้นนับตั้งแต่การตายของ[famous_dead_parent.GetHerHis] มันช่างเคร่งเครียดและเรียกร้องความพยายามอย่างยิ่งที่จะก้าวออกจากเงาของเขา ข้ายังคงรู้สึกว่าโลกตัดสินข้าไม่ใช่เพียงแค่การกระทำของข้าเท่านั้น แต่ยังเปรียบเทียบกับ[famous_dead_parent.GetTitledFirstName]เสมอ\n\nข้ารู้ว่าข้าได้รับความเคารพ แต่มันเพียงพอแล้วหรือ? ข้าจะทำอะไรได้อีก เพื่อให้เป็นที่จดจำ? เพื่อให้ยิ่งใหญ่กว่าที่[famous_dead_parent.GetMotherFather]ของข้าเคยเป็น!"
 bp2_yearly.4012.a: "ยังมีอีกมากที่ข้าต้อง ทำให้สำเร็จ"
 bp2_yearly.4012.b: "อา เหตุใดต้องลำบากด้วย ข้าคงต้องอยู่ในเงาของ[famous_dead_parent.GetFirstNameNoTooltip]ตลอดไป"
 bp2_yearly.4012.c: "บัดนี้เราเท่าเทียมกันแล้ว [famous_dead_parent.GetMotherFather|U]"
 bp2_yearly.4012.d: "ไม่มีคำว่าพอ! ไม่มีวัน!"

 bp2_yearly.4013.t: "เงาแห่งชื่อเสียง: จุดสูงสุด"
 bp2_yearly.4013.desc_success: "วันนี้ข้าตื่นขึ้นมาพร้อมความมั่นใจเป็นครั้งแรกในชีวิต: ชื่อเสียงของข้าดูเหมือนจะไร้ขอบเขต และข้าไม่ใช่เพียงแค่[ROOT.Char.Custom('GetDaughterSon')]ของ[famous_dead_parent.GetTitledFirstName]อีกต่อไป ข้าสามารถอาบแสงแห่งเกียรติยศของตนเองได้แล้ว ในที่สุดก็เป็นอิสระจากเงาของ[famous_dead_parent.GetMotherFather]ของข้า\n\nถึงเวลาแล้วหรือยังที่จะหยุดพักการไล่ตามการยอมรับอย่างไม่หยุดยั้ง? หรือข้าควรจะลุกโชนและส่องสว่างยิ่งขึ้นไปอีก จนกว่าเด็กทุกคนจะเอ่ยชื่อข้า แม้กระทั่งในรุ่นต่อๆ ไป?"
 bp2_yearly.4013.desc_failure: "วันนี้ข้าตื่นขึ้นมาพร้อมความคิดอันหนักอึ้ง: แม้จะพยายามมาหลายปี ความสำเร็จในชีวิตของข้าก็ยังดูด้อยค่าเมื่อเทียบกับ[famous_dead_parent.GetMotherFather]ผู้ยิ่งใหญ่ของข้า [famous_dead_parent.GetTitledFirstName] ข้าได้ผลักดันตนเอง แต่ก็ยังไม่สามารถหลุดพ้นจากเงาอันยาวนานแห่งชื่อเสียงของ[famous_dead_parent.GetHerHis]ได้\n\nนี่คือคำสาปที่[famous_dead_parent.GetMotherFather]ทุกคนนำมาสู่บุตรหลานของตนหรือไม่? เราทุกคนเกิดมาในการแข่งขันอันไร้ผลกับยักษ์ใหญ่ในอดีตหรือ?"
 bp2_yearly.4013.a: "ข้า ทำให้ท่านผิดหวัง [famous_dead_parent.GetFirstNameNoTooltip] และข้าก็ ทำให้ตัวเองผิดหวัง"
 bp2_yearly.4013.b: "[ROOT.Char.Custom('PrestigeLevelText')] [ROOT.Char.GetFirstNameNoTooltip] ข้าชอบเสียงนั้น"
 bp2_yearly.4013.c: "ข้าจะไม่หยุดพักจนกว่าชื่อของข้าจะเป็นที่รู้จักไปทั่วปฐพี!"

 #parental piety event chain
 bp2_yearly.4020.t: "เงาแห่งศรัทธา: ยามสนธยา"
 bp2_yearly.4020.desc: "ช่างเป็นความปิติยินดีเสียนี่กระไรที่ได้เป็น[ROOT.Char.Custom('GetDaughterSon')]ของผู้รับใช้[ROOT.Char.GetFaith.HighGodName]ที่เป็นแบบอย่าง เช่นนี้! ความศรัทธาอันแรงกล้าที่ข้ารู้สึกในใจเมื่อได้ยินทุกคนกล่าวถึง[pious_parent.GetHerHim]ในฐานะ[ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! คุณธรรมของ[pious_parent.GetHerHis|U]เป็นที่เคารพบูชาทั้งจากเหล่า[ROOT.Char.GetFaith.PriestNeuterPlural]และ[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]ผู้ศรัทธา\n\nข้าสงสัยว่า ข้าจะอยู่ในเงาของ[pious_parent.GetMotherFather]อย่างถ่อมตนต่อไปหรือไม่? หรือข้าจะบรรลุและก้าวข้ามความศรัทธา เช่นนั้นได้ในชีวิตของข้าเอง? พระคุณของ[ROOT.Char.GetFaith.HighGodName]จะประจักษ์ชัดในตัวข้าเหมือนดังที่ประจักษ์ในตัว[pious_parent.GetHerHim]หรือไม่?"
 bp2_yearly.4020.b: "สักวันข้าจะเป็นเหมือนท่าน [pious_parent.GetFirstNameNoTooltip]!"
 bp2_yearly.4020.b.flavor: "ข้าจะเป็นผู้มีคุณธรรม ข้าจะรับใช้[ROOT.Char.GetFaith.HighGodName] ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
 bp2_yearly.4020.c: "ข้ายินดีที่มี[pious_parent.GetMotherFather]ผู้ศรัทธา เช่นนี้!"
 bp2_yearly.4020.c.flavor: "และข้าพึงพอใจที่จะอยู่ในเงาของ[pious_parent.GetHerHis]"

 bp2_yearly.4021.t: "เงาแห่งศรัทธา: ยามรุ่งอรุณ"
 bp2_yearly.4021.desc: "หลายปีผ่านไปนับตั้งแต่[pious_dead_parent.GetMotherFather]ผู้ยิ่งใหญ่ของข้า [pious_dead_parent.GetTitledFirstName] [pious_dead_parent.GetDeathReason] ข้าหวังว่า[pious_dead_parent.GetSheHe]กำลังรับใช้[ROOT.Char.GetFaith.HighGodName]ใน[ROOT.Char.GetFaith.PositiveAfterLife|U]อยู่ ณ บัดนี้ ทว่าจิตวิญญาณแห่งศรัทธาของ[pious_dead_parent.GetHerHis]ยังคงอยู่ท่ามกลางผู้ที่ยังมีชีวิต ทั้งในฐานะแรงบันดาลใจและความท้าทาย ข้ายังคงถูกมองว่าเป็น[ROOT.Char.Custom('GetDaughterSon')]ของ[pious_dead_parent.GetHerHis]โดยเหล่า[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]ผู้ศรัทธา เมื่อวานนี้เอง [ROOT.Char.GetFaith.PriestNeuter]ชราคนหนึ่งยังคงสรรเสริญ[pious_dead_parent.GetHerHim]ราวกับเป็นผู้ปกครององค์ปัจจุบัน!\n\nข้าสงสัยว่า[ROOT.Char.GetFaith.HighGodName]รู้สึก เช่นเดียวกันกับข้าหรือไม่? ข้ารู้สึกถึงความต้องการอันแรงกล้าที่จะพิสูจน์ตนเองในฐานะ[ROOT.Char.GetWomanMan]แห่งศรัทธาด้วยตนเอง เพื่อก้าวออกจากเงาของ[pious_dead_parent.GetMotherFather]ของข้า!"
 bp2_yearly.4021.a: "[ROOT.Char.GetFaith.HighGodName]จะมองเห็นข้าในฐานะตัวข้าเอง!"
 bp2_yearly.4021.b: "อนิจจา ข้าจะให้เกียรติความทรงจำของ[pious_dead_parent.GetFirstNameNoTooltip]และ[ROOT.Char.GetFaith.HighGodName]โดยการอยู่ในเงาของ[pious_dead_parent.GetHerHis]ต่อไป"
 bp2_yearly.4021.c: "ข้าประสบความสำเร็จมากพอแล้ว"
 bp2_yearly.4021.d: "[ROOT.Char.GetFaith.HighGodName]จะรู้จัก[pious_dead_parent.GetFirstNameNoTooltip]ในฐานะ[pious_dead_parent.GetMotherFather]#EMP ของข้า#! "

 bp2_yearly.4022.t: "เงาแห่งศรัทธา: ยามกลางวัน" #ข้ารู้สึกได้รับพรและชุ่มชื่นใจ แต่เพียงพอแล้วหรือ?
 bp2_yearly.4022.desc: "แสงสว่างแห่ง[ROOT.Char.GetFaith.HighGodName]นำทางข้าในภารกิจอันศักดิ์สิทธิ์ ดังที่เคยนำทาง[pious_dead_parent.GetMotherFather]ของข้า [pious_dead_parent.GetTitledFirstName]ผู้ยิ่งใหญ่ ชีวิตของผู้รับใช้อันศรัทธาของ[ROOT.Char.GetFaith.HighGodNamePossessive]ไม่ใช่เรื่องง่าย ทว่าข้ารู้สึกว่าต้องยิ่งใหญ่กว่า[pious_dead_parent.GetMotherFather]ของข้าให้ได้\n\n[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]ที่ดีควรไล่ตามการยอมรับจากทั้งผู้คนรอบข้างและ[ROOT.Char.GetFaith.HighGodName]อย่างไม่หยุดยั้งเสมอไปหรือไม่? แบบอย่างของ[pious_dead_parent.GetMotherFather]เป็นแสงนำทางให้ปฏิบัติตาม หรือเป็นเป้าหมายที่ต้องบรรลุและก้าวข้ามไป?"
 bp2_yearly.4022.a: "ยังมีอีกมากที่ข้าต้อง ทำให้สำเร็จ"
 bp2_yearly.4022.b: "อา เหตุใดต้องลำบากด้วย ข้าหวังว่า[ROOT.Char.GetFaith.HighGodName]จะทรงให้อภัย"
 bp2_yearly.4022.c: "บัดนี้เราเท่าเทียมกันแล้ว [pious_dead_parent.GetMotherFather|U]"
 bp2_yearly.4022.d: "ไม่มีคำว่าพอ! ไม่มีวัน!"

 bp2_yearly.4023.t: "เงาแห่งศรัทธา: จุดสูงสุด"
 bp2_yearly.4023.desc_success: "ขอสรรเสริญ[ROOT.Char.GetFaith.FateGodNamePossessive|U]! วันนี้ข้าตื่นขึ้นมาพร้อมความมั่นใจเป็นครั้งแรกในชีวิต: ข้าได้พิสูจน์ตนเองอย่างไม่ต้องสงสัยแล้วว่าเป็น[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]ที่เป็นแบบอย่าง ไม่ใช่เพียงแค่[ROOT.Char.Custom('GetDaughterSon')]ของ[pious_dead_parent.GetTitledFirstName] ข้าอาบแสงแห่ง[ROOT.Char.GetFaith.HighGodName] ข้าไม่ได้อยู่ในเงาของ[pious_dead_parent.GetMotherFather]อีกต่อไป\n\nถึงเวลาแล้วหรือยังที่จะหันไปสนใจเรื่องทางโลกมากขึ้นและวางใจได้ว่าข้าอยู่ในพระคุณของ[ROOT.Char.GetFaith.HighGodNamePossessive]? หรือ[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]ที่ดีไม่ควรเหน็ดเหนื่อย ไม่ควรหยุดพักในการแสวงหาการยอมรับอันศักดิ์สิทธิ์ของ[ROOT.Char.GetFaith.HighGodNamePossessive]?"
 bp2_yearly.4023.desc_failure: "วันนี้ข้าตื่นขึ้นมาพร้อมความคิดอันหนักอึ้ง: ข้าได้ผลักดันตนเองมาหลายปี เพื่อให้ศรัทธามากที่สุดเท่าที่จะเป็นไปได้ ทว่าข้ายังคงรู้สึกว่าแสงสว่างแห่ง[ROOT.Char.GetFaith.HighGodName]ถูกบดบังด้วยความทรงจำของ[pious_dead_parent.GetMotherFather]ของข้า [pious_dead_parent.GetTitledFirstName]ผู้ยิ่งใหญ่ นี่คือพระประสงค์ของ[ROOT.Char.GetFaith.FateGodNamePossessive]หรือ?\n\nนี่คือคำสาปที่บิดามารดาทุกคนนำมาสู่บุตรหลานของตนหรือไม่? เราทุกคนเกิดมาในการแข่งขันอันไร้ผลกับยักษ์ใหญ่ในอดีตหรือ? นี่คือโลกที่[ROOT.Char.GetFaith.CreatorName]ตั้งใจสร้างขึ้นหรือ?"
 bp2_yearly.4023.a: "ข้า ทำให้ท่านผิดหวัง! [ROOT.Char.GetFaith.HighGodName] โปรดอภัยให้ข้าด้วย"
 bp2_yearly.4023.b: "[ROOT.Char.Custom('PietyLevelText')] [ROOT.Char.GetFirstNameNoTooltip] ข้าชอบเสียงนั้น"
 bp2_yearly.4023.c: "[ROOT.Char.GetFaith.PositiveAfterLife|U]และโลกหล้าจะรู้จักชื่อข้าตลอดไป!"

 bp2_yearly.4030.t: "ในเย็นวันที่หิมะตก"
 bp2_yearly.4030.desc: "\"เรา-เราเดินทัพฝ่าดินแดนอันหนาวเหน็บเหล่านี้มานานเท่าใดแล้วก็มิอาจทราบได้ มีเพียง[frosty_knight.GetFaith.CreatorName]เท่านั้นที่รู้! พวกคนใน[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]ที่ไม่ทำงานทำการและนอนหลับในเตียงอุ่นๆ ของพวกมัน!" $knight_culture_player_no_tooltip$ [frosty_knight.GetFirstName]ของข้าบ่นพลางตัวสั่นจากความหนาว นานเท่าใดกันนะ? กลางวันนั้นสั้นและมืดมน ปราศจากการหยุดพักจากดวงอาทิตย์เบื้องบน\n\nข้าหลับตาลง ดวงอาทิตย์! ข้าถูกความทรงจำถึงแสงอาทิตย์แรกของฤดูหนาวอันยาวนานเข้าครอบงำ ฤดูหนาวที่ดูเหมือนจะกินเวลาทั้งชีวิตของข้า ความทรงจำในวัยเด็กแผ่ซ่านเหมือนน้ำร้อนในเส้นเลือด มอบความสบายใจและการปลอบประโลม ดวงอาทิตย์และฤดูใบไม้ผลิมาถึงในตอนนั้น\n\nและมันจะมาถึงในตอนนี้!"
 bp2_yearly.4030.a: "และพร้อมกับดวงอาทิตย์ ชัยชนะ!"
 bp2_yearly.4030.b: ""ผู้ใดกัน [frosty_knight.GetSheHe] ที่ปรารถนา เช่นนั้น? $knight_culture_player_no_tooltip$ ของข้า, [frosty_knight.GetFirstNameNoTooltip]?""
 bp2_yearly.4030.b.flavor: "ฟังข้า เหล่านักรบแห่ง[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! แม้ค่ำคืนจะยาวนาน ดวงอาทิตย์ก็จะมาถึง! และพร้อมกับมัน ชัยชนะ! เราจะกลับไปพร้อมกับเกียรติยศอันเป็นนิรันดร์และความมั่นใจว่าไม่มีความยากลำบากใดจะหยุดยั้งเราได้!"
 bp2_yearly.4030.c: "ฤดูหนาวอันโหดร้ายอีกครั้งรึ? เป็นการฝึกที่ดีสำหรับครั้งต่อไป!"
 bp2_yearly.4030.c.tt: "แข็งแกร่งขึ้นจากฤดูหนาวอันโหดร้าย"

 bp2_yearly.4031.t: "วงจรแห่งการจองจำ"
 bp2_yearly.4031.desc_first:1 "อีกครั้งในชีวิตที่ข้าถูกพรากอิสรภาพและถูกพันธนาการ ข้าเคยเป็นเด็กครั้งหนึ่ง ถูกคุมขังโดย [old_imp.GetTitledFirstName] ผู้ [old_imp.Custom2('InsultAdjective', ROOT.Char)]\n\n"
 bp2_yearly.4031.desc_base: "บัดนี้ [new_imp.GetTitledFirstName] ผู้ [new_imp.Custom2('InsultAdjective', ROOT.Char)] คือผู้ที่กักขังข้า\n\nนี่คือโชคชะตาที่นำพาข้ามาที่นี่อีกครั้งหรือ? แม้ แต่โซ่ตรวนยังเป็นอันเดิมหรือไม่? อิสรภาพของข้าเป็นเพียงการหยุดชะงักชั่วคราวของการถูกจองจำงั้นหรือ? "
 bp2_yearly.4031.desc_same_captor: "บัดนี้ [old_imp.GetSheHe] กักขังข้าอีกครั้ง!\n\nไอ้ [old_imp.Custom2('InsultNoun', ROOT.Char)] เฒ่านั่น ยังอุตส่าห์มี #EMP มารยาท#! ให้ข้าอยู่ในห้องขังเดิม! เป็น เพราะความมุ่งร้ายของ [old_imp.GetHerHis] เพียงอย่างเดียวหรือที่นำข้ากลับมา? หรือโชคชะตากำหนดไว้แล้วว่าอิสรภาพของข้าเป็นเพียงการหยุดชะงักชั่วคราวของการถูกจองจำ?\n\n"
 bp2_yearly.4031.desc_last: "ข้าจะต้องอยู่ใต้อำเภอใจของผู้อื่นเสมอไปหรือ?\n\nไม่! ข้ารอดชีวิตมาได้เมื่อครั้งยังเป็นเด็กและได้รับอิสรภาพกลับคืนมา สิ่งใดจะรั้งข้าไว้ได้ในตอนนี้?"
 bp2_yearly.4031.a: "ไม่มีวันอีกแล้ว! ข้าจะเป็นอิสระ!"
 bp2_yearly.4031.a.flavor: "ทำลายโซ่ตรวนอันน่าสาปแช่งนี้เสีย!"
 bp2_yearly.4031.a.ct: "ความพยายามหลบหนีมีแนวโน้มที่จะสำเร็จมากขึ้น แม้ว่าความล้มเหลวจะอันตรายยิ่งกว่าเดิม..."
 bp2_yearly.4031.b: "อดทนไว้ [ROOT.Char.GetFirstNameNoTooltip] ข้าเคยทนมาแล้วในตอนนั้น"
 bp2_yearly.4031.b.flavor: "และข้าจะอดทนในตอนนี้"

 bp2_yearly.4032.t: "ตัวประกันในอดีตและปัจจุบัน"
 bp2_yearly.4032.desc: "ถึงเวลาที่[hostage_kiddo.GetFirstName]ต้องจากไปแล้ว ข้ามองเข้าไปในดวงตาของ[hostage_kiddo.GetHerHis]และเห็นตัวเองเมื่อครั้งยังเป็นเด็ก ตอนที่ข้าถูกส่งตัวไปเป็นตัวประกันให้กับ[new_papa.GetTitledFirstName] [tru_papa.GetTitledFirstName]กำลังมองข้าอยู่ในตอนนั้น คำพูดใดที่กล่าวในวันนั้น ข้าจำไม่ได้แล้ว [tru_papa.GetSheHe]มีความคิด เช่นไรเมื่อข้าจากไป?\n\n[hostage_kiddo.GetFirstNameNoTooltip]จะส่งบุตรหลานของ[hostage_kiddo.GetHerHis]ไปเป็นตัวประกัน เช่นกันในอนาคตหรือไม่? ข้าจะมอบสิ่งใดให้[hostage_kiddo.GetHerHim]ได้ในชั่วขณะสุดท้ายนี้?"
 bp2_yearly.4032.a: "[ROOT.Char.GetHouse.GetMotto] [hostage_kiddo.Custom('GetDaughterSon')]ของข้า"
 bp2_yearly.4032.a.flavor: "จงจำคำเหล่านั้นไว้ ทุกคนในตระกูล[ROOT.Char.GetDynasty.GetNameNoTooltip]ล้วนถูกเรียกให้รับใช้สักวันหนึ่ง วันของเจ้ามาถึงแล้วในวันนี้"
 bp2_yearly.4032.b: "เจ้าจะได้กลับบ้านในสักวันหนึ่ง เหมือนดังที่ข้าเคยกลับมา"


 parental_conviction: "ความมุ่งมั่นของผู้ปกครอง"
