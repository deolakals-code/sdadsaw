 famed_parent_lvl_2: "เงาแห่งชื่อเสียง: ยามรุ่งอรุณ"
 famed_parent_lvl_2_desc: "ตัวละครนี้มุ่งมั่นอย่างยิ่งที่จะมีชื่อเสียงให้มากที่สุดเท่าที่จะเป็นไปได้"
