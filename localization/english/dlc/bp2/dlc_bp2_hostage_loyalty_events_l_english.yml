l_english: 
 bp2_yearly.8050.t: "ข้าคือผู้ใด?"
 bp2_yearly.8050.desc.intro: "ข้าพบ [hostage.GetName] วันนี้กำลังมองอย่างโหยหาและครุ่นคิด จ้องมองผู้คนที่อยู่เบื้องล่างเรา\n\nข้าเข้าใกล้และวางมือลงบนไหล่ที่ตกของ [hostage.GetHerHis] และถามว่าสิ่งใดถ่วงใจ [hostage.GetHerHis] หนักหนานัก\n\n"โอ้ ท่าน [ROOT.Char.Custom('GetAuntUncle')],"
 bp2_yearly.8050.desc.mid.friendship: "ท่านเป็นมิตรกับข้ามากกว่าผู้ใดในสถานที่ที่ข้าเคยเรียกว่าบ้านเสียอีก"
 bp2_yearly.8050.desc.mid.childhood_friendship: "[hostage_friend.GetFirstName] เป็นมิตรกับข้ามากกว่าผู้ใดในสถานที่ที่ข้าเคยเรียกว่าบ้านเสียอีก"
 bp2_yearly.8050.desc.mid.hatred: "[hated_parent.Custom2('MyCharacterIntroduction', SCOPE.sC('hostage'))] มัน [hated_parent.Custom2('InsultAdjective', SCOPE.sC('hostage'))] [hated_parent.Custom2('InsultNoun', SCOPE.sC('hostage'))] โดยแท้ และข้าทนคิดถึงการกลับไปหา [hated_parent.GetHerHim] ไม่ได้"
 bp2_yearly.8050.desc.mid.culture: "ข้าเพียงแค่ไม่ผูกพันกับวัฒนธรรม [hated_parent.GetCulture.GetName] อีกต่อไป และข้ารู้สึกว่าข้าคงเป็นคนแปลกหน้าสำหรับ [hated_parent.GetMotherFather] ของข้า ข้ารู้สึกสบายใจกับธรรมเนียมปฏิบัติของ [hostage.GetCulture.GetName] ที่ข้าได้เรียนรู้ที่นี่มากกว่า"
 bp2_yearly.8050.desc.mid.faith: "[hated_parent.GetMotherFather] ของข้าเป็น [hated_parent.GetFaith.GetAdherentName] และข้าเป็น [hostage.GetFaith.GetAdherentName] ข้าจะเรียกตนเองว่าเป็น [hostage.Custom('GetDaughterSon')] ของ [hated_parent.GetHerHis] ได้อย่างไรเมื่อความเชื่อของเราแตกต่างกันถึงเพียงนี้?"
 bp2_yearly.8050.desc.mid.traits: "ข้าเพียงรู้สึกว่าเรามีอะไรเหมือนกันมากกว่าที่ข้ามีกับผู้คนในสถานที่ที่ข้าเคยเรียกว่าบ้าน"
 bp2_yearly.8050.desc.outro: "ข้าอดสงสัยไม่ได้ว่า ข้าคือผู้ใด? [hostage.GetHouse.GetName|U] หรือ [ROOT.Char.GetHouse.GetName]?""
 bp2_yearly.8050.a: ""แน่นอน ข้าคือ [ROOT.Char.Custom('GetAuntieUncle')] ของเจ้า"" # (ใช้ GetAuntieUncle เพื่อความสอดคล้องกับภาษาอังกฤษ)
 bp2_yearly.8050.b: ""เจ้าเป็นตัวประกัน ไม่มีอะไรมากไปกว่านั้น""
 bp2_yearly.8051.t: "จดหมายประนีประนอม"
 bp2_yearly.8051.desc: "ข้าเข้าไปในห้องนอนของ [hostage.GetFirstNamePossessive] แต่พบว่าห้องนั้นไม่มี [hostage.GetHerHim] อยู่ อย่างไรก็ตาม บนโต๊ะเขียนหนังสือของ [hostage.GetHerHis] ข้าพบกองจดหมายที่เขียนไว้ครึ่งๆ กลางๆ จ่าหน้าถึง [hostage.GetHomeCourt.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]\n\nจดหมายเหล่านั้นเต็มไปด้วยรายละเอียดเกี่ยวกับราชสำนักของข้า: ที่ซ่อน ผู้ที่จัดหาอาหารให้ข้า และชื่อของคนรับใช้ที่ไม่พอใจ ซึ่งมีแนวโน้มจะทรยศข้า ข้าหันกลับไปและเห็น [hostage.GetFirstNameNoTooltip] ยืนหมดอาลัยตายอยากอยู่ที่ประตู ราวกับสัตว์ที่ถูกล่าก่อนจะหลบหนี"
 bp2_yearly.8051.a: ""โอ้ [hostage.Custom('GetNieceNephew')] ทุกอย่างได้รับการอภัยแล้ว""
 bp2_yearly.8051.b: ""เจ้าจะไม่ได้เขียนจดหมายกลับบ้านอีกเลย""
 bp2_yearly.8051.c: ""เจ้าจะไม่ได้ออกจากห้องของเจ้าอีกเลย!""
 invalidates_hostage_tt: "[hostage.GetFirstName|U] จะสิ้นสุดการเป็นตัวประกันของท่าน"
 bp2_yearly.8052.t: "การรังแก"
 bp2_yearly.8052.desc: "ลานกว้างเต็มไปด้วยเสียงวิ่งและกรีดร้องที่คุ้นเคย ขณะที่เด็กๆ ในราชสำนักกำลังเล่นกัน แม้จะมีเสียงดัง แต่ก็น่าแปลกที่เงียบสงบ จนกระทั่งเสียงกรีดร้องด้วยความเจ็บปวดของ [hostage.GetFirstName] เรียกให้ข้าเข้าไปแทรกแซง\n\n"หยุดนะ! หยุด! ท่าน [ROOT.Char.GetFirstNameNoTooltip] [mean_child.GetFirstName] เอา แต่ตีข้า!""
 bp2_yearly.8052.a: "[mean_child.GetFirstNameNoTooltip] ควรหยุดรังแกผู้อื่น"
 bp2_yearly.8052.b: "ข้าควรสนับสนุนให้ [hostage.GetFirstNameNoTooltip] ป้องกัน [hostage.GetHerselfHimself]"
 bp2_yearly.8052.b.success: "[hostage.GetFirstName] ซาบซึ้งในบทเรียน"
 bp2_yearly.8052.b.failure: "[hostage.GetFirstName] ได้รับบาดเจ็บ"
 bp2_yearly.8052.c: "ข้าไม่สนใจ"
 bp2_yearly.8053.t: "วลีอันยอดเยี่ยม"
 bp2_yearly.8053.desc: "เด็กๆ กำลังเล่นกันอีกครั้งในลานกว้าง และวันนี้พวกเขากำลังเล่นกับดาบของเล่น [hostage.GetFirstName|U] ดูเหมือนจะไร้ความปรานีกับเด็กคนอื่นๆ จัดการหลายคนพร้อมกันและเอาชนะพวกเขาได้อย่างง่ายดาย\n\nท่ามกลางเสียงกรีดร้องตามปกติของการเล่น หูของข้าพลันผึ่งขึ้นเมื่อ [hostage.GetSheHe] กรีดร้องว่า "#EMP [ROOT.Char.GetHouse.GetMotto]#! ไอ้พวกไพร่!""
 bp2_yearly.8053.a: "เป็นวลีที่ดี"
 bp2_yearly.8053.b: "คำเหล่านั้นมีไว้สำหรับริมฝีปากของ [ROOT.Char.GetHouse.GetNameNoTooltip] เท่านั้น!"
 bp2_yearly.8054.t: "ตำนานแห่ง [ROOT.Char.GetHouse.GetNameNoTooltip|U]"
 bp2_yearly.8054.desc: "ข้าหาช่วงเวลาอยู่ตามลำพังกับ [hostage.GetFirstName] ได้ยาก มอบบทเรียนตามปกติของข้าในเรื่องทางโลกและทางธรรม แต่ [hostage.Custom('GirlBoy')] ดูเหมือนจะมีเรื่องอื่นอยู่ในใจ [hostage.GetHerHis]\n\n"ข้าหลงใหลในตระกูลอันรุ่งโรจน์ของท่าน ท่าน [ROOT.Char.Custom('GetAuntUncle')] ท่านช่วยเล่าตำนานบางส่วนของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ให้ข้าฟังได้หรือไม่?""
 bp2_yearly.8054.a: "เจ้าเคยได้ยินเรื่องของ [ROOT.Char.GetHouse.GetFounder.GetNameNoTooltip] หรือไม่?"
 bp2_yearly.8054.b: "ข้าเองก็เป็นตำนานอยู่บ้าง"
 bp2_yearly.8054.b.success: "[hostage.GetFirstName] ประทับใจในเรื่องราวของท่าน"
 bp2_yearly.8054.b.failure: "[hostage.GetFirstName] ไม่เชื่อท่าน"
 bp2_yearly.8054.c: "ข้าเคยบอกหรือไม่ว่าข้าเคยฆ่ามังกร?"
 bp2_yearly.8055.t: "บุคลิกภาพขัดแย้ง"
 bp2_yearly.8055.desc: "[hostage.GetFirstName] ดูห่างเหินและระแวงข้ามากในช่วงนี้ [hostage.GetSheHe] หลีกเลี่ยงข้าทุกครั้งที่เราพบปะกัน เมื่อข้าหาโอกาสอยู่กับ [hostage.GetHerHim] ตามลำพังได้ในที่สุด ข้าจึงวางมืออย่างเห็นใจลงบนไหล่อันเย็นเฉียบของ [hostage.GetHerHis]\n\n[hostage.GetSheHe|U] เพียงแค่ปัดมันออก และถอยห่างจากข้า "ท่านต้องการอะไรจากข้า? ทุกช่วงเวลาที่เราอยู่ด้วยกันมันช่างทรมานยิ่งนัก! ท่านมัน [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('hostage'))] และข้าแทบรอไม่ไหวที่จะหนีไปจากที่นี่!""
 bp2_yearly.8055.a: "บางทีข้าอาจเปลี่ยนแปลงได้!"
 bp2_yearly.8055.b: "ข้าไม่ได้มีชีวิตอยู่เพื่อสร้างความประทับใจให้ [hostage.GetHerHim]"
 bp2_yearly.8055.c: "[hostage.GetSheHe|U] ควรได้รับการสนับสนุนให้เปลี่ยนแปลง"
 bp2_yearly.8055.c.success: "ท่านโน้มน้าว [hostage.GetHerHim] ให้เห็นด้วยกับแนวทางของท่านได้"
 bp2_yearly.8055.c.failure: "[hostage.GetFirstName|U] รู้สึกถูกดูหมิ่น"
 bp2_yearly.8056.t: "ตัวประกันผู้เป็นมิตร"
 bp2_yearly.8056.desc: "ข้าพบว่าการสนทนากับ [hostage.GetFirstName] เป็นเรื่องน่ายินดีอย่างยิ่ง และ [hostage.GetSheHe] ดูเหมือนจะรู้สึก เช่นเดียวกัน เรามีอะไรเหมือนกันมากมาย จนบ่อยครั้งรู้สึกเหมือนเราคิดเหมือนกัน\n\nระหว่างบทเรียนของเราในวันนี้ [hostage.GetSheHe] ตั้งใจฟังทุกคำพูดของข้า เป็นเด็กที่ควรค่าแก่การเรียกว่า [hostage.Custom('GetNieceNephew')] ของข้าอย่างแท้จริง"
 bp2_yearly.8056.a: "ยอดเยี่ยม"
 bp2_yearly.8056.b: "ในที่สุด ก็มีคนที่ #EMP เข้าใจ#! ข้าอย่างแท้จริง"
 bp2_yearly.8057.t: "เหมือน [hostage.Custom('SisterBrother')|U]"
 bp2_yearly.8057.desc: "นอกลานกว้าง [hostage.GetFirstName] และ [nice_child.GetFirstName] กำลังเล่นกันอย่างมีความสุข ดังที่เด็กทุกคนควรจะเป็น ท่ามกลางเสียงเจื้อยแจ้วและเสียงกรอบแกรบตามปกติของสรรพสิ่งที่ [ROOT.Char.GetFaith.CreatorNamePossessive] สร้างขึ้น คือเสียงหัวเราะอย่างมีความสุขของเด็กๆ และโลกดูเหมือนจะเป็นไปตามที่ควรจะเป็น\n\nในช่วงเวลาแห่งความสงบของข้า ข้าถึงกับได้ยิน [nice_child.GetFirstNameNoTooltip] เรียก [hostage.GetFirstNameNoTooltip] อย่างไม่ใส่ใจว่า "[hostage.Custom('SisterBrother')]""
 bp2_yearly.8057.a: "ช่างยอดเยี่ยมอะไร เช่นนี้"
 bp2_yearly.8057.b: "นี่เป็นเรื่องที่ควรค่าแก่การยกย่อง!"
 bp2_yearly.8060.t: "ท่าน [ROOT.Char.GetMotherFather|U]?"
 bp2_yearly.8060.desc: "ในที่สุด [hostage.GetFirstName] ก็เป็น [hostage.GetWomanMan] อย่างเป็นทางการแล้ว และข้าภูมิใจอย่างยิ่งที่ได้เห็น [hostage.GetHerHim] เดินเข้ามาในราชสำนักอย่างมั่นใจในเช้านี้ ด้วยความสง่างามและความยิ่งใหญ่ทั้งหมดที่ข้าคาดหวังจากคนของข้าเอง ยังคงต้องรอดูว่า [hostage.GetSheHe] จะยังคงอยู่ในราชสำนักหรือไม่ แต่ขณะที่ [hostage.GetSheHe] เข้ามาหาข้าเพื่อทักทายตามธรรมเนียมราชสำนัก ข้ารู้สึกราวกับว่ากำลังมองดู [hostage.Custom('GetDaughterSon')] ของข้าเอง\n\n"ช่างเป็นเกียรติที่ได้พบท่าน ท่าน [ROOT.Char.GetMotherFather]" ต้องใช้เสียงสูดลมหายใจและเสียงพึมพำจากราชสำนักสองสามครั้ง [hostage.GetHerHim] ถึงจะสังเกตเห็นความผิดพลาดของ [hostage.GetHerHis] "โอ้ ข้าหมายถึง ท่าน [ROOT.Char.Custom('GetAuntUncle')]!""
 bp2_yearly.8060.a: ""ท่าน [ROOT.Char.GetMotherFather|U] ก็ใช้ได้ดีทีเดียว""
 bp2_yearly.8060.b: ""เจ้าคือ [hostage.Custom('GetDaughterSon')] ของข้า เพียงในนามเท่านั้น""
 bp2_yearly.8060.c: ""ข้าจะเป็น [ROOT.Char.Custom('GetAuntUncle')] ของเจ้าเสมอ""
 bp2_yearly.8061.t: "ท่าน [ROOT.Char.Custom('GetAuntUncle')|U] ตลอดไป"
 bp2_yearly.8061.desc: "เป็นเวลานานแล้วนับตั้งแต่ [hostage.GetFirstName] มาถึงราชสำนักครั้งแรกและข้ากลายเป็น [ROOT.Char.Custom('GetAuntUncle')] ของ [hostage.GetHerHis] บัดนี้เมื่อเห็น [hostage.GetHerHim] เป็นผู้ใหญ่ ข้ารู้สึกถึงความผูกพันทางสายเลือดกับ [hostage.GetHerHim] ราวกับว่าเราเป็นเลือดเนื้อเชื้อไขเดียวกัน\n\n[hostage.GetFirstNameNoTooltip] คุกเข่าต่อหน้าข้าในราชสำนัก และให้คำมั่นสัญญาว่าจะจงรักภักดีต่อข้าตลอดไป ในฐานะ [ROOT.Char.Custom('GetAuntUncle')] คนโปรดของ [hostage.GetHerHis]"
 bp2_yearly.8061.a: "ยอดเยี่ยม"
 bp2_yearly.8063.t: "ตัวประกันผู้ถูกดูหมิ่น"
 bp2_yearly.8063.desc: "เป็นเวลานานแล้วนับตั้งแต่ [hostage.GetFirstName] มาถึงราชสำนักครั้งแรกและข้ากลายเป็น [ROOT.Char.Custom('GetAuntUncle')] ของ [hostage.GetHerHis] บัดนี้เป็น [hostage.GetWomanMan] แล้ว [hostage.GetSheHe] แทบจะทนมองหน้าข้าไม่ได้ เมื่อนั่งอยู่ในราชสำนัก ดวงตาของ [hostage.GetHerHis] แสดงความเกลียดชังและความอาฆาตแค้นต่อข้า ซึ่งสามารถอธิบายได้เพียงว่าเป็นผลมาจากความพยายามอันผิดพลาดของข้าในการเลี้ยงดูแบบ [ROOT.Char.GetHouse.GetNameNoTooltip] ที่เหมาะสม"
 bp2_yearly.8063.a: "อุ๊ปส์"
 bp2_yearly.8065.t: "[ROOT.Char.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 bp2_yearly.8065.desc: "ข้ารู้สึกมานานแล้วว่า [new_parent.GetFirstName] คือ [new_parent.GetMotherFather] ที่แท้จริงของข้า และในที่สุดเราก็ได้บันทึกเป็นลายลักษณ์อักษร ณ วันนี้ ข้าได้ตัดขาดจากตระกูลเก่าของข้าและบัดนี้เป็นสมาชิกเต็มตัวของ [new_parent.GetHouse.GetName]"
 bp2_yearly.8065.a: "บ้าไปแล้ว!"
 rival_manipulated_me: "[TARGET_CHARACTER.GetShortUIName|U] พยายามชักใย [CHARACTER.GetShortUIName]"
 rival_manipulated_me_corresponding: "[CHARACTER.GetShortUIName|U] พยายามชักใย [TARGET_CHARACTER.GetShortUIName]"
 friend_deep_understanding: "[CHARACTER.GetShortUIName|U] และ [TARGET_CHARACTER.GetShortUIName] แบ่งปันความเข้าใจส่วนตัวอย่างลึกซึ้งต่อกัน"
 rival_chastised_child: "[CHARACTER.GetShortUIName|U] ดุด่าว่ากล่าว [TARGET_CHARACTER.GetShortUIName]"
 rival_chastised_child_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] ดุด่าว่ากล่าว [CHARACTER.GetShortUIName]"
 bp2_security_compromised: "ความปลอดภัยถูกบุกรุก"
 bp2_security_compromised_desc: "ตัวละครนี้ค้นพบว่ามีคนในราชสำนักกำลังแบ่งปันข้อมูลที่เป็นความลับ"
 bp2_start_loyalty_story_cycle: "[hostage.GetFirstName] จะเริ่มตั้งคำถามว่า [hostage.GetSheHe] ควรภักดี [hostage.GetHerHis] ต่อผู้ใด"
