l_english: 
 bp2_yearly.5000.t: "หอกข้างแคร่"
 bp2_yearly.5000.desc: "อำนาจของข้าในฐานะผู้สำเร็จราชการนั้นเกือบจะสมบูรณ์แล้ว แต่ข้าก็ยังสลัดความรู้สึกที่ว่าอำนาจของข้าตั้งอยู่บนรากฐานที่ไม่มั่นคงไม่ได้ ข้าคือผู้ชิงบัลลังก์ และคน เช่นข้ามักจะต้องใช้มาตรการเด็ดขาด\n\nมีเสี้ยนหนามชิ้นหนึ่งที่คอยทิ่มแทงข้างกายข้า ซึ่งหากจัดการอย่างระมัดระวัง ก็สามารถถอนออกไปได้ [tower_prince.GetFirstName|U] ยังเยาว์วัย แต่ [tower_prince.GetSheHe] ก็ยังคงเป็น [tower_prince.GetTitleAsNameNoTooltip] โดยชอบธรรม แม้ว่าข้าจะกุมอำนาจในอาณาจักรนี้แน่นขึ้นเรื่อยๆ ก็จะมีผู้ที่ตั้งคำถามกับตำแหน่งของข้าเมื่อทายาทน้อยผู้นี้เติบโตเป็นผู้ใหญ่\n\nบางที เด็กคนนั้นอาจถูกนำมาอยู่ใต้การควบคุมของข้าได้? หากติดสินบนถูกคน..."
 bp2_yearly.5000.a: "จำต้องทำ"
 bp2_yearly.5000.a.flavor: "#WEAK หอคอยอันแข็งแกร่งจะกักขัง [tower_prince.Custom('GetPrincessPrince')] ผู้โชคร้าย!#!"
 bp2_yearly.5000.a.success: "อุบายสำเร็จ"
 bp2_yearly.5000.a.failure: "แผนของท่านล้มเหลว"
 bp2_yearly.5000.a.tt: "ข้าในบังคับทั้งหมดของ [tower_prince.GetFirstName|U] จะสูญเสียค่าความเห็น #negative_value 15#! ต่อ #value ท่าน#!"
 bp2_yearly.5000.b: "ข้ามิใช่ปีศาจ"

 bp2_yearly.5001.t: "[tower_prince.Custom('GetPrincessPrince')] ในหอคอย"
 bp2_yearly.5001.desc: "เมื่อแผนการของข้าสำเร็จและ [tower_prince.GetFirstName|U] ถูกขังไว้อย่างเงียบๆ อำนาจของข้าก็แทบจะไร้ผู้กังขา ทว่าข้ายังคงได้ยินเสียงกระซิบกระซาบในราชสำนัก เสียงกระซิบที่ถาม อ้อนวอน เรียกร้อง: #EMP [tower_prince.GetTitleAsNameNoTooltip] ผู้น้อยอยู่ที่ใด?!#!\n\nการปล่อยให้เด็กคนนั้นมีชีวิตอยู่และใช้ [tower_prince.GetHerHim] เพื่อเสริมสร้างตำแหน่งของข้าอาจเป็นทางเลือกที่ดี แต่การนำ [tower_prince.GetHerHim] กลับมาอาจสร้างความฮึกเหิมแก่ผู้ที่อยากเห็นข้าถูกโค่นล้ม\n\nยังมีหนทางที่สาม จิตใจของผู้คนนั้นเปลี่ยนแปลงง่าย เรื่องนี้จะถูกลืมไปอย่างรวดเร็วเพียงใดหาก [tower_prince.GetSheHe] พบว่า [tower_prince.GetHerselfHimself]... ไม่สบายไปเสียแล้ว?"
 bp2_yearly.5001.a: "ลาก่อน ผู้รบกวนนิทราอันแสนหวานของข้า..."
 bp2_yearly.5001.a.flavor: "[tower_prince.Custom('GetPrincessPrince')] ผู้น้อยจะได้เห็นแสงตะวันอีกครั้ง หาก แต่ผ่านดวงตาที่ต่างไป..."
 bp2_yearly.5001.b: "บางทีตอนนี้ข้าอาจบีบบังคับใครบางคนได้..."
 bp2_yearly.5001.b.tt: "[vassals|E] ทั้งหมดของ [tower_prince.GetFirstName|U] จะได้รับค่าความเห็น #P 25#! ต่อ #value ท่าน#!"
 bp2_yearly.5001.b.flavor: "เงินจำนวนมากในที่ที่เหมาะสม และข้าจะได้วางรากฐานสำหรับการก่อรัฐประหาร!"
 bp2_yearly.5001.b.bypass: "#WEAK นี่จะทำให้ท่านสามารถข้ามข้อกำหนดด้านเวลาของ [regency|E] สำหรับ [decision|E] พยายามโค่นล้มเจ้าเหนือหัว ได้#!"
 bp2_yearly.5001.c: "[tower_prince.GetSheHe|U] สามารถถูกปล่อยตัวได้ หาก [tower_prince.GetSheHe] สนับสนุนตำแหน่งของข้า"
 
 bp2_yearly.5005.t: "ชาวต่างชาติผู้ [foreign_hostage.Custom('GetPrettyAdjective')|U]"
 bp2_yearly.5005.desc: "ยิ่งข้าเห็น [foreign_hostage.GetFirstName] มากเท่าไร ข้าก็ยิ่งหลงใหลในตัวตนของ [foreign_hostage.GetHerHis] มากขึ้นเท่านั้น [foreign_hostage.GetSheHe|U] หมุนตัวและตั้งท่าพยายามวิ่งผ่านข้าไปขณะที่เราวิ่งไล่จับกันในสวน แสงแดดส่องลอดใบไม้ตกกระทบใบหน้าของ [foreign_hostage.GetHerHis]\n\nใจข้าเต้นแรงยิ่งกว่าแค่ เพราะออกกำลัง ข้าชะลอฝีเท้าจนหยุดนิ่ง เกิดอะไรขึ้นกับข้ากันแน่?\n\n"[ROOT.Char.GetFirstNameNoTooltip]? เป็นอะไรไป?" [foreign_hostage.GetFirstName] หยุดชะงักไปครู่หนึ่ง กังวลเล็กน้อยกับความตกตะลึงของข้า\n\nข้า #EMP ประหม่า#! เหลือเกิน..."
 bp2_yearly.5005.a: "ข้า..."
 bp2_yearly.5005.a.tt: "บางทีพวกเขาอาจรู้สึก เช่นเดียวกัน?"
 bp2_yearly.5005.b: "มัน... ไม่มีอะไร"

 bp2_yearly.5006.t: "คำหวาน"
 bp2_yearly.5006.desc: "ขณะที่ [crusher.GetFirstName] และข้าวิ่งไล่จับและเล่นกันในสวน ข้าก็ตระหนักว่า [crusher.GetSheHe] ได้เดินไปหยุดนิ่ง ข้าหันกลับไปมอง [crusher.GetHerHim] แต่ [crusher.GetSheHe] หลบสายตาข้า จ้องมองลงไปที่พื้น\n\n"ข้า... ข้า..." [crusher.GetSheHe] พูดตะกุกตะกักออกมาได้หลังจากนั้นครู่หนึ่ง หลังจากกลืนน้ำลายอย่างยากลำบาก [crusher.GetSheHe] ก็เงยหน้าของ [crusher.GetHerHis] ขึ้นจ้องตรงไปยังจุดเหนือศีรษะข้า\n\n"ข้า... ชอบท่านมาก!" [crusher.GetSheHe] เค้นเสียงออกมา เกือบจะตัวสั่นด้วยความประหม่า"
 bp2_yearly.5006.a: "ข้าก็ชอบเจ้า!"
 bp2_yearly.5006.b: "นั่นมันแปลก เจ้านี่แปลกคน"

 bp2_yearly.5007.t: "รักแรกแย้ม"
 bp2_yearly.5007.desc: "ด้วยความโล่งใจอย่างหาที่สุดมิได้ ใบหน้าของ [foreign_hostage.GetFirstNamePossessive] ก็เปล่งประกายขึ้น [foreign_hostage.GetSheHe|U] ยิ้มกว้าง พยักหน้าอย่างเขินอาย แต่กระตือรือร้น เราทั้งคู่ต่างหาคำพูดใดๆ มากล่าวได้ไม่มากนัก\n\nแทนที่จะพูด [foreign_hostage.GetFirstNameNoTooltip] ยื่นมือออกมาและกุมมือข้าเบาๆ [foreign_hostage.GetSheHe|U] ยิ้มอีกครั้ง\n\nเราเดินเล่นไปตามสวนที่มีแนวเสา มือประสานมือ ไม่รับรู้โลกรอบข้างนอกจากกันและกัน ข้าปรารถนาเงียบๆ ให้ชั่วขณะนี้คงอยู่ตลอดไป"
 bp2_yearly.5007.a: "ข้ามีของขวัญให้เจ้า"
 bp2_yearly.5007.b: "สำเร็จ! นี่เป็นความรู้สึกที่ดีที่สุดที่ข้าเคยมี!"

 bp2_yearly.5008.t: "กริชทิ่มแทงใจ"
 bp2_yearly.5008.desc: "ด้วยความสยดสยองของข้า ใบหน้าของ [foreign_hostage.GetFirstNamePossessive] บิดเบี้ยวเป็นสีหน้าไม่แน่ใจ\n\n"เจ้าหมายความว่าอย่างไร? ทำไมเจ้าถึงทำตัวแปลกๆ เช่นนี้?" [foreign_hostage.GetSheHe|U] ถามอย่างดูแคลน\n\nหัวใจข้าแตกสลายบนพื้นกรวดในสวน ข้าซ่อนใบหน้าเพื่อไม่ให้ [foreign_hostage.GetSheHe] เห็นน้ำตา\n\n"ไม่มีอะไร ข้าต้องไปแล้ว""
 bp2_yearly.5008.a: "บางที... บางที [foreign_hostage.GetSheHe] อาจจะเปลี่ยนใจ [foreign_hostage.GetHerHis] ในภายหลัง?"
 bp2_yearly.5008.b: "เหตุใดเจ้าช่าง #EMP โหดร้าย#! เช่นนี้, [foreign_hostage.GetFirstNameNoTooltip]?"

 bp2_yearly.5009.t: "วางแผนเพื่ออนาคต"
 bp2_yearly.5009.desc: "แสงแดดสาดส่องอย่างมีความสุขขณะที่ [marry_crush.GetFirstName] และข้าเดินเล่นในสวน [marry_crush.GetSheHe|U] หันมาหาข้า\n\n"เมื่อเราโตขึ้น เราจะได้ แต่งงานกันไหม?" [marry_crush.GetSheHe|U] ถามอย่างจริงจัง สีหน้าสงสัยของข้ากระตุ้นให้ [marry_crush.GetSheHe] พูดต่ออย่างชัดเจน "เมื่อเราทั้งคู่ถึงวัยอันควร เราควรจะได้ แต่งงานกันอย่างแน่นอน มันคือพรหมลิขิตของเรา!"\n\nข้าพิจารณาความเป็นไปได้เงียบๆ ไฟรักของข้าช่างโชติช่วง: แน่นอนว่าคงไม่มีอนาคตสำหรับข้าหากปราศจาก [marry_crush.GetFirstNameNoTooltip]?"
 bp2_yearly.5009.a: "แน่นอน เราต้อง แต่งงานกัน!"
 bp2_yearly.5009.b: "อะไรๆ ก็เปลี่ยนแปลงได้..."

 bp2_yearly.5010.t: "หวนรำลึกอดีต"
 bp2_yearly.5010.desc: ""เหมือนวันวานเลย ว่าไหม?"\n\nข้าหลุดจากภวังค์ด้วยเสียงของ [marry_crush.GetFirstName] [marry_crush.GetSheHe|U] นั่ง [marry_crush.GetHerselfHimself] ลงข้างข้า ยิ้มกว้าง เพียงแค่มี [marry_crush.GetHerHim] อยู่ในสวนนี้กับข้า ก็ ทำให้หวนนึกถึงความทรงจำเมื่อครั้งเราทั้งคู่ยังเยาว์วัยและทุ่มเทให้กันอย่างน่าอาย\n\n"เจ้าจำได้ไหมเมื่อนานมาแล้ว? เราถึงกับให้คำมั่นว่าจะ แต่งงานกันหากเรายังไม่ได้ แต่งงานเมื่อเป็นผู้ใหญ่!" [marry_crush.GetSheHe|U] หัวเราะเสียงดังเมื่อนึกถึงความหลัง เราทั้งคู่ช่างไร้เดียงสาเสียนี่กระไร\n\nถึงกระนั้น..."
 bp2_yearly.5010.a: "เอ่อ... แล้วเรื่องนั้นล่ะ?"
 bp2_yearly.5010.a.flavor: "ถ่านไฟเก่าในวัยเยาว์ยังคงคุกรุ่นอยู่บ้าง..."
 bp2_yearly.5010.a.tt: "ท่านขอ [marry_crush.GetFirstNameNoTooltip] แต่งงาน"
 bp2_yearly.5010.b: "มันเป็นช่วงเวลาที่ดี ใช่ไหมล่ะ?"

 bp2_yearly.5011.t: "คำขอ แต่งงานที่ดี"
 bp2_yearly.5011.desc: ""เจ้าจำได้ไหม" [root_crush.GetFirstName] กล่าว หันมาหาข้าขณะที่เราคุยกันในสวน "ว่าเราให้คำมั่นสัญญาว่าจะ แต่งงานกันเมื่อเรายังเด็ก หากเราทั้งคู่ยังไม่ได้ แต่งงานเมื่อเป็นผู้ใหญ่?"\n\nข้าประหลาดใจ รื้อฟื้นความทรงจำ ข้า #EMP จำได้#! ในสวนที่คล้ายกับแห่งนี้มาก เราได้ให้คำมั่นสัญญาในวัยเยาว์อันไร้เดียงสาและเปี่ยมความหวัง เราช่างเยาว์วัย เปี่ยมด้วยไฟรัก ความทรงจำนั้น ทำให้รอยยิ้มผุดขึ้นมาโดยไม่รู้ตัว\n\n"ข้ายังไม่ลืม" [root_crush.GetFirstNameNoTooltip] จริงจังกว่าที่ข้าคาดไว้เล็กน้อย [root_crush.GetSheHe|U] กุมมือข้าไว้ในมือของ [root_crush.GetHersHis] "ข้าหมายความตามที่พูด เราทั้งคู่ยังไม่ได้ แต่งงาน ข้าจำได้ว่าเรามีความสุขเพียงใด""
 bp2_yearly.5011.a: "...ใช่ ใช่แล้ว ทำตามนั้นเถอะ"
 bp2_yearly.5011.b: "เรื่องไร้สาระของเด็กๆ! ตั้งสติหน่อย"

 bp2_yearly.5012.t: "จุดไฟรักขึ้นใหม่"
 bp2_yearly.5012.desc: "ใบหน้าของ [marry_crush.GetFirstNamePossessive] อ่านไม่ออกอยู่ครู่หนึ่ง แต่แล้วก็คลี่คลายกลายเป็นความประหลาดใจอย่างมีความสุข\n\n"แน่นอน ข้าตกลง! แน่นอน!" [marry_crush.GetSheHe|U] โผ [marry_crush.GetHerselfHimself] เข้าสู่อ้อมแขนของข้า ชั่วขณะหนึ่ง เหมือนเรากลับไปเป็นเด็กอีกครั้ง งุ่มง่ามฝ่าฟันความรู้สึกเวียนหัวสับสน\n\nข้าจับมือ [marry_crush.GetHerHis] และเรามุ่งหน้าไปยังทางเข้าสวน มีเรื่องมากมายที่ต้องจัดการนี่นา"
 bp2_yearly.5012.a: "ตลอดไปและเสมอไป!"
 bp2_yearly.5012.b: "...บางทีข้าควรทบทวนเรื่องนี้ใหม่ จริงๆ แล้ว"

 bp2_yearly.5013.t: "ดับมอด"
 bp2_yearly.5013.desc: "ใบหน้าของ [marry_crush.GetFirstNamePossessive] ไม่สามารถอ่านได้อยู่ครู่หนึ่ง แต่ในไม่ช้ามันก็เปลี่ยนเป็นความสับสน\n\n\"เจ้าหมายความว่าอย่างไร? เจ้าพูดจริงหรือ?\" [marry_crush.GetSheHe|U] ขมวดคิ้วของ [marry_crush.GetHerHis] \"ทำไมเจ้าถึงพูดถึงคำสัญญาเก่าๆ ของเด็กๆ?\"\n\nข้าพยายามเรียบเรียงคำพูด แต่ [marry_crush.GetSheHe] กำลังเดินจากไปแล้ว ส่ายหน้าของ [marry_crush.GetHerHis] อย่างไม่ใส่ใจ"
 bp2_yearly.5013.a: "โอ้..."

 bp2_yearly.5050.t: "ผู้รู้หลายภาษา"
 bp2_yearly.5050.desc: "ขณะที่ข้าเดินข้ามลาน เศษกระดาษหนังชิ้นหนึ่งหมุนคว้างในสายลม ข้าคว้ามันไว้ได้ แต่ลายเส้นประหลาดที่ป้ายอยู่บนนั้นไม่เหมือนอะไรที่ข้าเคยเห็นมาก่อน\n\n"อ๊ะ! ท่านเจอบันทึกของข้าแล้ว!" เสียงของ [polyglot.GetFirstNamePossessive] ทำให้ข้าสะดุ้ง [polyglot.GetSheHe|U] สัมผัสได้ถึงความงุนงงของข้า จึงแตะเศษกระดาษเบาๆ อย่างปลอบโยน\n\n"มันเป็นภาษาอื่น [ROOT.Char.GetLadyLord] น้อยของข้า อย่ากังวลไปเลย! ข้าอ่านออก แต่ท่านไม่จำเป็นต้องใส่ใจกับมันในตอนนี้""
 bp2_yearly.5050.a: ""ข้ารู้มากกว่าหนึ่งภาษาแล้ว! สอนข้าสิ!""
 bp2_yearly.5050.b: "แต่... ข้าอยากรู้!"
 bp2_yearly.5050.c: "อย่างน้อยก็รู้ไว้ก็ดี"

 bp2_yearly.5051.t: "จ๊ะเอ๋!"
 bp2_yearly.5051.desc: "ข้าได้ยินเสียงนั้น ดังก้องไปทั่ว [ROOT.Char.Custom('ResidenceBuilding')] เสียงหัวเราะคิกคักเบาๆ บางครั้งก็ดังลั่นเป็นเสียงหัวเราะเต็มที่ เมื่อข้าเข้าไปใน [ROOT.Char.Custom('GetRoom')] ผู้ก่อเหตุก็ถูกเปิดเผย\n\n[child.GetFirstName] — ซึ่งดูจากหนังสือที่ถูกทิ้งกระจัดกระจายบนโต๊ะแล้ว การเรียนของ [child.GetHerHis] ถูกทอดทิ้งอย่างสิ้นเชิง — กำลังกอด [child.Custom2('RelationToMe', baby)] [baby.GetFirstName] ของ [child.GetHerHis] ไว้ในอ้อมแขน ทารกน้อยส่งเสียงอ้อแอ้อย่างมีความสุขขณะที่ [child.GetFirstNameNoTooltip] แอบมองผ่านนิ้วมือของ [child.GetHerHis] ไปยัง [baby.GetHerHim] ทั้งสองหัวเราะคิกคักอย่างมีความสุข"
 bp2_yearly.5051.a: "เป็นการดีที่พวกเขาใช้เวลาร่วมกัน!"
 bp2_yearly.5051.b: ""[child.GetFirstNameNoTooltip]! อย่าลืมทบทวนบทเรียนของเจ้า!""

 bp2_yearly.5052.t: "เรื่องเก่าเล่าใหม่"
 bp2_yearly.5052.desc: "ฝีเท้าของข้าช้าลงเมื่อเข้าใกล้ [ROOT.Char.Custom('GetRoom')] ข้านึกว่าได้ยินเสียง ใช่แล้ว เสียงนั่นเอง!\n\nข้าเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('grandparent'))] ของข้า [grandparent.GetFirstName] กำลังอุ้มหลานของ [grandparent.GetHerHis] คือ [child.GetFirstName] อย่างสง่างาม ซึ่งกำลังเคลิบเคลิ้มไปกับเรื่องเล่า ข้าแอบฟังด้วย จับใจความได้เพียงบางส่วน\n\n[grandparent.GetFirstNameNoTooltip] กำลังเล่าเรื่องราวบางส่วนจากชีวิตที่ผ่านมาอย่างดี และเรื่องราวของทั้งยุคเก่าและยุคใหม่ก็ดูจะโดนใจ [child.GetFirstNameNoTooltip] อย่างยิ่ง ซึ่งอ้าปากค้างอย่างตื่นเต้น"
 bp2_yearly.5052.a: ""แล้วตอนที่ #EMP ข้า#! ทำอย่างนั้นล่ะ หืม?""
 bp2_yearly.5052.b: ""ขอข้าร่วมวงสนทนาอันครื้นเครงนี้ด้วยได้หรือไม่?""
 bp2_yearly.5052.c: "ช่างน่ารักเสียจริง ปล่อยพวกเขาอยู่กันตามลำพังดีกว่า"

 bp2_yearly.5053.t: "ตัวประกันของหัวใจ"
 bp2_yearly.5053.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))] [ward.GetFirstName] ของข้ายิ้มรับคำหยอกเย้าของข้า พลางโบกมือลาอย่างอาทร ขณะ[ward.GetSheHe]กลับไปทบทวนตำราของ[ward.GetHerHis] พลัน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_kid'))] [angry_kid.GetFirstName] ของข้าก็พุ่งตรงเข้ามาหาข้าด้วยความเดือดดาล\n\n""สารภาพมาเสีย!" [angry_kid.GetSheHe|U] ตะคอกอย่างเกรี้ยวกราด "ท่านน่ะนับวันยิ่งลุ่มหลงเจ้า#EMPคนต่างแดน!#! ท่านผูกพันกับ[ward.GetHerHim]ยิ่งกว่า#EMPข้า#!ผู้เป็นเลือดเนื้อเชื้อไขของท่านแท้ๆ เสียอีก!"\n\n"เห็นได้ชัดว่า ความรู้สึกที่ข้ามีมากขึ้นทุกวันถึง#EMPการเป็นส่วนหนึ่ง#!ของ[ward.GetFirstNameNoTooltip] ณ ที่แห่งนี้อย่างแท้จริงนั้น ดูทีว่าผู้อื่นหาได้รู้สึก เช่นนั้นด้วยไม่..."
 bp2_yearly.5053.a: ""เจ้ารู้ว่าข้าไม่มีวันแทนที่ครอบครัวของข้าได้, [angry_kid.GetFirstNameNoTooltip]""
 bp2_yearly.5053.b: ""ข้าไม่มีวันรู้สึก เช่นนั้น!""
 bp2_yearly.5053.b.success: "ท่านโน้มน้าวพวกเขาได้สำเร็จ"
 bp2_yearly.5053.b.failure: "พวกเขาไม่เชื่อท่าน"
 bp2_yearly.5053.c: "[ward.GetFirstNameNoTooltip] เป็นเหมือนลูกของข้ามากกว่าที่เจ้าเคยเป็น!"

 bp2_yearly.5054.t: "เพื่อนสนิท"
 bp2_yearly.5054.desc: "เสียงหัวเราะและความสดใสพรั่งพรูเข้ามาในห้องของข้า ประกาศการมาถึงของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] ของข้า [child.GetFirstName] และ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstName] ทั้งสองกำลังวิ่งไล่จับกันอย่างสนุกสนานพร้อมของเล่น\n\nเด็กสองคนจากภูมิหลังที่แตกต่างกันกำลังเล่นกันอย่างไร้เดียงสา ความคล้ายคลึงกันของพวกเขาพิสูจน์ว่ามีมากกว่าความแตกต่าง\n\nบางทีนี่อาจเป็นสิ่งที่ดี?"
 bp2_yearly.5054.a: "เป็นการดีที่เห็นพวกเขาสนิทสนมกัน"
 bp2_yearly.5054.b: ""[child.GetFirstNameNoTooltip]! รอสักครู่ แล้วฟังนะ...""
 bp2_yearly.5054.b.tt: "[child.GetSheHe|U] จะต้องรู้ว่าเจ้าไม่สามารถไว้ใจทุกคนได้ง่ายๆ"

 bp2_yearly.5100.t: "ผู้ท้าชิงปรากฏตัว"
 bp2_yearly.5100.desc: "#EMP ฟุ่บ-แคร็ก!#! เสียงดาบไม้แหวกอากาศและกระทบเป้าหมายช่างน่าตื่นเต้นสำหรับข้า ข้าเตรียมพร้อมที่จะเหวี่ยงอีกครั้ง แต่ข้าไปสะดุดตาอีกคนเข้า [challenger.GetFirstName] วิ่งลงบันไดเสียงดังเกรียวกราว ชูดาบของ [challenger.GetHerHis] เอง\n\n"[ROOT.Char.GetFirstNameNoTooltip]! มาดูกันว่าเจ้าจะสู้กับ #EMP ข้า#! ได้อย่างไร!"\n\nข้ามอง [challenger.GetFirstNameNoTooltip] ขึ้นลงอย่างระแวดระวัง 'ดาบ' เหล่านี้อาจสร้างความเสียหายได้พอสมควรหากแทงใครสักคนด้วยมัน และ [challenger.GetFirstNameNoTooltip] ก็ดู... #EMP กระตือรือร้น#! เกินไปหน่อยสำหรับความชอบของข้า"
 bp2_yearly.5100.a: "เอาล่ะ ตั้งท่าซะ!"
 bp2_yearly.5100.a.tt: "เริ่มการดวลกับ [challenger.GetFirstNameNoTooltip]"
 bp2_yearly.5100.b: "ทำไมเราไม่จำลองการรบแทนล่ะ?"
 bp2_yearly.5100.b.tt: "ด้วยการเน้นไปที่การเคลื่อนไหว เราจะรักษาหัวของเราจากการถูกทุบตีได้อย่างแน่นอน..."

 bp2_yearly.5101.t: "ม้าก้านกล้วย"
 bp2_yearly.5101.desc: "ประตูเปิดกระแทกขณะที่ข้าควบม้าตาม [child.GetFirstName] เราสองคนคร่อมม้าก้านกล้วยและหัวเราะอย่างตื่นเต้นขณะวิ่งวุ่นไปทั่วห้องหนังสือ [councillor.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] ของข้า เงยหน้าขึ้นอย่างเหนื่อยอ่อนจากกองม้วนกระดาษที่ [councillor.GetSheHe] กำลังพิจารณาอยู่\n\n"เจ้าต้องทำเสียงดังน่ารำคาญ เช่นนี้ในนี้ด้วยหรือ?" [councillor.GetSheHe|U] ร้อง ชี้มาที่พวกเราสองคน "#EMP ใครบางคน#! ต้องช่วยบริหารอาณาจักรนี้ [ROOT.Char.GetLadyLord] ของข้า และข้าอยากจะซาบซึ้งในความสงบเพื่อทำมัน!"\n\nข้ามองกลับไปที่ [child.GetFirstNameNoTooltip] ซึ่งยังคงกระโดดโลดเต้นอย่างตื่นเต้น"
 bp2_yearly.5101.a: "เจ้า #EMP กล้าดี#! อย่างไรมาสั่งข้า?!"
 bp2_yearly.5101.b: "ข้าจะแข่งกับเจ้าข้างนอก, [child.GetFirstNameNoTooltip]!"
 bp2_yearly.5101.b.tt: "ไม่มีใครสังเกตเห็นว่าข้าทำ เช่นนี้เพียงเพื่อพาเราออกจากห้อง..."
 bp2_yearly.5101.b.success: "ท่านชนะการแข่งขัน"
 bp2_yearly.5101.b.failure: "ท่านแพ้การแข่งขัน"
 bp2_yearly.5101.c: ""ขออภัย, [councillor.GetFirstNameNoTooltip] พวกเราจะหยุด""

 bp2_yearly.5102.t: "ผลกรรมทันตา"
 bp2_yearly.5102.desc: "ถึงตา [sibling.GetFirstNamePossessive] ไล่ข้าขณะที่เราเล่นกันในลาน ใจข้าเต้นแรงขณะข้าวิ่งซิกแซ็กระหว่างแปลงดอกไม้\n\n[sibling.GetFirstNameNoTooltip] เสียหลัก [sibling.GetHerHis] ตีลังกา และโดยไม่คิดสักครู่ ข้าก็ผลัก [sibling.GetHerHim] ฉวยโอกาส [sibling.GetFirstNameNoTooltip] ล้มคะมำ... ตรงเข้าไปในพุ่มกุหลาบมีหนาม!\n\nเสียงสะอื้นไห้ทันทีที่ดังขึ้นนั้นคาดเดาได้พอๆ กับเสียงดัง [sibling.GetSheHe|U] โซซัดโซเซลุกขึ้นยืน เริ่มวิ่งเหยาะๆ จากไปในทิศทางของ — ข้าสังเกตด้วยความสยดสยอง — ห้องของ [parent.GetMotherFather] ของเรา"
 bp2_yearly.5102.a: "ได้โปรดหยุด! ข้าจะ... ข้าจะซื้อของเล่นให้เจ้า!"
 bp2_yearly.5102.a.tt: "[sibling.GetFirstNameNoTooltip] ได้รับ [newly_created_artifact.GetName]"
 bp2_yearly.5102.b: "ไม่นะ ไม่ อย่าบอก [parent.GetMotherFather]!"
 bp2_yearly.5102.b.success: "ท่านพูดเกลี้ยกล่อม [sibling.GetFirstNameNoTooltip] ได้สำเร็จ"
 bp2_yearly.5102.b.failure: "[sibling.GetFirstNameNoTooltip] ไม่ยอมเปลี่ยนใจ"
 bp2_yearly.5102.c: ""โอ้ เลิกคร่ำครวญเสียที เจ้าเด็กขี้แยขี้มูกโป่ง!""

 bp2_yearly.5103.t: "ลักลอบขนมหวาน"
 bp2_yearly.5103.desc: "ขณะที่ข้าเดินผ่าน ข้าได้กลิ่นหอมเย้ายวนลอยมาจากห้องครัว ท้องที่ร้องครวญครางกระตุ้นให้ข้าไปที่ประตู และการแอบมองอย่างระมัดระวังก็เผยให้เห็นสิ่งที่ข้าหวังไว้พอดี\n\n[ROOT.Char.Custom('FavoriteTreatDemand')|U]! ถูกทิ้งไว้โดยไม่มีใครดูแล! หรือ #EMP ดูเหมือนว่า#! อย่างน้อยก็ เช่นนั้น การชำเลืองมองอย่างระแวดระวังอีกครั้งรอบห้องไม่พบสิ่งใดชัดเจน ข้าแค่ต้องรีบหนีไปและ—\n\n"[ROOT.Char.GetFirstNameNoTooltip]!" ข้าหยุดนิ่ง มือยื่นออกไป ห่างจากความสุขสุดยอดเพียงปลายนิ้ว "เจ้าคิดว่ากำลังทำอะไรอยู่?" เสียงของ [ROOT.Char.Custom2('RelationToMeShort', parent)] ของข้า [parent.GetFirstNamePossessive] เข้มงวดพอๆ กับที่ ทำให้ใจสลาย"
 bp2_yearly.5103.a: ""ท่านหยุดข้าไม่ได้! อีกไม่นานข้าจะได้ #EMP ปกครอง#!""
 bp2_yearly.5103.b: "ได้เวลาหนีแล้ว!"
 bp2_yearly.5103.b.success: "ท่านหนีรอดไปได้พร้อมขนมในมือ"
 bp2_yearly.5103.b.failure: "[child.Custom2('RelationToMeShort', parent)] ของท่านจับและตีท่าน"
 bp2_yearly.5103.c: ""ข้าขออภัย ข้าจะไม่ทำอีก""

 bp2_yearly.5104.t: "เด็กผู้โดดเดี่ยว"
 bp2_yearly.5104.desc: "ข้าวิ่งเข้าไปในลาน ของเล่นอยู่ในมือ เพียงเพื่อพบ [child.GetFirstName] นั่งซึมอยู่บนม้านั่ง [child.GetSheHe|U] แทบไม่สังเกตเห็นข้า ถอนหายใจกับความพยายามของข้าที่จะปลอบโยน [child.GetHerHim] ของเล่นของข้าไม่ถูกแตะต้อง ทำให้ข้าเกาหัว\n\nข้าควรทำอย่างไรตอนนี้?"
 bp2_yearly.5104.a: "ข้าจะนั่งตรงนี้และร่วมรับรู้อารมณ์ของพวกเขา"
 bp2_yearly.5104.b: ""มาเถอะ, [child.GetFirstNameNoTooltip], มาเล่นกัน!""
 bp2_yearly.5104.b.success: "ท่านเกลี้ยกล่อม [child.GetFirstNameNoTooltip] ให้มาเล่นได้สำเร็จ และในไม่ช้าพวกเขาก็ร่าเริงขึ้น"
 bp2_yearly.5104.b.failure: "ไม่มีอะไรที่ท่านทำสามารถปลุกเร้า [child.GetFirstNameNoTooltip] ได้"
 bp2_yearly.5104.c: "เอ่อ... ปล่อยพวกเขาไว้ตามลำพังดีที่สุด?"
 bp2_yearly.5104.c.tt: "บางทีข้าอาจเรียนรู้อะไรบางอย่างจากสิ่งนี้..."

 bp2_yearly.5105.t: "เพื่อเกียรติยศและศักดิ์ศรี!"
 bp2_yearly.5105.desc: ""[ROOT.Char.GetFirstNameNoTooltip]!" เสียงแหลมดังขึ้นทั่วลาน "ข้าท้าเจ้าประลองทวนเพื่อปกป้องเกียรติของเจ้า! เลือกม้าของเจ้าและยกทวนของเจ้าขึ้น นักรบผู้ยิ่งใหญ่!"\n\n[child.GetFirstName] ชูกิ่งไม้ หนีบม้าก้านกล้วยไว้ระหว่างขาของ [child.GetHerHis] ม้าของข้าเองถูกวางไว้อย่างเรียบร้อยบนม้านั่งใกล้ๆ ถัดจากกิ่งไม้ขนาดใกล้เคียงกัน\n\nดูเหมือนว่า [child.GetFirstNameNoTooltip] จะเตรียมพร้อมสำหรับการต่อสู้มาอย่างดี!"
 bp2_yearly.5105.a: ""มาเลย, [child.GetLadyLord|U] [child.GetFirstNameNoTooltip]! มาประลองกัน!""
 bp2_yearly.5105.a.tt: "การประลองทวนเริ่มขึ้น!"
 bp2_yearly.5105.a.success: "ท่านทำคะแนนได้สำเร็จ"
 bp2_yearly.5105.a.failure: "[child.GetFirstNameNoTooltip] โจมตีก่อน"
 bp2_yearly.5105.b: "ข้าคิดว่าความรอบคอบเป็นส่วนสำคัญของความกล้าหาญในที่นี้"

 bp2_yearly.5106.t: "การโจมตีครั้งแรก"
 bp2_yearly.5106.desc.winning: "'หอก' ของข้ากระทบหน้าอกของ [child.GetFirstName] ทำให้เกิดรอยแผลเล็กๆ ตามผิวหนัง ข้าหมุนตัวออกไปอย่างมีชัยขณะที่ [child.GetSheHe] ลูบหน้าอกของ [child.GetHerHis] อย่างเจ็บใจ"
 bp2_yearly.5106.desc.losing: "'ทวน' ของ [child.GetFirstNamePossessive] กระแทกเข้ากลางอกข้า ทำให้ข้าเซ [child.GetSheHe|U] หมุนตัวจากไปอย่างผู้มีชัย"
 bp2_yearly.5106.ending: "\n\nการประลองรอบแรกมักคาดเดาไม่ได้ ตอนนี้ มันคือทั้งหมดที่เกี่ยวกับการจดจำการฝึกฝนและคำสอน และข้าพิจารณาความได้เปรียบทางยุทธวิธีใดๆ\n\nลมพัดใบไม้ปลิวไสวขณะที่เราตั้งแถวสำหรับการประลองอีกครั้ง — ซึ่งอาจเป็นจุดเปลี่ยนสำคัญ"
 bp2_yearly.5106.a: "มาดูกันว่ารอบนี้จะเป็นอย่างไร..."
 bp2_yearly.5106.a.tt: "รอบนี้สำคัญ: ไม่ว่าจะเพื่อชนะ หรือเพื่ออยู่ในการแข่งขันต่อไป..."
 bp2_yearly.5106.a.success: "การโจมตีของท่านเข้าเป้า"
 bp2_yearly.5106.a.failure: "ไม้ของ [child.GetFirstNamePossessiveNoTooltip] เล็ดลอดเข้ามา"
 bp2_yearly.5106.b: ""เราหยุดตอนนี้ได้ไหม?""

 bp2_yearly.5107.t: "การโต้กลับ"
 bp2_yearly.5107.desc.winning: "ไม้ของข้าลดลง, ยกขึ้น, พุ่งวาบเข้าไปใต้ [child.GetFirstNamePossessive] และกระแทกเข้าที่ท้องของ [child.GetHerHim] อย่างจัง! ลมหายใจถูกกระแทกออกจาก [child.GetHerHim], [child.GetFirstNameNoTooltip] พยายามยันตัวลุกขึ้น"
 bp2_yearly.5107.desc.losing: "[child.GetFirstName] ไม่ใช่หมูอย่างที่ข้าหวังไว้ แทนที่จะอ่อนแรง ไม้ของ [child.GetHerHis] กระแทกเข้าที่กลางลำตัวข้า ข้างอตัวลง พยายามซ่อนความรำคาญขณะที่ [child.GetFirstNameNoTooltip] ยิ้มกว้าง"
 bp2_yearly.5107.ending: "ตอนนี้เราทั้งคู่มีร่องรอยแห่งการต่อสู้ประดับอยู่ทั่วร่างกาย\n\nการประลองรอบแรก ทำให้สงบลง รอบที่สองใช้กลยุทธ์ แต่รอบที่สาม... รอบที่สามคือทั้งหมดที่เกี่ยวกับการอ่านคู่ต่อสู้ นำความรู้ทั้งหมดที่ได้รับมาใช้ โจมตีจุดอ่อน\n\nข้าพร้อมแล้ว"
 bp2_yearly.5107.a: "เพื่อชัยชนะ!"
 bp2_yearly.5107.a.success: "ท่านโจมตีเข้าเป้า และชนะการประลอง"
 bp2_yearly.5107.a.failure: "[child.GetFirstNameNoTooltip] เร็วเกินไป"
 bp2_yearly.5107.b: ""เอ่อ เราต่างก็ชนะกันคนละครั้ง ทำไมไม่ถือว่าเสมอกันล่ะ?""
 bp2_yearly.5107.b.tt: ""การประลองที่สูสีจริงๆ""
 bp2_yearly.5107.b.tt_success: "ท่านอาจชนะการประลองครั้งต่อไป"
 bp2_yearly.5107.b.tt_fail: "มันเป็นแค่เกม"
 bp2_yearly.5107.b_tt_fail: "ท่านไม่ได้เรียนรู้อะไรจากมัน"

 bp2_yearly.5108.t: "การประลองอันยอดเยี่ยม!"
 bp2_yearly.5108.desc.winning: "ข้าเกือบจะหลับตาลง ณ จุดปะทะ แต่การโจมตีของข้าก็ยังคงเข้าเป้าอีกครั้ง ไม้ของข้ากระแทกเข้าที่กระดูกอกของ [child.GetFirstNamePossessive] แตกกระจายเป็นเสี่ยงๆ อย่างน่าตื่นตา\n\nมันกระแทก [child.GetHerHim] ล้มลงทั้งตัว และข้าพบว่าตัวเองยืนคร่อมร่างที่นอนคว่ำของ [child.GetHerHis] อยู่ครู่หนึ่งก่อนที่ [child.GetFirstNameNoTooltip] จะพยายามลุกขึ้นยืน\n\nชัยชนะเป็นของข้า และมันช่างหอมหวาน #EMP หอมหวาน#! อย่างแท้จริง"
 bp2_yearly.5108.desc.losing: "ไม้ของ [child.GetFirstNamePossessive] สั่นไหวอยู่ครู่หนึ่ง แต่มันไม่ใช่การสั่นคลอน แต่เป็นการหลอกล่อ มันพุ่งกระแทกลำตัวข้าอย่างแรง กระแทกลมออกจากปอดข้า และข้าทรุดลงกับพื้น\n\n[child.GetFirstNameNoTooltip] ถอยหลังขณะที่ข้ายันตัวเองกลับขึ้นมายืน แต่ความเจ็บปวดจากความพ่ายแพ้เจ็บยิ่งกว่ารอยถลอกและฟกช้ำ"
 bp2_yearly.5108.a: ""เจ้าประลองด้วยทักษะอันยอดเยี่ยม, [child.GetFirstNameNoTooltip]""
 bp2_yearly.5108.b: ""ฮ่า! และนั่นคือเหตุผลที่ข้า #EMP เก่งที่สุด!#!""
 bp2_yearly.5108.c: ""เป็นการประลองที่ยอดเยี่ยม, [child.GetFirstNameNoTooltip]!""
 bp2_yearly.5108.d: "ข้าจะจัดการ [child.GetHerHim] สำหรับความฟลุคครั้งนี้..."

 bp2_yearly.5109.t: "ความโศกเศร้าที่ยาวนาน"
 bp2_yearly.5109.desc: "ลานกว้างสะท้อนเสียงสะอื้นเบาๆ [child.GetFirstName] นั่งอยู่บนม้านั่ง น้ำตาไหลอาบใบหน้าของ [child.GetHerHis] [child.GetSheHe|U] พยายามกลั้นน้ำตาขณะที่ข้าเข้าใกล้ ชี้ไปยังพื้นที่ข้างๆ [child.GetHerHim] อย่างเศร้าสร้อย\n\n"
 bp2_yearly.5109.desc_unrelated: ""ข้าแค่คิดถึง [parent.GetMotherFather] ของข้าเหลือเกิน ข้า... ข้าหยุดคิดถึง [parent.GetHerHim] ไม่ได้"\n\nเป็นเวลานานพอสมควรแล้วตั้งแต่ [parent.GetMotherFather] ของ [child.GetFirstNamePossessiveNoTooltip] [parent.GetFirstName] จากไป แต่เห็นได้ชัดว่า [child.GetSheHe] ยังคงรู้สึกถึงการสูญเสีย [parent.GetHerHis] อย่างเจ็บปวด"
 bp2_yearly.5109.desc_sibling: ""ข้าแค่คิดถึง [parent.GetMotherFather] เหลือเกิน ข้า... ข้าหยุดคิดถึง [parent.GetHerHim] ไม่ได้"\n\nเป็นเวลานานพอสมควรแล้วตั้งแต่ [parent.GetMotherFather] ของเรา [parent.GetFirstName] จากไป แต่เห็นได้ชัดว่า [child.GetSheHe] ยังคงรู้สึกถึงการสูญเสีย [parent.GetHerHis] อย่างเจ็บปวด"
 bp2_yearly.5109.a: ""จำไว้ [parent.GetSheHe|U] เฝ้ามองเจ้าอยู่เสมอ""
 bp2_yearly.5109.b: "ลองพยายามเบี่ยงเบนความสนใจของ [child.GetHerHis] ดูก็ได้"
 bp2_yearly.5109.b.success: "ท่านปลอบโยน [child.GetHerHim] ได้สำเร็จ"
 bp2_yearly.5109.b.failure: "[child.GetFirstNameNoTooltip] ไม่สามารถปลอบโยนได้"
 bp2_yearly.5109.c: "ข้า... ไม่แน่ใจว่าจะพูดอะไรดี"
 bp2_yearly.5109.c.tt: "ลองดูซิว่าข้าจะแอบหนีไปได้ไหม..."
