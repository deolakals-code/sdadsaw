bp2_yearly.6010.t: "ไม่มี[sad_boi.GetWomanMan|U]ใดถูกจองจำ"
bp2_yearly.6010.desc: "\"#EMP ข้ามีมิตรสหายมากมาย แต่ของขวัญของพวกเขามีน้อยนิด...!#!" [sad_boi.GetFirstName] ร้องเพลง เสียงของ[sad_boi.GetHerHis]สั่นเครือด้วยความรู้สึก\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sad_boi'))]ของข้าโยนเครื่องดนตรีของ[sad_boi.GetHerHis]ทิ้ง ร้องไห้: "พอแล้วกับ[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]!"
bp2_yearly.6010.adult: "มันปราศจากความสะดวกสบายทั้งปวง"\n\nเหลือบมองข้าอย่างเหยียดหยาม [sad_boi.GetSheHe]กล่าวเสริม: "เพลงนี้จะเป็นคำวิงวอนขอความช่วยเหลือของข้าตลอดการถูกจองจำอันไม่มีความสุขนี้ เงินทุนเล็กน้อย... หากผู้คนของข้ายังคงใส่ใจข้าอยู่...""
bp2_yearly.6010.child: "ข้าไม่มีความสุขเลยที่นี่"\n\nเงยหน้ามองข้าทั้งน้ำตา [sad_boi.Custom('GirlBoy')]กล่าวเสริม: "การได้ยินเพลงนี้จะ ทำให้ครอบครัวของข้าใจอ่อน! พวกเขาจะส่งบางอย่างมา เพื่อให้การ#EMP เนรเทศ#!ของข้าพอทนได้ หาก... พวกเขายังคงใส่ใจข้าอยู่...""
bp2_yearly.6010.outro: "\n\n[sad_boi.GetSheHe|U] บรรเลงท่วงทำนองอันโศกเศร้าขึ้นอีกครา แววตาของ[sad_boi.GetHerHis]ทอดมองไปยังบ้านเกิดอันแสนไกล"
bp2_yearly.6010.a: "ใช่แล้ว มาดู "การกุศล" ที่พวกเขาสามารถรวบรวมได้กันเถอะ..."
bp2_yearly.6010.a.tt: "...สำหรับกระเป๋าเงินของข้า"
bp2_yearly.6010.b: "ไม่มีความสุขรึ?! #EMP ข้าช่วยได้หรือไม่?!#"
bp2_yearly.6010.b.tt: "ราชสำนักของข้าไม่อาจถูกขับขานว่าเป็นสถานที่แห่งความทุกข์ยากได้!"
bp2_yearly.6010.c: "ข้าต้องสอน[sad_boi.GetHerHim]ว่าที่ของ[sad_boi.GetHerHis]อยู่ที่นี่"
bp2_yearly.6010.c.tt: "เราทุกคน ไม่ว่าจะเกิดที่นี่หรือไม่ ต้องอดทนต่อความยากลำบากด้วยศักดิ์ศรีอันเงียบงัน"
bp2_yearly.6010.c.success: "[sad_boi.GetSheHe|U]จะให้โอกาส[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]อีกครั้ง"
bp2_yearly.6010.c.tt_education: "ผลลัพธ์ของการศึกษาของ[sad_boi.GetFirstNamePossessive]จะดีขึ้น"
bp2_yearly.6010.c.failure: "การปฏิเสธความจริงในเนื้อเพลงของ[sad_boi.GetHerHis] ทำให้[sad_boi.GetFirstNameNoTooltip]ไม่พอใจ"
bp2_yearly.6010.d: "อันที่จริง เป็นบทประพันธ์ที่ไพเราะยิ่ง"
bp2_yearly.6010.d.tt: "ให้บทเพลงคร่ำครวญนี้ถูกขับขานไปไกลและกว้าง: ความงามของมันสำคัญกว่าเนื้อหา"

bp2_yearly.6020.t: "เด็กๆ พูดอะไรตลกๆ"
bp2_yearly.6020.desc: "ขณะที่ข้าแบ่งปันข่าวล่าสุดจากราชสำนักของ[snitch.GetHomeCourt.GetTitledFirstNamePossessive] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))]ของข้า [snitch.GetName] ดูเหมือนจะขบขันอย่างประหลาด มีรอยยิ้มเหม่อลอย"
bp2_yearly.6020.child: "บนใบหน้าเล็กๆ ของ[snitch.GetHerHis]\n\n"ข้ามีเรื่องเล่า [ROOT.Char.GetTitleAsNameNoTooltip] เรื่องที่ข้า แต่งขึ้นจากสิ่งที่ข้าเห็นเอง! แต่... ไม่ควรพูด ข้าสัญญาว่าจะไม่พูด"\n\n[snitch.GetSheHe|U]หัวเราะคิกคักด้วยความยินดีอย่างซุกซน เพลิดเพลินกับอำนาจที่หาได้ยากเหนือผู้ใหญ่ของ[snitch.GetHerHis]\n\n"ซนจริง!" [snitch.GetFirstNameNoTooltip]ร้องเสียงดัง"
bp2_yearly.6020.youth: "บนใบหน้ามันเยิ้มของวัยรุ่นของ[snitch.GetHerHis]\n\n"ข้ามีเรื่องเล่า [ROOT.Char.GetTitleAsNameNoTooltip]: ท่านเพิ่งเตือนข้าถึงเรื่องนั้น บางสิ่งที่ไม่ควรพูดซ้ำ! แต่... ข้ายังเด็กมาก รู้สึกเหมือนนานมาแล้ว"\n\n[snitch.GetSheHe|U]หัวเราะหึๆ ด้วยความยินดีอย่างชั่วร้าย เพลิดเพลินกับอำนาจที่หาได้ยากนี้เหนือผู้ที่เลี้ยงดู[snitch.GetHerHim]มา\n\n"ซนจริง!" [snitch.GetFirstNameNoTooltip]ร้องเสียงดัง"
bp2_yearly.6020.liege: "\"ศักดิ์สิทธิ์เหลือเกิน ซุกซนเหลือเกิน!\""
bp2_yearly.6020.family: "\"ครอบครัวช่างซุกซนเหลือเกิน!\""

bp2_yearly.6020.a: "พูดต่อสิ..."
bp2_yearly.6020.a.secret: "ท่านเรียนรู้[secret|e]ที่ครอบครัวของ[snitch.GetShortUINamePossessive]เก็บไว้"
bp2_yearly.6020.a.non_family_secret: "ท่านเรียนรู้[secret|e]จากวงในของ[court|E]ของ[no_no_doer.GetShortUINamePossessive]"
bp2_yearly.6020.a.success: "เรื่องเล่าอันสกปรกโสมมที่น่าพึงพอใจ"
bp2_yearly.6020.a.failure: "คงเป็นแค่ความโง่เขลาที่ยังไม่บรรลุนิติภาวะกระมัง..."
bp2_yearly.6020.a.no_secret: "ท่านไม่ได้เรียนรู้อะไรที่เป็นสาระสำคัญ"
bp2_yearly.6020.b: "ลิ้นที่พล่อยนำไปสู่ความเสื่อมเสียชื่อเสียง"
bp2_yearly.6020.b.tt: "[snitch.GetFirstNameNoTooltip]ควรชื่นชอบคุณธรรมของความสุขุมรอบคอบมากกว่าการนินทา"
bp2_yearly.6020.b.discretion: "[snitch.GetShortUIName]มีแนวโน้มน้อยลงมากที่จะเปิดเผย[secrets|E]ของท่าน"

bp2_yearly.6030.t: "สายตาของครอบครัว"
bp2_yearly.6030.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))]ผู้[snitch.Custom('ComplimentAdjective')]ของข้า [snitch.GetFirstName] ทำให้การเดินเล่นในเช้าอันมัวซัวสดใสขึ้น เล่าให้ข้าฟังถึงการเป็นตัวประกันของ[snitch.GetHerHis]ในความดูแลของ[warden.GetNamePossessive]\n\n[snitch.GetSheHe|U]กลับมาเปลี่ยนไปมาก: ฉลาดขึ้น ช่างสังเกตมากขึ้น เป็นชาว[snitch.GetDynastyHouseName]ผู้ภักดี ปรับตัวเข้ากับชีวิตในต่างแดนได้ดี\n\nชาว[snitch.GetDynastyHouseNameNoTooltip]ผู้ภักดี... บางทีอาจมีคุณค่าที่จะดึงมาจากสายตาของครอบครัวเราที่เคยอยู่ในราชสำนักของ[warden.GetTitledFirstNamePossessiveNoTooltip]...?"
bp2_yearly.6030.hostage_reticent: "\n\nอย่างไรก็ตาม [snitch.GetFirstNameNoTooltip] ดูเหมือนจะ #negative_value ไม่เต็มใจอย่างยิ่ง#! ที่จะเป็นผู้ให้ข้อมูลแก่ข้า บางทีนางอาจถูกเตือนไม่ให้ทำ เช่นนั้น"
bp2_yearly.6030.hostage_normal: "\n\nกล่าวคือ — [snitch.GetFirstNameNoTooltip]รู้อะไรบ้าง หากมี?"

bp2_yearly.6030.a: "ข้าสามารถหลอกล่อเอาความลับของ[warden.GetPrimaryTitle.GetNameNoTierNoTooltip]ออกมาได้..."
bp2_yearly.6030.maybe_secret: "#high [snitch.GetFirstName]#! #EMP อาจจะ#! แบ่งปัน[secret|E]จากวงในของ[warden.GetShortUINamePossessive]"
bp2_yearly.6030.a.success: "ท่านเรียนรู้ทุกสิ่งที่[snitch.GetFirstNameNoTooltip]รู้"
bp2_yearly.6030.a.failure: "[snitch.GetFirstNameNoTooltip]หลบเลี่ยงการซักถาม"
bp2_yearly.6030.a.no_secret: "[snitch.GetFirstName]รู้... ไม่มีอะไรที่เป็นสาระสำคัญ"
bp2_yearly.6030.a.evade: "#high [snitch.GetFirstName]#! ไม่ได้แบ่งปันอะไรที่เป็นประโยชน์"

bp2_yearly.6030.b: "สำหรับการรับใช้ครอบครัวของ[snitch.GetHerHis] — รางวัล!"
bp2_yearly.6030.b.tt: "ให้[snitch.GetHerHim]รู้ว่าข้าให้รางวัลแก่สายลับและผู้ให้ข้อมูลดีเพียงใด!"
bp2_yearly.6030.b.failure: "[snitch.GetFirstNameNoTooltip]ไม่ให้[secrets|E]"
bp2_yearly.6030.b.rewarded: "#high [snitch.GetFirstName]#! มีแนวโน้มมากขึ้นที่จะเข้าร่วม[schemes|E]ของท่าน"

bp2_yearly.6030.refuse_reward: "#high [snitch.GetFirstName]#! ไม่ช่วยเหลือและไม่สะทกสะท้าน"


bp2_yearly.6030.c: "หากปราศจากเกียรติยศ การเป็นตัวประกันก็ไร้ค่า"
bp2_yearly.6030.c.tt: "กฎของข้อตกลงนั้นเข้มงวดและไม่อาจละเมิดได้"
bp2_yearly.6030.c.honor: "[rulers|E]มีแนวโน้มมากขึ้นที่จะเสนอและเรียกร้อง[hostages|E]กับท่าน"
bp2_yearly.6030.c.hostage_secrets: "@alert_icon! #alert_trial ท่านจะได้รับ[tyranny|E]เมื่อกดดันเอา[secrets|E]จาก[hostages|E]#!"

honorable_warden_modifier: "ผู้ดูแลผู้ทรงเกียรติ"
honorable_warden_modifier_desc: "ตัวละครนี้ประกาศว่าจะให้ศักดิ์ศรีอันไม่อาจละเมิดได้แก่[hostages|e]"

bp2_yearly.6040.t: "ทุกสิ่งที่เราไม่ใช่"
bp2_yearly.6040.desc: "ข้าเฝ้ามองชาว[ROOT.Char.GetCulture.GetCollectiveNoun]ที่อายุน้อยที่สุดของ[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]กำลังศึกษาเล่าเรียน เรียนรู้ช้า ไร้ระเบียบวินัย พวกเขาทะเลาะกันเหมือนพ่อแม่ของพวกเขา\n\nไม่เหมือนชาว[advanced_culture.GetCollectiveNoun]แห่ง[childhood_location.GetCounty.GetTitle.GetNameNoTier]อันน่าอัศจรรย์เลย อาณาจักรของพวกเขาคือความเป็นระเบียบเรียบร้อย ผลงานอันยิ่งใหญ่ และแนวคิดอันยิ่งใหญ่ ขณะที่ข้า"
bp2_yearly.6040.hostage: "ถูกจับเป็นตัวประกัน"
bp2_yearly.6040.education: "ได้รับการศึกษา"
bp2_yearly.6040.outro: "ที่นั่น ข้าก็รู้แจ้งเห็นจริง\n\nข้ามาเห็นผู้คนของข้าว่าเป็นคนป่าเถื่อนอย่างที่พวกเขาเป็น\n\nข้าสามารถเปลี่ยนแปลงสิ่งนั้นได้ ด้วยความรู้ของชาว[advanced_culture.GetNameNoTooltip]ในวัยเยาว์ของข้า... บางทีข้าควรนำพาเราไปสู่เส้นทางแห่งการปฏิรูปที่ไม่แน่นอน?"

bp2_yearly.6040.a: "รัชสมัยของข้าสามารถเป็นการเกิดใหม่ได้"
bp2_yearly.6040.a.tt: "นำความรู้จากต่างแดนมาแทนที่วิถีของผู้คนของข้า — หรือนำพวกเขาไปสู่ความรุ่งโรจน์ที่ยิ่งใหญ่กว่า"
bp2_yearly.6040.a.reforms: "ท่านพยายามปฏิรูปและพัฒนา[culture|E], [court|E] และ[realm|E]ของท่าน ตามแบบอย่างของชาว[advanced_culture.GetName]"
bp2_yearly.6040.a.warning: "@alert_icon! #alert_trial สิ่งนี้จะท้าทายและมีค่าใช้จ่ายสูง ตรวจสอบให้แน่ใจว่าท่านพร้อมแล้ว#"
bp2_yearly.6040.b: "เหตุใดจึงต้อง#EMP พิจารณา#!ท้าทายประเพณีของเราด้วยซ้ำ?"
bp2_yearly.6040.b.tt: "ข้าโอบรับวิถีอันงดงามของชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ของเราและหันหลังให้กับสิ่งอื่นทั้งหมด!"
bp2_yearly.6040.b.promote_culture: "[councillor_task|E] [promote_culture|E]จะมีประสิทธิภาพมากขึ้นเป็นเวลา #high 25 ปี#!"
bp2_yearly.6040.b.no_reforms: "ท่านจะไม่พิจารณาการปฏิรูปเหล่านี้อีก"
bp2_yearly.6040.c: "ตอนนี้ยังไม่ใช่เวลา"
bp2_yearly.6040.c.recurring: "แรงผลักดันในการปฏิรูปนี้มีแนวโน้มที่จะเกิดขึ้นอีกครั้ง"

devoted_to_tradition_modifier: "ผู้พิทักษ์ประเพณี"
devoted_to_tradition_modifier_desc: "ปฏิเสธความสัมพันธ์กับคนนอก ตัวละครนี้เป็นผู้สนับสนุนผู้คนของตนที่มีชื่อเสียง"
bp2_devoted_to_tradition_modifier_conversion_task_desc: "$devoted_to_tradition_modifier$"

bp2_yearly.6050.t: "หิน เหล็ก ดินเหนียว และกิ่งไม้สาน"
bp2_yearly.6050.desc: "ตามคำสั่งของข้า ถนนที่เพิ่งตัดใหม่สายแรกและด่านหน้าอันเรียบง่ายทอดยาวออกจาก[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] — สร้างขึ้นในรูปแบบของถนน ป้อมปราการ และสำนักงานภาษีอันยิ่งใหญ่ของชาว[advanced_culture.GetName]\n\nถึงกระนั้น เมืองหลวงของข้าก็ไม่ใช่[childhood_location.GetCounty.GetTitle.GetNameNoTier]ที่ส่องประกายระยิบระยับ หรือ[ROOT.Char.GetPrimaryTitle.GetNameNoTier]เป็นดินแดนที่มีประชากรหนาแน่น อุดมไปด้วยการค้าและงานฝีมือ #EMP แต่กระนั้น#! \n\nข้างกายข้า [noble_representative.GetTitledFirstName]มองดูสิ่งก่อสร้างใหม่ๆ ของข้า สถาปนิกต่างชาติของข้าอย่างเคลือบแคลง\n\n"ท่าน ทำให้#EMP พ่อค้า#! และ#EMP สามัญชน#!ร่ำรวยขึ้น" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noble_representative'))]ของข้าเย้ยหยัน "เมื่อขุนนางผู้ภักดีของท่านสามารถสร้างโถงใหม่ๆ จากความเอื้อเฟื้อของท่านได้!""

bp2_yearly.6050.a: "เมืองหลวงใหม่ที่ยิ่งใหญ่ของข้าจะเจริญรุ่งเรือง!"
bp2_yearly.6050.a.tt: "อัญมณีเม็ดใหม่จะส่องประกายท่ามกลางเมืองต่างๆ ของดินแดนที่ตั้งรกรากแล้ว ผู้อยู่อาศัยในนั้นจะเจริญรุ่งเรือง เช่นเดียวกับข้า"
bp2_yearly.6050.b: "พวกเราผู้มีอารยธรรมไม่#EMP ให้#! เราเก็บภาษีและเราสร้าง"
bp2_yearly.6050.b.tt: "การรีดไถเหล่านี้เป็นเรื่องปกติในดินแดนต่างประเทศ — และตอนนี้ก็เป็น เช่นนั้นที่นี่!"
bp2_yearly.6050.every_county_development: "ระดับ[development|E]ในทุก[county|E]ของ[domain|E]ของท่านจะเปลี่ยนไป #positive_value +1#!"
bp2_yearly.6050.county_control_loss: "ระดับ[control|E]จะเปลี่ยนไป #negative_value -30#! ในทุก[county|E]ของ[domain|E]ของท่าน"
bp2_yearly.6050.county_opinion_modifier: "ทุก[county|E]ที่ไม่ใช่ชาว[advanced_culture.GetName]ใน[domain|E]ของท่านจะได้รับ[GetModifier('unprecedented_taxation_modifier').GetNameWithTooltip]"
bp2_yearly.6050.c: "ข้าไม่อาจหันหลังให้ขุนนางของข้าได้!"
bp2_yearly.6050.c.tt: "ข้าจะให้ความสำคัญกับผู้มีอำนาจแห่ง[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]เหนือสิ่งอื่นใดเสมอ"
bp2_yearly.6020.pay_vassals: "ท่านจ่าย[gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#! ให้กับ[powerful_vassals|E]ทั้งหมดของท่าน #EMP และ#! สูญเสีย[gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]" # หมายเหตุ: คีย์ดูเหมือนไม่ถูกต้อง แต่แปลตามที่ให้มา

bp2_yearly.6050.reaffirmation_path: "@alert_icon! #alert_trial สิ่งนี้#EMP อย่างรวดเร็ว#! มีส่วนช่วยในการยืนยันประเพณี[root_scope.GetCulture.GetNameNoTooltip]ของท่านอีกครั้ง#!"
bp2_yearly.6050.reform_path: "@alert_icon! #alert_trial สิ่งนี้มีส่วนช่วยในการปฏิรูป[advanced_culture.GetNameNoTooltip]อย่างกว้างขวางของท่าน#!"

cultural_acceptance_gain_beginning_reforms: "[ruler|E]เริ่มนำเข้าประเพณี[culture_possessive|E]อื่น"
cultural_acceptance_gain_building_familiar_settlements: "[realm|E]ของนักปฏิรูปสร้างขึ้นใหม่ในรูปแบบที่ใช้ร่วมกันในขณะนี้"
cultural_acceptance_turned_away_trade: "ด้วยคำโกหกเกี่ยวกับโครงการใหญ่โต [ruler|E]โกงช่างก่อสร้างและพ่อค้าของ[culture|E]อื่น"

massive_construction_efforts_modifier: "ความพยายามในการก่อสร้างครั้งใหญ่"
massive_construction_efforts_modifier_desc: "ช่างก่อสร้างผู้เชี่ยวชาญถูกนำเข้ามาอย่างแข็งขันเพื่อทำงานในโครงการอันงดงามที่นี่"

great_builder_modifier: "ผู้สร้างผู้ยิ่งใหญ่"
great_builder_modifier_desc: "ผู้อุปถัมภ์การก่อสร้างอันทะเยอทะยาน: ผู้สร้างความทันสมัยและนายจ้างของผู้มีความสามารถชาวต่างชาติ"

unprecedented_taxation_modifier: "การเก็บภาษีอย่างไม่เคยปรากฏมาก่อน"
unprecedented_taxation_modifier_desc: "ภาษีแบบต่างประเทศ รุนแรงเกินกว่าที่เคยจินตนาการไว้ก่อนหน้านี้ เป็นทุนสนับสนุนการพัฒนาท้องถิ่นที่ถูกต่อต้านอย่างมาก"

loyal_realm_nobility_modifier: "เป็นที่รักของขุนนางในอาณาจักร"
loyal_realm_nobility_modifier_desc: "ตัวละครนี้ได้ส่งเสริมความสัมพันธ์อันแรงกล้ากับนักรบขุนนางของผู้คนของตน"

bp2_yearly.6060.t: "การศึกษาในความเป็นนิรันดร์"
bp2_yearly.6060.desc: "พิธีกรรมอันสกปรกของชาว[ROOT.Char.GetCulture.GetName] วิถีแห่ง[ROOT.Char.GetFaith.GetName]ของเรา... เราเป็นเพียงเด็กที่ร้องไห้ในความมืดหรือ?\n\nเมื่อ[clergy_representative.GetFirstName]และ[clergy_representative.GetFaith.PriestNeuterPlural]ผู้ใจแคบของเราวิงวอนขอความโปรดปรานจาก[ROOT.Char.GetFaith.HighGodName] จิตใจของข้าก็ล่องลอยไปในเสียงเสียดสีของอาภรณ์ศักดิ์สิทธิ์ของชาว[advanced_culture.GetName]ที่จดจำได้ ถูกยึดครองโดยความจริงแห่งวาทศิลป์ของพวกเขา ข้าโหยหาหอแห่งการเรียนรู้ของ[childhood_location.GetCounty.GetTitle.GetNameNoTier] เพื่อท่องไปในความลึกลับที่เปิดเผย ณ ที่นั่น\n\n"

bp2_yearly.6060.same_faith: "สำหรับชาว[advanced_culture.GetCollectiveNounNoTooltip] ศรัทธาดำรงอยู่ในความยิ่งใหญ่ เสริมสร้างด้วยการศึกษา มันถูกนำมาจากเบื้องบนสู่เบื้องล่าง และแตกต่างจากความเชื่องมงายของเรา มันยังคงไม่เปลี่ยนแปลง"
bp2_yearly.6060.different_faith: "ดวงวิญญาณทั้งหมดของอาณาจักร หนึ่งในไม่กี่วิหารและผู้รู้หนังสือน้อยลง... พึ่งพาริมฝีปากของข้าเพื่อแบ่งปันความจริงของ[advanced_culture_faith.GetName]หรือไม่?"



#My guardian Kopti ensured I knew that, though we share the same faith, with few temples and fewer lettered folk in our land... wisdom slips, like water, through Karluk fingers.

bp2_yearly.6060.a: "ข้ามีชีวิตอยู่เพื่อสิ่งนี้เท่านั้น ข้าคือ[advanced_culture_faith.GetAdherentNameNoTooltip]"
bp2_yearly.6060.a.tt: "ใครอื่นเล่าจะเชื่อมศรัทธาของเราได้? และศรัทธาใดเล่าจะดีไปกว่าการนำระเบียบทางจิตวิญญาณและการรู้แจ้งมาสู่[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]?"

bp2_yearly.6060.b: "ศรัทธาต้องถูกสร้าง ต้องถูกจัดระเบียบ"
bp2_yearly.6060.b.tt: "เราจะเลียนแบบวิธีการจัดระเบียบศรัทธาต่างแดน วิธีที่พวกเขาสูงส่งเทียมฟ้าและแทรกซึมเข้าไปในทุกแง่มุมของชีวิตประจำวัน"
bp2_yearly.6060.b.conversion_bonus: "ความเร็วความคืบหน้า[convert_county|E]: #P +[EmptyScope.ScriptValue('zealous_proselytizer_percentage')|0]%#!"

bp2_yearly.6060.c: "การเรียนรู้คือบ่อเกิดแห่งความแข็งแกร่งทั้งปวง"
bp2_yearly.6060.c.tt: "และหากข้าเป็นผู้เรียนรู้และฉลาดที่สุดเหนือใคร หากข้าอุทิศตน แต่เพียงผู้เดียว อาณาจักรของข้าจะเจริญรุ่งเรืองอย่างแน่นอน!"
bp2_yearly.6060.c.nerd: "ท่านลดทักษะทั้งหมด ยกเว้น[learning|E]ลง #negative_value 2#!"
bp2_yearly.6060.c.tribal_warning: "@warning_icon! #X ท่านจะสามารถสร้าง $building_type_generic_university$ ได้ก็ต่อเมื่อท่านไม่มี[tribal_government|E]อีกต่อไป#!"
bp2_yearly.6060.d: "และถึงกระนั้นข้าก็รู้สึก... #EMP เรา#! คือผู้ศรัทธาที่แท้จริง!"
bp2_yearly.6060.d.tt: "ไม่มีอะไรโอ้อวด ไม่มีอะไรซับซ้อนเกี่ยวกับความจริงของเรา นี่คือความชอบธรรม"

fervor_gain_reformer_converts: "นักปฏิรูปผู้มีชื่อเสียงเปลี่ยนศาสนา"
fervor_gain_reformer_champions_faith: "ผู้ปกครองกำลังฟื้นฟู[faith|E]นี้"
fervor_loss_reformer_rejects_faith: "การประณามของแชมป์เปี้ยนผู้มีชื่อเสียงของ[faithpossessive|E]อื่น"

adapted_rituals_modifier: "พิธีกรรมต่างแดนที่ปรับใช้"
adapted_rituals_modifier_desc: "เมื่อวิหารแบบต่างประเทศถูกสร้างขึ้น พิธีกรรมแบบต่างประเทศถูกนำมาใช้ ผู้คนต่างพูดว่าไม่มีอะไรศักดิ์สิทธิ์สำหรับบุคคลนี้... หรือทุกสิ่งศักดิ์สิทธิ์?"

court_of_scholars_modifier: "ราชสำนักแห่งปราชญ์"
court_of_scholars_modifier_desc: "ผู้อุปถัมภ์ปัญญาชนและคนเพี้ยน ตัวละครนี้ปกครองผู้คนที่เปลี่ยนแปลงอย่างรวดเร็ว"

bp2_yearly.6070.t: "ที่ ซึ่งโลกทั้งใบจับจ้อง"
bp2_yearly.6070.desc: "\"ข้ารับใช้[advanced_court_owner.GetTitledFirstName]มานานแล้ว [advanced_culture.GetName]ผู้ยิ่งใหญ่ที่สุดที่ยังมีชีวิตอยู่" [foreign_official.GetName] อ้างตัวว่าเป็นข้าราชการของ[advanced_court_owner.GetPrimaryTitle.GetNameNoTier]\n\n"บทกวีแห่งอำนาจของ[advanced_court_owner.GetHerHis] แฟชั่นที่ ทำให้โลกตื่นตาตื่นใจ การเต้นรำในราชสำนัก เครื่องราชอิสริยาภรณ์ และอื่นๆ ทั้งหมด — ท่านปรารถนาที่จะมีส่วนร่วมในวัฒนธรรมสูงสุดหรือไม่ [ROOT.Char.GetTitleAsNameNoTooltip]? ข้าสามารถช่วยท่านได้ ข้ารู้ว่าทรัพย์สมบัติ#EMP อันหาที่เปรียบมิได้#! ถูกซ่อนไว้ที่ใด"\n\nความทะเยอทะยานในการปฏิรูปของข้าดึงดูดสิ่งมีชีวิตที่ไร้ศีลธรรมเหล่านี้ ผู้ที่มีความทะเยอทะยานคล้ายกัน: พวกเขามองความสนใจในการเปลี่ยนแปลงของข้า... ด้วยการฉวยโอกาสอย่างตะกละตะกลาม"

bp2_yearly.6070.a: "ข้าอยากเรียนรู้วิธีที่[advanced_court_owner.GetTitleAsNameNoTooltip]ปกครองมากกว่า"
bp2_yearly.6070.a.tt: "ข้าไม่สนใจวิธีการสร้างความยิ่งใหญ่ แต่สนใจวิธีการสร้างอารยธรรม"
bp2_yearly.6070.b: "นำมารยาทอันศิวิไลซ์ เครื่อง แต่งกายอันงดงามมาให้เรา"
bp2_yearly.6070.b.tt: "สำหรับอาภรณ์ของชาว[advanced_culture.GetNameNoTooltip]ที่ดีที่สุด — ราคาสูงที่สุด! ไม่ว่า... ที่มาของมันจะเป็นอย่างไร..."
bp2_yearly.6070.artifact_warning: "@warning_icon! #X [advanced_court_owner.GetTitledFirstName]อาจต้องการสิ่งเหล่านี้คืน#!"
bp2_yearly.6070.change_clothes: "ราษฎรบางส่วนของท่านจะ แต่งกายเหมือนชาว[advanced_culture.GetCollectiveNoun]ตราบเท่าที่ท่านปกครอง"
bp2_yearly.6070.change_clothes_heir: "ราษฎรบางส่วนของท่านจะ แต่งกายเหมือนชาว[advanced_culture.GetCollectiveNoun] ตราบเท่าที่ท่านหรือ[primary_heir|E]ปัจจุบันของท่านปกครอง"
bp2_yearly.6070.c: "ภาษาแห่งอำนาจเป็นสิ่งสำคัญที่สุดในบรรดาเครื่องประดับ"
bp2_yearly.6070.c.tt: "หากข้าเชี่ยวชาญภาษา[advanced_culture.GetLanguage.GetNameNoTooltip]อย่างแท้จริง ข้าก็จะเป็นผู้เท่าเทียมโดยไม่จำเป็นต้องมีเครื่องประดับหรูหรา"
bp2_yearly.6070.court_language_discount: "ท่านจ่าย[prestige|E]น้อยลงอย่างมหาศาลเมื่อเปลี่ยน[court_language|E]"
bp2_yearly.6070.d: "เจ้า ชาว[advanced_culture.GetNameNoTooltip] เป็นแมลงที่น่ารังเกียจ!"
bp2_yearly.6070.d.tt: "ข้า#EMP ถูก#!มองว่าเป็นญาติกับหนอนตัวนี้หรือ? การ ทำให้[foreign_official.GetHerHim]เป็นเยี่ยงอย่างน่าจะเปลี่ยนสิ่งนั้นได้!"

artifact_admired_culture_regalia: "เครื่องราชกกุธภัณฑ์[advanced_court_owner.GetPrimaryTitle.GetAdjectiveNoTooltip]อันหรูหรา"
artifact_famed_culture_regalia_desc: "เครื่องประดับหรูหราของชาว[advanced_culture.GetName]ที่ "นำเข้า" มาอย่างหรูหรา คุณภาพที่[advanced_court_owner.GetTitleAsNameNoTooltip]ของพวกเขาอาจสั่งทำจากช่างฝีมือที่ซับซ้อนที่สุดของ[advanced_court_owner.GetHerHis]"

artifact_admired_culture_crown: "มงกุฎของ[root_scope.GetFirstNameNoTooltip]"
artifact_famed_culture_crown_desc: "มงกุฎทองคำอันสง่างามสไตล์[advanced_culture.GetName] ซึ่งไม่เคยเห็นมาก่อนในดินแดน[root_scope.GetCulture.GetName] มงกุฎทองคำที่มีที่มาเป็นที่ถกเถียงนี้เดินทางไกลมาเพื่อประทับอยู่บนศีรษะของ[root_scope.GetTitleAsNameNoTooltip]ผู้มีวิสัยทัศน์"

artifact_advanced_culture_treatise: "ตำราภาษา[advanced_culture.GetLanguage.GetNameNoTooltip]ฉบับ[root_scope.GetPrimaryTitle.GetAdjectiveNoTooltip]"

bp2_yearly.6080.t: "เลือด[ROOT.Char.GetCulture.GetNameNoTooltip]"
bp2_yearly.6080.desc: "กองทหารรับจ้างชาว[advanced_culture.GetName]จำนวนมาก ภายใต้การนำของผู้นำที่ช่ำชองสองคน พยายามที่จะรับใช้เป็นทหารรักษาพระองค์และฝึกกองกำลังของข้า พวกเขารออยู่หน้าประตูเมือง ภายใน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_vassal'))]ของข้า [angry_vassal.GetTitledFirstName] คำรามใส่ข้า\n\n"#EMP [ROOT.Char.GetTitleAsNameNoTooltip]คนทรยศ สุนัขรับใช้ของชาว[advanced_culture.GetCollectiveNounNoTooltip]!#! ท่านปรารถนาที่จะเป็นทรราชที่ไม่เหมือนชาว[ROOT.Char.GetCulture.GetName]ที่แท้จริงคนใด ใช้กฎหมายต่างด้าวและอำนาจต่างชาติหรือ? ท่านถือว่าประเพณีของเราถูกริบไปแล้วหรือ?!"\n\n"ถ้า เช่นนั้น คำสาบานความภักดีของเราก็ต้องถูกทอดทิ้งไปด้วย!" [angry_vassal.GetSheHe]กล่าว โดยมีทหารคุ้มกันติดอาวุธของ[angry_vassal.GetHerHis]ขนาบข้าง "พวกเราข้าหลวงเห็นพ้องกันว่า: หากชาว[advanced_culture.GetCollectiveNounNoTooltip]ไม่ไป พันธะของเราที่มีต่อท่านก็ไร้ค่า!""

bp2_yearly.6080.a: "ข้าสามารถตั้งถิ่นฐานให้พวกเขาเป็นผู้อพยพที่รักสงบได้หรือไม่?"
bp2_yearly.6080.a.tt: "ขุนนางของข้าคงจะถูกโน้มน้าวให้ไม่ใส่ใจได้แน่ หากมีเพียงสามัญชนเท่านั้นที่ถูกแทนที่..."
bp2_yearly.6080.pop_opinion_modifier: "ทุก[county|E]ที่ไม่ใช่ชาว[advanced_culture.GetName]ใน[duchy|E]เดียวกันจะได้รับ #N [GetModifier('forcible_resettlement_modifier').GetNameWithTooltip]#!"
bp2_yearly.6080.b: "ผู้นำกบฏ! #EMP จับ[angry_vassal.GetHerHim]!#!"
bp2_yearly.6080.b.tt: "มาดูกันว่าพวกที่รักประเพณีคนอื่นๆ จะพยายามรวมตัวกันอย่างไรเมื่อไม่มีเขา!"
bp2_yearly.6080.b.success: "ผู้เห็นต่างถูกจับกุม"
bp2_yearly.6080.b.failure: "[angry_vassal.GetFirstNameNoTooltip] ต่อสู้หาทางออกของ [angry_vassal.GetHerHis]"
bp2_yearly.6080.add_both_courtiers: "[foreign_mercenary_1.GetName] และ [foreign_mercenary_2.GetName] เข้าร่วมราชสำนักของท่าน"
bp2_yearly.6080.c: "พันธะเก่าทั้งหมดถือเป็นโมฆะ: ข้าจะไม่ถูกหยุดยั้ง"
bp2_yearly.6080.c.tt: "ผู้คนของเรากำลังเกิดใหม่ ภาระผูกพันดั้งเดิม หนี้สินเก่า ไม่สำคัญอีกต่อไป มีเพียงการปฏิรูปของข้าให้เสร็จสิ้นเท่านั้นที่สำคัญ"
bp2_yearly.6080.hook_removal_vassals: "[vassals|E]สูญเสีย[hooks|E]ทั้งหมดที่พวกเขามีต่อท่าน"
bp2_yearly.6080.hook_removal: "@warning_icon! #X ท่านสูญเสีย[hooks|E]ทั้งหมดที่ท่านมีต่อ[vassals|E]#!"
bp2_yearly.6080.truce_removal: "@warning_icon! #X [truces|E]ทั้งหมดระหว่างท่านและ[vassals|E]ของท่านถูกยกเลิก#!"
bp2_yearly.6080.d: "เลือดของผู้คนของข้าจะต้องไม่หลั่งไหล"
bp2_yearly.6080.d.tt: "ผู้คนของเรา เหตุผลร่วมกันของเรา ควรขับเคลื่อนเราและรวมเราเป็นหนึ่ง: เราควรให้คำมั่นสัญญาต่อกันและกัน"

elite_foreign_guard_modifier: "ค่ายทหารองครักษ์ชั้นยอด"
elite_foreign_guard_modifier_desc: "นักสู้ที่มีระเบียบวินัยสูง ส่วนใหญ่มาจากดินแดนและผู้คนอื่น ๆ มีกองบัญชาการอยู่ที่นี่ พวกเขาฝึกฝนทักษะการต่อสู้และรอคอยการเรียกของเจ้าเหนือหัว"

custom.every_non_advanced_culture_vassal: "ทุก[vassal|E]ที่ไม่ใช่ชาว[advanced_culture.GetName]"
custom.every_non_advanced_culture_unhooked_no_truce_vassal: "ทุก[vassal|E]ที่ไม่ใช่ชาว[advanced_culture.GetName]ที่ท่านไม่มี[truce|E]ด้วยหรือ[hook|E]ต่อ"

forcible_resettlement_modifier: "การบังคับตั้งถิ่นฐานใหม่"
forcible_resettlement_modifier_desc: "ผู้อพยพที่ถูกแทนที่โดยผู้ตั้งถิ่นฐานที่นำเข้ามา ซึ่งมีวัฒนธรรมที่ก้าวหน้ากว่า ก่อให้เกิดความไม่พอใจอย่างรุนแรงที่นี่"

common_noble_cause_modifier: "เหตุผลร่วมกันของขุนนาง"
common_noble_cause_modifier_desc: "ตัวละครนี้สร้างแรงบันดาลใจให้สมาชิกวัฒนธรรมเดียวกันด้วยการย้ำถึงจุดประสงค์ร่วมกัน"

cultural_acceptance_learning_from_culture: "[innovation|E]ถูกส่งต่อระหว่าง[cultures|E]เหล่านี้"

bp2_yearly.6090.t: "สิทธิโดยกำเนิด ได้รับการฟื้นฟู"
bp2_yearly.6090.desc: "ข้าได้ไล่ตามการยอมรับของชาว[advanced_culture.GetName] ปรารถนาเครื่องประดับหรูหราต่างแดน ทำให้ตัวเองเป็นคนโง่เพื่อความฝันของข้า ไม่ใช่อีกต่อไป\n\n"
bp2_yearly.6090.burn_letters: "ของขวัญต่างๆ ที่ส่งมาจาก[advanced_court_owner.GetTitledFirstName]ถูกเผา ในขณะที่ขุนนางชาว[ROOT.Char.GetCulture.GetName]ของข้าเคารพชื่อของข้า\n\n"
bp2_yearly.6090.burn_else: "เครื่องประดับส่วนใหญ่ของชาว[advanced_culture.GetNameNoTooltip]ของข้าถูกเผา ในขณะที่ขุนนางชาว[ROOT.Char.GetCulture.GetName]ของข้าเคารพชื่อของข้า\n\n"

bp2_yearly.6090.reaffirm_social: "ขณะที่ชาว[advanced_culture.GetCollectiveNounNoTooltip]ผู้กระหายอำนาจใช้ประโยชน์จากความโลภของข้า ข้าหลวงของข้าก็กระตุ้นให้ระมัดระวัง"
bp2_yearly.6090.reaffirm_realm: "ขณะที่ข้าฉีกทำลายดินแดนของเรา พวกเขาก็สร้างโถงที่สวยงามและติดอาวุธให้$knight_culture_player_plural_no_tooltip_lowercase$ชั้นดี"
bp2_yearly.6090.reaffirm_ritual: "แม้ขณะที่ข้าดูหมิ่นความเชื่อโบราณของพวกเขา ข้าก็ยังคงอยู่ในการสวดภาวนาของพวกเขา"
bp2_yearly.6090.reaffirm_maa: "พวกเขายอมเสี่ยงเกียรติยศ ชีวิต เพื่อป้องกันไม่ให้ข้ามอบ[ROOT.Char.GetPrimaryTitle.GetNameNoTier]ให้คนนอก"
bp2_yearly.6090.outro: "\n\nวัยเยาว์ของข้าใน[childhood_location.GetCounty.GetTitle.GetNameNoTier]นำข้าไปในทางที่ผิด ชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]คือผู้คนของข้า และพวกเขาไม่ต้องการ 'การ ทำให้มีอารยธรรม'"

bp2_yearly.6090.a.bow: "โลกทั้งใบควรโค้งคำนับต่อหน้าเรา"
bp2_yearly.6090.a.strength: "โลกทั้งใบควรสัมผัสถึงความแข็งแกร่งของเรา"
bp2_yearly.6090.a.governed: "โลกทั้งใบควรรับฟังปัญญาของเรา"
bp2_yearly.6090.a.zeal: "โลกทั้งใบควรรู้ถึงความกระตือรือร้นของเรา"
bp2_yearly.6090.a.kin: "โลกทั้งใบควรตอบสนองต่อญาติพี่น้องของเรา"
bp2_yearly.6090.a.virtue: "โลกทั้งใบควรประหลาดใจในคุณธรรมของเรา"
bp2_yearly.6090.a.tt: "ให้เราจุดประกายสายสัมพันธ์โบราณของเราอีกครั้ง — ในกองไฟที่จะเผาผลาญทุกคนที่สงสัยในชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
bp2_yearly.6090.tribal_invasion: "ท่านสามารถใช้[casus_belli|E]การบุกรุกได้อีกครั้ง"
bp2_yearly.6090.non_tribal_invasion: "ท่านสามารถใช้[casus_belli|E]การบุกรุกได้ครั้งเดียว"
bp2_yearly.6090.no_invasion_req: "[casus_belli|E]การบุกรุกของท่านไม่มีข้อกำหนด[prestige_level|E]"
bp2_yearly.6090.b: "เราต้องปกป้องดินแดนของเรา ครอบครัวของเรา ตลอดไป"
bp2_yearly.6090.b.tt: "หัวใจข้าแตกสลายเมื่อคิดถึงการสูญเสียทุกสิ่งที่เรามี ให้เรายืนหยัดอย่างแน่วแน่ ยืนหยัดอย่างอุทิศตน: สิ่งนี้จะไม่มีวันเกิดขึ้นได้"
bp2_yearly.6090.traditionalist_traditions: "ท่านจะได้รับส่วนลดสำหรับ[traditions|E]ที่เกี่ยวข้อง"

a_cultures_great_defender_modifier: "ผู้พิทักษ์ผู้ยิ่งใหญ่ของประชาชน"
a_cultures_great_defender_modifier_desc: "เอาชนะความสงสัยมากมาย ตัวละครนี้กลายเป็นวีรบุรุษผู้มีชื่อเสียงสำหรับผู้คนของตนและเป็นผู้ศรัทธาต่อบ้านเกิดเมืองนอน"

inspired_defenders_modifier: "ได้รับแรงบันดาลใจในการเป็นทาส ได้รับแรงบันดาลใจในการต่อต้าน"
inspired_defenders_modifier_desc: "ผู้อยู่อาศัยในดินแดนนี้ปกป้องสิ่งที่ตนมีอย่างดุเดือดและกระตือรือร้นในการป้องกันเจ้าเหนือหัวของตน"

uniter_and_conqueror_modifier: "ผู้รวมชาติและผู้พิชิต"
uniter_and_conqueror_modifier_desc: "ผู้นำผู้มีวิสัยทัศน์นี้ทดสอบความกล้าหาญของผู้คนของตน จนกระทั่งความยิ่งใหญ่แห่งโชคชะตาร่วมกันของพวกเขาปรากฏชัดแก่ทุกคน"

cultural_acceptance_loss_rejected_influence: "นักปฏิรูปปฏิเสธอิทธิพลของวัฒนธรรมอื่นและเลือกที่จะโดดเดี่ยว"

bp2_yearly.6091.t: "ประชาชนผู้ไม่เปลี่ยนแปลง"
bp2_yearly.6091: "ท่ามกลางข้าราชบริพารในโถงอันงดงามของข้าและกลุ่มชนชาวบ้าน การปฏิรูปที่ไม่ประสบผลสำเร็จของข้าได้ส่งผลกระทบอย่างชัดเจน\n\nความวุ่นวายได้ ทำให้หัวใจของชาว[ROOT.Char.GetCulture.GetName]ทุกคนแข็งกระด้างต่อคนนอก ความสงสัยและความเป็นปรปักษ์ครอบงำ แต่ก็ เช่นเดียวกับการปฏิบัติตามประเพณีเก่าแก่ของเราด้วยความรัก เทศกาลที่สนุกสนาน และจิตวิญญาณการต่อสู้ที่น่าภาคภูมิใจ\n\nที่ปรึกษาของข้าบอกความหวังของประชาชน: ว่าผู้นำ เช่นข้าจะมองไปที่ประเพณี ศรัทธา"
bp2_yearly.6091.dominance: "และโชคชะตาของพวกเขาในอีกหลายปีข้างหน้า"
bp2_yearly.6091.defense: "และการป้องกันของพวกเขาในอีกหลายปีข้างหน้า"
bp2_yearly.6091.a: "ให้เราเฉลิมฉลองทุกสิ่งที่เราเป็น"
bp2_yearly.6091.a.tt: "...และไม่มีอะไรอื่น"

bp2_yearly.6091.aggressive: "[culture|E]ของท่านตอนนี้จ่าย[prestige|E]น้อยลงสำหรับ[GetCultureTradition('tradition_ruling_caste').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_zealous_people').GetName], [GetCultureTradition('tradition_faith_bound').GetName], และ[GetCultureTradition('tradition_warrior_culture').GetName]"
bp2_yearly.6091.defensive: "[culture|E]ของท่านตอนนี้จ่าย[prestige|E]น้อยลงสำหรับ[GetCultureTradition('tradition_isolationist').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_tribe_unity').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_stalwart_defenders').GetName], [GetCultureTradition('tradition_zealous_people').GetName], และ[GetCultureTradition('tradition_faith_bound').GetName]"

bp2_yearly.6100.t: "ชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]ของข้า เกิดใหม่!"
bp2_yearly.6100.desc: "หลายปีแห่งการเยาะเย้ยและความสงสัย การเสียสละและความวุ่นวาย... พวกมันมีไว้เพื่อสิ่งนี้\n\nขณะที่ชาว[ROOT.Char.GetCulture.GetCollectiveNoun]ของข้าโค้งคำนับต่อหน้าข้า คำพูดสุดท้ายของพระราชกฤษฎีกาการปฏิรูปที่ยิ่งใหญ่ที่สุดของข้าก็ถูกท่องออกมาดังสนั่น เราจะปกครองในรูปแบบใหม่ที่ได้รับแรงบันดาลใจจากชาว[advanced_culture.GetName] เราจะสร้างจนกว่าเราจะทัดเทียมความรุ่งโรจน์ของ[childhood_location.GetCounty.GetTitle.GetNameNoTier] และเด็กชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ทุกคนจะได้เรียนรู้ทักษะ — รู้จักความมหัศจรรย์ — ที่ข้ารู้ในวัยเยาว์\n\nหลายสิ่งหลายอย่างได้เปลี่ยนแปลงไป!"
bp2_yearly.6100.reform_court: "ความสง่างามใหม่ ทำให้ราชสำนักของข้ามีชีวิตชีวา"
bp2_yearly.6100.reform_maa: "อาวุธเหล็กและถ้อยคำแห่งกฎหมายปกป้องการปกครองของข้า"
bp2_yearly.6100.reform_faith: "ศรัทธาของข้ามุ่งเน้น ประณีต สูงส่ง"
bp2_yearly.6100.reform_realm: "การค้าเจริญรุ่งเรือง การตั้งถิ่นฐานเติบโต และผู้คนอพยพมายัง[ROOT.Char.GetPrimaryTitle.GetNameNoTier]ที่เกิดใหม่ของข้ามากขึ้นทุกวัน"
bp2_yearly.6100.outro: "\n\nข้ายังคงเป็นชาว[ROOT.Char.GetCulture.GetNameNoTooltip] แต่ข้าคือชาว[ROOT.Char.GetCulture.GetNameNoTooltip]คนใหม่"

bp2_yearly.6100.a: "นี่คือมรดกของข้า - มันต้องสมบูรณ์แบบ!"
bp2_yearly.6100.a.tt: "การเปลี่ยนแปลงที่ยิ่งใหญ่กว่านั้นมีค่าใช้จ่ายสูง เจ้าของที่ดินรายย่อยทั้งหมดไม่ใช่เรื่องง่ายที่จะโน้มน้าว... แต่เราสามารถปรับเปลี่ยนจากชาว[advanced_culture.GetCollectiveNounNoTooltip]ได้มากขึ้น!"
bp2_yearly.6100.b: "ข้าทำสำเร็จแล้ว!"
bp2_yearly.6100.b.tt: "ผู้คนของข้าไม่จำเป็นต้องถูกผลักดันอีกต่อไป ข้าได้นำพวกเขาไปสู่จุดเริ่มต้นของยุคใหม่แล้ว"

cultural_acceptance_gain_completed_reform: "ผู้ปกครองเปลี่ยนแปลงอาณาจักรของตนโดยสิ้นเชิงตามแบบอย่างของวัฒนธรรมอื่น"

bp2_yearly.6100.2_more_innovations: "[culture|E] [root_scope.GetCulture.GetName] ได้รับ[innovations|E]เพิ่มเติม #high 2#! จากวัฒนธรรม[advanced_culture.GetName]"
bp2_yearly.6100.1_more_innovation: "[culture|E] [root_scope.GetCulture.GetName] ได้รับ[innovation|E]เพิ่มเติม #high 1#! จากวัฒนธรรม[advanced_culture.GetName]"
bp2_yearly.6100.gained_2_innovations: "[culture|E] [root_scope.GetCulture.GetName] ได้รับ[innovations|E]สุ่ม #high 2#! จากวัฒนธรรม[advanced_culture.GetName]"
bp2_yearly.6100.gained_1_innovation: "[culture|E] [root_scope.GetCulture.GetName] ได้รับ[innovation|E]สุ่ม #high 1#! จากวัฒนธรรม[advanced_culture.GetName]"

flourishing_settlements_modifier: "การตั้งถิ่นฐานที่เจริญรุ่งเรือง"
flourishing_settlements_modifier_desc: "ด้วยการนำแนวปฏิบัติและเทคโนโลยีใหม่ๆ มาใช้ คนท้องถิ่นที่นี่รู้สึกขอบคุณและเจริญรุ่งเรือง"

 bp2_yearly.6110.t: "การปฏิรูปจากต่างแดน"
bp2_yearly.6110.realm: "ข้าเฝ้าดูเด็กรับใช้ก่อไฟ แสงของมันแทบจะไม่คงอยู่ เป็นคู่ต่อสู้ที่น่าสมเพชสำหรับความมืดมิดของค่ำคืนนี้\n\nบางทีวิถีชีวิตของเรา ในฐานะชาว[ROOT.Char.GetCulture.GetCollectiveNoun] อาจเป็นข้อบกพร่อง ศัตรูที่ยิ่งใหญ่ เช่นนี้ที่จะเผชิญหน้า — และยังมีความเชื่อมั่นในตัวข้าที่จะทัดเทียม[ROOT.Char.GetPrimaryTitle.GetNameNoTier]ทั้งหมดหรือไม่?\n\nข้าคิดถึงวิถีชีวิตของชาว[advanced_culture.GetName] วิธีที่พวกเขาใช้ชีวิตและปกครอง บางทีบางส่วนของมันอาจคุ้มค่าที่จะบังคับใช้กับผู้คนของข้า?"
bp2_yearly.6110.combat: "ข้าเฝ้าดู$knight_culture_player_plural_no_tooltip_lowercase$ในครัวเรือนของข้าเกียจคร้านในแสงแดดยามบ่าย เล่าเรื่องวีรกรรมที่ทำสำเร็จให้กันฟัง\n\nพวกเขาได้รับชัยชนะ และต่อสู้ได้ดีในรูปแบบ[ROOT.Char.GetCulture.GetName]ดั้งเดิม ทว่า... ข้าคิดถึงทักษะและยุทธวิธีของชาว[advanced_culture.GetName]ติดอาวุธ นักสู้ของข้าควรปรับเปลี่ยนวิธีการทำสงครามของพวกเขาหรือไม่?\n\nหรือบางทีเราควรยอมรับอิทธิพลรูปแบบอื่นของชาว[advanced_culture.GetNameNoTooltip]?"
bp2_yearly.6110.social: "ตลาด วิธีการพูดภาษา[ROOT.Char.GetCulture.GetLanguage.GetName]เฉพาะของ[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]ของเราเติมเต็มหูของข้า ชาว[ROOT.Char.GetCulture.GetCollectiveNoun] แม้จะยำเกรงข้า แต่ก็ยังคงทำงานหนักประจำวันต่อไป\n\nข้ารู้ว่าข้าเหมือนพวกเขา แต่ก็#EMP แตกต่าง#! พวกเขาและชาว[advanced_culture.GetCollectiveNoun]ต่างหากที่แตกต่างกัน\n\nนี่คือสิ่งที่ต้องเปลี่ยนแปลงอย่างเร่งด่วนหรือไม่? เพราะถึงแม้ข้าจะไม่ได้เติบโตมาท่ามกลางพวกเขา แต่อำเภอใจของข้าคืออนาคตของชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ทุกคน แง่มุมของวัฒนธรรม[advanced_culture.GetNameNoTooltip]เป็นของข้าที่จะนำมาใช้"
bp2_yearly.6110.ritual: "กฎของเทพเจ้าต่างแดนแตกต่างกัน ดังที่ข้าได้รับแจ้ง เช่นเดียวกับกฎของมนุษย์ และในสถานที่ต่าง ๆ ผู้คนก็เพลิดเพลินกับสิ่งที่แตกต่างกัน — ในขณะที่เทพเจ้าของพวกเขาสนับสนุนสิ่งที่พวกเขาต้องการ ไม่ว่าจะถูกหรือผิด\n\n[ROOT.Char.GetFaith.HouseOfWorship]เงียบสงบ ใคร่ครวญ\n\nบรรพบุรุษชาว[ROOT.Char.GetCulture.GetHeritage.GetName]ในสมัยโบราณ [ROOT.Char.GetFaith.HighGodName] จะขุ่นเคืองมากหรือไม่... หากการปฏิบัติของผู้คนของข้าเปลี่ยนไป? แต่การปฏิบัติแบบ[advanced_culture.GetName]ใดที่รับใช้ผู้ที่เลี้ยงดูข้ามาได้ดีที่สุด?"
bp2_yearly.6110.regional: "เดินไปมาในห้องบัลลังก์ที่เกือบจะว่างเปล่า ข้าต่อสู้กับความทรงจำและความฝันของข้า\n\nข้าฉายภาพถนนของ[childhood_location.GetCounty.GetTitle.GetNameNoTier]ทับ[ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]ที่ยังมาไม่ถึง เห็นงานเลี้ยงของชาว[advanced_culture.GetName]บนโต๊ะของชาว[ROOT.Char.GetCulture.GetName] นำกองทหารที่จัดระเบียบใหม่ไปสู่ชัยชนะครั้งแรก\n\nอะไร ทำให้ชาว[advanced_culture.GetCollectiveNounNoTooltip]โดดเด่นท่ามกลางผู้คน? ประเพณี เช่นนี้สามารถปรับเปลี่ยนได้ แต่มันเริ่มต้นที่ราชสำนักของข้า ที่ตัวข้า"


