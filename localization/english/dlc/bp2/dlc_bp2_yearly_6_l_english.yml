l_english: 
bp2_yearly.6000.t: "ไม่ใช่วิถีของชาว[ROOT.Char.GetCulture.GetNameNoTooltip]"
bp2_yearly.6000.desc.intro: "ขณะที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))] ของข้า [hosted_child.GetName] แสดงตัว [hosted_child.GetHerselfHimself], [tutor.GetName] เล่าถึงสัปดาห์แห่งการสอนที่ล้มเหลวและความคับข้องใจ"

bp2_yearly.6000.desc.fault.bellicose: "\n\n"เด็กผู้นี้ไม่เคยถูกสอนว่าทุกสิ่งที่ [hosted_child.GetSheHe] ต้องการนั้นต้อง #EMP ช่วงชิง#! มา [hosted_child.GetFirstNameNoTooltip] เลือกสันติภาพกับสหาย [hosted_child.GetHerHis] แทนที่จะพิสูจน์ [hosted_child.GetHerselfHimself]! นี่คือทั้งหมดที่ [hosted_child.Custom('GirlBoy')] ผู้นี้รู้!""
bp2_yearly.6000.desc.fault.bureaucratic: "\n\n"เด็กคนนี้คือหายนะอันไร้ระเบียบ! [hosted_child.GetSheHe|U]ฝันกลางวันไปวันๆ [hosted_child.GetSheHe|U]แยกไม่ออกระหว่างชุดชั้นในที่สะอาดกับที่สกปรก! ความโกลาหลคือทั้งหมดที่[hosted_child.Custom('GirlBoy')]ผู้นี้รู้!""
bp2_yearly.6000.desc.fault.communal: "\n\n"เด็กคนนี้นินทามารดาของ[hosted_child.GetHerHis]เอง! ไม่เคยมีใครเตือน[hosted_child.GetSheHe]เลย [hosted_child.Custom('GirlBoy')]ถูกปล่อยให้กระทำตามลำพัง ยืนหยัดตามลำพัง และไม่ใส่ใจญาติพี่น้องที่รอคอย[hosted_child.GetHerHim]อยู่""
bp2_yearly.6000.desc.fault.courtly: "\n\n"เด็กคนนี้ไม่ได้รับการสอนสิ่งใดเกี่ยวกับเรื่องอันประณีตเลย! ข้าต้องเคาะกะโหลก[hosted_child.GetHerHis] เพื่อให้[hosted_child.GetHerHim]โค้งคำนับต่อหน้าท่าน โอ้ [ROOT.Char.GetTitleAsNameNoTooltip] [hosted_child.GetSheHe]ท่องบทกวีได้หรือไม่? พูดจาอย่างเหมาะสมกับเพศตรงข้ามได้หรือไม่? ไม่เลย!""
bp2_yearly.6000.desc.fault.egalitarian: "\n\n"[hosted_child.GetSheHe|U]ไม่เคยได้รับการสอนให้เคารพผู้คนที่อาศัยอยู่ในดินแดนของเราร่วมกัน เด็กคนนี้เลียนเสียงสำเนียงของทูตชาว[realm_minority.GetNameNoTooltip]ด้วยการร้องเหมือนแกะ! นั่นคือการศึกษาของ[hosted_child.GetHerHis]รึ?!""
bp2_yearly.6000.desc.fault.egalitarian_no_culture: "\n\n"[hosted_child.GetSheHe|U]ไม่เคยได้รับการสอนให้เคารพผู้คนที่อาศัยอยู่ในดินแดนของเราร่วมกัน เด็กคนนี้เลียนแบบภาษาของพวกเขาด้วยการร้องเหมือนแกะ! นั่นคือการศึกษาของ[hosted_child.GetHerHis]รึ?!""
bp2_yearly.6000.desc.fault.spiritual: "\n\n"เด็กคนนี้หยุดเพื่อแสดงความขอบคุณต่อแหล่งที่มาของอาหารของ[hosted_child.GetHerHis]หรือไม่? [hosted_child.GetSheHe]วิงวอนขอความช่วยเหลือจากสิ่งศักดิ์สิทธิ์หรือไม่? ไม่เลย! [hosted_child.GetSheHe|U]ถูกเลี้ยงดูมาเพื่อชีวิตที่ปราศจากความเคารพ""
bp2_yearly.6000.desc.fault.stoic: "\n\n\"เด็กคนนี้ย่นจมูกของ [hosted_child.GetHerHis] ให้กับความงามของบ้านเกิดของเรา [hosted_child.GetSheHe|U] ดูถูกความจำเป็นที่จะต้องยืนหยัด ต่อสู้ — เพื่อปกป้องผู้คนของเรา! [hosted_child.GetSheHe|U] ถูกสอนให้เห็นแก่ประโยชน์ส่วนตนอย่างน่าสมเพช\""

bp2_yearly.6000.desc.mid: "\n\nความโกรธเกรี้ยวของ[tutor.GetFirstNamePossessiveNoTooltip]มุ่งเป้าไปที่[hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))]ของเด็ก\n\n"มี"

bp2_yearly.6000.desc.value.bellicose: "ไฟและความกระตือรือร้น"
bp2_yearly.6000.desc.value.bureaucratic: "สามัญสำนึกที่ดี"
bp2_yearly.6000.desc.value.communal: "ความรักต่อญาติสนิทมิตรสหาย"
bp2_yearly.6000.desc.value.courtly: "ความเคารพต่อมารยาทอันสูงส่ง"
bp2_yearly.6000.desc.value.egalitarian: "มารยาททางสังคม"
bp2_yearly.6000.desc.value.spiritual: "ความเคารพต่อพิธีกรรมอันศักดิ์สิทธิ์ของเรา"
bp2_yearly.6000.desc.value.stoic: "สำนึกในหน้าที่ต่อผู้คนของ[childs_home_liege.GetHerHis]"

bp2_yearly.6000.desc.outro: "ในตัว[childs_home_liege.GetTitledFirstName]บ้างหรือไม่? เยาวชนชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ที่เหมาะสมจะมาจากราชสำนัก เช่นนั้นได้อย่างไร ที่ ซึ่งพวกเขาไม่ได้รับการสอนสิ่งใดเกี่ยวกับประเพณีของเราเลย?""

bp2_yearly.6000.a: "ทุกคนจะได้รู้ถึงการดูหมิ่นของ[childs_home_liege.GetTitleAsNamePossessiveNoTooltip]!"
bp2_yearly.6000.a.tt: "สนับสนุนเหตุผลของ[hosted_child.GetFirstNameNoTooltip]ผู้น่าสงสาร เหยื่อของความเฉยเมยต่อประเพณีของเราของ[hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))]ของ[hosted_child.GetHerHis]"

bp2_yearly.6000.a.response: "[childs_home_liege.GetShortUIName]อาจสูญเสีย[opinion|E]กับเพื่อนชาว[childs_home_liege.GetCulture.GetCollectiveNounNoTooltip]"

bp2_yearly.6000.b: "ข้าจะแก้ไขเด็กคนนี้ด้วยตนเอง"
bp2_yearly.6000.b.success: "ค่านิยมอันดีงามของเราถูกปลูกฝังอย่างลึกซึ้ง"
bp2_yearly.6000.b.failure: "หลักการที่เข้าใจผิดบางอย่างถูกยึดถือไว้อย่างขมขื่น"
bp2_yearly.6000.c: "อย่ามารบกวนข้าเรื่องประเพณีบ้าๆ ของเราเลย"

