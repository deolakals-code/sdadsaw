bp2_yearly.6001.opening: "[childs_host.Custom2('AppropriateGreeting', ROOT.Char)]"
bp2_yearly.6001.desc: "การมี[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))]ของท่าน [hosted_child.GetName] อยู่ในความดูแลของข้า ได้เผยความจริงอันโชคร้าย: ท่านใส่ใจคุณธรรมตามประเพณีของชาว[ROOT.Char.GetCulture.GetNameNoTooltip]น้อยมาก เด็กเหลือขอที่ไม่รู้อะไรเกี่ยวกับวิถีของเราเลย เติบโตขึ้นเป็น"

bp2_yearly.6001.desc.insult.bellicose: "คนขี้ขลาด"
bp2_yearly.6001.desc.insult_bureaucratic: "คนเสเพล"
bp2_yearly.6001.desc.insult.communal: "คนพเนจร"
bp2_yearly.6001.desc.insult.courtly: "คนป่าเถื่อน"
bp2_yearly.6001.desc.insult.egalitarian: "คนชั่วร้าย"
bp2_yearly.6001.desc.insult.spiritual: "พวกนอกรีต"
bp2_yearly.6001.desc.insult.stoic: "คนร้าย"

bp2_yearly.6001.desc.outro: "ในราชสำนักของท่าน\n\nผู้นำของผู้คนของเรารู้เรื่องนี้ทั้งหมด ข้าแน่ใจในเรื่องนั้นแล้ว"
bp2_yearly.6001.a: "ข้าต้องจัดการเรื่องนี้! เราต้องพิสูจน์ว่า[childs_host.GetHerHim]ผิด!"
bp2_yearly.6001.a.tt: "ผู้ให้การศึกษาในราชสำนักของข้าจำเป็นต้องได้รับการพูดคุยอย่างเข้มงวดเกี่ยวกับค่านิยม"
bp2_yearly.6001.b: "ข้าจะทำตามที่ข้าต้องการ"
bp2_yearly.6001.b.tt: "ข้าไม่ใช่ชาว[ROOT.Char.GetCulture.GetNameNoTooltip]ทั่วไป แต่ข้าสามารถเป็นคนพิเศษได้"
enforcing_cultural_values_modifier: "การบังคับใช้ค่านิยมทางวัฒนธรรม"
