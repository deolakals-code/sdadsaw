bp2_yearly.6110.b: "[considered_tradition_2.GetNameNoTooltip]"
bp2_yearly.6110.c: "[considered_tradition_3.GetNameNoTooltip]"
bp2_yearly.6110.d: "[considered_tradition_4.GetNameNoTooltip]"
bp2_yearly.6110.e: "ข้าอยากจะพิจารณาการเปลี่ยนแปลงอื่น ๆ มากกว่า..."
bp2_yearly.6110.e.tt: "ข้าไม่เห็นว่าชาว[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]จะยอมรับการปฏิบัติเหล่านี้ได้"

cultural_acceptance_gain_adapted_tradition: "[tradition|E]ถูกปรับเปลี่ยน"

introduced_foreign_custom_modifier: "นำประเพณีต่างแดนเข้ามาใช้"
introduced_foreign_custom_modifier_desc: "โดยไม่ให้เวลาผู้คนปรับตัว ตัวละครนี้บังคับใช้การปฏิบัติที่แปลกประหลาดกับทุกคน"
repeated_foreign_reforms_modifier: "การปฏิรูปต่างแดนซ้ำแล้วซ้ำเล่า"
repeated_foreign_reforms_modifier_desc: "สมาชิกวัฒนธรรมของตัวละครนี้กำลังโกลาหลจากการโจมตีวิถีชีวิตของพวกเขา"
assault_on_tradition_modifier: "การโจมตีประเพณี"
assault_on_tradition_modifier_desc: "ในช่วงชีวิตเดียว ตัวละครนี้ ทำให้วัฒนธรรมของตนไม่เป็นที่รู้จักโดยสิ้นเชิง"

bp2_yearly.6120.t: "ที่ ซึ่งพันธะถูกทดสอบ"
bp2_yearly.6120.desc: "ตัวประกันของข้า [hostage.GetName] กระสับกระส่ายอย่างกังวลและมีความหวัง [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))]ของ[hostage.GetHerHis] [hostage_giver.GetTitledFirstName] อยู่ใกล้ ๆ ที่นี่ใน[ROOT.Char.GetCurrentLocation.GetName] และเป็นเวลานานแล้วที่ไม่ได้เป็น เช่นนี้ครั้งสุดท้าย\n\n[hostage.Custom('GirlBoy')]อาศัยอยู่กับข้าตอนนี้ [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))]ของ[hostage.GetHerHis]และข้ามีข้อตกลงกัน [hostage.GetFirstNameNoTooltip]อยู่ภายใต้อำนาจของข้า และ[hostage.GetSheHe]ควรภักดีต่อ#EMP ข้า#! มีความเสี่ยงในการปล่อยให้[hostage.GetHerHim]จุดประกายความรักต่อครอบครัวของ[hostage.GetHerHis]อีกครั้ง...\n\n"ได้โปรด" [hostage.GetSheHe]อ้อนวอน "ได้โปรด [ROOT.Char.GetTitleAsNameNoTooltip]ของข้า ข้าคิดถึง[hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))]ของข้าสุดหัวใจ!""


bp2_yearly.6120.a: "ดื่มด่ำกับการพบกันอีกครั้ง มันล้ำค่า"
bp2_yearly.6120.a.tt: "ท้ายที่สุดแล้ว [hostage.Custom('GirlBoy')]ก็ยังคงเป็นชาว[hostage.GetDynastyHouseNameNoTooltip] และสมควรได้รับความโปรดปรานจากครอบครัวของ[hostage.GetHerHis]"
bp2_yearly.6120.b: "ข้าคาดหวังค่าตอบแทนสำหรับความกรุณาอันเอื้อเฟื้อนี้!"
bp2_yearly.6120.b.tt: "เหตุใดจึงต้องเก็บตัวประกันไว้ หากไม่ใช่เพื่อการรีดไถ เช่นนี้?"
bp2_yearly.6120.hook: "หาก[hostage_giver.GetShortUIName]ยอมรับ ท่านจะได้รับ[weak_hook|E]ต่อ[hostage_giver.GetHerHim]"
bp2_yearly.6120.hook_acceptance: "[personality|E]ของ[hostage_giver.GetShortUINamePossessive]เป็นตัวกำหนดว่า[hostage_giver.GetSheHe]จะยอมรับหรือไม่"
bp2_yearly.6120.c: "มาเถิด มาคุยกับ[hostage_giver.GetHerHim]#EMP ด้วยกัน#!เถอะ"
bp2_yearly.61020.c.tt: "ข้าสามารถเอาชนะใจคนน่าเบื่อนั่นได้ และทำให้ญาติของ[hostage_giver.GetHerHis]เองชอบอยู่กับข้ามากกว่า[hostage_giver.GetHerHis]!" # หมายเหตุ: คีย์ดูเหมือนไม่ถูกต้อง แต่แปลตามที่ให้มา
bp2_yearly.6120.c.success: "ท่านครอบงำการปฏิสัมพันธ์กับ[hostage_giver.GetFirstNameNoTooltip]"
bp2_yearly.6120.c.failure: "ท่านดูเหมือนเป็นคนน่ารำคาญที่ชอบเจ้ากี้เจ้าการ"
bp2_yearly.6120.d: "#EMP เงียบนะ!#! เจ้าสมควรโดนตบ [hostage.Custom('GirlBoy')]!"
bp2_yearly.6120.d.tt: "[hostage.GetFirstNameNoTooltip]เป็นของข้า ไม่ใช่ของครอบครัว[hostage.GetHerHis] การทุบตีจะช่วยให้[hostage.GetHerHim]จำได้"

bp2_yearly.6121.t: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U]ผู้ถูกลืมเลือน"
bp2_yearly.6121.reunion: "ข้ารอคอยช่วงเวลานี้ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]ของข้า [hostage.GetFirstName] ตัวประกันที่ปกป้องสันติภาพของข้า ยืนอยู่ต่อหน้าข้าใน[ROOT.Char.GetCurrentLocation.GetName]\n\n"[hostage.Custom2('RelationToMeShort', ROOT.Char)|U]!"\n\nขณะที่[hostage.GetSheHe]วิ่งเข้ามาในอ้อมกอดของข้า ราวกับว่า[hostage.GetSheHe]ไม่เคยจากไปไหน ทว่าความแน่นของการกอดของ[hostage.GetHerHis]ทรยศต่อความปรารถนาที่จะกลับบ้านของ[hostage.Custom('GirlBoy')]\n\n[warden.GetTitledFirstName]ดีที่อนุญาตให้เราอยู่ร่วมกัน เช่นนี้ แต่มันก็ยังไม่มากพอ"

bp2_yearly.6121.intrusion: "โดยมี[warden.GetTitledFirstName]อยู่ข้าง[hostage.GetHerHis] [hostage.GetFirstName]ยืนอยู่ต่อหน้าข้า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]ของข้าเปลี่ยนไปมากนับตั้งแต่ข้าส่ง[hostage.GetHerHim]ไปเป็นตัวประกัน แต่ข้าจำชาว[ROOT.Char.GetDynastyHouseName]ได้ทุกที่!\n\nข้ากอด[hostage.Custom('GirlBoy')] [hostage.GetSheHe|U]พยายามสงบสติอารมณ์ แต่ความแน่นของการกอดของ[hostage.GetHerHis]ทรยศต่อความปรารถนาที่จะกลับบ้านของ[hostage.GetHerHis]\n\nจากนั้น[warden.GetTitledFirstNameNoTooltip]ก็เข้ามาแทรกแซง ดึงความสนใจของ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]ของข้าไป พูดพล่ามเกี่ยวกับการพบกันครั้งนี้... และพืชผลท้องถิ่นของ[ROOT.Char.GetCurrentLocation.GetName]?\n\nอย่างไรก็ตาม ข้าขอบคุณ[ROOT.Char.GetFaith.HouseholdGodName]ในนามของครอบครัวข้า"
bp2_yearly.6121.hook: "\"สงสัยอยู่ใช่ไหมว่าจะได้พบกับ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]ของท่านอีกหรือไม่?" [warden.GetTitledFirstName]หลอกล่อ "[hostage.Custom('GirlBoy')] [hostage.GetFirstName] ผู้ ซึ่งท่านสละให้อย่างเอื้อเฟื้อในนามของสันติภาพ"\n\n[warden.GetFirstNameNoTooltip]ดูเหมือนจะพอใจตัวเองมากเกินไป\n\n"ตราบใดที่เราอยู่ด้วยกันใน[ROOT.Char.GetCurrentLocation.GetName] ท่านอาจอยู่ร่วมกับตัวประกันได้ แม้ว่ามันจะเป็นอันตรายต่อข้อตกลงของเรา..."\n\n"...หากท่านสาบานว่าความเอื้อเฟื้อของข้านี้จะไม่ถูกลืมเลือน""
bp2_yearly.6121.forbidden: "\"ท่านคิดว่า เพียง เพราะท่านและ[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]ของท่าน [hostage.GetFirstName] อยู่ใน[ROOT.Char.GetCurrentLocation.GetName]ทั้งคู่ ท่านจะได้อยู่ร่วมกันหรือ?"\n\n[warden.GetTitledFirstName]ส่ายหน้า[warden.GetHerHis]\n\n"ตัวประกันของข้ายุ่งมาก อย่างไรก็ตาม ตลอดระยะเวลาของข้อตกลงของเรา [hostage.GetSheHe]เป็นของข้า แต่เพียงผู้เดียว"\n\nอันที่จริง ข้าแทบไม่เห็นร่องรอยของ[hostage.Custom('GirlBoy')]ที่ถูกส่งตัวไปเลย..."

bp2_yearly.6121.a: ""[hostage.GetFirstNameNoTooltip]! ข้าจะพาท่านกลับบ้าน""
bp2_yearly.6121.a.tt: "ความเสื่อมเสียเกียรติจงพินาศ: [hostage.GetFirstNameNoTooltip] สมควรอยู่กับข้า! ให้ [warden.GetTitledFirstNameNoTooltip] ทำตามใจ [warden.GetSheHe] เถิด"
bp2_yearly.6121.b: ""ของขวัญอันยิ่งใหญ่ เพื่อท่านจักไม่อดอยาก!""
bp2_yearly.6121.b.tt: ""จงกิน! จงกิน! และแสดงสถานะของท่านในฐานะชาว [ROOT.Char.GetDynastyHouseNameNoTooltip]""
bp2_yearly.6121.c: ""ยินดีที่ได้พบท่าน [hostage.Custom('GetLassLad')]""
bp2_yearly.6121.d: "ทุกสิ่งเพื่อความรักต่อตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip]"
bp2_yearly.6121.d.tt: "ไม่มีญาติข้าคนใดจะถูกทอดทิ้งโดยพวกพ้องของ [hostage.GetHerHis]"
bp2_yearly.6121.e: "เพื่ออ้อมกอดที่ลักลอบ ข้าไม่ต้องการคำอนุญาต..."
bp2_yearly.6121.e.tt: "[warden.GetTitledFirstNameNoTooltip] มิอาจขัดขวางข้าจากการพบ [hostage.GetFirstNameNoTooltip] และสนทนากับ [hostage.GetHerHim] ได้ แม้เพียงชั่วครู่ก็ตาม"
bp2_yearly.6121.e.success: "ท่านลอบเข้าไปกอดได้สำเร็จ"
bp2_yearly.6121.e.failure: "ท่านถูกจับได้"
bp2_yearly.6121.f: "เอ๊ะ ข้าไม่ได้คิดถึง [hostage.GetHerHim]"
bp2_yearly.6121.f.tt: "ข้าคงจะได้พบ [hostage.GetHerHim] อีกสักวัน... และนั่นก็ดีแล้ว"

bp2_yearly.6122.t: "มิได้ถูกลืมเลือน"
bp2_yearly.6122.sneaking: "ขณะที่สายลับของข้ารีบพา [hostage.GetFirstName] ออกไปจากองครักษ์ของ [warden.GetTitledFirstNamePossessive] โดยอาศัยช่วงเวลาอันยิ่งใหญ่ของอาหารค่ำ ข้าก็ย่องไปร่วมการพบปะของครอบครัวนี้ด้วย\n\nสถานการณ์อันน่าอดสูแทบจะไม่อยู่ในความคิดของข้าขณะที่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้ากอดข้า หัวเราะเยาะริ้วรอยของข้า ตื่นเต้นดีใจ\n\n[hostage.GetSheHe|U] จากไปนานแล้ว และในไม่ช้าก็ต้องกลับไปหาผู้ดูแลของเขา นี่คือวิถีของสิ่งต่างๆ แต่ข้าไม่อิจฉา [hostage.GetHerHim] นายผู้เข้มงวดของ [hostage.GetHerHis]"
bp2_yearly.6122.rescue: "[warden.GetTitledFirstName] โกรธแค้นเพียงใดเมื่อข้าขับไล่ [warden.GetHerHim] ออกไปจากเบื้องหน้าข้า โดยมี [hostage.GetFirstName] อดีตตัวประกันของ [warden.GetHerHis] อยู่เคียงข้างข้า\n\n"ท่าน [warden.GetSheHe] จะกลับมาหรือไม่ [hostage.Custom2('RelationToMeShort', ROOT.Char)]?" เด็กน้อย [hostage.Custom('GirlBoy')] ถาม "ข้าอยากกลับบ้าน แต่... ข้าไม่อยาก ทำให้ท่านต้องสู้กับ [warden.GetPrimaryTitle.GetNameNoTier]"\n\nข้าให้ความมั่นใจแก่ [hostage.GetFirstNameNoTooltip] เป็นอย่างอื่น แต่ความจริงยังคงชัดเจน\n\nข้าผิดสัญญา ไม่ว่าจะดีหรือร้าย อาจพิสูจน์ได้ว่าข้าได้สละสันติภาพไปแล้ว"

bp2_yearly.6122.c: ""เราจะร่วมกันรอคอยสิ่งที่จะเกิดขึ้น""
bp2_yearly.6122.c.tt: "หากพิสูจน์ได้ว่าเป็นสงคราม อย่างน้อย [hostage.GetFirstNameNoTooltip] ก็จะไม่ใช่คนแรกที่ถูกสังหาร..."

bp2_yearly.6123.t: "ทายาทแห่งสันติภาพ"
bp2_yearly.6123.desc: "การรวมญาติเป็นภาพที่น่าประทับใจ ซึ่งข้ายินดีเป็นประธาน\n\n [hostage_giver.GetTitledFirstName] ได้เล่าเรื่องเปรียบเทียบอันชาญฉลาดสองสามเรื่องให้ [hostage.GetFirstName] ฟังเมื่อวันเวลาผ่านไป และขณะที่ข้ารอคอยการกลับมาของตัวประกันด้วยอารมณ์ดี\n\n"ดูแล [hostage.GetHerHim] ให้ดี" [hostage_giver.GetTitleAsNameNoTooltip] กระตุ้น ขณะที่ข้าพา [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของ [hostage_giver.GetHerHis] ไป "กัน [hostage.GetHerHim] ให้ห่างจากคนแปลกหน้า เช่นข้า""
bp2_yearly.6123.stolen_hostage: "[hostage_giver.GetTitledFirstName] ทำสิ่งที่ไม่น่าเชื่อ! ความชอบธรรมของข้า [hostage_giver.GetSheHe] กลับตอบแทนด้วยการทรยศ\n\nเจ้าคนเลวผู้นั้นเร่งให้ข้าจากไป ขณะที่เด็กน้อย [hostage.Custom('GirlBoy')] [hostage.GetFirstName] สัญลักษณ์แห่งสันติภาพของเรา ยืนอยู่เคียงข้าง [hostage_giver.GetHerHis] อย่างผิดที่ผิดทาง... และข้าต้องไป ข้ามีกำลังพลน้อยที่นี่ มันเป็นการดูถูก! มันน่าอดสู!\n\nบัดนี้ข้ามุ่งหน้ากลับบ้าน ถูกดูแคลนและเหยียดหยาม โดยไม่มีหลักประกันใดๆ ว่าสิ่งที่เลวร้ายกว่านี้จะไม่เกิดขึ้น\n\n[hostage_giver.GetFirstNameNoTooltip] จะต้องเสียใจกับการกระทำอันโง่เขลานี้ เช่นเดียวกับที่ข้าเสียใจที่นำตัวประกันของข้ามาใกล้งูพิษที่ละโมบ เช่นนี้..."
bp2_yearly.6123.favor_accepted: "ข้าตัดสินถูกแล้ว... [hostage_giver.GetTitledFirstName] เป็น [hostage_giver.Custom('WomanManPerson_GenderPreference')] ที่ยอมถูกกดดัน\n\nขณะที่ [hostage_giver.GetSheHe] กอด [hostage.GetFirstName] ไว้ใกล้ๆ ความอ่อนโยนที่ [hostage_giver.GetSheHe] สงวนไว้สำหรับครอบครัวก็ปรากฏให้เห็นอย่างเต็มที่\n\nด้วยภาระผูกพันใหม่ที่จะผูกมัด [hostage_giver.GetHerHim] และตัวประกันอันเป็นที่รัก เช่นนี้ในการดูแลของข้า ข้าไม่เห็นภัยคุกคามใดๆ จาก [hostage_giver.GetTitleAsNameNoTooltip] ในวันข้างหน้า"
bp2_yearly.6123.sneaker: "[hostage_giver.GetTitledFirstName] หนูไร้เกียรติ ดูเหมือนจะไม่เคารพอำนาจของข้าเหนือ [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของ [hostage_giver.GetHerHis] [hostage.GetFirstName]\n\n[hostage_giver.GetSheHe|U] ปฏิเสธว่าไม่ได้ส่งคนรับใช้เจ้าเล่ห์ไปล่อลวงเด็กน้อย [hostage.Custom('GirlBoy')] ออกจากโต๊ะอาหารค่ำที่ข้าคุ้มกันอย่างดี แต่ข้ารู้ว่า [hostage_giver.GetSheHe] มองหา แต่จะละเมิดข้อตกลงระหว่างเรา\n\n"โกหก!" [hostage_giver.GetSheHe] คัดค้าน\n\nตราบใดที่ [hostage.GetSheHe] ยังอยู่ในราชสำนักของข้า [hostage.GetFirstNameNoTooltip] #EMP ต้อง#! อยู่ห่างจาก [hostage_giver.GetTitleAsNameNoTooltip] เสมอ"
bp2_yearly.6123.forbidden_desc: "แม้ข้าจะสงสัยว่ามัน ทำให้ [hostage_giver.GetHerHim] ไม่พอใจ แต่ [hostage_giver.GetTitledFirstName] ก็เคารพคำประกาศของข้าเกี่ยวกับว่า [hostage_giver.GetSheHe] สามารถพบกับ [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของ [hostage_giver.GetHerHis] ได้หรือไม่\n\n"ข้าแทบไม่ได้คิดถึง [hostage.Custom('GetLassLad')]" [hostage_giver.GetSheHe] อ้าง "ข้าเกือบจะดีใจที่ท่านถูกบังคับให้รับมือกับความโง่เขลาของ [hostage.GetHerHis] ต่อไปอีกสักพัก"\n\nนี่คือสิ่งที่ต้องเป็น นอกจากนี้... เป็นการดีที่จะทดสอบ [hostage_giver.Custom('WomanManPerson_GenderPreference')] และรู้ว่า [hostage_giver.GetSheHe] ยืนอยู่จุดไหน"

bp2_yearly.6123.a: "ช่างเป็น [hostage_giver.Custom('WomanManPerson_GenderPreference')] ที่รักครอบครัวเสียจริง [hostage_giver.GetFirstNameNoTooltip]"

bp2_yearly.6123.return_hostage: "[hostage.GetShortUIName] ไม่ใช่ [hostage|E] ของท่านอีกต่อไป"

bp2_yearly.6130.t: "เชลย ผู้ถูก ทำให้หลงใหล"
bp2_yearly.6130.desc.different_ages: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า [kin.GetFirstName] และตัวประกัน [hostage.GetName] แม้จะมีอายุห่างกัน แต่ดูเหมือนจะสนิทสนมกันมากขึ้นเรื่อยๆ\n\nผู้ที่อาวุโสกว่าคอยปกป้องอีกฝ่ายอย่างแน่วแน่ ให้คำแนะนำที่ดีเกี่ยวกับวิถีทางของโลก ขณะที่ผู้อ่อนวัยกว่าไม่เคย ทำให้ยิ้มไม่ได้\n\nเมื่อมองดูสหายที่ไม่น่าจะเป็นไปได้เหล่านี้ ข้าอดสงสารพวกเขาไม่ได้กับการพลัดพรากที่จะมาถึง สักวันหนึ่ง ข้อตกลงตัวประกันกับญาติของ [hostage.GetFirstNamePossessiveNoTooltip] จะสิ้นสุดลง..."
bp2_yearly.6130.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า [kin.GetFirstName] และตัวประกัน [hostage.GetName] ดูเหมือนจะเติบโตเป็นสหายที่มั่นคง เป็นที่ไว้วางใจ ซึ่งกันและกัน\n\n[hostage.GetFirstNameNoTooltip] เมื่อคิดถึงบ้าน ก็มักจะได้รับกำลังใจจาก [kin.GetFirstNameNoTooltip] เสมอ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า ซึ่งบางครั้งตำแหน่งของ [kin.GetHerHis] ก็เป็นภาระหนักอึ้งสำหรับ [kin.GetHerHim] ก็มี [hostage.GetFirstNameNoTooltip] คอยร่วมปฏิบัติหน้าที่กับ [kin.GetHerHim]\n\nเมื่อมองดูเด็กทั้งสองแบ่งปันความสุข ข้าอดสงสารพวกเขาไม่ได้กับการพลัดพรากที่จะมาถึง สักวันหนึ่ง ข้อตกลงตัวประกันกับญาติของ [hostage.GetFirstNamePossessiveNoTooltip] จะสิ้นสุดลง..."
bp2_yearly.6130.a: ""จงสาบานว่าจะสนับสนุน ซึ่งกันและกันเสมอ""
bp2_yearly.6130.a.tt: "สายสัมพันธ์ระหว่างสองราชสำนักของเรา... บางทีนั่นอาจเป็นสิ่งที่ควรค่าแก่การบ่มเพาะ?"
bp2_yearly.6130.b: ""ความรักต่อญาติควรอยู่เหนือสิ่งอื่นใด!""
bp2_yearly.6130.b.tt: "ไปเล่นกับคนที่จะอยู่เคียงข้างเจ้าเสมอเถิด [kin.Custom('GirlBoy')]"

bp2_yearly.6130.family_opinion: "[kin.GetShortUIName] ได้รับ #P 30#! [opinion|E] ต่อ [close_family|E] ของ [kin.GetHerHis]"

bp2_yearly.6130.alliance: "หากทั้งคู่กลายเป็น [rulers|E] [kin.GetShortUIName] และ [hostage.GetShortUIName] สามารถเจรจา [alliance|E] ได้"

bp2_yearly.6140.t: "เพื่อมิตรภาพ ยังเยาว์เกินไป"
bp2_yearly.6140.desc: "ขณะที่พิธีกรรมอันศักดิ์สิทธิ์เบี่ยงเบนความสนใจของผู้ดูแลทุกคน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า [kin.GetFirstName] และตัวประกัน [hostage.GetName] ก็ปลดปล่อยความเกลียดชังที่เพิ่มพูนขึ้น\n\n"[kin.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] ของข้าคือ [ROOT.Char.GetTitleAsName] ผู้ยิ่งใหญ่ที่สุดในแผ่นดิน!" [kin.GetFirstNameNoTooltip] กระซิบเสียงเข้ม "สักวันหนึ่ง ต้องขอบคุณท่าน [home_court.GetPrimaryTitle.GetNameNoTier] อันโสมมจะต้องลุกเป็นไฟ และหัวของเจ้าจะถูกแขวนไว้บนอานม้าของ $knight_culture_player_no_tooltip_lowercase$!"\n\n"ข้าหวังว่า [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้าจะพาข้ากลับบ้าน" [hostage.GetFirstNameNoTooltip] ตอบ "เจ้าคงจะกลัวตายที่จะดูถูกข้าที่นั่น!"\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้าเริ่มพูด เช่นนี้ตั้งแต่เมื่อใด? และกับแขกผู้มีเกียรติ!"
bp2_yearly.6140.a: "การแข่งขัน ทำให้ปัญญาของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้าเฉียบแหลมขึ้น"
bp2_yearly.6140.a.tt: "จง ทำให้ [hostage.GetHerHim] อับอาย [kin.Custom('GirlBoy')]! [hostage.GetFirstNameNoTooltip] เป็นศัตรูที่อยู่ในกำมือเจ้า"
bp2_yearly.6140.b: "ตัวประกันถูกเก็บไว้ไม่ใช่เพื่อความขัดแย้ง แต่เพื่อสันติภาพ"
bp2_yearly.6140.b.tt: "ควรสวดภาวนา #EMP ต่อต้าน#! การตัดหัวเถิด เด็กๆ"

bp2_yearly.6150.t: "หลักประกันเอ่ยปาก"
bp2_yearly.6150.desc: "ตามธรรมเนียม ตัวประกันจะปรากฏตัว ยืนเรียงแถวเคียงข้างข้าราชการและครอบครัว เมื่อ [ROOT.Char.GetTitleAsName] เช่นข้า รับคำร้องและประกอบพิธีการ\n\nตัวประกันของข้า [hostage.GetFirstName] ไม่ชอบสิ่งนี้\n\n"โปรดเถิด การถูกจ้องมอง การเป็นเหมือนรางวัล..." [hostage.GetSheHe] คัดค้าน ขณะที่ผู้ร้องทุกข์คนสุดท้ายทยอยออกไป\n\n"ข้ารู้สึกเหมือนวิญญาณที่ถูกฉกฉวยมาจาก [hostage.GetFaith.NegativeAfterLife] ทุกคนจ้องมองข้า... พวกเขารู้ว่าข้าไม่ได้อยู่ที่นี่""
bp2_yearly.6150.a: "เจ้าเป็นส่วนหนึ่งของครอบครัวข้า จงยืนหยัดเคียงข้างพวกเขา"
bp2_yearly.6150.a.tt: "ไม่มีอะไรต้องกลัว! เจ้าแทบจะเป็นหนึ่งในพวกเราแล้ว"
bp2_yearly.6150.b: "ไปศึกษากับ [ROOT.Char.GetFaith.PriestNeuterPlural] เถิด ข้าว่า..."
bp2_yearly.6150.b.tt: "ข้าสามารถยืนหยัดเพื่อความยิ่งใหญ่ของตนเองได้: หน้าที่แรกของข้าต่อตัวประกันเหล่านี้คือการอบรมพวกเขา"
bp2_yearly.6150.c: "เจ้าเป็นของข้า ข้าจะปฏิบัติต่อเจ้าตามใจชอบ"
bp2_yearly.6150.c.tt: "ข้าไม่อาจยอมให้ตัวประกันมาบงการสิ่งที่ข้าทำได้"

hostages_accepted_into_family_modifier: "การยอมรับตัวประกันเข้าสู่ครอบครัว"
hostages_accepted_into_family_modifier_desc: "เจ้าบ้านผู้มีเมตตาและสง่างาม ผู้ ซึ่งให้ความสำคัญกับการปฏิบัติต่อตัวประกันดุจญาติมิตร"
eschews_flaunting_of_hostages_modifier: "หลีกเลี่ยงการโอ้อวดตัวประกัน"
eschews_flaunting_of_hostages_modifier_desc: "ตัวประกันของตัวละครนี้ได้รับการดูแลและอบรม ไม่ใช่ถูกนำมาแห่แหน"

 bp2_yearly.6150.family_opinion_hostage: "[hostage.GetShortUIName] ได้รับ #P 20#! [opinion|E] ต่อ [close_family|E] ของท่าน"

 bp2_yearly.6160.t: "ยอดนักขี่ที่แย่ที่สุดของข้า"
 bp2_yearly.6160.desc: "ท่ามกลางเสียงสะอื้นและการโกหก ข้าได้เรียนรู้ความจริงของเมื่อคืน\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า [kin.GetFirstName] และตัวประกัน [hostage.GetFirstName] ลอบออกไปภายใต้ความมืดมิด ด้วยความอยากรู้อยากเห็นโลกภายนอกครัวเรือนของข้า พวกเขาจึงลอบเข้าไปในชุมชน\n\nเมื่อชื่นชมม้าของครอบครัวท้องถิ่น พวกเขาก็ถูกพบตัวในไม่ช้า — และควบม้าที่ขโมยมาหนีไป\n\nเด็กไร้ความสามารถขี่ม้าตกคูน้ำ\n\n"[hostage.GetFirstNameNoTooltip] ยุให้ข้าทำ!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ที่บาดเจ็บของข้าสะอื้น เช่นเดียวกับชาวบ้านที่คร่ำครวญถึงม้าที่ขาเป๋ไปแล้ว"
 bp2_yearly.6160.a: "จงลิ้มรสการใช้แรงงานเพื่อชดใช้หนี้ของเจ้า"
 bp2_yearly.6160.a.tt: "เจ้าตัวเล็กอยากสัมผัสชีวิตสามัญชนหรือ? ถ้า เช่นนั้นก็ให้พวกเขาทำงานให้เจ้าของม้าสักพัก"
 bp2_yearly.6160.b: "เจ้าทำร้าย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้างั้นรึ ตัวประกัน?! #EMP ไปให้พ้น!#!"
 bp2_yearly.6160.b.tt: "ไม่มีสัญญาสงบศึกใดคุ้มค่ากับการ ทำให้ครอบครัวข้าตกอยู่ในอันตรายด้วยการมีอยู่ของพวกไร้ค่า เช่นนี้!"
 bp2_yearly.6160.c: "#EMP เฮ้อ#! ข้าคงต้องจ่ายค่าเสียหายสำหรับเรื่องนี้..."
 bp2_yearly.6160.d: "รักษาม้า? ง่ายเกินไป"
 bp2_yearly.6160.e: "พวกเขาเป็นเด็ก! เรื่องแบบนี้เกิดขึ้นได้"
 bp2_yearly.6160.e.tt: "ปล่อยให้เจ้าพวกก่อปัญหานี้พักผ่อนเถิด ไม่มีเรื่องอื้อฉาวใดๆ ที่นี่"

 labored_with_the_commons_modifier: "เคยทำงานกับสามัญชน"
 labored_with_the_commons_modifier_desc: "เป็นที่รู้กันว่าเคยทำงานหนักท่ามกลางเด็กเลี้ยงม้าและคนผสมพันธุ์ม้า เพื่อชดใช้ความผิดพลาดในวัยเยาว์"

 renowned_knowledge_of_horses_modifier: "ความรู้เรื่องม้าอันเลื่องชื่อ"
 renowned_knowledge_of_horses_modifier_desc: "หลายคนขอพึ่งพาภูมิปัญญาของตัวละครนี้ในการรักษาอาการป่วยและส่งเสริมความแข็งแกร่งของม้า"

 
 bp2_yearly.6200.t: "ที่ ซึ่ง [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] รู้จักสันติภาพ"
 bp2_yearly.6200.desc: "ขณะที่สภาของข้ากำลังวางแผนป้องกัน [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ตัวประกันของข้า [hostage.GetName] ก็ถูกนำตัวเข้ามา\n\n"ท่าน [ROOT.Char.GetTitleAsName] ผู้สูงศักดิ์ ท่านปฏิบัติต่อข้าอย่างดีและยุติธรรม เมื่อความพินาศกำลังคุกคาม เป็นการถูกต้องหรือไม่ที่ใน [home_court.GetPrimaryTitle.GetNameNoTier] บ้านเกิดของข้า เหล่า [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] จะอยู่นิ่งเฉย ธงของพวกเขาถูกม้วนเก็บ?"\n\n[hostage.GetSheHe|U] คุกเข่าลง\n\n"โปรดอนุญาตให้ข้าเดินทาง - ข้าจะนำคำร้องขอความช่วยเหลือของเราไปให้ [home_court.GetTitledFirstName]! ข้าคือสายเลือดของ [home_court.GetHerHis] [home_court.GetSheHe|U] จะสนับสนุนท่าน เพื่อเห็นแก่ข้า!""
 bp2_yearly.6200.a: "ไปเถิด และกลับมาพร้อมกับเหล็กกล้า"
 bp2_yearly.6200.a.tt: "โปรดจงซื่อสัตย์! โปรดช่วยข้าในยามคับขันนี้!"
 bp2_yearly.6200.hostage_travel: "[hostage.GetShortUIName] จะเดินทางไปยัง [home_court.GetCapitalLocation.GetTitle.GetName]"
 bp2_yearly.6200.hostage_warning: "@alert_icon! #alert_trial [hostage.GetShortUIName] อาจสิ้นสุดการเป็น [hostage|E] ของท่าน#!"
 bp2_yearly.6200.war_positive: "[home_court.GetShortUIName] อาจช่วยเหลือใน [war|E] ของท่าน"
 bp2_yearly.6200.b: "นำของขวัญชั้นดีติดตัวไปด้วย"
 bp2_yearly.6200.b.tt: "ความเอื้อเฟื้อจะกระตุ้นความกระหายสงครามของ [home_court.GetTitleAsNameNoTooltip]"
 bp2_yearly.6200.c: "จงพา [target_knight.GetFirstNameNoTooltip] ผู้ภักดีไปด้วยและเร่งเดินทาง!"
 bp2_yearly.6200.war_very_positive: "#P [home_court.GetShortUIName] มีแนวโน้มที่จะช่วยเหลือใน [war|E] ของท่านมากขึ้น#!"
 bp2_yearly.6200.c.tt: "ผู้ดูแลที่แข็งแกร่ง... และใครบางคนที่จะ ทำให้แน่ใจว่า [hostage.GetFirstNameNoTooltip] จะไม่ลืมผลประโยชน์ของข้า"
 bp2_yearly.6200.hostage_positive: "#P [hostage.GetShortUIName] มีแนวโน้มที่จะกลับมายัง [court|E] ของท่านมากขึ้น#!"
 bp2_yearly.6200.hostage_travel_knight: "[hostage.GetShortUIName] และ [target_knight.GetShortUIName] จะเดินทางไปยัง [home_court.GetCapitalLocation.GetTitle.GetName]"
 bp2_yearly.6200.imprison_warning: "@alert_icon! #alert_trial [target_knight.GetShortUIName] อาจถูกคุมขังโดย [home_court.GetShortUIName]#!"
 bp2_yearly.6200.d: "ไม่ ข้าไม่อาจอนุญาตให้ตัวประกันจากไปได้"
 bp2_yearly.6200.d.tt: "ไม่มีหลักประกันใดๆ ว่าเจ้าจะกลับมา! ไม่มีหลักประกันว่า [home_court.GetTitledFirstNameNoTooltip] จะไม่ให้ความช่วยเหลือแก่ศัตรูของข้า"

 bp2_yearly.6202.t: "[hostage.Custom2('AppropriateGreeting', ROOT.Char )]"
 bp2_yearly.6202.opening: "ข้าอยู่ใน [home_court.GetCapitalLocation.GetTitle.GetNameNoTier] อีกครั้ง"
 bp2_yearly.6202.assembled_nobles: "เหล่าขุนนางผู้มีเกียรติเข้าเฝ้าเรียงรายในราชสำนักของ [home_court.GetTitleAsNamePossessive] ขณะที่ข้ากล่าวคำร้องขอของท่าน\n\n"
 bp2_yearly.6202.nostalgia: "สายลมพัดผ่านหมู่ไม้ที่คุ้นเคย ข้าได้แจ้งเรื่องความขัดแย้งของท่านให้ที่นี่ทราบแล้ว\n\n"
 bp2_yearly.6202.impatient: "เหล่าขุนนางชั้นผู้น้อย ผู้ ซึ่งรู้จักข้าเพียงเมื่อครั้งยังเป็นทารก ต่างส่งเสียงออดอ้อนเมื่อข้าเริ่มกล่าวคำร้องขอของท่าน แล้วจึงเงียบไป\n\n"

 bp2_yearly.6202.received_empathy: "ผู้ที่มาชุมนุมต่างร่ำไห้ให้กับโชคร้ายของ [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้าดูเหมือนจะสะเทือนใจอย่างยิ่ง"
 bp2_yearly.6202.received_debate: "การโต้เถียงเริ่มรุนแรงขึ้น [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้า แม้จะไม่ใช่พันธมิตรของท่าน แต่ก็ต้องการเป็นผู้ปกป้องครอบครัวของ [home_court.GetHerHis]"
 bp2_yearly.6202.received_scorn: ""ด้วยสิทธิ์อันใดที่ [ROOT.Char.GetSheHe] ร้องขอความช่วยเหลือจากเรา?" ข้าถูกถาม และแทบไม่มีคำตอบ [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้าดูเหมือนจะไม่พอใจ"
 bp2_yearly.6202.received_apathy: "บางคนไม่สนใจเลย ขณะที่ [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] บางส่วนรวมตัวกันรอฟังคำตัดสินของ [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้า [home_court.GetSheHe|U] ถามว่าข้าหวังจะออกเดินทางเมื่อใด"

 bp2_yearly.6202.fears_returning: "— และ [home_court.GetSheHe] กลัวการกลับไปสู่ดินแดนที่วุ่นวายของท่าน"
 bp2_yearly.6202.awaiting: "— แต่เรายังคงรอคำตัดสินของ [home_court.GetHerHis]"
 bp2_yearly.6202.want_to_stay: "— แต่ [home_court.GetSheHe] ฉลาดเกินกว่าจะตัดสินใจอย่างรวดเร็ว"
 bp2_yearly.6202.want_to_return: "— แต่ [home_court.GetSheHe] ทำให้ข้าต้องอยู่ที่นี่ต่อไป ขณะที่สงครามยังคงดำเนินอยู่!"
 bp2_yearly.6202.a: "อย่างน้อย [hostage.GetFirstNameNoTooltip] ก็ยังมีชีวิตอยู่"

 bp2_yearly_6203_army_name: "กองทัพ [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetHomeCourt.GetPrimaryTitle.GetAdjectiveNoTooltip] ของ [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetFirstNamePossessiveNoTooltip]"

 bp2_yearly.6203.t: "[ROOT.Char.GetNameNoTooltip],"
 bp2_yearly.6203.join_war: "[home_court.GetPrimaryTitle.GetNameNoTier] ยืนหยัดเคียงข้างท่าน! [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้า [home_court.GetTitledFirstName] ผู้ไร้ความกลัว จะให้เกียรติสายสัมพันธ์ระหว่างท่านและ [home_court.GetSheHe] ด้วยกำลังอาวุธ\n\nอย่าให้ผู้ใดคุกคามท้องพระโรงที่ให้ที่พักพิงแก่ชาว [hostage.GetDynastyHouseName]!\n\n"
 bp2_yearly.6203.assist: "เป็นเรื่องน่าเศร้าสำหรับ [home_court.GetName] ที่ [home_court.GetSheHe] ไม่สามารถมาช่วยเหลือท่านได้ อย่างไรก็ตาม ด้วยคำมั่นสัญญาแห่งสงครามและความรุ่งโรจน์ของมัน เราได้รวบรวมกองกำลังของนักรบพเนจรที่ยากไร้และนักผจญภัยชาว [home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]! ขอให้พวกเขาต่อสู้อย่างดีเพื่อ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]\n\n"
 bp2_yearly.6203.betray: "เราไม่อาจเพิกเฉยต่อความอ่อนแอที่ปรากฏในคำร้องขอของท่านได้ [home_court.GetTitledFirstName] จะเชื่อมั่นในความแข็งแกร่งของศัตรูของท่านแทน จงเตรียมพร้อมรับการมาถึงของ [home_court.GetHerHis]\n\nหลังจากที่ [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้าปล้นเมืองหลวงของท่านแล้ว ท่านอาจจะได้พบข้าในราชสำนักของท่านอีกครั้ง"
 bp2_yearly.6203.decline: "ข้าทำเท่าที่ทำได้แล้ว แต่ [home_court.GetTitledFirstName] เห็นข้อดีเพียงเล็กน้อยในข้อโต้แย้งของท่าน หากไม่มีพันธมิตร [home_court.GetPrimaryTitle.GetNameNoTier] ทั้งหมดก็จะไม่เคลื่อนทัพเมื่อ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] เรียกหา [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] ของข้าขอบคุณท่านที่ส่งข้ามาหา [home_court.GetHerHim] และฝากความระลึกถึงมายัง [home_court.GetHerHis]\n\n"
 bp2_yearly.6203.dont_keep_knight: "ที่ของข้าอยู่ในราชสำนักของท่าน ดังนั้น [target_knight.GetFirstName] และข้าจะกลับไปในไม่ช้า"
 bp2_yearly.6203.dont_keep: "ที่ของข้าอยู่ในราชสำนักของท่าน ดังนั้นข้าจะกลับไปในไม่ช้า"
 bp2_yearly.6203.keep: "แต่ข้าไม่ใช่ตัวประกันของท่านอีกต่อไปแล้ว"

 bp2_yearly.6203.a: "ขอให้พวกเขาได้รับพร! สายสัมพันธ์ของเราอยู่เหนือการเป็นตัวประกัน"
 bp2_yearly.6203.a.tt: "และ [home_court.GetFirstNameNoTooltip] จับอาวุธขึ้นปกป้องญาติ ตอบรับคำร้องขอของผู้ที่ต้องการความช่วยเหลือ — [home_court.GetSheHe] ดูเหมือนจะเป็นมิตรที่ดี"
 bp2_yearly.6203.b: "#EMP การทรยศ!#! ข้าจะ ทำให้แผ่นดินชุ่มโชกไปด้วยเลือด!"
 bp2_yearly.6203.b.tt: "ข้าจะพิชิตศัตรูทั้งปวง และล้างแค้นให้จงได้!"

 bp2_yearly.6203.c.positive: "สู่สงคราม [hostage.GetFirstNameNoTooltip]! #EMP สู่สงคราม!#!"
 bp2_yearly.6203.c.negative: "ข้าช่างโง่เขลาที่ส่ง [hostage.GetHerHim] ไปให้พ้นสายตา..."
 bp2_yearly.6203.c.tt: "ข้าปกป้องเจ้า แต่เจ้าปกป้องอาณาจักรทั้งมวล!"

 from_victory_vengeance_modifier: "จากชัยชนะ สู่การล้างแค้น"
 from_victory_vengeance_modifier_desc: "ตัวละครนี้ขับเคลื่อนกองทัพและอัศวินสู่ความโหดเหี้ยมป่าเถื่อน มุ่งมั่นที่จะล้างแค้นการทรยศในอดีตสักวันหนึ่ง"

 bp2_yearly.6204.t: "คำร้องขอจากสายเลือดของข้า"
 bp2_yearly.6204.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstName] ผู้เปรอะเปื้อนไปด้วยฝุ่นจากถนนและกลิ่นเหงื่อม้า ได้กลับมาอย่างไม่คาดฝัน!\n\n"ข้าไม่ได้เป็นอันตรายต่อสัญญาสงบศึกของท่าน [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))]" [hostage.GetSheHe] หอบหายใจ "สงครามไม่ได้มาที่นี่! ไม่เลย สงครามอันน่าสะพรึงกลัวกำลังมาเยือน [warden.GetPrimaryTitle.GetNameNoTier] — สู่ท้องพระโรงที่ข้าถูกกักขังเป็นตัวประกัน!"\n\n"
 bp2_yearly.6204.desc_gift: "[hostage.GetSheHe|U] มอบทั้งสาส์นและถุงทองคำจาก [warden.GetTitledFirstName]"
 bp2_yearly.6204.desc_chaperone: "สหายผู้ระแวดระวังของ [hostage.GetHerHis|U] [target_knight.GetName] มอบสาส์นจาก [warden.GetTitledFirstName]"
 bp2_yearly.6204.desc_outro: "\n\n"ท่านไม่มีภาระผูกพันที่จะต้องช่วยเหลือ" [hostage.GetFirstNameNoTooltip] กล่าว "แต่ผู้ดูแลของข้าดีต่อข้ามาก! [warden.GetSheHe|U] ไม่สมควรที่จะถูกทำลายโดย [attacker.GetName]!""
 bp2_yearly.6204.desc_none: "[hostage.GetSheHe|U] มอบสาส์นจาก [warden.GetTitledFirstName]"
 bp2_yearly.6204.a: "ไปเอา [ROOT.Char.Custom('signature_weapon')] ของข้ามา! #EMP พวกเราชาว [ROOT.Char.GetDynastyHouseNameNoTooltip] จะสู้!#!"
 bp2_yearly.6204.a.tt: "อย่าให้ผู้ใดคุกคามท้องพระโรงที่ให้ที่พักพิงแก่ญาติของข้า!"
 bp2_yearly.6204.b: "ข้าจะช่วยจ่ายเงินและจัดหาอาวุธให้กองกำลัง"
 bp2_yearly.6204.b.tt: "รวบรวมเยาวชนติดอาวุธและนักรบพเนจรที่ยากไร้เพื่อส่งไปกับ [hostage.GetFirstNameNoTooltip]! พวกเขาสามารถต่อสู้ได้โดยไม่ต้องให้ข้าเข้าไปเกี่ยวข้องอย่างเป็นทางการ"
 bp2_yearly.6204.c: "การป้องกัน [warden.GetPrimaryTitle.GetNameNoTierNoTooltip] ไม่ใช่หน้าที่ของข้า"
 bp2_yearly.6204.c.tt: "เราเพียงแค่มีสัญญาสงบศึก เราไม่ใช่พันธมิตร!"
 
 bp2_yearly.6205.t: "สู่ดินแดนแห่งความขัดแย้ง"
 bp2_yearly.6205.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้า [hostage.GetFirstName] ปีนขึ้นบนหลังม้าของ [hostage.GetHerHis] เงียบสงัด เบื้องหน้าคือ [warden.GetCapitalLocation.Custom('TerrainTypeProvince')] แห่ง [warden.GetCapitalLocation.GetTitle.GetNameNoTier] — ที่ ซึ่ง [attacker.Custom('KnightCulturePluralNoTooltip')|l] ชาว [attacker.GetPrimaryTitle.GetAdjective] ที่น่าสะพรึงกลัวอาจรออยู่\n\n"
 bp2_yearly.6205.desc_gift: "คลังสมบัติของข้าเต็มไปด้วยของขวัญของ [warden.GetTitledFirstNamePossessive] แต่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้ากลับขี่ม้าเข้าสู่สงครามเพียงลำพัง\n\n"
 bp2_yearly.6205.desc_chaperone: "[target_knight.GetFirstName], [warden.Custom2('RelationToMeShort', SCOPE.sC('target_knight'))] ของ [warden.GetTitledFirstNamePossessive], จะเป็นผู้คุ้มกันเพียงคนเดียวของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))] ของข้า กุมบังเหียนไว้แนบหัวใจของ [target_knight.GetHerHis] [target_knight.GetSheHe] สาบานว่าจะตายเพื่อครอบครัวของข้า หากถึงคราวนั้น\n\n"
 bp2_yearly.6205.desc_none: "เยาวชนมอซอบางคนได้รวมตัวกันเพื่อรับใช้ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))] ของข้า แต่กองทัพทั้งหมดของข้าจะยังคงอยู่ที่นี่... ขณะที่ [hostage.GetFirstNameNoTooltip] ขี่ม้าเข้าสู่สงครามของ [warden.GetTitledFirstNamePossessive]\n\n"
 bp2_yearly.6205.desc_outro: "แต่ — เป็น [warden.GetFirstNameNoTooltip] เองที่นำภาพอันน่าสยดสยอง เช่นนี้มาให้ข้าเห็น! [warden.GetWomanMan] ผู้อ่อนแอ [warden.GetSheHe] ส่งแขกผู้มีเกียรติ เช่น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้าไปหมอบกราบเพียงแค่เสียงดาบกระทบกัน!\n\nและข้าจะต้องเชื่อใจ #EMP หนอน#! ตัวนี้และพรรคพวกของ [warden.GetHerHis] ให้ปกป้องญาติของข้างั้นหรือ?"
 
 bp2_yearly.6205.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้าจะอยู่ที่นี่"
 bp2_yearly.6205.b: "ข้าจะ ทำให้ [warden.GetFirstNameNoTooltip] ต้องทนทุกข์ทรมานกับการดูถูกนี้!"
 bp2_yearly.6205.c: "เอาล่ะ... โชคดี [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]"

 bp2_yearly.6170.t: "สัญญาผูกมัดกับพวกไร้อารยธรรม"
 bp2_yearly.6170.desc: ""ไม่มีชาว [ROOT.Char.GetDynastyHouseName] คนใดพอใจกับสิ่งที่ท่านทำ!" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ของข้า [kin.GetFirstName] กล่าวเสียงกร้าว\n\n"ท่านส่ง [hostage.GetName] [kin.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ผู้ [hostage.Custom('ComplimentAdjective')] ของข้า ไปยังท้องพระโรงอันเหม็นสาบ ที่ ซึ่งคนป่าเถื่อนเอ่ยคำว่า '[warden.Custom('CulturalCurse')|U]!' และไม่เคยเอ่ย 'สรรเสริญ [ROOT.Char.GetFaith.HighGodName]' ได้อย่างไร? ที่ ซึ่งสุนัขถ่ายอุจจาระอย่างอิสระใส่ทั้งคนป่าและขุนนางชาว [warden.GetCulture.GetName] ท้องถิ่น?"\n\nจริงอยู่ที่ [warden.GetName] ไม่ใช่ชาว [ROOT.Char.GetCulture.GetName] ผู้มีวัฒนธรรม แต่ถึงกระนั้นก็ค่อนข้างมีค่า—\n\n"[hostage.GetFirstNameNoTooltip] ถูกจับเป็นตัวประกันในกระท่อม!" [kin.GetFirstNameNoTooltip] กรีดร้อง "#EMP จงดูแลความต้องการของ [hostage.GetHerHis]!#! สิทธิ์ของ [hostage.GetHerHis] ในฐานะ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!"
 bp2_yearly.6170.a: "ใช่ มันเป็นการดูหมิ่นศักดิ์ศรีของ [hostage.GetHerHis] และของข้า"
 bp2_yearly.6170.a.tt: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้าต้องได้รับความสะดวกสบายอันซับซ้อนเหมือนอยู่บ้าน!"
 bp2_yearly.6170.b: "หน้าที่ต่อครอบครัวผูกมัดพวกเจ้าทุกคน"
 bp2_yearly.6170.b.tt: "การเสียสละของ [hostage.GetFirstNamePossessiveNoTooltip] ควรเป็นเพียงหนึ่งในการเสียสละมากมายเพื่อรับใช้ตระกูล [ROOT.Char.GetDynastyHouseNameNoTooltip]"
