l_english: 
 bp2_hostage_system.0100.t: "ด้วยทุกวิถีทาง"
 bp2_hostage_system.0100.intro: "เมื่อ [war.Custom('WarCasusBelliShort')] ของข้าได้เริ่มขึ้นแล้ว ชะตากรรมของตัวประกันของข้า [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของ [hostage_home_court.GetTitledFirstNamePossessive] ยังคงต้องตัดสินใจ\n\n"
 bp2_hostage_system.0100.desc: "ความเสียหายใดๆ ที่ข้าสามารถสร้างให้กับเหล่ามารร้าย [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip] ล้วนมีประโยชน์ และ [hostage_home_court.GetFirstNameNoTooltip] มีเพียง [hostage_home_court.GetHerselfHimself] เท่านั้นที่ต้องตำหนิ"
 bp2_hostage_system.0100.executed_hostage: "มารร้ายตนนั้นประหาร [victim.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] ของข้า ความยุติธรรมเรียกร้องให้ข้าไร้ความปรานี..."
 bp2_hostage_system.0100.spared_hostage: "[hostage_home_court.GetFirstNameNoTooltip] แสดงความเมตตาต่อ [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า บางทีการปล่อยให้ข้อพิพาทของเราตัดสินกันในสนามรบอาจสมควรแล้ว..."
 bp2_hostage_system.0100.my_hostage: "\n\nแต่แล้ว [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้าเล่า — [my_hostage.GetSheHe] อยู่ในกำมือของ [hostage_home_court.GetTitledFirstNamePossessiveNoTooltip]..."
 bp2_hostage_system.0100.a: "ข้าตัดสินใจแล้ว"
 bp2_hostage_system.0100.b: "[hostage.GetFirstNameNoTooltip] ปลอดภัย สำหรับตอนนี้"

 bp2_hostage_system.0110.t: "คำสัญญาที่ว่างเปล่า"
 bp2_hostage_system.0110.desc: "แม้ว่าจะส่ง [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของ [hostage_home_court.GetHerHis] มายังราชสำนักของข้า [hostage_home_court.GetTitledFirstName] ไอ้ [hostage_home_court.Custom2('InsultNoun', ROOT.Char)] ผู้ทรยศ กลับก่อสงครามกับข้าจาก [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip]\n\n[hostage_home_court.GetSheHe|U] คงคิดว่าข้าใจเสาะ หรือไม่ก็ไม่ใส่ใจในสวัสดิภาพของ [hostage.GetFirstNamePossessiveNoTooltip] เลย ถึงได้กล้าทำ [war.Custom('WarCasusBelliShort')] กับผู้ดูแลตัวประกันของ [hostage_home_court.GetHerHis]..."
 bp2_hostage_system.0110.a: "[hostage_home_court.GetFirstNameNoTooltip] เลือกทางของ [hostage_home_court.GetHerHis] แล้ว"
 bp2_hostage_system.0110.b: "อย่าเพิ่งรีบร้อน..."
 
 bp2_hostage_system.0120.t: "ศัตรูของสหายข้า"
 bp2_hostage_system.0120.intro: "เหตุการณ์บีบคั้นตัวประกันของข้า [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของ [hostage_home_court.GetTitledFirstNamePossessive] แม้ข้าจะรับ [hostage.GetHerHis] เข้ามาในราชสำนักด้วยเจตนาอันมีเกียรติ ข้าก็มีภาระผูกพันอื่นที่ต้องรักษาใน [war.Custom('WarCasusBelliShort')] ของ [war_joiner_ally.GetTitledFirstNamePossessive]...\n\n"
 bp2_hostage_system.0120.desc: "สันติภาพกับ [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip] คือเป้าหมายของข้า แต่บัดนี้ไม่มีสิ่งใดจะทำได้อีกแล้ว ความเมตตาอาจรักษาความไว้วางใจไว้ได้ระดับหนึ่ง แต่กระนั้น ทุกสิ่งย่อมยุติธรรมในยามสงคราม"
 bp2_hostage_system.0120.a: "สถานการณ์เปลี่ยนไปแล้ว"
 bp2_hostage_system.0120.b: "นี่เป็นเรื่องระหว่าง [war_joiner_ally.GetFirstNameNoTooltip] และ [hostage_home_court.GetFirstNameNoTooltip]..."

 bp2_hostage_system.0130.t: "สหายของศัตรูข้า"
 bp2_hostage_system.0130.desc: "ข้าได้ทราบว่า [hostage_home_court.GetTitledFirstName] เข้าร่วมกับศัตรูของข้า [war_joiner_ally.GetTitledFirstName] อย่างโง่เขลา แม้จะส่ง [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของ [hostage_home_court.GetHerHis] มาเป็นตัวประกันของข้า\n\n[war.Custom('WarCasusBelliShort')] อันเล็กน้อยนี้ได้เผยให้เห็นคุณค่าของคำสัญญาแห่งสันติภาพของ [hostage_home_court.GetHerHis] นับประสาอะไรกับการไม่แยแสอย่างเลือดเย็นต่อ [hostage.GetFirstNameNoTooltip] ของ [hostage_home_court.GetHerHis]"
 bp2_hostage_system.0130.a: "ข้าไม่ขู่เข็ญอย่างไร้สาระ"
 bp2_hostage_system.0130.b: "เรื่องราวไม่ได้มีแค่ขาวกับดำ"

 bp2_hostage_system.0140.opening: "[executioner.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0140.attacker: "ความพยายามอันน่าสังเวชของท่านที่จะหลอกลวงข้าด้วยคำสัญญาแห่งสันติภาพของท่านสิ้นสุดลงในวันนี้ ขอให้ [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของท่าน จงพบสันติสุขยิ่งขึ้นใน [executioner.GetFaith.PositiveAfterLife]"
 bp2_hostage_system.0140.defender: "การรุกรานอันไร้เกียรติของท่าน แม้หลังจากส่ง [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของท่าน มาเป็นตัวประกันของข้า มีเพียงการตอบสนองเดียวเท่านั้น ขอให้ทั้ง [hostage.GetSheHe] และ [executioner.GetFaith.HighGodName] อภัยให้ท่าน"
 bp2_hostage_system.0140.attacker_ally: "เราพบว่าตนเองอยู่ในภาวะสงครามด้วยเหตุของ [war_joiner_ally.GetTitledFirstName] และด้วยเหตุนี้ ชีวิตของตัวประกันของข้า [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของท่าน จึงถูกริบ"
 bp2_hostage_system.0140.defender_ally: "การทรยศของเจ้าได้คร่าชีวิต [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของเจ้า, [hostage.GetFirstName], ชีวิต [hostage.GetHerHis] ไปแล้ว ข้าเพียงหวังว่ามิตรภาพของเจ้ากับ [war_joiner_ally.GetTitledFirstName] จะคุ้มค่า"
 bp2_hostage_system.0140.a.attacker: "คิดไม่ถึง..."
 bp2_hostage_system.0140.a.defender: "เจ้าจะต้องชดใช้..."
 bp2_hostage_system.0140.a.attacker_ally: "[executioner.GetSheHe] ทำได้อย่างไร..."
 bp2_hostage_system.0140.a.defender_ally: "ใจดำอำมหิต..."

 bp2_hostage_system.0141.opening: "[hostage_sparer.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0141.intro: "ข้าตัดสินใจไว้ชีวิต [hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของท่าน,"
 bp2_hostage_system.0141.attacker: "เพราะ [hostage.GetSheHe] เป็นเพียงเบี้ยผู้บริสุทธิ์ในเกมหลอกลวงของท่าน"
 bp2_hostage_system.0141.defender: "แม้ท่านจะโจมตีอย่างทรยศโดยดูหมิ่นกติกาสัญญาของเรา"
 bp2_hostage_system.0141.attacker_ally: "เพราะ [hostage.GetSheHe] ไม่จำเป็นต้องทนทุกข์ เพราะ [war_joiner_ally.GetTitledFirstNamePossessive]"
 bp2_hostage_system.0141.defender_ally: "เพราะ [hostage.GetSheHe] ไม่จำเป็นต้องทนทุกข์ เพราะ [war_joiner_ally.GetTitledFirstNamePossessive]"
 bp2_hostage_system.0141.request: "\n\nข้าเชื่อว่าท่านจะแสดงความเมตตา เช่นเดียวกันต่อ [my_hostage.GetFirstName] [spared.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า"
 bp2_hostage_system.0141.a.attacker: "ขอบคุณ [ROOT.Char.GetFaith.HighGodName]..."
 bp2_hostage_system.0141.a.defender: "บางที [hostage_sparer.GetSheHe] อาจไม่ใช่คนเลวร้ายไปเสียทั้งหมด..."
 bp2_hostage_system.0141.a.attacker_ally: "โล่งอกไปที..."
 bp2_hostage_system.0141.a.defender_ally: "อย่างน้อยก็ยังดี..."

 bp2_hostage_system.0200.t: "เติบโตเต็มวัย"
 bp2_hostage_system.0200.desc: "ตัวประกันของข้า [hostage.GetFirstName] บัดนี้เป็น [hostage.GetWomanMan] แล้ว และตั้งตารอที่จะถูกส่งกลับบ้านในไม่ช้าตามธรรมเนียม [hostage_home_court.GetTitledFirstName] [hostage.Custom2('RelationToMe', SCOPE.sC('hostage_home_court'))] ของ [hostage.GetHerHis|U] ก็คงหวัง เช่นนั้นเป็นแน่"
 bp2_hostage_system.0200.my_hostage: "\n\nบางทีการรักษาไมตรีจิตไว้อาจดีกว่า อย่างน้อยก็ ในขณะที่ [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า ยังคงอยู่ในเงื้อมมือของ [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 bp2_hostage_system.0200.closing: "\n\nอย่างไรก็ตาม ข้าต้องคำนึงถึงผลประโยชน์ของตระกูล #EMP ของข้า#! เอง"
 bp2_hostage_system.0200.a: "เก็บข้าวของของเจ้า ถึงเวลากลับบ้านแล้ว"
 bp2_hostage_system.0200.b: "[hostage.GetFirstNameNoTooltip] ต้องอยู่ต่ออีกสักหน่อย"
 bp2_hostage_system.0200.b.my_hostage: "เมื่อ [my_hostage.GetFirstNameNoTooltip] กลับมาแล้ว [hostage.GetFirstNameNoTooltip] ก็จะได้กลับ เช่นกัน"
 hostage_more_likely_to_return_tt: "[hostage_home_court.GetTitledFirstName] มีแนวโน้มที่จะส่ง [my_hostage.GetFirstName] กลับมามากขึ้น"

 bp2_hostage_system.0201.desc: "[hostage.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของข้า ซึ่งถูกส่งไปเป็นตัวประกันของ [hostage_warden.GetPrimaryTitle.GetAdjectiveNoTooltip] ในที่สุดก็จะกลับมาเป็น [hostage.GetWomanMan] ที่เติบโตเต็มที่! กติกาสัญญากับ [hostage_warden.GetTitledFirstName] สิ้นสุดลงแล้ว แต่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] ของข้าปลอดภัยดี"
 bp2_hostage_system.0201.my_hostage_adult: "\n\n[my_hostage.GetFirstName] [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของ [hostage_warden.GetFirstNamePossessiveNoTooltip] ยังคงเป็นตัวประกันของข้า แม้จะเป็น [my_hostage.GetWomanMan] ที่เติบโตแล้ว และเฝ้ามองด้วยความอิจฉาอยู่บ้าง คงจะยุติธรรมหากจะส่ง [my_hostage.GetHerHim] กลับไป เช่นกัน..."
 bp2_hostage_system.0201.my_hostage: "\n\n[my_hostage.GetFirstName] [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของ [hostage_warden.GetFirstNamePossessiveNoTooltip] ยังคงเป็นตัวประกันของข้า แม้ว่า [my_hostage.GetSheHe] จะยังเป็นเพียง [my_hostage.Custom('GirlBoy')]"
 bp2_hostage_system.0201.a: "มีเรื่องมากมายที่ต้องพูดคุยกัน!"
 bp2_hostage_system.0201.b: "[my_hostage.GetFirstNameNoTooltip] ไปได้ เช่นกัน"
 bp2_hostage_system.0201.c: "บางทีเมื่อ [my_hostage.GetSheHe] โตขึ้น"
 bp2_hostage_system.0201.c.adult: "ข้าไม่คิด เช่นนั้น"

 bp2_hostage_system.0202.t: "การรอคอยการกลับมา"
 bp2_hostage_system.0202.desc: "ข้ารอคอยอย่างมีความหวังเมื่อวันเกิดของ [hostage.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของข้า ใกล้เข้ามา เนื่องจากเป็นธรรมเนียมที่ตัวประกันจะถูกส่งกลับบ้านเมื่อพวกเขาไม่ใช่เด็กอีกต่อไป\n\nอนิจจา ดูเหมือนว่าแผนของ [hostage_warden.GetTitledFirstNamePossessive] คือการเก็บ [hostage.GetFirstNameNoTooltip] ไว้ที่ [hostage_warden.GetCapitalLocation.GetNameNoTooltip] อีกสักพัก...\n\n"
 bp2_hostage_system.0202.a: "ต้องมีเหตุผลที่ดีแน่"

 bp2_hostage_system.0203.t: "กลับบ้านอีกครั้ง"
 bp2_hostage_system.0203.desc: "ข้ารอคอยการตอบกลับของ [hostage_home_court.GetTitledFirstNamePossessive] ด้วยความหวั่นใจ หลังจากส่ง [hostage.GetFirstName] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของ [hostage_home_court.GetHerHis] ไปตามทางของ [hostage.GetHerHis]\n\n"
 bp2_hostage_system.0203.closing: "อย่างไรก็ตาม การตอบกลับนั้นรวดเร็ว และ [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า ก็มาถึงประตูเมืองในไม่ช้า!"
 
 bp2_hostage_system.0204.t: "ติดอยู่ในสภาวะครึ่งๆ กลางๆ"
 bp2_hostage_system.0204.closing: "การตอบกลับนั้นชัดเจน; [hostage_home_court.GetSheHe] ต้องเก็บ [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า ไว้อย่างน่าเสียดายในอนาคตอันใกล้ เพื่อให้แน่ใจว่าสันติภาพจะดำเนินต่อไป..."
 bp2_hostage_system.0204.a: "[my_hostage.Custom('GirlBoy')] ผู้น่าสงสาร..."

 bp2_hostage_system.0300.t: "ในความดูแลของข้า"
 bp2_hostage_system.0300.intro: "การเดินทางอย่างปลอดภัยของตัวประกันคือความรับผิดชอบ คือคำสัตย์ของผู้ดูแล ข้าทำกติกาสัญญาแห่งเกียรติยศเพื่อปกป้อง [hostage.GetHerHim] จากอันตราย,"
 bp2_hostage_system.0300.killer: "และสังหาร [hostage.GetFirstName] ไปเสียสิ้น"
 bp2_hostage_system.0300.violent: "แต่ [hostage.GetFirstName] ได้พบจุดจบอันน่าสยดสยองในราชสำนักของข้า"
 bp2_hostage_system.0300.fallback: "และถึงกระนั้น [hostage.GetFirstName] บัดนี้ก็นอนตายเสียแล้ว"
 bp2_hostage_system.0300.desc: "\n\nไม่มีสิ่งใดจะทำได้; [hostage_home_court.GetTitledFirstName] จะต้องโกรธเกรี้ยวเมื่อข่าวไปถึงราชสำนัก [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip] และข้อตกลงของเราจะถูกโยนทิ้งไป"
 bp2_hostage_system.0300.my_hostage: "\n\nข้าเพียงหวังว่า [hostage_home_court.GetTitledFirstName] จะคิดให้ดีกว่านี้เกี่ยวกับการลงทัณฑ์ [my_hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] ของข้า"
 bp2_hostage_system.0300.a.killer: "โอ้ ช่างเถอะ..."
 bp2_hostage_system.0300.a.violent: "โชคร้ายอย่างที่สุด..."
 bp2_hostage_system.0300.a: "น่าเศร้าสลด..."

 bp2_hostage_system.0301.opening: "[hostage_warden.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0301.intro: "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่า [hostage.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))] ของท่าน เสียชีวิตแล้ว\n\n"
 bp2_hostage_system.0301.killer: "จงรู้ไว้ว่าข้าไม่มีทางเลือกอื่นนอกจากต้องปลิดชีวิต [hostage.GetHerHis]"
 bp2_hostage_system.0301.violent: "วิธีที่ [hostage.GetSheHe] จากโลกนี้ไป ขณะอยู่ภายใต้การคุ้มครองของข้า จะหลอกหลอนข้าไปตลอดกาล"
 bp2_hostage_system.0301.fallback: "โปรดอภัยให้ข้าที่ล้มเหลวอย่างสิ้นเชิงในหน้าที่ผู้ดูแลของ [hostage.GetHerHis]"
 bp2_hostage_system.0301.desc: "ข้าหวังว่าท่านจะให้อภัยข้าได้ในสักวันหนึ่ง เพื่อประโยชน์ของเราทั้งสองฝ่าย"
