 bp2_yearly.1051.t_twig: "$bp2_yearly.1050.t_builder$: สิ่งที่เหลืออยู่"
 bp2_yearly.1051.desc: "วันรุ่งขึ้นเมื่อข้ากลับไปที่ชายหาด ข้ารีบวิ่งไปยังจุดที่เมื่อวานนี้ปราสาทอันสง่างามของข้าตั้งตระหง่านอยู่เหนือทรายเปียก"
 bp2_yearly.1051.desc_desert: "เมื่อพายุสงบลงในวันรุ่งขึ้น ข้ารีบวิ่งออกไปยังจุดที่ข้าสร้างปราสาททรายอันสง่างามอย่างระมัดระวังเมื่อวันก่อน"
 bp2_yearly.1051.desc_twig: "ในรุ่งเช้า พายุสงบลงในที่สุด และข้ารีบวิ่งเข้าไปในพุ่มไม้เพื่อสำรวจความเสียหายที่เกิดขึ้นกับปราสาทกิ่งไม้อันงดงามของข้า"
 bp2_yearly.1051.outro: "\n\nส่วนใหญ่หายไป แต่มีสิ่งหนึ่งที่ยังคงยืนอยู่ — หอคอยที่สูงที่สุด พร้อมเครื่องหมายเล็กๆ ที่ข้าแกะสลักไว้อย่างระมัดระวัง #EMP สำเร็จ#! \n\nที่ฐานของมัน ข้าพบหินสีรุ้งก้อนเล็กๆ ฝังอยู่ในดินครึ่งหนึ่ง ข้าอาจจะคิดไปเอง แต่เมื่อข้าตรวจสอบใกล้ๆ ข้าเห็นรูปร่างของ... ค้อนเล็กๆ อย่างคลุมเครือ?"
 bp2_yearly.1051.a: "เจ้ารอบ #EMP นี้#! ไปก่อนนะ น้ำขึ้น"
 bp2_yearly.1051.a_twig: "เจ้ารอบ #EMP นี้#! ไปก่อนนะ พายุ"
 iridescent_stone_trinket: "หินสีรุ้ง"
 iridescent_stone_trinket.desc: "หินสีรุ้งเรียบเนียนที่พบใน [ROOT.Char.GetCurrentLocation.GetName] ดูเหมือนจะมีจุดสีดำเป็นรูปค้อนเล็กๆ อยู่ด้านหนึ่ง น่าสงสัย"
 #You are challenged to a den-building competition
 bp2_yearly.1055.t: "$bp2_yearly.1050.t_builder$: และแล้วพวกเขาก็..."
 bp2_yearly.1055.desc: "วันนี้หมดไปกับการเล่นนอกบ้านในป่า — โดยรวมแล้วเป็นวันที่น่ารื่นรมย์ทีเดียว — ทันใดนั้นข้าก็ถูกทาบทามโดย"
 bp2_yearly.1055.desc_related: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))] ของข้า [den_challenger.GetTitledFirstName]: "ข้าท้าเจ้าแข่งสร้างกระท่อม [den_challenger.Custom2('RelationToMeShort', ROOT.Char )]!""
 bp2_yearly.1055.desc_relations: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))] ของข้า [den_challenger.GetTitledFirstName]: "ข้าท้าเจ้าแข่งสร้างกระท่อม [ROOT.Char.GetFirstNameNoTooltip]!""
 bp2_yearly.1055.desc_liege: "เด็กท้องถิ่นคนหนึ่ง: "ข้าคือ [den_challenger.GetTitledFirstName] และข้าท้าท่านแข่งสร้างกระท่อม ท่าน [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!""
 bp2_yearly.1055.outro: "\n\n[den_challenger.GetSheHe|U] เดินกร่างไปมาและยิ้มเยาะเย้ยข้าอย่างมีชัย คาดหวังอย่างเต็มที่ว่าจะชนะ"
 bp2_yearly.1055.a: "ขอข้าเกณฑ์คนงานเหล่านี้ก่อน..."
 bp2_yearly.1055.a.flavor: "มันไม่ใช่การโกงถ้าจ่ายเงิน"
 bp2_yearly.1055.b: "เราสามารถสร้างกระท่อมที่แข็งแรงกว่า #EMP ด้วยกัน#! ได้!"
 bp2_yearly.1055.b.flavor: "ด้วยกำแพงสูง"
 bp2_yearly.1055.c: "ข้ายุ่งอยู่กับการสร้างแท่นบูชานี้ ไปให้พ้น"
 bp2_yearly.1055.c.flavor: "[ROOT.Char.GetFaith.HighGodName] เป็นผู้เดียวที่สามารถตัดสินงาน #EMP ของข้า#! ได้"
 #Follow-up: Things went down in the woods
 bp2_yearly.1056.t_economy: "$bp2_yearly.1050.t_builder$: ... มากมาย"
 bp2_yearly.1056.t_martial: "$bp2_yearly.1050.t_builder$: ... สอง"
 bp2_yearly.1056.t_pious: "$bp2_yearly.1050.t_builder$: ... เปียกโชก"
 bp2_yearly.1056.desc_economy: "การเกณฑ์เด็กหนุ่มในท้องถิ่นและจ่ายเงินให้พวกเขาด้วย [ROOT.Char.Custom('RegionalRootVegetablePlural')] ได้ผลอย่างน่าอัศจรรย์ในการสร้างกระท่อมที่รุ่งโรจน์ที่สุดในฝั่งนี้ของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]\n\n[den_challenger.GetTitledFirstName|U] มองดูสิ่งสร้างของข้าอย่างไม่พอใจและบ่นพึมพำขณะที่โครงสร้าง [den_challenger.GetWomanMan] คนเดียวอันเล็กน้อยของ [den_challenger.GetHerHis] แทบจะไม่สามารถกันฝนได้"
 bp2_yearly.1056.desc_martial: "[den_challenger.GetTitledFirstName] แข็งแกร่งอย่างน่าประหลาดใจ และระหว่างเราสองคน เราสร้างกระท่อมที่เหมาะสมและแข็งแรง — ทันเวลาพอดีที่สวรรค์จะเปิดออกและปล่อยฝนห่าใหญ่ลงมา\n\nสายฟ้าฟาดผ่านท้องฟ้า ไม่มีลูกใดตกกระทบ เนื่องจากเราได้รับการปกป้องจากกำแพงของกระท่อม\n\nขณะที่เรานั่งอยู่ในที่ซ่อนตัว แห้งและปลอดภัยด้วยการทำงานหนักของเรา ข้าอดไม่ได้ที่จะครุ่นคิดถึงคุณค่าของความเป็นน้ำหนึ่งใจเดียวกันและความเป็นสหาย"
 bp2_yearly.1056.desc_pious: "เมื่อข้าสวมมงกุฎแท่นบูชาด้วยกิ่งไม้เก่าแก่ ฝนก็เริ่มตกหนักลงมา บังคับให้เราต้องหาที่หลบภัย สายฟ้าขนาดใหญ่จากท้องฟ้าฟาดลงบนแท่นบูชาด้วยเสียงดัง *เปรี้ยง* และข้ารีบวิ่งไปประเมินความเสียหาย\n\nเมื่อแท่นบูชาปรากฏแก่สายตา กลุ่มควันจางๆ กำลังลอยออกมาจากกิ่งไม้ ซึ่งดำคล้ำที่ปลายด้านหนึ่งและได้รับรอยช้ำอย่างเหมาะสมจากการฟาด\n\nข้าสังเกตมันอย่างระมัดระวังขณะที่หยิบมันขึ้นมา มันยังคงอุ่นอยู่ในมือข้า"
 bp2_yearly.1056.a_economy: "การจ้างงานเป็น #EMP รากฐาน#! ของความเจริญรุ่งเรืองอย่างแท้จริง"
 bp2_yearly.1056.a_martial: "พันธมิตรคือการป้องกันที่ยอดเยี่ยม และกำแพงด้วย"
 bp2_yearly.1056.a_pious: "นี่เป็นสัญญาณจาก [ROOT.Char.GetFaith.HighGodNameAlternate] อย่างแน่นอน!"
 holy_stick: "กิ่งไม้ศักดิ์สิทธิ์"
 holy_stick.desc: "สร้างขึ้นระหว่างฟ้าผ่าใน [ROOT.Char.GetCurrentLocation.GetName] รอยดำเป็นรูปค้อนเล็กๆ ประทับอยู่ที่ด้าม"
 #Appreciate the architecture of your capital
 bp2_yearly.1060.t: "$bp2_yearly.1050.t_builder$: ทิวทัศน์ที่น่าจดจำ"
 bp2_yearly.1060.desc: "เมื่อไม่มีอะไรวางแผนไว้สำหรับวันนี้ นี่เป็นโอกาสอันดีที่จะเพิ่มพูนความรู้ในแง่มุมต่างๆ ของที่ดินอันรุ่งโรจน์ของเรา [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName]\n\nคำถามคืออะไรจะมีประสิทธิผลมากที่สุด — ข้าควรไปที่ค่ายทหารที่นำโดย [martial_character.GetTitledFirstName] เขตการค้าที่จัดการโดย [steward_character.GetTitledFirstName] หรือไปเยี่ยม [learned_character.GetTitledFirstName] ที่ [ROOT.Char.GetFaith.HouseOfWorship] ท้องถิ่น?"
 economical_architecture_book: "สถาปัตยกรรมแห่งการค้า"
 economical_architecture_book_desc: "พงศาวดารเกี่ยวกับประวัติศาสตร์ของท่าเรือการค้าและการวางตำแหน่ง"
 martial_architecture_book: "ปราสาทและข้ารับใช้"
 martial_architecture_book_desc: "พงศาวดารเกี่ยวกับศิลปะการสร้างปราสาท"
 religious_architecture_book: "เดอี กราเทีย"
 religious_architecture_book_desc: "ทะเบียนที่สร้างขึ้นอย่างพิถีพิถันของสถานที่สักการะที่น่าสังเกตใน [ROOT.Char.GetCurrentLocation.GetCounty.GetName] พร้อมบริเวณโดยรอบ"
 bp2_yearly.1060.a: "[steward_character.GetTitledFirstNameNoTooltip] ดูมีความรู้"
 bp2_yearly.1060.a.flavor: "อะไร ทำให้เป็นศูนย์กลางการค้าที่ดี?"
 bp2_yearly.1060.b: "ข้าควรตรวจสอบการป้องกันของเราที่ค่าย"
 bp2_yearly.1060.b.flavor: "การป้องกันที่ดีคือการรุกที่ดีที่สุด ... เดี๋ยวก่อน"
 bp2_yearly.1060.c: "ศรัทธาก่อน ไปที่ [ROOT.Char.GetFaith.HouseOfWorship] กันเถอะ"
 bp2_yearly.1060.c.flavor: "เราจะสร้างตัวเองให้ใกล้ชิดกับ [ROOT.Char.GetFaith.HighGodNameAlternate] ได้อย่างไร?"
 #Follow-up: You spend the day with WhatsTheirFace
 bp2_yearly.1061.t: "$bp2_yearly.1050.t_builder$: ก่อนอาทิตย์อัสดง"
 bp2_yearly.1061.desc_steward: "เราใช้เวลาทั้งวันเดินผ่านหอสมาคม ตรวจสอบการวางตำแหน่งของช่างฝีมือที่สัมพันธ์กับพื้นที่ตลาดของพวกเขาและแง่มุมทางเศรษฐกิจอื่นๆ ของการสร้างเมือง\n\n[architecture_character.GetTitledFirstName|U] เป็นผู้นำทางที่มีความรู้ พูดคุยเกี่ยวกับภาษีและค่าธรรมเนียม วาดภาพสถานะทางเศรษฐกิจปัจจุบันของเรา"
 bp2_yearly.1061.desc_martial: "วันนี้หมดไปกับการตรวจสอบอาวุธยุทโธปกรณ์ทางทหารของ [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName] จุดแข็ง — และแน่นอน — จุดอ่อนของมัน\n\nโซ่ใดๆ ก็แข็งแกร่งได้เท่ากับข้อต่อที่อ่อนแอที่สุดเท่านั้น [architecture_character.GetTitledFirstName] พูดซ้ำๆ ระหว่างการนำชม และข้าก็เห็นด้วย"
 bp2_yearly.1061.desc_religion: "ข้าจำวันที่สงบสุขและเงียบสงบกว่านี้ได้ยาก ขณะที่ [architecture_character.GetTitledFirstName|U] และข้าเดินเล่นผ่าน [ROOT.Char.GetFaith.HouseOfWorshipPlural] และศาลเจ้าของ [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName]\n\nมีอยู่ช่วงหนึ่ง [architecture_character.GetSheHe] หันมาหาข้าและพูดว่า: "ซุ้มประตูที่สร้างอย่างดีสามารถกระตุ้นจิตวิญญาณบางประเภทได้ — ท่านไม่คิด เช่นนั้นหรือ?""
 bp2_yearly.1061.outro: "\n\n[architecture_character.GetSheHe|U] จบการนำชมด้วยการมอบ [book_to_get.GetName] ให้ข้า ซึ่งเป็นวรรณกรรมที่เก่าแก่เกี่ยวกับหัวข้อนี้"
 bp2_yearly.1061.a: "วันนี้เป็นวันที่ดี"
 bp2_yearly.1061.a.flavor: "ข้าได้เรียนรู้มากมาย"
 #Your input is desired on the next building target
 bp2_yearly.1065.t: "$bp2_yearly.1050.t_builder$: พื้นที่ส่วนกลาง"
 bp2_yearly.1065.intro_parent: "ถึงเวลาที่จะต้องเปลี่ยนพื้นที่ส่วนกลางของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName] แล้ว และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] ของข้า [current_regent.GetTitledFirstName] ได้ขอให้ข้าแสดงความคิดเห็นในเรื่องนี้"
 bp2_yearly.1065.intro_regent: "ถึงเวลาที่จะต้องเปลี่ยนพื้นที่ส่วนกลางของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName] แล้ว และ [ROOT.Char.GetDiarchTitle|l] ของข้า [current_regent.GetTitledFirstName] ได้ขอให้ข้าแสดงความคิดเห็นในเรื่องนี้"
 bp2_yearly.1065.intro: "ถึงเวลาที่จะต้องเปลี่ยนพื้นที่ส่วนกลางของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName] แล้ว และข้าถูกขอให้แสดงความคิดเห็นในเรื่องนี้"
 bp2_yearly.1065.desc_parent_mayor: "\n\nผู้ปกครองของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] [province_holder.GetTitledFirstName] และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] ของข้า ได้มีการหารืออย่างเข้มข้นตลอดทั้งเช้าและตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.desc_parent: "\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] ของข้า และหัวหน้าช่างก่อสร้างของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] ได้มีการหารืออย่างเผ็ดร้อนตลอดทั้งเช้า และตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.desc_regent_mayor: "\n\nผู้ปกครองของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] [province_holder.GetTitledFirstName] และ [current_regent.GetFirstNameNoTooltip] ได้มีการหารืออย่างเข้มข้นตลอดทั้งเช้าและตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.desc_regent: "\n\n[current_regent.GetFirstNameNoTooltip] และหัวหน้าช่างก่อสร้างของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] ได้มีการหารืออย่างเผ็ดร้อนตลอดทั้งเช้า และตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.desc_mayor: "\n\nผู้ปกครองของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] [province_holder.GetTitledFirstName] และหัวหน้าช่างก่อสร้างของ [province_holder.GetHerHis] ได้มีการหารืออย่างเข้มข้นตลอดทั้งเช้าและตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.desc: "\n\nหัวหน้าช่างก่อสร้างและนายคลังของ [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] ได้โต้เถียงกันตลอดทั้งเช้าเกี่ยวกับสิ่งที่ควรปรับปรุงใหม่ และการหารือตอนนี้ถึงทางตันแล้ว"
 bp2_yearly.1065.outro: "\n\nขณะที่ข้าเข้าไปในห้อง พวกเขาหันมาสนใจข้า เห็นได้ชัดว่าคาดหวังคำตอบสำหรับคำถามนี้"
 bp2_yearly.1065.a: "เราควรเน้นการค้าและการผลิต"
 bp2_yearly.1065.a.flavor: "เศรษฐกิจที่เฟื่องฟูเป็นสิ่งที่ดีสำหรับทุกคน"
 bp2_yearly.1065.b: "ที่ดินต้องการกำลังทหารมากขึ้น"
 bp2_yearly.1065.b.flavor: "ความรุนแรงเล็กน้อยสามารถแก้ปัญหาใดๆ ได้"
 bp2_yearly.1065.c: "ความกระตือรือร้นอีกเล็กน้อยจะเป็นประโยชน์เท่านั้น"
 bp2_yearly.1065.c.flavor: "ศรัทธาคือทั้งหมดที่เราต้องการ"
 bp2_yearly.1065.c.tt: "#X สิ่งนี้จะเปลี่ยน [holding_type|E] รวมถึงลบสิ่งก่อสร้างที่ไม่ถูกต้องใดๆ ใน [1065_province_for_building.GetName]#!"
 #All of our efforts have culminated into _this_
 bp2_yearly.1070.t: "$bp2_yearly.1050.t_builder$: ความหมายในซุ้มประตู"
 bp2_yearly.1070.intro: "หลายปีที่ข้าใช้ไปกับการศึกษางานก่อสร้าง — ตั้งแต่การสร้างปราสาทจำลองเมื่อยังเด็ก กระท่อมในป่า การศึกษาสถาปัตยกรรมอันยิ่งใหญ่ของ [sightseed_capital.GetName] และการให้คำแนะนำเกี่ยวกับการขยาย [constructed_building_in.GetName] ท่ามกลางสิ่งอื่นๆ — ได้นำข้ามาสู่ช่วงเวลานี้"
 bp2_yearly.1070.desc: "\n\nถึงเวลาแล้วที่จะสร้างชื่อเสียงให้กับโลกด้วยการก่อตั้งที่ดินใหม่ในจังหวัด [1070_province_to_build_in.GetName] และมันขึ้นอยู่กับข้าที่จะตัดสินใจทิศทางของเรา"
 bp2_yearly.1070.desc_no_province: "\n\n[1070_province_to_buff.GetName] ต้องการการปรับปรุงเล็กน้อย และมันขึ้นอยู่กับข้าที่จะใช้ความรู้ของข้าและปรับปรุงที่ดินตามที่เป็นอยู่"
 bp2_yearly.1070.desc_no_province_no_buff: "\n\nและ ในขณะที่อาณาเขตของข้าบริสุทธิ์และไม่ต้องการงานฝีมือหรือการปรับปรุงเพิ่มเติมใดๆ ข้าก็รู้สึกสับสนกับคำถามที่ค้างคาอยู่ในใจ — แก่นแท้ของการก่อสร้างอยู่ที่ไหน? เศรษฐกิจ? ศรัทธา?"
 bp2_yearly.1070.a: "เมืองจะเป็นทางเลือกที่สมเหตุสมผล"
 bp2_yearly.1070.a_buff: "การปรับเปลี่ยนเพื่อการค้าเป็นสิ่งที่ดี"
 bp2_yearly.1070.a_none: "สร้างเพื่อเศรษฐกิจ แล้วพวกเขาจะมาเอง"
 bp2_yearly.1070.a.flavor: "เราจะสร้างศูนย์กลางเศรษฐกิจที่เจริญรุ่งเรือง!"
 bp2_yearly.1070.a.flavor_none: "กระเป๋าหนักสามารถแก้ปัญหาใดๆ ได้"
 bp2_yearly.1070.b: "ปราสาทมากขึ้นคือหนทางแห่งอนาคต"
 bp2_yearly.1070.b_buff: "การป้องกันคือการประกันความเจริญรุ่งเรืองที่ดีที่สุด"
 bp2_yearly.1070.b_none: "กำแพงจะรวมพลเมืองเป็นหนึ่งเดียว"
 bp2_yearly.1070.b.flavor: "ด้วยกำแพงอันงดงาม"
 bp2_yearly.1070.b.flavor_none: "... และป้องกัน กระสุน แปลกๆ ไว้"
 bp2_yearly.1070.c: "[ROOT.Char.GetFaith.HighGodName] ประทานการเติบโต"
 bp2_yearly.1070.c.flavor: "ที่ดินนี้จะอุทิศให้กับ [ROOT.Char.GetFaith.HighGodNameAlternate]"
 bp2_yearly.1070.c.flavor_none: "อย่างแท้จริง"
 #Follow-up: Get the sweet sweet loo... I mean, sweet sweet effects!
 bp2_yearly.1071.t_city: "นักสร้างเมือง"
 bp2_yearly.1071.t_castle: "นักสร้างปราสาท"
 bp2_yearly.1071.t_temple: "นักสร้างวิหาร"
 bp2_yearly.1071.desc_city: "ความเร่งรีบและความวุ่นวายของตลาดที่วางแผนไว้อย่างละเอียดไหลเข้าสู่เขตหัตถกรรมอย่างราบรื่นและไหลเข้าสู่โรงค้าเพื่อการขนส่งและรับสินค้าจากต่างประเทศ"
 bp2_yearly.1071.desc_castle: "หอคอยส่องแสงในแสงแดดยามเช้า กำแพงที่น่าเกรงขามป้องกันผู้โจมตีใดๆ"
 bp2_yearly.1071.desc_temple: "เครื่องยืนยันถึง [ROOT.Char.GetFaith.HighGodNameAlternate] — ซุ้มประตูที่หายใจเอาอากาศแห่งจิตวิญญาณ กำแพงที่มีรากฐานที่แข็งแกร่งเหมือนศรัทธาของเรา"
 bp2_yearly.1071.outro: "\n\n[constructed_holding.GetName] เป็นงานก่อสร้างที่งดงามอย่างแท้จริง และเป็นงานที่จะจารึกไว้ในประวัติศาสตร์ในฐานะจุดเริ่มต้นของพรสวรรค์ทางสถาปัตยกรรมใหม่ — คือตัวข้าเอง"
 bp2_yearly.1071.a: "เท่านี้ก็พอ"
 bp2_yearly.1071.a.flavor: ""
 #Clean up: You dun messed up, son
 bp2_yearly.1072.t: "$bp2_yearly.1050.t_builder$: ผู้สร้างฝันสลาย"
 bp2_yearly.1072.desc: "ข้า... ข้า... ไม่แน่ใจว่าเกิดอะไรขึ้น ที่ดินที่วางแผนไว้สำหรับการก่อสร้างใน [cancelled_holding.GetName] ได้เหือดหายไปและไม่มีอีกแล้ว"
 bp2_yearly.1072.a: "อ้อ ช่างเถอะ"

