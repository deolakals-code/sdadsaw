 gemstone_trinket_rough: "อัญมณีดิบ"
 gemstone_trinket_rough.desc: "อัญมณีที่ยังไม่เจียระไน ขุดพบโดย [rock_child.GetTitledFirstNameNoTooltip] ในบริเวณใกล้เคียง [trinket_location.GetNameNoTooltip]"
 gemstone_trinket_modest: "อัญมณีพอใช้"
 gemstone_trinket_modest.desc: "อัญมณีชั้นดี ขุดพบโดย [rock_child.GetTitledFirstNameNoTooltip] ในบริเวณใกล้เคียง [trinket_location.GetNameNoTooltip]"
