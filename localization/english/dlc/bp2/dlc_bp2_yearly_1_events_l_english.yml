#Parent/Guardian: There is a brawl among some children
 bp2_yearly.1045.t: "นักเจรจา"
 bp2_yearly.1045.intro: "ระหว่างการเดินเล่นยามบ่ายไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('diplomacy_child'))] ของข้า [diplomacy_child.GetFirstName] วิ่งมาหาข้า:"
 bp2_yearly.1045.desc_guardian: "$bp2_yearly.1020.desc_guardian$"
 bp2_yearly.1045.desc_parent: ""[diplomacy_child.Custom2('RelationToMeShort', ROOT.Char)|U]!"
 bp2_yearly.1045.desc: "พวกเขาเพิ่งเริ่มชกต่อยกันเมื่อ..."\n\n[diplomacy_child.GetSheHe|U] ถูกขัดจังหวะด้วยเสียงกรีดร้องแหลมสูง ทำให้เราหันไปสนใจการต่อสู้ที่ปลายถนน\n\nคู่ต่อสู้ดูเหมือนจะเป็นเด็กหนุ่มสองคนจาก #EMP ราชสำนักของข้า#! [ROOT.Char.Custom('GetCourt')] กำลังเดินวนรอบกันเพื่อเตรียมพร้อมสำหรับการทะเลาะวิวาทอีกครั้ง"
 bp2_yearly.1045.a: "#EMP แยกกันเดี๋ยวนี้ ทั้งคู่เลยนะ#! "
 bp2_yearly.1045.a.perk.t: "ได้รับ Perk"
 bp2_yearly.1045.a.flavor: "ต่อสู้กัน #EMP ในสวนหลังบ้านของข้าเอง#!..."
 bp2_yearly.1045.b: "#EMP น่าสนใจ#!! ข้าอยากจะพนันข้าง..."
 bp2_yearly.1045.b.flavor: "คนนั้นดูดุร้าย"
