 bp2_yearly.1050.t_builder: "นักสร้าง"
 bp2_yearly.1050.t: "$bp2_yearly.1050.t_builder$: ปราสาททรายในผืนทราย"
 bp2_yearly.1050.t_twig: "$bp2_yearly.1050.t_builder$: พายุที่ก่อตัว"
 bp2_yearly.1050.desc: "ปราสาททรายตระหง่านเหนือชายหาด ขณะที่ข้าใช้เวลาช่วงบ่ายแกะสลักรายละเอียดเล็กๆ น้อยๆ ในทรายที่เปียกและเป็นเม็ด\n\nอย่างไรก็ตาม เมื่อเวลาผ่านไปอย่างไม่หยุดยั้ง น้ำขึ้นก็ เช่นกัน และทุกวินาทีมันก็เข้าใกล้ผลงานชิ้นเอกที่เต็มไปด้วยโคลนของข้า กัดกินที่ฐานของมัน\n\nข้าจ้องมองน้ำขึ้นอย่างสิ้นหวัง พยายามคิดหาวิธีที่จะรับประกันความปลอดภัยของปราสาทของข้าก่อนที่จะถอยกลับ"
 bp2_yearly.1050.desc_desert: "คนรับใช้ได้นำน้ำมาให้ปราสาททรายทะเลทรายอันสง่างามของข้าตลอดทั้งวัน โดยมีแสงแดดส่องลงมาที่หลังของเราอย่างไม่ลดละ\n\nข้าแกะสลักรายละเอียดเล็กๆ น้อยๆ ชิ้นสุดท้ายบนหอคอยที่สูงที่สุด เมื่อข้าสังเกตเห็นพายุทรายที่กำลังคืบคลานเข้ามาที่ขอบฟ้า\n\nหน้าผากของข้าขมวดลงทันที ขณะที่ข้าพยายามคิดหาวิธีป้องกันปราสาทของข้าจากพายุที่กำลังจะมาถึงก่อนที่จะถอยกลับ"
 bp2_yearly.1050.desc_twig: "ปราสาทจำลองอันงดงามที่ข้าทำจากกิ่งไม้และหินก้อนเล็กๆ มีกลิ่นอายของความสง่างามอย่างแท้จริง\n\nขณะที่ข้าตก แต่งขั้นสุดท้ายบนหอคอยที่สูงที่สุด ฝนก็เริ่มตกหนักลงมาเมื่อพายุที่ก่อตัวที่ขอบฟ้าในที่สุดก็มาถึงตำแหน่งของข้า\n\nข้ายิงสายตาอย่างสิ้นหวังไปที่พายุ พยายามอย่างบ้าคลั่งที่จะคิดหาวิธีรับประกันความปลอดภัยของสิ่งสร้างของข้าก่อนที่จะถอยกลับ"
 bp2_yearly.1050.a: "ข้าจะติดสินบนน้ำขึ้นด้วยก้อนกรวดแวววาวเหล่านี้!"
 bp2_yearly.1050.a.flavor: "ข้าชอบก้อนกรวดเหล่านี้จริงๆ แต่มันเพื่อการกุศล"
 bp2_yearly.1050.a_twig: "ข้าจะติดสินบนพายุด้วยหินประกายเหล่านี้!"
 bp2_yearly.1050.a.flavor_twig: "ข้าชอบหินเหล่านี้จริงๆ แต่มันเพื่อการกุศล"
 bp2_yearly.1050.b: "ข้าควรเสริมความแข็งแกร่งของกำแพงภายนอก"
 bp2_yearly.1050.b.flavor: "#EMP ข้า#! รู้สึกปลอดภัยเสมอเมื่อมีกำแพง"
 bp2_yearly.1050.c: "ศาลเจ้าเล็กๆ ในจัตุรัสหลักก็พอ"
 bp2_yearly.1050.c.flavor: "[ROOT.Char.GetFaith.HighGodNameAlternate] จะปกป้องมันอย่างแน่นอน!"
