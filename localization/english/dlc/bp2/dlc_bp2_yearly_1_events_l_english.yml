 #Parent/Guardian: Your child gives you a hug
 bp2_yearly.1010.t: "อย่างไม่มีเงื่อนไข"
 bp2_yearly.1010.intro: "ขณะที่ข้าก้มลงมองแผนที่ใน [ROOT.Char.Custom('GetChamber')] ของข้า เสียง #EMP เอี๊ยด#! อย่างกะทันหัน ทำให้ข้าหันไปทางทางเข้า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hugging_child'))] ของข้า [hugging_child.GetFirstName] ปรากฏตัวที่ธรณีประตู"
 bp2_yearly.1010.desc_toddler: "เดินเตาะแตะมาหาข้าด้วยความเร็วที่น่าประหลาดใจสำหรับวัยของ [hugging_child.GetHerHis]\n\n[hugging_child.GetSheHe|U] โอบ [hugging_child.GetHerselfHimself] รอบขาของข้าอย่างแน่นหนา กอดข้าแน่นและเงยหน้าของ [hugging_child.GetHerHis] ขึ้นมองข้า"
 bp2_yearly.1010.desc_rambler: "วิ่งเหมือนลมมาหาข้า กรีดร้อง #EMP "กอดดดด!"#!\n\n[hugging_child.GetSheHe|U] เอนตัวเข้ามาใกล้และคว้าสะโพกของข้าไว้ในอ้อมกอดที่มั่นคง"
 bp2_yearly.1010.desc_kid: "เดินเข้ามาในห้อง\n\n[hugging_child.GetSheHe|U] มองข้าด้วยสีหน้าที่อ่านไม่ออกครู่หนึ่ง จากนั้นเดินมาหาข้า โอบกอดข้าแน่น"
 bp2_yearly.1010.desc_teenager: "เดินทอดน่องเข้ามาใน [ROOT.Char.Custom('GetRoom')] ดูเหมือนไม่สนใจการมีอยู่ของข้า\n\nจากนั้นโดยไม่มีการเตือน ข้าถูกโอบกอดแน่น [hugging_child.GetSheHe|U] รีบปล่อยอย่างรวดเร็ว ด้วยสีหน้าเขินอาย"
 bp2_yearly.1010.outro_callous: "\n\nความรู้สึกอบอุ่นในอกนี้คืออะไร... ?"
 bp2_yearly.1010.outro_young: "\n\nข้ามองไปที่ [hugging_child.GetHerHim] น้ำตาซ่อนอยู่ในดวงตาขณะที่มือของข้าลูบผมของ [hugging_child.GetHerHis] เพื่อพยายามตอบสนองท่าทางนั้น"
 bp2_yearly.1010.outro_older: "\n\nข้ามองไปที่ [hugging_child.GetHerHim] น้ำตาซ่อนอยู่ในดวงตาขณะที่มือของข้าบีบไหล่ของ [hugging_child.GetHerHis] เพื่อพยายามตอบสนองท่าทางนั้น"
 bp2_yearly.1010.a: "เจ้าเป็น [hugging_child.Custom('GetDaughterSon')] ที่ดี..."
 bp2_yearly.1010.a_callous: "เอาล่ะ เอาล่ะ"
 bp2_yearly.1010.a.flavor: "อย่าร้องไห้ อย่าร้องไห้เด็ดขาด"
 bp2_yearly.1010.a.flavor_callous: "เอาล่ะ ปล่อยข้าได้แล้ว..."
 #Parent/Guardian: Your child/ward found a pouch of gold while exploring
 bp2_yearly.1015.t: "ลูกทองคำ"
 bp2_yearly.1015.intro: "เช้าวันหนึ่งขณะที่ข้ากำลังเตรียมพร้อมเผชิญหน้ากับวันใหม่ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('golden_child'))] ของข้า [golden_child.GetFirstName] เข้ามาหาข้า:"
 bp2_yearly.1015.desc_guardian: "\n\n"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip],"
 bp2_yearly.1015.desc_parent: "\n\n"[golden_child.Custom2('RelationToMeShort', ROOT.Char)|U],"
 bp2_yearly.1015.outro: "เราพบสิ่งนี้ขณะสำรวจ [ROOT.Char.Custom('ResidenceBuilding')] เมื่อวานนี้ ท่านควรได้รับมัน" [golden_child.GetSheHe] ยื่นถุงเหรียญเล็กๆ ขาดๆ มันส่งเสียงกริ๊งกร๊าง"
 bp2_yearly.1015.a: "ขอบคุณมาก!"
 bp2_yearly.1015.a.flavor: "ช่างเป็นเด็กที่น่ารัก"
 bp2_yearly.1015.a.flavor_greedy: "มีแค่นี้หรือ... ?"
 bp2_yearly.1015.b: "เก็บไว้สิ เอาไปลงทุน!"
 bp2_yearly.1015.b.tt: "สิ่งนี้จะส่งเสริม [education_focus|E] ด้าน [stewardship|E] ของ [golden_child.GetFirstNamePossessiveNoTooltip] ต่อไป"
 bp2_yearly.1015.b.tt_matching: "สิ่งนี้จะส่งเสริม [education_focus|E] ด้าน [stewardship|E] ของ [golden_child.GetFirstNamePossessiveNoTooltip] อย่างมาก"
 #Parent/Guardian: Your child/ward has found a secret in court
 bp2_yearly.1020.t: "มีความลับอยู่ที่นี่"
 bp2_yearly.1020.intro: "ขณะที่ข้าก้มลงหยิบพระคัมภีร์มาศึกษา [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secrety_child'))] ของข้า [secrety_child.GetFirstName] พรวดพราดเข้ามาใน [ROOT.Char.Custom('GetRoom')] ขัดจังหวะความสงบอันเงียบงันของข้า\n\n"
 bp2_yearly.1020.desc_guardian: ""[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip]!"
 bp2_yearly.1020.desc_parent: ""[secrety_child.Custom2('RelationToMeShort', ROOT.Char)|U]!"
 bp2_yearly.1020.desc: "ท่าน #EMP จะไม่เชื่อเลย#! ว่าข้ารู้อะไรเกี่ยวกับ [secret_keeper.GetTitledFirstName] มา!" [secrety_child.GetSheHe|U] หยุดเพื่อหอบหายใจของ [secrety_child.GetHerHis] เพื่อสร้างความน่าตื่นเต้น"
 bp2_yearly.1020.a: "เอาล่ะ พูดมาสิ!"
 bp2_yearly.1020.a.secret.t: "เรียนรู้ความลับ"
 bp2_yearly.1020.a.tt: "ท่านเรียนรู้ความลับเกี่ยวกับข้าราชบริพารคนหนึ่งของท่าน"
 bp2_yearly.1020.b: "อะ-อะ! ความลับคือสกุลเงินนะ [secrety_child.Custom('GirlBoy')] ที่รักของข้า!"
 bp2_yearly.1020.b.tt: "สิ่งนี้จะส่งเสริม [education_focus|E] ด้าน [intrigue|E] ของ [secrety_child.GetFirstNamePossessiveNoTooltip] ต่อไป"
 bp2_yearly.1020.b.tt_matching: "สิ่งนี้จะส่งเสริม [education_focus|E] ด้าน [intrigue|E] ของ [secrety_child.GetFirstNamePossessiveNoTooltip] อย่างมาก"
 #Parent: Your child does not have the same educational trait as you. Change?
 bp2_yearly.1030.t: "ลูกไม้หล่น"
 bp2_yearly.1030.desc: "ช่วงนี้ข้าครุ่นคิดเกี่ยวกับการศึกษาของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('focus_child'))] ของข้า [focus_child.GetFirstName] — [focus_child.Custom('GetChildEducationFocus')] เป็นทิศทางที่เหมาะสมจริงๆ หรือ?\n\nตั้งแต่ได้รับการฝึกฝนในด้าน [ROOT.Char.Custom('education_focus')] ด้วยตนเอง ข้าพบว่าความรู้เฉพาะทางนั้นมีประโยชน์ต่อข้าอย่างมาก\n\nแน่นอนว่ามันควรจะทำ เช่นเดียวกันกับ [focus_child.GetHerHim]?"
 bp2_yearly.1030.a: "ปั้น [focus_child.GetHerHim] ตามแบบของข้า"
 bp2_yearly.1030.a.tt_change: "[education_focus|E] ของ [focus_child.GetFirstNamePossessiveNoTooltip] เปลี่ยนเป็น [THIS.Char.Custom('GetEducationTraitConcept')]"
 bp2_yearly.1030.a.tt_tutor: "ท่านสอน [focus_child.GetFirstNameNoTooltip] เป็นการส่วนตัวเพื่อชดเชยการศึกษาที่ขาดหายไป"
 bp2_yearly.1030.b: "ชุดทักษะที่หลากหลายย่อมเป็นประโยชน์"
 bp2_yearly.1030.b.tt: "สิ่งนี้จะส่งเสริม [education_focus|E] ด้าน [focus_child.Custom('GetEducationTraitConcept')] ของ [focus_child.GetFirstNamePossessiveNoTooltip] ต่อไป"
 #Parent/Guardian: Your child/ward has a rock collection
 bp2_yearly.1035.t: "เพชรในตม"
 bp2_yearly.1035.desc: "ระหว่างบทเรียนหนึ่งของเราใน [ROOT.Char.Custom('GetChamber')] ของ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rock_child'))] ของข้า [rock_child.GetFirstNamePossessive] ข้าสังเกตเห็นหินจำนวนมากที่น่าประทับใจจัดแสดงอย่างเรียบร้อยบนชั้นวาง\n\nหินก้อนหนึ่งโดดเด่นในคอลเลกชัน — มันค่อนข้างหยาบ แต่เมื่อตรวจสอบใกล้ๆ จะมีสีแดงเข้มสดใสอยู่ภายใน\n\n[rock_child.GetFirstNameNoTooltip] สังเกตเห็นความสนใจของข้าขณะที่ [rock_child.GetSheHe] หยิบมันขึ้นมาและยื่นให้: "ท่านเอาไปได้"
 bp2_yearly.1035.desc_guardian: "[ROOT.Char.Custom('MistressMaster')] [ROOT.Char.GetFirstNameNoTooltip].""
