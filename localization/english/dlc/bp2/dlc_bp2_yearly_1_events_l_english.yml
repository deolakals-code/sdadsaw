 #Parent/Guardian: Your child/ward has a text about martial arts
 bp2_yearly.1040.t: "ปากกาอันทรงพลัง"
 bp2_yearly.1040.desc: "ขณะหยิบดาบฝึกซ้อมเพื่อประลองกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sparring_child'))] ของข้า [sparring_child.GetFirstName] ข้าสังเกตเห็นสมุดบันทึกเก่าๆ เล่มหนึ่งถูกโยนทิ้งไว้ข้างหนึ่ง\n\nจากปก ดูเหมือนว่าจะมีแบบฝึกหัดและแนวปฏิบัติที่ดีที่สุดเกี่ยวกับศิลปะการต่อสู้\n\n[sparring_child.GetFirstNameNoTooltip] เหลือบมองมาทางข้า: "โอ้ สิ่งนั้น — ข้าอ่านมันส่วนใหญ่เพื่อดูภาพประกอบ ท่านยืมไปได้""
 bp2_yearly.1040.a: "น่าสนใจ"
 bp2_yearly.1040.a.flavor: ""จับด้าม ไม่ใช่ปลายแหลม" หืม"
 bp2_yearly.1040.b: "เราควรลองดู!"
