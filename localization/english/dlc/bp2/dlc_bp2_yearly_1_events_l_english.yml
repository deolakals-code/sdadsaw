 bp2_yearly.1001.c.flavor: "ข้ามั่นใจว่าคนอื่นจะจัดการเอง"
 bp2_yearly.1001.c.flavor_ecc_sadist: "ให้เนื้อหนัง #EMP ขับขาน#! เถิด"
 bp2_yearly.1001.c.flavor_callous: "ใครว่าการเลี้ยงลูกเป็นเรื่องยาก?"
 #Child: You notice your parent/guardian performing a stress trait
 bp2_yearly.1005.t: "ลูกไม้หล่นไม่ไกลต้น..."
 bp2_yearly.1005.intro: "ข้าสังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stressed_adult'))] ของข้า [stressed_adult.GetTitledFirstName],"
 bp2_yearly.1005.desc_drunkard: "ดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] บ่อยมากเมื่อเร็วๆ นี้\n\nครั้งหนึ่งข้าถึงกับพบ [stressed_adult.GetHerHim] อยู่ในซอกมุมของ [stressed_adult.Custom('ResidenceBuilding')] หน้าคว่ำอยู่ในแอ่งน้ำ... ที่มีต้นกำเนิดน่าสงสัย เมาจนหมดสติ [stressed_adult.GetSheHe] เป็น เช่นนั้น\n\nแต่ไม่ว่ารูปลักษณ์ภายนอกของ [stressed_adult.GetHerHis] จะเป็นอย่างไร [stressed_adult.GetSheHe] #EMP ก็#! ดูสงบสุขดี"
 bp2_yearly.1005.desc_hashishiyah: "แอบไปเผากัญชาบ่อยครั้งเมื่อเร็วๆ นี้\n\nครั้งหนึ่งข้าพบ [stressed_adult.GetHerHim] นอนอยู่บนพื้น [stressed_adult.Custom('GetChamber')] ของ [stressed_adult.GetHerHis] ตลอดทั้งวัน "เพื่อพยายามตรวจสอบเพดาน" [stressed_adult.GetSheHe] กล่าว ด้วยดวงตาเหม่อลอย\n\nดูเหมือนจะผ่อนคลายมาก"
 bp2_yearly.1005.desc_reclusive: "เก็บตัวอยู่ใน [stressed_adult.Custom('GetChamber')] ของ [stressed_adult.GetHerHis] เมื่อเร็วๆ นี้\n\nสัปดาห์ก่อน [stressed_adult.GetSheHe] อยู่ในนั้นหลายวัน แม้กระทั่งให้ส่งอาหารเข้าไป\n\nดูเหมือนจะสงบสุขดี แม้ว่าการทำ เช่นนั้น [stressed_adult.GetSheHe] จะละเลยเหตุการณ์บางอย่างรอบๆ [stressed_adult.Custom('GetCourt')]"
 bp2_yearly.1005.desc_irritable: "เทศนาอย่างเข้มงวดและเกรี้ยวกราดใส่เรื่องเล็กน้อยเมื่อเร็วๆ นี้\n\nวันก่อน [stressed_adult.GetSheHe] เกือบจะกัดหัวคนรับใช้คนหนึ่งขาด เพราะปูผ้าปูที่นอนของ [stressed_adult.GetHerHis] ผิด\n\nหลังจากนั้น [stressed_adult.GetSheHe] ดูสงบเสงี่ยมดีนะ"
 bp2_yearly.1005.desc_flagellant: "ทำร้าย [stressed_adult.GetHerselfHimself] โดยสมัครใจเมื่อเร็วๆ นี้\n\nเมื่อวันก่อน ข้าได้ยินเสียง [stressed_adult.GetHerHim] เฆี่ยนตีผิวหนังของ [stressed_adult.GetHerHis] ด้วยแส้ขณะสวดมนต์ทางศาสนา\n\nตอนแรกมัน ทำให้ข้าตกใจ — แต่ดูเหมือนจะช่วยให้จิตใจของ [stressed_adult.GetHerHis] สงบลง"
 bp2_yearly.1005.desc_profligate: "ได้ของแปลกๆ มามากมายเมื่อเร็วๆ นี้\n\nคนรับใช้บางคนดูเหมือนจะมองข้ามของเหล่านั้นว่าเป็นของจุกจิกไร้ค่า และอธิบายพฤติกรรมของ [stressed_adult.GetHerHis] ว่า 'โยนทองลงบ่อ'\n\nข้าไม่แน่ใจนัก — [stressed_adult.GetSheHe] ดูเหมือนจะสนุกกับการสะสมของจุกจิกเหล่านั้น?"
 bp2_yearly.1005.desc_improvident: "บริจาคทองคำจำนวนมากให้การกุศลเมื่อเร็วๆ นี้\n\nข้าสังเกตเห็นว่าคนในราชสำนักบางคนไม่พอใจเล็กน้อย — พวกเขาถึงกับอ้างว่า [stressed_adult.GetSheHe] ใช้ทองไม่เป็น\n\nแต่ถ้ามัน ทำให้ [stressed_adult.GetHerHis] มีกำลังใจขึ้น นั่นก็เป็นสิ่งที่ดี ใช่ไหม... ?"
 bp2_yearly.1005.desc_contrite: "ยอมรับและสารภาพความผิดเล็กๆ น้อยๆ เมื่อเร็วๆ นี้\n\nเมื่อวันก่อน [stressed_adult.GetSheHe] สารภาพกับคนรับใช้ว่า [stressed_adult.GetSheHe] ไม่ได้สนใจเสื้อผ้าของคนรับใช้มากนัก และ [stressed_adult.GetSheHe] รู้สึกผิดในใจเกี่ยวกับเรื่องนั้น\n\nดูเหมือนจะเป็นเรื่องเล็กน้อย แต่ถ้ามัน ทำให้จิตใจของ [stressed_adult.GetHerHis] สงบลง... ?"
 bp2_yearly.1005.desc_comfort_eater: "กิน [stressed_adult.Custom('FavoriteTreat')] จำนวนมากเมื่อเร็วๆ นี้\n\nคำว่ามาก ข้าไม่ได้หมายถึงห้าหรือสิบ — แต่เป็นสามเท่า และข้าได้ยินคนรับใช้กระซิบกันว่าต้องเพิ่มขนาดเสื้อของ [stressed_adult.GetHerHis]\n\nอย่างไรก็ตาม การตามใจตัวเองดูเหมือนจะปลอบประโลม [stressed_adult.GetHerHim]..."
 bp2_yearly.1005.desc_inappetetic: "ละเลยมื้อค่ำแปลกๆ เมื่อเร็วๆ นี้\n\nอันที่จริง ข้าไม่เห็น [stressed_adult.GetHerHim] กินอะไรเลยตั้งแต่เช้าวานนี้ คนรับใช้กระซิบกันว่าช่างตัดเสื้อถูกบังคับให้ลดขนาดเสื้อของ [stressed_adult.GetHerHis] เมื่อสัปดาห์ก่อนด้วย\n\nนั่นเป็นเรื่องไม่ดีหรือ?"
 bp2_yearly.1005.desc_journaller: "มีรอยเปื้อนหมึกบนนิ้วของ [stressed_adult.GetHerHis] เมื่อเร็วๆ นี้\n\n[stressed_adult.GetSheHe|U] ไม่ไปไหนเลยหากไม่มีสมุดปกหนังเล่มนั้นอยู่ข้างกาย [stressed_adult.GetHerHis] คอยจดบันทึกอยู่ตลอดเวลา\n\nนอกเหนือจากรอยเปื้อนหมึกแล้ว [stressed_adult.GetSheHe] ดูสงบและเป็นระเบียบมากขึ้นเมื่อเร็วๆ นี้ ดูเหมือน... น่าพอใจ"
 bp2_yearly.1005.desc_confider: "แทบจะติดอยู่กับหูของคนสนิท [confidant_friend.GetTitledFirstNamePossessive] ของ [stressed_adult.GetHerHis] เมื่อเร็วๆ นี้\n\nพวกเขาดูเหมือนจะแบ่งปันทุกสิ่งระหว่างกัน ขณะที่เดินเคียงข้างกัน หัวเราะคิกคัก\n\nคงจะดีที่สามารถถ่ายทอดทุกสิ่งที่ดีและไม่ดีในชีวิตของคุณให้ใครสักคนฟังได้"
 bp2_yearly.1005.desc_athletic: "ไม่ว่าแดดจะออกหรือฝนจะตก วิ่งหลายรอบรอบบริเวณ [stressed_adult.Custom('ResidenceBuilding')] เมื่อเร็วๆ นี้\n\nข้าราชบริพารบางคนทำจมูกฟุดฟิดกับกลิ่นเหม็นอับที่รับรู้ได้หลังการออกกำลังกาย แต่ดูเหมือนว่าเสียงกระซิบที่ดูถูกเหยียดหยามจะยิ่ง ทำให้ [stressed_adult.GetHerHim] แข็งแกร่งขึ้นในความตั้งใจของ [stressed_adult.GetHerHis]\n\nมัน ทำให้ข้าสนใจ"
