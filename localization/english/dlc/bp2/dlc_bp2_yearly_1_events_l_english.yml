l_english: 
 ##EVENTS
 #Parent/Guardian: Your child/ward walks in on you performing your stress trait
 bp2_yearly.1000.t: "กรรมตามสนอง..."
 bp2_yearly.1000.desc_drunkard: ""อีก... อีกจอก ข้า... ข้ารับใช้ ถ้าเจ้าจะกรุณา... #EMP *ฮึก*!#!"\n\n[ROOT.Char.Custom('RegionalAlcoholicDrink')] กำลังทำลายคำพูดของข้า แต่ข้าซุกตัวอยู่ในความสบายของมันเกินกว่าจะสนใจ ณ จุดนี้ สนใจเรื่องส่วนใหญ่จริงๆ\n\nในห้วงแห่งความเปียกชุ่ม สุราเลือกที่จะหนีออกจากร่างของข้า — รดไปทั่วอาหารค่ำของข้า! แขกที่อยู่รอบๆ ส่งเสียงขึ้นจมูกด้วยความรังเกียจ"
 bp2_yearly.1000.desc_hashishiyah: "ครั้งนี้กัญชาคุณภาพเยี่ยม — แรงมาก จนผิวหนังของข้าเริ่มคัน และเสื้อผ้าของข้ารู้สึก #EMP คับเกินไป!#!\n\nข้าเปลื้องผ้าออก และตามอำเภอใจ ไล่ตามเสียงนกร้องข้างนอก ครู่ต่อมา ข้าหันกลับมา..."
 bp2_yearly.1000.desc_reclusive: ""เจ้าพวกโง่เง่าและสุนัขเหม็นเน่า พวกมันทั้งหมด!" ข้าพึมพำ ขณะที่ในที่สุดข้าก็ได้อยู่เงียบๆ ตามลำพัง ข้านวดขมับและหลับตาลง\n\nเสียงที่ไม่คาดคิด ทำให้ข้ากลับสู่ความเป็นจริง ตาของข้าเบิกโพลง #EMP ข้าไม่ได้อยู่คนเดียว อย่างที่ข้าปรารถนาหรือ?!#! ข้าพึมพำคำสาปแช่ง"
 bp2_yearly.1000.desc_irritable: "ยามค่ำดึกดื่น เหล่าผู้ติดตามชั้นผู้น้อยคุยจ้ออยู่รอบตัวข้า หัวที่ปวดร้าวตอกตะปูลงในความคิดของข้า\n\nเหยือกที่หล่นแตกดังลั่นอยู่ข้างกายข้า\n\nโดยไม่ลังเล ข้าตวาดและกรีดร้องใส่คนรับใช้ผู้กระทำผิด: "เจ้า #EMP [dummy_gender.Custom2('InsultNounClumsy', ROOT.Char)]!#! อวดดี! เจ้าเกิดมาจากยักษ์ [dummy_gender.Custom2('InsultAdjectiveClumsy', ROOT.Char)] รึยังไง?!""
 bp2_yearly.1000.desc_flagellant: "#EMP *เพี๊ยะ!*#! แส้ของข้าฟาดลงบนตัวข้า อย่างรุนแรง #EMP อีกครั้ง#! และ #EMP อีกครั้ง#! ความเจ็บปวดที่รุนแรง โดดเดี่ยว และแผดเผา ทำให้ข้ามีสมาธิ\n\nข้าเฆี่ยนร่างกายของข้าอีกเพียงไม่กี่ครั้ง การฟาด แต่ละครั้งนำข้าเข้าใกล้การหลุดพ้นอันแสนหวานเพียงเล็กน้อย"
 bp2_yearly.1000.desc_profligate: "#EMP อืมมม#! นี่ดูดี ใช่ นั่นก็ด้วย เมื่อเลือกซื้อของเสร็จแล้ว ข้าก็โยนสินค้าชั้นดีให้คนรับใช้ของข้า\n\nเมื่อหันกลับมา ข้าเห็นกองของฟุ่มเฟือยทั้งหมดที่ข้าสะสมไว้ มันเริ่มจะ... มากมาย และกระเป๋าเงินของข้าก็... ว่างเปล่าทีเดียว"
 bp2_yearly.1000.desc_improvident: "คำเทศนาที่ยอดเยี่ยม พิธีกรรมที่สมบูรณ์แบบ ขณะที่เราออกจาก [ROOT.Char.GetFaith.HouseOfWorship] ข้า — แน่นอน — ให้เกียรติ [ROOT.Char.Custom('DefaultPriestTitle')] ไม่เพียง แต่ด้วยเหรียญ แต่ด้วยเครื่องประดับทั้งหมดที่ข้าพอจะให้ได้ บางคนมองข้าอย่างเคลือบแคลง\n\nแต่ทองคำเป็นสิ่งที่ไม่จีรัง! หนักกว่าคือน้ำหนักของความรู้สึกผิดและความละอาย..."
 bp2_yearly.1000.desc_contrite: "[other_guest.GetTitledFirstName] จ้องมองข้า ตกตะลึงกับข้อมูลส่วนตัวที่ข้าเพิ่งสารภาพในมื้อค่ำ "เจ้าทำ #EMP อะไรนะ#!?" [other_guest.GetSheHe] พูดซ้ำอย่างสับสน\n\nความสำนึกผิดของข้ามีทั้งข้อดี — และข้อเสีย ยอมรับตามตรง ข้ารู้สึกเหมือนได้ปลดภาระ... แต่มันเป็น เพราะข้ากำลังสร้างภาระให้ผู้อื่นหรือไม่?"
 bp2_yearly.1000.desc_comfort_eater: "ข้าเอนหลังพิงเก้าอี้ #EMP อาจจะ#! อิ่มมากแล้ว แต่ขนมหวานเย้ายวนอีกชิ้นก็เลื่อนผ่านริมฝีปากของข้า ความเหน็ดเหนื่อยจากเช้าอันวุ่นวายของข้ารู้สึกเหมือนถูกฝังกลบไปแล้ว\n\nข้าตระหนักว่าข้าถูกรายล้อมไปด้วยจานเปล่าของ [ROOT.Char.Custom('FavoriteTreat')] นับไม่ถ้วน นับไม่ถ้วนจริงๆ"
 bp2_yearly.1000.desc_inappetetic: "ข้าเขี่ยอาหารตรงหน้า เลื่อนไปมา เพื่อให้ดูเหมือนว่าข้าได้กินแล้ว ข้าไม่อยากให้ใครกังวล\n\nใครจะมีเวลากิน? กลางวันมีไว้ปกครอง กลางคืนมีไว้เล่นการเมือง ข้าจะมีความสุขจากอาหารได้อย่างไร ในเมื่อทั้งหมดนี้ถ่วงข้าอยู่?"
 bp2_yearly.1000.desc_journaller: "ข้าถอนหายใจอย่างโล่งอก วางอุปกรณ์การเขียนลง ข้าปล่อยให้สายตาของข้ากวาดไปตามความยาวของสมุดบันทึกเล่มเล็กที่ถูกเปิดอ่านจนช้ำ ซึ่งเป็นชุดของลายเส้นขยุกขยิกที่ไม่ค่อยห่างจากตัวข้า\n\nเมื่อเงยหน้าขึ้น ข้าเห็นว่าแสงแดดยามเช้าได้เปลี่ยนเป็นแสงอาทิตย์ตกดินแล้ว ข้าใช้เวลาขัดเกลาถ้อยคำของข้านาน #EMP แค่ไหน#! กันนี่?"
 bp2_yearly.1000.desc_confider: "ไม่ว่าจะเป็นมื้อเช้าหรืองานเลี้ยงที่ไม่เป็นทางการ ข้ามักจะโน้มตัวไปหาคนสนิทของข้า [confider_friend.GetTitledFirstName] และแบ่งปันมุมมองของข้าเกี่ยวกับเรื่องต่างๆ\n\nช่างดีเหลือเกินที่ได้ยินความคิดของข้าด้วยคำพูดของข้าเอง ที่ได้ไว้วางใจในความคิดเห็นของสหาย! เมื่อได้รับคำแนะนำจาก [confider_friend.GetFirstNamePossessiveNoTooltip] เกี่ยวกับเรื่องเล็กน้อยแล้ว ข้าก็มองออกไปทั่วโต๊ะที่วุ่นวาย..."
 bp2_yearly.1000.desc_athletic: "ข้าวิ่งอีกรอบรอบ [ROOT.Char.Custom('ResidenceBuilding')] เหงื่อไหลอาบหลัง ได้รับสายตาบางส่วนจากผู้ยืนดู ร่างกายที่แข็งแรงย่อมสร้างจิตใจที่แข็งแรงอย่างแท้จริง!\n\nด้วยเสียงคำราม ข้าหยุดกึก ข้าคว้าหินก้อนใหญ่และยกมันขึ้นมาถึงอก"
 bp2_yearly.1000.outro_bad: "\n\n...แล้วข้าก็เห็น [appropriate_child.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า จ้องมองมาที่ข้า #EMP อืมมม.#! "
 bp2_yearly.1000.outro: "\n\n...แล้วข้าก็สังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] มองมาที่ข้าอย่างสนใจ"
 bp2_yearly.1000.a: "ไม่ใช่ชั่วโมงที่ดีที่สุดของข้าเท่าไหร่..."
 bp2_yearly.1000.a_good: "เอาล่ะ ข้าอยู่ที่ไหนแล้วนะ..."
 bp2_yearly.1000.a.flavor: "ข้ามั่นใจว่า [appropriate_child.GetFirstNameNoTooltip] จะไม่เป็นไร..."
 bp2_yearly.1000.a.flavor_good: "ไม่ใช่ทุกนิสัยจะแย่ไปเสียหมด ใช่ไหม?"
 bp2_yearly.1000.a.tt: "การแสดงออกของท่านอาจส่งผลกระทบระยะยาวต่อ [appropriate_child.GetShortUIName]"
 bp2_yearly.1000.b: "สนใจร่วมกับข้าไหม?"
 bp2_yearly.1000.b_drunkard: "สนใจ #EMP *ฮึก*#! ร่วมกับข้าไหม?"
 bp2_yearly.1000.b_contrite: "คำสารภาพ #EMP ของเจ้า#! คืออะไรเล่า ลูก?"
 bp2_yearly.1000.b_inappetetic: "อาหารมีไว้สำหรับสัตว์"
 bp2_yearly.1000.b_us: "สนใจร่วมกับพวกเราไหม?"
 bp2_yearly.1000.b_hashishiyah: "...อยากลองหน่อยไหม?"
 bp2_yearly.1000.b_reclusive: "กรุณา #EMP ออกไป#!."
 bp2_yearly.1000.b_flagellant: "บางครั้งแส้คือสิ่งปลอบใจเพียงอย่างเดียวของเจ้า"
 bp2_yearly.1000.b_improvident: "กระเป๋าของข้ารู้สึกเบา แต่ใจของข้ายิ่งเบากว่า"
 bp2_yearly.1000.b_athletic: "ข้าวิ่งเร็วกว่า [ROOT.Char.GetFaith.WitchGodName] เสียอีก เจ้ารู้ไหม"
 bp2_yearly.1000.b_agitated: "เจ้ามอง #EMP อะไร#! หา!?"
 bp2_yearly.1000.b.flavor: "ยิ่งมากยิ่งสนุก!"
 bp2_yearly.1000.b.flavor_contrite: "ความลับก็เหมือนบาดแผลติดเชื้อ..."
 bp2_yearly.1000.b.flavor_inappetetic: "เราควรกลับไปทำงานจริงๆ เสียที"
 bp2_yearly.1000.b.flavor_confider: "การไว้ใจเป็นศิลปะ!"
 bp2_yearly.1000.b.flavor_flagellant: "มันคือความจริง"
 bp2_yearly.1000.b.flavor_improvident: "เราต้องดูแลผู้ด้อยโอกาสกว่า"
 bp2_yearly.1000.b.flavor_athletic: "...ก็ ไม่ใช่ว่าข้าเคยลองหรอกนะ"
 bp2_yearly.1000.b.flavor_agitated: "ความ #EMP กล้า#! ของคนบางคน!"
 #Follow-up; the child is mimicking your stress behavior
 bp2_yearly.1001.t: "...กรรมตามทัน"
 bp2_yearly.1001.desc_drunkard: "ห้องเก็บของ #EMP มักจะ#! ปิดแน่นหนา เรื่องนี้จำได้ง่าย เพราะพ่อครัวบ่นเรื่องหนูไม่หยุดหย่อน ข้าเข้าใกล้ [ROOT.Char.Custom('GetRoom')] ที่มืดมิดและเปิดอยู่ อย่างระมัดระวัง\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] โผล่เข้ามาในสายตา ปากอ้า ตาเหม่อลอย ลมหายใจของ [appropriate_child.GetHerHis] เหม็นกลิ่น [ROOT.Char.Custom('RegionalAlcoholicDrink')] — และขนมที่ขโมยมา"
 bp2_yearly.1001.desc_hashishiyah: "เสียงหัวเราะคิกคักดังมาจาก [ROOT.Char.Custom('GetRoom')] ที่ดูเหมือนร้างผู้คน ข้าย่องเข้าไปด้วยความสงสัย และพบ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] ซ่อนตัวอยู่ในมุมหนึ่ง\n\n[appropriate_child.GetSheHe|U] พยายามกลั้นเสียงหัวเราะของ [appropriate_child.GetHerHis] แต่ข้า #EMP รู้จัก#! รอยยิ้มเจ้าเล่ห์นั้นดี — ไม่ต้องพูดถึงดวงตาที่แดงก่ำและกลิ่นกัญชาที่สัมผัสได้!"
 bp2_yearly.1001.desc_reclusive: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] ไม่ได้ปรากฏตัวในที่พักของเรามาหลายวันแล้ว เมื่อคนรับใช้เริ่มพึมพำและญาติแสดงความกังวล ข้าจึงไปที่ [ROOT.Char.Custom('GetChamber')] ของ [appropriate_child.GetHerHis]\n\nขณะที่ข้าเข้าไป — ทั้งหมด #EMP คือ#! อาณาเขตของข้าอยู่แล้ว — [appropriate_child.GetFirstNameNoTooltip] หันขวับมาโดยไม่มีพิธีรีตองหรือความสุภาพใดๆ ขู่ฟ่อใส่ข้าให้ออกไปและปล่อยให้ [appropriate_child.GetHerHim] อยู่ตามลำพัง"
 bp2_yearly.1001.desc_irritable: "ระหว่างทางจากอาหารค่ำไปห้องสุขา ข้าเจอ [appropriate_child.GetFirstName] ที่กำลัง #EMP โกรธจัด#! มาก\n\n"#EMP เจ้า [appropriate_child.Custom('InsultNounClumsy')] ไร้มารยาท!#!" [appropriate_child.GetSheHe] ตะโกน "เจ้าทำ [appropriate_child.Custom('child_object_of_interest')] ของข้าเปื้อน! ทำไมเจ้าไม่ไปจมน้ำตายใน [ROOT.Char.Custom('RegionalDrink')] นั่นเสียเลยล่ะ!?""
 bp2_yearly.1001.desc_flagellant: "[ROOT.Char.Custom('GetDungeonPlural')] ของข้าสะท้อนเสียงกรีดร้องด้วยความเจ็บปวด... เสียงกรีดร้อง #EMP ของเด็ก#! ข้ารีบไปดู\n\nเมื่อเพ่งมอง ข้าเห็นว่าผู้กระทำผิดคือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] และ... #EMP นั่นแส้ของข้าหรือเปล่า?#! ข้าอ้าปากค้าง ขณะที่ [appropriate_child.GetFirstNameNoTooltip] ทำร้าย [appropriate_child.GetHerselfHimself] ในนามของ [ROOT.Char.GetFaith.HighGodNameAlternate]"
 bp2_yearly.1001.desc_profligate: "เป็นครั้งที่สามในรอบหลายสัปดาห์ที่ [appropriate_child.GetFirstName] ร้องขอของเล่นใหม่ราคาแพง พ่อค้าเร่ตามติดทุกการเคลื่อนไหวของเราจาก [ROOT.Char.Custom('FortifiedBuilding')]\n\nสิ่งนี้ ทำให้ข้ากังวลเล็กน้อย ท้ายที่สุดแล้ว จะเกิดอะไรขึ้นถ้า [appropriate_child.GetSheHe] มีคลังสมบัติเป็นของตัวเองในสักวันหนึ่ง? การใช้จ่าย เช่นนี้...\n\nแล้วนี่อะไร? [appropriate_child.GetSheHe] ซื้อ [ROOT.Char.Custom('GetAccessory')] แบบเดียวกับที่ข้าเคยซื้อหรือ?"
 bp2_yearly.1001.desc_improvident: "สองสามวันที่ผ่านมา ข้าสังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] มอบของเล่นมากมายของ [appropriate_child.GetHerHis] ให้กับเด็กคนอื่นๆ\n\nในช่วงเวลาที่หายากท่ามกลางสามัญชน [appropriate_child.GetSheHe] รบเร้าให้ข้าบริจาคให้ขอทาน — และหยุดร้องไห้กับเรื่องราวความทุกข์ยากของหญิงม่ายที่น่าสงสารทุกคน!"
 bp2_yearly.1001.desc_contrite: "[appropriate_child.GetFirstName] ของเราเองกำลังยืนอยู่บนหีบ [appropriate_child.GetSheHe|U] ได้รวบรวมฝูงชนเด็กๆ เล่าความลับธรรมดาที่สุดเท่าที่จะจินตนาการได้ให้พวกเขาฟัง ในทางกลับกัน [appropriate_child.GetSheHe] พูดคุยกับเด็กๆ ให้เปิดเผยการกระทำผิดของตนเอง\n\n"ข-ข้าเอา [appropriate_child.Custom('FavoriteTreat')] ชิ้นสุดท้ายไป" [dummy_gender.Custom('GirlBoy')] คนหนึ่งยอมรับอย่างสั่นเทา "ข้าฆ่าหนู!" เด็กอีกคนสารภาพ"
 bp2_yearly.1001.desc_comfort_eater: "ขณะทำกิจวัตรประจำวัน ข้าสังเกตเห็นบางอย่างผิดปกติ: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] แบ่งปันที่ซ่อนกับกอง [appropriate_child.Custom('FavoriteTreat')] กำลังเคี้ยวอย่างเอร็ดอร่อย\n\nช่วงนี้มีเรื่องเกิดขึ้นมากมายที่นี่ และ [appropriate_child.GetSheHe] #EMP ก็#! กลมขึ้นเล็กน้อย..."
 bp2_yearly.1001.desc_inappetetic: "ในมื้อค่ำ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] ดูเหมือนจะใจร้อนอยู่เสมอ โบกมือให้คนรับใช้ที่ถือถาดให้ออกไป\n\n บางที [appropriate_child.GetSheHe] อาจเพียงแค่กระตือรือร้นที่จะออกไปทำกิจกรรมอื่น? หรือ — ถ้าข้าไม่ได้คิดไปเอง — แก้มของ [appropriate_child.GetHerHis] เริ่มซีดและผอมลงเล็กน้อยหรือไม่?"
 bp2_yearly.1001.desc_journaller: "มีบันทึกที่เขียนด้วยลายมือหวัดๆ กระจัดกระจายอยู่ทั่ว [ROOT.Char.Custom('GetCourt')] ของข้าเมื่อเร็วๆ นี้ แหล่งที่มา? [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] กำลังก้มหน้าก้มตาอยู่ใน [ROOT.Char.Custom('GetChamber')] ที่ว่างเปล่า ขีดเขียนตามใจชอบของ [appropriate_child.GetHerHis]\n\nข้าพิจารณานิสัยการเขียนของตัวเอง บันทึกประจำวันของข้าเต็มไปด้วยความคิดของข้า บางทีข้าอาจได้แบ่งปันแนวปฏิบัติที่คุ้มค่า"
 bp2_yearly.1001.desc_confider: "ข้าสังเกตเห็นการเปลี่ยนแปลงเล็กน้อยใน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้า [appropriate_child.GetFirstName] เมื่อเร็วๆ นี้ [appropriate_child.GetSheHe|U] ใช้เวลามากขึ้นกับเพื่อนสนิทของ [appropriate_child.GetHerHis] กระซิบกระซาบและหัวเราะ\n\nข้าสาบานได้ว่า [appropriate_child.Custom('GirlBoyPlural')] เหล่านั้นรู้เรื่องเกี่ยวกับ [appropriate_child.GetHerHim] มากกว่าข้าเสียอีก และความผูกพันของพวกเขาดูแข็งแกร่ง สหาย เช่นนี้ สหายที่ไว้ใจได้ ซึ่งสามารถพูดคุยได้อย่างเปิดเผย เป็นของขวัญอย่างแท้จริง"
 bp2_yearly.1001.desc_athletic: "เมื่อก้าวออกไปข้างนอก เด็กๆ วิ่งผ่านไป: คนหนึ่งเร็วกว่าและคล่องแคล่วกว่าเพื่อนๆ ของ [appropriate_child.GetHerHis] อย่างเห็นได้ชัด\n\nนั่นคือ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] ของข้าเอง [appropriate_child.GetFirstName] ที่วิ่งนำหน้าคนอื่นๆ!\n\nข้ายิ้มให้กำลังใจ ประทับใจในการแสดงออกถึงเจตจำนงและความเพียรพยายามที่ไม่คาดคิดของ [appropriate_child.GetHerHis] ในไม่ช้า นักวิ่งคนอื่นๆ ก็สะดุดหยุดลงก่อนเวลาอันควร ความภาคภูมิใจในตัว [appropriate_child.GetFirstNameNoTooltip] ลุกโชนอยู่ในใจข้า!"
 bp2_yearly.1001.outro_bad: "\n\nข้าเดินโซเซออกจากภาพนั้น นี่คือวิธีที่ #EMP ข้า#! ทำตัวหรือ?"
 bp2_yearly.1001.outro: "\n\nบางทีอาจไม่ใช่นิสัยที่แย่นักก็ได้?"
