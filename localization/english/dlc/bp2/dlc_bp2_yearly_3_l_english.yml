l_english: 

 # What's a Study Day Worth?
 bp2_yearly.3000.t: "วันแห่งการศึกษามีค่าเพียงใด?"
 bp2_yearly.3000.desc: "เสียงของ [educator.Custom2('MyCharacterIntroduction', ROOT.Char)] ดังเนิบนาบไม่หยุดหย่อน ขณะที่[educator.GetSheHe]บรรยายสั่งสอนข้าเป็นครั้งที่ร้อยถึงวิถีอันเหมาะสมของ[ROOT.Char.GetLadyLord] สลับกับถ้อยคำอันเคร่งครัดจาก[educator.GetFaith.ReligiousText|U]เป็นระยะ"
 bp2_yearly.3000.desc_no_educator: "ขณะที่ข้าพลิกหน้าหนังสือ ข้าก็ได้ แต่มองอย่างหดหู่ไปยังเด็กคนอื่นๆ ใน[ROOT.Char.Custom('GetCourt')]ที่กำลังวิ่งเล่นอยู่ด้านนอก เสียงหัวเราะ เสียงกรีดร้องอย่างเริงร่า... ข้าหันกลับมามอง[ROOT.Char.GetFaith.ReligiousText|U]ฉบับที่วางอยู่บนโต๊ะ"
 bp2_yearly.3000.desc_ending: "\n\nแน่นอนว่าทั้งหมดนี้สำคัญยิ่งต่ออนาคตของข้า แต่... จะมีใครสังเกตเห็นหรือไม่ หากข้าแอบหนีออกไปเล่นสักครั้ง — หรืออาจจะสักสองครั้ง?"
 bp2_yearly.3000.a: "ความรู้คือกุญแจไขสู่จักรวาล!"
 bp2_yearly.3000.a.tt: "มีโอกาสที่การศึกษาของท่านจะให้ผลลัพธ์ที่ดีขึ้น"
 bp2_yearly.3000.b: "พยายามอีกสักหน่อยคงไม่เสียหาย"
 bp2_yearly.3000.c: "จะเรียนไปไย ในเมื่อเรา#EMP เล่น#!ได้?"
 # SheHe Knows This Room
 bp2_yearly.3010.t: "[child.GetSheHe|U]รู้จักห้องนี้"
 bp2_yearly.3010.desc: "หัวใจข้าบีบรัดเมื่อเห็น[child.Custom('GetDaughterSon')]อันเป็นที่รัก [child.GetFirstName] จ้องมองสภาพแวดล้อมรอบ[child.GetHerHis]กายอย่างเหม่อลอย สับสนและจำไม่ได้อีกครั้ง\n\n[child.GetSheHe|U]เริ่มก้าวเดินครั้งแรกในห้องเหล่านี้เอง แต่นั่นก็นานมาแล้ว หลายปีที่ต้องจากไปต่างแดนในฐานะตัวประกันคงได้ลบเลือนความทรงจำไปจากจิตใจอันเยาว์วัยของ[child.GetHerHis]\n\nอีกคราหนึ่ง [child.GetSheHe]มองไปรอบๆ แล้วถอนหายใจ"
 bp2_yearly.3010.a: "ข้าต้องคุยกับ[child.GetHerHim]"
 bp2_yearly.3010.b: "[child.GetSheHe|U]จะผ่านมันไปได้เอง"
 # I've Walked This Floor
 bp2_yearly.3011.t: "ข้าเคยเดินบนพื้นนี้"
 bp2_yearly.3011.desc: "ในมุมหนึ่งของความคิด ข้า#EMP รู้#!ว่าข้าเคยอยู่ที่นี่มาก่อน แต่ความทรงจำนั้นเลือนรางยิ่งกว่าความฝัน และความฝันถึงบ้านก็เคยหลอกลวงข้ามาก่อนแล้ว หลังจากหลายปีที่ต้องจากไปต่างแดนในฐานะตัวประกัน มันยากเหลือเกินที่จะแยกแยะว่าสิ่งใดคือ#EMP บ้าน#! และสิ่งใด#EMP ไม่ใช่#!...\n\nเตาผิงนี้เคยอยู่ตรงนี้เสมอหรือไม่? โถงทางเดินนี้เคยดำมืด เช่นนี้เสมอหรือ? ข้าไม่รู้เลย"
 bp2_yearly.3011.desc_parent: "\n\nเมื่อข้าสบตากับ[parent.GetMotherFather]ของข้าที่อยู่อีกฟากของห้อง ข้าเห็นความเศร้าของตัวเองสะท้อนอยู่ในดวงตาของ[parent.GetHerHis] และเรากอดกันแน่น"
 bp2_yearly.3011.desc_no_parent: "\n\nเมื่อข้าสบตากับ[parent.GetMotherFather]ของข้าที่อยู่อีกฟากของห้อง [parent.GetSheHe]เพียงถอนหายใจและเบือนหน้าหนีไป"
 bp2_yearly.3011.a: "บัดนี้ข้าคือคนแปลกหน้า"
 bp2_yearly.3011.b: "ข้ายังคงเป็นส่วนหนึ่งของที่นี่!"
 bp2_yearly.3010.a.tt: "[child.GetFirstNameNoTooltip]ยอมรับความหลากหลายของ[child.GetHerHis]"
 bp2_yearly.3010.b.tt: "[child.GetFirstNameNoTooltip]ยึดมั่นในต้นกำเนิดของ[child.GetHerHis]"
