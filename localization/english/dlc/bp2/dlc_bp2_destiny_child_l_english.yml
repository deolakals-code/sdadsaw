l_english: 
 destiny_child.0001.t: "เด็กแห่งโชคชะตา"
 destiny_child.0001.desc: "มีความเข้มข้นบางอย่างในแววตาของ [destiny_child.GetFirstNamePossessive]\n\n[destiny_child.GetSheHe|U] เดินด้วยท่วงท่าอันสง่างามภาคภูมิ [destiny_child.GetSheHe|U] พูดด้วยความเชื่อมั่นและความหนักแน่น ด้วยความชัดเจนของพยางค์อันประณีต ผู้เฒ่าผู้แก่อายุมากกว่า [destiny_child.GetHerHis] ถึงห้าเท่าต่างตั้งใจฟังขณะที่ [destiny_child.GetSheHe] พูด ถูกดึงดูดด้วยแรงดึงดูดแห่งบุคลิกภาพของ [destiny_child.GetFirstNamePossessiveNoTooltip] ราวกับแมลงเม่าบินเข้ากองไฟ\n\nมีบางสิ่งที่พิเศษเกี่ยวกับเด็กคนนี้ บทเพลงเก่าแก่กล่าวถึงผู้ที่ถูกหมายมั่นให้แบกรับภาระของชนชาติ เป็นบุคคลผู้มีบุคลิกอันยิ่งใหญ่และความสามารถที่ยิ่งใหญ่กว่า อาจเป็นความจริงได้หรือไม่?\n\n[destiny_child.GetFirstNameNoTooltip] อาจได้รับการเจิมจากโชคชะตาแล้วหรือ?"
 destiny_child.0001.a: "เด็กคนนี้ต้องการการฟูมฟัก"
 destiny_child.0001.a.tt: "มี #EMP บางอย่าง#! เกี่ยวกับ [destiny_child.GetHerHim]..."
 destiny_child.0001.b: "เรื่องไร้สาระอะไรกัน ลูกหมาตัวนี้จักต้องรู้ที่ทางของ [destiny_child.GetHerHis]"

 destiny_child.1000.t: "เยาวชนร่างกำยำ"
 destiny_child.1000.desc: "ข้าตระหนักได้ — ขณะเฝ้าดู [destiny_child.GetFirstName] ฝึกซ้อมเพลงดาบ — ว่า [destiny_child.GetSheHe] กำลังพัฒนาเป็นผู้มีร่างกายอันแข็งแกร่งอย่างแท้จริง\n\nเพลงดาบอีกครั้งฟาดผ่านอากาศ [destiny_child.GetFirstNameNoTooltip] ตามด้วยท่วงท่าและความมุ่งมั่น ข้าสั่นสะท้านเมื่อจินตนาการว่าจะเป็น เช่นไรหากอยู่ปลายดาบนั้น แต่ส่วนลึกในใจข้าสงสัยว่าการมุ่งเน้นไปที่พละกำลัง เช่นนี้จะเป็นประโยชน์อย่างแท้จริงหรือไม่"
 destiny_child.1000.a: ""เพลงดาบยอดเยี่ยม! ทำต่อไป!""
 destiny_child.1000.b: ""อย่าละเลยความอดทน [destiny_child.GetFirstNameNoTooltip]""

 destiny_child.1005.t: "ปัญญาเฉียบแหลม"
 destiny_child.1005.desc: "ข้าเลี้ยวหัวมุมไปพบ [destiny_child.GetFirstName] และ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] ของข้า [realm_priest.GetFirstName] กำลังโต้เถียงกันอย่างดุเดือด ไม่ใช่การทะเลาะวิวาท เท่าที่ข้าบอกได้ แต่เป็นการแลกเปลี่ยนความคิดเห็นอย่างมีชีวิตชีวา\n\n[destiny_child.GetFirstNameNoTooltip] ดวงตาของ [destiny_child.GetHerHis] เป็นประกาย กำลังโต้แย้งรายละเอียดปลีกย่อยทางศาสนาอย่างกระตือรือร้น [realm_priest.GetFirstNameNoTooltip|U] ต้องให้เครดิต [realm_priest.GetHerHis] ดูเหมือนจะปฏิบัติต่อ [destiny_child.GetFirstNameNoTooltip] อย่างเท่าเทียมแม้จะมีอายุต่างกัน"
 destiny_child.1005.a: "ช่างมีวาทศิลป์! ช่างมีปัญญา!"
 destiny_child.1005.b: ""ท่านกำลัง ทำให้ [destiny_child.GetFirstNameNoTooltip] ห่างเหินจากการฝึกฝนการต่อสู้ของ [destiny_child.GetHerHis] [realm_priest.GetFirstNameNoTooltip]""
 destiny_child.1005.c: "ข้ามั่นใจว่า [destiny_child.GetFirstNameNoTooltip] จักได้เรียนรู้มากมายจากสิ่งนี้"

 destiny_child.1010.t: "หัวคิดทางการทหาร"
 destiny_child.1010.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))|U] ของข้า [marshal.GetFirstName] และข้ากำลังหมกมุ่นอยู่กับเกมสงคราม ก้มมองโต๊ะที่มีตัวหมากเล็กๆ แทนกองทหารต่างๆ ข้าแทบไม่สังเกตเห็น [destiny_child.GetFirstName] เดินเข้ามาใกล้ แต่สายตาอันดุร้ายของ [destiny_child.GetHerHis] ที่จับจ้องไปยังโต๊ะนั้นเผยให้เห็นถึงความเข้มข้นของการคำนวณภายในของ [destiny_child.GetHerHis] ทันที\n\n\"ตรงนี้\" เสียงของ [destiny_child.GetFirstNamePossessiveNoTooltip] ทำให้ข้าตกใจ \"กลุ่มนั้นกำลังปะทะกัน ซึ่งหน้า หากท่านใช้ป่านั้นเป็นฉากกำบังการเข้าใกล้ ท่านจะสามารถจับพวกเขาได้อย่างไม่ทันตั้งตัว...\"\n\n[marshal.GetFirstNameNoTooltip] เลิกคิ้วของ [marshal.GetHerHis] ขึ้นเหนือหลังของ [destiny_child.GetFirstNamePossessiveNoTooltip] ขณะที่ [destiny_child.GetSheHe] เอนตัวลงเพื่อย้ายตัวหมาก"
 destiny_child.1010.a: ""จริง แต่การทำ เช่นนั้นจะ ทำให้พวกเขาเปิดโล่ง เห็นหรือไม่?""
 destiny_child.1010.a.tt: "ความเข้าใจในกลยุทธ์การต่อสู้ของ [destiny_child.GetFirstNamePossessiveNoTooltip|U] นั้นก้าวหน้าแล้ว แต่ยังมีอีกมากที่ [destiny_child.GetSheHe] ยังไม่รู้"
 destiny_child.1010.b: "พระเจ้าช่วย [destiny_child.GetFirstNameNoTooltip|U] พูดถูก!"
 destiny_child.1010.c: ""ตรงนี้ ลองทบทวนกับข้าอีกครั้งได้หรือไม่?""

 destiny_child.1015.t: "การฝึกฝนสร้าง..."
 destiny_child.1015.desc: "ดาบสองเล่มกระทบกันในแสงแดดจ้า ครูดไปตามความยาวของกันและกันพร้อมเสียงโลหะ #EMP แฉง!#!.\n\n[destiny_child.GetFirstName] เต้นถอยหลังอย่างแผ่วเบา ถือดาบราวกับเป็นส่วนต่อขยายของแขน [destiny_child.GetHerHis] คู่ซ้อมของ [destiny_child.GetHerHis|U] [knight.GetFirstName|U] โซเซตาม [destiny_child.GetHerHim] หอบเล็กน้อย\n\nทั้งสองซ้อมกันมาสักพักแล้ว และ [destiny_child.GetFirstNameNoTooltip] แทบไม่มีเหงื่อออกเลย ข้าสงสัยว่า [destiny_child.GetSheHe] กำลัง #EMP พยายาม#! อยู่หรือไม่?!"
 destiny_child.1015.a: ""เจ้าต้องผลักดันตนเองให้หนักขึ้น [destiny_child.GetFirstNameNoTooltip]!""
 destiny_child.1015.a.success: "[destiny_child.GetFirstNameNoTooltip] บรรลุถึงระดับความสามารถใหม่"
 destiny_child.1015.a.failure: "[destiny_child.GetSheHe|U] ใช้กำลังเกินตัว [destiny_child.GetHerselfHimself]"
 destiny_child.1015.a.critfailure: "[destiny_child.GetSheHe|U] ทำผิดพลาดอย่างร้ายแรง เนื่องจากความกดดัน"
 destiny_child.1015.b: "บางทีข้าควรจะรับช่วงต่อ?"
 destiny_child.1015.b.success: "คำสอนของท่านพิสูจน์ว่ามีค่ามากกว่าของ [knight.GetFirstNamePossessiveNoTooltip]"
 destiny_child.1015.b.failure: "ท่านพิสูจน์ว่าไม่สามารถตาม [destiny_child.GetFirstNameNoTooltip] ได้ทัน เช่นกัน"
 destiny_child.1015.c: ""ทำต่อไปเถิด เจ้าทั้งสอง และเหรียญเล็กน้อยสำหรับความลำบากของ [knight.GetFirstNamePossessiveNoTooltip]!""

 destiny_child.1020.t: "การเรียนรู้นอกหลักสูตร"
 destiny_child.1020.desc: "เรื่องราวแปลกประหลาดมักปรากฏขึ้นในยามที่เราคาดไม่ถึง และมันก็เป็น เช่นนั้นเมื่อ [physician.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('physician'))|U] ของข้า และ [herbalist.GetFirstName] ผู้เยียวยามากประสบการณ์ เผชิญหน้าข้าพร้อมกับ [destiny_child.GetFirstName] ผู้ตื่นเต้นจนเกินควร\n\n"[destiny_child.GetFirstNameNoTooltip] ผู้นี้ปรารถนาจะเรียนรู้วิชาชีพหนึ่งของเรา [ROOT.Char.Custom('FormOfAddressForLiege')]" [physician.GetFirstNameNoTooltip] เริ่มต้น "และพวกเราก็ยินดีที่จะสอน [destiny_child.GetHerHim]" [herbalist.GetFirstNameNoTooltip] ขัดจังหวะอย่างเหนื่อยอ่อนใจ\n\n"พวกเราเพียงต้องการคำอนุญาตจากท่าน เพราะข้าจะไม่เป็นคนพา [destiny_child.GetHerHim] ไปจากการศึกษาของ [destiny_child.GetHerHis] โดยปราศจากสิ่งนั้น!""
 destiny_child.1020.a: "เวลาอยู่กับแพทย์อาจใช้ไปอย่างคุ้มค่า..."
 destiny_child.1020.b: "สมุนไพรเป็นสาขาการวิจัยที่น่าสนใจ!"
 destiny_child.1020.c: ""เพียงแค่... อย่าให้มันกินเวลาจากการศึกษาของเจ้ามากเกินไป""

 destiny_child.1025.t: "ข่าวสารเดินทางไกล"
 destiny_child.1025.desc: "เสียงม้าร้อง ทำให้ข้าสะดุ้ง [famous_knight.Custom('KnightCultureNoTooltip')|l] ผู้ขี่ม้าศึกควบม้าของ [famous_knight.GetHerHis] มาทางข้า\n\n"[ROOT.Char.GetTitledFirstName]! นั่นท่านหรือ?" [famous_knight.GetSheHe|U] ก้มศีรษะลงอย่างเคารพ "ข้ามาตามหาเด็กคนหนึ่ง — [destiny_child.GetFirstNameNoTooltip] [destiny_child.GetSheHe|U] อยู่ในความดูแลของท่าน ใช่หรือไม่?" ข้าพยักหน้า ขณะที่องครักษ์ผู้ระแวดระวังของข้าเข้ามาใกล้\n\n"อย่าได้กลัวเลย ข้ามีชื่อเสียงในสิทธิของข้าเอง... แต่ข่าวความสามารถของ [destiny_child.GetFirstNamePossessiveNoTooltip] ของท่านแพร่กระจายไปราวกับไฟป่า! ข้าจักเป็นเกียรติอย่างยิ่งที่ได้ทำความรู้จักกับ [destiny_child.GetHerHis] และบางทีอาจช่วยบ่มเพาะพรสวรรค์ของ [destiny_child.GetHerHis]""
 destiny_child.1025.a: "#EMP "ไปให้พ้น,#! นักฆ่าชั่วร้าย! #EMP ทหาร!#!"
 destiny_child.1025.b: "ฝึกฝน [destiny_child.GetHerHim]? เป็นความคิดที่ยอดเยี่ยม!"
 destiny_child.1025.c: ""บางทีท่านอาจจะถูกชักชวนให้อยู่ต่อได้หรือไม่?""

 destiny_child.1030.t: "ผู้สืบทอดคนต่อไป?"
 destiny_child.1030.desc: "[destiny_child.GetFirstName] มีพรสวรรค์อย่างแท้จริง คำพูดของ [destiny_child.GetHerHis|U] มีน้ำหนักราวกับคนอายุมากกว่าหลายสิบปี และผู้คนก็ติดตามความเป็นผู้นำของ [destiny_child.GetHerHis] โดยสัญชาตญาณ ไม่ต้องสงสัยเลยว่าอนาคตของตระกูลข้าอยู่ที่ใด แต่กระนั้น แต่กระนั้น...\n\nไม่ว่าเสน่ห์และทักษะของ [destiny_child.GetFirstNamePossessiveNoTooltip] จะเป็น เช่นไร กฎหมายของ [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'ค่าย', 'แผ่นดิน')] ก็เป็นไปตามนั้น [destiny_child.GetSheHe|U] ไม่ใช่ทายาทหลักของข้า เมื่อข้าจากไป พรสวรรค์และทักษะทั้งหมดนั้นจะถูกนำไปใช้เพียงเพื่อรับใช้การไล่ตามแผนการของ [destiny_child.Custom2('RelationToMeShort', SCOPE.sC('current_heir'))] ของ [destiny_child.GetHerHis] [current_heir.GetFirstNamePossessive]\n\nณ ตรงนั้น ในมุมหนึ่งของความคิดข้า คือเดิมพัน นี่คือการตัดสินใจที่มรดกของข้าจะขึ้นอยู่กับมัน"
 destiny_child.1030.a: "หากข้าใช้เล่ห์เหลี่ยมทั้งหมด บางทีสิ่งนี้อาจเข้าที่เข้าทาง..."
 destiny_child.1030.a.success: "แผนการอันเงียบเชียบของท่านสำเร็จ"
 destiny_child.1030.a.failure: "แผนการของท่านถูกสังเกตเห็น และเกิดความโกลาหลขึ้น"
 destiny_child.1030.b: "ข้ามิอาจเสี่ยงที่จะปล่อยให้เรื่องราวของ [destiny_child.GetFirstNamePossessiveNoTooltip] ไม่ถูกเล่าขาน"
 destiny_child.1030.c: "กฎหมายเป็นไปตามนั้น มิอาจล้มล้างได้"
 destiny_child.1030.c.tt: "ข้าต้องเตรียมทายาทที่แท้จริง แต่ก็ต้องมอบทักษะให้ [destiny_child.GetFirstNameNoTooltip] เพื่อปกป้อง [current_heir.GetHerHim] ด้วย"

 destiny_child.1035.t: "รักแรกแย้ม"
 destiny_child.1035.desc: "ความสามารถของ [destiny_child.GetFirstNamePossessive] นั้นยอดเยี่ยมจนบางครั้งข้าลืมไปว่า [destiny_child.GetSheHe] ยังเป็นเด็ก แต่ขณะที่เราเดินทางข้าม [ROOT.Char.Custom('GetCourtyard')] และข้าได้ยินเสียงหัวเราะคิกคักของเด็กสองคนที่อยู่ข้างๆ เรา ข้าก็นึกขึ้นได้ทันทีว่าเด็กก็ยังคงเป็นเด็กอยู่วันยังค่ำ\n\nเด็กสองคนที่หัวเราะคิกคักนั้นเห็นได้ชัดว่าหลงใหล [destiny_child.GetFirstNameNoTooltip] ถึงขนาดที่ทั้งคู่จ้องมองพื้นอย่างฉุนเฉียวทันทีที่ [destiny_child.GetSheHe] ทักทายพวกเขาอย่างร่าเริง"
 destiny_child.1035.interested: "\n\nแม้ว่า [destiny_child.GetSheHe] จะฉลาดเกินวัย [destiny_child.GetHerHis] ข้าก็เห็นรอยยิ้มที่มุมปากของ [destiny_child.GetFirstNamePossessiveNoTooltip]..."
 destiny_child.1035.notinterested: "\n\nอย่างไรก็ตาม น่าประหลาดใจที่ [destiny_child.GetSheHe] ไม่พูดอะไรต่อ [destiny_child.GetSheHe] เดินหน้าต่อไปอย่างไม่สะทกสะท้าน กระโดดขึ้นบันไดที่นำไปสู่ด้านใน"
 destiny_child.1035.a: "[destiny_child.GetFirstNameNoTooltip] ค่อนข้างจะชอบ [flirter_1.GetFirstNameNoTooltip]..."
 destiny_child.1035.b: "ข้าคิดว่า [destiny_child.GetFirstNameNoTooltip] ค่อนข้างจะชอบ [flirter_2.GetFirstNameNoTooltip]!"
 destiny_child.1035.c: ""เป็นการดีที่เจ้าไม่ปล่อยให้เรื่องไร้สาระ เช่นนั้นมารบกวนเจ้า [destiny_child.GetFirstNameNoTooltip]""
 destiny_child.1035.d: ""เจ้าต้องมีสมาธิ [destiny_child.GetFirstNameNoTooltip]!""
 destiny_child.1035.d.tt: "จะมีเวลาสำหรับ #EMP เรื่องนั้น#! ในภายหลังในชีวิตของ [destiny_child.GetHerHis]..."

 destiny_child.9999.t: "โชคชะตาบรรลุผล"
 destiny_child.9999.desc: "การเติบโตอย่างต่อเนื่องของ [destiny_child.GetFirstName] ค่อยๆ คืบคลานเข้ามาหาข้า แต่บัดนี้ข้ามอง [destiny_child.GetHerHim] ด้วยสายตาของเพื่อนร่วมรุ่น เมื่อนานมาแล้ว ข้าได้เห็นศักยภาพของ [destiny_child.GetHerHis] และตัดสินใจที่จะบ่มเพาะมัน ข้าแทบไม่รู้ว่าจะคาดหวังอะไรในตอนนั้น แต่เป็นที่ประจักษ์ว่าความพยายามของข้าไม่ได้สูญเปล่า\n\n[destiny_child.GetFirstNameNoTooltip] ยืนเผชิญหน้ากับข้า ยิ้มแย้ม และแม้จะคุ้นเคยกัน ข้าก็อดไม่ได้ที่จะรู้สึกถึงแรงดึงดูดตามธรรมชาติที่ [destiny_child.GetSheHe] แผ่ออกมา ไม่ต้องสงสัยเลย: [destiny_child.GetWomanMan] ผู้นี้ถูกลิขิตมาเพื่อความยิ่งใหญ่ด้วยวิธีอันลึกลับบางอย่าง\n\nข้ามั่นใจว่าข้าได้ทำสิ่งที่ถูกต้องโดยการช่วยเหลือการเดินทางของ [destiny_child.GetHerHis] ไปตามเส้นทางแห่งโชคชะตาที่ถักทออย่างทรยศ"
 destiny_child.9999.a: "นับเป็นเกียรติอย่างยิ่ง"
