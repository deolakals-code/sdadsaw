l_english: 
 
 bp2_yearly.2000.t: "เจริญรอยตาม"
 bp2_yearly.2000.desc_dynasty: ""...และนั่นล่ะ [story_teller.Custom2( 'RelationToMeShort', ROOT.Char )] ที่รัก คือที่มาของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U] อันยิ่งใหญ่! [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] ของเจ้า [root_house_founder.GetTitledFirstName] มีชื่อเสียงในด้านความเป็นผู้ [target_trait.GetName( GetPlayer )|l]"\n\n[ROOT.Char.Custom2( 'RelationToMeShort', story_teller )] ของข้า [story_teller.GetTitledFirstName] เล่าเรื่องต้นกำเนิดบรรพบุรุษของตระกูลเราจบลง [story_teller.GetSheHe|U] เพลิดเพลินกับการสอนประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ให้แก่ข้า แต่วันนี้ การสนทนาของเราเต็มไปด้วยเรื่องราวอันเป็นแรงบันดาลใจเกี่ยวกับ [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] ของข้า ผู้ก่อตั้งตระกูลของเรา"
 bp2_yearly.2000.desc: ""...และนั่นล่ะ [ROOT.Char.Custom('GirlBoy')] ที่รัก คือที่มาของตระกูล [ROOT.Char.GetHouse.GetBaseName|U] [root_house_founder.GetTitledFirstName] มีชื่อเสียงในด้านความเป็นผู้ [target_trait.GetName( ROOT.Char )|l]"\n\n[ROOT.Char.Custom2( 'RelationToMeShort', story_teller )] ของข้า [story_teller.GetTitledFirstName] เล่าเรื่องต้นกำเนิดบรรพบุรุษของตระกูลข้าจบลง [story_teller.GetSheHe|U] มักจะสอนประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ให้แก่ข้า แต่วันนี้เต็มไปด้วยเรื่องราวอันเป็นแรงบันดาลใจเกี่ยวกับ [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )] ของข้า [root_house_founder.GetFirstNameNoTooltip] ผู้ก่อตั้งตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U]"
 bp2_yearly.2000.a: "ข้าควรจะเอาอย่าง [root_house_founder.GetHerHim]..."
 bp2_yearly.2000.a.negative: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U] ไม่ได้ยิ่งใหญ่ขึ้นมาโดยปราศจากความเสี่ยง..."
 bp2_yearly.2000.b: "ข้าต้องสร้างความแตกต่างจากบรรพบุรุษของข้า"
 bp2_yearly.2000.c: "ข้าจะสวมตราสัญลักษณ์ของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] อย่างภาคภูมิ!"
 bp2_yearly.2000.c.tt: "ท่านมอบหมายให้ [GetCourtPositionType( 'court_artificer_court_position' ).GetNameNoTooltip] ของท่าน [artificer.GetName] สร้างเครื่องประดับพร้อมตราประจำตระกูล [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
 bp2_yearly.2000.d: "ข้าแค่อยากออกไปเล่นข้างนอก!"

 bp2_yearly.2001.desc: ""...และนั่นล่ะ [ROOT.Char.Custom('GirlBoy')] ที่รัก คือเรื่องราวของ [ROOT.Char.Custom2( 'RelationToMe', ancestor )] ของเจ้า [ancestor.GetTitledFirstName]; [ancestor.GetSheHe] มีชื่อเสียงในด้านความเป็นผู้ [target_trait.GetName( GetPlayer )|l]"\n\n[ROOT.Char.Custom2( 'RelationToMe', story_teller )] ของข้า [story_teller.GetTitledFirstName] เล่าตำนานของบรรพบุรุษข้าจบลง [story_teller.GetSheHe|U] เพลิดเพลินกับการสอนประวัติศาสตร์ของตระกูลข้า แต่วันนี้การสนทนาเต็มไปด้วยเรื่องราวอันน่าอัศจรรย์และเป็นแรงบันดาลใจเกี่ยวกับชัยชนะของครอบครัวข้า"
 bp2_yearly.2001.a: "ข้าควรจะเอาอย่าง [ancestor.GetHerHim]..."

 bp2_yearly.2002.desc: "[ROOT.Char.Custom2( 'RelationToMe', artificer )] ของข้า [artificer.GetFirstName] สร้าง [newly_created_artifact.GetNameNoTooltip] ที่ข้าสั่งทำเสร็จแล้ว! [artificer.GetSheHe|U] นำมามอบให้ข้า:\n\n"ฝ่าบาท นี่คือ [newly_created_artifact.GetDesc|l]""
 bp2_yearly.2002.a: "ผลงานยอดเยี่ยม [artificer.GetFirstNameNoTooltip]!"


 house_founder_ring_name: "$artifact_ring$ ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_ring_desc: "แหวนอันสง่างาม ฝีมือประณีต แสดงตราประจำตระกูล [ROOT.Char.GetHouse.GetBaseName] อย่างเด่นชัด $house_founder_artifact_motto_desc$"
 house_founder_necklace_name: "$artifact_necklace$ ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_necklace_desc: "[newly_created_artifact.GetDesc]\n\nตราประจำตระกูล [ROOT.Char.GetHouse.GetBaseName] สลักอยู่ตรงกลาง $house_founder_artifact_motto_desc$"
 house_founder_brooch_name: "$artifact_brooch$ ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 house_founder_brooch_desc: "[newly_created_artifact.GetDesc]\n\nตราประจำตระกูล [ROOT.Char.GetHouse.GetBaseName] สลักอยู่ตรงกลาง $house_founder_artifact_motto_desc$"
 house_founder_artifact_motto_desc: ""#EMP [ROOT.Char.GetHouse.GetMotto]#!" สลักด้วยอักษรวิจิตรด้านหลัง"

 # Imaginary Friend Events
 gained_imaginary_friend: "ได้รับสหายในจินตนาการ"
 imaginary_friend_significantly_increase_relationship: "มิตรภาพของท่านกับ [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จะ #difficulty_easy ดีขึ้นอย่างมาก#!"
 imaginary_friend_increase_relationship: "มิตรภาพของท่านกับ [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จะ #p ดีขึ้น#!"
 imaginary_friend_decrease_relationship: "มิตรภาพของท่านกับ [THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จะ #n เสียหาย#!"
 please_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จะพอใจ"
 displease_imaginary_friend: "[THIS.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จะไม่พอใจ"

 bp2_yearly.2010.t: "สหายใหม่ผู้ลึกลับ"
 bp2_yearly.2010.desc: "ข้านั่งอยู่ตามลำพัง เล่นกับ [ROOT.Char.Custom( 'child_favorite_toy' )] ของข้า... อีกแล้ว\n\nชีวิตของ [ROOT.Char.GetTitleAsNameNoTooltip] มีหลายสิ่งอย่างเหลือเฟือ แต่สิ่งที่เหลือเฟือยิ่งกว่าสิ่งอื่นใดคือความอ้างว้าง "
 bp2_yearly.2010.desc.landed: "โดยเฉพาะอย่างยิ่งเมื่อ [ROOT.Char.Custom2( 'RelationToMeShort', ruler_parent )] ของข้าปกครอง [ruler_parent.GetPrimaryTitle.GetNameNoTier] ในขณะที่ข้ามีภาระหน้าที่ทั้งหมดสำหรับ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 bp2_yearly.2010.desc.parents_dead: "โดยเฉพาะอย่างยิ่งเมื่อบิดามารดาของข้าทั้งสองสิ้นไปแล้ว"
 bp2_yearly.2010.outro: "\n\nเสียงฝีเท้าเบาๆ ต๊อกแต๊กดังเข้าหูข้า เมื่อเงยหน้าขึ้น ข้าเห็นเด็กที่ไม่คุ้นเคยอายุราวๆ ข้า [ROOT.Char.Custom('GetSheHeOpposite')|U] มองของเล่นของข้าอย่างสงสัยใคร่รู้\n\n"ข้าจำชื่อตัวเองไม่ได้..." [ROOT.Char.Custom('GetSheHeOpposite')] พึมพำ น้ำตาเริ่มคลอเบ้า\n\n"ไม่เป็นไร! ข้าจะเรียกเจ้าว่า...""
 bp2_yearly.2010.a: "[name_option_1.GetFirstNameNoTooltip]"
 bp2_yearly.2010.b: "[name_option_2.GetFirstNameNoTooltip]"
 bp2_yearly.2010.c: "[name_option_3.GetFirstNameNoTooltip]"

 bp2_yearly.2011.t: "เกมแห่งจินตนาการ"
 bp2_yearly.2011.desc: "เพื่อนของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] และข้ากำลังเล่นเกม [ROOT.Char.Custom('BG_GameType_Generic')] ที่น่าตื่นเต้นกันอยู่ เมื่อ [participant.GetFirstName], [ROOT.Char.Custom2( 'RelationToMe', participant )|l] ของข้า, เดินเข้ามาพร้อมรอยยิ้มเยาะเย้ยบนใบหน้าของ [participant.GetHerHis]\n\n\"ฝึกเล่น [ROOT.Char.Custom('BG_GameType_Generic')] คนเดียว — #EMP น่าเศร้าจัง!#! ข้าเดาว่าเมื่อเจ้าไม่มีเพื่อน มันก็เป็นสิ่งเดียวที่ทำได้...\"\n\n[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จ้องมองอย่างเศร้าสร้อยด้วยความสับสนเงียบๆ..."
 bp2_yearly.2011.a: "อย่าพูดถึง [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ราวกับว่า [ROOT.Char.Custom('GetSheHeOpposite')] ไม่ได้อยู่ที่นี่!"
 bp2_yearly.2011.b: "เจ้าไม่มีอะไรดีกว่านี้ทำแล้วหรือ?"
 bp2_yearly.2011.c: "ข้าแค่ฝึกซ้อมเท่านั้น..."
 bp2_yearly.2011.bully.toast: "ได้รับ $relation_bully$"

 bp2_yearly.2012.t: "ยืนยันอำนาจของข้าอีกครั้ง"
 bp2_yearly.2012.desc: "[ROOT.Char.Custom2( 'RelationToMe', regent_scope )] ของข้า [regent_scope.GetFirstName] คอยขัดขวางข้าทุกวิถีทาง ข้าเริ่มเบื่อหน่ายกับแผนการของ [regent_scope.GetHerHis] ที่จะยึดอำนาจอันชอบธรรมของข้า โชคไม่ดีที่ที่ปรึกษาหลายคนของข้าล้วนอยู่ในกำมือของ [regent_scope.GetHerHis]\n\n"เจ้าควรจะยืนหยัดต่อสู้กับ [regent_scope.GetHerHim]" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] กล่าว ปรากฏตัวขึ้นข้างกายข้าทันที "หรืออย่างน้อยก็สร้างสถานการณ์น่าอับอายให้ [regent_scope.GetHerHim] เสียหน่อย""
 bp2_yearly.2012.a: "ถึงเวลาปราศรัยต่อราชสำนักและยืนยันความสามารถของข้าแล้ว"
 bp2_yearly.2012.a.success: "ท่านย้ำเตือนราชสำนักถึงอำนาจของท่าน"
 bp2_yearly.2012.a.failure: "[regent_scope.GetFirstNameNoTooltip] ทำให้ท่านกลายเป็นตัวตลก"
 bp2_yearly.2012.b: "ข้าจะทำลายอานม้าของ [regent_scope.GetHerHis]"
 bp2_yearly.2012.b.success: "ท่าน ทำให้ [regent_scope.GetFirstNameNoTooltip] กลายเป็นตัวตลก"
 bp2_yearly.2012.b.failure: "[regent_scope.GetFirstNameNoTooltip] ค้นพบการก่อวินาศกรรม"
 bp2_yearly.2012.c: "การรบกวนสมดุลอำนาจนั้นเสี่ยงเกินไป"

 bp2_yearly.2013.t: "ท่านแน่ใจหรือ?"
 bp2_yearly.2013.desc: "สหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] จู้จี้เรื่องพฤติกรรมของข้ามาทั้งวัน ดูเหมือนว่าการโต้เถียงของเราจะถึงจุดแตกหักในที่สุด\n\n"ข้าสังเกตเห็นว่าเจ้าทำตัว [target_trait.GetNameNoTooltip( ROOT.Char )|l] มากขึ้นเรื่อยๆ ในช่วงนี้... เจ้าไม่คิดหรือว่าเจ้าจะเติบโตเป็น [ROOT.Char.GetTitleAsNameNoTooltip|l] ที่ดีขึ้นหากเจ้าเป็นคน [opposite_trait.GetNameNoTooltip( ROOT.Char )|l] แทน?""
 bp2_yearly.2013.a: "ข้ามีความสุขดีกับการเป็นคน [target_trait.GetNameNoTooltip( ROOT.Char )|l]"
 bp2_yearly.2013.b: "ข้าเชื่อว่าเจ้าพูดถูกส่วนหนึ่ง..."
 bp2_yearly.2013.c: "เจ้าพูดถูก — ข้าจะมีประสิทธิภาพมากขึ้นหากข้าเป็นคน [opposite_trait.GetNameNoTooltip( ROOT.Char )|l]"

 bp2_yearly.2014.t: "ความปิ๊งที่อาจเกิดขึ้น"
 bp2_yearly.2014.desc: "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] และข้ากำลังเดินเล่นอยู่ในสวน เมื่อ [ROOT.Char.Custom( 'GetSheHeOpposite' )] เปลี่ยนบทสนทนาของเราไปเป็นเรื่องความรักและความปรารถนา\n\n\"ข้ารู้ใจเจ้า: เจ้าแอบชอบ [crush.GetFirstName] เจ้าควรส่งจดหมายไปหา [crush.GetHerHim] เพื่อยกย่อง [crush.GetHerHim] และสรรเสริญคุณสมบัติอัน [crush.Custom( 'RomanticComplimentAdjective' )] ของ [crush.GetHerHis]\"\n\n\"หากเจ้ารู้สึกซุกซนเป็นพิเศษ เจ้าอาจเปิดเผยว่าเจ้ารู้จัก [crush.GetHerHim] ว่า [crush.GetSheHe] [crush.Custom( 'RomanticComplimentAdjective') ] เพียงใดจริงๆ...\" "
 bp2_yearly.2014.a: "ผู้ [crush.Custom( 'RomanticComplimentAdjective')] ผู้นี้จะได้รู้สิ่งที่อยู่ในใจข้า!"
 bp2_yearly.2014.a.success: "[crush.GetFirstNameNoTooltip] เริ่มปิ๊งท่าน"
 bp2_yearly.2014.b: "อย่า ทำให้ [crush.GetHerHim] กลัวหนีไปจะดีกว่า"
 bp2_yearly.2014.c: "จริงๆ แล้วข้าสนใจ #EMP เจ้า#! มากกว่า..."
 bp2_yearly.2014.d: "ข้าทำไม่ได้หรอก!"

 bp2_yearly.2015.t: "สหายผู้ให้กำลังใจ"
 bp2_yearly.2015.desc: ""ข้าจะไม่มีวันเป็นอิสระจากไอ้ [bully.Custom2('InsultNoun', ROOT.Char)] นั่นเลยรึ?!" ข้าคร่ำครวญ ก้มหน้ายอมแพ้หลังจากถูก [bully.GetFirstName] คนพาลของข้า เยาะเย้ยต่อหน้าสาธารณชนอีกครั้ง\n\nขณะที่น้ำตาร้อนผ่าวไหลอาบใบหน้า ข้าก็ประหลาดใจกับสัมผัสแผ่วเบาบนไหล่ มันคือสหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] [ROOT.Char.Custom('GetSheHeOpposite')|U] อยู่ที่นั่นเสมอเมื่อข้าต้องการ [ROOT.Char.Custom('GetHerHim')]\n\n"ถึงเวลาแล้วที่เจ้าจะลุกขึ้นสู้กับ [bully.GetFirstNameNoTooltip] ที่น่ารังเกียจ ข้าแนะนำให้เริ่มปล่อยข่าวลือเกี่ยวกับสิ่งที่ [bully.GetSheHe] ชอบทำกับ [bully.Custom('child_favorite_toy')] ของ [bully.GetHerHis] ตามลำพังในห้องของ [bully.GetHerHis]..."
 bp2_yearly.2015.a: "ข้าจะยืนหยัดและรักษาเกียรติของข้า"
 bp2_yearly.2015.a.success: "ท่านอัด [bully.GetFirstNameNoTooltip] น่วม"
 bp2_yearly.2015.a.failure: "[bully.GetFirstNameNoTooltip] อัดท่านน่วม"
 bp2_yearly.2015.b: "ข่าวลือนั่นจะแพร่กระจายเหมือนไฟลามทุ่ง!"
 bp2_yearly.2015.b.success: "ท่านปล่อยข่าวลืออื้อฉาวสำเร็จ"
 bp2_yearly.2015.b.failure: "ข่าวลือของท่านไม่เป็นที่ยอมรับ"
 bp2_yearly.2015.c: "ผลที่ตามมาจะร้ายแรงเกินไป..."

 bp2_yearly.2016.t: "มิตรภาพที่เบ่งบาน"
 bp2_yearly.2016.desc: "ช่างเป็นกลุ่มกลิ่นหอมอันน่ารื่นรมย์เสียนี่กระไร\n\nข้าเพลิดเพลินกับการเดินเล่นอย่างสงบในสวน ข้าเพียงปรารถนาให้มีใครสักคนอยู่ที่นี่เพื่อแบ่งปันความสุขทางประสาทสัมผัสเหล่านี้ ชีวิตของ [ROOT.Char.GetTitleAsNameNoTooltip|l] ช่างอ้างว้าง\n\nไม่ทันที่ข้าจะคิดจบ สหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ก็โผล่ออกมาจากหลังแปลงดอกไม้: "ไปเก็บ [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] แล้วทำมงกุฎดอกไม้กันเถอะ!""
 bp2_yearly.2016.a: "ไม่มีอะไรที่ข้าอยากทำมากกว่านี้แล้ว!"
 bp2_yearly.2016.b: "ข้าไม่มีอารมณ์สำหรับเรื่องไร้สาระ เช่นนี้"

 bp2_yearly.2017.t: "อ่านหนังสือหามรุ่งหามค่ำ"
 bp2_yearly.2017.desc: "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] และข้าขลุกอยู่กับกองหนังสือมาเกือบทั้งวันแล้ว แต่เวลาก็ล่วงเลยไปมาก ข้าใช้เวลาไปกับการอ่านหนังสือมากเกินไปและเริ่มละเลยหน้าที่อื่นๆ ของข้า\n\nการปิดหนังสือของข้า ทำให้สหายของข้ามองมาอย่างขุ่นเคือง\n\n"มาเถอะ [ROOT.Char.GetFirstNameNoTooltip]" [ROOT.Char.Custom('GetSheHeOpposite')] กล่าว "อยู่ต่อแล้วอ่านหนังสือกับข้าเถิด เจ้ามีจิตใจที่ใฝ่รู้อย่างยิ่ง — ข้าไม่อยากเห็นมันสูญเปล่าไปกับสิ่งอื่นใดนอกเหนือจากความรู้""
 bp2_yearly.2017.a: "ข้าคิดว่าการตามใจตัวเองอีกสักหน่อยคงไม่เสียหาย..."
 bp2_yearly.2017.a.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [learning|E] ของท่านอย่างมาก"
 bp2_yearly.2017.b: "ไม่ ร่างกายต้องการการออกกำลังกายมากเท่ากับจิตใจ"
 bp2_yearly.2017.b.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [martial|E] ของท่านอย่างมาก"

 bp2_yearly.2018.t: "คู่คิดที่เป็นมิตร"
 bp2_yearly.2018.desc: "ข้านั่งอยู่ตามลำพัง นวดขมับด้วยความเหนื่อยล้าจากภารกิจและหน้าที่อันยาวนานตลอดวัน\n\n"เจ้าดูหมกมุ่นมากในช่วงนี้ [ROOT.Char.GetFirstNameNoTooltip]" สหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ปรากฏตัวข้างๆ ข้าและพูดอย่างอ่อนโยน\n\n"เป็นสิ่งสำคัญที่เจ้าจะต้องหาเวลาให้ตัวเองหรือหาใครสักคนไว้ปรับทุกข์เมื่อภาระของ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของเจ้าหนักเกินกว่าจะแบกรับไหว"\n\n"ข้าพร้อมรับฟังเสมอเมื่อเจ้าต้องการ สหายข้า แต่ข้ารู้ว่าบางครั้งมันยากที่จะพูดสิ่งที่รบกวนใจเราออกมา บางทีบทกวีอาจเป็นวิธีที่เหมาะสมสำหรับเจ้าในการบรรเทาภาระของเจ้า?""
 bp2_yearly.2018.a: "คู่คิดที่ไว้ใจได้คือสิ่งที่ข้าต้องการอย่างแท้จริง"
 bp2_yearly.2018.b: "ข้าจะลองเรียบเรียงความคิดของข้าเป็นบทประพันธ์ดู..."
 bp2_yearly.2018.c: "สิ่งที่ข้าต้องการจริงๆ คือตารางการฝึกที่ดี!"

 bp2_yearly.2019.t: "ความประหลาด"
 bp2_yearly.2019.desc.intro: "[target_councilor.GetTitledFirstName] [ROOT.Char.Custom2( 'RelationToMe', target_councilor )] ของข้า เดินเข้ามาหาข้ากับ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] สหายของข้า กลางวงสนทนา\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [target_councilor.GetFirstNameNoTooltip] เอ่ยถาม พลางขมวดคิ้วครุ่นคิด "หากข้าขอเวลาท่านสักครู่ ข้าใคร่ขอหารือ "
 bp2_yearly.2019.desc.chaplain: "สถานะของที่ดิน [ROOT.Char.Custom('GetFaithTemple')] ของอาณาจักร""
 bp2_yearly.2019.desc.chaplain_unlanded: "สถานะของศาลเจ้าประจำตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]""
 bp2_yearly.2019.desc.steward: "กลยุทธ์ของเราในการเก็บภาษี""
 bp2_yearly.2019.desc.steward_unlanded: "กลยุทธ์การเงินของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]""
 bp2_yearly.2019.desc.marshal: "ตารางการฝึกสำหรับทหารใหม่""
 bp2_yearly.2019.desc.marshal_unlanded: "ตารางการฝึกสำหรับทหารใหม่""
 bp2_yearly.2019.desc.spymaster: "การวางตำแหน่งสายลับคนสำคัญบางคนในราชสำนักต่างแดน""
 bp2_yearly.2019.desc.spymaster_unlanded: "การวางตำแหน่งสายลับคนสำคัญบางคนทั่วทั้งอาณาจักร""
 bp2_yearly.2019.desc.chancellor: "ความสัมพันธ์ของเรากับอาณาจักรเพื่อนบ้าน""
 bp2_yearly.2019.desc.chancellor_unlanded: "ความสัมพันธ์ของเรากับตระกูลเพื่อนบ้าน""
 bp2_yearly.2019.desc.kurultai: "สวัสดิภาพแห่งฝูงปศุสัตว์ของพวกเรา""
 bp2_yearly.2019.desc.outro: "\n\n"แน่นอน!" ข้าตอบ "มาเถอะ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ข้าอยากฟังความคิดของเจ้าเกี่ยวกับเรื่องนี้"\n\n"ต-แต่ [ROOT.Char.Custom('FormOfAddressForLiege')]" [target_councilor.GetFirstNameNoTooltip] ทำหน้าบึ้ง "ที่นี่ไม่มีผู้ใดอยู่เลยนอกจากเราสองคน...""
 bp2_yearly.2019.a: "ทำไมจะไม่มีล่ะ! [ROOT.Char.Custom('GetSheHeOpposite')|U] คือที่ปรึกษาที่ข้าไว้ใจที่สุด!"
 bp2_yearly.2019.a.tt: "ท่านยอมรับความสัมพันธ์ของท่านกับ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
 bp2_yearly.2019.b: "#EMP เอ่อ...#! ข้าพูดผิดไป ให้เราพิจารณาเรื่องนี้เป็นการส่วนตัวเถิด"
 bp2_yearly.2019.b.tt: "ท่านปฏิเสธความสัมพันธ์ของท่านกับ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"

 bp2_yearly.2020.t: "สหายลึกลับกลับมา"
 bp2_yearly.2020.desc: ""[ROOT.Char.GetFirstNameNoTooltip]... ยินดีที่ได้พบเจ้าอีกครั้ง... นานแล้วที่เราไม่ได้คุยกัน" เสียงคุ้นเคยดังก้องมาจากทางเดินมืด\n\nด้วยความสะดุ้ง ในที่สุดข้าก็รู้ว่าเสียงนี้เป็นของใคร... แต่ไม่... เป็นไปไม่ได้! #EMP [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]?!#! สหายในจินตนาการของข้าในวัยเด็ก?\n\n"ข้าเอง [ROOT.Char.GetFirstNameNoTooltip] เราต้องการกันและกันเมื่อหลายปีก่อน และตอนนี้เราต้องการกันและกันอีกครั้ง"\n\n"ข้าต้องการให้เจ้าทำบางอย่างเพื่อข้า — #EMP เพื่อเรา#! เจ้าต้องฆ่า [ROOT.Char.Custom2( 'RelationToMeShort', murder_target )] ของเจ้า [murder_target.GetFirstName] จะมี แต่สิ่งดีๆ เกิดขึ้นจากเรื่องนี้... เจ้าจะได้เห็น""
 bp2_yearly.2020.a: "หากเจ้ายืนกราน..."
 bp2_yearly.2020.b: "ไม่! ข้าจะไม่ทำ!"
 imaginary_friend_first_murder_scheme_tt: "ท่านได้รับโบนัส #EMP มหาศาล#! สำหรับ [scheme|E] [GetScheme('murder').GetTypeName] ที่มุ่งเป้าไปที่ [murder_target.GetName]"
 imaginary_friend_future_murder_scheme_tt: "ท่านได้รับโบนัส #EMP มหาศาล#! สำหรับ [scheme|E] [GetScheme('murder').GetTypeName] ที่มุ่งเป้าไปที่ [new_murder_target.GetName]"

 # Why haven't you started your murder scheme yet?
 bp2_yearly.2021.t: "การฆาตกรรมที่ล่าช้า"
 bp2_yearly.2021.desc: ""จุ๊ จุ๊ #EMP จุ๊!#!"\n\n"เรามีข้อตกลงกัน [ROOT.Char.GetFirstNameNoTooltip] เจ้าตกลงที่จะฆ่า [new_murder_target.GetTitledFirstName] แต่กลับไม่พยายามทำตามเป้าหมายนั้นเลย" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ตำหนิข้าสำหรับการไม่ลงมือทำของข้า\n\n"ข้าผิดหวัง..."
 bp2_yearly.2021.a: "ข้าจะเริ่มทันที"
 bp2_yearly.2021.b: "ข้าแค่ต้องการเวลาเตรียมตัวอีกหน่อย..."
 bp2_yearly.2021.c: "เรา #EMP จบกันแค่นี้#! [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]!"

 # Murder Successful
 bp2_yearly.2022.t: "$bp2_yearly.2020.t$"
 bp2_yearly.2022.desc: ""#EMP ดี [ROOT.Char.GetFirstNameNoTooltip] ดีมาก#!..."\n\n"เจ้าทำได้ดี สหายข้า" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] แสดงความยินดีกับข้าที่สังหาร [ROOT.Char.Custom2( 'RelationToMeShort', target )] ผู้ล่วงลับของข้า [target.GetFirstName] ได้สำเร็จ\n\n"[target.Custom('InsultNoun')] [target.Custom('InsultAdjective')] นั่นสมควรได้รับทุกสิ่งที่ [target.GetSheHe] ได้รับ เราเป็นทีมที่ #EMP ยอดเยี่ยม#! จริงๆ" [ROOT.Char.Custom('GetSheHeOpposite')] กล่าวต่อ "เจ้ารู้สึกดีขึ้นใช่ไหม? อย่างที่ข้าสัญญาไว้..."\n\n"
 bp2_yearly.2022.desc.next_target: ""แต่อย่าโอ้เอ้เลย เพราะยังมีเรื่องสนุกให้ทำอีกมาก สหายรัก [new_murder_target.GetFirstName] #EMP สุกงอมรอการเชือดแล้ว...#!""
 bp2_yearly.2022.a: "นั่นรู้สึก... #EMP ดี#!."
 bp2_yearly.2022.b: "ไม่! ได้โปรด ไปให้พ้น..."

 # Murder Invalidated
 bp2_yearly.2023.t: "การฆาตกรรมที่ถูกขัดขวาง"
 bp2_yearly.2023.desc: ""ดูเหมือนว่าจะมี... #EMP เหตุการณ์ไม่คาดฝัน#!... เกี่ยวกับแผนการฆ่า [target.GetTitledFirstName] ของเจ้า ไม่เป็นไร เราจะแก้ไขความผิดพลาดนี้ในไม่ช้า"\n\n"
 bp2_yearly.2023.a: "$bp2_yearly.2020.a$"
 bp2_yearly.2023.b: "ข้าพอแล้ว..."

 # Murder Failed
 bp2_yearly.2024.t: "$bp2_yearly.2023.t$"
 bp2_yearly.2024.desc: "$bp2_yearly.2023.desc$"
 bp2_yearly.2024.a: "$bp2_yearly.2020.a$"
 bp2_yearly.2024.b: "$bp2_yearly.2023.b$"

 # Devil Imaginary Friend Conclusion
 bp2_yearly.2025.t: "[ROOT.Char.GetTitleAsNameNoTooltip] ผู้บ้าคลั่ง"
 bp2_yearly.2025.desc: "\"เยี่ยมไปเลย, [ROOT.Char.GetFirstNameNoTooltip]! ข้าภูมิใจในตัวเจ้ามาก\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ปรากฏตัวต่อหน้าข้า\n\nข้าทำได้เพียงจินตนาการและ #EMP ลิ้มรส#! เสียงกรีดร้องของ [ROOT.Char.Custom2( 'RelationToMePossessive', target )] ของข้าขณะที่ [target.GetSheHe] สูดลมหายใจเฮือกสุดท้ายอันน่าสมเพชของ [target.GetHerHis]!\n\n\"ข้าเชื่อว่างานของข้าที่นี่เสร็จสิ้นแล้ว,\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] กล่าว\n\n... แต่ข้าแทบไม่ได้ยินเสียงของ [ROOT.Var('imaginary_friend_name').Char.GetHerHis] ท่ามกลางเสียงหัวเราะอย่างบ้าคลั่งของข้า"
 bp2_yearly.2025.a: "ข้ากระหาย #EMP เลือด!#!"
 imaginary_friend_mad_modifier_bribe_discount: "การเชิญ [agents|E] เข้าร่วม [schemes|E] จะมีค่าใช้จ่ายลดลง 50%"

 # Angle Imaginary Friend Conclusion
 bp2_yearly.2030.t: "ผู้ส่งสาร"
 bp2_yearly.2030.desc: ""#EMP [ROOT.Char.GetFirstNameNoTooltip]...#!"\n\nเมื่อหันไป ข้าเห็นสหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ยืนอยู่ข้างหลังข้า — ความสงบอันชัดเจนปรากฏบนสีหน้าของ [ROOT.Char.Custom('GetHerHisOpposite')]\n\n"มีบางอย่างที่ข้าต้องบอกเจ้า ข้าได้นำทางเจ้าอย่างเงียบๆ ตลอดหลายปีที่ผ่านมาในฐานะสหายของเจ้า แต่ข้าไม่ใช่เพียงสหายธรรมดา แต่เป็นผู้ส่งสารจาก [ROOT.Char.GetFaith.HighGodName]"\n\n"ข้ามีคำขอสุดท้ายที่จะขอจากเจ้า เจ้าต้องจุดเทียนเพื่อเป็นเกียรติแก่ข้าที่ [target_holy_site.GetNameNoTier] เมื่อนั้นข้าจึงจะได้รับอนุญาตให้กลับไปยัง [ROOT.Char.GetFaith.PositiveAfterLife]""
 bp2_yearly.2030.a: "ข้าเข้าใจสิ่งที่ข้าต้องทำ"
 bp2_yearly.2030.a.tt: "[GetActivityType('activity_pilgrimage').GetNameNoTooltip] ครั้งต่อไปของท่านไปยัง [target_holy_site.GetNameNoTier] จะถูกลง 50%"
 bp2_yearly.2030.b: "จริงหรือ? บางทีข้าควรจะทบทวนจุดยืนของข้าเกี่ยวกับเรื่อง เช่นนี้..."
 bp2_yearly.2030.c: "ข้ามั่นใจว่า [ROOT.Char.GetFaith.HighGodName] จะได้ยินคำอธิษฐานของข้าจากที่นี่"
 imaginary_friend_pilgrimage_discount: "ให้เกียรติสหายในจินตนาการของท่าน"

 bp2_yearly.2031.t: "ให้เกียรติ [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
 bp2_yearly.2031.desc: "บัดนี้ข้าได้มาถึง [ROOT.Char.GetCurrentLocation.GetName] แล้ว ถึงเวลาที่ข้าจะให้เกียรติสหายของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] [ROOT.Char.Custom('GetSheHeOpposite')|U] ได้อยู่เคียงข้างข้าผ่านช่วงเวลาที่ยากลำบากมากมาย — เป็นพรที่แท้จริงในชีวิตข้า ข้าสงสัยว่าข้าจะเป็น [ROOT.Char.GetWomanMan] อย่างที่เป็นอยู่ทุกวันนี้ได้หรือไม่หากไม่มี [ROOT.Char.Custom('GetHerHimOpposite')]\n\nแม้ว่า [ROOT.Char.Custom('GetSheHeOpposite')] อาจจะไม่ได้อยู่กับข้าต่อไป แต่ความทรงจำเกี่ยวกับ [ROOT.Char.Custom('GetHerHisOpposite')] จะคงอยู่ในตัวข้า ขณะที่ข้าจุดเทียนเพื่อเป็นเกียรติแก่ [ROOT.Char.Custom('GetHerHisOpposite')] ข้ารู้สึกถึงสัมผัสเบาๆ ที่ไหล่ เปลวเทียนสั่นไหว มีเสียงกระซิบแผ่วเบา: "#EMP ลาก่อน [ROOT.Char.GetFirstNameNoTooltip]...#!"\n\nขอบคุณ สหายข้า"
 bp2_yearly.2031.a: "จงไปสู่สุคติเถิด [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ที่รัก"
 imaginary_friend_pilgrimage_log_title: "[CHARACTER.GetName] ให้เกียรติสหายในจินตนาการของ [CHARACTER.GetHerHis]"
 imaginary_friend_pilgrimage_log: "[CHARACTER.GetName] ให้เกียรติสหายในจินตนาการของ [CHARACTER.GetHerHis] ที่ [PROVINCE.GetBaronyNameExplicitly]"
 honored_imaginary_friend_memory: "ให้เกียรติสหายในจินตนาการ"
 honored_imaginary_friend_memory_desc: "ข้าให้เกียรติสหายในจินตนาการของข้า [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ที่ [ROOT.Var('location').GetProvince.GetNameNoTooltip]"
 honored_imaginary_friend_memory_desc_second_perspective: "ท่านให้เกียรติสหายในจินตนาการของท่าน [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ที่ [ROOT.Var('location').GetProvince.GetNameNoTooltip]"
 honored_imaginary_friend_memory_desc_third_perspective: "[owner.GetFirstName] ให้เกียรติสหายในจินตนาการของ [owner.GetHerHis] [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] ที่ [ROOT.Var('location').Province.GetNameNoTooltip]"

 # Neutral Imaginary Friend Conclusion
 bp2_yearly.2040.t: "สหายจากไป"
 bp2_yearly.2040.desc: "\"[ROOT.Char.GetFirstNameNoTooltip], เจ้าเติบโตขึ้นเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่น่าทึ่งมาก,\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] กล่าว, ดวงตาของ [ROOT.Char.Custom('GetHerHisOpposite')] เริ่มมีน้ำตาคลอ\n\n\"เจ้าไม่ต้องการข้าอีกต่อไปแล้ว ถึงเวลาที่ข้าต้องจากไปและปล่อยให้เจ้าใช้ชีวิตอย่างเต็มที่และรุ่งโรจน์ มีคนมากมายรอบตัวเจ้าให้พึ่งพา\"\n\n"
 bp2_yearly.2040.desc.lover: ""[ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('lover') )] ของเจ้า [lover.GetFirstNameNoTooltip] มองเจ้าอย่างยั่วยวน บางทีเจ้าอาจไม่เคยสังเกตเห็น แต่มันเป็นความจริง [lover.GetSheHe|U] ปรารถนาสัมผัสของเจ้า"\n\n"
 bp2_yearly.2040.desc.friend: ""[friend.GetFirstNameNoTooltip] กลายเป็นสหายของเจ้าเมื่อ [ROOT.Char.Custom( 'GetPeriodOfTimeWord' )] ก่อน [friend.GetSheHe|U] อาจไม่รู้ในตอนนั้น แต่ความจงรักภักดีของ [friend.GetHerHis] ที่มีต่อเจ้านั้นไร้ขอบเขต การสนับสนุนของ [friend.GetHerHis|U] ที่มีต่อเจ้านั้นมั่นคงไม่สั่นคลอน""
 bp2_yearly.2040.a: "[lover.GetFirstNameNoTooltip] จะ ทำให้ข้าอบอุ่นเมื่อเจ้าไม่อยู่"
 bp2_yearly.2040.b: "ข้าไม่เคยรู้ถึงความจงรักภักดีของ [friend.GetFirstNamePossessiveNoTooltip] ที่มีต่อข้าเลย!"

 bp2_yearly.2100.t: "วางรากฐาน"
 bp2_yearly.2100.desc: "กรวดร่วนใต้ฝ่าเท้าส่งเสียงกรอบแกรบขณะที่ [interlocutor.GetFirstName] และข้าย่ำผ่านไป มัน ทำให้นึกถึงพื้นผิวด้านนอกขรุขระของอาคารต่างๆ ทั่วแผ่นดิน\n\n"ข้าอยากสร้างอะไรบางอย่าง" [interlocutor.GetFirstNameNoTooltip] โพล่งออกมา เห็นได้ชัดว่าคิดเหมือนข้า "เราควรสร้างอะไรสักอย่าง ที่นี่ ตรงจุดนี้! แบบจำลองอะไรสักอย่าง!" [interlocutor.GetSheHe|U] เริ่มกวาดตามองไปรอบๆ ทันที เพื่อหาวัสดุ\n\nขณะที่ [interlocutor.GetFirstNameNoTooltip] วิ่งไปยังกองไม้ใกล้ๆ ข้าก็ครุ่นคิดเพิ่มเติมเกี่ยวกับลักษณะกิจกรรมของเรา สร้าง #EMP อะไร#! กันแน่?"
 bp2_yearly.2100.a: "บางทีอาจจะเป็น [ROOT.Char.Custom('GetDiplomacyBuilding')]?"
 bp2_yearly.2100.b: "[ROOT.Char.Custom('GetMartialBuilding')] เพื่อลับดาบของเรา!"
 bp2_yearly.2100.c: "บางที [ROOT.Char.Custom('GetStewardshipBuilding')] อาจจะสอนคุณค่าของเงินให้เรา?"
 bp2_yearly.2100.d: "อะไรที่ใหญ่ๆ อย่าง [ROOT.Char.Custom('GetIntrigueBuilding')]!"
 bp2_yearly.2100.e: "ศูนย์การเรียนรู้ของเราเอง เหมือน [ROOT.Char.Custom('GetLearningBuilding')]!"
 bp2_yearly.2100.a.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [diplomacy|E] ของท่าน"
 bp2_yearly.2100.b.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [martial|E] ของท่าน"
 bp2_yearly.2100.c.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [stewardship|E] ของท่าน"
 bp2_yearly.2100.d.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [intrigue|E] ของท่าน"
 bp2_yearly.2100.e.tt: "นี่จะช่วยส่งเสริม [education_focus|E] ด้าน [learning|E] ของท่าน"

bp2_yearly.2110.t: "[GetTrait('humble').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('arrogant').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2110.desc: "[ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] ของข้า [interlocutor.GetFirstName] และข้ากำลังฝึกฝนศิลปะการต่อสู้ในลานฝึก\n\n"#EMP อั่ก!#!" [interlocutor.GetSheHe] คำรามอย่างหนักขณะที่ข้าซัด [interlocutor.GetHerHim] ลงกับพื้น [interlocutor.GetSheHe|U] เงยหน้ามองข้าด้วยความทึ่ง "เจ้าชำนาญอาวุธจริงๆ [ROOT.Char.GetFirstNameNoTooltip] ข้าหวังว่าข้าจะมีฝีมือสักครึ่งหนึ่งของเจ้า""
bp2_yearly.2110.a: ""เจ้าจะทำได้เอง [interlocutor.GetFirstNameNoTooltip] มา ลองกันอีกครั้ง!""
bp2_yearly.2110.b: ""ข้าถูกกำหนดให้เป็นนักรบที่เก่งที่สุดของตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]""
bp2_yearly.2110.c: "นิ่งเงียบ"

bp2_yearly.2120.t: "[GetTrait('temperate').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('gluttonous').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2120.desc: "#EMP กริ๊ง กริ๊ง!#!\n\nช้อนของข้าขูดก้นชามขณะที่ข้าซดสตูว์อีกถ้วย ข้าดับกระหายด้วยการดื่มจากถ้วยอย่างเต็มที่ ซึ่งอีกไม่นานก็ต้องเติม ข้าหยุดไม่ได้จริงๆ\n\n"[ROOT.Char.GetFirstNameNoTooltip]! เจ้ากำลังทำอะไรอยู่? เจ้าไม่คิดว่าเจ้า... เอ่อ #EMP กิน#! มากไปหน่อยหรือในช่วงนี้?""
bp2_yearly.2120.a: ""เจ้าพูดถูก ความตะกละของข้าต้องรู้จักประมาณตน""
bp2_yearly.2120.b: ""การกินเลี้ยง #EMP สร้าง#! [ROOT.Char.GetTitleAsNameNoTooltip] อย่างแท้จริง!""

bp2_yearly.2130.t: "[GetTrait('generous').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('greedy').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2130.desc: "เป็นโอกาสที่หาได้ยากที่ข้าจะหลบผู้ติดตามทั้งหมดได้โดยไม่มีใครสังเกตและมีเวลาส่วนตัวอันมีค่าสักครู่ — โอกาสที่จะได้รู้สึกเหมือนเด็กคนอื่นๆ บ้าง\n\nกำ [ROOT.Char.Custom( 'child_favorite_toy' )] ของข้าไว้ ข้าเดินไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ชมทิวทัศน์และสูดกลิ่นต่างๆ ผู้คนกำลังขวักไขว่ พ่อค้าเร่ขายสินค้าของตน\n\nข้าพบเด็กชาวนาท่าทางป่วยคนหนึ่งขดตัวอยู่ในมุมตรอก"
bp2_yearly.2130.a: ""นี่ ขอให้เจ้าทะนุถนอม [ROOT.Char.Custom( 'child_favorite_toy' )] นี้เหมือนที่ข้าเคยทำ""
bp2_yearly.2130.a.flavor: "ท่านมอบของเล่นของท่านให้เด็กคนนั้น"
bp2_yearly.2130.b: ""ผู้ด้อยโอกาสไม่สมควรได้รับความเอื้อเฟื้อของข้า""

bp2_yearly.2140.t: "[GetTrait('honest').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('deceitful').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2140.desc: "ข้าค่อยๆ ย่องไปตามทางเดินพร้อมกับขนมยามค่ำคืนในมือ ห้องครัวมักจะมีของเหล่านี้เตรียมไว้ให้เสมอในช่วงเช้ามืด ไม่มีอะไรจะดีไปกว่าการได้ลิ้มรส [ROOT.Char.Custom( 'FavoriteTreat' )] ที่ทำสดใหม่\n\nขณะที่ข้าเลี้ยวหัวมุม ข้าก็พบกับ [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] ของข้า [interlocutor.GetFirstName] ที่มีดวงตาสะลึมสะลือ กำลังขยี้ตาของ [interlocutor.GetHerHis] \"[ROOT.Char.GetFirstNameNoTooltip]! เจ้าบุกห้องครัว #EMP อีกแล้ว#! รึ?\"\n\nข้าซ่อน [ROOT.Char.Custom( 'FavoriteTreat' )] อย่างรู้สึกผิด"
bp2_yearly.2140.a: ""ใช่ [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )] ข้าอดใจไม่ไหว""
bp2_yearly.2140.b: ""ไม่แน่นอน! ข้าแค่นอนไม่หลับ""

bp2_yearly.2150.t: "[GetTrait('lifestyle_herbalist').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('lifestyle_gardener').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2150.desc: "ตลอดสองสัปดาห์ที่ผ่านมา [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()] ของข้า [interlocutor.GetFirstName] ได้สอนข้าทุกอย่างเกี่ยวกับการปลูกและการเพาะปลูกพืช รวมถึงการใช้ประโยชน์ตามลำดับในทางการแพทย์\n\nวันนี้ [interlocutor.GetSheHe] ได้พาข้ามาดูหนังสือของ [interlocutor.GetHerHis] \"[interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )] ของข้าพเจ้า ท่านมีความก้าวหน้าที่น่าทึ่ง อย่างไรก็ตาม ถึงเวลาแล้วที่จะต้องเลือกจุดสนใจสำหรับการศึกษาของท่าน\"\n\n\"ท่านต้องการมุ่งเน้นไปที่พืชสวนโดยตรง หรือท่านสนใจผลกระทบในทางปฏิบัติของพืชดังกล่าวมากกว่ากัน?\""
bp2_yearly.2150.a: "สมุนไพรไร้ประโยชน์หากปราศจากความรู้ที่เหมาะสมในการใช้"
bp2_yearly.2150.b: "การส่งเสริมการเติบโตของชีวิตใหม่นั้นหาที่เปรียบมิได้"
bp2_yearly.2150.c: "ข้าจะไม่เสียเวลากับพืชต่อไปอีกแล้ว"

bp2_yearly.2160.t: "[GetTrait('compassionate').GetNameNoTooltip( ROOT.Char )] หรือ [GetTrait('sadistic').GetNameNoTooltip( ROOT.Char )]?"
bp2_yearly.2160.desc: "ขณะเดินเล่นใน [ROOT.Char.Custom('GetCourtyard')] ข้าเห็น [interlocutor.GetFirstNameNoTooltip] กำลังประลองกับเด็กคนอื่นๆ ภายใต้การแนะนำของ [marshal.GetTitledFirstName] โชคไม่ดีที่ [interlocutor.GetSheHe|U] ทำได้ไม่ดีนัก และ [interlocutor.GetSheHe] ก็ถูกกระแทกกลับมาอย่างกะทันหัน เกือบจะล้มทับข้า\n\n"ข้าขออภัย [interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )] ของข้า" [interlocutor.GetSheHe] กล่าวขณะที่ [interlocutor.GetSheHe] ลุกขึ้นยืนบนเท้า [interlocutor.GetHerHis] ปัดฝุ่น [interlocutor.GetHerselfHimself] ออก\n\nบาดแผลของ [interlocutor.GetHerHis|U] ยังสดใหม่อยู่"
bp2_yearly.2160.a: ""อย่ากังวลเลย [interlocutor.GetFirstNameNoTooltip] เจ้าจะเก่งขึ้นเมื่อฝึกฝน""
bp2_yearly.2160.b: ""ความเจ็บปวดที่มากขึ้นจะ ทำให้เจ้าไม่ลืมความผิดพลาดนี้!""
bp2_yearly.2160.b.flavor: "ท่านถูดินจากพื้น [ROOT.Char.Custom('GetCourtyard')] ลงบนแผลของ [interlocutor.GetHerHis]"

