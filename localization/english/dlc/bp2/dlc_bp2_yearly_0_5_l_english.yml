 bp2_yearly.0601.k: "ฝันกลางวันตลอดบ่ายของบทเรียน"

 bp2_yearly.0611.t: "เมืองหลวงแห่งที่สองของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]"
 bp2_yearly.0611.desc.intro.bad_history: "แม้ว่า [regent.GetSheHe] จะทำสิ่งต่างๆ กับข้าและคนของข้าในอดีต [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ยังคงเป็น [ROOT.Char.GetDiarchTitle] ของข้า ถึงกระนั้น [regent.GetSheHe] ก็แทบไม่ออกจาก [regent_capital.GetBaseNameNoTier]\n\n"
 bp2_yearly.0611.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ทำงานหนักมากในฐานะ [ROOT.Char.GetDiarchTitle] ของข้า ทั้งหมดอยู่ในห้องทำงานของ [regent.GetHerHis] ใน [regent_capital.GetBaseNameNoTier]\n\n"
 bp2_yearly.0611.desc.regent_opinion.positive: "ข้ารู้ว่า [regent.GetSheHe] ควรจะปกป้องข้าจนกว่าข้าจะเป็น [ROOT.Char.GetWomanMan] ที่โตแล้ว แต่แม้เมื่อ [regent.GetSheHe] มาเยี่ยม ดูเหมือนว่าจะเป็นเสมอ"
 bp2_yearly.0611.desc.regent_opinion.negative: "ข้ารู้ว่า [regent.GetSheHe] ไม่ค่อยชอบข้าเท่าไหร่ แต่ข้าเลวร้ายขนาดนั้นเลยหรือที่ทุกครั้งที่มาเยี่ยมจะต้องเป็นเสมอ"
 bp2_yearly.0611.desc.regent_opinion.fallback: "ข้ารู้ว่า [regent.GetSheHe] คิดว่าข้าเป็นแค่เด็ก แต่แน่นอนว่าข้ายังคงควรค่าแก่เวลาสักหน่อยหรือไม่? แทนที่จะเป็น เช่นนั้น การมาเยี่ยมกลับเป็นไปโดยสิ้นเชิง"
 bp2_yearly.0611.desc.government.tribal: "เพื่อพูดคุยกับผู้อาวุโสผู้มีอิทธิพลบางคน หรือปรึกษากับสภา หรือยืมผู้ส่งสารอย่างเป็นทางการ หรือ... หรือ..."
 bp2_yearly.0611.desc.government.fallback: "สำหรับเอกสารสำคัญบางอย่าง หรือการใช้ตราประทับของตระกูล หรือเพื่อพูดคุยกับเจ้าหน้าที่บางคน หรือ... หรือ..."
 bp2_yearly.0611.desc.outro: "\n\nข้าแค่หวังว่า [regent.GetSheHe] จะคิดถึง #EMP ข้า#! บ้าง และไม่ใช่แค่ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]"
 bp2_yearly.0611.a: "บางทีจดหมายจากใจจริงอาจจะโน้มน้าว [regent.GetHerHim] ได้..."
 bp2_yearly.0611.b: "#BER ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] และข้าต้องการให้รับฟัง!"
 bp2_yearly.0611.b.tt: "ท่านอาละวาด จนกระทั่ง [regent.GetFirstNameNoTooltip] พาท่านไปประชุมสำคัญของ [regent.GetHerHis]"
 bp2_yearly.0611.c: "ใครจะสน? มีเวลาเล่นข้างนอกมากขึ้น!"
 bp2_yearly.0611.d: "ข้าเห็นโอกาส"
 bp2_yearly.0611.d.tt.success: "ท่านเรียกร้องค่าชดเชยที่สัญญาไว้จาก [regent.GetFirstName] ได้สำเร็จ"
 bp2_yearly.0611.d.tt.failure: "[regent.GetSheHe|U] รำคาญเสียงคร่ำครวญของท่าน"
 bp2_yearly.0611.d.tt.failure.deceitful: "เนื่องจาก [personality|E] ของ [regent.GetHerHis] [regent.GetFirstNameNoTooltip] จึงเคารพในความพยายามนั้น"
 bp2_yearly.0611.e: "สงสัยจังว่ามีอะไรอยู่ในห้องส่วนตัวของ [regent.GetHerHis] ตอนที่ [regent.GetSheHe] ไม่อยู่?"
 bp2_yearly.0611.f.young: "ข้าจะหาคนอื่นมาอ่านให้ข้าฟัง!"
 bp2_yearly.0611.f.fallback: "บ๊ะ ข้าอ่านประวัติศาสตร์ได้โดยไม่มี [regent.GetHerHim]"
 bp2_yearly.0611.g: "ฮึ่ม ข้าจัดความสนุกของตัวเองได้"
 bp2_yearly.0611.g.tt: "[GetActivityType('activity_playdate').GetName] [activity|E] ครั้งต่อไปของท่านฟรี & [characters|E] มีแนวโน้มที่จะเข้าร่วมมากขึ้น"

 bp2_yearly.0621.t.close_family: "ของขวัญสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp2_yearly.0621.t.fallback: "ของขวัญของ [regent.Custom('GetAuntUncle')|U] [regent.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.0621.desc.intro.bad_history: "สำหรับทุกสิ่งที่ [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้ทำผิดต่อข้าในอดีต [regent.GetSheHe] ดูเหมือนจะมุ่งมั่นที่จะชดเชยให้ข้าด้วยของขวัญที่ประณีต\n\n"
 bp2_yearly.0621.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ช่างคิดถึงเป็นพิเศษในช่วงนี้ [regent.GetSheHe|U] ดูเหมือนจะนำของขวัญที่ดีที่สุดมาให้ข้าเสมอ ทำให้ [regent.GetHerHim] เป็น [ROOT.Char.GetDiarchTitle] ที่ดีที่สุด\n\n"
 bp2_yearly.0621.desc.midtro: ""อ้า อยู่นี่เอง [ROOT.Char.Custom('MistressMaster')] น้อย," [regent.GetSheHe] หัวเราะขณะที่ข้ากระโดดเข้าไปในลานบ้าน ที่ ซึ่ง [regent.GetWomanMan] รออยู่พร้อมกับบางสิ่งที่คลุมด้วยผ้า "วันนี้ ข้ามีบางสิ่งที่พิเศษมากสำหรับเจ้า", [regent.GetSheHe] กระซิบอย่างสมรู้ร่วมคิด\n\nด้วยเหตุนั้น ผ้าก็หลุดออกเผยให้เห็น"
 bp2_yearly.0621.desc.gift.gold: "กองเหรียญเงินและเหรียญทองสูงตระหง่านที่ก่อเป็นรูปมงกุฎ"
 bp2_yearly.0621.desc.gift.prestige: "คณะนักร้องและนักเต้น ซึ่งกระโดดออกมา ตีลังกาและร้องเพลงสั้นๆ ที่ แต่งขึ้นเกี่ยวกับข้า"
 bp2_yearly.0621.desc.gift.piety: "แบบจำลอง [ROOT.Char.GetFaith.HouseOfWorship] อันประณีต รวมถึงป้ายที่อธิบายถึงปีกใหม่ที่จะสร้างขึ้นด้วยเงินบริจาคของข้า"
 bp2_yearly.0621.desc.gift.event_troops: "ทหารองครักษ์หุ้มเกราะ คุกเข่าและยื่นมือของ [dummy_soldier.GetHerHis] ให้ข้าเพื่อแสดงความจงรักภักดี"
 bp2_yearly.0621.desc.gift.dog: "สุนัขล่าเนื้อที่สง่างามและเพรียวบาง หางของมันกระดิกอย่างแรง"
 bp2_yearly.0621.desc.gift.cat: "แมวที่สง่างาม ยกขาข้างหนึ่งขึ้น มองดูราวกับตกใจที่เห็นข้าพอๆ กับที่ข้าตกใจที่เห็นมัน"
 bp2_yearly.0621.desc.gift.eagle: "ลูกอินทรีแสนรู้ตัวหนึ่ง กางปีกกว้าง เกาะอยู่บนคอน"
 bp2_yearly.0621.extra_stuff.success: "[regent.GetFirstName] หาของขวัญเพิ่มเติมได้ในเวลาอันสั้น"
 bp2_yearly.0621.extra_stuff.failure: "ท่านได้สิ่งที่ท่านได้และท่านจะพอใจกับมัน"
 bp2_yearly.0621.a: "ช่างเป็นความประหลาดใจที่สวยงาม!"
 bp2_yearly.0621.b: "อืมมม... งัดข้อเพื่อเพิ่มเป็นสองเท่า?"
 bp2_yearly.0621.c: "ท่านไม่คิดว่าท่านลืมอะไรไปเล็กน้อยหรือ?"
 bp2_yearly.0621.d: "ท่านซ่อนของเพิ่มไว้ที่ไหนสักแห่ง ข้ารู้..."
 bp2_yearly.0621.e: "ข้าอ่านมาว่าการให้ของขวัญชิ้นใหญ่เป็นโชคดี..."
 bp2_yearly.0621.f: "นี่คงไม่ใช่สิ่งเดียวใช่ไหม?"
 bp2_yearly.0621.g.bad_blood: "ท่านซื้อความรักของข้าไม่ได้หรอก #EMP [regent.GetFirstNameNoTooltip]#!."
 bp2_yearly.0621.g.good_terms: "ขอบคุณ แต่ข้ามีแล้ว อาจจะนะ"

 bp2_yearly.0631.t: "คำกระซิบ"
 bp2_yearly.0631.desc.intro.positive: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] โดยทั่วไปแล้วพิสูจน์ให้เห็นว่าเป็น [ROOT.Char.GetDiarchTitle] ที่ภักดี คำแนะนำของ [regent.GetHerHis] พยายามรักษาผลประโยชน์สูงสุดของข้าไว้เสมอ\n\nดังนั้นจึงค่อนข้างจริงจังและน่ากังวลมากเมื่อ [regent.GetSheHe] บอกข้าถึงบาปเล็กๆ น้อยๆ ที่น่าสะพรึงกลัวทั้งหมดที่ [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกกล่าวหา\n\n"
 bp2_yearly.0631.desc.intro.negative: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มีประวัติ... ที่หลากหลายในฐานะ [ROOT.Char.GetDiarchTitle] ของข้า [regent.GetSheHe|U] ควรจะเป็นโล่และผู้พิทักษ์ของข้า แต่ [regent.GetSheHe] ดูเหมือนจะสนใจในการเพิ่มพูนความมั่งคั่งให้ [regent.GetHerselfHimself] มากกว่า\n\nดังนั้นข้าจึงไม่แปลกใจเลยที่สงสัยเมื่อ [regent.GetSheHe] บอกข้าถึงบาปเล็กๆ น้อยๆ ที่น่าสะพรึงกลัวทั้งหมดที่ [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกกล่าวหา\n\n"
 bp2_yearly.0631.desc.intro.vague: "การรับใช้ของ [regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)|U] ในฐานะ [ROOT.Char.GetDiarchTitle] ของข้าไม่ได้เป็นไปตามที่ [regent.GetSheHe] สัญญาไว้ทั้งหมด บางครั้ง [regent.GetSheHe] ก็ช่วยข้า แต่บ่อยครั้งพอๆ กันที่ [regent.GetSheHe] ดูเหมือนจะดูแล แต่ตัวเองเท่านั้น\n\nดังนั้นข้าจึงไม่แน่ใจอย่างยิ่งเมื่อ [regent.GetSheHe] บอกข้าถึงบาปเล็กๆ น้อยๆ ที่น่าสะพรึงกลัวทั้งหมดที่ [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกกล่าวหา\n\n"
 bp2_yearly.0631.desc.rationale.nemesis: ""...เจ้าหนอนน่ารังเกียจนั่นกำลังวางแผนโค่นล้มท่านอย่างแน่นอน [ROOT.Char.GetFirstNameNoTooltip] เช่นเดียวกับที่ [rival_successor.GetSheHe] กำลังวางแผนโค่นล้มข้า และการทำลายล้าง [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ทั้งหมด!""
 bp2_yearly.0631.desc.rationale.warmonger: ""... [rival_successor.GetSheHe] เป็นปีศาจและนักก่อสงคราม [ROOT.Char.GetFirstNameNoTooltip] ผู้ ซึ่งความอยากในการทำลายล้างอันไม่ยุติธรรมไม่มีขอบเขต [rival_successor.GetSheHe|U] จะ ทำให้ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ทั้งหมดตกอยู่ในสงครามกลางเมืองหากได้รับโอกาสเพียงเล็กน้อย!""
 bp2_yearly.0631.desc.rationale.rival: ""... [rival_successor.GetWomanMan] เป็นคนเลวทรามที่สุด [ROOT.Char.GetFirstNameNoTooltip] — คนโกหก ขโมย และคนพาลที่มุ่งมั่นที่จะหว่านความขัดแย้งและความไม่ลงรอยกันในอาณาจักรของท่าน""
 bp2_yearly.0631.desc.rationale.revenge: ""... ตัวแทนแห่ง [regent.GetFaith.DevilName] ที่กรีดร้องนั่นได้ก่ออาชญากรรมที่ไม่อาจบรรยายได้ต่อข้าและคนของข้า [ROOT.Char.GetFirstNameNoTooltip] และจะหันจิตวิญญาณอันโกรธแค้นของ [rival_successor.GetHerHis] ต่อต้าน [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ทั้งหมดอย่างแน่นอนหากได้รับโอกาส""
 bp2_yearly.0631.desc.rationale.criminality: ""... [rival_successor.GetSheHe] เป็นอาชญากรที่รู้จักกันดี [ROOT.Char.GetFirstNameNoTooltip] อาชญากรที่กำลังมองหาโอกาสในการทำบาปและความชั่วร้ายมากขึ้นอย่างไม่ต้องสงสัย อำนาจที่มอบให้ [rival_successor.GetHerHim] หาก [rival_successor.GetSheHe] ได้เป็น [ROOT.Char.GetDiarchTitle]...""
 bp2_yearly.0631.desc.rationale.opposing_traits: ""... แม้ แต่การพูดคุยกับ [rival_successor.GetHerHim] เพียงครู่เดียวก็สามารถ ทำให้ [regent.GetWomanMan] เป็นบ้าได้ [ROOT.Char.GetFirstNameNoTooltip] — น่าประหลาดใจที่ [rival_successor.GetWomanMan] คนหนึ่งสามารถผิดพลาดอย่างมากและเหลือเชื่อเกี่ยวกับ #EMP ทุกสิ่ง#! ได้""
 bp2_yearly.0631.desc.rationale.sins: ""... ข้าไม่สามารถทนร่วมโต๊ะกับ [rival_successor.GetWomanMan] ได้ ไม่มี [regent.GetFaith.GetAdherentName] ที่ดีคนใดทำได้ — และท่านก็ไม่ควรทำ เช่นกัน [ROOT.Char.GetFirstNameNoTooltip] เว้น แต่ท่านต้องการให้บาปของ [rival_successor.GetHerHis] ประทับลงบนหัวใจที่อ่อนแอของท่าน""
 bp2_yearly.0631.desc.rationale.petty_opinions: ""... มันไม่ใช่เหตุการณ์เฉพาะใดๆ เลย [ROOT.Char.GetFirstNameNoTooltip] มันเป็นเพียงทุกสิ่งเกี่ยวกับวิธีที่ [rival_successor.GetWomanMan] ประพฤติตน [rival_successor.GetHerselfHimself] — หากให้เวลา [rival_successor.GetSheHe] จะ ทำให้ [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ทั้งหมดต่อต้านท่านเพียง เพราะความรำคาญเท่านั้น""
 bp2_yearly.0631.desc.rationale.hideousness: ""... ข้าหมายถึงแค่ #EMP ดู#! ที่ [rival_successor.GetWomanMan] สิ! หาก '[rival_successor.GetWomanMan]' [rival_successor.GetSheHe] สามารถกล่าวได้ว่าเป็น — ข้าเคยเห็นกบที่ดูดีกว่านี้ครึ่งตัวถูกล้อรถบดขยี้ ความอัปลักษณ์ เช่นนี้บ่งบอกถึงแรงกระตุ้นบาปพื้นฐานทุกประเภทอย่างไม่ต้องสงสัย ซึ่งเดือดพล่านผ่านผิวหนังอันน่าสังเวชของ [rival_successor.GetHerHis]""
 bp2_yearly.0631.desc.rationale.generic: ""... ไม่ว่า [rival_successor.GetSheHe] จะไปที่ใด [rival_successor.GetSheHe] ก็สร้างศัตรู [ROOT.Char.GetFirstNameNoTooltip] ข้าเองก็เป็นหนึ่งในนั้น ปฏิบัติต่อ [rival_successor.GetWomanMan] อย่างดีเกินไป และ [rival_successor.GetSheHe] จะใช้ประโยชน์จากความเอื้อเฟื้อของท่านและทรยศท่านในไม่ช้าอย่างแน่นอน""
 bp2_yearly.0631.desc.outro: "\n\n"หากท่านไม่พูดต่อต้าน [rival_successor.GetHerHim] ตอนนี้ [rival_successor.GetSheHe] อาจจะหาทางยึดตำแหน่งของข้าและทำร้ายท่าน #EMP อย่างถาวร#! ได้""
 bp2_yearly.0631.a: "ถ้า... นั่นคือสิ่งที่ท่านคิดว่าดีที่สุด..."
 bp2_yearly.0631.b: "ไม่มีทาง! นี่เป็นเพียงคำโกหกที่บิดเบือนที่ท่านพูด!"
 bp2_yearly.0631.b.tt: "ท่านปฏิเสธที่จะปฏิเสธ [rival_successor.GetFirstNameNoTooltip]"
 bp2_yearly.0631.c.rowdy: "ข้าโตพอที่จะรับรู้ถึงการทะเลาะวิวาทส่วนตัวได้แล้ว"
 bp2_yearly.0631.c.charming: "ข้ามั่นใจว่าข้าสามารถพูดคุยกับ [rival_successor.GetHerHim] ได้หากจำเป็น"
 bp2_yearly.0631.c.curious: "ข้าแทบจะไม่สามารถเชื่อคำพูดของท่านทั้งสองได้เลย [regent.GetFirstNameNoTooltip]"
 bp2_yearly.0631.c.pensive: "ข้า... ข้าจะต้องคิดเกี่ยวกับเรื่องนี้..."
 bp2_yearly.0631.c.bossy: "อย่าเอาปัญหาส่วนตัวของท่านมาให้ #EMP ข้า#! เลย"

 bp2_yearly.0641.t: "แลกเปลี่ยนผลประโยชน์"
 bp2_yearly.0641.desc.intro.request_boilerplate: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] และ [ROOT.Char.GetTitleAsNameNoTooltip] ในฐานะ [ROOT.Char.GetDiarchTitle] ของท่าน ข้าต้องการอำนาจเพิ่มเติมเล็กน้อยเพื่อจัดการเรื่องสำคัญบางประการ""
 bp2_yearly.0641.desc.intro.tribal: "ผู้พูดกฎหมายสูงอายุเดินตาม [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ขณะที่ [regent.GetSheHe] เข้าไปในห้องทำงานเล็กๆ\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ พยานผู้นี้จะยืนยันคำสาบานของท่าน".\n\n"
 bp2_yearly.0641.desc.intro.fallback: "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก้าวเข้าไปในห้องทำงานเล็กๆ อย่างมั่นใจ ถือม้วนกระดาษหนังอยู่\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ หากท่านกรุณา ลงนามและประทับตราบนเอกสารเหล่านี้".\n\n"
 bp2_yearly.0641.desc.midtro: ""แน่นอน ข้าจะไม่มาหาท่านมือเปล่า! สำหรับความช่วยเหลือเล็กน้อยนี้ ข้าจะ"
 bp2_yearly.0641.desc.vs_courtly: "พูดคุยกับขุนนางที่ซับซ้อนที่สุดของท่าน เพื่อให้แน่ใจว่าท่านยังคงอยู่ในความโปรดปรานของพวกเขา""
 bp2_yearly.0641.desc.vs_glory_hound: "พูดคุยกับขุนนางที่กระหายเลือดที่สุดของท่าน ทำให้พวกเขามั่นใจในชะตากรรมอันรุ่งโรจน์ของท่าน""
 bp2_yearly.0641.desc.vs_parochial: "พูดคุยกับขุนนางที่เก็บตัวที่สุดของท่าน แจ้งให้พวกเขาทราบว่าเมืองหลวงรับฟังข้อกังวลของพวกเขา""
 bp2_yearly.0641.desc.vs_zealot: "พูดคุยกับขุนนางที่คลั่งศาสนาที่สุดของท่าน รับรองความศรัทธาของท่านในนามของ [ROOT.Char.GetFaith.HighGodName]""
 bp2_yearly.0641.desc.vs_minority: "พูดคุยกับขุนนางที่หลากหลายมากขึ้นของท่าน รักษาความหลากหลายของอาณาจักรของท่านให้มั่นคง""
 bp2_yearly.0641.desc.vs_baron: "พูดคุยกับขุนนางชั้นผู้น้อยของท่าน ควบคุมผู้ที่ต่ำต้อยที่สุดในหมู่ชนชั้นสูงให้อยู่ในแถว""
 bp2_yearly.0641.desc.dynasty: "เขียนจดหมายประจบสอพลอในนามของท่านไปยังแม้ แต่ครอบครัวที่ห่างไกลที่สุดของท่าน""
 bp2_yearly.0641.desc.fellow_vassals: "เขียนจดหมายมิตรภาพถึงเพื่อนขุนนางของ [ROOT.Char.GetLiege.GetTitledFirstName] ทำให้ท่านมีเพื่อนใน [ROOT.Char.GetLiege.GetPrimaryTitle.GetDefinitiveName]""
 bp2_yearly.0641.desc.powerful_vassal: "พูดคุยกับผู้มีอำนาจที่ยิ่งใหญ่ที่สุดในดินแดนของท่าน รับรองว่าเสียงของพวกเขาได้รับการรับฟัง""
 bp2_yearly.0641.desc.hof: "ส่งจดหมายแสดงความชื่นชมยินดีไปยัง [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] เพิ่มพูนสถานะของท่านกับตัวแทนที่ได้รับเลือกของ [ROOT.Char.GetFaith.HighGodNamePossessive]""
 bp2_yearly.0641.desc.realm_priest: "พูดคุยกับ [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] ของท่านและดูแลให้ท่านยังคงอยู่ในสถานะที่ดีกับคณะสงฆ์""
 bp2_yearly.0641.desc.maa_maintenance: "ดูว่าเราจะหาเหรียญพิเศษสำหรับกองทหารประจำบ้านของท่านได้หรือไม่""
 bp2_yearly.0641.desc.cowed_vassal: "จัดการให้มี #EMP การบริจาค#! เพิ่มเติมจากขุนนางที่หวาดกลัวที่สุดของท่าน""
 bp2_yearly.0641.desc.war_income: "จัดการให้มีการเก็บภาษีสงครามในยามยากลำบากเหล่านี้""
 bp2_yearly.0641.desc.free_ho_hire: "จัดการให้บริการของนักรบที่ดุร้ายที่สุดบางส่วนของศรัทธาของเรา เพื่อใช้ในช่วงที่ท่านบรรลุนิติภาวะ""
 bp2_yearly.0641.desc.mercenary_cost_reduction: "จัดการส่วนลดกับทหารรับจ้างบางส่วนที่รวมตัวกันในดินแดนของท่าน เพื่อใช้หลังจากที่ท่านบรรลุนิติภาวะแน่นอน""
 bp2_yearly.0641.desc.raid_speed: "จัดการให้นักปล้นสะดมผู้ช่ำชองเข้าร่วมกองทหารของท่าน เพื่อนำของขวัญต่างแดนอันมั่งคั่งมาให้ท่านได้ดียิ่งขึ้น""
 bp2_yearly.0641.desc.outro.tribal: "\n\nทั้งหมดที่ข้าต้องทำคือพูดคำนั้น"
 bp2_yearly.0641.desc.outro.fallback: "\n\nทั้งหมดที่ข้าต้องทำคือขีดเขียนตัวอักษร"
 bp2_yearly.0641.a: "ถ้าท่านว่าอย่างนั้น..."
 bp2_yearly.0641.b: "ท่านก้าวก่ายเกินไปแล้ว [regent.GetFirstNameNoTooltip]"
 bp2_yearly.0641.c.rowdy: "ท่านคือ [ROOT.Char.GetDiarchTitle] — จัดการเองสิ!"
 bp2_yearly.0641.c.charming: "ท่านรู้ดีที่สุด — ท่าน #EMP ดูแล#! เรื่องนี้ไม่ได้หรือ!?"
 bp2_yearly.0641.c.curious: "น่าเบื่อจัง — เราคุยเรื่องอื่นไม่ได้หรือ?"
 bp2_yearly.0641.c.pensive: "ข้ามีเรื่องต้องเรียน เกรงว่าจะทำไม่ได้"
 bp2_yearly.0641.c.bossy: "นี่ต่ำกว่าศักดิ์ศรีของข้า — ทำตามที่ท่านต้องการเถอะ"
 bp2_yearly.0641.c.tt: "ท่านให้อิสระแก่ [regent.GetFirstNameNoTooltip] แต่ไม่ให้การรับรอง"

 bp2_yearly.0651.t: "เมื่อใดก็ตามที่ท่านต้องการ [regent.GetHerHim|U]"
 bp2_yearly.0651.desc.intro: "[ROOT.Char.GetDiarchTitle] ของข้า [regent.GetFirstName] ตั้งใจฟังเรื่องราวของข้าอย่างใจจดใจจ่อ ดวงตาเป็นประกายด้วยความสนใจและความรักใคร่ขณะที่"

 bp2_yearly.0651.desc.story.rowdy.invented_game: "ข้าอธิบายรายละเอียดกฎของเกมบอลใหม่ที่ข้าเพิ่งคิดค้นขึ้น ข้า #EMP ภูมิใจ#! กับมันมาก"
 bp2_yearly.0651.desc.story.rowdy.climbed_roof: "ข้าให้รายละเอียดเส้นทางที่ข้าใช้ปีนขึ้นไปบนหอคอยใหม่ — มันค่อนข้างอันตราย แต่ข้าเป็นนักปีนเขาที่เก่งที่สุดใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]"
 bp2_yearly.0651.desc.story.rowdy.prank: "ข้าหัวเราะคิกคักตลอดการเล่าเรื่องตลกครั้งล่าสุดที่ข้าเล่น — ข้าอาจจะเป็นคนเดียวที่หัวเราะ แต่ข้าหัวเราะ #EMP หนัก#! มาก"
 bp2_yearly.0651.desc.story.charming.composed_poem: "ข้าอภิปรายสัญลักษณ์และความหมายเบื้องหลังบทกวีที่ข้าเขียน ข้าคิดว่ามันเป็นผลงานที่ดีที่สุดของข้าจนถึงปัจจุบัน แม้ว่าข้าจะไม่รู้ว่าข้าจะเรียกตัวเองว่ากวีได้หรือยัง"
 bp2_yearly.0651.desc.story.charming.new_friend: "ข้าบอก [regent.GetHerHim] เกี่ยวกับลูกของคนรับใช้คนหนึ่งที่ดูเหมือนจะหลงใหลในเกมของข้า ข้าคิดว่าข้าได้เพื่อนแล้ว อย่างน้อยก็สำหรับฤดูกาลนี้"
 bp2_yearly.0651.desc.story.charming.new_word: "ข้าอธิบายวิธีออกเสียงคำใหม่ที่ข้าคิดค้นขึ้น ข้าคาดว่ามันจะติดปากในไม่ช้า เมื่อข้าราชบริพารของข้าได้ยิน #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! ใช้มัน"
 bp2_yearly.0651.desc.story.curious.distant_land: "ข้าบอก [regent.GetHerHim] เกี่ยวกับดินแดนที่แปลกประหลาดและห่างไกลที่ข้าเพิ่งเรียนรู้ และผู้คนที่แปลกประหลาดที่อาศัยอยู่ที่นั่น"
 bp2_yearly.0651.desc.story.curious.book_gift: "ข้าอธิบายรายละเอียดเนื้อหาของหนังสือที่ขุนนางชั้นผู้น้อยคนหนึ่งซื้อให้ข้า — ไม่ใช่ผลงานที่รุ่งโรจน์ที่สุด แต่ข้าได้อ่านเนื้อหาของมันอย่างกระตือรือร้น"
 bp2_yearly.0651.desc.story.curious.strange_bird: "ข้าชี้ให้เห็นส่วนต่างๆ ของภาพร่างของข้า พยายามถ่ายทอดว่านกแปลกๆ ที่ข้าวาดเคลื่อนไหวอย่างไร ขนของมันมีลักษณะอย่างไร และพยายามเลียนเสียงร้องของมันให้ดีที่สุด"
 bp2_yearly.0651.desc.story.pensive.distant_letter: "ข้าพูดถึงจดหมายที่ข้า painstakingly รวบรวมสำหรับขุนนางห่างไกลที่ข้าเคยได้ยินเรื่องราว ข้าไม่รู้ว่าสาส์นของข้าจะไปถึงพวกเขาหรือไม่ แต่แค่คิดว่าพวกเขาอาจจะเขียนตอบกลับมาก็ช่างน่ายินดี"
 bp2_yearly.0651.desc.story.pensive.foreign_custom: "ข้าแจ้ง [regent.GetHerHim] ถึงธรรมเนียมต่างแดนที่แปลกประหลาดที่ข้าได้ยินมาเมื่อเร็วๆ นี้ ซึ่งข้าปรารถนาอย่างยิ่งให้เป็นบรรทัดฐานที่นี่ใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] ด้วย"
 bp2_yearly.0651.desc.story.pensive.draft_law: "กฎหมายที่ข้าพยายามร่าง มัน... ยังไม่ #EMP เสร็จ#! ซะทีเดียว แต่ข้าภูมิใจที่ข้าทำมาได้ไกลขนาดนี้"
 bp2_yearly.0651.desc.story.bossy.servants_caught: "ข้าบอก [regent.GetHerHim] เกี่ยวกับคนรับใช้ที่ข้าจับได้ว่าอู้งาน และวิธีที่ข้าลงโทษพวกเขาอย่างขยันขันแข็งสำหรับทัศนคติที่หย่อนยานต่องาน"
 bp2_yearly.0651.desc.story.bossy.court_protocol: "ข้าให้รายละเอียดและสาธิตระเบียบพิธีการของราชสำนักใหม่ที่ข้าต้องการนำมาใช้ ข้าคิดว่ามันจะแสดงให้เห็นถึงศักดิ์ศรีของข้าในฐานะ [ROOT.Char.GetTitleAsName] หนึ่งเดียวของ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] อย่างแท้จริง"
 bp2_yearly.0651.desc.story.bossy.organised_game: "ข้าอธิบายวิธีที่ข้าจัดเกมกับเด็กคนอื่นๆ ในราชสำนัก แบ่งพวกเขาออกเป็นทีม และดำเนินงานทั้งหมดด้วยตัวเอง"
 bp2_yearly.0651.desc.rationale.predecessor: "\n\n"[ROOT.Char.GetFirstNameNoTooltip] น้อย ท่าน ทำให้ข้านึกถึง [predecessor.GetFirstName] มากเหลือเกินเมื่อท่านพูด เช่นนี้," [regent.GetWomanMan] ถอนหายใจ เห็นได้ชัดว่าหลงอยู่ในความทรงจำพร้อมกับคำพูดของข้า "ท่านดูเหมือน [ROOT.Char.Custom2('RelationToMeShort', predecessor)] ของท่านมาก""
 bp2_yearly.0651.desc.rationale.loyalty: "\n\n"ท่าน ทำให้ข้าภูมิใจ ท่านรู้ไหม? ภูมิใจที่ได้ปกป้องในฐานะ [ROOT.Char.Custom('GirlBoy')] และสักวันหนึ่ง จะภูมิใจยิ่งกว่าที่ได้รับใช้ในฐานะ [ROOT.Char.GetWomanMan]""
 bp2_yearly.0651.desc.rationale.compassion: "\n\n"ข้ารู้สึกโชคดีเหลือเกินที่ได้รับใช้ท่าน [ROOT.Char.GetFirstNameNoTooltip] น้อย," [regent.GetSheHe] ถอนหายใจ "โชคดีที่ได้เห็น [ROOT.Char.GetWomanMan] ที่ท่านกำลังเติบโตขึ้น""
 bp2_yearly.0651.desc.rationale.fallback: "\n\n"[ROOT.Char.GetFirstNameNoTooltip] น้อย สักวันหนึ่ง ท่านจะเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่ยิ่งใหญ่ที่สุดที่ [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] เคยมีมา ข้าภูมิใจใน [ROOT.Char.GetWomanMan] ที่ท่านกำลังจะเป็น""
 bp2_yearly.0651.desc.outro: "\n\n"ข้าจะอยู่เคียงข้างท่านเสมอ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า แม้กระทั่งเมื่อ [regent.GetFaith.random_NegativeAfterLife] มาถึง ท่านก็สามารถพึ่งพาข้าได้""
 bp2_yearly.0651.a: "และท่านสาบานว่าจะไม่ทรยศข้า?"
 bp2_yearly.0651.b: "[ROOT.Char.GetFirstNameNoTooltip] และ [regent.GetFirstNameNoTooltip] สหายตลอดไป!"
 bp2_yearly.0651.c: "นั่นก็ดี แต่ข้ากำลังเล่าเรื่องอยู่"
 bp2_yearly.0651.d: "มาเถอะ ไปบอกราชสำนักถึงวันของข้ากัน!"

 bp2_yearly.0661.t: "เครื่องมือสำหรับการกวัดแกว่ง"
 bp2_yearly.0661.desc: ""#EMP [offended_family.Custom2('GetWomanManGirlBoy', ROOT.Char)] คือ [offended_family.Custom2('RelationToMeShort', ROOT.Char)] ของข้า!#!" [offended_family.GetFirstName] ตะโกน เผชิญหน้ากับ [ROOT.Char.GetDiarchTitle] ของข้า [regent.GetFirstName] ในห้องโถงว่างเปล่าแห่งหนึ่งของ [ROOT.Char.GetCapitalLocation.GetName] "ท่านไม่สามารถกันข้าออกจาก [ROOT.Char.GetHerHim] เช่นนี้ได้"\n\nข้าไม่ได้ตั้งใจจะแอบฟัง สะดุดกับการสนทนาโดยบังเอิญขณะไล่ตามคนรับใช้ แต่ตอนนี้ข้าอ้อยอิ่งอยู่ห่างๆ ขณะที่ทั้งสองโต้เถียงกัน\n\n"[ROOT.Char.GetSheHe|U] อาจจะเป็น [offended_family.Custom2('RelationToMeShort', ROOT.Char)] ของท่าน แต่ [ROOT.Char.GetSheHe] อยู่ใน #EMP ความดูแล#! ของข้า จนกว่าข้าจะเห็นว่า [ROOT.Char.GetHerHim] พร้อมที่จะจัดการเรื่องของ [ROOT.Char.GetHerHis] เอง จนกว่าจะถึงตอนนั้น ข้าพูดแทน [ROOT.Char.GetTitledFirstName] และในความเห็นของข้า คนประเภทท่านเป็นอิทธิพลที่เลวร้ายที่สุดต่อจิตใจของเด็ก""
 bp2_yearly.0661.a: "[regent.GetFirstNameNoTooltip] พูดถูก น่าละอายจริงๆ [offended_family.GetFirstNameNoTooltip]!"
 bp2_yearly.0661.b: "[offended_family.GetFirstNameNoTooltip] คือ [ROOT.Char.Custom2('RelationToMeShort', offended_family)] ของข้า และท่านต้องเคารพ [offended_family.GetHerHim]"
 bp2_yearly.0661.c.rowdy: "ปล่อยให้พวกเขาจัดการกันเอง ข้ามีที่ต้องไป"
 bp2_yearly.0661.c.charming: "ไม่มีอะไรจะได้จากการเลือกข้างที่นี่"
 bp2_yearly.0661.c.curious: "น่าสนใจ แต่เรื่องคนรับใช้คนนั้น..."
 bp2_yearly.0661.c.pensive: "ข้าไม่ต้องการมีส่วนร่วมในการโต้เถียงนี้"
 bp2_yearly.0661.c.bossy: "ข้าสามารถจัดการกับสองคนนี้ได้เมื่อข้าเป็น [ROOT.Char.GetTitleAsNameNoTooltip] อย่างแท้จริง"
