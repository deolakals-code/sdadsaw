l_english: 
 ##################################################
 # #Misc
 teeming_horde_of_cats_modifier: "ฝูงแมวเหมียว"
 teeming_horde_of_cats_modifier_desc: "ตัวละครนี้ดูเหมือนจะถูกรายล้อมไปด้วยฝูงแมวหยิ่งยโสอยู่เสมอ สัตว์สง่างามเหล่านี้ ทำให้แน่ใจว่าจะไม่มีสัตว์รบกวนใดๆ ให้เห็นรอบตัวพวกมัน"
 loyal_pack_of_hounds_modifier: "ฝูงสุนัขล่าเนื้อผู้ภักดี"
 loyal_pack_of_hounds_modifier_desc: "ตัวละครนี้ไม่เคยปราศจากสุนัขล่าเนื้อผู้ภักดีของพวกเขา ไม่ว่าพวกเขาจะไปที่ใด เหล่าสุนัขก็จะตามไปด้วย — มัน ทำให้ราชสำนักดูน่าอึดอัด แต่ ทำให้การออกรบทนได้"
 frequent_daydreamer_modifier: "นักฝันกลางวันตัวยง"
 frequent_daydreamer_modifier_desc: "ตัวละครนี้มักจะดูเหมือนหลงอยู่ในความคิดที่ลึกซึ้งและหนักอึ้งอย่างแน่นอน"
 strong_flock_of_eagles_modifier: "ฝูงอินทรีอันแข็งแกร่ง"
 strong_flock_of_eagles_modifier_desc: "ตัวละครนี้มักถูกพบเห็นพร้อมกับฝูงอินทรี ซึ่งดูเหมือนจะติดตามพวกเขาไปทุกหนทุกแห่ง เหล่านกเป็นสัญลักษณ์แห่งความแข็งแกร่งและอำนาจ"

 bp2_yearly_0641_vs_courtly_modifier: "ชื่อเสียงดี: ขุนนางเจ้าสำราญ"
 bp2_yearly_0641_vs_courtly_modifier_desc: "มีใครบางคนกำลังหยอดคำหวานใส่หูเหล่าขุนนางของตัวละครนี้"
 bp2_yearly_0641_vs_glory_hound_modifier: "ชื่อเสียงดี: ขุนนางผู้กระหายเกียรติยศ"
 bp2_yearly_0641_vs_glory_hound_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_parochial_modifier: "ชื่อเสียงดี: ขุนนางหัวโบราณ"
 bp2_yearly_0641_vs_parochial_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_zealot_modifier: "ชื่อเสียงดี: ขุนนางผู้คลั่งศาสนา"
 bp2_yearly_0641_vs_zealot_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_minority_modifier: "ชื่อเสียงดี: ขุนนางชนกลุ่มน้อย"
 bp2_yearly_0641_vs_minority_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_vs_baron_modifier: "ชื่อเสียงดี: ขุนนางบารอน"
 bp2_yearly_0641_vs_baron_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_dynasty_modifier: "ชื่อเสียงดี: ราชวงศ์"
 bp2_yearly_0641_dynasty_modifier_desc: "มีใครบางคนกำลังหยอดคำหวานใส่หูครอบครัวของตัวละครนี้"
 bp2_yearly_0641_fellow_vassals_modifier: "ชื่อเสียงดี: เพื่อนขุนนาง"
 bp2_yearly_0641_fellow_vassals_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_powerful_vassal_modifier: "ชื่อเสียงดี: ขุนนางผู้ทรงอำนาจ"
 bp2_yearly_0641_powerful_vassal_modifier_desc: "$bp2_yearly_0641_vs_courtly_modifier_desc$"
 bp2_yearly_0641_hof_modifier: "ชื่อเสียงดี: ประมุขแห่งศรัทธา"
 bp2_yearly_0641_hof_modifier_desc: "มีใครบางคนกำลังหยอดคำหวานใส่หูเหล่านักบวชของตัวละครนี้"
 bp2_yearly_0641_realm_priest_modifier: "ชื่อเสียงดี: นักบวชประจำอาณาจักร"
 bp2_yearly_0641_realm_priest_modifier_desc: "$bp2_yearly_0641_hof_modifier_desc$"
 bp2_yearly_0641_maa_maintenance_modifier: "การประหยัด"
 bp2_yearly_0641_maa_maintenance_modifier_desc: "มีใครบางคนกำลังบริหารจัดการกองทหารประจำการของตัวละครนี้ด้วยงบประมาณที่จำกัด แต่มีประสิทธิภาพ"
 bp2_yearly_0641_cowed_vassal_modifier: "การเตือนอย่างสุภาพ"
 bp2_yearly_0641_cowed_vassal_modifier_desc: "เหล่าขุนนางของตัวละครนี้ได้เรียนรู้ที่จะอ่านความนัยได้เป็นอย่างดี"
 bp2_yearly_0641_war_income_modifier: "ภาษีสงคราม"
 bp2_yearly_0641_war_income_modifier_desc: "สถานการณ์ทางการเมืองได้มอบความช่วยเหลือให้กับตัวละครนี้ในยามสงคราม"
 next_free_ho_hire_modifier: "จ้างภาคีศักดิ์สิทธิ์ฟรีครั้งถัดไป"
 next_free_ho_hire_modifier_desc: "การจ้างภาคีศักดิ์สิทธิ์ครั้งต่อไปของตัวละครนี้จะไม่เสียค่าใช้จ่าย"
 bp2_yearly_0641_mercenary_cost_reduction_modifier: "การค้าทหารรับจ้าง"
 bp2_yearly_0641_mercenary_cost_reduction_modifier_desc: ""
 bp2_yearly_0641_raid_speed_modifier: "เจ้าแห่งการปล้นสะดม"
 bp2_yearly_0641_raid_speed_modifier_desc: "กองทัพของตัวละครนี้เต็มไปด้วยหัวขโมยผู้ช่ำชองที่สุดในโลกในยามสงคราม"

 ##################################################
 # #Flavour Events
 bp2_yearly.0601.t: "การปกครองอย่างชอบธรรม"
 bp2_yearly.0601.desc.intro: "ในฐานะ [ROOT.Char.GetDiarchTitle] ของข้า [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ดูเหมือนจะมุ่งมั่นที่จะสอนวิธีการปกครองที่ [regent.GetHerHis] ชื่นชอบให้แก่ข้า"
 bp2_yearly.0601.desc.rationale.disloyal.likes_you: "[regent.GetSheHe|U] เป็นคนเจ้าเล่ห์ในฐานะ [ROOT.Char.GetDiarchTitle] แต่ถึงกระนั้น [regent.GetWomanMan] ก็ดูเหมือนจะชอบการสอนเป็นพิเศษ\n\n"
 bp2_yearly.0601.desc.rationale.neutral.likes_you: "[regent.GetSheHe|U] แทบจะไม่ใช่ [ROOT.Char.GetDiarchTitle] ที่ทุ่มเทที่สุด แต่ถึงกระนั้น [regent.GetWomanMan] ก็สละเวลามาสอนข้าเมื่อ [regent.GetSheHe] ทำได้\n\n"
 bp2_yearly.0601.desc.rationale.loyal.predecessor_hook: "เป็นเรื่องยากที่บทเรียนเหล่านี้จะผ่านไปโดยที่ [regent.GetWomanMan] ไม่เตือนข้าถึงคำสาบานที่ [regent.GetSheHe] ได้ให้ไว้กับบรรพบุรุษของข้า\n\n"
 bp2_yearly.0601.desc.rationale.loyal.loyalty_hook: "บทเรียนมักจะเริ่มต้นด้วยการที่ [regent.GetWomanMan] ย้ำว่า [regent.GetSheHe] สาบานว่าจะซื่อสัตย์ต่อข้าในทุกสิ่ง รวมถึงการเรียนรู้ด้วย\n\n"
 bp2_yearly.0601.desc.rationale.loyal.honourable: "วิธีการที่ดูเหมือนจะวนกลับไปหาเกียรติยศเสมอ กฎเกณฑ์อันเข้มงวดที่ใช้บังคับมัน และวิธีที่จะได้มา ซึ่งเกียรติยศนั้น\n\n"
 bp2_yearly.0601.desc.rationale.loyal.fallback: "บทเรียนนั้นยาวนาน แต่ดูเหมือนจะมาจากความดีงามในใจของ [regent.GetHerHis] หรืออย่างน้อยก็ความรักที่ [regent.GetHerHis] มีต่อข้า\n\n"
 bp2_yearly.0601.desc.rationale.fallback: "เหตุใด [regent.GetSheHe] จึงทำ เช่นนี้ ข้าไม่เคยเข้าใจได้เลย แต่บางครั้ง [regent.GetWomanMan] ก็ยืนกราน\n\n"
 bp2_yearly.0601.desc.skill.boilerplate: "ชั้นเรียนวันนี้ครอบคลุม #EMP เรื่องเดิมอีกแล้ว#! "
 bp2_yearly.0601.desc.diplomacy.arrogant: "ศิลปะการปกครอง สำหรับ [regent.GetHerHim] ทุกสิ่งดูเหมือนจะลงเอยที่การ ทำให้ผู้อื่นรู้สำนึก การแสดงอำนาจ และการเพิ่มพูนบารมีของท่าน วาจาคือหนทางที่ [regent.GetSheHe] ใช้สร้างอำนาจที่แท้จริง"
 bp2_yearly.0601.desc.diplomacy.humble: "ศิลปะการปกครอง สำหรับ [regent.GetHerHim] กุญแจสำคัญดูเหมือนจะเป็นความเห็นอกเห็นใจ — คนที่ท่านกำลังพูดด้วยอาจอยู่ต่ำกว่าท่าน แต่ความถ่อมตนในการทูตจะกลายเป็นความเมตตากรุณา และความเมตตากรุณาก็แฝงนัยยะของการมาจากตำแหน่งที่แข็งแกร่งกว่า"
 bp2_yearly.0601.desc.diplomacy.fallback: "ศิลปะการปกครอง ท่าทางที่ดี วาทศิลป์ที่ดี วาทศาสตร์ ความซับซ้อนของการเจรจา — เรื่องไร้สาระและการโอ้อวดตามปกติที่การเมืองของผู้ใหญ่ดูเหมือนจะหมกมุ่นอยู่กับมัน"
 bp2_yearly.0601.desc.martial.wrathful: "ทฤษฎีการทหาร [regent.GetSheHe|U] แทบจะน้ำลายฟูมปากตลอดเวลา เน้นย้ำว่าเมื่อเข้าร่วมการรบแล้ว ควรใช้ความรุนแรงอย่างรวดเร็วและเต็มที่ เพื่อให้ได้ชัยชนะ การไว้ชีวิตเชิญชวนความพ่ายแพ้"
 bp2_yearly.0601.desc.martial.calm: "ทฤษฎีการทหาร [regent.GetSheHe|U] มุ่งเน้นไปที่ประโยชน์ของการยับยั้งชั่งใจในการวางแผน การบริหารกองทัพที่กระชับ การใช้กลยุทธ์เพื่อลดจำนวนชีวิตที่ต้องสูญเสียในการต่อสู้ สำหรับ [regent.GetHerHim] ความรอบคอบและความสงบนำมา ซึ่งชัยชนะ"
 bp2_yearly.0601.desc.martial.fallback: "ทฤษฎีการทหาร สถานที่ตั้งค่าย วิธีดูแลม้าจำนวนมากในการทัพ รูปขบวนใดดีที่สุดในการต่อสู้กับศัตรูดั้งเดิมของเรา และอื่นๆ อีกมากมาย..."
 bp2_yearly.0601.desc.stewardship.greedy: "การพาณิชย์และภาษี ไม่มีอะไร ทำให้ [regent.GetHerHim] ตื่นเต้นได้เท่ากับการพาณิชย์และภาษี สีหน้าของความโลภอันยินดีที่ปรากฏ [regent.Custom('MaskFace_BehindAcross')] [regent.GetHerHis] [regent.Custom('MaskFace')] ดูเหมือนจะปลาบปลื้มอย่างยิ่ง หลงใหลในวิธีการต่างๆ มากมายในการได้มา ซึ่งเงินตรา สาธยายอย่างละเอียดทีละอย่างเป็นเวลาหลายชั่วโมง"
 bp2_yearly.0601.desc.stewardship.generous: "การพาณิชย์และภาษี สำหรับ [regent.GetHerHim] เงินตราเป็นเพียงหนทางไปสู่เป้าหมาย และเป้าหมายนั้นสำคัญกว่าการครอบครองความมั่งคั่งเพื่อตัวมันเอง ผู้ปกครองต้องเก็บเหรียญ ใช่ แต่เฉพาะเมื่อจำเป็น และต้องคืนให้อย่างอิสระเสมอ"
 bp2_yearly.0601.desc.stewardship.fallback: "การพาณิชย์และภาษี ภาษีและการพาณิชย์ คำปราศรัยที่ยืดยาวและเปลี่ยนแปลงได้เกี่ยวกับรายละเอียดปลีกย่อยของเหรียญกษาปณ์ วิธีการที่ดีที่สุดในการรีดไถความมั่งคั่ง และวิธีการมากมายที่ทั้งสามัญชนและขุนนางอาจพยายามซ่อนสิ่งที่ข้าควรได้รับไปจากข้า"
 bp2_yearly.0601.desc.intrigue.compassionate: "การชิงไหวชิงพริบทางการเมือง สำหรับ [regent.GetHerHim] คำถามคือวิธีที่ดีที่สุดในการต่อสู้ฝ่าดงอสรพิษโดยไม่ ทำให้มือเปื้อนเลือด เว้น แต่จำเป็นจริงๆ"
 bp2_yearly.0601.desc.intrigue.callous: "การชิงไหวชิงพริบทางการเมือง [regent.GetSheHe|U] พูดด้วยประโยคสั้นๆ เด็ดขาด และตัดสินอย่างรวดเร็วเสมอ คู่แข่งจะต้องถูกจัดการอย่างรวดเร็ว ด้วยกำลังหรือด้วยเสน่ห์ ไม่มีการลงโทษที่ไม่จำเป็นหรือความเมตตาที่โง่เขลา"
 bp2_yearly.0601.desc.intrigue.sadistic: "การชิงไหวชิงพริบทางการเมือง [regent.GetSheHe|U] ใช้เวลาส่วนใหญ่ไปกับการเพลิดเพลินกับคำอธิบายที่สร้างสรรค์เกี่ยวกับการลงโทษคู่แข่ง การอภิปรายประเด็นปลีกย่อยของการสร้างชื่อเสียง และการย้ำว่าการเป็นที่หวาดกลัวนั้นง่ายกว่าการเป็นที่รัก"
 bp2_yearly.0601.desc.intrigue.fallback: "การชิงไหวชิงพริบทางการเมือง การป้องกันการสมคบคิด การใช้อำนาจโดยนัย ตำแหน่งใดมีอิทธิพลลับ และอื่นๆ ยิ่งไปกว่านั้น บทเรียนส่วนใหญ่ยังเต็มไปด้วยความหมายซ้อนและความนัย"
 bp2_yearly.0601.desc.learning.shy: "หลักปรัชญาและเทววิทยา แม้ [regent.GetSheHe] จะพูดเสียงเบา แต่ข้าก็แทบไม่ได้ยิน [regent.GetHerHim] แต่ [regent.GetSheHe] ก็พึมพำต่อไปอย่างยืดยาว พูดถึงบทเรียนมากมายเกี่ยวกับการปกครองที่พบได้ในผลงานของปราชญ์ในอดีต"
 bp2_yearly.0601.desc.learning.gregarious: "หลักปรัชญาและเทววิทยา ด้วยเสียงดังและจริงใจ [regent.GetSheHe] ท่องรายชื่อนักประวัติศาสตร์และนักปรัชญาคนโปรดของ [regent.GetHerHis] ดาวรุ่งทางวิชาการและทฤษฎีที่ถกเถียงกันอย่างเผ็ดร้อน และการเรียนรู้เป็นประโยชน์ต่อทั้งผู้ปกครองและผู้ถูกปกครองอย่างไร"
 bp2_yearly.0601.desc.learning.fallback: "หลักปรัชญาและเทววิทยา เป็นคำปราศรัยที่น่าเบื่อเกี่ยวกับประวัติศาสตร์ ปรัชญา นักวิชาการกลิ่นแปลกๆ จากดินแดนห่างไกล เรื่องไร้สาระตามปกติทั้งหมด แต่ประเด็นหลักของ [regent.GetHerHis] ดูเหมือนจะเป็นว่าผู้ปกครองที่มีการศึกษา ทำให้ประชากรมีความสุข"
 bp2_yearly.0601.desc.child_reaction.disgust: "\n\nนี่ฟังดูผิดสำหรับข้า มีบางอย่างที่น่าสะพรึงกลัวเกี่ยวกับการจินตนาการว่า [regent.GetFirstNameNoTooltip] ปฏิบัติต่อผู้ที่ด้อยกว่า [regent.GetHerHis] เช่นนี้ และจินตนาการว่านั่นเป็นสิ่ง #EMP ที่ดี#!"
 bp2_yearly.0601.desc.child_reaction.admiration: "\n\nมีบางอย่างเกี่ยวกับเรื่องนี้ที่รู้สึกว่าถูกต้องโดยพื้นฐานสำหรับข้า [regent.GetFirstNameNoTooltip] เข้าใจระเบียบที่แท้จริงของสิ่งต่างๆ ว่านี่คือวิธีที่ขุนนางที่เหมาะสม #EMP ควร#! ประพฤติตน"
 bp2_yearly.0601.desc.child_reaction.boredom: "\n\nข้าพบว่ามุมมองของ [regent.GetFirstNamePossessiveNoTooltip] ในเรื่องนี้ #EMP น่าเบื่อ#! อย่างยิ่ง แต่ข้าติดอยู่ในการบรรยายนี้ แน่นอนว่าข้าจะมีเวลาเหลือเฟือที่จะเรียนรู้ทั้งหมดนี้เมื่อข้าเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ด้วยตัวเอง?"
 bp2_yearly.0601.option.skill: "ใส่ใจในรายละเอียดทางเทคนิค"
 bp2_yearly.0601.option.perk: "มุ่งเน้นไปที่เจตนารมณ์ของคำแนะนำ"
 bp2_yearly.0601.a: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.b: "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.c: "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.d: "$bp2_yearly.0601.option.perk$"
