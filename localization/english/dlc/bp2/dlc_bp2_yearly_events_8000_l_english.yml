l_english: 
 bp2_yearly.8070.t: "เวลาเล่น"
 bp2_yearly.8070.desc.intro: "ในที่สุดข้าก็ได้เล่นตามลำพัง และแน่นอนว่าข้าหยิบ"
 bp2_yearly.8070.desc.mid.horses: "ม้าไม้คู่ใจออกจากกล่องของเล่นและฝันถึงการขี่ม้าเข้าสู่การประลองอันยิ่งใหญ่"
 bp2_yearly.8070.desc.mid.puppets: "หุ่นเชิดตัวน้อยที่คาดเดาได้ออกจากกล่องของเล่นและนำมาเล่น มันรู้สึกดีเสมอที่ได้ควบคุมชีวิตน้อยๆ ของพวกมันอย่างสมบูรณ์ และแสดงบทบาทสมมติตามที่ข้าออกแบบไว้"
 bp2_yearly.8070.desc.mid.board_game: "กระดาน [ROOT.Char.Custom('BG_GameType_Generic')] สุดโปรดออกจากหีบของเล่น ไม่มีอะไรดีไปกว่าการพิสูจน์ปัญญาของข้าและเฝ้าดูหมากทุกตัวเข้าที่ และไม่มีคู่ต่อสู้ใดดีไปกว่าตัวข้าเอง"
 bp2_yearly.8070.desc.mid.teetotum: "ลูกข่างเจ้าเล่ห์ออกจากกล่องของเล่น มีบางอย่างที่น่าพึงพอใจอย่างยิ่งในการเฝ้าดูมันหมุนไปรอบๆ และพนันว่ามันจะตกลงที่ใด"
 bp2_yearly.8070.desc.mid.marbles: "ลูกแก้วอันน่าอัศจรรย์ออกจากกล่องของเล่น ไม่มีอะไรจะนำพามิตรสหายมารวมกันได้ดีเท่ากับถุงลูกแก้วดีๆ และจินตนาการเล็กน้อย!"
 bp2_yearly.8070.desc.outro: "\n\nแต่แล้ว [other_child.GetFirstName|U] ก็เข้ามาหาข้าอย่างคาดหวังและถามว่า "ข้าเล่นด้วยได้ไหม?""
 bp2_yearly.8070.a: "ข้าอยากเล่นคนเดียวมากกว่า"
 bp2_yearly.8070.b: "ทุกอย่างสนุกขึ้นเมื่อมีเพื่อน!"
 bp2_yearly.8070.b.success: "ท่านมีช่วงเวลาที่ดีร่วมกัน"
 bp2_yearly.8070.b.failure: "ท่านมีช่วงเวลาที่ทะเลาะเบาะแว้งกัน"
 bp2_yearly.8071.t: "ของเล่นชิ้นโปรดวัยเยาว์"
 bp2_yearly.8071.desc.intro: "ขณะที่ข้ารื้อค้นของเก่าเพื่อหางานราชการบางอย่าง ข้าก็พบกับสิ่งที่คุ้นเคย"
 bp2_yearly.8071.desc.mid.horses: "ม้าไม้ตัวเล็กวางอยู่ในมุมที่ซ่อนเร้นของตู้เสื้อผ้า ถูกฝังอยู่ท่ามกลางเสื้อผ้า มันรู้สึกเบาและเล็กมากในมือข้า นี่คือมือของ [ROOT.Char.GetWomanMan] แล้ว เวลาหายไปไหนหมด?\n\n"
 bp2_yearly.8071.desc.mid.puppets: "หุ่นเชิดฝุ่นจับกลุ่มเล็กๆ นอนนิ่งอยู่ที่ก้นหีบเก่า สีของมันซีดจาง เสื้อผ้าขาดรุ่งริ่งจากการใช้งานอย่างรักใคร่มาหลายปี และถูกละเลยมาอีกหลายปี\n\n"
 bp2_yearly.8071.desc.mid.board_games: "กระดาน [ROOT.Char.Custom('BG_GameType_Generic')] แรกของข้าอยู่ที่ก้นหีบเก่า หายไปอย่างน้อยครึ่งหนึ่งและเสียหายอย่างหนัก รอยบิ่นและรอยแตก แต่ละรอยคือเรื่องราวจากวัยเยาว์ที่ข้าคิดว่าลืมไปแล้ว\n\n"
 bp2_yearly.8071.desc.mid.spinning_top: "ลูกข่างเล็กๆ อันหนึ่งวางอยู่ท่ามกลางจดหมายราชการ เคยมีช่วงเวลาที่ไม่มีอะไรสำคัญกับข้ามากไปกว่าลูกข่างหมุนเล็กๆ นี้ ตอนนี้มันเป็นเพียงที่ทับกระดาษ ข้าปล่อยให้สิ่งนี้เกิดขึ้นได้อย่างไร?\n\n"
 bp2_yearly.8071.desc.mid.marbles: "ข้าพบถุงหนังเล็กๆ ใส่ลูกแก้วที่เต็มไปด้วยฝุ่นซ่อนอยู่ท่ามกลางข้าวของอื่นๆ ที่ถูกละเลย ลูกแก้วหลายลูกเสียหายหรือหายไป แต่ลูกที่ยังคงอยู่มีค่าสำหรับข้ามากกว่าทองคำ\n\n"
 bp2_yearly.8071.desc.mid.other_child_alive: "ข้าจำได้ว่าเคยใช้เวลาช่วงบ่ายฤดูร้อนหลายครั้งเล่นกับ [other_child.GetFirstName] และไม่มีอะไรอื่นสำคัญเลย ข้าสงสัยว่าตอนนี้ [other_child.GetSheHe] ทำอะไรอยู่ หรือว่า [other_child.GetSheHe] จำการเล่นที่เราเคยมีร่วมกันได้หรือไม่\n\n"
 bp2_yearly.8071.desc.mid.other_child_dead: "ข้าจำได้ว่าวัยเด็กของข้าเต็มไปด้วยเสียงหัวเราะของ [other_child.GetFirstName] ขณะที่เราเล่นด้วยกัน มันเป็นเสียงหัวเราะที่ข้าจะไม่มีวันลืม หรือได้ยินอีกเลย\n\n"
 bp2_yearly.8071.desc.outro: "เมื่อของเล่นชิ้นโปรดอยู่ในมือข้าตอนนี้ มันรู้สึกราวกับว่าข้ากำลังกุมวัยเด็กของข้าไว้"
 bp2_yearly.8071.a.puppet: "ข้าอาจเป็นผู้เชิดหุ่นอีกครั้ง!"
 bp2_yearly.8071.a.gambler: "ข้ารู้เสมอว่าเมื่อใดควรป้องกันความเสี่ยง"
 bp2_yearly.8071.a.marbles: "ข้าต้องนำผู้คนมารวมกัน ดัง เช่นลูกแก้วของข้า"
 bp2_yearly.8071.a: "ข้าควรทำตามความฝันในวัยเด็กของข้า"
 bp2_yearly.8071.b: "ไปดูกันว่า [other_child.GetFirstNameNoTooltip] ทำอะไรอยู่!"
 bp2_yearly.8071.c: "ข้าเป็นคนละคนแล้วตอนนี้ และนั่นก็ไม่เป็นไร"
 bp2_yearly.8080.t: "เสน่ห์แบบ [ward.Custom('GirlBoy')|U]"
 bp2_yearly.8080.desc: "แม้ข้าจะพยายามเพียงใด ความรักของ [target.Custom2('MyCharacterIntroduction', ROOT.Char)] ก็ยังคงหลุดลอยไป แต่ข้ารู้สึกว่าข้ากำลังเข้าใกล้บางสิ่งที่ยิ่งใหญ่ ด้วยการดูแล [ward.Custom2('MyCharacterIntroduction', ROOT.Char)] ของข้า ข้าอาจประสบความสำเร็จในการเกี้ยวพาราสีของข้าได้!\n\nการกระตุ้นเล็กน้อย และบางที [ward.GetFirstNameNoTooltip] อาจจะขับขานคุณงามความดีของข้า และพิสูจน์ว่าข้ามีวิธีปฏิบัติต่อเด็กที่ [target.GetWomanMan] ทุกคนจะพบว่าไม่อาจต้านทานได้"
 bp2_yearly.8080.a: "ลงมือทำกันเถอะ!"
 bp2_yearly.8080.a.likes.tt: "[ward.GetFirstNameNoTooltip] พูดถึงท่านในทางที่ดี"
 bp2_yearly.8080.a.dislikes.tt: "[ward.GetFirstNameNoTooltip] พูดถึงท่านในทางที่ไม่ดี"
 bp2_yearly.8080.b: "ข้าจะไม่ใช้วิธีนี้"
 bp2_yearly.8081.t: "ขับขานคำสรรเสริญข้า"
 bp2_yearly.8081.desc: "ข้าส่ง [ward.GetFirstName] ไปหาเป้าหมายแห่งความรักของข้า และในไม่ช้า [target.GetFirstName] ก็มองมาที่ข้าพร้อมรอยยิ้มบนใบหน้าของ [target.GetHerHis] ขณะที่ [target.GetSheHe] พูดคุยกับผู้อยู่ในอุปถัมภ์น้อยของข้า"
 bp2_yearly.8081.a: "ช่างเป็นเด็กที่น่ารักเสียนี่กระไร"
 bp2_yearly.8082.t: "ถูกดูหมิ่น"
 bp2_yearly.8082.desc: "ข้าส่ง [ward.GetFirstName] ไปหาเป้าหมายที่ข้าหมายปอง โดยคาดหวังถึงสิ่งที่ดีที่สุดในใจ ทว่าไม่นาน [target.GetFirstName] ก็ชำเลืองมองมาที่ข้าและหัวเราะคิกคักไม่หยุดทุกครั้งที่ [ward.GetFirstNameNoTooltip] อ้าปากของ[ward.GetHerHis]พูด\n\nข้าได้ยินไม่ถนัดนัก แต่ข้าได้ยินคำว่า "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('ward'))]" "[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('ward'))]" และ "เหม็น" ถูกโยนไปมาบ่อยครั้ง"
 bp2_yearly.8082.a: "เจ้าเด็กบ้าเอ๊ย!"
 bp2_yearly.8082.b: "เหม็นรึ? ข้าต้องเข้าไปแทรกแซง!"
 bp2_yearly.8090.t: "ของเล่นที่คุ้นเคย"
 bp2_yearly.8090.desc: "ข้าถูกนำเข้าไปในห้องที่มีแสงสลัวโดย [monk.Custom2('MyCharacterIntroduction', ROOT.Char)] [monk.GetSheHe|U] นำเสนอของเล่นเก่าๆ มากมายให้ข้า ทั้งหมดบิ่นและเก่าคร่ำคร่าตามกาลเวลา\n\n"ข้าสงสัยมานานแล้วว่าท่านคือวิญญาณกลับชาติมาเกิดของ [ancestor.GetName] และบัดนี้ท่านอายุครบ [ROOT.Char.GetAge] ปีแล้ว ถึงเวลาที่ข้าจะทดสอบทฤษฎีนั้น ต่อหน้าท่านคือวัตถุห้าชิ้น มีเพียงชิ้นเดียวที่เป็นของ [ancestor.GetFirstNameNoTooltip] ผู้ยิ่งใหญ่ ท่านจำ [ancestor.GetWomanMan] ที่ท่านเคยเป็นได้หรือไม่? วัตถุชิ้นใดในนี้เป็นของท่าน?""
 bp2_yearly.8090.a: "ม้า"
 bp2_yearly.8090.b: "หุ่นเชิด"
 bp2_yearly.8090.c: "กระดาน [ROOT.Char.Custom('BG_GameType_Generic')]"
 bp2_yearly.8090.d: "ลูกข่าง"
 bp2_yearly.8090.e: "ลูกแก้ว"
 bp2_yearly.8090.f: "ไม่มีเลย"
 ancestor_horse_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านชอบม้า..."
 ancestor_puppet_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านชอบหุ่นเชิด..."
 ancestor_board_games_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านชอบ [ROOT.Char.Custom('BG_GameType_Generic')]..."
 ancestor_spinning_tops_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านชอบลูกข่าง..."
 ancestor_marbles_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านชอบลูกแก้ว..."
 ancestor_nothing_guess_tt: "ท่านรู้สึกว่าบรรพบุรุษของท่านไม่ชอบสิ่งของเหล่านี้เลย..."
 bp2_yearly.8091.t: "กลับชาติมาเกิด!"
 bp2_yearly.8091.desc: "เมื่อข้าให้คำตอบ ข้าเห็นดวงตาของ [monk.GetNamePossessive] เบิกกว้าง [monk.GetSheHe|U] ทรุดลงคุกเข่า [monk.GetHerHis] ด้วยความเคารพต่อข้า\n\n"เด็กน้อยผู้ปราดเปรื่อง! ข้าสิ้นสงสัยแล้ว ท่านต้องเป็น [ancestor.GetName] กลับชาติมาเกิดเป็นแน่แท้!""
 bp2_yearly.8091.a: "ว้าว! นั่นใครกัน?"
 bp2_yearly.8091.a.knew_them: "ข้าคือ [ROOT.Char.Custom2('RelationToMeShort',ancestor)] ของข้าเอง"
 bp2_yearly.8092.t: "ไม่ได้กลับชาติมาเกิดอีกต่อไป"
 bp2_yearly.8092.desc: "ข้าให้คำตอบ และ [monk.GetName] ก็ทรุดลงคุกเข่า [monk.GetHerHis] อย่างสิ้นหวัง\n\n"อนิจจา จินตนาการของข้าคงเตลิดไปไกล วัตถุนั้นมิได้เป็นของ [ancestor.GetName] ผู้ยิ่งใหญ่ และการตามหาวิญญาณของ [ancestor.GetHerHis] ของข้ายังคงดำเนินต่อไป""
 bp2_yearly.8092.a: "ข้าลองอีกครั้งได้ไหม?"
 bp2_yearly.8100.t: "กลิ้ง"
 bp2_yearly.8100.desc: "ข้ากำลังเล่นอยู่ในสวนของ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] กับเพื่อนๆ ในช่วงเวลาที่หาได้ยาก ซึ่งปราศจากสายตาจับจ้องของผู้ปกครองและครูผู้สอน\n\nทุกอย่างเกิดขึ้นอย่างกะทันหัน ข้าถูกกวาดเท้าและกลิ้งลงเนินเขาสูงชัน โดยมี [potential_crush.GetFirstName] กอดข้าแน่นขณะที่เรากลิ้งลงไปเรื่อยๆ เมื่อถึงด้านล่าง ข้าก็มึนงงโดยมีดวงตาของ [potential_crush.GetHerHis] จ้องลึกเข้ามาในดวงตาข้าขณะที่ [potential_crush.GetSheHe] ยิ้มและหัวเราะคิกคักใส่ข้า\n\nข้ารู้สึกแปลกๆ ในอกขณะมองกลับไปที่ [potential_crush.GetHerHim] ความรู้สึกนี้คืออะไร?"
 bp2_yearly.8100.a: "ความรัก!"
 bp2_yearly.8100.b: "ความเกลียดชัง!"
 bp2_yearly.8100.c: "อาหารไม่ย่อย!"
 bp2_yearly.8110.t: "ข้าราชสำนักผู้สุภาพ"
 bp2_yearly.8110.desc: "การมีบุตรเติบโตในครรภ์เป็นสิ่งที่วิเศษและศักดิ์สิทธิ์ที่สุด แต่แน่นอนว่ามัน ทำให้กิจกรรมในชีวิตประจำวันกลายเป็นบททดสอบความอดทนของข้า โชคดีที่เมื่อข้าตั้งครรภ์หนักขึ้น ข้าพบว่าตนเองมีผู้คนมากมายที่เต็มใจช่วยเหลือข้า\n\n[caretaker_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] อยู่เคียงข้างเสมอเพื่อพิสูจน์ความจงรักภักดีของ [caretaker_1.GetHerHis] ต่อทั้ง [caretaker_1.GetFaith.HighGodName|U] และข้าโดยคอยรับใช้ตามความต้องการทุกอย่างของข้า [caretaker_2.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ก็ดูเหมือนจะพยายามเอาชนะใจข้าด้วยการบรรเทาความเครียดในชีวิตประจำวัน [caretaker_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ผู้ภักดีเสมอมา สามารถคาดเดาความต้องการทุกอย่างของข้าได้โดยที่ข้าไม่ต้องเอ่ยปากด้วยซ้ำ"
 bp2_yearly.8110.a: ""ขอบคุณทุกท่าน""
 bp2_yearly.8110.b: "ข้ารู้ว่าข้าพึ่งพา [caretaker_1.GetFirstNameNoTooltip] ได้เสมอ"
 bp2_yearly.8110.c: "[caretaker_2.GetFirstNameNoTooltip] ได้รับความรักจากข้าแล้ว"
 bp2_yearly.8110.d: "[caretaker_3.GetFirstNameNoTooltip] รู้ดีว่าข้าต้องการอะไร"
 bp2_yearly.8120.t: "ภาระของการตั้งครรภ์"
 bp2_yearly.8120.desc: "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บัดนี้ตั้งครรภ์แก่แล้ว และแม้ แต่งานที่ง่ายที่สุดก็ดูเหมือนจะเป็นภาระที่แท้จริงสำหรับ [spouse.GetHerHim] ข้านอนอยู่บนเตียงและเฝ้าดูขณะที่ [spouse.GetSheHe] พยายามถอดเสื้อผ้า แม้จะมีความช่วยเหลือจากคนรับใช้\n\n[spouse.GetSheHe|U] หันมาหาข้า ด้วยแววตาโหยหา แต่เหนื่อยล้าในดวงตาของ [spouse.GetHerHis] ราวกับขอให้ข้าช่วย"
