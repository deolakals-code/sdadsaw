l_english: 
 ##################################################
 # IRANIAN INTERMEZZO FRONTIER FLAVOR EVENTS 
 ##################################################

 fp3_yearly.2000.t: "ผู้ตรวจตรากลางวันแสกๆ"
 fp3_yearly.2000.desc_drinking: "ตลอดทั้งคืน ข้าได้ดื่มสุรากับเหล่าข้าในบังคับและสหายร่วมวง บัดนี้ข้ากำลังละเลียดรสสุรายามเช้าหยดสุดท้าย,"
 fp3_yearly.2000.desc_hashish: "ตลอดทั้งคืน ข้าได้เสพกัญชากับเหล่าข้าในบังคับและสหายร่วมวงจนตะวันขึ้น บัดนี้ข้ากำลังลอบหยิบขนมเค้กกัญชาชิ้นสุดท้าย,"
 fp3_yearly.2000.desc_warning: "[cautious_vassal.GetTitledFirstName] ดึงข้าไปกระซิบขณะที่ข้ากำลังมึนเมา:\n\n"หาก #italic มุห์ตาซิบ#! ของ [prudish_liege.GetTitledFirstNamePossessive] พบท่านในสภาพ เช่นนี้ที่ตลาดสด [prudish_liege.GetSheHe] จะจับกุมท่านและลงโทษด้วยการเฆี่ยน จงพักผ่อนอยู่ในร่มนี้จนกว่าจะถึงเวลาละหมาด #italic ซุฮ์ริ#! ในยามบ่าย แล้วค่อยออกไปเมื่อสร่างเมาแล้ว""
 fp3_yearly.2000.a: "ใช่ ท่านรู้ดีที่สุด"
 fp3_yearly.2000.b: "[prudish_liege.GetTitleAsNameNoTooltip] ไม่มีวันจับกุมข้าหรอก!"
 fp3_yearly.2000.b_flavor: "ข้าเชื่อว่า [prudish_liege.GetTitledFirstName] คงไม่จงใจทำร้ายข้าในนามแห่งกฎหมาย [prudish_liege.GetFaith.GetAdjective] ดอก"
 fp3_yearly.2000.b_success: "ข้ากลับถึงบ้านโดยปลอดภัย"
 fp3_yearly.2000.b_failure: "#italic มุห์ตาซิบ#! ของ [prudish_liege.GetTitledFirstNamePossessiveNoTooltip|U] จับและเฆี่ยนตีข้า"

 fp3_yearly.2001.t: "เมามายในที่สาธารณะ"
 fp3_yearly.2001.desc_intro: "#italic มุห์ตาซิบ#! ของข้าแจ้งว่า [intoxicated.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังเดินเตร็ดเตร่อยู่ในตลาดสด,"
 fp3_yearly.2001.desc_drinking: "เดินโซเซและพูดจาอ้อแอ้ [intoxicated.GetHerHis]"
 fp3_yearly.2001.desc_hashish: "หัวร่อคิกคักและเหม่อมองหมู่เมฆ"
 fp3_yearly.2001.desc_outro: "ทั้งๆ ที่เป็นเวลากลางวันแสกๆ!\n\nพวกเขาแจ้งข้าว่า โทษตามปกติสำหรับพฤติกรรมอันไม่เหมาะสมนี้ คือการจับกุมและเฆี่ยนตีผู้ศรัทธาที่ออกนอกลู่นอกทางผู้นี้"
 fp3_yearly.2001.a: "ละเว้นการลงทัณฑ์เถิด..."
 fp3_yearly.2001.b: "[ROOT.Char.GetFaith.HighGodName] จะทรงอภัยให้ในครั้งนี้"

 fp3_yearly.2010.t: "มานน์แห่งข้าวสาลี"
 fp3_yearly.2010.desc: "ไม่มีข่าวคราวเรื่องภัยแล้งหรือทุพภิกขภัยมาถึงหูข้าเลย แต่กระนั้นผู้คนแห่ง [bakers_county.GetNameNoTier] ก็ยังคงบ่นว่าราคาขนมปังแพงขึ้นอย่างไม่มีเหตุผล\n\n"เป็น เพราะ [greedy_baker.GetFirstName] คนทำขนมปังหลวงของท่านนั่นเอง" [random_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] บอกข้า "[greedy_baker.GetSheHe|U] กว้านซื้อข้าวสาลีและแป้งทุกหาบที่เข้ามาในเมือง และไม่อนุญาตให้พวกเราซื้อแม้เพียง #italic มานน์#! เดียวเพื่อตนเองเลย""
 fp3_yearly.2010.a: "[greedy_baker.GetSheHe|U] จะถูกโยนลงไปใต้ฝ่าเท้าของ"
 fp3_yearly.2010.a.tt: "[greedy_baker.GetFirstName] ถูกเหยียบย่ำ และเราชดเชยการขาดแคลนข้าวสาลีท้องถิ่นเพื่อเอาใจชาวบ้าน"
 fp3_yearly.2010.a_elephants: "ช้าง!"
 fp3_yearly.2010.a_camels: "อูฐ!"
 fp3_yearly.2010.a_horses: "ม้า!"
 fp3_yearly.2010.b: "น่าสนใจ ข้าควรเก็บ [greedy_baker.GetHerHim] ไว้ใกล้ตัว"
 fp3_yearly.2010.c: "อาชญากรรมที่แท้จริงคือการซุกซ่อนผลกำไรเหล่านี้จากข้า"

 fp3_yearly.2020.t: "กำหนดมาตรฐาน"
 fp3_yearly.2020.desc_intro: "ผู้เก็บภาษีของเจ้าเหนือหัวข้า [sinful_tax_collector.GetTitledFirstName] ห่างไกลจากการเป็น [sinful_tax_collector.GetWomanMan] ผู้ทรงคุณธรรมนัก"
 fp3_yearly.2020.desc_greedy: "ความรักในทองคำของ [sinful_tax_collector.GetHerHis|U] เทียบได้กับความรักในชีวิตของ [sinful_tax_collector.GetHerHis] เองเท่านั้น [sinful_tax_collector.GetSheHe] จะทำทุกวิถีทางเพื่อเก็บเงินแม้เพียงเหรียญเงินเดียวเกินกว่าที่ต้องชำระ"
 fp3_yearly.2020.desc_arbitrary: "[sinful_tax_collector.GetSheHe|U] ไม่มีความรักในความยุติธรรม [sinful_tax_collector.GetSheHe] เก็บภาษีตามอำเภอใจของ [sinful_tax_collector.GetHerHis] และจะเพิกเฉยต่อกฎระเบียบใดๆ ที่ [sinful_tax_collector.GetSheHe] เห็นว่ายุ่งยาก"
 fp3_yearly.2020.desc_cynical: "[sinful_tax_collector.GetSheHe] แสดงความสนใจในเรื่องศาสนาน้อยมาก และไม่มีความรักต่อ [ROOT.Char.GetFaith.HighGodName] เลย [sinful_tax_collector.GetSheHe] หลับใหลตลอดการสวดมนต์ยามเช้า และถูกพบว่าลอบกินอาหารตลอดช่วงรอมฎอน"
 fp3_yearly.2020.desc_contrite: "[sinful_tax_collector.GetSheHe] ไม่สามารถไว้วางใจในเรื่องความลับได้ และจะเปิดเผยสถานะทางการเงินของใครก็ได้โดยง่าย ไม่มีสิ่งใดไปถึงหูเจ้าเหนือหัวข้าโดยไม่ไปถึงหูคนอื่นอีกเก้าคน"
 fp3_yearly.2020.desc_outro: "\n\n[sinful_tax_collector.GetWomanMan] เช่นนี้จะได้รับความไว้วางใจให้ดูแลการคลังของอาณาจักร – และของข้าด้วยได้อย่างไร?"
 fp3_yearly.2020.a: "[liege.GetTitledFirstNameNoTooltip] ต้องรับผิดชอบต่อบาปของ [sinful_tax_collector.GetTitledFirstNamePossessiveNoTooltip]"
 fp3_yearly.2020.a_success: "[sinful_tax_collector.GetTitledFirstNameNoTooltip] ถูกไล่ออกจากตำแหน่ง [sinful_tax_collector.GetHerHis]"
 fp3_yearly.2020.a_failure: "การคัดค้านของข้าไม่เป็นผล"
 fp3_yearly.2020.a_failure.tt: "[sinful_tax_collector.GetTitledFirstNameNoTooltip] อาจเริ่มสร้างปัญหาให้ข้าได้"
 fp3_yearly.2020.b: "ข้าต้องประณาม [sinful_tax_collector.GetTitledFirstNameNoTooltip] เพื่อประโยชน์สุขของอาณาจักร"
 fp3_yearly.2020.b.t: "ผู้เก็บภาษีที่ถูกประณาม"
 fp3_yearly.2020.b.desc: "เหตุการณ์นี้เกิดขึ้น เพราะ [denouncing_taxpayer.GetShortUIName] ข้าในบังคับของท่าน ประณามความผิดบาปของ [sinful_tax_collector.GetShortUIName]"
 fp3_yearly.2020.c: "ข้าจะสวดภาวนาให้ [sinful_tax_collector.GetHerHim]"

 fp3_yearly.2021.desc_intro: "แม้ว่า [sinful_tax_collector.GetTitledFirstName] ผู้เก็บภาษีของข้า จะมีความสามารถพอตัว แต่ [denouncing_taxpayer.GetName] ได้มาหาข้าพร้อมกับข้อกังขาอย่างยิ่งในทางตรงกันข้าม\n\n"
 fp3_yearly.2021.desc_greedy: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] นั้นเห็นแก่ประโยชน์ส่วนตนโดยสิ้นเชิง ถูกขับเคลื่อนด้วยความรักในเงินตรามากกว่าความยุติธรรม [sinful_tax_collector.GetSheHe|U] มักจะเก็บภาษีเกินกว่าที่กำหนดและไม่เคยบริจาคให้แก่กองทุนซะกาตเลย""
 fp3_yearly.2021.desc_arbitrary: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] แทบไม่เคยใส่ใจกฎหมายหรือกฎระเบียบใดๆ เลย กลับเก็บภาษีตามอำเภอใจของ [sinful_tax_collector.GetHerHis] พวกไพร่ฟ้ามักเดือดร้อนจากการเก็บภาษีที่ไม่สม่ำเสมอของ [sinful_tax_collector.GetHerHis]""
 fp3_yearly.2021.desc_cynical: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] ไม่ยำเกรงต่อ [ROOT.Char.GetFaith.HighGodName] มักหลับใหลตลอดการสวดมนต์ยามเช้าและลอบกินอาหารในช่วงรอมฎอน พวกเราทุกคนต่างหวาดกลัวความยุติธรรมของ [ROOT.Char.GetFaith.HighGodNamePossessive] ที่จะลงทัณฑ์ [sinful_tax_collector.GetHerHis]""
 fp3_yearly.2021.desc_contrite: ""[sinful_tax_collector.GetTitledFirstNameNoTooltip] ไม่สามารถไว้วางใจในเรื่องความลับได้ [sinful_tax_collector.GetSheHe] จะป่าวประกาศสถานะการคลังของอาณาจักรให้ใครก็ตามที่ยอมฟัง เป็นเพียงเรื่องของเวลาเท่านั้นที่ข้อมูลนี้จะตกไปอยู่ในมือของศัตรู""
 fp3_yearly.2021.desc_outro: "\n\n[denouncing_taxpayer.GetTitledFirstNameNoTooltip] [denouncing_taxpayer.Custom('quirk_pos_present')], เห็นได้ชัดว่าคาดหวังให้ข้าไล่ [sinful_tax_collector.GetTitledFirstNameNoTooltip] ออกจากความผิดเหล่านี้"
 fp3_yearly.2021.a: "[sinful_tax_collector.GetTitledFirstNameNoTooltip|U] จะถูกปลด อินชาอัลลอฮ์"
 fp3_yearly.2021.b: "ข้าจะจดจำคำพูดของท่านไว้"

 fp3_yearly.2030.t: "กฎแห่งความงาม"
 fp3_yearly.2030.desc_intro: "ขณะที่ข้าเพ่งมองรูปลักษณ์ของตนในกระจกเงา พลางพิศดู"
 fp3_yearly.2030.desc_beauty_bad: "ความอัปลักษณ์อันร้ายกาจ,"
 fp3_yearly.2030.desc_spindly: "แขนขาผอมเกร็งเป็นปุ่มปม,"
 fp3_yearly.2030.desc_disfigured: "ใบหน้าที่ทุกข์ทรมานหลังหน้ากาก,"
 fp3_yearly.2030.desc_scaly: "ผิวหนังเป็นด่างดวงและคันคะเยอ,"
 fp3_yearly.2030.desc_albino: "ผิวขาวเผือกและดวงตาดุจปีศาจ,"
 fp3_yearly.2030.desc_hunchbacked: "ส่วนยื่นอันโชคร้าย,"
 fp3_yearly.2030.desc_inbred: "ร่างกายบิดเบี้ยว,"
 fp3_yearly.2030.desc_outro: "ข้ากังวลว่าผู้คนของข้าจะเกลียดชังข้า เพราะรูปลักษณ์อันไม่น่าพึงใจนี้ เมื่อนั้นเองที่ [reassuring_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] มอบปัญญาของ [reassuring_courtier.GetHerHis] แก่ข้า:\n\n"หากท่านถือเอาเพียงทองคำเป็นศัตรูแล้วไซร้ [ROOT.Char.GetWomenMen] ทั้งปวงก็จะถือว่าท่านเป็นมิตรของพวกเขา""
 fp3_yearly.2030.a: "เช่นนั้นแล้ว ขอให้ข้าเป็นมิตรกับทั้งอาณาจักรเถิด"
 fp3_yearly.2030.b: "ขอบใจท่าน [reassuring_courtier.GetNameNoTooltip]"
 fp3_yearly.2030.c: "ความกลัวต่างหาก มิใช่ความรัก ที่จะซื้อความภักดีของพวกเขาได้"
 fp3_yearly.2030.d: "เมื่อเวลาผ่านไป พวกเขาจะรู้จักข้าเอง"

 fp3_yearly.2040.t: "ผู้นำแห่งศรัทธาชน"
 fp3_yearly.2040.desc_attacker_is_muslim: "ผู้ใดที่ต่อต้านข้า ผู้นั้นก็ต่อต้านองค์ศาสดา และถึงกระนั้น [infidel.GetTitledFirstName] [infidel.Custom2('InsultNoun', ROOT.Char)] นั่น ก็ยังกล้าประกาศสงครามกับข้า\n\nทว่า ไม่ใช่ทุกคนที่จะไร้ศรัทธาถึงเพียงนั้น หากข้ายืนหยัดต่อหน้ากองทัพของ [infidel.GetTitledFirstNameNoTooltip] และย้ำเตือนพวกเขาถึงอำนาจของข้าต่อองค์ศาสดา แน่นอนว่าทหารจำนวนหนึ่งย่อมต้องยอมถอย"
 fp3_yearly.2040.desc_attacker_is_not_muslim: "ด้วยความโง่เขลาต่อวจนะขององค์ศาสดา [infidel.GetTitledFirstName] [infidel.Custom2('InsultNoun', ROOT.Char)] นั่น ได้ประกาศสงครามกับข้าและมุ่งทำลายการปกครองอันศักดิ์สิทธิ์ของข้า\n\nทว่า ไม่ใช่ทุกคนที่จะไร้ศรัทธาถึงเพียงนั้น: ยังมีบางคนในดินแดนของ [infidel.GetTitledFirstNamePossessiveNoTooltip] ที่เชื่อฟังวจนะของ [caliph.GetFaith.HighGodName] หากข้ายืนหยัดต่อหน้าพวกเขาและย้ำเตือนถึงอำนาจของข้าต่อองค์ศาสดา แน่นอนว่าพวกเขาย่อมต้องยอมถอย"
 fp3_yearly.2040.a: "องค์ศาสนทูตจะนำทางข้า!"
 fp3_yearly.2040.a.flavor: "ความศรัทธาและความรู้ใน [caliph.GetFaith.ReligiousText] ของข้าจะนำทางคำพูดของข้าเอง"
 fp3_yearly.2040.a_success: "เหล่าทหารเชื่อฟังอำนาจของท่าน"
 fp3_yearly.2040.a_failure: "เหล่าทหารเย้ยหยันคำร้องขอของท่านและสังหารท่าน"
 fp3_yearly.2040.b: "องค์ศาสนทูตจะนำทาง [imam.GetTitledFirstName]"
 fp3_yearly.2040.b.flavor: "[imam.GetTitledFirstNameNoTooltip] เชี่ยวชาญในเรื่องศาสนามากกว่าข้า"
 fp3_yearly.2040.b_success: "เหล่าทหารเคารพ [imam.Custom('MyPriestTitle')] ของท่าน"
 fp3_yearly.2040.b_failure: "เหล่าทหารสังหาร [imam.Custom('MyPriestTitle')] ของท่าน"
 fp3_yearly.2040.c: "ไม่ มันเสี่ยงเกินไป"

 fp3_yearly.2041.desc_cynical: "[caliph.GetTitledFirstName|U] เรียกร้องให้ทหาร [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] ของข้ายอมวางอาวุธโดยอ้างว่า [caliph.GetSheHe] คือผู้สืบทอดโดยชอบธรรมต่อองค์ศาสดา และพวกเขาก็เชื่อฟัง [caliph.GetHerHim]!\n\nใครจะสนกันว่า [caliph.GetSheHe] เป็นผู้สืบทอดก้นกบของ [caliph.GetHerHis] เองหรือไม่? นั่นมิอาจหยุดข้าจากการเหยียบย่ำมันได้"
 fp3_yearly.2041.desc_fallback: "ตัวข้าเองรู้ดีว่าสงครามของข้าที่ต่อต้าน [caliph.GetName] นั้น ได้รับการอนุมัติจาก [ROOT.Char.GetFaith.HighGodName] ถึงกระนั้น [caliph.Custom2('InsultNoun', ROOT.Char)] นั่นก็ยังสามารถโน้มน้าวเหล่าทหาร [caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] ของข้าได้ว่า เพราะ [caliph.GetSheHe] คือผู้สืบทอดขององค์ศาสดา พวกเขาจึงต้องยอมถอยและกลับบ้าน\n\nทหารของข้าจำนวนมากยอมทำตาม และบัดนี้ข้าต้องรับมือกับผลที่ตามมาของกองทัพที่ภักดี แต่มีขนาดเล็กลง..."
 fp3_yearly.2041.a: "สาปแช่ง [caliph.Custom2('InsultNoun', ROOT.Char)] นั่น!"

 fp3_yearly.2050.t: "สถานพำนักฟุตูวา"
 fp3_yearly.2060.t_madrasas: "มะดาริส"
 fp3_yearly.2060.t_houses_of_worship: "การศึกษาใน [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]"
 
 #Ghazi Gone Bad, by Ola Jentzsch 
 fp3_yearly.8000.t: "กาซีผู้ชั่วร้าย"
 fp3_yearly_non_islamic.t: "นักรบชายแดน?"
 fp3_yearly.8000.desc_opening: "[raging_ghazi.GetFirstName] เป็นหนึ่งใน #italic กาซี#! ที่ตั้งตนขึ้นเองจำนวนมาก มุ่งหน้าสู่ชายแดนเพื่อต่อสู้กับพวกนอกรีต,"
 fp3_yearly.8000.desc_unislamic_opening: "[raging_ghazi.GetFirstName] เป็น #italic ผู้ชนะแห่ง [ROOT.Char.GetFaith.WarGodName]#! ที่ตั้งตนขึ้นเอง มุ่งหน้าสู่ชายแดนเพื่อต่อสู้กับพวกอนารยชน,"
 fp3_yearly.8000_dancing_girl.desc: "เมื่อ [raging_ghazi.GetSheHe] บังเอิญไปดื่มสุราอย่างหนักในเมือง [murder_barony.GetNameNoTier] ที่นั่น ในสภาพเมามายอย่างหนัก [raging_ghazi.GetSheHe] เกิดทะเลาะวิวาทและทุบตีเจ้าของโรงเตี๊ยมและนางระบำคนหนึ่ง รวมถึงลิงสัตว์เลี้ยงของนางจนตาย\n\n"
 fp3_yearly.8000_bath_inspector.desc: "เมื่อ [raging_ghazi.GetSheHe] บังเอิญไปเที่ยวเตร่กับเหล่านางบำเรอและคนพาลในเมือง [murder_barony.GetNameNoTier] ในกลุ่มสหายผู้เสื่อมเสียชื่อเสียงนั้น [raging_ghazi.GetSheHe] เกิดทะเลาะวิวาทกับทหารยามและผู้ตรวจโรงอาบน้ำคนหนึ่ง และแทงทั้งคู่จนตาย\n\n"
 fp3_yearly.8000_townsfolk.desc: "เมื่อ [raging_ghazi.GetSheHe] บังเอิญถูกหลอกและปล้นโดยนักต้มตุ๋นเจ้าเล่ห์บางคนในเมือง [murder_barony.GetNameNoTier] [raging_ghazi.GetSheHe|U] ระบายความโกรธ [raging_ghazi.GetHerHis] ในตลาดท้องถิ่น ทุบตีคนขายชาและลาจนตายอย่างขยันขันแข็งด้วยเก้าอี้นวมบุรองเท้า\n\n"
 fp3_yearly.8000.desc: ""[raging_ghazi.GetWomanMan] ผู้นี้ต้องถูกลงโทษอย่างรุนแรง" [righteous_marshal.GetFirstName] [righteous_marshal.GetCouncilTitle] ผู้เที่ยงธรรมของข้ากล่าว "เพื่อเอาใจชาวเมืองผู้ดีแห่ง [murder_barony.GetNameNoTierNoTooltip]"\n\n"ไม่นะ" [raging_ghazi.GetFirstNameNoTooltip] อ้อนวอน ขณะถูกล่ามโซ่แขวนอยู่ในคุกใต้ดินของข้า "ท่านต้องอนุญาตให้ข้าไปยังชายแดน เพราะนั่นคือพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]""
 fp3_yearly.8000.a: "ข้าเองก็เคยเดินบนเส้นทางศักดิ์สิทธิ์ - จงไปโดยสันติเถิด"
 fp3_yearly.8000.b: "ข้ามีห้องขังใหม่เอี่ยม เหมาะสำหรับเจ้า!"
 fp3_yearly.8000.c: "ข้าอาจใช้ประโยชน์จากคนที่มีความสามารถ เช่นเจ้าได้..."
 fp3_yearly.8000.flavor.a.tt: "ท่านอนุญาตให้ [raging_ghazi.GetFirstNameNoTooltip] ดำเนินการแสวงหาการพลีชีพ [raging_ghazi.GetHerHis] ต่อไป"
 fp3_yearly.8000.flavor.b.tt: "การกระทำนี้จะช่วยเอาใจชาวเมืองได้"

 #Frontier Fortress Benefactor, by Ola Jentzsch 
 fp3_yearly.8001.t: "ผู้อุปถัมภ์ป้อมปราการชายแดน"
 fp3_yearly.8001.desc: "[concerned_councillor.GetFirstName] [concerned_councillor.GetCouncilTitle] ผู้ระแวดระวังของข้า เริ่มกังวลเกี่ยวกับสถานะของแนวป้องกันชายแดนของเราในช่วงหลังนี้\n\n"ท่านต้องเสด็จเยือนป้อมปราการใน [frontier_fort_county.GetName] โดยทันที [ROOT.Char.Custom('FormOfAddressForLiege')] มันจะช่วยเพิ่มขวัญกำลังใจให้ทหารของท่านอย่างมาก ซึ่ง มิฉะนั้นแล้วพวกเขาจะรู้สึกห่อเหี่ยวสิ้นหวัง"\n\n[concerned_councillor.GetSheHe|U] หยุดชั่วครู่ "แต่ข้าควรเรียนให้ทราบว่า มีข่าวลือที่ไร้มูลความจริงโดยสิ้นเชิง เกี่ยวกับการระบาดของโรคเล็กน้อย...""
 fp3_yearly.8001.a: "ดีมาก ข้าจะไปเอง"
 fp3_yearly.8001.b: "[dutiful_spouse.GetFirstName] [dutiful_spouse.GetWifeHusband] ของข้าต้องการงานเพิ่ม [dutiful_spouse.GetSheHe] ไปแทนได้"
 fp3_yearly.8001.c: "ข้าจะออกเดินทาง...ในอีกสองสามวัน..."
 fp3_yearly.8001.d: "ชายแดนมีไว้สำหรับทหารและผู้ตั้งถิ่นฐาน ไม่ใช่สำหรับข้า"
 convincing_councillor_toast.success: "[concerned_councillor.GetFirstName] เชื่อใจท่าน"
 convincing_councillor_toast.failure: "[concerned_councillor.GetFirstName] คิดว่าท่านเห็น [concerned_councillor.GetHerHim] เป็นคนโง่"
 delegated_fortress_inspection_toast.success: "[dutiful_spouse.GetFirstName] สร้างความประทับใจที่ดีให้กับเหล่าทหาร"
 delegated_fortress_inspection_toast.failure: "[dutiful_spouse.GetFirstName] ล้มเหลวในการให้กำลังใจเหล่าทหาร"
 fp3_yearly.8001.flavor.b.tt: "[concerned_councillor.GetFirstNameNoTooltip] ไม่เห็นด้วยกับการให้ [dutiful_spouse.GetWomenMen] รับบทบาททางการทหาร"
 fp3_yearly.8001.flavor.c.tt: "ท่านไม่ได้ตั้งใจจะไปจริงๆ"

 #Faith at the Frontier, by Ola Jentzsch 
 fp3_yearly.8002.t: "ศรัทธา ณ ชายแดน"
 fp3_yearly.8002.desc: "[concerned_person.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_person'))] ของข้า ได้ทราบข่าวที่น่ากังวลเกี่ยวกับทหารที่ประจำการป้อมใน [frontier_fort_county.GetName]\n\n"พวกเขาได้แอบเปลี่ยนไปนับถือลัทธินอกรีตอันชั่วร้าย [regional_heresy.GetName]" [concerned_person.GetSheHe] บอกข้าด้วยน้ำเสียงสั่นเครือ "แม้ข้าจะไม่รู้ว่าใครคือผู้นำของพวกเขา แต่ข้าเกรงว่าหากไม่มีการดำเนินการใดๆ ในไม่ช้าพวกเขาอาจจับอาวุธที่ #italic ท่าน#! จ่ายเงินซื้อมา และพยายามโค่นล้มท่าน""
 fp3_yearly.8002.a: "ข้าจะเผาพวกมันให้หมดสิ้นและโรยเกลือบนผืนดิน"
 fp3_yearly.8002.b: "ท่านว่า [regional_heresy.GetNameNoTooltip] รึ? ฟังดูน่าสนใจ..."
 fp3_yearly.8002.c: "ในเมื่อท่านกังวลนัก #italic ท่าน#! ก็ไปเปลี่ยนให้พวกเขากลับมานับถือตามเดิมสิ"
 fp3_yearly.8002.d: "เราควรรอดูสถานการณ์ไปก่อน"
 dealing_with_soldier_heresy_toast.success: "[concerned_person.GetNameNoTooltip] นำพวกนอกรีตกลับสู่แนวทางที่ถูกต้องแล้ว"
 dealing_with_soldier_heresy_toast.failure: "[concerned_person.GetNameNoTooltip] ล้มเหลวในการโน้มน้าวเหล่าทหาร"
 fp3_county_pacified.tt: "พวกนอกรีตกระจัดกระจายไปแล้ว"
 fp3_county_converted.tt: "[concerned_person.GetNameNoTooltip] นำเหล่าทหารกลับสู่ศรัทธาที่แท้จริง"
 fp3_county_galvanized.tt: "พวกนอกรีตถูกปลุกระดม"
 frontier_heresy_eased: "ลัทธินอกรีตบรรเทาลง"
 frontier_heresy_mega_outbreak: "ลัทธินอกรีตแพร่กระจาย"

 #Exotic Espand, by Ola Jentzsch
 fp3_yearly.8003.t: "เอสปันด์อันแปลกตา"
 fp3_yearly.8003.desc: "[superstitious_consort.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))] ของข้า มีนิสัยชอบเผาเมล็ด #italic เอสปันด์#! เพื่อปัดเป่าพลังชั่วร้าย แต่บัดนี้ [superstitious_consort.GetSheHe] อ้างว่า [cruel_consort.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))] ของข้า ได้สาปแช่ง [superstitious_consort.GetHerHim] ด้วยเนตรปีศาจ และขโมยเสบียงเอสปันด์ของ [superstitious_consort.GetHerHis] ไป [cruel_consort.GetFirstNameNoTooltip] แน่นอนว่า ปฏิเสธความรู้เห็นในเรื่องนี้ทั้งสิ้น แต่ [superstitious_consort.GetFirstNameNoTooltip] ดูเหมือนจะมุ่งมั่นอย่างเต็มที่กับการหาเอสปันด์ใหม่ เพื่อกำจัดคำสาปที่ว่านี้ออกจาก [superstitious_consort.GetHerselfHimself]\n\n"ได้โปรดเถิด [ROOT.Char.Custom('FormOfAddressForLiege')]" [superstitious_consort.GetSheHe] อ้อนวอน "นักปราชญ์เมไจบอกข้าเกี่ยวกับภูเขาศักดิ์สิทธิ์ใน [espad_mountain_province.GetName] ที่นั่นเท่านั้นที่ดอกเอสปันด์ที่ดีที่สุดจะเบ่งบาน ท่านต้องส่งคนไปนำมันมาให้ข้า""
 fp3_yearly.8003.a: "จงศรัทธาใน [ROOT.Char.GetFaith.HighGodNameAlternate] เถิด อย่าเชื่อในเรื่องงมงายไร้สาระเลย"
 fp3_yearly.8003.b: "ข้าจะส่งหน่วยสอดแนมที่ดีที่สุดเท่าที่ทองคำจะซื้อได้ไป"
 fp3_yearly.8003.c: "ข้าจะส่ง [quest_chaplain.GetFirstName] [quest_chaplain.GetCouncilTitle] ของข้าไปนำมันมาให้ท่าน"
 fp3_yearly.8003.d: "ท่านเก็บเอสปันด์ธรรมดาเหมือนคนอื่นไม่ได้หรือ?"
 questing_for_espand_toast.success: "[quest_chaplain.GetFirstName] กลับมาพร้อมกับเมล็ดเอสปันด์ที่ดีที่สุด"
 questing_for_espand_toast.failure: "[quest_chaplain.GetFirstName] กลับมามือเปล่า"
 fp3_espand_found.tt: "[quest_chaplain.GetFirstNameNoTooltip] พบสมุนไพรเอสปันด์ศักดิ์สิทธิ์"
 fp3_espand_unfound.tt: "[quest_chaplain.GetFirstNameNoTooltip] ล้มเหลวในภารกิจของ [quest_chaplain.GetHerHis]"
 fp3_closer_to_love.tt: "ท่านและ [superstitious_consort.GetFirstNameNoTooltip] สนิทสนมกันมากขึ้น"

####The Frontiers' Call, by Ola Jentzsch####
 fp3_yearly.8004.t: "ชายแดนกวักเรียก"
 fp3_yearly.8004.desc: "สำหรับบางคนที่อาศัยอยู่ในนครอันรุ่งเรืองของดินแดนนี้ เสียงลมโหยหวนแห่งทุ่งหญ้าสเตปป์ทางตอนเหนือยังคงก้องกังวานอยู่ในใจ ไม่ว่าจะดีหรือร้าย [fp3_child_to_leave.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] ของข้า ก็เริ่มรู้สึกถึงเสียงเรียกนี้แล้ว\n\n"ท่าน [parent.GetMotherFather|U] ท่านต้องปล่อยข้าไป ข้าต้องการฝึกฝนสติปัญญาและดาบของข้า ณ ชายแดนอันป่าเถื่อน เดินทางไปกับกองคาราวานและชาวเขา และบางทีอาจค้นพบภูเขา #italic ฮารา เบเรไซติ#! ในตำนานก็เป็นได้"\n\nแต่ [worried_relation.GetFirstName] รัก [fp3_child_to_leave.GetFirstNameNoTooltip] อย่างสุดซึ้ง และกำลังอ้อนวอนให้ข้าปฏิเสธคำขอของ [fp3_child_to_leave.GetHerHis]"
 fp3_yearly.8004.a: "ชักดาบออกมา เจ้าลูกนกไร้หัวนอนปลายเท้า!"
 fp3_yearly.8004.b: "เจ้าจะไม่อยู่ต่อ เพื่อเห็นแก่ [worried_relation.GetFirstNamePossessiveNoTooltip] หรือ?"
 fp3_yearly.8004.c: "หากเจ้าจากไป เจ้าก็ไม่ใช่ [fp3_child_to_leave.Custom('GetDaughterSon')] ของข้าอีกต่อไป"
 fp3_yearly.8004.d: "ข้าเองก็เคยรู้สึกถึงเสียงเรียกนั้น เจ้าควรไปเถิด [fp3_child_to_leave.Custom('GetDaughterSon')] ของข้า"
 fp3_yearly.8004.c.flavor: "ท่านจะตัด [fp3_child_to_leave.GetFirstNameNoTooltip] ออกจากกองมรดกหาก [fp3_child_to_leave.GetSheHe] จากไป"
 fp3_yearly.8004.a.tt: "#V ประลองยุทธ์#! กับ [fp3_child_to_leave.GetFirstName] เพื่อให้ [fp3_child_to_leave.GetHerHim] อยู่ต่อ!\n#weak การประลองนี้ #bold ไม่ใช่#! การต่อสู้ถึงตาย#!\nหากท่านชนะ ท่านจะได้รับ [prestige_i] [prestige|E]\n\n[prowess|E] ของท่าน: [prowess_i]#V [parent.GetProwess]#!\n[prowess|E] ของ [fp3_child_to_leave.GetFirstNamePossessive]: [prowess_i]#V [fp3_child_to_leave.GetProwess]#!"
 fp3_yearly.8004.b.success: "[fp3_child_to_leave.GetFirstNameNoTooltip] ล้มเลิกความฝันในการผจญภัยของ [fp3_child_to_leave.GetHerHis]"
 fp3_yearly.8004.b.failure: "[fp3_child_to_leave.GetFirstNameNoTooltip] ยังคงมุ่งมั่นที่จะจากไป"
 fp3_yearly.8007.t: "การเลี้ยงดูแบบ [ROOT.Char.GetCulture.GetName]"
 fp3_yearly.8007.desc: ""ข้ายอมแล้ว! ข้ายอมแล้ว ท่าน [parent.GetMotherFather]! พอแล้ว!" [fp3_child_to_leave.Custom('GetDaughterSon')] ของข้าถอยกลับไป\n\n"หากนี่คือสิ่งที่ท่านต้องการให้ข้าอยู่ต่อมากเพียงนี้ ข้าก็จะทำ ข้าจะเป็น [fp3_child_to_leave.Custom('GetDaughterSon')] ที่เชื่อฟังตามที่ท่านต้องการ [ROOT.Char.GetFaith.HighGodNameAlternate] จะตัดสินท่านในท้ายที่สุด""
 fp3_yearly.8007.a: "ข้าจะไม่ ทำให้ผิดหวัง"
 fp3_yearly.8007.b: "ดี ข้ามีหน้าที่รับผิดชอบที่ #italic แท้จริง#! สำหรับเจ้า"
 fp3_yearly.8007.c: "และบัดนี้เจ้าต้อง แต่งงาน!"
 fp3_yearly.8008.t: "ความพ่ายแพ้อันน่าอดสู"
 fp3_yearly.8008.desc: "ข้าโซซัดโซเซถอยหลัง เลือดอาบและเหนื่อยล้า ขณะที่ [fp3_child_to_leave.GetFirstNameNoTooltip] เข้ามาหาข้าพร้อมอาวุธในมือ\n\n"ข้าบอกท่านแล้ว ท่าน [parent.GetMotherFather] ข้า #italic จะ#! ไป ข้าจะเดินทางไปยังชายแดนตามที่ใจปรารถนา ไปไกลตามเส้นทางสายไหม และ #italic ท่าน#! จะต้องจ่ายค่าเดินทางให้ข้า"\n\nข้าทำได้เพียงเฝ้ามอง [fp3_child_to_leave.Custom('GetDaughterSon')] ของข้าจากไปอย่างทรนง พร้อมกับถุงเหรียญทองคำกุษาณะและซาซาเนียนจากคลังของข้า"
 fp3_yearly.8008.a: "[fp3_child_to_leave.Custom('GetDaughterSon')] ของข้า ข้าเสียไปได้ แต่ทองคำของข้าด้วยรึ?"
 fp3_yearly.8008.b: "เป็นขันทีเสียยังดีกว่า..."
 fp3_yearly.8008.c: "โชคชะตาจะนำเจ้ากลับมาหาข้า เจ้าคอยดู..."

 fp3_yearly.8009.t: "ข้อกังวลของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_yearly.8009.desc_beginning: "ชายแดนตะวันออกเป็นที่หลบภัยของพวกนอกรีตและนิกายประหลาดมานานแล้ว ถึงกระนั้น ใน [caliphal_location.GetName] [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] ก็มีความกังวลเกี่ยวกับเรื่องนี้มากขึ้นเรื่อยๆ\n\n"เราได้ยินเรื่องเกี่ยวกับ [very_heretic_county.GetCountyData.GetFaith.GetAdherentNamePlural] ใน [very_heretic_county.GetName] ผู้ประกอบพิธีกรรมอันแปลกประหลาด" ทูต [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip] [hof_emissary.GetName] หยุดชั่วครู่ ราวกับกำลังรวบรวมความกล้า ก่อนที่ [hof_emissary.GetSheHe] จะกล่าวต่อด้วยน้ำเสียงต่ำและตกตะลึง "บางคนถึงกับพูดถึงพิธีกรรมที่มีลักษณะ #italic ทางกามารมณ์#! พอที พอแล้ว"
 fp3_yearly.8009.desc_muslim_or_jewish_insult_ending: "[righteous_caliph.GetTitleTierName] ต้องการให้ท่านจัดการกับพวกนอกรีตเหล่านี้""
 fp3_yearly.8009.desc_other_insult_ending: "[righteous_caliph.GetTitleTierName] ต้องการให้ท่านจัดการกับพวกดูหมิ่นศาสนาที่ไม่ชำระล้างเหล่านี้""
 fp3_yearly.8009.qurans.flavor: "ท่านสนับสนุนการคัดลอก [righteous_caliph.GetFaith.ReligiousText] ในภาษา [righteous_caliph.GetCulture.GetLanguage.GetNameNoTooltip]"
 fp3_yearly.8009.a: "ข้าจะ ทำให้พวกมันเป็นเยี่ยงอย่าง"
 fp3_yearly.8009.b: "คัมภีร์ในภาษาที่เหมาะสมจะชี้ทางให้พวกเขา"
 fp3_yearly.8009.c: "[loyal_chaplain.GetFirstNameNoTooltip] [loyal_chaplain.GetCouncilTitle] ของข้า จะไปเทศนาสั่งสอนพวกเขา"
 fp3_yearly.8009.d: "อนิจจา ข้ามีเรื่องเร่งด่วนกว่าที่ต้องกังวล"
 cultural_acceptance_gain_arabic_books: "ผลิตหนังสือภาษาอาหรับ"
 dealing_with_frontier_heresy_toast.success: "ภารกิจของ [loyal_chaplain.GetTitledFirstNameNoTooltip] ประสบความสำเร็จบ้าง"
 dealing_with_frontier_heresy_toast.failure: "[concerned_person.GetTitledFirstNameNoTooltip] ล้มเหลวในการโน้มน้าวผู้ใด"
 fp3_county_listened.tt: "ชาวบ้านบางส่วนถูกนำกลับสู่ศรัทธาที่แท้จริง"
 fp3_county_unfazed.tt: "ชาวบ้านยังคงไม่สะทกสะท้าน"
 fp3_gross_persecutions_toast: "พวกนอกรีตกระจัดกระจายไปแล้ว"
 fp3_galvanized_heretics_toast: "พวกนอกรีตถูกปลุกระดม"

 fp3_yearly.8010.t: "ถิ่นพำนักแห่งสงคราม"
 fp3_yearly.8010.desc_muslim: "เหล่านักปราชญ์แห่งเมโสโปเตเมียได้แบ่งโลกออกเป็นสามส่วน พวกเขากล่าวถึง #italic ดาร์ อัล-เตาฮีด#! แห่งผู้ศรัทธา และ #italic ดาร์ อัล-อะฮัด#! แห่งพันธมิตรของเรา แต่ก็ยังมี #italic ดาร์ อัล-ฮัรบ์#! คือชายแดน ถิ่นพำนักแห่งสงคราม [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] เชื่อมั่นในโลกทัศน์นี้อย่างยิ่ง และกังวลเกี่ยวกับภัยคุกคามจากตะวันออกอยู่เสมอ\n\n"เป็นหน้าที่ของท่านในฐานะ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ที่จะนำชายแดนของพวกนอกรีตมาอยู่ภายใต้การดูแลของเรา" [righteous_caliph.GetSheHe] บอกข้า "เราอดทนต่อการปฏิบัติบูชารูปเคารพของ [pagan_ruler.GetTitledFirstName] มานานเกินไปแล้ว ข้าจะส่งกองทหาร #italic กาซี#! ผู้ภักดีและทหารรับจ้างชาวเติร์กไปให้ท่าน เพื่อที่ท่านจะได้ปลดปล่อย [pagan_county.GetNameNoTier] จากการปกครองของ [pagan_ruler.GetHerHis]""
 fp3_yearly.8010.desc_not_muslim: "[righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] เชื่อมั่นอย่างยิ่งในมุมมองที่ว่าโลกคือการต่อสู้อันไม่สิ้นสุดระหว่างอารยธรรมและความป่าเถื่อน และกังวลอยู่เสมอเกี่ยวกับศัตรูผู้ไร้ศรัทธาที่ซุ่มซ่อนและวางแผนอยู่ในดินแดนตะวันออกอันไร้การควบคุม\n\n"เป็นหน้าที่ของท่านในฐานะ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]" [righteous_caliph.GetSheHe] บอกข้า "ที่จะนำชายแดนของพวกนอกรีตมาอยู่ภายใต้การดูแลของเรา เราอดทนต่อการปฏิบัติบูชารูปเคารพของ [pagan_ruler.GetTitledFirstName] มานานเกินไปแล้ว ข้าจะส่งกองทหาร #italic กาซี#! ผู้ภักดีและทหารรับจ้างชาวเติร์กไปให้ท่าน เพื่อที่ท่านจะได้ปลดปล่อย [pagan_county.GetNameNoTier] จากการปกครองของ [pagan_ruler.GetHerHis]""
 fp3_yearly.8010.a: "ข้าจะโจมตี [pagan_ruler.GetHerHim] โดยไม่ชักช้า!"
 fp3_yearly.8010_warmonger.tt: "ท่านถูกคาดหวังให้ยึดครอง [pagan_county.GetNameNoTier] ภายใน #bold ห้าปี#!."
 fp3_yearly.8010.b: "ช่วยข้าจัดหาทุนสำหรับสงครามนี้ แล้วข้าจะเริ่มมัน"
 fp3_yearly.8010.c: "ท่านต้องเข้าใจเถิด [righteous_caliph.GetTitleTierName] ผู้ยิ่งใหญ่ ว่าเวลายังไม่เหมาะสม"
 fp3_yearly.8010.d: "ท่านไม่มีอำนาจเหนือดินแดนของข้า"
 convincing_the_caliph_toast.success: "ท่านโน้มน้าวให้ [righteous_caliph.GetTitleTierName] พิจารณาใหม่ได้สำเร็จ"
 convincing_the_caliph_toast.failure: "ข้อโต้แย้งของท่านไม่สามารถโน้มน้าวผู้ใดได้"
 fp3_caliph_convinced.tt: "[righteous_caliph.GetTitleTierName] จะหลีกเลี่ยงสงครามไปก่อนในตอนนี้"
 fp3_caliph_unconvinced.tt: "[righteous_caliph.GetTitleTierName] โกรธเคืองในความอ่อนแอของท่าน"
 fp3_caliph_dead.title: "คำปฏิญาณเป็นโมฆะ"
 fp3_caliph_dead.desc: "ประมุขแห่งศรัทธาคนก่อนของท่านไม่อยู่แล้ว และคำปฏิญาณในการพิชิตที่ท่านได้ให้ไว้ได้กลายเป็นโมฆะ"

 fp3_yearly.8012.t: "คำสัญญาที่บรรลุผล"
 fp3_yearly.8012.desc: ""ดูเหมือนว่า" [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] ประกาศ "ท่านมิได้ล่าช้าในการปฏิบัติตามคำปฏิญาณที่จะพิชิต [pagan_county.GetNameNoTier] ในนามแห่งศรัทธาของเรา ท่านได้พิสูจน์ตนเองแล้วว่าเป็นผู้ปกครองที่น่าเชื่อถือและเป็น [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ผู้ศรัทธาอย่างแท้จริง และเราจะไม่มีวันลืมเลือนเรื่องนี้ในเร็ววัน""
 fp3_yearly.8012.a: "ข้าเพียงทำในสิ่งที่ [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] ทุกคนพึงกระทำ"
 become_faith_warrior.toast: "ท่านได้กลายเป็นผู้ชนะแห่ง [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]"

 fp3_yearly.8013.t: "ความผิดหวังของ [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetAdjectiveNoTooltip]"
 fp3_yearly.8013.desc: ""ห้าปีก่อน" [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] ประกาศ "ท่านได้สัญญากับเราว่าจะปลดปล่อย [pagan_county.GetNameNoTier] จากพวกนอกรีต แล้วเหตุใดเล่า เรื่องนี้จึงยังไม่เกิดขึ้น?""
 fp3_yearly.8013.a: "ข้าขออภัย สถานการณ์ไม่อำนวยแก่ข้า"
 fp3_yearly.8013.b: "ข้าไม่ยอมรับท่าน และไม่ยอมรับคำปฏิญาณใดๆ ที่ได้ให้ไว้"
 
 fp3_yearly.8014.t: "ความลับแห่งกาน้ำชา"
 fp3_yearly.8014.desc: "ข้าพยายามอย่างยิ่งที่จะประนีประนอมความรักในเครื่องดื่มมึนเมากับมุมมองอันเคร่งครัดของ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ในเรื่องดังกล่าวมานานแล้ว โชคดีที่ [smart_courtier.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('smart_courtier'))] ของข้า ได้คิดหาวิธีแก้ปัญหาขึ้นมา\n\n"ข้าได้เรียนรู้จาก [ROOT.Char.Custom('LevyMenWomen')] เฒ่าในโอสรูชานา" [smart_courtier.GetSheHe] กล่าว "ผู้ ซึ่งต้องการสุราจำนวนหนึ่งเพื่อรับมือกับสภาพอากาศหนาวเย็น และเพื่อความเพลิดเพลินโดยทั่วไปด้วย แน่นอน พวกเขามีนิสัยชอบเทเครื่องดื่มลงในหม้อทองแดง เพื่อให้ผู้สังเกตการณ์ที่เคร่งศาสนาเกินไปจะเข้าใจผิดว่าพวกเขากำลังดื่มชา ไม่ใช่ไวน์ ข้าเองก็ทำ เช่นนี้มาสักพักแล้ว และมันก็สะดวกสบายทีเดียว""
 fp3_yearly.8014.a: "ช่างเป็นความคิดที่ดี!"
 fp3_yearly.8014.b: "[ROOT.Char.Custom('LevyMenWomen')|U] อาจไม่ตัดสินข้า แต่ [ROOT.Char.GetFaith.HighGodNameAlternate] จะทรงตัดสิน"
 fp3_yearly.8014.c: "ข้าจะไม่ทำ เช่นนี้ และ #italic เจ้าก็ห้ามทำด้วย#!."
 f3_yearly.8014_forbidding_teapot_alcohol_flavor: "ท่านบังคับให้ [smart_courtier.GetNameNoTooltip] หยุดซ่อนเร้นบาปของ [smart_courtier.GetHerHis]"

 #Forgotten Runestones, by Ola Jentzsch 
 fp3_yearly.8016.t: "ศิลาที่ถูกลืม"
 fp3_yearly.8016.desc: "[hyrcanian_vassal.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hyrcanian_vassal'))] ของข้า ได้เชิญข้าไปชมศิลาสลักประหลาดสามแท่ง ลึกเข้าไปในป่าเฮอร์เคเนียในเขตปกครองของเขา\n\n"พวกมันต้องถูกสร้างขึ้นโดยคณะสำรวจที่สาบสูญของพวก #italic รุสซียะห์#! ป่าเถื่อนเป็นแน่" [hyrcanian_vassal.GetSheHe] บอกข้า "บัดนี้ ชาวป่าท้องถิ่นเกิดชอบศิลาเหล่านี้ขึ้นมา และเชื่อว่าผู้สร้างที่ไม่รู้จักของพวกมันจะลงมาจากทะเลแคสเปียนเพื่อแก้แค้นอย่างรวดเร็วและนองเลือดหากศิลาถูกทำลาย แต่ข้าไม่เชื่อเรื่องเล่า เช่นนั้น แม้ข้าจะอ่านอักษรบนศิลาเหล่านี้ไม่ออก แต่พวกมันเป็นเทวรูปนอกรีตอย่างแน่นอน และต้องถูกทุบให้เป็นชิ้นๆ ใช่หรือไม่ขอรับ เจ้าเหนือหัวของข้า?""
 fp3_yearly.8016.a: "ส่งค้อนปอนด์มาให้ข้า!"
 fp3_yearly.8016.b: "ไม่ เราจะรับฟังชาวป่า"
 fp3_yearly.8016.c: "ข้าจะให้ย้ายพวกมันออกไป และตั้งขึ้นใหม่นอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า..."
 fp3_hyrcanian_vassal_convinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] ยอมรับทางแก้นี้"
 fp3_hyrcanian_vassal_unconvinced.tt: "[hyrcanian_vassal.GetFirstNameNoTooltip] สงสัยว่าเหตุใดท่านจึงทำ เช่นนั้น"
 convincing_the_hyrcanian_vassal_toast.success: "[hyrcanian_vassal.GetTitledFirstName] ยอมรับข้อเสนอของท่าน"
 convincing_the_hyrcanian_vassal_toast.failure: "[hyrcanian_vassal.GetTitledFirstName] เฝ้ามองอย่างเงียบขรึมขณะที่ศิลาถูกลากออกไป"

 #Hyrcanian Havoc, by Ola Jentzsch 
 fp3_yearly.8017.t: "หายนะแห่งเฮอร์เคเนีย"
 fp3_yearly.8017.desc: "หายนะเกิดขึ้นแล้ว! นักรบ #italic รุส#! ที่โกรธแค้นบุกโจมตี [runestone_county.GetNameNoTier] เหมือนนกแร้งลงซากศพ สังหารทุกคนที่ขวางหน้า [hyrcanian_vassal.GetTitledFirstName] [hyrcanian_vassal.GetHerselfHimself] ถูกฟันด้วยขวานและอยู่ในอาการสาหัส บาดเจ็บสาหัส แต่ทันทีที่พวกเขามาถึง นักปล้นก็กลับไปที่เรือของพวกเขา และหายไปในหมอกยามเช้าบนทะเลแคสเปียน\n\nมีข่าวลือแพร่สะพัดในหมู่ผู้รอดชีวิตว่าผู้โจมตีอาจกำลังหาทางแก้แค้น [hyrcanian_vassal.GetFirstNameNoTooltip] สำหรับการทำลายศิลาจารึกของชาวรุสเมื่อหลายปีก่อน..."
 fp3_yearly.8017.a: "[ROOT.Char.GetFaith.HighGodNameAlternate] พวกข้าทำสิ่งใดให้พระองค์พิโรธหรือ?"
 fp3_yearly.8017.b: "ข้าจะส่งทองคำไปบ้าง ไม่ว่ามันจะช่วยอะไรได้หรือไม่ก็ตาม"
 fp3_yearly.8017.c: "นี่เป็นลางร้าย...ข้าควรนำศิลากลับคืนสู่ [runestone_county.GetNameNoTierNoTooltip]"

 #A Heavenly Horse, by Ola Jentzsch 
 fp3_yearly.8018.t: "อาชาสวรรค์"
 fp3_yearly.8018.desc_eunuch: "ขณะที่ข้ากำลังฝึกซ้อมกับ [ROOT.Char.Custom('WarhorseStoryName')] นักเดินทางจากแดนไกลก็เข้ามาหาข้า เขาโค้งคำนับด้วยท่าทางอันนุ่มนวล วัดได้อย่างระมัดระวัง บ่งบอกถึงอาชีพการงานอันยาวนานในราชสำนักที่วิจิตรงดงาม\n\n"ข้ารับใช้สตรีผู้ยิ่งใหญ่ท่านหนึ่ง" เขากล่าว "ในประเทศจีน ซึ่งอยู่เลยเทือกเขาอันยิ่งใหญ่นี้ไป นายหญิงของข้าเป็นผู้เล่น #italic ชอฟกัน#! ตัวยง แต่ก็มักจะโอ้อวด และนางได้บอกสหายของนางว่าในเกมหน้า นางจะขี่ม้าที่ยอดเยี่ยมที่สุดใต้หล้า ผู้คนของข้าต่างทะนุถนอม #italic ม้าสวรรค์#! แห่งดินแดนของท่านมาเนิ่นนาน และดูเหมือนว่า [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านจะได้ครอบครองตัวที่ยิ่งใหญ่ที่สุดในหมู่พวกมัน แต่ข้าก็บังเอิญทราบมาว่าท่านกำลังประสบปัญหา #italic ทางการเงิน#! อยู่บ้าง..."\n\n"แล้วท่านว่าอย่างไร ข้าขอซื้อ [ROOT.Char.Custom('HorseStoryMareStallion')] อันวิจิตรนี้ได้หรือไม่?""
 fp3_yearly.8018.desc_grand_old_lady: "ขณะที่ข้ากำลังฝึกซ้อมกับ [ROOT.Char.Custom('WarhorseStoryName')] สตรีสูงศักดิ์ในอาภรณ์แปลกตาผู้หนึ่งเข้ามาหาข้าพร้อมผู้ติดตาม\n\n"ข้ามา" นางบอกข้า "จากราชสำนักอันยิ่งใหญ่แห่งเมืองจีน ระยะหลังนี้ข้าสนใจใน #italic chovgan#! กีฬาขี่ม้า ซึ่งเป็นที่นิยมแม้ในอาณาจักรเล็กๆ ของท่าน แต่สำหรับการแข่งขันครั้งหน้า ข้าได้ปฏิญาณว่าจะขี่ #italic heavenly horse#! อาชาเหงื่อโลหิตจากเฟอร์กานาที่ผู้คนของข้าให้ค่าสูงส่งยิ่งกว่ายาอายุวัฒนะเสียอีก บัดนี้ ข้าได้ทราบมาว่าท่าน [ROOT.Char.GetLadyLord] ผู้น้อยแห่งดินแดนแถบนี้ มี [ROOT.Char.Custom('HorseStoryMareStallion')] ที่ดีเลิศกว่าตัวใดๆ ข้ายังทราบมาอีกว่าท่านกำลังเป็นหนี้..."\n\nนางยื่นถุงทองคำหนักอึ้งให้ท่าน และเจตนาของนางก็ชัดเจนยิ่งนัก"
 fp3_yearly.8018.a: "ตกลง ข้าจะขายม้าของข้าให้ท่าน"
 fp3_yearly.8018.b: "ข้าไม่มีวันพรากจาก [ROOT.Char.Custom('WarhorseStoryName')]"
 fp3_yearly.8018.c: "ไปให้พ้นสายตาข้า เจ้าหญิงแก่ไร้ม้า!"



 ##################################################
 #THE FRONTIER STORY CYCLE 
 ##################################################

 fp3_yearly.8888.t: "ความคับข้องใจเรื่องทุ่งหญ้า"
 fp3_yearly.8888.desc: "[upset_vassal.GetName] มาหาข้า มีท่าทีไม่พอใจอย่างเห็นได้ชัด\n\n"เจ้าเหนือหัวของข้า" [upset_vassal.GetSheHe] ประกาศ "ชนเผ่า [turkic_leader.GetCulture.GetName] ที่นำโดย [turkic_leader.GetName] ได้ขโมยทุ่งหญ้าทั้งหมดใน [nomads_county.GetNameNoTier] และโดยทั่วไปแล้วสร้างปัญหาให้กับผู้คนดีๆ ที่ตั้งรกรากอยู่ ข้าได้พยายามส่งนักรบ #italic กาซี#! ไปขับไล่พวกเขา แต่พวกเขาก็แค่ล่าถอยและซ่อนตัวอยู่ในดินแดนรกร้างไร้ผู้คน เพียงเพื่อจะกลับมาอีกในหนึ่งเดือนต่อมา ท่านต้องช่วยข้าขับไล่พวกอนารยชนที่ไม่ชำระล้างเหล่านี้ออกไป - ให้สิ้นซาก"\n\n"ข้าจัดการพวกเขาได้" [possibly_capable_marshal.GetFirstName] [possibly_capable_marshal.GetCouncilTitle] ของข้ากล่าว "ส่งข้าไปที่ [nomads_county.GetNameNoTierNoTooltip] เถิด""
 fp3_yearly.8888.a: "ไม่ ข้าจะไปเจรจากับพวกเขาด้วยตนเอง"
 fp3_yearly.8888.b: "ดีมาก [possibly_capable_marshal.GetFirstNameNoTooltip] - นำกองทหารของเจ้าไปยัง [nomads_county.GetNameNoTierNoTooltip]"
 fp3_yearly.8888.c: "[upset_vassal.GetTitledFirstNameNoTooltip] นี่เป็นเรื่องระหว่างท่านกับ [turkic_leader.GetFirstNameNoTooltip]"
 fp3_fighting_turks.success.tt: "[possibly_capable_marshal.GetFirstName] จับผู้นำของพวกเร่ร่อนได้"
 fp3_fighting_turks.failure.tt: "พวกเขาหลบหลีกทหารของท่านได้"
 fp3_treating_with_turks.success.tt: "ชาว [turkic_leader.GetCulture.GetName] ตกลงที่จะเจรจา"
 fp3_treating_with_turks.failure.tt: "ท่านล้มเหลวในการโน้มน้าวพวกเขา"
 fp3_treating_with_turks_toast.failure: "พวกเร่ร่อนปฏิเสธที่จะเจรจากับท่าน"
 fp3_fighting_turks_toast.failure: "[possibly_capable_marshal.GetTitledFirstName] ล้มเหลวในการปราบพวกเร่ร่อนที่ไม่เชื่อฟัง"

 fp3_yearly.8889.t: "หญ้าเพียงพอสำหรับทุกคน"
 fp3_yearly.8889.desc: "[turkic_leader.GetName] ต้อนรับข้าด้วยการต้อนรับขับสู้ทั้งหมดที่ยศของข้าพึงได้รับ เสนอชาและเนื้อม้าแห้ง และน้ำแร่สด แต่ [turkic_leader.GetSheHe] กล่าวถึง [upset_vassal.GetName] ด้วยความดูแคลน\n\n"[upset_vassal.GetTitledFirstNameNoTooltip] กำลังโกหก" ผู้นำเร่ร่อนบอกข้า "มีหญ้าเพียงพอสำหรับทุกคน ให้ผู้คนของข้าอยู่ใน [nomads_county.GetNameNoTierNoTooltip] เถิด แล้วเราจะให้ยืมคันธนูและดาบของเราแก่กองทัพของท่าน ข้าจะไปที่ราชสำนักของท่านด้วยซ้ำ และรับใช้ในฐานะ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] ของท่าน""
 fp3_yearly.8889.a: "ฟังดูสมเหตุสมผล"
 fp3_yearly.8889.b: "เจ้าอยู่ที่นี่ไม่ได้ แต่จงไปกินหญ้าใน [nomads_new_county.GetNameNoTierNoTooltip] แทน"
 fp3_yearly.8889.c: "อนิจจา ไม่สามารถมีข้อตกลง เช่นนั้นได้"

 fp3_yearly.8890.t: "ชะตากรรมของ [Select_CString(turkic_leader.IsFemale,'หัวหน้าเผ่าหญิง','หัวหน้าเผ่า')]"
 fp3_yearly.8890.desc_beginning: "เมื่อถูกลากมาต่อหน้าข้า หัวหน้าเผ่าเร่ร่อน [turkic_leader.GetName] ดูสิ้นหวังยิ่งนัก [turkic_leader.GetSheHe|U] มีพันธมิตรที่นี่น้อยมาก หากจะมีเลย\n\n"เราซุ่มโจมตีชาว [turkic_leader.GetCulture.GetName] ได้สำเร็จ" [possibly_capable_marshal.GetFirstName] อธิบาย "และจับกุม [turkic_leader.GetWomanMan] ผู้นี้พร้อมกับนักรบบางส่วนของ [turkic_leader.GetHerHis] ได้"\n\n"
 fp3_yearly.8890_brutal_demands: ""ตัดหัวพวกมันเสีย" [upset_vassal.GetName] ยืนกราน "เพราะพวกป่าเถื่อนเหล่านี้ได้สังหารราษฎรของข้าไปมากมาย"\n\n"
 fp3_yearly.8890_nonbrutal_demands: ""ให้พวกเขาสัญญาว่าจะออกจากดินแดนของข้าไปตลอดกาล" [upset_vassal.GetTitledFirstName] แนะนำ "จับ [turkic_leader.GetFirstNameNoTooltip] เป็นตัวประกันเพื่อรับประกันการปฏิบัติตามของพวกเขา"\n\n"
 fp3_yearly.8890.desc_ending: ""จริงทีเดียว" [turkic_leader.GetNameNoTooltip] กล่าว "ข้าไม่กลัวที่จะสังหารผู้ที่ถือหอกเข้ามาต่อสู้กับข้า แต่ดาบและคันธนูของข้า และของนักรบของข้า อาจอยู่ในบริการของท่านได้ [ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่ หากท่านปล่อยข้าไป""
 fp3_yearly.8890.a: "ดีมาก ให้ผู้คนของเจ้าตั้งรกรากใน [nomads_new_county.GetNameNoTierNoTooltip] - และรับใช้ข้า"
 fp3_yearly.8890.b: "ไม่ ชีวิตของเจ้าต้องถูกริบ"
 fp3_yearly.8890.c: "ข้าจะจับเจ้าเป็นตัวประกัน เพื่อ ทำให้เผ่าของเจ้าสงบลง"

 
 nomad_friction_gone.tt: "พวกเร่ร่อนสงบลงแล้ว"
 nomad_friction_active.tt: "พวกเร่ร่อนโกรธแค้น"

 fp3_frontier_story_cycle.0001_opening: "เจ้าเหนือหัวที่รักของข้า"
 fp3_frontier_story_cycle.0001_letter: "ข้าจะส่งเด็กกำพร้าผู้น่าสงสารสองคนไปให้ท่าน ซึ่งบิดามารดาของพวกเขาเสียชีวิตจากทุพภิกขภัยหลังจากฝูงชนชาว [turkic_leader.GetCulture.GetName] ปล่อยให้ม้าของพวกเขาเหยียบย่ำทุ่งนาและสวนผลไม้ ในเมื่อท่านมีใจเมตตาต่อพวกเร่ร่อนป่าเถื่อนนัก ข้าเชื่อว่าท่านคงรับผิดชอบต่อเหยื่อของพวกเขาได้ เช่นกัน ขอให้แสงแห่ง [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] ส่องสว่างเหนือรัชสมัยของท่าน"
 fp3_frontier_story_cycle.0001.a: "อะไรกัน..."
 children_arriving_shortly.tt: "เด็กๆ จะมาถึงในไม่ช้า"

 fp3_frontier_story_cycle.0002_opening: "[ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่"
 fp3_frontier_story_cycle.0002_letter: "ข้าเสียใจกับพฤติกรรมของข้าในระหว่างเรื่องราวเกี่ยวกับพวกเร่ร่อน พวกเขาได้ออกจาก [nomads_county.GetNameNoTier] ไปแล้วจริงๆ และข้าได้ยินว่าความขัดแย้งระหว่างพวกเขากับชาวนาได้บรรเทาลงแล้ว แม้ข้าจะยังคงยืนกรานว่าท่านควรให้ความสำคัญกับภัยคุกคามจากพวกเร่ร่อนอย่างจริงจัง ข้าขอมอบเหรียญทองคำอันงดงามเหล่านี้ ซึ่งผลิตขึ้นในจักรวรรดิกุษาณะเมื่อนานมาแล้ว ให้เป็นเครื่องหมายแสดงความเคารพของข้า"
 fp3_frontier_story_cycle.0002.a: "ของขวัญชั้นเลิศ ข้าให้อภัยทุกอย่าง"
 fp3_frontier_story_cycle.0002.b: "ข้าไม่ต้องการของกระจุกกระจิกของท่าน และข้าก็ไม่ยอมรับคำแก้ตัวของท่านด้วย"

 fp3_frontier_story_cycle.0003.t: "การชำระส่วนของตน"
 fp3_frontier_story_cycle.0003_beginning: "[greedy_chaplain.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('greedy_chaplain'))] ของข้า เห็นได้ชัดว่า ใช้เวลาครุ่นคิดอย่างมากเกี่ยวกับ [turkic_leader.GetName] และชนเผ่าเร่ร่อนของ [turkic_leader.GetHerHis]\n\n"จริงแท้ทีเดียว [ROOT.Char.Custom('FormOfAddressForLiege')]" [greedy_chaplain.GetFirstNameNoTooltip] กล่าว "พวกเขาอยู่ในคำอธิษฐานของข้า เพราะข้าได้เรียนรู้มาว่าพวกเข บางคนยังคงปฏิบัติตามความเชื่อนอกรีตอยู่"
 fp3_frontier_story_cycle.0003_jizya: "เราควรให้พวกเขาจ่ายภาษี #italic ญิซยะฮ์#! สำหรับสิทธิพิเศษในการรักษาแนวทางบูชารูปเคารพของพวกเขาไว้"\n\n"
 fp3_frontier_story_cycle.0003_not_jizya: "เราควรทำตามที่ชาวมุสลิมมักจะทำ และให้พวกเขาจ่ายภาษีเพิ่มเติม เพราะแน่นอนว่าท่านได้เมตตาต่อพวกเขามากพอแล้วมิใช่หรือ?"\n\n"
 fp3_frontier_story_cycle.0003_ending: ""นี่ไม่ยุติธรรม" [turkic_leader.GetFirstNameNoTooltip] คัดค้าน "ข้าได้อุทิศพลธนูม้าหนึ่งร้อยนายให้กับบริการของท่าน เช่นเดียวกับตัวข้าเอง หากท่านละเว้นการเก็บภาษีพวกเราในลักษณะนี้ ข้าสัญญาว่าจะไม่ลืมบุญคุณ""
 fp3_frontier_story_cycle.0003.a: "เราจะค้นหาทุกเหรียญที่เผ่าของเจ้าซ่อนไว้"
 fp3_frontier_story_cycle.0003.b: "ไม่ [greedy_chaplain.GetFirstNameNoTooltip] พูดถูก เจ้าต้องถูกเก็บภาษี"
 fp3_frontier_story_cycle.0003.c: "ดีมาก [turkic_leader.GetFirstNameNoTooltip] ฟังดูยุติธรรมดี"
 resentful_nomads.toast: "พวกเร่ร่อนไม่พอใจ"

 fp3_frontier_story_cycle.0004.t: "กำพร้า เพราะชาว [turkic_leader.GetCulture.GetNameNoTooltip]"
 fp3_frontier_story_cycle.0004.desc: "[orphan_girl.GetName] ดูน่าสังเวชอย่างแท้จริง เช่นเดียวกับน้องชายตัวน้อยของนาง [orphan_boy.GetName] ผู้ ซึ่งดูเหมือนจะประสบเคราะห์กรรมทุกรูปแบบ\n\n"ได้โปรดเถิด [ROOT.Char.GetTitleTierName] ของข้า" นางกล่าวด้วยน้ำเสียงสั่นเครือ "พวกเราไม่ได้กินอะไรมาหนึ่งสัปดาห์แล้ว ข้าขอเพียงขนมปังสักหน่อยได้หรือไม่? ไม่เป็นไรหากมันจะขึ้นรา ตราบใดที่ท่านพอจะแบ่งปันได้..."\n\nเมื่อสอบถามเพิ่มเติม ดูเหมือนนางจะไม่รู้แน่ชัดว่าใครคือผู้ที่ต้องรับผิดชอบต่อโชคร้ายของครอบครัวนาง "มีทหารม้ามาและขี่ม้าเหยียบย่ำพืชผลของเรา และขโมยแกะของเราไป... แล้วพวกเขาก็หายตัวไป บัดนี้ข้าไม่รู้ว่าจะเกิดอะไรขึ้นกับพวกเรา แต่ข้าเสียใจอย่างสุดซึ้งที่ [upset_vassal.GetTitledFirstName] รบกวนท่านด้วยเรื่องเล็กน้อย เช่นนี้""
 fp3_frontier_story_cycle.0004.a: "อย่ากังวลไปเลย ข้าจะรับพวกเจ้าไว้เอง"
 fp3_frontier_story_cycle.0004.b: "ดูเหมือนจะยุติธรรมดีที่เจ้าจะถูกรับเลี้ยงเข้าไปในเผ่าของ [turkic_leader.GetFirstNamePossessiveNoTooltip]"
 fp3_frontier_story_cycle.0004.c: "ข้าจะส่งพวกเจ้าไปยังอาราม"
 fp3_frontier_story_cycle.0004.d: "ข้าไม่รู้ว่า [upset_vassal.GetFirstNameNoTooltip] คาดหวังอะไร ไปหาสถานเลี้ยงเด็กกำพร้าเถิด"
 fp3_pay_for_upkeep_flavor: "ท่านจะต้องจ่ายค่าเลี้ยงดูพวกเขา"

 fp3_frontier_story_cycle.0005.t: "ทหารม้าสองร้อยนาย"
 fp3_frontier_story_cycle.0005.desc: "ขณะที่ข้าครุ่นคิดถึงกลยุทธ์และการรบ [turkic_leader.GetName] ก็มาถึงพร้อมกับทหารม้าหลายร้อยนายติดตามมา\n\n"[ROOT.Char.GetTitleTierName] ของข้า" [turkic_leader.GetSheHe] กล่าวพลางโค้งคำนับ "ข้าได้สัญญาว่าจะสนับสนุนท่าน เช่นเดียวกับชนเผ่าทั้งหมดของข้า บัดนี้ท่านอยู่ในภาวะสงคราม เราสามารถเสนอพลธนูม้าฝีมือดีเพิ่มอีกสองร้อยนาย แต่สามารถให้ยืมได้เฉพาะความขัดแย้งที่ดำเนินอยู่นี้เท่านั้น เมื่อสถานการณ์สงบลง พวกเขาจะกลับไปยังกระโจมและครอบครัวของตน สิ่งเดียวที่เราจะขอเป็นการตอบแทนคือขอให้ท่านอย่าลืมบุญคุณครั้งนี้""
 fp3_frontier_story_cycle.0005.a: "ข้าตกลงตามนั้นได้"
 fp3_frontier_story_cycle.0005.b: "ข้าเบื่อหน่ายกับการพูดเรื่องบุญคุณนี่เต็มทีแล้ว! "
 fp3_frontier_story_cycle.0005.c: "ไม่ล่ะ ขอบใจ ข้าจัดการได้โดยไม่มีพวกเขา"

 fp3_frontier_story_cycle.0006.t: "ลูกธนูหลง"
 fp3_frontier_story_cycle.0006_beginning: "[one_eyed_child.GetName] กำลังวิ่งเล่นสำรวจ [ROOT.Char.Custom('ResidenceBuilding')] อย่างที่ [one_eyed_child.GetSheHe] ชอบทำ เมื่อหายนะบังเกิด [turkic_leader.GetName] กำลังฝึกยิงธนูกับนักรบบางส่วนของ [turkic_leader.GetHerHis] และลูกธนูหลงดอกหนึ่งพุ่งเข้าใส่ตาของ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('one_eyed_child'))] ผู้ซุกซนของข้าพอดี"
 fp3_frontier_story_cycle.0006_has_court_physician: ""ข้าเชื่อว่า [one_eyed_child.GetSheHe|U] จะไม่เป็นไร" [scoped_physician.GetFirstName] แพทย์ของข้ากล่าว "แต่อนิจจา จะต้องดำเนินชีวิตต่อไปโดยมีตาน้อยลงหนึ่งข้าง ข้าขออนุญาตเตือนท่านด้วยความเคารพให้มีลูกธนูบินข้ามลานน้อยลงในอนาคตได้หรือไม่?"\n\n"
 fp3_frontier_story_cycle.0006_no_court_physician: "แพทย์ท้องถิ่นที่ถูกเรียกตัวมาอย่างเร่งด่วนได้ยืนยันว่า [one_eyed_child.GetSheHe] จะฟื้นตัว แต่ดวงตาข้างนั้นสูญเสียไปตลอดกาล\n\n"
 fp3_frontier_story_cycle.0006_ending: ""มันเป็นอุบัติเหตุ" [turkic_leader.GetFirstName] ร้องขอ "อย่ารีบร้อนลงโทษข้าเลย [ROOT.Char.Custom('FormOfAddressForLiege')] หากเราไม่ฝึกฝน แล้วเราจะปกป้องดินแดนของท่านได้อย่างไร?""
 fp3_frontier_story_cycle.0006.a: "เจ้าไปครุ่นคิดถึงทักษะการยิงธนูของเจ้า...ในคุกใต้ดินเถอะ"
 fp3_frontier_story_cycle.0006.b: "นับจากนี้ไป ห้ามยิงธนูบริเวณรอบ [ROOT.Char.Custom('ResidenceBuilding')]"
 fp3_frontier_story_cycle.0006.c: "ข้าเดาว่ามันเป็นพระประสงค์ของ [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]"


 fp3_frontier_story_cycle.0007.t: "หายนะกองคาราวาน"
 fp3_frontier_story_cycle.0007.desc: ""โอ้ [ROOT.Char.GetTitleTierName]" [warmonger_councillor.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmonger_councillor'))] ของข้า กล่าว "เหล่าพ่อค้าใน [bandits_county.GetName] พูดถึงการบุกปล้นโดยโจรบนหลังม้า บัดนี้กองคาราวานต้องอ้อมไปจากดินแดนนั้น ทำร้ายการค้าของเราบนเส้นทางสายไหม ข้าขอภาวนาให้ท่านส่งข้าไปสืบสวนเรื่องนี้"\n\n"ไม่" [turkic_leader.GetName] โพล่งขึ้นมาอย่างดุเดือด "ข้าสามารถส่งนักรบของข้าไปคุ้มครองเส้นทางคาราวานอย่างถาวรได้ - หากเราได้รับอนุญาตให้เลี้ยงม้าของเราใน [bandits_county.GetNameNoTierNoTooltip] นับจากนี้ไป แน่นอนว่านั่นย่อมเป็นแนวทางปฏิบัติที่ดีกว่ามิใช่หรือ?"\n\nแต่ [warmonger_councillor.GetFirstNameNoTooltip] คัดค้าน "พึงระวัง [ROOT.Char.Custom('FormOfAddressForLiege')] - เหล่าชาวนาชิงชังเมื่อท่านปล่อยให้พวกเร่ร่อนสัญจรไปมาอย่างอิสระ""
 fp3_frontier_story_cycle.0007.a: "ถึงกระนั้น แผนของ [turkic_leader.GetFirstNamePossessiveNoTooltip] ก็ดีกว่า"
 fp3_frontier_story_cycle.0007.b: "ยุติธรรมดี ข้าจะให้โอกาสเจ้าครั้งนี้"
 fp3_frontier_story_cycle.0007.c: "หากเรารอไป พ่อค้าก็จะกลับมาในที่สุด"
 fp3_investigating_attacks_successful: "[warmonger_councillor.GetFirstNameNoTooltip] หยุดยั้งการโจมตี และเรียนรู้จากมัน"
 fp3_investigating_attacks_dismal_failure: "[warmonger_councillor.GetFirstNameNoTooltip] กลับมาโดยไม่มีผลลัพธ์ใดๆ"
 fp3_investigating_attacks_toast_successful: "[bandits_county.GetNameNoTierNoTooltip] ปลอดภัยแล้ว"
 fp3_investigating_attacks_toast_dismal_failure: "โจรครองเมืองใน [bandits_county.GetNameNoTierNoTooltip]"
 attacks_abated.toast: "การโจมตีของโจรบรรเทาลงแล้ว"

 fp3_frontier_story_cycle.0099.t: "การมอบที่ดินศักดินาของ [turkic_leader.GetFirstNamePossessiveNoTooltip]"
 fp3_frontier_story_cycle.0099.desc: ""ข้ารับใช้ท่านอย่างภักดีมานานแล้ว เจ้าเหนือหัวของข้า และให้การสนับสนุนอย่างมากต่ออุดมการณ์ของท่าน ด้วยค่าใช้จ่ายส่วนตัวอย่างมหาศาล" [turkic_leader.GetName] ดูเหมือนว่า [turkic_leader.GetSheHe] กำลังรอคอย [turkic_leader.GetHerHis] ช่วงเวลานี้ และไม่จำเป็นต้องเป็น [Select_CString(turkic_leader.IsFemale,'ผู้ทำนายหญิง','ผู้ทำนายชาย')] ก็รู้ว่าอะไรจะเกิดขึ้นต่อไป\n\n"ถึงเวลาแล้วที่ท่านจะมอบรางวัลและความรับผิดชอบที่ข้าสมควรได้รับ ให้ข้า [title_to_grant.GetName] เพื่อครอบครองตลอดไป และเผ่าของข้าจะรับใช้ตระกูล [ROOT.Char.GetDynastyHouseName] ไปอีกนานแสนนาน มันห่างไกลจากดินแดนที่ร่ำรวยที่สุดของท่าน แต่ต้องการการปกครองโดยตรงมากขึ้น ให้เกียรติข้าด้วยวิธีนี้ มิฉะนั้นข้าอาจจะนำนักรบของข้าไปที่อื่น""
 fp3_frontier_story_cycle.0099.a: "ถือว่าเป็นของเจ้าแล้ว"
 fp3_frontier_story_cycle.0099.b: "เจ้าจะไม่รับ [extra_title_to_grant.GetNameNoTooltip] แทนหรือ?"
 fp3_frontier_story_cycle.0099.c: "ข้ามอบ [extra_extra_title_to_grant.GetNameNoTierNoTooltip] ให้เจ้าได้ แต่นั่นคือทั้งหมด"
 fp3_frontier_story_cycle.0099.d: "ไม่"

 #Refuge of Light, by Ola Jentzsch 
 fp3_yearly.8019.t: "ที่ลี้ภัยแห่งแสงสว่าง"
 fp3_yearly.8019.desc: "[hateful_ruler.GetTitleTierName] [hateful_ruler.GetFirstName] ได้เริ่มการกดขี่ข่มเหง [manichean_leader.GetFaith.GetAdherentNamePlural] ที่เหลืออยู่ในดินแดนของ [hateful_ruler.GetHerHis] [manichean_leader.GetName] ผู้นำของศาสนาที่ถูกกดขี่นี้ บัดนี้มาหาข้า พร้อมกับกองหนังสือเก่าแก่กองใหญ่\n\n"[ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่" [manichean_leader.GetSheHe] กล่าว "ศาสนาของข้าเป็นศาสนาเก่าแก่ เป็นคู่แข่งกับศาสนาคริสต์เมื่อครั้งยังเยาว์วัย เรามีความรู้มากมายเกี่ยวกับโลกแห่งวัตถุอันตกต่ำนี้ และแม้กระทั่งความเข้าใจอันถ่อมตนบางประการเกี่ยวกับโลกแห่งแสงสว่างที่สูงส่งกว่า เพื่อนร่วมชาติของเราบางคนได้ตั้งรกรากอยู่ใน [refuge_of_light.GetNameNoTier] แล้ว - ท่านจะอนุญาตให้ผู้ติดตามของข้าทำ เช่นนั้นด้วยได้หรือไม่?"\n\n"เป็นการตอบแทน ข้าสามารถอยู่และรับใช้ท่าน และแบ่งปันขุมทรัพย์ความรู้นี้จากห้องสมุดโบราณของเราในแบกแดด และเทซิฟอนก่อนการล่มสลายของมันแก่ท่าน""
 fp3_yearly.8019.a: "ข้ายอมรับข้อเสนอนั้นด้วยความยินดี"
 fp3_yearly.8019.b: "พวกเจ้าทั้งหมดสามารถตั้งรกรากใน [refuge_of_light.GetNameNoTierNoTooltip] ได้ - หากพวกเจ้าจ่ายภาษีที่เหมาะสม"
 fp3_yearly.8019.c: "ข้าจะไม่ให้ที่พักพิงแก่พวกเจ้าในดินแดนของข้า"
 manicheans_sent_away.tt: "ท่านส่ง [manichean_leader.GetFaith.GetAdherentNamePlural] ออกไป"

 #The Lady of the Land, by Ola Jentzsch
 fp3_yearly.8020.t: "สตรีแห่งแผ่นดิน"
 fp3_yearly.8020.desc: "มีศาลเจ้าแห่งหนึ่งใน [temple_county.GetNameNoTier] อุทิศให้กับ [bibi_shahrbanu.GetFirstName] เจ้าหญิงซาซาเนียนผู้สมรสกับ [imam_husayn.GetTitledFirstName] ผู้ยิ่งใหญ่ กล่าวกันว่า ขณะหลบหนีบนหลังม้าจากสมรภูมิคาร์บาลา [bibi_shahrbanu.GetFirstNameNoTooltip] ได้ร้องขอความรอด และภูเขาลูกหนึ่งก็เปิดออกและรับนางเข้าไป นับตั้งแต่นั้นมา ผู้แสวงบุญหญิงจำนวนมากได้มายังสถานที่แห่งนั้นเพื่อสักการะนาง\n\nแต่ [righteous_caliph.GetTitledFirstName] อ้างว่าศาลเจ้าแห่งนี้เดิมทีอุทิศให้กับเทพนอกรีต [GetFaithByKey('mazdayasna').FertilityGodName] และความศรัทธาที่แสดงออกที่นั่นบิดเบี้ยวและไร้ความเคารพ [righteous_caliph.GetSheHe|U] ต้องการให้ทำลายมันเสีย\n\n"ท่านทำ เช่นนี้ไม่ได้" [pious_woman.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pious_woman'))] ของข้าอ้อนวอน "[bibi_shahrbanu.GetFirstNameNoTooltip] เป็นสัญลักษณ์สำหรับสตรีทุกคนในเปอร์เซีย ท่านต้องปล่อยศาลเจ้าไว้ตามเดิม""
 fp3_yearly.8020.a: "ข้าจะจัดหายามมาคุ้มครองมันด้วยซ้ำ เพื่อเห็นแก่ท่าน"
 fp3_yearly.8020.b: "นางเป็นถึง #italic เจ้าหญิง#! แห่งเปอร์เซีย! ห้ามผู้ใดทำลายศาลเจ้านั้น"
 fp3_yearly.8020.c: "อนิจจา มันต้องถูกทำลาย"
 supporting_womens_faith_flavor: "ท่านเริ่มสนับสนุนลัทธิบูชา [bibi_shahrbanu.GetFirstNameNoTooltip]"
 fp3_sharhabanu_devotees_angry.tt: "ผู้ศรัทธาใน [bibi_shahrbanu.GetFirstNameNoTooltip] ที่ราชสำนักของท่านอาจไม่พอใจกับการกระทำนี้"

 #Acidic Advancements, by Ola Jentzsch
 fp3_yearly.8021.t: "อุบัติเหตุจากกรด"
 fp3_yearly.8021.desc: "เมื่อสองสามวันก่อน [alchemy_enthusiast.GetName] [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] ผู้คงแก่เรียนของ [upset_vassal.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] ของข้า ได้เข้าร่วมการทดลองน้ำมันวิทริออลที่ปรุงขึ้นโดยนักเล่นแร่แปรธาตุชื่อดัง [enthusiastic_alchemist.GetName] เห็นได้ชัดว่ามีบางอย่างผิดพลาดอย่างร้ายแรง\n\n"ท่านต้องลงโทษ [enthusiastic_alchemist.GetFirstNameNoTooltip] อย่างรุนแรง" [upset_vassal.GetTitledFirstNameNoTooltip] บอกข้า "ดูสภาพอันน่าสังเวชของ [alchemy_enthusiast.Custom2('RelationToMe', SCOPE.sC('upset_vassal'))] ของข้าสิ!"\n\n"ไม่นะ [ROOT.Char.GetTitleTierName] ของข้า" [enthusiastic_alchemist.GetFirstNameNoTooltip] อ้อนวอน "ข้าเพียงแค่ ทำให้สูตรที่นักปราชญ์แสวงหามานานสมบูรณ์แบบเท่านั้น ไม่ใช่ความผิดของข้าที่ [alchemy_enthusiast.GetTitledFirstNameNoTooltip] ประมาทเลินเล่อกับสารกัดกร่อนที่รุนแรงที่สุดเท่าที่เคยพบบนโลกทั้ง #italic อูกียะห์#!""
 fp3_acid_delving_deeper_tooltip: "ท่านเพิกเฉยต่อความคับข้องใจของ [upset_vassal.GetFirstNamePossessiveNoTooltip] เพื่อสำรวจการค้นพบของ [enthusiastic_alchemist.GetNamePossessiveNoTooltip]"
 fp3_yearly.8021.a: "[enthusiastic_alchemist.GetNameNoTooltip] บอกข้าเพิ่มเติมเกี่ยวกับการค้นพบเหล่านี้สิ..."
 fp3_yearly.8021.b: "ดีมาก [upset_vassal.GetTitledFirstNameNoTooltip] ข้าจะสั่งประหาร [enthusiastic_alchemist.GetHerHim]"
 fp3_yearly.8021.c: "ข้ามีที่ว่างในคุกใต้ดินสำหรับนักเล่นแร่แปรธาตุผอมโซผู้นี้..."
 fp3_yearly.8021.d: "ไม่มีใครผิดในเรื่องนี้ พวกท่านต้องให้อภัย ซึ่งกันและกัน"

 fp3_yearly.8022.t: "นิมิตแห่งวิทริออล"
 fp3_yearly.8022.desc: ""สิ่งที่ข้าประดิษฐ์ขึ้นนั้นได้มาจากแร่ธาตุคล้ายแก้วที่ชาวบาบิโลนและชาวกรีกโบราณเรียกว่า #italic วิทริออล#!" [enthusiastic_alchemist.GetName] อธิบาย "โดยการเผาวิทริออลสีเขียวอย่างพิถีพิถันในภาชนะกลั่นเหล็ก ข้าได้สร้างสารกัดกร่อนนี้ขึ้นมา ข้ามองเห็นประโยชน์ทั้งทางวิชาการและทางการแพทย์สำหรับมัน แต่โปรดระวัง [ROOT.Char.GetLadyLord] ของข้า มันไม่ใช่สิ่งที่ควรล้อเล่นด้วย ดังที่ [alchemy_enthusiast.GetTitledFirstName] ได้เรียนรู้แล้ว บางทีท่านอาจจะสนับสนุนการวิจัยเพิ่มเติมของข้า?""
 fp3_yearly.8022.a: "ข้าจะศึกษาสสารนี้ด้วยตนเอง!"
 fp3_yearly.8022.b: "มันอาจมีประโยชน์...#italic ทางการทหาร#! บ้างหรือไม่?"
 fp3_yearly.8022.c: "ทำได้ดี แต่ข้าไม่มีประโยชน์อันใดกับสิ่งนี้"
 fp3_studying_acid_ominously_tooltip: "ท่านดำเนินการศึกษาเพิ่มเติม..."
 fp3_yearly.8022.b.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] อยู่ที่ราชสำนักของท่านเพื่อดำเนินการวิจัยเพิ่มเติม"
 fp3_yearly.8022.c.flavor: "[enthusiastic_alchemist.GetNameNoTooltip] นำความรู้ของ [enthusiastic_alchemist.GetHerHis] ไปที่อื่น"

 fp3_yearly.8023.t: "ปริศนาสารกัดกร่อน"
 fp3_yearly.8023.desc: "ขณะที่ข้าค่อยๆ เทของเหลวที่ส่งเสียงฟู่ฟ่าอย่างน่าสะพรึงกลัวจากขวดหนึ่งไปยังอีกขวดหนึ่ง [enthusiastic_alchemist.GetName] มองข้าด้วยความหวาดหวั่น\n\n"โอ้ [ROOT.Char.GetTitleTierName]" [enthusiastic_alchemist.GetSheHe] กล่าว "ข้าเป็นเพียงนักปราชญ์ด้านประวัติศาสตร์และเทววิทยาเป็นหลัก เมื่อเทียบกับท่านแล้ว ข้าเป็นเพียงผู้หยิบหย่งในศาสตร์การเล่นแร่แปรธาตุเท่านั้น แต่จากประสบการณ์ของข้าบอกว่า เราไม่สามารถเรียนรู้อะไรเพิ่มเติมได้อีกแล้วในตอนนี้ เราควรหยุดทดลองกับน้ำมันกรดกำมะถันที่ข้าสร้างขึ้นนี้ มิฉะนั้นข้าเกรงว่า [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] จะลงโทษเราสำหรับความทะนงตนของเรา อาจเป็นไปได้ว่ากรด เช่นนี้ไม่ควรถูกสร้างขึ้นบนโลกนี้""
 fp3_yearly.8023.a: "ไม่ ข้าจะ ทำให้สำเร็จจงได้"
 fp3_yearly.8023.b: "บางทีท่านอาจจะพูดถูก แต่ท่านควรอยู่รับใช้ข้าต่อไป"
 fp3_yearly.8023.c: "ตามที่ท่านปรารถนา ไปเถิด และนำกรดของท่านไปด้วย"
 experimenting_with_acid_toast.failure: "การทดลองของท่านล้มเหลว"
 experimenting_with_acid_toast.success: "การทดลองของท่านเป็นไปด้วยดี"
 fp3_horrible_accident.flavor: "ท่านกำลังเสี่ยงต่ออุบัติเหตุอันน่าสยดสยอง"

 fp3_yearly.8024.t: "การกลับคืนสู่ท้องฟ้า"
 fp3_yearly.8024.desc: "ขณะที่ไข้และความหนาวสั่นทุเลาลงชั่วครู่ [dying_consort.GetFirstName] มองข้าด้วยรอยยิ้มซีดเซียว "คู่ชีวิตที่ดีของข้า [ROOT.Char.GetWifeHusband] ข้าเหลือเวลาบนโลกนี้อีกไม่มากแล้ว แม้ แต่หมอที่ดีที่สุดก็ทำได้เพียงชะลอสิ่งที่หลีกเลี่ยงไม่ได้ ข้ารู้สึกได้" ดูเหมือนว่า [dying_consort.GetHerHim] ต้องใช้ความพยายามอย่างมาก เพื่อที่จะยังคงมีสติอยู่ได้อีกครู่หนึ่ง\n\n"ฟังนะ" [dying_consort.GetSheHe] กล่าวด้วยเสียงแผ่วเบา "นี่คือความปรารถนาสุดท้ายของข้า ข้าต้องการให้ร่างของข้าถูกมอบให้กับฝูงแร้ง ตามธรรมเนียมของบรรพบุรุษข้า เพื่อให้วิญญาณของข้าได้กลับคืนสู่วิมานบนสวรรค์ ไม่ต้องฝังหรือเผา โปรดเถิด ข้าขอร้อง ข้าได้เห็นโลกหน้าในความฝันยามไข้... ข้าต้องการจบชีวิตตามวิถีดั้งเดิม ในฐานะ [dying_consort.Custom('GetDaughterSon')] ที่แท้จริงแห่งเปอร์เซีย""
 fp3_yearly.8024.a: "ข้าจะจัดการให้ ข้าสัญญา"
 fp3_yearly.8024.b: "ข้าสามารถทำพิธีศพกลางแจ้งให้ท่านอย่างลับๆ ได้ แต่แว่นแคว้นต้องไม่รู้เรื่องนี้"
 fp3_yearly.8024.c: "อนิจจา ข้าไม่อาจกระทำการดูหมิ่นต่อ [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] เช่นนั้นได้"
 fp3_relations_care_about_sky_burial.tt: "[courtiers|E], [vassals|E] และ [close_family_members|E] ของท่านจะมีความเห็นเกี่ยวกับเรื่องนี้"
 hiding_sky_burial_toast.success: "ท่านซ่อนพิธีศพกลางแจ้งได้สำเร็จ"
 hiding_sky_burial_toast.failure: "พิธีศพกลางแจ้งของท่านถูกเปิดเผย"
 fp3_hidden_sky_burial.tt: "ท่านประกอบพิธีกรรมอย่างลับๆ"
 fp3_unhidden_sky_burial.tt: "พิธีกรรมถูกค้นพบหลังจากนั้น"
 fp3_helpful_courtier.tt: "[helpful_courtier.GetName] จะช่วยเหลือท่านในกิจการนี้"

 fp3_yearly.8025.t: "รุ่งอรุณที่สี่"
 fp3_yearly.8025.desc: "ด้วยพิธีการอันเหมาะสม ร่างของ [dying_consort.GetName] ถูกวางไว้ในช่องบน #italic ดัคมา#! เก่าแก่ เปิดโล่งสู่ท้องฟ้าและฝูงแร้งแห่งทุ่งหญ้าสเตปป์ที่บินวนอยู่เบื้องบนแล้ว\n\nเป็นเวลาสามวันแล้วนับตั้งแต่ [dying_consort.GetHerHis] จากไป และข้าพบว่าตนเองยังคงวนเวียนอยู่ข้างดัคมา จนกระทั่งรุ่งสาง ตามตำนานเก่าแก่ ในรุ่งเช้าวันที่สี่หลังความตาย วิญญาณจะกลับคืนสู่จิตวิญญาณ #italic ฟราวาชิ#! ในโลกเบื้องสูง ที่นั่น มันจะถ่ายทอดทุกสิ่งที่ได้เรียนรู้ในชีวิตแก่ฟราวาชิ เพื่อช่วยในการต่อสู้อันเป็นนิรันดร์กับความชั่วร้าย แต่ข้าไม่เห็นวิญญาณใดลอยขึ้นสู่สวรรค์จากกำแพงที่ผุพังของดัคมา เห็นเพียงเงาดำของฝูงแร้งตัดกับแสงสีซีดของดวงอาทิตย์ที่กำลังขึ้น"
 fp3_yearly.8025.a: "ขอให้ [dying_consort.GetSheHe] ไปสู่สุคติอย่างสงบ"
 fp3_yearly.8025.b: "ข้าได้ทำตามความปรารถนาสุดท้ายของ [dying_consort.GetHerHis] แล้ว"

 fp3_yearly.8026.t: "ดัคมาลับ"
 fp3_yearly.8026.desc: "ห่างไกลออกไปนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า มี #italic ดัคมา#! เก่าแก่แห่งหนึ่ง หอคอยแห่งความเงียบ ค่อยๆ ผุพังลงท่ามกลางลมหนาวจากทุ่งหญ้าสเตปป์ ที่นี่ ดูเหมือนจะไม่มีสายตาคอยสอดส่อง และข้าพร้อมด้วย [helpful_courtier.GetFirstName] ได้แบกร่างของ [dying_consort.GetTitledFirstName] ไปยังที่พักสุดท้ายในช่องอันผุพังด้านใน ข้ามองดูอย่างเงียบงันขณะที่ฝูงแร้งแห่งทุ่งหญ้าสเตปป์ร่อนลงมาดุจเมฆดำ และข้าสงสัยอยู่ครู่หนึ่งว่า พวกมันมาจากไหน - ถูกส่งมาจากเทพเจ้าโบราณ หรือโดย [ROOT.Char.GetFaith.DevilName]? ข้าคงไม่มีวันรู้\n\n[helpful_courtier.GetFirstNameNoTooltip] ยังคงเงียบขรึม ดูเหมือนจะได้รับผลกระทบจากบรรยากาศอันเศร้าสร้อย"
 fp3_yearly.8026.a: "ข้าหวังว่าจะไม่มีใครค้นพบเรื่องนี้..."
 fp3_yearly.8026.b: "ข้าควรจะปิดปาก [helpful_courtier.GetFirstNameNoTooltip] ตลอดไป เพื่อความแน่ใจ..."

 fp3_yearly.8027.t: "เก้าร้อยเก้าสิบบทแห่งทองคำ"
 fp3_yearly.8027.desc: "นักเขียนผู้โด่งดัง [snubbed_poet.GetName] ได้มีเรื่องบาดหมางกับผู้อุปถัมภ์คนเก่าของเขา [former_employer.GetName]\n\n"[former_employer.GetSheHe|U] สัญญาว่าจะให้ทองคำเก้าร้อยเก้าสิบตะลันต์แก่ข้า" [snubbed_poet.GetFirstNameNoTooltip] บอกข้า "หนึ่งตะลันต์สำหรับทุกบทในมหากาพย์ที่ข้าเตรียมการมานานในนามของ [former_employer.GetHerHis] ข้าได้วางแผนที่จะใช้มันเพื่อฟื้นฟู #italic คานัต#! ที่พังทลายในหมู่บ้านเกิดของข้า แต่เมื่อข้าอยู่ในโรงอาบน้ำ คนส่งสารก็นำรางวัลตามสัญญามาให้ข้า - แต่เหรียญกลับเป็น #italic เงิน#!! ด้วยความไม่พอใจกับการทรยศครั้งนี้ ข้าจึงมอบมันทั้งหมดให้กับคนส่งสาร เจ้าของโรงอาบน้ำ และคนขายน้ำผลไม้ ตอนนี้ข้าต้องการนายจ้างคนใหม่ ในขณะที่ข้าเขียนบทสุดท้ายให้เสร็จ และข้าได้ยินมาว่าท่านมีทองคำมากพอที่จะเทียบเท่าข้อเสนอก่อนหน้านี้...""
 fp3_yearly.8027.a: "ข้าจะให้ท่าน #italic ครึ่งหนึ่ง#! ของจำนวนนั้น - เมื่อข้าเห็นหนังสือเสร็จสมบูรณ์"
 fp3_yearly.8027.b: "นี่ต้องเป็นความเข้าใจผิดกับ [former_employer.GetTitledFirstNameNoTooltip]..."
 fp3_yearly.8027.c: "ท่านคิดว่าข้าเป็นคนสุรุ่ยสุร่ายหรือ? ไปหาที่อื่นเถิด"
 fp3_mediation_fails.tt: "การไกล่เกลี่ยของท่านล้มเหลว"
 fp3_mediation_succeeds.tt: "การไกล่เกลี่ยของท่านสำเร็จ"
 fp3_poet_leaves.tt: "[snubbed_poet.GetNameNoTooltip] จะย้ายไปราชสำนักของ [former_employer.GetFirstNamePossessiveNoTooltip] แต่ท่านจะได้รับ [opinion|E] และ [prestige|E]"
 fp3_promise_to_pay_for_book.tt: "ท่านสัญญาว่าจะจ่าย 495 [gold|E] สำหรับหนังสือเมื่อมันเสร็จสมบูรณ์"
 fp3_mediate_between_them.flavor: "ท่านพยายามคลี่คลายสถานการณ์ระหว่าง [snubbed_poet.GetNameNoTooltip] และ [former_employer.GetFirstNameNoTooltip]"

 fp3_yearly.8028.t: "ตำนานกษัตริย์"
 fp3_yearly.8028.desc: "มันเสร็จสมบูรณ์แล้ว" [snubbed_poet.GetName] ประกาศ "ตามที่ข้าสัญญาไว้ ทั้งหมด 990 บท เรื่องราวมหากาพย์แห่งวีรกรรมและความมหัศจรรย์ของชาวเปอร์เซียในยุคโบราณ ข้าทุ่มเทจิตวิญญาณลงในงานชิ้นนี้ และข้าจะไม่มีวันสร้างผลงาน เช่นนี้ได้อีก ข้าเป็นเพียงกวีมนุษย์ผู้ต่ำต้อย แต่ด้วยการอุปถัมภ์ของท่าน บางทีหนังสือของข้าอาจคงอยู่ตลอดกาล และกลายเป็นประทีปแห่งความภาคภูมิใจอันฟื้นฟูสำหรับเปอร์เซีย"\n\n"ตอนนี้... ท่านได้สัญญาว่าจะให้ทองคำ 495 ตะลันต์แก่ข้า?""
 fp3_yearly.8028.a: "มันเป็นของท่าน และท่านควรอยู่รับใช้ข้าต่อไป"
 fp3_yearly.8028.b: "ใช่ รับไปเถิดและไปช่วยเหลือหมู่บ้านของท่าน"
 fp3_yearly.8028.c: "#italic นี่#! คือสิ่งที่ข้าจ่ายไปหรือ? ช่างน่าผิดหวังเสียนี่กระไร"

 shahnameh_name: "ตำนานกษัตริย์"
 shahnameh_desc: "หนังสือเล่มใหญ่นี้บอกเล่าประวัติศาสตร์ในตำนานของจักรวรรดิเปอร์เซียตั้งแต่การสร้างโลกจนถึงการพิชิตของชาวมุสลิม ด้วยบทกวีและรายละเอียดอันวิจิตร ดูเหมือนว่าจะปลุกเร้าหัวใจของชาวเปอร์เซียทุกคนที่ได้อ่าน"

 persian_epic_name: "มหากาพย์เปอร์เซีย"
 persian_epic_desc: "หนังสือเล่มนี้เต็มไปด้วยบทกวีมหากาพย์ที่เฉลิมฉลองการกระทำและโชคชะตาของวีรบุรุษชาวเปอร์เซียในสมัยโบราณ"

 fp3_yearly.8029.t: "เรื่องราวแห่งความรุ่งโรจน์ในอดีต"
 fp3_yearly.8029.desc: "[snubbed_poet.GetName] ยื่นต้นฉบับให้ข้า และหลายหน้าประดับประดาด้วยภาพวาดขนาดเล็กที่วาดอย่างประณีตด้วยฝีมืออันชำนาญ "นี่คือหนังสือที่ข้าสัญญาไว้กับท่าน" [snubbed_poet.GetSheHe] ประกาศอย่างมีชัย "และด้วยทักษะอันต่ำต้อยที่ข้าอาจมี ข้าสัญญาว่าท่านจะไม่พบว่ามันขาดตกบกพร่อง มันบอกเล่าเรื่องราวของวีรบุรุษ เช่น อารัช นักธนู, เฟเรย์ดูน ผู้สังหารมังกร, เจ้าหญิงผู้งดงาม และความรุ่งโรจน์ในอดีตของเปอร์เซีย ข้ายังได้ แต่งโคลงสองบทที่เชื่อมโยงราชวงศ์อันยิ่งใหญ่ของท่านเข้ากับเรื่องราวทั้งหมด..."\n\n"ตอนนี้ เราได้พูดถึงทองคำ 495 ตะลันต์ไว้?""
 fp3_yearly.8029.a: "มันเป็นของท่าน และท่านควรอยู่รับใช้ข้าต่อไป"
 fp3_yearly.8029.b: "ใช่ รับไปเถิดและไปช่วยเหลือหมู่บ้านของท่าน"
 fp3_yearly.8029.c: "ทองคำมากมายขนาดนี้เพื่อ #italic สิ่งนี้#! น่ะหรือ?"


 fp3_yearly.8030.opening: "[former_employer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 fp3_yearly.8030.desc: "ท่านคิดว่าข้าโง่หรือ? [snubbed_poet.GetName] ใช้ทรัพย์สมบัติของข้าไปกับพ่อค้าเร่ข้างถนนที่น่าสังเวชและเจ้าของ #italic ฮัมมัม#! ที่เสื่อมทราม และถึง แม้ว่าตอนนี้ [snubbed_poet.GetSheHe] จะอ้างว่า [snubbed_poet.GetSheHe] ได้รับเงิน ข้าก็ได้รับแจ้งจากผู้ที่น่าเชื่อถือมากกว่าท่านว่าแท้จริงแล้วมันคือทองคำ แต่ [snubbed_poet.GetSheHe] กลับขโมยหนังสือที่สัญญาไว้กับข้าไปหา #italic ท่าน#! ขอให้ [former_employer.GetFaith.HighGodNameAlternate] ขับไล่ท่านออกจากสวนสวรรค์!"
 fp3_yearly.8030.a: "น่าเสียดายที่ท่านไม่เห็นเหตุผล..."

 fp3_yearly.8031.opening: "[former_employer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 fp3_yearly.8031.desc: "แท้จริงแล้ว ปรากฏว่าข้าราชบริพารที่มุ่งร้ายคนหนึ่งของข้าทรยศข้า และให้ [snubbed_poet.GetName] น้อยกว่าที่ข้าได้สัญญาไว้กับ [snubbed_poet.GetHerHim] ขอบคุณที่ช่วยคลี่คลายความเข้าใจผิดนี้ระหว่างข้ากับกวี ซึ่งตอนนี้จะกลับมารับใช้ข้า ข้าจะกล่าวถึงท่านในทางที่ดีต่อผู้ปกครองคนอื่นๆ ในโลกนี้"
 fp3_yearly.8031.a: "ด้วยความยินดี"

 fp3_yearly.8032.t: "สิบวันแห่งความตาย"
 fp3_yearly.8032.desc: "เมื่อใกล้ถึงสิ้นปีตามปฏิทินเปอร์เซียเก่า ก็ถึงเวลาสำหรับ #italic ฟราวาร์ดิกัน#! เทศกาลโบราณเพื่อรำลึกถึงวิญญาณของผู้ตาย [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('death_enthusiast'))] ของข้า [death_enthusiast.GetTitledFirstName] ดูเงียบขรึมและเกือบจะสิ้นหวังอย่างเห็นได้ชัด โดยวางเครื่องเซ่นไหว้สำหรับวิญญาณบรรพบุรุษไว้ที่ประตู\n\n"ท่านควรไปจุดตะเกียง" [death_enthusiast.GetSheHe] บอกข้า "เพื่อต้อนรับวิญญาณ #italic ฟราวาชิ#! เพราะแน่นอนว่าบรรพบุรุษของท่านกำลังเฝ้าดูเราอยู่ตอนนี้ เหนือกว่ากำแพงอันบางเบาของโลกวัตถุนี้ นึกถึง [ancestor_1.GetName] และบรรพบุรุษผู้ยิ่งใหญ่อื่นๆ ในตระกูลของท่าน""
 fp3_yearly.8032.a: "อนิจจา ข้าไม่เฉลิมฉลองพิธีกรรมนอกรีต"
 fp3_yearly.8032.b: "แน่นอน ที่รักของข้า"
 fp3_yearly.8032.c: "ตระกูล [ROOT.Char.GetDynastyHouseName] ช่างรุ่งโรจน์ยิ่งนัก เมื่อท่านกล่าวถึง..."
 fp3_yearly.8032.d: "จริงด้วย... ชีวิตเปรียบดังเทียนเล่มสั้น ดับง่ายเหลือเกิน"

 fp3_yearly.8033.t: "ความสุขเยือกแข็ง"
 fp3_yearly.8033.desc: "ก่อนใครอื่น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sorbet_enthusiast'))] ผู้มีสายตาเฉียบแหลมและชอบของหวานของข้า [sorbet_enthusiast.GetTitledFirstName] ได้สังเกตเห็นความขาดแคลนที่เห็นได้ชัดบนโต๊ะอาหารเย็น\n\n"ไม่มี #italic ฟาลูเดห์#!!" [sorbet_enthusiast.GetSheHe] อุทาน หมายถึงของหวานเย็นที่มีเส้นก๋วยเตี๋ยว น้ำเชื่อม และน้ำกุหลาบที่เป็นที่ชื่นชอบของชาวเปอร์เซียทุกคน "ข้าส่งคนไปหาผู้จัดหา" [sorbet_enthusiast.GetSheHe] กล่าวต่อ "และได้รับแจ้งว่าโรงน้ำแข็ง #italic ยัคชาล#! ใน [yakhchal_county.GetNameNoTier] ได้พังทลายลงในเหตุการณ์แผ่นดินไหว เราต้องทำอะไรสักอย่างทันที มิฉะนั้นทั้งราชสำนักจะต้องทนทุกข์และซูบผอมจนอาจถูกเข้าใจผิดว่าเป็นนักพรตตะวันออก!"
 fp3_yearly.8033.a: "ข้าต้องกักตุนฟาลูเดห์ทั้งหมดในอาณาจักร ในขณะที่ข้ายังทำได้!"
 fp3_yearly.8033.b: "ข้าไม่ต้องการความฟุ่มเฟือย เช่นนี้ และท่านก็ เช่นกัน"
 fp3_yearly.8033.c: "ท่านพูดถูก ข้าจะส่งทองคำไปบูรณะโรงน้ำแข็ง"
 fp3_yearly.8033.d: "คราวหน้า จงรบกวนข้าด้วยปัญหาที่ #italic แท้จริง#! เถิด"

 fp3_yearly.8034.t: "ขุมทรัพย์เฮฟทาไลต์"
 fp3_yearly.8034.desc: ""ฟังข้าก่อน [ROOT.Char.GetTitleTierName] ของข้า" [wronged_vassal.GetName] ร้องขอก่อนข้า "เมื่อเดือนที่แล้ว ข้ากำลังสำรวจที่ดินติดแม่น้ำใน [hephthalite_hoard_province.GetNameNoTier] เมื่อข้าพบขุมทรัพย์ทองคำอันงดงาม ข้าเห็นจากรูปทรงกะโหลกศีรษะที่ยาวรีของกษัตริย์ที่ปรากฎบนเหรียญ ว่าขุมทรัพย์นี้ต้องถูกซ่อนไว้โดยชาวฮันนิค บางทีอาจเป็นชาวเฮฟทาไลต์แห่งจักรวรรดิ ซึ่งเคยปกครองดินแดนของข้าเมื่อไม่นานมานี้ บัดนี้ ด้วยความที่สืบเชื้อสายมาจากพวกเขา ข้าคิดว่าเป็นสิทธิ์ของข้าที่จะอ้างสิทธิ์ในขุมทรัพย์นี้ แต่เจ้าเหนือหัวของข้า [greedy_vassal.GetTitledFirstName] กำลังโต้แย้งเรื่องนี้ [greedy_vassal.GetSheHe|U] กำลังพยายามยึดขุมทรัพย์ไปจากข้า โดยอ้างว่าเป็นสิทธิ์ของ [greedy_vassal.GetHerHis] ในฐานะผู้สืบทอดอำนาจเหนือดินแดนเหล่านั้นของเฮฟทาไลต์ โปรดสนับสนุนข้าด้วย""
 fp3_yearly.8034.a: "เราจะ ทำให้เรื่องนี้ง่าย - #italic ข้า#! จะเอาทองคำไป"
 fp3_yearly.8034.b: "เจ้าจงมอบมันทั้งหมดให้ [greedy_vassal.GetFirstNameNoTooltip]"
 fp3_yearly.8034.c: "จำเป็นต้องมีการประนีประนอม - มอบมันให้กับผู้คนใน [hephthalite_hoard_province.GetNameNoTierNoTooltip]"
 fp3_yearly.8034.d: "ข้าจะให้เจ้าเก็บมันไว้ - แต่อย่าลืมบุญคุณครั้งนี้"

 fp3_yearly.8035.t: "หัวใจและผู้สร้าง"
 fp3_yearly.8035.desc: "ขณะที่ข้าเดินอย่างกระสับกระส่ายในคืนแสงจันทร์ [sufi_mystic.GetTitledFirstName] ก็เข้ามาร่วมกับข้า\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [sufi_mystic.GetSheHe] กล่าวอย่างเคร่งขรึม "ท่านต้องการเข้าใกล้ [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] มากขึ้นหรือไม่? ข้าได้พบกับนักพรตซูฟีจากโคราซาน ผู้สอนข้าถึงการทำสมาธิแบบ #italic มุรากาบา#! หนทางนี้ไม่ใช่เรื่องง่าย แต่เมื่อผ่านมันไปได้ ท่านจะสามารถชำระล้างสัญชาตญาณดิบของมนุษย์ เผยความรู้ที่ซ่อนเร้น และขึ้นสู่สภาวะแห่งความสุขอันเป็นหนึ่งเดียวกับ [ROOT.Char.GetFaith.ReligiousText] และจักรวาล ท่านจะให้ข้านำทางท่านหรือไม่?""
 fp3_yearly.8035.a: "ใช่ ข้าพร้อมที่จะลอง"
 fp3_yearly.8035.b: "ไม่ว่าสิ่งนี้คืออะไร มันต้องเป็นสิ่งอัปมงคล"
 fp3_yearly.8035.c: "ข้าอยากจะไปนอนมากกว่า ขอบคุณ"
 fp3_unlock_meditation.tt: "ปลดล็อก [decision|E] การทำสมาธิในที่สงัด"
 learning_muraqaba_toast.success: "ท่านเรียนรู้พื้นฐานของ #italic มุรากอบะห์#! แล้ว"
 learning_muraqaba_toast.failure: "ท่านล้มเหลวในการเรียนรู้พื้นฐานของ #italic มุรากอบะห์#!"

 fp3_yearly.8036.t: "นครแห่งผู้ไร้ปาก"
 fp3_yearly.8036.desc: "ดวงอาทิตย์ลับขอบฟ้าไปแล้วขณะที่ข้าขี่ม้าผ่านถิ่นทุรกันดารนอก [spooky_county.GetNameNoTier] โดยมี [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_councillor'))] ของข้า [superstitious_councillor.GetTitledFirstName] ตามมาติดๆ\n\nในแสงสลัวของดวงจันทร์ เรามาถึงสถานที่ที่ข้าเคยได้ยินมาก่อน เขาวงกตอันกว้างใหญ่ของหมู่ศิลาตั้ง — ขรุขระและเปิดอ้า — สุสานหรือสถานที่ศักดิ์สิทธิ์สำหรับผู้คนที่ถูกลืมเลือนไปนานแล้ว แต่บนหินนั้นได้สลักเป็นรูปเหมือนมนุษย์ ยก เว้นแต่ไม่มีปาก รูปเคารพที่เหี่ยวแห้งเหล่านี้จ้องมองเราอย่างเย็นชาขณะที่เราพยายามผ่านไปและดูเหมือนจะเคลื่อนไหวได้\n\n"อย่าอยู่ที่นี่นานเลย" [superstitious_councillor.GetFirstNameNoTooltip] กล่าว พลางตัวสั่น แต่ข้าอดสงสัยไม่ได้ — คนเหล่านี้คือใคร? มีผีอยู่จริงหรือ?"
 fp3_yearly.8036.a: "เราจะอยู่ที่นี่สักครู่และสำรวจสถานที่นี้"
 fp3_yearly.8036.b: "ไปจากที่นี่โดยเร็วเถิด และหาทหารยามเพิ่ม..."
 fp3_yearly.8036.c: "ใจเย็นๆ [superstitious_councillor.GetFirstNameNoTooltip] มันเป็นเพียงเงาและฝุ่นผง"
 fp3_yearly.8036.d: "ข้าควรสวดมนต์ เพื่อความแน่ใจ"

 fp3_yearly.8037.t: "ยารักษาความเฉื่อยชาทางจิตวิญญาณ"
 fp3_yearly.8037.desc: "ขณะที่ข้าเดินเตร็ดเตร่อย่างไร้จุดหมายในแสงจันทร์ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] ของข้า [court_physician.GetTitledFirstName] เข้ามาใกล้\n\n "นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsNameNoTooltip]" [court_physician.GetSheHe] กล่าว "ช่วงหลังมานี้ท่านดูเศร้าสร้อยมาก ข้าอดไม่ได้ที่จะพยายามวินิจฉัย... ข้าเชื่อว่าท่านทุกข์ทรมานจากภาวะเฉื่อยชาทางจิตวิญญาณ (acedia) สภาวะอันน่าสังเวชของความเบื่อหน่ายที่มักเกิดกับฤาษีและ [Select_CString(ROOT.Char.IsFemale,'สตรี','บุรุษ')] ผู้มีปัญญา แต่มีนักปราชญ์ [persian_polymath.GetName] แพทย์ผู้ยิ่งใหญ่กว่าข้ามาก [persian_polymath.GetSheHe|U] เพิ่งเขียนหนังสือเกี่ยวกับความเจ็บป่วยทางจิตใจ และอาจสามารถรักษาท่านได้""
 fp3_yearly.8037.a: "ส่งคนไปตาม [persian_polymath.GetHerHim] มาเถิด ไม่ว่า [persian_polymath.GetSheHe] จะคิดค่าใช้จ่ายเท่าใดก็ตาม"
 fp3_yearly.8037.b: "ปล่อยข้าไว้ตามลำพัง"

 fp3_yearly.8038.t: "น้ำดีดำ"
 fp3_yearly.8038.desc: "หลังจากสังเกตข้าอย่างตั้งใจนับตั้งแต่มาถึง [ROOT.Char.Custom('GetCourt')] ของข้า [persian_polymath.GetFirstName] ก็ได้วินิจฉัยแล้ว\n\n"มันคือภาวะน้ำดีดำส่วนเกินในสมอง นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleTierName] แม้ แต่คนโบราณก็เข้าใจพื้นฐานของสภาวะนี้ แต่เพื่อนนักปราชญ์ของข้าในโคราซานและควาเรซม์ได้ศึกษามันมานานแล้ว #italic มาลิคูเลีย#! เราเรียกมัน เช่นนั้น และมัน ทำให้ท่านไร้ความสุขและหดหู่ ผู้ป่วยบางรายมีอาการเบื่ออาหารหรือเลียนแบบพฤติกรรมของสัตว์ แต่อาจมีแนวโน้มที่จะเกิดนวัตกรรมและความเฉลียวฉลาด ซึ่งอาจไม่โชคร้ายนัก"\n\n"แต่ข้าพูดนอกเรื่องไป... ท่านจะลองควบคุมอาหารด้วยปลาเค็มและก้านขึ้นฉ่ายหรือไม่? ประสบการณ์แสดงให้เห็นว่ามันอาจได้ผล""
 fp3_yearly.8038.a: "ตกลง ข้าจะลองดู"
 fp3_yearly.8038.b: "#italic นั่น#! คือการรักษาที่ดีที่สุดของท่านหรือ? ข้าจะหาคนอื่น..."
 lackluster_diet.tt: "ท่านจะไม่สามารถใช้ [decision|E] การดื่มด่ำกับอาหาร ได้ ในขณะที่ท่านกำลังควบคุมอาหารนี้"

 fp3_yearly.8039.t: "สมุนไพรและธาตุเจ้าเรือน"
 fp3_yearly.8039.desc: "[persian_polymath.GetFirstName] กำลังครุ่นคิดอย่างลึกซึ้ง "อาหารที่ข้าสั่งจ่ายไปดูเหมือนจะไม่ได้ผล [ROOT.Char.Custom('FormOfAddressForLiege')] ทว่าท่านต้องละเว้นจากการแสวงหาการปลอบประโลมจากดวงจันทร์และดวงดาว เครื่องราง และการเยียวยาแบบดั้งเดิม เช่นนั้น เพราะมันไม่ได้ผล ข้าขอแนะนำให้บริโภคสมุนไพรยาบางชนิดทุกวัน เช่น ก้านยี่หร่า แตงกวา และกำยาน มันสามารถต้านน้ำดีดำ ปรับสมดุลของเหลวในร่างกายของท่าน และเพิ่มพลังทางจิตวิญญาณของท่าน ซึ่งจะเป็นประโยชน์ต่อท่านอย่างแน่นอน""
 fp3_yearly.8039.a: "ดูเหมือนจะคุ้มค่าที่จะลอง"
 fp3_yearly.8039.b: "ข้าอยากจะเชื่อมั่นในการควบคุมอาหารของข้าต่อไป ให้เรารักษามันไว้อีกสักหน่อย"
 fp3_yearly.8039.c: "ข้าเบื่อหน่ายกับการรักษาที่ไม่ได้ผลของท่านแล้ว ไปเสียเถิด"

 fp3_yearly.8040.t: "พลังจิต"
 fp3_yearly.8040.desc: ""อนิจจา [ROOT.Char.Custom('FormOfAddressForLiege')]" [persian_polymath.GetFirstName] กล่าว "แม้ข้าจะคิดว่าเราได้เห็นพัฒนาการที่ดีขึ้นบ้างในอารมณ์และสภาพร่างกายของท่าน แต่ข้าก็ยังมิได้รักษาอาการเศร้าซึมของท่านให้หายขาด โรคทางใจนั้นเป็นศัตรูที่ดื้อรั้น ทว่า ยังคงมีวิธีรักษาที่ต้องลอง ในตำราของข้า ข้าได้กำหนดไว้ว่าจิตใจของมนุษย์เป็นระบบอิสระ ที่มีอิทธิพลต่อลักษณะทางกายภาพของ [persian_polymath.GetHerHis] เราต้องเพิ่มพลังจิตของท่าน โดยการพิสูจน์ต่อจิตใต้สำนึกของท่านว่าจิตวิญญาณนั้นเป็นนิรันดร์ ไม่ถูกมลทินโดยความตาย พูดง่าย ๆ ก็คือ ท่านต้องยืนยันศรัทธาของท่านใน [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] อีกครั้ง""
 fp3_yearly.8040.a: "ข้าจะแสวงหาคำสอนของซูฟี"
 fp3_yearly.8040.b: "ข้าจะปรึกษา [court_chaplain.GetTitledFirstName]"
 fp3_yearly.8040.c: "ศรัทธาของข้าไม่เคยสั่นคลอน ท่านคิดว่าข้าเป็นใคร?"
 fp3_yearly.8040.d: "นี่มันไร้สาระ ไปขาย "ยา" ของท่านที่อื่นเถิด"
 fp3_refusing_faith_treatment_flavor: "ท่านปฏิเสธการรักษานี้ แต่ความพยายามของ [persian_polymath.GetFirstNamePossessiveNoTooltip] อาจดำเนินต่อไป"

 fp3_yearly.8041.t: "ความสงบแห่งความเงียบ"
 fp3_yearly.8041.desc: ""นี่จะเป็นหนทางที่ยากลำบาก" [sufi_mystic.GetName] ประกาศหลังจากได้รับแจ้งเกี่ยวกับปัญหาของข้า\n\n"วิถีแห่งคณะ #italic ตอรีกัต#! ซูฟีสามารถนำมา ซึ่งความเข้าใจอันยิ่งใหญ่เกี่ยวกับตนเองและจักรวาล แต่ต้องใช้วินัยอย่างมหาศาลจึงจะบรรลุได้ ตัวข้าเองก็เป็นเพียงผู้เริ่มต้นบนเส้นทางนี้ อย่างไรก็ตาม นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleTierName] เราสามารถพยายามบรรลุ #italic ฟานา#! สภาวะแห่งการทำสมาธิเมื่อท่าน ซึ่งเป็นเพียงหยดน้ำเล็กๆ ในความฝันของ [ROOT.GetCharacter.GetFaith.HighGodNameAlternatePossessive] ตระหนักถึงมหาสมุทรที่อยู่รอบตัวท่าน ข้าคิดว่ามันสามารถนำมุมมองใหม่มาสู่ชีวิตอันแสนสั้นนี้ได้""
 fp3_yearly.8041.a: "ข้าพร้อมแล้ว"
 fp3_yearly.8041.b: "ข้าอยากจะแสวงหาการรักษาแบบอื่นมากกว่า..."

 fp3_yearly.8042.t: "จิตวิญญาณอมตะ"
 fp3_yearly.8042.desc: ""จริงแท้" [court_chaplain.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))] ของข้า กล่าว "ความทุกข์ยากและความขุ่นข้องหมองใจของเราในชีวิตทางโลกนี้เป็นเพียงสิ่งที่เกิดขึ้นชั่วครู่ แต่จิตวิญญาณของท่านจะคงอยู่ แม้ข้าจะเข้าใจ [ROOT.Char.Custom('FormOfAddressForLiege')] หากเพียงคำกล่าวนั้นไม่เพียงพอที่จะปลอบโยนท่าน"\n\n[court_chaplain.GetSheHe|U] คลี่ม้วนคัมภีร์ออก "นี่คือส่วนหนึ่งของ [ROOT.Char.GetFaith.ReligiousText2] ที่คัดลอกโดย [ROOT.Char.Custom('LevyMenWomen')] ผู้ศักดิ์สิทธิ์ที่ฉลาดกว่าเรามาก มันมีคำอธิบายที่ชัดเจนเกี่ยวกับชีวิตหลังความตาย และโองการที่อาจมีเบาะแสเกี่ยวกับความหมายของทั้งหมด ข้าแนะนำให้ท่านศึกษามัน หลายครั้งหากจำเป็น จนกว่าจิตวิญญาณของท่านจะสงบ แต่หากการอ่านไม่เป็นที่โปรดปรานของท่าน ท่านอาจไปเยือน [ROOT.Char.GetFaith.HouseOfWorship] เพื่อสนทนาภายในกับ [ROOT.GetCharacter.GetFaith.HighGodName]""
 fp3_yearly.8042.a: "ตำราก็เพียงพอแล้ว"
 fp3_yearly.8042.b: "บางที [ROOT.Char.GetFaith.HouseOfWorship] อาจจะเหมาะกับข้ามากกว่า"
 fp3_yearly.8042.c: "ดูเหมือนว่าท่านจะไม่สามารถช่วยข้าได้เลย"

 fp3_yearly.8043.t: "สิ้นสุดการรักษา"
 fp3_yearly.8043.desc: "[persian_polymath.GetFirstName] ได้สังเกตข้ามาหลายสัปดาห์แล้ว พลางครุ่นคิดอย่างหนัก\n\n"น่าเสียดาย ข้าหมดปัญญาแล้ว นายท่าน/นายหญิงผู้ยิ่งใหญ่ [ROOT.Char.GetTitleTierName] ข้าได้ใช้ความรู้และทักษะทั้งหมดที่ข้ามี แต่ดังที่ข้าได้กล่าวไปแล้ว โรคทางจิตนั้นรักษายากมาก อย่างไรก็ตาม ข้าคิดว่าเรามีความคืบหน้า เพราะธาตุเจ้าเรือนของท่านดูเหมือนจะสมดุลดีขึ้น และจิตวิญญาณของท่านก็แข็งแกร่งขึ้น หากท่านอดทน และบริโภคปลาในปริมาณที่ดีต่อสุขภาพต่อไป รวมถึงสมุนไพรบางชนิดที่ข้าสั่ง ข้าคิดว่า หาก [ROOT.GetCharacter.GetFaith.HighGodNameAlternate] ประสงค์ ท่านอาจยังสามารถเอาชนะ #italic มาลิคูเลีย#! ได้"\n\n"แต่ข้าต้องไปแล้ว เพราะข้ามีความรู้ที่ต้องแสวงหาที่อื่น""
 fp3_yearly.8043.a: "ข้าจะซื้อหนังสือทั้งหมดที่ท่านต้องการให้ท่าน ข้ายังต้องการท่านอยู่"
 fp3_yearly.8043.b: "บางทีมันอาจจะสิ้นหวังมาตั้งแต่แรกแล้ว"
 fp3_polymath_stays_flavor: "[persian_polymath.GetFirstNameNoTooltip] ยังคงอยู่ในราชสำนักของท่าน"

 fp3_yearly.8044.t: "แสงสว่างแห่งโลก"
 fp3_yearly.8044.desc: "เป็นเวลานานเหลือเกินที่โลกรู้สึกหม่นหมองและเศร้าสร้อย สิ่งที่ข้าเคยเพลิดเพลินดูเหมือนเป็นสิ่งรบกวนชั่วคราว ปราศจากความหมายหรือแก่นสาร ความคิดของข้าจะล่องลอยไปยังดินแดนที่มืดมิดและหดหู่ และความฝันของข้าก็เต็มไปด้วยความกลัว แต่ความสิ้นหวังที่ค้างคาอยู่นานนั้นได้เริ่มจางหายไป\n\nขณะที่ข้ามองดูดินแดนรอบตัว ข้าเห็นแสงส่องทะลุเมฆ ข้าเห็นความงามของโลกและความลึกลับทั้งหมดของมัน อาจเป็น เพราะการรักษาทั้งหมดที่ [persian_polymath.GetFirstName] สั่งให้ข้า หรืออาจเป็นอย่างอื่น ข้าอาจไม่มีวันรู้ แต่บางสิ่งได้เปลี่ยนแปลงไปภายในตัวข้า ข้ารู้สึกสมบูรณ์อีกครั้ง"
 fp3_yearly.8044.a: "ข้าควรทะนุถนอมความรู้สึกนี้ไว้ มันอาจไม่คงอยู่ตลอดไป"

 # Sick Monkey Chain 
 fp3_yearly.8045.t: "ห่อปริศนา"
 fp3_yearly.8045.desc: "ระหว่างการเดินเล่นในคืนแสงจันทร์ ข้าได้พบกับ [buzina_enthusiast.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))] ของข้า กำลังประคองห่อของขนาดเท่าทารก แต่รูปลักษณ์ภายนอกอาจหลอกลวงได้ — มีเสียงแปลก ๆ ดังออกมาจากผ้าห่อ และใบหน้าของ [buzina_enthusiast.GetNamePossessiveNoTooltip] ก็มีรอยขีดข่วนมากมาย\n\n"นี่ไม่ใช่เด็ก [ROOT.Char.Custom('FormOfAddressForLiege')] แต่เป็นลิง" [buzina_enthusiast.GetSheHe] กระซิบ "ขณะเก็บภาษีเพื่อ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ข้าได้รับนางมาเป็นการชำระแทนทองคำ ว่ากันว่านางเคยเป็นของกษัตริย์ตะวันออกผู้ยิ่งใหญ่ที่สอนนางเล่นหมากรุก แต่อนิจจา นางล้มป่วยและกลายเป็น... ก้าวร้าวไปบ้าง"\n\n[buzina_enthusiast.GetSheHe|U] ยื่นห่อของให้ข้าและพูดต่อ "แต่แน่นอนว่า ภายใต้การดูแลของท่าน นางจะกลับมาแข็งแรงในไม่ช้า""
 fp3_yearly.8045.a: "แพทย์ของข้าคงมียาบางอย่าง..."
 fp3_yearly.8045.b: "ข้าจ้างเจ้ามาเก็บทอง #EMP ไม่ใช่ลิง!#!"
 fp3_yearly.8045.c: "ข้าไม่แน่ใจเกี่ยวกับเรื่องนี้..."
 sick_monkey_flavor_desc: "ลิงที่เล่นหมากรุกได้คงจะน่าบันเทิงใจอย่างแน่นอน"
 playing_with_monkey.tt: "ปลดล็อก [decision|E] การเล่นกับลิง ตราบเท่าที่ท่านยังเลี้ยงนางไว้"
 fp3_inspired_tax_collector: "[buzina_enthusiast.GetShortUIName] พยายามที่จะเก็บภาษีให้ดีขึ้น"

 fp3_yearly.8046.t: "ยารักษาลิง"
 fp3_yearly.8046.desc: ""เท่าที่ข้ารู้" [court_physician.GetName] กล่าว "ลิงเป็นเผ่าพันธุ์ของกะโยมาร์ท มนุษย์คนแรก สภาพร่างกายของพวกมันคล้ายกับของเรา และบางทีสภาพจิตวิญญาณก็ เช่นกัน บางตัว ข้าได้ยินมาว่า พูดได้ด้วยซ้ำ!"\n\n"ข้าควรจะสามารถรักษาเจ้าตัวเล็กนี้ให้หายจากอาการป่วยได้ แต่วิธีที่ดีที่สุดคือยาต้มสมุนไพร ซึ่งมีราคาแพงในการจัดหา ทางเลือกอื่นคือการควบคุมอาหารด้วยปลาเค็มและกำยาน..."\n\n[court_physician.GetSheHe|U] มองกรงเล็บที่คมกริบของลิงด้วยความกังวลอย่างยิ่ง"
 fp3_yearly.8046.a: "อย่าเสียดายค่าใช้จ่าย"
 fp3_yearly.8046.b: "นางแข็งแรง การควบคุมอาหารที่ดีต่อสุขภาพก็เพียงพอแล้ว"
 fp3_wait_and_see.tt: "เวลาเท่านั้นที่จะบอกได้ว่าการรักษาจะได้ผลหรือไม่"
 monkey_recover_better_chances_tt: "โอกาสที่ลิงจะฟื้นตัวจะดีขึ้น"

 playing_chess_with_monkey.tt: "ตอนนี้ท่านสามารถใช้ [interaction|E] การท้าทายเล่นเกมกระดาน ได้ตราบเท่าที่ลิงยังมีชีวิตอยู่"

 fp3_yearly.8047.t: "รู้สึกดีขึ้น"
 fp3_yearly.8047.desc: "แพทย์ของข้ามาหาข้าพร้อมกับอุ้มลิงป่วยที่ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('buzina_enthusiast'))] ของข้า [buzina_enthusiast.GetName] เคยนำกลับบ้านมาก่อนหน้านี้\n\n"เจ้าเหนือหัวของข้า ข้ายินดีที่จะรายงานว่าลิงได้กลับมามีชีวิตชีวาอีกครั้งและอารมณ์ของนางก็เย็นลงแล้ว แม้ว่านางดูเหมือนจะไม่ใช่ #EMP ปรมาจารย์#! หมากรุก แต่นางก็ได้รับการฝึกฝนให้เล่นเกมในระดับหนึ่งอย่างแน่นอน"\n\nถึง แม้ว่าลิงตัวนี้จะไม่ใช่ปรมาจารย์ในเกม แต่ผู้คนก็จะมาจากแดนไกลเพื่อชมความมหัศจรรย์ของการฝึกฝน เช่นนี้..."
fp3_yearly.8047.a: "ถึงเวลาส่งคำเชิญแล้ว!"

 monkey_died_from_sickness_toast: "ลิงสัตว์เลี้ยงของท่านตายจากอาการป่วย"

 ##################################################
 # ZOROASTRIAN EVENTS 
 ##################################################

 fp3_yearly.8050.t: "ชะตากรรมของคนตาย"
 fp3_yearly.8050_zoroastrian.desc: "ในฐานะ [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] เรามีหน้าที่อันศักดิ์สิทธิ์ในการต่อสู้กับอิทธิพลของนาซู เดวาแห่งความเสื่อมสลาย ดังนั้น [dakhma_enthusiast.GetCouncilTitle] ของข้า [dakhma_enthusiast.GetFirstName] จึงดูค่อนข้างกังวลกับข่าวที่ [dakhma_enthusiast.GetSheHe] นำมาจาก [dakhma_county.GetName]"
 fp3_yearly.8050_unzoroastrian.desc: "มีข้อร้องเรียนเกี่ยวกับพิธีศพของราษฎรโซโรอัสเตอร์ของข้าใน [dakhma_county.GetName] และ [dakhma_enthusiast.GetCouncilTitle] ของข้า [dakhma_enthusiast.GetFirstName] ดูเหมือนจะกังวลเป็นพิเศษ"
 fp3_yearly.8050_early_period.desc: "\n\n"ในอดีต นายท่าน/นายหญิงผู้มีปัญญาของข้า [ROOT.Char.GetTitleTierName]" [dakhma_enthusiast.GetSheHe] เริ่มต้น "ธรรมเนียมคือการทิ้งร่างของผู้ตายไว้ในถิ่นทุรกันดาร ที่ ซึ่งพวกมันไม่สามารถปนเปื้อนธาตุศักดิ์สิทธิ์ทั้งสามได้"\n\n"แต่เมื่อการตั้งถิ่นฐานเติบโตขึ้นใน [dakhma_county.GetNameNoTierNoTooltip] ก็ไม่มีพื้นที่เพียงพออีกต่อไป และผู้คนเริ่มรบกวนผู้ตายโดยไม่ได้ตั้งใจ เราควรสร้าง #italic ดัคมา#! หอคอยแห่งความเงียบ ที่ ซึ่งผู้ตายสามารถพักอาศัยได้อย่างปลอดภัย เปิดให้สุนัขและฝูงแร้ง จนเหลือเพียงธุลีดิน""
 fp3_yearly.8050_late_period.desc: "\n\n"นานมาแล้ว ท่าน [ROOT.Char.GetTitleTierName] ผู้ปรีชา" [dakhma_enthusiast.GetSheHe] กล่าว "มีการสร้าง #italic ดัคมา#! ขนาดเล็กขึ้นใน [dakhma_county.GetNameNoTierNoTooltip] ที่ ซึ่งร่างผู้ตายสามารถถูกเปิดเผยต่อธาตุต่างๆ และนกกินซากได้ แต่หอคอยนี้เก่าและผุพัง และมีความกังวลว่าซากศพได้รั่วไหลออกมา ปนเปื้อนธาตุศักดิ์สิทธิ์ทั้งสาม"\n\n"คนท้องถิ่นจะขอบคุณอย่างยิ่งหากเราช่วยพวกเขาสร้างหอคอยใหม่ ที่ ซึ่งผู้ตายของพวกเขาสามารถพำนักได้อย่างปลอดภัย""
 fp3_yearly.8050.a: "สถาปนิกของข้า [architect.GetFirstNameNoTooltip] สามารถช่วยเราลดขั้นตอนบางอย่างได้ที่นี่..."
 fp3_yearly.8050.b: "แน่นอน ข้าสามารถบริจาคทรัพย์สมบัติส่วนหนึ่งของข้าเพื่อการนี้ได้"
 fp3_yearly.8050.c: "พวกนอกรีตเหล่านั้นสามารถทิ้งคนตายของพวกเขาไว้ในคูน้ำได้ ตามที่ข้าสนใจ"
 fp3_yearly.8050.d: "ฟังดูแพง สิ่งที่เคยได้ผลในอดีต ก็สามารถได้ผลในตอนนี้ เช่นกัน"
 fp3_zoroastrian_courtiers_and_vassals_happy: "[courtiers|E], [guests|E] และ [vassals|E] ที่นับถือศาสนา [GetReligionByKey('zoroastrianism_religion').GetAdjective] อย่างเคร่งครัด จะเพิ่ม [opinion|E] ที่มีต่อท่าน"
 building_a_dakhma.failure: "[architect.GetFirstName] ออกแบบหอคอยแห่งความเงียบที่ผิดพลาด"
 building_a_dakhma.success: "[architect.GetFirstName] ออกแบบหอคอยแห่งความเงียบที่ใช้งานได้"
 fp3_cheap_architecture_flavor: "ยิ่งถูกยิ่งดี!"
 fp3_silence_architecture_success_toast: "การลดต้นทุนประสบความสำเร็จ"
 fp3_silence_architecture_failure_toast: "การก่อสร้างเป็นที่น่าสงสัย #italic อย่างยิ่ง#!"

 fp3_yearly.8051.t: "ไฟอันบริสุทธิ์ที่สุด"
 fp3_yearly.8051_opening.desc: "ไฟศักดิ์สิทธิ์ที่เคยลุกไหม้ในวิหารแห่ง [sacred_fire_province.GetName] เพิ่งจะ"
 fp3_yearly.8051_torrential_rain: "ดับลงด้วยฝนที่ตกหนักมาก จนรั่วซึมผ่านรอยแตกบนหลังคาวิหารและลงไปถึงไฟด้านล่าง"
 fp3_yearly.8051_earthquake: "ดับลงเมื่อเกิดแผ่นดินไหวที่วิหาร เกือบจะ ทำให้อาคารแยกออกเป็นสองส่วน"
 fp3_yearly.8051_sandstorm: "ดับลงด้วยพายุทรายที่รุนแรงมากจนพังประตูวิหาร"
 fp3_yearly.8051_gust_of_wind: "ดับลงด้วยลมกระโชกแรงเย็นยะเยือก ซึ่งต้องมาจากรอยแตกที่ซ่อนอยู่ในกำแพงวิหาร"
 fp3_yearly.8051_islamic_zealots: "ถูกดับโดยกลุ่มมุสลิมหัวรุนแรง ซึ่งบุกเข้าไปในวิหารและทำลายล้างด้วยวิธีที่สร้างสรรค์มาก"
 fp3_yearly.8051_invisible_hand: "และดับลงอย่างลึกลับ ราวกับด้วยมือที่มองไม่เห็น"
 fp3_yearly.8051_ending.desc: "แม้จะมีลางร้ายนี้ [magi.GetName] ดูเหมือนจะไม่สิ้นหวัง\n\n"เราต้องจุดไฟขึ้นใหม่" [magi.GetSheHe] ประกาศ "เปลวไฟที่บริสุทธิ์และยิ่งใหญ่ที่สุดคือ #italic อาตัช เบห์ราม#! ไฟแห่งชัยชนะ เกิดจากสายฟ้าท่ามกลางเมฆ แต่ เนื่องจากนี่เป็นวิหารขนาดเล็ก บางทีเราควรจะพอใจกับ #italic อาตัช อาดารัน#! ไฟแห่งไฟ ที่เตาหลอมของช่างทองสามารถให้เราได้ หรือแม้ แต่ระดับต่ำสุด #italic อาตัช ดาดกาห์#! ที่สามารถถวายได้จากเปลวไฟในครัวเรือนใดๆ...""
 fp3_yearly.8051.a: "ต้องใช้สายฟ้าเท่านั้น ข้าจะหามันมาให้ท่าน"
 fp3_yearly.8051.b: "ให้เราหาเปลวไฟของช่างทองให้ท่านเถิด"
 fp3_yearly.8051.c: "ข้าไม่กังวลเรื่องลางบอกเหตุมากนัก เปลวไฟในครัวเรือนก็เพียงพอแล้ว"
 fp3_yearly.8051_chasing_lightning.tt: "ท่านจะรอพายุฝนฟ้าคะนองครั้งต่อไป..."

 fp3_yearly.8052.t: "ไล่ตามเมฆา"
 fp3_yearly.8052.desc: "[ROOT.Char.GetFaith.AltPriestTermPlural] คอยเตือนข้าอยู่เสมอถึงคำมั่นสัญญาที่จะหาไฟแห่งชัยชนะสำหรับวิหารใน [sacred_fire_province.GetName] ไม่ใช่ว่าข้าลืม... ข้าส่งหน่วยสอดแนมไปทุกทิศทางเพื่อมองหาพายุฝนฟ้าคะนอง เพื่อมองหาสัญญาณจาก [ROOT.GetCharacter.GetFaith.HighGodName] แต่สายฟ้ากลับหาได้ยาก\n\nแต่บัดนี้ข้ายืนอยู่ด้านนอก [ROOT.Char.Custom('ResidenceBuilding')] ของข้า ขณะที่เสียงฟ้าร้องดังสนั่นในระยะไกลและสายฟ้าฟาดแลบแปลบปลาบไปทั่วเมฆดำ คนรับใช้ของข้ารีบวิ่งไปมา พยายามจับสายฟ้าด้วยเสาสูง ขณะที่ข้าจ้องมองไปทั่วแผ่นดิน มองหาเปลวไฟใดๆ ความพยายามของเราไร้ผล - ในไม่ช้าเมฆก็สลายตัว และสายฟ้าก็หายไปในสวรรค์เบื้องสูง\n\n[ROOT.GetCharacter.GetFaith.HighGodName] นี่คือพระประสงค์ของท่านจริงหรือ? ข้าจะไม่มีวันพบไฟที่ข้าแสวงหาเลยหรือ?"
 fp3_yearly.8052.a: "ข้าควรจะนำไฟของช่างทองไปให้วิหารแทน..."
 fp3_yearly.8052.b: "ข้าอาจจะยอมรับเปลวไฟที่ด้อยกว่าก็ได้"
 fp3_give_up_the_quest.flavor: "ท่านยอมแพ้ภารกิจตามหาไฟแห่งชัยชนะ... ในตอนนี้"
  
 fp3_yearly.8053.t: "ไฟแห่งชัยชนะ"
 fp3_yearly.8053.desc: "วันแล้ววันเล่า สัปดาห์แล้วสัปดาห์เล่าผ่านไป หน่วยสอดแนมของข้าตระเวนไปทั่วอาณาจักรเพื่อหาไฟที่เกิดจากสายฟ้า แต่ก็ไร้ผล แต่เมื่อข้าเริ่มท้อแท้ ทันใดนั้นเมฆดำก็ก่อตัวขึ้นในระยะไกล เสียงฟ้าร้องดังสนั่นสะท้อนมาจากแดนไกล ข้ารีบออกจาก [ROOT.Char.Custom('ResidenceBuilding')] ของข้าไปยังพายุ พร้อมคนรับใช้ และแท้จริงแล้ว มันใกล้เข้ามา ราวกับถูกเรียกโดยมือที่มองไม่เห็น\n\nจากนั้น ตรงหน้าข้า แสงสว่างจ้าทะลุเมฆและพุ่งลงมาราวกับหอกจาก [ROOT.Char.GetFaith.DivineRealm] ฟาดใส่ต้นไม้โดดเดี่ยวต้นหนึ่ง ไม้แห้งติดไฟทันที ลุกไหม้ด้วยเปลวไฟสีขาว บริสุทธิ์ดุจวิญญาณ #italic ฟราวาชิ#! ข้าพบแล้ว ไฟแห่งชัยชนะ มันมาหาข้า!"
 fp3_yearly.8053.a: "ข้าไม่อยากจะเชื่อเลย..."


 ##################################################
 # SCHOLARSHIP EVENTS 
 ##################################################
 fp3_scholarship.0001.t: "นักปราชญ์มาถึงแล้ว"
 fp3_scholarship.0001.desc: "[scholar.GetTitledFirstName] ได้มาถึงโดยหวังว่าจะได้รับการอุปถัมภ์ทางวิทยาศาสตร์"

 fp3_scholarship.1000.t: "อารยภัฏคนที่สอง"
 fp3_scholarship.1000.desc: "ชื่อเสียงด้านคณิตศาสตร์ของอินเดียได้มาถึงหูข้าแล้ว แม้ แต่นักเรียนเลขคณิตที่ต่ำต้อยที่สุดก็ยังเอ่ยถึง หากข้าจะเติมเต็มห้องโถงในราชสำนักของข้าด้วยนักปราชญ์ [nearby_indian_ruler.GetCulture.GetName] แล้ว บางที [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] อาจกลายเป็นศูนย์กลางทางคณิตศาสตร์ในสิทธิของตนเองได้\n\nข้าอาจขอให้ [nearby_indian_ruler.GetTitledFirstName] ส่งนักปราชญ์ดังกล่าวหลายคนมาให้ข้า แต่ [nearby_indian_ruler.GetSheHe] จะยอมรับข้อเสนอดังกล่าวหรือไม่?"
 fp3_scholarship.1000.a: "[nearby_indian_ruler.GetSheHe|U] จะไม่ปฏิเสธคำขอของข้าอย่างแน่นอน"
 fp3_scholarship.1000.b: "ของขวัญอันงามจะ ทำให้ข้อเสนอน่าสนใจยิ่งขึ้น"
 fp3_scholarship.1000.c: "นักปราชญ์ [ROOT.Char.GetCulture.GetNameNoTooltip|U] ไม่ต้องการความช่วยเหลือจาก [nearby_indian_ruler.GetCulture.GetNameNoTooltip]!"
 fp3_scholarship.1000.duel_success: "[nearby_indian_ruler.GetNameNoTooltip] ยอมรับคำขอของข้า"
 fp3_scholarship.1000.duel_success_tt: "นักคณิตศาสตร์ [nearby_indian_ruler.GetCulture.GetNameNoTooltip] หลายคนจะมาถึงราชสำนักของข้าในไม่ช้า"
 fp3_scholarship.1000.duel_failure: "[nearby_indian_ruler.GetNameNoTooltip] หัวเราะเยาะความอวดดีของข้า"
 fp3_scholarship.1000.gift_failure: "[nearby_indian_ruler.GetNameNoTooltip] เก็บของขวัญของข้าไว้"
 fp3_scholarship.1000.native_tt: "นักคณิตศาสตร์แห่งวัฒนธรรม [SCOPE.GetRootScope.GetCharacter.GetCulture.GetNameNoTooltip] จะได้รับการยกย่องสู่ราชสำนักด้วยเงินทุนของเรา"
 fp3_scholarship.1001.t: "นักคณิตศาสตร์มาถึงแล้ว"
 fp3_scholarship.1001.desc: "[mathematician.GetTitledFirstName] ถูกส่งมาโดย [nearby_indian_ruler.GetTitledFirstNameNoTooltip] เพื่อเข้าร่วมราชสำนักของข้า"
 fp3_scholarship.1001.native.desc: "[mathematician.GetTitledFirstName] ได้เข้าร่วมราชสำนักของข้าแล้ว"
 fp3_scholarship.1000.d: "ข้าไม่มีทั้งเวลาและความสนใจในเรื่องนี้"

 fp3_scholarship.1010.t: "เมจัสผู้โดดเดี่ยว"
 fp3_scholarship.1010.desc_dying_faith: ""เราเพียงปรารถนาที่จะปฏิบัติตามศรัทธาของเราอย่างสงบสุขจนถึงวันสุดท้ายของชีวิต หากท่านสัญญา เช่นนี้กับเรา ข้าจะรับใช้ท่านเป็นการส่วนตัวจนกว่าหัวใจของข้าจะหยุดเต้น"\n\nแม้ว่าศรัทธา [magus_faith.GetName] จะกำลังจะตายอย่างแน่นอน แต่ผู้นับถือที่หลงผิดดูเหมือนจะยังคงอยู่ในวิหารไฟที่ถูกทิ้งร้างของ [magus_county.GetProvince.GetCounty.GetName] นักบวชผู้นี้ได้ทอดกายลงต่อหน้า [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] ของข้า อ้อนวอนขอความเมตตาจากข้า\n\n"
 fp3_scholarship.1010.desc_living_faith: ""โปรดเมตตา! เราเพียงปรารถนาที่จะให้เกียรติบรรพบุรุษของเรา หากท่านให้ความคุ้มครองแก่เรา ข้าสัญญาว่าจะรับใช้ท่านเป็นการส่วนตัวจนกว่าจะถึงวันตาย"\n\nศรัทธา [magus_faith.GetName] ยังคงเป็นหนามยอกอกข้า ดูเหมือนว่าวิหารไฟแห่ง [magus_county.GetProvince.GetCounty.GetName] จะร้อนแรงขึ้นอีกครั้งภายใต้ความมืดมิดยามค่ำคืน [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] ของข้าและข้าดูเหมือนจะจับเมจัสผู้ทรยศได้ในพิธีกรรมอันลึกลับของเขา แต่แทนที่จะหลบหนี เขากลับทอดกายลงต่อหน้าข้าอย่างกล้าหาญ"
 fp3_scholarship.1010.a: "ไม่มีวัน [ROOT.Char.GetFaith.HighGodName] ประสงค์ให้เจ้าล่มสลาย!"
 fp3_scholarship.1010.b: "ข้าจะให้ความคุ้มครองแก่ [magus_county.GetNameNoTooltip]"
 fp3_scholarship.1010.b.tt: "[magus_county.GetNameNoTooltip] อาจไม่ถูกเปลี่ยนศาสนาเป็นเวลา 20 ปี\n[magus.GetShortUINameNoTooltip] ไม่สามารถเปลี่ยนศาสนาได้เลย"
 fp3_scholarship.1010.c: "ไม่มีสัญญาสำหรับอนาคต แต่เราสามารถปล่อยเจ้าไปได้"

 fp3_scholarship.2000.t: "มีค่าเท่ากับน้ำหนักของมัน"
 fp3_scholarship.2000.desc: "การจัดหากระดาษจากตะวันออกเกือบจะหมดสิ้นลงแล้ว โดยกวีชั้นผู้น้อยบางคนหันไปใช้ใบลานและเปลือกไม้เพื่อบันทึกความคิดของตน ในไม่ช้าแม้ แต่นักปราชญ์ประจำราชสำนักของข้า [court_scholar.GetTitledFirstName] ก็ไม่สามารถหาใบไม้สีทองได้อย่างน่าเชื่อถือ\n\n"ข้าคงต้องกลับไปใช้แผ่นหนัง แต่สมัยนี้หายากเหลือเกิน กระดาษเพิ่มคงจะเป็นทางออกที่ดีกว่าอย่างแน่นอน...""
 fp3_scholarship.2000.a: "กระดาษทั้งหมดจะถูกยึดเพื่อวัตถุประสงค์ของท่าน"
 fp3_scholarship.2000.b: "ถ้า เช่นนั้นเราต้องนำเข้ากระดาษ"
 fp3_scholarship.2000.c: "ท่านจะต้องใช้สิ่งที่มีอยู่ให้เกิดประโยชน์สูงสุด"

 fp3_scholarship.2010.t: "ปัญญาเหลว"
 fp3_scholarship.2010.desc: "ผู้ตรวจพิจารณาของข้าแจ้งว่านักปราชญ์ประจำราชสำนักของข้า [court_scholar.GetTitledFirstName] กำลังดื่มเหล้าอย่างลับๆ กับนักปราชญ์ชาวต่างชาติ\n\nหากเป็นกับคนอื่น ข้าคงจะยุติการหมั้นหมายและตักเตือน [court_scholar.GetTitledFirstNameNoTooltip] อย่างจริงจัง แต่ [court_scholar.GetSheHe|U] ดูเหมือนจะกำลังสนทนาอย่างให้ความกระจ่างกับสหายร่วมดื่มของ [court_scholar.GetHerHis] หรืออย่างน้อยข้าก็ได้รับแจ้ง เช่นนั้น"
 fp3_scholarship.2010.a: "หน้าที่ของเราต่อ [ROOT.Char.GetFaith.HighGodName] มาก่อน"
 fp3_scholarship.2010.b: "บางทีพวกเขาอาจจะแค่ดื่มชา?"

 fp3_scholarship.2020.t: "ความเข้าใจอันน่าสยดสยอง"
 fp3_scholarship.2020.desc: ""การศึกษาของข้ามาถึงทางตันแล้ว" นักปราชญ์ประจำราชสำนักของข้า [court_scholar.GetTitledFirstNameNoTooltip] บอกข้า [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', court_scholar)] "มีเพียงเท่านี้ที่สามารถรวบรวมได้จากหนังสือ แต่ถ้าท่านเพียงให้ยืม [specimen.GetTitledFirstName] แก่ข้าสักครู่ ข้ามั่นใจว่าเราจะสามารถบรรลุความก้าวหน้าครั้งสำคัญร่วมกันได้"\n\n[court_scholar.GetSheHe|U] ไม่สามารถรับประกันความปลอดภัยของ [specimen.GetTitledFirstNamePossessiveNoTooltip] ได้"
 fp3_scholarship.2020.a: "ท่านได้รับอนุญาตอย่างเต็มที่จากข้า"
 fp3_scholarship.2020.b: "เก็บการทดลองที่บิดเบี้ยวของท่านไว้ในบันทึกของท่านเถิด"

 fp3_scholarship.2030.t: "ผลการวิจัยได้รับการตีพิมพ์"
 fp3_scholarship.2030.desc: ""...และด้วยความยินดีอย่างยิ่งที่ข้าสามารถรายงานความคืบหน้าอย่างต่อเนื่องในการทำความเข้าใจ [ROOT.Char.Custom('education_conversation_subject')]"\n\nบางครั้งเป็นการยากที่จะให้เหตุผลในการจ้างนักปราชญ์ไว้ในบัญชีเงินเดือนของเรา งานของพวกเขาไม่ค่อยเป็นประโยชน์โดยตรงต่ออาณาจักร\nไม่ต้องสงสัยเลยว่านี่คือสิ่งที่นักปราชญ์ประจำราชสำนักของข้า [court_scholar.GetName] ตระหนักดี [court_scholar.GetHerselfHimself] รายงานความคืบหน้าโดยละเอียดของวันนี้ถูกนำเสนอด้วยความกระตือรือร้นจนเกือบจะไม่จริงใจ"
 fp3_scholarship.2030.a: "ความคืบหน้าย่อมเป็นสิ่งที่ดี"
 fp3_scholarship.2030.tt: "[court_scholar.GetNameNoTooltip] ได้รับประโยชน์จากศูนย์การศึกษาระดับสูงภายในอาณาจักรของท่าน"

 fp3_research_project_title: "การวิจัย:"

 fp3_scholarship_research_success_loss_effect: "[research_project|E] ของ [inspiration_owner.GetShortUINamePossessive|U] จะมีโอกาสสำเร็จ #N น้อยลง#!"
 fp3_scholarship_research_success_slight_loss_effect: "[research_project|E] ของ [inspiration_owner.GetShortUINamePossessive|U] จะมีโอกาสสำเร็จ #N น้อยลงเล็กน้อย#!"
 fp3_scholarship_research_success_gain_effect: "[research_project|E] ของ [inspiration_owner.GetShortUINamePossessive|U] จะมีโอกาสสำเร็จ #P สูงขึ้น#!"
 fp3_scholarship_research_success_slight_gain_effect: "[research_project|E] ของ [inspiration_owner.GetShortUINamePossessive|U] จะมีโอกาสสำเร็จ #P สูงขึ้นเล็กน้อย#!"
 
 fp3_scholarship.8000.t: "$game_concept_research_project$ ใหม่"
 fp3_scholarship.8000.desc: "นักปราชญ์ประจำราชสำนักของข้า [court_scholar.GetName] รีบมาหาข้าพร้อมคนรับใช้หลายคนตามมา ทุกคนถือหนังสือ ม้วนคัมภีร์ หรือแผ่นหนังโบราณ\n\n"ข้าเชื่อว่าข้าสามารถบรรลุความก้าวหน้าครั้งสำคัญได้ หากเพียงได้รับเวลาเพียงพอ เงินทุนเพียงพอ และหมึกเพียงพอที่จะ ทำให้แม่น้ำสินธุเป็นสีดำ""
 fp3_scholarship.8000.a: "รับหน้าที่ไปเถิด [court_scholar.GetFirstNameNoTooltip]"
 fp3_scholarship.8000.b: "บางทีอาจจะเป็นเวลาอื่น?"
 fp3_scholarship.8000.a.tt: "[court_scholar.GetFirstNameNoTooltip] จะเริ่มดำเนิน [research_project|E]"

 fp3_scholarship.8500.t: "เสน่ห์แห่งทองคำ"
 fp3_scholarship.8500.desc: ""ข้ามั่นใจว่าข้าสามารถเปิดเผยความลับของการสร้างสรรค์ได้ หากท่านเพียงจัดหาเครื่องมือและผู้ช่วยที่เหมาะสมให้ข้า!"\n\n[court_scholar.GetName] นักปราชญ์ประจำราชสำนักของข้า พูดมาสักพักแล้ว [court_scholar.GetSheHe|U] กำลังอ้อนวอนให้ข้าอนุญาตให้ [court_scholar.GetHerHim] ใช้ #EMP ทองคำและเงินของข้า#! เพื่อพยายามเปิดเผยความลับว่าธาตุต่างๆ เช่น #EMP ทองคำ#! และ #EMP เงิน#! ถูกสร้างขึ้นมาได้อย่างไร\n\n[court_scholar.GetFirstNameNoTooltip] ตื่นเต้นอย่างเห็นได้ชัด และน่าประทับใจมากที่ [court_scholar.GetSheHe] สามารถเข้าใจบันทึกลับๆ เช่นที่ [court_scholar.GetSheHe] ได้ถอดรหัสในเรื่องนี้ได้ แต่มันไม่ชัดเจนว่านี่จะเป็นความพยายามที่ทำกำไรได้หรือไม่"
 fp3_scholarship.8500.a.tt: "[court_scholar.GetFirstNameNoTooltip] จะเริ่มดำเนิน [inspiration|E] การเล่นแร่แปรธาตุ"

 fp3_scholarship.8600.t: "พลังแห่งอักษร"
 fp3_scholarship.8600.desc: ""การสนับสนุนอย่างต่อเนื่องของท่านนั้นสูงส่งและไม่เห็นแก่ตัวอยู่แล้ว แต่การสังเกตการณ์ที่ยอดเยี่ยม ซึ่งไม่ได้ถูกเขียนลงไปนั้นเสี่ยงต่อการถูกลืม! ใครจะรู้ความคิดของข้าเมื่อข้าตายไปและไม่สามารถพูดถึงมันได้อีกต่อไป? โลกคงจะเป็นสถานที่ที่น่าสงสารหากพวกมันไม่ได้รับการอนุรักษ์"\n\n[court_scholar.GetName] นักปราชญ์ประจำราชสำนักของข้า มีโครงการใหม่ [court_scholar.GetSheHe|U] ต้องการโน้มน้าวให้ข้าให้ทุนสนับสนุนการสร้างหนังสือเล่มใหม่ ต้นฉบับที่หรูหรา ซึ่ง [court_scholar.GetSheHe] อ้างว่าจะ ทำให้คู่แข่งของข้าซีดเผือดด้วยความอิจฉา\nบางทีความคิดนี้อาจเป็นเพื่อเกียรติภูมิของ [court_scholar.GetHerHis] มากเท่ากับของข้า แต่นั่นไม่ได้หมายความว่ามันเป็นความคิดที่ไม่ดีเสมอไป..."
 fp3_scholarship.8600.a.tt: "[court_scholar.GetFirstNameNoTooltip] จะเริ่มดำเนิน [inspiration|E] เพื่อเขียนหนังสือ"

 fp3_scholarship.8999.tt_failure: "การวิจัยของ [court_scholar.GetShortUINamePossessiveNoTooltip] ล้มเหลวในการผลิตสิ่งที่มีประโยชน์ใดๆ"
 fp3_scholarship.8999.tt_success: "[court_scholar.GetShortUINameNoTooltip] ค้นพบความก้าวหน้าทางวิทยาศาสตร์เล็กน้อยสำหรับตระกูล [THIS.Char.GetHouse.GetNameNoTooltip]"
 fp3_scholarship.8999.tt_crit_success: "[court_scholar.GetShortUINameNoTooltip] ค้นพบนวัตกรรมใหม่สำหรับวัฒนธรรม [THIS.Char.GetCulture.GetName]"
 
 fp3_scholarship.8100.t: "$fp3_research_project_title$ ห้องสมุดที่ดีขึ้น"
 fp3_scholarship.8100.desc: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้บ่นไม่หยุดเกี่ยวกับสภาพของห้องสมุดหลวง โดยนำกองม้วนคัมภีร์สีเหลืองและหนังสือที่กำลังผุพังมาต่อหน้าข้า\n\n"ตำราบางเล่มเหล่านี้ล้าหลังไปหลายร้อยปี หรือมากกว่านั้น ข้าจะทำการวิจัยล่าสุดด้วยตำราโบราณ เช่นนี้ได้อย่างไร?""
 fp3_scholarship.8100.a: "ห้องสมุดหลวงจะได้รับการตก แต่งตามความปรารถนาของท่าน"
 fp3_scholarship.8100.b: "ห้องสมุดหลวงสมบูรณ์แบบตามที่เป็นอยู่"

 fp3_scholarship.9000.t: "$fp3_research_project_title$ ความล้มเหลว"
 fp3_scholarship.9000.desc: ""มันไม่มีประโยชน์!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ร้องออกมาต่อหน้าข้า ดวงตาของ [inspiration_owner.GetHerHis|U] ดำคล้ำจากการอดนอนนับไม่ถ้วน\n\n"ข้ามองไม่เห็นอะไรนอกจากทะเลแห่งตัวเลข ข้าจะต้องละทิ้งโครงการนี้ อย่างน้อยก็ในตอนนี้""
 fp3_scholarship.9000.a: "ตกลงตามนั้น"
 fp3_scholarship.9000.b: "ข้าจ้างเจ้ามาวิจัย ไม่ใช่มาแก้ตัว!"

 fp3_scholarship.9100.t: "$fp3_research_project_title$ การค้นพบใหม่"
 fp3_scholarship.9100.desc: ""[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]! งานของข้าเสร็จแล้ว"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พูดถึงการค้นพบของพวกเขาอย่างยืดยาว และมันอาจส่งผลกระทบต่ออาณาจักรของเราอย่างไร ข้าพยายามจะพูดแทรก แต่ก็ไร้ผล\n\nเมื่อ [inspiration_owner.GetSheHe] นั่งลงในที่สุด ข้าสามารถเห็นความสับสนของตัวเองสะท้อนอยู่ในดวงตาของข้าราชบริพาร แต่ข้าก็ยังคงให้คำตอบเดียวที่ข้าคิดได้"
 fp3_scholarship.9100.a: "ทำได้ดีมาก [inspiration_owner.GetShortUINameNoTooltip]"

 fp3_scholarship.9200.t: "$fp3_research_project_title$ นวัตกรรมใหม่"
 fp3_scholarship.9200.desc: ""[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]!" ร้องออกมาต่อหน้าข้า ข้าหันไปพบว่าดวงตาของ [inspiration_owner.GetHerHis] อ่อนล้าด้วยความยินดีและแขนเต็มไปด้วยลายเส้นขยุกขยิก งานของ [inspiration_owner.GetHerHis] เสร็จสิ้นแล้ว\n\nข้าจะเข้าใจความสำคัญของการค้นพบของ [inspiration_owner.GetHerHis] ในภายหลังเท่านั้น และข้าจะไม่มีชีวิตอยู่นานพอที่จะเห็นพวกมันเปลี่ยนแปลงประวัติศาสตร์ทั้งหมด แต่สำหรับตอนนี้ มันเพียงพอแล้วที่ข้าจะกล่าวว่า:"
 fp3_scholarship.9200.a: "ทำได้ดีมาก"

 fp3_scholarship.9900.t: "$fp3_research_project_title$ ถูกยกเลิก"
 fp3_scholarship.9900.tt: "[court_scholar.GetShortUIName|U] ได้ถึงแก่กรรมและไม่สามารถดำเนินการวิจัยของ [court_scholar.GetHerHis] ต่อไปได้"
 fp3_scholarship.9901.tt: "[court_scholar.GetShortUIName|U] ไม่ใช่ $court_scholar_court_position$ ของข้าอีกต่อไปและไม่สามารถดำเนินการวิจัยของ [court_scholar.GetHerHis] ต่อไปได้"

 # Al-Khul Event
 fp3_h_yearly.0001.t: "เสน่ห์แห่งอัล-คุล"
 fp3_h_yearly.0001.desc.main: "ขณะที่ข้ากำลังพักผ่อนอยู่ในมุมเงียบๆ ของ [ROOT.Char.Custom( 'FortifiedBuilding' )] ใน [ROOT.GetCharacter.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip] พร้อมแก้ว [ROOT.Char.Custom('RegionalAlcoholicDrink')] ในมือ [ROOT.Char.Custom2('RelationToMe', ulema_member)] ของข้า [ulema_member.GetName] เข้ามาใกล้ด้วยสีหน้าเคร่งขรึม\n\n"ความหลงใหลใน #italic อัล-คุล#! ของท่านช่างน่าละอาย!\nครึ่งหนึ่งของผู้คนในราชสำนักนี้หมดความเคารพในตัวท่าน และอีกครึ่งหนึ่งก็สูญเสียสำนึกทางศีลธรรมของตนเองไปแล้ว! บนท้องถนน ผู้ไม่พอใจกำลังเย้ยหยันกฎเกณฑ์แห่งศรัทธาของเราอย่างเปิดเผย ซึ่งสะท้อนถึงบาปของเจ้านายของพวกเขาในวังแห่งนี้!"\n\n[ulema_member.GetNameNoTooltip|U] กำลังเดือดดาล [ulema_member.GetSheHe] กำลังตะโกนและดึงดูดความสนใจ ข้าราชบริพารบางคนค่อยๆ วางแก้วของตนลงอย่างเงียบๆ กระตือรือร้นที่จะไม่ดึงดูดความสนใจของนักบวชผู้โกรธเกรี้ยว"
 fp3_h_yearly.0001.a: "ช่างกล้าพูด สำหรับเพื่อนทาสของ [ulema_member.Custom('RegionalAlcoholicDrink')]!"
 fp3_h_yearly.0001.a.notif.t: "จงทำตามที่ข้าพูด ไม่ใช่ตามที่ข้าทำ!"
 fp3_h_yearly.0001.b: "แม้ว่า [ROOT.Char.Custom('RegionalAlcoholicDrink')] อาจยับยั้งความคิด แต่มันก็ช่วยปลอบประโลมจิตวิญญาณ"
 fp3_h_yearly.0001.bb: "การดื่มคือความสุขของชาว [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] ทั้งปวง เราไม่สามารถดำรงอยู่ได้หากปราศจากความสุขนั้น!"
 fp3_h_yearly.0001.b.desc: "ท่านพยายามโน้มน้าว [ulema_member.GetFirstNameNoTooltip] และราชสำนักของท่าน ว่าการดื่มอาจเป็นประโยชน์ได้"
 fp3_h_yearly.0001.b.success: "ท่านสามารถ ทำให้ [ulema_member.GetFirstNameNoTooltip] อับอายได้สำเร็จ"
 fp3_h_yearly.0001.b.failure: "ท่าน ทำให้ตัวเองกลายเป็นตัวตลก"
 fp3_h_yearly.0001.c: "ข้ายินดีที่จะบริจาคเพื่อการกุศล"
 fp3_h_yearly.0001.c.tt: "ท่านพยายามติดสินบน [ulema_member.GetNameNoTooltip]"
 fp3_h_yearly.0001.c.success: "การบริจาค ทำให้การคัดค้านของ [ulema_member.GetNameNoTooltip] เงียบลง"
 fp3_h_yearly.0001.c.failure: "[ulema_member.GetNameNoTooltip] ปฏิเสธสินบน"
 fp3_h_yearly.0001.d: "ข้าเป็นเพียงคนบาป แต่ข้าจะพยายามปรับปรุงตัวเองให้ดีขึ้น"
 fp3_h_yearly.0001.e: "เงียบ! ท่านลืมไปแล้วว่ากำลังพูดอยู่กับใคร"

 # Seljuk story cycle
 fp3_story_cycle_seljuks_invasion_events.0001.t: "ชนเผ่าเร่ร่อนผู้สิ้นหวัง"
 fp3_story_cycle_seljuks_invasion_events.0001.desc: "ชนเผ่าเร่ร่อน [lead_seljuk.GetCulture.GetNameNoTooltip] จากดินแดนชายแดนได้มาร้องขอต่อหน้าข้า พวกเขาแสวงหาที่จะตั้งถิ่นฐานใน [fp3_seljuk_settle_target.GetNameNoTier]"
 fp3_story_cycle_seljuks_invasion_events.0001.desc_vassal: "ในฐานะข้าในบังคับของข้า โดยเสนอความภักดีและความเชี่ยวชาญในการรบเพื่อแลกกับการ "พักพิงในเงาอันยิ่งใหญ่ของข้า"\n\nความสิ้นหวังของพวกเขาเห็นได้ชัดเจน เมื่อไม่มีที่อื่นให้ไป การปฏิเสธคำขอของพวกเขาจะนำไปสู่ความขัดแย้งอย่างหลีกเลี่ยงไม่ได้"
 fp3_story_cycle_seljuks_invasion_events.0001.desc_independent: "ในฐานะเพื่อนบ้านใหม่ของข้า โดยเสนอความเชี่ยวชาญในการรบเพื่อแลกกับส่วนหนึ่งของดินแดนของข้า\n\nความสิ้นหวังของพวกเขาเห็นได้ชัดเจน แต่กองทัพอันดุร้ายที่อยู่เบื้องหลังบอกข้าว่ามันเป็นคำขาดมากกว่าคำขอ"
 fp3_story_cycle_seljuks_invasion_events.0001.a_liege: "ตราบใดที่เจ้าตอบรับการเรียกของเจ้าเหนือหัว [fp3_seljuk_settle_target.GetNameNoTierNoTooltip] จะเป็นของเจ้า"
 fp3_story_cycle_seljuks_invasion_events.0001.a: "[fp3_seljuk_settle_target.GetNameNoTierNoTooltip] เป็นของท่าน เพื่อนบ้าน!"
 fp3_story_cycle_seljuks_invasion_events.0001.b: "ไม่มีวัน! ข้าจะไม่ยอมให้ดินแดนของข้าถูกยึดครองโดยความสกปรกของพวกเจ้า!"

# Zanj Rebellion
fp3_story_cycle_zanj_rebellion_events.0002.t: "กบฏผู้พูดจาโผงผาง"
fp3_story_cycle_zanj_rebellion_events.0002.desc: "[outspoken_rebel.GetName] กบฏผู้มีเสน่ห์ ซึ่งเป็นที่รู้จักว่าเคยพยายามก่อกบฏในบาห์เรนมาก่อน บัดนี้ถูกพบเห็นใน [outspoken_rebel.GetCurrentLocation.GetCounty.GetName]\n\nชายผู้ประกาศตนเป็นนักบุญผู้นี้ได้ตระเวนไปทั่วพื้นที่ลุ่มน้ำเค็ม ก่อกวนชาวบ้าน ในหมู่พวกเขามีชาวซันจ์ ชนชาติจากดินแดนตะวันออกของแอฟริกา ซึ่งหลายคนทำงานที่นั่น เป็นทาสหรือเป็นไท นี่อาจเป็นโอกาสที่จะจับกุมและลงโทษ [outspoken_rebel.GetHerHim]"
fp3_story_cycle_zanj_rebellion_events.0002.a: "เราจะวางกับดัก [outspoken_rebel.GetHerHim]"
fp3_story_cycle_zanj_rebellion_events.0002.a.success: "ท่านจับกุมผู้ก่อกวนได้"
fp3_story_cycle_zanj_rebellion_events.0002.a.failure: "[outspoken_rebel.GetSheHe|U] หลบหนีการจับกุมของท่านไปได้"
fp3_story_cycle_zanj_rebellion_events.0002.a.failure.tt: "อุดมการณ์ของ [outspoken_rebel.GetHerHis] จะได้รับผู้ติดตามมากขึ้น"
fp3_story_cycle_zanj_rebellion_events.0002.c: "เพิกเฉยต่อ [outspoken_rebel.GetHerHim] เถิด [outspoken_rebel.GetSheHe] ไม่เป็นอันตราย"
fp3_story_cycle_zanj_rebellion_events_cause_strengthened_tt: "อุดมการณ์ของ [outspoken_rebel.GetName] แข็งแกร่งขึ้น"
fp3_story_cycle_zanj_rebellion_events_cause_greatly_strengthened_tt: "อุดมการณ์ของ [outspoken_rebel.GetName] แข็งแกร่งขึ้นอย่างมาก"
fp3_zanj_rebellion_opressed_me: "ถูกกดขี่โดยท่าน"
fp3_story_cycle_zanj_rebellion_leaves_for_baghdad: "[outspoken_rebel.GetName] เดินทางไปยังแบกแดด"
fp3_story_cycle_zanj_rebellion_events.0004.t: "การอ้างความเป็นเทพ"
fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName] ผู้ก่อกวนชื่อกระฉ่อน ได้ปรากฏตัวในแบกแดด [zanj_leader.GetSheHe|U] หลบหนีจากบัสราหลังจากพยายามก่อกบฏ แต่ล้มเหลว ผู้ปลุกปั่นที่หยิ่งยโสผู้นี้อ้างว่าเป็นผู้สืบเชื้อสายของซัยด์ อิบน์ อะลี และ ดังนั้นจึงเป็นส่วนหนึ่งของวงศ์วานศาสดา\n\nแม้ว่าคำกล่าวอ้างเหล่านี้จะน่าหัวเราะ แต่ฝ่ายตรงข้ามของข้าอาจพบว่าสะดวกที่จะให้ความเชื่อถือและปล่อยให้ผู้มาใหม่ผู้นี้สร้างความสงสัยในความชอบธรรมของการปกครองของข้าเอง"
fp3_story_cycle_zanj_rebellion_events.0004.a: "ข้าจะพิสูจน์ว่าคำกล่าวอ้างของ [zanj_leader.GetHersHis] เป็นเท็จ"
fp3_story_cycle_zanj_rebellion_events.0004.a.success: "ท่านพิสูจน์ว่า [zanj_leader.GetHerHim] เป็นคนหลอกลวง"
fp3_story_cycle_zanj_rebellion_events.0004.a.failure: "ข้าไม่สามารถพิสูจน์คำกล่าวอ้างที่เกินจริงของ [zanj_leader.GetHerHis] ได้"
fp3_story_cycle_zanj_rebellion_events.0004.b: "ข้าจะเพิกเฉยต่อคนโง่ผู้นี้"

fp3_story_cycle_zanj_rebellion_events.0006.t: "ชาวซันจ์ก้าวออกมา"
fp3_story_cycle_zanj_rebellion_events.0006.desc.a: "[zanj_representative.GetName] ผู้นำคนงานชาวซันจ์ ซึ่งได้รับมอบหมายให้ทำงานที่ไม่สิ้นสุดในการระบายน้ำออกจากพื้นที่ลุ่มน้ำเค็มของบัสรา มาหาข้าเพื่อร้องขอสภาพการทำงานที่ดีขึ้น พวกเขาอยู่ในภูมิภาคนี้มาหลายชั่วอายุคนและเป็นชนกลุ่มน้อยที่สำคัญในบัสรา\n\n"
fp3_story_cycle_zanj_rebellion_events.0006.desc.b: "ข้าสงสัยว่า [zanj_leader.GetName] ผู้สอดรู้สอดเห็น และวาทกรรมกบฏของ [zanj_leader.GetHerHis] อาจมีส่วนเกี่ยวข้องกับความไม่พอใจที่เพิ่มขึ้นของพวกเขา\n\n"
fp3_story_cycle_zanj_rebellion_events.0006.desc.c: ""นายท่าน/นายหญิงของข้า [ROOT.Char.GetTitleAsName] โปรดเถิด [ROOT.Char.GetFaith.HighGodName] ไม่ให้ความสำคัญกับการปฏิบัติต่อคนงานอย่างมีศักดิ์ศรี โดยไม่คำนึงถึงที่มาของพวกเขาหรอกหรือ?""

fp3_story_cycle_zanj_rebellion_events.0006.a: "เจ้าจะได้รับรางวัลสำหรับความขยันหมั่นเพียรของเจ้า"
fp3_rival_gave_title_away: "[CHARACTER.GetShortUIName|U] มอบที่ดินที่ [TARGET_CHARACTER.GetShortUIName] เป็นเจ้าของให้ไป"
fp3_landed_zanj_reason: "แลกเปลี่ยนที่ดินเพื่อสันติภาพ"
fp3_story_cycle_zanj_rebellion_events.0006.b: "ข้าสามารถผ่อนปรนเล็กน้อยได้..."
fp3_zanj_rebellion_interfered_with_my_workers: "[CHARACTER.GetShortUIName|U] เข้าไปยุ่งเกี่ยวกับแรงงานของ [TARGET_CHARACTER.GetShortUIName]"
fp3_story_cycle_zanj_rebellion_events.0006.c: "นั่นคือชะตากรรมของชาวซันจ์ในชีวิตนี้"
fp3_rival_stayed_out_of_my_business: "[CHARACTER.GetShortUIName|U] ไม่ยุ่งเกี่ยวกับธุรกิจของ [TARGET_CHARACTER.GetShortUIName]"

fp3_story_cycle_zanj_rebellion_events.0008.t: "กบฏซันจ์"
fp3_story_cycle_zanj_rebellion_events.0008.desc.a: "รายงานการก่อกบฏอย่างเปิดเผยในพื้นที่ลุ่มน้ำเค็มของบัสรามาถึงข้า"
fp3_story_cycle_zanj_rebellion_events.0008.desc.b: "[zanj_leader.GetName] ที่หลายคนคิดว่าเป็นคนหลอกลวงที่ไม่เป็นอันตราย สามารถรวมคนงานชาวซันจ์ที่ไม่พอใจและชนเผ่าอาหรับกบฏไว้ภายใต้ร่มธงของ [zanj_leader.GetHerHis] ได้ แม้ว่า [zanj_leader.GetHerHim] จะเป็นชาว [zanj_leader.GetCulture.GetName] และไม่ใช่ชาวซันจ์ [zanj_leader.GetHerHim]self แต่พวกกบฏก็มอง [zanj_leader.GetHerHim] เป็นผู้นำ"
fp3_story_cycle_zanj_rebellion_events.0008.desc.c: "[zanj_leader.GetName] ชาวซันจ์ผู้พูดจาโผงผางเป็นพิเศษ ได้รวมคนงานที่ทำงานหนักเกินไปและชนเผ่าอาหรับกบฏไว้ภายใต้ร่มธงของ [zanj_leader.GetHerHis] แม้ว่า [zanj_leader.GetHerHim] จะเป็นชาว [zanj_leader.GetCulture.GetName] และไม่ใช่ชาวอาหรับ [zanj_leader.GetHerHim]self แต่พวกกบฏก็มอง [zanj_leader.GetHerHim] เป็นผู้นำ"
fp3_story_cycle_zanj_rebellion_events.0008.desc.d: "\n\nพวกเขาได้ปล่อยเรือบรรทุกลอยไปตามแม่น้ำเข้าสู่บัสรา และบนนั้นมีศีรษะของเจ้านายชาวซันจ์ที่ถูกสังหารวางอยู่ เป็นการท้าทายอำนาจของข้าอย่างชัดเจน"

fp3_story_cycle_zanj_rebellion_events.0008.a: "แม่น้ำอัรวันด์จะกลายเป็นแม่น้ำสายเลือด"
