l_english: 

 secret_faith.1001.message: "[guardian.GetSecretFaith.GetName] การชักนำเข้าสู่"
 child_secret_faith_conversion_success_effect.desc: "[child.GetFirstNameNoTooltip] คล้อยตาม"
 child_secret_faith_conversion_failure_effect.desc: "[child.GetFirstNameNoTooltip] กังขา"
 child_secret_faith_conversion_critical_failure_effect.desc: "[child.GetFirstNameNoTooltip] เปิดโปงความลับของข้า"
 child_secret_faith_conversion_critical_failure_effect.liege.desc: "[child.GetFirstNameNoTooltip] เปิดโปงผู้ดูแล [guardian.GetSecretFaith.GetName]"

 secret_faith.1002.t: "วัยแห่งการรู้แจ้ง"
 secret_faith.1002.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] อยู่ในสภาวะก้ำกึ่งระหว่างวัยเด็กและวัยผู้ใหญ่ ข้าได้สั่งสอน [child.GetHerHim] เพียงพอที่จะเข้าใจความจริง, และ [child.GetSheHe] ยังเยาว์พอที่จะมีจิตใจเปิดกว้าง\n\nหากข้าต้องการชักนำ [child.GetHerHim] เข้าสู่การรับใช้ [ROOT.Char.GetSecretFaith.HighGodName], ก็คือบัดนี้ หรือมิใช่เลย"
 secret_faith.1002.a: "[child.GetSheHe|U] สมควรที่จะได้รู้ถึงพลังอำนาจของ [ROOT.Char.GetSecretFaith.HighGodNameAlternatePossessive]"
 secret_faith.1002.b: "[child.GetFirstNameNoTooltip] ยากเกินเยียวยาแล้ว"

 secret_faith.1003.t: "ความรู้เร้นลับ"
 secret_faith.1003.desc: "มีบางสิ่งที่ [guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] ได้บอกแก่ข้า ซึ่งไม่มีผู้ใดเคยเอ่ยถึง เราไม่เคยเจาะลึกในหัวข้อเหล่านี้, และข้ารู้ดีว่าไม่ควรถามคำถาม\n\nทว่า เย็นวันนี้ มีบางอย่างที่รู้สึกแตกต่างไประหว่างเรา ขณะที่เรานั่งลงเพื่ออ่านหนังสือ, [guardian.GetSheHe] ถามว่ามีสิ่งใดที่ข้าสงสัยใคร่รู้หรือไม่..."
 secret_faith.1003.a: "ใช่แล้ว! โปรดบอกข้าทุกสิ่ง!"
 secret_faith.1003.b: "ไม่, ข้าไม่คิด เช่นนั้น..."
 secret_faith.1003.c: "นี่คือการดูหมิ่นศาสนา!"
