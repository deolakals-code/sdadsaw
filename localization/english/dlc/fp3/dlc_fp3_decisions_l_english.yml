 fp3_name_read_in_friday_prayer_decision.tt.require_new_caliph_or_modifier_lapse: "ท่านเพิ่งสาบานตนไปไม่นาน — [modifier|E] ของท่านต้องหมดอายุ หรือเคาะลีฟะฮ์ต้องเปลี่ยนไป"
