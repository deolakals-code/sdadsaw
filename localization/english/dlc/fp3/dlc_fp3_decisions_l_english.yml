 fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate: "การละหมาดวันศุกร์เป็นพิธีทางศาสนาที่สำคัญที่สุดของสัปดาห์ สิ้นสุดด้วยการอ่านรายนามผู้ปกครองทางจิตวิญญาณและทางโลกของอาณาจักร"
 fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc: "$fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate$\n\nโดยการลบชื่อเคาะลีฟะฮ์ออกจากรายชื่อนี้ ข้าประกาศต่ออุมมะฮ์ทั้งปวงว่าข้าถือว่า #EMP ตัวข้าเอง#! เป็นนายเหนือหัวสูงสุดในอาณาเขตของข้า"
 fp3_name_read_in_friday_prayer_decision.detractor.turns_supporter.desc: "$fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate$\n\nโดยการเน้นย้ำถึงความสำคัญสูงสุดของเคาะลีฟะฮ์ในตอนต้นของรายชื่อนี้ ข้าประกาศตนต่อสาธารณะว่าเป็นข้าในบังคับผู้ภักดีต่อผู้นำแห่งศาสนาซุนนีออร์โธดอกซ์"
 fp3_name_read_in_friday_prayer_decision.neutral.desc: "$fp3_name_read_in_friday_prayer_decision.supporter_turns_detractor.desc.boilerplate$\n\nโดยการเปลี่ยนแปลงว่าใครจะถูกอ่านชื่อในรายชื่อในอาณาจักรของข้า และตำแหน่งของพวกเขา ข้าสามารถประกาศได้ว่าความภักดีที่แท้จริงของข้าอยู่ที่ใด"
