l_english: 

 # Assertion
 struggle_persia_ending_assertion: "การยืนยันอำนาจรัฐเคาะลีฟะฮ์"
 struggle_persia_ending_assertion_decision_desc: "หลังจากปราบกบฏและกองกำลังที่สมคบคิดต่อต้านรัฐเคาะลีฟะฮ์ทั้งในอิหร่านและเมโสโปเตเมียแล้ว ข้าสามารถฟื้นฟูศรัทธาของประชาชนในจักรวรรดิอับบาซิดและอำนาจอันยิ่งใหญ่ที่เคยมีในโลกได้อย่างเด็ดขาด"
 struggle_persia_ending_assertion_decision_confirm: "ยุติ $persian_struggle$"
 struggle_persia_ending_assertion_tooltip: "รัฐเคาะลีฟะฮ์อันชอบธรรมต้องได้รับการปกป้องไม่ว่าจะต้องแลกด้วยอะไรก็ตาม และศัตรูของอิสลามต้องถูกเหยียบย่ำให้เป็นผุยผง"
 struggle_persia_ending_assertion.b: "@warning_icon! #X ดินแดนที่สูญเสียไปตลอดการต่อสู้จะไม่ได้รับการฟื้นฟู!#!"
 fp3_struggle_assertion_arabia_absorb_persia_swing_rewards_tt: "[GetTitleByKey('e_persia').GetName|l] ทั้งหมดกลายเป็นส่วนหนึ่ง [de_jure|E] ของ [GetTitleByKey('e_arabia').GetName]"
 struggle_persia_ending_assertion.l: "มากกว่า [SCOPE.ScriptValue('fp3_persia_supporter_rulers_decimal_value')|V0%] ของ [rulers|E] [independent|E] ระดับ [count|E] หรือสูงกว่าที่ [struggle_involved|E] หรือ [vassals|E] โดยตรงของเคาะลีฟะฮ์มี [trait|E] [GetTrait('fp3_struggle_supporter').GetName( GetNullCharacter )] ([SCOPE.ScriptValue('fp3_persia_supporter_rulers_count_value')]/[SCOPE.ScriptValue('fp3_persia_supporter_rulers_half_value')])"
 struggle_persia_ending_assertion.2: "ไม่มี [independent|E] [struggle_involved|E] หรือ [struggle_interloper|E] [duke|E] หรือสูงกว่าที่มี [trait|E] [GetTrait('fp3_struggle_detractor').GetName( GetNullCharacter )] #weak (ปัจจุบัน [SCOPE.ScriptValue('fp3_persia_independent_detractor_rulers_count_value')|V0])#!"
 struggle_persia_ending_assertion.3: "ไม่มี [independent|E] [struggle_involved|E] หรือ [struggle_interloper|E] [duke|E] หรือสูงกว่าที่มี [faith|E] ที่ไม่ใช่ [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] #weak (ปัจจุบัน [SCOPE.ScriptValue('fp3_persia_independent_non_sunni_rulers_count_value')|V0])#!"

 struggle_persia_ending_decision_caliphate_exists_tt: "[holder|E] ของ [GetTitleByKey('d_sunni').GetBaseName] ยังดำรงตำแหน่ง [GetTitleByKey('e_arabia').GetDefinitiveName] ด้วย"
 fp3_struggle_ending_conversion_modifier_desc: "การสิ้นสุด $persian_struggle$"

 # Sundering
 fp3_sunder_the_caliphate_decision: "ทำลายรัฐเคาะลีฟะฮ์"
 fp3_sunder_the_caliphate_decision_desc: "หลังจากกระจัดกระจายเหล่าข้ารับใช้ของตระกูล [GetTitleByKey('d_sunni').GetHolder.GetHouse.GetBaseName] และยึดฐานที่มั่นของพวกเขาในเมโสโปเตเมียแล้ว ชะตากรรมของ [GetTitleByKey('d_sunni').GetName] ก็อยู่ในมือข้า ข้าสามารถทำลายมันให้สิ้นซากได้"
