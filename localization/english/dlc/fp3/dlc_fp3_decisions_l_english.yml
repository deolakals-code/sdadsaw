 fp3_struggle_assertion_caliph_detractor_tt: "ทุกคนที่มี [GetTrait('fp3_struggle_detractor').GetName(GetNullCharacter)] จะถูกหมายหัวว่าเป็น [criminal|E] ต่อเคาะลีฟะฮ์ #weak ([imprisonment|E] และ [revocation|E])#!"
 fp3_struggle_assertion_subjugation_expanded_tt: "[house_heads|E] ของ [house|E] ของท่านและตระกูล [GetTitleByKey('d_sunni').GetHolder.GetHouse.GetBaseName] ได้รับสิทธิ์เข้าถึง [casus_belli|E] #V การปราบปราม#! อย่างถาวรต่อ #EMP ทุก#! สาขาของศาสนา [GetFaithByKey('ashari').GetReligion.GetAdjective] #weak ([GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName], [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName], [GetFaithDoctrine('muhammad_succession_muhakkima_doctrine').GetBaseName], และ [GetFaithDoctrine('muhammad_succession_zandaqa_doctrine').GetBaseName])#!"
 fp3_struggle_assertion_caliphal_muslim_faction_protection_tt: "[rulers|E] ชาว [GetFaithByKey('ashari').GetReligion.GetAdjective] จะไม่สามารถสร้าง [dissolution_factions|E] หรือ [independence_factions|E] ต่อต้านเคาะลีฟะฮ์ [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] ได้อีกต่อไป"

