 fp3_sunder_the_caliphate_hostile_faith_vassal_tt: "[vassals|E] ทั้งหมดของ [GetTitleByKey('d_sunni').GetHolder.GetTitledFirstNamePossessive] ที่นับถือ [faiths|E] ที่เป็น [faith_hostile|E] ต่อ [GetTitleByKey('d_sunni').GetHolder.GetHerHis] #weak ([GetTitleByKey('d_sunni').GetHolder.GetFaith.GetName])#!"
 fp3_sunder_the_caliphate_same_faith_vassal_hook_tt: "[sunderer.GetShortUIName|U] จะได้รับ [weak_hook|E] #weak ($favor_hook$)#! ต่อพวกเขา"
