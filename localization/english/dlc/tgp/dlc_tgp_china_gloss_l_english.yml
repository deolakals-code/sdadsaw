l_english: 
 

 FOUR_WAYS_GLOSS: "มีวิธีการอันเคร่งครัดมากมายเพื่อประเมินคุณสมบัติของบุคคล สี่ประการที่โดดเด่นที่สุดนั้นมีพื้นฐานมาจากรูปลักษณ์ วาทศิลป์ อักษรศิลป์ และวิจารณญาณ"
 CUJU_GLOSS: "ชวีจวี คือกีฬาแข่งขันอันมีรากฐานในราชวงศ์ฮั่น มันถูกฝึกฝนเพื่อความสันทนาการและพลานามัยนับ แต่นั้นมา โดยมีทีมผู้เล่นสูงถึง 20 คนในระหว่างงานสังคม ณ ราชสำนัก กติกาหลักของเกมนี้เกี่ยวข้องกับการเตะลูกบอลผ่านเสาประตูสูง โดยหลีกเลี่ยงมิให้ลูกบอลสัมผัสพื้น"
 CONFUCIUS_GLOSS: "ขงจื๊อ หรือ ปรมาจารย์ข่ง เป็นนักปราชญ์ผู้ก่อตั้งระบบความเชื่อที่เน้นเรื่องมนุษยธรรมและคุณธรรมจริยธรรม 'มรรคา' ดังที่ท่านอธิบายไว้ในคัมภีร์หลุนอวี่ ได้กลายเป็นรากฐานในการปกครองรัฐและเหล่าประชาราษฎร์"
 BIAN_QUE_GLOSS: "เปี่ยนเชว่ เป็นนามของแพทย์จีนในตำนานหลายท่าน: ทั้งแพทย์ในยุครณรัฐ (475 – 221 ปีก่อนคริสตกาล) ตลอดจนผู้ใช้นามเดียวกันในยุคสมัยของจักรพรรดิเหลืองที่เก่าก่อนกว่านั้น"
