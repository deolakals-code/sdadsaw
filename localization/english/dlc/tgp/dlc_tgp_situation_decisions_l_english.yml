 # Debate
 dynastic_cycle_debate_decision: "เรียกการโต้วาที"
 dynastic_cycle_debate_decision_desc: "คุณธรรม, อิทธิพล, #EMP อำนาจ#!. สิ่งเหล่านี้แทบไร้ความหมายหากท่านไม่สามารถนำเสนอข้อโต้แย้งที่หนักแน่นเพื่อตนเองและอุดมการณ์ของท่านได้ เพื่อโน้มน้าวผู้อื่นว่าท่านคู่ควร, ไม่สิ #EMP สมควรได้รับ#!, ตำแหน่งที่ทรงอำนาจยิ่งกว่า"
 dynastic_cycle_debate_decision_tooltip: "เรียกการโต้วาทีกับสมาชิกคนสำคัญคนอื่นของ [movement|E]"
