 favor_dynastic_cycle_era: "ชื่นชอบยุคสมัย"
 favor_dynastic_cycle_era_hegemon_desc: "ภาระแห่งรัฐนั้นหนักหน่วงยิ่งนักสำหรับข้า [mandate_of_heaven|E] เป็นของข้าที่จะต้องแบกรับและค้ำจุนไว้ และวงล้อแห่ง [GetSituation('dynastic_cycle').GetName] ก็หมุนไปอย่างไม่หยุดยั้งตามทุกการตัดสินใจของข้า อนาคตของทุกผู้คนที่อยู่ใต้สวรรค์ล้วนอยู่ในมือข้า อนาคตของเราจะเป็นหนึ่งในสันติสุขและความรุ่งเรือง หรือจะเป็นชัยชนะที่ได้มาและการสยบยอมของเหล่าประมุขต่างแดน?"
 favor_dynastic_cycle_era_chaos_desc: "หากวันหนึ่งข้าจะต้องยอมรับความรับผิดชอบอันศักดิ์สิทธิ์ของ [mandate_of_heaven|E], ข้าก็ต้องปฏิบัติตนดั่ง เช่นประมุขพึงกระทำ และคำนึงถึงมวลชนที่จะมองข้าเป็นนายเหนือดินแดนทั้งปวงใต้สวรรค์ หาก – ไม่สิ #EMP เมื่อ#! – เวลานั้นมาถึง, อนาคตของพวกเขาจะเป็นหนึ่งในสันติสุขและความรุ่งเรือง หรือจะเป็นชัยชนะที่ได้มาและการสยบยอมของเหล่าประมุขต่างแดน?"
