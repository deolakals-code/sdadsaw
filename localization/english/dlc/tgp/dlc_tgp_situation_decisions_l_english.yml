l_english: 
 # Claim Mandate
 situation_dynastic_cycle_claim_mandate_decision: "อ้างสิทธิ์ในอาณัติแห่งสวรรค์"
 situation_dynastic_cycle_claim_mandate_decision_desc: "ท่ามกลาง [GetTitleByKey('h_china').GetNameNoTier] ที่แตกแยก สรวงสวรรค์ย่อมเสาะหาผู้ที่คู่ควรต่อความโปรดปรานแห่งสวรรค์เสมอ เพื่อเป็นผู้ถือครองอาณัติอันสูงสุดลำดับถัดไป\n\nวัฏจักรราชวงศ์จำต้องดำเนินต่อไป และด้วยเหตุนี้... #EMP ข้า#! จึงได้รับเลือกจากสรวงสวรรค์!"
 situation_dynastic_cycle_claim_mandate_decision_confirm: "ยืนยันอำนาจจักรวรรดิ"
 situation_dynastic_cycle_claim_mandate_decision_county_percentage_tt: "ท่านควบคุมอย่างน้อย [SCOPE.ScriptValue('claim_mandate_china_county_percentage_value')|V%0] ของ [counties|E] [de_jure|E] ใน [GetTitleByKey('h_china').GetDefinitiveNamePossessive]"
 situation_dynastic_cycle_claim_mandate_decision_phase_tt: "ท่านเลือก [dynastic_cycle_era_type_stable|E] ถัดไปของ [situation.GetName]"

 situation_dynastic_cycle_claim_mandate_decision_tooltip: "ได้รับ [title|E] [GetTitleByKey('h_china').GetDefinitiveName|U] และเปลี่ยนผ่าน [GetSituation('dynastic_cycle').GetName] ไปสู่ [dynastic_cycle_era_type_stable|E]"
 claim_mandate_decision_county_percentage_tt: "#V ท่าน#! ต้องควบคุมอย่างน้อย [SCOPE.ScriptValue('claim_mandate_china_county_percentage_value')|V%0] ของ [counties|E] [de_jure|E] ใน [GetTitleByKey('h_china').GetDefinitiveNamePossessive] #weak (ปัจจุบัน: [SCOPE.ScriptValue('claim_mandate_china_control_percent_value')|0]%)#!"
 claim_mandate_decision_phase_tt: "[THIS.Char.GetShortUIName|U] จะเลือก [dynastic_cycle_era_type_stable|E] ถัดไปของ [situation.GetName]"
 claim_mandate_turn_vassal_celestial_desc: "[vassal|E] [de_jure|E] ทุกคนของ [GetTitleByKey('h_china').GetDefinitiveName|U] ภายใน [realm|E] ของท่าน ผู้ ซึ่งไม่ใช่ [GetGovernment( 'republic_government' ).GetNameWithIcon] หรือ [GetGovernment( 'theocracy_government' ).GetNameWithIcon] จะเปลี่ยนไปใช้ [government|E] แบบ [GetGovernment( 'celestial_government' ).GetNameWithIcon]"
 claim_mandate_trigger_conquest_tt: "[GetSituation('dynastic_cycle').GetName] เปลี่ยนผ่านไปสู่ [dynastic_cycle_era_type_unstable|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetNameWithIcon]"
  claim_mandate_turn_independent_realms_celestial_desc: "[independent_ruler|E] ทุกคนใน [dynastic_cycle|E] ที่มี [government|E] แบบ [GetGovernment( 'celestial_government' ).GetNameWithIcon] หรือมี [heritage|E] เดียวกับ #V ท่าน#! จะกลายเป็น [vassal|E] ของท่านและรับเอา [government|E] แบบ [GetGovernment( 'celestial_government' ).GetNameWithIcon] มาใช้"

 # Conquest dynasty - Promote Cultural Governors
 situation_dynastic_cycle_favor_own_culture_for_appointments: "ส่งเสริมผู้ว่าการชาววัฒนธรรมตน"
 situation_dynastic_cycle_favor_own_culture_for_appointments_desc: "ข้าไม่อาจพึ่งพาระบบข้าราชการเดิมได้ ไม่เลย ข้าจำเป็นต้องมีผู้ว่าการที่ไว้ใจได้และเชื่อถือได้เพื่อการปกครองอย่างมีประสิทธิภาพ ด้วยการส่งเสริมวัฒนธรรมของข้าเอง มันจะง่ายดายขึ้นมากสำหรับคนของข้าในการเข้าควบคุมมณฑลมากมายภายใน [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 situation_dynastic_cycle_favor_own_culture_for_appointments_confirm_1: "เราจะชื่นชอบชาว [ROOT.Char.GetCulture.GetNameNoTooltip] ทั้งหมด"
 situation_dynastic_cycle_favor_own_culture_for_appointments_confirm_2: "จะไม่มีวัฒนธรรมใดได้รับการปฏิบัติเป็นพิเศษ"
 situation_dynastic_cycle_favor_own_culture_for_appointments_tooltip: "เพิ่ม [candidate_score|E] สำหรับผู้ที่มี [culture|E] เดียวกับท่าน"
 situation_dynastic_cycle_conquest_favor_own_culture_desc: "[characters|E] ที่มี [culture|E] ของท่าน #weak ([hegemon_favored_culture.GetNameNoTooltip])#! จะได้ [candidate_score|E] ที่สูงขึ้นสำหรับ [GetLaw('appointment_succession_law').GetName]"
 situation_dynastic_cycle_conquest_stop_favored_culture_desc: "[culture|E] [situation.MakeScope.Var('dynastic_cycle_favored_culture').Culture.GetName] จะไม่ได้รับ [candidate_score|E] ที่เพิ่มขึ้นสำหรับ [GetLaw('appointment_succession_law').GetName] อีกต่อไป"
 situation_dynastic_cycle_favor_own_culture_name: "ส่งเสริมวัฒนธรรม"
 situation_dynastic_cycle_favor_own_culture_desc: "ส่งเสริม [culture|E] ของท่านสำหรับ [GetLaw('appointment_succession_law').GetName]"
 situation_dynastic_cycle_favor_own_culture_tooltip: "$situation_dynastic_cycle_favor_own_culture_desc$"
 situation_dynastic_cycle_remove_favor_name: "หยุดการส่งเสริมวัฒนธรรม"
 situation_dynastic_cycle_remove_favor_desc: "หยุดการส่งเสริม [culture|E] ปัจจุบันสำหรับ [GetLaw('appointment_succession_law').GetName]"
 situation_dynastic_cycle_remove_favor_tooltip: "$situation_dynastic_cycle_remove_favor_desc$"
 situation_dynastic_cycle_own_culture_already_favored_desc: "[culture|E] ของท่านกำลังได้รับการส่งเสริมสำหรับ [GetLaw('appointment_succession_law').GetName] อยู่แล้ว"
 situation_dynastic_cycle_no_favored_culture_desc: "ปัจจุบันไม่มี [culture|E] ใดที่กำลังได้รับการส่งเสริมสำหรับ [GetLaw('appointment_succession_law').GetName]"
