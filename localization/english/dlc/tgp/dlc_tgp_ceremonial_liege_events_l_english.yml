l_english: 
 tgp_ceremonial_liege_events.0001.t: "ตราประทับแห่งความสับสน"
 tgp_ceremonial_liege_events.0001.desc: "[councillor.GetName] ได้ส่งคำสั่งออกไปอย่างผิดพลาด โดยมีทั้งตราประทับของข้าและของ [opposing_power.GetNamePossessive] "มันเป็นความผิดพลาดโดยสุจริต" [councillor.GetSheHe] อ้อนวอน "แต่ท่านก็รู้ว่าคำโกหกและเรื่องซุบซิบนินทานั้นแพร่สะพัดไปทั่วราชสำนักเร็วเพียงใด..."\n\nการเรียกคืนคำสั่งเหล่านั้นอาจต้องแลกมาด้วยราคาสูง แต่การประกาศยกเลิกต่อสาธารณะว่าเป็นความผิดพลาด ก็คงจะน่าอับอายยิ่งนัก"
 tgp_ceremonial_liege_events.0001.a_liege: "ย้ำเตือนพวกมันว่าผู้ใดคือผู้ปกครองที่แท้จริง"
 tgp_ceremonial_liege_events.0001.a_regent: "เรื่องนี้ต้องได้รับการแก้ไข ก่อนที่ [opposing_power.GetFirstNameNoTooltip] จะทันเห็น"
 tgp_ceremonial_liege_events.0001.b: "ปล่อยมันไว้ เช่นนั้น ภาพลักษณ์ภายนอกมันจะเสียหายอันใดกัน?"
 tgp_ceremonial_liege_events.0001.b_a: "คำสั่งนั้นยืนยันถึงอำนาจของท่าน"
 tgp_ceremonial_liege_events.0001.b_b: "เรื่องวุ่นวายนี้ถูกลืมเลือนไป"
 tgp_ceremonial_liege_events.0001.b_c: "[opposing_power.GetNameNoTooltip] ได้รับอำนาจมากขึ้น"

 tgp_ceremonial_liege_events.0010.t: "ภาระอันแท้จริง"
 tgp_ceremonial_liege_events.0010.desc: ""ที่รัก!" [spouse.GetName] เอ่ยขึ้น ขณะเข้ามาในห้องบรรทมของเรา "ผิวของท่านซีดเซียวไปมาก ข้าเป็นห่วงท่านเหลือเกิน"\n\nความกังวลของ [spouse.GetFirstNamePossessiveNoTooltip] นั้นถูกต้องแล้ว โมงยามใน แต่ละวันช่างยาวนานขึ้น และภาระแห่งราชบัลลังก์ก็หนักอึ้งขึ้นทุกที\n\n"หากท่านแบกรับภาระหนักหนา เช่นนี้ บางที [opposing_power.GetName] อาจปกครองแทนท่านไปชั่วคราวก่อนได้" [spouse.GetFirstNameNoTooltip] แนะนำ"
 tgp_ceremonial_liege_events.0010.a: "เจ้าพูดถูก ข้ามิอาจทำสิ่งนี้เพียงลำพัง"
 tgp_ceremonial_liege_events.0010.b: "ไม่ ไม่ ข้าจะออกราชสำนักให้น้อยลง"
 tgp_ceremonial_liege_events.0010.b_a: "การปลีกตัวช่วยได้มาก"
 tgp_ceremonial_liege_events.0010.b_b: "การปลีกตัวไม่ได้ช่วยอันใดมากนัก"
 tgp_ceremonial_liege_events.0010.c: "ไม่เด็ดขาด! ข้าคือองค์อธิปัตย์แห่งดินแดนนี้"
 tgp_ceremonial_liege_events.0010.d: "[opposing_power.GetSheHe|U] บอกให้เจ้าพูด เช่นนี้ ใช่หรือไม่?"
 tgp_ceremonial_liege_events.0010.d_desc: "ท่านกล่าวหา [spouse.GetFirstNameNoTooltip] ว่าสมคบคิดกับ [opposing_power.GetFirstNameNoTooltip]"
 tgp_ceremonial_liege_events.0010.tt.success: "ท่านพบหลักฐานที่แท้จริงถึงการทรยศของ [spouse.GetHerHis]"
 tgp_ceremonial_liege_events.0010.tt.failure: "ข้อกล่าวหาของท่านพิสูจน์แล้วว่าเป็นเท็จ"

 tgp_ceremonial_liege_events.0020.t: "[opposing_power.GetInvolvedActivity.GetShortNameNoTooltip] อันเป็นพิธีการ"
 tgp_ceremonial_liege_events.0020.desc: "[opposing_power.GetName] กำลังยุ่งอยู่กับ [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] ซึ่งดูเหมือนว่าข้าไม่ได้รับเชิญด้วย! ในขณะที่ [opposing_power.GetSheHe]"
 tgp_ceremonial_liege_events.0020.desc_feast: "ดื่มฉลองตลอดทั้งคืน แบ่งปันเรื่องเล่ากับครอบครัวและสหาย,"
 tgp_ceremonial_liege_events.0020.desc_hunt: "เพลิดเพลินกับความตื่นเต้นของการล่า,"
 tgp_ceremonial_liege_events.0020.desc_pilgrimage: "เข้าใกล้ [opposing_power.GetFaith.HighGodName] มากขึ้นในการเดินทางของ [opposing_power.GetHerHis],"
 tgp_ceremonial_liege_events.0020.desc_festival: "แสดงอำนาจของ [opposing_power.GetHerHis] ด้วยเทศกาล,"
 tgp_ceremonial_liege_events.0020.desc_end: "ข้ายังคงต้องติดอยู่กับหน้าที่\n\nแม้ว่าสถานการณ์อาจจะเลวร้ายกว่านี้ได้ โอกาสก็ได้ปรากฏขึ้น..."
 tgp_ceremonial_liege_events.0020.a: "บางทีคงถึงเวลาแล้วที่จะจัด [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] ของข้าเองบ้าง"
 tgp_ceremonial_liege_events.0020.a_desc: "ท่านพยายามที่จะบดบังรัศมี [opposing_power.GetFirstNameNoTooltip] ด้วย [activity|E] ของท่านเอง:\n$BULLET$ท่านจะได้รับส่วนลด #P 15%#! ในการจัด [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] ของท่านเอง\n$BULLET$หาก [opposing_power.GetInvolvedActivity.GetShortNameNoTooltip|l] ครั้งถัดไปของท่านสำเร็จลุล่วง ท่านจะได้รับ [prestige|E] และ [opposing_power.GetFirstNameNoTooltip] จะสูญเสียไปบ้าง"
 tgp_ceremonial_liege_events_0020_discount_desc: "การจัดงานเพื่อตอบโต้"
 tgp_ceremonial_liege_events.0020.b: "ข้ามั่นใจว่า [opposing_power.GetFirstNameNoTooltip] คงไม่ว่ากระไร หากข้าจะทำการเปลี่ยนแปลงเล็กน้อย..."
 tgp_ceremonial_liege_events.0020.b.tt.desc: "ท่านพยายามบ่อนทำลายอำนาจของ [opposing_power.GetFirstNamePossessiveNoTooltip]"
 tgp_ceremonial_liege_events.0020.b.tt.success: "ท่านได้รับอำนาจเหนือ [opposing_power.GetFirstNameNoTooltip] ได้สำเร็จ"
 tgp_ceremonial_liege_events.0020.b.tt.failure: "การเข้าแทรกแซงของท่านมี แต่จะก่อให้เกิดความขัดแย้งมากขึ้น"
 tgp_power_undermined_modifier_tt: "[GetModifier('tgp_power_undermined_modifier').GetNameWithTooltip]: #P +25#!"
 tgp_ceremonial_liege_events.0020.c: "ส่งความปรารถนาดีของข้าไปให้ [opposing_power.GetHerHim]"

 tgp_ceremonial_liege_events.0030.t: "อนุสรณ์ของนักปราชญ์"
 tgp_ceremonial_liege_events.0030.desc: "[scholar.GetName] นำเสนอบันทึกที่เขียนขึ้นอย่างดีเกี่ยวกับประวัติศาสตร์ของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName]\n\nในบันทึกนั้น"
 tgp_ceremonial_liege_events.0030.regent: "[opposing_power.GetFirstName] ถูกกล่าวถึงบ่อยครั้งและอย่างละเอียด โดย [scholar.GetFirstNameNoTooltip] ได้ใส่รายละเอียดเกี่ยวกับตระกูลของ [opposing_power.GetFirstNamePossessiveNoTooltip] คือ [opposing_power.GetHouse.GetName] ไว้ด้วย\n\nปัญหาปรากฏชัดเมื่อข้าถูกบรรยายว่าเป็น [ROOT.Char.Custom('InsultAdjective')] และ [opposing_power.GetFirstNameNoTooltip] ถูกบรรยายว่าช่าง [ROOT.Char.Custom('ComplimentAdjective')]..."
 tgp_ceremonial_liege_events.0030.liege: "ข้าถูกกล่าวถึงบ่อยครั้งและอย่างละเอียด โดย [scholar.GetFirstNameNoTooltip] ได้ใส่รายละเอียดเกี่ยวกับตระกูลของข้า คือ [ROOT.Char.GetHouse.GetName] ไว้ด้วย\n\nสิ่งที่ดึงดูดความสนใจของข้าอย่างแท้จริงคือ เมื่อข้าถูกบรรยายว่าเป็น [ROOT.Char.Custom('ComplimentAdjective')] และ [opposing_power.GetFirstNameNoTooltip] ถูกบรรยายว่าช่าง [opposing_power.Custom('InsultAdjective')]..."
 tgp_ceremonial_liege_events.0030.a: "ผลงานยอดเยี่ยม!"
 tgp_ceremonial_liege_events.0030.b: "เปลี่ยนถ้อยคำของเจ้าเสีย [scholar.GetFirstNameNoTooltip]"
 tgp_ceremonial_liege_events.0030.b_desc: "ท่านพยายามแนะนำ [scholar.GetFirstNameNoTooltip] เกี่ยวกับวิธีเขียนอนุสรณ์ให้ดีขึ้น"
 tgp_ceremonial_liege_events.0030.tt.success: "[scholar.GetFirstNameNoTooltip] แก้ไขข้อผิดพลาดของ [scholar.GetHerHis]"
 tgp_ceremonial_liege_events.0030.tt.failure: "ท่าน ทำให้เรื่องแย่ลง"
 tgp_ceremonial_liege_events.0030.c_regent: "อย่ามากล่าวร้ายข้า เจ้าโง่!"
 tgp_ceremonial_liege_events.0030.c_liege: "ระวังปากของเจ้าไว้..."
 tgp_ceremonial_liege_events.0030.c_tt: "ท่านตำหนิผลงานของ [scholar.GetFirstNamePossessiveNoTooltip]"
 
 tgp_ceremonial_liege_events.0040.t: "ฉากหน้า... ในตอนนี้"
 tgp_ceremonial_liege_events.0040.desc: ""ขออภัย [inquirer.Custom2('RelationToMeShort', ROOT.Char)] ของข้า" [inquirer.GetName] กระซิบเบาๆ ขณะเข้ามาใกล้ข้า\n\n"ข้าครุ่นคิดเรื่องนี้มาระยะหนึ่งแล้ว และขออภัยหากมันไม่เหมาะสม" [inquirer.GetSheHe|U] กล่าว "แต่เหตุใดท่านจึงไม่กำจัด [opposing_power.GetFirstName] ทิ้งไปเสีย? มันดูไม่เหมาะสมเลยสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ที่จะเป็นผู้ชักใย [opposing_power.GetTitleAsNameNoTooltip] ที่เป็นเพียง...!""
 tgp_ceremonial_liege_events.0040.a: "มันเป็นเพียงภาพลักษณ์ภายนอก [ROOT.Char.Custom2('RelationToMeShort', inquirer)] ของข้า..."
 tgp_ceremonial_liege_events.0040.a_desc: "ท่านพยายามบอก [inquirer.GetHerHim] ว่ามันเป็นเพียงฉากหน้า"
 tgp_ceremonial_liege_events.0040.tt.success: "ท่านโน้มน้าว [inquirer.GetHerHim] ได้สำเร็จ"
 tgp_ceremonial_liege_events.0040.tt.failure: "[inquirer.GetSheHe|U] รู้ว่าท่านกำลังโกหก"
 tgp_ceremonial_liege_events.0040.b: "ทุกสิ่งล้วนมีเหตุผลของมัน"
 tgp_ceremonial_liege_events.0040.b_desc: "ท่านอธิบายให้ [inquirer.GetFirstNameNoTooltip] ฟังถึงจุดประสงค์ในบทบาทของ [opposing_power.GetFirstNamePossessiveNoTooltip]"
 
