 ##################################################
 # JAPAN DECISION EVENTS 
 ##################################################
 # tgp_japan_establish_house_fief_decision
 tgp_japan_decision.9001.t.fief: "เขตศักดินา [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9001.t.cadet: "$create_cadet_branch_decision$"
 tgp_japan_decision.9001.desc.fief_split_house: "ข้าภาคภูมิในความเป็น [old_house.GetBaseNameNoTooltip] แต่บัดนี้ถึงเวลาแล้วที่จะสลักเสลาวิถีแห่งตน และก่อร่างที่ดินของข้าเองใน [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] ไม่ว่า [old_head.GetTitledFirstName] ประมุขตระกูลของข้า จะคิดเห็นประการใดก็ตาม"
 tgp_japan_decision.9001.desc.fief_name: "\n\nบัดนี้ สิ่งที่เหลืออยู่คือการตัดสินใจเลือกนามตระกูลใหม่ของข้า..."
 tgp_japan_decision.9001.desc.cadet: "ข้าภาคภูมิในความเป็น [old_house.GetBaseNameNoTooltip] แต่บัดนี้ถึงเวลาแล้วที่จะสลักเสลาวิถีแห่งตน และสถาปนาตระกูลของข้าเอง ไม่ว่า [old_head.GetTitledFirstName] ประมุขตระกูลของข้า จะคิดเห็นประการใดก็ตาม"
 tgp_japan_decision.9001.desc.permission: "\n\nด้วยพรที่ [regent.GetTitledFirstNamePossessive] ประทานให้ ก็มิต้องหวั่นเกรงคำตำหนิจากเมืองหลวงอีกต่อไป!"
 tgp_japan_decision.9001.desc.crime: "\n\n[regent.GetTitledFirstName] จะต้องพิโรธอย่างมิต้องสงสัยเมื่อ [regent.GetSheHe] ได้ยินเรื่องนี้ แต่นั่นมิใช่เรื่องใหญ่อันใดที่ต้องใส่ใจ!"
 tgp_japan_decision.9001.desc.feudal: "\n\nในที่สุด ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ก็ได้เข้าสู่ทำเนียบขุนนางใหม่ ภายใต้การนำของ [regent.GetTitledFirstName]"
 tgp_japan_decision.9001.a.fief: "อรุณรุ่งใหม่ได้เริ่มขึ้นแล้ว"
 tgp_japan_decision.9001.a.cadet: "$tgp_japan_decision.9001.a.fief$"
 tgp_japan_decision.9002.t: "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9002.t.landless: "$tgp_japan_decision.9001.t.fief$"
 tgp_japan_decision.9002.desc: "เราได้ดิ้นรนภายใต้กรอบของระบบราชการอย่างสุดความสามารถแล้ว แต่บัดนี้มิอาจทนอีกต่อไป"
 tgp_japan_decision.9002.desc.landed: "ถึงเวลาแล้วที่จะสลักเสลาวิถีใหม่ และสถาปนา [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] ให้เป็นเขตศักดินาถาวรของตระกูล [ROOT.Char.GetHouse.GetBaseName]"
 tgp_japan_decision.9002.desc.landless: "ถึงเวลาแล้วที่จะสลักเสลาวิถีใหม่ และละทิ้งพันธนาการแห่งระบบราชการ"
 tgp_japan_decision.9002.a: "อรุณรุ่งใหม่ได้ฉายแสงสู่ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] แล้ว"
 japanese_noble_family_name: "[new_house.GetNameNoTooltip] $c_nf_japan_suffix$"
 japanese_house_first_name: "[new_head.GetUIFirstNameOnlyNotMeNoTooltipNoFormat]-ryū"
 japanese_house_random_barony: "[random_barony.GetNameNoTierNoTooltip]"
 japanese_house_domicile_barony: "[domicile_barony.GetNameNoTierNoTooltip]"
 japanese_house_primary_county: "[primary_county.GetNameNoTierNoTooltip]"
 japanese_house_domicile_county: "[domicile_county.GetNameNoTierNoTooltip]"
 japanese_house_name_custom: "[new_head.GetLocalizedText( 'new_japanese_house_name' )]"
 japanese_house_name_flag: "[new_head.MakeScope.Var( 'new_japanese_house_name' ).GetFlagName]"
 japanese_house_name_fallback: "[old_head.GetHouse.GetName]"
 japanese_house_name: "[new_head.GetHouse.GetNameNoTooltip]"
 japanese_dynasty_name: "[new_head.GetDynasty.GetNameNoTooltip]"
 tgp_japan_decision.9005.t: "$tgp_japan_establish_house_fief_decision$: การแตกแยกในตระกูล"
 tgp_japan_decision.9005.t.landless: "$tgp_japan_establish_soryo_manor_decision$: การแตกแยกในตระกูล"
 tgp_japan_decision.9005.desc: "[new_head.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', new_head)] ของข้า ได้ประกาศอย่างอาจหาญถึงการเริ่มต้นตระกูลใหม่ [new_head.GetHouse.GetBaseName] โดยมี [new_head.GetHerselfHimself] เป็นประมุข\n\nข้ามิอาจเสแสร้งยินดีต่อการเมินเฉยต่ออำนาจของข้าเหนือตระกูล [ROOT.Char.GetHouse.GetBaseName] อย่างโจ่งแจ้งนี้ได้ — คอยดูเถิดว่า [new_head.GetSheHe] จะเป็น เช่นไรเมื่อปราศจากการคุ้มครองของข้า..."
 tgp_japan_decision.9005.a: "ดวงตะวันเจิดจ้าได้ โดยมิต้องอาศัยร่มเงาของ [ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 # tgp_japan_become_shogun_decision
 tgp_japan_decision.9101.t: "รัฐบาลโชกุน [shogun.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9101.desc: "ยุคสมัยใหม่ได้เริ่มต้นขึ้นใน [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip] เมื่ออำนาจเปลี่ยนจากปลายปากกาไปสู่คมดาบ ภายใต้การนำของ [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ในที่สุดระเบียบแบบแผนก็จะถูกฟื้นฟู และร่องรอยสุดท้ายของระบบราชการเก่าจักถูกทิ้งไว้ในหน้าประวัติศาสตร์\n\nแต่จงอย่าได้เข้าใจผิด — อำนาจของข้านั้นมาจาก [ceremonial_liege.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์ของเรา..."
 tgp_japan_decision.9101.a: "นี่คือมาตรการจำเป็นเพื่อธำรงสันติภาพ..."

 tgp_japan_decision.9102.t: "$tgp_japan_decision.9101.t$"
 tgp_japan_decision.9102.desc: "รัฐบาลโชกุนได้ผงาดขึ้นภายใต้การปกครองของ [shogun.GetName] ยุติการประชุมถกเถียงในราชสำนักอันไม่สิ้นสุด ณ บัดนี้ คมดาบและนักรบคือผู้กุมอำนาจที่แท้จริง นำความมั่นคงและระเบียบวินัยมาสู่มือของเหล่าราษฎรโดยตรง\n\n"
 tgp_japan_decision.9102.admin: "อำนาจของข้าถูกริบไป ดินแดนของข้าถูกส่งมอบให้โชกุน ผู้ที่มาแทนที่ข้าคือเหล่าผู้กระหายสงครามที่ปกครองด้วยกำลังแทนที่จะเป็นคำพูด..."
 tgp_japan_decision.9102.feudal: "ดินแดนของเรายังคงปลอดภัย และอำนาจก็กลับคืนสู่มือของเรา ในยุคสมัยใหม่นี้ พละกำลังคือผู้ตัดสินทุกสิ่ง"
 tgp_japan_decision.9102.fallback: "หวังว่าเมื่อเวลาผ่านไป นี่จะพิสูจน์ได้ว่าเป็นการตัดสินใจที่บังเกิดผลดี"
 tgp_japan_decision.9102.a.admin: "ช่างเป็นระเบียบใหม่ที่ทารุณนัก"
 become_shogun_ritsuryo_vassals_tooltip: "#N [vassals|E] [governor|E] จำนวน [ritsuryo_count|0V] คน จะต่อต้านท่าน#!"
 become_shogun_soryo_vassals_tooltip: "#P [vassals|E] [feudal|E] จำนวน [soryo_count|0V] คน จะเข้าร่วมกับท่าน#!"
 become_shogun_allied_vassals_tooltip: "#P [vassals|E] ที่เป็น [allied|E] หรือ [house|E] เดียวกัน จำนวน [allied_count|0V] คน จะเข้าร่วมกับท่าน#!"

 # tgp_japan_imperial_branch_decision
 tgp_japan_decision.9201.t: "$tgp_japan_imperial_branch_decision$"
 tgp_japan_decision.9201.desc: "แม้ว่าข้าจะมีสายเลือดราชวงศ์ เป็นทายาทที่แท้จริงของ [nearest_emperor.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nearest_emperor'))] ของข้า ชะตาลิขิตของข้า และของเหล่าทายาทของข้า อยู่นอกกำแพงพระราชวังหลวง\n\nข้าจักสละสิทธิ์การอ้างสิทธิ์ใดๆ ใน [ROOT.Char.GetTopLiege.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetDefinitiveName|l] และจะรับ [Glossary( 'ฮงเซ', 'HONSEI_GLOSS' )] ตามธรรมเนียมที่พระราชทานแก่เชื้อพระวงศ์ที่ถูกตัดสิทธิ์ คือ [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] หรือ [Glossary( 'ไทระ', 'TAIRA_GLOSS' )]\n\n"
 tgp_japan_decision.9201.both: "นามทั้งสองเคยถูกพระราชทานแก่ทายาทของ [nearest_emperor.GetTitledFirstNamePossessiveNoTooltip] มาก่อนแล้ว ตระกูลเหล่านั้นนำโดย [minamoto_head.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))] ของข้า และ [taira_head.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))] ของข้า"
 tgp_japan_decision.9201.minamoto: "ตระกูล $dynn_Minamoto$ แห่ง [nearest_emperor.GetFirstNameNoTooltip] ได้ถือกำเนิดขึ้นแล้ว นำโดย [minamoto_head.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('minamoto_head'))] ของข้า"
 tgp_japan_decision.9201.taira: "ตระกูล $dynn_Taira$ แห่ง [nearest_emperor.GetFirstNameNoTooltip] ได้ถือกำเนิดขึ้นแล้ว นำโดย [taira_head.GetTitledFirstName] ผู้เป็น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('taira_head'))] ของข้า"
 tgp_japan_decision.9201.a: "ข้าจะเข้าร่วมกับ [minamoto_house.GetNameNoTooltip] $dynn_Minamoto$"
 tgp_japan_decision.9201.b: "ที่ของข้าคือการอยู่กับ [taira_house.GetNameNoTooltip] $dynn_Taira$"
 tgp_japan_decision.9201.c: "ข้าปรารถนาจะใช้นาม $dynn_Minamoto$"
 tgp_japan_decision.9201.c.tt: "ท่านก่อตั้ง #V [nearest_emperor.GetFirstNameNoTooltip] มินาโมโตะ#! [dynasty|E]"
 tgp_japan_decision.9201.d: "'$dynn_Taira$ [ROOT.Char.GetFirstNameNoTooltip]' ช่างฟังดูน่าเกรงขาม"
 tgp_japan_decision.9201.d.tt: "ท่านก่อตั้ง #V [nearest_emperor.GetFirstNameNoTooltip] ไทระ#! [dynasty|E]"
 tgp_japan_decision.9201.message_title: "สาขาตระกูลจักรพรรดิ"
 new_honsei_house_name: "[nearest_emperor.GetFirstNameNoTooltip]"
 may_found_noble_family_tt: "ท่านอาจได้เป็นประมุขของ [noble_family|E] ใหม่"
 will_found_noble_family_tt: "ท่านจะได้เป็นประมุขของ [noble_family|E] ใหม่"

 # tgp_japan_emperor_restoration_decision
 tgp_japan_decision.9301.t: "ปลดพันธนาการ"
 tgp_japan_decision.9301.desc: "ในฐานะจักรพรรดิ ข้าได้ทวงคืนสถานะอันชอบธรรมของข้าในฐานะผู้นำที่แท้จริงของดินแดนนี้ อำนาจของข้ามิได้ถูกกุมโดยผู้ที่หวังเพียงเติมเต็มความทะเยอทะยานของตนอีกต่อไป และทุกสิ่งได้ถูกฟื้นคืนสู่ราชบัลลังก์ดอกเบญจมาศแล้ว"
 tgp_japan_decision.9301.a: "ดวงตะวันเพื่อนำทางแผ่นดิน"
 tgp_japan_decision.9302.t: "[tenno.GetTitleAsNameNoTooltip] ผู้มีชัย"
 tgp_japan_decision.9302.desc: "ข่าวการกลับมาของ $game_concept_tenno_possessive$ แพร่สะพัดไปดั่งไฟลามทุ่ง [tenno.GetName] ได้ฟื้นฟูการมีอยู่แห่งองค์จักรพรรดิของ [tenno.GetHerHis] หวังเป็นอย่างยิ่งว่าจะทรงริบอำนาจคืนจากเงื้อมมืออันเกียจคร้านและมุ่งร้าย\n\nบัดนี้ [tenno.GetSheHe|U] ตั้งพระทัยที่จะปกครองผู้คนในดินแดนนี้โดยตรงจากราชบัลลังก์ดอกเบญจมาศ และการครองราชย์ของ [tenno.GetHerHis] จะไม่ถูกมองเป็นเพียงพิธีการอีกต่อไป"
 tgp_japan_decision.9302.a: "ขอให้สิ่งนี้เป็นการกลับคืนสู่ระเบียบ"

 # tgp_japan_become_a_poet_decision
 tgp_japan_decision.9401.t: "คำเปรียบเปรยและฉันทลักษณ์"
 tgp_japan_decision.9401.desc: "วันคืนอันไม่สิ้นสุดและราตรีที่ไม่ได้หลับใหลผ่านไปเพื่อความเข้าใจในบทกวีของข้า แผ่นกระดาษปลิวว่อนไปทั่ว เหลือทิ้งไว้เพียงลายเส้นขยุกขยิกและรอยหมึกในการแสวงหาความรู้ของข้า\n\nถึงเวลาแล้วที่ข้าจะต้องเลือกเส้นทางข้างหน้า นี่คือสิ่งที่ควรค่าแก่การใฝ่หา หรือข้าควรจะล้มเลิกการไล่ตามนี้เสีย?"
 tgp_japan_decision.9401.a: "ทุ่มเทสุดกำลัง ข้า #EMP จัก#! เข้าใจให้จงได้"
 tgp_japan_decision.9401.a.toast.success: "ท่านสามารถเข้าใจในบทกวีได้สำเร็จ"
 tgp_japan_decision.9401.a.toast.failure: "ท่านไม่เข้าใจเรื่องราวทั้งหมดนี้อย่างถ่องแท้"
 tgp_japan_decision.9401.b: "ข้าเปลี่ยนใจแล้ว"
 
 # tgp_japan_become_a_monk_decision
 tgp_japan_decision.9500.t: "เส้นทางเดินใหม่แห่งชีวิต"
 tgp_japan_decision.9500.desc: "ด้วยอ้อมกอดอันอบอุ่น ข้าขอต้อนรับการตรัสรู้ที่เพิ่งค้นพบใหม่สู่การเกิดใหม่ — ซึ่งข้าได้กำเนิดใหม่อีกครั้ง\n\nข้าจะอุทิศชีวิตของข้าเพื่อ [ROOT.Char.GetFaith.GetName] ใช้ชีวิตในวันสุดท้ายของข้าเพื่อฝึกฝนและเทศนาสิ่งที่ข้าค้นพบระหว่างทาง\n\nข้าจะรับใช้ [ROOT.Char.GetLiege.GetTitleAsName] ของข้า ด้วยการค้นหาความกลมกลืนระหว่างมรดกทางวัฒนธรรมของเรา และให้ธรรมชาติชี้นำเมื่อถึงเวลาที่บทเรียนใหม่จะถือกำเนิด"
 tgp_japan_decision.9500.a: "ข้าขอต้อนรับท่าน ดินแดนสุขาวดีอันสูงส่ง"

 # tgp_japan_establish_soryo_administration_decision
 
 tgp_japan_decision.9603.t: "สถาปนาระบบโซเรียว: ประกาศิตเรียกรวมพล"
 tgp_japan_decision.9603.desc: "ความทะเยอทะยานอันมิอาจเติมเต็มของ [daijo_daijin.GetTitledFirstName] นั้นไร้ขอบเขต บัดนี้ [daijo_daijin.GetSheHe] ผลักดันการปฏิรูปอย่างเปิดเผย ซึ่งจะตอกย้ำอำนาจของตระกูล [daijo_daijin.GetHerHis] และพันธมิตร\n\nไม่ว่าเราจะมีความเห็นพ้องหรือเห็นต่างประการใดเกี่ยวกับการปกครองญี่ปุ่น การที่ [daijo_daijin.GetHouse.GetBaseNameNoTooltip] ก้าวขึ้นสู่ตำแหน่งที่ครอบงำ เช่นนี้ควร ทำให้เราทุกคนหยุดคิด"
 tgp_japan_decision.9603.leader: "\n\n[leader.GetTitledFirstName] ได้ปรากฏตัวขึ้นเป็นผู้นำการต่อต้าน และกำลังรวบรวมกองทัพของ [leader.GetHerHis] แม้ในขณะนี้"
 tgp_japan_decision.9603.a: "ตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] จะไม่นิ่งเฉยต่อเรื่องนี้"
 tgp_japan_decision.9603.a.bloc: "[ROOT.Char.GetConfederation.GetName] จะไม่นิ่งเฉยต่อเรื่องนี้"
 tgp_japan_decision.9603.b: "นี่มิใช่การต่อสู้ของเรา"
 tgp_japan_decision.9603.a.tt: "สมาชิก [THIS.Char.GetConfederation.GetName|V] ทั้งหมดจะเข้าร่วม [war|E]"
 tgp_japan_decision.9605.t: "สถาปนาระบบโซเรียว: จับอาวุธ"
 tgp_japan_decision.9605.desc: "ขณะที่ข้าผลักดันการปฏิรูปและความตั้งใจของข้าชัดเจนขึ้น เหล่ากบฏก็รวมตัวกัน [leader.GetTitledFirstName] แห่ง [leader.GetHouse.GetBaseNameNoTooltip] ได้กลายเป็นผู้นำของการทรยศครั้งนี้ และกำลังรวบรวมไพร่พลแม้ในขณะนี้\n\nมิต้องใส่ใจ พวกเรา [ROOT.Char.GetHouse.GetBaseNameNoTooltip] จะไปพบพวกมันในสนามรบ และพวกเรา [ROOT.Char.GetHouse.GetBaseNameNoTooltip] จะเป็นผู้มีชัย"
 tgp_japan_decision.9605.peace: "ขณะที่ข้าผลักดันการปฏิรูปและความตั้งใจของข้าชัดเจนขึ้น มีเพียงความเงียบงันที่ตอบกลับมา — การต่อต้านที่คาดไว้ไม่เคยเกิดขึ้น บางทีข้าอาจประเมินศรัทธาของอาณาจักรที่มีต่อ [ROOT.Char.GetHouse.GetBaseNameNoTooltip] ต่ำไป\n\nเมื่อไม่มีกบฏให้ต้องรับมือ ในที่สุดญี่ปุ่นก็สามารถรุ่งเรืองภายใต้ยุคใหม่แห่งการปกครองอันเปี่ยมเมตตาของ [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9605.a: "กบฏเหล่านี้จะถูกบดขยี้"
 tgp_japan_decision.9605.b: "อาณาจักรได้ประจักษ์ถึงปัญญาแล้ว"
 tgp_japan_decision.9606.t: "สถาปนาระบบโซเรียว: การครอบงำของ [daijo_daijin.GetHouse.GetBaseNameNoTooltip]"
 tgp_japan_decision.9606.desc: "ในที่สุด กองกำลังกบฏที่หลงผิดก็พ่ายแพ้ เมื่อ [leader.GetTitledFirstName] ผู้นำของพวกมัน ถูกนำตัวมาเบื้องหน้าข้าในพันธนาการ น้อยคนนักที่จะสงสัยว่าสันติภาพที่สัญญาไว้อยู่ในกำมือของเราแล้ว\n\nเมื่อผู้ต่อต้านทั้งหมดเงียบเสียงลง ในที่สุดญี่ปุ่นก็สามารถรุ่งเรืองภายใต้ยุคใหม่แห่งการปกครองอันเปี่ยมเมตตาของ [daijo_daijin.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9606.a: "หลีกเลี่ยงไม่ได้ และจำเป็น"
 tgp_japan_decision.9607.desc: "เป็นที่น่าตกตะลึงทั่วเมืองหลวง [daijo_daijin.GetTitledFirstName] ได้รับชัยชนะเหนือผู้ที่ต่อต้านการปฏิรูปของ [daijo_daijin.GetHerHis] ซึ่งบัดนี้ถูกเรียกว่ากบฏ นำพาอาณาจักรเข้าสู่ยุคใหม่แห่งการครอบงำของ [daijo_daijin.GetHouse.GetBaseNameNoTooltip]\n\n"
 tgp_japan_decision.9607.desc.other: "หวังว่าตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip] จะสามารถหาที่ทางอันคู่ควรในระเบียบใหม่นี้ได้"
 tgp_japan_decision.9607.desc.winner: "การรับใช้อย่างภักดีของเราต่อ [daijo_daijin.GetHouse.GetBaseNameNoTooltip] ในอุดมการณ์อันชอบธรรมนี้ จะได้รับรางวัลตอบแทนอย่างมิต้องสงสัย"
 tgp_japan_decision.9607.desc.loser: "นี่คือวันอันมืดมิดสำหรับ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] และสำหรับตระกูล [ROOT.Char.GetHouse.GetBaseNameNoTooltip]..."
 tgp_japan_decision.9607.a: "มีเรื่องให้ครุ่นคิดอีกมาก"

 # tgp_japan_restore_japanese_monarchy_decision
 tgp_japan_decision.9901.t: "เท็นโนยามาโตะได้รับการฟื้นฟู"
 tgp_japan_decision.9901.desc: "เทนโนยังคงแข็งแกร่ง และบัลลังก์ดอกเบญจมาศได้กลับคืนสู่ทายาทที่ชอบธรรม การปกครองนี้มิใช่เพียงบรรดาศักดิ์หรือสถานะของขุนนางเท่านั้น แต่สะท้อนให้เห็นถึงความผูกพันอันเก่าแก่ของยามาโตะที่มีต่อดินแดนเหล่านี้"
 tgp_japan_decision.9901.a: "นับเป็นเกียรติที่จะได้ถวายคำแนะนำแด่ [scion.GetHerHim]"
 tgp_japan_decision.9901.a.scion: "ในที่สุด..."
 tgp_japan_decision.9902.desc: "สายเลือดศักดิ์สิทธิ์แห่งยามาโตะได้กลับมาปรากฏอีกครั้งในพระราชวังหลวง [scion.GetName] ทายาทแห่งอามาเทราสึ ดำรงตำแหน่งทายาท ดัง เช่นในสมัยโบราณ\n\nด้วยการหวนคืนสู่ประเพณีนี้ อาณาจักรอาจกลับมารุ่งเรืองอีกครั้งภายใต้แสงอันรุ่งโรจน์แห่งราชบัลลังก์ดอกเบญจมาศ"
 tgp_japan_decision.9902.a: "เท็นโนจงเจริญ!"
 # tgp_restore_japanese_government_decision
 tgp_japan_decision.9911.t: "ฟื้นฟูระบบราชการริตสึเรียว"
 tgp_japan_decision.9911.desc: "ถึงเวลาสำหรับการปกครองใหม่ มิใช่ด้วยกำลังอันป่าเถื่อน แต่ด้วยปลายปากกา\n\nมีเพียงรัฐบาลที่เป็นระบบเท่านั้นที่สามารถอำนวยความยุติธรรมได้ ในขณะที่เหล่านักรบบิดเบือนกฎหมายเพื่อประโยชน์ของตน ภายใต้การปกครองของข้า กฎหมายจะชัดเจน ยุติธรรม และมั่นคง — ดังที่บรรพบุรุษผู้สูงศักดิ์ของเราตั้งใจไว้"
 tgp_japan_decision.9911.rebel: "\n\nด้วยการต่อต้านวิถีแห่งบรรพชนของเรา [rebel.GetName] ยืนหยัดต่อต้านการตัดสินใจของข้า ด้วยกองทัพของ [rebel.GetHerHis] ที่ถูกยกขึ้น ความปรารถนาของข้าในระบบราชการจึงถูกท้าทาย"
 tgp_japan_decision.9911.a: "วิถีเก่าคือวิถีที่ดีที่สุด"
 tgp_japan_decision.9912.desc: "[kampaku.GetName] ได้หวนคืนสู่วิถีแห่งบรรพชนของเรา โดยเสนอให้มีระบบราชการอยู่เหนือชนชั้นนักรบ [kampaku.GetSheHe|U] แสวงหาการฟื้นฟูระเบียบภายในอาณาจักร นำอำนาจมาสู่ราชบัลลังก์และราชสำนักเหนือกว่าตระกูลท้องถิ่น"
 tgp_japan_decision.9912.rebel: "\n\nทว่า การเปลี่ยนแปลงครั้งสำคัญ เช่นนี้ย่อมไม่ปราศจากความขัดแย้ง [rebel.GetName] ได้ลุกขึ้นต่อต้าน [kampaku.GetFirstNameNoTooltip] เพื่อประท้วง โดยมีบางคนคล้อยตามความรู้สึกของ [rebel.GetHerHis]..."
 tgp_japan_decision.9912.b: "ข้าจะไม่ละทิ้งอำนาจของข้า!"
 tgp_japan_decision.9913.desc: "[actor.GetTitledFirstName] คือคนโง่ที่เห็นแก่การขยายอำนาจของ [actor.GetHerHis] มากกว่าผลประโยชน์ของจักรวรรดิ ข้าจะไม่นิ่งดูดาย ในขณะที่เจ้าเหนือหัวของเรารังแกข้าหลวงผู้ภักดีของ [actor.GetHerHis] ข้าขอเรียกร้องให้ท่านเข้าร่วมกับข้าในการต่อสู้เพื่อขับไล่ทรราชผู้นี้"
 tgp_japan_decision.9913.a: "ท่านจะไม่ยืนหยัดเพียงลำพัง!"
 tgp_japan_decision.9913.b: "เจ้าต่างหากคือกบฏ!"

#tgp_japan_assert_regional_dominion_government_decision
tgp_japan_decision.9960.t: "ยืนยันอำนาจปกครองส่วนภูมิภาค"
tgp_japan_decision.9960.intro: "ข้าจะรวม [title_scope.GetNameNoTier] ให้เป็นหนึ่งเดียวภายใต้ธงของข้า ผืนดินมุมนี้จะเป็นป้อมปราการแห่งเสถียรภาพ และเป็นแบบอย่างให้แก่จักรวรรดิที่เต็มไปด้วยความโกลาหลของเรา"
tgp_japan_decision.9960.agree: "\n\nเหล่าเจ้าที่ดินท้องถิ่นแสดงปัญญาอันยิ่งใหญ่..."
tgp_japan_decision.9960.partial_war: "\n\nในขณะที่เหล่าเจ้าที่ดินท้องถิ่นผู้ชาญฉลาดเห็นพ้อง กลับมีคนโง่เขลาเพียงไม่กี่คนที่แห่ไปรวมตัวใต้ธงของ [main_defender.GetName] แทนที่จะยอมจำนนต่ออำนาจของข้า"
tgp_japan_decision.9960.full_war: "\n\nเหล่าเจ้าที่ดินท้องถิ่นกระหายการแตกแยก! ช่างโง่เขลาเสียนี่กระไร พวกมันแห่ไปรวมตัวใต้ธงของ [main_defender.GetName] แทนที่จะยอมจำนนต่ออำนาจของข้า"
tgp_japan_decision.9960.a: "...บางทีพวกมันอาจค้นพบปัญญาในชาติหน้า"
tgp_japan_decision.9960.b: "...และทั้งหมดยอมจำนนต่ออำนาจของข้า"
tgp_bloc_members_join_war_effect_tt: "หากท่านเป็นผู้นำ [bloc|E] สมาชิกจะเข้าร่วม [war|E] ของท่าน"
tgp_japan_assert_regional_dominion_kampaku_crime_effect: "@warning_icon! #X [ceremonial_regent|E] คือ [ritsuryo|E] และจะถือว่านี่คือ [crime_i|E][crime|E]#!"

tgp_japan_decision.9961.t: "[title_scope.GetNameNoTierNoTooltip] ภายใต้ธงผืนเดียว"
tgp_japan_decision.9961.desc: "วันอันสดใสสำหรับ [title_scope.GetNameNoTier]! บ้างก็มองไม่เห็นปัญญาในการปกครองของข้า แต่ทะเลธนูและเปลวเพลิงสามารถเป็นครูผู้เคร่งครัดได้\n\nอีกไม่นานความขัดแย้งนี้จะถูกลืมเลือน โลหิตของผู้ล่วงลับจะปลูกข้าวให้แก่ลูกหลานในวันพรุ่ง ขอให้การแสดงความเป็นหนึ่งเดียวของเราปูทางให้แก่จักรวรรดิโดยรวม"
tgp_japan_decision.9961.a: "ธงของข้าจะโบกสะบัด ณ ที่ใดต่อไป?"

tgp_japan_decision.9962.t: "ธงของข้าแหลกสลาย"
tgp_japan_decision.9962.desc: "อุดมการณ์ของข้าชอบธรรม ไม่ควรมีการรบ แต่การรบก็เกิดขึ้น ในความพ่ายแพ้ ปัญญาของข้าไม่เป็นที่รับฟัง ความโกลาหลครอบงำ [title_scope.GetName] คือกระจกสะท้อนของจักรวรรดิ\n\nพวกเราผู้ปรารถนาความกลมเกลียวต้องทนทุกข์ และผู้ที่จิตวิญญาณแปดเปื้อนกลับถูก ทำให้สำเร็จ"
tgp_japan_decision.9962.a: "แล้วอย่างไรต่อ?"

tgp_japan_decision.9963.opening: "[ROOT.Char.GetName] ธงของข้ากำลังเรียกหา,"
tgp_japan_decision.9963.desc: "ท่านได้เป็นประจักษ์พยานถึงความขัดแย้งที่รบกวนจักรวรรดิของเรา ข้า [super_soryo.GetName] จะรวม [title_scope.GetName] ให้เป็นหนึ่ง และสลักเสลาป้อมปราการแห่งสันติภาพและเสถียรภาพ จงยอมจำนนต่อธงของข้า หรือเข้าร่วมกับพวกใจแคบในความโง่เขลาแห่งการต่อต้านของพวกมัน"
tgp_japan_decision.9963.a: "ข้ายอมจำนน"
tgp_japan_decision.9963.b: "สู่สงคราม!"
tgp_japan_decision.9963.a.tt: "หาก [super_soryo.GetShortUIName] ชนะ [super_soryo_war.GetName] [super_soryo.GetSheHe] จะยึดครอง [title_scope.GetName] และท่านจะกลายเป็น [vassal|E] ของ [super_soryo.GetHerHis]"
super_soryo_war_no_holder_custom_tooltip: "เริ่ม [domination_war|E] ต่อต้าน [main_defender.GetShortUIName] เพื่อแย่งชิง [title_scope.GetName]\n\t$BULLET$[holder|E] [county|E] โดย [de_jure|E] ทุกคนของ [title_scope.GetName] จะเข้าร่วมกับ [main_defender.GetShortUIName] ในฐานะผู้ป้องกัน #weak (@soldier_icon![super_soryo_war_current_enemy_strength|N0])#!"
super_soryo_potential_peaceful: "@alert_icon!การที่จะให้[holder|E] [county|E] โดย [de_jure|E] ทุกคนของ [title_scope.GetName] มาเป็น [vassal|E] ของท่านโดยไม่ต้องต่อสู้:\n$EFFECT_LIST_BULLET$ [prestige_level|E] ของท่านคือ [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$ [legitimacy_level|E] ของท่าน มากกว่าหรือเท่ากับ #V 3#!\n$EFFECT_LIST_BULLET$มี [dread_i][dread|E] สูง\n$EFFECT_LIST_BULLET$กำลังทหาร @soldier_icon!Military Strength ที่เหนือกว่าอย่างท่วมท้น#!"
super_soryo_reward_peaceful: "[holder|E] [county|E] โดย [de_jure|E] ทุกคนของ [title_scope.GetName] จะกลายเป็น [vassal|E] ของท่าน"
