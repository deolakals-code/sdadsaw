l_english: 
 unsanctioned_deity: "เทพนอกทำเนียบ"
 unsanctioned_deity_contract: "$unsanctioned_deity$"
 unsanctioned_deity_desc: "เหล่าไพร่ฟ้าแห่งเคาน์ตี้นี้สักการะเทพเถื่อน และข่าวลือถึงอภินิหารอันเป็นมงคลของเทพองค์นั้นก็แพร่สะพัดไปทั่วอาณาจักร"
 unsanctioned_deity_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0050.t: "$unsanctioned_deity$"
 governor_contract_events_tova.0050.desc: "ผู้คนจำนวนมากผิดสังเกตพากันเข้าแถวตามท้องถนนใน [deity_destination.GetName] เพื่อกราบไหว้และเผากำยานเบื้องหน้าแท่นบูชาของเทพเถื่อน ทั้งเหล่ากสิกรและชาวเมืองต่างหลั่งไหลมาจากทั่วทุกมุมของอาณาจักรเพื่อนำเครื่องเซ่นไหว้อันน้อยนิดเท่าที่ตนมีมาถวาย \n\nหากข้าไม่จัดการเรื่องนี้ ความงมงายอันป่าเถื่อนนี้จะยังคงแพร่สะพัดไปทั่วทั้งแขวง"
 governor_contract_events_tova.0050.a: "เรื่องนี้ข้าต้องให้ความสนใจอย่างเต็มที่"
 governor_contract_events_tova.0050.a.tt: "เดินทางไปยัง [deity_destination.GetName] และตรวจสอบปัญหา"
 governor_contract_events_tova.0050.b: "ข้ามีเรื่องเร่งด่วนกว่าที่ต้องกังวล..."
 governor_contract_events_tova.0051.desc: "ข้าตามกลิ่นกำยานอันคละคลุ้งใน [deity_destination.GetName] แหวกทางผ่านถนนอันพลุกพล่าน และไปถึงแท่นบูชาเจ้าปัญหานั่น \n\n[ROOT.Char.Custom('RandomPeasantGrievance')] เมื่อพิจารณาจากคราบดินที่กระเซ็นบนขากางเกงของ [worshipper.GetHerHis] [worshipper.GetSheHe] คงเดินทางมาไกลพอสมควรเพื่อมาที่นี่ \n\nเมื่อถามถึงเทพองค์นั้น [worshipper.GetSheHe] บอกข้าว่ามันปรากฏกายเป็น [ROOT.Char.Custom('RandomVerySmallCreature')] และอาศัยอยู่ใน [ROOT.Char.Custom('RandomVerySmallCreatureDwelling')] ข้างถนน"
 governor_contract_events_tova.0051.a: "ประกาศรับรองเทพองค์นี้ต่อสาธารณะ"
 governor_contract_events_tova.0051.b: "สลายกลุ่มผู้สักการะและเผาแท่นบูชาทิ้ง"
 governor_contract_events_tova.0051.c: "ยึดของถวายจากผู้ศรัทธา"
 governor_contract_events_tova.0051.d: "เจรจาด้วยเหตุผลกับเหล่าผู้สักการะ"
 governor_contract_events_tova.0051.e: "ข้าจะปล่อยให้เหล่านักบวชจัดการเรื่องนี้"
 governor_contract_events_tova.0052.desc_burn: "เหล่าทหารของข้าบุกฝ่าฝูงชนอย่างรวดเร็ว จัดการกับผู้ที่ยังอ้อยอิ่งขวางทาง คบเพลิงถูกโยนลงบนแท่นบูชา ไม่ช้าเปลวไฟก็ลุกโชนสู่ท้องฟ้า ความร้อนแรงของมันขับไล่ผู้สักการะเพียงไม่กี่คนที่ยังเหลืออยู่ให้ถอยห่างออกไป \n\nข้ากล่าวได้อย่างเด็ดขาดว่า ความสงบเรียบร้อยได้กลับคืนสู่เคาน์ตี [deity_destination.GetName] ขจัดความงมงายออกไป เพื่อให้เหตุผลได้งอกงาม"
 governor_contract_events_tova.0052.desc_debunk: ""...และนั่นคือเหตุผลว่าทำไมสัตว์ตัวนี้ถึง #EMP ไม่ใช่#! เทพเจ้า ที่จริงแล้ว เรา แต่ละคนล้วนสร้างโชคชะตาของตนเอง ผ่านความเป็นมนุษย์และการประพฤติตนอย่างมีคุณธรรม" \n\nฝูงชนเงียบกริบ ตกตะลึงในทักษะวาทศิลป์อันเหนือชั้นของข้า ข้ามองเห็นอย่างชัดเจนในวินาทีที่ทุกคนตระหนักถึงความผิดพลาดของตน และเริ่มแยกย้ายกันไป"
 governor_contract_events_tova.0052.a: "มันก็ควรจะเป็น เช่นนั้น"
 governor_contract_events_tova.0053.desc_burn: "เหล่าทหารของข้าพยายามบุกฝ่าฝูงชน และข้าก็ประหลาดใจที่เห็นเหล่าผู้สักการะที่โกรธเกรี้ยวผลักดันกลับมา! คบเพลิงที่ตั้งใจจะโยนใส่แท่นบูชาร่วงหล่นสู่พื้น และความโกลาหลก็บังเกิด \n\nข้าและผู้ติดตามหนีออกมาได้ทันอย่างหวุดหวิดก่อนที่เปลวไฟจะลามมาถึงตัวเรา"
 governor_contract_events_tova.0053.desc_debunk: ""... ซึ่งหมายความว่าหนทางเดียวที่แท้จริงที่เราจะรับประกันโชคชะตาของตนเองได้คือการทำความดีด้วยตนเอง แต่แน่นอน เราไม่ควรทำอะไรมากเกินไปเพียงเพื่อรับใช้ผลประโยชน์ส่วนตน ทีนี้ ข้ากำลังพูดเรื่องอะไรอยู่?" \n\nเสียงพึมพำแสดงความไม่พอใจดังระงมไปทั่วฝูงชน บางคนซ่อนสิ่งที่ข้ามั่นใจว่าเป็นรอยยิ้มเยาะเย้ยไว้หลังแขนเสื้อ \n\nความร้อนผ่าวขึ้นมาที่ใบหน้า ข้าหันหลังและจากไปก่อนที่จะขายหน้าไปมากกว่านี้"
 governor_contract_events_tova.0053.a: "มันไม่เป็นไปตามแผนเลย!"
 task_contract_reward_effect_sanction_deity_desc: "เทพองค์นี้ได้รับการรับรองจากทางการ"
 task_contract_reward_effect_claim_offerings_desc: "ของมีค่าที่แท่นบูชาถูกริบโดยท่าน"
 task_contract_reward_effect_deity_monks_desc: "ท่านมอบหมายปัญหานี้ไป ดั่ง เช่นผู้ปกครองที่แท้จริง"
 escaped_justice: "หลบหนีการพิพากษา"
 escaped_justice_contract: "$escaped_justice$"
 escaped_justice_desc: "อาชญากรผู้หนึ่งหลบหนีการพิพากษาและหนีมายังเคาน์ตี้นี้ แทนที่จะไปรายงานตัวตามหมายเรียกของศาล"
 escaped_justice_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0055.t: "$escaped_justice$"
 governor_contract_events_tova.0055.desc: "ข้าได้รับแจ้งว่า [escapee.GetTitledFirstName] ละเลยหน้าที่ของ [escapee.GetHerHis] ถึงขั้นยักยอกเงินจากคลังหลวง \n\nเมื่อได้รับหมายเรียกให้มารับการพิพากษาที่ศาลของข้า [escapee.GetSheHe] ก็รวบรวมคนของ [escapee.GetHerHis] และหลบหนีเข้าไปในป่า ที่ ซึ่งตอนนี้พวกเขายึดกระท่อมของชาวนาผู้น่าสงสารอยู่! \n\nเหล่าทหารยามติดอาวุธและพร้อมที่จะปกป้องตำแหน่งของ [escapee.Custom('MistressMaster')] ของตน เป็นที่ชัดเจนว่า [escapee.GetTitledFirstName] จะไม่ยอมจำนนหากข้าไม่ยื่นมือเข้าไป"
 governor_contract_events_tova.0055.a: "ข้าต้องไปที่นั่นเดี๋ยวนี้!"
 governor_contract_events_tova.0055.a.tt: "เดินทางไปยัง [escapee_destination.GetName] และตรวจสอบปัญหา"
 governor_contract_events_tova.0055.b: "เจ้าหนูโสโครกนั่นเดี๋ยวก็ต้องโผล่หน้าออกมา..."
 governor_contract_events_tova.0056.desc: ""อย่าเข้ามา!" นักธนูคนหนึ่งตะโกนใส่ข้า เล็งมาที่เราจากหลัง [ROOT.Char.Custom('OutdoorsHidingPlace')] บางอย่าง พ้นจากท่าทางคุกคามของ [thug.GetHerHis] ข้าเหลือบไปเห็นอาคารที่อาชญากรที่ข้ากำลังไล่ล่าซ่อนตัวอยู่ \n\nเมื่อตัดสินจากเสียงกิ่งไม้หักในพุ่มไม้สูง ทหารยามอีกจำนวนหนึ่งก็เตรียมพร้อมรับมือการมาถึงของข้า"
 governor_contract_events_tova.0056.a: "เกลี้ยกล่อมผู้หลบหนีให้ยอมรับการพิพากษา"
 governor_contract_events_tova.0056.b: "สังหารเจ้าคนขี้ขลาดนั่นและคนของ [escapee.GetHerHis] เสีย"
 governor_contract_events_tova.0056.c: "ข้าพร้อมที่จะเสนอการผ่อนปรนให้บ้าง"
 governor_contract_events_tova.0056.d: "เนรเทศ [escapee.GetHerHim] ไปเสีย"
 governor_contract_events_tova.0057.desc_persuade: ""ดูสารรูปเจ้าสิ! นี่มันการกระทำของ [escapee.GetWomanMan] บ้าชัดๆ นั่นคือสิ่งที่เจ้าอยากให้ราชวงศ์ [escapee.GetDynastyName] เป็นที่จดจำรึ? ละเว้นญาติพี่น้องของเจ้าจากความอับอายเสียเถอะ และมากับข้า" \n\nอาจเป็น เพราะคำพูดของข้า หรือน้ำเสียงของข้า แต่ [escapee.GetTitledFirstName] ก็ออกมาจากที่ซ่อน [escapee.GetSheHe|U] ยกมือของ [escapee.GetHerHis] ขึ้นในท่าทางยอมจำนนและมอบตัว"
 governor_contract_events_tova.0057.desc_slay: "ความสงบอันเปราะบางพังทลายลงกลายเป็นเสียงกู่ร้องของสงครามและเสียงเหล็กกระทบกันดังลั่น เมื่อคนของข้าบุกเข้าโจมตีเหล่าทหารยามของ [escapee.GetTitledFirstName] \n\nผู้ต่อต้านทั้งหมดล้มลงกับพื้น เกราะของพวกเขาแตกหัก และชีวิตก็หลั่งรินลงสู่พื้นดิน จากนั้น [escapee.GetTitledFirstName] ก็ถูกลากมาต่อหน้าข้า เพื่อให้ข้าได้ตัดหัวของ [escapee.GetHerHis] ซึ่งข้าก็จัดการในดาบเดียวอย่างเฉียบขาด"
 governor_contract_events_tova.0057.a: "งานของข้าที่นี่เสร็จสิ้นแล้ว!"
 governor_contract_events_tova.0058.desc_persuade: "ข้าอ้าปากพูด แต่กลับพยายามนึกหาแรงจูงใจดีๆ ของการถูกจองจำ ข้าได้ยินตัวเองพูดว่า "การถูกบังคับให้โดนกักขังนี่มันยอดเยี่ยมสำหรับการสร้างตัวตนเลยนะ!" และข้ารู้ว่าข้าได้สูญเสียโอกาสที่จะเกลี้ยกล่อม [escapee.GetTitledFirstName] ให้มาโดยดีแล้ว \n\n[escapee.GetSheHe|U] จะได้เห็นเองว่าการเน่าตายในที่ซ่อนนั้นมันน่าเพลิดเพลินเพียงใด"
 governor_contract_events_tova.0058.desc_slay: "ความสงบอันเปราะบางพังทลายลงกลายเป็นเสียงกู่ร้องของสงครามและเสียงเหล็กกระทบกันดังลั่น \n\nคนของข้าพุ่งเข้าใส่ผู้ต่อต้านอย่างกล้าหาญ ดาบเตรียมพร้อม แต่การโจมตีของพวกเขากลับฟันโดน แต่อากาศ และพวกเขาไม่สามารถป้องกันการโจมตีตอบโต้ได้ \n\nข้ามองดูคนของข้าถูกผลักดันให้ถอยกลับมาและตระหนักว่าการถอยทัพเป็นเพียงทางเลือกเดียว"
 governor_contract_events_tova.0058.a: "ช่างน่าอับอายสิ้นดี..."
 forced_conscription: "การบังคับเกณฑ์ทหาร"
 forced_conscription_contract: "$forced_conscription$"
 forced_conscription_desc: "ระดมไพร่พลเพื่อเตรียมกองทัพของท่านสำหรับสงคราม"
 forced_conscription_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0060.t: "$forced_conscription$"
 governor_contract_events_tova.0060.desc: ""ในยามขยายดินแดน เป็นหน้าที่ของเราที่จะต้องระดมพลเพื่อสงครามที่อาจเกิดขึ้น" คือจุดเริ่มต้นของสาส์นที่ส่งมาจากเจ้านายของข้า \n\n"พวกเขาไม่จำเป็นต้องได้รับการฝึกฝน ไม่จำเป็นต้องมีอาวุธ กองหน้าจำนวนมหาศาลจะทำหน้าที่ทำลายล้างทุกการต่อต้าน" \n\nครอบครัวชาวนาภายใต้การควบคุมของข้าได้สละชายผู้เป็นหัวหน้าครอบครัวไปแล้ว ซึ่งนั่นเหลือเพียงบุตรชายของพวกเขาสำหรับการเกณฑ์ทหาร"
 governor_contract_events_tova.0060.a: "ด้วยกำลังอันมหาศาล เราจะบดขยี้ศัตรูของเรา!"
 governor_contract_events_tova.0060.a.tt: "ท่านตรวจสอบปัญหานี้เพิ่มเติม"
 governor_contract_events_tova.0060.b: "ข้าจะไม่สังเวยประชาชนของข้าเพื่อจุดประสงค์ เช่นนั้น"
 governor_contract_events_tova.0061.desc: "เมื่อมองออกไปยังเมืองเบื้องล่าง ข้าเห็นแสงไฟริบหรี่อยู่ไกลๆ ในหน้าต่างและประตูของอาคารเหล่านั้น \n\nครอบครัวต่างๆ ร่วมรับประทานอาหารด้วยกันในบ้านอันปลอดภัยของพวกเขา ชะตากรรมของพวกเขา ก็ เช่นเดียวกับไพร่ฟ้าทั้งหมดของข้า อยู่ในมือข้าที่จะตัดสินใจ"
 governor_contract_events_tova.0061.a: "จ่ายค่าชดเชยให้ครอบครัวเหล่านั้น"
 governor_contract_events_tova.0061.b: "ฉุดกระชากบุตรชายของพวกเขาออกจากบ้าน!"
 governor_contract_events_tova.0061.c: "ใช้ความกตัญญูเพื่อเกลี้ยกล่อมให้บุตรชายของพวกเขาสมัครเป็นทหาร"
 governor_contract_events_tova.0061.d: "บางทีข้าอาจจะละเว้นพวกเขาหากพวกเขายอมตกลงแลกเปลี่ยนบางอย่าง"
 combat_train_monks: "ติดอาวุธเหล่านักบวช"
 combat_train_monks_contract: "$combat_train_monks$"
 combat_train_monks_desc: "อารามแห่งหนึ่งในเคาน์ตี้นี้เป็นที่อยู่ของนักบวชจำนวนหนึ่ง ผู้ ซึ่งอาจถูกนำมาใช้เสริมสร้างการป้องกันของอาณาจักรได้ หากได้รับการฝึกฝนอย่างเหมาะสม"
 combat_train_monks_desc_title: "$task_contract_governance_desc_title$"
 governor_contract_events_tova.0065.t: "$combat_train_monks$"
 governor_contract_events_tova.0065.desc: "ข้าได้รับข่าวว่ามีนักบวชในอารามแห่ง [monks_destination.GetName] ผู้เป็นเลิศด้านการต่อสู้ด้วยมือเปล่า ดูเหมือนว่าพวกเขาจะฝึกฝนศิลปะการต่อสู้เพื่อเป็นการทำสมาธิ แต่บางทีทักษะเหล่านี้อาจนำไปใช้ประโยชน์เพื่อรับใช้อาณาจักรและปกป้องชายแดนได้ดีกว่า \n\nแต่ก่อนอื่น ข้าต้องทดสอบฝีมือของนักบวชเหล่านี้ก่อน"
 governor_contract_events_tova.0065.a: "ข้าจะไปดูว่านักบวชพวกนี้มีดีอะไร"
 governor_contract_events_tova.0065.a.tt: "เดินทางไปยัง [monks_destination.GetName] และดูแลการฝึกฝนของพวกเขา"
 governor_contract_events_tova.0065.b: "ไม่ ข้าจะปล่อยให้พวกเขาเป็นนักบวชต่อไป"
 governor_contract_events_tova.0066.desc: "ข้าเข้าไปในอารามขณะที่การประลองกำลังดำเนินอยู่ \n\nเสียงร้องดังลั่น เสียงฟาดดังสนั่น และนักบวชคนหนึ่งก็ล้มลงกับพื้น ฝุ่นตลบอบอวล ทุกคนโห่ร้องยินดี ข้าเองก็ เช่นกัน \n\nผู้ชนะนั้นโดดเด่นในฐานะหนึ่งในนักสู้ที่เก่งที่สุดในอาราม แท้จริงแล้ว เมื่อข้าพูดคุยกับเขา เขาโอ้อวดว่าเป็นผู้รับผิดชอบในการสอนนักบวชที่เหลือ"
 governor_contract_events_tova.0066.a: "พิสูจน์ฝีมือของเจ้าในการต่อสู้ด้วยมือเปล่า"
 governor_contract_events_tova.0066.b: "โอ้อวดเกี่ยวกับความสำเร็จด้านการต่อสู้ของข้า"
 governor_contract_events_tova.0066.c: "อธิบาย #EMP ให้ชัดเจน#! ว่าอาวุธนั้นมีประสิทธิภาพเพียงใด"
 governor_contract_events_tova.0066.d: "จอมทัพของข้าจัดการเรื่องนี้ได้"
 governor_contract_events_tova.0066.tt_success_desc: "เหล่านักบวชรู้สึกประทับใจ"
 governor_contract_events_tova.0066.tt_success: "สิ่งนี้จะปลดล็อกผลลัพธ์ในเชิงบวก"
 governor_contract_events_tova.0066.tt_failure_desc: "เหล่านักบวช #bold ไม่#! ประทับใจ"
 governor_contract_events_tova.0067.desc: ""
 governor_contract_events_tova.0067.desc_martial: "ผู้ชมรวมตัวกันเป็นวงกลมรอบตัวข้าและคู่ต่อสู้ของข้าอย่างรวดเร็ว \n\nทันทีที่เราโค้งคำนับ ข้าก็ตั้งท่าพร้อมโจมตี และไม่รอช้า พุ่งไปข้างหน้าและโค่นนักบวชผู้นั้นลง นี่คือความแตกต่างระหว่างศิษย์กับอาจารย์! \n\nเพียงเท่านั้น การประลองก็จบลงทันทีที่มันเริ่ม เหล่าผู้เฝ้าดูต่างรอคอยอย่างคาดหวังว่าข้าจะพูดอะไรต่อไป"
 governor_contract_events_tova.0067.desc_diplomacy: ""... และเมื่อดาบของข้าหลุดมือ ข้าก็เข้าปล้ำกับเจ้าปิศาจเหม็นคลุ้งที่ข้าต้องสู้ด้วย และใช้หมัดของข้ากระแทกเข้าที่หัวของมันอย่างทรงพลัง!" \n\nจากสีหน้าที่จดจ่อของผู้ชม ข้าบอกได้เลยว่าเหล่านักบวชเชื่อมั่นในความสามารถและอำนาจของข้า"
 governor_contract_events_tova.0067.desc_learning: ""เพียงแค่แรงกระแทกก็เพียงพอที่จะหักกระดูกได้ แม้ว่าอาวุธจะไม่ทะลุเกราะก็ตาม! นี่คือจุดที่ความกว้างและวัสดุของใบมีดเข้ามามีบทบาท..." \n\nข้าแทรกแนวคิดทั่วไปที่เข้าใจง่ายเข้าไปในคำพูดของข้ามากพอที่จะ ทำให้แม้ แต่คนธรรมดาที่สุดก็เข้าใจได้ เมื่อข้าพูดจบ ก็ไม่ต้องสงสัยเลยว่าเหล่านักบวชเชื่อมั่นในเหตุผลของข้าอย่างเต็มที่ \n\nพวกเขาตั้งใจฟังสิ่งที่ข้าจะพูด"
 governor_contract_events_tova.0067.a: "พวกเขาทั้งหมดควรรับใช้ในกองทัพของข้า!"
 governor_contract_events_tova.0067.b: "นักบวชผู้นี้สามารถพิสูจน์ตนว่าเป็นอัศวินที่มีประโยชน์ได้"
 governor_contract_events_tova.0067.c: "ข้าจะสร้างนักสู้จากนักบวชเหล่านี้"
 governor_contract_events_tova.0067.d: "ข้าจะวางกำลังทหารไว้ที่นี่เพื่อช่วยเสริมความแข็งแกร่งให้ภูมิภาคนี้"
 governor_contract_events_tova.0068.desc: ""
 governor_contract_events_tova.0068.desc_martial: "ข้าก้าวไปข้างหน้า เชิดหน้าอกผาย พร้อมที่จะแสดงให้นักบวชเหล่านี้เห็น \n\nเราโค้งคำนับ และก่อนที่ข้าจะได้ยืดตัวตรง คู่ต่อสู้ของข้าก็พุ่งเข้ามาหาข้าพร้อมเสียงร้องดังลั่น! ทั้งหมดที่ข้าเห็นคือฝ่ามือของ [warrior_monk.GetHerHis] ที่พุ่งออกมาและฟาดเข้าที่กลางอกของข้าเต็มๆ ทำให้ข้าหายใจไม่ออกและล้มแผ่ลงกับพื้น \n\nข้านอนอยู่ตรงนั้น พยายามหายใจ และสงสัยว่านักบวชพวกนี้เข้าถึงน้ำพุภูเขาชนิดใดกันถึงได้แข็งแกร่งขนาดนี้"
 governor_contract_events_tova.0068.desc_diplomacy: ""เรื่องทั้งหมดมันเริ่มต้นเมื่อข้ายังเยาว์วัย..." \n\nข้าเล่าเรื่องไปได้ไม่นานก็สังเกตเห็นว่าข้าเสียความสนใจจากผู้ฟังส่วนใหญ่ไปแล้ว ฝูงชนดูบางตาลง \n\nการพยายามกอบกู้สถานการณ์กลับยิ่ง ทำให้แย่ลง และหนึ่งในนักบวชอาวุโสถึงกับเผลอหลับไป!"
 governor_contract_events_tova.0068.desc_learning: ""... แต่การที่จะเข้าใจอย่างถ่องแท้ว่าอาวุธทำงานอย่างไร พวกท่านต้องรู้เกี่ยวกับประวัติศาสตร์ของการตีเหล็กเสียก่อน" \n\nข้าเริ่มต้น แต่ก็พบอย่างรวดเร็วว่าดูเหมือนจะไม่มีใครเข้าใจสิ่งที่ข้ากำลังพูด หรือว่ามันเกี่ยวข้องอย่างไร!"
 governor_contract_events_tova.0068.a: "ช่างน่าผิดหวังเสียจริง..."

