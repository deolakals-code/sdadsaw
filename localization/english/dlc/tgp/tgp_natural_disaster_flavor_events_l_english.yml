l_english: 
 natural_disaster_flavor_events.0001.t: "ยามเหล่าผู้คุ้ยซากชุมนุม"
 natural_disaster_flavor_events.0001.desc: "ท่ามกลางซากปรักหักพัง เหล่าผู้คุ้ยซากมาชุมนุมกันเพื่อรุมทึ้งเหล่าดวงวิญญาณเคราะห์ร้ายที่มิได้ใส่ใจคำเตือนจากพลังแห่งธรรมชาติ ชิ้นส่วนถูกฉีกทึ้งจากซากศพ เผยให้เห็นเนื้อหนังอันเน่าเฟะแก่ทุกคนที่กล้าพอจะทนมอง\n\nคงมีไม่กี่คนที่จะฉวยโอกาสค้นหาดินแดนต้องสาปเหล่านี้ แต่ณ ที่ ซึ่งผู้อื่นลังเล โอกาสใหม่กลับปรากฏ"
 natural_disaster_flavor_events.0001.a: "ค้นหาของมีค่าในซากปรักหักพัง"
 natural_disaster_flavor_events.0001.a.gold.toast: "ท่านพบทองคำ"
 natural_disaster_flavor_events.0001.a.provisions.toast: "ท่านพบเสบียงที่ยังกินได้"
 natural_disaster_flavor_events.0001.a.artifact.toast: "ท่านพบสิ่งประดิษฐ์โบราณ"
 random_misc_artifact: "แหวนที่ถูกทิ้ง"
 random_misc_artifact_desc: "แหวนอันแปลกประหลาดที่ถูกขุดพบท่ามกลางซากปรักหักพัง ซึ่งถูกธรรมชาติทำลายล้าง"
 natural_disaster_flavor_events.0001.b: "ไปค้นหาผู้รอดชีวิตกันเถอะ"
 natural_disaster_flavor_events.0001.b.success.toast: "พบและช่วยเหลือผู้รอดชีวิต"
 natural_disaster_flavor_events.0001.b.failure.toast: "การค้นหาของท่านสูญเปล่า"
 natural_disaster_flavor_events.0001.c: "ไม่มีอะไรสำหรับเราที่นี่"

 natural_disaster_flavor_events.0005.t: "ฝันร้ายยามตื่น"
 natural_disaster_flavor_events.0005.desc: "ข้าสะดุ้งตื่นจากการหลับใหลด้วยเสียงกรีดร้องของผู้คนที่วิ่งพล่านไปทั่วค่ายพักในทุกทิศทาง ท่ามกลางความโกลาหล ข้าพยายามตั้งหลักอย่างงัวเงียเพื่อสำรวจว่าเกิดสิ่งใดขึ้น แต่ก็ต้องสั่นสะท้านไปทั้งตัวเมื่อเสียงครืนครั่นอันไม่คุ้นเคยดังใกล้เข้ามาทุกขณะจากแดนไกล\n\nไม่ว่าสิ่งใดกำลังจะบังเกิด ข้าต้องลงมือทันทีก่อนที่มันจะสายเกินแก้"
 natural_disaster_flavor_events.0005.a: "ตัวใครตัวมัน!"
 natural_disaster_flavor_events.0005.a.success.toast: "ท่านพบตำแหน่งที่ค่อนข้างปลอดภัยได้สำเร็จ"
 natural_disaster_flavor_events.0005.a.failure.toast: "ท่านหาที่ปลอดภัยไม่ทันเวลา"
 natural_disaster_flavor_events.0005.b: "ข้าต้องออกไปจากที่นี่ โดยเร็ว"
 natural_disaster_flavor_events.0005.b.success.toast: "ท่านพบที่หลบภัยที่ดีพอ"
 natural_disaster_flavor_events.0005.b.failure.toast: "ความรู้ของท่านเกี่ยวกับพลัง เช่นนี้นั้นยังด้อยนัก"
 tgp_selfish_actions_character_modifier: "เฉียดฉิว"
 tgp_selfish_actions_character_modifier_desc: "ความอึดของตัวละครนี้ได้พิสูจน์คุณค่าของมันระหว่างการเผชิญหน้ากับธรรมชาติ"
 tgp_finding_safe_spot_character_modifier: "ตำแหน่งที่ปลอดภัย"
 tgp_finding_safe_spot_character_modifier_desc: "การรับรู้ถึงสิ่งรอบข้างของตัวละครนี้นำพาพวกเขาไปสู่ที่ปลอดภัย"

 natural_disaster_flavor_events.0010.t: "เหล่าวิญญาณผู้สิ้นหวัง"
 natural_disaster_flavor_events.0010.desc: "ฝูงชนผู้สิ้นหวังและสิ้นเนื้อประดาตัวเบียดเสียดกันอยู่ณ ปากทางแห่งหายนะ อารมณ์หลากหลายปะทุไปทั่วฝูงชนอันซอมซ่อ – บรรยากาศแตกสลายด้วยเสียงสะอื้น เสียงคร่ำครวญ และเสียงกรีดร้อง\n\nเมื่อเห็นคณะผู้ติดตามของข้า พวกเขาก็พากันโซซัดโซเซเข้ามาแทบจะพร้อมเพรียงกัน ในสภาพกึ่งเป็นกึ่งตายและดวงตาลึกโบ๋ พลางยื่นมือออกมาและทรุดเข่าลงอ้อนวอน\n\nพวกเขาคิดว่าเรามาเพื่อช่วยเหลือ แต่ข้าจะสามารถทำสิ่งใดเพื่อผู้คนมากมายถึงเพียงนี้ได้?"
 natural_disaster_flavor_events.0010.a: "รับรองพวกเขาว่าความช่วยเหลือกำลังจะมาถึง"
 natural_disaster_flavor_events.0010.a.success.toast: "ปลอบโยนพวกเขาว่าความช่วยเหลืออยู่ระหว่างทาง"
 natural_disaster_flavor_events.0010.a.failure.toast: "ฝูงชนรอคอยมานานเกินพอแล้ว"
 natural_disaster_flavor_events.0010.b: "โกหกพวกที่กำลังมองหาคำตอบ"
 natural_disaster_flavor_events.0010.b.success.toast: "ท่านโกหกฝูงชน"
 natural_disaster_flavor_events.0010.b.failure.toast: "ผู้คนมองทะลุคำโกหกของท่าน"
 natural_disaster_flavor_events.0010.c: "อย่าให้มือโสโครกของพวกมันมาแตะต้องตัวข้า!"
 natural_disaster_flavor_events.0010.c.tt: "คณะผู้ติดตามของท่านผลักฝูงชนที่อ่อนแอนั้นไปด้านข้างอย่างง่ายดาย"
 tgp_deceitful_overconfidence_character_modifier: "ทอดทิ้งผู้โชคร้าย"
 tgp_deceitful_overconfidence_character_modifier_desc: "ตัวละครนี้เลือกที่จะทอดทิ้งคนกลุ่มน้อยที่มองหาการชี้แนะในช่วงเวลาที่ยากลำบาก"
 tgp_abandoned_population_modifier: "ประชากรที่ถูกทอดทิ้ง"
 tgp_abandoned_population_modifier_desc: "จังหวัดนี้มีคนโกหกและคนขี้ขลาดเป็นผู้นำ"

 natural_disaster_flavor_events.0015.t: "การกระทำอันเสียสละ"
 natural_disaster_flavor_events.0015.desc: "การเดินเล่นสบายๆ ในสวนพร้อมกับ [spouse.GetFirstName], [heir.GetFirstName] และ [courtier.GetFirstName] พลันแปรเปลี่ยนเป็นฝันร้าย\n\nเสียงกรีดร้องแหลมบาดหูดังไปทั่วทั้งเมือง ส่งผลกระทบต่อทุกคนที่อยู่ในระยะด้วยความหวาดหวั่นและตื่นตระหนก ข้ามองไปที่ [spouse.GetFirstNameNoTooltip] เพื่อยืนยัน แต่สีหน้าของ [spouse.GetHerHis] ก็บอกทุกสิ่งที่ข้าจำเป็นต้องรู้แล้ว\n\nโดยมิทันได้ไตร่ตรอง ข้าก็รู้ว่าเราต้องหาตำแหน่งที่ปลอดภัยกว่าที่เราอยู่ตอนนี้"
 natural_disaster_flavor_events.0015.a: "ช่วยเหลือคู่สมรสของท่าน [spouse.GetFirstNameNoTooltip]"
 natural_disaster_flavor_events.0015.a.success: "ท่านหนีรอดจากหายนะโดยไม่ได้รับบาดเจ็บ"
 natural_disaster_flavor_events.0015.a.failure: "ได้รับบาดเจ็บ"
 natural_disaster_flavor_events.0015.b: "ช่วยเหลือทายาทของท่าน [heir.GetFirstNameNoTooltip]"
 natural_disaster_flavor_events.0015.b.success: "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.b.failure: "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.c: "ช่วยเหลือข้าราชสำนักของท่าน [courtier.GetFirstNameNoTooltip]"
 natural_disaster_flavor_events.0015.c.success: "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.c.failure: "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.d: "ช่วย #EMP ตัวท่านเอง.#!"
