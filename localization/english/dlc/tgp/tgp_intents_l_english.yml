l_english: 
 #Examination Intents
 imperial_exam_taker_intent: "เข้าสอบ"
 imperial_exam_taker_intent_desc: "ท่านจะพยายามสอบให้ผ่าน เพื่อเพิ่ม [merit|E] ของท่าน"
 local_exam_taker_intent: "$imperial_exam_taker_intent$"
 local_exam_taker_intent_desc: "$imperial_exam_taker_intent_desc$"
 imperial_exam_support_entrants_intent: "สนับสนุนผู้เข้าสอบ"
 imperial_exam_support_entrants_intent_desc: "ท่านแสวงหาโอกาสที่จะเพิ่มพูนโอกาสของ [disciples|E] และ [close_family_members|E] ที่มีอยู่ของท่าน"
 local_exam_support_entrants_intent: "$imperial_exam_support_entrants_intent$"
 local_exam_support_entrants_intent_desc: "$imperial_exam_support_entrants_intent_desc$"
 exam_assist_exam_intent: "ช่วยการสอบ"
 exam_assist_exam_intent_desc: "ท่านประสงค์จะคลุกคลีกับเหล่าว่าที่ขุนนางและบ่มเพาะ [GetTrait('confucian_education').GetName( GetNullCharacter )] ของท่าน"
 exam_recruit_courtiers_intent: "เสาะหาผู้มีความสามารถ"
 exam_recruit_courtiers_intent_desc: "ท่านแสวงหาการค้นพบผู้มีความสามารถในหมู่บุคคลที่ถูกเลือกจากทั่วทั้งดินแดน"
 exam_give_favor_intent: "การเลือกที่รักมักที่ชัง"
 exam_give_favor_intent_desc: "ท่านจะพยายามเพิ่มพูนโอกาสของ [dynasty_members|E] ของท่าน"

 raise_cohesion_intent: "ส่งเสริมความสามัคคี"
 raise_cohesion_intent_desc: "ท่านประสงค์จะบ่มเพาะความรู้สึก [cohesion|E] ที่ยิ่งใหญ่ขึ้นภายใน [bloc|E] ของท่าน"
 add_to_bloc_intent: "ชักชวนเข้ากลุ่ม"
 add_to_bloc_intent_desc: "ท่านจะพยายามพัฒนาความสัมพันธ์ของท่านกับ [house_head|E] อื่น และดึงพวกเขาเข้าหา [bloc|E] ของท่าน"
 remove_from_bloc_intent: "กีดกันออกจากกลุ่ม"
 remove_from_bloc_intent_desc: "ท่านแสวงหาการหว่านความแตกแยกและ ทำให้ [house_head|E] อื่นเหินห่างจาก [bloc|E] ของพวกเขา"

 debate_increase_movement_power_intent: "เพิ่มอำนาจขบวนการ"
 debate_increase_movement_power_intent_desc: "ท่านประสงค์จะส่งเสริมจุดยืนของ [movement|E] ของท่าน ผ่านการป้ายสีขบวนการอื่นหรือเพิ่มพูน [movement_power|E] ของท่านเอง"
 debate_gain_disciples_intent: "รับศิษย์"
 debate_gain_disciples_intent_desc: "ท่านแสวงหาการค้นพบผู้มีพรสวรรค์เชิงปัญญาที่กำลังเบ่งบานและรับ [disciples|E] ใหม่"
 debate_gain_elder_intent: "รับผู้อาวุโส"
 debate_gain_elder_intent_desc: "ท่านแสวงหาการค้นพบ [elder|E] หรือแทนที่ผู้อาวุโสคนปัจจุบันของท่านด้วยปราชญ์ผู้มีปัญญาเฉียบแหลมกว่า"
