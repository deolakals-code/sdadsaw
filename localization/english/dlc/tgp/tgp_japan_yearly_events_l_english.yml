l_english: 

 #Wordplay of the word "shiki" in Japanese meaning "spread"
 tgp_japan_yearly_events.0001.t: "แบ่งปันความสุข"
 tgp_japan_yearly_events.0001.desc: "แม้ว่าข้าจะสนิทสนมกับ [ROOT.Char.Custom2('RelationToMe', gift_receiver)] ของข้า [gift_receiver.GetFirstName] ข้าก็อดสังเกตมิได้ว่า [gift_receiver.GetSheHe] ยิ้มน้อยลงกว่าปกติ ข้าคงไม่พึงใจนักหากจะคิดว่าเป็น เพราะข้า!\n\nขณะกำลังสำรวจของน่าอภิรมย์ในตลาด ข้าก็ไปพบกับพ่อค้าคนหนึ่งกำลังขาย [Glossary( 'อุจิวะ', 'UCHIWA_GLOSS' )] อันงดงามหลากชนิด เขายืนกรานว่า:\n\n“ห่อสิ่งนี้ด้วย [Glossary( 'ฟุโรชิกิ', 'FUROSHIKI_GLOSS' )] ของท่านเถิด แล้วผู้ใดก็ตามที่ได้รับย่อมจักรู้ว่าท่านหมายจะแบ่งปันความสุข!”"
 tgp_japan_yearly_events.0001.a: "นี่เป็นท่าทีที่สมบูรณ์แบบเพื่อยกระดับจิตใจ [gift_receiver.GetFirstNameNoTooltip] ที่รักของข้า"
 tgp_japan_yearly_events.0001.tt.gift_appreciation: "ชื่นชมของขวัญ"
 tgp_japan_yearly_events.0001.a_spouse_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.friend_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.lover_toast: "[gift_receiver.GetTitledFirstNameNoTooltip] $tgp_japan_yearly_events.0001.tt.gift_appreciation$"
 tgp_japan_yearly_events.0001.b: "ไม่ นี่เป็นของขวัญที่ดีเกินไปสำหรับ [gift_receiver.GetHerHim]..."
 tgp_japan_yearly_events.0001.b.flavor: "... แต่เป็นของขวัญที่สมบูรณ์แบบสำหรับข้า!"
 tgp_japan_yearly_events.0001.c: "พ่อค้าหน้าเลือดพวกนี้น่าเหนื่อยหน่ายจริง"
 UCHIWA_GLOSS: "พัดกระดาษแบบจีน เป็นที่นิยมในหมู่ขุนนางญี่ปุ่น และมักประดับประดาด้วยลวดลายอันงดงาม"
 FUROSHIKI_GLOSS: "ผ้าสำหรับตก แต่งและใช้งานได้จริง ตามตัวอักษรหมายถึง “ผ้าปูอาบน้ำ” จาก furo หรือ “อาบน้ำ” และ shiki แปลว่า “ปู” คำนี้มีที่มาจากขุนนางที่ไปโรงอาบน้ำและห่อสัมภาระของตนด้วยผ้าที่ตก แต่งด้วยตราประจำตระกูล"

 #Artifact
 uchiwa: "อุจิวะ"
 uchiwa_desc: "ลวดลายอันละเอียดอ่อนประดับประดาพัดทำมือเล่มนี้ ซึ่งทำจากไม้ไผ่และกระดาษ"

 tgp_japan_yearly_events.0006.t: "สมบัติจากท้องทะเล"
 tgp_japan_yearly_events.0006.desc: "ขณะที่ข้าเดินไปตามแนวชายฝั่งใน [pearl_diver.GetCurrentLocation.GetBaronyNameExplicitly] ข้าสะดุดเข้ากับกลุ่มนักดำน้ำ [Glossary( 'อามะ', 'AMA_DIVERS_GLOSS' )] ที่กำลังตรวจสอบของที่จับมาได้\n\nผู้นำของพวกเขาปกปิด [pearl_diver.GetHerselfHimself] และเข้ามาใกล้ “[ROOT.Char.Custom('FormOfAddressForLiege')|U] โปรดทอดพระเนตร/มองดูความอุดมสมบูรณ์ที่ท้องทะเลมอบให้!”\n\nการเรียงรายของไข่มุกและหอยเป๋าฮื้อฉ่ำน้ำนั้นน่าประทับใจยิ่งนัก"
 tgp_japan_yearly_events.0006.a: "ของที่จับได้นี้ควรแบ่งปันให้ชาวบ้านในท้องถิ่น"
 tgp_japan_yearly_events.0006.tt.success: "บรรลุข้อตกลงได้สำเร็จ"
 tgp_japan_yearly_events.0006.tt.failure: "[pearl_diver.GetTitledFirstNameNoTooltip] ยังไม่คล้อยตาม"
 tgp_japan_yearly_events.0006.b: "สมบัติบางอย่างที่ซ่อนอยู่ใต้คลื่น"
 tgp_japan_yearly_events.0006.c: "วัดคงจะได้รับเกียรติจากสิ่งที่ [ROOT.Char.GetFaith.WaterGodName] ประทานให้"
 tgp_japan_yearly_events.0006.d: "ไม่มีเวลามาต่อรองแล้ว"
 AMA_DIVERS_GLOSS: "#bold อามะ#! — หมายถึง "สตรีแห่งท้องทะเล" — คือนักดำน้ำที่เป็นที่รู้จักในการเก็บไข่มุกและของมีค่าอื่นๆ จากก้นทะเล โดยทั่วไปเป็นสตรี พวกนางมีชื่อเสียงในด้านความสามารถในการกลั้นหายใจได้เป็นเวลานาน"

 tgp_japan_yearly_events.0012.t: "เรื่องของวานร"
 tgp_japan_yearly_events.0012.desc: "ขณะเดินป่าขึ้นไปบน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] แห่ง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] หมอกอุ่น ๆ ก็ปกคลุมลงมาที่ข้า\n\nโชคดีอะไร เช่นนี้! ข้าเหลือบไปเห็น [Glossary( 'ออนเซ็น', 'ONSEN_GLOSS' )] ที่กำลังส่งไอร้อน แต่ดูเหมือนข้าจะไม่ใช่แขกคนแรกของวัน\n\nลิงหิมะเจ้าเล่ห์ตัวหนึ่งได้ลงไปในอ่างอาบน้ำแล้ว! แม้ว่ากล้ามเนื้อของข้าจะเมื่อยล้าและรักแร้ของข้าก็เริ่มส่งกลิ่นเหม็น ข้าก็สงสัยว่าการอาบน้ำกับสัตว์ป่าจะปลอดภัยหรือไม่"
 tgp_japan_yearly_events.0012.a: "#EMP โบกไม้โบกมือ, กรีดร้อง"
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.success: "ลิงวิ่งหนีไปด้วยความกลัว"
 tgp_japan_yearly_events.0012.a.monkey.martial.tt.failure: "ลิงไม่สนใจความพยายามอันน่าสมเพชของข้าที่จะไล่มัน"
 tgp_japan_yearly_events.0012.b: "แสร้งทำเป็นว่าข้าไม่เป็นอันตราย"
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.success: "ลิงดูสนใจ แต่ก็ปล่อยข้าไว้"
 tgp_japan_yearly_events.0012.b.monkey.intrigue.tt.failure: "ลิงพุ่งเข้าใส่ข้า ขู่ให้ข้าถอยไป"
 tgp_japan_yearly_events.0012.c: "อย่าไปยุ่งกับลิงเลย"

 tgp_japan_yearly_events.0013.t: "ชำระล้างจิตวิญญาณ"
 tgp_japan_yearly_events.0013.desc: "เสียงสวดมนต์แผ่วเบาดึงดูดข้าขึ้นไปตามเส้นทางภูเขา เมื่อเข้าใกล้ต้นตอ ข้าก็พบกับม่านหมอกอุ่นหนาทึบ ปกคลุมร่างเงาของ [mystic.GetWomanMan]\n\n[mystic.GetSheHe] เพียงแค่มองมาในทิศทางของข้า และพยักพเยิดให้ข้าเข้าร่วมกับ [mystic.GetHerHim] ใน [Glossary( 'ออนเซ็น', 'ONSEN_GLOSS' )] ดูเหมือนว่ากำลังจะมีพิธีกรรมเกิดขึ้น"
 tgp_japan_yearly_events.0013.a: "เข้าร่วมในพิธี"
 tgp_japan_yearly_mystic_positive.tt: "ข้าค้นลึกลงไปในตนเองเพื่อค้นหาความจริง"
 tgp_japan_yearly_mystic_neutral.tt: "ข้าพยายามเข้าใจความหมายเบื้องหลังถ้อยคำนั้น"
 tgp_japan_yearly_mystic_negative.tt: "ข้าไม่เข้าใจสิ่งที่กำลังถูกร้องขอจากข้า"
 tgp_japan_yearly_events.0013.b: "ขอคำชี้แนะจากนักพรตแทน"
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.success: "ข้าเข้าใจความหมายเบื้องหลังปัญญานั้น"
 tgp_japan_yearly_events.0013.b.mystic.learning.tt.failure: "ข้าไม่รู้เลยว่ากำลังพูดถึงสิ่งใด"
 tgp_japan_yearly_events.0013.c: "ปล่อย [mystic.GetHerHim] ไว้อย่างสงบ"

 tgp_japan_yearly_events.0014.t: "ผ่อนคลายเสียบ้าง"
 tgp_japan_yearly_events.0014.desc: "ด้วยลมหายใจอันหนักหน่วงและหัวใจที่หนักอึ้ง ข้าใช้เรี่ยวแรงที่เหลืออยู่เฮือกสุดท้ายเงยหน้าขึ้น เผชิญหน้ากับยอดเขาพลางหรี่ตาเพื่อป้องกันลมหนาวเย็น\n\nน่าประหลาดใจ ที่มีไอจางๆ เล็กๆ อยู่ไกลลิบ สลายไปเมื่อลอยถึงความสูงระดับหนึ่ง แล้วก็วนซ้ำวัฏจักรเดิม — ซ้ำแล้วซ้ำเล่า ราวกับกำลังส่งคำเชิญให้ข้าเข้าไปหา\n\nหลังจากไปถึงยอดเขา ในที่สุดข้าก็ได้หยุดพักหายใจและชื่นชม [Glossary( 'ออนเซ็น', 'ONSEN_GLOSS' )] อันเชื้อเชิญที่อยู่เบื้องหน้า"
 tgp_japan_yearly_events.0014.a: "ลงไปในบ่อน้ำพุร้อน"
 tgp_japan_yearly_events.0014.b: "อยู่ต่ออีกสักครู่"
 tgp_japan_yearly_events.0014.c: "ไม่มีเวลาให้เสียเปล่า"

 ONSEN_GLOSS: "#bold ออนเซ็น#! — บ่อน้ำพุร้อนของญี่ปุ่น — น้ำพุธรรมชาติที่เป็นที่รู้จักในด้านคุณสมบัติในการบำบัดรักษา"

 tgp_japan_yearly_events.0021.t: "ท่ามกลางมวลบุปผา"
 tgp_japan_yearly_events.0021.desc: "[Glossary( 'ฮานามิ', 'HANAMI_GLOSS' )] มาถึงแล้ว! ต้นเชอร์รี่ที่เต็มไปด้วยดอกไม้บานสะพรั่ง ทำให้ทุกคนมีกำลังใจ ผู้คนใน [ROOT.Char.GetCurrentLocation.GetName] ทำนายว่าจะปลูกข้าวเมื่อใดและสวดอ้อนวอนขอให้ได้ผลผลิตอุดมสมบูรณ์\n\n[ROOT.Char.Custom2('RelationToMe', hanami_enjoyer)] ของข้า [hanami_enjoyer.GetTitledFirstName] ประกาศว่า “ชีวิตก็เหมือนความงามชั่วครู่ของดอกไม้บาน” คำพูดของ [hanami_enjoyer.GetHerHis|U] เตือนข้าว่าถึงเวลาต้องถวายเครื่องบูชาแล้ว"
 tgp_japan_yearly_events.0021.a: "ข้าขอถวายสาเกเล็กน้อย"
 tgp_japan_yearly_events.0021.a_pleased_deities.tt: "เหล่าทวยเทพ #EMP ดูเหมือน#! จะเห็นการกระทำของข้า"
 tgp_japan_yearly_events.0021.a_char_modifier.tt: "ข้ารู้สึกเหมือนภาระหนักอึ้งถูกยกออกจากบ่า"
 tgp_japan_yearly_events.0021.a_county_modifier.tt: "เหล่าพลเมืองเห็นการกระทำของข้า"
 tgp_japan_yearly_events.0021.a_nothing_happens.tt: "การกระทำของข้าไร้ ซึ่งการตอบรับ"
 tgp_japan_yearly_events.0021.b: "ใช้เวลาชื่นชมต้นไม้สักครู่"
 HANAMI_GLOSS: "#bold ฮานามิ#! - ประเพณีของชาวญี่ปุ่นในการ "ชมดอกไม้" โดยปกติคือการเบ่งบานของดอกซากุระ"

 tgp_japan_yearly_events.0026.t: "ตำนานแห่งเท็งงู"
 tgp_japan_yearly_events.0026.desc: "เสียงที่คุ้นเคยของ [ROOT.Char.Custom2('RelationToMe', rumormonger)] ของข้า [rumormonger.GetTitledFirstName] ดังลั่นมาจากโรงเตี๊ยม ตามด้วยเสียงหัวเราะที่เต็มไปด้วยสาเกของ [ROOT.Char.Custom2('RelationToMeShort', gossiper)] [gossiper.GetTitledFirstName] ของข้า\n\n“ทั่วดินแดนป่าเถื่อนที่ไม่มีใครพิชิตได้ของเรา มี [Glossary( 'เท็งงุ', 'TENGU_GLOSS' )] ซุ่มซ่อนอยู่! สัตว์ประหลาดที่ปกคลุมไปด้วยขนนก ซึ่งมีอารมณ์ดุร้ายพอ ๆ กับฝีดาบของมัน วิญญาณชั่วร้ายนี้ประณามทุกสิ่งที่ศักดิ์สิทธิ์!\n\nเมื่อจิบสาเกของ [rumormonger.GetHerHis] อีกอึกหนึ่ง “ถึงกระนั้นก็ควรกล่าวไว้ ผู้ใดก็ตามที่สามารถพิสูจน์ตนเองว่าคู่ควรในสายตาของอสูร จะได้รับรางวัลเป็นความเชี่ยวชาญด้านกลยุทธ์การต่อสู้ แต่เมื่อข้ามองออกไปในทะเลแห่งคนขี้ขลาดนี้ ข้าก็มั่นใจว่ามันเป็นเรื่องที่ไร้ประโยชน์สิ้นดี!”"
 tgp_japan_yearly_events.0026.a: "ข้าสงสัยว่ามันจะเป็นจริงหรือไม่"
 tgp_japan_yearly_events.0026.a.tt: "ในการเดินทางครั้งต่อไปของข้าผ่านภูเขาหรือป่าไม้ ข้าอาจได้พบกับสิ่งมีชีวิตอันลึกลับนี้"
 tgp_japan_yearly_events.0026.b: "เป็นเพียงตำนาน..."
 TENGU_GLOSS: "#bold เท็งงุ#! — หมายถึง “สุนัขสวรรค์” — เป็น [Glossary( 'โยวไค', 'YOKAI_GLOSS' )] รูปแบบหนึ่ง มักถูกวาดภาพให้เป็นสิ่งมีชีวิตคล้ายนก เป็นวิญญาณผู้พิทักษ์ แต่ก็อันตราย ซึ่งสถิตอยู่ตามภูเขาหรือป่าเขา เท็งงุในรูปแบบที่รู้จักกันแพร่หลายที่สุดในยุคปัจจุบันคือใบหน้าสีแดง ประกอบกับจมูกที่ยาว"

 tgp_japan_yearly_events.0027.t: "พิสูจน์คุณค่าของเจ้า"
 tgp_japan_yearly_events.0027.desc: "ขณะที่ข้าเดินทางผ่านป่าเขาแห่ง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ข้าไม่สามารถสลัดเรื่องเล่าที่ได้ยินเกี่ยวกับ [Glossary( 'เท็งงุ', 'TENGU_GLOSS' )] ออกไปได้\n\nเมื่อไม่มีแม้ แต่เงาผู้คน สิ่งเดียวที่ข้าได้ยินคือเสียงหัวใจที่เต้นรัว ขณะที่ข้าพยายามควบคุมการหายใจที่ตื่นตระหนก ความหวาดกลัวอันเยียบเย็นก็คืบคลานขึ้นมาตามสันหลัง...ข้ากำลังถูกจับตามอง\n\nดวงตาของข้าเหลือบไปทางเสียงฝีเท้า ข้าค้นหาสิ่งรอบข้างอย่างสิ้นหวัง และเหลือบไปเห็นเงาสะท้อนของคมดาบแวบผ่านสายหมอกหนาทึบ"
 tgp_japan_yearly_events.0027.a: "ข้าต้องสู้"
 tgp_japan_yearly_events.0027.a.tt.success: "ข้ารอดชีวิตเพื่อสู้ในวันหน้า"
 tgp_japan_yearly_events.0027.a.tt.success_explanation: "ท่านอาจได้รับ[traits|E] #P เชิงบวก#! เพิ่มเติม"
 tgp_japan_yearly_events.0027.a.tt.failure: "ข้าแพ้การต่อสู้ แต่ก็ใช่ว่าจะไม่บาดเจ็บ"
 tgp_japan_yearly_events.0027.b: ""ฟังสิ่งที่ข้าจะพูด!""
 tgp_japan_yearly_events.0027.b.tt.success: "ดูเหมือน [tengu_warrior.GetSheHe] จะถูกโน้มน้าวด้วยคำพูดของข้า"
 tgp_japan_yearly_events.0027.b.tt.failure: "[tengu_warrior.GetSheHe] ไม่สนใจสิ่งที่ข้าพูด"
 tgp_japan_yearly_events.0027.c: "หนีไป ในขณะที่ข้ายังทำได้"

 tgp_japan_yearly_events.0028.t: "ข่าวลือเท็จ"
 tgp_japan_yearly_events.0028.desc: "เมื่อพบว่าตนเองอยู่ใน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] แห่ง [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] ข้าก็อดไม่ได้ที่จะคอยสอดส่องมองหา [Glossary( 'เท็งงุ', 'TENGU_GLOSS' )]\n\nไม่เคยมีวันใดในชีวิตของข้าเลยที่จะมีการเดินผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] ที่ราบรื่น เช่นนี้ ข้าน่าจะรู้ดีกว่านี้ว่าไม่ควรไว้ใจเรื่องเล่าขี้โม้ของคนขี้เมา"
 tgp_japan_yearly_events.0028.a: "ข้าจะไม่ถูกหลอกอีก"
 tgp_japan_yearly_events.0028.b: "เปล่งเสียงกรีดร้อง"

 tgp_japan_yearly_events.0029.t: "การฝึกฝนสร้างความสมบูรณ์แบบ"
 tgp_japan_yearly_events.0029.desc: "แม้ว่า [tengu_warrior.GetTitledFirstName] อาจไม่ใช่ [Glossary( 'เท็งงุ', 'TENGU_GLOSS' )] แต่ [tengu_warrior.GetSheHe] ก็เป็นปรมาจารย์แห่งดาบ!\n\nการฝึกฝนอย่างขยันหมั่นเพียรนับไม่ถ้วนภายใต้การดูแลอย่างใกล้ชิดของ [tengu_warrior.GetHerHis] ได้บังเกิดผลในที่สุด\n\nดาบของข้าไม่รู้สึกเหมือนขวานของคนตัดไม้ที่ใช้ฟันแขนขาของมนุษย์อีกต่อไป แต่เป็นส่วนต่อที่สวยงามของร่างกายข้า พร้อมที่จะเอื้อมออกไปสัมผัสผู้ที่จะทำผิดต่อข้า\n\nอาจารย์ของข้าเตือนข้าว่า “นี่เป็นเพียงการเริ่มต้น เจ้ายังมีอีกมากที่ต้องฝึกฝน”"
 tgp_japan_yearly_events.0029.a: "ความเป็นผู้นำคือสิ่งที่จำเป็น"
 tgp_japan_yearly_events.0029.b: "ความช่ำชองอีกเล็กน้อยก็ไม่เสียหาย"

 tgp_japan_yearly_events.0036.t: "พรสวรรค์ด้านการทำสวน"
 tgp_japan_yearly_events.0036.desc: "[ROOT.Char.Custom2('RelationToMe', gardener)] [gardener.GetTitledFirstName] ของข้า กำลังเก็บรายละเอียดขั้นสุดท้ายในการขยายสระน้ำในสวนของข้า\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')] สวนของท่านเป็นภาพสะท้อนที่สมบูรณ์แบบของสวรรค์แห่ง [ROOT.Char.GetFaith.GetName]! มีอะไรให้ข้าตก แต่งเพิ่มเติมอีกหรือไม่ขอรับ/เพคะ?”"
 tgp_japan_yearly_events.0036.a: "ข้าควรจะยื่นมือเข้าช่วย"
 tgp_japan_yearly_events.0036.a.random_chance: "ยิ่ง [stewardship|E] ของท่านสูงเท่าใด โอกาสก็ยิ่งดีขึ้น:"
 tgp_japan_yearly_events.0036.b: "แค่... หายใจ"
 tgp_japan_yearly_events.0036.b.flavor: "การเมืองในราชสำนักหลายอย่างสามารถแก้ไขได้เมื่อบุรุษจดจ่ออยู่กับปลา"

 ONIBI_GLOSS: "#bold โอนิบิ#! หรือ "ไฟปีศาจ" เป็นรูปแบบหนึ่งของ [Glossary( 'โยวไค', 'YOKAI_GLOSS' )] ที่ปรากฏเป็นลูกไฟหรือเปลวไฟเรืองแสง เกิดจากวิญญาณของคนตาย พวกมันมักมุ่งร้าย ชักนำนักเดินทางไปสู่สถานการณ์ที่อันตรายหรือถึงแก่ชีวิต"
 YOKAI_GLOSS: "#bold โยไค#! หรือ "ภูตผีประหลาด" เป็นสิ่งมีชีวิตเหนือธรรมชาติที่พบในเทพปกรณัมญี่ปุ่น มีตั้งแต่ผี ปีศาจ สัตว์ประหลาด ผู้แปลงกาย และผู้หลอกลวง พวกมันมักปรากฏตัวพร้อมลักษณะคล้ายสัตว์"
 SORIBASHI_GLOSS: "#bold โซริบาชิ#! หรือ "สะพานจันทรา" มีต้นกำเนิดจากประเทศจีน เป็นสะพานเดินเท้าโค้งสูงชัน ใช้เพื่อวัตถุประสงค์ในการประดับตก แต่งในสวน หรือสร้างขึ้น เพื่อให้คนเดินเท้าข้ามลำธาร ในขณะที่เรือสามารถผ่านไปข้างใต้ได้"

 tgp_japan_yearly_events.1000.t: "เปลวเพลิงเริงระบำ"
 tgp_japan_yearly_events.1000.desc: "สายฝนโปรยปรายติดตามเราไปขณะที่เราเดินทางผ่าน [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] แห่ง [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]\n\nเมื่อฝนเริ่มลงเม็ดหนักขึ้น ข้าสังเกตเห็นแสงไฟเริงระบำ ริบหรี่อยู่ไกลๆ\n\n[ROOT.Char.Custom2('RelationToMeShort', chaplain)]ของข้า, [chaplain.GetFirstNameNoTooltip] แนะนำให้ระมัดระวัง โดยชี้ว่าพวกมันอาจเป็น [Glossary( 'โอนิบิ', 'ONIBI_GLOSS' )] ที่หวังจะล่อลวงเราไปสู่อันตราย"
 tgp_japan_yearly_events.1000.a: "อันตรายช่างปะไร, ไปดูกันว่าแสงไฟนั่นคืออะไร!"
 tgp_japan_yearly_events.1000.a.tt.success: "ในการติดตามโอนิบิ ท่านพบสมบัติที่ซ่อนอยู่"
 tgp_japan_yearly_events.1000.a.tt.failure: "ในการติดตามโอนิบิ ท่านลื่นล้มบนพื้นที่เปียก ทำให้บาดเจ็บ"
 tgp_japan_yearly_events.1000.b: "ไปหลบฝนกันก่อน แล้วเจ้าค่อยเล่าให้ข้าฟังเพิ่มเติม"
 tgp_japan_yearly_events.1000.b.tt.success: "[chaplain.GetFirstNameNoTooltip] ให้ข้อมูลเชิงลึกเกี่ยวกับโอนิบิ ซึ่งช่วยให้ท่านเข้าใจงานเขียนอื่นๆ ที่ท่านเคยอ่าน"
 tgp_japan_yearly_events.1000.b.tt.failure: "ความไม่สอดคล้องกันในคำอธิบายของ [chaplain.GetFirstNamePossessiveNoTooltip] ทำให้ท่านปวดหัว"
 tgp_japan_yearly_events.1000.c: "ใช่, ทางที่ดีอย่าอ้อยอิ่ง"

 tgp_japan_yearly_events.1010.t: "ความขัดแย้งระหว่างนิกาย"
 tgp_japan_yearly_events.1010.desc: ""ความตึงเครียดระหว่างชาว [buddhist_councillor_1.GetFaith.GetAdherentNamePlural] [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] และชาว [buddhist_councillor_2.GetFaith.GetAdherentNamePlural] [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] ทวีความรุนแรงขึ้นทุกวัน [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n[ROOT.Char.Custom2('RelationToMeShort', buddhist_councillor_1)]ของข้า [buddhist_councillor_1.GetFirstName] อุทาน\n\n"เหล่าพระ [buddhist_councillor_2.GetFaith.GetAdherentNameNoTooltip] [buddhist_councillor_2.Custom('DescriptorNegativeStandalone')] กำลังสวดภาวนาให้เราพบกับความพินาศ ได้โปรดเถิด เพื่อเห็นแก่ [ROOT.Char.GetFaith.HighGodName] โปรดแสดงให้ชัดเจนว่าท่านยืนหยัดเคียงข้างชาว [buddhist_councillor_1.GetFaith.GetAdherentNamePluralNoTooltip] [buddhist_councillor_1.Custom('DescriptorPositiveStandalone')] และมันจะชัดเจนว่าเราควรได้รับการสนับสนุน!""
 tgp_japan_yearly_events.1010.a: "ข้าจะยืนหยัดเคียงข้างพระ [buddhist_councillor_1.GetFaith.GetAdjectiveNoTooltip]"
 tgp_japan_yearly_events.1010.b: "ชาว [buddhist_councillor_2.GetFaith.GetAdherentNamePluralNoTooltip] เป็นฝ่ายถูก"
 tgp_japan_yearly_events.1010.c: "เหตุใดข้าต้องสนใจว่า [ROOT.Char.GetFaith.HighGodName] ได้รับการเคารพบูชาอย่างไร"
 faith_conversion_cost_tgp_japan_1010_event: "จากเหตุการณ์"
 tgp_japan_yearly_events.1010.a_discount: "ท่านได้รับส่วนลด #p 50%#! ในการเปลี่ยนไปนับถือ [buddhist_councillor_1.GetFaith.GetName]"
 tgp_japan_yearly_events.1010.b_discount: "ท่านได้รับส่วนลด #p 50%#! ในการเปลี่ยนไปนับถือ [buddhist_councillor_2.GetFaith.GetName]"
 every_buddhist_sect_1_vassal: "[vassal|E] ทุกคนที่นับถือ [buddhist_councillor_1.GetFaith.GetName]"
 every_buddhist_sect_2_vassal: "[vassal|E] ทุกคนที่นับถือ [buddhist_councillor_2.GetFaith.GetName]"
 tgp_japan_yearly_events.1010.c.tt: "การต่อสู้ ทำให้เกิดความไม่สงบทั่วทั้งอาณาจักร"

 tgp_japan_yearly_events.1020.t_siren: "บทเพลงของโอนิ"
 tgp_japan_yearly_events.1020.t_garden: "ศีรษะอันผลิบาน"
 tgp_japan_yearly_events.1020.t_shadow: "ความลึกแห่งเงาของข้า"
 tgp_japan_yearly_events.1020.desc_siren: "ท่วงทำนองอันโหยหวนปลุกข้าจากการหลับใหล สตรีนางหนึ่ง ซีดเซียวและสง่างาม ลอยอยู่เหนือข้า ขับขานบทเพลงแห่งหัวใจที่แตกสลาย\n\nการเอื้อมมือออกไป ทำให้ร่างของนางสลายไป เมื่อข้ากลับมามีสติ ความเจ็บปวดรวดร้าวของสตรีในฝันผู้นี้และความรักของนางที่มิอาจเป็นจริงได้ยังคงตามหลอกหลอนข้า"
 tgp_japan_yearly_events.1020.a_siren: "ความรักที่นางขับขาน ข้าต้องได้มันมา!"
 tgp_japan_yearly_events.1020.b_siren: "ความงาม เช่นนี้ควรได้รับการแบ่งปัน จงเผยแพร่ถ้อยคำของนางไปทั่วอาณาจักร"
 tgp_japan_yearly_events.1020.desc_garden: "ขณะเดินเล่นในสวน ข้าสังเกตเห็นดอกไม้แปลกตา\n\nขณะที่สูดดมกลิ่นของมัน สายลมก็โอบล้อมข้าราวกับเสียงกระซิบอันแผ่วเบา เมื่อเงยหน้าขึ้นดวงอาทิตย์ก็ส่องเข้าตาข้าพอดี ข้ากลับมามองที่ดอกไม้อีกครั้งเพียงเพื่อจะเห็นศีรษะอันน่าเกลียดน่ากลัวกำลังจ้องมองข้าเขม็ง ข้ากะพริบตาอีกครั้งและใบหน้านั้นก็หายไป"
 tgp_japan_yearly_events.1020.a_garden: "ดินนี้ต้องพิเศษแน่ จงเพาะปลูกต่อไป"
 tgp_japan_yearly_events.1020.b_garden: "ข้าต้องสร้างสิ่งก่อสร้างทับสวนนี้เพื่อผนึกมันไว้"
 tgp_japan_yearly_events.1020.desc_shadow: "เงาของข้า...แปลกไป มันดูเหมือนจะอ้อยอิ่งอยู่ครู่หนึ่งหลังจากที่ข้าเริ่มเดิน เมื่อข้าละสายตาไป ดูเหมือนมันเกือบจะเต้นรำกับเงาอื่นๆ แต่เมื่อข้ามองกลับไป มันก็กลับมาอยู่ข้างกายข้า\n\nแม้ว่ามันจะยังไม่ได้ทำร้ายข้า แต่เงาที่สามารถละทิ้งนายของมันได้ดูเหมือนจะเป็นอันตราย"
 tgp_japan_yearly_events.1020.a_shadow: "มีเพียงศัตรูของข้าเท่านั้นที่ควรเกรงกลัวเงาของข้า!"
 tgp_japan_yearly_events.1020.b_shadow: "ข้าต้องจุดคบไฟไว้ตลอดเวลา อย่าให้สิ่งใดเล็ดลอดไปได้"
 tgp_japan_yearly_events.1020.desc_end: "\n\nนี่เป็นความเครียดจากการเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่กำลังเล่นงานข้า หรือนี่อาจเป็นฝีมือของ [Glossary( 'โยวไค', 'YOKAI_GLOSS' )]?"
 tgp_japan_yearly_events.1020.c: "หึ! เป็น [ROOT.Char.GetFaith.TricksterGodName] ที่กำลังเล่นตลกกับข้า"

 tgp_japan_yearly_events.1030.t: "ใคร่ครวญเพื่ออนาคต"
 tgp_japan_yearly_events.1030.desc: "ข้าถูกดึงดูดไปยัง [ROOT.Char.GetFaith.HouseOfWorship] ที่อยู่ใกล้ๆ ด้วยเสียงปรบมือแผ่วเบาของผู้สักการะขณะที่พวกเขาวิงวอนต่อ [ROOT.Char.GetFaith.HighGodName] เพื่อขอโชคลาภ\n\nเป็นเวลานานแล้วที่ข้าไม่มีโอกาสได้สวดภาวนาและใคร่ครวญ ข้าควรจดจ่อกับสิ่งใดในปีต่อๆ ไป"
 tgp_japan_yearly_events.1030.a: "สุขภาพของข้า เหนือสิ่งอื่นใด"
 tgp_japan_yearly_events.1030.b: "อนาคตของราชวงศ์ [ROOT.Char.GetDynasty.GetNameNoTooltip] ต้องมั่นคง"
 tgp_japan_yearly_events.1030.c: "ความเจริญรุ่งเรืองของตระกูลเราเป็นสิ่งสำคัญที่สุด"
 tgp_japan_yearly_events.1030.d: "สิ่งที่ข้าต้องการคือความโปรดปรานจาก [ROOT.Char.GetFaith.HighGodName] เท่านั้น!"
 tgp_japan_yearly_events.1030.e: "ข้าจะไม่ให้การสวดภาวนามารบกวนความสงบของข้า"

 tgp_japan_yearly_events.1040.t: "สะพานจันทรา"
 tgp_japan_yearly_events.1040.desc: "ขณะมองหาทางข้ามคลอง ข้าพบสะพานโค้งอันงดงามที่ประดับประดาด้วยสีแดงชาด ข้าหยุดนิ่งด้วยความทึ่งในความสง่างามอันละเอียดอ่อนของ [Glossary( 'โซริบาชิ', 'SORIBASHI_GLOSS' )] นี้\n\nบางครั้ง การกระทำเล็กๆ น้อยๆ เพียงแค่การข้ามลำธารก็สามารถแฝงไปด้วยเจตจำนงได้"
 tgp_japan_yearly_events.1040.a: "นี่คือสะพานศักดิ์สิทธิ์ เราจะข้ามไปด้วยความระมัดระวัง"
 tgp_japan_yearly_events.1040.b: "ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ห้ามผู้ใดข้ามก่อนข้า"
 tgp_japan_yearly_events.1040.c: "ข้าไม่กล้าเดินบนสิ่ง เช่นนี้ จะเป็น เช่นไรหากมันพังลงมา"
 faith_conversion_cost_tgp_japan_1040_event: "จากการข้ามสะพานแดง"
 tgp_japan_yearly_events.1040.discount: "ท่านได้รับส่วนลด #p 50%#! ในการเปลี่ยนไปนับถือ [GetReligionByKey('shintoism_religion').GetName]"

 tgp_japan_yearly_events.1050.opening: "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_japan_yearly_events.1050.desc: "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่าท่านกำลังละเมิดกฎที่สำคัญยิ่ง:"
 tgp_japan_yearly_events.1050.desc.a: "#EMP สวนของท่านมีดอกไม้สีเหลืองมากเกินไป#!"
 tgp_japan_yearly_events.1050.desc.b: "#EMP อาวุธในค่ายทหารของท่านไม่ค่อยได้รับการลับคมบ่อยครั้งเพียงพอ#!"
 tgp_japan_yearly_events.1050.desc.c: "#EMP ท่านยังคงถือ [Glossary( 'เซนสุ', 'SENSU_GLOSS' )] ของท่านอย่างไม่ถูกต้อง#!"
 tgp_japan_yearly_events.1050.desc.outro: "\n\nสำหรับการละเมิดนี้ ท่านถูกสั่งให้บริจาคเงินจำนวนมากเข้าคลังของ [ROOT.Char.Custom2('RelationToMeShort', ROOT.Char.GetLiege)] ของท่าน [ROOT.Char.GetLiege.GetTitledFirstNamePossessive]"
 tgp_japan_yearly_events.1050.a: "ตามที่ [ROOT.Char.GetLiege.GetSheHe] ประสงค์"
 tgp_japan_yearly_events.1050.b: "กฎระเบียบนั้นไม่ได้บังคับใช้แล้ว"
 tgp_japan_yearly_events.1050.b.tt: "ท่านพยายามโน้มน้าว [messenger.GetFirstNameNoTooltip] ว่ากฎระเบียบที่คลุมเครือนี้ใช้ไม่ได้อีกต่อไป"
 tgp_japan_yearly_events.1050.c: "[ROOT.Char.GetLiege.GetSheHe|U] จะไม่ได้รับสิ่งที่ [ROOT.Char.GetLiege.GetHerHis] พึงได้!"
 tgp_japan_yearly_events.1050.tt.success: "ค่าปรับถูกยกเลิก"
 tgp_japan_yearly_events.1050.tt.failure: "[messenger.GetSheHe|U] สั่งให้ท่านจ่าย"

 tgp_japan_yearly_events.1060.t: "ด้วยเมตตาหรือยุติธรรม"
 tgp_japan_yearly_events.1060.desc: "[prisoner.GetFirstName] [prisoner.Custom2('InsultAdjective', ROOT.Char)] ผู้ยุ่งเหยิงและไม่พอใจ รบเร้ายามให้สนใจ ร้องขอให้พวกเขาฟังคำวิงวอนของ [prisoner.GetHerHis] ด้วยความสงสัย ข้าจึงไปพบ [prisoner.GetHerHim] ใน [prisoner.Custom('PrisonTypeCell')] ของ [prisoner.GetHerHis] รอฟังสิ่งที่ [prisoner.GetSheHe] อยากจะพูดอย่างสิ้นหวัง\n\n[prisoner.GetSheHe|U] จ้องมองข้าและร้องไห้"
 tgp_japan_yearly_events.1060.desc_old: ""กระดูกของข้าเปราะบางและแข็งทื่อ เวลาของข้าในโลกนี้มีมากพอแล้ว""
 tgp_japan_yearly_events.1060.desc_young: ""ข้ายังไม่เคยเห็นอะไรมากนักในชีวิต แต่ข้าไม่สามารถเติมเต็มได้ด้วยความทรงจำในคุกนี้""
 tgp_japan_yearly_events.1060.desc_long: ""ข้าถูกจองจำมานานเกินไป และข้าได้ข้อสรุปแล้วว่าข้าไม่ปรารถนาที่จะกลับไปอีก""
 tgp_japan_yearly_events.1060.desc_injured: ""สุขภาพของข้ากำลังย่ำแย่ และสะเก็ดแผลที่ข้าแกะก็ไม่หายอีกต่อไป ความเจ็บปวดยิ่งทวีความรุนแรงขึ้นโดยไม่มีทีท่าว่าจะสิ้นสุด""
 tgp_japan_yearly_events.1060.desc_generic: ""ข้าไม่ปรารถนาที่จะมีชีวิตอยู่ในขอบเขตของห้องขังนี้อีกต่อไป""
 tgp_japan_yearly_events.1060.desc_outro: "หากท่านมีเมตตาในหัวใจ โปรดจบชีวิตข้าอย่างรวดเร็ว!""
 tgp_japan_yearly_events.1060.a: "ตกลง ข้าจะทำตามความปรารถนาของเจ้า"
 tgp_japan_yearly_events.1060.b: "บางทีข้าอาจ ทำให้การจองจำของเจ้าดีขึ้นได้"
 tgp_japan_yearly_events.1060.c: "ความทุกข์ทรมานของเจ้าจะไม่ได้รับการผ่อนปรน!"
 tgp_japan_yearly_events.1060.d: "ไม่ สภาพของเจ้าจะไม่เปลี่ยนแปลง"

 tgp_japan_yearly_events.1070.t: "เถ้าถ่านอันศักดิ์สิทธิ์"
 tgp_japan_yearly_events.1070.desc: ""อาคารในพื้นที่ [ROOT.Char.Custom('GetFaithTemple')] ของ [province.GetName] ถูกไฟไหม้จนราบเป็นหน้ากลอง!" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetName] ของข้าร้องไห้\n\n"เหล่าพระและนักปราชญ์ต่างแย่งกันหาสถานที่ใหม่สำหรับทำงานของพวกเขา" [messenger.GetNameNoTooltip] กล่าวต่อ "หากท่านสามารถช่วยฟื้นฟู [ROOT.Char.Custom('GetFaithTemple')] ได้ แน่นอนว่า [ROOT.Char.GetFaith.HighGodName] จะอวยพรท่าน""
 tgp_japan_yearly_events.1070.a: "ให้เราสร้างมันขึ้นมาใหม่ให้ดีกว่าเดิม"
 tgp_japan_yearly_events.1070.b: "บางที [ROOT.Char.GetFaith.HighGodName] อาจกำลังสร้างพื้นที่สำหรับสิ่งใหม่"
 tgp_japan_yearly_events.1070.c: "ข้าต้องดูว่า [ROOT.Char.Custom('GetFaithTemple')] นี้ถูกวางเพลิงได้อย่างไร..."
 tgp_japan_yearly_events.1070.c_tt: "ท่านเริ่มการสืบสวนว่าไฟเริ่มลุกไหม้ได้อย่างไร"

 tgp_japan_yearly_events.1071.desc: "[ROOT.Char.Custom2('RelationToMeShort', messenger)|U] นำข่าวเรื่องเพลิงไหม้ [ROOT.Char.Custom('GetFaithTemple')] เมื่อเร็วๆ นี้มาแจ้ง โดยยืนยันกับข้าว่าความพยายามในการสืบสวนของ [messenger.GetHerHis] ประสบความสำเร็จ\n\n"
 tgp_japan_yearly_events.1071.desc_yokai: "“หลายคนในพื้นที่รายงานว่าพบเห็น [Glossary( 'โยวไค', 'YOKAI_GLOSS' )] ประหลาดหลายวันก่อนเกิดเพลิงไหม้ บางทีอาจโทษมันสำหรับโศกนาฏกรรมครั้งนี้ได้กระมัง” [ROOT.Char.Custom2('RelationToMeShort', messenger)] [messenger.GetFirstName] ของข้าอุทาน"
 tgp_japan_yearly_events.1071.desc_heretics: ""ชาวบ้านในท้องถิ่นชี้ว่ากลุ่มผู้เห็นต่างเป็นผู้รับผิดชอบ เราต้องส่งสาส์นเตือนพวกนอกรีตเหล่านี้!" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName] ของข้ายืนกราน"
 tgp_japan_yearly_events.1071.desc_rival: ""มีผู้พบเห็น [rival.GetName] มาสอดส่องดูเมืองก่อนเกิดเหตุ ดูเหมือนต้องการสร้างความโกลาหลภายใต้การปกครองของท่าน [rival.GetSheHe|U] ต้องไม่ลอยนวลไปได้!" [ROOT.Char.Custom2('RelationToMeShort', messenger)|U] [messenger.GetFirstName] ของข้ายืนกราน"
 tgp_japan_yearly_events.1071.desc_weather: ""เพลิงไหม้เป็นผลมาจากปรากฏการณ์ทางธรรมชาติ ด้วยอากาศที่แห้งแล้งและแสงแดดที่แผดจ้า จึงไม่น่าแปลกใจที่จะเกิดไฟไหม้ขึ้น ทางที่ดีที่สุดคือเราควรเสริมความแข็งแกร่งให้ที่พักพิงของเราเพื่อรับมือกับภัยธรรมชาติ" [messenger.GetFirstName] กล่าว"
 tgp_japan_yearly_events.1071.a: "เรื่องนี้ต้องไม่เกิดขึ้นอีก!"
 tgp_japan_yearly_events.1071.b: "อา, ช่างเถิด มันเป็นเรื่องในอดีตไปแล้ว..."
 1071_rival_tt: "เป็นเวลา #V 2#! ปี, [scheme|E] ที่มุ่งร้ายใดๆ ที่ท่านเริ่มต่อต้าน [rival.GetNameNoTooltip] จะมี [success_chance|E] เพิ่มขึ้น"
 scheme.target.japan_1071.value_desc: "การแก้แค้น [target.GetFirstName]: $VALUE|+=0$"

 SENSU_GLOSS: "#bold เซ็นสุ#! คือพัดพับที่ใช้กันทั่วไปในฤดูร้อน"
 TSURIDONO_GLOSS: "#bold สึริโดโนะ#! — หมายถึง "ศาลาตกปลา" เป็นสิ่งก่อสร้างที่สร้างขึ้นเหนือบ่อน้ำ ใช้สำหรับชมสวนและจัดความบันเทิงเล็กๆ น้อยๆ"
 tgp_japan_yearly_events.1080.t: "นักตกปลาผู้พลั้งเผลอ"
 tgp_japan_yearly_events.1080.desc: "[Glossary( 'สึริโดโนะ', 'TSURIDONO_GLOSS' )] ในสวนของข้าเป็นสถานที่สำหรับพักผ่อนและไตร่ตรอง และทิวทัศน์อันเงียบสงบก็เป็นบทสรุปที่สมบูรณ์แบบสำหรับการเดินเล่นยามเย็น ผืนน้ำที่อยู่ล้อมรอบโดยทั่วไปจะนิ่งสงบ ถูกรบกวนเพียงแค่ปลาคาร์ปที่โผล่ขึ้นมางับแมลงบนผิวน้ำเป็นครั้งคราว ทว่าวันนี้ บรรยากาศอันเงียบสงบกลับถูกทำลายลงด้วยเสียงน้ำกระเซ็นอย่างรุนแรง!\n\n[ROOT.Char.Custom2('RelationToMeShort', fisherman)] [fisherman.GetName] ของข้า ยืนอยู่ที่ขอบน้ำ เหวี่ยงเบ็ดตกปลาลงไปในสระที่เคยเงียบสงบ [fisherman.GetSheHe] กล้าดีอย่างไรมาหาอาหารมื้อต่อไปของ [fisherman.GetHerHis] ในสระของข้า!"
 tgp_japan_yearly_events.1080.a: "ข้าจะใจกว้างลืมเลือนการประพฤติผิดครั้งนี้ไปเสีย"
 tgp_japan_yearly_events.1080.b: "[fisherman.GetSheHe] เห็นสิ่งใดอื่นอีกในสวนของข้า"
 tgp_japan_yearly_events.1080.b.tt: "ท่านซักไซ้ [fisherman.GetNameNoTooltip] เพื่อเอาข้อมูลเกี่ยวกับราชสำนัก"
 tgp_japan_yearly_events.1080.tt.success: "[fisherman.GetSheHe|U] ให้ข้อมูลเชิงลึกอันมีค่า"
 tgp_japan_yearly_events.1080.tt.failure: "[fisherman.GetSheHe|U] ไม่ได้พูดอะไรมากนัก"
 tgp_japan_yearly_events.1080.tt_secret: "[fisherman.GetSheHe|U] เปิดเผย [secret|E] แบบสุ่มของหนึ่งใน [courtiers|E] ของท่าน"
 tgp_japan_yearly_events.1080.tt_family: "[courtier|E] ทุกคนที่เป็นสมาชิกในครอบครัว:\n$BULLET$ได้รับ [GetModifier('tgp_scheme_wary_modifier').GetNameWithTooltip] เป็นเวลา #V 3 ปี#!"
 tgp_japan_yearly_events.1080.c: "[fisherman.GetSheHe] ไปทำที่อื่นไม่ได้หรืออย่างไร"

 tgp_japan_yearly_events.1090.t: "มรดกอันเป็นหมัน"
 tgp_japan_yearly_events.1090.desc_intro_dead: "ข้ามีอายุยืนยาวกว่าลูกหลานทั้งหมดของข้า และทายาททั้งหมดของข้าก็ได้ล่วงลับไปแล้ว"
 tgp_japan_yearly_events.1090.desc_intro_none: "แม้จะมีชีวิตที่ยืนยาว ข้ากลับล้มเหลวในการให้กำเนิดบุตรใดๆ ในโลกนี้"
 tgp_japan_yearly_events.1090.desc_intro: ""[ROOT.Char.Custom('FormOfAddressForLiege')] ท่านจะไม่ได้อยู่ที่นี่เพื่อปกครองตลอดไป" [informer.GetTitledFirstName] ร้อง ""คงจะเป็นเรื่องน่าอัปยศหากได้เห็นมรดกของท่านถูกลืมเลือน! ต้องมีใครสักคนมาสืบทอด [target_title.GetName] แทนท่าน"\n\n"
 tgp_japan_yearly_events.1090.desc: "[ROOT.Char.GetAge] ปีของข้าผ่านไปราวกับชีวิตของแมลงเม่า ผมของข้าเริ่มหงอกขาวและกระดูกก็เริ่มส่งเสียงดัง ทารกที่ข้าเคยเห็นดูดนมจากอกมารดา บัดนี้ได้เติบโตเต็มที่และค้นพบจุดมุ่งหมายของตนแล้ว ก่อนที่จุดจบจะมาเยือนข้า บางทีข้าควรจะทำตามคำวิงวอนของ [informer.GetNamePossessiveNoTooltip] กระมัง"
 tgp_japan_yearly_events.1090.a: "ข้าจะเพิ่มความพยายามเป็นสองเท่า"
 tgp_japan_yearly_events.1090.a_tt: "ท่านได้รับ [concubine|E] คนใหม่"
 tgp_japan_yearly_events.1090.b: "ทายาทของข้า ข้าจะเป็นผู้เลือกเอง!"
 tgp_japan_yearly_events.1090.b_tt: "จนกว่าจะถึงแก่ความตาย ท่านจะสามารถเข้าถึง #V $adopt_interaction$#! [interaction|E]"
 tgp_japan_yearly_events.1090.c_uncaring: "ไยข้าต้องสนใจด้วยเล่าว่าอะไรจะเกิดขึ้นเมื่อข้าจากไป"
 tgp_japan_yearly_events.1090.c: "ข้าจะปกครองตราบเท่าที่ข้ายังทำได้"
 tgp_japan_yearly_events.1100.t: "ไข้ที่เกิดจากความรู้สึกผิด"
 tgp_japan_yearly_events.1100.desc: "ข้ารู้สึกว้าวุ่นใจมากขึ้นเรื่อยๆ หลังจากการตายของ [victim.GetName] ทว่าไม่มีการรักษาใดที่จะช่วยบรรเทาให้ข้าได้เลย ในกระจกทุกบาน ข้าเห็นใบหน้าของ [victim.GetHerHis] ลอยอยู่ราวกับภูตผีเบื้องหลังข้า ช่วงเวลาสุดท้ายของ [victim.GetHerHis|U] ฉายซ้ำในความคิดของข้า การกระทำอันน่าสยดสยองนั้นยิ่งน่าขยะแขยงมากขึ้นทุกครั้งที่มันวนกลับมา"
 tgp_japan_yearly_events.1100.desc_2: "\n\nนอกจากนี้ เสียงของ [victim_2.GetNamePossessive] ยังกระซิบกับข้าในยามค่ำคืน ปลุกข้าให้ตื่นจากการหลับใหลลึกที่สุด [victim_2.GetSheHe|U] อาจกำลังพักผ่อนอย่างสงบ ซึ่งเป็นสิ่งที่ข้ามิอาจทำได้ในช่วงหลังมานี้"
 tgp_japan_yearly_events.1100.desc_3: "การเอ่ยถึงชื่อ [victim_3.GetName] ทำให้ข้าเสียวสันหลังวาบ ทรมานข้า เช่นเดียวกับคนอื่นๆ ที่ตายตามคำสั่งของข้า"
 tgp_japan_yearly_events.1100.desc_outro: "\n\nข้าอยู่ในคุกที่ข้าสร้างขึ้นเอง การพรากชีวิตของข้าได้ปล้นเอาความสงบสุขทั้งหมดไปจากข้าเป็นการตอบแทน"
 tgp_japan_yearly_events.1100.a_tt: "ท่านเปิดเผย [secrets|E] การฆาตกรรมทั้งหมดของท่าน"
 tgp_japan_yearly_events.1100.a: "นี่คือสัญญาณ ข้าต้องชดใช้!"
 tgp_japan_yearly_events.1100.b: "ความผิดของข้าจะถูกฝังไว้ในตัวข้าต่อไป"
 tgp_japan_yearly_events.1100.b_tt: "#warning ไม่สามารถเริ่ม [scheme|E] ฆาตกรรมได้เป็นเวลา #V 5#! ปี #!"
 guilt_fever_tt: "ท่านกำลังทุกข์ทรมานจากไข้ความรู้สึกผิด"

 tgp_japan_yearly_events.1110.t: "กวางของ [ROOT.Char.GetFaith.FateGodNamePossessive|U]"
 tgp_japan_yearly_events.1110.desc: "ศาลเจ้าของ [ROOT.Char.GetFaith.FateGodName|U] ต้อนรับผู้มาเยือนมากมายจากทุกชนชั้น วันนี้ก็ไม่มีข้อยกเว้น ด้วยกวางตัวผู้อันงดงามที่กำลังเพลิดเพลินกับความสงบ\n\nทว่า สัตว์ตัวนี้กลับสนใจในตัวข้า จ้องมองข้าไม่กะพริบตา บ้างก็ว่าสัตว์ทำหน้าที่เป็นสื่อกลาง และบางทีกวางตัวนี้อาจเป็น [ROOT.Char.GetFaith.FateGodName|U] ที่กำลังนำสาส์นมาให้ข้าก็เป็นได้"
 tgp_japan_yearly_events.1110.a: "[ROOT.Char.GetFaith.FateGodSheHe|U] ปรารถนาให้ข้าไตร่ตรอง"
 tgp_japan_yearly_events.1110.b: "สัญญาณแห่งโชคดีที่จะมาถึง!"
 tgp_japan_yearly_events.1110.b.tt: "กวางนำท่านไปสู่สมบัติ"
 tgp_japan_yearly_events.1110.c: "มันคงจะดูงดงามในโถงของข้า"
 tgp_japan_yearly_events.1110.c.tt: "ท่านพยายามโจมตีกวาง ณ จุดที่มันยืนอยู่"
 tgp_japan_yearly_events.1110.tt.success: "กวางล้มลงด้วยฝีมือของท่าน"
 tgp_japan_yearly_events.1110.tt.failure: "กวางวิ่งหนีไปอย่างรวดเร็ว"
 tgp_reflection_modifier_desc_tt: "[GetModifier('tgp_reflection_modifier').GetNameWithTooltip]"

 tgp_japan_yearly_events.1120.t: "ความท้าทายสุดท้าย"
 tgp_japan_yearly_events.1120.desc_intro: "ร่างอันโดดเดี่ยว ชัก [warrior_monk.Custom('GetRegionalSword')] ออกมา ขวางทางความก้าวหน้าของเรา"
 tgp_japan_yearly_events.1120.desc_intro_river: "ขณะที่เราเคลื่อนตัวข้ามสะพาน ร่างอันโดดเดี่ยวก็ชัก [warrior_monk.Custom('GetRegionalSword')] ออกมา ขวางทางความก้าวหน้าของเรา"
 tgp_japan_yearly_events.1120.desc: "\n\n"มีเพียงนักรบที่แท้จริงเท่านั้นที่อาจเดินบนเส้นทางนี้ ข้าใช้เวลาชั่วชีวิตอุทิศตนให้กับคำสอนของ [warrior_monk.GetFaith.WarGodName|U] และยังไม่พบคู่ต่อสู้ที่คู่ควรกับคมดาบของข้า"\n\nเมื่อสังเกตเห็นสถานะของข้าในฐานะ [ROOT.Char.GetTitleAsName] [warrior_monk.GetSheHe] ก็หรี่ตาลงและยิ้ม "เอาชนะข้าในการต่อสู้ให้ได้ แล้วข้าจะติดตามเจ้าไปจนกว่าหัวข้าจะหลุดจากบ่า หรือจนกว่าเหล่าหนอนจะแทะกินข้าจนเกลี้ยง""
 tgp_japan_yearly_events.1120.a: "ข้ารับคำท้าของเจ้า!"
 tgp_japan_yearly_events.1120.a_warrior: "การเอาชนะเจ้าคือความยินดีของข้า เตรียมตัวซะ!"
 tgp_japan_yearly_events.1120.b: "ราชสำนักคือสมรภูมิของข้า ปัญญาของข้าคือคมดาบ"
 tgp_japan_yearly_events.1120.b.tt: "ท่านพยายามโน้มน้าวพระนักรบให้ติดตามท่านโดยไม่จำเป็นต้องต่อสู้กัน"
 tgp_japan_yearly_events.1120.tt.success: "พระนักรบเข้าร่วมกองกำลังของท่าน"
 tgp_japan_yearly_events.1120.tt.failure: "ท่านโน้มน้าวพระนักรบไม่สำเร็จ"
 tgp_japan_yearly_events.1120.c: "ทหารยาม, เอา [warrior_monk.GetHerHim] ไปให้พ้นทางข้า!"
 tgp_japan_yearly_events.1120.c_tt: "ทหารยามของท่านต่อสู้กับพระนักรบ ทำให้กลุ่มของท่านผ่านไปได้โดยไม่ล่าช้า"
 tgp_japan_yearly_events.1120.d: "งั้นเราไปทางอ้อมกัน"

 SHOJI_GLOSS: "ฉากกั้นห้องที่มีโครงไม้แบบตาราง โดยทั่วไปประกอบด้วยแผ่นโปร่งแสง ทำให้แสงและเงาสามารถลอดผ่านได้"
 tgp_japan_yearly_events.1130.t: "บทกวีของ [poet_daughter.GetFirstNamePossessiveNoTooltip]"
 tgp_japan_yearly_events.1130.desc: "ทุกคืน [ROOT.Char.Custom2('RelationToMeShort', poet_daughter)] ของข้า [poet_daughter.GetName] เอา แต่จ้องมองดวงจันทร์ คราบหมึกเปรอะเปื้อนมืออันบอบบางของ [poet_daughter.GetHerHis] แม้ว่าข้าจะไม่ได้ยินว่า [poet_daughter.GetHerHim] เขียนจดหมายเลยก็ตาม พฤติกรรมแปลกๆ เหล่านี้พอจะทนได้ แต่ตอนนี้ [poet_daughter.GetSheHe] เริ่มละเลยสุขภาพของ [poet_daughter.GetHerHis] แล้ว และมันอาจสะท้อนภาพลักษณ์ที่ไม่ดีมาถึงข้า\n\nข้าตาม [poet_daughter.GetHerHim] ไปยังห้องของ [poet_daughter.GetHerHis] และแอบมองผ่าน [Glossary( 'ฉากโชจิ', 'SHOJI_GLOSS' )] ถึงสาเหตุของพฤติกรรมประหลาดของ [poet_daughter.GetHerHis]\n\n"[poet_daughter.Custom2('RelationToMeShort', ROOT.Char)|U]! ดูเหมือนว่าข้าจะซ่อนงานของข้าจากท่านไม่ได้เสียแล้ว" นางกล่าว พลางยื่น [ROOT.Char.Custom('GetWritingMaterial')] ที่เต็มไปด้วยบทกวีให้ข้า"
 tgp_japan_yearly_events.1130.a: ""ถ้อยคำของเจ้าช่างน่าอัศจรรย์ [poet_daughter.GetFirstNameNoTooltip]""
 tgp_japan_yearly_events.1130.a.tt: "ท่านสนับสนุนให้นางเป็นกวี"
 tgp_japan_yearly_events.1130.poet_critical: "นางกลายเป็นกวีผู้มีสุขภาพดี"
 tgp_japan_yearly_events.1130.poet: "นางกลายเป็นกวี"
 tgp_japan_yearly_events.1130.nice_try: "นางมีความก้าวหน้าในงานเขียน"
 tgp_japan_yearly_events.1130.b: ""นี่มันเหลวไหลสิ้นดี! จงประพฤติตัวให้สมกับเป็น[ROOT.Char.Custom2('RelationToMeShort', poet_daughter)]ของ[ROOT.Char.GetTitleAsNameNoTooltip]เสียเถิด!""
 tgp_learning_poetry_modifier: "กำลังเรียนรู้การประพันธ์"
 tgp_learning_poetry_modifier_desc: "ตัวละครนี้กำลังฝึกฝนบทกวีของตน"

 tgp_japan_yearly_events.1140.t: "ถูกหยุดที่ถนนของตระกูล"
 tgp_japan_yearly_events.1140.desc: "เมื่อข้ามเข้าไปในดินแดนของ [local_county.GetNameNoTier] ความคืบหน้าของเราก็ถูกหยุดยั้งโดยกลุ่มชายฉกรรจ์ติดอาวุธ\n\n"ในนามของ [local_ruler.GetName] ข้าต้องขอเก็บค่าธรรมเนียมเล็กน้อย" [toll_warrior.GetSheHe] กล่าว เมื่อสัมผัสได้ถึงความสับสนของข้า [toll_warrior.GetSheHe] ก็กล่าวเสริมว่า: "ถนนเหล่านี้ไม่ใช่ถนนของจักรวรรดิอีกต่อไป มีเพียงเจตจำนงของ [local_ruler.GetTitleAsName] เท่านั้นที่บังคับใช้ที่นี่""
 tgp_japan_yearly_events.1140.a: "ให้ [toll_warrior.GetHerHim] เก็บค่าผ่านทางไป แต่ข้าจะจำเรื่องนี้ไว้"
 tgp_japan_yearly_events.1140.b: ""เจ้าคิดว่าข้าเป็นใคร?!""
 tgp_japan_yearly_events.1140.b.tt: "ท่านพยายามอ้างถึงความเคารพในสถานะของ [toll_warrior.GetNamePossessiveNoTooltip]"
 tgp_japan_yearly_events.1140.tt.success: "ท่านโน้มน้าวนักรบได้สำเร็จ"
 tgp_japan_yearly_events.1140.tt.failure: "ท่านถูกบังคับให้หาเส้นทางอื่น"
 tgp_japan_yearly_events.1140.c: ""ข้าจะไม่จ่ายเหรียญแม้แต่เหรียญเดียวให้ '[local_ruler.GetTitleAsNameNoTooltip]' ของเจ้าหรอก!""

 tgp_japan_yearly_events.1150.t: "การพบเห็นองค์ประมุข"
 tgp_japan_yearly_events.1150.desc: "เหล่าข้าราชสำนักแจ้งข้าว่า [emperor.GetTitleAsNameNoTooltip], [emperor.GetFirstName] กำลังเดินทางผ่านดินแดนของข้า\n\n"[emperor.GetTitleAsNameNoTooltip] อยู่ใน [emperor_location.GetNameNoTooltip] หรือ ช่างโชคดีอะไร เช่นนี้! เป็นเรื่องยากที่จะได้เข้าเฝ้า [emperor.Custom('FormOfAddressForLiege')] [emperor.GetHerselfHimself] อย่างใกล้ชิด เช่นนี้"\n\nนี่เป็นโอกาสอันดีที่จะส่งสาส์นถึง [emperor.GetHerHim]..."
 tgp_japan_yearly_events.1150.a: "สมควรต้องมีเครื่องบรรณาการเล็กน้อย"
 tgp_japan_yearly_events.1150.b: "แสดงการต้อนรับของตระกูล [local_ruler.GetHouse.GetNameNoTooltip] ต่อ [emperor.GetTitleAsNameNoTooltip]"
 tgp_japan_yearly_events.1150.b.flavor: "การร่วมแบ่งปันข้าวและสุรา ย่อม ทำให้ตระกูลของท่านอยู่ในสถานะที่ดีอย่างแน่นอน"
 tgp_japan_yearly_events.1150.c: "ข้าจะมอบบทกวีให้ [emperor.GetHerHim]!"
 tgp_japan_yearly_events.1150.c_tt: "ท่านเขียนบทกวีเพื่อเพิ่มความเห็นของ [emperor.GetHerHis] ที่มีต่อท่าน ขึ้นอยู่กับ [learning_i][learning_skill|E] ของท่าน"
 tgp_japan_yearly_events.1150.d: "[emperor.GetTitleAsNameNoTooltip] ควรแบ่งปันความมั่งคั่งของ [emperor.GetHerHis]..."
 tgp_japan_yearly_events.1150.d.flavor: "ท่านส่งนักรบไปชิงทองคำ"
 tgp_japan_yearly_events.1150.f: "การที่ [emperor.GetHerHis|U] อยู่ใกล้ๆ ยิ่งย้ำเตือนข้าว่าข้าเกลียดชัง [emperor.GetHerHim] เพียงใด!"
 tgp_japan_yearly_events.1150.f.flavor: "การโค่นล้มแมงมุมตัวนั้นต้องใช้เวลา ก่อนอื่นท่านต้องเปิดโปงพฤติกรรมอันน่ารังเกียจของมันให้ทุกคนรู้"
 tgp_japan_yearly_events.1150.f.tt: "$tgp_japan_yearly_events.1200.b.tt$"

 tgp_japan_yearly_events.1151.t: "สาส์นจาก [local_ruler.GetTitleAsNameNoTooltip]"
 tgp_japan_yearly_events.1151.desc: "ขณะที่เราข้ามเข้าไปใน [emperor_location.GetName] เราได้รับการทักทายจากข้าราชสำนักของ [local_ruler.GetTitleAsNameNoTooltip] [local_ruler.GetFirstName]\n\n"
 tgp_japan_yearly_events.1151.desc_bandits: ""[local_ruler.GetTitledFirstNameNoTooltip] เรียกร้องเครื่องบรรณาการสำหรับการเดินทางผ่านดินแดนของ [local_ruler.GetHerHis] ไม่ควรจะต้องหันไปใช้ความรุนแรง"\n\nน้ำเสียงของ [messenger.GetNamePossessive] ฟังดูมีเหตุผล แม้ว่ากลุ่มนักรบติดอาวุธที่มาพร้อมกับ [messenger.GetHerHim] จะบ่งบอกเป็นนัยอื่นก็ตาม"
 tgp_japan_yearly_events.1151.desc_hospitality: ""[local_ruler.GetTitledFirstNameNoTooltip] ยินดีต้อนรับท่านสู่ [local_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip]" [messenger.GetName] กล่าว พลางโค้งคำนับอย่างสง่างาม "นับเป็นเกียรติของ [local_ruler.GetHerHis] อย่างยิ่งหากท่านจะหยุดพักและเพลิดเพลินกับการต้อนรับของพวกเรา""
 tgp_japan_yearly_events.1151.desc_poem: ""บทกวีบางส่วนจาก [local_ruler.GetNameNoTooltip]" [messenger.GetName] กล่าว พลางยื่น [emperor.Custom('GetWritingMaterial')] ชุบทองที่เต็มไปด้วยตัวอักษรให้ข้า "ข้าหวังว่าท่านจะพึงพอใจกับผลงานของ [local_ruler.GetHerHis]""
 tgp_japan_yearly_events.1151.desc_gift: ""ของขวัญ มอบให้โดย [local_ruler.GetNameNoTooltip]" [messenger.GetName] กล่าว พลางยื่นถุงทองคำให้ "เราขออวยพรให้ท่านเดินทางโดยสวัสดิภาพ [emperor.GetTitleAsNameNoTooltip]""
 tgp_japan_yearly_events.1151.a: "ท่านให้เกียรติข้ามาก [local_ruler.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1151.b: "เป็นความพยายามที่น่าชื่นชม ข้าเดาว่า..."
 tgp_japan_yearly_events.1151.c: "ข้าจะไม่ยอมถูกข่มขู่!"
 tgp_japan_yearly_events.1151.c_bandits: "ทหารยาม, ป้องกันพวกมันไว้!"
 tgp_japan_yearly_events.1151.d: "ข้าว่าเราคงต้องอ้อมไปทางอื่นแล้ว"
 tgp_japan_yearly_events.1151.d_bandits: "ให้ทองพวกมันไปบ้าง ไม่คุ้มที่จะสู้"
 japan_yearly_1151_bandits: "ท่านพยายามต่อสู้กับเหล่าโจรของ [local_ruler.GetNamePossessiveNoTooltip]"
 japan_yearly_1151_bandits_win: "เหล่าโจรได้หีบทองคำอันงดงามไป"
 japan_yearly_1151_bandits_lose: "เหล่าโจรล้มเหลวและกลับไปมือเปล่า"
 japan_yearly_1151_success: "แผนของท่านได้ผล"
 japan_yearly_1151_fails: "แผนของท่านล้มเหลว"
 tgp_japan_yearly_events.1151.tt_good.success: "ผู้ปกครองชื่นชมท่าทีของท่าน"
 tgp_japan_yearly_events.1151.tt_good.failure: "ท่าทีของท่านไม่เป็นที่ประทับใจของผู้ปกครอง"

 friend_nice_gesture: "[TARGET_CHARACTER.GetShortUIName|U] ได้แสดงท่าทีเป็นมิตรต่อ [CHARACTER.GetShortUINameNoTooltip] ระหว่างการเดินทางของพวกเขา"
 friend_nice_gesture_corresponding: "[CHARACTER.GetShortUIName|U] ได้แสดงท่าทีเป็นมิตรต่อ [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] ระหว่างการเดินทางของพวกเขา"

 tgp_japan_yearly_events.1160.t: "ของกำนัลจาก [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_events.cannibal.1160.t: "ของกำนัลแห่งเนื้อหนัง [feuding_house.GetNameNoTooltip]"
 tgp_japan_yearly_events.1160.desc: "ความเป็นอริอันขมขื่นระหว่างตระกูลอันยิ่งใหญ่ของข้า [ROOT.Char.GetHouse.GetName] และตระกูล [feuding_house.GetName] อันไร้ค่าเป็นที่รู้กันทั่ว จนถึงทุกวันนี้ พวกหมูสกปรกนั่นยังไม่เคยเสนอสันติภาพเลย!\n\nข้าจึงยิ่งสงสัยมากขึ้น เมื่อ [new_concubine.GetWomanMan] สาวหน้าตางดงาม [new_concubine.GetName] ถูกส่งมาเป็นของกำนัลโดยพวกเขา แม้ว่าข้าจะหลงเสน่ห์ในความ [new_concubine.Custom('ComplimentAdjective')] ของ [new_concubine.GetSheHe] แต่ข้าก็อดคิดไม่ได้ว่านี่เป็นอีกหนึ่งอุบายของ [feuding_house.GetNameNoTooltip]..."
 tgp_japan_yearly_events.1160.a: "... แต่ [new_concubine.GetSheHe] ก็เป็นข้อเสนอที่ยั่วยวนเกินกว่าจะไม่ลอง"
 tgp_japan_yearly_events.1160.b: "นี่เป็นเรื่องตลกหรือ ส่ง [new_concubine.GetHerHim] กลับไป"
 tgp_japan_yearly_events.1160.c: "ข้าจะไว้ใจพวกมันได้อย่างไร ฆ่า [new_concubine.GetHerHim] ซะ!"
 tgp_japan_yearly_events.1160.d: "[new_concubine.GetSheHe|U] จะเป็นอาหารมื้อเลิศ"

 tgp_japan_yearly_events.1200.t: "ความแออัดในเมืองหลวง"
 tgp_japan_yearly_events.1200.desc: "ช่างเป็นเช้าที่ยาวนานของการประชุมใน [kampaku.GetCurrentLocation.GetBaronyNameExplicitly] งานของ [kampaku.GetTitleAsName] ไม่มีวันจบสิ้น! คณะของข้าออกเดินทางไปยัง [GetBuilding('heian_palace_01').GetName] เพื่อเข้าร่วมพิธี ซึ่ง [emperor.GetTitleAsName] จะเสด็จฯ มาด้วย\n\nสำหรับหลายคน ความเร่งรีบและวุ่นวายของเมืองหลวงเป็นความท้าทายในการเดินทาง แต่ในฐานะ [kampaku.GetTitleAsNameNoTooltip] ผู้คนต่างแหวกทางให้ราวกับฝูงปลาซาร์ดีนต่อหน้าฉลาม\n\nทันใดนั้น ความคืบหน้าของคณะข้าก็ต้องหยุดชะงัก ผู้ติดตามของข้าแจ้งว่า [upstart.GetName] ผู้ทะเยอทะยานได้ตัดหน้าเราบนถนนและไม่ยอมขยับม้าของ [upstart.GetHerHis] หลีกทางให้เราผ่านไป ไอ้หมูหัวดื้อ!"
 tgp_japan_yearly_events.1200.a: "ลากคอมันลงมาจากหลังม้า!"
 tgp_japan_yearly_events.1200.b: "ปล่อยให้มันคิดว่าสามารถลอยนวลไปได้เถอะ"
 tgp_japan_yearly_events.1200.b.tt: "[scheme|E] [GetScheme('slander').GetTypeName] ของท่านได้รับตัวปรับ แต่ง [GetModifier('bided_my_time').GetNameWithTooltip]"
 tgp_japan_yearly_events.1200.c: "ชัยชนะที่ยิ่งใหญ่ที่สุดคือมิตรภาพ"
 tgp_japan_yearly_events.1200.c.tt: "[scheme|E] [GetScheme('befriend').GetTypeName] ของท่านได้รับตัวปรับ แต่ง [GetModifier('settled_differences_modifier').GetNameWithTooltip]"


 tgp_japan_yearly_events.1210.t: "เหมาะที่จะเป็นผู้นำหรือ"
 tgp_japan_yearly_events.1210.desc.intro: "การขึ้นเป็นประมุขแห่งตระกูล [ROOT.Char.GetHouse.GetName] ของข้าถูก ทำให้มัวหมอง [ROOT.Char.Custom2('RelationToMeShort', contester)] ของข้า [contester.GetName] ไอ้แมงมุมตัวนั้น ได้ชักใยแห่งคำโป้ปดอันนุ่มนวล วางยาหูของทุกคนที่ยอมฟัง\n\n"[ROOT.Char.GetTitledFirstName] ไม่เหมาะที่จะนำตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]!"\n\n[contester.GetSheHe|U] กล่าวเหนือสิ่งอื่นใด"
 tgp_japan_yearly_events.1210.desc.reason_weak_prowess: "ความห้าวหาญอันน่าสมเพชของข้า"
 tgp_japan_yearly_events.1210.desc.reason_bad_health: "สุขภาพที่ถดถอยของข้า"
 tgp_japan_yearly_events.1210.desc.reason_drunkard: "การร่ำสุราไม่เลิกของข้า"
 tgp_japan_yearly_events.1210.desc.bad_genetic: "ข้อบกพร่องอันน่าเศร้า แต่กำเนิดของข้า"
 tgp_japan_yearly_events.1210.desc.sinful: "พฤติกรรมอันบาปหนาของข้า"
 tgp_japan_yearly_events.1210.desc.low_legitimacy: "ความชอบธรรมอันน่ากังขาของข้า"
 tgp_japan_yearly_events.1210.desc.older_sibling: "การมีอยู่ของพี่น้องที่แก่กว่าของข้า"
 tgp_japan_yearly_events.1210.desc.illegitimized: "การถูกตัดออกจากความเป็นทายาทโดยชอบธรรมของข้า"
 tgp_japan_yearly_events.1210.desc.concubine_child: "สถานะของข้าที่เป็นบุตรของนางบำเรอ"
 tgp_japan_yearly_events.1210.desc.reason_non_dominant_gender: "เพศที่ไม่เหมาะสมของข้า"
 tgp_japan_yearly_events.1210.desc.reason_fallback: "ความฝันแรกของ [contester.GetHerHis] ในวันปีใหม่เป็นลางร้าย และ"
 tgp_japan_yearly_events.1210.desc.outro: "ควรจะขัดขวางข้าจากการเป็นผู้นำตระกูลและเรียกร้องตำแหน่งของข้า หากข้าปล่อยให้แผลมะเร็งนี้ลุกลาม มันจะกัดกินร่างกาย เพื่อประโยชน์ของตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip] ข้าต้องลงมือ"
 tgp_japan_yearly_events.1210.a: ""จงรู้ที่ต่ำที่สูงของเจ้า มิฉะนั้นก็ไสหัวไป!""
 tgp_japan_yearly_events.1210.b: "รวงข้าวที่สุกงอมย่อมโน้มต่ำลง"
 tgp_japan_yearly_events.1210.b.flavor: "ความเป็นผู้นำที่ยั่งยืนสร้างขึ้นจากการประนีประนอม ท่านอนุญาตให้ [contester.GetName] ก่อตั้ง [house|E] ใหม่"
 tgp_japan_yearly_events.1210.b.tt: "[contester.GetName] จะก่อตั้ง [house|E] ใหม่ พวกเขาจะคิดถึงท่านและคนของท่านในแง่ดี"
 house_relation_friendly_reason_cadet_branch_permission_desc: "ที่ใดที่ข้าวอาจล้มลง ต้นไม้ที่มีหลายกิ่งก้านสามารถพยุงไว้ไม่ให้ล้มได้"
 tgp_japan_yearly_events.1210.c: "ข้าจะเปลี่ยนมุมมองของ [contester.GetHerHis] เอง"
 tgp_japan_yearly_events.1210.c.good: "บาดแผลที่รักษาง่ายที่สุดคือบาดแผลที่ไม่เคยมีอยู่ตั้งแต่แรก"
 tgp_japan_yearly_events.1210.c.good.tt: "$custom.every_house_member$"
 tgp_japan_yearly_events.1210.c.bad: "ข้าต้องหยอดน้ำมันหล่อลื่นบ้าง..."
 tgp_japan_yearly_events.1210.c.ugly: "ดูเหมือนข้าจะได้ศัตรูเพิ่มเสียแล้ว"
 tgp_japan_yearly_events.1210.d: "ไยต้องไปรับรู้ความคับข้องใจที่คิดไปเองด้วย"
 tgp_japan_yearly_events.1210.d.flavor: "เพิกเฉยต่อ [contester.GetHerHim]"
 tgp_japan_yearly_events.1210.d.tt: "[contester.GetName] จะก่อตั้ง [house|E] ใหม่ พวกเขาจะคิดไม่ดีต่อท่านและคนของท่าน"
 house_relation_quarrel_reason_cadet_branch_permission_desc: "ท่านเพิกเฉยต่อข้อกังวลของ [contester.GetTitledFirstNamePossessive]"

 tgp_japan_yearly_events.1225.t: "ชีวิตแห่งบทกวี"
 tgp_japan_yearly_events.1225.desc.intro.influencer: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('poet_influencer'))] ของข้ามีแววตา [poet_influencer.GetHerHis] เป็นประกายในเช้านี้ [poet_influencer.GetSheHe] ผู้กระตือรือร้นที่จะพัฒนาข้าอยู่เสมอ ได้เริ่มบทสวดอันเร่าร้อน\n\n"
 tgp_japan_yearly_events.1225.desc.intro: "ขณะที่ข้าอ่านตำราเพื่อพัฒนาตนเอง ข้าก็สะดุดกับข้อความหนึ่งที่ดึงดูดสายตาข้า"
 tgp_japan_yearly_events.1225.desc: "#EMP "เมล็ดพันธุ์แห่งบทกวี [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] อยู่ในหัวใจของทุกคน หากได้รับการบ่มเพาะ มันจะผลิบานเป็นถ้อยคำนับหมื่น\n\nถ้อยคำเหล่านี้อาจนำพาสิ่งเล็กน้อยที่เราเห็นและได้ยินมามอบพลังในการเคลื่อนสวรรค์และปฐพี ปลุกเร้าความรู้สึกของเทพเจ้าและวิญญาณที่มองไม่เห็น สานสัมพันธ์ของบุรุษและสตรี และปลอบประโลมหัวใจของนักรบผู้ดุดัน!"#!\n\n"การเป็นกวีคือการมีชีวิต และโดยการมีชีวิต ท่านสามารถเป็นกวีที่ดีขึ้นได้""
 tgp_japan_yearly_events.1225.a: "เช่นนั้นข้าจะเริ่มใช้ชีวิต!"
 tgp_japan_yearly_events.1225.a.flavor: "ในไม่ช้า ข้าจะเป็นกวีที่ไม่ใช่แค่ในนาม"
 tgp_japan_yearly_events.1225.b: "วันนี้ข้าจะศึกษากวีนิพนธ์ แต่ข้าแสวงหาชีวิตที่เหลวไหลน้อยกว่านี้"

 tgp_japan_yearly_events.1260.t: "$tgp_japan_yearly_events.1225.t$: ความรักและความตาย"
 tgp_japan_yearly_events.1260.desc: "ยามเช้ามาถึงพร้อมกับอากาศอันไพเราะหวานหูขณะที่เหล่านกบินไปมาเพื่อค้นหาคู่\n\n"อีกไม่นานพวกมันก็จะตาย แต่กระนั้นพวกมันก็ยังมีชีวิตอยู่อย่างเต็มที่ ประพันธ์ถ้อยคำแห่งรักตลอดทั้งเช้า"\n\nข้าเฝ้ามองต่อไปขณะที่แมลงถูกฉีกกระชากจากอากาศ ถูกแยกชิ้นส่วนและถูกกลืนกินโดยคู่รักมีปีกผู้หิวโหย\n\nในฐานะกวี หน้าที่ของข้าคือการกลั่นกรองความงามและความน่าสะพรึงกลัวทั้งหมดให้เป็นถ้อยคำที่คัดสรรมาเพียงไม่กี่คำ เพื่อให้ผู้อื่นได้ครุ่นคิด บทกวีทั้งหมดล้วนกล่าวถึงความรักหรือความตาย ความตายอยู่รอบตัวเรา แต่ความรักนั้น เราต้องแสวงหา"
 tgp_japan_yearly_events.1260.a: "เป็นหน้าที่ของข้าที่จะต้องไล่ตามพันธะทางชู้สาว!"
 tgp_japan_yearly_events.1260.a.flavor: "ข้าจะหวังให้งานฝีมือของข้าก้าวหน้าได้อย่างไร"
 tgp_japan_yearly_events.1260.b: "ความรักโรแมนติกอยู่ไกลเกินเอื้อม ข้าเกรงว่าบทกวีก็ เช่นกัน"

 tgp_japan_yearly_events.1261.t: "$tgp_japan_yearly_events.1225.t$: อมตะแห่งจักรวรรดิ"
 tgp_japan_yearly_events.1261.desc: "ความสามารถทางกวีของข้าได้รับความสนใจจาก [top_liege_spouse.GetTitledFirstName] [top_cuckold.Custom2('RelationToMeShort', SCOPE.sC('top_liege_spouse'))] ของ [inspired_poet.Custom2('RelationToMeShort', SCOPE.sC('top_cuckold'))] [top_cuckold.GetTitledFirstNamePossessive] ของข้า:\n\n"ถ้อยคำของท่านได้จารึกความเป็นอมตะไว้ในจิตใจของชาว [inspired_poet.GetTopLiege.GetCulture.GetNameNoTooltip] ทั้งปวงแล้ว แต่จะเป็นอย่างไรหากท่านสามารถรับประกันความเป็นอมตะของร่างกายได้"\n\nคำชื่นชมของ [top_liege_spouse.GetHerHis|U] จบลงอย่างสง่างามที่ธรณีประตูห้องบรรทมของ [top_liege_spouse.GetHerHis] ดูเหมือนว่า [top_liege_spouse.GetSheHe] ต้องการมากกว่าการยืนยันข่าวลือเรื่องความเก่งกาจบนเตียงของข้า นางหวังว่าการรวมกันของเราจะก่อให้เกิดทายาทคนใหม่สำหรับ [top_cuckold.GetTitleAsNameNoTooltip] หรือไม่!"
 tgp_japan_yearly_events.1261.chop.desc: "\n\n[top_liege_spouse.GetSheHe] คงไม่รู้ว่าข้าขาดเครื่องมือในการสืบพันธุ์..."
 tgp_japan_yearly_events.1261.a: "สายเลือดของข้าจะหนุน [top_cuckold.GetPrimaryTitle.GetNameNoTooltip]!"
 tgp_japan_yearly_events.1261.a.flavor: "งดงามยิ่งกว่าถ้อยคำใดๆ ของข้า สายเลือดของข้าจะดังก้องไปในประวัติศาสตร์"
 tgp_japan_yearly_events.1261.b: "เราแลกเปลี่ยนบทกวีกันดีกว่า ไม่ใช่..."
 tgp_japan_yearly_events.1261.c: "ข้าจะไม่เปิดโปงการร่วมรักอันไร้ความสามารถของ [top_cuckold.GetTitleAsNamePossessiveNoTooltip]"
 tgp_japan_yearly_events.1261.d: "มาสนุกกันเถอะ อย่างไรก็ตาม!"

 tgp_japan_yearly_events.1262.t: "$tgp_japan_yearly_events.1225.t$: การแลกเปลี่ยนบทกวี"
 tgp_japan_yearly_events.1262.desc.intro: "บทกวีอันทรงพลังมากมายถูกค้นพบขณะรับลมยามค่ำคืน ขณะที่ข้าครุ่นคิดถึง "
 tgp_japan_yearly_events.1262.inspo: "พลังที่อยู่เหนือตัวข้า"
 tgp_japan_yearly_events.1262.japan.inspo: "[Glossary('โมโน โนะ อาวาเระ', 'MONONOAWARE_GLOSS')]"
 tgp_japan_yearly_events.1262.desc: "ทันใดนั้นข้าก็บังเอิญพบกับกวีผู้มีเสน่ห์ [local_poet.GetName] กำลังท่องบทกวี:\n\n#EMP "ริม [local_poet_spot.Custom('GetTerrainType')] อันเงียบสงัด\n\nข้ารอฟังเสียงฝีเท้าของท่าน\n\nในยามเย็นแห่ง [local_poet_spot.Custom('RoamingLegendaryBeastProvinceWeather')]"#!\n\nเมื่อสัมผัสได้ถึงอารมณ์กวีของข้า [local_poet.GetSheHe] จึงกวักมือเรียกให้ข้าเข้าร่วมกับ [local_poet.GetHerHim] ในเงามืด นี่อาจเป็นคำเชิญให้เข้าร่วมใน "
 tgp_japan_yearly_events.1262.japan.outro: "[Glossary('เร็งงะ', 'RENGA_GLOSS')]"
 tgp_japan_yearly_events.1262.outro: "การแลกเปลี่ยนบทกวี"
 tgp_japan_yearly_events.1262.japan.outro.outro: "หรือว่าการจ้องมองราวกับ[local_poet.Custom('VenomousCreature')]ของ[local_poet.GetHerHis]จะเป็นลางบอกเหตุถึงความมักมากที่มากกว่านี้?"

 tgp_japan_yearly_events.1262.a: "ข้ามีบทกวีที่เหมาะเจาะ!"
 tgp_japan_yearly_events.1262.a.flavor: "#EMP "สายลมพัดพาน้ำเสียงของท่าน\n\nแผ่วเบาราวเสียงถอนหายใจของใบไม้ร่วง\n\nภายใต้ท้องฟ้าฤดูใบไม้ร่วง" #!"
 tgp_japan_yearly_events.1262.b: "มาแลกเปลี่ยนมากกว่าถ้อยคำกันเถอะ..."
 tgp_japan_yearly_events.1262.b.flavor: "เสียงของเราจะสะท้อน 'บทกวี' นับไม่ถ้วนออกไปในยามค่ำคืน"
 tgp_japan_yearly_events.1262.c: "หรือว่า [local_poet.GetSheHe] เป็นนักฆ่า"
 MONONOAWARE_GLOSS: "สภาวะจิตใจที่เข้าถึงขณะประพันธ์บทกวีในยุคเฮอัน เป็นการเข้าถึงความอ่อนไหวทางอารมณ์ที่เข้มข้น แต่ ทว่าสุขุมในขณะเดียวกัน โดยมุ่งเน้นไปที่ความงามอันไม่จีรังยั่งยืนและการยอมรับอย่างโหยหาถึงการครอบงำของกาลเวลา"
 RENGA_GLOSS: "เร็งงะ หรือ 'บทกวีลูกโซ่' ของญี่ปุ่น เป็นรูปแบบที่กวีหลายคนร่วมกัน แต่งบทกวีสลับกันไปมา"

 tgp_japan_yearly_events.1263.t: "$tgp_japan_yearly_events.1225.t$: [SCOPE.Custom('ArtifactFlowerSpecies')|U] อันไม่จีรัง"
 tgp_japan_yearly_events.1263.desc: "ความจริงของโลกถูกเปิดเผยผ่านธรรมชาติ! ขณะเดินเล่นไปตาม [rural_beauty_location.Custom('GetTerrainType')] อันงดงามใกล้กับ [inspired_poet.GetCurrentLocation.GetBaronyNameExplicitly] ข้าก็ติดอยู่กลางสายฝนที่ตกลงมาอย่างกะทันหัน\n\nในการเสาะหาที่พักพิง ข้าบังเอิญพบ [rural_beauty.GetWomanMan] กำลังเต้นรำอยู่ในทุ่ง [SCOPE.Custom('ArtifactFlowerSpeciesPlural')]\n\nฝนกระหน่ำลงมาพร้อมกับเท้าของ [rural_beauty.GetHerHis] ทำลายกลีบดอกไม้ที่บอบบาง ความงามชั่วขณะนี้ ถูกขับเน้นด้วยการทำลายล้างที่ดูเหมือนไม่ใส่ใจ เมื่อสังเกตเห็นร่างที่เปียกปอนของข้า [rural_beauty.GetSheHe] ก็กวักมือเรียกข้าด้วยการเชิดคางอย่างยั่วยวน"
 tgp_japan_yearly_events.1263.a: "มาเฉลิมฉลองชีวิตอันแสนสั้นของเรากันเถอะ..."
 tgp_japan_yearly_events.1263.a.flavor: "สายฝนช่างปะไร ท่านเสพสมท่ามกลางหมู่ [SCOPE.Custom('ArtifactFlowerSpeciesPlural')] ความทรงจำนี้จะช่วยเพิ่มพลังให้กับบทกวีของท่านอย่างแน่นอน!"
 tgp_japan_yearly_events.1263.b: "ข้าต้องเก็บรักษา [SCOPE.Custom('ArtifactFlowerSpecies')] ไว้อย่างน้อยหนึ่งดอก!"
 tgp_japan_yearly_events.1263.b.flavor: "การกบฏเล็กๆ ต่อการครอบงำของกาลเวลา"
 tgp_japan_yearly_events.1263.c: "กลีบดอกไม้ที่ถูกบดขยี้จะสามารถนำไปใช้ประโยชน์อื่นได้หรือไม่"
 tgp_japan_yearly_events.1263.c.poisonous: "#EMP ของขวัญจาก [rural_beauty.GetFaith.DeathDeityName]...#!"
 tgp_japan_yearly_events.1263.c.medicinal: "#EMP ของขวัญจาก [rural_beauty.GetFaith.HealthGodName]...#!"

 tgp_japan_yearly_events.1270.t: "$tgp_japan_yearly_events.1225.t$: หนึ่งพันใบไม้อมตะ"
 tgp_japan_yearly_events.1270.desc: "แม้ว่าทุกคนจะเกิดมาพร้อมกับเมล็ดพันธุ์แห่งบทกวีในหัวใจ แต่เมล็ดพันธุ์ของข้าได้รับการบ่มเพาะจากดวงอาทิตย์แห่งความรักที่ข้าพยายามอาบแสง และสายน้ำอันหอมหวานแห่งความตายที่อยู่รอบตัวเรา\n\nสิ่งนี้ได้กลายเป็นการสร้างสรรค์ #EMP $poetic_life_artifact_name$#! ซึ่งแน่นอนว่าจะเป็นเสาหลักของวัฒนธรรม [ROOT.Char.GetTopLiege.GetCulture.GetNameNoTooltip] ต่อไป\n\nทุกคนจะจดจำเมื่อครั้ง, "
 tgp_japan_yearly_events.1270.desc.love_memory_1: "#EMP [love_memory_1.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_2: "#EMP [love_memory_2.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.love_memory_3: "#EMP [love_memory_3.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_1: "#EMP [death_memory_1.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_2: "#EMP [death_memory_2.GetDescription]#!, "
 tgp_japan_yearly_events.1270.desc.death_memory_3: "#EMP [death_memory_3.GetDescription].#!"
 tgp_japan_yearly_events.1270.a: "[ROOT.Char.Custom('GetCourt')] ต้องได้รับประโยชน์จากปัญญาด้านความรักของข้า!"
 tgp_japan_yearly_events.1270.b: "แม้ว่าร่างกายของข้าจะเหี่ยวเฉาและเน่าเปื่อย แต่ความแข็งแกร่งของข้าจะคงอยู่ชั่วนิรันดร์"
 poetic_life_artifact_name: "$tgp_japan_yearly_events.1270.t$"
 poetic_life_artifact_description: "ผลงานบทกวีชิ้นเอกที่เป็นอมตะ บันทึกความสุขชั่วขณะของเมื่อครั้ง,\n\n"
 poetic_life_artifact_description.love_memory_1: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_1$"
 poetic_life_artifact_description.love_memory_2: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_2$"
 poetic_life_artifact_description.love_memory_3: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.love_memory_3$"
 poetic_life_artifact_description.death_memory_1: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.death_memory_1$"
 poetic_life_artifact_description.death_memory_2: "[newly_created_artifact.GetDesc]$tgp_japan_yearly_events.1270.desc.death_memory_2$"
