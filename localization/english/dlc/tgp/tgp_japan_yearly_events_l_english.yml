 tgp_japan_yearly_events.1270.a_effect: "[newly_created_artifact.GetName] ถูกสร้างเป็น [court_artifact|E] และจะได้รับตัวปรับ แต่ง [grandeur|E]"
 tgp_japan_yearly_events.1270.b_effect: "ท่านได้รับ [artifact|E] [newly_created_artifact.GetName]"

 tgp_japan_yearly_events.1170.t: "ลายเส้นอันมีเสน่ห์"
 tgp_japan_yearly_events.1170.desc: "แม้ว่าข้าจะไม่ใช่ผู้พูดภาษา [foreign_ruler.GetCulture.GetLanguage.GetName] แต่บทกวีของ [foreign_ruler.GetPrimaryTitle.GetName] ก็เป็นที่รู้จักกันดีในด้านความลึกซึ้งและความละเอียดอ่อน\n\nเป็นเรื่องน่าสนใจที่จะเลือกตัวอักษรที่คุ้นเคย แต่ข้าก็พยายามอย่างหนักที่จะทำความเข้าใจการอ้างอิงและความละเอียดอ่อนทั้งหมดที่แฝงอยู่"
 tgp_japan_yearly_events.1170.a: "บางทีอาจถึงเวลาเรียนรู้ภาษาพี่น้องของเราแล้ว"
 tgp_japan_yearly_events.1170.b: "หึ! บอก [foreign_ruler.GetFirstNameNoTooltip] ไปทีว่ากวีของ [foreign_ruler.GetHerHis] ห่วยแตกสิ้นดี!"
 tgp_japan_yearly_events.1170.c: "การขาดความชัดเจนนั้นช่างงดงาม!"
 tgp_japan_yearly_events.1170.c.flavor: "ความเพลิดเพลินที่ผ่านไปนี้ช่วยเสริมสร้างจินตนาการของท่าน"
 BONSAI_GLOSS: "#bold บอนไซ#! คือศิลปะการปลูกและจัด แต่งต้นไม้ขนาดเล็กในภาชนะ นักปราชญ์บางคนกล่าวว่าต้นไม้สะท้อนถึงเจ้าของ"
 tgp_japan_yearly_events.1180.t: "การกำหนดการเติบโต"
 tgp_japan_yearly_events.1180.desc: "ส่วนเพิ่มเติมใหม่ในสวนของข้ากลายเป็นที่กล่าวขวัญของราชสำนัก แม้ว่ามันจะไม่ออกผล และเล็กเกินไปที่จะให้ร่มเงา แต่ต้น [Glossary( 'บอนไซ', 'BONSAI_GLOSS' )] นี้คือบทพิสูจน์ของความอดทนนานหลายปี\n\n[GetCourtPositionType('court_gardener_court_position').GetName()] ของข้า [gardener.GetFirstName] เห็นข้ากำลังพินิจพิเคราะห์มัน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')] ต้นไม้ที่ถูกปล่อยให้เติบโตตามยถากรรมนั้นเป็นสิ่งที่หยาบกระด้าง เพียงเมื่อถูกดัด แต่งด้วยความรักเท่านั้น รูปร่างและรูปแบบของมันจึงจะก่อเกิดพลังในการสร้างแรงบันดาลใจ มันปลุกเร้าบางสิ่งในตัวท่านหรือไม่"\n\n"
 court_position_from_event: "จากเหตุการณ์"
 tgp_japan_yearly_events.1180.a: "ข้าจะได้รับคำแนะนำจากความมั่นคงของมัน"
 tgp_japan_yearly_events.1180.b: "[ROOT.Char.GetFaith.FertilityGodName] ได้รับเกียรติจากต้นไม้ จงบำรุงรักษามันให้ดี"
 tgp_japan_yearly_events.1180.c: "ข้าอยากจะเข้ารับช่วงต่อในการจัด แต่งมัน"

 tgp_japan_yearly_events.1190.t: "ดิ้นรนกับหน้าที่ของข้า"
 tgp_japan_yearly_events.1190.desc_annoyed: "เสียงเจี๊ยวจ๊าวของราชสำนักและข้อร้องเรียนของเหล่าขุนนาง ทำให้ข้ารำคาญใจ และสิ่งสุดท้ายในความคิดของข้าคือการทะเลาะวิวาทของชาวเมืองธรรมดา"
 tgp_japan_yearly_events.1020.desc_drunk: "ข้าดื่มด่ำจาก [ROOT.Char.Custom('RegionalAlcoholicDrink')] ชั้นดี แต่ก็นำมา ซึ่งการปลอบประโลมเพียงเล็กน้อย น่าเสียดายที่การปฏิบัติหน้าที่ขณะมึนเมากลายเป็นธรรมชาติที่สองของข้าไปแล้ว"
 tgp_japan_yearly_events.1020.desc_dumb: "ข้าล้มเหลวอีกครั้งในการทำความเข้าใจกลไกประจำวันของราชสำนัก น่าเศร้าที่ไม่มีใครเข้าใจผิดว่าข้าเป็นนักปราชญ์ หรือแม้แต่ข้าราชการที่สามารถได้"
 tgp_japan_yearly_events.1190.desc: "\n\nข้าจ้องมองกอง [ROOT.Char.Custom('GetWritingMaterialPlural')] โดยลืมไปว่าเหตุใดมันจึงสำคัญ การอ่านเนื้อหาซ้ำๆ ไม่ได้ช่วยให้กระจ่างขึ้น แต่ความจำเป็นเร่งด่วนของรัฐเรียกร้องให้ข้าตัดสินใจ แม้ว่าจะไม่ได้รับข้อมูลเพียงใดก็ตาม"
 tgp_japan_yearly_events.1190.a: "ข้าต้องจัดการกับความล้มเหลวนี้!"
 tgp_japan_yearly_events.1190.b: "สภาของข้าต้องตัดสินใจแทนข้า"
 tgp_japan_yearly_events.1190.c: "การตัดสินใจที่เลวร้ายย่อมดีกว่าไม่ตัดสินใจเลย..."
 tgp_japan_yearly_events.1190.c_tt: "[county|E] แบบสุ่มในอาณาจักรของท่านจะสูญเสีย [control|E] บางส่วน"

 tgp_japan_yearly_events.1220.t: "ปาฏิหาริย์ในผ้าคลุม"
 tgp_japan_yearly_events.1220.desc: "[ROOT.Char.Custom2('RelationToMeShort', miracle_recipient)] ของข้า [miracle_recipient.GetName] นำข่าวเกี่ยวกับพระนักเดินทาง [monk.GetName] ที่ได้แสดงปาฏิหาริย์มาให้ข้า\n\n"
 tgp_japan_yearly_events.1220.desc_health: ""ความเจ็บป่วยของข้าไม่มารบกวนข้าอีกต่อไป [miracle_recipient.Custom2('RelationToMeShort', ROOT.Char)] ของข้า! อันที่จริง พลังแห่งคำอธิษฐานของ [monk.GetHerHis] ทำให้ข้าแข็งแกร่งกว่าก่อนที่จะเจ็บป่วยเสียอีก""
 tgp_japan_yearly_events.1220.desc_wealth: ""ข้าถวายถุงทองคำให้พระรูปนั้น และหลายเดือนต่อมา [monk.GetSheHe] ก็กลับมาพร้อมกับถุงที่มีมูลค่าสิบเท่าของข้า เป็นการตอบแทน!""
 tgp_japan_yearly_events.1220.desc_knowledge: ""บางคนอาจคิดว่าข้าทื่อมะลื่อก่อนที่จะได้พบพระรูปนี้ บัดนี้ หลังจากได้รับคำสอนของ [monk.GetHerHis] จิตใจของข้าก็เปี่ยมไปด้วยความรู้และความเฉียบแหลมทางปัญญา!""
 tgp_japan_yearly_events.1220.a: "น่าทึ่งมาก! ข้าต้องตามหาพระรูปนี้"
 tgp_japan_yearly_events.1220.b: "มันต้องมีคำอธิบายตามหลักเหตุผล...สักแห่ง"
 tgp_japan_yearly_events.1220.c: "ข้าควรเรียนรู้วิถีของ [monk.GetHerHis]..."
 tgp_japan_yearly_events.1220.tt: "พระแสดงปาฏิหาริย์ต่อท่าน"
 tgp_japan_yearly_events.1220.c.tt: "ท่านศึกษาปาฏิหาริย์"
 tgp_japan_yearly_events.1220.tt_win: "ท่านเรียนรู้วิถีของพระ"
 tgp_japan_yearly_events.1220.tt_lose: "ท่านไม่เข้าใจวิถีของพระ"
 tgp_japan_yearly_events.1220.tt_wealth: "ท่านลงทุนในวิหารด้วยตนเอง ดูเหมือนว่ามันจะจ่ายเงินปันผลที่น่าเชื่อถือ"

 tgp_japan_yearly_events.1230.t: "ถูกหลอกหลอนโดยการละเลย"
 tgp_japan_yearly_events.1230.desc: "[cursed_artifact.GetName] ไม่ใช่ [cursed_artifact.GetSlotType|l] เฉก เช่นที่มันเคยเป็นอีกต่อไป ด้วย [cursed_artifact.Custom('GetArtifactDecayDesc')] และอายุเก่าแก่ถึง [cursed_artifact.GetAge] ปี สิ่งประดิษฐ์นี้จึงเกินกำหนดการซ่อมแซมมานานแล้ว\n\nตำนานเล่าว่าวัตถุสิ่งของมีความทรงจำและอารมณ์ เช่นเดียวกับเรา และหากถูกละเลย ก็อาจถูก [Glossary( 'โยวไค', 'YOKAI_GLOSS' )] เข้าสิงได้..."
 tgp_japan_yearly_events.1230.a: "ซ่อมมันก่อนที่มันจะมีชีวิตขึ้นมา!"
 tgp_japan_yearly_events.1230.b: "ข้าจะไม่ยอมถูกวัตถุหลอกหลอน..."
 tgp_japan_yearly_events.1230.c: "หวังว่าจะไม่มีอะไรเกิดขึ้น..."
 tgp_japan_yearly_events.1230.c_cynical: "อืม ข้าไม่เชื่อในเรื่องเล่า เช่นนั้นหรอก"

 artifact_decay_scratched: "พื้นผิวของมันมีรอยขีดข่วนและเป็นรู"
 artifact_decay_dull: "ปลายแหลมของมันเริ่มทื่อ"
 artifact_decay_torn: "ที่เข้าเล่มและผ้าของมันขาดวิ่น"
 artifact_decay_cracked: "พื้นผิวของมันเต็มไปด้วยรอยแตก"
 artifact_decay_fracture: "พื้นผิวของมันเต็มไปด้วยรอยร้าว"
 artifact_decay_worn: "มันเก่าโทรมเพียงใด"

 tgp_japan_yearly_events.1240.t: "สับสนในลายเส้น" # in the sauce
 tgp_japan_yearly_events.1240.desc: "กวีชาว [traveler.GetCulture.GetName] [traveler.GetName] ที่เดินทางผ่านดินแดนของข้า เข้ามาหาข้าพร้อมกับตำราภาษา [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ข้าได้ยินเรื่องราวเกี่ยวกับประเพณีบทกวีอันรุ่มรวยของท่าน แต่ข้าไม่สามารถถอดรหัสงานเขียนของคนของท่านได้"\n\n[traveler.GetSheHe|U] เริ่มอ่านม้วนคัมภีร์ด้วยสำเนียงที่หนักแน่น และปัญหาก็ปรากฏชัด [traveler.GetSheHe|U] อ่านจากซ้ายไปขวา ในขณะที่ตัวเขียน [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] แบบดั้งเดิมเป็นแนวตั้ง\n\nเหล่าข้าราชสำนักเฝ้ามองและหัวเราะคิกคัก ขณะที่ [traveler.GetSheHe] ยังคงพ่นถ้อยคำของ [traveler.GetHerHis] ต่อไป"
 tgp_japan_yearly_events.1240.a: "ไปหาอาจารย์มาให้ [traveler.GetHerHim] ทีเถอะ!"
 tgp_japan_yearly_events.1240.b: "ฮ่า! ช่างเป็นเรื่องน่าหัวเราะดีแท้"
 tgp_japan_yearly_events.1240.c: "ขอลองดูว่าข้าจะอธิบายเป็นภาษาของเจ้าได้หรือไม่..."

 artifact_fertility_gain_2_modifier: "ภาวะเจริญพันธุ์"
 artifact_powerful_vassal_opinion_5_modifier: "$artifact_powerful_vassal_opinion_1_modifier$"
 artifact_monthly_prestige_add_3_modifier: "$artifact_monthly_prestige_add_1_modifier$"
 artifact_kakejiku_scroll_name: "ม้วนคัมภีร์คาเคจิคุ"
 KAKEJIKU_GLOSS: "#bold ม้วนคัมภีร์คาเคจิคุ#! — หรือ #bold คาเคโมโนะ#! คือม้วนคัมภีร์ที่แสดงการประดิษฐ์ตัวอักษรหรือภาพวาด ซึ่งมักจะบอกเล่าเรื่องราว"
 artifact_kakejiku_scroll_desc: "[Glossary( 'ม้วนภาพคาเคจิกุ', 'KAKEJIKU_GLOSS' )] ที่บอกเล่าเรื่องราวของ"
 artifact_kakejiku_scroll_crane_desc: "$artifact_kakejiku_scroll_desc$ นกกระเรียนเดียวดายที่เฝ้ามองต้นไม้\n\n#weak ขนนกกระเรียนไหวลู่ตามลม เฝ้ามองต้นอ่อน นกกระเรียนจับคู่ครั้งเดียวในชีวิต แต่ต้นไม้นี้ใช้เวลาเติบโตนานหลายศตวรรษ...#!"
 artifact_kakejiku_scroll_friends_desc: "$artifact_kakejiku_scroll_desc$ คนสองคนที่โชคชะตานำพามาพบกัน เติบโตผ่านอุปสรรคและสร้างมิตรภาพอันลึกซึ้ง\n\n#weak คนสองคนพบกันใต้ท้องฟ้าที่เต็มไปด้วยดวงดาว สายใยของพวกเขาเชื่อมโยงกันด้วยสะพานสวรรค์...#!"
 artifact_kakejiku_scroll_sword_desc: "$artifact_kakejiku_scroll_desc$ ดาบต้องมนตร์ ที่มีเพียงนักรบผู้ทรงเกียรติที่สุดเท่านั้นที่สามารถถือครองได้\n\n#weak ต้นซากุระบานสะพรั่งเหนือสระน้ำนิ่ง และใต้ต้นนั้นมีดาบที่อยู่ในฝัก...#!"

 tgp_japan_yearly_events.1250.t: "เรื่องราวแห่งยุคสมัย"
 tgp_japan_yearly_events.1250.desc: "[scroll_gifter.GetName] ก้าวออกมาข้างหน้า พร้อมถือสิ่งของห่อหุ้มขนาดยาว "โอ [scroll_gifter.Custom2('RelationToMeShort', ROOT.Char)] ของข้า ข้ามีของขวัญสำหรับการรวมตัวกันของท่าน" [scroll_gifter.GetNameNoTooltip] กล่าวพร้อมกับมอบม้วนคัมภีร์ "[Glossary( 'Kakejiku Scroll', 'KAKEJIKU_GLOSS' )] พร้อมด้วยร้อยแก้วจากกวีชั้นเลิศ ขอให้ท่านระลึกถึงความหมายของมันในยามที่ยากลำบาก""
 tgp_japan_yearly_events.1250.a: "แขวนมันไว้เหนือเตียง แต่งงาน"
 tgp_japan_yearly_events.1250.b: "วางไว้ในราชสำนัก ที่ที่ทุกคนสามารถเห็นได้"
 tgp_japan_yearly_events.1250.c: "เก็บรักษาไว้อย่างดี เพื่อให้ลูกหลานของเราได้อ่าน"
