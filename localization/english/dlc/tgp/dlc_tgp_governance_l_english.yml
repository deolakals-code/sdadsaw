 irregular_accounting: "การบัญชีที่ไม่ปกติ"
 irregular_accounting_contract: "$irregular_accounting$"
 irregular_accounting_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 irregular_accounting_desc: "ภาษีที่ถึงกำหนดชำระจากภูมิภาคนี้ถูกส่งมาถึงช้าลงเรื่อยๆ ในการเก็บ แต่ละครั้ง และค่าขนส่งก็สูงขึ้นทุกครั้งที่จัดส่ง"
 irregular_accounting_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0012.t: "การบัญชีที่ไม่ปกติ"
 tgp_governor_contract_event.0012.desc: "ความคลาดเคลื่อนของเวลาจัดส่งเป็นสิ่งที่คาดเดาได้อยู่บ้างเมื่อเป็นเรื่องการขนส่งภาษี ไม่ว่าจะเนื่องมาจากสภาพถนน สภาพอากาศ หรือปัจจัยอื่นที่ยากจะคาดการณ์หรือควบคุม\n\nทว่า การเก็บภาษีจาก [irregular_accounting_destination.GetName] นั้นล่าช้าผิดปกติ และค่าขนส่งที่ถูกส่งต่อมายังสำนักงานของข้าก็ดูเหมือนจะสูงเกินควรมากขึ้นเรื่อยๆ"
 tgp_governor_contract_event.0012.a: "เรื่องนี้สมควรได้รับการตรวจสอบอย่างใกล้ชิด"
 tgp_governor_contract_event.0012.a_tt: "เดินทางไปยัง [irregular_accounting_destination.GetName] และสืบหาความจริงของเรื่องนี้"
 tgp_governor_contract_event.0012.b: "ข้ามั่นใจว่าเดี๋ยวเรื่องนี้ก็คงคลี่คลายไปเอง"

 tgp_governor_contract_event.0003.t: "การบัญชีที่ไม่ปกติ"
 tgp_governor_contract_event.0003.desc: "ข้าคงเกือบจะชื่นชมการดำเนินการอันซับซ้อนของผู้ยักยอกผู้นี้ หากไม่ใช่ เพราะมันเป็นเงินทุนของข้าที่ [dubious_tax_agent.GetSheHe] กำลังถ่ายเทเข้ากระเป๋าของ [dubious_tax_agent.GetHerHis]\n\nเหล่าเสมียนยังคงกำลังแกะรอยขอบเขตความผิดปกติทั้งหมด แต่สิ่งที่พวกเขาพบจนถึงตอนนี้นั้นมากเกินพอที่จะเอาผิด [dubious_tax_agent.GetHerHim] แม้ว่าสมุดบัญชีที่ถูกเผาทิ้งตอนที่เรามาถึงจะยังไม่ใช่ข้อบ่งชี้ที่เพียงพอก็ตาม\n\nผู้กระทำผิดยืนอยู่ข้างข้าเพื่อรอคอยการตัดสิน ดวงตาจับจ้องอยู่ที่พื้น ท่าทีของ [dubious_tax_agent.GetHerHis] หม่นหมองพอๆ กับอนาคตของ [dubious_tax_agent.GetHerHis]"
 tgp_governor_contract_event.0003.a: "จงถูกริบทรัพย์ที่ได้มาโดยมิชอบ และเข้าไปสำนึกผิดในเรือนจำซะ" # (Special governor option)
 tgp_governor_contract_event.0003.b: "การจองจำคงเป็นการเสียเปล่าสำหรับแนวคิดที่ #EMP กล้าได้กล้าเสีย#! เช่นนี้"
 tgp_governor_contract_event.0003.c: "นี่อาจส่งผลเสียต่อข้า - ความจริงไม่จำเป็นต้องถูกเปิดเผย"
 tgp_governor_contract_event.0003.d: "จงชดใช้ค่าเสียหาย แล้วเจ้าจะได้รับการอภัยโทษ แค่ครั้งนี้เท่านั้น"
 tgp_governor_contract_event.0003.e: "ข้าคิดว่าสิ่งที่เจ้า #EMP ต้องการจริงๆ#! คือหุ้นส่วน..."

