 crumbling_bridge_contract: "$crumbling_bridge$"
 crumbling_bridge_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 crumbling_bridge_desc: "สะพานสำคัญแห่งหนึ่งพังทลายลง ขัดขวางการจราจรในท้องถิ่นอย่างรุนแรง"
 crumbling_bridge_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0024.t: "สะพานที่กำลังพังทลาย"
 tgp_governor_contract_event.0024.desc: "หนึ่งในรากฐานความรับผิดชอบของ[ROOT.Char.GetTitleTierNamePossessive]คือการบำรุงรักษาโครงสร้างพื้นฐานที่จำเป็น ซึ่ง ทำให้ข่าวการพังทลายของสะพานล่าสุดใน [crumbling_bridge_destination.GetName] น่ากังวลมากยิ่งขึ้น\n\nนี่ไม่เพียงส่งผลกระทบต่อการค้าและการจราจรเท่านั้น แต่อาจบ่อนทำลายความเชื่อมั่นในการบริหารงานของข้าด้วย"
 tgp_governor_contract_event.0024.a: "บอกให้พวกเขาเตรียมพร้อมรับการมาถึงของข้า ข้ากำลังไป"
 tgp_governor_contract_event.0024.a_tt: "เดินทางไปยัง [crumbling_bridge_destination.GetName] และจัดการกับผลที่ตามมา"
 tgp_governor_contract_event.0024.b: "ย่อมมีสะพานอื่นเสมอ: พวกเขาแค่ต้องเดินทางไกลขึ้น"

 tgp_governor_contract_event.0025.t: "สะพานที่กำลังพังทลาย"
 tgp_governor_contract_event.0025.desc: "เมื่อมองลงไปยังซากสะพานที่ปรักหักพัง สถานการณ์ช่างน่าสลดใจ ขณะที่คนงานกำลังพยายามเคลียร์ซากปรักหักพัง ฝูงพ่อค้าและนักเดินทางก็ยังคงเพิ่มขึ้นเรื่อยๆ เมื่อมีคนมาถึงมากขึ้นโดยไม่ทราบถึงการหยุดชะงักที่ไม่คาดคิดนี้ในแผนการเดินทางของพวกเขา\n\nขณะที่สินค้าเน่าเสียและอารมณ์เริ่มเดือดดาลในหมู่ผู้ติดค้าง ผลที่ตามมาของเหตุการณ์นี้อาจกว้างไกล หากไม่ได้รับการจัดการอย่างชาญฉลาด"
 tgp_governor_contract_event.0025.a: "ถนนคือเส้นเลือดใหญ่ของชาติ: ให้กองทัพช่วยสร้างมันขึ้นมาใหม่" # (Special governor option)
 tgp_governor_contract_event.0025.b: "ใช้ทรัพยากรทุกอย่างเพื่อสร้างสะพานใหม่ให้เร็วที่สุดเท่าที่จะทำได้"
 tgp_governor_contract_event.0025.c: "จัดหาเรือข้ามฟากชั่วคราวจนกว่าสะพานจะสร้างใหม่เสร็จ"
 tgp_governor_contract_event.0025.d: "ความเร่งรีบจะนำไปสู่อุบัติเหตุอีกครั้ง สร้างสะพานทดแทนที่แข็งแรง"
 tgp_governor_contract_event.0025.e: "ฉวยโอกาสนี้เกลี้ยกล่อมพ่อค้าที่ติดค้างให้ตั้งร้านค้าที่นี่"

