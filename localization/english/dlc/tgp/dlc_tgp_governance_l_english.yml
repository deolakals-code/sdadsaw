l_english: 

 jail_inspection: "การตรวจเรือนจำ"
 jail_inspection_contract: "$jail_inspection$"
 jail_inspection_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 jail_inspection_desc: "มีรายงานอันเลวร้ายมาจากเรือนจำประจำเขต: สภาพความเป็นอยู่ย่ำแย่ถึงขีดสุด และเหล่านักโทษก็จวนเจียนจะก่อจลาจลอยู่รอมร่อ"
 jail_inspection_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0010.t: "การตรวจเรือนจำ"
 tgp_governor_contract_event.0010.desc: "ดูเหมือนว่าเหล่านักโทษในเรือนจำประจำเขตอันทรุดโทรมของ [jail_inspection_destination.GetName] ได้เริ่มกระด้างกระเดื่อง ประท้วงสภาพความเป็นอยู่ และขัดขวางความพยายามสุดกำลังของผู้คุมที่จะควบคุมพวกเขา รายงานเตือนว่าต้องหาทางแก้ไขโดยเร็ว มิฉะนั้นเหล่านักโทษอาจจู่โจมผู้คุมจนรับมือไม่ไหว"
 tgp_governor_contract_event.0010.a: "ข้าควรไปจัดการเรื่องนี้ด้วยตนเอง"
 tgp_governor_contract_event.0010.a_tt: "เดินทางไปยัง [jail_inspection_destination.GetName] และตรวจเรือนจำด้วยตนเอง"
 tgp_governor_contract_event.0010.b: "คำวิงวอนของเหล่านักโทษมิได้อยู่ในความสนใจของข้า"

 tgp_governor_contract_event.0001.t: "การตรวจเรือนจำ"
 tgp_governor_contract_event.0001.desc: "ทันทีที่ข้าย่างเท้าเข้าไปในเรือนจำ ประสาทสัมผัสก็ถูกจู่โจมด้วยกลิ่นเหม็นเน่าอับจากความสกปรกและเสียงครวญครางอย่างทุกข์ทรมานของเหล่านักโทษ มีบางสิ่งที่ตัวเล็กๆ เฉียดผ่านเท้าข้าไปก่อนจะวิ่งหายเข้าไปในเงามืดอย่างรวดเร็วจนมองไม่ทัน\n\nข้าหันไปมองยังห้องขังที่ใกล้ที่สุดและสบตากับนักโทษที่อยู่ข้างใน สายตาของ [sick_prisoner.GetHerHis] ดั่งถ่านไฟที่ลุกโชนด้วยความโกรธแค้น ท่ามกลางความทุกข์ระทมบนใบหน้าของ [sick_prisoner.GetHerHis]"
 tgp_governor_contract_event.0001.a: "บูรณะเรือนจำ แต่จะใช้นักโทษเป็นแรงงาน" # (Special governor option)
 tgp_governor_contract_event.0001.b: "เราต้องปรับปรุงสภาพความเป็นอยู่ของพวกเขาทันที!"
 tgp_governor_contract_event.0001.c: "อภัยโทษให้แก่ผู้ที่มีความผิดน้อยที่สุด"
 tgp_governor_contract_event.0001.d: "สั่งเฆี่ยนพวกที่โวยวายเสียงดังที่สุดให้เงียบปาก"
 tgp_governor_contract_event.0001.e: "เราจะปล่อยพวกเขา - เพื่อเป็นแรงงานในไร่นาและการก่อสร้างของเรา"

 task_contract_reward_effect_renovate_jail_desc: "$label_success_standard$"
 task_contract_reward_effect_improve_their_conditions_desc: "$label_success_standard$"
 task_contract_reward_effect_pardon_some_of_them_desc: "$label_success_standard$"
 task_contract_reward_effect_beat_the_complainers_desc: "$label_success_standard$"
 task_contract_reward_effect_convict_labor_desc: "$label_success_standard$"

 potent_physick: "ยาขนานเอก"
 potent_physick_contract: "$potent_physick$"
 potent_physick_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 potent_physick_desc: "ยาขนานใหม่ที่ทรงประสิทธิภาพกำลังถูกเร่ขายในตลาด และฝูงชนผู้ซื้อที่แห่แหนกันมากำลังคุกคามความสงบเรียบร้อยของบ้านเมือง"
 potent_physick_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0011.t: "ยาขนานเอก"
 tgp_governor_contract_event.0011.desc: "น้อยครั้งนักที่พ่อค้าเร่ ซึ่งตั้งแผงในตลาดจะได้รับความสนใจจากทางการ แต่ดูเหมือนว่าบุคคลหนึ่งใน [potent_physick_destination.GetName] กำลังโปรโมตยาขนานวิเศษที่ได้ผลชะงัดนัก จนฝูงชนที่อึกทึกครึกโครมที่ยานี้ดึงดูดมา กำลังกลายเป็นการรบกวนความสงบเรียบร้อยของบ้านเมืองอย่างรวดเร็ว"
 tgp_governor_contract_event.0011.a: "ยาขนานใดก็ตามที่เป็นที่ต้องการถึงเพียงนี้ ย่อมคุ้มค่าที่จะตรวจสอบ"
 tgp_governor_contract_event.0011.a_tt: "เดินทางไปยัง [potent_physick_destination.GetName] และฟื้นฟูความสงบเรียบร้อยในตลาด"
 tgp_governor_contract_event.0011.b: "ข้าไม่สนใจเรื่องราวในตลาด"

 tgp_governor_contract_event.0002.t: "ยาขนานเอก"
 tgp_governor_contract_event.0002.desc: "หลังจากผู้ติดตามของข้าสลายฝูงชนที่ดื้อด้านออกไป ข้าก็ยืนอยู่เบื้องหน้าคนขายยาและยาปรุงของ [snake_oil_peddler.GetHerHis] สายตาของนักต้มตุ๋นเจ้าเล่ห์ผู้นี้จับจ้องคุณภาพอาภรณ์ของข้า และมุ่งเป้ามาที่ลูกค้ารายใหม่ผู้มั่งคั่งนี้\n\n"เพียงขวดเดียว [ROOT.Char.Custom('FormOfAddressForLiege')]" [snake_oil_peddler.GetSheHe] ชูนิ้วขึ้นหนึ่งนิ้ว โบกไปมาอย่างมีชีวิตชีวาเพื่ออธิบาย "รับประกันว่าจะเติมเต็มแก่นแท้ภายในของท่าน และแก้ไขสิ่งที่ผิดปกติในตัวท่าน!"\n\n"ไม่ทราบว่า [ROOT.Char.GetLadyLord] ของข้าจะสนใจรับสักขวด หรือหลายขวดดีขอรับ" พ่อค้าเร่ยิ้มกว้างด้วยความโลภอย่างประจบประแจง"
 tgp_governor_contract_event.0002.a: "เราจะยึดยาปรุงเหล่านี้ไว้เป็นเสบียงฉุกเฉิน" # (Special governor option)
 tgp_governor_contract_event.0002.b: "เจ้ามี #EMP ใบอนุญาต#! สำหรับแผงลอยนี้หรือไม่"
 tgp_governor_contract_event.0002.c: "เก็บข้าวของของเจ้าซะ แล้วเอายาต้มตุ๋นนี้ไปขายที่อื่น"
 tgp_governor_contract_event.0002.d: "บังเอิญว่าข้ากำลังต้องการแพทย์อยู่พอดี..."
 tgp_governor_contract_event.0002.e: "ข้าคิดว่าข้าจะรับไว้: กระดกลงคอเลย!"

