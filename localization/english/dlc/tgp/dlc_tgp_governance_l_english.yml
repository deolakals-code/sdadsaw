 doddering_magistrate: "ข้าราชการผู้ชราภาพ"
 doddering_magistrate_contract: "$doddering_magistrate$"
 doddering_magistrate_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 doddering_magistrate_desc: "เหล่าเสมียนในเขตนี้ได้ส่งสาส์นร้องทุกข์มาว่า หัวหน้างานผู้สูงวัยของพวกเขาไม่สามารถปฏิบัติงานได้อีกต่อไปแล้ว"
 doddering_magistrate_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0015.t: "ข้าราชการผู้ชราภาพ"
 tgp_governor_contract_event.0015.desc: "คติพจน์ที่ว่าอายุที่มากขึ้นมาพร้อมกับปัญญาและประสบการณ์ดูเหมือนจะไม่เป็นความจริง สำหรับเหล่าเสมียนแห่ง [doddering_magistrate_destination.GetName] ผู้ ซึ่งร่วมกันส่งคำร้องหลายฉบับมายังสำนักงานของข้า เพื่อขอให้หัวหน้าของพวกเขา ซึ่งอยู่ในวัยชราภาพมากแล้ว ถูกโยกย้ายหรือปลดออกจากตำแหน่ง"
 tgp_governor_contract_event.0015.a: "นี่เป็นปัญหาที่ละเอียดอ่อน ข้าควรจัดการด้วยตนเอง"
 tgp_governor_contract_event.0015.a_tt: "เดินทางไปยัง [doddering_magistrate_destination.GetName] และประเมินผลการปฏิบัติงานของข้าราชการผู้นั้น"
 tgp_governor_contract_event.0015.b: "ไม่ใช่หน้าที่ของพวกเขาที่จะตั้งคำถามกับหัวหน้างาน"

 tgp_governor_contract_event.0006.t: "ข้าราชการผู้ชราภาพ"
 tgp_governor_contract_event.0006.desc: "ข้ารู้สึกราวกับว่าข้าสามารถใช้ชีวิตที่สองได้ทั้งชีวิต ในช่วงเวลาที่ข้าราชการชราผู้นี้ลุกจากที่นั่งของ [elderly_magistrate.GetHerHis] และกล่าวทักทายตามธรรมเนียม\n\nการโค้งคำนับช้าๆ ของ [elderly_magistrate.GetHerHis|U] ดูเหมือนจะสร้างความยากลำบากอย่างยิ่งให้แก่ [elderly_magistrate.GetHerHim] และ [elderly_magistrate.GetSheHe] ก็ค้างท่านั้นไว้นานจนข้าต้องครุ่นคิดว่านี่อาจจะเป็นวาระสุดท้ายของ [elderly_magistrate.GetHerHim] ที่นี่และเดี๋ยวนี้หรือไม่ ก่อนที่เสมียนสองคนจะรีบเข้ามาช่วยพยุง [elderly_magistrate.GetHerHim] ให้ยืดตัวตรง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ให้เกียรติข้ามากเกินไปแล้ว" [elderly_magistrate.GetSheHe] พูดเสียงแหบแห้ง เสียงของ [elderly_magistrate.GetHerHis] ดังเอี๊ยดอ๊าดเหมือนล้อเกวียนเก่าๆ ที่ชำรุด "ข้าจะรับใช้ [ROOT.Char.Custom('FormOfAddressForLiege')] ได้อย่างไรบ้างขอรับ""
 tgp_governor_contract_event.0006.a: "มอบหมายหน้าที่ของ [elderly_magistrate.GetHerHis] ให้ผู้อื่น แต่ให้ [elderly_magistrate.GetHerHim] ยังคงดำรงตำแหน่งไว้" # (Special governor option)
 tgp_governor_contract_event.0006.b: "อายุของ [elderly_magistrate.GetHerHis|U] ได้บั่นทอนความสามารถของ [elderly_magistrate.GetHerHis] แล้ว: บังคับให้ [elderly_magistrate.GetHerHim] ออกไป"
 tgp_governor_contract_event.0006.c: "[elderly_magistrate.GetWomanMan] ผู้นี้สมควรได้รับการเลื่อนตำแหน่งมานานแล้ว! ไปยังที่ที่ #EMP ไม่เป็นที่สังเกต#! สักแห่ง..."
 tgp_governor_contract_event.0006.d: "ให้ [elderly_magistrate.GetHerHim] ทำงานต่อไป รัฐจะคงอยู่นานกว่า [elderly_magistrate.GetHerHim]"
 tgp_governor_contract_event.0006.e: "[elderly_magistrate.GetSheHe|U] อาจทำงานต่อไปได้ แต่จะเป็นในฐานะเสมียนผู้ต่ำต้อย"

