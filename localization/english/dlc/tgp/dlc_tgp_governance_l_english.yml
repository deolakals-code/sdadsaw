 hoarding_grain: "การกักตุนธัญพืช"
 hoarding_grain_contract: "$hoarding_grain$"
 hoarding_grain_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 hoarding_grain_desc: "ตระกูลท้องถิ่นที่มีชื่อเสียงตระกูลหนึ่งได้กักตุนธัญพืชและปฏิเสธที่จะขาย ส่งผลให้ราคาสูงขึ้น ในขณะที่เจ้าหน้าที่ก็ถูกข่มขู่จนยอมจำนนอย่างสงบนิ่ง"
 hoarding_grain_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0014.t: "การกักตุนธัญพืช"
 tgp_governor_contract_event.0014.desc: "นับเป็นธรรมเนียมปฏิบัติที่โชคร้าย แต่ก็พบเห็นได้บ่อย ที่ตระกูลมั่งคั่งจะซื้อธัญพืชเกินความต้องการในช่วงเวลาที่อุดมสมบูรณ์โดยหวังผลกำไรในอนาคต แต่ข้าได้รับรายงานว่าตระกูลหนึ่งใน [hoarding_grain_destination.GetName] ได้ทำเกินกว่าปกติไปมาก\n\nดูเหมือนว่าพวกเขาได้สะสมธัญพืชไว้มากเสียจนราคาสูงขึ้นถึงจุดที่คนธรรมดาสามัญแทบจะไม่สามารถซื้อหาได้"
 tgp_governor_contract_event.0014.a: "การปรากฏตัวของข้าจำเป็นต่อการแก้ไขปัญหานี้"
 tgp_governor_contract_event.0014.a_tt: "เดินทางไปยัง [hoarding_grain_destination.GetName] และแก้ไขปัญหาการขาดแคลนธัญพืช"
 tgp_governor_contract_event.0014.b: "เรื่องที่สำคัญกว่ามากรอให้ข้าไปจัดการ"

 tgp_governor_contract_event.0005.t: "การกักตุนธัญพืช"
 tgp_governor_contract_event.0005.desc: "เครื่องตก แต่งอันหรูหราในคฤหาสน์ของ[grain_hoarding_local_notable.GetNamePossessive]ช่างขัดแย้งอย่างสิ้นเชิงกับกระท่อมซอมซ่อที่เราผ่านมา เจ้าบ้านของเราไม่ได้เสแสร้งที่จะปิดบังหรือลดทอนทรัพย์สินที่ [grain_hoarding_local_notable.GetHerHis] ได้มา ที่จริงแล้ว [grain_hoarding_local_notable.GetSheHe] เกือบจะปลาบปลื้มกับมันด้วยซ้ำ\n\n"อภัยให้ข้าในความไม่รู้กิจการบ้านเมืองด้วยเถิด แต่ข้าไม่เข้าใจว่าเหตุใด [ROOT.Char.GetLadyLord] ของข้าจึงสนใจในเรื่องนี้" [grain_hoarding_local_notable.GetSheHe] กล่าวอย่างอวดดี "นี่เป็นเพียงเรื่องของธุรกรรมทางธุรกิจที่ถูกกฎหมาย และแน่นอนว่า [ROOT.Char.GetLadyLord] ของข้าคงมีปัญหาเร่งด่วนกว่าให้ต้องไปจัดการ...?" ถ้อยคำสุดท้ายของ [grain_hoarding_local_notable.GetHerHis] นั้นเหมือนคำกล่าวอ้างมากกว่าคำถาม"
 tgp_governor_contract_event.0005.a: "ปล่อยธัญพืชสำรองของรัฐบาลออกมาถล่มตลาด" # (Special governor option)
 tgp_governor_contract_event.0005.b: "ความโลภเล็กๆ น้อยๆ นี้ ไม่ต่ำกว่าศักดิ์ศรีอันประจักษ์ชัดของ [grain_hoarding_local_notable.GetWomanMan] เช่นท่านหรือ"
 tgp_governor_contract_event.0005.c: "นี่อาจจะถูกกฎหมาย แต่ข้ามั่นใจว่า #EMP บางสิ่ง#! ที่ไม่ชอบมาพากลคงจะถูกค้นพบได้"
 tgp_governor_contract_event.0005.d: "จะเป็น เช่นไร หากข้าเสนอที่จะรับซื้อธัญพืชต่อจากท่าน"
 tgp_governor_contract_event.0005.e: "ข้าอาจมีตำแหน่งให้ท่าน หากท่านมีท่าทีที่ให้ความร่วมมือมากกว่านี้"

