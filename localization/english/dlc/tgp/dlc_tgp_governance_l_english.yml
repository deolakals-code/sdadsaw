 salt_smugglers: "พวกลักลอบค้าเกลือ"
 salt_smugglers_contract: "$salt_smugglers$"
 salt_smugglers_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 salt_smugglers_desc: "ผู้นำขบวนการลักลอบค้าเกลือในท้องถิ่นถูกจับกุมได้ และกำลังเสนอที่จะบอกที่ซ่อนของพรรคพวกที่เหลือเพื่อแลกกับอิสรภาพ"
 salt_smugglers_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0013.t: "พวกลักลอบค้าเกลือ"
 tgp_governor_contract_event.0013.desc: "การลักลอบค้าเกลือถือเป็นความผิดร้ายแรงต่ออำนาจของทางการ และผู้นำของกลุ่มโจรนอกกฎหมาย เช่นนี้เพิ่งถูกจับกุมได้ใน [salt_smugglers_destination.GetName] ดูเหมือนว่าหัวหน้าโจรผู้นี้ได้เรียกร้องที่จะพูดคุยกับข้าเป็นการส่วนตัว โดยเสนอที่จะสังเวยพรรคพวกที่เหลือเพื่อแลกกับอิสรภาพของตนเอง"
 tgp_governor_contract_event.0013.a: "ข้าควรจะรับฟังข้อเสนอนี้ไว้หน่อย"
 tgp_governor_contract_event.0013.a_tt: "เดินทางไปยัง [salt_smugglers_destination.GetName] และจัดการกับโจรนอกกฎหมายผู้นี้ ไม่ทางใดก็ทางหนึ่ง"
 tgp_governor_contract_event.0013.b: "การขานรับคำเรียกของโจรนอกกฎหมายมันต่ำกว่าศักดิ์ศรีของข้า"

 tgp_governor_contract_event.0004.t: "พวกลักลอบค้าเกลือ"
 tgp_governor_contract_event.0004.desc: "แม้โซ่ตรวนจะพันธนาการมือของ[salt_smuggler.GetNamePossessive]ไว้แน่น แต่มันก็แทบไม่ได้หยุดยั้งสันดานมุสาของนักค้าของเถื่อนผู้นี้เลย ท่าทีของ [salt_smuggler.GetHerHis] นั้นอวดดีอย่างไม่เกรงกลัว ราวกับว่าเราเป็นพ่อค้าสองคนที่กำลังต่อรองราคากันในตลาด ไม่ใช่เจ้าหน้าที่บ้านเมืองกับโจรนอกกฎหมายที่ชีวิตแขวนอยู่บนเส้นด้าย\n\n"ใช่ ข้าจะบอกว่าพรรคพวกที่เหลือของข้าอยู่ที่ไหน ทันทีที่ท่านคลายเจ้านี่ออก" [salt_smuggler.GetSheHe] ยกข้อมือที่ถูกมัดขึ้นพลางเลิกคิ้วไปยังมันอย่างมีความหมาย "และรับประกันเส้นทางที่ปลอดภัยให้ข้าไปยังที่ที่เราไม่จำเป็นต้องพบกันอีก""
 tgp_governor_contract_event.0004.a: "ประหาร [salt_smuggler.GetHerHim] ซะ - ให้ #EMP นั่น#! เป็นการส่งสาส์นถึงพรรคพวกของ [salt_smuggler.GetHerHis]" # (Special governor option)
 tgp_governor_contract_event.0004.b: "ตกลงตามข้อเสนอของเจ้า แต่อย่าให้ข้าเห็นหน้าเจ้าอีก"
 tgp_governor_contract_event.0004.c: "ข้าจะสอบสวน [salt_smuggler.GetHerHim] เอง: เราจะได้ตัวพรรคพวกของ [salt_smuggler.GetHerHis] ตามเงื่อนไขของเรา"
 tgp_governor_contract_event.0004.d: "ที่ซ่อนทรัพย์สินที่ได้มาโดยมิชอบของเจ้า อาจซื้อความปรานีให้เจ้าได้..."
 tgp_governor_contract_event.0004.e: "ข้าอาจใช้ประโยชน์จาก [salt_smuggler.GetWomanMan] ที่มีทักษะเฉพาะตัว เช่นเจ้าได้"

