 dam_in_disrepair_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 dam_in_disrepair_desc: "เขื่อนที่กำลังผุพังสร้างความวิตกกังวลไม่น้อยให้แก่ผู้อยู่อาศัย - และเหล่าเจ้าหน้าที่ - ในเขต"
 dam_in_disrepair_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0009.t: "เขื่อนชำรุด"
 tgp_governor_contract_event.0009.desc: "เขื่อนสำคัญใน [dam_in_disrepair_destination.GetName] อยู่ในสภาพชำรุดทรุดโทรมอย่างหนัก และผลที่ตามมาอาจเป็นหายนะร้ายแรงหากสถานการณ์ไม่ได้รับการแก้ไขโดยพลัน\n\nทว่า นี่ไม่ใช่ภารกิจเล็กน้อย และงบประมาณส่วนใหญ่ของเราก็ถูกจัดสรรไว้สำหรับที่อื่นแล้ว สำหรับทางออกที่มากกว่าการแก้ไขเพียงชั่วคราว เราควรหาหนทางที่จะลดค่าใช้จ่ายลง"
 tgp_governor_contract_event.0009.a: "ระดมราษฎรในท้องถิ่น แต่ให้ยกเว้นคนยากจนและเจ็บป่วย" # (Special governor option)
 tgp_governor_contract_event.0009.b: "เกณฑ์แรงงานจากผู้ที่จะได้รับผลกระทบหนักที่สุดหากเขื่อนพัง"
 tgp_governor_contract_event.0009.c: "ผู้อยู่อาศัยที่มั่งคั่งควรสมทบตามกำลังของตน"
 tgp_governor_contract_event.0009.d: "ทรัพย์สมบัติเทียบไม่ได้เลยกับชีวิตผู้คน - ข้าจะจ่ายเอง"
 tgp_governor_contract_event.0009.e: "เราจะเกณฑ์ทรัพยากรที่จำเป็นจากพ่อค้าในท้องถิ่น"

