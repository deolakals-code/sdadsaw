 quaking_in_panic: "ตัวสั่นด้วยความตื่นตระหนก"
 quaking_in_panic_contract: "$quaking_in_panic$"
 quaking_in_panic_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 quaking_in_panic_desc: "หมู่บ้านหลายแห่งประสบเหตุแผ่นดินไหว และความปั่นป่วนที่ตามมากำลังคุกคามความสงบเรียบร้อยของประชาชน"
 quaking_in_panic_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0030.t: "ตัวสั่นด้วยความตื่นตระหนก"
 tgp_governor_contract_event.0030.desc: "ข้ากำลังสนทนาอย่างลึกซึ้งกับ [my_councillor.GetFirstName] เมื่อ [alarmed_councillor.GetFirstName] พรวดพราดเข้ามาในห้องด้วยความเร่งรีบผิดปกติ ท่าทางสั่นสะท้านอย่างเห็นได้ชัด\n\n"ผู้ส่งสารจาก [quaking_in_panic_destination.GetName] [ROOT.Char.Custom('FormOfAddressForLiege')]! เกิดแผ่นดินไหว และเหล่าไพร่ก็ถือเป็นลางร้าย อ้างว่าเป็นสัญญาณแห่งความไม่พอใจของสวรรค์!""
 tgp_governor_contract_event.0030.a: "ความตื่นตระหนกก็เหมือนไฟป่า ยากที่จะดับหากปล่อยให้ลุกลาม"
 tgp_governor_contract_event.0030.a_tt: "เดินทางไปยัง [quaking_in_panic_destination.GetName] และบรรเทาความกังวลของพวกเขา"
 tgp_governor_contract_event.0030.b: "ข้าไม่ใส่ใจเสียงร้องโวยวายของเหล่าไพร่"

 tgp_governor_contract_event.0031.t: "ตัวสั่นด้วยความตื่นตระหนก"
 tgp_governor_contract_event.0031.desc: "หมู่บ้านอยู่ในสภาพไม่สงบอย่างชัดเจนเมื่อข้ามาถึง เหล่าไพร่กำลังรุมล้อมผู้คุ้มกันของข้า พร้อมคำวิงวอนอย่างน่าสงสารให้เราบรรเทาโทสะของสวรรค์ก่อนที่ภัยพิบัติอื่นจะเกิดขึ้นกับพวกเขา\n\nเมื่อทอดสายตามองหมู่บ้านด้านหลังพวกเขา กำแพงที่แตกร้าวและประตูที่บิดเบี้ยวของบ้านเรือนเป็นพยานถึงที่มาของความกลัวของพวกเขา"
 tgp_governor_contract_event.0031.a: "เรียกประชุมราษฎรเพื่อสร้างความมั่นใจให้แก่ประชาชน" # (Special governor option)
 tgp_governor_contract_event.0031.b: "ส่งทหารหน่วยเล็กๆ ไปประจำการเพื่อระงับความไม่สงบ"
 tgp_governor_contract_event.0031.c: "ให้ผู้อาวุโสของหมู่บ้านแสดงความมั่นใจว่าภยันตรายได้ผ่านพ้นไปแล้ว"
 tgp_governor_contract_event.0031.d: "ตรวจสอบความเสียหายอย่างละเอียดและสัญญาว่าจะให้ความช่วยเหลือเพิ่มเติม"
 tgp_governor_contract_event.0031.e: "ย้ายผู้ที่ได้รับผลกระทบหนักที่สุดและรวบรวมประชากรของภูมิภาค"

