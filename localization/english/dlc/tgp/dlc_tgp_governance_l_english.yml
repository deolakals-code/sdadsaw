 tgp_governor_contract_event.0021.b.success: "ท่านพบหลักฐานที่น่าเชื่อถือสนับสนุนข้ออ้างของฝ่ายหนึ่ง"
 tgp_governor_contract_event.0021.b.failure: "เชื้อไฟที่มากขึ้นสำหรับความบาดหมางของพวกเขาอาจมี แต่จะ ทำให้สถานการณ์เลวร้ายลง"

 tgp_governor_contract_event.0021.b.toast_success: "ท่านพบหลักฐานที่สรุปได้ ซึ่งสนับสนุนข้ออ้างของฝ่ายหนึ่ง"
 tgp_governor_contract_event.0021.b.toast_failure: "บันทึกที่เป็นชิ้นส่วนเพียง แต่ ทำให้รอยร้าวระหว่างพวกเขาลึกซึ้งยิ่งขึ้น"
 
 tgp_governor_contract_event.0021.d.success: "เหล่าเจ้าของที่ดินพบว่าข้อเสนอของท่านน่าสนใจ"
 tgp_governor_contract_event.0021.d.failure: "ข้อเสนอของท่านถูกปฏิเสธอย่างสิ้นเชิง"

 tgp_governor_contract_event.0021.d.toast_success: "การโน้มน้าวโดยอ้างถึงผลประโยชน์ส่วนตนทางวัตถุของพวกเขา จบลงด้วยผลประโยชน์ร่วมกันของท่าน"
 tgp_governor_contract_event.0021.d.toast_failure: "ความหลงใหลในทรัพย์สินของพวกเขามิได้ลดน้อยลงด้วยข้อเสนอของท่าน"

 tgp_governor_contract_event.0023.c.success: "กลยุทธ์การสืบสวนเชิงนวัตกรรมของท่านเกิดผล"
 tgp_governor_contract_event.0023.c.failure: "เหล่าเสมียนสายลับปฏิบัติหน้าที่ได้ต่ำกว่ามาตรฐาน"

