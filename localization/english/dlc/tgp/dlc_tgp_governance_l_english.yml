 fraud_in_broad_daylight: "ฉ้อโกงกลางวันแสกๆ"
 fraud_in_broad_daylight_contract: "$fraud_in_broad_daylight$"
 fraud_in_broad_daylight_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 fraud_in_broad_daylight_desc: "ตลาดที่นี่เต็มไปด้วยสินค้าลอกเลียนแบบ และผู้ซื้อที่ถูกฉ้อโกงก็กำลังโกรธแค้น"
 fraud_in_broad_daylight_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0022.t: "ฉ้อโกงกลางวันแสกๆ"
 tgp_governor_contract_event.0022.desc: "เสียงตุ้บของลังไม้ที่ถูกวางลงบนพื้นอย่างไม่ใส่ใจพิธีรีตอง ทำลายสมาธิและปลุกข้าจากงาน [reporting_councillor.GetTitledFirstName] ยืนอยู่ข้างๆ มัน\n\n"หลักฐานเพิ่มเติมมาถึงแล้ว [ROOT.Char.GetLadyLord] ของข้า ครั้งนี้เป็นขวดน้ำหอม ที่อัดแน่นไปด้วยดิน"\n\nตลาดใน [fraud_in_broad_daylight_destination.GetName] ถูกคุกคามด้วยสินค้าลอกเลียนแบบเมื่อไม่นานมานี้"
 tgp_governor_contract_event.0022.a: "เรื่องนี้สมควรแก่การสืบสวน"
 tgp_governor_contract_event.0022.a_tt: "เดินทางไปยัง [fraud_in_broad_daylight_destination.GetName] และฟื้นฟูความถูกต้องในตลาด"
 tgp_governor_contract_event.0022.b: "ลูกค้าพวกนั้นก็แค่คนโง่"

 tgp_governor_contract_event.0023.t: "ฉ้อโกงกลางวันแสกๆ"
 tgp_governor_contract_event.0023.desc: "แม้จะพยายามอย่างแข็งขัน การระบุตัวนักปลอมแปลงก็พิสูจน์แล้วว่ายากกว่าที่ข้าคาดไว้มาก\n\nเหล่าพ่อค้าที่ถูกกฎหมาย เมื่อสินค้าของพวกเขาหมด ก็จะให้คนนอกเช่าพื้นที่ต่อในช่วงเวลาที่เหลือของวัน เปิดโอกาสให้นักต้มตุ๋นจำหน่ายสินค้าปลอมของพวกเขาและหายตัวไปอย่างไร้ร่องรอย"
 tgp_governor_contract_event.0023.a: "ตรวจสอบทุกคนในตลาดและกักตัวผู้ต้องสงสัย" # (Special governor option)
 tgp_governor_contract_event.0023.b: "ตั้งรางวัลสำหรับข้อมูล"
 tgp_governor_contract_event.0023.c: "ส่งเสมียนของเราปลอมตัวเป็นผู้ซื้อ"
 tgp_governor_contract_event.0023.d: "ให้เหล่าพ่อค้าจัดการกันเอง"
 tgp_governor_contract_event.0023.e: "กวาดล้างตลาดตอนเที่ยงวัน!"
 
