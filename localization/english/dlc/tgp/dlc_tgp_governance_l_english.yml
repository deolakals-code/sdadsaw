 tgp_governor_contract_event.0020.t: "เส้นแบ่งบนผืนดิน"
 tgp_governor_contract_event.0020.desc: "ชีวิตประจำวันของ [ROOT.Char.GetTitleTierName] นั้นเกี่ยวข้องกับงานเอกสารจำนวนมาก แต่เห็นได้ชัดว่ามีบางอย่างผิดปกติเมื่อสาส์นเกือบทั้งหมดของวันนี้มาจาก [lines_in_the_soil_destination.GetName]\n\nเมื่อพิจารณารายงานอย่างถี่ถ้วน ดูเหมือนว่าเจ้าของที่ดินในท้องถิ่นสองคนกำลังขัดแย้งกันอย่างรุนแรงเรื่องที่ดินผืนหนึ่งที่คั่นอยู่ระหว่างพวกเขา และผลที่ตามมาคือพวกเขาได้เปลี่ยนสำนักงานปกครองท้องถิ่นให้กลายเป็นสมรภูมิทางกฎหมาย"
 tgp_governor_contract_event.0020.a: "ข้าว่าข้า #EMP น่าจะ#! พักจากงานในสำนักงานบ้าง"
 tgp_governor_contract_event.0020.a_tt: "เดินทางไปยัง [lines_in_the_soil_destination.GetName] และไกล่เกลี่ยข้อพิพาท"
 tgp_governor_contract_event.0020.b: "ปล่อยให้คำร้องของพวกเขากองท่วมธุลีไป เดี๋ยวก_็คงเหนื่อยไปเอง"

 tgp_governor_contract_event.0021.t: "เส้นแบ่งบนผืนดิน"
 tgp_governor_contract_event.0021.desc: "หลังจากการโต้เถียง ถกเถียง และการเหน็บแนมอย่างเจ็บแสบที่แอบแฝงมานานหลายชั่วโมงไม่รู้จบ ข้าสามารถสรุปได้เพียงว่าบุคคลที่น่าเคารพ ซึ่งเป็นหัวใจของข้อพิพาทนี้ คือพวก #EMP โง่ทึ่ม#! หัวดื้อ\n\nเห็นได้ชัดว่านี่เป็นเพียงบทล่าสุดในประวัติศาสตร์อันยาวนานของความคับข้องใจ และไม่มีฝ่ายใดยอมสละผืนดินแม้เพียงหยิบมือเดียวให้แก่อีกฝ่าย\n\nหากข้าหวังที่จะยุติการโต้เถียงอันไม่หยุดหย่อนของพวกเขา ข้าก็มีทางเลือกเพียงน้อยนิดนอกจากตัดสินในฐานะผู้พิพากษา ไม่ใช่ผู้ไกล่เกลี่ย"
 tgp_governor_contract_event.0021.a: "สั่งรังวัดที่ดินใหม่ และผลลัพธ์ที่ได้จะถือเป็นที่สิ้นสุด" # (Special governor option)
 tgp_governor_contract_event.0021.b: "ตรวจสอบเอกสารเก่าเพื่อค้นหาว่าผู้ใดมีสิทธิ์อ้างที่ดีกว่า"
 tgp_governor_contract_event.0021.c: "แบ่งทรัพย์สินอย่างเท่าเทียม และให้มันจบเรื่องเสียที"
 tgp_governor_contract_event.0021.d: "จะเป็นอย่างไรหากข้าเสนอที่จะซื้อที่ดินผืนนั้นเสียเอง"
 tgp_governor_contract_event.0021.e: "เมื่อไม่สามารถตกลงกันได้ ที่ดินผืนนี้จะตกเป็นทรัพย์สินของรัฐ"

