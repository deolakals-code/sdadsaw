 tgp_governor_contract_event.2000.t: "$missing_equipment$"
 tgp_governor_contract_event.2000.desc: "เป็นเวลา #EMP หลายสัปดาห์#! แล้วนับตั้งแต่การขนส่งยุทโธปกรณ์ใหม่ครั้งล่าสุดถึงกำหนดส่ง ข่าวคราวว่ามันอาจอยู่ที่ใดยังมาไม่ถึงข้า\n\nดาบ หน้าไม้ ลูกธนู และชุดเกราะส่วนใหญ่ล้วนผลิตโดยโรงผลิตใน [capital_location.GetNameNoTooltip] ซึ่งจ้างงานผู้คนหลายพันคน มีเพียงพวกเขาเท่านั้นที่สามารถส่งมอบในปริมาณที่เราต้องการได้\n\nหากปราศจากการขนส่งเหล่านี้ เราจะไม่สามารถติดอาวุธให้ทหารใหม่ หรือทดแทนอาวุธและชุดเกราะที่ชำรุดได้"
 tgp_governor_contract_event.2000.a: "ไปเยี่ยมโรงผลิตกันหน่อยเถอะ"
 tgp_governor_contract_event.2000.a_tt: "เดินทางไปยังโรงผลิตและแก้ไขปัญหาด้วยตนเอง"
 tgp_governor_contract_event.2000.b: "ข้าสามารถซื้อยุทโธปกรณ์เองได้เสมอ"
 tgp_governor_contract_event.2000.c: "ส่งสาส์นไปยัง [capital_location.GetNameNoTooltip] เดี๋ยวเรื่องก็คงคลี่คลายในที่สุด"
 
 tgp_governor_contract_event.2001.t: "$missing_equipment$: โรงผลิต"
 tgp_governor_contract_event.2001.desc: "หัวหน้าโรงผลิตมาถึง #EMP ในที่สุด#! เขาทักทายข้าด้วยการโค้งคำนับอย่างเป็นทางการและลึกซึ้ง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ช่างเป็นการมาเยือนที่ไม่คาดคิด ข้าได้ตรวจสอบสมุดบัญชีตามที่ร้องขอแล้ว และดูเหมือนว่าข้อผิดพลาดของเสมียนอาจอยู่เบื้องหลังการขาดส่งสินค้าไปยัง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] นับเป็นความผิดพลาดที่โชคร้าย แน่นอนว่า เราจะเปลี่ยนเส้นทางการจัดส่งครั้งต่อไปของเราไปยังท่าน""
 tgp_governor_contract_event.2001.a: "ข้อผิดพลาดของ #EMP เสมียน#! รึ [court_relation.GetFirstNameNoTooltip] จะต้องได้ยินเรื่องนี้..."
 tgp_governor_contract_event.2001.a.tt: "ท่านเกลี้ยกล่อมหัวหน้าคนงานได้สำเร็จ โดยขู่ว่าจะหยิบยกเรื่องนี้ขึ้นมาพูดกับ [court_relation.GetShortUIName] ที่ราชสำนัก"
 tgp_governor_contract_event.2001.b: "แน่นอนว่าควรจะต้องมีค่าชดเชยเพิ่มเติม ใช่หรือไม่"
 tgp_governor_contract_event.2001.c: "คงจะโชคร้ายหากเรื่องนี้แพร่งพรายสู่สาธารณะ ใช่หรือไม่"
 tgp_governor_contract_event.2001.d: "ดีมาก ก็แค่ ทำให้แน่ใจว่ามันจะถูกส่งมา"
 tgp_governor_contract_event.2001.tt_success_desc: "หัวหน้าคนงานถูกเกลี้ยกล่อม"
 tgp_governor_contract_event.2001.tt_success: "ท่านเกลี้ยกล่อมหัวหน้าคนงานให้มอบของเพิ่มเติมแก่ท่านได้สำเร็จ"
 tgp_governor_contract_event.2001.tt_failure_desc: "หัวหน้าคนงาน #bold ไม่#! ถูกเกลี้ยกล่อม"
 tgp_governor_contract_event.2001.tt_failure: "ท่านล้มเหลวในการเกลี้ยกล่อมหัวหน้าคนงานให้ทำมากกว่าที่สัญญไว้"
 
 tgp_governor_contract_event.2002.t: "$missing_equipment$: สำเร็จ"
 tgp_governor_contract_event.2002.desc: "คำขู่ที่โจ่งแจ้งของข้าได้รับรางวัลอย่างรวดเร็วเป็นการโค้งคำนับที่ลึกยิ่งกว่าเดิม หัวหน้าคนงานเหงื่อแตกอย่างเห็นได้ชัด ค่อยๆ ยืดตัวขึ้น\n\n"แน่นอน [ROOT.Char.GetLadyLord] ของข้า ความเห็นของท่านถูกต้องอย่างที่สุด ข้ามั่นใจว่าเราสามารถบรรลุข้อตกลงกันได้ บางทีท่านอาจมีข้อเสนอแนะอยู่แล้ว""
 tgp_governor_contract_event.2002.a: "มารับประกันการจัดส่งในอนาคตด้วยเลยแล้วกัน"
 tgp_governor_contract_event.2002.b: "จัดส่งการขนส่ง #EMP สอง#! ครั้งถัดไปของเจ้ามาให้ข้า"
 tgp_governor_contract_event.2002.c: "สมควรมีการชดเชยเป็นตัวเงิน"
 tgp_governor_contract_event.2002.d: "ส่งยุทโธปกรณ์ที่ดีที่สุดที่เจ้ามีมาให้ข้า"
 
 tgp_governor_contract_event.2003.t: "$missing_equipment$: ล้มเหลว"
 tgp_governor_contract_event.2003.desc: "หัวหน้าคนงานหยุดชะงักครู่หนึ่งและขมวดคิ้ว\n\n"#EMP ท่าน#! ไม่ใช่ผู้บังคับบัญชาเพียงคนเดียวที่ต้องการยุทโธปกรณ์ ข้าทำมากเกินพอแล้วโดยจัดส่งการขนส่งครั้งต่อไปของเราให้ท่าน ซึ่งเป็นการขนส่งที่มีกำหนดส่งไปที่อื่น โปรดทราบด้วย อย่าโลภมากนักเลย #EMP [ROOT.Char.GetLadyLord]#! ของข้า"\n\n[foreman.GetWomanMan] ผู้นั้นหันหลังและเดินจากไป"
 tgp_governor_contract_event.2003.a: "#EMP ก็ได้.#!"

