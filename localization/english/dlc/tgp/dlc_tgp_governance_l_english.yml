 monopoly_in_the_marketplace_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 monopoly_in_the_marketplace_desc: "พ่อค้าผู้ทรงอิทธิพลกำลังครอบงำตลาด และสมาคมพ่อค้าท้องถิ่นกำลังเรียกร้องให้รัฐเข้ามาแทรกแซง"
 monopoly_in_the_marketplace_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0032.t: "การผูกขาดในตลาด"
 tgp_governor_contract_event.0032.desc: ""...และหากปล่อยให้เรื่องนี้ดำเนินต่อไป ผลที่ตามมาจะเป็น #EMP หายนะ#! ต่อการดำรงชีวิตของเรา" หัวหน้าคณะผู้แทนสรุป\n\nตามข้อโต้แย้งที่พวกเขาร่างไว้ คู่แข่งคนหนึ่งของพวกเขาใน [monopoly_in_the_marketplace_destination.GetName] ได้เข้าควบคุมตลาดหลักอย่างลับๆ และกำลังปฏิเสธการเข้าถึงของสมาชิกสมาคมคนใดๆ โดยผลักไสพวกเขาไปยังสถานที่ที่ไม่เป็นที่นิยมและขาดทุนอย่างสิ้นเชิง"
 tgp_governor_contract_event.0032.a: "ข้าจะจัดการเรื่องนี้ด้วยตนเอง"
 tgp_governor_contract_event.0032.a_tt: "เดินทางไปยัง [monopoly_in_the_marketplace_destination.GetName] และจัดการเรื่องราวในตลาดให้เป็นที่พอใจของท่าน"
 tgp_governor_contract_event.0032.b: "ข้าไม่ได้ยินอะไรที่ผิดปกติไปกว่าพ่อค้าที่ประสบความสำเร็จ"

 tgp_governor_contract_event.0033.t: "การผูกขาดในตลาด"
 tgp_governor_contract_event.0033.desc: "แม้ว่าพวกเขาจะไม่ค่อยเป็นแบบอย่างของความซื่อสัตย์ แต่คำพูดของพ่อค้าดูเหมือนจะเป็นจริงในโอกาสนี้\n\nขณะที่เราเดินชมอย่างเงียบๆ จากแผงหนึ่งไปยังอีกแผงหนึ่ง ทั้งหมดที่เห็นมากลับมีเครื่องหมายเดียวกันประทับไว้อย่างเด่นชัด ซึ่งระบุว่าเป็นทรัพย์สินร่วมกันของเจ้าของเพียงผู้เดียว\n\nแผงสุดท้ายที่เราเข้าไปใกล้นั้นใหญ่ที่สุดและหรูหราที่สุด และ [merchant_magnate.GetWomanMan] ผู้งามสง่าที่ดูแลอยู่ก็ยิ้มอย่างภาคภูมิใจ นี่คือคู่แข่งที่พวกเขาพูดถึงอย่างชัดเจน"
 tgp_governor_contract_event.0033.a: "ห้ามมิให้พ่อค้าคนใดครอบครองแผงลอยเกินหนึ่งแผง" # (Special governor option)
 tgp_governor_contract_event.0033.b: "ขยายตลาดและประมูลแผงใหม่ให้เฉพาะสมาชิกสมาคมเท่านั้น"
 tgp_governor_contract_event.0033.c: "[merchant_magnate.GetSheHe|U] ยังอยู่ได้ หาก [merchant_magnate.GetSheHe] ยินดีที่จะ #EMP จ่าย#! เพื่อสิทธิพิเศษนี้"
 tgp_governor_contract_event.0033.d: "เราจะสนับสนุนคู่แข่งของ [merchant_magnate.GetHerHis] และปล่อยให้เป็นไปตามครรลองของมัน"
 tgp_governor_contract_event.0033.e: "ใครก็ตามที่มั่งคั่งขนาดนี้จะต้องมีความผิด #EMP บางอย่าง#! ยึดสินค้าของ [merchant_magnate.GetHerHis] ซะ!"

