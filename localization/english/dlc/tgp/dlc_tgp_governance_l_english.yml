 unsafe_highways_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 unsafe_highways_desc: "เหล่าพ่อค้ากำลังโวยวาย ป่าวประกาศว่าถนนหลวงไม่ปลอดภัยต่อการเดินทาง และข่มขู่ว่าจะหาตลาดใหม่หากปัญหานี้ไม่ได้รับการแก้ไข"
 unsafe_highways_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0008.t: "การค้าอันตราย"
 tgp_governor_contract_event.0008.desc: "คณะผู้แทนพ่อค้า นำโดย [fearful_merchant.GetName] มาออแน่นกันในโถงของข้า เสียงของพวกเขาดังลั่นด้วยความตระหนก เรียกร้องการคุ้มครองขบวนสินค้าของพวกเขาหลังจากที่เพิ่งสูญเสียไปอีกขบวนจากการโจมตีของโจร "สถานการณ์นี้ไม่อาจยอมรับได้ [ROOT.Char.Custom('FormOfAddressForLiege')]" ผู้นำของพวกเขาประกาศ\n\n"หากไม่มีการดำเนินการอย่างรวดเร็วเพื่อปกป้องสินค้าและชีวิตของเราจากคนเถื่อนเหล่านี้ เราก็ไม่มีทางเลือกอื่นนอกจากละทิ้งผลประโยชน์ของเราใน [unsafe_highways_destination.GetName] และย้ายการค้าของเรา รวมถึงค่าผ่านทางที่เราจ่าย ไปยังที่อื่น" [fearful_merchant.GetSheHe|U] ยืนรอคอยอย่างคาดหวัง คำขาดถูกยื่นมาอย่างอาจหาญ"
 tgp_governor_contract_event.0008.a: "เราจะจัดหาผู้คุ้มกันให้ แต่พวกเจ้าต้องจ่ายค่าสิทธิพิเศษนี้" # (Special governor option)
 tgp_governor_contract_event.0008.b: "ข้าเข้าใจ เราจะส่งหน่วยลาดตระเวนไปคุ้มกันถนน"
 tgp_governor_contract_event.0008.c: "การค้าของพวกเจ้ามันอันตราย: พวกเจ้าไม่มีคนคุ้มกันรึ"
 tgp_governor_contract_event.0008.d: "มันคงจะ #EMP โชคร้าย#! หากภาษีของพวกเจ้าต้องถูกตรวจสอบ..."
 tgp_governor_contract_event.0008.e: "มีภัยย่อมมีรางวัล - อยู่ต่อเถอะ แล้วข้าจะ ทำให้มันคุ้มค่า"

