 contested_inheritance_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 contested_inheritance_desc: "ผู้มีชื่อเสียงในท้องถิ่นคนหนึ่งได้เสียชีวิตลง และทายาท ซึ่งขัดแย้งกันอย่างรุนแรงเรื่องมรดก ได้ร้องขอให้ทางการช่วยไกล่เกลี่ย"
 contested_inheritance_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0034.t: "มรดกที่เป็นข้อพิพาท"
 tgp_governor_contract_event.0034.desc: "การเป็น [ROOT.Char.GetTitleTierName] นั้นเป็นมากกว่าเพียงผู้บริหาร และหลายคนมองว่าข้าเป็นบุคคลผู้เที่ยงธรรมในเรื่องที่ขัดแย้ง\n\nด้วยบทบาทนี้เองที่ตระกูลผู้มีชื่อเสียงใน [contested_inheritance_destination.GetName] ได้ร้องขอให้ข้าไปไกล่เกลี่ยข้อพิพาทเรื่องมรดกที่รุนแรงเป็นพิเศษ ซึ่ง ทำให้ครอบครัวแตกแยกอย่างขมขื่น"
 tgp_governor_contract_event.0034.a: "ความแตกแยกในตระกูลที่โดดเด่น เช่นนี้ สะท้อนภาพลักษณ์ที่ไม่ดีต่อสังคมของเรา"
 tgp_governor_contract_event.0034.a_tt: "เดินทางไปยัง [contested_inheritance_destination.GetName] และยุติข้อพิพาท"
 tgp_governor_contract_event.0034.b: "นี่เป็นเรื่องในครอบครัว ไม่ใช่ธุระของรัฐ"

 tgp_governor_contract_event.0035.t: "มรดกที่เป็นข้อพิพาท"
 tgp_governor_contract_event.0035.desc: "ความตึงเครียดในอากาศนั้นสัมผัสได้ชัดเจนขณะที่เราทบทวนข้อเรียกร้องที่แข่งขันกันอีกครั้ง การถกเถียง แต่ละรอบมี แต่จะ ทำให้ปัญหายุ่งยากซับซ้อนยิ่งขึ้น\n\nแม้ว่าพวกเขาจะพยายามอย่างเห็นได้ชัดที่จะเสแสร้งรักษามารยาทต่อหน้าข้า ข้าก็สงสัยว่าหากข้าสามารถบรรจุขวดคำพูดเหน็บแนมอันเจ็บแสบที่แอบแฝงของเหล่าทายาทผู้ทะเยอทะยานได้ มันคงจะเทียบได้กับยาพิษใดๆ ในด้านความรุนแรง"
 tgp_governor_contract_event.0035.a: "ที่ดินมรดกนี้จะเป็นความรับผิดชอบของครอบครัว #EMP ทั้งหมด#!" # (Special governor option)
 tgp_governor_contract_event.0035.b: "ให้สมาชิกที่อาวุโสที่สุดที่ยังมีชีวิตอยู่ของตระกูลเป็นผู้ดูแล"
 tgp_governor_contract_event.0035.c: "ด้วยเงินจำนวนเล็กน้อย ข้าอาจยอมให้ตัวเองถูก #EMP เกลี้ยกล่อม#! ได้..."
 tgp_governor_contract_event.0035.d: "เราต้องเคารพความประสงค์ของผู้ตาย"
 tgp_governor_contract_event.0035.e: "ข้าควรเกลี้ยกล่อมให้พวกเขาตกลงเรื่องนี้อย่างมีศักดิ์ศรีมากกว่านี้"

