 seditious_storytelling_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 seditious_storytelling_desc: "นักเล่านิทานชื่อดังคนหนึ่งได้เริ่มเล่าเรื่องราวที่เจือปนไปด้วยความกระด้างกระเดื่องและความไม่พอใจ"
 seditious_storytelling_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0028.t: "การเล่านิทานปลุกระดม"
 tgp_governor_contract_event.0028.desc: "ผู้ยื่นคำร้องคนสุดท้ายของวันจากไปต่อหน้าข้าด้วยความขอบคุณ แต่เสียงฝีเท้าที่ค่อยๆ ห่างออกไปของพวกเขาก็ถูกแทนที่อย่างรวดเร็วด้วยเสียงฝีเท้าเร่งรีบที่นำข่าวร้ายมา\n\n[concerned_councillor.GetFirstName] นั่นเอง สีหน้าของ [concerned_councillor.GetHerHis] เคร่งขรึม "ข้าเพิ่งได้รับรายงานที่ #EMP น่าโมโหที่สุด#! [ROOT.Char.Custom('FormOfAddressForLiege')]! หนึ่งในนักเล่านิทานพเนจรเหล่านั้นกำลังปลุกปั่นผู้คนใน [seditious_storytelling_destination.GetName] ด้วยเรื่องราวของข้าราชการฉ้อฉลและการประพฤติมิชอบของทางการ!""
 tgp_governor_contract_event.0028.a: "ให้ข้าตัดสินถ้อยคำเหล่านี้ด้วยหูของข้าเอง"
 tgp_governor_contract_event.0028.a_tt: "เดินทางไปยัง [seditious_storytelling_destination.GetName] และฟังนิทานของนักเล่าเรื่อง"
 tgp_governor_contract_event.0028.b: "ตอนนี้ข้าต้องมาใส่ใจกับแค่ #EMP นักแสดง#! พวกนี้ด้วยรึ"

 tgp_governor_contract_event.0029.t: "การเล่านิทานปลุกระดม"
 tgp_governor_contract_event.0029.desc: "เมื่อนั่งอยู่หลังกลุ่มผู้ฟังโดยไม่มีใครสังเกต ข้าต้องยอมรับว่ารายงานนั้น อย่างดีที่สุดก็คือพูดน้อยเกินไป\n\nมีเพียงคนโง่ที่เซ่อที่สุดเท่านั้นที่จะไม่เข้าใจความหมายของนิทานที่จงใจเหน็บแนมอย่างชัดเจน เกี่ยวกับวีรบุรุษพเนจรผู้ถูกกดขี่ที่ต่อสู้กับข้าราชการผู้ชั่วร้ายและฉ้อฉลอย่างโจ่งแจ้ง และทหารที่เหมือนโจร ตัวร้ายหลักในเรื่องฟังดูคุ้นหูอย่าง #EMP น่าสงสัย#! เสียจริง\n\nทว่า สิ่งที่น่ากังวลยิ่งกว่าคำพูดของนักเล่าเรื่อง คือความกระตือรือร้นที่เพิ่มขึ้นอย่างเห็นได้ชัดของฝูงชนต่อคำพูดเหล่านั้น"
 tgp_governor_contract_event.0029.a: "ออกประกาศสาธารณะเพื่อตรวจสอบ [seditious_storyteller.GetHerHim] โทษฐานก่อกวนความสงบเรียบร้อยของประชาชน" # (Special governor option)
 tgp_governor_contract_event.0029.b: "จับกุมคนโง่อวดดีนั่นทันที!"
 tgp_governor_contract_event.0029.c: "เราจะจ้างนักเล่าเรื่องของเราเองเพื่อถักทอเรื่องเล่าของเรา"
 tgp_governor_contract_event.0029.d: "ส่งยามไปประจำทุกงานของ [seditious_storyteller.GetHerHis] เพื่อเตือนผู้ฟังให้รู้สำนึกตน"
 tgp_governor_contract_event.0029.e: "นัดพบเป็นการส่วนตัว บางทีข้าอาจจะพูดคุยด้วยเหตุผลกับ [seditious_storyteller.GetHerHim] ได้"

