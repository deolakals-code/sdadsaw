 burdensome_taxes: "ภาษีอันหนักหนา"
 burdensome_taxes_contract: "$burdensome_taxes$"
 burdensome_taxes_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 burdensome_taxes_desc: "ผู้ยื่นคำร้องคนหนึ่งมาจากหมู่บ้านห่างไกล เพื่อร้องขอการบรรเทาภาระภาษีที่ผู้คนไม่สามารถจ่ายไหว"
 burdensome_taxes_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0007.t: "ภาษีอันหนักหนา"
 tgp_governor_contract_event.0007.desc: "หลังจากวันที่ยาวนานและเหน็ดเหนื่อยกับการรับฟังคำร้องทุกข์และข้อข้องใจ ซึ่งบ่อยครั้งก็มาจากปากคนเดียวกัน ผู้ยื่นคำร้องคนสุดท้ายก็ก้าวออกมา เป็น [village_elder.GetWomanMan] ชราที่ แต่งกายเรียบง่ายและสมถะ ท่าทางของ [village_elder.GetHerHis] อ่อนน้อม แต่ไม่ค้อมต่ำ เสมียนส่งบันทึกให้ข้า ระบุว่า [village_elder.GetWomanMan] ผู้นี้คือหัวหน้า [village_elder.GetWomanMan] ของหมู่บ้าน [village_elder.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [village_elder.GetSheHe] เริ่มต้น "หมู่บ้านของเรายากจน และเรารู้จักความมั่งคั่งและความรุ่งเรืองเพียงน้อยนิด การเก็บเกี่ยวได้ผลไม่ดี ภาษีที่เราถูกเรียกเก็บนั้นเกินกำลังอันน้อยนิดของเรา ข้าขอวิงวอนท่าน ท่านต้องลดภาระของเรา มิฉะนั้นเราอาจอดตาย""
 tgp_governor_contract_event.0007.a: "ย้ายภาระส่วนใหญ่ไปยังพื้นที่ที่มั่งคั่งกว่า" # (Special governor option)
 tgp_governor_contract_event.0007.b: "ประเมินพวกเขาใหม่ในอัตราที่ลดลง: ข้าจะรับผิดชอบทั้งหมดเอง"
 tgp_governor_contract_event.0007.c: "ข้าจะจ่ายส่วนต่างให้เอง แต่ปีหน้าก็แล้ว แต่พวกเจ้า"
 tgp_governor_contract_event.0007.d: "พวกเจ้าไม่จำเป็นต้องจ่าย แต่หนี้สินจะยังคงอยู่จนกว่าพวกเจ้าจะชำระจนครบ"
 tgp_governor_contract_event.0007.e: "ผู้ใดที่จ่ายไม่ได้จะถูกจองจำและยึดทรัพย์สิน"

