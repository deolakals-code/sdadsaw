 confusion_of_tongues_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 confusion_of_tongues_desc: "เรือสินค้าต่างชาติลำหนึ่งอับปางบนชายฝั่งของเรา และไม่มีผู้รอดชีวิตคนใดพูดภาษาของเราได้"
 confusion_of_tongues_desc_title: "$task_contract_governance_desc_title$"

 tgp_governor_contract_event.0026.t: "ภาษาที่สับสน"
 tgp_governor_contract_event.0026.desc: "พ่อค้าจากแดนไกลถูกดึงดูดโดยความเจริญรุ่งเรืองของ [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] อันยิ่งใหญ่ของเราอย่างไม่ต้องสงสัย พวกเขาเดินทางไกลและฝ่าฟันภยันตรายนับไม่ถ้วนเพื่อแสวงหาความมั่งคั่งทางวัตถุ\n\nทว่า ภยันตรายนั้นพิสูจน์แล้วว่าหนักหนาเกินไปสำหรับผู้โชคร้ายบางคน ดัง เช่นที่เพิ่งเกิดขึ้นใน [confusion_of_tongues_destination.GetName] ข้าได้รับแจ้งว่าเรือต่างชาติลำหนึ่งแตกหักอยู่บนชายฝั่งของเรา และล่ามของลูกเรือไม่ได้เป็นหนึ่งในผู้รอดชีวิต\n\nสำนักปกครองท้องถิ่นถึงกับจนปัญญาว่าจะจัดการกับชาวต่างชาติที่เปียกปอนและสับสนงุนงงเหล่านี้อย่างไร"
 tgp_governor_contract_event.0026.a: "งานของ[ROOT.Char.GetTitleTierNamePossessive]ไม่มีวันจบสิ้น"
 tgp_governor_contract_event.0026.a_tt: "เดินทางไปยัง [confusion_of_tongues_destination.GetName] และพบกับพ่อค้าต่างชาติ"
 tgp_governor_contract_event.0026.b: "นี่ฟังดูน่าปวดหัว: ก็แค่ทิ้งพวกเขาไว้ตรงนั้น"

 tgp_governor_contract_event.0027.t: "ภาษาที่สับสน"
 tgp_governor_contract_event.0027.desc: "เห็นได้ชัดว่าท่านผู้พิพากษาจนปัญญาแล้วเมื่อข้ามาถึง ทั้งเหนื่อยล้าและหัวเสียในระดับเท่าๆ กัน "ไม่มีใครสักคนที่เข้าใจคำพูดข้าเลย!" เขาคร่ำครวญ "และทุกครั้งที่เราพยายามจะย้ายพวกเขา พวกเขาก็มีปฏิกิริยาราวกับว่าเราเป็นโจร!"\n\nในบริเวณใกล้เคียง ข้าเห็นเหล่าพ่อค้าเรือแตกจับกลุ่มกันอย่างป้องกันตัวรอบๆ สินค้าที่ยังหลงเหลืออยู่ โดยที่ยามของพวกเขากุมด้ามอาวุธไว้แน่นอย่างประหม่า"
 tgp_governor_contract_event.0027.a: "กางเต็นท์ชั่วคราวและแจ้งเมืองหลวง: พวกเขาจะหาล่ามมาให้" # (Special governor option)
 tgp_governor_contract_event.0027.b: "กลับไปดูที่ตลาดว่ามีใครพอจะเข้าใจภาษาของพวกเขาบ้าง"
 tgp_governor_contract_event.0027.c: "เรือของพวกเขาอับปางบนชายฝั่ง #EMP ของเรา#! นั่นหมายความว่าสินค้าของพวกเขาต้องถูกริบ"
 tgp_governor_contract_event.0027.d: "คำพูดอาจใช้ไม่ได้ผล แต่ข้าสามารถลองสื่อสารด้วยท่าทางได้"
 tgp_governor_contract_event.0027.e: "แค่พาพวกเขาออกไปจากที่นี่ และใช้กำลังหากจำเป็น"
 tgp_governor_contract_event.0027.f: "$epidemic_events.5902.a$"

