 lines_in_the_soil_request: "สถานการณ์นี้เปิดให้ท่านเลือกผลลัพธ์"
 lines_in_the_soil_desc: "เจ้าของที่ดินผู้มีชื่อเสียงคู่หนึ่งกำลังกระหน่ำร้องเรียนไปยังสำนักปกครองอย่างไม่หยุดหย่อน เกี่ยวกับข้อพิพาทเรื่องทรัพย์สิน"
