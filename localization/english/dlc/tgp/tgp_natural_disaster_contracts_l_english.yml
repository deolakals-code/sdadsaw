l_english: 
 tgp_admin_contract_natural_disaster_tt_rewards: "ท่านสามารถเลือกรับรางวัลต่างๆ ได้ ซึ่ง รวมถึง:#indent_newline:3 \n$EFFECT_LIST_BULLET$$admin_contract_success_tt_xp$\n$EFFECT_LIST_BULLET$[experience|E] in [lifestyles|E]\n$EFFECT_LIST_BULLET$[influence_i|E][influence|E]\n$EFFECT_LIST_BULLET$[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$[county_opinion|E]\n$EFFECT_LIST_BULLET$Improvements to your [counties|E]#!"
 tgp_admin_contract_natural_disaster_failure_tt: "ท่านอาจได้รับบทลงโทษ เช่น การสูญเสีย [prestige_i|E][prestige|E] หรือ [influence_i|E][influence|E]"
 tgp_natural_disaster_travel_to_contract_destination: "เดินทางไปยัง [natural_disaster_contract_destination.GetName] และสืบสวนปัญหา"
 
 #Food
 #CONTRACT
 tgp_food_shortage: "ภาวะขาดแคลนอาหาร"
 tgp_food_shortage_contract: "$tgp_food_shortage$"
 tgp_food_shortage_desc_title: "$task_contract_governance_desc_title$"
 tgp_food_shortage_request: "$admin_request_choose_opportunity$"
 tgp_food_shortage_desc: "ภัยพิบัติได้โจมตีเคาน์ตีนี้ ทำให้ประชากรขาดแคลนอาหาร"
 #FIRST EVENT OPT IN OR OUT
 tgp_natural_disaster_contract_event.0001.t: "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0001.desc: "อาหารใน [natural_disaster_contract_destination.GetName] ได้ขาดแคลนลง ทำให้เหล่าพลเมืองไม่มีทางเลือกอื่นนอกจากต้องดิ้นรนค้นหาแหล่งอาหารทางเลือกอื่น – และบางครั้งก็ #EMP ผิดแปลก#! ไปจากปกติ บรรดาผู้มี อันจะกินกำลังทำทุกวิถีทางเพื่อช่วยเหลือ แต่ได้มีการร้องขอให้เราเข้าแทรกแซง"
 tgp_natural_disaster_contract_event.0001.a: "ผู้คนร่ำไห้ด้วยความหิวโหย และพวกเขาจะต้องไม่ไร้ ซึ่งการตอบสนอง"
 tgp_natural_disaster_contract_event.0001.b: "เสบียงสำรองของเรานั้นมีค่า และเราไม่มีเหลือพอที่จะแบ่งปัน"
 #EVENT
 tgp_natural_disaster_contract_event.0002.t: "$tgp_food_shortage$"
 tgp_natural_disaster_contract_event.0002.desc: "เสียงร้องอันน่าเวทนาของผู้หิวโหยดังก้องไปทั่วท้องถนน ขณะที่ขบวนของข้าถูกรุมล้อมโดยกลุ่มคนผอมโซทันทีที่เรามาถึง ดวงตาที่กลวงโบ๋ของขอทานเหล่านี้ว่างเปล่าไร้ ซึ่งความหวัง เฉก เช่นเดียวกับท้องของพวกเขาที่ไร้อาหาร ธัญพืชที่เรานำมาด้วยนั้นเพียงพอสำหรับบางคน แต่ไม่ใช่ทุกคน – และความอดอยากก็แปรเปลี่ยนเป็นความสิ้นหวังอันตรายอย่างรวดเร็ว"
 tgp_natural_disaster_contract_event.0002.a: "จงเข้าถึงไพร่ฟ้าข้าแผ่นดินทุกคน!"
 tgp_natural_disaster_contract_event.0002.b: "จัดหาสิ่งที่พวกเขาต้องการ ไม่ว่าจะต้องแลกด้วยอะไร: ข้าจะจ่ายเอง"
 tgp_natural_disaster_contract_event.0002.c: "ข้าจะเกลี้ยกล่อมเหล่าพ่อค้าให้เปิดยุ้งฉางของพวกเขา"
 tgp_natural_disaster_contract_event.0002.c.tt.success: "เหล่าพ่อค้าตกลงที่จะช่วยบรรเทาทุกข์"
 tgp_natural_disaster_contract_event.0002.c.tt.failure: "เหล่าพ่อค้าเลือกผลกำไรอย่างเลือดเย็นแทนที่จะเลือกความเมตตา"
 tgp_natural_disaster_contract_event.0002.d: "บีบให้เหล่าอภิสิทธิ์ชนร่วมบริจาคเพื่อการบรรเทาทุกข์"
 #MODIFIERS
 tgp_distribution_of_food_character_modifier: "การป้อนอาหารแก่ผู้ขัดสน"
 tgp_distribution_of_food_character_modifier_desc: "ตัวละครนี้ได้โน้มน้าวให้คนของตนแจกจ่ายอาหารแก่ผู้ยากไร้ในพื้นที่"
 tgp_distribution_of_food_modifier: "การแจกจ่ายอาหาร"
 tgp_distribution_of_food_modifier_desc: "เคาน์ตีนี้ได้รับเสบียงเพิ่มเติมในรูปแบบของอาหาร"
 tgp_pay_from_own_pocket_character_modifier: "จ่ายจากกระเป๋าของตนเอง"
 tgp_pay_from_own_pocket_character_modifier_desc: "ตัวละครนี้ใช้เงินของตนเองอย่างเสียสละเพื่อเลี้ยงดูผู้หิวโหย"
 tgp_pay_from_own_pocket_modifier: "เงินส่วนตัว"
 tgp_pay_from_own_pocket_modifier_desc: "เคาน์ตีนี้ได้รับความช่วยเหลือโดยตรงจากกระเป๋าเงินของผู้ว่าการ"
 tgp_haggle_with_merchants_modifier: "พ่อค้าผู้ใจบุญ"
 tgp_haggle_with_merchants_modifier_desc: "เคาน์ตีนี้ได้รับความช่วยเหลือเพิ่มเติมจากพ่อค้าเร่"
 tgp_demand_food_from_nobles_modifier: "เรียกร้องอาหารจากขุนนาง"
 tgp_demand_food_from_nobles_modifier_desc: "เสบียงธัญพืชของเคาน์ตีนี้ได้รับการเสริมกำลังโดยการบังคับความช่วยเหลือจากบุคคลสำคัญในท้องถิ่น"
 #CONTRACT REWARD
 task_contract_reward_effect_distribution_of_food_desc: "$label_success_standard$"
 task_contract_reward_effect_pay_from_own_pocket_desc: "$label_success_standard$"
 task_contract_reward_effect_haggle_with_merchants_desc: "$label_success_standard$"
 task_contract_reward_effect_demand_food_from_nobles_desc: "$label_success_standard$"
 task_contract_reward_effect_haggle_with_merchants_failure_desc: "$label_failure_standard$"

 #Reconstruction
 #CONTRACT
 tgp_ravaged_buildings: "ถูกทำลายโดยธรรมชาติ"
 tgp_ravaged_buildings_contract: "$tgp_ravaged_buildings$"
 tgp_ravaged_buildings_desc_title: "$task_contract_governance_desc_title$"
 tgp_ravaged_buildings_request: "$admin_request_choose_opportunity$"
 tgp_ravaged_buildings_desc: "แผ่นดินนี้ประสบกับหายนะ โครงสร้างพื้นฐานพังทลายและต้องการการซ่อมแซมอย่างเร่งด่วน"
 #FIRST EVENT OPT IN OR OUT
 tgp_natural_disaster_contract_event.0005.t: "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0005.desc: "หลังเหตุการณ์ภัยพิบัติครั้งล่าสุด พลเมืองของ [natural_disaster_contract_destination.GetName] กำลังหลั่งไหลมายื่นคำร้องและคำขอความช่วยเหลือในการสร้างบ้านของพวกเขาใหม่ที่สำนักงานของข้า"
 tgp_natural_disaster_contract_event.0005.a: "ข้าจะควบคุมดูแลความพยายามในการบรรเทาทุกข์ด้วยตนเอง"
 tgp_natural_disaster_contract_event.0005.b: "ชะตากรรมของพวกเขาน่าเศร้า แต่ความโชคร้ายของพวกเขาก็เป็นเพียงส่วนน้อยในบรรดาเรื่องร้ายอีกมากมาย"
 #EVENT
 tgp_natural_disaster_contract_event.0006.t: "$tgp_ravaged_buildings$"
 tgp_natural_disaster_contract_event.0006.desc: "ซากปรักหักพังที่เกลื่อนกลาดอยู่ตรงหน้าข้าเป็นเครื่องพิสูจน์ถึงความรุนแรงของภัยพิบัติที่โจมตี [natural_disaster_contract_destination.GetName]\n\nผู้ไร้ที่อยู่อาศัย ผู้บาดเจ็บ และผู้สิ้นหวังต่างมองมาที่ข้าเพื่อหาที่พักพิง ในขณะที่เสียงร้องแผ่วเบาของผู้ติดอยู่ดังออกมาจากซากปรักหักพัง และด้วยเมฆพายุที่ก่อตัวขึ้นที่ขอบฟ้า ความต้องการของพวกเขาก็ยิ่งเร่งด่วนมากขึ้น"
 tgp_natural_disaster_contract_event.0006.a: "พาผู้คนไปที่ปลอดภัยให้ได้มากที่สุด เราจะอยู่ที่นี่เพื่อช่วยคนที่เหลือออกมา"
 tgp_natural_disaster_contract_event.0006.b: "ผู้ที่ถูกฝังอยู่ไม่สามารถรอดได้ เราต้องให้ที่พักพิงแก่ผู้รอดชีวิต"
 tgp_natural_disaster_contract_event.0006.c: "ลำดับความสำคัญแรกของเราคือการช่วยเหลือผู้ที่ติดอยู่ใต้ซากปรักหักพัง"
 tgp_natural_disaster_contract_event.0006.c.tt.desc.success: "เหยื่อที่ติดอยู่ได้รับการช่วยเหลือสำเร็จ"
 tgp_natural_disaster_contract_event.0006.c.tt.success: "เหยื่อที่ติดอยู่ได้รับการช่วยเหลือสำเร็จ"
 tgp_natural_disaster_contract_event.0006.c.tt.desc.failure: "ซากปรักหักพังถล่มลงมาก่อนที่ท่านจะสามารถช่วยเหลือผู้ที่ติดอยู่ข้างใต้ได้"
 tgp_natural_disaster_contract_event.0006.c.tt.failure: "ซากปรักหักพังถล่มลงมาในพายุ ทับผู้ที่ติดอยู่ข้างใต้"
 tgp_natural_disaster_contract_event.0006.d: "ที่อยู่อาศัยเพื่อแลกกับแรงงานของพวกเขาดูเหมือนจะเป็นข้อตกลงที่ยุติธรรม"
 #MODIFIERS
 tgp_rebuild_settlement_character_modifier: "ผู้เชี่ยวชาญการฟื้นฟู"
 tgp_rebuild_settlement_character_modifier_desc: "ตัวละครนี้คุ้นเคยกับการรับมือกับผลพวงของภัยพิบัติและมีความเชี่ยวชาญในความซับซ้อนของการฟื้นฟู"
 tgp_rebuild_settlement_modifier: "การฟื้นฟูถิ่นฐาน"
 tgp_rebuild_settlement_modifier_desc: "ได้มีการดำเนินมาตรการอย่างกว้างขวางเพื่อสร้างสิ่งที่เคาน์ตีนี้สูญเสียไปในภัยพิบัติครั้งล่าสุดขึ้นมาใหม่"
 tgp_temporary_shelters_modifier: "ที่พักพิงจากพายุ"
 tgp_temporary_shelters_modifier_desc: "แม้ว่าจะไร้ที่อยู่อาศัยจากภัยพิบัติครั้งล่าสุด ผู้คนที่นี่ก็ได้รับที่พักชั่วคราว"
 tgp_remove_debris_modifier: "ออกจากซากปรักหักพัง"
 tgp_remove_debris_modifier_desc: "ในกระบวนการช่วยเหลือผู้ที่ติดอยู่ในซากปรักหักพังของบ้านเรือน พื้นที่ดังกล่าวยังได้รับการเก็บกวาดเพื่อการฟื้นฟูอย่างสะดวกสบายอีกด้วย"
 tgp_labor_exchange_character_modifier: "แรงงานที่ไม่เต็มใจ"
 tgp_labor_exchange_character_modifier_desc: "เพื่อแลกกับที่พักพิงจากพายุ ตัวละครนี้ได้ต่อรองเพื่อกำลังคนเพิ่มเติมภายในอาณาเขตของตน"
 #CONTRACT REWARD
 task_contract_reward_effect_rebuild_settlement_desc: "$label_success_standard$"
 task_contract_reward_effect_temporary_shelters_desc: "$label_success_standard$"
 task_contract_reward_effect_remove_debris_desc: "$label_success_standard$"
 task_contract_reward_effect_labor_exchange_desc: "$label_success_standard$"
 task_contract_reward_effect_remove_debris_failure_desc: "$label_failure_standard$"

 #Health Care
 #CONTRACT
 tgp_medieval_medicine: "การรักษาผู้โชคร้าย"
 tgp_medieval_medicine_contract: "$tgp_medieval_medicine$"
 tgp_medieval_medicine_desc_title: "$task_contract_governance_desc_title$"
 tgp_medieval_medicine_request: "$admin_request_choose_opportunity$"
 tgp_medieval_medicine_desc: "ภัยพิบัติได้โจมตีเคาน์ตีนี้! ยอดผู้เสียชีวิตมีจำนวนมาก ซึ่งน้อยกว่าเพียงแค่จำนวนผู้พลัดถิ่นและผู้บาดเจ็บที่ต้องการความช่วยเหลือ"
 #FIRST EVENT OPT IN OR OUT
 tgp_natural_disaster_contract_event.0010.t: "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0010.desc: "นักขี่ม้าได้มาถึงพร้อมข่าวร้ายเกี่ยวกับหายนะที่เกิดขึ้นใน [natural_disaster_contract_destination.GetName] — ผู้เสียชีวิตมีมากเกินกว่าจะนับได้ และผู้รอดชีวิตต่างบาดเจ็บและต้องการการดูแลอย่างสิ้นหวัง"
 tgp_natural_disaster_contract_event.0010.a: "ส่งนักขี่ม้าคนใหม่ไปแจ้งข่าวว่าข้ากำลังเดินทางไป"
 tgp_natural_disaster_contract_event.0010.b: "ผู้ตายของพวกเขาอยู่นอกเหนือการช่วยเหลือแล้ว หน้าที่ของข้าอยู่กับผู้ที่ยังคงตกอยู่ในอันตราย"
 #EVENT
 tgp_natural_disaster_contract_event.0011.t: "$tgp_medieval_medicine$"
 tgp_natural_disaster_contract_event.0011.desc: "ข้อความของนักขี่ม้าแทบไม่ได้อธิบายสถานการณ์ตามความเป็นจริง ผู้ตายมีจำนวนมากกว่าผู้รอดชีวิตอย่างมาก กลิ่นเหม็นเน่าของความตายและการเน่าเปื่อยไม่อาจหลีกหนีได้\n\nตัวผู้รอดชีวิตเองก็ดูเหมือนจะอยู่ในสภาพที่ดีกว่าญาติพี่น้องผู้ล่วงลับ และแทบไม่มีผู้ใดในหมู่พวกเขาที่รอดพ้นจากภัยพิบัติโดยไม่ได้รับบาดเจ็บ\n\nเมื่อต้องเผชิญกับความเศร้าโศกและความทุกข์ทรมานมากมาย ข้าแทบไม่รู้เลยว่าจะเริ่มสั่งการความพยายามของเราจากจุดใด"
 tgp_natural_disaster_contract_event.0011.a: "ให้แพทย์ของเรารักษาผู้บาดเจ็บก่อน"
 tgp_natural_disaster_contract_event.0011.b: "พาเด็กและคนชรามาหาข้า ข้าจะดูแลพวกเขาด้วยตนเอง"
 #rephrase this
 tgp_natural_disaster_contract_event.0011.b.tt.success: "ช่วยเหลือผู้ขัดสนได้สำเร็จ"
 #rephrase this
 tgp_natural_disaster_contract_event.0011.b.tt.failure: "ความพยายามช่วยเหลือผู้ขัดสนล้มเหลว"
 tgp_natural_disaster_contract_event.0011.c: "ให้เกียรติผู้ตายและดูแลให้พวกเขาได้รับการฝังอย่างเหมาะสม"
 tgp_natural_disaster_contract_event.0011.d: "การดูแลจะตกเป็นของผู้ที่สามารถจ่ายได้"
 #MODIFIERS
 tgp_assisting_physician_modifier: "การสนับสนุนทางการแพทย์"
 tgp_assisting_physician_modifier_desc: "กลุ่มแพทย์จำนวนมากได้เดินทางมายังเคาน์ตีนี้เพื่อบรรเทาความทุกข์ทรมานของผู้บาดเจ็บ"
 tgp_medical_assistance_character_modifier: "พับแขนเสื้อลุย"
 tgp_medical_assistance_character_modifier_desc: "ตัวละครนี้ได้ลงมือดูแลผู้พิการและผู้บาดเจ็บสาหัสด้วยตนเอง"
 tgp_medical_assistance_modifier: "การรักษาที่ผิดพลาด"
 tgp_medical_assistance_modifier_desc: "เจตนาดีไม่จำเป็นต้องนำไปสู่ผลลัพธ์ที่ดีเสมอไป ชาวเมืองของเคาน์ตีนี้มีประสบการณ์ตรงกับความตั้งใจดี แต่ไร้ฝีมือของผู้ว่าการของพวกเขา"
 tgp_prayers_to_the_people_character_modifier: "ผู้เคารพผู้ล่วงลับ"
 tgp_prayers_to_the_people_character_modifier_desc: "ตัวละครนี้ได้แสดงความเคารพที่พวกเขามีต่อผู้ล่วงลับอย่างชัดเจน"
 #CONTRACT REWARD
 task_contract_reward_effect_assisting_physician_desc: "$label_success_standard$"
 task_contract_reward_effect_medical_assistance_desc: "$label_success_standard$"
 task_contract_reward_effect_prayers_to_the_people_desc: "$label_success_standard$"
 task_contract_reward_effect_better_pay_up_desc: "$label_success_standard$"
 task_contract_reward_effect_medical_assistance_failure_desc: "$label_failure_standard$"

 #Relocation
 #CONTRACT
 tgp_disaster_displacement: "ผู้เก็บเกี่ยวซากปรักหักพัง"
 tgp_disaster_displacement_contract: "$tgp_disaster_displacement$"
 tgp_disaster_displacement_desc_title: "$task_contract_governance_desc_title$"
 tgp_disaster_displacement_request: "$admin_request_choose_opportunity$"
 tgp_disaster_displacement_desc: "โจรปล้นสะดมและคนเก็บขยะได้บุกรุกเคาน์ตีนี้ หลังเหตุการณ์ความพินาศครั้งล่าสุด"
 #FIRST EVENT OPT IN OR OUT
 tgp_natural_disaster_contract_event.0015.t: "$tgp_disaster_displacement$"
 tgp_natural_disaster_contract_event.0015.desc: "ส่วนที่เลวร้ายที่สุดของภัยพิบัติครั้งล่าสุดใน [natural_disaster_contract_destination.GetName] อาจผ่านพ้นไปแล้ว แต่ผู้ที่มีความโลภในหัวใจได้ฉวยโอกาสนี้ในการสร้างความร่ำรวยให้กับตนเองบนความทุกข์ยากของผู้พลัดถิ่น"
 tgp_natural_disaster_contract_event.0015.a: "ดูเหมือนว่าจำเป็นต้องใช้มือที่เด็ดขาดเพื่อฟื้นฟูความสงบเรียบร้อย"
 tgp_natural_disaster_contract_event.0015.b: "ความชั่วร้ายที่มนุษย์กระทำนั้นเกินกว่าจะเยียวยา"
 #EVENT
 tgp_natural_disaster_contract_event.0016.t: "$tgp_disaster_displacement$"
 tgp_natural_disaster_contract_event.0016.desc: "สันดานดิบของมนุษย์ถูกแสดงออกมาอย่างเต็มที่ใน [natural_disaster_contract_destination.GetName] ผู้คนที่นี่ดูเหมือนจะสนใจในการปลดเปลื้องเพื่อนบ้านจากของมีค่ามากกว่าการยื่นมือเข้าช่วยเหลือ\n\nต้องมีการฟื้นฟูความสงบเรียบร้อยในระดับหนึ่งที่นี่ก่อนที่จะพยายามฟื้นฟูใดๆ"
 tgp_natural_disaster_contract_event.0016.a: "ส่งกองกำลังของเราไปจับกุมพวกโจรปล้นสะดม"
 tgp_natural_disaster_contract_event.0016.a.tt.desc.success: "กองกำลังของท่านสามารถจับกุมพวกโจรปล้นสะดมได้"
 tgp_natural_disaster_contract_event.0016.a.tt.success: "กองกำลังของท่านจับกุมพวกโจรปล้นสะดมได้สำเร็จ"
 tgp_natural_disaster_contract_event.0016.a.tt.desc.failure: "พวกโจรปล้นสะดมที่ว่องไวดุจปลาไหลหนีรอดความพยายามจับกุมของท่านไปได้"
 tgp_natural_disaster_contract_event.0016.a.tt.failure: "กองกำลังของท่านไม่สามารถจับกุมพวกโจรปล้นสะดมได้"
 tgp_natural_disaster_contract_event.0016.b: "ประหารพวกโจรปล้นสะดมเสียบ้าง เพื่อเป็นเยี่ยงอย่างแก่พวกที่เหลือ"
 tgp_natural_disaster_contract_event.0016.c: "ยึดสิ่งที่ถูกกอบกู้มาเพื่อการตรวจสอบ #EMP ส่วนตัว#! ของข้า"
 tgp_natural_disaster_contract_event.0016.d: "จ่ายเงินให้พวกโจรปล้นสะดมเพื่อไปให้พ้น"
 #MODIFIERS
 tgp_deployed_troops_character_modifier: "ผู้พิทักษ์ความสงบเรียบร้อย"
 tgp_deployed_troops_character_modifier_desc: "ตัวละครนี้เป็นผู้สนับสนุนอย่างกระตือรือร้นในการบังคับใช้กฎหมายอย่างจริงจังโดยใช้กำลังอาวุธหากจำเป็น"
 tgp_setting_an_example_character_modifier: "ความสงบเรียบร้อยใต้คมดาบ"
 tgp_setting_an_example_character_modifier_desc: "ตัวละครนี้ได้แสดงให้เห็นถึงความเต็มใจที่จะนำความสงบเรียบร้อยมาอย่างรวดเร็ว มีประสิทธิภาพ และปราศจากความลังเล"
 tgp_deployed_troops_modifier: "การปล้นสะดมที่อาละวาด"
 tgp_deployed_troops_modifier_desc: "แม้ แต่ภาพที่น่าเกรงขามของกองกำลังของเราก็ยังล้มเหลวในการยับยั้งความโลภที่ไร้การควบคุมของพวกโจรปล้นสะดมและคนเก็บขยะในเคาน์ตีนี้"
 tgp_paying_off_the_looters_modifier: "คนเก็บขยะที่ติดสินบน"
 tgp_paying_off_the_looters_modifier_desc: "เพื่อแลกกับทองคำบางส่วน การปล้นสะดมที่อาละวาดได้หายไปจากพื้นที่ เปิดทางให้กับการฟื้นตัว"
