 tgp_japan_control_over_emperor: "ผู้ชักใยจักรพรรดิ"
 tgp_japan_control_over_emperor_desc: "ตัวละครนี้ได้เชิดจักรพรรดิที่ว่าง่ายขึ้นสู่บัลลังก์"

 tgp_japan_fujiwara_hidehira_back_in_town: "ด้วยคมดาบ"
 tgp_japan_fujiwara_hidehira_back_in_town_desc: "ตัวละครนี้ปรารถนาที่จะฟื้นฟูตระกูลฟูจิวาระสู่อำนาจโดยใช้กำลัง"

 tgp_moved_shogun_court_modifier: "เมืองหลวงของโชกุนาเตะ"
 tgp_moved_shogun_court_modifier_desc: "เคาน์ตีนี้กำลังถูกสถาปนาให้เป็นเมืองหลวงแห่งใหม่สำหรับโชกุนาเตะ โดยอยู่ห่างจากเมืองหลวงของจักรวรรดิ"


 tgp_festival_prosperity: "ความรุ่งเรืองจากเทศกาล"
 tgp_festival_prosperity_desc: "เคาน์ตีนี้ได้จัดงานเทศกาลที่รุ่งเรือง"

 ceremonial_liege_appointment_support_desc: "การสนับสนุนจากเจ้านายในพิธีการ"
