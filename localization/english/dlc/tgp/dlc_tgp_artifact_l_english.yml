l_english: 
 tgp_go_board:0 "กระดานโกะนำโชค"
 tgp_go_board_desc:0 "ด้วยเป็นส่วนสำคัญในเกมอันประสบผลสำเร็จอย่างงดงามในการเอาชนะ [bg_loser.GetTitledFirstName] เครื่องมือสันทนาการชิ้นนี้ได้นำโชคอันเลื่องลือมาสู่ [bg_victor.GetTitledFirstName] เป็นคราแรก\n\nอาจมีผู้กล่าวว่าแทบไม่มีเรื่องโชคเข้ามาเกี่ยวข้องในเกมอย่างโกะ ทว่ากระดานนี้ยังคงได้รับการเก็บรักษาไว้ในสภาพดีนับตั้งแต่เหตุการณ์นั้น"
 artifact_pedestal_baekje_incense_burner_name:0 "กระถางธูปสัมฤทธิ์ปิดทอง"
 artifact_pedestal_baekje_incense_burner_description:0 "กระถางธูปชิ้นนี้แสดงถึงฝีมืองานช่างอันล้ำเลิศ แม้ว่าจะถือกันว่าเป็นวัตถุเก่าแก่จากราชวงศ์แพ็กเจก็ตาม ส่วนฝาประดับด้วยลูกบิดรูปนกฟีนิกซ์ และล้อมรอบด้วยภูเขา 74 ลูกที่หล่อเป็นชั้นๆ พร้อมด้วยหมู่มวลรูปปั้นผู้คนและทิวทัศน์อันวิจิตร"
 artifact_armillary_sphere_china_name: "ทรงกลมฟ้าจำลองแห่งจักรวรรดิ"
 artifact_armillary_sphere_china_desc: "ลูกโลกท้องฟ้าจำลองนี้ถูกประกอบขึ้นโดยช่างฝีมือและปราชญ์ชาวจีนผู้เชี่ยวชาญ และใช้สำหรับการคำนวณที่เกี่ยวข้องกับปรากฏการณ์ทางดาราศาสตร์ ในฐานะเครื่องมือตรวจสอบปฏิทินสวรรค์ ทรงกลมฟ้าจำลองนี้ยังเป็นสัญลักษณ์แห่งสิทธิอันศักดิ์สิทธิ์ของโอรสสวรรค์อีกด้วย"
 artifact_eight_fold_chest_name: "หีบแปดชั้น"
 artifact_eight_fold_chest_description: "นี่คือชุดหีบขนาดเล็กแปดใบซ้อนกัน โดยมีพระธาตุข้อนิ้วของพระพุทธเจ้าบรรจุอยู่ในหีบใบกลางสุด พระธาตุนี้ถูกใช้ในพิธีต้อนรับในรัชสมัยของจักรพรรดิราชวงศ์ถังหลายพระองค์ ก่อนที่หีบเหล่านี้จะถูกสร้างขึ้นตามพระราชบัญชาของจักรพรรดิอี้จง\n\nหีบ แต่ละใบถูกสร้างขึ้นอย่างวิจิตรบรรจงด้วยไม้จันทน์ เงิน ทอง และหยก หีบใบสุดท้ายคือเจดีย์สี่ประตูทำจากทองคำบริสุทธิ์ ซึ่งบรรจุพระธาตุข้อนิ้วไว้ภายใน ยอดเจดีย์เป็นรูปดอกบัวประคองไข่มุกสีทองไว้"
 artifact_military_classics_name: "สาระสำคัญแห่งคัมภีร์การทหาร"
 artifact_military_classics_description: ""อู่จิงจงเย่า" (Wujing Zongyao) หรือ 'สารัตถะฉบับสมบูรณ์แห่งคัมภีร์การทหาร' คือการรวบรวมความรู้ทางการทหารพร้อมภาพประกอบ เขียนขึ้นโดยคณะทำงานภายใต้เจิงกงเลี่ยง (Zeng Gongliang) ตามพระราชประสงค์ของจักรพรรดิเหรินจง เนื้อหาครอบคลุมเทคโนโลยีทางการทหารอันหลากหลาย และมุ่งหมายให้เป็นบทสรุปของคัมภีร์การทหารเพื่อการเผยแพร่ในวงกว้าง\n\nในบรรดาหัวข้อต่างๆ ในตำรานี้ ประกอบด้วยเครื่องจักรกลปิดล้อม, การยุทธนาวี และสูตรสำหรับทำวัตถุระเบิด"
