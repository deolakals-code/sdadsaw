 provincial_exam_close_family_failed: "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] สอบไม่ผ่านการสอบระดับมณฑล"
 msg_provincial_exam_close_family_failed_desc: "[ROOT.Char.GetShortUIName|U] พยายาม แต่ล้มเหลวในการพิสูจน์ [ROOT.Char.GetHerselfHimself] ในการสอบระดับต้นที่ [ROOT.Char.GetCurrentLocation.GetName]"
