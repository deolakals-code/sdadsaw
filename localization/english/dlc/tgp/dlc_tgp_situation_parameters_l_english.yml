l_english: 
 dynastic_cycle: "$game_concept_dynastic_cycle$"
 dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle: "$game_concept_dynastic_cycle$"
 situation_dynastic_cycle_desc: "$game_concept_dynastic_cycle_desc$"
 situation_dynastic_cycle_phase_stability_expansion: "การแผ่ขยาย"
 situation_dynastic_cycle_phase_stability_expansion_icon: "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$"
 situation_dynastic_cycle_phase_stability_expansion_desc_short: "ใน [dynastic_cycle_era_short|E] นี้ จักรวรรดิกำลังมุ่งเน้นไปที่การเสริมสร้างความแข็งแกร่งผ่านการมองออกไปภายนอก: การปราบปรามชายแดนให้สงบ, การแผ่ขยายอิทธิพลผ่านกำลังทหาร, [tributaries|E], และ [silk_road|E]"
 situation_dynastic_cycle_phase_stability_expansion_desc: "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ ดังนั้น เพื่อปฏิรูปจีนสู่ $game_concept_dynastic_cycle_era_short$ นี้จาก [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] $game_concept_dynastic_cycle_era_short$ จักรวรรดิจะต้องเข้าสู่ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] $game_concept_dynastic_cycle_era_short$ ก่อน"
 situation_dynastic_cycle_phase_stability_advancement: "ความก้าวหน้า"
 situation_dynastic_cycle_phase_stability_advancement_icon: "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$"
 situation_dynastic_cycle_phase_stability_advancement_desc_short: "ใน [dynastic_cycle_era_short|E] นี้ จักรวรรดิกำลังมุ่งเน้นไปที่การพัฒนาตนเองโดยการมองเข้ามาภายใน: ผ่านทาง [innovations|E], ความเป็นเลิศทางวัฒนธรรม, ความเจริญรุ่งเรืองของประชาราษฎร์, และการปกครอง [GetReligionByKey('confucianism_religion').GetAdjective] แบบ [meritorious|E] ที่ดีงาม"
 situation_dynastic_cycle_phase_stability_advancement_desc: "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ ดังนั้น เพื่อปฏิรูปจีนสู่ $game_concept_dynastic_cycle_era_short$ นี้จาก [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] $game_concept_dynastic_cycle_era_short$ จักรวรรดิจะต้องเข้าสู่ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName] $game_concept_dynastic_cycle_era_short$ ก่อน"

 SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA: "จีนจะเข้าสู่ $game_concept_dynastic_cycle_era_short$ นี้จาก [dynastic_cycle_era_type_unstable|E] หากมี [situation_catalyst_catalysts|E] เกิดขึ้นมากพอ"

 situation_dynastic_cycle_phase_instability_conquest: "การพิชิต"
 situation_dynastic_cycle_phase_instability_conquest_icon: "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_instability_conquest_desc_short: "[dynastic_cycle_era_short|E] แห่งการรวบรวมอำนาจหลังจากที่มหาอำนาจต่างชาติได้พิชิตจีน"
 situation_dynastic_cycle_phase_instability_conquest_desc: "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nในการเข้าสู่ $game_concept_dynastic_cycle_era_short$ นี้ [hegemony|E] ของจีนจะต้องตกไปอยู่ในมือของ [ruler|E] ที่ #bold ไม่#! มี [government|E] แบบ [GetGovernment('celestial_government').GetName|E] หรือมี [heritage|E] ทาง [culture|E] ที่ #bold ไม่#! ใช่ $heritage_chinese_name$"
 situation_dynastic_cycle_phase_instability: "ความตึงเครียด"
 situation_dynastic_cycle_phase_instability_icon: "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$"
 situation_dynastic_cycle_phase_instability_desc: "$situation_dynastic_cycle_phase_instability_desc_short$ หากหลีกเลี่ยง [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName] ได้ จีนก็เป็นไปได้ที่จะไปถึง $game_concept_dynastic_cycle_era_short$ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] หรือ [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] ก็ได้\n\nจีนจะเข้าสู่ $game_concept_dynastic_cycle_era_short$ นี้จาก [dynastic_cycle_era_type_stable|E] หากมี [situation_catalyst_catalysts|E] เกิดขึ้นมากพอ"
 situation_dynastic_cycle_phase_instability_desc_short: "นี่คือ [dynastic_cycle_era_short|E] แห่งความไม่สงบ แต่ก็เป็นยุคแห่งโอกาส เช่นกัน แม้ว่าการทุจริต, ความไม่สงบของประชาชน, และการรุกรานจะเป็นภัยคุกคาม แต่การปกครองที่ชาญฉลาดก็สามารถปฏิรูปจีนได้"
 situation_dynastic_cycle_phase_chaos: "ความแตกแยก"
 situation_dynastic_cycle_phase_chaos_icon: "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$"
 situation_dynastic_cycle_phase_chaos_desc_short: "[dynastic_cycle_era_short|E] แห่งเหล่าขุนศึก ที่ ซึ่งมีเพียง [ruler|E] ผู้แข็งแกร่งเท่านั้นที่จะสามารถรวมจีนให้เป็นหนึ่งได้"
 situation_dynastic_cycle_phase_chaos_desc: "$situation_dynastic_cycle_phase_chaos_desc_short$\n\n$game_concept_dynastic_cycle_era_short$ นี้จะเริ่มต้นขึ้นหาก:\n$EFFECT_LIST_BULLET$ใน [dynastic_cycle_era_type_unstable|E] มี [situation_catalyst_catalysts|E] เกิดขึ้นมากพอ\n$EFFECT_LIST_BULLET$[son_of_heaven|E] องค์ปัจจุบันสูญเสีย [mandate_of_heaven|E]\n\n#S เมื่อ $game_concept_dynastic_cycle_era_short$ นี้เริ่มต้น#!\n$BULLET$#indent_newline:2 [title|E] [hegemony|E] ของจีนจะถูกทำลาย และอดีต [son_of_heaven|E] จะถูก [deposed|E]#!\n$BULLET$#indent_newline:2 [titles|E] ระดับ [title_tier|E] [empire|E] และ [kingdom|E] ในลำดับชั้น [de_jure|E] จะถูกทำลายด้วยเช่นกัน หาก [holders|E] ของพวกเขามี [movement_power_i][movement_power_short|E] ต่ำกว่า [EmptyScope.ScriptValue('high_movement_power_value')] และ [EmptyScope.ScriptValue('medium_movement_power_value')] ตามลำดับ#!\n$BULLET$#indent_newline:2 [rulers|E] อิสระจะสาบานความภักดีหรือจ่ายบรรณาการแก่ [elders|E] หรือ [movement_leaders|E] ของตน#!\n$BULLET$[ruler|E] อิสระทุกคนจะเข้าร่วม [situation_participant_group|E] #V $dynastic_cycle_participant_group_other_rulers$#!#!\n$BULLET$[situation_participant_group|E] อื่นๆ ทั้งหมดจะถูกยุบ"
 situation_dynastic_cycle_phase_stability: "เสถียรภาพ"
 situation_dynastic_cycle_phase_stability_desc: "#D ไม่ควรแสดงระยะนี้#!"
 dynastic_cycle_sub_region_core: "จีน"
 dynastic_cycle_sub_region_core_desc: "[counties|E] ทั้งหมดที่ถูกรวมเข้ากับลำดับชั้น [de_jure|E] ของ [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_sub_region_peripheries: "พื้นที่รอบนอกของจีน"
 dynastic_cycle_sub_region_peripheries_desc: "[counties|E] ทั้งหมดที่ไม่ได้เป็นส่วนหนึ่งของ [GetSituation('dynastic_cycle').GetSubRegionByKey( 'core' ).GetName] แต่ยังคงถูกครอบครองโดย [son_of_heaven|E]"
 custom_dynastic_cycle: "ดินแดนใต้สวรรค์"
 dynastic_cycle_participant_group_hegemon_ruler: "โอรสสวรรค์"
 dynastic_cycle_participant_group_hegemon_ruler_desc: "[son_of_heaven|E], [holder|E] ของ [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_participant_group_other_rulers: "ผู้ปกครองอิสระ"
 dynastic_cycle_participant_group_other_rulers_desc: "[rulers|E] ทั้งหมดใน [GetSituation('dynastic_cycle').GetTopSubRegion.GetName] ผู้ ซึ่งมิใช่ [vassals|E] ของ [GetTitleByKey('h_china').GetDefinitiveName]"
 dynastic_cycle_participant_group_advancement_movement: "ขบวนการ $game_concept_movement$ แห่งความก้าวหน้า"
 dynastic_cycle_participant_group_advancement_movement_desc: "[vassals|E] ทั้งหมดของ [GetTitleByKey('h_china').GetDefinitiveName] ที่ต้องการผลักดัน [dynastic_cycle|E] ไปสู่ [situation_dynastic_cycle_phase|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]\n\nพวกเขาอุทิศตนเพื่อความมั่งคั่งของมณฑลหลักของจีน: โดยการเพิ่ม [development|E], สร้าง [great_projects|E] ให้เสร็จสิ้น, ค้นพบ [innovations|E], และได้รับ [merit|E] ผ่าน [examinations|E]\n$unlockables_advancement$"
 dynastic_cycle_participant_group_expansion_movement: "ขบวนการ $game_concept_movement$ แห่งการแผ่ขยาย"
 dynastic_cycle_participant_group_expansion_movement_desc: "[vassals|E] ทั้งหมดของ [GetTitleByKey('h_china').GetDefinitiveName] ที่มุ่งหมายจะผลักดัน [dynastic_cycle|E] ไปสู่ [situation_dynastic_cycle_phase|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n\nเพื่ออำนวยความสะดวกในการพิชิตดินแดนภายนอกจีน พวกเขามุ่งเน้นไปที่การเสริมอำนาจให้ [governors|E] [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )], การเพิ่ม [prowess|E], การศึกษา [martial_lifestyle|E], และการเรียนรู้ [commander_traits|E]\n$unlockables_expansion$"
 dynastic_cycle_participant_group_pro_hegemon_movement: "ขบวนการ $game_concept_movement$ สนับสนุน [SelectLocalization( GetPlayer.IsValid, 'pro_hegemon_movement_in_game_name', 'Dynasty' ) ]"
 pro_hegemon_movement_in_game_name: "[GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]"
 dynastic_cycle_participant_group_pro_hegemon_movement_desc: "[vassals|E] ทั้งหมดของ [GetTitleByKey('h_china').GetDefinitiveName] ที่ปฏิบัติตามเจตจำนงของ [son_of_heaven|E] อย่างใกล้ชิด\n\nพวกเขามุ่งหมายที่จะเป็น [governors|E] และ [ministers|E] ผู้มีอิทธิพลที่สนับสนุน [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey('hegemon_ruler').GetNameNoTooltip] อย่างแรงกล้า พวกเขาได้รับ $situation_parameter_pro_hegemon_interaction_boost$"
 dynastic_cycle_participant_group_conservative_movement: "ขบวนการ $game_concept_movement$ อนุรักษ์นิยม"
 dynastic_cycle_participant_group_conservative_movement_desc: "[vassals|E] ทั้งหมดของ [GetTitleByKey('h_china').GetDefinitiveName] ที่แสวงหาการเสริมอำนาจให้แก่ชนชั้นสูง\n\nพวกเขามุ่งเน้นไปที่การปฏิรูปและการเปลี่ยนแปลงที่เป็นประโยชน์ต่อ [powerful_families|E] และ [dynasties|E] ที่มีชื่อเสียง ขณะเดียวกันก็ส่งเสริมประเพณีดั้งเดิมมากกว่า [merit|E]\n$unlockables_conservative$"
 unlockables_advancement: "$BULLET_WITH_TAB$เข้าถึง [interaction|E] #V $boost_efficiency_interaction$#! ได้\n$BULLET_WITH_TAB$$scholarly_inspiration_frequency_desc$\n$BULLET_WITH_TAB$เพิ่ม [aptitude|E] ของ [court_position|E] [GetCourtPositionType('court_poet_court_position').GetName]\n$BULLET_WITH_TAB$เข้าถึง [decision|E] [GetDecisionWithKey('tgp_japan_become_a_poet_decision').GetName] ได้\n$BULLET_WITH_TAB$เข้าถึง [decision|E] [GetDecisionWithKey('diligent_development_focus_decision').GetName] ได้"
 unlockables_expansion: "$BULLET_WITH_TAB$เข้าถึง [interaction|E] #V $damage_efficiency_interaction$#! ได้\n$BULLET_WITH_TAB$เข้าถึง [interaction|E] #V $fp3_request_turkic_invasion_interaction$#! ได้\n$BULLET_WITH_TAB$เข้าถึง [interaction|E] #V $spar_with_knight_interaction$#! ได้"
 unlockables_conservative: "$BULLET_WITH_TAB$เข้าถึง [interaction|E] #V $damage_efficiency_interaction$#! ได้\n$BULLET_WITH_TAB$สามารถขอเปลี่ยน [law|E] [GetLawGroup('candidate_score_laws').GetName] ผ่าน [decision|E] [GetDecisionWithKey('movement_petition_decision').GetName] ได้\n$BULLET_WITH_TAB$สามารถสร้าง [domicile_building_upgrade|E] [GetDomicileBuilding('east_asian_estate_reception_hall_01').GetName] ได้"
 dynastic_cycle_participant_group_undecided_movement: "ไม่ฝักใฝ่ฝ่ายใด"
 dynastic_cycle_participant_group_undecided_movement_desc: "[vassals|E] ทั้งหมดของ [GetTitleByKey('h_china').GetDefinitiveName] ที่ยังไม่ได้แสดงจุดยืนใดๆ ต่อสถานะ [dynastic_cycle|E] ในปัจจุบัน\n\nพวกเขาสามารถถูกชักชวนให้เข้าร่วม [movement|E] อื่นใดก็ได้"
