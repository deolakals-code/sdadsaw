l_english: 
 tgp_china_ministry.0001.t: "$great_project_type_grand_campaign_project$: รุดหน้า"
 tgp_china_ministry.0001.desc: "[great_project.GetName] กำลังดำเนินไป ศักดิ์ศรีและความทะเยอทะยานของ [owner.GetNamePossessive] นั้นเป็นเดิมพัน\n\n"[contributor.GetName] เปล่งเสียงอย่างภาคภูมิว่า "นับเป็นเกียรติอย่างยิ่งที่ได้เป็นส่วนหนึ่งในการสร้างประวัติศาสตร์" "ชัยชนะของเราเหนือ [defender.GetName] จะเกิดขึ้นอย่างรวดเร็ว และจะถูกกล่าวขานในบทกวีสืบไป อีกไม่นาน [target_title.GetName] ทั้งหมดจะอยู่ภายใต้สวรรค์!""
 tgp_china_ministry.0001.a: "จงให้ [GetTitleByKey('h_china').GetNameNoTooltip] เติบใหญ่!"
 tgp_china_ministry.0002.t: "$great_project_type_grand_campaign_project$: สำเร็จ"
 tgp_china_ministry.0002.desc: "[great_project.GetName] คว้าชัยชนะมาจากเงื้อมมือของ [defender.GetName]\n\n"[attacker.GetName] ประกาศอย่างมั่นใจว่า "อีกไม่นานเราจะนำ [target_title.GetName] ทั้งหมดมาอยู่ภายใต้สวรรค์!""
 tgp_china_ministry.0002.a: ""บุกต่อไป!""
 tgp_china_ministry.0003.t: "$great_project_type_grand_campaign_project$: ล้มเหลว"
 tgp_china_ministry.0003.desc: "[great_project.GetName] ประสบความพ่ายแพ้ด้วยน้ำมือของ [defender.GetName]\n\n"[attacker.GetName] ปลอบใจว่า "มันก็แค่สะดุดเล็กน้อยบนเส้นทางสู่ชัยชนะ!""
 tgp_china_ministry.0003.a: ""ความอดทนของข้าใกล้จะหมดแล้ว""
 tgp_china_ministry.0004.t: "$great_project_type_grand_campaign_project$: ไกลโพ้นยิ่งกว่า"
 tgp_china_ministry.0004.desc: "[great_project.GetName] กำลังดำเนินการอยู่ [contributor.GetName] ประกาศความเต็มใจที่จะเข้าร่วมในความพยายามทำสงคราม\n\n“[title_holder.GetName] ผู้อ่อนแอนั้นมิอาจเทียบได้กับ [GetTitleByKey('h_china').GetName] ข้ามีแผนการที่จะยึด [target_title.GetName]”"
 tgp_china_ministry.0004.a: "จงถือว่า [target_title.GetNameNoTierNoTooltip] อยู่ภายใต้สวรรค์แล้ว"
 grand_campaign_added_war_target_tt: "[target_title.GetName] ถูกเพิ่มเป็น [title|E] ที่เป็นข้อพิพาทและเป้าหมายสงครามใน #V [grand_campaign_war.GetName]#! [war|E]"
 tgp_china_ministry.0005.t: "$great_project_type_grand_campaign_project$: อัสดง"
 tgp_china_ministry.0005.desc_won: "[great_project.GetName] ประสบความสำเร็จอย่างยิ่งใหญ่ ดินแดนแห่ง [target_kingdom.GetName] บัดนี้ได้กลายเป็นส่วนสำคัญของ [GetTitleByKey('h_china').GetName] แล้ว\n\n"ผลลัพธ์ที่คาดหวังไว้ แต่ก็ยังเป็นเหตุผลที่สมควรแก่การเฉลิมฉลอง" จักรพรรดิทรงยินดี "ให้ผู้คนได้รับรู้ว่า [ROOT.Char.GetPrimaryTitle.GetName] นั้นยิ่งใหญ่ที่สุดภายใต้สวรรค์!""
 tgp_china_ministry.0005.desc_lost: "[great_project.GetName] ถือเป็นหายนะอันเลวร้าย ดินแดนแห่ง [target_kingdom.GetName] ได้ต้านทานอำนาจของ [GetTitleByKey('h_china').GetName]\n\n""ผลลัพธ์ที่เหนือความคาดหมาย" [owner.GetTitleAsName] สะกดกลั้นโทสะของ [owner.GetHerHis] "จงประกาศให้ผู้คนรู้ว่า [ROOT.Char.GetPrimaryTitle.GetName] ได้นำความอัปยศครั้งใหญ่มาสู่สรวงสวรรค์!""
 tgp_china_ministry.0005.a_win: "เป็นความพยายามที่ยอดเยี่ยม!"
 tgp_china_ministry.0005.a_lost: "[GetTitleByKey('h_china').GetNameNoTooltip] ทั้งปวงควรละอายใจ"
 tgp_china_ministry.0006.opening: "[founder.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_china_ministry.0006.desc: "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่า [great_project.GetName] จำต้องถูกยกเลิก"
 tgp_china_ministry.0006.a: "น่าเสียดายจริง"
 tgp_china_ministry.0007.t: "$tgp_china_ministry.0001.t$"
 tgp_china_ministry.0007.desc: "$tgp_china_ministry.0001.desc$"
 tgp_china_ministry.0007.a: "$tgp_china_ministry.0001.a$"
 
 tgp_china_ministry.0100.t: "คลังหลวง [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 tgp_china_ministry.0100.intro: "ถึงเวลาทบทวนงบประมาณของ [ROOT.Char.Custom('GetRealmRank')] แล้ว"
 tgp_china_ministry.0100.steward_desc: "[steward.GetShortUIName] ยืนอยู่เบื้องหน้าข้า ขมวดคิ้ว มือถือสมุดบัญชี กองทัพผู้ช่วยขนาดย่อมเดินตามหลัง [steward.GetHerHim] พะรุงพะรังไปด้วยม้วนเอกสาร ตำรา และบันทึกการคลัง\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] พวกเรา #EMP จักต้อง#! ตรวจสอบรายจ่ายของเราและเตรียมงบประมาณใหม่สำหรับคลังหลวง ข้าเกรงว่าเรื่องนี้มิอาจรอช้าได้"
 tgp_china_ministry.0100.solo_desc: "ข้าพบว่าตนเองถูกห้อมล้อมด้วยกองทัพเสมียนขนาดย่อม พะรุงพะรังไปด้วยม้วนเอกสาร ตำรา และบันทึกการคลัง ทั้งหมดกำลังรอให้ข้าตรวจสอบให้เสร็จสิ้น\n\n"
 tgp_china_ministry.0100.income_desc: "รายรับปัจจุบันของเรานั้นเกินกว่ารายจ่ายไปอย่างมาก"
 tgp_china_ministry.0100.deficit_desc: "รายจ่ายของเรานั้นมากเกินไป และคลังหลวงจะล่มสลายหากมิมีการดำเนินการใด"
 tgp_china_ministry.0100.fallback_desc: "เป็นเวลาหลายปีแล้วนับตั้งแต่งบประมาณครั้งล่าสุดมีผลบังคับใช้"
 tgp_china_ministry.0100.a: "ดีมาก เช่นนั้นมาตั้งงบประมาณใหม่กัน"
 tgp_china_ministry.0100.b: "คงการจัดสรรไว้ดังเดิม"
 tgp_china_ministry.0100.c: "ข้าเชื่อมั่นในการตัดสินใจของเจ้าในเรื่องนี้"
 tgp_china_ministry.0100.a_tooltip: "ท่านจะได้เลือก [treasury_budget|E] จากหลายตัวเลือก"
 single_quotation_desc: """
 
 tgp_china_ministry.0101.desc: "เอกสารข้อเสนอหลายฉบับวางอยู่เบื้องหน้าข้า แต่ละฉบับร่างแนวทางที่แตกต่างกันสำหรับคลังหลวง — ว่าจะใช้จ่ายที่ใด และจะรัดเข็มขัดที่ใด\n\nข้าควรเลือกฉบับใดดี?"
 tgp_china_ministry.0101.a: "เงินเดือนควรเป็นจุดที่เราให้ความสำคัญหลัก"
 tgp_china_ministry.0101.b: "จงแน่ใจว่าเหล่าเสนาบดีทุกคนได้รับส่วนแบ่งที่เหมาะสม"
 tgp_china_ministry.0101.c: "กองทัพที่แข็งแกร่งคืออาณาจักรที่แข็งแกร่ง"
 tgp_china_ministry.0101.d: "สงวนส่วนแบ่งที่มากขึ้นไว้สำหรับใช้ในราชสำนักเท่านั้น"
 tgp_china_ministry.0101.e: "เศรษฐกิจที่สมดุลจะรับใช้เราได้ดีที่สุด"
 
 tgp_treasury_enact_salary_budget_info_desc: "[treasury_budget_category|E] Focus: @gold_icon![treasury_salary_budget_short|E]\n[treasury_budget|E] ที่โดยทั่วไปเหล่า [governors|E] ชื่นชอบ — ซึ่งอาจได้รับค่าความเห็นหากการจัดสรรใหม่นี้ช่วยเพิ่มเงินเดือนของพวกเขา"
 
 tgp_treasury_enact_ministry_budget_info_desc: "[treasury_budget_category|E] Focus: @government_type_celestial![treasury_ministry_budget_short|E]\n[treasury_budget|E] ที่โดยทั่วไปเหล่า [ministers|E] ชื่นชอบ — ซึ่งจะได้รับทุนเพิ่มเติมที่พวกเขาสามารถใช้จ่ายตามความรับผิดชอบของตน เช่น การเริ่ม [great_projects|E]"
 
 tgp_treasury_enact_military_budget_info_desc: "[treasury_budget_category|E] Focus: @celestial_military_administration![treasury_military_budget_short|E]\n[treasury_budget|E] ที่โดยทั่วไปเหล่า [governors|E] ฝ่ายทหารชื่นชอบ — ซึ่งจะได้รับทุนเพิ่มเติมเพื่อเกณฑ์และบำรุงรักษา [title_men_at_arms|E]"
 
 tgp_treasury_enact_hegemon_budget_info_desc: "[treasury_budget_category|E] Focus: @legitimacy_icon_mandate![son_of_heaven|E]\n[treasury_budget|E] ที่เหลือส่วนแบ่งของ [treasury|E] ที่ยังไม่ได้จัดสรรไว้ในสัดส่วนที่สูงขึ้น ทำให้ [liege|E] สามารถใช้จ่ายได้ตามที่เห็นสมควร"
 
 tgp_treasury_enact_balanced_budget_info_desc: "[treasury_budget_category|E] Focus: @law_icon!สมดุล\n[treasury_budget|E] ที่พยายามเกลี่ย [treasury|E] อย่างเท่าเทียมกันในทุกหมวดหมู่"
 
 tgp_treasury_enact_salary_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_ministry_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_ministry_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_20').GetShortName|V]#!"
 tgp_treasury_enact_military_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_ministry_20').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_40').GetShortName|V]#!"
 tgp_treasury_enact_hegemon_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_ministry_25').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 tgp_treasury_enact_balanced_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_ministry_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_ministry_30').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_25').GetShortName|V]#!"
 
 tgp_treasury_enact_meritocratic_salary_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_55').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_35').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_military_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_35').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_55').GetShortName|V]#!"
 tgp_treasury_enact_meritocratic_balanced_budget_desc: "ประกาศใช้ [treasury_budget|E] โดยมีรายละเอียดดังต่อไปนี้:\n#indent_newline:4 $TAB$$EFFECT_LIST_BULLET$[treasury_salary_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_salary_45').GetShortName|V]\n$EFFECT_LIST_BULLET$[treasury_military_budget|E] ถูกตั้งค่าเป็น [GetLaw('budget_allocation_military_45').GetShortName|V]#!"
 
 tgp_china_ministry.0200.t: "งบประมาณของเสนาบดี"
 tgp_china_ministry.0200.desc: "[minister_of_revenue.GetCouncilTitle] ของข้า [minister_of_revenue.GetFirstName] ยืนอยู่เบื้องหน้าข้าอีกครั้ง มือถือสมุดบัญชี\n\n""ข้ารับรองท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] — คลังหลวงจะเฟื่องฟูหากเราดำเนินการตามข้อเสนอของข้า!""
 tgp_china_ministry.0200.a: "ยอดเยี่ยม จงนำไปบังคับใช้ทันที!"
 tgp_china_ministry.0200.b: "ข้าเกรงว่าข้ามีแผนอื่นสำหรับคลังหลวงแล้ว"
 tgp_china_ministry.0200.toast_t_success: "งบประมาณได้รับการยอมรับ"
 tgp_china_ministry.0200.toast_desc_success: "[treasury_ruler.GetShortUIName|U] อนุมัติข้อเสนอของท่านแล้ว"
 tgp_china_ministry.0200.toast_t_failure: "งบประมาณถูกปฏิเสธ"
 tgp_china_ministry.0200.toast_desc_failure: "[treasury_ruler.GetShortUIName|U] ปฏิเสธข้อเสนอของท่าน"
