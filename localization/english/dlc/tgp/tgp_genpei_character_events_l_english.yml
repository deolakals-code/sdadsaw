l_english: 
 genpei_intro: "สงครามเก็มเป:"

 tgp_genpei_character.1000.t: "$genpei_intro$ เก็นจิผู้ถูกปีศาจรบกวน"
 tgp_genpei_character.1000.desc: "ข้าถูกหลอกหลอนด้วยความพ่ายแพ้ของบิดาข้าและการฆาตกรรมพี่น้องของข้าใน [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )] ความอัปยศนี้ขับเคลื่อนการล้างแค้นของข้าต่อตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ที่ชั่วช้า! แม้ว่า [kiyomori_taira.GetFirstName] อาจคิดว่า [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] นั้นมั่นคงแล้วด้วยการสมรสของบุตรี [kiyomori_taira.GetHerHis] กับ [norihito_tenno.GetTitledFirstName], ตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ยังคงมีอิทธิพลในแคว้นทางตะวันออก และราชวงศ์ก็อึดอัดภายใต้การปกครองของ [kiyomori_taira.GetHerHis] \n\nแม้ว่าผู้นำตระกูลมินาโมโตะในนามอย่าง [yorimasa_minamoto.GetFirstName] จะเคยช่วย [kiyomori_taira.GetFirstNameNoTooltip] ต่อสู้กับบิดาข้า, สายลับของข้าแจ้งว่าเริ่มเกิดความบาดหมางขึ้นระหว่างคนทั้งสอง ในขณะเดียวกัน ญาติของข้า [yoshinaka_minamoto.GetFirstName] ยังไม่ให้อภัยต่อการตายของบิดา [yoshinaka_minamoto.GetHerHis] ด้วยน้ำมือของพี่น้องต่างมารดาของข้า, แต่ก็จะเป็นพันธมิตรที่มีประโยชน์..."
 tgp_genpei_character.1000.a: "#bold ข้า#! แต่เพียงผู้เดียวที่จะโค่นล้มตระกูล [kiyomori_taira.GetDynasty.GetNameNoTooltip]!"
 tgp_genpei_character.1000.a.flavor: "[ruler.GetShortUIName|U] จะพยายามรวบรวมกำลังของตนเองเพื่อปลดปล่อย [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] จากทรราช [kiyomori_taira.GetDynastyName]"
 tgp_genpei_character.1000.b: "พวกเรา [ruler.GetDynasty.GetNameNoTooltip] จักต้องรวมตัวกันเพื่อต่อต้าน"
 tgp_genpei_character.1000.b.flavor: "ท่านต้องสมานความบาดหมาง หากท่านจะโค่นล้มตระกูล [kiyomori_taira.GetDynastyName] ที่แทบจะไร้เทียมทาน"
 tgp_genpei_character.1010.t: "$genpei_intro$ เก็นจิผู้ถูกปลดปล่อย"
 tgp_genpei_character.1010.desc.intro: "[kiyomori_taira.GetFirstName]! ความกระหายอำนาจของมันดุจสายน้ำที่ไหลเชี่ยวโดยไร้การควบคุม ทำลายล้างทั้งขนบธรรมเนียมอันสูงส่งและความเหมาะสม แม้ แต่การตั้งตนเอง [kiyomori_taira.GetHerselfHimself] เป็น [kiyomori_taira.GetTitleAsName] ผู้เป็นนายเหนือญี่ปุ่นทั้งปวง ก็มิอาจสนองความกระหายอันไร้ขอบเขตของมันได้ ด้วยความเมามันในความสุขแห่งการครอบงำของตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ที่ไร้ผู้ท้าทาย, [kiyomori_taira.GetSheHe] ก็ได้เห็นสมควรที่จะถอด [Glossary( 'จักรพรรดิ', 'TENNO_GLOSS' )] [old_emperor.GetTitledFirstName] และตั้งหลานชายของ [kiyomori_taira.GetHerHis] [new_emperor.GetFirstName] ขึ้นสู่ [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]"
 tgp_genpei_character.1010.desc.blocboss: "ในฐานะปลายหอกของ [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ข้าคือผู้ที่ต้องรับผิดชอบ เราต้องเป็นรั้วกำแพงต้านทานความทะเยอทะยานของ [kiyomori_taira.GetDynasty.GetNameNoTooltip] มิฉะนั้นเราจะพบว่าตนเองกลายเป็นผู้แบกเสลี่ยงรับใช้มัน!"
 tgp_genpei_character.1010.desc.notblocboss: "\n\nในหลายปีก่อน ตระกูลของข้าเคยเป็นรั้วกำแพงต้านทานความทะเยอทะยานของ [kiyomori_taira.GetDynasty.GetNameNoTooltip] บัดนี้ ผู้นำ [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ที่ไร้ความสามารถกำลังจะ ทำให้เรากลายเป็นผู้แบกเสลี่ยง [minamoto_ruler.GetFirstName] อ่อนแอนัก หากบิดาผู้ปราดเปรื่องของข้าอยู่ที่นี่ ท่านจะไม่มีวันยอมให้เรื่องนี้เกิดขึ้น"
 tgp_genpei_character.1010.a: "ข้าต้องรวบรวมตระกูล [ruler.GetDynasty.GetNameNoTooltip]"
 tgp_genpei_character.1010.a.flavor: "[bloc|E] จะตอบรับการเรียกอันเร่งด่วนของท่าน และแน่นอนว่าจะ ทำให้ [ruler.GetHouse.GetName] กลายเป็น [house|E] ผู้ปกครอง หากท่านใช้ [interaction|E] #V $assume_house_bloc_leadership_interaction$#! นี้"
  tgp_genpei_character.1010.a.tt: "ทุก [house|E] ใน [bloc|E] ของท่านจะเพิ่มระดับ [house_relation|E] กับ [ruler.GetHouse.GetName]"
 tgp_genpei_character.1010.b: "บางทีตระกูล [kiyomori_taira.GetDynasty.GetNameNoTooltip] อาจเป็นผู้ปกครองโดยชอบธรรม?"
 tgp_genpei_character.1010.b.flavor: "หากท่านประจบสอพลอตอนนี้ ท่านอาจได้ตำแหน่งข้ารับใช้คนสำคัญ"

 tgp_genpei_character.1090.t: "$genpei_intro$ เก็นจิผู้เคียดแค้น"
 tgp_genpei_character.1090.desc: "สิทธิ์โดยกำเนิดของข้าในการนำตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ถูกขโมยไป! บิดาผู้สูงศักดิ์ของข้าถูกพรากไปโดยการสังหารญาติอันต่ำช้า! การสังหารญาติใน [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )] นี้ไม่ได้ทำสิ่งใดเลยนอกจากปูทางให้ตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ที่ชั่วร้ายเข้าครอบงำ [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] [kiyomori_taira.GetFirstName] ผู้เมามันในอำนาจ ได้ตั้งตนเองเป็น [Glossary( 'ไดโจ-ไดจิน', 'DAIJO_DAIJIN_GLOSS' )]!\n\nบัดนี้ ญาติของข้า [yoritomo_minamoto.GetFirstName] พยายามรวบรวมตระกูล [yoritomo_minamoto.GetDynasty.GetNameNoTooltip] เพื่อต่อต้านทรราชผู้นี้, แต่ก็ยังไม่ได้ชดใช้ต่ออาชญากรรมของบิดา [yoritomo_minamoto.GetHerHis] ตระกูลใหม่ของข้า [ruler.GetHouse.GetName] ยืนหยัดท้าทายดุจดังชื่อของมัน; ภูเขาที่ให้ที่พักพิงแก่ข้าจากลุงผู้ฆาตกร!\n\nเพียงกำลังของข้าจะเพียงพอที่จะยุติยุคแห่งทรราชนี้หรือไม่?"
 tgp_genpei_character.1090.a: "$tgp_genpei_character.1000.a$"
 tgp_genpei_character.1090.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
 tgp_genpei_character.1090.b: "$tgp_genpei_character.1000.b$"

 tgp_genpei_character.1095.t: "$genpei_intro$ เก็นจิผู้ชอบธรรม"
 tgp_genpei_character.1095.desc: "หัวใจข้าหลั่งเลือดให้แก่ญี่ปุ่นของบิดาข้า [kiyomori_taira.GetFirstName] ได้ทำลายทุกสิ่งที่เรารู้จัก! ร่องรอยสุดท้ายแห่งความถูกต้อง, [old_emperor.GetFirstName] [Glossary( 'จักรพรรดิ', 'TENNO_GLOSS' )] [current_emperor.GetHerselfHimself], ได้ถูกถอดออกจาก [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] และหลานชายตัวน้อยของ [kiyomori_taira.GetFirstNamePossessiveNoTooltip] [current_emperor.GetFirstName] ก็ถูกตั้งขึ้นแทนที่ [old_emperor.GetHerHis] \n\nในขณะที่ญาติของข้า [yoritomo_minamoto.GetFirstName] เตรียมพร้อมที่จะนำตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ต่อต้านทรราช [kiyomori_taira.GetFirstNamePossessiveNoTooltip], ข้าควรเข้าร่วมอุดมการณ์ของ [yoritomo_minamoto.GetHerHis] หรือไม่ ในเมื่อข้าเป็นนักรบที่เก่งกว่าและสถานที่อันชอบธรรมของข้าคือการเป็นผู้นำ? หรือข้าจะกล้าเสี่ยงแบ่งแยกกำลังของเราและเรียกตระกูลมาอยู่ใต้ธงของข้า แต่เพียงผู้เดียว?"
 tgp_genpei_character.1095.a: "ไม่มีอนาคตหากอยู่กับ [yoritomo_minamoto.GetFirstNameNoTooltip] ตระกูล [ruler.GetDynasty.GetNameNoTooltip] จงมาหาข้า!"
 tgp_genpei_character.1095.a.flavor: "$tgp_genpei_character.1000.a.flavor$"
 join_house_bloc_yoshinaka_tt: "[house|E] [THIS.House.GetBaseName] จะเข้าร่วม [bloc|E] ของท่าน"
 tgp_genpei_character.1095.b: "ข้าจะกล้ำกลืนยาขมนี้...เพียงตอนนี้"
 tgp_genpei_character.1095.b.flavor: "อันตรายจากความเป็นใหญ่ของ [kiyomori_taira.GetDynasty.GetNameNoTooltip] นั้นใหญ่หลวงนัก ตระกูล [ruler.GetDynasty.GetNameNoTooltip] ต้องรวมเป็นหนึ่งเพื่อเอาชนะพวกมัน"

 tgp_genpei_character.1100.t: "$genpei_intro$ เก็นจิผู้ดุร้าย"
 tgp_genpei_character.1100.desc: "เมื่อบิดาข้าพ่ายแพ้ต่อ [kiyomori_taira.GetFirstName] แห่งตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ใน [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )], ข้าถูกบีบให้ใช้ชีวิตเยี่ยง [Glossary( 'โรนิน', 'RONIN_GLOSS' )] ในภูเขาทางเหนือ ที่นี่ [hidehira_fujiwara.GetFirstName] แห่ง [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS') ] ผู้ทรงอำนาจ ได้ให้ที่พักพิงแก่ข้า\n\nการครอบงำราชสำนักของ [kiyomori_taira.GetFirstNamePossessiveNoTooltip] เป็นลางบอกถึงยุคแห่งความเป็นใหญ่โดยสิ้นเชิงของตระกูล [kiyomori_taira.GetDynasty.GetNameNoTooltip] เมื่อเผชิญกับสิ่งนี้ ผู้นำในนามของ [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] [yorimasa_minamoto.GetFirstName] ก็สร้างความอับอายแก่เราด้วยความขี้ขลาด โชคยังดีที่ พี่ชายของข้า [yoritomo_minamoto.GetFirstName] มีดาบแห่งตระกูลซามูไรฝ่ายตะวันออกและเตรียมพร้อมที่จะโค่นล้มทรราช\n\nเหนือสิ่งอื่นใด ข้าหวังว่าพายุที่กำลังจะมาถึงนี้จะนำคู่ต่อสู้ที่คู่ควรกับคมดาบของข้ามาให้!"
 tgp_genpei_character.1100.a: "ข้าจะรับใช้ [hidehira_fujiwara.GetFirstNameNoTooltip] ไปก่อน"
 tgp_genpei_character.1100.b: "ตระกูลของข้าต้องการการสนับสนุนจากข้า"
 tgp_genpei_character.1100.c: "โชคชะตาทิ้งเส้นทางแห่งดาบไว้ให้ข้า"
 stay_duelist_adventurer: "#help ยิ่งชนะการประลองมากเท่าใด ค่าปรับแต่งข้างต้นก็จะยิ่งแข็งแกร่งขึ้นเท่านั้น#!"

 tgp_genpei_character.2000.t: "$genpei_intro$ ผีเสื้อผู้ทะยาน"
 tgp_genpei_character.2000.desc: "[GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] คือภาพสะท้อนแห่งเจตจำนงของข้า กลอุบายของข้า และอำนาจของ [Glossary( 'ไทระ', 'TAIRA_GLOSS' )]! ไม่มีสิ่งใดรอดพ้นจากข้า เว้น แต่ [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noriko_taira'))] ของข้า [noriko_taira.GetFirstName] ในไม่ช้าจะสกัดเมล็ดพันธุ์จาก [norihito_tenno.GetTitledFirstName] ผู้เยาว์วัยของเรา ครรภ์อันทรงพลังของ [noriko_taira.GetHerHis|U] จะให้กำเนิดทายาทที่มีสายเลือด [ROOT.Char.GetHouse.GetBaseName] พลุ่งพล่านในเส้นเลือด ทายาทผู้พร้อมที่จะเหยียบย่ำทุกคนที่จะท้าทายความเป็นใหญ่ของเรา รับประกันความรุ่งโรจน์ของเราตลอดไป!"
 tgp_genpei_character.2000.a: "ตอนนี้ จงเอาใจเหล่าลูกแกะไปก่อน"
 tgp_genpei_character.2000.b: "วางยาในบ่อน้ำ..."
 tgp_genpei_character.2000.b.flavor: "ท่านใส่ร้าย [norihito_tenno.GetTitleAsName] โดยหวังว่ามันจะ ทำให้การบังคับสละราชสมบัติในอนาคตราบรื่นขึ้น"
 every_non_taira_vassal: "ทุก [dynasty|E] [vassal|E] ที่ไม่ใช่ [GetDynastyByID('japanese_taira_kanmu').GetName] ของ [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U]"
 tgp_genpei_character.2000.c: "บำรุงเด็กชายด้วยน้ำนมชั้นดี!"
 tgp_genpei_character.2000.c.flavor: "ทายาทคนใหม่ต้องมีร่างกายแข็งแรง หากเขาจะต้องครองบัลลังก์ตั้งแต่แรกเกิด"

 tgp_genpei_character.2010.t: "$genpei_intro$ ทางแยกแห่งอำนาจ"
 tgp_genpei_character.2010.desc: "ทายาทสายเลือดของข้า! [new_emperor.GetTitledFirstName] ถือกำเนิดแล้ว พร้อมที่จะขึ้นสู่ [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] มันง่ายดายเพียงแค่เขี่ย [current_emperor.GetTitledFirstName] ทิ้งไป แม้จะถูกต้อง แต่การกระทำ เช่นนั้นอาจก่อให้เกิดกบฏ...\n\nแผ่นดินนี้เต็มไปด้วยพวกไม่พอใจที่คิดคดทรยศ! ตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ที่ดื้อรั้นของ [minamoto_ruler.GetFirstNamePossessive] ยังคงเจ็บแค้นจากความพ่ายแพ้ใน [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )] [motofusa_fujiwara.GetFirstName] แม้จะอ่อนแอลง แต่ก็โหยหาวันที่ [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS') ] ครอง [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] ที่ใกล้หัวใจข้าที่สุดคือบิดาของจักรพรรดิ [Glossary( 'โจโค', 'JOKO_GLOSS') ] [go_shirakawa.GetFirstName] เจ้าเล่ห์ ผู้เคยเป็นพันธมิตรใกล้ชิด บัดนี้กลับตั้งคำถามถึงแรงจูงใจของข้า ข้าควรดำเนินไปในเส้นทางใด?"
 tgp_genpei_character.2010.a: "ผลจะเป็น เช่นไรช่างมัน วันนี้คือการเริ่มต้นแห่งความยิ่งใหญ่ของไทระ!"
 tgp_genpei_character.2010.b: "การทำลายล้างตระกูล [minamoto_ruler.GetDynasty.GetNameNoTooltip] คือภารกิจสำคัญที่สุด"
 tgp_genpei_character.2010.b.flavor: "ท่านจะหาอุดมการณ์ร่วมกับ [fujiwara_ruler.GetDynasty.GetName] และกำจัดเศษซากสุดท้ายของตระกูล [minamoto_ruler.GetDynasty.GetName] ผู้ทรยศ"
 tgp_genpei_character.2010.c: "ความเป็นใหญ่ของซามูไรจะแก้ปัญหาทุกอย่าง"
 tgp_genpei_character.2010.c.flavor: "ท่านจะรวมเป็นหนึ่งกับ [minamoto_ruler.GetDynasty.GetName] ไม่เหลือความหวังให้พวกขุนนางอย่าง [fujiwara_ruler.GetDynasty.GetName] กลับมาควบคุมอำนาจได้อีก"
 tgp_genpei_character.2010.d: "จุดไฟพันธมิตรที่แข็งแกร่งที่สุดของข้าขึ้นมาใหม่"
 tgp_genpei_character.2010.d.flavor: "ไม่ว่าจะยามทุกข์หรือสุข [go_shirakawa.GetName] และข้าได้ฟันฝ่าอุปสรรคทั้งปวงมาด้วยกัน และเราจะทำ เช่นนั้นอีกครั้ง!"
 minamoto_clan_will_respond_to_our_actions: "#warning @warning_icon! [GetDynastyByID('japanese_minamoto_seiwa').GetName] Bloc จะต้องตอบสนองอย่างแน่นอน#!"

 tgp_genpei_character.3000.t: "$genpei_intro$ วิสทีเรียที่กระจัดกระจาย"
 tgp_genpei_character.3000.desc: "ถูกลดขั้นจาก [GetTitleByKey('b_kyo').GetBaseNameNoTier] ไปยังพื้นที่ห่างไกลอย่าง [GetTitleByKey('c_oki').GetBaseNameNoTierNoTooltip] ช่างไม่ยุติธรรม! [kiyomori_taira.GetFirstName] แห่งตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ที่ชั่วช้าและเจ้าเล่ห์ คือบ่อเกิดแห่งความทุกข์ทรมานของข้าและการลบหลู่ตระกูล [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS') ]!\n\nหลังจากที่เราช่วยกำจัด [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ใน [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )] [kiyomori_taira.GetSheHe] ก็ฉวยโอกาสจากอาการป่วยของ [motozane_fujiwara.GetFirstNamePossessive] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('motozane_fujiwara'))] ของข้า เพื่อแบ่งแยกดินแดนของเราและรวบอำนาจ ไม่พอใจกับการเป็น [Glossary( 'ไดโจ-ไดจิน', 'DAIJO_DAIJIN_GLOSS' )] มันยังส่งบุตรี [kiyomori_taira.GetHerHis] ไปสมรสกับ [norihito_tenno.GetTitledFirstName] ในอุบายโจ่งแจ้งที่จะควบคุมบัลลังก์\n\nความหวังเดียวของข้าในการโค่นล้มทรราชผู้นี้คือ [Glossary( 'โจโค', 'JOKO_GLOSS') ] [go_shirakawa.GetFirstName] ผู้เฒ่าเจ้าเล่ห์ บิดาของ [norihito_tenno.GetTitleAsNamePossessiveNoTooltip] และพันธมิตรเก่าแก่ของเรา... หรือ [hidehira_fujiwara.GetFirstName] ผู้อยู่แดนไกล และตระกูล [hidehira_fujiwara.GetDynasty.GetName] อันแข็งแกร่งของ [hidehira_fujiwara.GetHerHis] ทางเหนือ"
 DAIJO_DAIJIN_GLOSS: "#bold ไดโจไดจิน#! — #EMP อัครมหาเสนาบดี#! — เป็นประมุขของ #EMP ไดโจกัง#! — #EMP สภาแห่งรัฐ#! — ตำแหน่งอันทรงเกียรติในยุคนารา (710-794)\n\nตำแหน่งนี้ถูกรื้อฟื้นโดย [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] คิโยโมริ ให้เป็นตำแหน่งสูงสุดนอกราชวงศ์ และเป็นประมุขรัฐบาลในทางพฤตินัย"
 tgp_genpei_character.3000.a: "ทุกคนจะได้รู้ถึงบาปของ [kiyomori_taira.GetFirstNamePossessiveNoTooltip]!"
 tgp_genpei_character.3000.a.flavor: "จะต้องยังมี [motofusa_fujiwara.GetTitleAsNameNoTooltip] ผู้เคารพในขนบธรรมเนียมและสิทธิ์ของชนชั้นสูงแห่ง [GetTitleByKey('b_kyo').GetBaseNameNoTier] อยู่"
 tgp_genpei_character.3000.b: "[go_shirakawa.GetFirstNameNoTooltip] ยังสามารถฟื้นฟูสติสัมปชัญญะกลับคืนมาได้"
 tgp_genpei_character.3000.b.flavor: "อดีตจักรพรรดิได้กุมหางเสือแห่งรัฐมานานก่อนที่ท่านจะเกิดเสียอีก"
 send_letter_to_go_shirakawa: "ท่านส่งสาส์นถึง [go_shirakawa.GetName]"
 tgp_genpei_character.3000.c: "ชาว [motofusa_fujiwara.GetDynasty.GetNameNoTooltip] ทุกคน ไม่ว่าจะต่ำต้อยเพียงใด ต้องโหยหาความยุติธรรม"
 tgp_genpei_character.3000.c.flavor: "ขอให้วิสทีเรียเติบโตอย่างไร้ขีดจำกัด จากชายฝั่งหนึ่งไปยังอีกชายฝั่งหนึ่ง โอบล้อมบัลลังก์ดัง เช่นที่อันชอบธรรมของมัน!"
 tgp_genpei_character.3010.opening: "ถึง อดีตจักรพรรดิ [go_shirakawa.GetNameNoTooltip],"
 tgp_genpei_character.3010.desc: "อาณาจักรที่ท่านเคยปกครองกำลังแตกสลายอย่างช้าๆ ตระกูลซามูไรผู้ยิ่งใหญ่ทั้งสองกำลังรวบรวมผู้สนับสนุนให้มากที่สุดเท่าที่จะทำได้ ข้ารู้ว่าท่านยังคงขมขื่นกับการปกครองแบบทรราชของตระกูล [GetDynastyByID('japanese_taira_kanmu').GetName] ตระกูล [ROOT.Char.GetDynasty.GetName] ต้องการท่าน เมื่อเราร่วมมือกัน เราจะสามารถฟื้นฟูอำนาจแห่งราชวงศ์และยุติชนชั้นซามูไรที่ไร้ระเบียบนี้ได้"
 tgp_genpei_character.3010.a: "ข้าจะไม่สามารถช่วยต่อต้านตระกูล [GetDynastyByID('japanese_taira_kanmu').GetNameNoTooltip] ได้"
 tgp_genpei_character.3010.b: "ท่านพูดถูก... ให้เรายืนหยัดต่อสู้พวกมันด้วยกัน"

 tgp_genpei_character.3100.t: "$genpei_intro$ วิสทีเรียนอกคอก"
 tgp_genpei_character.3100.desc: "ตระกูล [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] ผู้หยิ่งยโสในเมืองหลวงเคยเยาะเย้ยพวกเรา #EMP "ใครกันจะละทิ้งเครื่องประดับและพระราชวังแห่ง [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] เพื่อไปอยู่แคว้นทางเหนืออันรกร้าง?"#! พวกขุนนางเหล่านั้นช่างโง่เขลาเพียงใด...\n\n[motofusa_fujiwara.GetFirstName] บัดนี้เป็น [Glossary( 'คัมปะคุ', 'KAMPAKU_GLOSS' )] เพียงในนาม — อ่อนแอเกินกว่าจะท้าทาย [kiyomori_taira.GetFirstName] เจ้าเล่ห์ ผู้ประกาศตนเป็น [Glossary( 'ไดโจ-ไดจิน', 'DAIJO_DAIJIN_GLOSS' )] และผู้ชักใย [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] ที่แท้จริง ในไม่ช้า ตระกูล [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] จะไม่มีใครหยุดยั้งได้ และใครจะรู้ว่าเมื่อใดที่ดินแดนของข้าจะถูกท้าทาย? มันตกเป็นหน้าที่ของข้าหรือไม่ที่จะต้องช่วยราชวงศ์ให้พ้นจากเงื้อมมือของไทระ และนำมา ซึ่งระเบียบใหม่ของฟูจิวาระ?\n\nบางที [yoshitsune_minamoto.GetTitledFirstName] แห่ง [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ผู้นอกคอก อาจพิสูจน์ได้ว่าเป็นพันธมิตรที่มีประโยชน์ในการต่อต้านศัตรูร่วมกันนี้..."
 tgp_genpei_character.3100.a: "ข้าควรยอมรับตำแหน่งปัจจุบันของข้า"
 tgp_genpei_character.3100.b: "การปกป้องอิสรภาพไม่ใช่การกระทำที่เห็นแก่ตัว!"

 tgp_genpei_character.4000.t: "$genpei_intro$ เบญจมาศร่วงโรย"
 tgp_genpei_character.4000.desc: "ภายใต้การดูแลของข้า [kiyomori_taira.GetFirstName] ได้กลายเป็นผู้ปกครองญี่ปุ่นที่ไร้ผู้ท้าทาย ข้าช่างโง่เขลานัก ที่ปล่อยให้ [kiyomori_taira.GetHerHim] บิดเบือนความทะเยอทะยานของข้าเพื่อเบียดขับเหล่าผู้สำเร็จราชการ [Glossary( 'ฟูจิวาระ', 'FUJIWARA_GLOSS' )] เพียงเพื่อยึดอำนาจไว้เอง [kiyomori_taira.GetHerselfHimself]\n\nบุตรชายของข้า [norihito_tenno.GetTitledFirstName] ยังคงอยู่บน [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] แต่จะอีกนานเท่าใด? [noriko_taira.GetFirstName], [noriko_taira.Custom('WifeHusband')] ของ [norihito_tenno.GetHerHis] และบุตรีของ [kiyomori_taira.GetFirstNamePossessiveNoTooltip] ไม่ต้องสงสัยเลยว่าจะให้กำเนิดทายาทที่ควบคุมได้ง่ายกว่าในไม่ช้า\n\nอิทธิพลที่เคยไร้ขอบเขตของข้าในฐานะ [Glossary( 'โจโค', 'JOKO_GLOSS' )] บัดนี้ตกต่ำลง เมื่อ [motofusa_fujiwara.GetFirstName] ถูกเนรเทศและเป็น [Glossary( 'คัมปะคุ', 'KAMPAKU_GLOSS' )] เพียงในนาม, และตระกูล [Glossary( 'มินาโมโตะ', 'MINAMOTO_GLOSS' )] ถูกบดขยี้โดย [Glossary( 'ไทระ', 'TAIRA_GLOSS' )] ในช่วง [Glossary( 'กบฏเฮจิ', 'HEIJI_REBELLION_GLOSS' )], มันยากที่จะจินตนาการว่าจะมีผู้ใดลุกขึ้นยืนหยัดต่อต้านตระกูลไทระผู้ยิ่งใหญ่..."
 tgp_genpei_character.4000.a: "ข้าจะไม่ทนต่อสิ่งนี้อีกต่อไป"
 tgp_genpei_character.4000.b: "การรอคอยคือสิ่งที่ดีที่สุดสำหรับตอนนี้"
