l_english: 
 debate_event.1000.t: "การจัดเตรียมเวที"
 debate_event.1000.desc_intro_host: "เหล่าบัณฑิตจากทั่วทั้งดินแดนได้มาชุมนุมกัน"
 debate_event.1000.desc_intro_fallback: "ข้าได้มาถึงแล้ว"
 debate_event.1000.desc_outro: "ณ [ROOT.Char.GetCurrentLocation.GetName] เพื่อการโต้วาที\n\nบัดนี้ เหล่านักโต้วาทีต่างซักซ้อมสุนทรพจน์ของตนเป็นกลุ่มก้อน, ตระกูลใหญ่ทั้งหลายต่างออกหาที่พักอันเลิศหรูที่สุด, ขณะที่ขบวนเกวียนบรรทุกผักและเนื้อสัตว์เคลื่อนขบวนอย่างอึกทึกไปยังตลาด\n\nถึงเวลาที่ข้าจะต้องเตรียมตัว เช่นกัน"
 debate_event.1000.a: "มัวช้ามิได้!"
 debate_event.1000.a.success_desc: "การเตรียมตัวอันยอดเยี่ยม"
 debate_event.1000.b: "ข้าควรออกสำรวจนคร"
 debate_event.1000.c: "ช่างเป็นโอกาสอันดีที่จะได้พักผ่อน"

 debate_event.1010.t: "การโต้วาทีเริ่มขึ้นแล้ว"
 debate_event.1010.desc: "เหล่าบัณฑิตหลั่งไหลเข้ามาในโถงโต้วาที, เหล่าศิษย์เดินตามผู้อาวุโสของตน, แขนรับน้ำหนักม้วนคัมภีร์หนาหนักแทบไม่ไหว คู่โต้วาทีของข้า [debate_opponent.GetTitledFirstName] ยืนเตรียมพร้อมอยู่อีกฟากหนึ่งของโถง, รายล้อมไปด้วยสมาชิก [opponent_movement.GetName] คนอื่นๆ\n\nไม่มีเวลาสำหรับการเตรียมตัวอีกต่อไป ในการโต้วาทีครั้งนี้ ข้าต้องอาศัยไหวพริบของตนเพื่อคว้าชัย"
 debate_event.1010.a: "นี่คือเวลาของข้า"

 debate_event.1015.t: "$debate_event.1010.t$"
 debate_event.1015.desc: "ข้าเดินฝ่าฝูงชน, หวังว่าจะได้จุดชมที่ดีสำหรับการโต้วาทีที่กำลังจะเกิดขึ้น กลุ่ม [my_movement.GetName] ยึดพื้นที่อยู่อีกฟากของโถงโต้วาที หลังจากการขยับเขยื้อนและเสียงพึมพำอยู่ครู่หนึ่ง, ข้าก็พบว่าตนเองอยู่ท่ามกลางพวกพ้อง\n\n[debate_contender.GetTitledFirstName] และ [debate_opponent.GetTitledFirstName] ยืนเผชิญหน้ากัน, พร้อมที่จะพิสูจน์ตนเองในฐานะ"
 debate_event.1015.desc_favor: "คนโปรดของ [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]"
 debate_event.1015.desc_leadership: "ผู้นำของ [contender_movement.GetNameNoTooltip]"
 debate_event.1015.a: "ผู้ใดกันจักเป็นผู้ชนะ"

 debate_event.1100.t: "การโต้วาทียกเลิก"
 debate_event.1100.desc_death: "ดูเหมือนว่า [debate_opponent.GetTitledFirstName] ได้ถึงแก่กรรมเสียแล้ว เมื่อไม่มีผู้ใดให้โต้วาทีด้วย, การโต้วาทีจึงถูกยกเลิกไป"
 debate_event.1100.desc_fallback: "ข้าเพิ่งได้รับข่าวว่าการโต้วาทีถูกระงับไว้ สาเหตุนั้นไม่ชัดเจน, นอกเสียจากข้อเท็จจริงที่ว่ามันไม่สามารถดำเนินต่อไปได้ในยามนี้"
 debate_event.1100.a: "ช่างเป็นข่าวที่น่าเสียดายยิ่ง"

 debate_event.2000.t: "ความเขลาอันเกิด แต่ทิฐิ"
 debate_event.2000.desc: "เสียงที่ดังขึ้นดึงดูดข้าเข้าไปในโถงศึกษาแห่งหนึ่ง, ที่ ซึ่งข้าพบ [ROOT.Char.Custom2('RelationToMe', talent )] ของข้า [talent.GetTitledFirstName] กำลังชี้ไม้ชี้มือไปยังฝูงชนที่มุงอยู่ "พวกท่านที่มา ณ ที่นี้ในวันนี้ มิได้มาเพื่อถกเถียงเชิงวิชาการอย่างแท้จริง, แต่มาเพื่อโอ้อวดและอ้างความเหนือกว่าผู้อื่น!"\n\n[talent.GetSheHe|U] พูดด้วยความเชื่อมั่น เช่นเดียวกับที่ข้าได้ยินจาก [talent.GetHerHim] มาทั้งวัน ใบหน้าของ [talent.GetHerHis|U] สั่นเทาด้วยอารมณ์ที่แทบจะเก็บไว้ไม่อยู่ [talent.GetWomanMan] ผู้นี้แสดงให้เห็นถึงแววแห่งปัญญาอันเฉียบแหลม, แม้ว่าอารมณ์ร้อนนั้นอาจพิสูจน์ได้ว่ารับมือยากก็ตาม"
 debate_event.2000.a: "พรสวรรค์ของ [talent.GetHerHis|U] จะเบ่งบานภายใต้การชี้แนะของข้า"
 debate_event.2000.b: "เราทุกคนควรน้อมรับวาจาของ [talent.GetHerHis] ด้วยความถ่อมตน"

 debate_event.2010.t: "อิทธิพลของ [elder_movement.GetNameNoTooltip]"
 debate_event.2010.desc: ""ข้าต้องขอบอกว่า, การตีความ [ROOT.Char.Custom('GetRandomHistoryPassage')] ของท่านช่างกระตุ้นความสนใจของข้ายิ่งนัก," [elder.GetTitledFirstName] บอกกับข้าเมื่อสิ้นสุดวันที่ยาวนานของการสนทนาฉันมิตร "ข้ามั่นใจว่า, หากเราวางความแตกต่างไว้ข้างๆ, ยังมีอีกมากที่เราสามารถเรียนรู้จากกันและกันได้"\n\nบรรยากาศอันเป็นมิตรในการสนทนาของเรามัก ทำให้ข้าลืมไปว่า [elder.GetSheHe] อยู่ในกลุ่ม [elder_movement.GetNameNoTooltip] — ข้อเท็จจริงที่ข้าถูกเตือนสติ เมื่อสมาชิกร่วมกลุ่ม [my_movement.GetNameNoTooltip] คนหนึ่งเหลือบมองมาทางข้าอย่างมีความหมาย"
 debate_event.2010.a: ""ข้าเห็นด้วยอย่างที่สุด""
 debate_event.2010.b: ""ความแตกต่างบางประการมิอาจมองข้ามได้""

 debate_event.2020.t: "การแลกเปลี่ยนฉันมิตร"
 debate_event.2020.desc: "[movement_member.GetTitledFirstName] สมาชิกร่วมกลุ่ม [my_movement.GetName] ของข้าเดินเข้ามาพร้อมกับชายหลังค่อมผู้หนึ่ง, ซึ่งก้มศีรษะทักทาย "ข้าได้ยินมาว่าท่านกำลังมองหาผู้มีความสามารถเข้าร่วมคณะผู้ติดตาม," [movement_member.GetFirstNameNoTooltip] กล่าว "ข้าเชื่อว่า [disciple.GetTitledFirstName] อาจเป็นตัวเลือกที่เหมาะสม"\n\n[disciple.GetFirstNameNoTooltip] [disciple.Custom('quirk_pos_present')] และกล่าวว่า, "นับเป็นเกียรติอย่างยิ่งที่จะได้รับใช้ท่าน, [ROOT.Char.GetLadyLord] ของข้า""
 debate_event.2020.a: ""ข้ามีหลายสิ่งที่จะสอน [disciple.GetHerHim]""
 debate_event.2020.b: ""มิตรภาพของท่านคือสิ่งเดียวที่ข้าปรารถนา""
 friend_given_disciple_reason: "[CHARACTER.GetShortUIName|U] ได้รับศิษย์คนหนึ่งจาก [TARGET_CHARACTER.GetShortUIName] ที่การโต้วาที"
 friend_given_disciple_reason_corresponding: "$friend_given_disciple_reason$"

 debate_event.5000.t_imperial_debate: "ความโปรดปรานแห่งจักรวรรดิ"
 debate_event.5000.t_movement_debate: "ตำแหน่งผู้นำ [host.Custom('GetMyMovementNoTooltip')]"

 debate_event.5000.desc_imperial: "เหล่าขุนนางผู้ใหญ่และผู้ชมยืนเรียงรายตามผนังโถงโต้วาที, จับจ้องมาที่ข้าขณะที่ข้าเคลื่อนตัวไปยืนอยู่เบื้องหน้า [debate_opponent.GetTitledFirstName] เราโค้งคำนับให้กันและกันอย่างพร้อมเพรียง, แขนเหยียดตรง, หลังโค้งงอ\n\nข้าควรฉวยโอกาสนี้และเป็นฝ่ายแรกที่เสนอข้อโต้แย้ง"
 debate_event.5000.desc: "เวทีได้ถูกจัดเตรียมและเหล่าผู้ชมได้เข้าประจำที่แล้ว [debate_opponent.GetTitledFirstName] ลุกขึ้นจากที่นั่งของ [debate_opponent.GetHerHis] เพื่อกล่าวกับฝูงชน, สมาชิกร่วมกลุ่ม [host.Custom('GetMyMovement')] ของเรา\n\n"เรามาที่นี่เพื่อหารือเกี่ยวกับลำดับความสำคัญและทิศทางของ [host.Custom('GetMyMovement')] ผลลัพธ์ของการโต้วาทีครั้งนี้จะเป็นตัวกำหนดผู้นำด้วย เช่นกัน""

 debate_event.5000.a: "ข้าจะปกครองโดยยึดมั่นตามคำสอนของขงจื๊อ"
 debate_event.5000.b: "ตรรกะและเหตุผลจะนำมา ซึ่งชัยชนะ"
 debate_event.5000.c: "ดีล่ะ #EMP บัดนี้#! ถึงเวลาที่จะ..."
 debate_event.5000.d: "การขาดภาวะผู้นำของท่านจะนำมา ซึ่งหายนะ!"
 debate_event.5000.a.flavor: "ใช้ประโยชน์จากประสบการณ์ของท่านใน [GetTrait('confucian_education').GetName( GetNullCharacter )] [trait|E] - ประสบการณ์ที่สูงกว่าหมายถึงความสำเร็จที่สูงกว่า"
 debate_event.5000.c.flavor: "ตามที่ได้สั่งการไว้, เหล่า [disciples|E] ของท่านจะพยายามปลุกเร้าผู้ชมในจังหวะที่เหมาะสม - หวังว่า, ศิษย์ของ [debate_opponent.GetShortUINamePossessive] เองจะไม่เข้ามายุ่งขัดขวาง..."
 debate_event.5000.d.success_desc: "ท่านให้เหตุผลได้อย่างน่าเชื่อถือ"
 debate_event.5000.d.failure_desc: "ท่านให้เหตุผลได้ไม่น่าเชื่อถือ"

 debate_event.5010.insult_desc: "[debate_opponent.GetTitledFirstName] ไม่รอช้าและเริ่มร่ายข้อกล่าวหาและคำสบประมาทต่างๆ นานาในทันที, ประกาศว่า #EMP ข้า#! ไม่เหมาะสมที่จะเป็นผู้นำไม่ว่าด้วยประการใด\n\nไร้สาระ! ไม่มีอะไรนอกจากการพยายามบ่อนทำลายอำนาจของข้าอย่างมีเล่ห์เหลี่ยม"
 debate_event.5010.confucian_desc: "[debate_opponent.GetTitledFirstName] พูดอย่างใจเย็นเกี่ยวกับขงจื๊อและวิธีที่คำสอนของท่านควรนำพาเราไปข้างหน้า"
 debate_event.5010.desc: "[debate_opponent.GetTitledFirstName] พูดถึงตรรกะและเหตุผล, และวิธีที่เราควรใช้บทเรียนก่อนหน้าเพื่อกำหนดอนาคตใหม่ให้กับดินแดน"
 debate_event.crowd_approval_desc: "\n\nเหล่าผู้ชมพยักหน้าเห็นด้วย"
 debate_event.crowd_disapproval_desc: "\n\nเหล่าผู้ชมส่ายหน้าไม่เห็นด้วย"
 debate_event.5010.a: "ยืนกรานในแนวทางเดิมของข้า"
 debate_event.5010.b: "บางทีวาจาของขงจื๊ออาจโน้มน้าวพวกเขาได้?"
 debate_event.5010.c: "แนวทางที่ #EMP มีเหตุผล#! กว่าน่าจะ ทำให้พวกเขากระจ่างแจ้งได้"
 debate_event.5010.d: "ให้เหล่าศิษย์ของข้าเริ่มทำงาน"
 debate_event.5010.e: "เมื่อสิ้นไร้หนทาง, การสบประมาทย่อมได้ผล"

 debate_event.5100.t_winner: "- ชัยชนะ!"
 debate_event.5100.t_loser: "- ความพ่ายแพ้!"
 debate_event.5100.desc_winner: "หลังจากการเตรียมตัวอย่างรอบคอบและการดำเนินการอย่างเชี่ยวชาญ, ข้าได้รับการประกาศให้เป็นผู้ชนะการโต้วาที!\n\n[debate_loser.GetTitledFirstName] โค้งคำนับอย่างห้วนๆ ทว่ายังเป็นทางการ ก่อนจะกล่าวกับข้า: "ข้าคิดว่าคงต้องแสดงความยินดีด้วย ผู้อื่นจะมองมาที่ท่านเพื่อนำพวกเขาในไม่ช้า ข้าเพียงขอให้ท่านกระทำ เช่นนั้นด้วยความรับผิดชอบสูงสุด""
 debate_event.5100.desc_loser: "แม้ว่าข้าจะพยายามอย่างเต็มที่แล้ว, [debate_winner.GetTitledFirstName] ก็ได้รับการประกาศให้เป็นผู้ชนะการโต้วาที ด้วยเหตุนี้, [debate_winner.GetSheHe] จะยังคงเป็นผู้นำโดยพฤตินัยของ [my_movement.GetNameNoTooltip] ต่อไป\n\nหลังจากได้รับคำแสดงความยินดีรอบหนึ่ง, ในที่สุด [debate_winner.GetSheHe] ก็หันความสนใจของ [debate_winner.GetHerHis] มาที่ข้า\n\n"มิใช่ทุกคนที่มีชะตาให้เป็นผู้นำ แต่จงอย่ากังวลไป, เวลาของท่านอาจจะมาถึงในภายหน้า""
 debate_event.5100.desc_unexpected_winner: "ในเหตุการณ์ที่พลิกผันอย่างไม่คาดคิด, #EMP ข้า#! ได้รับการประกาศให้เป็นผู้มีชัย [debate_loser.GetTitledFirstName] มองมาที่ข้า, และข้าก็มองไปที่ [debate_loser.GetHerHim], ทั้งคู่ต่างตกตะลึงพอกัน เราได้ยินถูกต้องหรือไม่? ใช่, ใช่แล้ว\n\nชั่วครู่หนึ่ง, หลังจากที่ตั้งสติ [debate_loser.GetHerselfHimself] ได้อย่างเห็นได้ชัด, [debate_loser.GetFirstNameNoTooltip] ก็กล่าวกับข้า; "ข้าคิดว่าคงต้องแสดงความยินดีด้วย ถึง แม้ว่า, ข้าไม่สามารถหยั่งรู้ได้ว่าเหตุใดจึงมีคนประกาศให้ท่านเป็นผู้ชนะ...""
 debate_event.5100.desc_unexpected_loser: "ในเหตุการณ์ที่พลิกผันอย่างไม่คาดคิด, [debate_winner.GetTitledFirstName] ได้รับการประกาศให้เป็น #EMP ผู้มีชัย#! [debate_winner.GetFirstNameNoTooltip] มองมาที่ข้า, และข้าก็มองไปที่ [debate_winner.GetHerHim], ทั้งคู่ต่างตกตะลึงพอกัน เราได้ยินถูกต้องหรือไม่? ใช่, ใช่แล้ว\n\nหลังจากได้รับคำแสดงความยินดีรอบหนึ่ง, โดยที่ [debate_winner.GetHerHis] ยังคงมีสีหน้าประหลาดใจ, [debate_loser.GetFirstNameNoTooltip] กล่าวกับข้า; "ข้ารู้สึกว่าท่านทำได้อย่างน่าชื่นชม แม้ว่า, ด้วยเหตุผลใดก็ตาม, ท่านจะไม่สามารถชนะในวันนี้ได้""
 debate_event.5100.a: "ตอนนี้, ข้าขอเพลิดเพลินกับช่วงเวลานี้ก่อน"
 debate_event.5100.b: "ข้าคงต้องพยายามใหม่อีกครา..."

 debate_event.5110.t: "- การตัดสินผู้ชนะ"
 debate_event.5110.desc: "การโต้เถียงดำเนินไปมาระหว่างคู่โต้วาทีทั้งสองอยู่พักใหญ่ พวกเขาอ้างตรรกะ, พูดถึงอนาคตของดินแดน, และ, ไม่วายมีการสบประมาทเป็นครั้งคราว, พิจารณาคุณสมบัติของผู้นำ\n\nเมื่อการโต้วาทีสิ้นสุดลง, [debate_winner.GetTitledFirstName] ดูเหมือนจะมีเหตุผลที่หนักแน่นกว่าและควรจะเป็นผู้ชนะโดยธรรมชาติ\n\nอย่างไรก็ตาม, ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip], มันอยู่ในขอบเขตอำนาจของข้าที่จะประกาศผู้มีชัยตามที่ข้าเห็นสมควร"
 debate_event.5110.a: "[debate_winner.GetNameNoTooltip] คือผู้ชนะอย่างแท้จริง"
 debate_event.5110.a.tt: "[winning_movement.GetNameNoTooltip] กลายเป็น [favored_movement|E]"
 debate_event.5110.b: "#EMP อันที่จริง#!, ข้าคิดว่า [debate_loser.GetNameNoTooltip] เป็นฝ่ายชนะ"
 
 debate_event.5120.desc_winner: "หลังจากหยุดพักชั่วครู่, ผู้ประกาศสรุปการโต้วาที และ, โดยไม่ได้กล่าวอย่างชัดแจ้ง, ทำให้ชัดเจนว่าข้าคือผู้ชนะการโต้วาที อย่างไรก็ตาม, มันไม่ใช่การตัดสินใจของผู้ประกาศ"
 debate_event.5120.desc_loser: "หลังจากหยุดพักชั่วครู่, ผู้ประกาศสรุปการโต้วาที และ, โดยไม่ได้กล่าวอย่างชัดแจ้ง, ทำให้ชัดเจนว่า [debate_winner.GetTitledFirstName] คือผู้ชนะการโต้วาที"
 debate_event.5120.bridge_hegemon_available: "ทุกศีรษะหันไปยัง [ROOT.Char.GetTopLiege.GetName]"
 debate_event.5120.bridge_fallback: "\n\nทูตรีบรุดออกไปส่งสาส์นถึง [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], และกลับมาพร้อมข่าวที่ว่า"
 debate_event.5120.desc_liege_confirm: "\n\n"ข้าเห็นด้วย [debate_winner.GetFirstNameNoTooltip] เป็นผู้ชนะที่คู่ควร, ผู้ ซึ่งนำพาการโต้วาทีด้วยทักษะและเล่ห์เหลี่ยมอย่างที่สุด""
 debate_event.5120.desc_liege_confirm_fallback: "ราชสำนักแห่งจักรวรรดิเห็นสมควรว่า [winning_movement.GetNameNoTooltip] คู่ควรแก่ความโปรดปรานของจักรวรรดิ"
 debate_event.5120.desc_liege_intervene: "\n\n"ข้าขอประกาศให้ [declared_winner.GetTitledFirstName] เป็นผู้มีชัยในการโต้วาทีวันนี้""
 debate_event.5120.a: "ข้ายินดีที่ท่านคิด เช่นนั้น, [ROOT.Char.GetTopLiege.GetLadyLord] ของข้า!"
 debate_event.5120.b: "หา? ข้าหมายถึง, แน่นอน ขอบคุณ, [ROOT.Char.GetTopLiege.GetLadyLord] ของข้า!"
 debate_event.5120.c: "ช่าง... น่าผิดหวังยิ่งนัก"
 
 tgp_dynastic_cycle_decision_event.0082.a: "ตำแหน่งของเรายังคงมั่นคง... ในตอนนี้"
 tgp_dynastic_cycle_decision_event.0082.b: "เฮ้อ ข้านึกว่าเราจะย่ำแย่เสียแล้ว"
 tgp_dynastic_cycle_decision_event.0082.c: "[ROOT.Char.GetTopLiege.GetSheHe] ตัดสินใจ เช่นนั้นได้อย่างไร?!"

