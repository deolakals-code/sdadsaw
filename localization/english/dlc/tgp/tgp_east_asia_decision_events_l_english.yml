l_english: 
 tgp_east_asia_decision_events.0010.t: "ขอบฟ้าใหม่"
 tgp_east_asia_decision_events.0010.desc: "บางครั้ง การรู้แจ้งก็อาจมาจากแหล่งที่คาดไม่ถึงที่สุด\n\nวิถีแห่งมณฑลในการปกครองอาณาจักรนั้นสอดคล้องกับตัวข้า... ในภพภูมิที่สูงส่งยิ่งกว่า แน่นอนว่าการดำรงอยู่ของข้าย่อมรับใช้จุดประสงค์ที่ยิ่งใหญ่กว่า นั่นคือการรวบรวมอาณาจักรให้อยู่ภายใต้การปกครองอันศักดิ์สิทธิ์และเปี่ยมเมตตาของข้า\n\n#EMP 'เทวราชา [ROOT.Char.GetFirstNameNoTooltip] จงเจริญ'#! ฟังดูไพเราะดีแท้..."
 tgp_east_asia_decision_events.0010.a: "จงให้ #EMP สิ่งนี้#! เป็นโองการแรกของข้า"
 tgp_east_asia_decision_events.0010.b: "เขตถือครองที่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ยังไม่คู่ควรแก่เทวสถาน... #EMP ในตอนนี้#!..."
 tgp_east_asia_decision_events.0010.b_temple_citadel: "วัดของข้าตั้งตระหง่านงดงามใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] แล้ว!"
 all_tribal_holdings_will_change_to_citadels: "[tribal_holdings|E] ทั้งหมดในอาณาจักรจะเปลี่ยนเป็น [temple_citadel_holdings|E]"
 realm_capital_will_change_to_citadel: "[holding|E] ที่เป็น [realm_capital|E] จะเปลี่ยนเป็น [temple_citadel_holding|E]"

 tgp_east_asia_decision_events.0015.opening: "[overlord.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_decision_events.0015.desc: "ข้าได้ค้นพบว่าการดำรงอยู่ของข้ารับใช้จุดประสงค์ที่สูงส่งกว่า\n\nจงเข้าร่วมกับข้า และแซ่ซ้องสรรเสริญเทวราชาองค์ใหม่ของเจ้า!"
 tgp_east_asia_decision_events.0015.a: "สิ่งนี้จะนำพาอะไรมาบ้างหนอ..."

 tgp_east_asia_decision_events.0020.t: "เทวราชาของข้า"
 tgp_east_asia_decision_events.0020.desc: "ข้าได้เห็นสัญญาณแล้ว ข้ารู้ว่าสิ่งใดถูกต้อง ไม่มีภพภูมิใดที่ข้าจะไม่สนับสนุน [overlord.GetTitledFirstName] และการปกครองอันเปี่ยมเมตตาของ [overlord.GetHerHis] เหนือภพนี้\n\nเราจะปรับตัว และติดตามผู้นำทางอันศักดิ์สิทธิ์ของเราไปสู่อนาคตอันสดใสใหม่\n\n#EMP เทวราชา [overlord.GetFirstNameNoTooltip] จงเจริญ#!"
 tgp_east_asia_decision_events.0020.close_family_pre_tt: "[close_family|E] จะเปลี่ยนไปนับถือ #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.close_family_post_tt: "[close_family|E] ได้เปลี่ยนไปนับถือ #V [GetPlayer.GetOverlord.GetFaith.GetTextIcon][GetPlayer.GetOverlord.GetFaith.GetName]#!"
 tgp_east_asia_decision_events.0020.a: "จงเจริญ!"
 tgp_east_asia_decision_events.0020.b: "$tgp_east_asia_decision_events.0010.b$"

 tgp_east_asia_decision_events.0025.opening: "[liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 tgp_east_asia_decision_events.0025.desc: "ไม่มีภพภูมิใดที่ข้าจะไม่สนับสนุน [overlord.GetTitledFirstName] และการปกครองอันเปี่ยมเมตตาของ [overlord.GetHerHis] เหนือภพนี้\n\n[overlord.GetTitledFirstName|U] จงเจริญ!"
 tgp_east_asia_decision_events.0025.a: "$tgp_east_asia_decision_events.0015.a$"


 tgp_east_asia_decision_events.0030.t: "การรับวิถีแห่งวงศ์วาน"
 tgp_east_asia_decision_events.0030.desc: "สาส์นฉบับหนึ่งได้มาถึงจาก [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetLiege)] ของข้า คือ [liege.GetTitledFirstName] ในสาส์นแจ้งถึงการเปลี่ยนแปลงการปกครองเมื่อเร็วๆ นี้ และเร่งเร้าให้เราปรับตัวเข้าด้วยและสนับสนุนผู้ปกครองของเรา\n\nในฐานะข้าหลวงอันชอบธรรมของ [liege.GetTitleAsNameNoTooltip] จึงเป็นหน้าที่ของข้าที่จะต้องปฏิบัติตาม"
 tgp_east_asia_decision_events.0030.a: "จงพลิกสถานการณ์นี้ให้เป็นประโยชน์แก่เราเถิด"
 
 realm_capital_will_change_to_castle: "[holding|E] ที่เป็น [realm_capital|E] จะเปลี่ยนเป็น [castle_holding|E]"

 tgp_east_asia_decision_events.0100.t: "ผลตอบแทนแห่งศรัทธา"
 tgp_east_asia_decision_events.0100.desc: "ความรักของเราที่มีต่อเทวราชา [overlord.GetFirstNameNoTooltip] ผู้ศักดิ์สิทธิ์นั้นไร้ขอบเขต\n\n[overlord.GetLadyLord] ของเรานั้น #EMP อยู่เหนือโลกียวิสัย#! และรอบรู้สรรพสิ่ง ไม่ว่าจะในห้องพิจารณาคดีหรือในสนามรบ\n\nความคลางแคลงใจ ความลังเลของเรา... ล้วนได้รับการอภัย ล้วนได้รับการคลี่คลาย — ช่างเป็นดั่งเทพยดาที่แท้จริงท่ามกลางพวกเรา\n\nข้ารู้อยู่แล้วตั้งแต่ต้น"
 tgp_east_asia_decision_events.0100.a: "ขอให้กลีบดอกไม้ของเราไม่เหี่ยวเฉาและร่วงโรยเลย"

 failed_assimilation_payout_msg: "เทวสภาพแห่งมณฑลล้มเหลว"
 failed_assimilation_payout_msg_desc: "ท่านหรือเทวราชา [saved_devaraja.GetShortUIName] ที่ท่านให้สัญญาไว้ ไม่คู่ควรกับเทวสภาพแห่งมณฑล"

 invite_a_court_brahmin_decision: "ค้นหา $court_brahmin_court_position$"
 invite_a_court_brahmin_decision_desc: "พราหมณ์ราชสำนักคือพันธมิตรผู้ทรงอำนาจ พวกเขาจะดูแลความสัมพันธ์ด้านบรรณาการ และเป็นเข็มทิศศีลธรรมในยามยากลำบาก"
 invite_a_court_brahmin_decision_tooltip: "เหล่าข้ารับใช้ของท่านจะเสนอชื่อผู้ที่เหมาะสมจำนวนหนึ่งสำหรับตำแหน่ง [GetCourtPositionType('court_brahmin_court_position').GetName()]"
 tgp_east_asia_decision_events.0200.t: "พราหมณ์ในราชสำนัก"
 tgp_east_asia_decision_events.0200.desc: "ข่าวของข้าเดินทางไปไกลแสนไกล และในที่สุด ผู้นำทางจิตวิญญาณสองคนก็ถูกนำเข้ามาในราชสำนักของข้า\n\n[great_brahmin_option.GetTitledFirstName|U] เปล่งประกายความสงบอันเยือกเย็นและใช้เวลาครู่หนึ่งในการไตร่ตรองอย่างเงียบงัน ในขณะที่ [good_brahmin_option.GetTitledFirstName] ผู้มีประสบการณ์น้อยกว่าเล็กน้อย มองไปรอบๆ อย่างกระตือรือร้น เห็นได้ชัดว่ากระหายที่จะรับหน้าที่"
 tgp_east_asia_decision_events.0200.a: "[great_brahmin_option.GetTitledFirstNameNoTooltip|U] จะเป็นส่วนเสริมที่ยอดเยี่ยม"
 tgp_east_asia_decision_events.0200.a.aptitude: "[aptitude|E] ของ [great_brahmin_option.GetFirstNamePossessiveNoTooltip] คือ [great_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.b: "ข้าเชื่อว่า [good_brahmin_option.GetTitledFirstNameNoTooltip] มีแวว"
 tgp_east_asia_decision_events.0200.b.aptitude: "[aptitude|E] ของ [good_brahmin_option.GetFirstNamePossessiveNoTooltip] คือ [good_brahmin_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_brahmin_court_position' ) )]"
 tgp_east_asia_decision_events.0200.c: "ทั้งคู่ดูไม่น่าสนใจ"

 invite_a_khlon_glan_decision: "ค้นหา $khlon_glan_court_position$"
 invite_a_khlon_glan_decision_desc: "ถึงเวลาแล้วที่จะหาขลุนคลังที่เหมาะสมมาช่วยในการพัฒนาเมืองหลวง ควบคุมดินแดนของเรา และจัดระเบียบราชสำนักของข้า"
 invite_a_khlon_glan_decision_tooltip: "เหล่าข้ารับใช้ของท่านจะเสนอชื่อผู้ที่เหมาะสมจำนวนหนึ่งสำหรับตำแหน่ง [GetCourtPositionType('khlon_glan_court_position').GetName()]"
 tgp_east_asia_decision_events.0210.t: "ขลุนคลัง"
 tgp_east_asia_decision_events.0210.desc: "การค้นหาขลุนคลังผู้ภักดีของข้าได้ ทำให้ [great_khlon_glan_option.GetTitledFirstName] และ [good_khlon_glan_option.GetTitledFirstName] มาปรากฏตัวที่หน้าประตูข้า\n\nเราประชุมกันที่คลังอาวุธ ที่ ซึ่งกิจการส่วนใหญ่ของพวกเขาจะถูกดำเนินการ\n\n[great_khlon_glan_option.GetTitledFirstNameNoTooltip] ประเมินสินค้าคงคลังอย่างชำนาญด้วยการชายตามองเพียงครั้งสองครั้ง ในขณะที่ [good_khlon_glan_option.GetTitledFirstNameNoTooltip] ใช้เวลาหลายวินาทีมองไปรอบๆ เพื่อทำความคุ้นเคยกับ [good_khlon_glan_option.GetHerHis] สถานที่"
 tgp_east_asia_decision_events.0210.a: "[great_khlon_glan_option.GetTitledFirstNameNoTooltip] ดูเหมือนจะเป็นตัวเลือกที่ฉลาดกว่า"
 tgp_east_asia_decision_events.0210.a.aptitude: "[aptitude|E] ของ [great_khlon_glan_option.GetFirstNamePossessiveNoTooltip] คือ [great_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.b: "[good_khlon_glan_option.GetTitledFirstNameNoTooltip] น่าจะพิสูจน์ตนว่ามีประโยชน์ได้"
 tgp_east_asia_decision_events.0210.b.aptitude: "[aptitude|E] ของ [good_khlon_glan_option.GetFirstNamePossessiveNoTooltip] คือ [good_khlon_glan_option.GetCourtPositionAptitude( GetCourtPositionType( 'khlon_glan_court_position' ) )]"
 tgp_east_asia_decision_events.0210.c: "$tgp_east_asia_decision_events.0200.c$"

 tgp_east_asia_decision_events.0300.t: "บุปผาแห่ง [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 tgp_east_asia_decision_events.0300.desc: "ช่างฝีมือ [local_artisan.GetTitledFirstName] เข้ามาหาข้าด้วยย่างก้าวอันตื่นเต้น: “[ROOT.Char.Custom('FormOfAddressForLiege')|U]! บุหงามัสพร้อมแล้วขอรับ!” [local_artisan.GetSheHe] ส่งสัญญาณเชื้อเชิญข้าอย่างกระตือรือร้นให้ติดตาม [local_artisan.GetHerHim] ไปยังโรงทำงานของ [local_artisan.GetHerHis]\n\nบนโต๊ะนั้น มีผลงานสร้างสรรค์อันโดดเด่นเป็นต้นไม้สองต้นกำลังเบ่งบานเต็มที่ โลหะทองและเงินส่องประกายแวววาว ขัดเงาอย่างสมบูรณ์แบบ และมีรายละเอียดที่สะดุดตาในใบและกิ่งก้านอันบอบบาง"
 tgp_east_asia_decision_events.0300.outro: "\n\nข้าพยักหน้าอย่างพอประมาณ: “ทำได้ดี [local_artisan.GetTitledFirstNameNoTooltip]”"
 tgp_east_asia_decision_events.0300.outro.masterwork: "\n\nข้าโน้มตัวเข้าไป พินิจรายละเอียดเล็กน้อยบนเปลือกไม้พลางพยักหน้าอย่างชื่นชม: “น่าประทับใจ [local_artisan.GetTitledFirstNameNoTooltip]”"
 tgp_east_asia_decision_events.0300.outro.famed: "\n\nข้าใช้เวลาครู่หนึ่งพิจารณางานแกะสลักอันล้ำค่าและดอกไม้อันงดงาม: “วิเศษยิ่งนัก [local_artisan.GetTitledFirstNameNoTooltip]!”"
 tgp_east_asia_decision_events.0300.outro.illustrious: "\n\nข้าแทบหยุดหายใจชั่วขณะ ตะลึงงันชั่วคราวด้วยความงดงามของผลงานสร้างสรรค์ตรงหน้า: “เหลือเชื่อ [local_artisan.GetTitledFirstNameNoTooltip]!”"
 tgp_east_asia_decision_events.0300.a: "นี่น่าจะใช้การได้ดี"
 common_bunga_mas_desc.tt: "เมื่อส่งมอบให้เจ้าเหนือหัว:\n$BULLET_WITH_TAB$ได้รับ (#V 1#!) กองของ [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 masterwork_bunga_mas_desc.tt: "เมื่อส่งมอบให้เจ้าเหนือหัว:\n$BULLET_WITH_TAB$ได้รับสูงสุด (#V 2#!) กองของ [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 famed_bunga_mas_desc.tt: "เมื่อส่งมอบให้เจ้าเหนือหัว:\n$BULLET_WITH_TAB$ได้รับ (#V 2#!) กองของ [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 illustrious_bunga_mas_desc.tt: "เมื่อส่งมอบให้เจ้าเหนือหัว:\n$BULLET_WITH_TAB$ได้รับ (#V 3#!) กองของ [GetModifier('bunga_mas_tribute_modifier').GetNameWithTooltip]"
 bunga_mas: "บุปผาทองคำแห่ง [ROOT.Char.GetLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]"
 common_bunga_mas_desc: "[Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ทั่วไป ประดิษฐ์ขึ้นจากทองคำและเงิน ดอกไม้ที่กำลังเบ่งบานชั่วนิรันดร์ สะท้อนแสงอย่างงดงาม"
 masterwork_bunga_mas_desc: "[Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ทองคำและเงินอันวิจิตร รายละเอียดเล็กน้อยและความซับซ้อนถักทอเข้ากับใบไม้ที่เปราะบาง เกือบจะโปร่งแสงในความบอบบางของมัน"
 famed_bunga_mas_desc: "ดอกไม้ที่สร้างสรรค์อย่างเชี่ยวชาญ การแกะสลักอันละเอียดอ่อนในกิ่งก้าน ต้นไม้ [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ทองคำและเงินที่จะไม่ ทำให้ผู้ใดไม่ประทับใจ"
 illustrious_bunga_mas_desc: "ต้นไม้ [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ทองคำและเงินอันวิจิตรงดงามเหล่านี้เป็นที่น่าชื่นชมยินดี รายละเอียดอันประณีตในงานแกะสลัก สัมผัสอันบอบบางในใบไม้ ราวกับว่าต้นไม้ที่มีชีวิตได้ถูกจุ่มลงในโลหะล้ำค่า"
