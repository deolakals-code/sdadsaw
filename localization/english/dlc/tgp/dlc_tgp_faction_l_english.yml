 tgp_decision_events.0100.t: "คำร้อง $game_concept_movement_possessive$: [petitioner.Custom('GetMyMovementNoTooltip')]"
 tgp_decision_events.0100.desc: "ในฐานะตัวแทนผู้นอบน้อมของ [petitioner.Custom('GetMyMovement')] ข้าขอนำคำร้องมาเพื่อ"
 tgp_decision_events.0100.desc_change_candidate_score_law: "เปลี่ยนแปลง [GetLawGroup('candidate_score_laws').GetNameNoTooltip]! เพื่อให้มั่นใจว่าได้ผู้ที่ดีที่สุดสำหรับงาน เราควรพิจารณา [Select_CString(petition_recipient.HasRealmLaw('candidate_score_merit_law'), 'ทุกคนโดยไม่คำนึงถึงสถานะ', 'เฉพาะตระกูลผู้มีอิทธิพล' )]"
 tgp_decision_events.0100.desc_change_bureaucracy_laws_increase: "เพิ่ม $game_concept_celestial_bureaucracy$! ท่านควรตอกย้ำสิทธิ์อันศักดิ์สิทธิ์ของท่าน และรวบอำนาจไว้ที่ศูนย์กลางรัฐบาล"
 tgp_decision_events.0100.desc_change_bureaucracy_laws_decrease: "ลด $game_concept_celestial_bureaucracy$! เหล่าข้าหลวงท้องถิ่นควรมีอำนาจมากขึ้น เพื่อให้สามารถปฏิบัติหน้าที่ต่อจักรวรรดิได้อย่างมีประสิทธิภาพยิ่งขึ้น"
 tgp_decision_events.0100.desc_change_army_laws_increase: "เพิ่มโครงสร้างบัญชาการกองทัพ! มีเพียงระบบราชการเท่านั้นที่สามารถรับประกันความปลอดภัยของจักรวรรดิได้"
 tgp_decision_events.0100.desc_change_army_laws_decrease: "ลดโครงสร้างบัญชาการกองทัพ! ข้าหลวง แต่ละคนต้องการอำนาจมากขึ้นเพื่อปกป้องจักรวรรดิ"
 tgp_decision_events.0100.desc_change_province_metropolitan: "เปลี่ยน $game_concept_province_administration$ เป็น $celestial_province_metropolitan_short$!\n\nจักรวรรดินั้นแข็งแกร่งเท่ากับเมืองที่อ่อนแอที่สุดเท่านั้น"
 tgp_decision_events.0100.desc_change_province_industrial: "เปลี่ยน $game_concept_province_administration$ เป็น $celestial_province_industrial_short$!\n\n"การลงทุนระยะยาวในดินแดนของจักรวรรดิเป็นสิ่งจำเป็น เพื่อให้จักรวรรดิเจริญรุ่งเรืองตลอดไป""
 tgp_decision_events.0100.desc_change_province_military: "เปลี่ยน $game_concept_province_administration$ เป็น $celestial_province_military_short$!"\n\n"เราควรบ่มเพาะวิถีแห่งนักรบเพื่อรับประกันอนาคตอันเป็นนิรันดร์ของจักรวรรดิ""
 tgp_decision_events.0100.desc_change_province_protectorate: "เปลี่ยน $game_concept_province_administration$ เป็น $celestial_province_protectorate_short$!\n\n"มณฑลต่างๆ จำต้องได้รับการเสริมกำลังเพื่อปกป้องผู้คนจากผู้รุกรานและเหล่าโจรที่อาจเกิดขึ้น""
 tgp_decision_events.0100.desc_change_retirement_law_increase: "เพิ่ม $celestial_retirement_law$!\n\n"มณฑลต่างๆ จำต้องถูกปกครองโดยข้าหลวงผู้มีความสามารถให้นานที่สุด""
 tgp_decision_events.0100.desc_change_retirement_law_decrease: "ลด $celestial_retirement_law$!\n\n"มณฑลต่างๆ จำต้องได้รับการเสริมกำลังโดยการหมุนเวียนข้าหลวงให้มากที่สุด""
 tgp_decision_events.0100.desc_change_retirement_law_outro: "นี่คือหนทางเดียวที่จะ ทำให้เราแข็งแกร่งและรุ่งเรือง [petition_recipient.GetTitleAsNameNoTooltip] จะต้องเห็นพ้องกับข้า!"
 tgp_decision_events.0100.desc_change_province_petitioner: "และข้าสามารถโน้มน้าวจักรพรรดิได้ว่า [petitioner.GetCapitalLocation.GetName] ของข้าต้องการสิ่งนี้"
 tgp_decision_events.0100.desc_change_province_no_petitioner: "และมีสถานที่มากมายทั่วอาณาจักรที่ข้าสามารถเรียกร้องให้ได้"
 tgp_decision_events.0100.desc_change_province_house: "ในขณะที่ สมาชิกตระกูลข้า, [house_movement_member.GetName], ก็มีความปรารถนาอย่างแรงกล้าและต้องการการเปลี่ยนแปลงนี้ เช่นกัน"
 tgp_decision_events.0100.desc_change_province_disciple: "แต่ข้าควรนึกถึงศิษย์ของข้า [disciple_movement_member.GetName]"
 tgp_decision_events.0100.desc_change_province_other: "อย่างไรก็ตาม ข้าระลึกได้ว่าสหายสมาชิก $game_concept_movement$, [other_movement_member.GetName], ก็เป็นตัวเลือกที่ดี เช่นกัน"
 change_province_effect.can_choose: "ท่านสามารถเลือกระหว่าง #V ตัวท่าน#!, สมาชิก [house|E] ของท่าน, [disciple|E] ของท่าน หรือสหายสมาชิก [movement|E] เพื่อเปลี่ยน [province_administration|E] เป็น"
