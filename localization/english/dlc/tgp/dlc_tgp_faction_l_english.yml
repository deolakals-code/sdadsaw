 tgp_decision_events.0102.t: "$tgp_decision_events.0100.t$"
 tgp_decision_events.0102.desc: "[petition_recipient.GetName] มองข้าอย่างประหลาดใจ\n\n"ข้าไม่นึกว่าจะได้ยินคำกล่าวอ้างอันอาจหาญ เช่นนี้ในวันนี้ ข้าชักสนุกแล้วสิ! อย่างไรก็ตาม ข้าเกรงว่าข้าคงต้องปฏิเสธ" [petition_recipient.GetSheHe|U] โบกมือไล่ข้า "เชิญผู้ยื่นคำร้องคนต่อไปเข้ามา"\n\nข้าตกตะลึงไปชั่วขณะ มันต้องมีบางอย่างที่ข้าพอจะทำได้สิ!"
 tgp_decision_events.0102.a: "ข้าจะใช้อิทธิพลของข้า!"
 tgp_decision_events.0102.b: "จักรวรรดิต้องการกองทัพ"
 tgp_decision_events.0102.c: "ยังมีหนทางอื่นในการโน้มน้าว..."
 tgp_decision_events.0102.d: "ข้าจะเสนอตัวข้าเอง"
 tgp_decision_events.0102.forfeit: "ข้าจะไม่ขัดเจตจำนงแห่งสวรรค์"
 tgp_decision_events.0102.petition_refused: "คำร้องถูก #X ปฏิเสธ#!"
 tgp_decision_events.0102.petition_accepted: "คำร้องถูก #P ยอมรับ#!"
 tgp_decision_events.0101.a_title: "ยอมรับคำร้อง"
 tgp_decision_events.0103.t: "$tgp_decision_events.0100.t$"
 tgp_decision_events.0103.desc: "การปฏิเสธของข้า ทำให้ [petitioner.GetName] ทุกข์ใจ แต่ [petitioner.GetSheHe] ก็กลับมาสงบสติอารมณ์ได้อย่างรวดเร็วและทูลถาม:\n\n"ขออภัยในความโอหังของข้า แต่ข้าจะไม่ถูกไล่ไปง่าย ๆ ประเด็นนี้สำคัญต่อสมาชิกทุกคนของ [actors_movement.GetName] โปรดพิจารณาใหม่ด้วยเถิด" [petitioner.GetSheHe|U] ยื่นมือออกมา"
 tgp_decision_events.0103.desc_give_influence: ""ข้าเป็นที่เคารพในหมู่ประชาชนของข้า และพวกเขาไว้วางใจให้ข้าเป็นกระบอกเสียง พวกเราเพียงห่วงใยในสวัสดิภาพของ [GetTitleByKey('h_china').GetName]""
 tgp_decision_events.0103.desc_give_maa: ""จักรวรรดิจะได้ใช้ประโยชน์จากกองทหารที่ดีที่สุดของข้า เห็นพ้องกับเราเถิด แล้วพวกเขาจะเป็นของท่านให้ท่านบัญชา""
 tgp_decision_events.0103.desc_use_hook: ""เรารู้จักกันดีมาระยะหนึ่งแล้ว ข้าคิดว่าท่านติดหนี้บุญคุณข้า และข้าอยากให้ท่านเห็นด้วยกับเรา""
 tgp_decision_events.0103.desc_give_hook: ""ข้าขอเสนอตัวเป็นผู้รับใช้ที่ภักดี ท่านอาจใช้กำลังและสายสัมพันธ์ของข้าเมื่อยามมืดมิดมาเยือน ดังที่ข้ากำลังร้องขอจากท่านในตอนนี้""
 tgp_decision_events.0103.a: ""เช่นนั้นก็ได้ ข้าจะอนุญาตตามที่เจ้าต้องการ""
 tgp_decision_events.0103.b: ""ไสหัวไปให้พ้นหน้าข้า — #emp บัดนี้!#!""
 tgp_decision_events.0103.a_title: "$tgp_decision_events.0101.a_title$"
 tgp_decision_events.0103.b_title: "ปฏิเสธคำร้อง"
 tgp_decision_events.0100.desc_increase_budget: "เพิ่มเงินเดือนของทั้งหมด"
 tgp_decision_events.0100.desc_increase_budget_salary: "$tgp_decision_events.0100.desc_increase_budget$ ข้าหลวง\n\nพวกเขาต้องการคลังเพิ่มขึ้นเพื่อรักษาอาณาจักรให้รุ่งเรือง ลงทุนในกิจกรรมทางวัฒนธรรมและสิ่งปลูกสร้าง"
 tgp_decision_events.0100.desc_increase_budget_ministry: "$tgp_decision_events.0100.desc_increase_budget$ เสนาบดี\n\nพวกเขาได้ริเริ่มโครงการที่ยอดเยี่ยมมากมายและต้องการเงินทุน เพื่อให้โครงการดำเนินต่อไป"
 tgp_decision_events.0100.desc_increase_budget_military: "$tgp_decision_events.0100.desc_increase_budget$ ผู้บัญชาการ\n\nพวกเขาต้องบำรุงรักษากองทัพของเราและมีหนทางในการระดมพล ศัตรูของเราต้องหวาดกลัวเรา!"
 tgp_decision_events.0100.desc_increase_budget_outro: "\n\nอย่างไรก็ตาม ท้องพระคลัง [hegemon.GetTitleAsNamePossessive] นั้นมีจำกัด เพื่อให้คำร้องนี้ได้รับการสนับสนุนทางการเงิน อีกฝ่ายหนึ่งจะต้องสูญเสียเงินทุนไป"
 tgp_decision_events.0100.f: "เหล่าแม่ทัพผลาญเงินทุนในนามของการป้องกันของเรา"
 tgp_decision_events.0100.g: "เหล่าข้าหลวงใช้จ่ายอย่างฟุ่มเฟือยเกินไป"
 tgp_decision_events.0100.h: "เหล่าเสนาบดีปล้นคลังเพื่อโครงการไร้ประโยชน์"
