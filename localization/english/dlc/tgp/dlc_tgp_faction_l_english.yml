 ##################################################
 # JAPANESE REGENT FACTION
 ##################################################
 replace_ceremonial_regent_faction_name: "แต่งตั้ง $game_concept_ceremonial_regent$"
 replace_ceremonial_regent_faction: "ก๊ก $replace_ceremonial_regent_faction_name$"
 replace_ceremonial_regent_faction_desc: "เหล่าสมาชิกของ [faction|E] $replace_ceremonial_regent_faction_name$ มุ่งหมายที่จะใช้กำลังขับไล่ [ceremonial_regent|E] องค์ปัจจุบันออกจากตำแหน่ง\n\n#S คำขาด#!\n$replace_ceremonial_regent_faction_desc_kampaku$"
 replace_ceremonial_regent_faction_desc_emperor: "ผู้นำก๊กจะเข้าแทนที่ [ceremonial_regent|E] องค์ปัจจุบัน ยึดครอง [titles|E] ที่ [landed|E] ทั้งหมดของพวกเขา และอาจจักขึ้นเป็น [cloistered_emperor|E] หรือพยายามรื้อฟื้นการปกครองโดยตรงของจักรพรรดิ"
 replace_ceremonial_regent_faction_desc_kampaku: "ผู้นำก๊กจะเข้าแทนที่ [ceremonial_regent|E] องค์ปัจจุบัน และยึดครอง [titles|E] ที่ [landed|E] ทั้งหมดของพวกเขา"
 replace_ceremonial_regent_faction_short_effect_desc_emperor: "ต้องการได้รับการ แต่งตั้งเป็น [cloistered_emperor|E]"
 replace_ceremonial_regent_faction_short_effect_desc_regent: "ต้องการได้รับการ แต่งตั้งเป็น [ceremonial_regent|E]"
 FACTION_JAPANESE_REPLACE_REGENT_NAME_DYNAMIC: "แต่งตั้ง [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U] เป็น $game_concept_ceremonial_regent$"
 FACTION_JAPANESE_REPLACE_REGENT: "ข้อเรียกร้อง $replace_ceremonial_regent_faction_name$"
 FACTION_JAPANESE_REPLACE_REGENT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nเหล่าขุนนางผู้ภักดีแห่ง [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] หมดสิ้นความเชื่อมั่นในการสำเร็จราชการอันสุดทนของท่านแล้ว! จงสละอำนาจของท่านแก่ข้า หรือมิ เช่นนั้นก็จงมารับคมดาบของพวกเราในสนามรบ!"
 FACTION_JAPANESE_REPLACE_RULER_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nเหล่าขุนนางผู้ภักดีแห่ง [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] หมดสิ้นความเชื่อมั่นในการปกครองแบบทรราชย์อันไร้การชี้นำของท่านแล้ว! จงมอบอำนาจของท่านแก่ข้า หรือมิ เช่นนั้นก็จงมารับคมดาบของพวกเราในสนามรบ!"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED: "ยอมรับข้อเรียกร้อง $replace_ceremonial_regent_faction_name$"
 FACTION_JAPANESE_REPLACE_REGENT_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความพยายามอันอุกอาจและไร้ยางอายในการฉกฉวยอำนาจของเจ้านั้น มี แต่จะ ทำให้ [faction_target.GetPrimaryTitle.GetNameNoTier] อ่อนแอลง อย่างไรก็ตาม เพื่อหลีกเลี่ยงการนองเลือดอันไม่จำเป็น ข้าจะยอมรับข้อเรียกร้องของเจ้า..."
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED: "ปฏิเสธข้อเรียกร้อง $replace_ceremonial_regent_faction_name$"
 FACTION_JAPANESE_REPLACE_REGENT_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nความพยายามข่มขู่อันน่าขันของเจ้าจะไม่มีวันสำเร็จ ข้าคือ [faction_target.GetTitleAsNameNoTooltip] ผู้โดยชอบธรรมแห่ง [faction_target.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! เหล่าทรยศทั้งสิ้นจักต้องถูกพิพากษา — ในสนามรบ หากจำเป็น!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION: "ผู้สำเร็จราชการต้องล่มสลาย!"
 FACTION_JAPANESE_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION_DESC: "บัดนี้ถึงเวลาแล้ว! เหล่าขุนนางแห่ง [faction.GetName] เห็นพ้องว่า [faction_target.GetName] เป็นทรราชย์ผู้ต้องสละอำนาจ [faction_target.GetHerHis] — ภายใต้คมดาบ หากจำเป็น!"
 cannot_create_claimant_faction_against_kampaku_tooltip: "[factions|E] ผู้อ้างสิทธิ์ [claimant|E] ไม่สามารถสร้างขึ้นเพื่อต่อต้าน [ceremonial_regent|E] ได้"
 FACTIONS_WINDOW_JAPANESE_REGENT: "ผู้ท้าชิง"
 replace_ceremonial_regent_faction_kampaku_trigger: "มีเพียง [kampaku|E] หรือ [joko|E] เท่านั้นที่สามารถถูกแทนที่ได้"
 not_house_head_allied_to_faction_target_trigger: "ท่านไม่สามารถเป็นสมาชิกตระกูลของเป้าหมาย [faction|E] ได้"
 not_house_member_of_faction_target_trigger: "[house_head|E] ของท่านไม่สามารถมี [alliance|E] กับเป้าหมาย [faction|E] ได้"
 must_be_leading_house_of_bloc_trigger: "ใน [governments|E] ที่มี [house_blocs|E] มีเพียง [house_heads|E] ของ [leading_house|E] $game_concept_bloc_possessive$ เท่านั้นที่สามารถสร้าง [factions|E] ต่อต้าน [top_liege|E] ได้"
 ##################################################
 # RESTORE EMPEROR FACTION
 ##################################################
 restore_ceremonial_liege_faction_name: "ฟื้นฟู $game_concept_ceremonial_liege$"
 restore_ceremonial_liege_faction: "ก๊ก $restore_ceremonial_liege_faction_name$"
 restore_ceremonial_liege_faction_desc: "เหล่าสมาชิกของ [faction|E] $restore_ceremonial_liege_faction_name$ มุ่งหมายที่จะขับไล่ [ceremonial_regent|E] และรื้อฟื้นการปกครองโดยตรงโดย [ceremonial_liege|E]\n\n#S คำขาด#!\n[ceremonial_liege|E] จะเข้าแทนที่ [ceremonial_regent|E] ยึดครอง [titles|E] ที่ [landed|E] ทั้งหมดของพวกเขา และนำกฎ [succession|E] $single_heir_succession_law$ มาใช้"
 restore_ceremonial_liege_faction_short_effect_desc: "ต้องการฟื้นฟู [ceremonial_liege|E] คืนสู่อำนาจ"
 FACTION_JAPANESE_RESTORE_EMPEROR_NAME_DYNAMIC: "ฟื้นฟู [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U]"
 FACTION_JAPANESE_RESTORE_EMPEROR: "ข้อเรียกร้อง $restore_ceremonial_liege_faction_name$"
 FACTION_JAPANESE_RESTORE_EMPEROR_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nการปกครองแบบทรราชย์ของท่านเหนือราชสำนัก [ROOT.Char.Custom('GetTitleTierAdjective')], ราชวงศ์ และทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ต้องสิ้นสุดลง\n\nจงหลีกทางให้แก่ผู้ปกครองที่แท้จริงของเรา, [faction.GetSpecialCharacter.GetTitledFirstName]!"
 tgp_faction_events.0201.b: "เจ้าจะต้องชดใช้ที่สร้างมลทินแก่เกียรติยศ [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
 tgp_faction_events.0201.b.cm: "เจ้ายอมเสี่ยงที่จะฉีก [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] ออกเป็นชิ้นๆ เชียวหรือ?!"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED: "ยอมรับข้อเรียกร้อง $restore_ceremonial_liege_faction_name$"
 FACTION_JAPANESE_RESTORE_EMPEROR_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nข้าเพียงคำนึงถึงผลประโยชน์สูงสุดของราชสำนัก [ROOT.Char.Custom('GetTitleTierAdjective')], ราชวงศ์ และทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] เป็นที่ตั้ง!\n\nแม้ข้าจะกังขาในเจตนาของเจ้า ข้าก็จักไม่ขวางทาง [faction.GetSpecialCharacter.GetTitledFirstName]"
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED: "ปฏิเสธข้อเรียกร้อง $restore_ceremonial_liege_faction_name$"
 FACTION_JAPANESE_RESTORE_EMPEROR_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nช่างโอหังยิ่งนัก! ข้าเพียงคำนึงถึงผลประโยชน์สูงสุดของราชสำนัก [ROOT.Char.Custom('GetTitleTierAdjective')], ราชวงศ์ และทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] เป็นที่ตั้ง!\n\nเจ้าและเหล่าสหายทรยศของเจ้าจะต้องชดใช้ที่สร้างมลทินแก่เกียรติยศ [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip]!"
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION: "$restore_ceremonial_liege_faction_name$ "
 FACTION_JAPANESE_RESTORE_EMPEROR_SEND_DEMAND_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nการปกครองแบบทรราชย์ของ [faction_target.GetTitledFirstNamePossessive] เหนือราชสำนัก [ROOT.Char.Custom('GetTitleTierAdjective')], ราชวงศ์ และทั่วทั้ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ต้องสิ้นสุดลง\n\nพวกเราต้องพร้อมที่จะสู้รบเพื่อฟื้นฟูผู้ปกครองที่แท้จริงของเรา, [faction.GetSpecialCharacter.GetTitledFirstName]!"
 FACTIONS_WINDOW_JAPANESE_RESTORE_EMPEROR: "[ceremonial_liege|E]"
 tgp_faction_events.0206.t: "เพื่อรับใช้ [claimant.GetTitleAsNameNoTooltip]"
 tgp_faction_events.0206.desc: "ในที่สุด อุดมการณ์ของผู้ภักดีก็ได้พิสูจน์ชัยชนะในสงครามอันชอบธรรมของเรา เพื่อขจัดสิ้นความชั่วร้ายของ [defender.GetTitledFirstName] และปลดปล่อย [claimant.GetTitleAsName] จากอิทธิพลอันเลวทราม [defender.GetHerHis]\n\nแม้ว่าราชสำนักจักรพรรดิจะกลับคืนสู่ความสงบเรียบร้อย สงครามก็ได้สร้างความตระหนกแก่แว่นแคว้น และทั่วทั้ง [defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ก็มองมาที่ข้าในฐานะผู้นำพาสันติสุขและผู้ดูแลราชวงศ์..."
 tgp_faction_events.0206.a: "[claimant.GetTitleAsNameNoTooltip] จงเจริญ!"
 tgp_faction_events.0206.b: "หนทางนั้นเต็มไปด้วยภยันตราย นายเหนือหัวของเราจำต้องได้รับการชี้นำ..."
