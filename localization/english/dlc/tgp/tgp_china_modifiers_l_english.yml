l_english: 
 tgp_forced_labor_modifier: "แรงงานเกณฑ์"
 tgp_forced_labor_modifier_desc: "ไพร่ฟ้าในเคาน์ตีนี้ถูกบังคับให้ทำงานภายใต้การคุกคามของความรุนแรง และความชิงชังต่อผู้มีอำนาจก็ทวีขึ้น"
 tgp_recruited_charlatan_modifier: "นักต้มตุ๋นที่ถูกจ้างวาน"
 tgp_recruited_charlatan_modifier_desc: "ตัวละครนี้ได้รับประสบการณ์ด้านเล่ห์กลจากการปฏิสัมพันธ์กับกวีไส้แห้ง"
 tgp_unpressed_taxes_modifier: "การเก็บภาษีแบบผ่อนปรน"
 tgp_unpressed_taxes_modifier_desc: "เคาน์ตีนี้กำลังเจริญรุ่งเรืองภายใต้การปกครองของผู้พิพากษาที่ผ่อนปรน"
 tgp_lowborn_chastiser_modifier: "ผู้ลงทัณฑ์ชนชั้นล่าง"
 tgp_lowborn_chastiser_modifier_desc: "ตัวละครนี้ช่วยขจัดความอัปยศของการเป็นคนจนให้แก่ไพร่ฟ้าของตน โดยใช้การข่มขู่และคำสั่งใช้ความรุนแรงทางกายภาพ"
 tgp_lowborn_tenderizer_modifier: "ผู้สั่งสอนชนชั้นล่าง"
 tgp_lowborn_tenderizer_modifier_desc: "ตัวละครนี้ช่วยขจัดความอัปยศของการเป็นคนจนให้แก่ไพร่ฟ้าของตน และมาตรการทางวินัยแทบไม่เหลือสิ่งใดไว้"
 tgp_aided_farmers_modifier: "ชาวนาที่ได้รับความช่วยเหลือ"
 tgp_aided_farmers_modifier_desc: "เคาน์ตีนี้ได้รับอนุญาตให้นำคนหนุ่มสาวกลับคืนมาจากการเกณฑ์ไปทำสงครามของเจ้าเหนือหัว"
 tgp_disciplined_farmers_modifier: "ชาวนาผู้มีวินัย"
 tgp_disciplined_farmers_modifier_desc: "เหล่าชาวนาในเคาน์ตีนี้กำลังทำงานอย่างแข็งขันหลังจากได้เห็นการแขวนคอในที่สาธารณะ"
 tgp_sworn_service_modifier: "สาบานตนรับใช้"
 tgp_sworn_service_modifier_desc: "ตัวละครนี้กำลังชดใช้หนี้สินของบิดามารดาด้วยการรับใช้ในราชสำนัก พวกเขาไม่สามารถจากไปได้จนกว่าหนี้จะได้รับการชดใช้"
 tgp_courtly_influence_modifier: "อิทธิพลจากราชสำนัก"
 tgp_courtly_influence_modifier_desc: "เหล่าชาวนาในเคาน์ตีนี้กำลังได้รับประโยชน์จากความรู้เชิงลึกที่หนึ่งในพวกเขารวบรวมได้ระหว่างช่วงเวลาที่อยู่ในราชสำนัก"
 tgp_sanctioned_deity_modifier: "เทพที่ได้รับการรับรอง"
 tgp_sanctioned_deity_modifier_desc: "เคาน์ตีนี้บูชาเทพองค์ใหม่ที่เพิ่งได้รับการรับรอง และกระแสผู้มาเยือนศาลเจ้าอย่างต่อเนื่องได้สร้างผลดีต่อผู้คนที่อาศัยอยู่ที่นั่น"
 tgp_debunked_deity_modifier: "เทพผู้ถูกลบล้าง"
 tgp_debunked_deity_modifier_desc: "ตัวละครนี้ประสบความสำเร็จในการทำลายเทพองค์หนึ่งตั้งแต่ยังเยาว์วัย โดยสังหารด้วยวาทศิลป์อันเชี่ยวชาญ"
 tgp_resisted_alcohol_modifier: "ต่อต้านสุรา"
 tgp_resisted_alcohol_modifier_desc: "ตัวละครนี้ละเว้นจากการเข้าร่วมงานเลี้ยงดื่มไป๋จิ่ว"
 tgp_stationed_troops_modifier: "ภูมิภาคที่เสริมกำลัง"
 tgp_trained_monks_modifier: "นักบวชที่ฝึกฝนมาอย่างดี"
 tgp_trained_monks_modifier_desc: "เหล่านักบวชในภูมิภาคนี้ได้รับการควบคุมดูแลด้านศิลปะการต่อสู้โดยเจ้าเหนือหัวของพวกเขา และเตรียมพร้อมที่จะปกป้องที่มั่นของตนจากผู้โจมตีใด ๆ"
 tgp_adequately_trained_monks_modifier: "นักบวชที่ฝึกฝนมาพอสมควร"
 tgp_adequately_trained_monks_modifier_desc: "เหล่านักบวชในภูมิภาคนี้ได้รับการควบคุมดูแลด้านศิลปะการต่อสู้โดยจอมทัพของเจ้าเหนือหัว และอย่างน้อยก็ค่อนข้างพร้อมที่จะปกป้องที่มั่นของตนจากผู้โจมตีใด ๆ"
 tgp_fattened_vanguard_modifier: "กองหน้าอิ่มหนำ"
 tgp_fattened_vanguard_modifier_desc: "เคาน์ตีนี้มอบชายฉกรรจ์ทุกคนที่มีให้แก่กองทัพของเจ้าเหนือหัว"
 tgp_diligent_workers_modifier: "คนงานขยันหมั่นเพียร"
 tgp_diligent_workers_modifier_desc: "เหล่าไพร่ในภูมิภาคนี้กำลังทำงานอย่างหนักเพื่อเอาใจเจ้าเหนือหัวของตน เพื่อรักษาคนหนุ่มสาวไว้จากการถูกเกณฑ์"
 tgp_well_equipped_soldiers_modifier: "ทหารที่เพียบพร้อมด้วยยุทโธปกรณ์"
 tgp_well_equipped_soldiers_modifier_desc: "เหล่าทหารที่ประจำการในโฮลดิงนี้มียุทโธปกรณ์ดีกว่าส่วนใหญ่"
 tgp_greatly_equipped_soldiers_modifier: "ทหารที่มียุทโธปกรณ์น่าประทับใจ"
 tgp_greatly_equipped_soldiers_modifier_desc: "ด้วยยุทโธปกรณ์ที่ดีที่สุดที่มีอยู่ เหล่าทหารที่ประจำการที่นี่จำต้องทำผลงานได้ดีในการรบ"
 tgp_outmatched_local_warriors_modifier: "สัญชาตญาณการรบที่เฉียบคม"
 tgp_outmatched_local_warriors_modifier_desc: "ตัวละครนี้ได้ค้นหาผู้ท้าทายใหม่ ๆ ในสถานที่ใหม่ ๆ เพียงเพื่อจะพบว่าตนเองเหนือกว่าทุกคน"
 tgp_strengthen_capital_character_modifier: "ผู้สร้างเมืองหลวง"
 tgp_strengthen_capital_character_modifier_desc: "เมืองหลวงของโอรสสวรรค์เพิ่งผ่านการบูรณะใหม่ ซึ่งช่วยเสริมความยิ่งใหญ่ตระการตาของเมืองหลวงอย่างมาก บัดนี้ พื้นที่เมืองหลวงคือศูนย์กลางแห่งอาณาจักรอย่างไม่มีข้อโต้แย้ง"
 tgp_strengthen_capital_modifier: "เมืองหลวงสวรรค์"
 tgp_strengthen_capital_modifier_desc: "$tgp_strengthen_capital_character_modifier_desc$\n\n[dynastic_cycle|E]: จะ #EMP ไม่#! มีการเปลี่ยนแปลงประจำปีจาก [favored_movement|E] ใน [dynastic_cycle_era_type_stable|E] ใดๆ ในขณะที่ที่นี่เป็น [realm_capital|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'tgp_strengthen_capital_modifier_education_bonus')]"
 tgp_strengthen_capital_architects_modifier: "สถาปัตยกรรมอันไร้ที่ติ"
 tgp_strengthen_capital_architects_modifier_desc: "เมืองหลวงของโอรสสวรรค์ได้รับการบูรณะใหม่ภายใต้การควบคุมดูแลของสถาปนิกผู้ชำนาญการ ซึ่งช่วยปรับปรุงศักยภาพของเมืองหลวงในการเติบโตของประชากรและการพาณิชย์อย่างมาก"
 tgp_strengthen_capital_engineers_modifier: "วิศวกรรมอันชาญฉลาด"
 tgp_strengthen_capital_engineers_modifier_desc: "เมืองหลวงของโอรสสวรรค์ได้รับการบูรณะใหม่ภายใต้การควบคุมดูแลของวิศวกรผู้มากความสามารถ ซึ่งช่วยปรับปรุงโครงสร้างพื้นฐานของเมืองหลวงและการเชื่อมต่อกับชุมชนใกล้เคียงอย่างมาก"
 tgp_strengthen_capital_sculptors_modifier: "ประติมากรรมอันรุ่งโรจน์"
 tgp_strengthen_capital_sculptors_modifier_desc: "ระหว่างการบูรณะเมืองหลวงของโอรสสวรรค์ เหล่าประติมากรที่เก่งกาจที่สุดเท่าที่อาณาจักรจะหาได้ถูกจ้างวานให้มาตก แต่งทุกแง่มุมของสถาปัตยกรรมใหม่ให้งดงามอย่างประณีต"
 tgp_strengthen_capital_modifier_education_bonus: "\nเพิ่มความสำเร็จสำหรับ [GetActivityType('activity_adult_education').GetTextIcon][GetActivityType('activity_adult_education').GetName] [activity|E] ใน [location|E] นี้"
 tgp_minister_project_development_modifier: "ชุมชนที่ได้รับการพัฒนา"
 tgp_minister_project_development_modifier_desc: "[great_project|E] เพิ่งใช้ความพยายามอย่างมากในการพัฒนาพื้นที่นี้ ปรับปรุงเมืองต่าง ๆ หมู่บ้านท้องถิ่น และถนนที่เชื่อมต่อเข้าด้วยกัน"
 tgp_grand_canal_modifier: "คลองมหึมา"
 tgp_grand_canal_modifier_desc: "พื้นที่นี้ได้รับประโยชน์จากคลอง เส้นทางน้ำ และสะพานส่งน้ำจำนวนหนึ่ง ซึ่งช่วยอำนวยความสะดวกในการขนส่งสินค้าและการเดินทางของพ่อค้า"
 tgp_minister_project_establish_control_modifier: "ระบบราชการแบบบูรณาการ"
 tgp_minister_project_establish_control_modifier_desc: "เคาน์ตีนี้เพิ่งมีการปรับปรุงการบริหารจัดการ ซึ่งเพิ่มการควบคุมของรัฐบาลเหนือพื้นที่นี้อย่างมาก"
 tgp_minister_project_train_troops_modifier: "$great_project_type_minister_project_train_troops_contribution_train_troops$"
 tgp_minister_project_train_troops_modifier_desc: "พลทหารราบของเคาน์ตีนี้ผ่านการฝึกฝนอย่างเข้มงวดที่รับรองโดยกระทรวงกลาโหม"
 tgp_minister_project_train_troops_levy_bootcamp_modifier: "$great_project_type_minister_project_train_troops_contribution_levy_bootcamp$"
 tgp_minister_project_train_troops_levy_bootcamp_modifier_desc: "เกณฑ์ทหารของเคาน์ตีนี้ได้รับการฝึกฝนโดยแม่ทัพจากส่วนกลางของกระทรวงกลาโหม"
 tgp_minister_project_train_troops_siege_exercise_modifier: "$great_project_type_minister_project_train_troops_contribution_siege_exercise$"
 tgp_minister_project_train_troops_siege_exercise_modifier_desc: "เคาน์ตีนี้ได้รับการฝึกฝนจากกระทรวงกลาโหมให้ทำการปิดล้อมทำลายล้างและต้านทานการปิดล้อมที่แข็งแกร่งกว่าสองเท่าได้"
 tgp_minister_project_train_troops_natural_disaster_test_modifier: "$great_project_type_minister_project_train_troops_contribution_natural_disaster_test$"
 tgp_minister_project_train_troops_natural_disaster_test_modifier_desc: "เคาน์ตีนี้เตรียมพร้อมสำหรับการอพยพอย่างมีระบบ การบรรเทาความเสียหาย และการฟื้นฟูอย่างรวดเร็วในกรณีที่เกิดภัยพิบัติทางธรรมชาติ ต้องขอบคุณการฝึกซ้อมภาคบังคับจากกระทรวงกลาโหม"
 tgp_minister_project_conduct_census_modifier: "สอดคล้องกับการสำมะโนประชากร"
 tgp_minister_project_conduct_census_modifier_desc: "เคาน์ตีนี้ได้รับการสำมะโนประชากรโดย [minister_of_revenue|E]"
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier: "มาตรการปลดหนี้"
 tgp_minister_project_conduct_census_purge_treasury_debt_modifier_desc: "ตัวละครนี้ได้รับประโยชน์จากโครงการป้องกัน [treasury_debt|E] ของกระทรวงการคลังที่ออกในช่วง [GetGreatProjectType('minister_project_conduct_census').GetName]"
 tgp_minister_project_conduct_census_fertility_effort_modifier: "$great_project_type_minister_project_conduct_census_contribution_fertility_effort$"
 tgp_minister_project_conduct_census_fertility_effort_modifier_desc: "[holder|E] ของเคาน์ตีนี้จะได้รับประโยชน์จากโครงการส่งเสริมการเจริญพันธุ์ของกระทรวงการคลังที่ออกในช่วง [GetGreatProjectType('minister_project_conduct_census').GetName] กระทรวงจะจ่าย [treasury|E] สำหรับทารกแรกเกิดคนต่อไป"
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier: "$great_project_type_minister_project_conduct_census_contribution_natural_disaster_insurance$"
 tgp_minister_project_conduct_census_natural_disaster_insurance_modifier_desc: "[holder|E] ของเคาน์ตีนี้จะได้รับประโยชน์จากการประกันภัย [natural_disasters|E] ของกระทรวงการคลังที่ออกในช่วง [GetGreatProjectType('minister_project_conduct_census').GetName] กระทรวงจะจ่าย [treasury|E] ในระหว่างที่เกิดภัยพิบัติ"
 tgp_child_exam_cooldown_modifier: "สอบคัดเลือกเยาวชนไม่ผ่าน"
 tgp_child_exam_cooldown_modifier_desc: "การเข้าร่วมการสอบของจักรวรรดิเป็นเหตุการณ์สำคัญสำหรับทุกคนที่มุ่งหวัง แต่ตัวละครนี้กลับพบว่าตนเองต้องดิ้นรนภายใต้แรงกดดัน"
 tgp_local_exam_initial_success: "เริ่มต้นการสอบอย่างแข็งแกร่ง"
 tgp_local_exam_initial_success_desc: "ความสำเร็จในเบื้องต้นสร้างความประทับใจที่ยั่งยืน"
 tgp_local_exam_impressed_examiner: "ผู้คุมสอบประทับใจ"
 tgp_local_exam_strong_finish: "จบการสอบอย่างแข็งแกร่ง"
 tgp_local_exam_strong_finish_desc: "ในช่วงบ่ายแก่ ๆ ของการทดสอบที่ยาวนานและท้าทาย ศิษย์ที่ฉลาดที่สุดย่อมโดดเด่นกว่าใคร"
 tgp_child_focused_studies_modifier: "การศึกษามุ่งเน้น"
 tgp_forced_to_retake_exam_modifier: "รอการสอบในวัง"
 tgp_forced_to_retake_exam_modifier_desc: "ตัวละครนี้กำลังตั้งตารอ [GetActivityType('activity_imperial_examination').GetName] ครั้งต่อไปอย่างกระวนกระวายใจ โดยถูกกดดันจากครอบครัวให้แข่งขันในระดับสูงสุด"
 
 tgp_joined_grand_campaign_modifier: "เข้าร่วมการทัพครั้งใหญ่"
 tgp_joined_grand_campaign_modifier_desc: "ตัวละครนี้ได้อุทิศตนให้กับสงครามที่รัฐบัญชาการ ความคาดหวังอันยิ่งใหญ่มาพร้อมกับการสนับสนุนจากรัฐบาล"
 tgp_wiles_is_the_way_modifier: "เล่ห์กลคือหนทาง"
 tgp_wiles_is_the_way_modifier_desc: "ไฉนต้องเดินตามเส้นทาง ในเมื่อท่านสามารถตัดข้ามไปได้?"
 tgp_honor_is_the_way_modifier: "เกียรติยศคือหนทาง"
 tgp_honor_is_the_way_modifier_desc: "ตัวละครนี้ได้รับแรงบันดาลใจจากอิทธิพลชี้แนะของครูบาอาจารย์และครอบครัว"
 tgp_passed_provincial_exam_modifier: "ผ่านการสอบระดับมณฑล"
 tgp_bypassed_provincial_exam_modifier: "ข้ามการสอบ"
 tgp_bypassed_provincial_exam_modifier_desc: "ตัวละครนี้สอบผ่านการสอบระดับสูงได้สำเร็จโดยไม่ต้องผ่านการสอบระดับท้องถิ่นก่อน"
 tgp_passed_metropolitan_exam_modifier: "ผ่านการสอบระดับเมืองหลวง"
 tgp_passed_palace_exam_modifier: "ผ่านการสอบในวัง"
 
 tea_ceremony_health_benefit: "ชาหนึ่งถ้วยเพื่อสุขภาพ"
 tea_ceremony_health_benefit_desc: "ตัวละครนี้ดื่มชาหนึ่งถ้วยและรู้สึกดีขึ้นมาก"
