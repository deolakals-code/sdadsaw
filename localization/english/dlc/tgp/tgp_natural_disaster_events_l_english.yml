l_english: 
 # END
 natural_disaster.4001.t: "[situation.GetNameNoTooltip]: การฟื้นฟูเสร็จสมบูรณ์"
 natural_disaster.4001.desc: "ภัยพิบัติครั้งล่าสุดที่ถาโถมแผ่นดินของเราได้ทิ้งความเสียหาย ซึ่งต้องใช้เวลาหลายชั่วอายุคนในการฟื้นฟู บาดแผลที่ทั่วทั้งแผ่นดินสัมผัสได้ ทั้งชนชั้นสูงและสามัญชนต่างได้รับผลกระทบ\n\nพวกเรารวมใจกันเป็นหนึ่งเพื่อเป็นเกียรติแก่ผู้ที่ล่วงลับ และเพื่อบูรณะเมืองและนครของเรา หากภัยพิบัติจู่โจมอีกครา เราก็จะเตรียมพร้อม"
 natural_disaster.4001.a: "นับเป็นชัยชนะเหนือธรรมชาติโดยแท้"
 natural_disaster.4002.a: "งานของเราไม่สูญเปล่า!"

 # IMPACT
 natural_disaster.5001.t: "[situation.GetNameNoTooltip]: ความก้าวหน้ามลายสิ้น"
 natural_disaster.5001.desc: "การลงทุนหลายปีและผลผลิตจากแรงงานอันแสนสาหัสในภูมิภาคมลายสิ้นไปในพริบตา หลายครอบครัวทอดทิ้งเคหาสน์สถานอันเป็นมรดกตกทอดเนื่องด้วยสิ่งที่หลงเหลือมีเพียงเศษซากปรักหักพัง เหล่าผู้จดบันทึกพงศาวดารต่างคร่ำครวญถึงการสูญเสียสมบัติศักดิ์สิทธิ์และหายาก ตลอดจนเสบียงยุทโธปกรณ์สำคัญของกองทัพ\n\n"
 natural_disaster.5001.desc.flood: "ห้องใต้ดินและสิ่งปลูกสร้างใต้พื้นพิภพสูญสิ้นโดยสิ้นเชิง ทางออกของมันจมอยู่ใต้น้ำท่วม การเคลื่อนที่กลับกลายเป็นแทบจะสุดวิสัย ทั้งสัตว์ใช้งานและมนุษย์ต่างจมลงในผืนดินที่ชุ่มโชก"
 natural_disaster.5001.desc.earthquake: "ผู้บริสุทธิ์วิ่งหนีตายขณะที่เศษซากถล่มลงมาราวกับห่าฝน เพียงเพื่อจะถูกกลืนกินโดยกลุ่มควันที่มืดมิดและน่าอึดอัด อาคารที่เคยตั้งตระหง่านมั่นคงมานับกัลป์ บัดนี้กลับเหลือเพียงซากปรักหักพัง ชิ้นส่วนที่แตกสลายของมันมิอาจจดจำเค้าเดิมได้เลย"
 natural_disaster.5001.a: "คงมีสิ่งต่างๆ มากมายที่ต้องสร้างขึ้นใหม่"
 natural_disaster_5001_flood_tt: "ทุก [realm|E] [county|E] ใน [situation.GetName] [situation_sub_region.GetName] ได้สูญเสีย #N 1/[SCOPE.ScriptValue('natural_disaster_flood_development_loss_fraction_value')|0]#! ของ [development|E] #weak (สูงสุด -5)#!"
 natural_disaster.5011.t: "[situation.GetNameNoTooltip]: อ่อนแอและเปราะบาง"
 natural_disaster.5011.desc.earthquake: "กำแพงที่เคยสูงตระหง่านและน่าเกรงขามของ [epicenter_county.GetNameNoTier] ได้พังทลายลง,"
 natural_disaster.5011.desc.flood: "กำแพงที่เคยสูงตระหง่านและน่าเกรงขาม ซึ่งล้อมรอบเมืองต่างๆ ใกล้ [river_region.GetName] ได้ทลายลง,"
 natural_disaster.5011.desc: "ทำให้มิอาจตั้งกองกำลังใดๆ ที่นั่นได้ เหล่านักรบถูกย้ายไปยังพื้นที่ปลอดภัยกว่า แต่การนี้กลับสร้างความเปราะบางให้แก่ภูมิภาค\n\nในช่วงเวลาที่อ่อนแอที่สุด แผ่นดินตกอยู่ในความพินาศ — ไร้การป้องกันและเปราะบาง"
 natural_disaster.5011.a: "สถานการณ์ยิ่งมืดมนลงทุกขณะ"
 natural_disaster.5021.t: "[situation.GetNameNoTooltip]: การอพยพครั้งใหญ่"
 natural_disaster.5021.desc: "เหยื่อจาก [situation.GetName] ต่างเร่งรีบหาที่ปลอดภัย ทิ้งชีวิตเดิมไว้เบื้องหลัง เมื่อเหลือคนเพียงน้อยนิดที่จะดูแลความปลอดภัยและความสงบเรียบร้อย เหล่ามิจฉาชีพจึงออกอาละวาดคุกคามผู้รอดชีวิตอย่างเสรี การปกครองพื้นที่แห่งนี้มิอาจเป็นไปได้อีกต่อไป"
 natural_disaster.5021.a: "มันถูกทอดทิ้งแล้ว"
 natural_disaster.5022.desc: "ผู้อพยพจาก [situation.GetName] หลั่งไหลไปยังอาณาจักรข้างเคียง ในความพยายามอย่างสิ้นหวังที่จะหนีจากความโกลาหล อาชญากรรมชุกชุมไปทั่วพื้นที่ ขณะที่เหล่าผู้มุ่งร้ายฉวยโอกาสจากความวุ่นวาย พื้นที่ที่ได้รับผลกระทบกลายเป็นภาระของอาณาจักร มิอาจสร้างผลกำไรหรือความก้าวหน้าใดๆ ได้อีกเมื่อสูญสิ้นผู้อยู่อาศัย"
 natural_disaster.5022.a: "ผู้รอดชีวิตปลอดภัยแล้วที่นี่"
 natural_disaster.5031.t: "[situation.GetNameNoTooltip]: ทุ่งหญ้าพินาศ"
 natural_disaster.5031.desc: "ฝูงปศุสัตว์มากมายล้มตายลงเมื่อผืนดินสำหรับเล็มหญ้าลดน้อยถอยลง โทสะแห่งธรรมชาติทำลายล้างแผ่นดิน ทำให้การดูแลฝูงสัตว์ของเรามิอาจเป็นไปได้"
 natural_disaster.5031.a: "ดินแดนเหล่านั้นมิได้อุดมสมบูรณ์อีกต่อไป"
 natural_disaster.5101.t: "[situation.GetNameNoTooltip]: ชั่วขณะสุดท้าย"
 natural_disaster.5101.desc.flood: "น้ำโสโครกทะลักขึ้นมาถึงอก ข้นคลั่กไปด้วยตะกอน อาภรณ์ที่เปียกชุ่มถ่วงรั้งแขนขาของข้าขณะที่กระแสน้ำแรงขึ้น"
 natural_disaster.5101.desc.earthquake: "พื้นสั่นสะเทือนอย่างรุนแรงและฝุ่นผงฟุ้งกระจายจากเพดาน คานรับน้ำหนักขนาดใหญ่ปริแตกและกำแพงส่งเสียงลั่น ในอีกไม่กี่อึดใจ ทุกสิ่งจะถล่มลงมา"
 natural_disaster.5101.travel: "\n\nบางทีการหลบภัยใน [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] แห่งนี้อาจเป็นการตัดสินใจที่โง่เขลา"
 natural_disaster.5101.army: "\n\nบางทีการหลบภัยใน [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] แห่งนี้อาจเป็นการตัดสินใจที่โง่เขลา รอบกายข้า เหล่าทหารของข้าต่างถูกทับถมเบียดเสียด"
 natural_disaster.5101.activity: "\n\nนี่คงเป็น [involved_activity.GetActivityType.GetNameNoTooltip] ครั้งสุดท้ายที่ข้าได้เห็น"
 natural_disaster.5101.tent: "\n\nบางทีการหลบภัยใน [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] แห่งนี้อาจเป็นการตัดสินใจที่โง่เขลา"
 natural_disaster.5101.estate: "\n\nข้าวิ่งสุดฝีเท้าผ่านโถงทางเดินในคฤหาสน์ของข้า เพียงเพื่อจะพบว่าทางออกเดียวถูกอัดจนเปิดได้เพียงครึ่งเดียว"
 natural_disaster.5101.court: "\n\nข้าผลักดันฝ่ากลุ่มข้าราชสำนักที่กำลังแตกตื่น เพียงเพื่อจะพบว่าทางออกเดียวถูกอัดจนปิดแน่น"
 natural_disaster.5101.desc.flood_end: "[at_risk_character.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))]ของข้า อยู่ตามหลังเพียงก้าวเดียว กำลังเอื้อมมือมาหาข้า มีที่ว่างพอให้เบียดตัวออกไปสูดอากาศได้เพียงผู้เดียว"
 natural_disaster.5101.desc.earthquake_end: "[at_risk_character.GetTitledFirstNameNoTooltip] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))]ของข้า อยู่ตามหลังเพียงก้าวเดียว ดวงตาเบิกกว้าง มีที่ว่างพอให้คนเดียวเท่านั้นที่จะผ่านประตูออกไปได้ก่อนที่คานจะถล่มลงมา"
 natural_disaster.5101.a: "ข้าคว้าตัว [at_risk_character.GetTitledFirstNameNoTooltip] แล้วพุ่งไปยังประตู"
 natural_disaster.5101.a.tt.success: "เจ้าและ [at_risk_character.GetFirstNameNoTooltip] รอดชีวิตทั้งคู่"
 natural_disaster.5101.a.tt.failure: "มหันตภัยกลืนกินเจ้า"
 natural_disaster.5101.a.tt.failure_root: "เจ้าตาย"
 natural_disaster.5101.a.tt.failure_secondary: "[at_risk_character.GetFirstNameNoTooltip] ตาย"
 natural_disaster.5101.b: "ตัวใครตัวมัน!"
 natural_disaster.5101.b.tt.success: "เจ้ารอดชีวิตอย่างหวุดหวิด"
 natural_disaster.5101.b.tt.failure: "เจ้าตาย"
 natural_disaster.5101.b.tt.at_risk_character_duel: "[at_risk_character.GetFirstNameNoTooltip] อาจตาย"
 natural_disaster.5101.c: "ข้าผลัก [at_risk_character.GetHerHim] ผ่านไป โดยรู้ว่าข้าต้องรับเคราะห์เอง"
 natural_disaster.5101.d: "ข้าผลัก [at_risk_character.GetTitledFirstNameNoTooltip] กระเด็นไปแล้วหนีเอาตัวรอด"
 natural_disaster.5102.t.affected: "[situation.GetNameNoTooltip]: ผู้รอดชีวิต"
 natural_disaster.5102.t.not_affected: "[situation.GetNameNoTooltip]: ยอดผู้เสียชีวิต"
 natural_disaster.5102.t.second_round: "— ผลกระทบระลอกสอง"
 natural_disaster.5102.t.third_round: "— ผลกระทบระลอกสาม"
 natural_disaster.5102.travel: "คณะผู้ติดตามของข้า"
 natural_disaster.5102.army: "กองทัพของข้า"
 natural_disaster.5102.activity: "ผู้เข้าร่วมทางขวามือของข้า"
 natural_disaster.5102.tent: "กระโจมของข้า"
 natural_disaster.5102.estate: "คฤหาสน์ของข้า"
 natural_disaster.5102.court: "ราชสำนักของข้า"
 natural_disaster.5102.desc.flood: "ถูกกระแสน้ำท่วมพัดพากระหน่ำ เสบียงและข้าวของของเราเปียกโชกไปกับคลื่นน้ำ\n\nข้าต้านทานกระแสน้ำได้สำเร็จ และเดินทางไปยังที่สูง ข้ามองลงไปเบื้องล่างและประจักษ์แก่สายตาถึงผลลัพธ์ และกลิ่นอายแห่งความตายก็คละคลุ้งไปทั่ว"
 natural_disaster.5102.desc.earthquake: "ถูกอาคารที่ถล่มลงมาทับ\n\nข้าหลบเศษซากที่ร่วงหล่นลงมาได้อย่างปาฏิหาริย์ และเคลื่อนตัวไปยังพื้นที่ที่มั่นคงกว่า ข้ามองดูร่างที่ถูกทับอยู่รอบกาย และความเจ็บปวดรวดร้าวก็บีบคั้นหัวใจข้า"
 natural_disaster.5102.a: "ข้าโชคดีที่ยังมีชีวิตอยู่"
 natural_disaster.5102.desc_remote.flood: "ทั่วทั้งอาณาจักรต่างเล่าลือถึง [situation.GetNameNoTooltip] ด้วยความหวาดผวา กระแสน้ำท่วมได้พรากชีวิตผู้คนมากมายทั่วดินแดนที่ประสบภัย แม้กระทั่งเหล่าขุนนางและข้าราชสำนัก แม้ว่าข้าจะอยู่ห่างไกลจากจุดที่เลวร้ายที่สุด ทว่าขนาดของความสูญเสียช่างน่าสลดใจ"
 natural_disaster.5102.desc_remote.earthquake: "ทั่วทั้งอาณาจักรต่างเล่าลือถึง [situation.GetNameNoTooltip] ด้วยความหวาดผวา โถงและหอคอยต่างพังทลายลง ทับถมเหล่าลอร์ดและครัวเรือนของพวกเขา ยอดผู้เสียชีวิตนั้นร้ายแรงนัก แม้ในหมู่ชนชั้นสูง"
 natural_disaster.5111.t: "[situation.GetNameNoTooltip]: ค่ายพักที่ประสบภัย"
 natural_disaster.5111.desc.flood: "เมื่อมิอาจต้านทานกระแสน้ำที่เชี่ยวกราก เหล่าม้าก็เริ่มลื่นไถล ฉุดรั้งผู้ขี่ให้ร่วงหล่นลงไปด้วย ความหวาดผวาระลอกแล้วระลอกเล่าถาโถมเข้าใส่ เมื่อสัตว์อีกมากถูกคลื่นน้ำกลืนกิน นักรบของข้าก็ประสบชะตากรรมเดียวกัน เกราะอันหนักอึ้งที่เคยปกป้องพวกเขากลับฉุดรั้งให้จมดิ่งสู่ความตายใต้บาดาล\n\n\"โปรดเมตตา, แด่ดวงวิญ...\" [knight.GetName] ร้องตะโกนก่อนที่ปากของเขาจะเต็มไปด้วยน้ำที่น่าอึดอัด"
 natural_disaster.5111.desc.earthquake: "พื้นดินที่ปริแยก ทำให้นักรบมากมายสะดุดและร่วงหล่นลงไปในเหวลึกที่เพิ่งถือกำเนิด คนอื่นๆ ติดอยู่หรือถูกทับโดยเศษซากที่ถล่มลงมา\n\nม้าผู้น่าสงสารของ [knight.GetNamePossessive] ถูกหินสลักยอดโค้งที่ร่วงหล่นกระแทกศีรษะ ตายในทันที แม้ว่าชีวิตของ [knight.GetNamePossessiveNoTooltip] จะรอดมาได้อย่างหวุดหวิด แต่สหายร่วมรบของ [knight.GetHerHis] กลับไม่เป็น เช่นนั้น"
 natural_disaster.5111.a: "ภาระแห่งสงครามยิ่งหนักอึ้งขึ้นทุกที"
 natural_disaster_army_damaged_title: "[situation.GetType.GetName] โจมตีกองทัพ"
 natural_disaster_allied_army_damaged_title: "[situation.GetType.GetName] โจมตีกองทัพพันธมิตร"
 natural_disaster_enemy_army_damaged_title: "[situation.GetType.GetName] โจมตีกองทัพศัตรู"

 natural_disaster.5901.t.earthquake: "[situation.GetNameNoTooltip]: โทสะแห่งผืนปฐพี"
 natural_disaster.5901.t.flood: "[situation.GetNameNoTooltip]: กระแสน้ำเชี่ยวกราก"
 natural_disaster.5901.desc.earthquake: "แรงสั่นสะเทือนใน [epicenter_county.GetNameNoTier] ได้ถึงจุดสูงสุดแล้ว สร้างความวินาศสันตะโรไปทั่วแผ่นดิน บ้านเรือนและสิ่งปลูกสร้างอื่นๆ พังทลายลงเป็นจำนวนมาก ผู้ที่พยายามหลบหนีต่างถูกเศษซากที่ถล่มลงมาทับ\n\nความพินาศนี้จุดชนวนเหตุการณ์เลวร้ายต่อเนื่อง ทั้งอัคคีภัยและความไม่สงบในหมู่ประชาชน ผู้กล้าพยายามช่วยเหลือผู้ที่ติดอยู่ใต้ซากปรักหักพัง เพียงเพื่อจะจบชีวิตลงด้วยกลุ่มควันและเปลวเพลิงที่โหมกระหน่ำทั่วทั้ง [epicenter_county.GetTierAsNameNoTooltip]"
 natural_disaster.5901.desc.flood: "มวลน้ำซัดผ่านถนนและตรอกซอกซอยของเมืองต่างๆ รอบ [river_region.GetNameNoTooltip] พัดพาร่างของผู้บริสุทธิ์ไปตามกระแสน้ำอันไร้ปรานี บ้างพยายามลุยฝ่าไป เพียงเพื่อจะถูกกลืนกินทั้งเป็น\n\nน้ำท่วมซึมเข้าไปใต้พื้นอาคาร ทำให้เนื้อไม้ชุ่มโชกและแน่ใจได้ว่าจะผุพังในอนาคต พืชผลถูกบดขยี้ด้วยพลังของอุทกภัยที่เชี่ยวกราก"
 natural_disaster.5901.a.earthquake: "[epicenter_county.GetNameNoTierNoTooltip] จะต้องพินาศย่อยยับ"
 natural_disaster.5901.a.flood: "ความพินาศจาก [river_region.GetNameNoTooltip] อยู่ใกล้แค่เอื้อม"
 natural_disaster.5902.desc: "ข่าวคราวจากภัยพิบัติครั้งล่าสุดช่างน่าหดหู่ และผู้คนก็กำลังสับสนอลหม่าน เหล่าผู้ปกครองในภูมิภาคโดยรอบเฝ้าดูความพินาศด้วยความสนใจอย่างยิ่ง ประเมินขอบเขตของความเสียหายอย่างระมัดระวัง\n\nจำต้องมีความพยายามในการควบคุมวิกฤต และกอบกู้สิ่งที่พอจะกู้คืนมาได้ คงไม่เป็นการฉลาดนักที่จะนิ่งดูดาย ในขณะที่เรื่อง เช่นนี้เกิดขึ้น"

 # RECOVERY
 natural_disaster.6901.t: "[situation.GetNameNoTooltip]: ผลที่ตามมา"
 natural_disaster.6901.desc.flood: "ในที่สุด ระดับน้ำของ [river_region.GetNameNoTooltip] ก็กลับสู่ภาวะปกติ แอ่งน้ำลึกยังคงกระจัดกระจายอยู่ทั่วแผ่นดิน แต่ดวงอาทิตย์ก็ส่องสว่างจ้า ในไม่ช้าน้ำส่วนเกินจะถูกดูดซับไปจากผืนดิน"
 natural_disaster.6901.desc.earthquake: "ผืนดินเงียบสงบลง และพื้นดินใน [epicenter_county.GetNameNoTier] ก็ไม่สั่นสะเทือนอีกต่อไป สิ่งที่เคยเป็น [epicenter_county.GetTierAsNameNoTooltip] อันรุ่งเรือง บัดนี้กลับเหลือเพียงซากปรักหักพัง โดยมีอาคารเหลือรอดอยู่เพียงหยิบมือ"
 natural_disaster.6901.desc: "\n\nมีความรู้สึกโล่งใจอยู่บ้าง แต่ก็เป็นที่ประจักษ์ชัดว่าภูมิภาคแห่งนี้เหลือเพียงเปลือกของอดีตที่เคยเป็น ความพินาศนี้จะถูกเล่าขานไปอีกหลายปี และกัดกินจิตวิญญาณของผู้รอดชีวิต"
 natural_disaster.6901.a: "หนทางสู่การฟื้นฟูความสงบเรียบร้อยยังอีกยาวไกล"
 natural_disaster.6902.desc: "ทั้งขุนนางและสามัญชนต่างยินดีที่ [situation.GetNameNoTooltip] สิ้นสุดลง ความสุขนั้นช่างสั้นนัก เมื่อผลกระทบจากภัยพิบัติกำลังจะถูกเปิดเผยในไม่ช้า ความพยายามในการฟื้นฟูสิ่งที่สูญเสียไปกำลังดำเนินอยู่ และการปลอบประโลมผู้ที่ตกเป็นเหยื่อของความโกลาหล"
 natural_disaster.6902.a: "หวังว่าความพยายามนั้นจะเพียงพอ"
 natural_disaster.6911.t: "[situation.GetNameNoTooltip]: เสนาบดีส่งความช่วยเหลือ"
 natural_disaster.6911.desc: "[minister_helper.GetName] ผู้ช่วยจาก [minister.GetTitledFirstName] สำรวจพื้นที่ [situation.GetNameNoTooltip]\n\n"ขอแสดงความเสียใจด้วย [ROOT.Char.GetNameNoTooltip] ข้าถูกส่งมาโดย [minister.GetTitledFirstNameNoTooltip] เพื่อช่วยท่านกอบกู้สถานการณ์ กระทรวงยินดีทำทุกวิถีทาง เนื่องจาก [minister.GetTopLiege.GetTitledFirstName] คาดหวังการฟื้นตัวอย่างรวดเร็ว""
 natural_disaster.6911.minister_chancellor: ""ข้ารู้สึกเป็นเกียรติในความเมตตาของ [minister.GetHerHis]""
 natural_disaster.6911.minister_censor: ""การต่อสู้กับการทุจริตคือสิ่งที่ข้าต้องการ""
 natural_disaster.6911.minister_grand_marshal: ""ข้าต้องการรักษาความสงบเรียบร้อย""
 natural_disaster.6911.minister_of_personnel: ""ข้าจะเป็นแขนขาให้อิทธิพลของ [minister.GetTitledFirstNamePossessiveNoTooltip] เอง""
 natural_disaster.6911.minister_of_revenue: ""จำเป็นต้องมีการผ่อนปรนภาษี""
 natural_disaster.6911.minister_of_rites: ""คำอธิษฐานจะช่วยได้มาก""
 natural_disaster.6911.minister_of_war: ""ป้อมปราการที่มากขึ้นจะช่วยป้องกันภัยพิบัติในอนาคต""
 natural_disaster.6911.minister_of_justice: "$natural_disaster.6911.a.minister_censor$"
 natural_disaster.6911.minister_of_works: ""การตั้งรกรากใหม่ให้ผู้ประสบภัยคือภารกิจสำคัญสูงสุด""
 natural_disaster.6911.a: ""ค่าใช้จ่ายสูงลิ่ว ข้าต้องการเงินจากคลัง""
 natural_disaster_recovery_minister_of_revenue_tt: "ป้องกัน [modifiers|E] เชิงลบทั้งหมดของ[tax|E] จาก [great_project_contributions|E] ใน [great_project.GetName]"
 natural_disaster_recovery_minister_of_works_tt: "ป้องกัน [modifiers|E] เชิงลบทั้งหมดของ[domain|E] จาก [great_project_contributions|E] ใน [great_project.GetName]"
 minister_has_aidee_to_send_tt: "จ้าง [GetCourtPositionType( 'minister_bureaucrat_court_position' ).GetName]"

 # WARNING
 natural_disaster.7001.t: "[epicenter_county.GetNameNoTierNoTooltip]: แรงสั่นสะเทือนอันอัปมงคล"
 natural_disaster.7001.desc: "[epicenter_county.GetProvince.GetCounty.GetFaith.HouseOfWorshipPlural|U]และสักการสถานใน [epicenter_county.GetNameNoTier] เริ่มพังทลาย เนื่องจากแผ่นดินไหว สร้างความหวาดหวั่นแม้ในหมู่ผู้ศรัทธาที่เคร่งครัดที่สุด เป็นที่ชัดเจนว่าแรงสั่นสะเทือนจะไม่ลดละ และทวีความรุนแรงขึ้นทุกขณะ"
 natural_disaster.7001.a: "ภัยพิบัตินี้ต้องการความใส่ใจ #EMP อย่างเต็มที่#! จากข้า!"
 natural_disaster.7001.a.tt: "เจ้าจะเข้าสู่ภาวะผู้สำเร็จราชการแทนจนกว่าภัยพิบัติจะถึง $game_concept_situation_phase$ การฟื้นฟู"
 natural_disaster.7001.a.tt.already_in_diarchy: "เจ้าอยู่ในภาวะ [power_sharing|E] อยู่แล้ว และไม่จำเป็นต้องเปลี่ยนแปลงใดๆ เพื่อรองรับภาระที่เพิ่มขึ้น"
 natural_disaster.7001.a.tt.discount: "การสนับสนุนโครงการฟื้นฟู [disaster|E] จะใช้ค่าใช้จ่าย #v น้อยลง 10%#! ในขณะที่เจ้าอยู่ในภาวะ [power_sharing|E]"
 natural_disaster.7001.b: "เราต้องดูแลพวกพ้องของเราเอง!"
 natural_disaster.7001.b.tt: "เจ้าสามารถ $isolate_family_decision$"
 natural_disaster.7001.c: "ขอ [ROOT.Char.GetFaith.HighGodName] ทรงโปรดเมตตาเราด้วย!"
 natural_disaster.7011.t: "[epicenter_county.GetNameNoTierNoTooltip]: สัตว์ป่าหนีตาย"
 natural_disaster.7011.desc: "สัตว์ใน [epicenter_county.GetNameNoTier] เริ่มอพยพครั้งใหญ่ เนื่องจากแรงสั่นสะเทือนใต้ถิ่นที่อยู่ของพวกมันคุกคามการอยู่รอด ฝูงนกเริ่มอพยพก่อนกำหนด ฝูงของพวกมันบดบังแสงสว่างบนท้องฟ้า\n\nผู้คนบางส่วนติดตามเส้นทางของสัตว์เพื่อแสวงหาความปลอดภัย แต่ผู้อยู่อาศัยจำนวนมากยังคงอยู่ในบ้าน ยึดมั่นกับความหวังว่าแรงสั่นสะเทือนจะผ่านพ้นไป"
 natural_disaster.7011.d: "ธรรมชาติรับรู้สัญญาณเตือน ขณะที่เรายังคงนิ่งนอนใจ"
 natural_disaster.7021.t: "[river_region.GetNameNoTooltip]: ตลิ่งบวม"
 natural_disaster.7021.desc: "สายลมพัดพาน้ำจากต่างถิ่นเข้ามายัง [river_region.GetNameNoTooltip] ที่อยู่ใกล้เคียง ผลักดันให้ระดับน้ำสูงเกินขอบตลิ่ง บ้างก็เก็บน้ำส่วนเกินไว้ใช้ตามความต้องการ แต่น้ำก็ยังคงเอ่อล้นไม่หยุด\n\nชนบทโดยรอบกลายเป็นหนองบึง และโคลนก็จับตัวตามอาคารต่างๆ รอบเมือง"
 natural_disaster.7021.a: "สายน้ำเหล่านี้ไร้การควบคุม"
 natural_disaster.7031.t: "[river_region.GetNameNoTooltip]: ฝนห่าใหญ่"
 natural_disaster.7031.desc: "หยาดน้ำฟ้าที่รอคอยตกลงสู่ผืนดินใกล้กับ [river_region.GetNameNoTooltip] สร้างความมั่นใจว่าการเก็บเกี่ยวจะดำเนินต่อไปตามที่เพาะปลูกไว้\n\nแม้ว่าผืนดินจะชุ่มชื้นเกินพอแล้ว สายฝนกลับทวีความรุนแรงและไม่มีทีท่าว่าจะหยุด มองไม่เห็นดวงอาทิตย์ และแม่น้ำก็เริ่มเอ่อล้นเข้าสู่แผ่นดิน"
 natural_disaster.7031.a: "ขอฟากฟ้าจงปรานี"

 # JOIN
 natural_disaster.8001.t.earthquake: "[epicenter_county.GetNameNoTierNoTooltip]: เสียงคำรามจากเบื้องลึก"
 natural_disaster.8001.t.flood: "[river_region.GetNameNoTooltip]: ระดับน้ำสูงสุด"
 natural_disaster.8001.desc.earthquake: "ข่าวมาถึงข้าถึงความวุ่นวายครั้งใหญ่ใน [epicenter_county.GetName] ผืนดินใต้ภูมิภาคนั้นสั่นสะเทือนและไหวระริก พร้อมกับรอยแตกที่ก่อตัวบนพื้นผิว สิ่งปลูกสร้างขนาดเล็กเริ่มพังทลาย\n\nผู้อยู่อาศัยใน [epicenter_county.GetTierAsNameNoTooltip] เริ่มกระสับกระส่าย เป็นอันตรายต่อความพยายามในการจัดการ แม้พวกเขาจะตื่นตระหนก ข้าก็ต้องพยายามลดความเสียหายที่จะเกิดขึ้น และเตรียมพร้อมสำหรับความพินาศที่กำลังจะมาเยือน"
 natural_disaster.8001.desc.flood: "น้ำใน [river_region.GetName] สูงขึ้นกว่าระดับปกติ ทำให้ดินในพื้นที่โดยรอบเปียกชื้น แม้ว่ามันจะช่วยส่งเสริมการเก็บเกี่ยว แต่น้ำยังคงสูงขึ้นอย่างต่อเนื่องโดยไม่หยุดพัก\n\nคงเป็นการฉลาดที่จะหยุดการก่อสร้างทั้งหมดในภูมิภาคจนกว่าน้ำท่วมจะลดลง และ เพื่อให้แน่ใจว่าผู้คนจำนวนมากที่สุดเท่าที่จะเป็นไปได้สามารถไปถึงที่ปลอดภัย"
 natural_disaster.8001.a: "นี่หมายความได้อย่างเดียว..."
 natural_disaster.8001.a.tt.earthquake: "[earthquake|E] กำลังจะจู่โจม [epicenter_county.GetNameNoTier] ในไม่ช้า"
 natural_disaster.8001.a.tt.flood: "[river_region.GetName] จะ [flood|E] ในไม่ช้า"
 natural_disaster.8002.t: "[situation.GetNameNoTooltip]: ผลกระทบต่อเนื่อง"
 natural_disaster.8002.desc.earthquake: "[epicenter_county.GetName] กำลังถูกทำลายล้างโดยแผ่นดินไหวรุนแรง มีแนวโน้มว่า [epicenter_county.GetTierAsNameNoTooltip] จะเหลือเพียงซากปรักหักพัง และผู้อยู่อาศัยต้องพลัดถิ่น\n\n"
 natural_disaster.8002.desc: "ทรัพยากรเพื่อช่วยเหลือเหยื่อและฟื้นฟูภูมิภาคกำลังถูกรวบรวม แต่เรายังไม่เห็นผลลัพธ์ทั้งหมดของภัยพิบัติ"
 natural_disaster.8002.desc.flood: "[river_region.GetName] ได้เอ่อล้น น้ำของมันซึมเข้าไปในชุมชนใกล้เคียง อาคารหลายแห่งถูกทิ้งร้าง และมีแนวโน้มว่าการเก็บเกี่ยวใดๆ จะต้องสูญสิ้นไป"
 natural_disaster.8002.a: "สถานการณ์ร้ายแรงนัก"
 natural_disaster.8002.a.tt: "กำลังเกิด [flood|E] จาก [river_region.GetName]"
 natural_disaster.8002.a.tt.earthquake: "กำลังเกิด [earthquake|E] ใน [epicenter_county.GetNameNoTier]"
 natural_disaster.8003.t: "[situation.GetNameNoTooltip]: ผลที่ตามมา"
 natural_disaster.8003.desc.earthquake: "พลเมืองที่หลบหนีถูกอาคารที่ถล่มลงมาทับ เศษซากขวางทางหนี อัคคีภัย และการปล้นสะดม...\n\nเป็นเพียงส่วนหนึ่งของความโหดร้ายที่ผู้อยู่อาศัยใน [epicenter_county.GetNameNoTier] ได้ประสบจากแผ่นดินไหวครั้งล่าสุด"
 natural_disaster.8003.desc.flood: "ครอบครัวที่ถูกกระแสน้ำพัดพาไป พืชผลที่สุกงอมสูญหายไปในน้ำ อาคารที่เต็มไปด้วยน้ำขุ่น...\n\nนี่คือชะตากรรมของพื้นที่โดยรอบ [river_region.GetName] หลังจากน้ำท่วม"
 natural_disaster.8003.desc_outro: "\n\nความพยายามบรรเทาทุกข์กำลังดำเนินการ แต่ความเสียหายที่เกิดขึ้นอาจคงอยู่ในภูมิภาคไปอีกนาน"
 natural_disaster.8003.a: "เราต้องสร้างขึ้นใหม่"
 natural_disaster.8003.a.tt: "เกิด [flood|E] จาก [river_region.GetName]"
 natural_disaster.8003.a.tt.earthquake: "เกิด [earthquake|E] ใน [epicenter_county.GetNameNoTier]"

 disaster_option_warning: "@warning_icon! #warning นี่อาจเป็นอันตรายร้ายแรงถึงชีวิตและร่างกาย!#!"
 travel_to_epicenter_county: "วางแผน [travel|E] ไปยัง [epicenter_county.GetName]"
