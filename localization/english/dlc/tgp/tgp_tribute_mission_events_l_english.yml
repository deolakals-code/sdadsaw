l_english: 

 tribute_mission_header: "ภารกิจบรรณาการ:"
 #Tributary: Fork over Tribute
 tribute_mission_suzerain_legitimacy_gain_title: "ได้รับความชอบธรรมจากบรรณาการ"
 tribute_mission_tributary_subject_standing_gain_title: "ได้รับ [ConcatIfNeitherEmpty(GetPlayer.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')]"
 tribute_mission_tributary_subject_standing_gain_tt_minor: "[tributary_scope.GetShortUIName|U] ได้รับ [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')] บ้าง"
 tribute_mission_tributary_subject_standing_gain_tt_major: "[tributary_scope.GetShortUIName|U] ได้รับ [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')] #EMP จำนวนมาก#!"
 tribute_mission.1000.t: "$tribute_mission_header$ การถวายบรรณาการ"
 tribute_mission.1000.intro: "เราเข้าสู่ห้องโถงใหญ่แห่ง [overlord_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] และได้รับการต้อนรับจาก"
 tribute_mission.1000.intro.overlord: "[overlord_scope.GetTitledFirstName] ทรงให้สัญญาณให้เราเข้าเฝ้าอย่างสง่างาม"
 tribute_mission.1000.intro.diarch: "[receiving_character.GetDiarchTitle] ของ [overlord_scope.GetTitledFirstNamePossessive] คือ [receiving_character.GetTitledFirstName] กำลังให้สัญญาณให้เราเข้าไปใกล้"
 tribute_mission.1000.intro.councillor: "[receiving_character.Custom('CouncilPosition')] ของ [overlord_scope.GetTitledFirstNamePossessive] คือ [receiving_character.GetTitledFirstName] พยักหน้า [receiving_character.GetHerHis] และให้สัญญาณให้เราเข้าไปใกล้"
 tribute_mission.1000.intro.attendant: "หนึ่งในข้ารับใช้ชั้นสูงของ [overlord_scope.GetTitledFirstNamePossessive] ยิ้มอย่างขออภัยและให้สัญญาณให้เราเข้าไปใกล้"
 tribute_mission.1000.desc.segway: "\n\nโดยไม่รอช้า ข้าพเจ้าประกาศว่า:"
 tribute_mission.1000.desc.bunga_mas: "“ชื่นชมความงดงามนี้เถิด ชุดต้นไม้บุหงามัสคุณภาพสูงสุด สร้างขึ้นเพื่อ [overlord_scope.GetTitledFirstNameNoTooltip] ผู้ยิ่งใหญ่ที่สุดเท่านั้น!” ดวงตาของฝูงชนเบิกกว้างและเสียงพึมพำหลายครั้งก็ดังขึ้นในห้องโถง"
 tribute_mission.1000.desc.small_gold: ""โปรดให้ข้าพเจ้าได้ถวายเครื่องบรรณาการอันนอบน้อม แม้จะเล็กน้อยในมูลค่า แต่ยิ่งใหญ่ในจิตวิญญาณ!" ข้าพเจ้าโค้งคำนับขณะที่คนรับใช้นำกล่องสินค้าเล็กๆ เข้ามา"
 tribute_mission.1000.desc.adequate_gold: ""เราขอนำเสนอเครื่องบรรณาการอันยอดเยี่ยม เพื่อสะท้อนถึงความซาบซึ้งต่อ [overlord_scope.GetLadyLord] ของเรา!" ข้าพเจ้ายิ้มและพยักหน้าขณะที่ตะกร้าและโถมากมายถูกนำเสนอต่อห้องโถง"
 tribute_mission.1000.desc.excessive_gold: ""จงชื่นชมความงดงามอลังการนี้เถิด!" ข้าพเจ้ายิ้มอย่างภาคภูมิใจขณะที่ทั้งห้อง #EMP ต่างร้องอื้ออึง#! และ #EMP อ้าปากค้าง#! ให้กับความหรูหราโอ่อ่าของเครื่องบรรณาการที่นำเสนอ ทั้งกล่อง โถ ตะกร้า รูปปั้น #EMP มากมายมหาศาลเหลือเกิน.#!"
 tribute_mission.1000.desc.small_herd: ""เราได้นำสิ่งมีชีวิตที่ดีที่สุดจากฝูงสัตว์ของเรามา พร้อมที่จะรับใช้ [overlord_scope.GetLadyLord] ของข้า!""
 tribute_mission.1000.desc.adequate_herd: ""คอกม้ากำลังจะเต็มไปด้วยสัตว์ของเรา ทั้งเล็กและใหญ่ ทั้งหมดนี้เพื่อ [overlord_scope.GetLadyLord] ของเรา!""
 tribute_mission.1000.desc.excessive_herd: ""สัตว์จำนวนมหาศาล ทั้งใหญ่ เล็ก แข็งแรง รวดเร็ว ได้ถูกนำมาถวายแด่ [overlord_scope.GetLadyLord] ของเรา! พวกมันจะรับใช้ราชสำนัก [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] เป็นอย่างดี!""
 tribute_mission.1000.desc.concubine: ""... ข้าขอนำเสนอ [human_tribute.GetTitledFirstName] ผู้น่ารัก ดอกไม้อีกหนึ่งดอกในสวนแห่ง [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!" และ [human_tribute.GetTitledFirstNameNoTooltip] ก็ก้าวออกมาอย่างงดงาม ใบหน้าแดงก่ำขณะที่ [human_tribute.GetSheHe] ดึงดูดความสนใจของทั้งห้อง"
 tribute_mission.1000.desc.eunuch: ""... ขอเชิญพบกับขันทีผู้ทรงเกียรติ [human_tribute.GetTitledFirstName] ผู้ภูมิใจที่จะได้รับใช้ราชสำนัก [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!" และ [human_tribute.GetTitledFirstNameNoTooltip] ก็ก้าวไปข้างหน้า ทำให้ทั้งห้องเต็มไปด้วยเสียงกระซิบกระซาบอื้ออึง"
 tribute_mission.1000.desc.artifact: ""[artifact_to_tribute.Custom('ArtifactType')|l] นี้เป็นหนึ่งในสมบัติล้ำค่าที่สุดของข้า — บัดนี้มันเป็นของ [overlord_scope.GetTitleAsNameNoTooltip] เพื่อเป็นเครื่องแสดงถึงความซาบซึ้งร่วมกันของเรา" "
 tribute_mission.1000.outro.attendant: "\n\nข้ารับใช้ครุ่นคิดอยู่ครู่หนึ่ง เปิดโอกาสให้ข้าพเจ้าชิงพูดแทรกขึ้นว่า:"
 tribute_mission.1000.outro: "\n\n[receiving_character.GetTitledFirstNameNoTooltip] ครุ่นคิดอยู่ครู่หนึ่ง เปิดโอกาสให้ข้าพเจ้าชิงพูดแทรกขึ้นว่า:"
 tribute_mission.1000.treasury: ""ตอนนี้ ผ้าทอแห่ง [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]... ช่างงดงามยิ่งนัก...""
 tribute_mission.1000.success.t: "สำเร็จ"
 tribute_mission.1000.success.desc: "ท่านโน้มน้าว [receiving_character.GetHerHim] ได้สำเร็จ"
 tribute_mission.1000.failure.t: "ความพยายามล้มเหลว"
 tribute_mission.1000.failure.desc: "ความพยายามของท่านถูกเพิกเฉย"
 tribute_mission.1000.failure.tt: "[receiving_character.GetShortUIName] ตัดสินใจเรื่องของขวัญ"
 tribute_mission.1000.artifact: ""งานฝีมือของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip|U] นี่สิ ถึงจะนับเป็นของ...""
 tribute_mission.1000.artifact.tt: "ท่านได้รับ [artifact|E] ของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
 tribute_mission.1000.innovation: ""การแบ่งปันความรู้ — จะมีจุดประสงค์ใดอันสูงส่งไปกว่านี้อีกเล่า...""
 tribute_mission.1000.innovation.tt: "ท่านค้นพบ [innovation|E] ใหม่เพื่อการวิจัย หรือได้รับความคืบหน้า [fascination|E]"
 tribute_mission.1000.development: ""เกี่ยวกับตลาดที่ยังไม่ถูกบุกเบิกใน [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]...""
 tribute_mission.1000.monk.tt: "[receiving_character.GetShortUIName] จะมอบนักบวช [overlord_scope.GetFaith.GetAdjective] [courtier|E] แก่ท่าน"
 tribute_mission.1000.abstain: ""ขอ [tributary_scope.GetFaith.HighGodName] โปรดนำความเจริญรุ่งเรืองมาสู่เราด้วยเถิด""
 tribute_mission.1000.abstain.treasury.desc: "สินค้ามีค่าถูกมอบให้"
 tribute_mission.1000.abstain.artifact.desc: "สิ่งประดิษฐ์อันน่าอัศจรรย์ถูกสร้างขึ้น"
 tribute_mission.1000.abstain.innovation.desc: "ความก้าวหน้าทางเทคโนโลยีถูกแบ่งปัน"
 tribute_mission.1000.abstain.development.desc: "พ่อค้าชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] ถูกส่งไปยังเมืองหลวงของท่าน"
 tribute_mission.1000.abstain.monk.desc: "นักบวช [overlord_scope.GetFaith.GetAdjective] ถูกมอบให้แก่ท่าน เพื่อเผยแผ่ปัญญา"
 tribute_mission.1000.abstain.legitimacy.desc: "ท่านได้รับพรแห่งความชอบธรรมเป็นพิเศษ"
 #Recipient: Decide on the human tribute
 tribute_mission.1002.t: "$tribute_mission_header$ ชะตากรรมใดที่รออยู่เบื้องหน้า"
 tribute_mission.1002.segway: "[tributary_scope.GetTitledFirstName|U] เข้ามาในห้องโถงใหญ่พร้อมกับคณะผู้ติดตาม กระตือรือร้นที่จะถวายบรรณาการของ [tributary_scope.GetHerHis]"
 tribute_mission.1002.desc.concubine: "ดูเหมือนจะเป็นนางสนมผู้เย้ายวน นามว่า [human_tribute.GetTitledFirstName]"
 tribute_mission.1002.desc.new_eunuch: "ดูเหมือนจะเป็นขันทีที่อึดอัดใจอย่างมาก\n\n[human_tribute.GetWomanMan] ผู้นี้ ซึ่งถูกแนะนำในนาม [human_tribute.GetTitledFirstName] แสดงอาการสะดุ้งอย่างเห็นได้ชัดขณะที่ [human_tribute.GetSheHe] เดินโซเซเข้ามาหาข้าเพื่อพินิจดูใกล้ๆ"
 tribute_mission.1002.desc.eunuch: "ดูเหมือนจะเป็นขันทีผู้ช่ำชอง\n\n[human_tribute.GetWomanMan] ผู้นี้ ซึ่งถูกแนะนำในนาม [human_tribute.GetTitledFirstName] แผ่รัศมีความสงบเยือกเย็นเกินวัย และจ้องมองข้าอย่างเงียบงันขณะที่ข้าพินิจพิเคราะห์ [human_tribute.GetHerHis]"
 tribute_mission.1002.beauty.concubine.good: "\n\nเส้นผมของ [human_tribute.GetHerHis|U] เป็นมันเงา ผิวพรรณผุดผ่อง ดวงตาเป็นประกาย และรูปร่างก็น่าพิศมัย... ข้าจับจ้องรูปร่างของ [human_tribute.GetHerHis] อย่างชื่นชม ยังไม่รู้สึกอิ่มเอมใจเต็มที่นัก"
 tribute_mission.1002.beauty.concubine.bad: "\n\nผมเผ้ายุ่งเหยิง ผิวพรรณตกกระ... มุมของขากรรไกร ช่างมีคุณสมบัติดีๆ ในด้านรูปลักษณ์ของ [human_tribute.GetHerHis] น้อยเสียนี่กระไร ข้าเม้มปากเล็กน้อย"
 tribute_mission.1002.physique.concubine.good: "\n\nร่างกายอันน่าประทับใจของ [human_tribute.GetWomanMan] ผู้นี้ ทำให้ข้ารู้สึกแข็งแรงขึ้นเพียงแค่มอง [human_tribute.GetHerHim] ข้าพบว่าตัวเองค่อนข้างเพลิดเพลินกับมัน"
 tribute_mission.1002.physique.concubine.bad: "\n\nการกระแอมกระไอไม่หยุดหย่อน แขนขาที่ผอมเกร็ง... มีบางอย่างผิดปกติกับร่างกายของ [human_tribute.GetHerHis] แต่ก็ยากที่จะระบุได้แน่ชัดว่าคืออะไร มัน ทำให้ข้ารู้สึกอึดอัดเล็กน้อย"
 tribute_mission.1002.exterior.plain: "\n\nรูปลักษณ์ของ [human_tribute.GetHerHis|U] อาจไม่มีอะไรโดดเด่น แต่ประกายในดวงตาของ [human_tribute.GetHerHis] ก็ยัง ทำให้ข้าสนใจ"
 tribute_mission.1002.personality.shy: "\n\n[human_tribute.GetSheHe|U] สะดุ้งเมื่อทหารยามสองสามคนเดินผ่านไปใกล้เกินไป พยายามใช้พื้นที่ให้น้อยที่สุด [human_tribute.GetSheHe] ห่อไหล่ [human_tribute.GetHerHis] เล็กน้อย ไม่ส่งเสียงใดๆ ให้ [human_tribute.GetHerselfHimself] เป็นที่สังเกต"
 tribute_mission.1002.personality.bold: "\n\nท่าทางที่กระฉับกระเฉงบ่งบอกว่า [human_tribute.GetWomanMan] ผู้นี้สามารถยืนหยัดด้วย [human_tribute.GetHerHis] ลำแข้งได้ ไม่ว่าจะดีหรือร้าย"
 tribute_mission.1002.personality.cynical: "\n\nอาการกระตุกที่หางตาของ [human_tribute.GetHerHis] ขณะที่แขนของ [human_tribute.GetHerHis] ยกขึ้นมาในท่าป้องกันตัว บ่งบอกว่า [human_tribute.GetWomanMan] ผู้นี้มีมุมมองต่อโลกที่เฉพาะตัวอย่างมาก"
 tribute_mission.1002.personality.angry: "\n\nรอยย่นระหว่างคิ้วของ [human_tribute.GetHerHis] ที่ลึกขึ้นเรื่อยๆ บอกเล่าเรื่องราวของ [human_tribute.GetWomanMan] ที่มีความคิดเห็นเป็นของตนเองอย่างมาก"
 tribute_mission.1002.personality.fallback: "\n\n[human_tribute.GetFirstNameNoTooltip] ชำเลือง [human_tribute.GetHerHis] ตามองมาทางข้า แล้วกวาดสายตามองไปรอบห้อง จากนั้นก็กลับมามองข้า ราวกับกำลังมองหาคำใบ้เพื่อไขปริศนา"
 tribute_mission.1002.a: ""[human_tribute.GetSheHe|U] คงจะมีประโยชน์ในราชสำนักสักแห่ง""
 tribute_mission.1002.b: ""อืม เราควรจะ แต่งตั้งเจ้า #EMP ทันทีเลยดีกว่า...#!""
 tribute_mission.1002.b.flavor: "นี่มัน #EMP ตัวอย่างชั้นดี#! มิใช่หรือ..."
 tribute_mission.1002.c: ""เจ้าจะทำงานให้ข้าโดยตรง""
 tribute_mission.1002.d: ""อืม ข้าเชื่อว่าตอนนี้เราคนเต็มหมดแล้ว""
 tribute_mission.1002.d.tt: "[human_tribute.GetShortUIName] ถูกนำตัวกลับไปยัง [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier]"
 #Recipient: What do you get/give?
 tribute_mission.1005.t: "$tribute_mission_header$ เครื่องบรรณาการ"
 tribute_mission.1005.t.ai.bunga_mas: "$tribute_mission_header$ [newly_created_bunga_mas.GetNameNoTooltip]"
 tribute_mission.1005.t.bunga_mas: "$tribute_mission_header$ บุปผาทองคำของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.t.gold: "$tribute_mission_header$ ทองคำของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.t.herd: "$tribute_mission_header$ ฝูงสัตว์ของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.t.concubine: "$tribute_mission_header$ ดอกไม้ของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.t.eunuch: "$tribute_mission_header$ ปัญญาของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.t.artifact: "$tribute_mission_header$ สิ่งประดิษฐ์ของ [tributary_scope.GetTitledFirstNamePossessiveNoTooltip]"
 tribute_mission.1005.intro.human_tribute: "[tributary_scope.GetTitledFirstName] เริ่มขยับตัวไปมาขณะที่ [tributary_scope.GetSheHe] รอการตัดสินใจของข้า เหลือบมอง [human_tribute.GetTitledFirstName] เป็นครั้งคราว"
 tribute_mission.1005.intro: "[tributary_scope.GetTitledFirstName] ก้าวเข้ามาในห้องโถงใหญ่ เดินกรีดกรายมาหาข้า และถวายบรรณาการของ [tributary_scope.GetHerHis] พร้อมรอยยิ้มประจบสอพลอ:"
 tribute_mission.1005.desc.bunga_mas: "\n\nต้นบุปผาทองคำ! สิ่งประดิษฐ์อันวิจิตรตระการตาสูงตระหง่านอยู่เหนือเครื่องบรรณาการอื่น ๆ ที่เมื่อเปรียบเทียบกันแล้วช่างเล็กน้อย ใบไม้เล็ก ๆ ต้องแสงและดูเหมือนจะเปล่งประกายเจิดจ้า เทียบได้กับตัวข้าเท่านั้น\n\nข้ารีบรวบรวมสติ พยายามไม่แสดงท่าทีมากเกินไป ขณะครุ่นคิดว่าควรจะประทานความเมตตาใดเป็นการตอบแทนของขวัญอันงดงามนี้..."
 tribute_mission.1005.desc.small_gold: "\n\nข้าเลิกคิ้วขณะที่คนรับใช้ตรวจสอบเหรียญและเครื่องประดับเพียงหยิบมือ ซึ่งเป็นเครื่องบรรณาการอันน้อยนิดนี้\n\nมันคงไม่ ทำให้คลังของเราเต็ม — แต่อย่างน้อย [tributary_scope.GetTitledFirstNameNoTooltip] ก็ได้ปฏิบัติตามภาระหน้าที่ [tributary_scope.GetHerHis] ในฐานะผู้ส่งบรรณาการแล้ว บัดนี้ ข้าควรจะมอบความเมตตาใดเป็นการตอบแทน..."
 tribute_mission.1005.desc.adequate_gold: "\n\nข้าพยักหน้าเล็กน้อยให้กับเครื่องบรรณาการที่น่านับถือ โลหะมีค่าและผ้าทอต้องแสงเป็นประกายระยิบระยับเป็นครั้งคราว\n\nบัดนี้ ถึงวาระถัดไป: ข้าควรจะมอบความเมตตาใดเป็นการตอบแทน..."
 tribute_mission.1005.desc.excessive_gold: "\n\nทองคำ ผ้าทอ อัญมณี — การจัดแสดงความมั่งคั่งอันล้นเหลือที่อาจจะดูฉูดฉาด แต่ก็ #EMP น่าชื่นชม#! ต้อนรับข้า ข้าควบคุมสีหน้าอย่างระมัดระวัง พยายามไม่แสดงความประทับใจจนเกินไป\n\n นี่ใช้ได้ทีเดียว บัดนี้ จะให้รางวัลแก่การแสดงความโอ่อ่านี้อย่างไรดี..."
 tribute_mission.1005.desc.small_herd: "\n\nฝูงสัตว์จำนวนเล็กน้อยส่งเสียงร้องและมองไปรอบๆ อย่างกังวลขณะที่คนรับใช้ตรวจสอบพวกมัน\n\nมันไม่มากนัก — แต่อย่างน้อย [tributary_scope.GetTitledFirstNameNoTooltip] ก็ได้ปฏิบัติตามภาระหน้าที่ [tributary_scope.GetHerHis] ในฐานะผู้ส่งบรรณาการแล้ว บัดนี้ ข้าควรจะมอบความเมตตาใดเป็นการตอบแทน..."
 tribute_mission.1005.desc.adequate_herd: "\n\nสัตว์คุณภาพดีที่น่าพอใจมองไปรอบห้องอย่างสงสัยใคร่รู้ขณะที่ถูกคนรับใช้ของข้าตรวจสอบ\n\nพวกนี้จะเป็นส่วนเสริมที่ดีทีเดียว บัดนี้ จะให้รางวัลสำหรับสิ่งนี้อย่างไรดี..."
 tribute_mission.1005.desc.excessive_herd: "\n\nปศุสัตว์ที่สมบูรณ์แบบที่สุดเท่าที่ข้าเคยเห็นบางส่วนถูกนำมาจัดแสดงเป็นเครื่องบรรณาการ: ขนเป็นมันเงา ดวงตาเป็นประกาย — และยังมีอีกมากรออยู่ข้างนอก ช่างเป็นเครื่องบรรณาการที่น่าประทับใจอย่างแท้จริง\n\nบัดนี้ จะให้รางวัลแก่การแสดงความโอ่อ่านี้อย่างไรดี..."
 tribute_mission.1005.desc.rejected_concubine: "\n\nช่างเป็นตัวอย่างที่น่ารังเกียจ ข้าเม้มปากขณะที่ทอดสายตามองสิ่งที่เรียกว่าเครื่องบรรณาการนี้อีกครั้ง และ [tributary_scope.GetTitledFirstNameNoTooltip] ก็ยังเห็นว่า [human_tribute.GetHerHim] คู่ควรแก่ความสนใจของเรา #EMP หึ.#!\n\nบัดนี้ ข้าควรจะมอบสิ่งใดแก่ [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.appointed_concubine: "\n\nจิตใจของข้าเหม่อลอยเล็กน้อยขณะที่ข้ามองส่วนโค้งเว้าและ #EMP คุณสมบัติ#! ของ [human_tribute.GetHerHis] อย่างอายๆ\n\nขณะที่เลือดเริ่มสูบฉีดไปที่แก้ม ข้าบังคับตัวเองให้จดจ่อกับเรื่องตรงหน้า — ข้าควรมอบสิ่งใดแก่ [tributary_scope.GetTitledFirstNameNoTooltip] สำหรับการนำเครื่องบรรณาการอัน #EMP เย้ายวน#! นี้มาให้เรา?"
 tribute_mission.1005.desc.concubine: "\n\nเมื่อเพิ่ม [human_tribute.GetHerHim] เข้ามาในราชสำนักของเราแล้ว ข้ามั่นใจว่า [human_tribute.GetSheHe] จะมีประโยชน์ในสักแห่ง\n\nด้วยเหตุนี้ ข้าควรตัดสินใจว่าจะมอบสิ่งใดแก่ [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.rejected_eunuch: "$tribute_mission.1005.desc.rejected_concubine$"
 tribute_mission.1005.desc.appointed_eunuch: "\n\nในฐานะหัวหน้าขันทีคนใหม่ของข้า [human_tribute.GetSheHe] จะรับใช้ข้าเป็นอย่างดี\n\nข้าแสยะยิ้มเล็กน้อยขณะพิจารณาอย่างรอบคอบว่าจะมอบสิ่งใดแก่ [tributary_scope.GetTitledFirstNameNoTooltip]..."
 tribute_mission.1005.desc.eunuch: "$tribute_mission.1005.desc.concubine$"
 tribute_mission.1005.desc.artifact: "\n\n[artifact_to_tribute.GetName] เป็นเครื่องบรรณาการชั้นดี และข้าปล่อยให้มือลูบไปตามขอบของมันอย่างระมัดระวัง ชิ้นงานที่หนักแน่น ไม่ต้องสงสัยเลย\n\nบัดนี้ ข้าควรจะตอบสนองต่อสิ่งนี้อย่างไร..."
 tribute_mission.1005.desc: "\n\nข้าพิจารณาเครื่องบรรณาการที่นำเสนออย่างรอบคอบ\n\nบัดนี้ ข้าควรจะตอบสนองต่อสิ่งนี้อย่างไร..."
 tribute_mission.1005.treasury: ""ให้เรามอบรางวัลแก่บรรณาการของเจ้าด้วยสินค้ามีค่า""
 tribute_mission.1005.artifact: ""ข้าจะมอบมรดกตกทอดของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] แก่เจ้า""
 tribute_mission.1005.artifact.tt: "ท่านมอบ [artifact|E] ของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] แก่ [tributary_scope.GetShortUINameNoTooltip]"
 tribute_mission.1005.innovation: ""มีความก้าวหน้าทางเทคโนโลยีบางอย่างที่เราสามารถแบ่งปันได้...""
 tribute_mission.1005.innovation.tt: "ท่านมอบความก้าวหน้าทางเทคโนโลยีบางอย่างแก่ [tributary_scope.GetShortUINameNoTooltip]"
 tribute_mission.1005.development: ""เราจะจัดตั้งสถานีการค้าอันน่าอัศจรรย์ในเมืองหลวงของเจ้า""
 tribute_mission.1005.monk: ""เจ้าจะได้รับการชี้แนะจากนักบวชที่ฉลาดที่สุดคนหนึ่งของข้า""
 tribute_mission.1005.legitimacy: ""ข้าขอยืนยันอีกครั้งว่าเจ้าคือผู้ปกครองที่แท้จริงของ [tributary_scope.GetCapitalLocation.GetCounty.GetName]""
 fervor_gain_suzerain_missionaries: "มิชชันนารีจากเจ้าผู้เหนือหัว"
 fervor_loss_suzerain_missionaries: "มิชชันนารีถูกปฏิเสธ"

 #Tributary: Woah, some bling
 tribute_mission.1010.t: "$tribute_mission_header$ การจากไป"
 tribute_mission.1010.t.treasury: "$tribute_mission_header$ สินค้าของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
 tribute_mission.1010.t.artifact: "$tribute_mission_header$ ของดีที่สุดแห่ง [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 tribute_mission.1010.t.innovation: "$tribute_mission_header$ ความก้าวหน้าของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]"
 tribute_mission.1010.t.development: "$tribute_mission_header$ พ่อค้าแห่ง [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 tribute_mission.1010.t.monk: "$tribute_mission_header$ ปัญญาแห่ง [overlord_scope.GetFaith.GetNameNoTooltip]"
 tribute_mission.1010.t.legitimacy: "$tribute_mission_header$ ความชอบธรรมแห่ง [overlord_scope.GetFaith.GetNameNoTooltip]"
 tribute_mission.1010.intro.attendant: "ข้ารับใช้ครุ่นคิดอีกสองสามอึดใจก่อนที่จะดูเหมือนจะตัดสินใจได้"
 tribute_mission.1010.intro: "[receiving_character.GetTitledFirstName] ประเมินเครื่องบรรณาการของข้าขึ้นๆ ลงๆ ก่อนที่จะดูเหมือนจะตัดสินใจได้"
 tribute_mission.1010.intro.postseal: "เมื่อพิธี $game_concept_seal_of_investiture$ อันเคร่งขรึมและเป็นทางการสิ้นสุดลง ความมั่งคั่งอันโอ่อ่าของ [overlord_scope.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip] ก็ปรากฏออกมา"
 tribute_mission.1010.segway: "\n\nให้สัญญาณไปยังด้านหลังของห้อง"
 tribute_mission.1010.desc.treasury: "$tribute_mission.1010.segway$ ตู้บรรจุสินค้ามากมายที่เต็มไปด้วยผ้าทออันล้ำค่า แท่งโลหะ และเครื่องเทศจาก [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] ถูกเข็นออกมาอวดโฉมอย่างงดงาม"
 tribute_mission.1010.desc.artifact: "$tribute_mission.1010.segway$ สิ่งประดิษฐ์ล้ำค่าของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] คือ [tribute_reward_type_artifact.GetName] ถูกนำเสนอแก่ข้าบนหมอนกำมะหยี่ ซึ่งช่วยเสริมความแวววาวของมัน"
 tribute_mission.1010.desc.innovation: "$tribute_mission.1010.segway$ นักบวชกลุ่มหนึ่งเดินเข้ามาหาเรา ยื่นม้วนคัมภีร์จำนวนหนึ่ง ซึ่งบรรจุข้อเท็จจริงใหม่และการเปิดเผยที่เกี่ยวข้องกับนวัตกรรมของพวกเขา"
 tribute_mission.1010.desc.development: "$tribute_mission.1010.segway$ คนรับใช้ผู้คงแก่เรียนเดินเข้ามาหาเรา ยื่นสัญญาฉบับหนึ่งให้ข้า\nในสัญญาระบุข้อตกลงทางการค้าเพื่อจัดตั้งสถานีการค้าของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip] ใน [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] ซึ่งจะช่วยส่งเสริมการพัฒนาและความมั่งคั่งโดยรวมของภูมิภาค"
 tribute_mission.1010.desc.monk: "$tribute_mission.1010.segway$ [new_monk.Custom('GetArticledAgeDescriptionGender')] ปรากฏตัวและแนะนำ [new_monk.GetHerselfHimself] ว่าคือ [new_monk.GetTitledFirstName] นักบวช [overlord_scope.GetFaith.GetAdjectiveNoTooltip] [new_monk.GetSheHe|U] แจ้งให้ข้าทราบอย่างกระตือรือร้นถึงความตั้งใจของ [new_monk.GetHerHis] ที่จะเดินทางไปยัง [tributary_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] พร้อมกับข้าเพื่อเสนอบริการของ [new_monk.GetHerHis]"
 tribute_mission.1010.desc.legitimacy: "\n\n[overlord_scope.GetSheHe|U] ให้สัญญาณให้ข้าเข้าไปใกล้ จากนั้นด้วยท่าทางอันสง่างามก็ค่อยๆ ก้าวลงมาบนพื้นเบื้องหน้าข้า ข้าก้มศีรษะลงขณะที่ [overlord_scope.GetTitleAsNameNoTooltip] ทำท่าทางด้วยมือตามพิธีการของชาว [overlord_scope.GetCulture.GetCollectiveNounNoTooltip]\n\nเมื่อเสร็จสิ้น [overlord_scope.GetSheHe] ก็ประกาศด้วยน้ำเสียงอันทรงอำนาจว่า: "ข้าขอยืนยันอีกครั้งว่าเจ้าคือผู้ปกครองที่แท้จริงของ [tributary_scope.GetCapitalLocation.GetCounty.GetName] จงไปโดยสันติ""
 tribute_mission.1010.outro: "\n\n"จงถือว่าเจ้าได้รับความเมตตาจาก [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] แล้ว [tributary_scope.GetTitleAsNameNoTooltip] ของข้า เดินทางโดยสวัสดิภาพ""
 tribute_mission.1010.a: ""ขอพรจงมีแด่ท่าน!""
 
