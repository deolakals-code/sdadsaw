 ### LETTER EVENTS ###
 #Your Tributary refused your Exact Tribute Interaction
 tribute_mission.9000.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9000.desc: "น่าเสียดายที่ข้าพเจ้าไม่มีหนทางที่จะจัดหาเครื่องบรรณาการได้ในขณะนี้\n\nข้าพเจ้าหวังเป็นอย่างยิ่งว่า [actor.GetTitleAsNameNoTooltip] ของข้าพเจ้าจะเข้าอกเข้าใจ"
 tribute_mission.9000.a: "เช่นนั้นหรือ"
 #Tributary is going on a mission!
 tribute_mission.9010.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9010.desc: "แน่นอน เราจะถวายเครื่องบรรณาการอันวิจิตรที่สุดแด่ [actor.GetTitleAsNameNoTooltip] ของข้า!\n\nการเดินทางของเราได้เริ่มขึ้นแล้ว และเป้าหมายของเราคือ [actor.GetCapitalLocation.GetName]"
 tribute_mission.9010.a: "ยอดเยี่ยม"
#Tributary: You ignored the Tribute Mission, have some shame
 tribute_mission.9500.opening: "[overlord.Custom2('AppropriateGreeting', ROOT.Char )]"
 tribute_mission.9500.desc: "ข้าคิดว่าเจ้าเป็น [ROOT.Char.GetWomanMan] ที่รักษาสัจจะ ข้าเข้าใจแล้วว่านั่นไม่เป็นความจริง ผู้ส่งบรรณาการ\n\nความล้มเหลวของเจ้าเมื่อเร็วๆ นี้ในการปฏิบัติภารกิจบรรณาการมายังราชสำนักของข้า มิได้รอดพ้นสายตาไปได้"
 tribute_mission.9500.a: "ข้าเข้าใจแล้ว"

 ### TRAVEL EVENTS ###
 #Tributary: Your human tribute is now unavailable
 tribute_mission.9750.t: "$tribute_mission_header$ มิใช่บรรณาการอีกต่อไป"
 tribute_mission.9750.desc: "ด้วยเหตุการณ์โชคร้ายหลายครั้ง บรรณาการของเราไม่ได้อยู่ในกลุ่มผู้ติดตามของเราอีกต่อไป! [human_tribute.GetTitledFirstName|E] หายไป...\n\nข้าขมวดคิ้ว แน่นอนว่าเราควรหันหลังกลับไปตั้งหลักใหม่ใช่หรือไม่?"
 tribute_mission.9750.a: "ไม่ เราต้องทำภารกิจบรรณาการของเราให้สำเร็จ!"
 tribute_mission.adequate_reserved_gold: "สำรอง @gold_icon!#V [THIS.Char.MakeScope.ScriptValue('adequate_gold_tribute_value')]#! สำหรับ [tribute|E]"
 tribute_mission.9750.b: "กลับบ้านไปเลยจะดีกว่า"
 tribute_mission.9750.tt: "$CANCEL_TRAVEL_PLAN_EFFECT$"
 #Tributary: Courtier slated for castration escapes
 tribute_mission.9760.t: "$tribute_mission_header$ การหลบหนี"
 tribute_mission.9760.desc.vengeful: "ความโกลาหลภายนอกในที่สุดก็ดึงข้ากลับจากห้วงนิทราลึก ข้าที่ยังกึ่งหลับกึ่งตื่น จำใจเงี่ยหูฟังและพอจับใจความเสียงตะโกนที่ขาดๆ หายๆ ได้ว่า #EMP "...บรรณาการหนีไปแล้ว! ตามหา [escapee_eunuch.GetHerHim]!"#! เมื่อเงาดำตะคุ่มปรากฏขึ้นที่ประตูห้องของข้า\n\n"#EMP ขอ [escapee_eunuch.GetFaith.HighGodName] โปรดอภัยในบาปของข้าด้วยเถิด"#! บรรณาการมนุษย์ของเรา [escapee_eunuch.GetTitledFirstName] คำรามลั่นขณะที่ [escapee_eunuch.GetSheHe] พุ่ง [escapee_eunuch.GetHerselfHimself] เข้าใส่ข้า\n\nข้าม้วนตัวออกจากที่นอน หลบการโจมตีครั้งแรกได้อย่างหวุดหวิด และทันใดนั้นเราทั้งคู่ก็ลุกขึ้นยืน คุมเชิงกันและกัน"
 tribute_mission.9760.desc: "ข้าตื่นขึ้นมาอย่างหาสาเหตุไม่ได้ชั่วขณะหนึ่ง ในสภาพที่ยังงัวเงีย ข้ามองไปรอบๆ กระโจม เพียงเพื่อเห็นเงาเคลื่อนผ่านม่านกระโจมของข้า ข้าสะดุ้งกับอากาศยามค่ำคืนที่เย็นเยียบ กลิ้งตัวออกจากเตียงผ้าใบและเดินอุ้ยอ้ายไปแอบมองข้างนอก\n\nข้าประหลาดใจที่ได้พบกับไม่ใช่ใครอื่นนอกจากบรรณาการมนุษย์ของเรา [escapee_eunuch.GetTitledFirstName] ผู้ ซึ่งหนีรอดจากผู้ติดตามของ [escapee_eunuch.GetHerHis] มาได้อย่างใด\n\nดวงตาของ [escapee_eunuch.GetHerHis|U] เบิกกว้างด้วยความกลัวเมื่อ [escapee_eunuch.GetSheHe] สังเกตเห็นการมีอยู่ของข้า "ท่าน [escapee_eunuch.Custom2('RelationToMe', ROOT.Char )] ได้โปรด... ข้าทนทำสิ่งนี้ต่อไปไม่ไหว ได้โปรดเถิด" [escapee_eunuch.GetSheHe] อ้อนวอน พร้อมที่จะวิ่งหนีหายไปในความมืด"
 tribute_mission.9760.a: ""#EMP เข้ามาเลย!#!""
 tribute_mission.9760.a.success: "[escapee_eunuch.GetShortUIName] ถูกปราบ"
 tribute_mission.9760.a.success.tt: "[escapee_eunuch.GetShortUIName] ถูกควบคุมตัว และ [tribute_mission|E] ดำเนินต่อไป"
 tribute_mission.9760.a.failure: "[escapee_eunuch.GetShortUIName] หลบหนีไปและพยายามที่จะแก้แค้น [escapee_eunuch.GetHerHis]"
 tribute_mission.9760.b: ""#EMP ยาม!#!""
 tribute_mission.9760.b.success: "$tribute_mission.9760.a.success$"
 tribute_mission.9760.b.failure: "[escapee_eunuch.GetShortUIName] หลบหนีไป"
 tribute_mission.9760.b.critical_failure: "[escapee_eunuch.GetShortUIName] ถูกสังหารในระหว่างนั้น"
 tribute_mission.9760.c: ""เจ้าเป็นอิสระแล้ว ไปได้ #EMP ไปซะ!#!""
 #Somehow your Tribute Mission invalidated, refund and return home
 tribute_mission.9800.t: "$tribute_mission_header$ เปลี่ยนแผน"
 tribute_mission.9800.desc.suzerain_turned_liege: "ดูเหมือนว่าภาระหน้าที่ในการส่งบรรณาการของข้าจะเปลี่ยนไปแล้ว บัดนี้ข้าได้เป็นข้าหลวงของ [ROOT.Char.GetLiege.GetTitledFirstName] อย่างแท้จริง\n\nด้วยเหตุนี้ จึงมีเรื่องอื่นๆ อีกมากมายที่ต้องกลับไปดูแลที่บ้าน ซึ่งการจ่ายบรรณาการไม่ใช่หนึ่งในนั้นอีกต่อไป ช่างเป็นการพลิกผันของเหตุการณ์เสียนี่กระไร!"
 tribute_mission.9800.desc.no_longer_tributary: "ช่างเป็นการพลิกผันของเหตุการณ์เสียนี่กระไร! ข้าได้รับข่าวว่าเราไม่ต้องตกอยู่ภายใต้พันธนาการแห่งบรรณาการอีกต่อไป!\n\nมีกิจธุระและคำถามมากมายที่ต้องกลับไปจัดการที่บ้าน — ซึ่งการรับมือกับเอกราชใหม่นี้เป็นประเด็นหลัก"
 tribute_mission.9800.desc.different_end_location: "ด้วยการเปลี่ยนแปลงเจ้าผู้เหนือหัว ดูเหมือนว่า [current_overlord.GetTitledFirstName] จะมีเมืองหลวงของ [current_overlord.GetHerHis] อยู่ในสถานที่อื่น\n\nการเดินทางและบรรณาการของเรามีกำหนดการสำหรับ [old_overlord.GetTitledFirstName] ดังนั้นที่ปรึกษาของข้าจึงยืนกรานว่าการตัดสินใจที่ชาญฉลาดคือการกลับไปที่ [ROOT.Char.GetCapitalLocation.GetName] และตั้งหลักใหม่"
 tribute_mission.9800.desc.unable_to_accept_tribute: "เสียงร่ำลือตามท้องถนนแจ้งให้ข้าพเจ้าทราบว่าเจ้าเหนือหัวองค์ใหม่ของเราดูเหมือนจะไม่สนใจประเภทของเครื่องบรรณาการที่ข้าพเจ้าจะนำเสนอ\n\nข้าพเจ้าไม่อยากเสี่ยงที่จะ ทำให้องค์เหนือหัวทรงกริ้ว ดังนั้นการเคลื่อนไหวที่ฉลาดกว่าคือการกลับไปตั้งหลักที่ [ROOT.Char.GetCapitalLocation.GetName]"
 tribute_mission.9800.a: "ให้เรากลับบ้านไปก่อนในระหว่างนี้"

 tribute_mission_notification.new_overlord.title: "เจ้าผู้เหนือหัวในภารกิจบรรณาการเปลี่ยนแปลง"
 tribute_mission_notification.new_overlord.desc: "เจ้าผู้เหนือหัวใน [tribute_mission|E] ของท่านเปลี่ยนเป็น [new_overlord.GetShortUIName]"

