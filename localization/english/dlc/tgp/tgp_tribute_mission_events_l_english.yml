 tribute_mission.1006.t: "$tribute_mission_header$ ตราแห่งการ แต่งตั้ง"
 tribute_mission.1006.desc: "[tributary_scope.GetTitledFirstName|U] ยังคงหมอบกราบเป็นเวลานานจนเริ่มรู้สึกอึดอัด [tributary_scope.GetSheHe] กำลังคาดหวังสิ่งอื่นใดจากข้าอีกหรือ?\n\nข้าเหลือบไปเห็น [scribe_character.GetShortUIName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scribe_character'))] ของข้า ช่างฝีมือผู้สร้างตราประทับอย่างเป็นทางการของข้า ยืนรออย่างสงบอยู่ข้างๆ ราชสำนักที่แออัด\n\nถึงเวลาแล้วหรือยังที่จะมอบการยอมรับอย่างเป็นทางการของโอรสแห่งสวรรค์แก่ [tributary_scope.GetTitledFirstNameNoTooltip]?"
 tribute_mission.1006.grant: "เราจะทำข้อตกลงนี้ให้เป็นทางการเพื่อจารึกไว้ชั่วกาลนาน"
 tribute_mission.1006.grant.tt: "[scribe_character.GetShortUIName] จะสร้าง [seal_of_investiture|E] สำหรับ [tributary_scope.GetTitledFirstName]"
 tribute_mission.1006.decline.no_money: "คลังหลวงมิอาจแบกรับค่าใช้จ่ายนี้ได้"
 tribute_mission.1006.decline.dont_wanna: "[tributary_scope.GetSheHe|U] ไม่สมควรได้รับเกียรติ เช่นนี้"
 refused_seal_of_investiture_opinion: "ปฏิเสธการมอบ [seal_of_investiture|E]"

 tribute_mission.1007.t: "$tribute_mission_header$ ตราแห่งการ แต่งตั้ง"
 tribute_mission.1007.desc: "หลังจากหยุดนิ่งไปครู่ใหญ่ [receiving_character.GetTitledFirstName] ก็ลุกขึ้นอย่างสง่างามตามพิธีการ ทันใดนั้น อาลักษณ์หลวง [scribe_character.GetShortUIName] ก็ปรากฏตัวออกมาจากฝูงชน ถือ $game_concept_seal_of_investiture$ ที่สร้างขึ้นอย่างประณีต — พร้อมกับชื่อของข้าสลักอยู่!\n\n[receiving_character.GetTitledFirstName] รับมันมาอย่างระมัดระวังและทูลขอให้ข้าลุกขึ้น ผู้ชมต่างจดจ่อด้วยความสนใจ\n\nขณะที่ข้าได้รับพรจากโอรสแห่งสวรรค์ ความคิดหนึ่งก็ผุดขึ้นมา: สัญญาอันล้ำค่านี้อาจเปิดประตูบานใหม่ใดบ้างหนอ?"
 tribute_mission.1007.a: "นี่จะเปลี่ยนแปลงทุกสิ่ง"

 tribute_mission.1008.t: "$tribute_mission_header$ บรรณาการต่อเนื่อง"
 tribute_mission.1008.desc: "ขณะที่ของขวัญถูกแลกเปลี่ยนในพิธี ข้ารู้สึกถึงความคาดหวังที่ก่อตัวขึ้นทั่วทั้งราชสำนักราวกับว่ามีคำพูดบางอย่างที่ยังไม่ได้พูดออกมา แม้จะไม่เคยกล่าวออกมาตรง ๆ แต่ความคาดหวังที่มีต่อข้าก็ค่อย ๆ ชัดเจนขึ้น\n\n[receiving_character.GetTitledFirstNameNoTooltip] ปรารถนาคำมั่นสัญญาของข้าที่จะให้ของขวัญเหล่านี้หลั่งไหลต่อไป เพื่อแลกกับความเมตตาของ [receiving_character.GetLiege.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip]\n\nยังมีเวลาที่จะปฏิเสธข้อเสนออย่างมีเกียรติ ในขณะที่ยังคงรักษาความเป็นอิสระของข้าไว้ พร้อมกับทุกสิ่งที่อาจตามมา"
 tribute_mission.1008.a: "“...และแน่นอน [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จะนำของขวัญไปให้ [receiving_character.GetLiege.GetCapitalLocation.GetNameNoTooltip] เป็นประจำ”"
 tribute_mission.1008.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] จะไม่ยอมค้อมหัว"

