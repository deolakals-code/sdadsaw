#ARTIFACTS
tribute_mission_common_bunga_mas_desc: "[Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ที่นำเสนอเป็นเครื่องบรรณาการแก่ [overlord_scope.GetTitledFirstName] โดย [tributary_scope.GetTitledFirstName]"
tribute_mission_masterwork_bunga_mas_desc: "นำเสนอครั้งแรกเป็นเครื่องบรรณาการแก่ [overlord_scope.GetTitledFirstName] โดย [tributary_scope.GetTitledFirstName] ชุด [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] อันงดงามนี้สะท้อนแสงได้อย่างตระการตา"
tribute_mission_famed_bunga_mas_desc: "ต้นไม้ทองคำและเงินอันวิจิตรสองต้น [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] เหล่านี้ถูกนำเสนอแก่ [overlord_scope.GetTitledFirstName] โดย [tributary_scope.GetTitledFirstName] เพื่อเป็นเครื่องบรรณาการ งานโลหะและการแกะสลักบอกเล่าเรื่องราวของศิลปะอันวิจิตร"
tribute_mission_illustrious_bunga_mas_desc: "นำเสนอเป็นเครื่องบรรณาการแก่ [overlord_scope.GetTitledFirstName] โดย [tributary_scope.GetTitledFirstName] [Glossary( 'บุงงามัส', 'BUNGA_MAS_GLOSS' )] ประกอบด้วยชุดต้นไม้ทองคำและเงินอันงดงาม หลอมและแกะสลักอย่างพิถีพิถันจากโลหะที่ดีที่สุด ดอกไม้ที่ถูกจับไว้ให้บานสะพรั่งชั่วนิรันดร์"
