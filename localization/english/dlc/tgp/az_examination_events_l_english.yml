l_english: 

 az_examination.0001.t: "พินิจฝีพู่กัน"
 az_examination.0001.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entrant'))] [entrant.GetTitledHouseNameOrFirstName] ค้อมกายเล็กน้อย พลางยื่นม้วนอักษรที่พับไว้อย่างบรรจง\n\n"[ROOT.Char.GetTitleAsNameNoTooltip]" [entrant.GetSheHe] เอ่ย "ข้าขอน้อมส่งบทประพันธ์ของข้าเพื่อรับคำชี้แนะจากท่าน ข้าได้พากเพียรกับถ้อยคำเหล่านี้ยิ่งนัก — บ้างก็เด็ดเดี่ยวด้วยความมั่นคง ส่วนอื่น... สะท้อนถึงการเสาะแสวงหาดุลยภาพของข้า ข้าใคร่ขอรับฟังคำชี้แนะจากท่าน""
 az_examination.0001.intrigue: ""เพียงเจ้าจดจำไว้ว่าเป็นข้าที่กำลังช่วยเหลือเจ้า""
 az_examination.0001.a: "มอบคำชี้แนะที่นุ่มนวลและเป็นคุณ"
 az_examination.0001.b: "เยาะเย้ยความพยายามอันน่าสมเพชของ [entrant.GetHerHis]"
 az_examination.0001.c: "เปรียบเทียบผลงานของ [entrant.GetHerHis] กับเหล่านักปราชญ์โบราณและเขียนอรรถาธิบาย"

 az_examination.0002.t: "ท้าทายต่อหน้าธารกำนัล"
 az_examination.0002.desc.exam: "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] $az_examination.0002.desc$"
 az_examination.0002.desc.debate: "[debater.GetFirstName] ตัวแทนจาก [debater_movement.GetName] $az_examination.0002.desc$"
 az_examination.0002.desc: "ดักหน้าข้าระหว่างทางออกจากห้องศึกษา สีหน้าพึงพอใจในตนเองของ [debater.GetHerHis] บอกข้าว่า [debater.GetSheHe] รอคอยโอกาสที่จะโจมตีนักปราชญ์ผู้ไม่ทันระวังตัวมานานแล้ว\n\n"มิมีผู้ใดเข้าใจพงศาวดารชุนชิวได้ถ่องแท้ไปกว่าข้า! ถ้อยคำของ [Glossary( 'ขงจื่อ', 'CONFUCIUS_GLOSS' )] มิใช่เพียงการบันทึกเหตุการณ์ธรรมดา การใช้ถ้อยคำอันแยบยลของท่านเชิดชูผู้มีคุณธรรมและประณามคนชั่ว ท่านไม่เห็นพ้องด้วยหรือ?""
 az_examination.0002.a: ""เห็นได้ชัดว่า [debater.Custom2('InsultNoun', ROOT.Char)] เช่นเจ้า ย่อมมิอาจอ่านมันได้อย่างถ่องแท้!""
 az_examination.0002.b: ""มิมีที่ว่างสำหรับเรื่องเพ้อฝัน ณ ที่นี้""
 az_examination.0002.c: ""ทุกหนทางสู่ปัญญาล้วนเป็นเอกเทศ""
 az_examination.0002.d: "ออกจากการโต้เถียงอันไร้ประโยชน์นี้"
 
 az_examination.0003.t: "การรินชาอันเสื่อมเสีย"
 az_examination.0003.desc: "[tea_offender.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถือถาดชาเดินเข้ามาหาเหล่ากรรมการ [tea_offender.GetSheHe|U] รินชาด้วยมือข้างที่ผิด ชายแขนเสื้อลากพื้น และยื่นถ้วยชาให้โดยปราศจากการคำนับหรืออวยพร\n\n[host_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เฝ้ามองด้วยสายตาเย็นชาดูแคลน "เจ้าละทิ้งพิธีรีตองอันเหมาะสม อันเป็นการเสื่อมเสียต่อคุณธรรมของเจ้า, [tea_offender.GetFirstNameNoTooltip]" [host_examiner.GetSheHe] ประกาศก้อง ให้ทุกคนได้ยิน มือของ [tea_offender.GetFirstNamePossessiveNoTooltip] สั่นเทาขณะที่ [tea_offender.GetSheHe] ค้อมกายอย่างแข็งทื่อ"
 az_examination.0003.a: ""ให้ข้าแสดงเป็นแบบอย่างเถิด ท่าน [host_examiner.GetTitledFirstNameNoTooltip]""
 az_examination.0003.b: ""เหตุใด [tea_offender.Custom2('InsultNoun', ROOT.Char)] ผู้นี้จึงมารับใช้พวกเรา?""
 az_examination.0003.c: "นิ่งเงียบ"

 az_examination.0004.t: "คำตอบต้องห้าม"
 az_examination.0004.desc: "ข้าเหลือบไปเห็น [caught_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังเปิดเอกสารโบราณที่เก่าคร่ำคร่าอย่างประหม่า ดวงตาเบิกกว้างด้วยความกระตือรือร้นที่ปิดไม่มิด\n\n[caught_entrant.GetSheHe|U] พูดตะกุกตะกัก "มัน... แค่สำหรับอ้างอิงน่ะ! ข้ามิได้ตั้งใจจะใช้มันในการสอบ — จริง ๆ นะ!" พ่อค้า [merchant.GetTitledHouseNameOrFirstName] ยิ้มให้ข้าอย่างรู้ทัน "ตำราช่วยศึกษาอันล้ำค่า ท่านผู้ยิ่งใหญ่ เพียงไม่กี่เหรียญเท่านั้น บางที [ROOT.Char.GetWomanMan] ผู้สูงศักดิ์ เช่นท่านอาจต้องการครบชุด?""
 az_examination.0004.b: "รายงานเรื่องน่าอับอายนี้และยึดม้วนตำรานั้น"
 az_examination.0004.c: "ซื้อม้วนตำราที่น่าสนใจจากพ่อค้า"
 az_examination.0004.c.tt: "ท่านได้เป็นเจ้าของม้วนตำรา [learning|E] และ [GetTrait('confucian_education').GetName(GetNullCharacter)] [artifact|E]"
 az_examination.0004.c.tt_equipped: "ได้ซื้อ [artifact_scroll.GetName]"
 az_examination.0004.d: ""ข้าไม่เห็นสิ่งใด""
 
 az_examination.0005.china.t: "ใคร่ครวญถึงเมิ่งจื่อ"
 az_examination.0005.china.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนอยู่หน้าแผ่นศิลาจารึกที่สลักบทกวีจากเมิ่งจื่อ ประสานมือไว้ด้านหลังของ[fellow_examiner.GetHerHis]พลางใคร่ครวญ\n\n"ข้าอ่านท่อนนี้มานับครั้งไม่ถ้วน" [fellow_examiner.GetSheHe] พึมพำขณะที่ท่านเดินเข้าไป "ทว่าแก่นแท้ของมันยังคงยากจะเข้าใจ เมิ่งจื่อกล่าวว่า: 'ผู้ยิ่งใหญ่คือผู้ที่ยังคงรักษาหัวใจดุจเด็กไว้ได้' ท่านคิดเห็น เช่นไร ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]?""
 az_examination.0005.korea.t: "ใคร่ครวญถึงชเว ชีวอน"
 az_examination.0005.korea.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังแหงนมองภาพสลักหิน ลายอักษรวิจิตรนั้นเป็นของชเว ชีวอนอย่างมิต้องสงสัย สลักไว้เป็นเส้นสายอันพริ้วไหว มือของ [fellow_examiner.GetHerHis|U] ประสานไว้ด้านหลัง ดวงตาทอดมองไกลอย่างครุ่นคิด\n\n"ชเวเขียนถ้อยคำเหล่านี้ระหว่างเดินทางกลับจากราชสำนักถัง" [fellow_examiner.GetSheHe] เอ่ยอย่างแผ่วเบาเมื่อท่านเข้ามาร่วมกับ[fellow_examiner.GetHerHim] "ท่านกล่าวว่า: 'บัณฑิตต้องปกครองใจตนก่อนจึงจะปกครองผู้อื่นได้' ข้าขบคิดถึงมันตั้งแต่ยังเป็นศิษย์ และมันก็ยังคง ทำให้ข้าสับสน""
 az_examination.0005.t: "ขบคิดบทกวีโบราณ"
 az_examination.0005.desc: "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] สบตากับท่าน — ขณะกำลังจ้องมองแผ่นศิลาที่จารึกข้อความคลาสสิกอย่างครุ่นคิด\n\n"ข้อความท่อนนี้ ทำให้ข้าฉงนใจมานาน" [fellow_examiner.GetSheHe] เอ่ยเบา ๆ "ท่านว่าอย่างไร ท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]?""
 az_examination.0005.china.a: ""มันคือการเรียกร้องให้ธำรงรักษาสิ่งที่คนโบราณเรียกว่า [Glossary( 'เต๋อ', 'CONFUCIAN_DE')]""
 CONFUCIAN_DE: "หมายถึง พลังทางศีลธรรมหรือคุณธรรม พลังที่ช่วยให้บุคคลสามารถชักจูงผู้อื่นในเชิงบวกและรักษาความสามัคคีในสังคม"
 az_examination.0005.a: ""มันคือการเรียกร้องให้ธำรงรักษาความกระจ่างชัดทางศีลธรรมของตน""
 az_examination.0005.b: ""ระเบียบอันชอบธรรมอยู่เหนือสิ่งอื่นใด""
 az_examination.0005.c: ""ช่าง... อ่อนไหวเสียจริง""
 az_examination.0005.d: ""คนเราต้องบรรลุถึงความหมายด้วยตนเอง""

 az_examination.0006.t: "ความกตัญญู"
 az_examination.0006.desc: "ข้าสังเกตเห็น [favored_entrant.GetFirstName] ยืนอยู่ใกล้ชิดกับ [local_ruler.GetTitledHouseNameOrFirstName] เกินไปเล็กน้อย สายตาของทั้งคู่สบกันเนิ่นนานกว่าปกติ "ข้าจะไม่ ทำให้ท่านผิดหวัง [favored_entrant.Custom2('RelationToMe', SCOPE.sC('local_ruler'))]" [favored_entrant.GetFirstNameNoTooltip] กระซิบแผ่วเบา\n\nเมื่อ [local_ruler.GetTitleAsNameNoTooltip] สังเกตเห็นข้า [local_ruler.GetSheHe] ก็รีบเดินเข้ามาอยู่ข้างข้า "[favored_entrant.GetSheHe|U] ได้ตำแหน่งนี้มาด้วยความสามารถของ [favored_entrant.GetHerHis] เอง ข้ารับรอง" [local_ruler.GetTitledFirstNameNoTooltip] พึมพำ พลางแย้มยิ้มอย่างสุภาพที่ริมฝีปากของ[local_ruler.GetHerHis]"
 az_examination.0006.a: ""ข้าจะพิสูจน์เรื่องนี้ด้วยตนเอง""
 az_examination.0006.b: ""เราทุกคนต่างก้าวหน้าด้วยการสนับสนุนที่เราได้รับ""
 az_examination.0006.c: ""ให้ผลงานของ [favored_entrant.GetHerHis] เป็นเครื่องพิสูจน์เถิด""

 az_examination.0007.t: "น้ำหนักแห่งหมึก"
 az_examination.0007.desc: "[aged_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เตรียมสมบัติชิ้นที่สองแห่ง [Glossary( 'จตุรสมบัติ', 'FOUR_TREASURES')] ก่อนการสอบ บดเขม่าสนลงในแท่นฝนหมึกสัมฤทธิ์ด้วยจังหวะที่ตั้งใจและช่ำชอง [aged_examiner.GetSheHe] ผสมหมึกคุณภาพดีอย่างเชี่ยวชาญ [aged_examiner.GetSheHe] ชายตามองอย่างเฉียบคม แล้วยื่นแท่งฝนหมึกให้ข้า\n\n"ถึงตาเจ้าแล้ว หมึกนี้ต้องไหลลื่นดุจแสงจันทร์ต้องผืนน้ำ และคงทนยาวนานกว่าจักรวรรดิ สูตรที่ถูกต้องอยู่ใน [Glossary( 'คัมภีร์หลี่จี้', 'BOOK_OF_RITES')]""
 BOOK_OF_RITES: "คัมภีร์คลาสสิกว่าด้วยระเบียบและความกลมเกลียว ที่กำหนดจรรยาบรรณอันเหมาะสมสำหรับบัณฑิต บุตร และประมุข การปฏิบัติตามบัญญัติคือการให้เกียรติรากฐานแห่งอารยธรรม"
 FOUR_TREASURES: "สมบัติสี่ประการ — พู่กัน หมึก กระดาษ และแท่นฝนหมึก — คือเครื่องมือสำคัญของบัณฑิต การใช้งานอย่างระมัดระวังสะท้อนถึงวินัย ความกระจ่างชัด และความเคารพต่อประเพณี"
 az_examination.0007.a: ""คัมภีร์คลาสสิกย่อมไม่ผิดพลาด""
 az_examination.0007.b: ""ยางโสมสักสองสามหยด...""
 tgp_ginseng_resin_modifier: "การผสมหมึกเชิงทดลอง"
 tgp_ginseng_resin_modifier_desc: "พิธีกรรมอันเงียบสงบในห้องศึกษา บัดนี้ได้แทรกซึมอยู่ในทุกอากัปกิริยาของท่าน มอบความเหนือชั้นอันแยบยลให้กับท่วงทีของท่าน"
 az_examination.0007.c: ""ให้เหล่าคนรับใช้เป็นผู้ผสมหมึกเถิด""

 az_examination.0008.t: "การท้าทายที่ถูกจังหวะ"
 az_examination.0008.desc: "ม้วนตำราแบบฝึกหัดเก่า ๆ ถูกคลี่ออกระหว่างข้ากับ [examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] "มันมาจากยุคก่อน" [examiner.GetSheHe] ตั้งข้อสังเกต พลางลูบไล้แผ่นหนังอย่างนอบน้อม "ไฉนท่านไม่ลองตอบคำถามสักข้อ — แล้วให้ข้าตัดสินคำตอบของท่านเล่า?"\n\n[ROOT.GetCharacter.Custom('quirk_pos_adverb')|U] ข้าเลิกคิ้ว ม้วนตำราเหล่านี้ ทำให้ข้านึกถึงครั้งที่ [memory.GetDescription]"
az_examination.0008.a: ""ให้เรามาตรวจคำตอบของกันและกันเถิด""
az_examination.0008.a.success.tt: "ท่านเหนือชั้นกว่า [examiner.GetTitledHouseNameOrFirstName]"
az_examination.0008.a.failure.tt: "ปฏิภาณไหวพริบของ [examiner.GetTitledFirstNamePossessive] ก้าวล้ำหน้ากว่าของท่าน"
az_examination.0008.b: ""อา... วันวานเหล่านั้น... ให้เราระลึกถึงความหลังกันเถิด""
az_examination.0008.c: ""ไม่ใช่วันนี้""

az_examination.0009.t: "หายนะแห่งน้ำหมึก"
az_examination.0009.desc: "หีบใบนั้นตกลงพื้นเสียงดัง 'เละ' [clumsy_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] จ้องมองลงไปด้วยความหวาดผวา ในมือยังคงถือพู่กัน น้ำหมึกสาดกระเซ็นเปรอะขาของ [clumsy_entrant.GetHerHis] ขณะที่ [angry_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] กระทืบเท้าเข้ามาด้วยความโกรธจัดในดวงตาของ[angry_examiner.GetHerHis]\n\n"เจ้าทำลายการเตรียมการตลอดทั้งวัน!" [angry_examiner.GetSheHe] ตะคอกลั่น"
az_examination.0009.a: ""เป็นความผิดของข้าเอง ข้าควรจะยึดหีบไว้ให้มั่นคง""
az_examination.0009.b: ""ความซุ่มซ่ามระดับนี้เป็นสิ่งที่ยอมรับมิได้!""
az_examination.0009.c: ""จัดการทำความสะอาดซะ พวกเรายังมีงานต้องทำ""

az_examination.0010.t: "สาส์นผนึกขอความช่วยเหลือ"
az_examination.0010.desc: "[requesting_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ย่องเท้าเข้ามาอย่างแผ่วเบา สายตาสอดส่ายข้ามไหล่ของ [requesting_entrant.GetHerHis] และยื่นม้วนสาส์นให้ข้า\n\n"ท่านช่วยส่งสิ่งนี้ต่อไปยัง [target_examiner.GetTitledHouseNameOrFirstName] ได้หรือไม่?" [requesting_entrant.GetSheHe] กระซิบ "มัน... เป็นเรื่องส่วนตัว""
az_examination.0010.a: "ส่งจดหมายนี้อย่างมิดชิด"
az_examination.0010.b: "เปิดโปงความพยายามของ [requesting_entrant.GetFirstNamePossessiveNoTooltip] ที่จะโน้มน้าวการสอบ"
az_examination.0010.c: "ทำลายผนึกและอ่านมันในทันที"
az_examination.0010.c.tt: "ท่านได้ล่วงรู้ [secret|E] ของ [requesting_entrant.GetFirstName]"
az_examination.0010.c.toast: "การเปิดเผยที่น่าอื้อฉาว!"

az_examination.0011.t: "การกระซิบสลับที่นั่ง"
az_examination.0011.desc: "[sneaky_entrant_1.GetTitledHouseNameOrFirstName] โน้มตัวเข้าไปหา [sneaky_entrant_2.GetTitledHouseNameOrFirstName] เสียงของพวกเขาแผ่วเบา แต่ข้าก็ยังได้ยินบทสนทนาของผู้เข้าสอบ:\n\n"หากเราสลับที่นั่งกัน" [sneaky_entrant_2.GetTitledFirstNameNoTooltip] พึมพำ "กรรมการผู้มีแววตาอ่อนโยนจะเป็นผู้ตัดสินเรียงความของข้า""
az_examination.0011.a: "ป่าวประกาศแผนการของพวกเขาต่อหน้าทุกคนในโถง"
az_examination.0011.b: "เสนอความช่วยเหลือ — และการปิดปากเงียบของท่าน"
az_examination.0011.b.success: "เหล่าผู้เข้าสอบเชื่อฟังท่านในทุกถ้อยคำ"
az_examination.0011.b.failure: "เหล่าผู้เข้าสอบสงสัยในตัวท่าน"
az_examination.0011.c: "ตักเตือนพวกเขาอย่างเงียบ ๆ ให้ไตร่ตรองใหม่"

az_examination.0012.t: "คำเชิญส่วนตัว"
az_examination.0012.desc: "[senior_examiner.GetTitledHouseNameOrFirstName] กรรมการผู้อาวุโสที่น่าเคารพ กวักมือเรียกข้าด้วยรอยยิ้มอ่อนโยนใต้ร่มเงาของศาลาในสวน "นับเป็นความยินดียิ่งเสมอที่ได้สนทนากับผู้ที่เห็นคุณค่าของการเรียนรู้ มาเถิด มาร่วมดื่มชากับข้า" [senior_examiner.GetSheHe] กล่าวอย่างอบอุ่น ข้าสังเกตเห็น [jealous_rival.Custom2('InsultAdjective', ROOT.Char)] [jealous_rival.Custom2('InsultNoun', ROOT.Char)] [jealous_rival.GetTitledHouseNameOrFirstName] ที่อยู่อีกฟากของศาลา ดวงตาลุกโชนด้วยความอิจฉาขณะที่ [jealous_rival.GetSheHe] ถือถาดเดินเข้ามา เห็นได้ชัดว่าพยายามจะเอาใจกรรมการ"
az_examination.0012.a: ""นับเป็นเกียรติของข้าอย่างยิ่ง""
az_examination.0012.b: ""เราจะเผื่อที่ให้คนเพิ่มอีกสักคนดีหรือไม่?""
az_examination.0012.c: ""อภัยให้ข้าด้วย — วันนี้ข้ามีหน้าที่กับม้วนตำราของข้า""

az_examination.0013.t: "เรียงความที่หายไป"
az_examination.0013.desc: ""หายไปแล้ว!" [fellow_assistant.GetTitledHouseNameOrFirstName] ผู้ช่วยอีกคน อุทาน พลางกระชากลิ้นชักทีละอัน "เรียงความสำหรับคัดแยก — ข้าตรวจดูทุกที่แล้ว!"\n\nที่อีกฟากของห้อง [calm_examiner.GetTitledHouseNameOrFirstName] หนึ่งในกรรมการ กำลังเปิดหนังสืออ่านอย่างสบายอารมณ์และพึมพำว่า "การตื่นตระหนกไม่ช่วยให้มันกลับมาหรอก" ข้ามั่นใจว่า [calm_examiner.Custom2('InsultNoun', ROOT.Char)] ผู้นี้ต้องมีส่วนเกี่ยวข้องเป็นแน่"
az_examination.0013.a: ""มาช่วยกันหาเถิด — เราจะหามันพบทันเวลา!""
az_examination.0013.a.success: "ท่านได้ม้วนตำราที่หายไปกลับคืนมา"
az_examination.0013.a.failure: "ม้วนตำรายังคงสูญหาย"
az_examination.0013.b: ""ท่านดูใจเย็นเกินไปสำหรับเรื่องนี้ [calm_examiner.GetFirstNameNoTooltip] ท่านซ่อนอะไรไว้?""
az_examination.0013.b.success: "[calm_examiner.GetFirstNameNoTooltip] "จำได้" อย่างเหมาะเจาะว่าได้ย้ายเรียงความไป"
az_examination.0013.b.failure: "คำกล่าวหาของท่านถูกตอบกลับด้วยสายตาเย็นชาดูแคลน"
az_examination.0013.c: ""ข้าจะเขียนมันขึ้นมาใหม่ก็สิ้นเรื่อง""
az_examination.0013.d: ""นี่มิใช่ปัญหาของข้า""

az_examination.0014.t: "ภายใต้แรงกดดัน"
az_examination.0014.desc: "ข้าสะดุ้งตื่น นี่ข้าเพิ่งเผลอหลับที่โต๊ะหรือนี่? เมื่อสัมผัสแก้ม ข้ารู้สึกถึงรอยบุ๋มบนผิวหนังจากหนังสือที่ข้าใช้หนุนศีรษะ\n\nข้าหันไปเผชิญหน้ากับกรรมการ [praising_examiner.GetTitledHouseNameOrFirstName] ผู้ ซึ่งเสียงฝีเท้าปลุกข้าจากการหลับใหล รอยยิ้มจาง ๆ ปรากฏบนริมฝีปากของ [praising_examiner.GetHerHis] "อย่ากังวลไปเลย [ROOT.Char.GetWomanMan] หนุ่มสาว ความพากเพียรอุตสาหะของเจ้ามิได้ถูกมองข้าม และเมื่อถึงเวลา ความขยันหมั่นเพียรของเจ้าจะได้รับรางวัลอย่างแน่นอน"\n\nการที่ข้าอดหลับอดนอนและใช้เวลาอ่านหนังสือนานหลายชั่วโมงได้รับการยอมรับ ช่างน่าปลาบปลื้มใจนัก"
az_examination.0014.a: ""ความคาดหวังของท่านจะได้รับการตอบสนอง""
az_examination.0014.c: ""ข้าคู่ควรที่จะเป็นศิษย์ของท่านหรือไม่?""
az_examination.0014.d:0 ""ข้ารู้สึกอบอุ่นใจในความห่วงใยของท่าน""
tgp_examiner_promise_modifier: "ความคาดหวังสูง"
tgp_examiner_promise_modifier_desc: "ตัวละครนี้ได้ให้คำมั่นว่าจะรักษาคำชื่นชมจากผู้อาวุโสและความสนใจทั้งมวลที่ตามมา"

az_examination.0015.t: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))|U] ผู้ภาคภูมิใจ"
az_examination.0015.desc: "[proud_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนอยู่ใกล้ขอบของการรวมกลุ่ม ดวงตาเป็นประกายด้วยความภาคภูมิใจ\n\n"นั่น! นั่นคือ [proud_family_member.Custom2('RelationToMeShort', ROOT.Char)] ผู้ [ROOT.Char.Custom('ComplimentAdjective')] ของข้า!" เสียงของ [proud_family_member.GetHerHis] ดังกังวาน ทำให้ผู้เข้าสอบที่อยู่ใกล้เคียงตกใจและหันมามองอย่างรำคาญ"
az_examination.0015.a: "ข้าโค้งคำนับ [proud_family_member.GetHerHim] ด้วยความสง่างามและขอบคุณ"
az_examination.0015.b: "ข้าจะคุยกับ [proud_family_member.GetHerHim] ทีหลังเรื่องการวางตัว"
az_examination.0015.c: "ข้าก้มศีรษะและกลืนหายไปในฝูงชน"
az_examination.0015.d: ""ข้าจะ ทำให้ท่านภาคภูมิใจ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))]!""

az_examination.0016.t: "ถ้อยคำอันกรุณา"
az_examination.0016.desc: "ท่าน [kind_examiner.GetTitledFirstName] กรรมการผู้เป็นที่เคารพ เดินเข้ามาอย่างเงียบ ๆ ห่างจากเสียงพูดคุยของผู้เข้าสอบที่ประสบความสำเร็จมากกว่า\n\n"เจ้าอาจไม่ผ่าน แต่จงอย่าคิดว่าความพยายามของเจ้าสูญเปล่า หนทางสู่การเป็นขุนนางนั้นยาวไกล — และบางครั้งก็คดเคี้ยว""
az_examination.0016.a: ""ข้าขอขอบพระคุณท่านอย่างสุดซึ้ง""
az_examination.0016.b: ""ท่านจะรับข้าเป็นศิษย์และชี้แนะข้าได้หรือไม่?""
az_examination.0016.c: ""ถ้อยคำเหล่านี้จะนำพาข้าให้ก้าวต่อไป""
tgp_examiner_encouragement_modifier: "ถ้อยคำให้กำลังใจ"
tgp_examiner_encouragement_modifier_desc: "ตัวละครนี้ได้รับพรจากกรรมการผู้เป็นที่เคารพ"

az_examination.0017.t: "จดหมายที่ซ่อนไว้"
az_examination.0017.desc: "ขณะจัดเสื้อคลุม ข้ารู้สึกถึงกระดาษแข็งแผ่นหนึ่งซุกอยู่ลึกในแขนเสื้อ ใครบางคนคงแอบส่งจดหมายให้ข้าก่อนการสอบ\n\nมันเขียนว่า: "เมื่อความสงสัยรุมเร้าดั่งแมลงวัน จงจำไว้: เจ้าได้ศึกษา เจ้าได้ดิ้นรน และเจ้าไม่เคยยอมแพ้"\n\nข้ามลานไป ข้าเห็น [letter_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถือม้วนตำราหนึ่งปึก สายตาเราสบกันชั่วครู่ ข้าอาจไว้วางใจและปรึกษาความหมายของจดหมายนี้กับ [letter_examiner.GetHerHim] ได้"
az_examination.0017.b: ""ถ้อยคำเหล่านี้เป็นของข้า และของข้า แต่เพียงผู้เดียว""
az_examination.0017.c: "ให้ [letter_examiner.GetFirstNameNoTooltip] ดูสิ่งนี้"
tgp_letter_self_reflection_modifier: "การทบทวนตนเอง"
tgp_letter_self_reflection_modifier_desc: "ตัวละครนี้มีความแข็งแกร่งเงียบ ๆ ที่มาจากถ้อยคำให้กำลังใจและความเชื่อมั่นของครอบครัว"

az_examination.0018.t: "ผู้อาวุโสท่ามกลางผู้เข้าสอบ"
az_examination.0018.desc: "ข้าเห็นร่างหนึ่งนั่งอยู่ลำพังใต้ร่ม — [old_exam_taker.Custom2('MyCharacterIntroduction', ROOT.Char)] ท่วงท่าของ [old_exam_taker.GetHerHis|U] งุ้มเล็กน้อย ดวงตาคมปลาบและเหนื่อยล้าในคราวเดียวกัน\n\n"ไม่เคยมีคำว่าสายเกินไป" [old_exam_taker.GetSheHe] เอ่ยขึ้น เมื่อสังเกตเห็นสายตาของข้า "แต่มันเป็นหนทางที่ยาวไกลนักสำหรับคนในวัยนี้""
az_examination.0018.b: ""ให้ข้าแบ่งปันสิ่งที่ข้าได้เรียนรู้เถิด""
az_examination.0018.c: ""ข้าหวังว่าข้าจะไม่ต้องลงเอย เช่นนั้น""
tgp_not_getting_any_younger_modifier: "ไม่ใช่อนาคตของข้า"
tgp_not_getting_any_younger_modifier_desc: "ตัวละครนี้เห็นผู้เข้าสอบสูงวัยในการสอบที่เข้าร่วม พวกเขามุ่งมั่นที่จะไม่ปล่อยให้สิ่งนั้นเกิดขึ้นกับตนเอง"
az_examination.0018.d: ""ข้านับถือท่านยิ่ง ท่านผู้ [old_exam_taker.Custom('ComplimentAdjective')]""

az_examination.0019.t: "น้ำหนักแห่งความคาดหวัง"
az_examination.0019.desc.intro: "ขณะที่ข้าก้าวออกจากห้องโถง เสียงที่คุ้นเคยก็เรียกชื่อข้า\n\n[disappointed_relative.GetFirstName] สบตาข้าข้ามฝูงชน พลางตะโกนว่า:"
az_examination.0019.desc.wrathful: ""เจ้านำความอัปยศมาสู่พวกเรา," [disappointed_relative.GetSheHe] เปล่งเสียงลอดไรฟัน, ความโกรธเกรี้ยวเย็นชาลุกโชนอยู่หลังดวงตาของ [disappointed_relative.GetHerHis]"
az_examination.0019.desc.callous: ""เจ้าล้มเหลว," [disappointed_relative.GetSheHe] กล่าวอย่างเย็นชา, ใบหน้าของ [disappointed_relative.GetHerHis] ขมวดคิ้วเล็กน้อยอย่างไม่พอใจ"
az_examination.0019.desc.shy: ""ข้า... ข้ามาหาเจ้า," [disappointed_relative.GetSheHe] พึมพำ, ใบหน้าของ [disappointed_relative.GetHerHis] แดงก่ำอย่างกระอักกระอ่วน "ข้าขอโทษหาก — หากนี่มันน่าอึดอัด""
az_examination.0019.desc.compassionate: ""โอ้, [entrant.Custom2('RelationToMe', ROOT.Char)] ของข้า," [disappointed_relative.GetSheHe] กล่าว, ดวงตาสั่นระริกด้วยน้ำตาที่กลั้นไว้ "เจ้าทำดีที่สุดแล้ว — นั่นคือทั้งหมดที่ข้าต้องการ""
az_examination.0019.desc.fallback: ""เจ้าเกือบทำได้แล้ว," [disappointed_relative.GetSheHe] กล่าวแผ่วเบา, ความผิดหวังฉายชัดบนใบหน้าของ [disappointed_relative.GetHerHis]"
az_examination.0019.a: ""ข้าจะ ทำให้สำเร็จในครั้งหน้า ข้าสาบาน""
az_examination.0019.b: ""ท่าน... ช่วยข้าได้หรือไม่?""
az_examination.0019.c: "ตอนนี้ข้ามิอาจสู้หน้า [disappointed_relative.GetHerHim] ได้..."
tgp_brooding_reflection_modifier: "การครุ่นคิดอย่างหนัก"
tgp_brooding_reflection_modifier_desc: "ตัวละครนี้ได้ถอนตัวเข้าสู่ภายใน ครุ่นคิดอย่างลึกซึ้ง — หรือบางทีอาจกำลังจมอยู่กับความล้มเหลวของตน"

az_examination.0020.t: "สหายผู้ก้าวหน้า"
az_examination.0020.desc: "ลานกว้างอื้ออึงไปด้วยเสียงพูดคุย สะท้อนทั้งความภาคภูมิใจและความผิดหวังในปริมาณที่เท่ากัน ท่ามกลางวงวนของเสื้อคลุมและม้วนตำรา ข้าเห็นสหายของข้า [successful_peer.GetFirstName] เพียงชำเลืองมองที่แขนเสื้อของ [successful_peer.GetHerHis] ซึ่งปักตราประทับของการสอบในวัง ก็บอกทุกสิ่งที่ข้าต้องรู้\n\n[successful_peer.GetSheHe|U] ยิ้มขณะที่ [successful_peer.GetSheHe] เดินเข้ามา อาจจะด้วยความเคยชิน ความสงสาร หรือความยินดีอย่างแท้จริง"
az_examination.0020.a: ""ท่านสมควรได้รับสิ่งนี้แล้ว จริง ๆ""
az_examination.0020.b: "คำรามในลำคอและกลับไปมุ่งมั่นศึกษาเป็นสองเท่า"
az_examination.0020.c: "อย่างไรเสียข้าก็กังวลเรื่องอื่นมากกว่า"
tgp_envy_fueled_study_modifier: "วินัยที่ขับเคลื่อนด้วยความอิจฉา"
tgp_envy_fueled_study_modifier_desc: "ตัวละครนี้เต็มไปด้วยความอิจฉาและความมุ่งมั่น ตั้งหน้าตั้งตาศึกษาด้วยความเข้มข้นครั้งใหม่เพื่อเอาชนะความล้มเหลวและทัดเทียมกับผู้ที่ก้าวล้ำหน้าตนไป"
