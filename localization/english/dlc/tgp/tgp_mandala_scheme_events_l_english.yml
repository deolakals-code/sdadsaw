 coerce_tributary_ongoing.0001.a.failure: "[target.GetShortUIName] ไม่ยอมจำนน"
 coerce_tributary_ongoing.0001.b: "เวลาจะจัดการเรื่องนี้ให้เราเอง"
 scheme_extra_tariffs: "ภาษีพิเศษ"
 scheme_extra_tariffs_desc: "เจ้าของแผนการได้โน้มน้าวเป้าหมายว่าหากพวกเขาไม่ยอมเป็นรัฐบรรณาการโดยสมัครใจ จะมีความไม่สะดวก #EMP อีกมากมาย#! ตามมา"
 
 coerce_tributary_ongoing.0010.t: "[my_scheme.GetName]: การเจรจาที่ก้าวร้าว"
 coerce_tributary_ongoing.0010.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] ของข้า [marshal.GetName] ก้มคำนับต่ำ เหงื่อยังคงหยดลงมาจากหน้าผากของ [marshal.GetHerHis] หลังจากการฝึก [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" [marshal.GetSheHe] เริ่ม "เราเสียคำพูดไปมากเกินไปแล้วในการพยายามโน้มน้าว [target.GetTitledFirstName] เครื่องบรรณาการไม่ใช่สิ่งที่ต้องร้องขอ — แต่เป็นสิ่งที่ต้องยึดเอามา"\n\n[marshal.GetSheHe|U] กำหมัดแน่น\n\n"อนุญาตให้ข้าเดินทัพนักรบบางส่วนไปยังหน้าประตูเมือง [capital.GetName]""
 coerce_tributary_ongoing.0010.a: ""จงทำ เช่นนั้น!""
