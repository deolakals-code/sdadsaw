 coerced_my_tributary_opinion: "บีบบังคับรัฐบรรณาการของข้า"
 coerced_tributary_opinion: "รัฐบรรณาการที่ถูกบีบบังคับ"

 #Coerce Contribution Outcomes
 scheme_critical_moments.1242.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.1242.desc: "ข้ารู้อยู่เสมอว่าข้าสามารถพึ่งพาผู้คนที่ทำงานหนักของ [target_title.GetBaseNameNoTierNoTooltip] เพื่อมาช่วยเหลือข้าได้ เพื่ออุดมการณ์ที่ยิ่งใหญ่กว่า และเพื่อเฉลิมฉลองผู้ปกครองของพวกเขา พวกเขาได้ยอมสละแม้กระทั่งเสื้อผ้าที่สวมใส่เพื่อสนับสนุนวิหารของข้า\n\nน่ายินดียิ่งนัก"
 scheme_critical_moments.1242.a: "ดี ดีมาก..."

 scheme_critical_moments.1243.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.1243.desc: "พวก [owner.Custom('InsultNoun')] แห่ง [target_title.GetBaseNameNoTierNoTooltip] ไม่ยอมรับเหตุผลและกำลังปฏิเสธคำร้องขอของข้าที่จะบริจาคให้กับโครงการ #EMP อันยิ่งใหญ่#! ของข้า\n\nโดยอ้างเหตุผลว่า #EMP ขาดแคลนทุนทรัพย์#! ไร้สาระสิ้นดี! เมื่อมีความตั้งใจย่อมมีหนทาง!"
 scheme_critical_moments.1243.a: "ช่างอวดดีนัก!"

 insusceptible_to_coerce_contribution_modifier: "ไม่ตอบสนองต่อการบีบบังคับ"
 insusceptible_to_coerce_contribution_modifier_desc: "เคาน์ตีนี้ไม่เห็นด้วยกับการถูกบังคับให้สนับสนุนวิหารหลวง"


 #Coerce Contribution Outcomes
 scheme_critical_moments.1252.t: "[scheme.GetNameNoTooltip]: สำเร็จ"
 scheme_critical_moments.1252.desc: "ข้ารู้อยู่เสมอว่าข้าสามารถพึ่งพา [target.GetTitledFirstName] ให้มาช่วยเหลือข้าได้! การพูดจาหว่านล้อม การเกลี้ยกล่อม และการโต้วาทีของข้าได้บังเกิดผล — [target.GetSheHe] ตกลงอย่างมีเมตตาที่จะลงทุนในโครงการของข้า ทุ่มสุดตัวเพื่อ ทำให้วิหารของข้ายิ่งใหญ่เกรียงไกร\n\nการก้าวข้ามกำลังใกล้เข้ามา..."
 scheme_critical_moments.1252.a: "ยอดเยี่ยมมาก!"

 scheme_critical_moments.1253.t: "[scheme.GetNameNoTooltip]: ล้มเหลว"
 scheme_critical_moments.1253.desc: "ข้าบุกเข้าไปในห้องด้วยความโกรธเกรี้ยว — ไอ้ [target.Custom('InsultNoun')] [target.GetTitledFirstName] นั่นปฏิเสธที่จะรับฟังเหตุผล ข้าไม่ได้โต้วาที โต้เถียง หรือ #EMP ใช้บารมี#! กับคนใกล้ชิดที่สุดของ [target.GetHerHis] หรอกหรือ?!\n\nโดยอ้างถึง #EMP การลงทุนเร่งด่วน#! มากกว่าเป็นลำดับความสำคัญในปัจจุบัน แทนที่จะบริจาคให้กับโครงการ #EMP อันงดงาม#! ของข้า ข้าคาดหวังจาก [target.GetHerHim] มากกว่านี้ นี่ไม่ใช่ครั้งสุดท้ายที่ [target.GetSheHe] จะได้ยินเรื่องนี้..."
 scheme_critical_moments.1253.a: "ชิ ชิ..."

 insusceptible_to_leverage_contribution_modifier: "ไม่ตอบสนองต่อการใช้บารมี"
 insusceptible_to_leverage_contribution_modifier_desc: "ตัวละครนี้ไม่ยอมเปิดกระเป๋าเงินหรือหัวใจเพื่อสนับสนุนการบริจาค"
 
