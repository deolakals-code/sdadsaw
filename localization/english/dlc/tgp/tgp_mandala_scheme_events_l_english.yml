 coerce_tributary_ongoing.0001.t: "[my_scheme.GetNameNoTooltip]: ปิดถนน"
 coerce_tributary_ongoing.0001.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))] ของข้า [steward.GetName] ยืนอยู่หน้าข้าด้วยรอยยิ้มกว้างที่สุด\n\n"ข้า... #EMP พบ#! โฉนดเก่าที่อนุญาตให้เรากดดัน [target.GetTitledFirstName] ให้จ่ายภาษีสูงขึ้นหากพวกเขาต้องการใช้ถนนของเรา อย่างไรก็ตาม ข้าต้องการเงินทุนเพื่อส่งคณะผู้แทนกลุ่มเล็กๆ ไปยัง [capital.GetName]""
 coerce_tributary_ongoing.0001.a: "[target.GetSheHe|U] จะได้เรียนรู้ว่าการต่อต้านเรานั้นมีราคาสูงเพียงใด"
