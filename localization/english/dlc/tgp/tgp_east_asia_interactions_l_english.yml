 tributary_mandala_tribal_desc: "[tributary|E] มณฑลแบบชนเผ่า จะมอบ [gold|E], [levies|E] หรือแม้ แต่ [prestige|E] ให้แก่ [suzerain|E] ของตนเป็นประจำ [tributary_contract|E] จะถูกสืบทอดเมื่อมีการสืบทอดตำแหน่ง\n\n$tributary_mandala_common_desc$"
 tributary_mandala_common_desc: "เพื่อเป็นการแลกเปลี่ยน [suzerain|E] ของพวกเขาจะปกป้องรัฐบรรณาการ หากพวกเขาถูกโจมตีโดยผู้รุกรานจากภายนอก"

 tributary_wanua: "รัฐบรรณาการแบบวานูอา"
 tributary_wanua_desc: "[tributary|E] แบบ [wanua|E] จะมอบ [gold|E], [prestige|E] หรือแม้ แต่ [barter_goods|E] ให้แก่ [suzerain|E] ของตนเป็นประจำ [tributary_contract|E] จะถูกสืบทอดเมื่อมีการสืบทอดตำแหน่ง"

 wasted_our_efforts: "ความพยายามที่สูญเปล่า"

 tgp_mandala_send_missionary_interaction: "ส่งผู้เผยแผ่ศาสนา"
 tgp_mandala_send_missionary_interaction_desc: "ผู้เผยแผ่ศาสนาที่อุทิศตนจากอาณาจักรของท่านจะเดินทางไปยังราชสำนักของ [recipient.GetShortUIName] ซึ่งอาจเปลี่ยน [tributary|E] ของท่านให้มานับถือ [faith|E] ของท่าน หรือสร้าง [piety|E] ให้กับท่านจากการติดต่อกับราชสำนักของรัฐบรรณาการ"
 tgp_mandala_send_missionary_interaction_tt: "ผู้เผยแผ่ศาสนาชาว [actor.GetCulture.GetNameNoTooltip] ผู้นับถือ [actor.GetFaith.GetName] จะไปปรากฏตัวที่ราชสำนักของ [recipient.GetName]"
 tgp_mandala_send_missionary.success: "ราชสำนักของ [recipient.GetShortUINamePossessive] ยอมรับผู้เผยแผ่ศาสนา"
 tgp_mandala_send_missionary_interaction_fervor_gain_tt: "[fervor|E] เพิ่มขึ้น #P 1#!"
 tgp_mandala_send_missionary_interaction_cheaper_conversion_tt: "การเปลี่ยนไปนับถือศรัทธาของ [suzerain|E] จะมีค่าใช้จ่ายถูกลง ตราบเท่าที่ผู้เผยแผ่ศาสนายังคงอยู่ที่ราชสำนักของ [tributary|E]"
 tgp_mandala_send_missionary.failure: "ราชสำนักของ [recipient.GetShortUINamePossessive] ปฏิเสธผู้เผยแผ่ศาสนา"
 tgp_mandala_send_missionary_interaction_fervor_loss_tt: "[fervor|E] ลดลง #N 1#!"
