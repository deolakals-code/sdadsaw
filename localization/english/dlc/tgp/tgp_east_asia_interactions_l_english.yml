 tgp_east_asia_interaction_events.1000.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 tgp_east_asia_interaction_events.1000.desc: "ข้ารู้สึกเป็นเกียรติอย่างยิ่งที่ท่านเสนอที่จะปรับเปลี่ยนอาณาจักร [recipient.GetPrimaryTitle.GetAdjectiveNoTooltip] ของข้าให้เป็นดั่งภาพลักษณ์ของท่าน"
 tgp_east_asia_interaction_events.1000.favor: "\n\nเพียง แต่ ข้าคิดว่าข้าอาจมีปัญหาในการโน้มน้าวผู้อื่นอยู่บ้าง..."
 tgp_east_asia_interaction_events.1000.a: "เทพเจ้าจะทรงเป็นหนี้บุญคุณท่าน"
 tgp_east_asia_interaction_events.1000.b: "ข้าได้ประสงค์ เช่นนี้แล้ว เจ้ากล้าขัดขวางราชโองการของข้าหรือ?"
 tgp_east_asia_interaction_events.1001.gold: "\n\nบางที หากข้าสามารถแสดงสัญลักษณ์แห่งไมตรีจิตของท่าน ผู้อื่นก็อาจจะประทับใจ เช่นกัน..."
 tgp_east_asia_interaction_events.1002.a: "ในฐานะผู้รับใช้ของข้า เจ้าจะได้รับรางวัล"
 tgp_east_asia_interaction_events.1003.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 tgp_east_asia_interaction_events.1003.desc: "ถึงเวลาแล้วที่ [recipient.GetPrimaryTitle.GetBaseNameNoTier] จะต้องกลายเป็นส่วนหนึ่งของมณฑล [actor.GetPrimaryTitle.GetAdjectiveNoTooltip] อย่างแท้จริง ข้าขอเสนอให้เจ้าปกครองในฐานะ [actor.GetPrimaryTitle.GetTierAsNameNoTooltip] โดยได้รับการสนับสนุนอย่างเต็มที่จากเหล่านักบวชของข้า"
 tgp_east_asia_interaction_events.1003.end: "\n\nท่านจะปกครองด้วยเจตจำนงของข้า ในฐานะหนึ่งในตัวแทนของข้าบนโลกใบนี้"
 tgp_east_asia_interaction_events.1003.a: "จงประกาศให้ทราบทั่วกัน!"
 tgp_east_asia_interaction_events.1003.b: "ถือเป็นบุญคุณต่อท่าน ข้าจะทำตามนั้น"
 tgp_east_asia_interaction_events.1003.c: "ข้าจักต้องใช้ทรัพยากรเพื่อดำเนินการเรื่องนี้"
 tgp_east_asia_interaction_events.1003.d: "ผู้ปกครองแห่ง [recipient.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] จะไม่ยอมก้มหัว!"
 tgp_east_asia_interaction_events.1000.accept_toast: "ยอมรับข้อเรียกร้องแล้ว"
