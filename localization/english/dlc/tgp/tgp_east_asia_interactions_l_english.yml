 tributary_mandala: "รัฐบรรณาการแบบมณฑล"
 tributary_mandala_desc: "[tributary|E] แบบมณฑล จะมอบ [gold|E], [levies|E] หรือแม้ แต่ [piety|E] ให้แก่ [suzerain|E] ของตนเป็นประจำ [tributary_contract|E] จะถูกสืบทอดเมื่อมีการสืบทอดตำแหน่ง\n\n$tributary_mandala_common_desc$"
