l_english: 
 tgp_china_yearly.0001.t: "ยามเมื่อวิถีมิอาจดำรง"
 tgp_china_yearly.0001.desc: "ระหว่างทางกลับสู่เรือนข้า ข้าพลันสังเกตเห็นฝูงชนกำลังรวมตัวกันอยู่นอกประตู [poor_county.GetProvince.GetName] [poor_county.GetProvince.GetHolding.GetType.GetName] \n\nทั้งมารดา บิดา และบุตรธิดาต่างเข้าแถวเรียงรายบนถนน ก้มหน้าก้มตาด้วยความอับอาย พลางยื่นมือขอเศษอาหารจากนักเดินทางที่ผ่านไปมา"
 tgp_china_yearly.0001.a: "บริจาคอาหารและเสื้อผ้าแก่ผู้ยากไร้"
 tgp_china_yearly.0001.a.flavor: "... และยอมรับความล้มเหลวในการปกครองราษฎรของข้า"
 tgp_china_yearly.0001.b: ""โบยตีพวกมันกลับไปทำงาน!""
 tgp_china_yearly.0001.b.success: "เหล่าสามัญชนถูกข่มขู่สำเร็จ"
 tgp_china_yearly.0001.b.critical: "สำเร็จอย่างน่าเหลือเชื่อ!"
 tgp_china_yearly.0001.c: ""ข้าควรกลับไปศึกษาเล่าเรียน""
 tgp_china_yearly.0001.c.flavor: "ข้ายังมิทันพร้อมรับมือกับคำถามอันยากเย็น เช่นนี้"
 tgp_china_yearly.0001.d: "เรื่องทางโลกเหล่านี้มิควรค่าแก่การใส่ใจของข้า"
 tgp_china_yearly.0005.t: "[grieving_child.Custom('GetDaughterSon')|U] ที่แท้จริง"
 tgp_china_yearly.0005.eunuch: "[messenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คำนับข้า โดยมีเด็กชาวบ้านผู้หนึ่งเดินตามหลัง [messenger.GetHerHis] มา \n\n"ท่าน [ROOT.Char.GetTitleAsName] ข้าพบ[grieving_child.Custom('GirlBoy')]ผู้นี้อยู่นอกประตู ร้องขอเข้าพบท่าน [grieving_child.GetSheHe|U] เพิ่งสูญเสียญาติเพียงผู้เดียวที่เหลืออยู่ของ [grieving_child.GetHerHis] ไป และไม่มีหนทางจัดงานศพที่เหมาะสม เราต้องทำสิ่งใดสักอย่างเพื่อ[grieving_child.GetHerHim]!""
 tgp_china_yearly.0005.knight: "ข้าได้ยินเสียงร้องอันดังและเสียงฝีเท้าวิ่งมาจากประตูหน้าลาน เมื่อตามเสียงไป ข้าพบ [messenger.GetTitledFirstName] กำลังฉุดรั้งเด็กชาวบ้านผู้หนึ่งไว้ \n\n"ช่วยข้าด้วย ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]!" เด็กน้อยร่ำไห้ "[parent.GetMotherFather] ของข้าสิ้นใจแล้ว ทิ้งข้าไว้เพียงลำพัง ข้าไม่มีผ้าห่อร่าง [parent.GetHerHis] ไม่มีตะปูสำหรับโลงศพ" จากดวงตาที่ขอบแดงก่ำและคราบน้ำมูกที่เกรอะกรังบนจมูกของ [grieving_child.GetHerHis] ข้าบอกได้ว่าความทุกข์ระทมของ [grieving_child.GetHerHis] นั้นเป็นของจริง"
 tgp_china_yearly.0005.outro: "\n\nหากข้ามิทำสิ่งใด มีความเป็นไปได้ที่เด็กผู้นี้จะมิอาจรอดชีวิตได้ด้วยตัวของ [grieving_child.GetHerHis] เอง"
 tgp_china_yearly.0005.a: ""ข้าจะหาผู้ดูแลที่เหมาะสมให้เขา""
 tgp_china_yearly.0005.b: ""เขามิอาจแสดงความเคารพต่อ [parent.GetMotherFather] ของเขาได้ หากเรารับเขาเข้ามา""
 tgp_china_yearly.0005.c: "ข้ายังมิพร้อมที่จะตัดสินใจเรื่องนี้"
 tgp_china_yearly.0005.c.flavor: "ท่านถูกเตือนให้ศึกษาเล่าเรียนให้มากขึ้น"
 tgp_china_yearly.0005.d: "เรามิอาจเป็นผู้ชี้เป็นชี้ตายแก่ผู้ใดได้"
 tgp_china_yearly.0010.t: "ลายเส้นแห่งโชคลาภ"
 tgp_china_yearly.0010.desc: "ขณะเดินผ่านตลาดท้องถิ่น ข้าได้ยินเสียงผู้ค้าตะโกนว่า "บทกวีมีขาย! ถ้อยคำมงคลนำโชคลาภสู่ครัวเรือนของท่าน!" \n\nข้าแหวกฝูงชนเบื้องหน้าเพื่อสำรวจแผงลอย บทกวีถูกเขียนด้วยตัวอักษรที่ผอมบางเกินไป ลายเส้นรีบร้อน แทบจะกลืนกันในหลายแห่ง \n\nข้าแทบไม่เชื่อถือในทักษะของผู้ขาย และยิ่งไม่เชื่อในคำกล่าวอ้างของ [starving_lowborn.GetHerHis] แต่ผู้คนมากมายกลับเข้าแถวรอซื้อผลงานของ [starving_lowborn.GetHerHis]"
 tgp_china_yearly.0010.a: "อาลักษณ์ผู้นี้มิต่างอันใดกับโจร!"
 tgp_china_yearly.0010.a.tt: "ท่านเนรเทศอาลักษณ์ผู้นั้น"
 tgp_china_yearly.0010.b: "[starving_lowborn.GetSheHe|U] อาจพิสูจน์ได้ว่ามีประโยชน์"
 tgp_china_yearly.0010.c: "ข้าสงสัยว่าตำรากล่าวถึงเรื่องนี้ว่าอย่างไร"
 tgp_china_yearly.0010.d: "ข้ามีเรื่องสำคัญกว่าที่ต้องจัดการ"
 tgp_china_yearly.0015.t: "ปัญหาการค้า"
 tgp_china_yearly.0015.desc: "การเยือนโรงน้ำชาท้องถิ่นของข้าถูกขัดจังหวะด้วยเสียงเอะอะบนถนน ข้ามองออกไปเห็น [market_vendor.GetTitledFirstName] จิตรกรท้องถิ่น กำลังโต้เถียงอย่างรุนแรงกับคนแปลกหน้า \n\n"ลูกค้าของข้าคาดหวังว่าจะพบข้าที่นี่ ข้ามีงานว่าจ้างหลายชิ้นที่ต้องส่งมอบให้พวกเขา!" [market_vendor.GetTitledFirstNameNoTooltip] โต้แย้ง แต่พ่อค้าผู้นั้นได้ตั้งแผงและเรียงรายสินค้าของตนเรียบร้อยแล้ว \n\nแผงลอยนั้นมีสินค้า [ROOT.Char.Custom('GetClothingArticle')] รูปสลัก [ROOT.Char.Custom('RegionalFerociousAnimal')] และปิ่นปักผมกับหวีอันวิจิตรจำนวนหนึ่ง เห็นได้ชัดว่าพ่อค้าผู้นี้หาเลี้ยงชีพจากแรงงานของช่างฝีมือผู้อื่น"
 tgp_china_yearly.0015.a: "ขับไล่พ่อค้าผู้นั้นออกไป"
 tgp_china_yearly.0015.b: "อนุญาตให้พ่อค้าอยู่ต่อ โดยต้องมีสิ่งแลกเปลี่ยน"
 tgp_china_yearly.0015.c: "ข้าบอกให้พวกเขาเงียบ เพื่อที่ข้าจะได้ไตร่ตรองเรื่องการศึกษาของข้า"
 tgp_china_yearly.0015.d: "ช่างเป็นการทะเลาะวิวาทที่ไร้สาระสิ้นดี"
 tgp_china_yearly.0020.t: "เรื่องของการบริการสาธารณะ"
 tgp_china_yearly.0020.desc: "[tax_official.GetTitledFirstName] เข้ามาหาข้าในสวน ด้วยมือที่อยู่ไม่สุขและรอยยิ้มอันเจ้าเล่ห์ ข้าแทบไม่มีเวลาปล่อย [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] ในมือและหันไปเผชิญหน้า [tax_official.GetHerHim] ตรงๆ ก่อนที่ [tax_official.GetSheHe] จะเอ่ยกับข้า \n\n"นายเหนือหัวของท่านส่งข้ามาพร้อมข้อความ" [tax_official.GetSheHe] กล่าว "[tax_liege.GetTitledFirstName] ประสงค์จะแจ้งให้ท่านทราบว่าท้องพระคลังหลวงกำลังต้องการเงินทุน และ [taxless_county.GetProvince.GetName] มีภาษีค้างชำระจำนวนหนึ่งที่ [tax_liege.GetSheHe] ประสงค์ให้ท่านไปเก็บ" \n\nเป็นที่รู้กันดีอยู่แล้วว่าชื่อเสียงของข้าจะเสื่อมเสียหากข้าไม่ปฏิบัติตาม แต่ [Glossary( 'ขงจื่อ', 'CONFUCIUS_GLOSS' )] สอนเราให้รังเกียจความโลภในทุกรูปแบบ"
 tgp_china_yearly.0020.a: "ส่งเจ้าหน้าที่เก็บภาษีออกไป"
 tgp_china_yearly.0020.b: "ปฏิเสธ"
 tgp_china_yearly_no_education_first: "#weak You get this effect because you do not have the Confucian Education trait.#!"
 tgp_china_yearly.0030.t: "คำกล่าวดีงามเดินทางไกล"
 tgp_china_yearly.0030.desc_minister_of_personel: "[title_offerer.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\nเป็นหน้าที่ของข้าที่จะค้นหาผู้มีความสามารถ เช่นท่าน และนำพาพวกเขาเข้ารับตำแหน่ง "
 tgp_china_yearly.0030.desc_elder: "ในฐานะ[elder|E]ของท่าน ข้าต้องยอมรับว่าข้าประทับใจในชื่อเสียงที่ท่านได้สร้างขึ้นในฐานะนักปราชญ์ลัทธิขงจื๊อที่เหมาะสมอย่างแท้จริง"
 tgp_china_yearly.0030.desc_fellow_confucian: "ในฐานะสหายบัณฑิตขงจื๊อ ข้ายินดีที่ได้ยินถึงความอุทิศตนต่อมรรคาของท่าน และตั้งตารอโอกาสในการโต้วาทีฉันมิตรหลายคราในอนาคต"
 tgp_china_yearly.0030.desc_intro_outro: "\n\nเพื่อเป็นการยอมรับในความประพฤติอันดีงามของท่าน ข้าจึงขอเสนอที่จะผลักดันการเสนอชื่อของท่านสำหรับตำแหน่งเจ้าเมืองแห่ง [free_title.GetName]"
 tgp_china_yearly.0030.a: "ข้าขอน้อมรับด้วยความยินดี"
 tgp_china_yearly.0030.b: "อนิจจา การศึกษาของข้ายังมิทันเสร็จสมบูรณ์"
