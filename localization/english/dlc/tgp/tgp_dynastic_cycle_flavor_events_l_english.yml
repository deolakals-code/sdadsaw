l_english: 
 tgp_dynastic_cycle_events.0001.t: "หนทางเบื้องหน้า"
 tgp_dynastic_cycle_events.0001.desc: "สวนยังคงนิ่งเงียบ เว้น แต่เสียงใบไม้ไหวตามสายลม ในความเงียบสงัด ความคิดข้าหวนคำนึงถึงอาณาจักรในช่วงเวลาแห่ง [my_situation.GetTopCurrentPhase.GetName|l]\n\nเพียงการยืนหยัดจะพอเพียงฤๅ อาณาจักรจะยืนยงอยู่ได้หรือ เมื่อหยุดนิ่งดุจดังสวนแห่งนี้\n\nชาในถาดของบ่าวรับใช้ข้าเย็นชืดเสียแล้ว"
 tgp_dynastic_cycle_events.0001.aa: "[my_movement.GetNameNoTooltip] จะนำมา ซึ่งการรู้แจ้ง!"
 tgp_dynastic_cycle_events.0001.a: "มีสหายไว้ ยามเมื่อเวลามาถึง..."
 tgp_dynastic_cycle_events.0001.a.potential_friend: "#EMP ข้าควรส่งสาส์นถึง [potential_friend.GetTitledFirstNameNoTooltip] ผู้ภักดี#!\n"
 tgp_dynastic_cycle_events.0001.a.friend: "#EMP ข้าควรส่งสาส์นถึง [friend.GetTitledFirstNameNoTooltip] สหายรักของข้า#!\n"
 tgp_dynastic_cycle_events.0001.b: "เวลาที่จะก้าวหน้าคือ #EMP บัดนี้#!."
 tgp_dynastic_cycle_events.0001.c: "เรามิอาจใช้ชีวิตอยู่ในอนาคตได้"
 friend_together_in_preparation: "[CHARACTER.GetShortUIName] ส่งสาส์นถึง [TARGET_CHARACTER.GetShortUIName] สัญญาว่าจะอยู่ร่วมกันเมื่อความมั่นคงกลับคืนสู่อาณาจักร"
 friend_together_in_preparation_corresponding: "[TARGET_CHARACTER.GetShortUIName] ได้รับสาส์นจาก [CHARACTER.GetShortUIName] ซึ่งสัญญาว่าจะอยู่ร่วมกันเมื่อความก้าวหน้ามาถึง"
 tgp_advancement_focus_modifier: "มุ่งเน้นที่ความก้าวหน้า"
 tgp_advancement_focus_modifier_desc: "ตัวละครนี้ตัดสินใจที่จะมุ่งเน้นไปที่การพัฒนาอาณาจักรให้ก้าวหน้า โดยละทิ้งพื้นที่อันกว้างขวาง"
 
 tgp_dynastic_cycle_events.0010.t: "ภายใต้แรงกดดัน"
 tgp_dynastic_cycle_events.0010.desc: "[disciple.GetTitledFirstName] ศิษย์ของข้ามาเยี่ยมเยียน แต่เหตุผลของ[disciple.GetHerHis]หาใช่เรื่องน่ายินดีไม่\n\n"ท่านอาจารย์... อาณาจักรล่องลอยดั่งนาวาในพายุ แต่ละวันนำมา ซึ่งความแตกแยกใหม่ และศัตรูใหม่ [my_situation.GetTopCurrentPhase.GetName] เติบใหญ่ขึ้น ข้ามิรู้ว่าพรุ่งนี้จะเป็น เช่นไร จะเป็นสิ่งใด"\n\nข้าสังเกตเห็นได้ว่ามือของ[disciple.GetHerHis]กำลังสั่นเทา"
 tgp_dynastic_cycle_events.0010.a: ""ข้าจะไม่ให้ผู้ใดกล่าวว่าศิษย์ของ[ROOT.Char.GetFirstNamePossessiveNoTooltip]เป็นคนอ่อนแอ!""
 tgp_dynastic_cycle_events.0010.b: "เด็กน้อยน่าสงสาร ข้าต้องปลอบโยน[disciple.GetHerHim]"
 tgp_dynastic_cycle_events.0010.c: ""เจ้าเรียนรู้ได้ก็ด้วยผ่านความยากลำบาก""
 
 tgp_dynastic_cycle_events.0020.t: "หัตถ์อันอาจหาญแห่งความหิวโหย"
 tgp_dynastic_cycle_events.0020.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] มีข่าวร้ายขอรับ" [marshal.GetName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))]ของข้า เข้ามาหา, [marshal.Custom('quirk_pos_pp')]\n\n"ในยามดึกสงัด เหล่าไพร่แห่ง [peasant_county.GetName] บุกพังยุ้งฉาง หากข้าจ้างยามเพิ่มได้ เราอาจยังพอตามหาพวกมันพบ"\n\nแม้ แต่อาณาจักรของเราก็มิอาจปลอดภัยจาก [my_situation.GetTopCurrentPhase.GetName]"
 tgp_dynastic_cycle_events.0020.a: ""คนของข้าจะตามหาพวกมัน และ #EMP สังหาร#! พวกมัน""
 tgp_dynastic_cycle_events.0020.b: ""จ้างยามพวกนั้นซะ!""
 tgp_dynastic_cycle_events.0020.c: "คนสิ้นไร้หนทางย่อมทำเรื่องสิ้นคิด"
 tgp_executed_peasants_county_modifier: "ไพร่ผู้ถูกประหาร"
 tgp_executed_peasants_county_modifier_desc: "เคาน์ตีนี้ยังมิลืมเลือนการปฏิบัติที่เหล่าไพร่ผู้หิวโหยของพวกเขาได้รับ"
 
 tgp_dynastic_cycle_events.0030.t: "เปลี่ยนแปลงเส้นทาง"
 tgp_dynastic_cycle_events.0030.desc: ""เวลาแห่ง [my_situation.GetTopCurrentPhase.GetName] คือ #EMP บัดนี้#!!"\n\nเสียงฝีเท้าอันหนักแน่นของ [marshal.GetNamePossessive] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))]ของข้า ประกาศการมาถึงของ[marshal.GetHerHis]ได้ดียิ่งกว่าคำพูด\n\n"ข้าชื่นชมความทุ่มเทของท่านต่อวิถีพลเรือน แต่ [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] เรียกร้องความอาจหาญ! จงระลึกถึงเรื่องราวของ [ROOT.Char.Custom('GetRandomAnnalsPassage')] และนำทางกองทัพของเรา!""
 tgp_dynastic_cycle_events.0030.a: "ถึงเวลาต้องกล้าที่จะอาจหาญ!"
 tgp_dynastic_cycle_events.0030.b: ""ข้ากระตือรือร้นที่จะเรียนรู้ แต่ไม่คิดเปลี่ยนแปลง""
 tgp_dynastic_cycle_events.0030.c: "ไม่มีเกียรติใดยิ่งใหญ่กว่าการปกครองฝ่ายพลเรือน"
 
 tgp_dynastic_cycle_events.0040.t: "เส้นทางแห่งโอกาส"
 tgp_dynastic_cycle_events.0040.desc: "[steward.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('steward'))]ของข้า เข้ามาในห้องศึกษาพร้อมรอยยิ้มบนใบหน้าและเหรียญในมือของ[steward.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ขบวนคาราวานจากตะวันตกมาบ่อยครั้งขึ้น ตาม [silk_road_situation.GetName] ด้วยการลงทุนเพียงเล็กน้อยในการเชื่อมต่อที่ดีขึ้น เราอาจดึงความมั่งคั่งจากหลายอาณาจักรมาเป็นของเราได้""
 tgp_dynastic_cycle_events.0040.a: ""ช่วงเวลาแห่ง [my_situation.GetTopCurrentPhase.GetType.GetNameNoTooltip|l] นี้คือโอกาสอันเหมาะสมยิ่ง!""
 tgp_dynastic_cycle_events.0040.b: ""อย่าได้เสียเวลา!""
 tgp_dynastic_cycle_events.0040.c: "เส้นทางสายไหมจะดำเนินต่อไป ไม่ว่าจะมีเราหรือไม่มี"
 tgp_silk_road_advancement_modifier: "เส้นทางสายไหมที่ก้าวหน้า"
 tgp_silk_road_advancement_modifier_desc: "ตัวละครนี้ลงทุนในเส้นทางสายไหม #EMP ในจังหวะเวลาที่เหมาะสมพอดี#!."
 
 tgp_dynastic_cycle_events.0050.t: "การเปลี่ยนแปลงความโปรดปราน"
 tgp_dynastic_cycle_events.0050.desc: "อิทธิพลที่ [favored_movement.GetName] มีต่อบัลลังก์นั้นเข้มงวดยิ่งขึ้น คำแนะนำของพวกเขากำหนดนโยบายตามความพอใจ\n\nหากขบวนการของข้าจะรุ่งเรืองขึ้น ข้าต้องทำลายชื่อเสียงของพวกเขา การโต้วาทีสาธารณะอาจโน้มน้าวการตัดสินใจของราชสำนัก และบางทีอาจ รวมถึง [top_liege.GetTitleAsNamePossessiveNoTooltip] ด้วย\n\nแต่การท้าทายพวกเขาคือการเสี่ยงต่อความอัปยศ หากคำพูดของข้าสะดุด"
 tgp_dynastic_cycle_events.0050.a: "ข้ามิอาจลังเลได้"
 tgp_dynastic_cycle_events.0050.b: "[my_movement.GetNameNoTooltip] ย่อมมีคุณงามความดีในตัวของมันเอง"
 tgp_dynastic_cycle_events.0050.c: "ไยต้องเสี่ยงศักดิ์ศรีของข้าเพื่อขบวนการด้วย"
 tgp_debate_discount_var_tt: "ท่านสามารถจัด [GetActivityType('activity_debate').GetName] ในอีก #V 5 ปี#! ข้างหน้าได้ในราคาส่วนลด #P 25%#!"
 tgp_debate_discount_var_desc: "จากเหตุการณ์"
