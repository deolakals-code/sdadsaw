l_english: 
 ##################################################
 # CHINA CAREER EVENTS
 ##################################################
 tgp_china_career.0001.t: "เพื่อรับใช้องค์โอรสสวรรค์"
 tgp_china_career.0001.desc: "ระบบราชการของ [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip] นั้นกว้างใหญ่และซับซ้อน หาก แต่เป็นกลไกอันทรงประสิทธิภาพ มันคือหน้าที่ของประชาราษฎร์ทุกคนที่จะรับใช้แผ่นดินอย่างสุดความสามารถ\n\n"
 tgp_china_career.0001.minister_desc: "ในฐานะ [new_ruler.GetTitleAsNameNoTooltip] ทุกสายตาต่างจับจ้องมาที่ข้า เพียงก้าวพลาดครั้งเดียวก็เพียงพอที่จะเห็นเส้นทางอาชีพของข้าพังทลายลง\n\nข้าจะแสดงให้ [emperor.GetTitleAsNameNoTooltip] ได้ประจักษ์ว่าข้าคู่ควรแก่ความไว้วางพระทัยของ [emperor.GetHerHis]"
 tgp_china_career.0001.landed_desc: "ในฐานะ [new_ruler.GetTitleAsNameNoTooltip|l] แห่ง [new_ruler.GetPrimaryTitle.GetNameNoTier] ข้ามีภาระหน้าที่และความรับผิดชอบมากมายที่ต้องปฏิบัติและ ทำให้ลุล่วง นามแห่ง [ruler_family.GetName] จะขจรขจายไปทั่วแผ่นดิน\n\nบางทีข้าอาจมีความสามารถเพียงพอ ที่สักวันหนึ่งจะได้เข้าร่วมในราชการแผ่นดิน และได้เป็นเสนาบดี?"
 tgp_china_career.0001.unlanded_desc: "ในฐานะส่วนหนึ่งของตระกูล [ruler_family.GetName] ข้าจำต้องพากเพียรอย่างหนักเพื่อสร้างชื่อให้ตนเอง ประการแรก ข้าต้องผ่าน [examinations|E] และสั่งสม [merit|E] เมื่อนั้นข้าจึงจะสามารถได้รับการ แต่งตั้งเป็นขุนนางได้"
 tgp_china_career.0001.a: "พรหมลิขิตมิอาจรอช้า ลงมือกันเถิด!"
 tgp_china_career.0001.b: "ทุกคนจักได้รู้ว่า #EMP ข้า#! คือผู้ใด"
 tgp_merit_boost_modifier: "มุ่งเน้นคุณธรรม"
 tgp_merit_boost_modifier_desc: "ตัวละครนี้กำลังมุ่งเน้นการสั่งสมคุณธรรมและศึกษาวิถี"
 tgp_influence_boost_modifier: "มุ่งเน้นอิทธิพล"
 tgp_influence_boost_modifier_desc: "ตัวละครนี้กำลังมุ่งเน้นการสั่งสมอิทธิพลและผลักดันเป้าหมายของตน"
 
 tgp_china_career.0010.t: "เส้นทางแห่งคุณธรรม"
 tgp_china_career.0010.first_rank_desc: "ข้ามีคุณธรรมเพียงพอจนได้รับการ แต่งตั้งยศ [merit_char.Custom('GetMeritRank')] นับเป็นก้าวแรกของข้าสู่เส้นทางอาชีพอันยาวไกลและรุ่งโรจน์ ในที่สุดข้าอาจได้รับการ แต่งตั้งเป็นขุนนาง — เพื่อปกครองดินแดนและนำพาความเจริญรุ่งเรืองมาสู่แผ่นดิน\n\nนี่อาจเป็นโอกาสที่จะได้ตัดสินใจว่าข้าปรารถนาจะเดินในเส้นทางอาชีพใด? ข้าจะไต่เต้าในสายงานข้าราชการพลเรือน? หรือจะสวมบทบาทแม่ทัพ นำกองกำลัง และนำพาสันติสุขมาสู่แผ่นดิน?"
 tgp_china_career.0010.higher_rank_desc: "ความพากเพียรอุตสาหะของข้าได้บังเกิดผลแล้ว ข้าได้รับการ แต่งตั้งยศคุณธรรม [merit_char.Custom('GetMeritRank')]"
 tgp_china_career.0010.higher_rank_unspecific: "\n\n[ROOT.Char.Custom('GetRandomAnnalsPassage')] ได้กลายเป็นสิ่งที่ข้าคุ้นเคยดั่งชื่อของมารดา แต่ยังมีสิ่งอื่นอีกมากที่ข้าต้องกระทำ"
 tgp_china_career.0010.highest_rank: "\n\nตำรับตำรามากมายที่ได้ร่ำเรียน ค่ำคืนที่ต้องโต้รุ่ง การเดินทางส่วนนี้ของข้าได้สิ้นสุดลงแล้ว แต่หนทางยังคงทอดยาวต่อไปไม่สิ้นสุด"
 tgp_china_career.0010.duchy_desc: "\n\nข้าสามารถเริ่มต้นเส้นทางอาชีพของข้าอย่างจริงจัง — ทิ้งตำแหน่งขุนนางระดับล่างไว้เบื้องหลัง และเปิดประตูสู่ตำแหน่งที่สำคัญยิ่งกว่า แน่นอนว่า เมื่อมีตำแหน่งว่าง"
 tgp_china_career.0010.kingdom_desc: "\n\nบัดนี้ข้ามีคุณธรรมเพียงพอที่จะได้รับการ แต่งตั้งให้ไปประจำในมณฑลที่ใหญ่กว่าและสำคัญยิ่งกว่าเดิม"
 tgp_china_career.0010.empire_desc: "\n\nบัดนี้แทบไม่มีอุปสรรคใดขวางทางข้า ข้ามีคุณธรรมเพียงพอที่จะได้เป็นเสนาบดี หากพากเพียรมากพอ บางทีข้าอาจสามารถคว้าตำแหน่งอัครมหาเสนาบดีมาครองได้?"
 tgp_higher_ambitions_modifier: "ความทะเยอทะยานอันสูงส่ง"
 tgp_higher_ambitions_modifier_desc: "ตัวละครนี้ได้ตัดสินใจมุ่งเทความพยายามทั้งหมดในการไต่เต้าบันไดแห่งคุณธรรม"
 tgp_china_career.0010.aa: "ข้ารู้ว่าข้าทำได้ดียิ่งกว่านี้"
 tgp_china_career.0010.a: "ก้าวสำคัญในเส้นทางอาชีพของข้า"
 tgp_china_career.0010.b1: "ตำแหน่งพลเรือนน่าจะเหมาะกับข้ามากกว่า"
 tgp_china_career.0010.b2: "ข้าเป็นข้าราชการพลเรือน และข้าจะยังคงเป็นต่อไป"
 tgp_china_career.0010.c1: "ข้าจะแสวงหาเกียรติยศในสมรภูมิ!"
 tgp_china_career.0010.c2: "การบัญชาการเหล่าทหารในสมรภูมิเป็นดั่งสัญชาตญาณที่สองของข้า"
 keep_civilian_career_desc: "ท่านยังคงดำเนินเส้นทางอาชีพสายพลเรือน - โดยยังคงมีสิทธิ์ใน [GetPlayer.Custom('GetProvincePluralConcept')] สายพลเรือน และ [GetLaw('celestial_appointment_succession_law').GetName]"
 keep_military_career_desc: "ท่านยังคงดำเนินเส้นทางอาชีพสายทหาร - โดยยังคงมีสิทธิ์ใน [GetPlayer.Custom('GetProvincePluralConcept')] สายทหาร และ [GetLaw('celestial_military_appointment_succession_law').GetName]"

 merit_rank_none_gloss: "ไม่มี"
 merit_rank_9_gloss: "[Glossary('ล่าง-ล่าง','MERIT_LOWER_LOWER_GLOSS')]"
 merit_rank_8_gloss: "[Glossary('ล่าง-กลาง','MERIT_LOWER_MIDDLE_GLOSS')]"
 merit_rank_7_gloss: "[Glossary('ล่าง-บน','MERIT_LOWER_UPPER_GLOSS')]"
 merit_rank_6_gloss: "[Glossary('กลาง-ล่าง','MERIT_MIDDLE_LOWER_GLOSS')]"
 merit_rank_5_gloss: "[Glossary('กลาง-กลาง','MERIT_MIDDLE_MIDDLE_GLOSS')]"
 merit_rank_4_gloss: "[Glossary('กลาง-บน','MERIT_MIDDLE_UPPER_GLOSS')]"
 merit_rank_3_gloss: "[Glossary('บน-ล่าง','MERIT_UPPER_LOWER_GLOSS')]"
