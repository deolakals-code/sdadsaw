 tgp_china_career.0030.t: "การจากไปของปราชญ์"
 tgp_china_career.0030.desc: "ผู้อาวุโสของข้า [deceased_elder.GetFirstName] ได้จากโลกนี้ไปแล้ว มีคนบอกข้าว่า [deceased_elder.GetSheHe] [deceased_elder.GetDeathReason] ข้าเริ่มรู้สึกถึงการขาดหายไปของ [deceased_elder.GetHerHis] แล้ว คำถามที่กำลังจะเอ่ยต้องหยุดชะงักเมื่อตระหนักว่าไม่มีใครคอยตอบอีกต่อไป\n\nแต่ความรู้สึกชั่วแล่น เช่นนี้ต้องหลีกทางให้กับภาระทางโลกที่สำคัญกว่า นั่นคือพิธีฝังศพและไว้อาลัย รวมถึงคำถามที่ว่าใครจะมารับช่วงต่อจาก [deceased_elder.Custom('MistressMasterPossessive')|U] และสานงานของ [deceased_elder.GetHerHis] ต่อไป"
 tgp_china_career.0030.a: "การเดินทางของ [deceased_elder.GetFirstNamePossessiveNoTooltip] สิ้นสุดลงแล้ว แต่ของข้าต้องดำเนินต่อไป"
 tgp_china_career.0030.a.tt: "ท่านจะค้นหา [elder|U] คนใหม่ท่ามกลางผู้ยิ่งใหญ่และทรงอิทธิพล"
 tgp_china_career.0030.b: "ส่งความเสียใจและของกำนัลเล็กน้อยเพื่อแสดงความเคารพไปยังญาติของ [deceased_elder.GetHerHis]"
 tgp_china_career.0030.c: "[superior_fellow_disciple.GetFirstNameNoTooltip] คือผู้คู่ควรที่สุดในหมู่พวกเราที่จะสืบทอดงานของ [deceased_elder.Custom('MistressMasterPossessive')|U]"
 tgp_china_career.0030.d: "ข้าจะสืบทอดเจตจำนงของ [deceased_elder.GetHerHis] และสานต่อวิถีของ [deceased_elder.GetHerHis]"
