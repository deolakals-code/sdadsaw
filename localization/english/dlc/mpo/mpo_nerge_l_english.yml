l_english: 
 hunt_type_nerge: "เนอร์เก"
 hunt_type_nerge_desc: "$BULLET$ ล่าสัตว์นับร้อยเพื่อแสดงความชำนาญและความแข็งแกร่ง\n$BULLET$ ได้รับ [legitimacy_i][legitimacy|E], [gold_i][gold|E], [dread_i][dread|E], และ [prestige_i][prestige|E] ขึ้นอยู่กับผลลัพธ์\n$BULLET$ อาจได้รับ [martial_i][martial|E], [command_modifier_i][commander_traits|E], หรือ [trait_level_track_xp|E]\n$hunt_type_nerge_flavor$"
 hunt_type_nerge_flavor: "#weak เนอร์เกคือการล่าครั้งใหญ่ที่สัตว์นับร้อย หากไม่นับพัน จะถูกสังหาร เป็นโอกาสสำหรับ [GetPlayer.GetTitleAsNameNoTooltip] ในการสร้างความประทับใจให้ทั้งข้าหลวงและรัฐบรรณาการด้วยความแข็งแกร่งของ [GetPlayer.GetHerHis]#!"
 activity_window_character_master_of_chase: "จ้าวแห่งการไล่ล่า"
 activity_hunt_conclusion_nerge_desc_failed: "เป็นการล่าที่ล้มเหลว เป็นความอับอายแก่ทุกคนที่เกี่ยวข้อง"
 activity_hunt_conclusion_nerge_desc_standard: "เป็นการล่าที่ประสบความสำเร็จ เป็นที่จดจำไปอีกหนึ่งปี เนื้อนี้จะเพียงพอหล่อเลี้ยงผู้คนของเราไปได้อีกระยะหนึ่ง"
 activity_hunt_conclusion_nerge_desc_excellent: "เป็นการล่าที่ยอดเยี่ยม เป็นที่จดจำไปอีกหลายปี เรานำเนื้อกลับบ้านให้ทุกคน และถึงเวลาแห่งการเฉลิมฉลองแล้ว"
 activity_hunt_location_nerge_recently_visited_tt: "[county|E] สามารถรองรับ [nerge|E] ได้เพียงครั้งเดียวทุกๆ #V 30#! ปี"
