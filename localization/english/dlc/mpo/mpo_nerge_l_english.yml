 ### Events ###
 mpo_nerge.0010.t: "การเริ่มต้นเนอร์เกอันยิ่งใหญ่"
 mpo_nerge.0010.desc.intro: "พลม้าเรียงแถวอยู่เบื้องหลังข้า เป็นทิวแถวยาวเหยียดไปทางซ้ายและขวา พวกเขาทั้งหมดกำลังรอสัญญาณเริ่ม ให้ [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขาเริ่มการล่าครั้งยิ่งใหญ่\n\n"
 mpo_nerge.0010.desc.intro.master_of_hunt: "พลม้าเรียงแถวอยู่เบื้องหลังข้า เป็นทิวแถวยาวเหยียดไปทางซ้ายและขวา "ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า พวกเขาทั้งหมดกำลังรอสัญญาณเริ่ม" [master_of_hunt.GetFirstName] บอกข้า ขณะที่ [master_of_hunt.GetSheHe] เอนตัวเข้ามาใกล้เล็กน้อย "การเตรียมการเสร็จสิ้นแล้ว"\n\n"
 mpo_nerge.0010.desc.outro: "ข้าขึ้นเกาทัณฑ์ ยกคันธนูขึ้น แล้วปล่อยลูกศรออกไป พร้อมกับเสียงร้องอันเจ็บปวด ข้าเห็นแพะอ้วนพีตัวหนึ่งล้มลงดิ้นอยู่บนพื้น เสียงร้องแบะๆ อย่างตื่นตระหนกตามมาขณะความโกลาหลแพร่กระจายไปในหมู่สัตว์ร้าย ตามด้วยเสียงกีบม้ากระทบพื้นเป็นจังหวะขณะที่พลม้าออกล่า"
 mpo_nerge.0010.desc.outro.alt.moh: "ข้าพยักหน้าให้ [master_of_hunt.GetHerHim] และ [master_of_hunt.GetSheHe] ก็ยกคันธนูที่ขึ้นสายแล้วของ [master_of_hunt.GetHerHis] ขึ้น มันส่งเสียงหวีดหวิวขณะที่ [master_of_hunt.GetSheHe] ปล่อยลูกศรออกไป ตามด้วยเสียงร้องของสัตว์ การล่าได้เริ่มขึ้นแล้ว"
 mpo_nerge.0010.desc.outro.alt: "ข้าพยักหน้าให้พลขี่ม้าคนหนึ่งของข้า และ [ROOT.Char.GetSheHe] ก็ยกคันธนูที่ขึ้นสายแล้วของ [ROOT.Char.GetHerHis] ขึ้น มันส่งเสียงหวีดหวิวขณะที่ [ROOT.Char.GetSheHe] ปล่อยลูกศรออกไป ตามด้วยเสียงร้องของสัตว์ การล่าได้เริ่มขึ้นแล้ว"
 mpo_nerge.0010.a: "จงแสดงให้ข้าเห็นถึงความแข็งแกร่งแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"

 mpo_nerge.0015.t: "$mpo_nerge.0010.t$"
 mpo_nerge.0015.desc: "หลังจากรอคอยมานาน ในที่สุดพวกเราทุกคนก็เข้าแถวเรียงกัน หลังจากโต้เถียงกันเล็กน้อย ในที่สุด [host.GetTitledFirstName] ก็ยกคันธนูของ [host.GetHerHis] ขึ้น เพื่อสังหารสัตว์ตัวแรก เสียงร้องอันเจ็บปวดตามมาด้วยเสียงร้องแบะๆ อย่างตื่นตระหนก ขณะที่สัตว์ทั้งหลายแตกตื่น\n\nทันทีที่เราได้ยินเสียงร้อง พลม้าหลายคนก็ออกตัวทันที พวกเขาทั้งหมดพยายามพิสูจน์ตนเอง ต่อตนเอง ต่อกันและกัน และต่อ [host.GetTitleAsNameNoTooltip]"
 mpo_nerge.0015.a: "ถึงกระนั้น ข้าก็จะเป็นนายพรานที่เก่งที่สุดในที่นี้!"

 mpo_nerge.0110.t: "เนอร์เกล้มเหลว"
 mpo_nerge.0110.desc: "แม้จะพยายามอย่างสุดความสามารถ การล่าครั้งนี้ก็น่าหดหู่ใจ สัตว์สองสามตัวล้มลง แต่ก็ไม่ใกล้เคียงกับจำนวนที่เราวางแผนหรือหวังไว้เลย\n\nเพื่อนพลม้าของข้ามองมาที่ข้าด้วยแววตาที่สิ้นหวัง ความอับอายนั้นหนักอึ้งบนบ่าของพวกเขาเท่าๆ กับของข้า เราจะเอาหน้าไปไว้ที่ใดใน [ROOT.Char.GetCapitalLocation.GetName] หลังจากเรื่องนี้?"
 mpo_nerge.0110.a: "ช่างน่าอับอายเสียนี่กระไร..."

 mpo_nerge.0115.t: "เนอร์เกประสบความสำเร็จ"
 mpo_nerge.0115.desc: "เมื่อเราเสร็จสิ้นเนอร์เกในที่สุด เรามองดูสัตว์ที่ถูกสังหารทั้งหมดที่เราล่ามาได้ มันเป็นภาพที่น่าดูชมทีเดียว ขณะที่เราเริ่มคัดแยกและชำแหละสัตว์ก่อนที่พวกมันจะเน่าเสีย\n\nบรรยากาศดีๆ เกิดขึ้นขณะที่เราทำงาน ทุกคนพอใจกับผลลัพธ์ของการล่าครั้งนี้"
 mpo_nerge.0115.a: "เนื้อนี้จะอยู่ได้ตลอดฤดูกาล"

 mpo_nerge.0120.t: "เนอร์เกอันทรงเกียรติ"
 mpo_nerge.0120.desc: "เป็นการล่าที่ประสบความสำเร็จอย่างมาก สัตว์หลายสิบตัวนอนตายแทบเท้าเรา โชคดีที่มีคนมากพอที่จะจัดการพวกมันทั้งหมด เราจึงสามารถชำแหละพวกมันและนำเนื้อส่วนเกินทั้งหมดที่เราได้มากลับบ้านได้\n\nกลิ่นเลือดและเหงื่อคละคลุ้งอยู่ในอากาศ แต่ถึงกระนั้น ทุกคนก็กำลังแบ่งปันเรื่องราวที่ดีที่สุดจากการล่าให้กันและกันอย่างมีความสุข"
 mpo_nerge.0120.a: "เนื้อนี้จะอยู่ได้หลายฤดูกาล"

 mpo_nerge.0125.t: "เนอร์เกอันยิ่งใหญ่"
 mpo_nerge.0125.desc: "การล่าของเราประสบความสำเร็จอย่างใหญ่หลวง และข้าค่อยๆ เดินฝ่ากองซากสัตว์ที่ถูกสังหาร มันเป็นภาพที่น่าประทับใจอย่างแน่นอน และทุกคนก็กำลังยุ่งอยู่กับการชำแหละสัตว์ร้าย\n\nข้าได้ยินนายพรานหลายคนโอ้อวดถึงการล่าของตน แต่ละคนเล่าเรื่องที่เหลือเชื่อยิ่งกว่าคนสุดท้าย แน่นอนว่ามีเนื้อเพียงพอสำหรับงานเลี้ยงอีกมากมายที่จะมาถึง"
 mpo_nerge.0125.a: "ช่างเป็นความสำเร็จอันยิ่งใหญ่!"

 mpo_nerge.0130.t: "เนอร์เกอันยอดเยี่ยม"
 mpo_nerge.0130.desc: "ทะเลเลือดและเนื้อหนังย้อมพื้นดิน และกลิ่นคาวเลือดก็คละคลุ้งอยู่ในอากาศ แม้กระนั้น ก็มี แต่ความรื่นเริงในหมู่นายพรานทุกคนที่กำลังเคลื่อนย้ายซากสัตว์ที่ถูกสังหารอย่างมีความสุข\n\nผู้ติดตามและสมาชิกคนอื่นๆ ในการล่าต่างก็ยุ่งอยู่กับการชำแหละสัตว์ แต่ข้าก็ไม่อาจละสายตาไปจากภาพทั้งหมดนี้ได้ เราจะนำเนื้อทั้งหมดนี้กลับบ้านได้อย่างไร?"
 mpo_nerge.0130.a: "ผู้คนของเราจะจดจำเนอร์เกครั้งนี้"

 mpo_nerge.1000.t: "สัญญาณจาก [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 mpo_nerge.1000.desc: "อินทรีของข้า [ROOT.Char.Custom('EagleStoryName')] บินผ่านกลุ่มล่าของเราเพื่อสอดแนมหาเหยื่อ [ROOT.Char.Custom('EagleStorySheHe')|U] กลับมาเกาะที่แขนของข้า พร้อมกับหนังสัตว์ของ [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')]\n\nของที่ [ROOT.Char.Custom('EagleStorySheHe')|U] เสนอมาอาจนำทางการล่าของเรา หรืออาจเป็นผลมาจากการค้นพบโดยบังเอิญ"
 mpo_nerge.1000.a: "[ROOT.Char.Custom('EagleStoryName')] จงนำทางเราไปยัง [activity.Custom('GetAnimalPlural')]!"
 mpo_nerge.1000.a.tt.success: "การค้นพบของ [ROOT.Char.Custom('EagleStoryNamePossessive')|U] นำไปสู่ [activity.Custom('GetAnimalPlural')] มากขึ้น"
 mpo_nerge.1000.a.tt.failure: "ไม่พบ [activity.Custom('GetAnimalPlural')] เลย"
 mpo_nerge.1000.b: "พลม้าที่เก่งที่สุดของข้าสามารถค้นหา [ROOT.Char.Custom('GetAnimalType')] นี้ได้..."
 mpo_nerge.1000.b.tt.success: "พลม้าพบ [activity.Custom('GetAnimalPlural')] บางส่วน"
 mpo_nerge.1000.c: "เป็นการจับที่ดี แต่ยังมีสิ่งที่ดีกว่านี้ให้ค้นหา"

 mpo_nerge.1005.t: "เสียงแห่งความกังขา"
 mpo_nerge.1005.desc: "สัตว์ป่านับร้อยถูกสังหาร ซากและเลือดของพวกมันย้อมพื้นดิน แต่แม้จะประสบความสำเร็จอย่างเห็นได้ชัด บางคนก็ยังไม่พอใจกับสิ่งที่เราได้มา\n\n"ข้าคิดว่าเรามาเพื่อเป็นประจักษ์พยานแห่งอำนาจเสียอีก" [dissenter.GetFirstName] กล่าว เสียงของ [dissenter.GetHerHis] ดังกว่าเสียงอึกทึกของการล่า "เราต้องทำมากกว่านี้ หากข้ายิงธนูดอกแรก เราคงมีเนื้อพอสำหรับฤดูหนาวนับสิบครั้ง!"\n\n[dissenter.GetFirstNameNoTooltip] มองมาที่ข้า ดวงตาของ [dissenter.GetHerHis] ลุกโชนด้วยแสงอันแรงกล้า "ท่านไม่เห็นด้วยหรือ [ROOT.Char.GetTitleAsNameNoTooltip]?""
 mpo_nerge.1005.a: "ดีมาก ข้าจะแสดงอำนาจให้เจ้าดู"
 mpo_nerge.1005.a.tt: "ท่านนำกลุ่มพลม้าเล็กๆ ออกล่า [activity.Custom('GetAnimalPlural')] เพิ่มเติม"
 mpo_nerge.1005.a.tt.success: "แผนของท่านประสบความสำเร็จ"
 mpo_nerge.1005.a.tt.failure: "พลม้าของท่านจับเหยื่อไม่ได้เลย"
 mpo_nerge.1005.b: "จงพิสูจน์คุณค่าของเจ้า [dissenter.GetFirstNameNoTooltip]!"
 mpo_nerge.1005.b.tt: "[dissenter.GetFirstNameNoTooltip] นำกลุ่มพลม้าเล็กๆ"
 mpo_nerge.1005.c: "เป้าหมายของข้าไม่ใช่การสร้างความประทับใจให้เจ้า"
 mpo_nerge.1005.b.tt.success: "[dissenter.GetFirstNameNoTooltip] จับ [activity.Custom('GetAnimalPlural')] ได้บางส่วน"
 mpo_nerge.1005.b.tt.failure: "[dissenter.GetFirstNameNoTooltip] ทำให้ [dissenter.GetHerHim]self อับอาย"

 mpo_nerge.1010.t: "การทำลายวงล้อม"
 mpo_nerge.1010.desc: "เมื่อนายพรานทุกคนอยู่ในตำแหน่งที่ถูกต้อง พลม้าของเราก็เข้าใกล้วงล้อมฝูง [activity.Custom('GetAnimalPlural')] บางคนสอดแนมสัตว์ร้ายโดยขี่ม้าอยู่ข้างหน้าแถวของเราเล็กน้อย ขณะที่คนอื่นๆ พร้อมที่จะโจมตี\n\nอย่างโง่เขลา [chaser.GetFirstName] วิ่งนำหน้า ทำให้ [activity.Custom('GetAnimalPlural')] บางส่วนแตกกระจาย ความพยายามของ [chaser.GetHerHis|U] ในการต้อนพวกมันกลับมานั้นไร้ผล และสัตว์ร้ายก็พยายามหลบหนีจากเงื้อมมือของเรา"
 mpo_nerge.1010.a: "ปล่อย [chaser.GetHerHim] ให้กับ [activity.Custom('GetAnimalPlural')]!"
 mpo_nerge.1010.a.tt.death: "[chaser.GetFirstNameNoTooltip] ถูก [activity.Custom('GetAnimalPlural')] เหยียบย่ำ"
 mpo_nerge.1010.a.tt.injury: "[chaser.GetFirstNameNoTooltip] ได้รับบาดเจ็บจาก [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1010.b: "รวมกลุ่มใหม่ และเก็บสิ่งที่เหลือจากซากของพวกมัน"
 mpo_nerge.1010.b.tt.success: "ท่านจับ [activity.Custom('GetAnimalPlural')] ที่หลบหนีได้จำนวนมาก"
 mpo_nerge.1010.b.tt.failure: "มี [activity.Custom('GetAnimalPlural')] เหลืออยู่เพียงไม่กี่ตัว"
 mpo_nerge.1010.c: "[chaser.GetSheHe|U] ยังคงเป็นพวกเราคนหนึ่ง ความผิดพลาดนี้เป็นเรื่องของมนุษย์"
 mpo_nerge.1010.c_obedience: "ตราบใดที่ [chaser.GetSheHe] ก้มหัวให้ข้า [chaser.GetSheHe] ก็จะได้รับการอภัย"

 mpo_nerge.1015.t: "ฝูงสัตว์แตกตื่นกลางทุ่งสเตปป์"
 mpo_nerge.1015.desc: ""ท่าน [GetPlayer.GetTitleAsNameNoTooltip]! [activity.Custom('GetAnimalPlural')] แตกออกจากวงล้อมแล้ว!" [hunter_1.GetFirstName] ร้องตะโกน โดยมี [hunter_2.GetFirstName] ตามมาติดๆ\n\nเลยขอบฟ้าไป [activity.Custom('GetAnimalPlural')] หลายสิบตัวพุ่งเข้าใส่พลม้าและค่าย เห็นได้ชัดว่าการล่าผิดพลาดไปแล้ว แต่การล่าถอยไม่ใช่ทางเลือก"
 mpo_nerge.1015.a: "นี่คือโอกาสของเรา สังหารพวกมันให้หมด!"
 mpo_nerge.1015.a.tt.success: "[activity.Custom('GetAnimalPlural')] ถูกเหยียบย่ำ"
 mpo_nerge.1015.a.tt.failure: "สัตว์ร้าย ทำให้พลม้าหลายคนบาดเจ็บ"
 mpo_nerge.1015.b: "ปล่อยให้พวกมันผ่านไป แต่จงเก็บตัวที่ล้าหลัง"
 mpo_nerge.1015.c: "เป็นเรื่องธรรมชาติที่พวกมันจะหลบหนี ปล่อยให้พวกมันกลับสู่ป่า"
 mpo_nerge.1015.d: "[hunter_1.GetFirstNameNoTooltip] และ [hunter_2.GetFirstNameNoTooltip] จะต้องชดใช้ความสูญเสีย"

 mpo_nerge.1020.t: "เหยื่อกระจัดกระจาย"
 mpo_nerge.1020.desc: ""แม้จะเป็นข้อพิสูจน์ที่ชัดเจนถึงความก้าวหน้าของเรา ข้าก็กังวลว่าเราจะปล่อย [activity.Custom('GetAnimalPlural')] ให้รอดชีวิตน้อยเกินไป" [master_of_hunt.GetFirstName] อธิบาย "ข้าไม่ต้องการทิ้งให้ดินแดนนี้แห้งแล้ง"\n\nเราสังหาร [activity.Custom('GetAnimal')] ได้มากพอที่จะเลี้ยงเราไปได้อีกหลายเดือน แต่การล่าเริ่มน่าเบื่อเมื่อจำนวนของพวกมันลดน้อยลง [master_of_hunt.GetFirstNameNoTooltip] ได้สั่งให้พลม้าค้นหากลุ่มที่แยกตัวออกไปมากขึ้น แต่ [activity.Custom('GetAnimalPlural')] ก็เริ่มมีจำนวนน้อยและหายากขึ้น"
 mpo_nerge.1020.a: "เอาเท่าที่เราต้องการ และปล่อยที่เหลือไป"
 mpo_nerge.1020.a.tt: "[activity.Custom('GetAnimalPlural')] บางส่วนถูกปล่อยไว้เพื่อขยายพันธุ์"
 mpo_nerge.1020.b: "การผ่อนปรนคือความอ่อนแอ เราต้องล่า!"
 mpo_nerge.1020.c: "สังเกต [activity.Custom('GetAnimalPlural')] เหล่านี้ — ให้เราหาตัวที่อ่อนแอที่สุด"
 mpo_nerge.1020.c.tt: "ท่านพยายามสังหารเฉพาะ [activity.Custom('GetAnimalPlural')] ที่มีศักยภาพในการอยู่รอดน้อยที่สุด"
 mpo_nerge.1020.c.tt.success: "[activity.Custom('GetAnimalPlural')] ยังคงไม่ได้รับอันตราย"
 mpo_nerge.1020.c.tt.failure: "แทบไม่มี [activity.Custom('GetAnimalPlural')] เหลืออยู่เลย"

 mpo_nerge_overhunting_modifier: "การล่าสัตว์เกินควร"
 mpo_nerge_overhunting_modifier_desc: "เคาน์ตีนี้ถูกล่าสัตว์เกินควร และจะยากขึ้นในการดำรงชีวิตที่นี่"

 mpo_nerge.1025.t: "นายพรานผู้ยิ่งใหญ่ที่สุด"
 mpo_nerge.1025.desc: "[activity.Custom('GetAnimalPlural')] หลายสิบตัวถูกสังหารไปแล้ว และตัวที่ใหญ่ที่สุดก็ล้มลงด้วยลูกธนูที่ไม่ทราบที่มา ก่อนที่ผู้ใดจะตรวจสอบสัตว์ร้ายได้ [hunter_1.GetFirstName] ก็ขี่ม้าออกมาอ้างความรุ่งโรจน์ในการสังหาร [hunter_2.GetFirstName] ตามมา และทั้งสองก็เริ่มทะเลาะกันว่าใครสมควรได้รับเกียรตินี้\n\n"เห็นได้ชัดแจ้งว่าลูกธนูของข้าปักถูกสัตว์ร้าย!" [hunter_1.GetFirstName] อุทาน "เจ้าอยู่ไกลเกินไปที่จะยิงโดนมันด้วยซ้ำ!"\n\n[hunter_2.GetFirstName] เยาะเย้ย ความตึงเครียดระหว่างทั้งสองเพิ่มมากขึ้น และการโต้เถียงของพวกเขาก็เบี่ยงเบนความสนใจไปจากภารกิจที่ทำอยู่..."
 mpo_nerge.1025.a: "ความรุ่งโรจน์ไม่สำคัญ เราทุกคนจะแบ่งปันของที่ได้มา"
 mpo_nerge.1025.a.flavor: "ช่างเป็นอาหารจานหลักที่สมบูรณ์แบบสำหรับงานเลี้ยง!"
 mpo_nerge.1025.a.tt: "หากท่าน #bold ไม่#! จัด [GetActivityType('activity_feast').GetName] ก่อนครบหนึ่งปี ท่านจะสูญเสีย [prestige|E] และ [opinion|E]"
 mpo_nerge.1025.b: "เรื่องนี้ตัดสินได้ง่ายที่สุดด้วยการทดสอบกำลัง"
 mpo_nerge.1025.b.tt: "นายพรานยุติข้อพิพาทด้วยการต่อสู้"
 mpo_nerge.1025.b.tt.hunter_1: "[hunter_1.GetFirstNameNoTooltip] ชนะการต่อสู้"
 mpo_nerge.1025.b.tt.hunter_2: "[hunter_2.GetFirstNameNoTooltip] ชนะการต่อสู้"
 mpo_nerge.1025.c: "เจ้าพวกโง่! ลูกธนูของข้าต่างหากที่ปักถูกสัตว์ร้าย!"
 mpo_nerge.1025.c.tt: "ท่านพยายามอ้างสิทธิ์ในการสังหารเป็นของตนเอง"
 mpo_nerge.1025.c.tt.success: "นายพรานคนอื่นๆ เข้าข้างท่าน"
 mpo_nerge.1025.c.tt.failure: "ไม่มีใครเชื่อคำอ้างของท่าน"
 mpo_nerge.1025.d: "ข้าเห็นเอง [intent_target.GetFirstNameNoTooltip] เป็นผู้สังหารสัตว์ร้าย!"

 mpo_nerge_feast_discount: "เนื้อที่เตรียมไว้"
 mpo_nerge_feast_discount_desc: "ตัวละครนี้ได้เตรียมเนื้อจากการเนอร์เกเมื่อไม่นานมานี้ และสามารถจัดงานเลี้ยงได้ในราคาที่ถูกลง\n[GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName] ค่าใช้จ่าย: -#P 50%#!"

 mpo_nerge_promised_feast_fail: "คำสัญญาที่ผิดนัด"
 mpo_nerge_promised_feast_fail_desc: "ตัวละครนี้เพิ่งให้คำสัญญากับใครบางคน และไม่สามารถรักษาสัญญาได้"

 mpo_nerge.1026.t: "คำสัญญาที่ผิดนัด"
 mpo_nerge.1026.desc: "ข้าเคยสัญญากับเหล่านายพรานว่าจะจัดงานเลี้ยงด้วยของที่ได้จากการเนอร์เกของเรา แต่ในที่สุด เนื้อก็เสียไปโดยเปล่าประโยชน์\n\nการไม่ให้สัญญาเสียยังดีกว่าการผิดสัญญา และเหล่านายพรานก็ไม่พอใจที่ข้าไม่สามารถรักษาสัญญาได้"
 mpo_nerge.1026.a: "..."

 mpo_nerge.1030.t: "ภาพหายาก"
 mpo_nerge.1030.desc: "ห่างจากกลุ่มล่าหลักพอสมควร [master_of_hunt.GetFirstName] บอกข้าถึง [ROOT.Char.Custom('GetRegionalDeerType')] สีขาวสวยงามตัวหนึ่งที่ถูกพบเห็น "มันไม่เหมือนสิ่งใดที่ข้าเคยเห็นมาก่อน" [master_of_hunt.GetSheHe] กล่าว ดวงตาของ [master_of_hunt.GetHerHis] เบิกกว้าง "แต่มันไม่ได้อยู่ตามลำพัง มีตัวเล็กๆ อยู่กับมันด้วย ทั้งหมดขาวราวหิมะ"\n\nข้าเคยล่าหมาป่า กวาง และแมวป่า แต่การสังหารสัตว์ เช่นนี้อาจนำชื่อเสียงอันยิ่งใหญ่มาให้ข้า"
 mpo_nerge.1030.a: "มันจะเป็นของข้า!"
 mpo_nerge.1030.a.tt.success: "[ROOT.Char.Custom('GetRegionalDeerType')] ล้มลงด้วยลูกธนูของท่าน"
 mpo_nerge.1030.a.tt.failure: "[ROOT.Char.Custom('GetRegionalDeerType')] หลบหนีไปได้"
 mpo_nerge.1030.b: "เราควรติดตาม [ROOT.Char.Custom('GetRegionalDeerType')] แต่อย่าทำร้ายมัน"
 mpo_nerge.1030.b.tt.success: "ท่านได้รับข้อมูลเชิงลึกเกี่ยวกับ [ROOT.Char.Custom('GetRegionalDeerType')]"
 mpo_nerge.1030.b.tt.failure: "[ROOT.Char.Custom('GetRegionalDeerType')] หลบหนีไปได้ แต่ยังคงไม่ได้รับอันตราย"
 mpo_nerge.1030.b.tt.effect: "[county.GetName] จะได้รับ [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] ภายใน 2 ปี"
 mpo_nerge.1030.c: "เรามาที่นี่เพื่อล่า ไม่ใช่เพื่อชมวิว"
 mpo_nerge.1030.d: "เหตุใดเจ้าจึงพยายามจะล่อลวงข้า?"

 mpo_nerge.1031.t: "การอนุรักษ์ให้ผลตอบแทน"

 mpo_nerge.1035.t: "กลยุทธ์การไล่ล่า"
 mpo_nerge.1035.desc: "ความตื่นเต้นของการล่าได้สงบลงแล้ว และนายพรานหลายคนกลับไปที่ค่ายเพื่อหารือเกี่ยวกับแผนของตน ขณะที่คนที่เหลือสังเกต [activity.Custom('GetAnimalPlural')] จากระยะไกล\n\n"เราต้องโหดเหี้ยม! ไร้ความปรานี ดังที่เราทำกับศัตรูของเรา!" [hunter_1.GetFirstName] อุทาน [hunter_2.GetFirstName] พยักหน้าเห็นด้วยและเสริมว่า "แต่กำลังพลจะไม่มีความหมายหากเราไม่ร่วมมือกัน" ก่อนที่การโต้เถียงอีกครั้งจะเริ่มขึ้น [hunter_3.GetFirstName] ก็เข้ามาเสนอคำแนะนำของ [hunter_3.GetHerHis] "เราสามารถยึดมั่นในประเพณีได้" [hunter_3.GetFirstNameNoTooltip] ยืนยัน "แต่ต้องมีความอดทน สังเกตสัตว์ ค่อยๆ เข้าใกล้วงล้อมพวกมัน และโจมตีเมื่อพวกมันไม่ทันตั้งตัว"\n\nท่ามกลางการพูดคุยของพวกเขา พวกเขาหันมาหาข้า รอคอยความคิดเห็นของข้า"
 mpo_nerge.1035.a: "โจมตีอย่างหนักหน่วงและรวดเร็ว!"
 mpo_nerge.1035.a.tt: "วิธีนี้ #bold อันตราย#! แต่จะให้ผลลัพธ์ที่ดีกว่า"
 mpo_nerge.1035.b: "แบ่งกลุ่ม และประสานงานกัน"
 mpo_nerge.1035.b.tt: "วิธีนี้จะให้ #bold ผลตอบแทนน้อยกว่า#! แต่จะเพิ่มความคิดเห็นของนายพรานคนอื่นที่มีต่อท่าน หรือแม้กระทั่ง ทำให้พวกเขา [obedient|E]"
 mpo_nerge.1035.c: "ถึงเวลาซุ่มโจมตีแล้ว"
 mpo_nerge.1035.c.tt: "วิธีนี้ค่อนข้าง #bold ปลอดภัย#! แต่จะไม่ให้ผลตอบแทนมากนัก"
 mpo_nerge.1035.d: "ให้คันธนูของเราตัดสินผลลัพธ์"
 mpo_nerge.1035.tt.success: "แผนประสบความสำเร็จ"
 mpo_nerge.1035.tt.failure: "แผนล้มเหลว"

 mpo_nerge_investigation: "การสังเกตการณ์สัตว์"
 mpo_nerge_investigation_desc: "ตัวละครนี้สังเกตการณ์สัตว์ระหว่างการล่า และใช้ความรู้นี้ในการจัดการฝูงสัตว์ของตน"
 
 mpo_nerge.1040.t: "ถูกลืมเลือน"
 mpo_nerge.1040.desc: ""รอเดี๋ยว!" [hunter.GetTitledFirstName] ลงจากหลังม้าของ [hunter.GetHerHis] อย่างกระทันหัน คุกเข่าลงบนพื้น "ข้าคิดว่าข้าเห็น... นี่ไง!"\n\n"คงเป็นของนายพรานที่โชคไม่ดีเท่าไรนัก" [hunter.GetSheHe] พูดอย่างเย้ยหยัน พลางยื่นคันธนูเปื้อนเลือดที่ไม้แตกบิ่น"
 mpo_nerge.1040.a: ""มอบมันให้ [ROOT.Char.GetTitleAsNameNoTooltip] ของเจ้าเสีย""
 mpo_nerge.1040.b: ""หากมันอยู่ในดินแดนของข้า มันก็เป็นของข้า""
 mpo_nerge.1040.c: ""เจ้าเก็บมันไว้ได้""
 mpo_nerge.1040.c.tt: "[hunter.GetShortUIName] เก็บ [newly_created_artifact.GetName] ไว้"
 mpo_nerge.1040.d: ""กลับขึ้นหลังม้าของเจ้าเสีย!""
 
 mpo_nerge.1050.t: "การแสดงแสนยานุภาพ"
 mpo_nerge.1050.desc: ""[ROOT.Char.Custom('GetAnimalTypeMismanaged')] ที่แตกฝูง" [hunter.GetTitledFirstName] ประกาศด้วยเสียงแผ่วเบา "ธนูดอกเดียวเข้าที่หัวใจของมัน และมันก็จะเป็นของเรา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip]"\n\n[hunter_2.GetTitledFirstName] พยักหน้าและง้างคันธนูของ [hunter_2.GetHerHis] รอคำสั่งของข้า"
 mpo_nerge.1050.a: ""[hunter.GetFirstNameNoTooltip] [hunter.Custom('SisterBrother')] ของข้า เราเคลื่อนไหวเป็นหนึ่งเดียว!""
 mpo_nerge.1050.a.tt.success: "สัตว์ร้ายล้มลงแทบเท้าท่าน"
 mpo_nerge.1050.a.tt.failure: "สัตว์ร้ายหลบหนีไปได้"
 mpo_nerge.1050.b: ""ปล่อยให้เป็นหน้าที่ข้าเอง""
 mpo_nerge.1050.b.tt.success: "ท่านสังหารสัตว์ร้าย"
 mpo_nerge.1050.b.tt.failure: "ท่านขายหน้า"
 mpo_nerge.1050.c: ""เล็งให้ดี""
 mpo_nerge.1050.c.tt.success: "สัตว์ร้ายตาย"
 mpo_nerge.1050.c.tt.failure: "สัตว์ร้ายหลบลูกธนูได้"
 mpo_nerge.1050.d: ""อย่าให้มันมา ทำให้เสียสมาธิ!""
 
 mpo_nerge.1060.t: "สิ่งล่อใจอันโอชะ"
 mpo_nerge.1060.desc: ""ดูนั่นสิ!" [hunter.GetTitledFirstName] ชี้ไปยังกลุ่ม [ROOT.Char.Custom('RegionalEdibleAnimalPlural')] ป่า ที่ซ่อนอยู่บนเส้นทางด้านซ้าย "ไปล่าพวกมันกันเถอะ! ท้องข้าร้องด้วยความอยากแล้ว!""
 mpo_nerge.1060.a: ""ข้าไม่เคยเห็นกับดักที่ชัดเจนกว่านี้มาก่อน""
 mpo_nerge.1060.b: ""โอกาสแสดงความชำนาญของข้าแล้ว!""
 mpo_nerge.1060.b.tt.success: "สัตว์ร้ายตายด้วยน้ำมือท่าน"
 mpo_nerge.1060.b.tt.failure: "ท่าน ทำให้ตนเองอับอาย"
 mpo_nerge.1060.c: ""เอามาให้ได้มากที่สุดเท่าที่จะทำได้!""
 mpo_nerge.1060.c.tt.success: "ท่านล่าได้จำนวนที่น่าประทับใจ"
 mpo_nerge.1060.c.tt.failure: "ท่านแทบจะไม่ได้อะไรเลย"
 mpo_nerge.1060.c.tt_feast: "[GetActivityType('activity_feast').GetName] ครั้งต่อไปของท่านจะ #high ฟรี#!"
 mpo_nerge.1060.d: ""ไม่มีประโยชน์ที่จะตามฝูงที่แตกออกมา""
 nerge_evaded_trap_modifier: "หลบหลีกกับดัก"
 nerge_evaded_trap_modifier_desc: "ตัวละครนี้คิดว่าตนเองระบุกับดักได้อย่างถูกต้องระหว่างการเนอร์เก"
 mpo_nerge_1060_free_feast_desc: "เหตุการณ์เนอร์เก"
