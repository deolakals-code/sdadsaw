l_english: 
 mpo_migration_travel_events.0001.t: "ของกำนัล' ของ [ruler.GetFirstNamePossessiveNoTooltip]"
 mpo_migration_travel_events.0001.desc: "[messenger.GetWomanMan] ผู้หนึ่งกำลังต้อนแกะเข้ามาใกล้ กล่าวว่า "คารวะท่าน [ROOT.Char.GetTitledFirstNameNoTooltip]"\n\n"[ruler.GetTitleAsNameNoTooltip] ของข้า [ruler.GetFirstName] และตัวข้า เฝ้ามองฝูงสัตว์ของท่านลดน้อยลงทุกวัน โปรดรับฝูงแกะเล็กๆ นี้เป็นของกำนัลเถิด สิ่งเดียวที่ [ruler.GetTitleAsNameNoTooltip] ขอเป็นการตอบแทนคือความช่วยเหลือเล็กน้อย""
 mpo_migration_travel_events.0001.a: "ข้าขอน้อมรับของกำนัลของ [ruler.GetHerHis] ด้วยความยินดี"
 mpo_migration_travel_events.0001.b: "จงไปบอก [ruler.GetFirstNameNoTooltip] ว่าข้าไม่สนใจ"

 mpo_migration_travel_events.0010.t: "ฝูงสัตว์อันหนักอึ้ง"
 mpo_migration_travel_events.0010.desc: ""ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ท่านมิอาจหาญกล้านำฝูงปศุสัตว์ใหญ่หลวงถึงเพียงนี้ข้ามทุ่งหญ้าสเตปป์ไปได้!" [messenger.GetFirstName] ร้องอุทาน "คนเลี้ยงสัตว์ของเราลำบากมานานแล้ว แน่นอนว่าท่านคงมิต้องการมากถึงเพียงนั้นดอก!"\n\n[messenger.GetFirstNameNoTooltip] ค่อยๆ สงบสติอารมณ์ [messenger.GetHerHis] ลง "ข้าขอวิงวอนให้ท่านโปรดมอบสัตว์บางส่วนของท่านให้แก่ข้าแผ่นดินสักคนหนึ่งเถิด เพียงเพื่อลดความตึงเครียดในฝูงของเรา [vassal_1.GetTitledFirstName] รับใช้ท่านเป็นอย่างดี แต่ [vassal_2.GetTitledFirstName] อาจซาบซึ้งในน้ำใจจากผู้ปกครองคนใหม่ของ [vassal_2.GetHerHis] ก็เป็นได้""
 mpo_migration_travel_events.0010.a: "[vassal_1.GetFirstNameNoTooltip] อาจจะได้ส่วนหนึ่ง เป็นของขวัญอำลา"
 mpo_migration_travel_events.0010.b: "ลงทุนในดินแดนของ [vassal_2.GetFirstNamePossessiveNoTooltip] แทน"
 mpo_migration_travel_events.0010.c: "ทิ้งสัตว์ส่วนเกินไว้เบื้องหลัง"
 mpo_migration_travel_events.0010.d: "นี่คือฝูงสัตว์ของข้า และข้าจะนำมันไปด้วย"
 no_longer_herd_limit_tt: "ท่านมิได้เกินขีดจำกัด [herd|E] ของท่านอีกต่อไป"
 nomad_keep_herd_modifier: "ฝูงสัตว์ที่ซบเซา"
 nomad_keep_herd_modifier_desc: "ฝูงสัตว์ของตัวละครนี้เติบโตจนมีขนาดค่อนข้างใหญ่ และจะประสบปัญหาในการขยายตัวในอัตราเดิม"

 mpo_migration_travel_events.0020.t: "ดินแดนอันแห้งแล้ง"
 mpo_migration_travel_events.0020.desc: "ขณะที่ฝูงสัตว์ของเราเคลื่อนไปข้างหน้า พลสอดแนมก็นำข่าวอันน่ากังวลมาแจ้ง ทุ่งหญ้าใน [target_title.GetNameNoTier] สถานที่ที่เราตั้งใจจะตั้งรกรากนั้นเบาบาง และดินแดนดูเหมือนจะแทบอาศัยอยู่ไม่ได้"
 mpo_migration_travel_events.0020.a: "ถึงกระนั้น [target_title.GetNameNoTierNoTooltip] ก็จะเป็นบ้านของเรา"
 mpo_migration_travel_events.0020.b: "กลับหลังหัน! เรามิอาจอยู่รอดที่นั่นได้!"
 mpo_migration_travel_events.0020.c: "การลดจำนวนของเราอาจช่วยให้เรารอดชีวิตได้"
 mpo_migration_travel_events.0020.d: "ข้า แต่ [ROOT.Char.GetFaith.FertilityGodName] โปรดช่วยเหลือเราด้วยเถิด!"
 mpo_migration_travel_events.0020.d_tt: "ท่านขอให้ [astrologer.GetFirstName] สวดอ้อนวอนขอความอุดมสมบูรณ์"
 mpo_migration_travel_events.0020.win: "คำสวดอ้อนวอนของ [astrologer.GetFirstNamePossessiveNoTooltip] ได้รับการตอบรับแล้ว!"
 mpo_migration_travel_events.0020.lose: "คำพูดของ [astrologer.GetFirstNamePossessiveNoTooltip] พิสูจน์ว่าไร้ผล"

 mpo_migration_travel_events.0030.t: "$travel_danger_prefix$ ภัยพิบัติแก่ฝูงสัตว์"
 mpo_migration_travel_events.0030.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('messenger'))|l] ของข้าขี่ม้าที่อ่อนแอมาหาข้า ใบหน้าของ [messenger.GetHerHis] บิดเบี้ยวด้วยความกังวล\n\n"ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า ฝูงสัตว์ของเราล้มป่วย สัตว์ทั้งหลายกำลังล้มตาย และโรคระบาดก็แพร่กระจายไปทุกวัน โปรดช่วยเราด้วย มิ เช่นนั้นเราจะไม่เหลือสิ่งใดเลย!" [messenger.GetFirstName] อ้อนวอน\n\nขณะที่ข้ารับฟังคำวิงวอนของ [messenger.GetHerHis] ข้าเห็นสัตว์ที่ป่วยอยู่ไกลๆ และมองดูม้าของ [messenger.GetFirstNamePossessiveNoTooltip] ส่งเสียงร้องอย่างผิดปกติ"
 mpo_migration_travel_events.0030.a: "ฆ่าสัตว์ที่ป่วยทิ้งเพื่อป้องกันการแพร่ระบาด"
 mpo_migration_travel_events.0030.b: "บางทีคนเลี้ยงแกะในท้องถิ่นอาจจะรู้จักโรคนี้"
 mpo_migration_travel_events.0030.b_good: "การรักษาของคนเลี้ยงแกะพิสูจน์ว่ามีค่าอย่างยิ่ง"
  mpo_migration_travel_events.0030.b_bad: "การรักษาของคนเลี้ยงแกะแทบจะไม่ช่วยอะไรเลย"
 mpo_migration_travel_events.0030.c: "เราต้องรอให้ธรรมชาติจัดการไปตามครรลอง"
 mpo_migration_travel_events.0030.c_none: "โรคระบาดถูกควบคุมแล้ว"
 mpo_migration_travel_events.0030.c_medium: "โรคระบาดผ่านพ้นไปโดยสูญเสียเพียงเล็กน้อย"
 mpo_migration_travel_events.0030.c_massive: "โรคระบาดทำลายล้างฝูงสัตว์"
 mpo_migration_travel_events.0030.c_major: "ฝูงสัตว์อ่อนแอลงด้วยโรคระบาด"

 nomad_weak_herd_modifier: "ฝูงสัตว์ที่อ่อนแอ"
 nomad_weak_herd_modifier_desc: "ฝูงสัตว์ของตัวละครนี้อ่อนแอลงด้วยโรคภัย"
 nomad_slow_horses_modifier: "อาชาเชื่องช้า"

 mpo_migration_travel_events.0040.t: "แม่น้ำอันเชี่ยวกราก"
 mpo_migration_travel_events.0040.desc: "เสียงน้ำไหลเชี่ยวกราก ทำให้ม้าของข้าตกใจเมื่อเราเข้าใกล้แม่น้ำใกล้ [county.GetNameNoTier] ดูเหมือนว่าระดับน้ำจะสูงเกินกว่าจะข้ามไปได้ และฝูงสัตว์ที่เล็กที่สุดของเราอาจถูกกระแสน้ำพัดพาไป\n\nดูเหมือนจะไม่มีทางอ้อมง่ายๆ และฝูงสัตว์ก็เริ่มกระสับกระส่าย"
 mpo_migration_travel_events.0040.a: "เราจะย่ำข้ามน้ำเหล่านี้ไป!"
 mpo_migration_travel_events.0040.a_tt: "ท่านต้อนฝูงสัตว์ข้ามแม่น้ำ"
 mpo_migration_travel_events.0040.win: "ฝูงสัตว์ข้ามแม่น้ำได้อย่างปลอดภัย"
 mpo_migration_travel_events.0040.lose: "ท่านสูญเสียสัตว์บางส่วนไปกับกระแสน้ำ"
 mpo_migration_travel_events.0040.b: "แพจะพาเราลอยไปสู่ความปลอดภัย"
 mpo_migration_travel_events.0040.b_flavor: "ท่านสร้างแพเพื่อช่วยให้ฝูงสัตว์ข้ามไปได้"
 mpo_migration_travel_events.0040.c: "มีท่าข้ามอยู่ใกล้ๆ หรือไม่?"
 mpo_migration_travel_events.0040.c_christian: "หาก [ROOT.Char.GetFaith.HighGodName] สามารถแยกทะเลได้ แน่นอนว่า [ROOT.Char.GetFaith.HighGodSheHe] ก็ย่อมช่วยให้เราข้ามไปได้"

 mpo_migration_travel_events.0050.t: "รักกลางทุ่งหญ้าสเตปป์"
 mpo_migration_travel_events.0050.desc: "[courtier.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))|l] ของข้า ถูกพบเห็นว่าอยู่ห่างจากฝูงสัตว์บ่อยครั้งกว่าปกติ ขณะที่เราเตรียมตัวจะออกเดินทางไปยังจุดหมายต่อไป [courtier.GetSheHe] ก็เข้ามาใกล้ ดวงตาของ [courtier.GetHerHis] เต็มไปด้วยความปรารถนา\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ข้าได้พบคู่ของข้าที่นี่แล้ว" [courtier.GetFirstNameNoTooltip] สารภาพ "ข้าปรารถนาที่จะออกจากฝูงสัตว์และอยู่กับ [local.GetHerHim] [local.GetFirstName] ของข้า โปรดปล่อยข้าไปเถิด""
 mpo_migration_travel_events.0050.a: "จงไปตามที่ใจเจ้าปรารถนาเถิด [courtier.GetFirstNameNoTooltip]"
 mpo_migration_travel_events.0050.b: "ละทิ้ง [ROOT.Char.GetTitleAsNameNoTooltip] ของเจ้าในนามแห่งรักรึ? ฮ่า!"
 mpo_migration_travel_events.0050.c: "จงหันความรู้สึกของเจ้ามาที่ข้าเถิด [courtier.GetFirstNameNoTooltip]"
 mpo_migration_travel_events.0050.c_tt: "ท่านพยายามจะเกี้ยวพาราสี [courtier.GetFirstNameNoTooltip]"
 mpo_migration_travel_events.0050.win: "[courtier.GetFirstNameNoTooltip] ตกหลุมรักเสน่ห์ของท่าน"
 mpo_migration_travel_events.0050.lose: "[courtier.GetFirstNameNoTooltip] จากไปอยู่ดี"
 mpo_migration_travel_events.0050.d: "เจ้ารักคนอื่นได้อย่างไร!?"

 mpo_migration_travel_events.0060.t: "$travel_danger_prefix$ กีบม้าป่าคลั่ง"
 mpo_migration_travel_events.0060.desc: "ความตื่นตระหนกแพร่กระจายไปทั่วค่าย เมื่อม้าตัวหนึ่งหลุดออกจากเชือกที่ผูกไว้ เกือบจะ ทำให้ [courtier.GetFirstName] ตกจากหลังของมัน มันคลุ้มคลั่งจากการเดินทาง หรืออาจจะถูกยั่วยุ และวิ่งเตลิดไปโดยไม่สนใจผู้ใดที่พยายามจะปลอบมัน\n\n[courtier.GetFirstNameNoTooltip] กรีดร้องเมื่อ [courtier.GetSheHe] ตระหนักว่า [courtier.GetSheHe] ไม่สามารถควบคุมสัตว์ร้ายได้อีกต่อไป และใกล้จะหลุดออกจากหลังม้าทุกขณะที่มันดีดตัว"
 mpo_migration_travel_events.0060.a: "จัดการมันเสียเร็วเข้า!"
 mpo_migration_travel_events.0060.a_tt: "ท่านสละม้าเพื่อช่วย [courtier.GetFirstNameNoTooltip] และคนอื่นๆ"
 mpo_migration_travel_events.0060.a_bad: "ม้าตาย"
 mpo_migration_travel_events.0060.a_bad_tt: "@death_icon!#n ข้าราชบริพารคนหนึ่งตาย#!"
 mpo_migration_travel_events.0060.win: "ม้าสงบลงโดยไม่มีเหตุการณ์ใดๆ เพิ่มเติม"
 mpo_migration_travel_events.0060.b: "ข้าจัดการเรื่องนี้ได้ ถอยไป!"
 mpo_migration_travel_events.0060.tt: "ท่านพยายามจะปลอบม้า"
 mpo_migration_travel_events.0060.lose: "ม้าพุ่งเข้าใส่"
 mpo_migration_travel_events.0060.c: "หวังว่า [courtier.GetFirstNameNoTooltip] จะเป็นผู้เคราะห์ร้ายเพียงคนเดียว..."
 mpo_migration_travel_events.0060.herd: "ม้าเหยียบย่ำฝูงสัตว์บางส่วน"
 mpo_migration_travel_events.0060.people: "ม้าเหยียบย่ำผู้ติดตามมากขึ้น"
 mpo_migration_travel_events.0060.people_tt: "#n อาจมีผู้ติดตามอีกสองสามคนตกเป็นเหยื่อของม้า#!"
