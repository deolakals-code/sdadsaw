 mpo_interactions_events.0006.t: "โลหิตแห่งโลหิตของข้า"
 mpo_interactions_events.0006.desc_intro: "[blood_bro.GetFirstName] กรีดลงบนเนื้อหนังที่มือของ [blood_bro.GetHerHis] กล่าวว่า: "เมื่อเรา""
 mpo_interactions_events.0006.desc_anda: "กลายเป็น [Glossary( 'อันด้า', 'ANDA_GLOSS' )]"
 mpo_interactions_events.0006.desc_no_anda: "กล่าวคำเหล่านี้"
 mpo_interactions_events.0006.desc: "ชีวิตของพวกเราจักเป็นหนึ่งเดียว! [ROOT.Char.Custom('SisterBrother')|U] — ข้าขอปฏิญาณว่าจะรักท่านตลอดไป และจะปกป้องท่านอย่างดี"\n\nข้ากล่าวคำสัตย์ปฏิญาณเดียวกัน ทำแผล และผูกพันโลหิตของข้ากับ [blood_bro.Custom('SisterBrother')] ใหม่ของข้า\n\nเมื่อพันธสัญญาของเราผนึกแน่นแล้ว เราแลกเปลี่ยนของขวัญอันล้ำค่า กินอาหารอย่างดี และใช้ขนสัตว์ผืนเดียวกันเพื่อนอนหลับในค่ำคืนนั้น เราฝันถึง"
 mpo_interactions_events.0006.desc_shared_foe: "ความวิบัติแก่ศัตรูของเรา ความโศกเศร้าและการทำลายล้างสำหรับ [shared_foe.GetTitledFirstName]!"
 mpo_interactions_events.0006.desc_memories: "วันคืนอันสดใสในอดีต"
