mpo_interactions_events.0030.desc: "จงสาบานว่าจะให้เกียรติวิถีแห่ง [confederation.GetName] จงสาบานว่าจะต่อสู้เพื่อพวกเราจนกว่าร่างกายของท่านจะแตกสลาย จนกว่านักรบของท่านจะเหลือเพียงกระดูกและเถ้าถ่าน\n\nจงให้คำสัตย์ปฏิญาณของท่าน แล้วเราจะปกป้องกันและกันจากความชั่วร้ายของโลกนี้"
mpo_interactions_events.0030.a: "เมื่อท่านเรียกหา ข้าจะเป็นผู้พิทักษ์ของท่าน"
