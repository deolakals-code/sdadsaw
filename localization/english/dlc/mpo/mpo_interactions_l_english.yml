 mpo_interactions_events.0002.t: "[confederation.GetName]"
 mpo_interactions_events.0002.desc: "ด้วยเหล่า [other_confederate.GetCulture.GetCollectiveNoun] ของ [other_confederate.GetTitledFirstNamePossessive] และเหล่านักรบแห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] รายล้อมพวกเรา พวกเราผสมโลหิตและให้คำสัตย์ปฏิญาณแห่งสมาพันธรัฐ\n\n"พวกเราจะมากมายนัก [other_confederate.Custom('SisterBrother')] เฝ้ามองดินแดนเหล่านี้!" [other_confederate.GetFirstNameNoTooltip] ร้องประกาศพลางกอดข้าอย่างแนบแน่น "สู้ประดุจหมาป่าในฝูงเดียวกัน หนึ่งเดียวมิได้ดีกว่า—มิได้หิวกระหายกว่า—หมู่เหล่าใดๆ!"\n\n"
 mpo_interactions_events.0002.desc_new: "[new_confederation.GetName] ได้ถือกำเนิดขึ้นแล้ว"
 mpo_interactions_events.0002.desc_joining: "และ ดังนั้น ข้าจึงเข้าร่วม [confederation.GetName] คำสัตย์ของข้าเป็นของหมาป่าทุกตัวในฝูง"
 mpo_interactions_events.0002.a: "อยู่หรือตาย เคียงข้างกัน!"

