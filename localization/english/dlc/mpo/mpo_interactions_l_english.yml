 BLOOD_BROTHER_COMMON_ENEMY: "ศัตรูร่วมกันรวมเราเป็นหนึ่ง"
 BLOOD_BROTHER_COMMON_ENEMY_TRIGGER: "เพื่อให้มีศัตรูร่วมกัน ท่านและผู้รับ แต่ละคนต้องเป็นไปตามเงื่อนไขข้อใดข้อหนึ่งเหล่านี้:\n $EFFECT_LIST_BULLET$ศัตรูเป็นคู่ปรับ\n$EFFECT_LIST_BULLET$ ศัตรูเป็นศัตรูหลักในสงคราม\n$EFFECT_LIST_BULLET$ ศัตรูอยู่ในกลุ่มที่เป็นปฏิปักษ์\n$EFFECT_LIST_BULLET$ ศัตรูเป็นเป้าหมายของกลุ่มของท่าน\n$EFFECT_LIST_BULLET$ ตระกูลของศัตรูมีความขัดแย้งกับตระกูลของท่าน\n$EFFECT_LIST_BULLET$ ท่านมีสิทธิเรียกร้องในบรรดาศักดิ์ของศัตรู (ที่พี่น้องร่วมสายเลือดของท่านไม่ได้อ้างสิทธิ์ด้วย)\n$EFFECT_LIST_BULLET$ ศัตรูมีสิทธิเรียกร้องในบรรดาศักดิ์ของท่าน (ที่พี่น้องร่วมสายเลือดของท่านไม่ได้อ้างสิทธิ์ด้วย)"
