 BLOOD_BROTHER_MEMORIES: "อดีตร่วมกันผูกพันเราไว้"
 BLOOD_BROTHER_MEMORY_TRIGGER: "ท่านและผู้รับต้องเป็นบุคคลสำคัญในความทรงจำที่มีความหมายของกันและกัน"
