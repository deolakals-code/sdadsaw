 blood_brother_warrior_modifier: "พี่น้องร่วมสายเลือดนักรบ"
 blood_brother_warrior_modifier_desc: "นักรบผู้น่าเกรงขามยืนหยัดเคียงข้างตัวละครนี้ในฐานะญาติร่วมสาบาน"
 blood_brother_clever_nomadic_modifier: "$blood_brother_clever_modifier$"
