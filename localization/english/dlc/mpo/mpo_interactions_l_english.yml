 mpo_interactions_events.0101.desc_intro: "[recipient.GetName] ดูเบื่อหน่ายหลังจากจ้องมองยุทธวิธีทางทหารบนแผนที่เป็นเวลาหลายชั่วโมงแล้ว ข้าลุกขึ้นและโยนดาบซ้อมให้ [recipient.GetHerHim] พร้อมตะโกนว่า:\n\n"ออกไปข้างนอกกันเถอะ ใครโจมตีโดนลำตัวก่อนเป็นผู้ชนะ!"\n\n"
 mpo_interactions_events.0101.logistician: "ข้าดึงดาบฝึกซ้อมออกมา พร้อมที่จะสู้ [recipient.GetFirstNameNoTooltip] คว้าดาบของ [recipient.GetHersHis] และเริ่มลงมือทันที โจมตีอย่างดุเดือด แต่แม่นยำ เราสู้กันเป็นเวลานาน แต่ไม่มีผู้ชนะที่ชัดเจน ความเหนื่อยล้าเข้าครอบงำเราทั้งคู่\n\n"พักกันเถอะ พรุ่งนี้ค่อยมาต่อกันใหม่""
 mpo_interactions_events.0101.desc_logistician: "$mpo_interactions_events.0101.logistician$ ข้าเริ่มพัก แต่ [recipient.GetSheHe|U] กลับอารมณ์เสียและล้วงเข้าไปในถุงของ [recipient.GetHersHis]\n\n"ไม่ เราสู้ต่อได้!" อุทานพลางยื่น [recipient.Custom('GetLocalStreetFood')] ชิ้นหนึ่งให้ข้า"
 mpo_interactions_events.0101.military_engineer: "เราแลกหมัดกันอย่างสูสี แต่ไม่มีใครโดนเป้าหมาย ในที่สุด [recipient.GetFirstNameNoTooltip] ก็สร้างระยะห่างระหว่างเรามากขึ้นและล้มลงกับพื้น\n\n"เจ้าบาดเจ็บหรือ?" ข้าเริ่มกังวล"
 mpo_interactions_events.0101.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$ แต่แล้วก้อนหินก้อนหนึ่งก็เหวี่ยงผ่านศีรษะข้าไป\n\n"เกือบโดนแล้ว!" [recipient.GetSheHe|U] ตะโกนขณะกำลังบรรจุกระสุนหนังสติ๊กอันเล็ก"
 mpo_interactions_events.0101.aggressive_attacker: "ข้าพุ่งเข้าใส่ [recipient.GetHerHim] ทันทีและฟันดาบของ [recipient.GetHerHis] อย่างไม่หยุดยั้ง\n\n"จำไว้ว่าในสนามรบ มีเพียงเจ้าหรือพวกเขาเท่านั้น จงใช้กำลังทั้งหมดที่มี แล้วก็เพิ่มเข้าไปอีก!""
 mpo_interactions_events.0101.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\nก่อนที่ข้าจะพูดจบประโยค [recipient.GetFirstNameNoTooltip] ก็กระโจนเข้าใส่ข้า การโจมตีอันหนักหน่วงของ [recipient.GetHerHis|U] ทำให้เศษไม้กระเด็น ดาบของข้าหัก เมื่อไม่มีอะไรเหลือให้ป้องกัน ข้าจึงต้องยอมแพ้"
 mpo_interactions_events.0101.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] ไม่หวั่นไหว การโจมตี แต่ละครั้งถูกปัดป้องหรือป้องกัน ข้าเข้าไม่ถึงตัว [recipient.GetHerHim] เลย"
 mpo_interactions_events.0101.forder: "เราลงไปที่แม่น้ำเพื่อเริ่มการประลอง หลังจากฟันดาบกันสองสามครั้ง ข้าก็ถูกผลักตกน้ำ ข้ากระโดดข้ามเนินดินเล็กๆ สองสามแห่งเพื่อหาที่ยืนที่มั่นคง"
 mpo_interactions_events.0101.desc_forder: "$mpo_interactions_events.0101.forder$\n\n"เจ้าชักช้าเกินไปแล้ว, เจ้าเฒ่า [ROOT.Char.GetWomanMan]!" [recipient.GetFirstNameNoTooltip] ปรากฏกายเบื้องหน้าข้าและฟาดข้าตกลงไปในน้ำ"
 mpo_interactions_events.0101.flexible_leader: ""ขยับเท้า รักษาท่าทาง มองหาช่องโหว่ อย่าเสียสมาธิ!" ข้าพุ่งไปข้างหน้าหวังจะจับ [recipient.GetHerHim] ในขณะที่สับสนกับคำพูดพล่ามของข้า"
 mpo_interactions_events.0101.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ อย่างไรก็ตาม [recipient.GetFirstNameNoTooltip] หลบได้และสวนกลับข้า จบการประลองก่อนที่มันจะเริ่มขึ้นเสียอีก"
 mpo_interactions_events.0101.desert_warrior: "เราเดินวนรอบกัน รอหาช่องโหว่ เมื่อข้าเห็นช่อง ข้าก็โจมตีทันที [recipient.GetFirstNameNoTooltip] รอจนถึงวินาทีสุดท้ายจึงโยนกำมือของ"
 mpo_interactions_events.0101.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ ทรายเข้าใส่หน้าข้า ทำให้ข้ามองไม่เห็น ข้าพลาด และเปิดช่องให้ [recipient.GetHerHim] ชนะการประลอง"
 mpo_interactions_events.0101.jungle_stalker: "[recipient.GetFirstNameNoTooltip] วิ่งออกไปก่อน ซ่อนตัวอยู่ในป่า ข้าพยายามหา [recipient.GetHerHim] แต่ยิ่งลึกเข้าไป ป่าก็ยิ่งมืดและหนาทึบขึ้น"
 mpo_interactions_events.0101.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n"ข้าจับเจ้าได้แล้ว!" [recipient.GetFirstNameNoTooltip] กระโดดลงมาจากต้นไม้ต้นหนึ่ง จับข้าได้โดยไม่ทันตั้งตัวและชนะการประลอง"
 mpo_interactions_events.0101.reaver: "เป็นการอุ่นเครื่อง เราแลกหมัดกันอย่างรวดเร็วสองสามครั้ง"
 mpo_interactions_events.0101.desc_reaver: "$mpo_interactions_events.0101.reaver$ [recipient.GetFirstNameNoTooltip] ดึงข้าเข้ากอดรัด เราปล้ำกัน จนกระทั่ง [recipient.GetSheHe] ถอยกลับไปทันที\n\n"ข้าเชื่อว่านี่เป็นของท่าน?" [recipient.GetSheHe|U] ยิ้มเยาะขณะลองสวมแหวน #EMP ของข้า#!"
 mpo_interactions_events.0101.reckless: "เราเริ่มต่อสู้กันทันที เหวี่ยง พลาด; แทง หลบ; เตะ โดน! [recipient.GetFirstNameNoTooltip] ตกลงไปในแม่น้ำ [recipient.GetSheHe|U] สลัดน้ำออกแล้วตะโกนว่า:\n\n"ข้าเกลียดเจ้า!" แล้วพยายามพุ่งเข้าใส่ข้า\n\n"ไม่ อย่าทำอย่างนั้น!""
 mpo_interactions_events.0101.desc_reckless: "$mpo_interactions_events.0101.reckless$ ข้าพยายามหลบ แต่ข้าประเมินความเร็วของ [recipient.GetHerHis] ต่ำไป [recipient.GetSheHe] พุ่งหัวชนข้า"
 mpo_interactions_events.0101.holy_warrior: "ก่อนเริ่มการต่อสู้ ข้าสวดอ้อนวอน:\n\n"ข้า แต่ [ROOT.Char.GetFaith.WarGodName]! โปรดนำทางมือของข้าพเจ้า เพื่อให้การโจมตีของข้าพเจ้ารวดเร็วและรุนแรง""
 mpo_interactions_events.0101.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n"โปรดประทานความแข็งแกร่งให้ข้าพเจ้าเพื่อเมตตาต่อศัตรูของข้าพเจ้า!" [recipient.GetFirstNameNoTooltip] กล่าวจบและตั้งท่าอย่างสง่างาม"
 mpo_interactions_events.0101.terrain_expert: "เราเข้าไปในป่าละเมาะใกล้ๆ การต่อสู้ยืดเยื้ออยู่ครู่หนึ่ง เพราะเราไม่สามารถเข้าถึงกันได้ระหว่างกิ่งไม้ ในที่สุด"
 mpo_interactions_events.0101.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] สังเกตเห็นที่โล่งด้านหลังข้า\n\n"ตอนนี้ ข้าจับเจ้าได้แล้ว!" [recipient.GetSheHe|U] อุทานและผลักข้าเข้าไปในที่โล่ง ด้วยพื้นที่กว้างขวาง การเคลื่อนไหวของ [recipient.GetHerHis] จึงรวดเร็วและคาดเดาไม่ได้ [recipient.GetSheHe|U] โจมตีข้าได้อย่างง่ายดาย"
 mpo_interactions_events.0101.rough_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$"
 mpo_interactions_events.0101.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] สังเกตเห็นพื้นที่ขรุขระด้านหลังข้า\n\n"ตอนนี้ ข้าจับเจ้าได้แล้ว!" [recipient.GetSheHe|U] อุทานและผลักข้าเข้าไปในโขดหิน ภายในเนินหิน การเคลื่อนไหวของ [recipient.GetHerHis] จึงรวดเร็วและคาดเดาไม่ได้ [recipient.GetSheHe|U] โจมตีข้าได้อย่างง่ายดาย"
 mpo_interactions_events.0101.forest_fighter: "$mpo_interactions_events.0101.terrain_expert$ [recipient.GetFirstNameNoTooltip] ปีนขึ้นไปบนต้นไม้ต้นหนึ่ง\n\n"รับนี่ไป!" [recipient.GetSheHe|U] หักกิ่งไม้แล้วโยนใส่ข้า ข้าหลบ แต่ก็สายไปเสียแล้ว ข้ารู้สึกได้ถึงดาบของ [recipient.GetHerHis] ที่ฟันโดนขาข้า"
 mpo_interactions_events.0101.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$"
 mpo_interactions_events.0101.desc_cautious_leader: "ข้าลองเหวี่ยงดาบ ก้าวเท้า และแทงสองสามครั้ง [recipient.GetFirstNameNoTooltip] ไม่มีช่องโหว่ ข้ากระทืบเท้าและตะโกน พยายามข่มขู่ [recipient.GetHerHim] [recipient.GetSheHe|U] ยังคงตั้งรับไม่ว่าอะไรจะเกิดขึ้น\n\n"พอได้แล้ว!" ข้าหมดความอดทนและพุ่งเข้าใส่ [recipient.GetHerHim] แต่นั่นคือช่วงเวลาที่ [recipient.GetSheHe] รอคอย! เมื่อสังเกตเห็นช่องโหว่ [recipient.GetSheHe] ก็โจมตีข้า ชนะการประลอง"
 mpo_interactions_events.0101.organizer: "เราคว้าดาบฝึกซ้อมแล้วเริ่มสู้กัน เป็นเวลาหลายชั่วโมง"
 mpo_interactions_events.0101.desc_organizer: "$mpo_interactions_events.0101.organizer$ ข้าเริ่มเหนื่อย แต่การเคลื่อนไหวของ [recipient.GetHerHis] ยังคงรวดเร็วและแม่นยำ ข้าตามไม่ทันอีกต่อไป ด้วยลมหายใจเฮือกสุดท้าย ข้าพยายามแทง แต่ [recipient.GetSheHe] ปัดออกและสวนกลับราวกับว่าเราเพิ่งเริ่มฝึกซ้อม ข้ายอมแพ้"
 mpo_interactions_events.0101.winter_soldier: "$mpo_interactions_events.0101.desert_warrior$"
 mpo_interactions_events.0101.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ หิมะเข้าใส่หน้าข้า เมื่อเสียสมาธิ ข้าจึงเปิดช่องให้ [recipient.GetHerHim] โจมตีและชนะการประลอง"
 mpo_interactions_events.0101.a: ""วันหนึ่งเจ้าจะเป็นผู้บัญชาการที่ยิ่งใหญ่!""
 mpo_interactions_events.0101.a.flavor: "[recipient.GetFirstNameNoTooltip] ดูเหมือนจะเข้าใจแก่นแท้ของจิตวิญญาณ [target_trait.GetNameNoTooltip(GetPlayer)] แล้ว"
 mpo_interactions_events.0102.t: "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — ล้มเหลว"
 mpo_interactions_events.0102.desc_intro: "$mpo_interactions_events.0101.desc_intro$"
 mpo_interactions_events.0102.desc_logistician: "$mpo_interactions_events.0101.logistician$ [recipient.GetSheHe|U] เริ่มพัก แต่ข้าล้วงเข้าไปในถุงของข้าแล้วยื่น [ROOT.Char.Custom('GetLocalStreetFood')] ชิ้นหนึ่งให้ [recipient.GetHerHim]\n\n"ไม่ เราสู้ต่อได้!""
 mpo_interactions_events.0102.desc_military_engineer: "$mpo_interactions_events.0101.military_engineer$ ขณะที่ข้าได้ยินเสียงครางเบาๆ\n\n"ข้าอยากจะยิงหนังสติ๊กใส่ท่าน แต่-แต่..." [recipient.GetSheHe|U] ร้องไห้ออกมาแล้วชูนิ้วของ [recipient.GetHerHis] ที่พันกันยุ่งกับหนังสติ๊ก"
 mpo_interactions_events.0102.desc_aggressive_attacker: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] เริ่มกวัดแกว่งดาบไปมาเบื้องหน้า [recipient.GetHerHim] แล้ววิ่งเข้าใส่ข้าทั้งที่ยังหลับดวงตาของ [recipient.GetHerHis] อยู่ ข้าวิ่งผ่าน [recipient.GetHerHim] ไปแล้วฟันเข้าครั้งหนึ่ง"
 mpo_interactions_events.0102.desc_unyielding_defender: "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] แตกพ่ายหลังจากโดนโจมตีอีกเพียงสองสามครั้ง [recipient.GetSheHe|U] ทิ้งดาบแล้วเปิดช่องให้ข้าฟันอย่างแรง ข้าแทบจะไม่สามารถ #EMP ไม่#! ฟันเต็มแรงได้"
 mpo_interactions_events.0102.desc_forder: "$mpo_interactions_events.0101.forder$ [recipient.GetFirstNameNoTooltip] พยายามจะจับข้า แต่ก้อนหินลื่นเกินไป [recipient.GetSheHe|U] ล้มลงตรงหน้าเท้าข้าพอดี ข้าจึงฟัน [recipient.GetHerHim] ได้อย่างง่ายดาย!"
 mpo_interactions_events.0102.desc_flexible_leader: "$mpo_interactions_events.0101.flexible_leader$ [recipient.GetSheHe|U] ยังไม่ทันได้เตรียมปัดป้อง ข้าก็ฟันโดนอย่างง่ายดาย"
 mpo_interactions_events.0102.desc_desert_warrior: "$mpo_interactions_events.0101.desert_warrior$ ทราย แต่ข้าใช้โล่ปัดกลับไปที่ [recipient.GetHerHim] เมื่อมองไม่เห็น [recipient.GetSheHe] ก็ป้องกันตัวไม่ได้ ข้าฟันและชนะอย่างง่ายดาย"
 mpo_interactions_events.0102.desc_jungle_stalker: "$mpo_interactions_events.0101.jungle_stalker$\n\n"อ๊า! งู!" [recipient.GetFirstNameNoTooltip] ตกจากต้นไม้ต้นหนึ่ง กลิ้งลงมาที่เท้าข้าพอดี ทำให้ข้าชนะอย่างง่ายดาย"
 mpo_interactions_events.0102.desc_reaver: "$mpo_interactions_events.0101.reaver$ ข้าดึง [recipient.GetFirstNameNoTooltip] เข้ากอดรัด เราปล้ำกัน จนกระทั่งข้าสามารถถอดแหวนออกจากนิ้วของ [recipient.GetHerHis] ได้\n\n"เจ้าต้องระวังให้ดี เพราะครั้งต่อไปอาจจะเป็นมือทั้งข้างของเจ้าก็ได้!""
 mpo_interactions_events.0102.desc_reckless: "$mpo_interactions_events.0101.reckless$ ข้าหลบ ทำให้ [recipient.GetHerHim] เสียหลัก [recipient.GetSheHe|U] ลื่นล้มลงอีกครั้ง"
 mpo_interactions_events.0102.desc_holy_warrior: "$mpo_interactions_events.0101.holy_warrior$\n\n"พูดน้อยลง สู้ให้มากขึ้น!" [recipient.GetFirstNameNoTooltip] ขัดจังหวะแล้วโจมตีข้า\n\n"[ROOT.Char.GetFaith.HighGodName] โปรดอภัยให้ข้าด้วย!" ข้ากระซิบแล้วฟัน [recipient.GetFirstNameNoTooltip] สลบในดาบเดียว"
 mpo_interactions_events.0102.desc_open_terrain_expert: "$mpo_interactions_events.0101.terrain_expert$\n\nข้าสังเกตเห็นที่โล่งด้านหลัง [recipient.GetFirstNameNoTooltip]\n\nข้าผลัก [recipient.GetHerHim] ออกไปยังที่โล่ง ด้วยความได้เปรียบจากทุ่งกว้างราบเรียบ การเคลื่อนไหวของข้ารวดเร็วและคาดเดาไม่ได้ [recipient.GetSheHe|U] ไม่มีที่ให้หลบซ่อน และข้าก็โจมตีโดนอย่างง่ายดาย"
 mpo_interactions_events.0102.desc_rough_terrain_expert: "$mpo_interactions_events.0101.rough_terrain_expert$\n\nข้าสังเกตเห็นพื้นที่ขรุขระด้านหลัง [recipient.GetFirstNameNoTooltip]\n\nข้าผลัก [recipient.GetHerHim] เข้าไปในเนินหิน ด้วยความได้เปรียบจากพื้นที่ขรุขระ การเคลื่อนไหวของข้าจึงรวดเร็วและคาดเดาไม่ได้ [recipient.GetSheHe|U] ไม่มีที่ซ่อนและข้าก็ฟันโดนอย่างง่ายดาย"
 mpo_interactions_events.0102.desc_forest_fighter: "$mpo_interactions_events.0101.forest_fighter$ ข้าปีนขึ้นไปบนต้นไม้ต้นหนึ่ง\n\n"รับนี่ไป!" ข้าตะโกนขณะหักกิ่งไม้แล้วโยนใส่ [recipient.GetHerHim] [recipient.GetSheHe|U] หลบได้ แต่ก็สายไปเสียแล้ว ข้าพุ่งตามไปติดๆ แล้วฟันโดนลำตัวของ [recipient.GetHerHis] อย่างง่ายดาย"
 mpo_interactions_events.0102.desc_cautious_leader: "[recipient.GetSheHe|U] ลองเหวี่ยงดาบหลายครั้ง ย่างสามขุม และแทงออกไป ข้ามิเปิดช่องว่างใดๆ [recipient.GetSheHe|U] กระทืบเท้าและตะโกน พยายามข่มขู่ข้า แต่ข้ามิได้หวั่นไหว\n\n"พอเสียที!" [recipient.GetSheHe|U] สิ้นความอดทนของ [recipient.GetHerHis] แล้วพุ่งเข้าใส่ข้า แต่นี่คือจังหวะที่ข้ารอคอย! เมื่อเห็นช่องว่าง ข้าจึงฟาดฟัน ชนะการประลอง"
 mpo_interactions_events.0102.desc_organizer: "$mpo_interactions_events.0101.organizer$ ข้าสังเกตเห็น [recipient.GetHerHis] หายใจหอบ การเคลื่อนไหวช้าลง และการโจมตีพลาดเป้า [recipient.GetSheHe|U] ตามไม่ทันอีกต่อไป ด้วยลมหายใจเฮือกสุดท้าย [recipient.GetSheHe] พยายามแทง แต่ข้าเพียงแค่หลบออกไป [recipient.GetSheHe|U] ล้มลง เพราะความเหนื่อยล้า"
 mpo_interactions_events.0102.desc_winter_soldier: "$mpo_interactions_events.0101.winter_soldier$ หิมะ แต่ข้าหลบได้ ทำให้ [recipient.GetHerHim] ป้องกันตัวไม่ได้ ข้าฟันและชนะอย่างง่ายดาย"
 mpo_interactions_events.0102.a: ""บางทีคราวหน้า""
 mpo_interactions_events.0102.a.flavor: "การฝึกซ้อมของท่านพิสูจน์ว่ายังมีหนทางอีกยาวไกลรอ [recipient.GetFirstNameNoTooltip] อยู่"
 mpo_interactions_events.0102.b: ""เราจะฝึกซ้อมซ้ำจนกว่าเจ้าจะชนะ!"
 mpo_interactions_events.0102.b.flavor: "ด้วย #EMP ความพากเพียร#! ที่เพียงพอ [recipient.GetFirstNameNoTooltip] สามารถบรรลุทุกสิ่งที่ท่านตั้งเป้าไว้ให้ [recipient.GetHerHim] ได้"

