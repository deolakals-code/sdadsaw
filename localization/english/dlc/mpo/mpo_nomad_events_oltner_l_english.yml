l_english: 
 nomad_events_oltner.0001.t: "ร่องรอยสดใหม่"
 nomad_events_oltner.0001.desc: "มีสัตว์ป่ามากมายในดินแดนของข้า เหล่านายพรานบอกข้าถึง [sighting_county_1.Custom('GetAnimalGroup')] ของ [sighting_county_1.Custom('GetAnimalPlural')] ใน [sighting_province_1.Custom('GetTerrainTypePlural')] แห่ง [sighting_county_1.GetBaseNameNoTier] และ [sighting_county_2.Custom('GetAnimalType')] ที่ [sighting_county_2.Custom('GetAnimalAdjective')] เป็นพิเศษ ซึ่งซ่อนตัวอยู่ใน [sighting_province_2.Custom('GetTerrainType')] แห่ง [sighting_county_2.GetBaseNameNoTier]\n\nในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] ข้าควรเลือกไล่ล่าสักอย่างหนึ่ง"
 nomad_events_oltner.0001.a: "คืนนี้เราจะกินเลี้ยงด้วย [sighting_county_1.Custom('GetAnimalType')]"
 nomad_events_oltner.0001.b: "การสังหาร [sighting_county_2.Custom('GetAnimalType')] ที่ [sighting_county_2.Custom('GetAnimalAdjective')] จะพิสูจน์คุณค่าของข้า"
 nomad_events_oltner.0001.c: "เรื่องอื่นเรียกความสนใจของข้าอยู่"
 nomad_events_oltner.0002.t: "ร่องรอยขนนก"
 nomad_events_oltner.0002.desc: "มีข่าวลือเกี่ยวกับ [sighting_province_1.Custom('GetAnimalGroup')] ของ [sighting_county_1.Custom('GetAnimalPlural')] ที่ถูกพบเห็นใน [sighting_province_1.Custom('GetTerrainTypePlural')] แห่ง [sighting_county_1.GetBaseNameNoTier] — เป็นโอกาสอันดีที่จะฝึกเหยี่ยวของเรา\n\nแน่นอน ข้าสามารถเลือกที่จะไล่ล่าสัตว์ที่ใหญ่กว่านี้แทนได้"
 nomad_events_oltner.0002.a: "[sighting_county_1.Custom('GetAnimalType')] อ้วนพีจะถูกตุ๋นในหม้อของข้าในไม่ช้า"
 nomad_events_oltner.0002.b: "ข้าอยากจะฝึกสุนัขมากกว่า"
 nomad_events_oltner.0002.c: "ข้าไม่อาจเสียเวลากับเรื่องนี้ได้"
 nomad_events_oltner.0003.t: "[sighting_county_1.Custom('GetAnimalGroup')|U] แห่ง [sighting_county_1.Custom('GetAnimalPlural')|U]"
 nomad_events_oltner.0003.desc: "แกะตายยี่สิบตัว คนเลี้ยงแกะถูกทำร้ายสาหัส และร่องรอยที่นำไปสู่ [sighting_province_1.Custom('GetTerrainTypePlural')] [sighting_county_1.Custom('GetAnimalGroup')] ที่ [sighting_county_1.Custom('GetAnimalAdjective')] ของ [sighting_county_1.Custom('GetAnimalPlural')] กำลังสังหารสิ่งที่โดยชอบธรรมแล้วเป็นของข้าใน [sighting_county_1.GetBaseNameNoTier]\n\nข้าควรเตรียมคันธนูและลูกธนูให้พร้อม ชื่อเสียงของข้าในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip] กำลังตกอยู่ในความเสี่ยง"
 nomad_events_oltner.0003.a: "ลูกธนูของข้าจะทะลวงหัวใจของเหล่า [sighting_county_1.Custom('GetAnimalPlural')]"
 nomad_events_oltner.0003.b: "[maa_regiment.GetNameNoTooltip] ของข้าจะสังหาร [sighting_county_1.Custom('GetAnimalGroup')]"
 nomad_events_oltner.0003.c: "[ROOT.Char.GetFaith.FertilityGodName] จะ ทำให้พวกมันจากไป"
 nomad_events_oltner.0004.t: "[sighting_county_1.Custom('GetAnimalPlural')|U] ในยามซูด"
 nomad_events_oltner.0004.desc: "[my_subregion.GetCurrentPhase.GetName] ไม่ได้มอบสิ่งใดนอกจากหิมะและน้ำแข็ง จนกระทั่ง [sighting_county_1.Custom('GetAnimalGroup')] ของ [sighting_county_1.Custom('GetAnimalPlural')] เข้ามา พวกมันกินทุกสิ่งที่ขวางหน้า บัดนี้เราก็กำลังเผชิญกับความตาย เช่นกัน\n\nข้าจะไม่นิ่งดูดายขณะที่ฝูงสัตว์และผู้คนของข้าล้มตาย"
 nomad_events_oltner.0004.a: "ข้าจะล่า [sighting_county_1.Custom('GetAnimalType')] ทุกตัวจนสิ้นซาก!"
 nomad_events_oltner.0004.b: "ลืมเรื่อง [sighting_county_1.Custom('GetAnimalPlural')] ไปเสีย เราต้องจากไป"
 nomad_events_oltner.0005.t: "ร่องรอยใหม่ให้ติดตาม"
 nomad_events_oltner.0005.desc: "ช่วงเวลานี้ของ [my_subregion.GetCurrentPhase.GetName] เชื้อเชิญการล่าที่ดี เหยื่อมีอยู่มากมาย พากันมายัง [sighting_province_1.Custom('GetTerrainTypePlural')] แห่ง [sighting_county_1.GetBaseNameNoTier] เป็นฝูง — เป็นฤดูกาลที่ได้รับพรจาก [ROOT.Char.GetFaith.WealthGodName] อย่างแท้จริง\n\nไม่ว่าข้าจะเลือกที่จะล่าสิ่งใด ข้าก็สามารถเลือกได้ตามใจชอบ"
 nomad_events_oltner.0005.a: "ข้าจะแสวงหาสัตว์ร้ายที่ดุร้าย"
 nomad_events_oltner.0005.b: "เราขี่ม้าเพื่อล่ากวาง!"
 nomad_events_oltner.0005.c: "กรงเล็บเหยี่ยวของเราแสวงหาเหยื่อใหม่"
 nomad_events_oltner.0006.t: "บรรณาการแห่งการไล่ล่า"
 nomad_events_oltner.0006.desc: ""ข้าขอน้อมคำนับต่อหน้าท่าน เจ้าเหนือหัวผู้ [ROOT.Char.Custom('FormalComplimentAdjective')] ของข้า" รัฐบรรณาการของข้า [generous_tributary.GetTitledFirstName] กล่าวพลางหมอบกราบ [generous_tributary.GetHerselfHimself] ต่อหน้าข้า\n\n"ข้าขอเสนอการรับใช้ของ [offered_master_of_the_hunt.GetFirstNameNicknamed] [GetCourtPositionType('master_of_hunt_court_position').CalcTriggeredNameNoTooltip( ROOT.Char )] ผู้เก่งกาจที่สุดในทั่วแคว้น [generous_tributary.GetPrimaryTitle.GetAdjective] ขอให้ [offered_master_of_the_hunt.GetSheHe] สังหารกวางตัวผู้มากมายในนามของท่าน""
 nomad_events_oltner.0006.a: "[offered_master_of_the_hunt.GetFirstNameNoTooltip] จะรับใช้ข้าเป็นอย่างดี"
 nomad_events_oltner.0006.b: "เป็นเครื่องบรรณาการอันยอดเยี่ยม ให้ข้าตอบแทนเจ้า"
 nomad_events_oltner.0006.c: "จงเก็บ [offered_master_of_the_hunt.GetHerHim] ไว้ และขอให้การล่าของเจ้าประสบความสำเร็จ"
 nomad_events_oltner.0007.t: "บรรณาการขนนก"
 nomad_events_oltner.0007.desc: ""เจ้าเหนือหัวผู้ [ROOT.Char.Custom('FormalComplimentAdjective')|U] ข้าขอถวายของขวัญชิ้นนี้แด่ท่าน" [generous_tributary.GetTitledFirstName] รัฐบรรณาการของข้า ชูนกอันสง่างามขึ้นต่อหน้าข้า\n\n"เหยี่ยวตัวนี้มาจาก [tribute_capital.Custom('GetTerrainTypePlural')] แห่ง [tribute_capital_county.GetBaseNameNoTier] และข้าได้ฝึกฝนมันด้วยตนเองตั้งแต่ยังเป็นลูกนก มันจะจับเป็ดและนกกระเรียนอกลายได้นับร้อยตัวให้ท่าน ข้าขอสาบาน""
 nomad_events_oltner.0007.a: "ข้าจะเรียกมันว่า '[ROOT.Char.Custom('GetBirdName')|U]!'"
 nomad_events_oltner.0007.b: "ได้โปรด เก็บมันไว้เถิด"
 
 chaotic_kurultai_title: "การสืบทอดที่คุรุลไทอันสับสนอลหม่าน:"
 chaotic_kurultai_intro_1: "[dead_parent.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_parent'))] ของข้า [dead_parent.GetDeathReasonHideKiller] รุ่งอรุณแห่งการปกครองของข้าเริ่มขึ้น เสียงที่ไม่เป็นเอกภาพของคุรุลไทสะท้อนก้องไปทั่ว [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')]\n\n"
 chaotic_kurultai_intro_2: "รุ่งอรุณแห่งการปกครองของข้าเริ่มขึ้น เสียงที่ไม่เป็นเอกภาพของคุรุลไทสะท้อนก้องไปทั่ว [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')]\n\n"
 mpo_chaotic_kurultai_succession.0001.t: "$chaotic_kurultai_title$ ความริษยา"
 mpo_chaotic_kurultai_succession.0001.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] #EMP '[sibling_rival_1.Custom('ComplimentAdjective')]'#! ของข้า [sibling_rival_1.GetFirstNameNicknamed] สาบานด้วยชีวิตของ [sibling_rival_1.GetHerHis] ว่า [sibling_rival_1.GetSheHe] ควรจะได้ปกครอง [ROOT.Char.GetPrimaryTitle.GetName] การที่ข้าเป็น [ROOT.Char.GetTitleAsName] นั้นเป็นเรื่องตลกของ [sibling_rival_1.GetFaith.EvilGodNames] [sibling_rival_1.GetSheHe|U] นั้น [sibling_rival_1.Custom('DescriptorNegativeStandalone')] และอ่อนแอ"
 mpo_chaotic_kurultai_succession.0001.desc_addition: "\n\nและดูเหมือนว่า [sibling_rival_2.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_2'))] [sibling_rival_2.Custom2('InsultNoun', ROOT.Char)] ของข้า ได้ตัดสินใจเอาอย่าง เช่นกัน"
 mpo_chaotic_kurultai_succession.0001.a: "ข้าจะพิสูจน์คุณค่าของข้าให้เห็นในไม่ช้า"
 rival_kurultai_succession: "[TARGET_CHARACTER.GetShortUIName|U] [CharWereWas(TARGET_CHARACTER)] ไม่ได้รับเลือกอย่างเป็นเอกฉันท์จากคุรุลไทระหว่างการสืบทอด ทำให้ [CHARACTER.GetShortUIName|U] โกรธเคือง"
 rival_kurultai_succession_corresponding: "[CHARACTER.GetShortUIName|U] [CharWereWas(CHARACTER)] ไม่ได้รับเลือกอย่างเป็นเอกฉันท์จากคุรุลไทระหว่างการสืบทอด ทำให้ [TARGET_CHARACTER.GetShortUIName|U] โกรธเคือง"
 
 mpo_chaotic_kurultai_succession.0002.t: "$chaotic_kurultai_title$ การแย่งชิงรัฐบรรณาการ"
 sibling_usurped_tributary_lands_tt: "[sibling_rival_1.GetShortUIName|U] แย่งชิงดินแดนและข้าหลวงทั้งหมดของ [tributary|E] [tributary_usurped.GetShortUIName|U] ของท่าน และกลายเป็น [independent_ruler|E]"
 mpo_chaotic_kurultai_succession.0002.desc: "[sibling_rival_1.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] ของข้าเห็นสมควรที่จะนำกลุ่ม [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] เข้าไปยังดินแดนของ [tributary_usurped.GetTitledFirstNameNicknamed] รัฐบรรณาการของข้า ยึดครองอาณาจักรของ [tributary_usurped.GetHerHis] โดยพลการ"
 mpo_chaotic_kurultai_succession.0002.desc_addition: "ด้วยการสนับสนุนของสมาชิกคุรุลไทผู้ทรยศ [backing_kurultai.GetFirstNameNicknamed]"
 mpo_chaotic_kurultai_succession.0002.desc_end: "\n\nนั่นเป็นความผิดพลาดร้ายแรง"
 mpo_chaotic_kurultai_succession.0002.a: "[sibling_rival_1.GetSheHe|U] กล้าดียังไงมาแย่งชิงสิ่งที่ข้าเป็นเจ้าของ?"
 
 mpo_chaotic_kurultai_succession.0003.t: "$chaotic_kurultai_title$ การยุติการส่งบรรณาการ"
 mpo_chaotic_kurultai_succession.0003.desc: "[tributary_leaving.GetFirstNameNicknamed] แห่ง [tributary_leaving.GetPrimaryTitle.GetName] รัฐบรรณาการของข้า ได้ตัดสินใจยุติการชำระเงินของ [tributary_leaving.GetHerHis]"
 mpo_chaotic_kurultai_succession.0003.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] สมาชิกคุรุลไทผู้ก่อกบฏ มีส่วนรู้เห็นในการทรยศครั้งนี้"
 mpo_chaotic_kurultai_succession.0003.a: "ข้าจะบดขยี้ [tributary_leaving.GetHerHim] สำหรับความโอหังของ [tributary_leaving.GetHerHis]!"
 mpo_chaotic_kurultai_succession.0003.desc_end: "\n\nข้าจะได้เครื่องบรรณาการของข้า ไม่ทางใดก็ทางหนึ่ง"
 
 mpo_chaotic_kurultai_succession.0004.t: "$chaotic_kurultai_title$ การสูญเสียการควบคุม"
 mpo_chaotic_kurultai_succession.0004.desc: "ทุ่งหญ้าเลี้ยงสัตว์ของข้าถูกบุกรุกโดยนักปล้น, สุนัข, และเหล่าคนจรจัด [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] พวกมันกำลังปล้นสะดมเยิร์ต (yurt) ของข้า, ฆ่าม้าของข้า, และเผาธงตราของข้า"
 mpo_chaotic_kurultai_succession.0004.desc_addition: "เป็นที่ชัดเจนว่าพวกมันได้รับการยุยงจาก [backing_kurultai.GetFirstNameNicknamed], สมาชิก [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] แห่งคูรุลไต"
 mpo_chaotic_kurultai_succession.0004.a: "ความเป็นระเบียบจะได้รับการฟื้นฟูในไม่ช้า"
 mpo_chaotic_kurultai_succession.0004.desc_end: "\n\nพวกเขาจะยอมศิโรราบ"
 
 mpo_chaotic_kurultai_succession.0005.t: "$chaotic_kurultai_title$ การเสียเกียรติ"
 mpo_chaotic_kurultai_succession.0005.desc: "ชื่อเสียงของข้า ถูกลากลงดิน ถูกม้าเหยียบย่ำ ถูกดูหมิ่น ถูกทอดทิ้ง"
 mpo_chaotic_kurultai_succession.0005.desc_addition: "และคำใส่ร้ายส่วนใหญ่ก็มาจากปากของ [backing_kurultai.GetFirstNameNicknamedPossessive] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้าโดยตรง"
 mpo_chaotic_kurultai_succession.0005.a: "เกียรติของข้าจะได้รับการฟื้นฟู"
 
 mpo_chaotic_kurultai_succession.0006.t: "$chaotic_kurultai_title$ ฝูงสัตว์ที่สูญหาย"
 mpo_chaotic_kurultai_succession.0006.desc: "ในยามค่ำคืน ฝูงสัตว์ส่วนใหญ่ของข้าหายไป สูญหาย หรือถูกขโมย"
 mpo_chaotic_kurultai_succession.0006.desc_addition: "ข้าสงสัยว่า [backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า เป็นผู้ปล่อยพวกมันไปในยามค่ำคืน"
 mpo_chaotic_kurultai_succession.0006.desc_end: "\n\nพวกมันอาจจะไปถึงครึ่งทางสู่ [rustler.GetCapitalLocation.Custom('TerrainTypeProvince')] แห่ง [rustler.GetCapitalLocation.GetName] แล้วก็ได้ ข้าคงไม่ได้เห็นพวกมันอีก"
 mpo_chaotic_kurultai_succession.0006.a: "ความแข็งแกร่งของข้าจะกลับคืนมา"
 
 mpo_chaotic_kurultai_succession.1006.t: "ฝูงสัตว์ที่สูญหาย"
 mpo_chaotic_kurultai_succession.1006.desc: "ฝูงแพะและแกะ ที่สูญหายหรือถูกทอดทิ้ง ได้ปรากฏตัวขึ้นในยามค่ำคืน\n\nสัตว์เหล่านี้เชื่องและสามารถเพิ่มจำนวนฝูงสัตว์ของข้าได้อย่างง่ายดาย บางคนกล่าวว่าการสืบทอดที่วุ่นวายของ [ruler_rustled.GetTitledFirstNameNicknamed] แห่ง [ruler_rustled.GetPrimaryTitle.GetName] เป็นสาเหตุ"
 mpo_chaotic_kurultai_succession.1006.desc_addition: "พลม้าของข้ารายงานว่าเห็น [backing_kurultai.GetTitledFirstNameNicknamed] สมาชิกที่ไม่เชื่อฟังของคุรุลไทของ [ruler_rustled.GetFirstNamePossessiveNoTooltip] ซุ่มซ่อนอยู่บริเวณรอบนอก นี่น่าจะเป็นฝีมือของ [backing_kurultai.GetHerHis]"
 mpo_chaotic_kurultai_succession.1006.a: "เพิ่มพวกมันเข้าไปในฝูงของข้า"
 mpo_chaotic_kurultai_succession.1006.b: "ส่งพวกมันกลับไปให้ [ruler_rustled.GetFirstNameNoTooltip] เป็นของขวัญ"
 mpo_chaotic_kurultai_succession.1006.b.title: "[rustler.GetFirstName] คืนฝูงสัตว์ของท่าน"
 mpo_chaotic_kurultai_succession.1006.b.tt: "[herd|E] ที่สูญหายของ [ruler_rustled.GetShortUINamePossessive] ถูกส่งคืน"
 
 mpo_chaotic_kurultai_succession.0007.t: "$chaotic_kurultai_title$ ข้าราชบริพารแปรพักตร์"
 mpo_chaotic_kurultai_succession.0007.desc: "ข้าราชบริพารที่ดีที่สุดของข้าสามคนหายตัวไป: [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], และ [courtier_3.GetFirstNameNicknamed] — ความโกรธแค้นของพวกเขาจุดประกายจากการโต้เถียงเรื่องการสืบทอด"
 mpo_chaotic_kurultai_succession.0007.desc_addition: "ไม่ต้องสงสัยเลยว่า ได้รับการยุยงจาก [backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า"
 mpo_chaotic_kurultai_succession.0007.desc_end: "\n\nพวกเขาดูหมิ่นอำนาจของข้า และบัดนี้กำลังมุ่งหน้าไปยัง [courtier_stealer.GetCapitalLocation.GetName] เพื่อแสวงหานายใหม่"
 mpo_chaotic_kurultai_succession.0007.a: "ข้ายังมีข้ารับใช้ที่ภักดีเหลืออยู่อีกมาก"
 
 mpo_chaotic_kurultai_succession.1007.t: "ผู้มาใหม่"
 mpo_chaotic_kurultai_succession.1007.desc: "นักพเนจรสามคน [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], และ [courtier_3.GetFirstNameNicknamed] มาขอเข้าเฝ้าในราชสำนักของข้า\n\nพวกเขามาจาก [ruler_rustled.GetPrimaryTitle.GetName] ถูกขับไล่ออกมาจากการสืบทอดที่วุ่นวายของ [ruler_rustled.GetTitledFirstNameNicknamedPossessive]"
 mpo_chaotic_kurultai_succession.1007.desc_addition: "พวกเขาน่าจะถูกยุยงโดย [backing_kurultai.GetTitledFirstNameNicknamed] สมาชิกที่ไม่เชื่อฟังในคุรุลไทของ [ruler_rustled.GetFirstNamePossessiveNoTooltip]"
 mpo_chaotic_kurultai_succession.1007.a: "พวกเขาจะรับใช้ข้าเป็นอย่างดี"
 mpo_chaotic_kurultai_succession.1007.b: "ส่งพวกเขากลับไปให้ [ruler_rustled.GetFirstNameNoTooltip]"
 mpo_chaotic_kurultai_succession.1007.b.title: "[courtier_stealer.GetFirstName] คืนข้าราชบริพารของท่าน"
 
 mpo_chaotic_kurultai_succession.0008.t: "$chaotic_kurultai_title$ ทหารหนีทัพ"
 mpo_chaotic_kurultai_succession.0008.desc: "ท่ามกลางความโกลาหลของการสืบทอด, [defecting_maa.GetName] ที่ดีที่สุดของข้าหมดศรัทธา เหล่านักรบ [maa_stealer.Custom2('InsultAdjective', ROOT.Char)] เหล่านี้กำลังละทิ้งข้า"
 mpo_chaotic_kurultai_succession.0008.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า น่าจะเป็นผู้ยุยง"
 mpo_chaotic_kurultai_succession.0008.desc_end: "\n\nฝุ่นจากกีบม้าของพวกเขามุ่งหน้าไปยัง [maa_stealer.GetPrimaryTitle.GetName] ข้าหวังว่าพวกเขาจะตายที่นั่น"
 mpo_chaotic_kurultai_succession.0008.a: "ใครต้องการพวกมันกัน?"
 
 mpo_chaotic_kurultai_succession.1008.t: "[defecting_maa.GetNameNoTooltip] ผู้เต็มใจ"
 mpo_chaotic_kurultai_succession.1008.desc: "กลุ่ม [defecting_maa.GetName] ติดอาวุธอย่างดีกลุ่มหนึ่งยืนอยู่ต่อหน้าข้า พวกเขาดูไม่เหมือนโจร แต่กลับต้องการรับราชการในกองทัพของข้า\n\nพวกเขามาจาก [ruler_rustled.GetPrimaryTitle.GetName] ท้อแท้จากการสืบทอดที่วุ่นวายของ [ruler_rustled.GetTitledFirstNameNicknamedPossessive]"
 mpo_chaotic_kurultai_succession.1008.desc_addition: "ความจริงที่ว่าพวกเขาอยู่ที่นี่น่าจะเป็น เพราะ [backing_kurultai.GetTitledFirstNameNicknamed] สมาชิกที่ไม่เชื่อฟังของคุรุลไทของ [ruler_rustled.GetFirstNamePossessiveNoTooltip]"
 mpo_chaotic_kurultai_succession.1008.a: "ข้าสามารถใช้ทหารเหล่านี้ได้"
 mpo_chaotic_kurultai_succession.1008.b: "ส่งพวกเขากลับไปให้ [ruler_rustled.GetFirstNameNoTooltip]"
 mpo_chaotic_kurultai_succession.1008.b.title: "[maa_stealer.GetFirstName] คืนทหารของท่าน"
 chaos_upgrade_maa_tt: "[men_at_arms|E] อื่นๆ อาจได้รับการอัปเกรด"
 regiment_destroyed_tt: "กรมทหาร [regiment|E] ของ [defecting_maa.GetName] ได้เข้าร่วมกับ [maa_stealer.GetFirstName]"
 
 mpo_chaotic_kurultai_succession.0009.t: "$chaotic_kurultai_title$ คลังสมบัติที่ถูกแบ่งแยก"
 mpo_chaotic_kurultai_succession.0009.desc: "พี่น้องของข้าโกรธแค้นคำตัดสินของคุรุลไท ปล้นสะดมคลังสมบัติเพื่อส่วนแบ่งของตน"
 mpo_chaotic_kurultai_succession.0009.desc_addition: "[sibling_rival_1.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] ของข้าโกรธแค้นคำตัดสินของคุรุลไท ปล้นสะดมคลังสมบัติเพื่อส่วนแบ่งของ [sibling_rival_1.GetHerHis]\n\n[sibling_rival_1.GetSheHe|U] จะต้องชดใช้สำหรับการทรยศครั้งนี้"
 mpo_chaotic_kurultai_succession.0009.desc_addition2: "\n\n[sibling_rival_1.GetFirstNameNicknamed], [sibling_rival_2.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition3: "[sibling_rival_3.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition4: "[sibling_rival_4.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition5: "[sibling_rival_5.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_end: "พวกเขาจะต้องชดใช้สำหรับการทรยศครั้งนี้"
 mpo_chaotic_kurultai_succession.0009.a: "ความโลภของพวกเขาจะถูกลงโทษ"
 
 mpo_chaotic_kurultai_succession.0010.t: "$chaotic_kurultai_title$ อำนาจที่อ่อนแอลง"
 mpo_chaotic_kurultai_succession.0010.desc: "พวกมันทุกคนกำลังหัวเราะเยาะข้า, เรียกข้าว่า [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] พวกมันกล่าวว่าข้าอ่อนแอ, ไม่คู่ควรที่จะเป็น [ROOT.Char.GetTitleAsNameNoTooltip]"
 mpo_chaotic_kurultai_succession.0010.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า กำลังหัวเราะดังกว่าใครทั้งหมด"
 mpo_chaotic_kurultai_succession.0010.desc_end: "\n\nพวกเขากล้าดียังไงมาดูหมิ่นอำนาจของข้า!?"
 mpo_chaotic_kurultai_succession.0010.a: "ข้าต้องพิสูจน์ให้พวกเขาเห็นว่าคิดผิด..."
 
 mpo_chaotic_kurultai_succession.0011.t: "$chaotic_kurultai_title$ ฝูงสัตว์แตกตื่น!"
 mpo_chaotic_kurultai_succession.0011.desc: "ในยามดึกสงัด ฝูงสัตว์ของข้าแตกตื่น — ไฟลุกโชน สัตว์ตื่นตระหนก นี่ไม่ใช่อุบัติเหตุ พวกมันถูกปลุกปั่น พวกมันได้รับบาดเจ็บ"
 mpo_chaotic_kurultai_succession.0011.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า ทักทายข้าด้วยรอยยิ้มแสยะแยกเขี้ยว"
 mpo_chaotic_kurultai_succession.0011.desc_end: "\n\nข้าใช้เวลาทั้งวันพยายามควบคุมพวกมัน ส่วนใหญ่หลงทางไปยัง [rustler.GetCapitalLocation.GetName]"
 mpo_chaotic_kurultai_succession.0011.a: "สาปแช่งเจ้าสัตว์ขี้ตื่นเหล่านี้!"
 
 mpo_chaotic_kurultai_succession.0012.t: "$chaotic_kurultai_title$ อาณาจักรที่ถูกแบ่งแยก"
 mpo_chaotic_kurultai_succession.0012.desc: "ได้ข้อสรุปแล้ว ข้าจะได้รับมรดกเพียงครึ่งหนึ่งของดินแดน ส่วนที่เหลือจะตกเป็นของ [sibling_rival_1.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] ของข้า, ผู้ ซึ่งย้ายไปยัง [sibling_rival_1.GetCapitalLocation.GetName] แล้ว!\n\nกว่าครึ่งของคูรุลไตเห็นชอบกับการตัดสินใจนี้ พวกมันคือคนโง่ที่ถูกชักนำไปผิด ๆ"
 mpo_chaotic_kurultai_succession.0012.a: "คุรุลไทจะต้องชดใช้เรื่องนี้!"
 sibling_tool_50_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed] ด้วยความช่วยเหลือของ [kurultai|E] ได้แบ่งแยกส่วนใหญ่ของ [realm|E] ของท่านออกเป็น [kingdom|E] [de_jure|E] ใหม่"
 
 mpo_chaotic_kurultai_succession.0013.t: "$chaotic_kurultai_title$ อาณาจักรที่แตกแยก"
 mpo_chaotic_kurultai_succession.0013.desc: "คำตัดสินชัดเจนแล้ว — ส่วนแบ่งที่ใหญ่ที่สุดของดินแดนเราเป็นของข้า ส่วนที่เหลือตกเป็นของ [sibling_rival_1.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] ของข้า\n\nขอให้ [sibling_rival_1.GetSheHe] จงเน่าตายอยู่ที่ [sibling_rival_1.GetCapitalLocation.GetName] เถิด"
 mpo_chaotic_kurultai_succession.0013.a: "มันจะเป็นของข้า..."
 sibling_tool_20_percent_tt: "[sibling_rival_1.GetFirstNameNicknamed] ด้วยความช่วยเหลือของ [kurultai|E] ได้แบ่งแยกส่วนเล็กน้อยของ [realm|E] ของท่านออกเป็น [kingdom|E] [de_jure|E] ใหม่"
 
 mpo_chaotic_kurultai_succession.0014.t: "$chaotic_kurultai_title$ การล่มสลาย"
 mpo_chaotic_kurultai_succession.0014.desc: "โกรธแค้น ไม่พอใจ กรีดร้อง ทะเลาะวิวาท ไม่มีที่ว่างสำหรับกฎหมาย ไม่มี่ที่ว่างสำหรับการตัดสินใจ มีเพียงความแตกแยก\n\nนี่คือจุดจบของ [ROOT.Char.GetPrimaryTitle.GetName]"
 mpo_chaotic_kurultai_succession.0014.desc_alt: "แต่เสียงเหล่านั้นอ่อนแอ ไร้พลัง ไม่มีการตัดสินใจใดๆ เกิดขึ้นได้ ไม่มีความถูกต้อง ไม่มีกฎหมาย\n\nนี่คือจุดจบของ [ROOT.Char.GetPrimaryTitle.GetName] หากเพียง แต่บรรพบุรุษของข้าได้เลือกสมาชิกคุรุลไทให้เพียงพอ..."
 mpo_chaotic_kurultai_succession.0014.a: "ข้าจะสร้างอาณาจักรของข้าขึ้นใหม่!"
 liege_primary_title_chaos_desc: "เจ้าเหนือหัวของท่านสูญเสีย [primary_title|E] เนื่องจาก [succession|E] ที่วุ่นวาย"
 title_chaos_dissolved_tt: "[kurultai|E] ไม่สามารถบรรลุข้อสรุปได้ ทำให้ [realm|E] ของท่านล่มสลาย"
 
 mpo_chaotic_kurultai_succession.0015.t: "$chaotic_kurultai_title$ อสนีบาตไร้ผู้ขับขี่"
 mpo_chaotic_kurultai_succession.0015.desc: "พวกเขาเริ่มแบ่งฝูงสัตว์ โต้เถียง ทะเลาะวิวาท จนกระทั่งเกิดการต่อสู้ สัตว์แตกตื่น หนีไปทุกทิศทุกทาง"
 mpo_chaotic_kurultai_succession.0015.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า พยายามต้อนฝูงสัตว์ที่ [backing_kurultai.GetSheHe] ทำให้ตื่นกลัวด้วย [backing_kurultai.GetHerselfHimself] อย่างอ่อนหัด"
 mpo_chaotic_kurultai_succession.0015.desc_end: "\n\nข้าใช้เวลาทั้งวันพยายามควบคุมพวกมัน ส่วนใหญ่หลงทางไปยัง [rustler.GetCapitalLocation.GetName]"
 mpo_chaotic_kurultai_succession.0015.a: "ฝูงสัตว์ของข้าถูกทำลายจนสิ้น!"
 
 mpo_chaotic_kurultai_succession.0016.t: "$chaotic_kurultai_title$ รัฐบรรณาการตีจาก"
 mpo_chaotic_kurultai_succession.0016.desc: "[tributary_leaving.GetFirstNameNicknamed] แห่ง [tributary_leaving2.GetPrimaryTitle.GetName], [tributary_leaving2.GetFirstNameNicknamed] แห่ง [tributary_leaving.GetPrimaryTitle.GetName], และ [tributary_leaving3.GetFirstNameNicknamed] แห่ง [tributary_leaving3.GetPrimaryTitle.GetName] ได้ยุติการส่งบรรณาการทั้งเงินตราและฝูงสัตว์แล้ว"
 mpo_chaotic_kurultai_succession.0016.desc_addition: "[backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า มอบความกล้าให้พวกมันท้าทายข้า"
 mpo_chaotic_kurultai_succession.0016.desc_end: "\n\nอีกไม่นานพวกเขาจะต้องคุกเข่าอีกครั้ง"
 mpo_chaotic_kurultai_succession.0016.a: "ลูกแกะรอการเชือด"
 
 mpo_chaotic_kurultai_succession.0017.t: "$chaotic_kurultai_title$ บรรณาการที่ร่วงโรย"
 mpo_chaotic_kurultai_succession.0017.desc: "เหล่ารัฐบรรณาการของข้าเฝ้ามองความขัดแย้งที่เกิดขึ้น พวกเขาเห็นความอ่อนแอ เยาะเย้ย และจากไป เสียงทะเลาะวิวาทกลบคำพูดของข้าจนหมดสิ้น"
 mpo_chaotic_kurultai_succession.0017.desc_addition: "ยิ่งกว่าผู้ใด, [backing_kurultai.GetFirstNameNicknamed] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] ของข้า เป็นผู้โหมกระพือไฟ, มอบความกล้าให้พวกมันหันหลังให้ข้า"
 mpo_chaotic_kurultai_succession.0017.desc_end: "\n\nเหลือเพียงผู้อ่อนน้อมเท่านั้น"
 mpo_chaotic_kurultai_succession.0017.a: "อีกไม่นานพวกเขาจะกลับมารับใช้ข้าอีกครั้ง"
 
 mpo_chaotic_kurultai_succession.1000.t: "อาณาจักรข่านผู้สืบทอด"
 mpo_chaotic_kurultai_succession.1000.desc: "จักรวรรดิแตกแยก ทายาทต่างแก่งแย่งชิงอำนาจ แต่ไม่มีผู้ใดแข็งแกร่งพอที่จะยึดครองได้ ยกเว้น..."
 mpo_chaotic_kurultai_succession.1000.a: "ข้า แน่นอน"
