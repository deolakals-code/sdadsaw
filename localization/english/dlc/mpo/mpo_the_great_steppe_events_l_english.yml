l_english: 
 mpo_the_great_steppe.0001.t: "ทุ่งหญ้าสเตปป์อันยิ่งใหญ่"
 mpo_the_great_steppe.0001.desc: "ทะเลหญ้าและศิลาอันไร้ที่สิ้นสุด ทุ่งหญ้าสเตปป์มิใช่บ้านอันปรานี กระโจมถูกกางและรื้อถอนไปตามฤดูกาลที่เปลี่ยนผัน — หมู่บ้านทั้งหมู่บ้านย้ายถิ่นหนีพายุหิมะอันโหดร้ายหรือศัตรูที่แข็งแกร่งกว่า\n\nมนุษย์อยู่ภายใต้ความเมตตาของเหล่าสัตว์ร้าย สิ่งที่ฝูงสัตว์ต้องการเพื่อความอยู่รอดคือสิ่งที่ฝูงสัตว์จะได้รับ\n\nผู้ใดเล่าจะพิชิตธาตุทั้งหลายและผงาดขึ้นเป็นข่านแห่งข่านทั้งปวง?"
 mpo_the_great_steppe.0001.a: "เราจะควบทะยานไปด้วยกัน!"
 
 mpo_the_great_steppe.0002.t: "[my_subregion.GetNameNoTooltip]: [my_subregion.GetCurrentPhase.GetName]"
 mpo_the_great_steppe.0002.desc.cold_zud: "ความหนาวเหน็บเชือดเฉือนผิวหนัง ผิวรอบแก้มของข้าเริ่มลอกออก สัตว์ทั้งหลายสั่นเทาภายใต้ลมแรง ปราศจากเรี่ยวแรงที่จะหาอาหารกินเอง"
 mpo_the_great_steppe.0002.desc.drought: "แผ่นดินแตกระแหงและแห้งผากดุจบาดแผลที่กำลังสมาน หญ้าเหี่ยวแห้งและสัตว์ทั้งหลายต่อสู้แย่งชิงฟางเส้นสุดท้าย\n\nถึงเวลาแล้วที่จะต่อสู้หรือหลบหนี"
 mpo_the_great_steppe.0002.desc.white_zud: "มองไม่เห็นหญ้าใดๆ ใต้ชั้นหิมะ ขาวโพลนดุจดวงจันทร์ ความตายมาเพื่อพรากสัตว์ของเราไป"
 mpo_the_great_steppe.0002.desc.warm_nights: "เหล่านกขับขานและเด็กๆ เล่นสนุก ข้าพบ [person.GetFirstName] นอนอยู่บนหญ้า ดวงตาของ [person.GetHerHis] ปิดสนิท อาบแดดอย่างสบายอารมณ์\n\nเสียงร้องแผ่วเบามาจากท่ามกลางฝูงสัตว์ ลูกวัวและลูกแกะแรกเกิดได้รับการดูแลเอาใจใส่อย่างอ่อนโยนที่สุด\n\nหากเพียง แต่จะเป็น เช่นนี้ตลอดไปได้"
 mpo_the_great_steppe.0002.desc.abundant_grazing: "หญ้าสูงเสียจนเด็กๆ หลงทางในนั้น มารดาต่างหัวเราะขณะตามหาพวกเขา\n\nยากที่จะจินตนาการถึงฝูงสัตว์ที่แข็งแรงสมบูรณ์กว่านี้ หรือช่วงเวลาที่มีความสุขมากกว่านี้"
 mpo_the_great_steppe.0002.desc.havsarsan_zud: "แม่น้ำแห้งขอดและทุ่งหญ้าเหี่ยวเฉาเป็นหมัน น้ำแข็งปกคลุมผืนดินและไม่มีสิ่งใดสามารถเติบโตได้ สัตว์ล้มตายและอีกไม่นานเราก็จะตามไป\n\nขอ [ROOT.Char.GetFaith.HighGodName] โปรดช่วยเหลือเราด้วยเถิด เพราะเราคงอยู่ใน [ROOT.Char.GetFaith.NegativeAfterLife] เป็นแน่"
 mpo_the_great_steppe.0002.desc.sky_blessing: "ดอกไม้เบ่งบานและสัตว์เติบโตแข็งแรงกว่าที่เคยเป็นมา ทุ่งหญ้าเลี้ยงสัตว์ขยายอาณาเขตไปยังพื้นที่ที่คิดว่าตายไปแล้วหลายชั่วอายุคน\n\nเด็กทุกคนที่เกิดมาได้รับพรด้วยความรักของ [ROOT.Char.GetFaith.HealthGodName] และความแข็งแกร่งของ [ROOT.Char.GetFaith.WarGodName]\n\nหากข้าเพียงหลับตาลง ข้าก็สามารถจินตนาการได้ว่าเราอยู่ใน [ROOT.Char.GetFaith.PositiveAfterLife]"
 mpo_the_great_steppe.0002.desc.obedience: "\n\nอย่างไรก็ตาม ด้วยโอกาสรอดชีวิตที่ต่ำลง ผู้คนจึงมีแนวโน้มที่จะยอมสาบานตนเชื่อฟังมากขึ้น"
 mpo_the_great_steppe.0002.a: "และโลกก็ยังคงหมุนต่อไป"
 mpo_the_great_steppe.0002.tt: "[steppe_season|E] ได้เปลี่ยนไปแล้ว"
 mpo_the_great_steppe_0002_souvenirs_aplenty_tt: "ต้องขอบคุณ [perk|E] [GetPerk('souvenirs_aplenty_perk').GetName( GetPlayer )] ของท่าน"
 souvenirs_aplenty_perk_county_modifier: "การเปลี่ยนแปลงของฤดูกาล"
 souvenirs_aplenty_perk_county_modifier_desc: "ด้วยประสบการณ์ในวิถีชีวิตของตน ตัวละครนี้ได้เรียนรู้วิธีรับมือกับการเปลี่ยนแปลงของฤดูกาลอย่างดีที่สุด"
