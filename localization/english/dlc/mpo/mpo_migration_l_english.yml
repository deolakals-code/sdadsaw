 # Contract 1
 nomadic_migration_contract_1_contract: "$nomadic_migration_contract_1_desc_title$"
 nomadic_migration_contract_1_desc_title: "เหล่าคนเลี้ยงสัตว์ผู้ไม่ลงรอย"
 nomadic_migration_contract_1_desc: "หลังจากตั้งถิ่นฐานใน [TaskContract.GetLocation.GetName] เราได้มีข้อขัดแย้งหลายครั้งกับกลุ่มคนเลี้ยงสัตว์ในท้องถิ่นตามที่ [TaskContract.GetEmployer.GetName] กล่าว การยั่วยุของพวกเขายืดเยื้อมานานเกินไปแล้ว — ถึงเวลาที่จะต้องยุติความไม่สงบนี้เสียที"
 nomadic_migration_contract_1_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0005.t: "$nomadic_migration_contract_1_desc_title$"
 mpo_contract_events.0005.desc: "เพียงครู่เดียวหลังจากได้พบกับหนึ่งในคนเลี้ยงสัตว์ที่คาราโครัม ก็ได้ค้นพบใจกลางของปัญหา [herder_character.GetName] อ้างว่าชุมชนของ [herder_character.GetHerHis] อาศัยอยู่ในดินแดนเหล่านี้มาหลายชั่วอายุคนแล้ว ทว่าเพิ่งจะมาเผชิญกับปัญหาขาดแคลนอาหารนับตั้งแต่เราเดินทางมาถึงบริเวณนี้\n\nแม้พวกเขาจะปฏิเสธที่จะละทิ้งบ้านเกิดของบรรพบุรุษ การแสดงอำนาจอาจจะโน้มน้าวให้พวกเขาเปลี่ยนใจได้—เว้นเสีย แต่ว่า แน่นอน เราปรารถนาที่จะหาหนทางที่จะใช้ประโยชน์จากการมีอยู่ของพวกเขา"
 mpo_contract_events.0005.a: "จงเข้าร่วมกับข้า เราจะแข็งแกร่งขึ้นเมื่อร่วมมือกัน"
 mpo_contract_events.0005.a.impressed: "เราบรรลุข้อตกลง"
 mpo_contract_events.0005.a.unimpressed: "พวกเขาไม่ประทับใจในข้อโต้แย้งของเรา"
 mpo_contract_events.0005.b: "จงทำงานให้ข้า ข้าจะจัดการปัญหาอาหารของพวกเจ้าเอง"
 mpo_contract_events.0005.c: "จงขับไล่พวกเขาออกจากดินแดน #emp ของเรา#!"

 # Contract 2
 nomadic_migration_contract_2_contract: "$nomadic_migration_contract_2_desc_title$"
 nomadic_migration_contract_2_desc_title: "ฝูงสัตว์ป่า"
 nomadic_migration_contract_2_desc: "ฝูงสัตว์ป่าได้ออกอาละวาดไปทั่วทุ่งรอบๆ [TaskContract.GetLocation.GetName] ฝูงสัตว์ของเราเองจะได้รับความเดือดร้อนตราบใดที่สัตว์ป่าเหล่านี้ยังถูกปล่อยไว้ตามลำพัง"
 nomadic_migration_contract_2_request: "$nomadic_migration_contract_request$"
 mpo_si_slaughtered_for_a_feast: "การเลี้ยงฉลองอย่างอุดมสมบูรณ์"
 mpo_si_slaughtered_for_a_feast_desc: "ตัวละครนี้ได้นำอาหารเลิศรสมาเลี้ยงฉลองแก่ผู้คนของตนอย่างแท้จริง"
 migration_contract_2_herd_reward_tt: "#V ท่าน#! ได้รับ [herd_i] #P [SCOPE.ScriptValue('miniscule_herd_value_static')]-[SCOPE.ScriptValue('minor_herd_value_static')]#! [herd|E]"

 mpo_contract_events.0015.t: "$nomadic_migration_contract_2_desc_title$"
 mpo_contract_events.0015.desc: "แม้จะมองจากระยะไกล ฝูงสัตว์ที่กำลังเล็มหญ้าก็เป็นภาพที่น่าชม พวกมันกินอาหารบนผืนดินอย่างตะกละตะกลาม เหลือพื้นที่ให้ฝูงสัตว์ของเราเติบโตและขยายพันธุ์เพียงเล็กน้อย\n\nคนเลี้ยงแกะของเราที่หวาดกลัวได้ขอให้เราจัดการพวกมันก่อนที่มันจะ ทำให้ฝูงสัตว์ของเราอดอยากและล้มตาย"
 mpo_contract_events.0015.a: "ข้าจะจับพวกมันบางส่วนมาไว้ในฝูงของเรา"
 mpo_contract_events.0015.a.successful: "ท่านจับฝูงสัตว์ป่าได้เป็นจำนวนมาก"
 mpo_contract_events.0015.a.failure: "ท่านจับฝูงสัตว์ป่าได้เพียงเล็กน้อย"
 mpo_contract_events.0015.b: "จงฆ่าพวกมัน และเตรียมงานเลี้ยงเล็กๆ"
 mpo_contract_events.0015.c: "พวกมันจะทำเงินให้เราเล็กน้อย"

 # Contract 3
 nomadic_migration_contract_3_contract: "$nomadic_migration_contract_3_desc_title$"
 nomadic_migration_contract_3_desc_title: "ทุ่งหญ้าพิพาท"
 nomadic_migration_contract_3_desc: "เกิดความขัดแย้งอย่างต่อเนื่องระหว่างเหล่า [TaskContract.GetTaker.Custom('KnightCulturePluralNoTooltip')] ของข้าเกี่ยวกับทุ่งหญ้าที่ดีที่สุดรอบๆ [TaskContract.GetLocation.GetName] ซึ่งค่อยๆ บ่มเพาะ จนกระทั่งความทะนงตน ทำให้พวกเขาบาดหมางกันอย่างรุนแรง"
 nomadic_migration_contract_3_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0025.t: "$nomadic_migration_contract_3_desc_title$"
 mpo_contract_events.0025.desc: "หลังจากที่เราอพยพไปยัง [task_contract.GetLocation.GetName] ก็เกิดความขัดแย้งอย่างต่อเนื่องระหว่าง [task_contract.GetEmployer.GetFirstName] และ [knight_2.GetFirstName] เกี่ยวกับทุ่งหญ้าในบริเวณใกล้เคียง\n\nแม้ในตอนแรกจะเป็นเพียงเรื่องปวดหัวเล็กน้อย แต่มันก็ได้บ่มเพาะ จนกระทั่งบัดนี้ความทะนงตน ทำให้ทั้งสองฝ่ายไม่ยอมถอยจากความขัดแย้ง ข้าควรจะเข้าไปแทรกแซงก่อนที่สถานการณ์จะเลวร้ายไปกว่านี้ และส่งผลกระทบต่อขวัญกำลังใจในค่าย"
 mpo_contract_events.0025.a: "[task_contract.GetEmployer.GetFirstNameNoTooltip] พูดถูก ดินแดนนั้นเป็นของ [task_contract.GetEmployer.GetHersHis]"
 mpo_contract_events.0025.b: "อันที่จริง [knight_2.GetFirstNameNoTooltip] มีเหตุผลที่ดีกว่า"
 mpo_contract_events.0025.c: "ฝูงสัตว์ของข้าเองจะเจริญเติบโตในดินแดนเหล่านั้น"

 # Contract 4
 nomadic_migration_contract_4_contract: "$nomadic_migration_contract_4_desc_title$"
 nomadic_migration_contract_4_desc_title: "การขาดแคลนเครื่องมือ"
 nomadic_migration_contract_4_desc: "การอพยพไปยัง [TaskContract.GetLocation.GetName] ได้ส่งผลกระทบต่อคลังวัสดุและเครื่องมือของเรา หากไม่มีการเติมเต็ม มันจะส่งผลกระทบต่อเผ่าของเราในไม่ช้าอย่างแน่นอน"
 nomadic_migration_contract_4_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0035.t: "$nomadic_migration_contract_4_desc_title$"
 mpo_contract_events.0035.desc: "การอพยพครั้งล่าสุดไปยัง [task_contract.GetLocation.GetName] ได้ส่งผลกระทบต่อผู้คนของข้า และพวกเขากำลังขาดแคลนเครื่องมือพื้นฐานหลายอย่างที่ใช้ในชีวิตประจำวัน มัน ทำให้แม้ แต่งานที่ง่ายที่สุดก็ยังช้าลง\n\nหากไม่มีพ่อค้าที่สามารถนำสินค้าที่เราต้องการมาให้ ผู้คนของข้าก็จะยังคงต้องทนทุกข์ต่อไป"
 mpo_contract_events.0035.a: "พ่อค้าของเราจะจัดการเรื่องนี้เอง"
 mpo_contract_events.0035.b: "เราจะหาพ่อค้าเพื่อจัดหาเครื่องมือ"
 mpo_contract_events.0035.c: "ชื่อเสียงของข้าเป็นที่รู้จักไปทั่วทุกสารทิศ จะต้องมีใครสักคนจัดการเรื่องนี้"
 mpo_contract_events.0035.d: "ผู้คนจะต้องอยู่โดยไม่มีมันไปก่อน"
 EVENT_WINDOW_OPTION_AVAILABLE_TRADE_YURT: "ทางเลือกนี้มีอยู่ เนื่องจาก [GetDomicileBuilding('trade_yurt_01').GetName]"
 mpo_si_lacking_tools: "ขาดแคลนเครื่องมือ"
 mpo_si_lacking_tools_desc: "ผู้คนของตัวละครนี้ไม่มีเครื่องมือที่จะดูแลเผ่าของตนได้อย่างเหมาะสม"
 mpo_si_lacking_tools_2: "$mpo_si_lacking_tools$"
 mpo_si_lacking_tools_2_desc: "$mpo_si_lacking_tools_desc$"
 mpo_si_lacking_tools_3: "$mpo_si_lacking_tools$"
 mpo_si_lacking_tools_3_desc: "$mpo_si_lacking_tools_desc$"

 # Contract 5
 nomadic_migration_contract_5_contract: "$nomadic_migration_contract_5_desc_title$"
 nomadic_migration_contract_5_desc_title: "การแตกแยกของเผ่า"
 nomadic_migration_contract_5_desc: "เนื่องจากถูกตัดขาดจากผู้คนส่วนที่เหลือภายใต้การนำของข้า เผ่าใน [TaskContract.GetLocation.GetName] ได้เรียกร้องหัวหน้าเผ่าในท้องถิ่น"
 nomadic_migration_contract_5_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0045.t: "$nomadic_migration_contract_5_desc_title$"
 mpo_contract_events.0045.desc: "เผ่า [task_contract.GetLocation.GetName] แม้กระทั่งก่อนที่เราจะอพยพมายังบริเวณนี้ ก็มักจะไม่ค่อยติดต่อกับส่วนที่เหลือของ [ROOT.Char.GetPrimaryTitle.GetName] อยู่บ้างแล้ว บัดนี้ ดูเหมือนว่าพวกเขาต้องการความเป็นอิสระมากขึ้นและมีหัวหน้าเผ่าของตนเองอย่างเหมาะสมยิ่งกว่าเดิม\n\nเมื่อข้ามาถึง ปรากฏว่าเป็น [new_chieftain.GetWomanMan] นามว่า [new_chieftain.GetFirstName] ซึ่งดูเหมือนจะเป็นตัวแทนของพวกเขา [new_chieftain.GetSheHe|U] ดูเหมือนจะเป็น [new_chieftain.GetWomanMan] ที่มีเหตุผล ยินดีที่จะสาบานตนเชื่อฟังข้าตราบใดที่ผู้คนของ [new_chieftain.GetHerHis] ได้รับอนุญาตให้ดำเนินชีวิตตามวิถีของตนเอง"
 mpo_contract_events.0045.a: "เราสามารถพูดคุยเรื่องนี้กันได้"
 mpo_contract_events.0045.a.successful: "ข้าโน้มน้าวพวกเขาได้สำเร็จ"
 mpo_contract_events.0045.a.failure: "พวกเขายังคงไม่ถูกโน้มน้าว"
 mpo_contract_events.0045.b: "[new_chieftain.GetFirstNameNoTooltip] ใช่หรือไม่? ให้ [new_chieftain.GetHerHim] ปกครองพวกเขาเถิด"
 mpo_contract_events.0045.b.tt: "[task_contract.GetLocation.GetName] อาจกลายเป็น [divergent_culture|E] ของ [task_contract.GetLocation.GetCulture.GetName]"
 mpo_contract_events.0045.c: "ของขวัญเล็กน้อยจะเตือนให้พวกเขาระลึกถึงทุกสิ่งที่ข้าทำเพื่อพวกเขา"
 mpo_contract_events.0045.d: "พวกเขาจะคุ้นเคยกับมันไปเอง"
 mpo_si_accepting_cultures: "การยอมรับการแตกแยกทางวัฒนธรรม"
 mpo_si_accepting_cultures_desc: "ตัวละครนี้ได้ยอมรับการแตกแยกของเผ่าต่างๆ ออกจากเผ่าของตนเอง"

 # Contract 6
 nomadic_migration_contract_6_contract: "$nomadic_migration_contract_6_desc_title$"
 nomadic_migration_contract_6_desc_title: "ดินแดนอาบยาพิษ"
 nomadic_migration_contract_6_desc: "ดินแดนรอบๆ [TaskContract.GetLocation.GetName] ดูเหมือนจะมีผลกระทบที่ ทำให้ฝูงสัตว์ในท้องถิ่นของเราอ่อนแอลง ซึ่งล้มป่วยลงด้วยโรคบางอย่างหลังจากตั้งถิ่นฐาน"
 nomadic_migration_contract_6_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0055.t: "$nomadic_migration_contract_6_desc_title$"
 mpo_contract_events.0055.desc: "ฝูงสัตว์ของเราอ่อนแอลง ท่าเดินที่เคยมั่นคงบัดนี้กลับไม่แน่นอน ขณะที่ข้าสังเกตฝูงสัตว์ ข้าเห็นสมาชิกหลายตัวนอนอยู่เฉยๆ โดยไม่มีเรี่ยวแรงที่จะขยับเขยื้อนเลย\n\nตราบใดที่ความอ่อนแอนี้ยังคงแพร่กระจายต่อไป ฝูงสัตว์ทั้งหมดของเราใน [task_contract.GetLocation.GetName] ก็มีความเสี่ยงที่จะติดเชื้อ จะเกิดอะไรขึ้นกับเผ่าของเราหากเป็น เช่นนั้น?"
 mpo_contract_events.0055.a: "พวกมันจะผ่านพ้นไปได้ ข้าจะ ทำให้แน่ใจ"
 mpo_contract_events.0055.a.successful: "ฝูงสัตว์ฟื้นตัว"
 mpo_contract_events.0055.a.failure: "ฝูงสัตว์อาการแย่ลง"
 mpo_contract_events.0055.b: "ข้าจะส่งข่าวออกไปเพื่อหาคนมาช่วยพวกมัน"
 mpo_contract_events.0055.c: "จงฆ่าพวกมันเสีย ก่อนที่มันจะแพร่กระจายไปมากกว่านี้"
 mpo_si_slaughtered_animals: "เนื้อสัตว์ที่เก็บตุนไว้"
 mpo_si_slaughtered_animals_desc: "ตัวละครนี้ได้เก็บตุนเนื้อสัตว์ไว้เป็นจำนวนมาก\n#emp จะถูกลบออกในครั้งต่อไปที่ท่านจัด [GetActivityType('activity_feast').GetName]#!\n\nค่าใช้จ่าย [GetActivityType('activity_feast').GetName]: #P [gold_i]-50%#!"

 # Contract 7
 nomadic_migration_contract_7_contract: "$nomadic_migration_contract_7_desc_title$"
 nomadic_migration_contract_7_desc_title: "เพื่อนบ้านเจ้าปัญหา"
 nomadic_migration_contract_7_desc: "พลม้าจากเผ่าเพื่อนบ้านกำลังออกอาละวาดอย่างไม่ละอายใน [TaskContract.GetLocation.GetName] พร้อมกับนำฝูงสัตว์จำนวนมากเข้ามาด้วย"
 nomadic_migration_contract_7_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0065.t: "$nomadic_migration_contract_7_desc_title$"
 mpo_contract_events.0065.desc: "แม้จะมีจำนวนน้อย พลม้าจาก [neighbor_leader.GetPrimaryTitle.GetBaseName] ก็กำลังขี่ม้าอย่างองอาจผ่าน [task_contract.GetLocation.GetName] พร้อมกับฝูงสัตว์ขนาดใหญ่ภายใต้การนำ ดูเหมือนว่าพวกเขาจะกำลังติดตามฝูงสัตว์ที่หายไปเมื่อเราตั้งถิ่นฐานในบริเวณนี้\n\nแม้ดินแดนนี้อาจจะดูว่างเปล่าเมื่อพวกเขามาถึง ข้าก็ไม่อาจอนุญาตให้พวกเขาผ่านอาณาเขตของข้าไปเฉยๆ ได้\n\n#bold ดินแดนเหล่านี้มีไว้สำหรับฝูงสัตว์ของข้า และฝูงสัตว์ของข้าเพียงผู้เดียวเท่านั้น#!"
 mpo_contract_events.0065.a: "เราจะปล่อยให้พวกเขาจากไปอย่างสันติ แต่ต้องมีค่าตอบแทน"
 mpo_contract_events.0065.a.successful: "พวกเขาจ่ายค่าตอบแทน"
 mpo_contract_events.0065.a.failure: "เราไม่สามารถขัดขวางพวกเขาได้"
 mpo_contract_events.0065.b: "นี่คือดินแดน #emp ของเรา#! และนั่นคือฝูงสัตว์ #emp ของเรา#!"
 mpo_contract_events.0065.c: "ปล่อยพวกเขาไป"

 # Contract 8
 nomadic_migration_contract_8_contract: "$nomadic_migration_contract_8_desc_title$"
 nomadic_migration_contract_8_desc_title: "สิ่งที่หลงเหลือ"
 nomadic_migration_contract_8_desc: "ดูเหมือนว่าเราจะพบกับซากของกลุ่มคนก่อนหน้าที่เคยอยู่ในบริเวณนี้ มีฝูงสัตว์และเยิร์ตที่พังทลายอยู่รอบๆ ค่ายใหม่ของเราใน [TaskContract.GetLocation.GetName]"
 nomadic_migration_contract_8_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0075.t: "$nomadic_migration_contract_8_desc_title$"
 mpo_contract_events.0075.desc: "ขณะที่ข้าเดินทางผ่าน [barony_location.Custom('HoldingNoHoldingTerrainRoaming')] ข้าได้พบกับฝูงสัตว์กึ่งเชื่องที่ถูกพบเห็นหลายครั้ง แม้จะเข้าใกล้พวกมัน ก็เห็นได้ชัดว่าพวกมันเคยมีปฏิสัมพันธ์กับผู้คนมาก่อน\n\nหากปล่อยพวกมันไว้ตามลำพัง พวกมันก็จะยังคงเล็มหญ้าในดินแดนที่ควรจะเป็นของฝูงสัตว์ของเรา ข้าควรจะนำพวกมันกลับไปยัง [ROOT.Char.GetCapitalLocation.GetName] หรือจัดการพวกมันด้วยวิธีอื่น? ทางออกใดที่ดีที่สุดสำหรับผู้คนของข้า?"
 mpo_contract_events.0075.a: "พวกมันจะเป็นส่วนเสริมที่ยอดเยี่ยมให้กับฝูงสัตว์ของเรา"
 mpo_contract_events.0075.b: "จงขับไล่พวกมันออกจาก [task_contract.GetLocation.GetNameNoTooltip]"
 mpo_contract_events.0075.c: "จงฆ่าสัตว์เหล่านั้นเสีย"

 # Contract 9
 nomadic_migration_contract_9_contract: "$nomadic_migration_contract_9_desc_title$"
 nomadic_migration_contract_9_desc_title: "การขีดเส้นแบ่ง"
 nomadic_migration_contract_9_desc: "หลังจากตั้งถิ่นฐานใน [TaskContract.GetLocation.GetName] ก็เกิดความขัดแย้งเกี่ยวกับทุ่งหญ้าที่ดีที่สุดบางแห่งในบริเวณใกล้เคียง [TaskContract.GetEmployer.GetName] พยายามไกล่เกลี่ยสถานการณ์ระหว่างเผ่าต่างๆ แต่ไม่ประสบผลสำเร็จ"
 nomadic_migration_contract_9_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0085.t: "$nomadic_migration_contract_9_desc_title$"
 mpo_contract_events.0085.desc: "[task_contract.GetEmployer.GetName] ได้อธิบายสถานการณ์ให้ข้าฟังอย่างละเอียด ดูเหมือนว่าหลังจากที่เราอพยพมายังบริเวณนี้ เผ่าใน [other_county.GetName] เป็นกลุ่มแรกที่เข้าควบคุมทุ่งหญ้า แต่บริเวณนั้นอยู่ใกล้กับ [task_contract.GetLocation.GetName] มากกว่า\n\nแม้ [task_contract.GetEmployer.GetSheHe] จะพยายามไกล่เกลี่ย แต่ความพยายามของ [task_contract.GetEmployer.GetNamePossessiveNoTooltip] ก็ไม่ประสบผลสำเร็จ ไม่ว่าในกรณีใด ฝ่ายใดฝ่ายหนึ่งจะต้องผิดหวัง แต่การตัดสินใจจะต้องเกิดขึ้นไม่ช้าก็เร็ว"
 mpo_contract_events.0085.a: "ทุ่งหญ้าจะตกเป็นของ [task_contract.GetLocation.GetNameNoTooltip]"
 mpo_contract_events.0085.b: "มันเป็นของ [other_county.GetNameNoTooltip]"
 mpo_si_spurned_tribe: "เผ่าที่ถูกปฏิเสธ"

 # Contract 10
 nomadic_migration_contract_10_contract: "$nomadic_migration_contract_10_desc_title$"
 nomadic_migration_contract_10_desc_title: "เผ่าเก่าแก่"
 nomadic_migration_contract_10_desc: "ค่ายของเราใน [TaskContract.GetLocation.GetName] ได้รับการติดต่อจากชุมชนเล็กๆ ที่เคยอาศัยอยู่ในบริเวณนี้ก่อนที่เราจะอพยพมา"
 nomadic_migration_contract_10_request: "$nomadic_migration_contract_request$"

 mpo_contract_events.0095.t: "$nomadic_migration_contract_10_desc_title$"
 mpo_contract_events.0095.desc: "ค่ายของข้าได้รับการติดต่อจาก [new_chieftain.GetName] ผู้นำของคนเพียงหยิบมือ ภาษาถิ่นของ [new_chieftain.GetHerHis|U] นั้นแปลกหู แต่ [new_chieftain.GetSheHe] พูดด้วยความมั่นใจและภาคภูมิใจเกี่ยวกับผู้คนของ [new_chieftain.GetHerHis] และความยากลำบากของพวกเขา\n\n#emp "[ROOT.Char.GetTitleAsNameNoTooltip] หากท่านสามารถหาที่ให้พวกเราท่ามกลางเยิร์ตของท่านได้ เราจะมอบฝูงสัตว์ของเราและข้าจะรับใช้ท่านเป็นการส่วนตัว หากไม่... ก็ไม่มีอะไรเหลือให้พวกเราในดินแดนเหล่านี้อีกแล้ว"#!"
 mpo_contract_events.0095.a: "เราจะรับพวกเขาไว้"
 mpo_contract_events.0095.b: "พวกเขาไม่ได้อยู่ที่นี่ จงกำจัดพวกเขาเสีย"
 mpo_si_old_tribe: "เผ่าต่างถิ่น"
 
 herd_starvation_title: "ฝูงสัตว์อดอยาก!"
