mpo_migrating_without_labor_modifier: "การอพยพที่ขาดแรงงาน"
mpo_migrating_without_labor_modifier_desc: "ตัวละครนี้เคลื่อนย้ายผู้คนของตนผ่านดินแดนโดยปราศจากความช่วยเหลือจากนักรบรุ่นเยาว์ของตน"
mpo_found_paths_for_herds_modifier: "เส้นทางอันราบรื่นสำหรับฝูงสัตว์"
mpo_found_paths_for_herds_modifier_desc: "ผู้นำผู้ชาญฉลาดนี้ชี้นำฝูงสัตว์ของตนด้วยวิจารณญาณอันเฉียบแหลมและความเข้าใจในผืนดิน"
