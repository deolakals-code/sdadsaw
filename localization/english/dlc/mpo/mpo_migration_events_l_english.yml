migration_events.1051_title: "การปล้นสะดมระหว่างอพยพ"
migration_events.1051_tooltip: "ผู้คนของท่านปล้นสะดม [raided_settlement.GetName]"

migration_events.1050.t: "ผ่านไปดุจเปลวไฟ"
migration_events.1050.desc: "พลม้าสอดแนมของข้า ซึ่งกระจายตัวออกไปไกลเกินกว่าฝูงสัตว์และเกวียนของเรา เที่ยวท่องไปในดินแดนที่ผ่านไปดุจเสือดาว\n\n"พวกคนท้องถิ่นยิงธนูดอกแรกใส่เรา!" [warrior.GetFirstName] หัวหน้าพลม้าสอดแนมของข้ารายงาน "แต่ด้วยไฟและดาบ เรา ทำให้พวกมันต้องเสียใจ! เรานำของที่ริบมาได้ทั้งหมดจากค่ายของพวกมันมาให้ท่าน — และ [newly_created_artifact.GetName] นี้ด้วย!""
migration_events.1050.a: "ความดุร้ายของ [warrior.GetFirstNamePossessiveNoTooltip] สมควรได้รับรางวัล"
migration_events.1050.b: ""#EMP จงบุกโจมตีทุกบ้านที่เราผ่านไป เหล่านักรบของข้า!#!""
migration_events.1050.c: "จงคืนของที่ริบมาได้ และขออภัยโทษจากนายของพวกเขา"
migration_events.1050.d: "จงแจกจ่ายของที่ริบมาได้ให้แก่นักรบของข้า"
migration_events.1050.e: "ข้าอ้างสิทธิ์ในของที่ริบมาได้จาก [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]"

migration_events.1060.t: "เชื่องช้าดุจฝูงแกะ"
migration_events.1060.desc_desert: "ฝูงสัตว์ของข้ากระหายน้ำ แต่ตลอดเส้นทางผ่าน [root_location.GetName] นั้นมีน้ำน้อยนัก เราค่อยๆ เคลื่อนตัวไปอย่างช้าๆ ใต้แสงอาทิตย์อันแผดเผา"
migration_events.1060.desc_forest: "ต้นไม้ใน [root_location.GetName] ยืนต้นหนาแน่นดุจทหารราบ และพงหญ้าก็หนาทึบยิ่งกว่า หนามเกี่ยวพันขนแกะของข้า เราบังคับฝูงสัตว์ของเราไปตามเส้นทางแคบๆ"
migration_events.1060.desc_wetlands: "เส้นทางของเราผ่าน [root_location.GetName] นั้นเหมือนกับการผ่านลำไส้: เต็มไปด้วยโคลนเหนียวเหม็นและบ่อน้ำเน่า สัตว์ของข้าเดินโซซัดโซเซเปียกปอน ร้องครวญครางด้วยความเศร้าโศก ครั้งแล้วครั้งเล่าที่ผู้คนของข้าต้องช่วยพวกมันให้พ้นจากหล่มโคลน"
migration_events.1060.desc_hilly: "เส้นทางของเราผ่าน [root_location.GetName] คดเคี้ยวขึ้นเนินสูงชัน ลงสู่หุบเขาแคบๆ และ ทำให้ทั้งคนและสัตว์เหนื่อยล้า คนเลี้ยงสัตว์ของข้าใช้ไหล่ดันวัวที่ไม่เต็มใจจะเดิน ตะโกนและลากจูง แต่ถึงกระนั้น สัตว์ที่เหนื่อยล้าก็แทบจะไม่ยอมปีนป่าย"
migration_events.1060.desc_winter: "หิมะขาวโพลนปกคลุมดินแดนใน [root_location.GetName] และเส้นทางของเราต้องฝ่าฟันไปด้วยการเตะและเดินลุยความหนาวเหน็บ ฝูงสัตว์ของข้าเบียดเสียดกันเพื่อความอบอุ่น และเคลื่อนตัวช้าลงด้วยความหิวโหย"
migration_events.1060.desc: "\n\n[warrior.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('warrior'))|l] ของข้าไม่มีความอดทนต่อความเชื่องช้าอันน่าสังเวชนี้\n\n"ให้ข้ารวบรวมเหล่านักรบรุ่นเยาว์เถิด!" [warrior.GetSheHe] อ้อนวอน "เราจะควบม้าไปยัง [destination.GetNameNoTier] และเตรียมพร้อมสำหรับการมาถึงของท่าน งานหนัก เช่นนี้ การผลักดันวัวและแพะ เช่นนี้ ต่ำต้อยเกินไปสำหรับนักรบของท่าน!""
migration_events.1060.a: "ข้าจะหาเส้นทางที่สะดวกและรวดเร็วกว่านี้"
mpo_migration_events.1060.a.success: "ท่านนำผู้คนของท่านไปสู่เส้นทางที่ราบรื่นกว่า"
mpo_migration_events.1060.a.failure: "การอ้อมที่เหน็ดเหนื่อยและโง่เขลา"
migration_events.1060.b: ""ไปเถิด ไปสอดแนมบ้านใหม่ของเรา! เตรียมมันให้พร้อม""
migration_events.1060.c: ""จงอยู่ และช่วยเหลือผู้อ่อนแอ พวกเขาต้องการความแข็งแกร่งของเจ้า""

