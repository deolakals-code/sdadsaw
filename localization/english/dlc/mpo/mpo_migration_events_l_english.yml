l_english: 

 migration_events.0001.t: "สถานที่อันจักเรียกว่าบ้าน"
 migration_events.0001.desc.intro: "ผืนฟ้าอันไร้เมฆากำลังจะเปลี่ยนเป็นสีแดงฉานเมื่อเรามาถึง [ROOT.Char.GetCurrentLocation.GetName] สีดุจดังบาดแผลสดใหม่\n\n"
 migration_events.0001.desc.drought: "แผ่นดินอันแตกระแหงต้อนรับเราด้วยสีสันอันซีดเซียว ภัยแล้งมิได้ปรานี ณ ที่แห่งนี้เลย\n\n"
 migration_events.0001.desc.white_zud: "หิมะอันอ่อนนุ่มแตกกระจายใต้กีบม้าของเรา ชั้นหิมะนั้นหนาเสียจนปกคลุมผืนหญ้าจนมิดสิ้น\n\n"
 migration_events.0001.desc.havsarsan_zud: "ทั้งฝน ทั้งหิมะ ทั้งลมแรง อากาศมิได้ต้อนรับเราอย่างที่เราหวังไว้เลย\n\n"
 migration_events.0001.desc.blessing: "แสงสุริยันอาบไล้บุปผาที่เบ่งบานสะพรั่ง ปกคลุมท้องทุ่งไกลสุดสายตา ข้าแหงนหน้าขึ้น ปล่อยให้ตนเองได้สัมผัสความอบอุ่นนั้น\n\n"
 migration_events.0001.desc.tributary: ""ดินแดนเหล่านี้ถวายเครื่องบรรณาการอย่างเคร่งครัดแด่ [overlord.GetTitledFirstName]"" [recipient.GetTitledFirstName] เตือนเรา ""ข้ามิคาดว่า [overlord.GetSheHe] จะยอมให้เป็นอื่นไปได้""\n\n"
 migration_events.0001.desc.nomad: ""จงดูแลผืนดินนี้ให้ดี"" [recipient.GetTitledFirstName] พบเราที่ทางเข้าถิ่นฐาน แม้ผู้คนส่วนใหญ่จะจากไปแล้วก็ตาม\n\n"
 migration_events.0001.desc.herder: "[recipient.GetTitledFirstName] นำทางฝูงสัตว์เล็กๆ ของ [recipient.GetHerHis] ไปด้วยความยากลำบาก หายลับไปในระยะไกล\n\n"
 migration_events.0001.desc.nomad_obedient: ""ท่าน [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า"" [recipient.GetTitledFirstName] พบเราที่ทางเข้าถิ่นฐาน ""นับเป็นเกียรติอย่างยิ่งที่ข้าได้มอบดินแดนของข้าให้แก่ท่าน\n\n"""
 migration_events.0001.desc.nomad_angry: "[recipient.GetTitledFirstName] อยู่ท้ายขบวนผู้คนที่กำลังออกจากค่าย ""โชคดี"" [recipient.GetSheHe] กล่าวอย่างเย็นชาก่อนจะเข้าร่วมกับพวกเขา\n\n"
 migration_events.0001.desc.good: "กลิ่นทุ่งหญ้าสดใหม่นั้นเปี่ยมด้วยความหวังดังที่ข้าปรารถนา เราจะอยู่รอดได้เป็นอย่างดี"
 migration_events.0001.desc.bad: "ทุ่งหญ้าแห้งเหลืองเหี่ยวเฉาขณะดวงตะวันลับขอบฟ้า มันจะไม่ง่ายดายนัก แต่ชีวิตที่ง่ายดายมิเคยสร้างนักรบผู้ทรงคุณค่า"
 migration_events.0001.desc.meh: "คุณภาพทุ่งหญ้าไม่ดีเท่าที่ข้าต้องการนัก น้อยสิ่งนักในชีวิตที่จะเป็นดั่งใจหวัง"
 migration_events.0001.aaa: "ข้าจักเคารพประเพณีของดินแดนนี้"
 migration_events.0001.aa: "ข้ามิยอมก้มหัวให้ผู้ใด"
 migration_events.0001.aa.cb_tt: "ได้รับ #EMP $retaliation_cb$#! [casus_belli|E] ต่อท่านเป็นเวลา #V 5#! ปี"
 migration_events.0001.a: "ในที่สุด เราก็มาถึงสถานที่อันถูกต้องแล้ว"
 migration_events.0001.a.tt: "ทางเลือกนี้มีอยู่ เนื่องจากท่านได้ทำตามความปรารถนาของ [GetCourtPositionType('court_astrologer_court_position').GetName()] ของท่าน"
 migration_events.0001.b: "มากางกระโจมกันเถิด"
 astrologer_desired_area_modifier: "การอพยพที่ปรารถนา"
 astrologer_desired_area_modifier_desc: "ด้วยการทำตามความปรารถนาของ $court_astrologer_court_position$ ของพวกเขา ผู้คนของตัวละครนี้จึงมุ่งมั่นที่จะดูแลทุ่งหญ้าใหม่ของตนอย่างดีที่สุดเท่าที่จะเป็นไปได้"
 msg_tributary_toast: "การเสนอเครื่องบรรณาการ"
 msg_tributary_toast_tt: "[new_tributary.GetShortUIName] ได้ย้ายไปยังดินแดนที่ถูกครอบครองโดยหนึ่งใน [tributaries|E] ของท่าน และได้ยอมอ่อนน้อมต่อท่าน"
 msg_tributary_toast_bad: "การปฏิเสธเครื่องบรรณาการ"
 msg_tributary_toast_bad_tt: "[new_tributary.GetShortUIName] ได้ย้ายไปยังดินแดนที่ถูกครอบครองโดยหนึ่งใน [tributaries|E] ของท่าน\nท่านได้รับ $retaliation_cb$ [casus_belli|E] ต่อ [new_tributary.GetHerHim] เป็นเวลา #V 5#! ปี"
 
 migration_events.0002.t: "การอพยพ: ดินแดนที่ยึดครอง"
 migration_events.0002.desc.intro: "โลหิตไหลอาบข้อศอกข้า ย้อมผืนดิน เราได้ชัยชนะเหนือดินแดนใหม่เหล่านี้แล้ว และอีกไม่ช้ากระโจมของเราก็จะถูกกางขึ้น\n\n"
 migration_events.0002.desc: "อย่างไรก็ตาม ผู้ปกครองคนก่อนเคยถวายเครื่องบรรณาการแก่ [overlord.GetTitledFirstName] และ [overlord.GetSheHe] จะไม่ยอมรับสิ่งใดที่แตกต่างไปจากเรา"
 migration_events.0002.desc.high_dominance: "กล่าวกันว่า [overlord.GetTitledFirstName] คือเจ้าเหนือหัวของดินแดนเหล่านี้ ดังที่ [recipient.GetTitledFirstName] เคยถวายเครื่องบรรณาการแก่ [overlord.GetHerHim] เป็นประจำ เราแข็งแกร่งเท่าเทียมกับ [overlord.GetSheHe] เหตุใดเราจึงต้องยอมสยบแทบเท้า [overlord.GetHerHis] และอ้อนวอนขอความคุ้มครอง?"
 migration_events.0002.a: "มันเป็นเพียงความยุติธรรม"
 migration_events.0002.b: "ข้าได้ชัยชนะเหนือดินแดนของข้าแล้ว!"
 migration_events.0002.b.alt: "ฮ่า ให้ [overlord.GetHerHim] มาเถิดหาก [overlord.GetSheHe] ต้องการทองคำของข้า"

 migration_events.1000.t: "แหล่งทุ่งหญ้าเขียวขจี"
 migration_events.1000.desc: "เหล่าอาชาในเผ่าของข้าหอบเหนื่อยและส่งเสียงฟืดฟาด กระหายที่จะลิ้มรสหญ้าท้องถิ่น ณ ที่แห่งนี้ ใน [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier] หญ้างอกงามหนาแน่นและเขียวขจีบนพื้นดิน ณ ที่แห่งนี้ เหล่าชนท้องถิ่นผู้มั่งคั่ง"
 migration_events.1000.desc.ruler_present: "ขึ้นตรงต่อ [local_ruler.GetFirstName] [local_ruler.GetTitleAsNameNoTooltip] ชาว [local_ruler.GetCulture.GetName] ผู้น้อยนิด"
 migration_events.1000.desc.ruler_away: "ภักดีต่อ [local_ruler.GetTitledFirstName] ชาว [local_ruler.GetCulture.GetName] แม้จะไม่เห็นพลม้าของ [local_ruler.GetHerHis] เลยก็ตาม"
 migration_events.1000.desc_outro: "\n\nเราได้รับการต้อนรับอย่างอบอุ่น มีผู้นำนมและเนื้อมามอบให้... แต่ด้วยน้ำเสียงสั่นเครือ เหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] ของข้าถูกเร่งเร้าให้ออกเดินทางต่อไป"
 migration_events.1000.a: "มาร์มอต เซเบิล... ที่นี่มีหนังสัตว์ดีๆ ให้ล่า"
 migration_events.1000.a.flavor: "ท่านล่าสัตว์ป่าท้องถิ่นบางส่วน"
 migration_events.1000.b: ""#EMP ของกำนัล! เครื่องบรรณาการ!#! หรือมิ เช่นนั้นเราจะจู่โจมพวกเจ้าดุจหมาป่า!""
 migration_events.1000.b.flavor: "ท่านขูดรีดจากชนท้องถิ่นผู้มั่งคั่งและปล้นสะดมค่ายของพวกเขา"
 migration_events.1000.c: "ฝูงสัตว์ของข้าจะเล็มหญ้าที่นี่สักพัก"
 migration_events.1000.d: "ข้าขอบใจ แล้วจึงขึ้นหลังม้า"
custom.every_consort: "[spouse|E] และ [concubine|E] ทุกคน"
nomadic_comforts_modifier: "ความสะดวกสบายในการเดินทางแบบชนร่อนเร่"
nomadic_comforts_modifier_desc: "ชนร่อนเร่ผู้หาได้ยากนี้เลือกความปลอดภัยอันสะดวกสบายแทนที่จะอยู่บนหลังม้า"

migration_events.1010.t: "เหตุใดต้องเดินเตาะแตะเมื่อท่านขี่ได้?"
migration_events.1010.desc: "จากเยิร์ตขนาดใหญ่บนล้อเลื่อน ซึ่งใต้ธงหางม้าอันเป็นสัญลักษณ์ใจกลางขบวนทัพของเรา [spouse.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))|l] ของข้าก็ออกมา\n\n"วัวผู้ยิ่งใหญ่จะร่ำไห้หรือ เมื่อน้ำหนักของ [ROOT.Char.GetWomanMan] คนหนึ่งถูกเพิ่มเข้าไปในภาระของมัน?" นางถาม "ไม่หรือ? เช่นนั้น บางทีท่านอาจจะมานั่งกับครอบครัวของท่าน...?"\n\nบ้านของข้าถูกลากจูงโดยวัว เช่นนั้นหลายตัว และภายในก็มีเบาะอันอบอุ่น แต่เหล่าสหายนักรบของข้ามองมาอย่างตัดสิน"
migration_events.1010.a: "ร่างกายข้าต้องการพักผ่อน"
migration_events.1010.b: ""ยอดรักของข้า... หนทางข้างหน้าอาจจะ #EMP ขรุขระ#!""
migration_events.1010.c: ""ข้าขี่ม้านำหน้าเหล่า [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้าเสมอ""
migration_events.1010.d: "ข้าจะก้าวขึ้นไป"
migration_events.1010.d.flavor: "หลังจากขี่ม้ามาหลายชั่วโมง... [ROOT.Char.GetWomanMan] ย่อมปรารถนาความสะดวกสบายอันโคลงเคลงและสั่นสะเทือนของบ้าน"

migration_events.1020.t: "นายแห่งเหล่าคนเลี้ยงแกะ"
migration_events.1020.desc: ""[ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier] พวกเขาเรียกสถานที่นี้ เช่นนั้น!" [aspirant.GetFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l] ของข้าถ่มน้ำลาย "ฝูงแกะของมัน... ผู้ใดเล่าจะคุ้มครองพวกมัน? สุนัขตัวหนึ่ง และ [herder.GetWomanMan] ผู้น้อยนาม [herder.GetTitledFirstName]!"\n\n"ม้าเพียงไม่กี่ตัว นักรบฝีมือดีเพียงไม่กี่คน — #EMP คอของ [herder.GetFirstNamePossessiveNoTooltip] อยู่ในกำมือข้า#! — และ [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] ก็อาจเป็นของข้า!"\n\n[aspirant.GetFirstNameNoTooltip] มองแพะที่เดินผ่านไปอย่างละโมบ... และรอคอยพรจาก [aspirant.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l] ของ [aspirant.GetHerHis]"
migration_events.1020.a: ""เจ้าจะต้องส่งเครื่องบรรณาการให้ข้า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l]""
migration_events.1020.b: ""ไปเถิด และจงใช้อำนาจแห่ง [ROOT.Char.GetHouse.GetNameNoTooltip]!""
migration_events.1020.b.flavor: "ท่านเห็นว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l] ของท่านได้ตั้งหลักปักฐานที่นี่อย่างดีแล้ว"
migration_events.1020.c: ""จงนำผู้ติดตามกลุ่มเล็กๆ ไป และกล่าวอำลาญาติของเจ้าเสีย""
migration_events.1020.d: ""จงอยู่กับผู้คนของเจ้าเถิด [aspirant.GetFirstNameNoTooltip]""

migration_events.1030.t: "เส้นทางอันกันดาร"
migration_events.1030.desc: "เรายังคงต้อนฝูงม้า วัว แพะ และแกะจำนวนมหาศาลของข้าต่อไป หากเราผ่านทุ่งหญ้าที่ดี สัตว์ทั้งหลายก็จะได้พักผ่อนและกินอาหาร... แต่ที่ดินเปิดโล่ง ซึ่งหญ้ามิได้ถูกเล็มจนเตียนนั้นหาได้ยากใน [location_county.GetNameNoTier]\n\nเราอนุญาตให้ม้าที่ดีที่สุดของข้าเล็มหญ้าที่มีอยู่ ส่วนที่เหลือก็อ่อนแอลงด้วยความหิวโหย"
migration_events.1030.a: "ผู้ปกครองท้องถิ่น #EMP จักต้อง#! ให้เราใช้ดินแดนที่ดีที่สุดของ [local_ruler.GetHerHis]"
migration_events.1030.b: "ข้าอาจจะแลกเปลี่ยนสัตว์ที่อ่อนแอที่สุดออกไป..."
migration_events.1030.b.flavor: "ของที่ท่านนำเสนอเหมือนใกล้ตายเต็มที แต่ [local_ruler.GetNameNoTooltip] ก็ยังอาจถูกโน้มน้าวให้ซื้อได้"
migration_events.1030.c: "หากพวกมันจะตาย... ก็ให้พวกมันถูกกินเสียยังดีกว่า"
migration_events.1030.c.flavor: "จงฆ่าปศุสัตว์และจัดงานเลี้ยงให้แก่ผู้คนของท่าน"
migration_events.1030.d: "เราต้องค้นหาทุ่งหญ้าที่ดีในดินแดนนี้"
migration_events.1030.d.success: "ท่านนำฝูงสัตว์ของท่านไปสู่อิ่มท้อง"
migration_events.1030.d.failure: "ท่านไม่พบสิ่งใดเลย และสัตว์ทั้งหลายก็อดอยาก"

 migration_events.1040.t: "การต้อนรับใน [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]"
 migration_events.1040.desc: "ด้วยการทักทายอย่างอบอุ่น ผู้ปกครองท้องถิ่น — [local_ruler.GetName] — เข้ามาใกล้ เหล่า [ROOT.Char.GetCulture.GetCollectiveNoun] และสัตว์ของพวกเขาหลั่งไหลผ่านพวกเราไป\n\n"[ROOT.Char.GetTitleAsName] ท่านจะนั่งเคียงข้างข้าและร่วมรับประทานอาหารอุ่นๆ สักมื้อหรือไม่?" [local_ruler.GetFirstNameNoTooltip] ถาม ตามธรรมเนียมปฏิบัติต่อนักเดินทาง\n\nผู้ติดตามของ [local_ruler.GetHerHis|U] มอบของกำนัลให้แก่ข้า:"
 migration_events.1040.furs: "เครื่องประดับแกะสลักจากเขากวาง หนังสัตว์ และม้าตอนหนุ่มที่คึกคัก"
 migration_events.1040.camels: "น้ำเย็นจากแหล่งน้ำพุในท้องถิ่น และอูฐสูงเป็นทิวแถว"
 migration_events.1040.wool: "เสื้อคลุมขนสัตว์เนื้อดี ฝูงแกะ และแพะตัวผู้สูงเท่าม้าพ่อพันธุ์"
 migration_events.1040.horses: "บังเหียนหนังเนื้อดีและม้าที่แข็งแรงสองตัว"
 migration_events.1040.a: ""#EMP นี่#! คือทั้งหมด...? นี่คือทั้งหมดที่เจ้าให้ข้าหรือ...?""
 migration_events.1040.b: "ด้วยความยินดี ข้าแลกของกำนัลต่อของกำนัล"
 migration_events.1040.c: "ไม่มีเวลาสำหรับเจ้า [local_ruler.GetTitleAsNameNoTooltip] ผู้น้อยเอ๋ย"
 migration_events.1040.d: "ข้าจะกิน"

 mpo_refusing_diplomatic_stops_modifier: "การเมินเฉยต่อการหยุดพักทางการทูต"
 mpo_refusing_diplomatic_stops_modifier_desc: "ชนร่อนเร่ผู้นี้ขับเคลื่อนผู้คนของตนไปข้างหน้าเสมอ ผ่านเลยชนท้องถิ่นที่เป็นมิตรและธรรมเนียมอันดีงามของพวกเขา"
