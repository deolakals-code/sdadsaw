mpo_migration_prepared_home_modifier_desc: "ได้พบจุดที่ดีที่สุดสำหรับตั้งถิ่นฐานของชนร่อนเร่แล้ว และได้กำจัดสิ่งกีดขวางในท้องถิ่นออกไปแล้ว"
