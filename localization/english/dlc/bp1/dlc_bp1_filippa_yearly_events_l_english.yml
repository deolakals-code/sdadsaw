 bp1_yearly.2070.desc:0 "ข้าสังเกตเห็น [bp1_yearly_2070_soulmate.GetFirstName] ดูเศร้าหมองและห่างเหินเมื่อเร็วๆ นี้ ในระหว่างการเดินป่าตามประเพณีของเราผ่านทิวทัศน์ริมบ้าน ข้ารวบรวมความกล้าที่จะเผชิญหน้ากับ [bp1_yearly_2070_soulmate.GetHerHim]\n\n"เจ้าสังเกตเห็นสินะ" [bp1_yearly_2070_soulmate.GetSheHe|U] เดินช้าลง ในที่สุดก็หยุดลง ชมทิวทัศน์ แสงแดดส่องประกายบนผิวของ [bp1_yearly_2070_soulmate.GetHerHis]\n\n"ข้ารักเจ้า และข้ารักชีวิตของเราด้วยกัน" ดวงตาของ [bp1_yearly_2070_soulmate.GetHerHis|U] คลอไปด้วยน้ำตา "ความเสียใจเพียงอย่างเดียวของข้าคือข้าไม่สามารถมอบลูกให้เจ้า หรือ เอ่อ พวกเรา เพื่อทิ้งไว้เบื้องหลังในโลกนี้ได้"\n\nคำพูดของ [bp1_yearly_2070_soulmate.GetHerHis|U] ดังก้องอยู่ในหูข้า การแบกรับภาระนั้นเพียงลำพัง [bp1_yearly_2070_soulmate.GetFirstName] ผู้แสนหวานและเข้มแข็งของข้า!"
