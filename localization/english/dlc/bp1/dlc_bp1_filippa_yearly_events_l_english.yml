l_english: 
 #A spouse/consort attempts to influence you into changing your heir
 bp1_yearly.2020.t:0 "ความคาดหวังอันยิ่งใหญ่"
 bp1_yearly.2020.desc:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] เข้ามาหาข้าพเจ้าพร้อมรอยยิ้มอันเป็นมิตร "ยอดรักของข้า! ท่านเห็นหรือไม่ว่า [bp1_yearly_2020_child_to_become_heir.GetFirstName] ของเราสง่างามเพียงใดแล้วในบัดนี้? [bp1_yearly_2020_child_to_become_heir.GetSheHe|U] แทบจะปกครองแว่นแคว้นนี้ได้แม้จะถูกมัดมือไว้ข้างหนึ่งของ [bp1_yearly_2020_child_to_become_heir.GetHerHis] ; และข้าขอสาบานต่อ [bp1_yearly_2020_influencing_partner.GetFaith.HighGodNameAlternate] ว่า [bp1_yearly_2020_child_to_become_heir.GetSheHe] จะ ทำให้ท่านภาคภูมิใจเป็นอย่างยิ่ง"\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] ชำเลืองมองข้าพเจ้าด้วยหางตา "แน่นอน หากมี #EMP สิ่งใดก็ตาม#! ที่ข้าพอจะทำได้เพื่อ ทำให้ความคิดนี้น่าสนใจยิ่งขึ้น... ข้ามั่นใจว่าท่านจะแจ้งให้ข้าทราบ และเราคงจะบรรลุข้อตกลงบางอย่างได้นะ [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)] ผู้งดงามของข้า" รอยยิ้มเยาะหยันระบายอยู่บนริมฝีปากของ [bp1_yearly_2020_influencing_partner.GetHerHis]\n\n#EMP สิ่งใดก็ได้#! ที่นางกล่าวรึ?"
 bp1_yearly.2020.a:0 "นำหัวของ [bp1_yearly_2020_target.GetFirstNamePossessiveNoTooltip] ไอ้ [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] มาให้ข้าบนถาด"
 bp1_yearly.2020.b:0 "ข้า #EMP สนใจ#! ข้าราชบริพารที่ #EMP มีประโยชน์#! มากกว่า"
 bp1_yearly.2020.b_tt:1 "[bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip] จะเสนอข้าราชบริพารผู้มีทักษะให้ท่านเลือกสรร "
 bp1_yearly.2020.c:0 "คลังของข้า #EMP ว่างเปล่า#! ทีเดียว"
 bp1_yearly.2020.c_tt_only_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] เสนอฮุคต่อ [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_only_hook') )] [bp1_yearly_2020_influencing_partners_parent_only_hook.GetTitledFirstName] ของ [bp1_yearly_2020_influencing_partner.GetHerHis]"
 bp1_yearly.2020.c_tt_halfsies:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] ได้รับการสนับสนุนครึ่งหนึ่งจากและจะเสนอฮุคต่อ [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_halfsies') )] [bp1_yearly_2020_influencing_partners_parent_halfsies.GetTitledFirstName] ของ [bp1_yearly_2020_influencing_partner.GetHerHis]"
 bp1_yearly.2020.c_tt_pay_and_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] ได้รับการสนับสนุนจากและจะเสนอฮุคต่อ [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_pays') )] [bp1_yearly_2020_influencing_partners_parent_pays.GetTitledFirstName] ของ [bp1_yearly_2020_influencing_partner.GetHerHis]"
 bp1_yearly.2020.d:0 "นี่ดูน่า #EMP สงสัย#! อย่างยิ่ง ทหาร!"
 bp1_yearly.2020.d_tt:0 "ใครจะรู้ว่า [bp1_yearly_2020_influencing_partner.GetSheHe] อาจกำลังวางแผนอะไรอื่นอีก!"
 bp1_yearly.2020.e:1 "ข้าไม่ต้องการสิ่งใดจากเจ้า [bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip]"
 #Spouse brings up a bunch of skilled people for you to recruit
 bp1_yearly.2021.t:0 "บุคคลผู้เป็นที่ยอมรับ"
 bp1_yearly.2021.desc:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] ตามข้ามาทันอีกครั้ง "[bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)|U]! ข้ามาพร้อมข่าว!" [bp1_yearly_2020_influencing_partner.GetSheHe|U] รีบมาข้างกายข้า เผยแผ่นผ้านุ่มที่มีข้อความขีดเขียนขณะทำ เช่นนั้น "คนดีๆ เหล่านี้ยินดีอย่างยิ่งที่จะมาทำงานให้ท่าน ที่ราชสำนักของเรา!"\n\nข้ามองดูแผ่นผ้า เหล่านี้คือชุดทักษะที่น่าประทับใจ ข้ายอมรับเรื่องนั้นกับ [bp1_yearly_2020_influencing_partner.GetHerHim]!"
 bp1_yearly.2021.a:0 "นักรบผู้ฝึกฝนมานี้มี #EMP อำนาจ#! บางอย่าง"
 bp1_yearly.2021.a_tt:0 "[bp1_yearly_2021_martial_person.GetShortUIName|U] เข้าร่วมราชสำนักของท่าน"
 bp1_yearly.2021.b:0 "ผู้มีการศึกษาคงจะเป็นประโยชน์ต่อราชสำนักข้าแน่"
 bp1_yearly.2021.b_tt:0 "[bp1_yearly_2021_learning_person.GetShortUIName|U] เข้าร่วมราชสำนักของท่าน"
 bp1_yearly.2021.c:0 "ทักษะการคลังของคนผู้นี้สูงส่งนัก!"
 bp1_yearly.2021.c_tt:0 "[bp1_yearly_2021_stewardship_person.GetShortUIName|U] เข้าร่วมราชสำนักของท่าน"
 bp1_yearly.2021.d:0 "การทูตดูเหมือนจะเป็นทางเลือกที่เหมาะสม"
 bp1_yearly.2021.d_tt:0 "[bp1_yearly_2021_diplomacy_person.GetShortUIName|U] เข้าร่วมราชสำนักของท่าน"
 bp1_yearly.2021.e:0 "ผู้สมัครที่น่า #EMP สนใจ#! อย่างยิ่ง!"
 bp1_yearly.2021.e_tt:0 "[bp1_yearly_2021_intrigue_person.GetShortUIName|U] เข้าร่วมราชสำนักของท่าน"
 bp1_yearly.2021.f:0 "ข้าเปลี่ยนใจแล้ว"
 #Letter event - Spouse is captured or killed by your rival
 bp1_yearly.2022.t:0 "[bp1_yearly_2020_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 bp1_yearly.2022.desc_intro:0 "[bp1_yearly_2020_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 bp1_yearly.2022.desc_imprisoned:0 "\n\nข้ามีบุคคลผู้หนึ่งอยู่ในครอบครอง ซึ่งสาบานว่าเจ้ามิได้มีส่วนเกี่ยวข้องในความพยายาม#EMP ลอบสังหาร#! [bp1_yearly_2020_influencing_partner.GetHerHis] ต่อชีวิตข้า ข้าหาได้เชื่อ [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] ผู้ทรยศผู้นี้ไม่\n\nจงรับรู้ไว้ว่าข้าเตือนเจ้าแล้ว"
 bp1_yearly.2022.desc_dead:0 "\n\nเจ้าจะมิทราบเลยว่าเกิดสิ่งใดขึ้นกับข้าเมื่อวันก่อน [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] ผู้มุ่งร้ายตนหนึ่งพยายามพรากชีวิตข้า ทว่า [bp1_yearly_2020_influencing_partner.GetFaith.HighGodName] สถิตอยู่กับข้าและคุ้มครองข้าให้ปลอดภัย บัดนี้ ข้าจึงเก็บศีรษะ [bp1_yearly_2020_influencing_partner.GetHerHis] ไว้ประดับในห้องทำงานส่วนตัวของข้า\n\nจงรับรู้ไว้ว่าข้าเตือนเจ้าแล้ว"
 bp1_yearly.2022.a_imprisoned:0 "เจ้า#EMP [bp1_yearly_2020_target.Custom2('InsultNoun', ROOT.Char)]#!! นั่น!!"
 bp1_yearly.2022.b_dead:0 "อะไรนะ? ไม่! เป็นไปไม่ได้! [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]..."
 #Concluding event
 bp1_yearly.2023.t:0 "ทรงพระเจริญ [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]"
 bp1_yearly.2023.desc_triumphant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] ยิ้มอย่างผู้มีชัยมาทางข้าขณะที่ข้าก้าวเข้าไปหา [bp1_yearly_2020_influencing_partner.GetHerHim]"
 bp1_yearly.2023.desc_sad:0 "ข้ามองไปรอบห้องครัวที่ว่างเปล่า มันสะท้อนความกลวงเปล่า เมื่อ [bp1_yearly_2020_influencing_partner.GetFirstName] หายไปจากข้างกายข้า"
 bp1_yearly.2023.desc_hesitant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] เงยหน้าขึ้นขณะที่ข้าเข้าไปในครัวและเอียงศีรษะของ [bp1_yearly_2020_influencing_partner.GetHerHis] เล็กน้อย"
 bp1_yearly.2023.desc_killed_target:0 "[bp1_yearly_2020_influencing_partner.GetSheHe|U] เอนตัวไปหลังเคาน์เตอร์เพียงเพื่อเผยให้เห็นสิ่งที่ดูเหมือนกระสอบป่านเปื้อนคราบหนัก ด้วยการเคลื่อนไหวเพียงครั้งเดียว สิ่งของข้างในถูกเทลงบนพื้นผิวเรียบ\n\nสายตาไร้ชีวิตของหัว [bp1_yearly_2020_target.GetTitledFirstNamePossessive] ทักทายข้า และข้ารู้สึกปั่นป่วนในช่องท้อง\nช่างเป็นวันที่ #EMP วิเศษ#! เสียจริง!"
 bp1_yearly.2023.desc_imprisoned:0 "ด้วยการถูกจองจำของ [bp1_yearly_2020_influencing_partner.GetHerHis] ด้วยน้ำมือของไอ้ [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] [bp1_yearly_2020_target.GetFirstName]...\n\nข้าหลับตาลงพยายามไม่นึกถึงความน่าสะพรึงกลัวที่ [bp1_yearly_2020_influencing_partner.GetSheHe] อาจต้องเผชิญขณะถูกจองจำ\n\nใน "
 bp1_yearly.2023.desc_died:0 "ด้วยการตายของ [bp1_yearly_2020_influencing_partner.GetHerHim] ด้วยน้ำมือของ [bp1_yearly_2020_target.GetTitledFirstName] ข้า... ข้า... #EMP หายใจ#!.\nข้าหายใจอยู่ครู่หนึ่งในความโดดเดี่ยวของข้า\n\nข้า #EMP จะ#! แก้แค้นให้ [bp1_yearly_2020_influencing_partner.GetHerHim] ข้าสาบานต่อ [ROOT.Char.GetFaith.HighGodName], [bp1_yearly_2020_target.GetFirstName] จะต้องถูกหยุดยั้ง\n\nใน "
 bp1_yearly.2023.desc_picked_martial:0 ""ข้าเชื่อว่า [bp1_yearly_2021_new_courtier.GetWomanMan] [bp1_yearly_2021_new_courtier.GetTitledFirstName] ของข้าเป็นที่พอใจของท่านใช่หรือไม่? กล้ามเนื้อดุจเหล็กกล้า ข้าขอบอก""
 bp1_yearly.2023.desc_picked_learning:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] เป็นสิ่งมหัศจรรย์แห่งความรู้ ใช่หรือไม่ [bp1_yearly_2021_new_courtier.GetSheHe]! ข้าอิจฉาปัญญาของ [bp1_yearly_2021_new_courtier.GetHerHis] เสมอมา\""
 bp1_yearly.2023.desc_picked_stewardship:0 ""ข้าเชื่อว่า [bp1_yearly_2021_new_courtier.GetTitledFirstName] กำลังเติมเต็มคลังของท่าน! [bp1_yearly_2021_new_courtier.GetSheHe|U] เป็นอัญมณีแท้เสมอ""
 bp1_yearly.2023.desc_picked_diplomacy:0 ""ไม่ต้องสงสัยเลยว่า [bp1_yearly_2021_new_courtier.GetTitledFirstName] มีความสามารถพอที่จะพูดแทน [bp1_yearly_2021_new_courtier.GetHerselfHimself] — อย่างน้อยข้าก็ต้องคิดทบทวนเสมอว่าข้ากำลังตกลงอะไร เพื่อไม่ให้สิ่งต่างๆ ลงเอยตามทางของ [bp1_yearly_2021_new_courtier.GetHerHis] #EMP เสมอ#! ไป!""
 bp1_yearly.2023.desc_picked_intrigue:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] ช่างถักทอแผนการอันซับซ้อนเสียจริง ใช่หรือไม่ [bp1_yearly_2021_new_courtier.GetSheHe]? ข้าพยายามอยู่ข้าง [bp1_yearly_2021_new_courtier.GetHerHis] เสมอ\""
 bp1_yearly.2023.desc_picked_none:0 "\n\n"ข้าเสียใจที่ไม่มีผู้สมัครคนใดเป็นที่พอใจของท่าน [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)] ข้าหวังว่าท่านยังคงเห็นคุณค่าของงานที่ข้าทุ่มเทเพื่อรวบรวมบุคคลที่ดีที่สุดที่ [ROOT.Char.GetCapitalLocation.GetName] และบริเวณโดยรอบมีให้"\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] มองข้าอย่างคาดหวัง"
 bp1_yearly.2023.desc_outro:0 "\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] ขยิบตา "ทีนี้ถึงตาที่ท่านต้องทำตามข้อตกลงแล้ว [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] ของข้า!""
 bp1_yearly.2023.desc_outro_sad:0 "เพื่อตอบแทนความกล้าหาญของ [bp1_yearly_2020_influencing_partner.GetHerHis] สิ่งที่ถูกต้องคือการให้เกียรติตามคำขอของ [bp1_yearly_2020_influencing_partner.GetHerHis]"
 bp1_yearly.2023.a:0 "ท่านสมควรได้รับสิ่งนี้ [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]"
 bp1_yearly.2023.a_imprisoned_dead:0 "มันเป็นสิ่งที่สมควรทำอย่างยิ่ง"
 bp1_yearly.2023.b:0 "ความสามารถในการวางแผนของเจ้า ทำให้ข้ากังวล ที่รัก"
 bp1_yearly.2023.b_killer:0 "ข้าไม่อาจปล่อยให้เจ้าลอยนวลได้หลังจากนี้"
 bp1_yearly.2023.c:0 "ฟังนะ เราทั้งคู่รู้ว่านี่ไม่ถูกต้อง..."
 bp1_yearly.2023.c_imprisoned_dead:0 "#EMP ในทางเทคนิค#! แล้ว [bp1_yearly_2020_influencing_partner.GetSheHe] ทำงานไม่สำเร็จ..."
 #Mopey consort wants some guidance
 bp1_yearly.2030.t:0 "แล้ว [bp1_yearly_2030_mopey_consort.Custom('GirlBoy')|U] จะทำอย่างไรดี"
 bp1_yearly.2030.desc:0 "ขณะที่ข้าเข้าสู่ [ROOT.Char.Custom('GetRoom')] ข้าสังเกตเห็น [ROOT.Char.Custom2('RelationToMeShort', bp1_yearly_2030_mopey_consort )] [bp1_yearly_2030_mopey_consort.GetTitledFirstName] ทำท่าห่างเหินและเย็นชา ข้าเดินไปหา [bp1_yearly_2030_mopey_consort.GetHerHim] และวางมือบนไหล่ของ [bp1_yearly_2030_mopey_consort.GetHerHis] "มีเรื่องอันใดรึ?" ข้าถาม\n\n[bp1_yearly_2030_mopey_consort.GetSheHe|U] มองข้าครู่หนึ่ง แล้วถอนหายใจหนักๆ "มันเกี่ยวกับที่นี่ มันช่าง...น่าเบื่อหน่ายเหลือเกิน"\n\nไหล่ของ [bp1_yearly_2030_mopey_consort.GetHerHis|U] ยักขึ้น "ข้าแค่ไม่รู้จะทำอะไรกับตัวเอง""
 bp1_yearly.2030.a:0 "บางทีเจ้าอาจจะเข้าสังคมสักหน่อย?"
 bp1_yearly.2030.a_tt_paranoia:0 "แต่ถ้าพวกเขาลงเอยด้วยการพูดถึง #EMP ข้า...#!"
 bp1_yearly.2030.a_tt_gregarious:0 "ข้ามั่นใจว่านี่จะเป็นไปด้วยดี"
 bp1_yearly.2030.b:0 "ข้าพนันว่า [bp1_yearly_2030_target_consort.GetTitledFirstNameNoTooltip] อาจจะ #EMP น่าสนใจ#!..."
 bp1_yearly.2030.b_tt:0 "สิ่งที่เจ้าต้องการคือความรัก?"
 bp1_yearly.2030.c:0 "ทักษะใหม่ๆ ทำให้ #EMP ข้า#! อารมณ์ดีขึ้นเสมอ!"
 bp1_yearly.2030.d:0 "พูดตามตรง ข้ามีเรื่องสำคัญกว่าที่ต้องดูแล"
 bp1_yearly.2030.tt_success:0 "ความสัมพันธ์ดีขึ้น"
 bp1_yearly.2030.tt_failure:0 "ความสัมพันธ์แย่ลง"
 bp1_yearly.2030.tt_potential_friend:0 "พวกเขาชอบกันและกันมากขึ้นเล็กน้อย"
 bp1_yearly.2030.tt_friend:0 "พวกเขาเข้ากันได้ดี"
 bp1_yearly.2030.tt_best_friend:0 "ความสัมพันธ์เบ่งบาน"
 bp1_yearly.2030.tt_lover:0 "พวกเขาเข้ากันได้ #EMP ดีจริงๆ#!"
