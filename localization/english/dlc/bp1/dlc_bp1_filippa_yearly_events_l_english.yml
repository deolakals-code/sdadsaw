 bp1_yearly.2040.desc:0 "[bp1_yearly_2040_upset_consort.GetTitledFirstName] พรวดพราดเข้ามาใน [ROOT.Char.Custom('GetRoom')] ของข้า พลุ่งพล่านดั่งน้ำเดือดในหม้อ ไอความโกรธที่แผ่ออกมาจาก [bp1_yearly_2040_upset_consort.GetHerHim] นั้นช่างน่าครั่นคร้ามเล็กน้อย\n\n"นี่มัน#EMP มิอาจยอมรับได้#! กับวิธีที่ [bp1_yearly_2040_target_consort.GetSheHe], [bp1_yearly_2040_target_consort.GetSheHe]... อ๊าก! [bp1_yearly_2040_target_consort.GetFirstName] มันช่างเป็น#EMP [bp1_yearly_2040_target_consort.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2040_upset_consort'))]#!! โดยแท้!!" [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip] เหวี่ยงแขน [bp1_yearly_2040_upset_consort.GetHerHis] อย่างเกรี้ยวกราด "ท่านมิอาจทำ#EMP สิ่งใด#! ได้เลยรึ!?!""
