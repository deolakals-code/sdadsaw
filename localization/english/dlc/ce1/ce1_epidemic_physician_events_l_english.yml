l_english: 
 physician_epidemic_events.1000.t: "การรักษาแบบนอกรีต"
 physician_epidemic_events.1000.desc: "[physician.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [zealous_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ของข้ากำลังมีปากเสียงกันอย่างรุนแรงเกี่ยวกับวิธีรับมือ [epidemic_scope.GetName] ที่กำลังแพร่ระบาด\n\n"ข้าคือแพทย์!" ทาลารา ยืนกราน "ให้ข้าชำระล้างโรคระบาดนี้เถิด!"\n\n"นอกรีต!" Mahakala คำราม "เราต้องเจิมร่างผู้ตายและประกอบพิธีศพแบบ [zealous_courtier.GetFaith.GetAdjective] ให้ถูกต้อง""
 physician_epidemic_events.1000.a: "บางทีเราควรจะแค่เก็บศพให้ห่างจากคนเป็น"
 physician_epidemic_events.1000.b: "เราต้องทำทุกวิถีทางเพื่อยุติโรคระบาดนี้"
 physician_epidemic_events.1000.b.success: "การรักษาได้ผล"
 physician_epidemic_events.1000.b.failure: "การรักษาล้มเหลว"
 physician_epidemic_events.1000.c: "เราจะไม่ ทำให้ศพเหล่านี้มัวหมอง"
 physician_epidemic_events.1010.t: "การกักกัน"
 physician_epidemic_events.1010.desc: "ขณะที่ [epidemic_scope.GetName] แพร่ระบาด [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] ของข้าเร่งเร้าให้ใช้มาตรการเด็ดขาด: ปิดกั้นผู้ป่วย "ไอพิษเกาะกุมซากศพ" [physician.GetSheHe] เตือน "และอากาศเสียย่อมหล่อเลี้ยงโรคระบาด"\n\n[physician.GetSheHe|U] ต้องการกักกันโรค — ห้ามผู้ใดเข้าหรือออกจากดินแดนที่ติดเชื้อ\n\n"ในยามคับขัน ไกเซอร์ของข้า เราจำต้องทำในสิ่งที่ควรทำพ่ะย่ะค่ะ""
 physician_epidemic_events.1010.a: "บังคับใช้ 'การกักกัน' นี้"
 physician_epidemic_events.1010.b: "นี่มันรุนแรงเกินไป"
 physician_epidemic_events.1020.t: "[epidemic.GetNameNoTooltip|U]: การป้องกัน แต่เนิ่นๆ"
 physician_epidemic_events.1020.start.desc: "แสงสลัวริบหรี่ของสถานพยาบาลของ [physician.GetFirstNamePossessive] ส่องสว่างฉากขณะที่แพทย์หลวงวางแผนการรับมือ\n\n"ผู้ที่ได้รับผลกระทบจาก [epidemic.GetName] กำลัง"
 missing_epidemic: "ดิ้นทุรนทุรายด้วยความเจ็บปวด"
 physician_epidemic_events.1020.start.desc2: "อย่างที่ข้าไม่เคยเห็นมาก่อน"
 physician_epidemic_events.1020.safe_recommendation.desc: "คำแนะนำของข้าในฐานะผู้เชี่ยวชาญคือเราควรใช้วิธีการที่ไม่รุนแรงเพื่อป้องกันการแพร่กระจาย ท้ายที่สุดแล้ว เราไม่ต้องการทำร้ายเศรษฐกิจ""
 physician_epidemic_events.1020.risky_recommendation.desc: "โรคระบาดนี้เสี่ยงที่จะ ทำให้อาณาจักรทั้งมวลสั่นคลอน ผู้คนและพืชผลของเราจะถูกทำลายล้างหากเราไม่ใช้มาตรการที่รุนแรง""
 physician_epidemic_events.1020.mystic_recommendation.desc: "โรคระบาดนี้ถูกส่งมาให้เราโดย [physician.GetFaith.DevilName] และมีเพียงการคิดนอกกรอบของการแพทย์แผนเดิมเท่านั้นที่เราจะหวังว่าจะสามารถแก้คำสาปนี้ได้!""
 physician_epidemic_events.1020.end.desc: "\n\nท้ายที่สุดแล้ว กลยุทธ์ที่แน่นอนในการป้องกันการแพร่กระจายของโรคระบาดนี้เป็นสิ่งที่ข้าต้องตัดสินใจ"
 physician_epidemic_events.1020.a: "แนวทางที่นุ่มนวลนั้นดีที่สุด"
 physician_epidemic_events.1020.b: "จำเป็นต้องใช้มาตรการที่สิ้นหวัง"
 physician_epidemic_events.1020.c: "ไม่ว่าต้องใช้วิธีการลึกลับใดๆ เราก็จะทำ"
 physician_epidemic_events.1020.d: "การกระทำที่ดีที่สุดคือการไม่กระทำ"
 physician_epidemic_events.1021.t: "การป้องกัน แต่เนิ่นๆ: สำเร็จ"
 physician_epidemic_events.1021.desc: "ดูเหมือนว่าแนวทางสายกลางจะประสบความสำเร็จ โดยอาการของโรคในหมู่สามัญชนแพร่กระจายช้าลง แม้ว่าผลกระทบจะน้อยมาก แต่อย่างน้อยก็น่าจะ ทำให้มีเวลามากขึ้นในการหาทางแก้ไขที่ถาวรกว่านี้"
 physician_epidemic_events.1021.a: "ยอดเยี่ยม!"
 physician_epidemic_events.1022.t: "การป้องกัน แต่เนิ่นๆ: ล้มเหลว"
 physician_epidemic_events.1022.desc: "ไม่เพียง แต่มาตรการป้องกันของ [physician.GetNamePossessive] จะล้มเหลวเท่านั้น ดูเหมือนว่าพวกมันจะไปกระตุ้นธาตุต่างๆ และ ทำให้ความเสื่อมทรามนั้นทั้งติดเชื้อได้ง่ายขึ้นและรุนแรงขึ้น"
 physician_epidemic_events.1023.t: "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1023.desc: "โรค ซึ่งเคยแพร่กระจายราวกับไฟลามกระดาษไปทั่วอาณาจักรของข้าได้ชะลอตัวลง มาตรการที่รุนแรง ซึ่งเสนอโดย [physician.GetFirstName] ได้ส่งผลกระทบต่อเศรษฐกิจในระยะสั้น แต่ [epidemic.GetName] อาจไม่ใช่ภัยคุกคามอย่างที่เราทุกคนกลัว"
 physician_epidemic_events.1023.a: "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1024.t: "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1024.desc: "นอกเหนือจากการส่งผลกระทบอย่างใหญ่หลวงต่อเศรษฐกิจแล้ว การรักษาของ [physician.GetNamePossessive] ยังนำไปสู่การสูญเสียชีวิตนับไม่ถ้วน ชาวนา ซึ่งอ่อนแออยู่แล้วจากความเสียหายของโรค ไม่สามารถทนต่อการโจมตีของการเจาะเลือดและปลิงได้ การสูญเสียชีวิตนี้ดูเหมือนจะนำมา ซึ่งการแพร่กระจายของโรคที่เพิ่มขึ้น เนื่องจากไอพิษเกาะติดอยู่กับซากศพและเข้าสู่ปอดของผู้ที่มีสุขภาพดี"
 physician_epidemic_events.1025.t: "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1025.desc: "แม้จะถูกประณามว่าเป็นพวกนอกรีตโดยหลายคน การรักษาของ [physician.GetNamePossessive] ดูเหมือนจะได้ผลดีในการชะลอการแพร่กระจายของโรค การออกกำลังกายเพื่อขับไล่ความเสื่อมทราม การเจาะเลือดเพื่อขับธาตุเสีย และการทำความสะอาดอย่างทั่วถึงเพื่อป้องกันการสะสมของไอพิษดูเหมือนจะเป็นสิ่งที่ถูกต้องในการหยุดยั้ง [epidemic.GetName]!"
 physician_epidemic_events.1025.a: "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1026.t: "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1026.desc: "ข้าเสี่ยงในการยอมรับการรักษาแบบนอกรีตที่เสนอโดย [physician.GetName] ซึ่งดูเหมือนจะเป็นการเคลื่อนไหวที่ ทำให้ [ROOT.Char.GetFaith.HighGodName] ไม่พอใจอย่างยิ่ง ตอนนี้ข้ากำลังถูกลงโทษด้วยเลือดของประชาชนของข้า เนื่องจากการรักษาของ [physician.GetNamePossessiveNoTooltip] กำลัง ทำให้ผู้ป่วยและผู้อ่อนแอหมดแรงและไร้เลือดอยู่ตามท้องถนน 'ยา' ที่แปลกประหลาดและไม่ได้รับการพิสูจน์ถูกยัดเยียดลงคอพวกเขาก่อนที่เลือดของพวกเขาจะถูกระบายออกและร่างกายของพวกเขาจะหมดแรง เป็นภาพที่น่าสยดสยองสำหรับทุกคนที่ได้เห็น และเป็นวิธีปฏิบัติต่อผู้ที่กำลังจะตายที่น่าขยะแขยงอย่างแท้จริง"
 physician_epidemic_events.1030.t: "ประมวลความรู้เภสัชกรรม"
 physician_epidemic_events.1030.desc: ""ฝ่าบาท [ROOT.Char.GetTitleAsNameNoTooltip|U] ของข้า ข้าได้เรียนรู้มากมายภายใต้การจ้างงานของท่านในฐานะแพทย์หลวง โดยเฉพาะอย่างยิ่ง ข้าได้สังเกตการรักษาที่ถูกกล่าวหามากมายสำหรับ [epidemic_scope.GetName] และผลกระทบต่อร่างกาย"\n\n"หากท่านให้ทรัพยากรที่จำเป็นแก่ข้า ข้าอยากจะรวบรวมสิ่งที่ข้าค้นพบไว้ในหนังสือ เพื่อให้คนรุ่นหลังจะไม่ต้องทนทุกข์ทรมานจากโรคระบาดเหมือนที่เราเคยเป็น""
 physician_epidemic_events.1030.a: "ตกลง"
 physician_epidemic_events.1030.a.failure: "หนังสือเล่มนี้ไร้สาระ"
 physician_epidemic_events.1030.a.success: "หนังสือเภสัชกรรมอันยิ่งใหญ่ได้ถูกรวบรวมขึ้น"
 physician_epidemic_events.1030.b: "นี่ฟังดูเหมือนเป็นการสิ้นเปลืองเงิน"
 physician_epidemic_events.1040.t: "ทาน"
 physician_epidemic_events.1040.desc: "แพทย์หลวงของข้าโค้งคำนับอย่างนอบน้อมก่อนเอ่ย\n\n"ท่านดยุก การดูแลผู้ป่วย ทำให้ความพยายามของเราตึงเครียด — และผู้คนต่างกระซิบว่าราชบัลลังก์มิไยดีอีกต่อไป หากท่านจะเสกเหรียญตราและประทานมันด้วยตัวท่านเอง ก็อาจบรรเทาโทสะของพวกเขาได้ สัมผัสแห่งราชันย์ พวกเขาว่ากันว่า นำมา ซึ่งการเยียวยาขอรับ""
 physician_epidemic_events.1040.a: "เป็นความคิดที่ยอดเยี่ยม!"
 physician_epidemic_events.1040.b: "ไม่มีโรงพยาบาลหรือ?"
 physician_epidemic_events.1050.t: "โรงเตี๊ยม [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U]"
 physician_epidemic_events.1050.desc: "ทหารยามของข้าลาก [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] มาเบื้องหน้าข้าในสภาพถูกพันธนาการ [physician.GetSheHe] คอยรักษาทหารบาดเจ็บ — ทั้งมิตรและศัตรู — หลังทุกการรบ\n\nพวกเขาเรียกที่พักพิงของ [physician.GetHerHis] ว่า "โรงเตี๊ยม [ROOT.Char.GetPrimaryTitle.GetAdjective|U]" และเหล่าแม่ทัพของข้าเรียกร้องให้ปิดมันเสีย แต่ อีดาราจา เพียงเอ่ยว่า "พวกเขาเลือดตกยางออกและทุกข์ทรมานดุจเดียวกับพวกเรา ข้าเป็นผู้ใดกันจึงจะขับไล่พวกเขาได้?""
 physician_epidemic_events.1050.a: "[physician.GetSheHe|U] ได้รับอนุญาตจากข้าให้ทำต่อไป"
 physician_epidemic_events.1050.b: "หยุดเรื่องนี้เดี๋ยวนี้!"
 physician_epidemic_events.1060.t: "การเนรเทศอันสิ้นหวัง"
 physician_epidemic_events.1060.desc: "[gross_sick_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] นอนซีดเผือดและหายใจหอบ โรคระบาดได้ทะลวงเข้ามาถึงโถงของข้าแล้ว\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เร่งเร้าให้ใช้มาตรการเด็ดขาด: "ผู้ที่ป่วยแล้วจำต้องถูกย้ายออกไป ฝ่าบาท — มิ เช่นนั้นเราเสี่ยงที่จะสูญเสียทุกคน"\n\nมันช่างเป็นความคิดที่โหดร้าย ทว่าการรอมันโหดร้ายกว่าหรือไม่?"
 physician_epidemic_events.1060.a: "เอาพวกเขาทั้งหมดออกไปเดี๋ยวนี้!"
 physician_epidemic_events.1060.b: "ช่างเป็นข้อเสนอแนะที่หยาบคาย"

