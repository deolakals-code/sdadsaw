 pharmaceuticals: "เภสัชกรรมตามตำรับของ [physician.GetFirstName]"
 pharmaceuticals_desc: "ประมวลความรู้เกี่ยวกับยาสมุนไพรและการรักษาโรคที่รุนแรงสำหรับอาการต่างๆ แต่เน้นเป็นพิเศษเกี่ยวกับผลกระทบของ [epidemic_scope.GetName]"
