 game_concept_epidemic: "โรคระบาด"
 game_concept_epidemic_desc: "$game_concept_epidemic$ คือการระบาดของโรคที่แพร่กระจายไปทั่วแผนที่ ก่อให้เกิดผลกระทบในท้องถิ่นและ ทำให้ตัวละครในพื้นที่ติดเชื้อ [baronies|E] ที่ได้รับผลกระทบจะมี [infection_rate|E] ซึ่งบ่งบอกความรุนแรงและสามารถต่อต้านได้โดยการปรับปรุง [epidemic_resistance|E]\n\nโรคระบาดสามารถมี [plague_intensities|E] ที่แตกต่างกัน ซึ่งส่งผลต่อพื้นที่ผลกระทบ ระยะเวลา และ [fatalities|E]"
 game_concept_epidemic_i: "@epidemic_icon!"
 game_concept_epidemics: "โรคระบาด"
 game_concept_epidemics_desc: "$game_concept_epidemic_desc$"
 game_concept_infection_rate: "อัตราการติดเชื้อ"
 game_concept_infection_rate_desc: "[baronies|E] ที่ได้รับผลกระทบจาก [epidemics|E] จะมี $game_concept_infection_rate$ ซึ่งบ่งบอกความรุนแรงและระดับผลกระทบ\n\n$game_concept_infection_rate$ จะเพิ่มขึ้นสู่ค่าสูงสุดเสมอหากไม่มีการดำเนินการใดๆ เพื่อต่อสู้กับมัน โรคระบาดระดับเล็กน้อย ใหญ่ และหายนะ จะมีความเร็วในการแพร่กระจายที่แตกต่างกัน ซึ่งบ่งบอกด้วยระดับความรุนแรง\n\nเพื่อบรรเทาผลกระทบของการติดเชื้อ [rulers|E] สามารถปรับปรุง [epidemic_resistance|E] ของ [realm|E] ของตนได้"
 game_concept_infection_rates: "อัตราการติดเชื้อ"
 game_concept_infection_rates_desc: "$game_concept_infection_rate_desc$"
 game_concept_epidemic_resistance: "ความต้านทานโรคระบาด"
 game_concept_epidemic_resistance_desc: "$game_concept_epidemic_resistance$ ช่วยลด [infection_rate|E] ของ [barony|E] หรือ [county|E] ซึ่งบรรเทาผลกระทบของ [epidemic|E]\n\n$game_concept_epidemic_resistance$ สามารถเพิ่มได้ผ่าน [buildings|E] เช่น $building_type_hospices_01$ หรือ $building_type_burial_site_01$ #weak ([duchy_building|E])#!, [court_position_tasks|E] ที่ดำเนินการโดย $court_physician_court_position$, [decisions|E] หรือเหตุการณ์ต่างๆ"
 game_concept_epidemic_res: "ความต้านทานโรคระบาด"
 game_concept_epidemic_res_desc: "$game_concept_epidemic_resistance_desc$"
 game_concept_infection_chance: "โอกาสติดเชื้อ"
 game_concept_chance_of_infection: "โอกาสติดเชื้อ"
 game_concept_infection_chance_desc: "$game_concept_infection_chance$ ของท่านกำหนดความน่าจะเป็นที่ท่านจะติด [diseases|E] จาก [epidemic|E] ที่กำลังระบาดอยู่"
 game_concept_plague_intensity: "ความรุนแรงของโรคระบาด"
 game_concept_plague_intensity_desc: "[epidemic|E] สามารถเป็นระดับหายนะ ใหญ่ หรือเล็กน้อย ซึ่งส่งผลต่อพื้นที่การแพร่กระจาย ระยะเวลา และ [characters|E] ที่ติดเชื้อ ทำให้เกิด [fatalities|E]"
 game_concept_plague_intensities: "ความรุนแรงของโรคระบาด"
 game_concept_plague_intensities_desc: "$game_concept_plague_intensity_desc$"
