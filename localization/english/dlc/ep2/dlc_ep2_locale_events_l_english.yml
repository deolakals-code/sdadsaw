l_english: 
 # TAVERN
 ep2_locale_events.1000.t:0 "$tournament_locale_tavern$: อีกรอบ"
 ep2_locale_events.1000.independent:0 "เสียงหัวเราะดังลั่นมาจากโต๊ะของ [drinking_leader.GetTitledFirstNamePossessive] ที่มุมโรงเตี๊ยม"
 ep2_locale_events.1000.liege:0 "เสียงหัวเราะดังลั่นมาจากมุมห้อง ที่ ซึ่ง [drinking_leader.GetTitledFirstName] [drinking_leader.GetLiege.Custom2('RelationToMeShort', drinking_leader)] ของ [drinking_leader.GetLiege.GetTitledFirstNamePossessive] นั่งอยู่"
 ep2_locale_events.1000.alcohol:0 "\n\n[drinking_leader.GetSheHe|U] ถูกห้อมล้อมด้วยกลุ่มมิตรสหายและคนรู้จักใหม่ๆ ผู้เข้าแข่งขันคนอื่นๆ ในการประลอง [activity.GetCurrentPhase.GetPhase.GetName] ที่กำลังจะมาถึง ทุกคนกำลังดื่มด่ำกับ [host.Custom('RegionalAlcoholicDrink')] ขณะแลกเปลี่ยนเรื่องราว\n\nขณะที่ท่านเดินผ่าน ท่านอดไม่ได้ที่จะพิจารณาสนับสนุนวงสนทนาเล็กๆ นี้..."
 ep2_locale_events.1000.a:0 "เจ้าของร้าน เอามาเพิ่มทางนี้!"
 ep2_locale_events.1000.b:0 "ค่าเหล้าโต๊ะนี้ข้าจ่ายเอง!"
 ep2_locale_events.1000.c:0 "ข้าว่าพวกนี้ดื่มกันพอแล้ว"
 ep2_locale_events.1000.d:0 "ขอให้สนุกกับค่ำคืนนี้ [drinking_leader.GetFirstNameNoTooltip]!"
 drinks_round_tt:0 "นักดื่มทุกคน"
 ep2_locale_events.1000.hangover_tt:0 "ไม่เอาอีกแล้ว..."

 ep2_locale_events.1002.t:1 "$tournament_locale_tavern$: กล้าดื่มหรือไม่?"
 ep2_locale_events.1002.desc:0 "โรงเตี๊ยมท้องถิ่นแน่นขนัดไปด้วยผู้คน ดังที่คาดไว้เมื่อมีการประลองเข้ามาในเมือง ท่ามกลางผู้มาใหม่ทั้งหมดนั้น มี [local_drunk.GetWomanMan] ผู้หนึ่งนั่งอยู่ ซึ่งเห็นได้ชัดว่าเป็นขาประจำของร้าน [local_drunk.GetSheHe|U] มองข้าด้วยความสงสัยขณะที่ข้านั่งลง\n\n"ท่านมาทำอะไร #EMP ที่นี่#!" ในที่สุด [local_drunk.GetSheHe|U] ก็โพล่งออกมาเมื่อเครื่องดื่มของข้ามาถึง ข้าหันไปเผชิญหน้ากับ [local_drunk.GetHerHim]; [local_drunk.GetSheHe] ลุกขึ้นยืนบนเท้า [local_drunk.GetHerHis] อย่างไม่มั่นคง\n\n"ขออภัยที่ข้าทึกทักเอาเอง #EMP ท่าน [ROOT.Char.GetLadyLord]#!," — การโค้งคำนับอย่างเยาะเย้ยเน้นย้ำคำพูดนั้น — "แต่ข้าคิดว่าท่านคงดื่มได้ไม่ถึงครึ่งด้วยซ้ำ ไม่ต้องพูดถึงทั้งหมดหรอก!""
 ep2_locale_events.1002.a:0 "เอาน่า ไม่ต้องเป็นศัตรูกัน ข้าเลี้ยงท่านสักแก้ว?"
 ep2_locale_events.1002.b:0 "โอ้ จริงรึ? #EMP เอาถังเบียร์มา!#!"
 ep2_locale_events.1002.b.success:0 "ท่านดื่มจน [local_drunk.GetFirstNameNoTooltip] เมาหัวทิ่มโต๊ะ"
 ep2_locale_events.1002.b.failure:0 "ท่านตื่นขึ้นในอีกไม่กี่ชั่วโมงต่อมา งัวเงีย พร้อมกับอาการปวดหัวอย่างรุนแรง"
 ep2_locale_events.1002.c:0 "นั่งลงแล้วหุบปากไปเลย เจ้าขี้เมาสิ้นหวัง"

 ep2_locale_events.1010.t:0 "$tournament_locale_tavern$: เล่นสักเกมไหม?"
 ep2_locale_events.1010.desc:0 "ความมืดสลัวของโรงเตี๊ยมถูกขับไล่ด้วยเสียงแตกของไฟและความสนุกสนานต่อเนื่องของนักดื่ม ข้าแทรกตัวผ่านนักดื่มขี้เมาสองคนที่ส่งเสียงดังเป็นพิเศษและนั่งลงที่โต๊ะใกล้ๆ ซึ่งว่างเปล่ายกเว้นคนผู้หนึ่ง\n\n"เป็นค่ำคืนที่ดี ใช่หรือไม่?" [gambler.GetFirstName] ชี้ไปที่ฝูงชนที่ดูโทรม ข้าพยักหน้าอย่างสุภาพ ข้าแทบจะเงยหน้ากลับมาไม่ทันเมื่อ [gambler.GetFirstNameNoTooltip] หยิบชุดลูกเต๋าและถ้วยมาวางบนโต๊ะ\n\n"สนใจเกมง่ายๆ ไหม? คนโง่ก็เล่นได้! เราทั้งคู่ทอยลูกเต๋าใต้ถ้วย แล้วท่านก็ทายว่าแต้มของท่านสูงหรือต่ำกว่าของข้า" [gambler.GetSheHe|U] ยิ้ม แววตาของนักพนันปรากฏในดวงตาของ [gambler.GetHerHis] "เอาชนะสองในสาม"
 #ep2_locale_events.1010.a: "But how can I trust your dice?"
 #ep2_locale_events.1010.a.tt: "Let's use my set. My very fair and non-weighted set."
 ep2_locale_events.1010.b:0 "ส่งลูกเต๋านั่นมานี่!"
 ep2_locale_events.1010.c:0 "ข้าไม่ใช่นักพนัน"

 ep2_locale_events.1011.t:0 "$tournament_locale_tavern$: ทอยครั้งแรก"
 ep2_locale_events.1011.opening:0 "ลูกเต๋าดังกรุ๊งกริ๊งและกระดอนในถ้วยก่อนที่เราทั้งคู่จะกระแทกมันลงบนโต๊ะ ข้ายกขอบถ้วยด้านที่ใกล้ข้าที่สุดขึ้น ค่อยๆ ปิดบังสิ่งที่อยู่ข้างใน\n\n#BOL [ROOT.Var('root_dice_1').GetValue|0]#!. ข้าพิจารณา [gambler.GetFirstName] อย่างใกล้ชิด มองหาสัญญาณ"
 ep2_locale_events.1011.tell.good:0 "\n\nนั่นคือริมฝีปากของ [gambler.GetFirstNamePossessiveNoTooltip] ที่ยกขึ้นเล็กน้อยที่ข้าเห็นหรือไม่? มันหายไปเกือบจะทันทีที่ปรากฏ แต่การสั่นไหวเพียงเล็กน้อยก็สามารถทรยศความจริงที่ลึกที่สุดได้..."
 ep2_locale_events.1011.tell.bad:0 "\n\nดวงตาของ [gambler.GetFirstNamePossessiveNoTooltip] เหลือบลง หนึ่งครั้ง สองครั้ง มันหายไปเกือบจะทันทีที่ปรากฏ แต่การสั่นไหวเพียงเล็กน้อยก็สามารถทรยศความจริงที่ลึกที่สุดได้..."
 ep2_locale_events.1011.average:0 "\n\nมือของ [gambler.GetFirstNamePossessiveNoTooltip] สั่นเล็กน้อยและข้าอ้าปากอย่างมีชัย แต่ดวงตาของ [gambler.GetHerHis] มีประกายบางอย่างอยู่ในนั้น อาการสั่นเป็นสัญญาณหรือไม่? ดวงตาเป็นสัญญาณหรือไม่? สิ่งเหล่านี้มีประโยชน์หรือไม่?"
 ep2_locale_events.1011.deceitful:0 "\n\nดวงตาของ [gambler.GetFirstNamePossessiveNoTooltip] จ้องมองมาที่ข้า ไม่มีการแสดงอารมณ์ใดๆ บนใบหน้าของ [gambler.GetHerHis] ข้าละสายตาและพิจารณาท่าทางของ [gambler.GetHerHis] แต่ราวกับว่า [gambler.GetSheHe] เป็นรูปปั้น"
 ep2_locale_events.1011.a:0 "แต้มของข้า... สูงกว่า!"
 ep2_locale_events.1011.b:0 "ลูกเต๋าของข้าต่ำกว่า"

 ep2_locale_events.1012.t:0 "$tournament_locale_tavern$: รอบที่สอง"
 ep2_locale_events.1012.opening.win:0 "เราเปิดเผยลูกเต๋าของเรา ใช้เวลาเพียงครู่เดียวสำหรับเราทั้งคู่ที่จะรับรู้ว่าข้าชนะ!\n\n"อา! ทายได้ดี! รอบแรกเป็นของท่าน!" ริมฝีปากของ [gambler.GetFirstNamePossessive] ยิ้ม แต่มันไม่ไปถึงดวงตาของ [gambler.GetHerHis] "รอบต่อไป!" ลูกเต๋าดังกรุ๊งกริ๊งในถ้วยอีกครั้ง"
 ep2_locale_events.1012.opening.lose:0 "เราเปิดเผยลูกเต๋าของเรา ใช้เวลาเพียงครู่เดียวสำหรับเราทั้งคู่ที่จะรับรู้ว่าข้าแพ้ [gambler.GetFirstName] ยิ้มอย่างภาคภูมิใจ\n\n"โชคร้าย! ดูเหมือนว่าท่านจะผิด รอบต่อไป!" ลูกเต๋าดังกรุ๊งกริ๊งในถ้วยอีกครั้ง"
 ep2_locale_events.1012.opening.draw:0 "เราเปิดเผยลูกเต๋าของเรา เมื่อถ้วยหายไป ใช้เวลาเพียงครู่เดียวในการคำนวณว่าตัวเลขเท่ากัน\n\n"เอาล่ะ งั้นเราจะถือว่าเสมอกัน" ความผิดหวังของ [gambler.GetFirstNamePossessive] เห็นได้ชัดเจน "รอบต่อไป!" ลูกเต๋าดังกรุ๊งกริ๊งในถ้วยอีกครั้ง"
 ep2_locale_events.1012.dice_reveal:0 "\n\nข้ายกขอบถ้วยด้านที่ใกล้ข้าที่สุดขึ้น รอยสลักเล็กๆ บนลูกเต๋าเผยให้เห็นตัวเลข: #BOL [ROOT.Var('root_dice_2').GetValue|0]#!. ข้าวางถ้วยกลับลงบนโต๊ะ และเงยหน้าขึ้น"
 ep2_locale_events.1012.tell.good:0 "\n\n[gambler.GetFirstName] เคาะนิ้วของ [gambler.GetHerHis] บนโต๊ะ การเอียงศีรษะไปทางเพดานนั้นเป็นคำใบ้ที่ละเอียดอ่อนหรือไม่? แน่นอนว่า [gambler.GetSheHe] ดูเหมือนจะนั่งตัวตรงกว่าเดิม..."
 ep2_locale_events.1012.tell.bad:0 "\n\nดวงตาหรี่ลงเล็กน้อย การเปลี่ยนน้ำหนักเล็กน้อย [gambler.GetFirstName] กำลังซ่อนบางอย่างอยู่ บางทีแต้มนั้นอาจไม่สูงมากนัก..."
 ep2_locale_events.1012.average:0 "\n\nดวงตาของ [gambler.GetFirstNamePossessiveNoTooltip] กวาดไปทั่วห้อง มองไปทุกที่ยกเว้นที่ข้า แขนของ [gambler.GetHerHis|U] สั่นเล็กน้อยขณะยกถ้วยขึ้น ข้าไม่แน่ใจว่าสิ่งนี้เกี่ยวข้องหรือไม่..."
 ep2_locale_events.1012.deceitful:0 "\n\nท่าทางของ [gambler.GetFirstNamePossessiveNoTooltip] มั่นใจ เกือบจะอวดดี แต่ [gambler.GetSheHe] ยังไม่ได้ยกถ้วยขึ้นด้วยซ้ำ! ดวงตาของ [gambler.GetHerHis|U] เหลือบลงขณะที่ [gambler.GetSheHe] เอียงถ้วยออกจาก [gambler.GetHerHim] อย่างรวดเร็ว ก่อนที่จะวางกลับลงบนโต๊ะ ท่าทางของ [gambler.GetHerHis] ไม่เปลี่ยนไปแม้ แต่น้อย"
 ep2_locale_events.1012.a:0 "สูงกว่า ข้าคิดว่านะ"
 ep2_locale_events.1012.b:0 "ต่ำกว่า อย่างแน่นอน"

 ep2_locale_events.1013.t:0 "$tournament_locale_tavern$: รอบตัดสิน"
 ep2_locale_events.1013.opening:0 "เราเปิดเผยลูกเต๋าของเราพร้อมกัน แต่เห็นได้ชัดทันทีว่าจำเป็นต้องมีรอบที่สาม เราหยิบถ้วยและลูกเต๋าของเราสำหรับรอบสุดท้าย ผู้ชนะได้ทั้งหมด"
 ep2_locale_events.1013.dice_reveal:0 "\n\nข้ายกขอบถ้วยด้านที่ใกล้ข้าที่สุดขึ้น รอยสลักเล็กๆ บนลูกเต๋าเผยให้เห็นตัวเลข: #BOL [ROOT.Var('root_dice_3').GetValue|0]#!. ข้าวางถ้วยกลับลงบนโต๊ะ และเงยหน้าขึ้น"
 ep2_locale_events.1013.tell.good:0 "\n\nสามรอบผ่านไป และสัญญาณของ [gambler.GetFirstNamePossessive] ก็เริ่มชัดเจนขึ้นเรื่อยๆ จมูกของ [gambler.GetHerHis|U] บานออกอย่างแทบไม่รู้สึกตัวเมื่อแต้มสูง ข้ามั่นใจ แต่เป็นเพียงการหลอกลวงหรือไม่?"
 ep2_locale_events.1013.tell.bad:0 "\n\n[gambler.GetFirstName] ลูบมือของ [gambler.GetHerHis] ไปบนศีรษะอย่างว้าวุ่นใจ สิ้นหวัง? นั่นเป็นแต้มที่ต่ำเป็นพิเศษหรือไม่? [gambler.GetSheHe|U] เห็นข้าและทำหน้ากล้าหาญขึ้นมาบ้าง มัน #EMP อาจจะ#! เป็นการหลอกซ้อนหลอก..."
 ep2_locale_events.1013.average:0 "\n\n[gambler.GetFirstNamePossessiveNoTooltip] พยายามจ้องมองมาที่ข้าตรงๆ แต่สายตาของ [gambler.GetHerHis] วอกแวก ริมฝีปากที่สั่นเทาเผย #EMP บางอย่าง#! ออกมา แต่มันคืออะไร?"
 ep2_locale_events.1013.deceitful:0 "\n\nความไม่แสดงอารมณ์ของ [gambler.GetFirstNamePossessive] ตลอดการต่อสู้ทางปัญญานี้น่าทึ่งอย่างแท้จริง และก็ไม่ต่างกันที่นี่ การขาดอารมณ์อย่างสิ้นเชิงบนใบหน้าของ [gambler.GetHerHis] เกือบจะน่าตกใจ มันจะต้องขึ้นอยู่กับโชคชะตาล้วนๆ"
 ep2_locale_events.1013.a:0 "ข้าเชื่อในลูกเต๋าของข้า สูงกว่า!"
 ep2_locale_events.1013.b:0 "แต้มของข้าต่ำกว่า"

 ep2_locale_events.1014.t:0 "$tournament_locale_tavern$: เดิมพันได้ดี"
 ep2_locale_events.1014.opening:0 "ถ้วยถูกยกขึ้นเป็นครั้งสุดท้าย ฝูงชนเล็กๆ ที่รวมตัวกันรอบตัวเราเอนตัวเข้ามาดูว่า...\n\n"
 ep2_locale_events.1014.win:0 "ข้าคือผู้ชนะ! [gambler.GetFirstName] ทำหน้ากล้าหาญที่สุดเท่าที่ [gambler.GetSheHe] จะทำได้ แต่ความรำคาญของ [gambler.GetHerHis] เห็นได้ชัดเจน [gambler.GetSheHe|U] ผลักถุงเงินที่เราเดิมพันไว้มาทางฝั่งข้าและเดินจากไปอย่างฉุนเฉียว อยู่ในขอบเขตของความสุภาพพอดี\n\nข้าเอนหลังพิงเก้าอี้ ดีใจพอๆ กับที่เหนื่อยล้าทางจิตใจ"
 ep2_locale_events.1014.lose:0 "ข้าแพ้! [gambler.GetFirstName] โห่ร้องอย่างดีใจขณะที่ [gambler.GetSheHe] คว้าถุงเงินที่เราทั้งคู่เดิมพันไว้\n\n"โชคดีครั้งหน้า!" [gambler.GetSheHe|U] หัวเราะอย่างร่าเริง เดินจากไปพร้อมกับเงินเต็มอ้อมแขน\n\nข้าเอนหลังพิงเก้าอี้ รู้สึกท้อแท้"
 ep2_locale_events.1014.draw:0 "เรา... เสมอกัน? [gambler.GetFirstName] ลูบศีรษะของ [gambler.GetHerHis] อย่างเศร้าใจ ขณะที่เรา แต่ละคนหยิบถุงเงินเล็กๆ ที่เราวางไว้บนโต๊ะสำหรับผู้ชนะกลับคืนไป\n\n"เอาล่ะ บางครั้งลูกเต๋าก็ทำงานในรูปแบบที่ลึกลับ" [gambler.GetFirstNameNoTooltip] พูด พลางยักไหล่ "ถึงกระนั้นก็เล่นได้ดี" [gambler.GetSheHe|U] ลุกขึ้นและเดินจากไป"
 ep2_locale_events.1014.a:0 "เจ้าของร้าน! ข้าเลี้ยงเอง!"
 ep2_locale_events.1014.b:0 "อา รสชาติแห่งชัยชนะ!"
 ep2_locale_events.1014.c:0 "ดื่มเพื่อกลบความเศร้า ข้าคิดว่านะ"
 ep2_locale_events.1014.d:0 "ให้ตายสิ!"
 ep2_locale_events.1014.e:0 "เอาล่ะ ก็แค่นั้น ข้าเดาว่านะ"
 ep2_locale_events.1014.f:0 "ข้าอยากดื่มหลังจากนั้น!"

 ep2_locale_events.1050.t:1 "$tournament_locale_tavern$: นักพนัน [ROOT.Char.GetWomanMan|U] หรือ?"
 ep2_locale_events.1050.desc:0 "ข้าเพิ่งก้าวเข้าโรงเตี๊ยม ก็ถูกบุคคลหนึ่งรั้งตัวไว้ [wealthy_gambler.GetFirstName] ตบไหล่ข้าและพาข้าไปยังมุมอับอย่างรวดเร็ว พลางลดเสียงของ[wealthy_gambler.GetHerHis]ลงเป็นเชิงสมรู้ร่วมคิด\n\n"ท่านเข้าร่วมการประลองยุทธ์ใช่หรือไม่?" [wealthy_gambler.GetSheHe|U] พูดต่อโดยไม่รอฟังคำตอบรับจากข้า "เอ่อ คือข้ามีการเดิมพันที่พิลึกพิลั่นหน่อยน่ะสิ หนึ่งใน... ผู้ร่วมธุรกิจของข้า คิดว่าท่านเป็นพวก #EMP คนอ่อนแอ#! อะไรทำนองนั้น" [wealthy_gambler.GetSheHe|U] โบกมือปัดการประท้วงทันควันของข้า\n\n"ข้าปกป้องเกียรติของท่าน แน่นอนข้าทำ เช่นนั้น [ROOT.Char.Custom('FormOfAddressForLiege')]! ข้าบอกว่าท่านกล้าหาญพอที่จะเข้าประลองโดยไม่สวมหมวกเหล็ก! แน่นอน หากท่าน #EMP รับประกัน#! ได้ว่าเรื่องนี้จะเกิดขึ้นจริง เอิ่ม ข้าคิดว่าข้าคงพอจะหาของมาตอบแทนท่านให้คุ้มค่าได้...""
 ep2_locale_events.1050.a:0 "ข้าไม่คิดว่านั่นคือนักพนันเพื่อนของท่านที่อยู่ตรงนั้น?"
 ep2_locale_events.1050.a.tt:0 "บางทีพวกเขาอาจอยากรู้เกี่ยวกับการโกงเล็กๆ น้อยๆ นี้ เว้น แต่ แน่นอนว่า เหรียญนั้นดีพอที่จะปิดปากได้..."
 ep2_locale_events.1050.b:0 "#EMP ขี้ขลาด?!#! ข้าจะเข้าแข่งขันโดยไม่สวม #EMP เกราะมือ#! บ้าๆ นี่!"
 ep2_locale_events.1050.c:0 "ข้าต้องการเหรียญ..."
 ep2_locale_events.1050.d:0 "ช่างเป็นข้อเสนอที่น่าอัปยศ!"

 # TEMPLE
 ep2_locale_events.1500.t:0 "$tournament_locale_religious_building$: ความโปรดปรานของ [ROOT.Char.GetFaith.HighGodNamePossessive]"
 ep2_locale_events.1500.host_faith:0 "ขณะที่ [tournament_priest.GetFirstName] หลีกทางให้ข้าเข้าใกล้ ข้าใช้เวลาครู่หนึ่งอย่างเคร่งขรึม อยู่ตามลำพังใน [ROOT.Char.GetFaith.HouseOfWorship] ใกล้กับลานประลอง"
 ep2_locale_events.1500.other_faith:0 "ข้าใช้เวลาครู่หนึ่งกับตัวเองในศาลเจ้า [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ชั่วคราวเล็กๆ ใกล้กับ [activity.GetCurrentPhase.GetCurrentLocation.GetFaith.HouseOfWorship] ของ [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] โดยมี [tournament_priest.GetFirstName] ยืนอยู่ในระยะที่เหมาะสม"
 ep2_locale_events.1500.desc:0 "\n\nครุ่นคิดต่อหน้า [ROOT.Char.GetFaith.PantheonTerm] ข้าพบว่าตัวเองสงสัยว่าอะไรคือสิ่งที่ข้าปรารถนา ในส่วนลึกของหัวใจ ที่จะเห็นเกิดขึ้นจากวันแห่งการเฉลิมฉลองเหล่านี้"
 ep2_locale_events.1500.a:0 "นำเกียรติยศมาให้ข้า [ROOT.Char.GetFaith.WarGodName|U]"
 ep2_locale_events.1500.b:0 "ทำให้ชีวิตของ [ROOT.Char.Custom2('RelationToMeShort', bad_prayer_target)] [bad_prayer_target.GetFirstNamePossessiveNoTooltip] ยากลำบากขึ้น"
 ep2_locale_events.1500.c:0 "โปรดเมตตาต่อ [ROOT.Char.Custom2('RelationToMeShort', good_prayer_target)] [good_prayer_target.GetFirstNameNoTooltip]"
 ep2_locale_events.1500.d:0 "ลงโทษ [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)] [backup_prayer_target.GetFirstNameNoTooltip]!"
 ep2_locale_events.1500.e:0 "นำทางมือของ [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)] [backup_prayer_target.GetFirstNamePossessiveNoTooltip]"
 ep2_locale_events.1500.f:0 "ชัยชนะสำหรับ [wager_prayer_target.GetFirstNameNoTooltip] และถุงเงินของข้า!"
 ep2_locale_events.1500.g:0 "ขอให้ข้าพบความสงบภายใน"

 ep2_locale_events.1501.t:0 "$tournament_locale_religious_building$: การบูชาเพื่อแสดง"
 ep2_locale_events.1501.desc:0 "ในการค้นหาแนวทางบางอย่าง ข้าพบว่าตัวเองเดินเข้าไปใน [ROOT.Char.GetFaith.HouseOfWorship] เพื่อทำสมาธิ ด้วยโชคช่วยอย่างแท้จริง ข้าพบบางสิ่งที่น่าสนใจกว่าการทำสมาธิมาก: [seduce_target.GetFirstName] กำลังยืนอยู่ข้างประตูอย่างโหยหา\n\n[seduce_target.GetSheHe|U] ยิ้มให้ข้าครึ่งหนึ่ง ความสนใจอยู่ที่อื่นอย่างชัดเจน ตอนนี้เป็นโอกาสที่สมบูรณ์แบบที่จะเอาชนะใจ [seduce_target.GetHerHim] ด้วยการแสดงการวิงวอนทางศาสนา!\n\nหรือ... อาจจะไม่ใช่? [seduce_target.GetSheHe] จะชอบอะไรมากกว่า? บางที [seduce_target.GetSheHe] อาจเป็นประเภทที่ไม่โอ้อวด?"
 ep2_locale_events.1501.a:0 "ข้าจะพิสูจน์ความศรัทธาของข้าให้ปราศจากข้อสงสัย!"
 ep2_locale_events.1501.a.tt:0 "ความกระตือรือร้นทางศาสนาของข้ารู้ไม่มีขอบเขต ที่รัก [seduce_target.GetFirstNameNoTooltip]!"
 ep2_locale_events.1501.a.success:0 "การแสดงของท่านโดนใจ"
 ep2_locale_events.1501.a.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] ไม่ชอบการแสดงของท่าน"
 ep2_locale_events.1501.b:0 "ข้าคิดว่า [seduce_target.GetFirstNameNoTooltip] เป็นคนสบายๆ มากกว่า"
 ep2_locale_events.1501.b.tt:0 "การกลอกตาเล็กน้อยและรอยยิ้มอย่างรู้ทันขณะที่ข้าประกอบพิธีกรรมควรส่งข้อความถึง [seduce_target.GetFirstNameNoTooltip] อย่างชัดเจน"
 ep2_locale_events.1501.b.success:0 "[seduce_target.GetFirstName|U] พอใจในความเห็นต่างของท่าน"
 ep2_locale_events.1501.b.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] ตกใจกับการละทิ้งศาสนาของท่าน"
 ep2_locale_events.1501.c:0 "บางทีข้าควรจะไป"

 ep2_locale_events.1510.t:0 "$tournament_locale_religious_building$: การลบหลู่ศาสนาอย่างบ้าคลั่ง"
 ep2_locale_events.1510.desc:0 "ขณะที่ความเงียบเข้าปกคลุมผู้มาสักการะที่รวมตัวกันสำหรับพิธีประจำวัน ความสงบก็ถูกทำลายลงทันทีด้วยเสียงตะโกนและโห่ร้องที่ดังเข้ามาใกล้\n\nประตูเปิดออก และนักดื่มหัวเราะสิบสองคนก็กรูเข้ามาใน [ROOT.Char.GetFaith.HouseOfWorship]"
 ep2_locale_events.1510.alcohol:0 "ถือถังเบียร์และถังไม้ในมือ"
 ep2_locale_events.1510.hashish:0 "เหม็นกลิ่นกัญชา"
 ep2_locale_events.1510.closing:0 "\n\n[instigator_scope.GetTitledFirstName] ซึ่งเห็นได้ชัดว่าเป็นผู้ยุยง ยิ้มอย่างโง่เขลา "นี่มันอะไรกัน?! ดนตรีอยู่ไหน?"\n\n[tournament_priest.GetFirstName] มองดู แข็งทื่อด้วยความไม่เชื่อและความสยดสยอง"
 ep2_locale_events.1510.a:0 "นี่คือการลบหลู่ศาสนา! ทหาร จับกุมพวกมัน!"
 ep2_locale_events.1510.b:0 "ปาร์ตี้? มีใครพูดว่าปาร์ตี้?"
 ep2_locale_events.1510.c:0 "กำจัด [instigator_scope.Custom('GetUnbelieverName')] [instigator_scope.GetFaith.GetAdjectiveNoTooltip] ที่ชั่วร้ายนี้ออกไป!"
 ep2_locale_events.1510.d:0 "ออกไป เจ้าพวกอันธพาลที่น่ารัก"
 # ARMORER
 ep2_locale_events.2001.t:1 "$tournament_locale_armorer$: ชื่อเสียงหรือประสิทธิภาพ?"
 ep2_locale_events.2001.desc:0 "ข้าทุบ [improve_armour.GetName] ของข้าลงบนเคาน์เตอร์ และ [tournament_armorer.GetFirstName] ลูบมือไปบนนั้น\n\n"มันอยู่ในสภาพที่แย่ ไม่ได้ดูแลเกราะของท่านมานานแล้วใช่ไหม?" [tournament_armorer.GetSheHe|U] ถอนหายใจและมองไปที่โครงการที่ยังไม่เสร็จ ซึ่งรอ [tournament_armorer.GetHerHim] อยู่\n\n"ข้าไม่มีเวลามากนัก บางทีอาจพอมีเวลาขัดมัน หรืออาจจะทาน้ำมันเพื่อบำรุงรักษาเล็กน้อย ท่านต้องการให้ทำอะไร?"
 ep2_locale_events.2001.a:0 "ขัดมันให้เงาวับเหมือนกระจก!"
 ep2_locale_events.2001.a.tt:0 "[improve_armour.GetName] ได้รับมอดิฟายเออร์ [prestige|E]"
 ep2_locale_events.2001.b:0 "ข้าอยากให้ทาน้ำมันและบำรุงรักษามากกว่า"
 ep2_locale_events.2001.b.tt:0 "[improve_armour.GetName] ได้รับมอดิฟายเออร์ [prowess|E]"
 ep2_locale_events.2001.c:0 "มันอยู่ในสภาพดีอยู่แล้ว"

 ep2_locale_events.2002.t:1 "$tournament_locale_armorer$: สายรัดที่ขาดรุ่งริ่ง"
 ep2_locale_events.2002.desc:0 "[tournament_armorer.GetFirstName] นำเสนอ [armour.GetName] ของข้าอย่างร่าเริง มันส่องประกายเมื่อข้ายกขึ้นสู่แสงสว่าง\n\nขณะที่ข้ายื่นเหรียญให้กับช่างฝีมือผู้พึงพอใจนั้นเอง ข้าสังเกตเห็นเด็กฝึกงานหนุ่มยืนอยู่ข้าง ๆ [tournament_armorer.GetHerHim] [apprentice.GetSheHe|U] เดินเลียบโต๊ะไปขณะที่นายของ [apprentice.GetHerHis] กำลังเก็บเหรียญ\n\n"ขออภัย ท่าน [ROOT.Char.GetLadyLord] แต่..." [apprentice.GetSheHe|U] ชี้ไปที่สายรัดหนังของชุดเกราะ "[tournament_armorer.GetSheHe|U] ไม่ได้จ่ายเงินให้ช่างฟอกหนังเพื่อดูแลรักษาหนัง" \n\nข้าเข้าไปดูใกล้ ๆ ไม่ผิดแน่ หนังนั้นหลุดลุ่ยและเก่า เห็นได้ชัดว่าไม่ใช่ของใหม่ เบื้องหลัง เสียงถุงเงินของช่างทำเกราะดังกรุ๊งกริ๊งขณะที่ [tournament_armorer.GetSheHe] หย่อนทองคำลงไป"
 ep2_locale_events.2002.a:0 "ข้าไม่ใช่ [ROOT.Char.GetWomanMan] ที่จะหลอกลวง [tournament_armorer.GetFirstNameNoTooltip]"
 ep2_locale_events.2002.b:0 "[tournament_armorer.GetFirstNameNoTooltip]! นี่มันหมายความว่าอย่างไร?"
 ep2_locale_events.2002.b.success:0 "[tournament_armorer.GetFirstNameNoTooltip] ซ่อมแซมอย่างไม่เต็มใจ"
 ep2_locale_events.2002.b.failure:0 "[tournament_armorer.GetFirstNameNoTooltip] แถจนรอด [tournament_armorer.GetHerHis] ไปได้"
 ep2_locale_events.2002.c:0 "ข้าจะจ่ายค่าสายรัดที่มีคุณภาพ"
 ep2_locale_events.2002.d:0 "ข้าไม่มีเวลาสำหรับเรื่องนี้"

 ep2_locale_events.2010.t:0 "$tournament_locale_armorer$: ของขวัญป้องกันตัว"
 ep2_locale_events.2010.desc:0 "ร้านช่างทำเกราะเต็มไปด้วยเครื่องป้องกัน ทั้งแบบสวมทับหรือสวมข้างใน ราคาถูกหรือแพง และทุกอย่างที่อยู่ระหว่างนั้น\n\nข้าอดไม่ได้ที่จะนึกถึง [befriend_target.GetFirstName] ขณะที่ข้าตรวจสอบอุปกรณ์ช่วยชีวิต\n\n[befriend_target.GetSheHe|U] อาจจะชื่นชม #EMP บางอย่าง#! ที่นี่ แต่คืออะไร?"
 ep2_locale_events.2010.a:0 "เกราะที่ใช้งานได้จริง"
 ep2_locale_events.2010.a.tt:0 "#F ดึงดูดด้านระมัดระวังของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2010.b:0 "[befriend_actor.GetSheHe|U] อาจจะชอบโล่ประดับนี้"
 ep2_locale_events.2010.b.tt:0 "#F ดึงดูดด้านหยิ่งทะนงของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2010.c:1 "หมวกเหล็กสำหรับการประลองที่ทำขึ้นเป็นพิเศษ"
 ep2_locale_events.2010.c.tt:0 "#F ดึงดูดด้านชอบแข่งขันของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2010.d:0 "ข้าจะหาวิธีอื่นในการสร้างความประทับใจให้ [befriend_target.GetHerHim]"
 ep2_locale_events.2011.reply_armor:0 "ข้างในคือชุด [newly_created_artifact.GetType] ทำมาอย่างดีแม้จะเรียบง่ายไปหน่อย\n\n"
 ep2_locale_events.2011.reply_shield:0 "ข้างในคือโล่ที่เพิ่งหุ้มใหม่ ประดับด้วยตราประจำตระกูลของข้า\n\n"
 ep2_locale_events.2011.reply_tournament:0 "ข้างในคือหมวกเหล็กสำหรับการประลองที่ทำขึ้นเป็นพิเศษ ให้การป้องกันมากกว่าที่ใช้งานได้จริงในสนามรบ\n\n"
 ep2_locale_events.2011.opening:0 "[befriend_actor.GetTitledFirstName] ปรากฏตัวขึ้นนอกกระโจมของข้าอย่างกะทันหัน ถือห่อขนาดใหญ่ "นี่สำหรับท่าน [ROOT.Char.GetFirstNameNoTooltip]" [befriend_actor.GetSheHe] ยิ้มอย่างอบอุ่น ของขวัญ?\n\n"
 ep2_locale_events.2011.success_armor:0 "$ep2_locale_events.2011.reply_armor$มันเป็นชุดที่งดงาม เห็นได้ชัดว่าสร้างขึ้นอย่างแข็งแรงและค่อนข้างพอดีตัวแล้ว"
 ep2_locale_events.2011.armor:0 "$ep2_locale_events.2011.reply_armor$ช่างเป็นชุดที่น่าเกลียด การฝังลายบางอย่างจะแพงขนาดนั้นเชียวหรือ?"
 ep2_locale_events.2011.success_shield:0 "$ep2_locale_events.2011.reply_shield$มันเป็นสิ่งที่แข็งแรง แม้จะทำมาเพื่อแขวน ด้วยตราที่วาดอย่างประณีต"
 ep2_locale_events.2011.shield:0 "$ep2_locale_events.2011.reply_shield$โล่ ข้าจะต้องการโล่ไป #EMP ทำไม#!?"
 ep2_locale_events.2011.success_tournament:0 "$ep2_locale_events.2011.reply_tournament$มันเป็นอุปกรณ์ที่ชาญฉลาด ปรับให้เหมาะกับความต้องการของการแข่งขันมากกว่าสงคราม"
 ep2_locale_events.2011.tournament:0 "$ep2_locale_events.2011.reply_tournament$จริงๆ แล้ว ใครกันที่จริงจังกับการแข่งขันเล็กๆ น้อยๆ เหล่านี้จนต้องโกงแบบนี้?"
 ep2_locale_events.2011.a:0 "ข้าปฏิเสธไม่ได้ว่าของขวัญชิ้นนี้เลือกได้ดี"
 ep2_locale_events.2011.b:0 ""โอ้... ช่างเป็นวัตถุที่... น่าสนใจที่สุด""
 ep2_locale_events.2012.opening:0 "[befriend_target.GetTitledFirstName] รับห่อของหนักด้วยรอยยิ้ม เห็นได้ชัดว่าตื่นเต้นกับของขวัญที่ไม่คาดคิด\n\n"
 ep2_locale_events.2012.success_reply:0 "[befriend_target.GetSheHe|U] ไม่สามารถซ่อนความชื่นชมของ [befriend_target.GetHerHis] ได้ขณะที่ [befriend_target.GetSheHe] ตรวจสอบของขวัญจากทุกมุม"
 ep2_locale_events.2012.reply:0 "[befriend_target.GetSheHe|U] ดูไม่ค่อยมีความสุขนักขณะที่ [befriend_target.GetSheHe] มองดูมัน"
 ep2_locale_events.2012.success_armor:0 "\n\n"นี่เป็นชิ้นส่วนที่งดงาม ข้าจะไร้ความกลัวเมื่อสวมสิ่งนี้เข้าสู่สนามรบ!""
 ep2_locale_events.2012.armor:0 ""โอ้... เกราะ... ข้าเดาว่าอย่างน้อยมันก็มีประโยชน์""
 ep2_locale_events.2012.success_shield:0 "\n\n"ดูนี่สิ! ข้าจะแสดงมันในกระโจมของข้าทันที!""
 ep2_locale_events.2012.shield:0 ""โล่... ดีมาก... ขอบคุณ""
 ep2_locale_events.2012.success_tournament:0 ""ช่างเป็นการออกแบบที่ชาญฉลาด! ข้าจะสวมสิ่งนี้ในการแข่งขันแน่นอน!""
 ep2_locale_events.2012.tournament:0 ""โอ้ สำหรับการแข่งขันท่านว่า? ใช่...""
 ep2_locale_events.2012.success:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าด้วยความรู้สึก ข้าคิดว่าข้าเลือกถูกแล้ว!"
 ep2_locale_events.2012.failure:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างแข็งกระด้าง บางทีข้าอาจเลือกผิด..."
 ep2_locale_events.2012.a:0 "ข้ารู้อยู่แล้ว!"
 ep2_locale_events.2012.b:0 "อย่างน้อยช่างทำเกราะก็มีความสุข..."

 ep2_locale_events.2050.t:0 "$tournament_locale_armorer$: ชุดเกราะแวววาว"
 ep2_locale_events.2050.desc:0 "เมื่อเห็นเกราะของข้า [tournament_armorer.GetFirstName] วางมือของ [tournament_armorer.GetHerHis] บนสะโพกของ [tournament_armorer.GetHerHis] และถอนหายใจเสียงดัง\n\n"เอาล่ะ งานนี้ใหญ่หลวงนัก ไม่ควรใช้เวลานานเกินไปสำหรับคนที่มีพรสวรรค์ #EMP อันน่าทึ่ง#! เช่นข้า แน่นอน!" [tournament_armorer.GetSheHe|U] ยิ้มกว้างให้ข้า ข้ามองไปที่เกราะ มันดูดีสำหรับข้า [tournament_armorer.GetFirstNameNoTooltip] จับความสงสัยของข้าได้และส่ายศีรษะของ [tournament_armorer.GetHerHis]\n\n"ไม่ มันต้องได้รับการดูแลอย่างแน่นอน ข้าจะไม่แนะนำถ้ามันไม่จำเป็น!""
 ep2_locale_events.2050.a:0 "เอาล่ะ แสดงเวทมนตร์ของท่าน"
 ep2_locale_events.2050.a.success:0 "เกราะของท่านได้รับการปรับปรุง"
 ep2_locale_events.2050.a.critsuccess:0 "เกราะของท่านได้รับการปรับปรุงอย่างมีนัยสำคัญ"
 ep2_locale_events.2050.a.armour1:0 "[prowess|E] เพิ่มขึ้น #color_green +1#!"
 ep2_locale_events.2050.a.durability1:0 "[durability|E] เพิ่มขึ้น #color_green +5#!"
 ep2_locale_events.2050.a.armour1.tt:0 "[prowess|E] เพิ่มขึ้น #color_dark_green +1#!"
 ep2_locale_events.2050.a.durability1.tt:0 "[durability|E] เพิ่มขึ้น #color_dark_green +5#!"
 ep2_locale_events.2050.a.criticalsuccess:0 "เกราะของท่านได้รับการปรับปรุงอย่างเห็นได้ชัด"
 ep2_locale_events.2050.a.armour2:0 "[prowess|E] เพิ่มขึ้น #color_green +2#!"
 ep2_locale_events.2050.a.durability2:0 "[durability|E] เพิ่มขึ้น #color_green +10#!"
 ep2_locale_events.2050.a.prestige2:0 "[prestige|E] รายเดือนเพิ่มขึ้น #color_green +0.04%#!"
 ep2_locale_events.2050.a.armour2.tt:0 "[prowess|E] เพิ่มขึ้น #color_dark_green +2#!"
 ep2_locale_events.2050.a.durability2.tt:0 "[durability|E] เพิ่มขึ้น #color_dark_green +10#!"
 ep2_locale_events.2050.a.prestige2.tt:0 "[prestige|E] รายเดือนเพิ่มขึ้น #color_dark_green +0.04%#!"
 ep2_locale_events.2050.a.failure:0 "การซ่อมแซมเกราะของท่านผิดพลาด"
 ep2_locale_events.2050.a.durability3:0 "[durability|E] ลดลง #color_red -5#!"
 ep2_locale_events.2050.b:0 "ข้าคิดว่ามันจะใช้ได้"

 # TAILOR
 ep2_locale_events.2500.t:0 "$tournament_locale_tailor$: ตราประจำตระกูลที่ผิดพลาด"
 ep2_locale_events.2500.desc:1 "ขณะเลือกดูสินค้าที่จัดแสดงในร้านช่างตัดเสื้อ ข้าเห็นห่อที่ห่ออย่างระมัดระวังท่ามกลางกองเสื้อผ้าและของจิปาถะ\n\nช่างตัดเสื้อเปิดให้ข้าดูอย่างมีความสุข ค่อยๆ แกะเชือกหนังออกเพื่อเผยให้เห็นตราที่ปักอย่างประณีต: ตรา #EMP [tailor_mixup.GetHouse.GetBaseName]#!."
 ep2_locale_events.2500.a.rival:0 "พวกสุนัข [tailor_mixup.GetHouse.GetBaseNameNoTooltip]! เผามันซะ ข้าจะ #EMP จ่าย#! ให้เจ้า!"
 ep2_locale_events.2500.a:0 "ช่วยข้าหน่อย เผาสิ่งนี้ทิ้งเสีย"
 ep2_locale_events.2500.b:0 "ฟังนะ ข้าจะเอาสิ่งเหล่านี้ไป แต่ห้ามบอกใคร"
 ep2_locale_events.2500.b.tt:0 "มอดิฟายเออร์นี้จะเพิ่ม [success_chance|E] ของ [hostile_scheme|E] ของท่านต่อตระกูล [tailor_mixup.GetHouse.GetName]"
 ep2_locale_events.2500.c:0 "น่ารัก... ข้าต้องการตรา [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 ep2_locale_events.2500.d:0 "งานดีมาก..."

 ep2_locale_events.2501.t:0 "$tournament_locale_tailor$: เสื้อผ้าที่เหมาะสมกับพระสันตะปาปา"
 ep2_locale_events.2501.desc:0 "ผืนผ้าและสิ่งทอที่ร้านตัดเสื้อมีให้เลือกนั้นมีตั้งแต่ผ้าป่านหยาบไปจนถึงผ้าดามาสก์ ผ้ากำมะหยี่ และผ้าไหมอันเลอเลิศที่สุด ขณะที่ข้ากำลังพินิจดูสิ่งเหล่านี้อยู่ข้าง [ROOT.Char.Custom2('RelationToMeShort', random_knight)] [random_knight.GetFirstName] ของข้า ลวดลายที่คุ้นตาอย่างประหลาดก็ ทำให้ข้าชะงัก\n\nเมื่อยกชุดคลุมทั้งตัวขึ้นส่องแสง ดวงตาของข้าก็เบิกกว้าง มันคือชุดเครื่องยศของพระสันตะปาปาที่จำลองขึ้นใหม่ทั้งชุด!\n\n"เรามีสำหรับพระคาร์ดินัลด้วย [ROOT.Char.Custom('FormOfAddressForLiege')]!" [tournament_tailor.GetFirstName] ช่างตัดเสื้อกล่าวขณะมาวนเวียนอยู่ด้านหลังเราสองคน ดวงตาของ [random_knight.GetFirstNamePossessiveNoTooltip] เป็นประกายด้วยความยินดีขณะที่ [random_knight.GetSheHe] กระทุ้งซี่โครงข้าอย่างแรง ช่างตัดเสื้อเอ่ยขึ้นอีกครั้ง\n\n"และชุดนั้นก็มาพร้อมกับหมวกที่เข้าชุดกันด้วยขอรับ""
 ep2_locale_events.2501.a:0 "#EMP ตกลง!#!"
 ep2_locale_events.2501.a.tt:0 "ท่านและ [knights|E] ของท่านสวมชุด..."
 ep2_locale_events.2501.b:0 "นี่คือการดูหมิ่นศาสนา!"

 ep2_locale_events.2502.t:0 "$tournament_locale_tailor$: เสื้อคลุมต่อสู้"
 ep2_locale_events.2502.desc:0 "ข้ามองช่างตัดเสื้อผู้เฉยเมย วิงวอน[tournament_tailor.GetHerHim]โดยไร้คำพูดให้พูดซ้ำในสิ่งที่ฟังดูเหมือนคำพูดที่ไร้สาระที่สุดที่ข้าเคยได้ยินมาทั้งวัน\n\n"มันคือเสื้อคลุมสำหรับการดวล ท่านไม่เคยได้ยินมาก่อนหรือ?" [tournament_tailor.GetFirstName] ส่ายศีรษะของ[tournament_tailor.GetHerHis]ราวกับว่า #EMP ข้า#! เป็นคนโง่ในห้องนี้ "มันช่วยในการเคลื่อนไหว ช่วยระบายความชื้นทั้งหมดจากการต่อสู้ แต่ยังช่วยให้ท่านอบอุ่นและพร้อมที่จะไปต่อระหว่างรอบ ผู้ยิ่งใหญ่ทุกคนมีมัน!"\n\nเมื่อการขายอย่างหนักของช่างตัดเสื้อสิ้นสุดลง ข้าหันความสนใจกลับไปที่เสื้อคลุมที่ข้าถืออยู่ ผ้ามีความทนทานและมีคุณภาพสูงอย่างเห็นได้ชัด แต่... #EMP เสื้อคลุมสำหรับการดวล? จริงหรือ?!#!"
 ep2_locale_events.2502.a:0 "ขัดกับวิจารณญาณที่ดีกว่าของข้า... ตกลง"
 ep2_locale_events.2502.b:0 "ท่านคิดว่าข้าเป็นคนโง่ เห็นได้ชัด!"
 ep2_locale_events.2502.b.tt:0 "มันคงจะติดไปทุกอย่าง!"

 ep2_locale_events.2510.t:0 "$tournament_locale_tailor$: ของขวัญจากด้าย"
 ep2_locale_events.2510.desc:0 "ข้าสำรวจม้วนผ้าหายากและตัวอย่างผ้าที่แขวนอยู่ที่แผงของช่างตัดเสื้อ ทุกรสนิยมตั้งแต่สูงสุดถึงต่ำสุดมีให้บริการ\n\nข้าอดไม่ได้ที่จะนึกถึงสิ่งที่ [befriend_target.GetFirstName] จะชื่นชมขณะที่ข้ามองดูเครื่องประดับ\n\nไม่ต้องสงสัยเลยว่า #EMP บางอย่าง#! ที่นี่จะดึงดูดใจ [befriend_target.GetHerHim]..."
 ep2_locale_events.2510.a:0 "ธงที่งดงาม"
 ep2_locale_events.2510.a.tt:0 "#F ดึงดูดด้านหยิ่งทะนงของ [befriend_target.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2510.b:0 "ไม่มีอะไรมีประโยชน์ไปกว่าเสื้อเกราะนวม"
 ep2_locale_events.2510.b.tt:0 "#F ดึงดูดด้านชอบสงครามของ [befriend_target.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2510.c:0 "ถุงมือหนังแกะเหล่านี้งดงามมาก"
 ep2_locale_events.2510.c.tt:0 "#F ดึงดูดด้านอ่อนโยนของ [befriend_target.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.2510.d:0 "บางทีอาจเป็นครั้งหน้า"
 ep2_locale_events.2511.reply_banner:0 "ข้างในคือธงทออย่างประณีตพับอยู่ แสดงตราของท่าน\n\n"
 ep2_locale_events.2511.reply_gambeson:0 "ข้างในคือเสื้อเกราะนวมบุนวม เสื้อที่แข็งแรงทนทานสวมใต้เกราะโซ่\n\n"
 ep2_locale_events.2511.reply_glove:0 "ข้างในคือถุงมือหนังแกะนุ่มๆ ที่ตัดเย็บอย่างประณีต\n\n"
 ep2_locale_events.2511.opening:0 "[befriend_actor.GetTitledFirstName] ปรากฏตัวขึ้นราวกับมาจากไหน ยื่นห่อพับให้ข้าอย่างสง่างามพร้อมรอยยิ้ม ของขวัญ?\n\n"
 ep2_locale_events.2511.success_banner:0 "$ep2_locale_events.2511.reply_banner$ข้าหาข้อบกพร่องไม่ได้ ตราสัญลักษณ์ของข้าถูกจับภาพได้อย่างแม่นยำและมีรสนิยม"
 ep2_locale_events.2511.banner:0 "$ep2_locale_events.2511.reply_banner$ความไม่กระตือรือร้นของข้าเห็นได้ชัด ข้าต้องการสิ่งนี้ไปทำไม?"
 ep2_locale_events.2511.success_gambeson:0 "$ep2_locale_events.2511.reply_gambeson$เมื่อตรวจสอบอย่างใกล้ชิด มันเป็นชิ้นงานที่งดงาม หลายชั้นและแข็งแรงทนทานอย่างเห็นได้ชัด"
 ep2_locale_events.2511.gambeson:0 "$ep2_locale_events.2511.reply_gambeson$ข้าสามารถหาของแบบนี้ได้จากช่างทอผ้าเล็กๆ ทั่วไป แล้วไงล่ะ?"
 ep2_locale_events.2511.success_glove:0 "$ep2_locale_events.2511.reply_glove$พวกมันเรียบเนียนเหมือนกำมะหยี่ และไม่น่าเชื่อว่าพอดีตัวเกือบสมบูรณ์แบบ"
 ep2_locale_events.2511.glove:0 "$ep2_locale_events.2511.reply_glove$ช่าง... บอบบาง..."
 ep2_locale_events.2511.a:0 "ข้าอดไม่ได้ที่จะยิ้มออกมา นี่มันสมบูรณ์แบบ!"
 ep2_locale_events.2511.b:0 ""ข้า... ขอบคุณ...""
 ep2_locale_events.2512.opening:0 "[befriend_target.GetTitledFirstName] รับห่อของข้าอย่างสง่างาม เปิดมันอย่างระมัดระวังเท่าที่ความตื่นเต้นของ [befriend_target.GetHerHis] จะอำนวย\n\n"
 ep2_locale_events.2512.success_reply:0 "ดวงตาของ [befriend_target.GetHerHis|U] อบอุ่นขึ้นทันทีเมื่อเห็นมัน เป็นสัญญาณที่ดี"
 ep2_locale_events.2512.reply:0 "ข้าไม่สามารถวัดปฏิกิริยาของ [befriend_target.GetHerHis] ได้ ราวกับว่ามันไม่ได้เปลี่ยนไปเลย"
 ep2_locale_events.2512.success_banner:0 "\n\n"นี่มันยอดเยี่ยมมาก! การปักที่ชำนาญ เช่นนี้ช่วยเสริมการออกแบบ!""
 ep2_locale_events.2512.banner:0 ""โอ้ ธง ข้าจะ... แขวนมันทันที""
 ep2_locale_events.2512.success_gambeson:0 "\n\n"ช่างเป็นงานฝีมือที่งดงาม สิ่งนี้จะหยุดได้ทุกอย่างยกเว้นการโจมตีที่หนักที่สุด""
 ep2_locale_events.2512.gambeson:0 ""ข้าจะ... วางมันไว้กับของอื่นๆ ของข้า...""
 ep2_locale_events.2512.success_glove:0 ""พระเจ้าช่วย นี่มันสมบูรณ์แบบ! ท่านทำได้อย่างไร?!""
 ep2_locale_events.2512.glove:0 ""โอ้ ถุงมือ... ดีมาก...""
 ep2_locale_events.2512.success:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างมากมายก่อนที่เราจะแยกทางกัน"
 ep2_locale_events.2512.failure:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างห้วนๆ ก่อนจะจากไป..."
 ep2_locale_events.2512.a:0 "เป็นไปได้ด้วยดี"
 ep2_locale_events.2512.b:0 "โอ้ เอาเถอะ..."
 
 ep2_locale_events.2560.t:0 "$tournament_locale_tailor$: การซื้อใหม่"
 ep2_locale_events.2560.desc.intro:0 "ข้าพบ [tailor.GetTitledFirstName] กำลังตัดผ้า โต๊ะสองสามตัวถูกจัดวางเพื่อแสดงผลงานของ [tailor.GetHerHis]: ถุงน่องและผ้าคลุมศีรษะ ผ้าคลุมไหล่และแขนเสื้อ ตรงข้าม เตาผิงกำลังลุกไหม้เบาๆ\n\n"
 ep2_locale_events.2560.desc.previous_artifact:0 ""ท่านกำลังมองหาบางสิ่งเพื่อประดับเครื่อง แต่งกายหรือ [ROOT.Char.Custom('FormOfAddressForLiege')]? ข้าเห็นว่าท่านได้นำสิ่งประดิษฐ์ล้ำค่าบางอย่างมาจากเมืองหลวงด้วย... หากท่านจะอนุญาต ข้าใฝ่ฝันมาตลอดว่าอยากจะพินิจผลงานของเหล่าปรมาจารย์แห่ง[capital_barony.GetAdjectiveNoTooltip]""
 ep2_locale_events.2560.desc.new_artifact:0 ""ระวังขอรับ!" [tailor.GetSheHe] เตือนข้า พลางทำเครื่องมือเกือบหลุดมือ "ท่านเกือบจะสะดุดผ้าลินินแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')]" [tailor.GetSheHe] พึมพำอย่างขอโทษ รีบเก็บเสื้อผ้าขึ้นมา "ข้ามั่นใจว่าข้าเดาจุดประสงค์ในการมาเยือนของท่านได้" ใบหน้าของ [tailor.GetHerHis] โผล่ออกมาจากกองผ้ายุ่งเหยิงนั้นแทบไม่พ้น"
 ep2_locale_events.2560.desc.new_artifact_2:0 ""ท่าน [ROOT.Char.GetLadyLord] กำลังมองหาสิ่งใดเป็นพิเศษหรือไม่?" [tailor.Custom('quirk_pos_standalone')|l] ของสะสมข้าง ๆ [tailor.GetHerHim] นั้นน่าประทับใจกว่าที่ข้าคาดไว้อย่างแท้จริง"
 ep2_locale_events.2560.a:0 ""จริงๆ แล้ว [previous_artifact.GetNameNoTooltip] ของข้าต้องการการตก แต่งบ้าง...""
 ep2_locale_events.2560.b:0 ""ข้าขอซื้อ [purchasable_trinket.GetNameNoTooltip] นั่นได้ไหม?""
 ep2_locale_events.2560.c:0 ""ท่านกำลังขอให้ข้า #EMP จ่าย#! ค่ามันหรือ?""
 ep2_locale_events.2560.c.success:0 "ท่านข่มขู่ [tailor.GetShortUIName]"
 ep2_locale_events.2560.c.failure:0 "[tailor.GetShortUIName] ไม่ได้ถูกข่มขู่"
 ep2_locale_events.2560.d:0 ""ธงบางผืนจะกระตุ้นให้ผู้ชมเชียร์ข้า!""
 ep2_locale_events.2560.e:0 ""นี่ รักษาผลงานที่ดีต่อไป""
 feather_trinket:0 "ขนนกสดใส"
 feather_trinket.desc:0 "ขนนกสีสันสดใส กล่าวกันว่าเป็นของนกยูง การได้มา ซึ่งของแปลกใหม่"
 chess_trinket:0 "ตัวหมากรุก"
 chess_trinket.desc:0 "หุ่นแกะสลักที่สวยงามจากคริสตัลหิน รูปทรงนามธรรม ทำให้ยากที่จะบอกว่ามันแทนอะไร"
 ribbon_trinket:0 "ริบบิ้นหรูหรา"
 ribbon_trinket.desc:0 "แถบผ้าไหม ปักลายดอกไม้ ของขวัญชั้นดี"
 glass_orb_trinket:0 "ลูกแก้ว"
 glass_orb_trinket.desc:0 "ทรงกลมคริสตัล มันจะไม่มีวันโปร่งใสอย่างสมบูรณ์"
 tapestry_trinket:0 "พรมทอรูปแกะ"
 tapestry_trinket.desc:0 "พรมทอภาพฉากชนบท สัตว์ต่างๆ กำลังดื่มน้ำจากลำธารที่สงบ"
 tournament_banners_modifier:0 "ธงประลอง"
 tournament_banners_modifier_desc:0 "ตัวละครนี้ได้สั่งทำธงสำหรับผู้ชม"
 ep2_locale_events_artifact_decoration_desc:0 "[previous_artifact.GetDesc]\n\nมันถูกตก แต่งด้วยริบบิ้นลายดอกไม้"
 artifact_monthly_prestige_3_modifier:0 "ริบบิ้นตก แต่ง"

# VISITOR CAMP
 ep2_locale_events.3001.t:0 "$tournament_locale_visitor_camp$: ขโมยเวลาสักครู่"
 ep2_locale_events.3001.desc:0 "ในที่สุดเมื่อข้าได้อยู่ตามลำพังในกระโจมกับ [lover.GetFirstName] ห่างจากความวุ่นวายของการประลอง ความเหนื่อยล้าอย่างสุดซึ้งก็ถาโถมเข้ามา ข้าทรุดตัวลงบนฟ่อนฟางที่คลุมไว้ จิตใจของข้าปวดร้าวพอๆ กับร่างกาย\n\nข้าได้ยิน [lover.GetFirstNameNoTooltip] พึมพำกับทหารยาม — บางอย่างเกี่ยวกับการไม่ถูกรบกวน — และอีกไม่กี่นาทีต่อมาข้ารู้สึกถึงความอบอุ่นของ [lover.GetHerHis] ข้างๆ ข้า\n\n"ท่านดูเหนื่อยมาก ที่รัก" ข้าได้ยินความกังวลในเสียงของ [lover.GetHerHis] "ท่านต้องพักผ่อนก่อนการแข่งขันจะเริ่ม อยู่ที่นี่กับข้าสักครู่เถิด ได้โปรด?""
 ep2_locale_events.3001.a:0 "ข้าไม่ได้ #EMP เหนื่อย#! ขนาดนั้น..."
 ep2_locale_events.3001.b:0 "ข้าอยากทำ เช่นนั้น"
 ep2_locale_events.3001.c:0 "ข้าต้องเตรียมตัว!"

 ep2_locale_events.3002.t:0 "$tournament_locale_visitor_camp$: นักรบผู้มักมากในกาม"
 ep2_locale_events.3002.desc:0 "นั่นเสียงอะไร? เสียงหัวเราะคิกคัก... เสียงครวญครางเล็กน้อย? มัน #EMP ฟังดู#! เหมือนมาจากกระโจมนั้น\n\nความอยากรู้อยากเห็นของข้ามีชัยเหนือข้าขณะที่ข้าเดินไปยังผ้าใบหนาที่เสียงดังออกมาด้วยความคาดหวังและความหวั่นเกรงเท่าๆ กัน ข้าดึงผ้าคลุมออกเพื่อพบกับภาพที่ค่อนข้างน่าตื่นตาตื่นใจ\n\n[lech1.GetFirstName] ถูกจับได้คาหนังคาเขา #EMP อย่างโจ่งแจ้ง#! ตื่นตระหนกทางร่างกาย ผลักคู่ขาของ [lech1.GetHerHis] ออกจาก [lech1.GetHerHim] ลงบนพื้น ข้าเพ่งมองเข้าไปในความมืดสลัวเพื่อพบ [lech2.GetFirstName] และ [lech3.GetFirstName] กำลังดิ้นรนเพื่อประมวลผลการตอบสนองที่ดีที่สุดต่อเหตุการณ์ เช่นนี้ รีบเร่งและพยายามซ่อนคู่ขาของตนเองอย่างเปล่าประโยชน์"
 ep2_locale_events.3002.a:0 "มีที่ว่างสำหรับอีกคนไหม?"
 ep2_locale_events.3002.b:0 "คนโง่! พวกเจ้าต้องใช้เวลา #EMP เตรียมตัว#!!"
 ep2_locale_events.3002.c:0 "อย่าให้ข้ารบกวนพวกท่านเลย!"
 ep2_locale_events.3002.c.tt:0 "ปล่อยให้พวกเขาทำต่อไปดีกว่า ใช่ไหม?"

 # FARRIER
 ep2_locale_events.3500.t:0 "$tournament_locale_farrier$: การทิ่มเล็กน้อย"
 ep2_locale_events.3500.desc:0 "ข้านำม้าของข้าไปใส่เกือกใหม่ก่อนการเปิดการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName] เฝ้าดูเด็กฝึกงานของ [tournament_farrier.GetFirstNamePossessive] ตัดกีบเท้าของสัตว์ราคาแพงของข้าอย่างระมัดระวัง\n\nข้ารู้สึกไม่ดีเกี่ยวกับเด็กหนุ่มคนนี้ และแน่นอน ตะปูตัวแรกยาวเกินไป สัตว์ร้ายเตะอย่างดุเดือด เกือบโดน [tournament_farrier.GetFirstNameNoTooltip] และเดินกะเผลกไปรอบๆ ร้านด้วยความเจ็บปวด\n\n"
 ep2_locale_events.3500.war:0 "เด็กฝึกงานวิ่งตาม #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — [ROOT.Char.Custom('HorseStoryMareStallion')] จะต้องเปลี่ยนเกือกทันที"
 ep2_locale_events.3500.race:0 "เด็กฝึกงานวิ่งตาม #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — [ROOT.Char.Custom('ContestHorseRaceGender')] จะต้องเปลี่ยนเกือกทันที"
 ep2_locale_events.3500.other:0 "เด็กฝึกงานวิ่งตาม [ROOT.Char.Custom('ContestHorseRaceHerHim')] — [ROOT.Char.Custom('ContestHorseRaceGender')] จะต้องเปลี่ยนเกือกทันที"
 ep2_locale_events.3500.a:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] มีค่ามากกว่าค่าจ้างห้าปีของเจ้า เจ้าโง่!"
 ep2_locale_events.3500.a.war_horse:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] มีค่ามากกว่าค่าจ้างห้าปีของเจ้า เจ้าโง่!"
 ep2_locale_events.3500.b:0 "เด็กฝึกงานคนนั้นจะไม่ได้ทำงานในอาณาจักรของข้าอีกต่อไป!"
 ep2_locale_events.3500.c:0 "ข้าคาดหวังว่าสิ่งนี้จะไม่เสียค่าใช้จ่าย!"
 ep2_locale_events.3500.d:0 "ระวังให้มากขึ้นในอนาคต"
 every_attending_contestant_tt:0 "ผู้เข้าแข่งขันทุกคน"
 # BOWYER
 ep2_locale_events.4000.t:0 "$tournament_locale_bowyer$: เหตุการณ์ช่างทำคันธนู"
 ep2_locale_events.4000.desc:0 "ข้ารักลูกธนูที่ดี!"
 ep2_locale_events.4000.a:0 "ติดขนนก"
 ep2_locale_events.4000.b:0 "ไม่ติดขนนก"

 ep2_locale_events.4001.t:0 "$tournament_locale_bowyer$: โค้งงอ แต่ไม่..."
 ep2_locale_events.4001.desc:1 ""ดูเหมือนจะใช้ได้สำหรับข้า!" [tournament_bowyer.GetFirstName] กำลังทดสอบคันธนูที่ข้านำมาให้ [tournament_bowyer.GetHerHim] ตรวจสอบ ข้าค้นดูในกองลูกธนูที่วางซ้อนกันบนโต๊ะข้างๆ ขณะที่ [tournament_bowyer.GetSheHe] ตรวจสอบต่อไป\n\n"ขอบนำดูเหมือนจะเบี้ยวไปหน่อย" ดวงตาของช่างทำคันธนูหรี่ลงขณะที่ [tournament_bowyer.GetSheHe] จับแขนคันธนูแน่น งอพวกมันมากขึ้นเรื่อยๆ "นั่นไง เห็นไหม มีการบิดเบี้ยวบางอย่างใน—"\n\n#EMP แคร็ก!#! ปากของ [tournament_bowyer.GetFirstNamePossessiveNoTooltip] อ้าค้างด้วยความตกใจเมื่อคันธนูหัก การประท้วงของ [tournament_bowyer.GetHerHis] ว่าการตรวจสอบนั้นจำเป็นและคันธนูคงจะหักอยู่แล้วดังไปทั่วห้อง แต่เป็นข้าที่ถูกทิ้งให้สูญเสีย"
 ep2_locale_events.4001.a:0 "เจ้าควรจะให้ของทดแทนแก่ข้า โดยไม่คิดค่าใช้จ่าย!"
 ep2_locale_events.4001.a.success:1 "[tournament_bowyer.GetFirstNameNoTooltip] เปลี่ยนคันธนูให้โดยไม่คิดค่าใช้จ่าย"
 ep2_locale_events.4001.a.failure:1 "[tournament_bowyer.GetFirstNameNoTooltip] ปฏิเสธที่จะจ่าย"
 ep2_locale_events.4001.b:0 "ให้ตายสิ เอาล่ะ เจ้ามีขายไหม?"
 ep2_locale_events.4001.c:1 "เจ้า [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]! เจ้า... เจ้า... #EMP [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]#!!"

 ep2_locale_events.4010.t:0 "$tournament_locale_bowyer$: ของขวัญขีปนาวุธ"
 ep2_locale_events.4010.desc:0 "ข้าสำรวจสินค้าที่จัดแสดงที่แผงของช่างทำคันธนู ชื่นชมคันธนู ลูกธนู และอุปกรณ์เสริมต่างๆ\n\nข้านึกถึง [befriend_target.GetFirstName] ทันทีขณะที่ข้าพิจารณาสิ่งของที่มีประโยชน์จำนวนมากที่นำเสนอ\n\nบางทีบางอย่างที่นี่อาจจะถูกใจ [befriend_target.GetHerHis]..."
 ep2_locale_events.4010.a:0 "คันธนูใหม่"
 ep2_locale_events.4010.a.tt:0 "#F ดึงดูดด้านปฏิบัติของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4010.b:0 "ซองธนูที่ดีเป็นสิ่งจำเป็นที่ถูกมองข้าม"
 ep2_locale_events.4010.b.tt:0 "#F ดึงดูดด้านการจัดระเบียบของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4010.c:0 "ลูกธนูล่าสัตว์เหล่านี้มีเอกลักษณ์เฉพาะตัว"
 ep2_locale_events.4010.c.tt:0 "#F ดึงดูดด้านกระตือรือร้นของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4010.d:0 "ข้าไม่คิด เช่นนั้น"
 ep2_locale_events.4011.reply_bow:0 "ข้างในคือคันธนูที่ยังไม่ได้ใช้งาน พร้อมชุดลูกธนู\n\n"
 ep2_locale_events.4011.reply_quiver:0 "ข้างในคือซองธนูที่ออกแบบมาอย่างน่าสนใจ ใหญ่กว่าปกติ\n\n"
 ep2_locale_events.4011.reply_hunt:0 "ข้างในคือชุดลูกธนูล่าสัตว์ที่สร้างขึ้นอย่างพิถีพิถัน\n\n"
 ep2_locale_events.4011.opening:0 "[befriend_actor.GetTitledFirstName] ปรากฏตัวขึ้นต่อหน้าข้าอย่างกะทันหัน ห่อที่มีรูปร่างแปลกประหลาดอยู่ในอ้อมแขนที่ยื่นออกมาของ [befriend_actor.GetHerHis] ของขวัญ?\n\n"
 ep2_locale_events.4011.success_bow:0 "$ep2_locale_events.4011.reply_bow$นี่เป็นผลงานชั้นเลิศ คันธนูที่คู่ควรกับขุนนาง"
 ep2_locale_events.4011.bow:0 "$ep2_locale_events.4011.reply_bow$ยากที่จะซ่อนความผิดหวังของข้าได้ หมายถึง คันธนูเนี่ยนะ..."
 ep2_locale_events.4011.success_quiver:0 "$ep2_locale_events.4011.reply_quiver$ข้าใช้เวลาพินิจมันอยู่ครู่หนึ่ง นี่คือแล่งธนูที่เข้ากับสรีระที่สุดเท่าที่ข้าเคยเห็นมา!"
 ep2_locale_events.4011.quiver:0 "$ep2_locale_events.4011.reply_quiver$ข้าจะเอาสิ่งนี้ไปทำอะไร? เอาจริง ๆ นะ..."
 ep2_locale_events.4011.success_hunt:0 "$ep2_locale_events.4011.reply_hunt$พวกมันมีโครงสร้างแข็งแรงทนทานเป็นพิเศษ และเห็นได้ชัดว่าสมบูรณ์แบบสำหรับการยิงสัตว์ป่าขนาดเล็ก"
 ep2_locale_events.4011.hunt:0 "$ep2_locale_events.4011.reply_hunt$ลูกธนูล่าสัตว์? ท่าน #EMP ไม่น่า#! ลำบากเลย..."
 ep2_locale_events.4011.a:0 "ข้าอดไม่ได้ที่จะยิ้ม [befriend_actor.GetSheHe] เลือกได้ดี!"
 ep2_locale_events.4011.b:0 ""ช่างเป็น... ของขวัญที่คิดมาอย่างดี...""
 ep2_locale_events.4012.opening:0 "[befriend_target.GetTitledFirstName] รับมันอย่างมีความสุข เปิดเชือกผูกห่อด้วยความยินดีเหมือนเด็ก\n\n"
 ep2_locale_events.4012.success_reply:0 "ดวงตาของ [befriend_target.GetHerHis|U] เบิกกว้างเมื่อ [befriend_target.GetSheHe] เห็นมัน — ข้ารู้สึกดี"
 ep2_locale_events.4012.reply:0 "หัวใจของ [befriend_target.GetHerHis|U] ดูเหมือนจะห่อเหี่ยวเมื่อ [befriend_target.GetSheHe] เห็นมัน"
 ep2_locale_events.4012.success_bow:0 "\n\n"ช่างเป็น [newly_created_artifact.GetType] แกะสลักที่เชี่ยวชาญ! ข้าจะทะนุถนอมมัน!""
 ep2_locale_events.4012.bow:0 ""[newly_created_artifact.GetType]! ดี ดี""
 ep2_locale_events.4012.success_quiver:0 "\n\n"นี่คือสิ่งที่น่าจับตามอง! ท่านไปหาสิ่งนี้มาจากไหน?""
 ep2_locale_events.4012.quiver:0 ""ที่ใส่ลูกธนู? ข้าเข้าใจแล้ว""
 ep2_locale_events.4012.success_hunt:0 ""โอ้ ข้าตามหาสิ่งนี้มานานแล้ว!""
 ep2_locale_events.4012.hunt:0 ""สำหรับล่าสัตว์ท่านว่า? ใช่ ใช่""
 ep2_locale_events.4012.success:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้า วางมือบนไหล่ของข้า ข้าคิดว่าข้ายิงเข้าเป้า!"
 ep2_locale_events.4012.failure:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างรวบรัดก่อนจากไป ข้าคิดอะไรอยู่..."
 ep2_locale_events.4012.a:0 "ยิงได้แม่นยำ"
 ep2_locale_events.4012.b:0 "มีประโยชน์อะไร..."

 ep2_locale_events.4050.t:0 "$tournament_locale_bowyer$: เตรียมตัวให้พร้อม"
 ep2_locale_events.4050.desc:0 "ขณะค้นหากองลูกธนูและสายธนูที่กองสุมกัน ข้าก็พบกับกองสนับแขนหนังชั้นดีที่วางเรียงไว้อย่างเป็นระเบียบ เมื่อสวมชิ้นหนึ่งเข้ากับปลายแขน แผ่นหนังที่แข็งตัวก็ช่วยป้องกันด้านในของแขนข้า\n\n"นี่คือสนับแขนที่ดีที่สุดของเรา [ROOT.Char.Custom('FormOfAddressForLiege')] สายธนูดีดใส่สักหมื่นครั้งก็ไม่ทะลุ!" [tournament_bowyer.GetFirstName] สัมผัสได้ถึงโอกาสในการขาย และ [tournament_bowyer.GetSheHe] ก็รีบถลันมาอยู่ข้างกายข้า\n\nข้าทดสอบหนังอย่างพินิจพิเคราะห์ ชั่งน้ำหนักมันในมือ"
 ep2_locale_events.4050.a:0 "บางทีเราอาจจะต่อรองกันได้?"
 ep2_locale_events.4050.a.success:0 "ท่านต่อรองราคาสำเร็จ"
 ep2_locale_events.4050.a.failure:0 "การเจรจาต่อรองของท่านล้มเหลว"
 ep2_locale_events.4050.a.critfailure:0 "[tournament_bowyer.GetFirstNameNoTooltip] ปฏิเสธที่จะขายด้วยความรำคาญ"
 ep2_locale_events.4050.b:0 "ข้าเอาสองอัน!"
 ep2_locale_events.4050.c:0 "เท่าไหร่?"
 ep2_locale_events.4050.d:0 "ข้าอยู่ได้โดยไม่มีสิ่งนี้"

 # WEAPONSMITH
 ep2_locale_events.4500.t:0 "$tournament_locale_weaponsmith$: เศษเสี้ยวจากดาบเก่า"
 ep2_locale_events.4500.start:0 "ข้ายื่น "
 ep2_locale_events.4500.artifact:0 "[chipped_sword.GetName] "
 ep2_locale_events.4500.noartifact:0 "อาวุธของข้า "
 ep2_locale_events.4500.end:2 "เพื่อเตรียมพร้อมสำหรับการทดลองข้างหน้า แต่ความเสียใจก็เข้ามาทันทีที่มันออกจากมือข้า [tournament_weaponsmith.GetFirstName] ช่างตีเหล็กเห็นได้ชัดว่ามีคำขอมากมาย และ [tournament_weaponsmith.GetSheHe] ก็ส่งต่อให้เด็กฝึกงานที่ดูขี้ตื่นจัดการ\n\n[apprentice.GetWomanMan] หนุ่มรับอาวุธอย่างตื่นเต้น ฟาดมันไปในอากาศอย่างไม่ระมัดระวัง — ไม่ระมัดระวังเกินไป มันกระทบกับทั่งตีเหล็กใกล้ๆ ทำให้เกิดรอยบิ่นลึกบนตัวมัน!\n\nเสียงตะโกนโดยไม่สมัครใจของข้า ทำให้ช่างตีเหล็กหันมาด้วยความสยดสยอง คว้าอาวุธที่เสียหายด้วยมือข้างหนึ่งและตบหู [apprentice.Custom('GirlBoy')] ด้วยมืออีกข้าง"
 ep2_locale_events.4500.a:0 "ซ่อมมัน! ซ่อมมันเดี๋ยวนี้!"
 ep2_locale_events.4500.a.tt:0 "มันจะมีค่าใช้จ่าย และจะต้องใช้แรงงานหยาบๆ พอสมควรในการซ่อม แต่ข้าต้องการให้มันเสร็จ!"
 ep2_locale_events.4500.b:0 "โอ้ เพื่อ-... เจ้ามีขายไหม?"
 ep2_locale_events.4500.c:0 "แค่ส่งมันมานี่!"
 tournament_sword_name:0 "ดาบประลอง"
 tournament_sword_description:1 "$artifact_sword_description$\n\nอาวุธนี้ซื้อมาจากการประลอง"
 tournament_sword.martiallifestyle:1 "$tournament_sword_description$ โครงสร้างที่ทนทานแสดงให้เห็นถึงความมุ่งมั่นที่จะเป็นดาบสังหารเป็นอันดับแรกและสำคัญที่สุด"
 tournament_sword.controlledadv:1 "$tournament_sword_description$ คำจารึกบนใบดาบอ้างถึงการปกป้องอาณาจักร"
 tournament_sword.foreignfaith:1 "$tournament_sword_description$ ข้อความแปลกๆ และต่างชาติบนใบดาบดูเหมือนจะอ้างถึงศาสนาที่ไม่รู้จัก"

 ep2_locale_events.4501.t:0 "$tournament_locale_weaponsmith$: เตรียมพร้อมรบ"
 ep2_locale_events.4501.desc:0 "ข้ากำลังดู [tournament_weaponsmith.GetFirstName] ตีอาวุธใหม่เมื่อข้าได้ยินเสียง #EMP แคล้ง#! เล็กๆ แต่สังเกตได้ ตามด้วยคำสาปแช่งที่พึมพำ แต่หายใจหอบอย่างน่าประหลาด เมื่อมองผ่านความมืดสลัว ในที่สุดข้าก็เห็น [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] [spying_spouse.GetFirstName] ของข้ากำลังหมอบอยู่หลังโต๊ะเล็กๆ!\n\nจุดประสงค์ของ [spying_spouse.GetHerHis|U] ชัดเจนในไม่ช้า ดวงตาของ [spying_spouse.GetHerHis|U] กวาดไปทั่วแขนที่เต็มไปด้วยเส้นเอ็นของ [tournament_weaponsmith.GetFirstNamePossessiveNoTooltip] ขณะที่เหงื่อไหลเป็นทางผ่านกล้ามเนื้อที่เป็นมัด เห็นได้ชัดว่าใบหน้าที่แดงก่ำของ [spying_spouse.GetFirstNamePossessiveNoTooltip] ไม่ใช่แค่ เพราะความร้อน...\n\nข้าก้าวเข้าไปหา [spying_spouse.GetHerHim] แค่นั้นก็พอ: [spying_spouse.GetFirstNameNoTooltip] แทบจะกลั้นหายใจไม่อยู่เมื่อเราสบตากัน ถูกจับได้คาหนังคาเขา"
 ep2_locale_events.4501.a:0 "บางทีเราควรจะดูว่าความสนใจนี้มีร่วมกันหรือไม่?"
 ep2_locale_events.4501.a.tt:0 "รอยยิ้มที่มุมปากของช่างตีเหล็กคนนั้นบอกอะไรได้มากมาย ข้ารับรอง..."
 #ep2_locale_events.4501.a.custom.tt: "#high [spying_spouse.GetFirstName]#! lays with #high [tournament_weaponsmith.GetFirstName]#!"
 ep2_locale_events.4501.b:0 "เอาล่ะ พวกมันเป็นแขนที่ #EMP แข็งแรง#! มาก..."
 ep2_locale_events.4501.b.tt:0 "เห็นได้ชัดว่า [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] ของข้ามีรสนิยมที่ยอดเยี่ยม!"
 ep2_locale_events.4501.c:0 "เฮ้! เราจะไปแล้ว!"
 ep2_locale_events.4501.d:0 "[spying_spouse.GetSheHe|U] แค่มองดู ไม่เสียหายอะไร"

 ep2_locale_events.4505.t:0 "$tournament_locale_weaponsmith$: ดาบอันโด่งดัง"
 ep2_locale_events.4505.desc:0 "ทันทีที่ข้าเข้าสู่โรงตีเหล็ก ดวงตาของ [tournament_weaponsmith.GetFirstNamePossessive] ก็เบิกกว้าง ในอ้อมแขนของ [tournament_weaponsmith.GetHerHis] ประคองผ้าห่มแพรผืนหนึ่งไว้อย่างเคารพนบนอบ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]" เสียงของ [tournament_weaponsmith.GetHerHis|U] สั่นเครือเล็กน้อย "ทักษะและความปรีชาสามารถในการใช้ดาบของท่านนั้นเป็นที่เลื่องลือ ข้า... ข้าสร้างสิ่งนี้ให้ท่าน"\n\n[tournament_weaponsmith.GetSheHe|U] เปิดผ้าคลุมออก เผยให้เห็นดาบที่งดงามโอ่อ่าอย่างน่าพิศวง เมื่อข้ารับมันมาไว้ในมือ ก็เห็นได้ชัดว่ามันมีคุณภาพดีที่สุด อาวุธชิ้นนี้ให้ความรู้สึกราวกับเป็นส่วนหนึ่งของแขนข้า\n\n"ข้าตีมันขึ้นมาให้เหมาะกับท่วงท่าของท่านโดยเฉพาะ [ROOT.Char.Custom('FormOfAddressForLiege')] มันจะเป็นเกียรติอันสูงสุดหากท่านจะยอมรับมันเป็นของขวัญ""
 ep2_locale_events.4505.a:0 "เกียรติเป็นของข้าทั้งหมด [tournament_weaponsmith.GetFirstNameNoTooltip]"
 ep2_locale_events.4505.a.tt:0 "ของขวัญ?! นี่มีค่าเท่ากับดาบพันเล่ม ไม่ว่าถ้าข้าจะรับ!"
 ep2_locale_events.4505.b:0 "อาวุธที่ดี เช่นนี้สมควรได้รับการชำระเงินที่เหมาะสม"
 ep2_locale_events.4505.c:0 "ข้าไม่ต้องการดาบห่วยๆ ของเจ้า!"

 ep2_locale_events.4506.t:0 "$tournament_locale_weaponsmith$: ชื่อนั้นสำคัญไฉน?"
 ep2_locale_events.4506.desc:0 ""มันต้องการชื่อ"\n\nการขัดจังหวะของ [tournament_weaponsmith.GetFirstNamePossessive] ขณะที่ข้ากำลังทดลองแกว่งดาบใหม่ของข้าสองสามครั้ง ทำให้ข้าเลิกคิ้วใส่ช่างตีเหล็ก\n\n"อาวุธทั้งหมดที่ถือโดยผู้ที่เป็นตำนานล้วนมีชื่อ มันเป็นสิ่งที่ต้องทำ! ดาบของนักรบผู้ยิ่งใหญ่ต้องการชื่ออันยิ่งใหญ่ เพื่อให้ศัตรูหวาดกลัว!" [tournament_weaponsmith.GetFirstNameNoTooltip] ยืนกราน"
 ep2_locale_events.4506.a:0 "ข้ามีชื่อ เช่นนั้นอยู่ในใจ"
 ep2_locale_events.4506.a.tt:0 "[rename_artifact.GetName] ได้รับชื่อใหม่"
 ep2_locale_events.4506.b:0 "ดาบเป็นเครื่องมือ ไม่มากไปกว่านั้น"

 ep2_locale_events.4510.t:0 "$tournament_locale_weaponsmith$: ของขวัญเชิงรุก"
 ep2_locale_events.4510.desc:0 "เมื่อมองไปรอบๆ โรงตีเหล็กของช่างตีเหล็ก เครื่องมือสังหารทุกชนิดและสิ่งของที่สร้างขึ้นอย่างประณีตก็ดึงดูดสายตา\n\nจิตใจของข้าล่องลอยไปหา [befriend_target.GetFirstName] ขณะที่ดวงตาของข้ากวาดไปทั่วชั้นวางที่แวววาว\n\nหากข้าจะเอาชนะใจ [befriend_target.GetHerHim] ข้าจะต้องหาสิ่งที่ #EMP [befriend_target.GetSheHe]#! จะชื่นชม..."
 ep2_locale_events.4510.a:0 "อาวุธข้างกายที่ทำมาอย่างดี"
 ep2_locale_events.4510.a.tt:0 "#F ดึงดูดด้านชอบสงครามของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4510.b:0 "บางสิ่งที่สวยงามสำหรับจัดแสดง"
 ep2_locale_events.4510.b.tt:0 "#F ดึงดูดด้านวัตถุนิยมของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4510.c:0 "ข้าคิดว่า [befriend_target.GetFirstNameNoTooltip] เป็น [befriend_target.GetWomanMan] ประเภท #EMP กริช#!"
 ep2_locale_events.4510.c.tt:0 "#F ดึงดูดด้านไม่ซื่อสัตย์ของ [befriend_actor.GetFirstNamePossessiveNoTooltip]#!"
 ep2_locale_events.4510.d:0 "ข้าจะหาวิธีอื่นในการสร้างความประทับใจให้ [befriend_target.GetHerHim]"
 ep2_locale_events.4511.reply_weapon:0 "ข้างในคือ [newly_created_artifact.GetType] ที่สร้างขึ้นอย่างดี ส่องแสงทึบๆ ในแสงอ่อนๆ\n\n"
 ep2_locale_events.4511.reply_ornament:0 "ข้างในคืออาวุธประดับที่บอบบาง เหมาะสำหรับแขวนผนังมากกว่าสนามรบ\n\n"
 ep2_locale_events.4511.reply_dagger:0 "ข้างในคือมีดสั้นขนาดเล็ก แต่สง่างาม พร้อมใบมีดที่ส่องประกายสดใส\n\n"
 ep2_locale_events.4511.opening:0 "เช้าวันหนึ่งข้าถูกหยุดโดย [befriend_actor.GetTitledFirstName] อย่างกะทันหัน ผู้ ซึ่งยื่นห่อผ้าให้ข้า ยิ้มอย่างคาดหวัง ของขวัญ?\n\n"
 ep2_locale_events.4511.success_weapon:0 "$ep2_locale_events.4511.reply_weapon$ปฏิเสธไม่ได้ถึงฝีมือและความมีประโยชน์อย่างชัดเจนของอาวุธ"
 ep2_locale_events.4511.weapon:0 "$ep2_locale_events.4511.reply_weapon$หัวใจของข้าห่อเหี่ยว ข้าต้องการของน่ารังเกียจนี้ไปทำไม?"
 ep2_locale_events.4511.success_ornament:0 "$ep2_locale_events.4511.reply_ornament$มันเป็นสิ่งที่สร้างขึ้นอย่างน่าอัศจรรย์ ด้วยความใส่ใจในรายละเอียดจนยากที่จะละสายตา"
 ep2_locale_events.4511.ornament:0 "$ep2_locale_events.4511.reply_ornament$โอ้ วัตถุที่ไร้ประโยชน์โดยสิ้นเชิง... ข้าเดาว่าอย่างน้อยข้าก็ขายมันได้"
 ep2_locale_events.4511.success_dagger:0 "$ep2_locale_events.4511.reply_dagger$รูปทรงที่ละเอียดอ่อนของมันร้องเรียกให้ถูกจับ และแทงเข้าไปในกำปั้นของข้า"
 ep2_locale_events.4511.dagger:0 "$ep2_locale_events.4511.reply_dagger$นี่มันใช้ทำอะไรกันแน่? นี่คือเครื่องมือของพวกอันธพาล"
 ep2_locale_events.4511.a:0 "แม้จะขัดใจตัวเอง [befriend_actor.GetSheHe] ก็ ทำให้ข้าประทับใจ..."
 ep2_locale_events.4511.b:0 ""ข-ขอบคุณ ดีมาก""
 ep2_locale_events.4512.opening:0 "[befriend_target.GetTitledFirstName] รับของขวัญที่ห่ออย่างระมัดระวังของข้าอย่างอบอุ่น ยกมันขึ้นในมือของ [befriend_target.GetHerHis] ด้วยรอยยิ้มกว้างบนใบหน้าของ [befriend_target.GetHerHis]\n\n"
 ep2_locale_events.4512.success_reply:0 "รอยยิ้มของ [befriend_target.GetHerHis|U] กว้างขึ้นอีกเมื่อแกะห่อออก"
 ep2_locale_events.4512.reply:0 "อารมณ์ของ [befriend_target.GetHerHis|U] เปลี่ยนไปบ้างเมื่อแกะห่อออก — นั่นคือความอยากรู้อยากเห็นหรือความรังเกียจ?"
 ep2_locale_events.4512.success_weapon:0 "\n\n"อา [newly_created_artifact.GetType] ที่ตีขึ้นอย่างเชี่ยวชาญ บางสิ่งที่... พึ่งพาได้""
 ep2_locale_events.4512.weapon:0 ""โอ้... [newly_created_artifact.GetType] สิ่งที่ข้าต้องการพอดี""
 ep2_locale_events.4512.success_ornament:0 "\n\n"ช่างเป็นของประดับที่งดงาม! สิ่งนี้คู่ควรกับคอลเลกชันของขุนนางทุกคน!""
 ep2_locale_events.4512.ornament:0 ""โอ้ ของประดับ? ดี... มาก""
 ep2_locale_events.4512.success_dagger:0 ""โอ้ นี่มันดี ดีมาก... ช่างสมดุล""
 ep2_locale_events.4512.dagger:0 ""ดีสำหรับสับ... ผัก ข้าเดาว่านะ?""
 ep2_locale_events.4512.success:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างจริงใจ ข้าคิดว่ามันคงจะดีไปกว่านี้ไม่ได้แล้ว!"
 ep2_locale_events.4512.failure:0 "\n\n[befriend_target.GetSheHe|U] ขอบคุณข้าอย่างสุภาพ ข้าไม่คิดว่ามันจะได้ผลตามที่ต้องการ..."
 ep2_locale_events.4512.a:0 "ข้ามีสายตาสำหรับเรื่องนี้"
 ep2_locale_events.4512.b:0 "ช่างเป็นการสิ้นเปลือง..."

 ep2_locale_events.4520.t:0 "$tournament_locale_weaponsmith$: โลหิตอันคู่ควร"
 ep2_locale_events.4520.desc:0 ""เลือดขุนนาง!" เสียงของ [tournament_weaponsmith.GetFirstNamePossessive] ดังขึ้น ทำให้ข้าสะดุ้ง ข้ากะพริบตามองฝ่าความมืดสลัวไปยังที่ที่ [tournament_weaponsmith.GetSheHe] ยืนอยู่ด้วยความกระหาย ชูกริชที่ส่องประกายแวววาว\n\n"ทั้งหมดที่ข้าต้องการคือเลือดขุนนางเพียง #EMP หยด#! เล็กน้อยเพื่อชุบคมดาบ! ดาบเล่มนี้จะเป็นอาวุธที่ดีที่สุดเท่าที่เคยสร้างมา! บทเพลงจะขับขานถึงข้า!" [tournament_weaponsmith.GetSheHe|U] ขยับเข้ามาใกล้ขึ้น ประกายบ้าคลั่งวูบวาบในดวงตาของ [tournament_weaponsmith.GetHerHis]\n\n"มันจะเป็นของท่านทั้งหมด ท่าน [ROOT.Char.GetLadyLord] เป็นของท่านทั้งหมด ข้าเพียงแค่ต้องเป็นผู้ตีมันขึ้นมา อนุญาตให้ข้าทำเถิด เพื่อชื่อของเราทั้งสองจะเป็นที่จดจำตลอดไป!"\n\nข้ามองลงไปที่แขนของข้า"
 ep2_locale_events.4520.a:0 "เพื่อเกียรติยศ เพื่อชื่อเสียงอันเป็นนิรันดร์!"
 ep2_locale_events.4520.a.success:0 "การตีเหล็กเป็นไปด้วยดี"
 ep2_locale_events.4520.a.failure:0 "การตีเหล็กเป็นไปอย่างย่ำแย่"
 ep2_locale_events.4520.b:0 "เราลองทำได้ แต่ให้ข้าไปเอาขี้ผึ้งมาก่อน..."
 ep2_locale_events.4520.c:0 "ถ้าเจ้า #EMP แน่ใจ#! ว่ามันจะได้ผล..."
 ep2_locale_events.4520.d:0 "เรื่องไร้สาระอะไร เช่นนี้"

 ep2_locale_events.4521.t:0 "$tournament_locale_weaponsmith$: เหล็กกล้าโลหิต"
 ep2_locale_events.4521.start:1 "ข้าจับผ้าสะอาดกดแขนท่อนล่างเพื่อห้ามเลือดขณะที่ [tournament_weaponsmith.GetFirstName] จุดไฟและตีเหล็กอย่างตื่นเต้น เมื่อถึงเวลาที่เป้าหมายการเสียเลือดของเราสำเร็จ ผ้าก็เกือบจะเปียกโชก แต่การไหลของเลือดเองก็ช้าลงและบาดแผลก็แข็งตัว\n\nดาบถูกวางลงบนโต๊ะอย่างเคารพนับถือ"
 ep2_locale_events.4521.success:0 "มันเป็นสิ่งที่ดูแปลกประหลาด: เลือดแห้งยังคงหลุดลอกออกจากใบดาบ เผยให้เห็นลวดลายสีซีดในเนื้อเหล็ก ข้าทดสอบความยืดหยุ่น และใบดาบก็ส่งเสียงดังเอี๊ยดอ๊าดอย่างน่าเป็นห่วง\n\n"
 ep2_locale_events.4521.failure:0 "พูดได้คำเดียวว่าน่าเกลียด เลือดแห้งเคลือบตลอดความยาวของใบดาบ และน้ำหนักของอาวุธดูเหมือนจะเปลี่ยนไปทุกขณะ เหล็กที่เปราะบางถูกเคลือบด้วยลายหมุนวนเป็นหย่อมๆ\n\n"
 ep2_locale_events.4521.ending:0 ""มัน #EMP สมบูรณ์แบบ#!!" [tournament_weaponsmith.GetFirstNameNoTooltip] ดูเหมือนจะไม่สะทกสะท้านกับความสงสัยของข้า มือของ [tournament_weaponsmith.GetHerHis] สั่นขณะที่ [tournament_weaponsmith.GetSheHe] ถือใบดาบด้วยความพิศวง"
 ep2_locale_events.4521.a:0 "ข้าจะเอามัน!"
 ep2_locale_events.4521.b:0 "เจ้าเก็บมันไว้ได้"
 
 ep2_locale_events.5020.t:0 "$tournament_locale_tourney_grounds$: ประทับใจไหม?"
 ep2_locale_events.5020.desc:0 "ลานประลองกำลังวุ่นวายกับการเตรียมการ เหล่าเพจวิ่งไปมาถือชิ้นส่วนเกราะที่ ทำให้พวกเขาดูเหมือนหุ่นไล่กาตัวเล็กๆ "รอด้วย!" หนึ่งในนั้นตะโกน พลางหยิบหมวกเหล็กขึ้นมา\n\nข้าได้ยินเสียงหัวเราะคิกคักที่คุ้นเคยดังมาจากอัฒจันทร์ และข้าเห็น [impressed_lover.GetTitledFirstName] ล้อมรอบด้วย [impressed_lover.GetWomenMen] คนอื่นๆ ที่ปิดปากด้วยผ้าเช็ดหน้า [impressed_lover.GetSheHe|U] ไม่ได้โบกมือให้ข้า [impressed_lover.GetSheHe|U] ไม่จำเป็นต้องทำ\n\n"มาออกกำลังกายเหรอ?", [impressed_rival.GetTitledFirstName] เดินผ่านข้าไป เชิดคางของ [impressed_rival.GetHerHis] ขึ้น "เจ้าต้องการมัน""
 ep2_locale_events.5020.a:0 "ข้าจะ ทำให้แน่ใจว่า [impressed_lover.GetFirstNameNoTooltip] กำลังมองอยู่"
 ep2_locale_events.5020.a.success:0 "ท่านสร้างความประทับใจให้ [impressed_lover.GetShortUIName]"
 ep2_locale_events.5020.a.failure:0 "[impressed_lover.GetShortUIName] ไม่ประทับใจ"
 ep2_locale_events.5020.b:0 "อา! โอกาสที่สมบูรณ์แบบที่จะข่มขู่ [impressed_rival.GetFirstNameNoTooltip] ที่น่ารำคาญนั่น"
 ep2_locale_events.5020.b.success:0 "[impressed_rival.GetShortUIName] ถูกข่มขู่"
 ep2_locale_events.5020.b.failure:0 "[impressed_rival.GetShortUIName] ไม่ประทับใจ"
 ep2_locale_events.5020.c:0 "มีเพียงคนเดียวที่ข้าต้องสร้างความประทับใจ ตัวข้าเอง"
 tournament_ground_flexing:0 "การฝึกที่น่าประทับใจ"
 ep2_locale_events.5020.a.success.tt:0 "ความสัมพันธ์ของท่านกับ [impressed_lover.GetShortUIName] ได้เพิ่ม [fertility|E]"
 
 ep2_locale_events.1520.t:0 "สองจันทรา"
 ep2_locale_events.1520.desc:0 ""ลางบอกเหตุ! สัญญาณ!" ข้าได้ยินเสียงตะโกนดังมาจาก [ROOT.Char.GetFaith.HouseOfWorship] ขณะที่ข้าเข้าใกล้ประตู [tournament_priest.GetTitledFirstName] สะดุดมาหาข้า ชี้ไปที่ท้องฟ้า ตามสายตาที่ตื่นตระหนกของ [tournament_priest.GetHerHis] ข้าเห็นมัน: ดวงจันทร์ ดวงจันทร์อีกดวง\n\n"ข้าเคยอ่านเกี่ยวกับมันในเอกสารเก่าแก่" [tournament_priest.GetSheHe] พูดต่อ "มันประกาศบางอย่าง — แต่อะไรล่ะ?""
 ep2_locale_events.1520.a:0 "ลางบอกเหตุ! มันประกาศชัยชนะของข้า!"
 ep2_locale_events.1520.b:0 "ดวงจันทร์กลมเหมือนเหรียญ มันคือความมั่งคั่ง เห็นได้ชัด"
 ep2_locale_events.1520.c:0 "เงาตัดศีรษะที่สมบูรณ์แบบสองเงา..."
 ep2_locale_events.1520.d:0 "ข้าเคยเห็นสิ่งนี้มาก่อน... ในหนังสือเกี่ยวกับดวงดาว"
 ep2_locale_events.1520.e:0 "มันไม่มีความหมายอะไร"
 tournament_astronomy_modifier:0 "นักดาราศาสตร์"
 tournament_astronomy_modifier_desc:0 "ตัวละครนี้ได้ศึกษาดวงดาวและการเคลื่อนที่ของพวกมัน"
 ep2_locale_events.1520.superstitious:0 "ท่านกลายเป็นคนเชื่อโชคลาง"
 
 ep2_locale_events.3010.t:0 "อากาศไม่ดี"
 ep2_locale_events.3010.desc:0 "ทันทีที่ข้าเดินเข้าไปในค่าย ข้าก็ได้กลิ่นฉุนกึก ข้าใช้มือปิดจมูกอย่างสง่างามที่สุดเท่าที่จะทำได้พลางพยายามไม่ให้คลื่นไส้ [alerted_physician.GetFirstName] ก็เดินเข้ามาหา โดยใช้ผ้าเช็ดหน้าปิดจมูกของตนเอง เช่นกัน\n\n"ท่านควรจะไปจากที่นี่ [ROOT.Char.Custom('FormOfAddressForLiege')] เหล่าผู้เข้าแข่งขันกำลังล้มป่วย ได้รับอันตรายจากอากาศที่ไม่ดี" [alerted_physician.GetSheHe] เตือนข้า"
 ep2_locale_events.3010.a:0 "มันต้องมีคำอธิบายสิ หามันให้เจอ"
 ep2_locale_events.3010.a.success:0 "[alerted_physician.GetShortUIName] ตรวจสอบค่าย"
 ep2_locale_events.3010.b:0 "การประลองต้องถูกสาปแน่ๆ!"
 ep2_locale_events.3010.b.flavor:0 "ข้าจะอยู่ห่างจากค่าย..."
 ep2_locale_events.3010.c:0 "ข้าจะไม่หลงกลความพยายามโง่ๆ เหล่านี้!"
 ep2_locale_events.3010.d:0 "ทำไมข้าต้องสนใจด้วย?"
 tournament_not_cursed_modifier:0 "อากาศบริสุทธิ์"
 tournament_not_cursed_modifier_desc:0 "ตัวละครนี้หลีกเลี่ยงอากาศไม่ดีที่ ทำให้การประลองเป็นพิษ"
 ep2_locale_events.3010.a.success.tt:0 "[alerted_physician.GetShortUIName] พบสาเหตุ"
 ep2_locale_events.3010.a.failure:0 "[alerted_physician.GetShortUIName] ไม่ประสบความสำเร็จ"
 
 ep2_locale_events.3011.t:0 "$ep2_locale_events.3010.t$: ไอพิษ"
 ep2_locale_events.3011.desc:0 "[alerted_physician.GetFirstName] กลับมาหาข้าพร้อมรอยยิ้มพึงพอใจบนใบหน้า "ข้าพบต้นตอแล้ว [ROOT.Char.Custom('FormOfAddressForLiege')]" [alerted_physician.GetSheHe] ประกาศ พยายามกลั้นเสียงหัวเราะของ [alerted_physician.GetHerHis] เอาไว้\n\n"แขกเหรื่อหาที่กำจัด... ของเสีย ไม่ได้ พวกเขาเลยหันไปทิ้งมันลงในแม่น้ำ อากาศที่ไม่ดีนั้นนำพาโรคภัย ดังที่ฮิปพอคราทีสได้ประกาศไว้""
 ep2_locale_events.3011.a:0 "ข้าต้องเตือนพวกเขา!"
 ep2_locale_events.3011.b.contestant:0 "ข้าจะเก็บเรื่องนี้ไว้กับตัวเอง"
 ep2_locale_events.3011.b.champion:0 "ข้าจะเตือนเฉพาะผู้ชนะเลิศของข้า [contest_champion.GetFirstNameNoTooltip]"
 ep2_locale_events.3011.b:0 "ทำไมข้าต้องบอกพวกเขาด้วย?"
 
 ep2_locale_events.3510.t:0 "อุปกรณ์ครบครัน"
 ep2_locale_events.3510.desc:0 "ความร้อนของโรงตีเหล็กเพียงพอที่จะ ทำให้แขกส่วนใหญ่ไม่อยู่ใกล้ เมื่อข้าเปิดประตู ข้าพบช่างตีเหล็กกำลังหาวอยู่เหนือโต๊ะทำงานของ [farrier.GetHerHis] ดูเหมือนจะมีคนเข้าหา [farrier.GetHerHim] ไม่มากนัก [farrier.GetSheHe|U] รีบยืดตัวตรง กระแอมเสียงดัง\n\n"ข้าช่วยอะไรได้ไหม? ข้าสามารถเสนอเกือกม้าที่ดีที่สุดให้ท่านได้ พร้อมสำหรับการประลอง" [farrier.GetSheHe] แนะนำ พลางแสดงคอลเลกชันที่น่าประทับใจยิ่งกว่า"
 ep2_locale_events.3510.a:0 ""ให้ข้า แต่สิ่งที่ดีที่สุด!""
 ep2_locale_events.3510.b:0 ""ข้าควรจะซื้อให้เหล่าอัศวินของข้าจริงๆ...""
 ep2_locale_events.3510.c:0 ""เครื่องรางนำโชค!""
 ep2_locale_events.3510.d:0 ""ข้าสบายดี ขอบคุณ""
 ep2_locale_events.3510.a.prowess:0 "[prowess|E] ของท่านเพิ่มขึ้น"
 ep2_locale_events.3510.a.martial:0 "[martial|E] ของท่านเพิ่มขึ้น"
 ep2_locale_events.3510.a.prestige:0 "อุปกรณ์ใหม่ของท่านน่าประทับใจ"
 tournament_new_horseshoes_modifier:0 "เกือกม้าใหม่"
 good_luck_horseshoe_artifact:0 "เกือกม้า"
 good_luck_horseshoe_artifact_desc:0 "เกือกม้าเหล็ก กล่าวกันว่าช่วยปัดเป่าวิญญาณชั่วร้าย"
 
 ep2_locale_events.1530.t:0 "เจ้าเป็นธุลีดิน"
 ep2_locale_events.1530.desc.intro:0 "ลานรอบ [ROOT.Char.GetFaith.HouseOfWorship] ร้างผู้คนเมื่อใกล้เวลาพระอาทิตย์ตกดิน ข้าได้ยินเสียงกรอบแกรบในหมู่ใบไม้และเห็นเงาของสัตว์เล็กๆ วิ่งอยู่ท่ามกลางหลุมฝังศพ รอยแกะสลักเกือบจะหายไปในบางหลุม เห็นได้ชัดเจนในหลุมอื่นๆ\n\nข้าก้าวเข้าไปใกล้พวกมัน"
 ep2_locale_events.1530.desc.young:0 "และพวกมันรู้สึกห่างไกลเหลือเกิน เกือบจะเป็นไปไม่ได้"
 ep2_locale_events.1530.desc.middle:0 ". เมื่อถึงเวลาของข้า ข้าจะ ทำให้แน่ใจว่าข้าจะมีที่พักผ่อนที่ดีกว่านี้"
 ep2_locale_events.1530.desc.old:0 "เพราะมันสายแล้ว เพราะมันจะสายไปเรื่อยๆ เพราะมันไม่เคยสายขนาดนี้มาก่อนในชีวิตข้า"
 ep2_locale_events.1530.a:0 "ข้าสงสัยว่าข้าจะพบบรรพบุรุษของข้าสักคนได้หรือไม่...."
 ep2_locale_events.1530.b.christian:0 "และข้าจะกลับคืนสู่ธุลีดิน"
 ep2_locale_events.1530.b.fallback:0 "อีกไม่นานนั่นก็จะเป็นข้า"
 ep2_locale_events.1530.c:0 "ธุลีสู่ธุลี! ช่างเป็นภาพที่สร้างแรงบันดาลใจ!"
 ep2_locale_events.1530.d:0 "หืม... จะเป็นอย่างไรถ้า...?"
 ep2_locale_events.1530.a.success:0 "ท่านพบบรรพบุรุษในห้องใต้ดิน"
 ep2_locale_events.1530.a.failure:0 "ไม่มีใครที่ท่านรู้จักที่นี่"
 
 ep2_locale_events.4540.t:0 "บนคมดาบ"
 ep2_locale_events.4540.desc.intro:0 ""ช่างเป็นผลงานที่งดงามที่ [weaponsmith.GetSheHe] ทำ!" ข้าได้ยินอัศวินคนหนึ่งพูดอย่างภาคภูมิใจ พลางออกจากโรงตีเหล็ก ใบดาบที่ส่องประกายสะท้อนแสงอาทิตย์เหมือนทะเลสาบคริสตัล\n\nข้าผลักประตูเปิดออกและได้รับการต้อนรับด้วยเปลวไฟที่ลุกโชน"
 ep2_locale_events.4540.desc.contestant:0 ""ท่านจะเข้าแข่งขันแบบนั้นหรือ?" ช่างตีเหล็กถาม พลางชี้ไปที่ [my_weapon.GetNameNoTooltip|l] ที่ห้อยจากเข็มขัดของข้า"
 ep2_locale_events.4540.desc.fallback:0 "แม้ว่าข้าจะไม่ได้เข้าแข่งขันในครั้งนี้ ข้าก็ไม่ควรเพิกเฉยต่อพรสวรรค์ของช่างฝีมือผู้นี้"
 ep2_locale_events.4540.desc.outro:0 "\n\n"หากท่านมีทอง ข้าก็มีเหล็ก""
 ep2_locale_events.4540.a:0 ""ทำให้มันอันตรายยิ่งขึ้น""
 ep2_locale_events.4540.a.tt:0 "คมดาบที่ลับแล้วจะคงอยู่เพียงชั่วระยะเวลาของการประลองเท่านั้น"
 ep2_locale_events.4540.b.christian:0 ""แกะสลัก #EMP In Nomine Domini#! ไปตามใบดาบ""
 ep2_locale_events.4540.b.fallback:0 ""จารึกคำอธิษฐาน""
 ep2_locale_events.4540.c:0 ""ข้าต้องการให้มันเขียนว่า [my_weapon.GetOwner.GetHouse.GetMotto]""
 ep2_locale_events.4540.d:0 ""ข้าจะเก็บทองของข้าไว้""
 ep2_locale_events_artifact_sharp_desc:0 "[my_weapon.GetDesc]\n\nใบดาบถูกลับให้คมสำหรับการประลอง"
