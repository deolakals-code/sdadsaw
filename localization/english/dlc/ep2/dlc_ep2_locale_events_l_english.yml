 ep2_locale_events.1060.a.failure:0 "ท่านเสียทองของท่าน"
 
 ep2_locale_events.4530.t:0 "$tournament_locale_weaponsmith$: ปัญญาแห่งค้อน"
 ep2_locale_events.4530.desc:0 "ข้ามองเห็นเปลวไฟที่ริบหรี่อย่างแผ่วเบาจากอีกฟากของถนน ความอบอุ่นของมันโอบล้อมร่างกายข้าในอ้อมกอดที่คุ้นเคยแม้ก่อนที่ข้าจะเปิดประตู ภายใน ช่างตีเหล็กกำลังจัดเรียงตะปูชุดหนึ่ง\n\n"มีอะไรให้ข้ารับใช้หรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?" [tournament_weaponsmith.GetSheHe] เอ่ยถาม หน้าผากของ [tournament_weaponsmith.GetHerHis] เปรอะเปื้อนไปด้วยถ่าน อากาศที่นี่หนาทึบกว่า"
 ep2_locale_events.4530.a:0 ""ข้าได้ยินมาว่าช่างตีเหล็กสามารถทำลายคาถาได้ โปรด ทำให้จิตวิญญาณของข้าสงบลง""
 ep2_locale_events.4530.a.tt:0 "ท่านกลายเป็นคนเชื่อโชคลาง"
 ep2_locale_events.4530.b:0 ""ท่านช่วยแสดงเทคนิคผู้เชี่ยวชาญให้ข้าดูได้ไหม?""
 ep2_locale_events.4530.b.success:0 "ทักษะของท่านพัฒนาขึ้น"
 ep2_locale_events.4530.b.crit_success:0 "ทักษะของท่านพัฒนาขึ้นอย่างมาก"
 ep2_locale_events.4530.b.failure:0 "ท่านได้รับบาดเจ็บ"
 ep2_locale_events.4530.c:0 ""ท่านช่วยปรับปรุง [improved_weapon.GetNameNoTooltip] ของข้าได้ไหม?""
 ep2_locale_events.4530.c.tt:0 "ได้รับ #positive_value +2#! [prowess|E]"
 ep2_locale_events.4530.d.success:0 "การรักษาได้ผล!"
 ep2_locale_events.4530.d.nothing:0 "การรักษาไม่ได้ผล"
 ep2_locale_events.4530.d:0 ""ร่างกายข้า! มันเจ็บ! ช่วยข้าด้วย!""
 improved_artifact_desc:0 "[improved_weapon.GetDesc]\n\nปรับปรุงโดยช่างตีเหล็กผู้ชำนาญก่อนการประลองสำคัญ"
 ep2_locale_events.4530.e:0 ""ข้าแค่มาดูรอบๆ""
 
 # TRAINING GROUNDS
 ep2_locale_events.5000.t:0 "เสียงเรียกแห่งเหล็กกล้า"
 ep2_locale_events.5000.desc.intro:1 "ขณะที่ข้าเยี่ยมชมลานประลองพร้อมกับลูกของข้า [my_child.GetFirstName] เราบังเอิญพบกลุ่ม [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] กำลังฝึกซ้อมอย่างดุเดือดสำหรับการแข่งขันครั้งต่อไป ข้าโบกมือให้ [my_knight.GetTitledFirstName] ซึ่งแทบจำไม่ได้ภายใต้หมวกเหล็กนั้น\n\n"อา มันจะเป็นเกียรติอย่างยิ่งต่อตระกูลของเราถ้า..." แต่ข้ารีบหยุด เมื่อสังเกตเห็นว่าดวงตาของ [my_child.GetFirstNamePossessiveNoTooltip] จับจ้องไปที่ดาบ"
 ep2_locale_events.5000.desc.martial:0 "ไม่น่าแปลกใจเลย เมื่อพิจารณาถึงความสนใจด้านการทหารของ [my_child.GetHerHis]"
 ep2_locale_events.5000.desc.non_martial:0 "ข้าไม่เคยสังเกตเห็นว่า [my_child.GetSheHe] สนใจเรื่องเหล่านี้"
 ep2_locale_events.5000.a:0 ""ช่างเป็นความคิดที่ยอดเยี่ยม!""
 ep2_locale_events.5000.b:0 ""ดี [my_knight.GetFirstNameNoTooltip] จะฝึกเจ้าเอง""
 ep2_locale_events.5000.c:0 ""เจ้าคิดว่าเจ้าสามารถละเลยหน้าที่ของเจ้า เช่นนั้นได้หรือ?""
 
 
 ep2_locale_events.5010.t:0 "$tournament_locale_tournament_grounds$: เกือบถึงแล้ว"
 ep2_locale_events.5010.desc.intro:1 "เดินขบวนเข้าสู่ลานประลอง ข้าเข้าร่วมกลุ่ม"
 ep2_locale_events.5010.desc.prowess:1 "[ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ที่แข็งแรง แลกเปลี่ยนคำพูดเหน็บแนมขณะที่ผู้ดูแลสวมเกราะให้พวกเขา"
 ep2_locale_events.5010.desc.mind:1 "ผู้เข้าแข่งขันแลกเปลี่ยนกลยุทธ์ทั่วไป บอกใบ้อย่างน่าทึ่งถึงท่าทางที่ยังมาไม่ถึง"
 ep2_locale_events.5010.desc.fallback:1 "ผู้เข้าแข่งขันฝึกฝนการแสดงของตนด้วยความกระตือรือร้นที่วัดผลได้"
 ep2_locale_events.5010.desc.outro:1 "\n\nผู้ชมบางส่วนมองลงมาที่เราแล้ว เคี้ยวเนื้อย่างและถ่มกระดูก พวกชาวบ้านร้องเรียกการแสดง\n\nพวกเราบางคนบ่นถึงสิ่งรบกวนจากการฝึกซ้อมนี้ คนอื่นๆ ท่ามกลางเสียงโห่ร้อง ยืนกรานว่านี่กลายเป็นช่วงเวลาแห่งการพิสูจน์"
 ep2_locale_events.5010.a:1 "ข้าจะแสดงให้พวกเจ้าทุกคนเห็นว่าทำอย่างไร"
 ep2_locale_events.5010.a.success:1 "การฝึกซ้อมของท่านประสบความสำเร็จ"
 ep2_locale_events.5010.a.failure:0 "การฝึกซ้อมของท่านน่าอับอาย"
 ep2_locale_events.5010.b.good:0 "ข้าจำครั้งสุดท้ายได้ เป็นความทรงจำที่น่ายินดี"
 ep2_locale_events.5010.b.bad:0 "ครั้งนี้ ครั้งนี้ข้าจะทำได้ดีกว่า"
 ep2_locale_events.5010.b.flavor:0 "ความทรงจำหนึ่งยังคงอยู่ในใจท่าน..."
 ep2_locale_events.5010.c:0 ""พวกเจ้ามองอะไร!?""
 ep2_locale_events.5010.c.success:0 "ฝูงชนถูกข่มขู่"
 ep2_locale_events.5010.c.failure:0 "ฝูงชนหัวเราะเยาะท่าน"
 ep2_locale_events.5010.d:0 "ข้าควรจะไปตอนนี้"
 
 ep2_locale_events.5030.t:0 "การจ้างงานใหม่"
 ep2_locale_events.5030.desc.intro:1 "เหล่าสไควร์หัวเราะและพูดตลกขณะขัดหมวกเหล็กและเกราะโซ่ หนึ่งในนั้นสูดจมูกเสียงดังเหมือนหมูและคนอื่นๆ ก็เลียนแบบเขาในไม่ช้า [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของพวกเขาเดินเตร่อยู่ใกล้ๆ\n\nท่ามกลางคนเหล่านี้ ข้าเห็น [poached_councillor.GetTitledFirstName] ที่ปรึกษาของ [councillor_employer.GetTitledFirstNamePossessive] "
 ep2_locale_events.5030.desc.contestant:0 "ทักษะของ [poached_councillor.GetHerHis|U] ได้รับการยกย่องอย่างมากและชื่อของ [poached_councillor.GetHerHis] ก็ดังก้องในฐานะหนึ่งในผู้ชนะที่เป็นไปได้"
 ep2_locale_events.5030.desc.fallback:0 "การกระทำของ [poached_councillor.GetHerHis|U] ไม่ได้ถูกมองข้ามและงานที่ [poached_councillor.GetSheHe] ทำเพื่อครัวเรือนของเจ้าเหนือหัวของ [poached_councillor.GetHerHis] นั้นน่าประทับใจยิ่งกว่า"
 ep2_locale_events.5030.desc.outro:0 "\n\nข้าสามารถโน้มน้าว [poached_councillor.GetHerHim] ให้เข้าร่วมสภาของข้าเองได้"
 ep2_locale_events.5030.a:0 "ทองคำคือสิ่งล่อใจที่ใหญ่ที่สุด"
 ep2_locale_events.5030.b:0 ""[poached_councillor.GetWomanMan] ที่มีทักษะสมควรได้รับเจ้าเหนือหัวที่มีทักษะ หรือไม่มีเจ้าเหนือหัวเลย""
 ep2_locale_events.5030.b.success:0 "ท่านข่มขู่ [poached_councillor.GetShortUIName]"
 ep2_locale_events.5030.b.failure:0 "[poached_councillor.GetShortUIName] รู้สึกขุ่นเคืองกับการไร้มารยาทของท่าน"
 ep2_locale_events.5030.c:0 ""ชีวิตที่มีเกียรติยิ่งกว่ารอท่านอยู่ในราชสำนักของข้า""
 ep2_locale_events.5030.d:0 ""เราไม่ใช่เพื่อนที่ดีต่อกันหรือ ที่รัก [poached_councillor.GetFirstNameNoTooltip]? เข้าร่วมกับข้าสิ""
 ep2_locale_events.5030.e:0 "ข้าไม่ประสงค์จะ ทำให้ [councillor_employer.GetTitledFirstNameNoTooltip] ขุ่นเคือง"
 
 # VILLAGE
 ep2_locale_events.5500.t:0 "เก่าแก่ดั่งหิน"
 ep2_locale_events.5500.desc:0 "การเยี่ยมชม [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เป็นสิ่งที่ข้าต้องการเพื่อผ่อนคลายก่อนการแข่งขัน! ขณะที่ข้าเดินเล่นไปตามถนน ข้าเห็นเด็กๆ ในท้องถิ่นกำลังเลียนแบบการต่อสู้ ใช้ไม้เป็นอาวุธและตะโกนว่า "เพื่อเกียรติยศแห่งตระกูลข้า!" และ "#EMP อ๊ากกกก#! หลายครั้ง\n\nข้าหยุดเพื่อชื่นชมอาคารที่โดดเด่นที่สุดแห่งหนึ่ง: ยืนตระหง่านอยู่กลางจัตุรัส อย่างไรก็ตาม เมื่อข้าตรวจสอบใกล้ๆ ข้าสังเกตเห็นจารึกโบราณบางอย่างอย่างรวดเร็ว..."
 ep2_locale_events.5500.a.rome:0 "เดี๋ยวนะ... นั่นภาษาละตินหรือ?"
 ep2_locale_events.5500.a.fallback:0 "ฮ่า! ข้าเคยศึกษาภาษาโบราณนี้!"
 ep2_locale_events.5500.b:0 "หินก้อนนี้จะทำกำแพงที่ดีที่บ้านได้!"
 ep2_locale_events.5500.c:0 "เราต้องเรียนรู้จากพวกเขาต่อไป"
 ancient_stone_artifact:0 "แผ่นจารึกโบราณ"
 ancient_stone_artifact_desc:0 "ป้ายที่มีจารึกโบราณ ดูเหมือนว่าจะถูกนำกลับมาใช้ใหม่เป็นกำแพงหมู่บ้าน"
 
 ep2_locale_events.5510.t:0 "$tournament_locale_settlement$: ตรอกซอย"
 ep2_locale_events.5510.desc:0 "ชาวบ้านที่ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ดูเหมือนจะสนใจการประลองพอๆ กับขุนนางที่เข้าร่วม: บางคนได้เปิดร้านค้าชั่วคราวที่ชั้นล่างของบ้าน และกลิ่น [ROOT.Char.Custom('GetLocalStreetFoodPlural')] ก็หอมอร่อย\n\nเหนือความสนุกสนานและการพูดคุยทั้งหมด ข้าได้ยินเสียงที่... รุนแรงกว่าดังมาจากตรอกซอยหนึ่ง เมื่อข้าเข้าใกล้ ข้าสังเกตเห็นสิ่งที่ดูเหมือนจะเป็นการทะเลาะวิวาทของชาวนา แต่หนึ่งในนั้นมีฝีมือมากกว่าคนอื่นๆ"
 ep2_locale_events.5510.a:0 ""เฮ้ เจ้า! เจ้า! ตอนนี้เจ้าเป็นอัศวินของข้าแล้ว""
 ep2_locale_events.5510.a.success:0 "ท่านโน้มน้าว [village_thug.GetShortUIName]"
 ep2_locale_events.5510.a.failure:0 "[village_thug.GetShortUIName] ดูไม่ขบขัน"
 ep2_locale_events.5510.b:0 ""ท่าทางเหล่านั้นน่าประทับใจ ให้ข้าศึกษาพวกมัน...""
 ep2_locale_events.5510.c:0 ""หยุดเดี๋ยวนี้ พวกเจ้าคนเถื่อน!""
 tournament_stopped_peasant_fight:0 "ถนนที่สงบ"
 
 ep2_locale_events.5520.t:0 "$tournament_locale_settlement$: ดึงด้าย"
 ep2_locale_events.5520.desc:0 "กลุ่ม [village_woman.GetWomenMen] ได้ยึดบ้านหลังหนึ่งเป็นโรงทอผ้าหลักของพวกเธอ และข้าสามารถเข้าใจได้อย่างชัดเจนว่าพวกเธอกำลังสนทนากันอย่างมีชีวิตชีวาเกี่ยวกับการประลองที่กำลังดำเนินอยู่\n\nข้าเอนตัวไปที่หน้าต่าง ด้วยความระมัดระวังอย่างยิ่งที่จะไม่ให้ใครสังเกตเห็น\n\n"...และ [gossip_knight.GetWomanMan] คนนั้น [gossip_knight.GetFirstName]? ข้าไม่อยากจะเชื่อเลยว่าพวกเขาจับ [gossip_knight.GetHerHim] ได้เมื่อวานนี้ขณะกำลังทำ!" หนึ่งในนั้นพูด ขณะทอผ้าอย่างเชี่ยวชาญ"
 ep2_locale_events.5520.a:0 "ข้าได้ยินถูกไหม?"
 ep2_locale_events.5520.a.success:0 "ดูเหมือนพวกเขาจะไม่สังเกตเห็นท่าน"
 ep2_locale_events.5520.a.success.tt:0 "ท่านเรียนรู้ความลับของ [gossip_knight.GetTitledFirstNamePossessive]"
 ep2_locale_events.5520.a.failure:0 "พวกเขาจับได้ว่าท่านแอบฟัง"
 ep2_locale_events.5520.b:0 "ข้าสามารถเรียนรู้บางอย่างจากความรู้ทางเทคนิคของพวกเขา..."
 ep2_locale_events.5520.c:0 "ลองนึกถึงจำนวนทองที่พวกเขาต้องเก็บได้จากสิ่งนี้..."
 ep2_locale_events.5520.d:0 "ข้าไม่ได้ยินอะไรเลย"
 tournament_supported_weavers:0 "ความสนใจในการทอผ้า"
 tournament_supported_weavers_desc:0 "ตัวละครนี้ใช้เวลาพอสมควรในการเรียนรู้จากช่างทอผ้าในหมู่บ้าน"
 tournament_weaving_taxes_modifier:0 "ภาษีการทอผ้า"
 
 ep2_locale_events.5530.t:0 "การเฉลิมฉลอง"
 ep2_locale_events.5530.desc:0 "เสียงดนตรีดังมาจากทุ่งนารอบหมู่บ้าน ตามเสียงไป ข้ามาถึงต้นกำเนิดของมัน: จัตุรัสที่ประดับประดาอย่างหนาแน่น ขลุ่ย แทมบูรีน และเครื่องดนตรีทุกชนิดและการขับลำนำ!\n\nชายหญิงเต้นรำเป็นวงกลมไปทั่วทุกส่วนของจัตุรัส ตอนนี้มือของพวกเขาประสานกัน ตอนนี้พวกเขาเริ่มร้องเพลง ตอนนี้พวกเขาหมุนและหมุนและหมุน"
 ep2_locale_events.5530.a:0 "ไพร่ฟ้าข้าแผ่นดินของข้าจะยินดีที่เห็นข้าเข้าร่วม!"
 ep2_locale_events.5530.b:0 "โอกาสที่สมบูรณ์แบบในการสร้างความประทับใจให้ผู้เข้าร่วม"
 ep2_locale_events.5530.b.success:0 "การเต้นรำของท่านน่าประทับใจ"
 ep2_locale_events.5530.b.failure:0 "ท่านดูเก้งก้าง"
 ep2_locale_events.5530.c.flavor:0 "การต่อสู้เปรียบเสมือนการร่ายรำของดาบ!"
 ep2_locale_events.5530.c:0 "การเคลื่อนไหวเหล่านี้... มันอาจมีประโยชน์ในการแข่งขันที่กำลังจะมาถึง!"
 ep2_locale_events.5530.d:0 "ดนตรีนั่นช่างสร้างแรงบันดาลใจ!"
 ep2_locale_events.5530.e:0 "ข้าต้องไม่เบี่ยงเบนไปจากการฝึกซ้อม"
 tournament_village_dance_modifier:0 "การเต้นรำในหมู่บ้าน"
 
 ep2_locale_events.1070.t:0 "ในอดีตกาล"
 ep2_locale_events.1070.desc.intro:0 "ข้านั่งอยู่ในโรงเตี๊ยมกับกลุ่มข้าราชสำนักเล็กๆ "ข้าเห็นอัศวินผู้กล้าหาญคนนั้นถือป้ายของใครบางคน" หนึ่งในนั้นกระซิบและข้าก็หลงอยู่ในความคิดของตัวเองอย่างรวดเร็ว สังเกตแสงริบหรี่ของเทียน\n\nขณะที่ข้าจิบ"
 ep2_locale_events.1070.desc.alcohol:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')]"
 ep2_locale_events.1070.desc.no_alcohol:0 "[ROOT.Char.Custom('RegionalDrink')]"
 ep2_locale_events.1070.desc.outro:0 "ข้ารำลึกถึงครั้งนั้นเมื่อ [my_memory.GetDescription] ยิ้มกว้าง\n\n"ท่านอยากฟังเรื่องจริงไหม?" ข้าถาม พลางหันไปหาเพื่อนร่วมทาง"
 ep2_locale_events.1070.a:0 "เป็นช่วงเวลาที่สมบูรณ์แบบสำหรับการสนทนาที่ให้กำลังใจ"
 ep2_locale_events.1070.b:0 "ข้าต้อง ทำให้แน่ใจว่า #EMP ข้า#! ดูดี"
 ep2_locale_events.1070.c:0 "ข้าแค่อยากดื่มต่อไป"
 
 ep2_locale_events.3020.t:0 "คำหวาน"
 ep2_locale_events.3020.desc:0 ""ข้าจะประหลาดใจมากหาก [enemy_knight.GetFirstName] ไม่สามารถเอาชนะผู้เข้าแข่งขันคนอื่น ๆ ได้อย่างราบคาบ!" ข้าได้ยินขณะเดินไปรอบ ๆ ค่าย กลุ่มผู้มาเยือนกำลังกินอาหารรอบหม้อ และข้าก็เห็น [enemy_knight.GetTitledFirstNameNoTooltip] นั่งอยู่กับพวกเขา\n\n"ท่านพูดเกินจริงไปแล้ว สหายข้า" [enemy_knight.GetSheHe] กล่าว ขณะที่ [enemy_knight.Custom('quirk_pos_standalone')|l] ข้าสบตากับ [enemy_knight.GetHerHim] และพยักหน้าให้ [enemy_knight.GetHerHim] เล็กน้อย\n\n"ขอตัวก่อนนะ" [enemy_knight.GetSheHe] พึมพำ พลางลุกขึ้น "มีเรื่องใดที่ท่าน [ROOT.Char.GetLadyLord] ต้องการจะหารือหรือไม่?""
 ep2_locale_events.3020.a:0 ""การชนะจะไม่ ทำให้ท่านมีเพื่อน""
 ep2_locale_events.3020.a.success:0 "[enemy_knight.GetShortUIName] รับฟังท่าน"
 ep2_locale_events.3020.a.failure:0 "[enemy_knight.GetShortUIName] รู้สึกขุ่นเคืองกับข้อเสนอของท่าน"
 ep2_locale_events.3020.b:0 ""ข้าคือเจ้าเหนือหัวของท่าน ข้าสั่งให้ท่านยอมแพ้""
 ep2_locale_events.3020.c:0 "ข้าต้องการการต่อสู้ที่ยุติธรรม"

