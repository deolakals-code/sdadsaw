 # MODIFIERS
 tournament_wicked_hangover_modifier:0 "อาการเมาค้างอย่างรุนแรง"
 tournament_wicked_hangover_modifier_desc:0 "ตัวละครนี้ดื่มหนักเกินไปในคืนก่อนการแข่งขัน"
 tournament_tailor_fancy_crest_modifier:0 "ตราประจำตระกูลอันประณีต"
 tournament_tailor_fancy_crest_modifier_desc:0 "ตัวละครนี้ครอบครองตราประจำตระกูลอันประณีต และไม่เคยปรากฏตัวโดยไม่มีมัน"
 tournament_tailor_mixup_scheme_modifier:0 "การระบุตัวตนที่ผิดพลาด"
 tournament_tailor_mixup_scheme_modifier_desc:0 "ตัวละครนี้ครอบครองตราประจำตระกูลของตระกูลอื่น ทำให้พวกเขามีโอกาสที่ดีในการ ทำให้เข้าใจผิด"
 tournament_armorer_shield_modifier:0 "โล่ชั้นดี"
 tournament_armorer_shield_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นโล่ประดับคุณภาพสูง ซื้อจากช่างทำเกราะในการประลอง"
 tournament_armorer_tournament_modifier:1 "หมวกเหล็กประลอง"
 tournament_armorer_tournament_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นหมวกเหล็กประลองคุณภาพสูง ซื้อจากช่างทำเกราะในการประลอง"
 tournament_tailor_banner_modifier:0 "ธงชั้นดี"
 tournament_tailor_banner_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นธงที่สวยงาม ซื้อจากช่างตัดเสื้อในการประลอง"
 tournament_tailor_gambeson_modifier:0 "เสื้อเกราะนวมชั้นดี"
 tournament_tailor_gambeson_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นเสื้อเกราะนวมที่แข็งแรงทนทาน ซื้อจากช่างตัดเสื้อในการประลอง"
 tournament_tailor_glove_modifier:0 "ถุงมือชั้นดี"
 tournament_tailor_glove_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นถุงมือที่บอบบาง ซื้อจากช่างตัดเสื้อในการประลอง"
 tournament_weaponsmith_ornament_modifier:0 "ดาบประดับ"
 tournament_weaponsmith_ornament_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นอาวุธประดับคุณภาพสูง ซื้อจากโรงตีเหล็กในการประลอง"
 tournament_bowyer_quiver_modifier:0 "ซองธนูชั้นดี"
 tournament_bowyer_quiver_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นซองธนูคุณภาพสูง ซื้อจากช่างทำคันธนูในการประลอง"
 tournament_bowyer_hunt_modifier:0 "ลูกธนูล่าสัตว์หัวทู่ชั้นดี"
 tournament_bowyer_hunt_modifier_desc:1 "ตัวละครนี้ได้รับของขวัญเป็นลูกธนูล่าสัตว์คุณภาพสูง ซื้อจากช่างทำคันธนูในการประลอง"
 tournament_kept_the_peace_modifier:0 "รักษาสันติภาพ"
 tournament_kept_the_peace_modifier_desc:0 "ลิ้นเงินของตัวละครนี้ได้พูดคุยยุติการเผชิญหน้าที่เดิมพันสูง"

 tournament_man_of_the_people_modifier:0 "มิตรของประชาชน"
 tournament_man_of_the_people_modifier_desc:0 "ตัวละครนี้ยินดีที่จะผูกมิตรกับสามัญชนในระดับเดียวกับพวกเขา"
 tournament_snob_modifier:1 "หัวสูง"
 tournament_snob_modifier_desc:0 "ตัวละครนี้ปฏิเสธที่จะใช้เวลากับผู้ที่ถือว่าต่ำกว่าสถานะของตน"

 tournament_dice_player_modifier:0 "นักพนันลูกเต๋า"
 tournament_dice_player_modifier_desc:0 "ตัวละครนี้เข้าร่วมในเกมลูกเต๋าเดิมพันสูงที่โรงเตี๊ยม"
 tournament_lecherous_knight_modifier:0 "อัศวินผู้มักมากในกาม"
 tournament_lecherous_knight_modifier_desc:0 "ตัวละครนี้พบว่าอัศวินของตนกำลังทำกิจกรรมรักใคร่กับผู้เชี่ยวชาญที่ไม่เปิดเผยตัวตนบางคนและตัดสินใจเข้าร่วม"
 tournament_lecherous_knight_positive_modifier:0 "อัศวินผู้มักมากในกาม"
 tournament_lecherous_knight_positive_modifier_desc:1 "ตัวละครนี้พบว่าอัศวินของตนกำลังทำกิจกรรมรักใคร่กับผู้เชี่ยวชาญที่ไม่เปิดเผยตัวตนบางคนและตัดสินใจเข้าร่วม ซึ่งได้รับการอนุมัติจาก [ROOT.Char.GetFaith.PriestNeuterPlural] ของพวกเขา"
 
