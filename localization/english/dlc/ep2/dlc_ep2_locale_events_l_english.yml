 ep2_locale_events.1060.t:0 "คนพาลและคนโง่"
 ep2_locale_events.1060.desc:0 ""ฮ่า! คนพาล!" ข้าได้ยินใครบางคนตะโกนขณะที่ข้าเปิดประตู [tournament_gambler.GetWomanMan] คนหนึ่งยิ้มกว้าง พอใจ ขณะที่ [tournament_gambler.GetSheHe] เก็บทองที่วางอยู่บนโต๊ะ "บา!" คู่ต่อสู้ของ [tournament_gambler.GetHerHis] บ่น ตบโต๊ะขณะที่ [tournament_gambler.GetSheHe] ลุกขึ้น\n\nคนแปลกหน้าสบตากับข้า โค้งคำนับเล็กน้อย "[ROOT.Char.GetTitleAsNameNoTooltip] ประสงค์จะเล่นไพ่สักเกมหรือไม่? ข้าวางไพ่ของข้าลงและท่านเดิมพันว่าไพ่ของท่านจะสูงหรือต่ำกว่า ชนะได้ทั้งหมด ง่ายอย่างที่ฟัง"\n\n"ห้า" [tournament_gambler.GetSheHe] พูด พลางวางไพ่ของ [tournament_gambler.GetHerHis] ลง"
 ep2_locale_events.1060.a:0 ""ไพ่ของข้าสูงกว่า!""
 ep2_locale_events.1060.b:0 ""ไพ่ของข้าต่ำกว่า!""
 ep2_locale_events.1060.c:0 ""ข้าไม่ประสงค์จะเล่นการพนัน""
