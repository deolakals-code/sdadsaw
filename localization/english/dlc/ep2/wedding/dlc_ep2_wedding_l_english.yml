 province_desc_wedding_pleasure_dome:0 "\n#P +++ $building_leisure_palace_03$#!\n#weak การนี้จักนำไปสู่การได้รับ [dynasty_prestige_i] [dynasty_prestige|E] เพิ่มพูนขึ้น และการลดถอยของ [stress_loss_i][stress|E]#!"
 province_desc_wedding_izumo_taisha: "\n#P +++ $building_izumo_taisha_01$#!\n#weak สิ่งนี้จะนำไปสู่การเพิ่มขึ้นของ [dynasty_prestige|E] [dynasty_prestige_i] และการลดลงของ [stress|E] [stress_loss_i]#!"
 province_desc_wedding_holy_site:0 "\n#P + เป็นสถานที่ศักดิ์สิทธิ์ในศรัทธาของท่าน#!\n#weak สิ่งนี้จะนำไปสู่การได้รับ[piety_i] [piety|E]#!"
 every_cruel_vassal:0 "ข้าในบังคับผู้โหดเหี้ยมทุกคน"
 wedding_every_other_vassal:0 "ข้าในบังคับอื่นทุกคน"
 activity_wedding_guest_desc:0 "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$[opinion|E]ต่อเจ้าภาพและคู่สมรส\n$BULLET_WITH_TAB$อาจสูญเสีย[stress_loss_i][stress|E]\n$BULLET_WITH_TAB$อาจได้รับ[GetModifier( 'wedding_of_the_century_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$อาจได้รับ[trait_level_track_xp|E]ของลักษณะนิสัย [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]"
 activity_wedding_guest_help_text:0 "\nแขกในงานสมรสเข้าร่วมการเฉลิมฉลอง พร้อมที่จะตื่นตาตื่นใจกับความหรูหราของงาน และประทับใจในตัวคู่สมรสและเจ้าภาพ!\nงานสมรสเป็นงานสังคมและการเมือง เต็มไปด้วยโอกาสในการพบปะสังสรรค์และสร้างความสัมพันธ์ที่มีความหมายกับแขกเหรื่อ"

 ### PHASES
 wedding_phase_ceremony:0 "พิธีสมรส"
 wedding_phase_ceremony_desc:0 "พิธีกรรมและการเตรียมการทั้งหมดที่นำไปสู่การแลกเปลี่ยนคำสาบาน ซึ่ง ทำให้การสมรสเป็นทางการ"
 wedding_phase_banquet:0 "งานเลี้ยงสมรส"
 wedding_phase_banquet_desc:0 "งานเลี้ยงเพื่อเฉลิมฉลองการครองคู่ครั้งใหม่: มีอาหาร เครื่องดื่ม และมหรสพมากมาย"
 wedding_phase_wnight:0 "คืนวิวาห์"
 wedding_phase_wnight_desc:0 "ขณะที่คู่สมรสเข้าหอ แขกที่เหลืออยู่ก็เพลิดเพลินกับงานเลี้ยงที่ค่อยๆ เลิกรา"

 ### OPTIONS
 wedding_type_normal:0 "พิธีสมรสอันยิ่งใหญ่"
 wedding_type_normal_desc:1 "\n#weak งานสมรสมีขึ้นเพื่อเป็นการเฉลิมฉลองอันงดงามของการครองคู่ของคู่สมรสสองคน แต่ยังรวมถึงสองตระกูลด้วย#!\n\n@warning_icon! #X [GetActivityType('activity_wedding').GetName]ที่สัญญาไว้จะต้องจัดขึ้นก่อนที่สัญญาจะหมดอายุ มิฉะนั้นท่านจะได้รับบทลงโทษ#!"
 wedding_type_bloody:0 "พิธีสมรสสีเลือด"
 wedding_type_bloody_desc:1 "ท่านจะสังหารอีกตระกูลหนึ่ง\n#weak ท่านไม่ได้กำลังจัดงานสมรส ท่านกำลังวางแผนงานศพ#!\n\n@warning_icon! #X ท่านจะไม่สามารถจัด[GetActivityType('activity_wedding').GetName]สีเลือดได้เป็นเวลา 15 ปี#!\n@warning_icon! #X การตั้งเป้าหมายไปที่[liege|E]หรือ[head_of_faith|E]ของท่านจะมีบทลงโทษที่รุนแรงกว่า#!\n\n@alert_icon! #alert_trial ตัวละครที่มีลักษณะนิสัย [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] และ [GetTrait('calm').GetName( GetNullCharacter )] จะได้รับ[stress|E]#!"
 wedding_option_entertainment:0 "มหรสพ"
 wedding_entertainment_bad:1 "มหรสพในครัวเรือน"
 wedding_entertainment_bad_desc:1 "$EFFECT_LIST_BULLET$ การได้รับ[prestige|E]ลดลง\n\n#weak ผู้ให้ความบันเทิงที่อยู่ในราชสำนักเป็นประจำ เช่น ตัวตลกและนักโยน juggling จะเข้าร่วมงานสมรส#!"
 wedding_entertainment_normal:0 "นักกายกรรมและนักดนตรี"
 wedding_entertainment_normal_desc:1 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ การได้รับ[prestige|E]โดยเฉลี่ย\n\n#weak นักแสดงหลักในราชสำนักที่น่าเคารพนับถือ#!"
 wedding_entertainment_good:0 "นักขับลำนำและสัตว์หายากต่างแดน"
 wedding_entertainment_good_desc:1 "$EFFECT_LIST_BULLET$ [trait_level_track_xp|E]ของลักษณะนิสัย [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ การได้รับ[prestige|E]เพิ่มขึ้น\n\n#weak เฉพาะนักแสดงที่เก่งกาจที่สุดและสัตว์ที่หายากที่สุดเท่านั้น!#!"
 wedding_option_food:0 "อาหารและเครื่องดื่ม"
 wedding_food_bad:1 "งานเลี้ยงพอประมาณ"
 wedding_food_bad_desc:1 "$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]ลดลงกับตัวละครที่เข้าร่วมทั้งหมด\n\n#weak งานเลี้ยงที่ตรงตามความคาดหวัง แต่ไม่มีอะไรน่าจดจำ#!"
 wedding_food_normal:0 "งานเลี้ยงอย่างเอื้อเฟื้อ"
 wedding_food_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]โดยเฉลี่ยกับตัวละครที่เข้าร่วมทั้งหมด\n\n#weak งานเลี้ยงที่เหมาะสมซึ่งจะทำให้แขกทุกคนพอใจ#!"
 wedding_food_good:0 "มื้ออาหารมหึมา"
 wedding_food_good_desc:1 "$EFFECT_LIST_BULLET$ โบนัสการสูญเสีย[stress|E]\n$EFFECT_LIST_BULLET$ โบนัส[health|E]เพิ่มขึ้น\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]เพิ่มขึ้นกับตัวละครที่เข้าร่วมทั้งหมด\n\n#weak โต๊ะจะแอ่นภายใต้น้ำหนักของอาหารทั้งหมดนี้!#!"
 wedding_option_decoration:1 "สถานที่จัดงานวิวาห์"
 wedding_decoration_bad:0 "ดอกไม้ป่า"
 wedding_decoration_bad_desc:1 "$EFFECT_LIST_BULLET$ ได้รับ[trait_level_track_xp|E]ของลักษณะนิสัย [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]ลดลงกับ[vassals|E] [GetVassalStance( 'courtly' ).GetName] ของท่าน\n\n#weak การตกแต่งที่สวยงามด้วยดอกไม้ที่เก็บมาสดๆ และทีมงานพ่อครัวแม่ครัวและบริกรพอประมาณ#!"
 wedding_decoration_normal:0 "พวงมาลัยและคบเพลิง"
 wedding_decoration_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]โดยเฉลี่ยกับ[vassals|E] [GetVassalStance( 'courtly' ).GetName] ของท่าน\n$EFFECT_LIST_BULLET$ ได้รับ[GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]\n\n#weak การตกแต่งแบบดั้งเดิม และคนรับใช้เพียงพอที่จะไม่ปล่อยให้จอกใดว่างเปล่า#!"
 wedding_decoration_good:0 "เงินและทองคำ"
 wedding_decoration_good_desc:2 "$EFFECT_LIST_BULLET$ การได้รับ[opinion|E]เพิ่มขึ้นกับ[vassals|E] [GetVassalStance( 'courtly' ).GetName] ของท่าน\n$EFFECT_LIST_BULLET$ [dynasty_prestige|E] และ [prestige|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ ได้รับ[GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n\n#weak การแสดงความมั่งคั่งอันไร้ขอบเขตอย่างไม่ปิดบัง และคนรับใช้เพียงพอสำหรับแขกแต่ละคนที่จะมีพนักงานเชิญจอกส่วนตัว#!"
 wedding_good_option_desc:1 "$EFFECT_LIST_BULLET$ [vassals|E] [GetVassalStance( 'glory_hound' ).GetName] และ [GetVassalStance( 'courtly' ).GetName] จะได้รับ[opinion|E]ต่อท่านมากขึ้น"
 wedding_normal_option_desc:1 "$EFFECT_LIST_BULLET$ [vassals|E] [GetVassalStance( 'parochial' ).GetName] และ [GetVassalStance( 'zealot' ).GetName] จะได้รับ[opinion|E]ต่อท่านมากขึ้น"

 ### INTENTS
 diplomatic_intent:0 "การทูต"
 diplomatic_intent_desc:0 "ได้รับพันธมิตรกับตัวละครที่เลือก หรือแม้กระทั่ง ทำให้พวกเขาประทับใจจนยอมจำนน"
 matchmaking_intent:0 "การจับคู่"
 matchmaking_intent_desc:0 "หาคู่ที่เหมาะสมสำหรับตัวละครที่เลือกและจัดการหมั้นหมาย"
 banquet_mischief_intent:0 "การก่อกวน"
 banquet_mischief_intent_desc:1 "ก่อความวุ่นวายและเพิ่มการสูญเสีย[stress|E]ของท่านพร้อมผลลัพธ์ที่อาจ#EMPโชคร้าย#! ตามมา"

 ### COST
