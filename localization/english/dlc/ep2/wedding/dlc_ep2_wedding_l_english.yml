l_english: 

 ##### WEDDING #####

 ### ACTIVITY
 activity_wedding:0 "พิธีสมรสอันยิ่งใหญ่"
 activity_wedding_selection_tooltip:1 "จัด[GetActivityType('activity_wedding').GetName] การเฉลิมฉลองอันงดงามของการครองคู่ของคนสองคน\n\nรางวัลที่คาดว่าจะได้รับ:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$[stress_loss_i] การสูญเสีย[stress|E]"
 activity_wedding_desc:0 "การเฉลิมฉลองอันยิ่งใหญ่ของการครองคู่ของคนสองคน\n\nอย่างไรก็ตาม นี่ไม่ใช่เพียงพิธีสมรสเท่านั้น แต่ยังเป็นการแสดงอิทธิพลต่อสาธารณะ และเป็นงานสังคมที่เหล่าขุนนางมารวมตัวกันเพื่อฝึกฝนศิลปะแห่งการทูต การยั่วยวน และการฆาตกรรม — หรือเพื่อดื่มสังสรรค์กับมิตรสหาย!"
 activity_wedding_host_desc:0 "$BULLET_WITH_TAB$[spouses|E]ที่ถูกเลือกจะ[married|E]กัน\n$BULLET_WITH_TAB$ได้รับ[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$ได้รับ[legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[opinion|E]จากแขก\n$BULLET_WITH_TAB$[opinion|E]จาก[vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$BULLET_WITH_TAB$อาจได้รับ[trait_level_track_xp|E]ของลักษณะนิสัย [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$อาจสูญเสีย[stress_loss_i][stress|E]\n$BULLET_WITH_TAB$อาจได้รับ[GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$อาจได้รับ[GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]"
 wedding_need_to_promise:0 "ท่านจำเป็นต้อง[grand_wedding_promised|E][GetActivityType( 'activity_wedding' ).GetName] เพื่อที่จะจัดงานได้!"
 wedding_need_to_be_valid:0 "ตัวละครคู่หมั้นทั้งสองต้องเป็นผู้ใหญ่และพร้อมที่จะสมรส"
 activity_wedding_conclusion_characters_header:0 "คู่สมรสใหม่"
 spouse_1:0 "คู่สมรส"
 spouse_2:0 "$spouse_1$"
 spouse_1_for_host:0 "$spouse_1$"
 spouse_2_for_host:0 "$spouse_2$"
 spouse_1_desc:0 "[GetActivityType( 'activity_wedding' ).GetName]เป็นการเฉลิมฉลองการครองคู่ของ[spouses|E]สองคน พวกเขาเป็นส่วนสำคัญของกิจกรรม ซึ่งไม่สามารถจัดขึ้นได้ เว้นแต่[GetActivityType( 'activity_wedding' ).GetNameNoTooltip]จะถูก[grand_wedding_promised|E]ให้กับคู่รัก ณ เวลาที่[betrothal|E]\n\nคู่สมรสจะตอบรับคำเชิญเข้าร่วมงานสมรสของตนเสมอ และจะได้รับรางวัลเฉพาะเมื่อสิ้นสุดกิจกรรม\n"
 spouse_2_desc:0 "$spouse_1_desc$"
 spouse_1_desc_for_host:0 "$spouse_1_desc$"
