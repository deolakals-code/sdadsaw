l_english: 
 ##################################################
 # MISC
 ep2_wedding_ewan_0041_attraction_modifier:0 "เป็นที่กล่าวขานไปทั่ว"
 ep2_wedding_ewan_0041_attraction_modifier_desc:0 "คุณสมบัติที่ดีที่สุดของตัวละครนี้เป็นที่กล่าวถึงกันทุกคน"
 ep2_wedding_ewan_0051_snooty_modifier:0 "หัวสูง"
 ep2_wedding_ewan_0051_snooty_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่าไม่เสียเวลากับพวกชั้นต่ำ พวกประจบสอพลอ และคนโง่ที่ทำตัวเกินสถานะ"
 ep2_wedding_ewan_0051_approachable_modifier:0 "เข้าถึงง่าย"
 ep2_wedding_ewan_0051_approachable_modifier_desc:0 "ถือเป็นผู้มีไหวพริบดี ตัวละครนี้มีเวลาพูดคุยเสมอ ไม่ว่าหัวข้อสนทนาจะน่าเบื่อเพียงใด"
 ep2_wedding_ewan.0000.desc.hate.fallback:0 ""บาห์ ท่านมันพวกเอาใจง่าย" [char_2.GetFirstNameNoTooltip] พูดขึ้นจมูก "ข้าคาดหวังมากกว่านี้จากงานประเภทนี้""
 ep2_wedding_ewan.0000.desc.boilerplate.char_intro:0 "ใกล้ที่นั่งของข้า ทั้ง [char_1.GetTitledFirstName] และ [char_2.GetTitledFirstName] ต่างแสดงความคิดเห็น"
 ep2_wedding_ewan.0000.flavour.hobnob.char_1:0 "ท่านใช้เวลาส่วนใหญ่ของค่ำคืนคลุกคลีอยู่กับ [char_1.Custom('GetEducationTrait')] ผู้นี้"
 ep2_wedding_ewan.0000.flavour.hobnob.char_2:0 "ท่านใช้เวลาส่วนใหญ่ของค่ำคืนคลุกคลีอยู่กับ [char_2.Custom('GetEducationTrait')] ผู้นี้"












 ##################################################
 # BANQUET PHASE

 ep2_wedding_ewan.0001.t:0 "ช่างเป็นภาพที่น่าตื่นตา"
 ep2_wedding_ewan.0001.desc.intro.bad:0 "แม้จะไม่ใช่งานที่ยิ่งใหญ่ที่สุด แต่ความบันเทิงในค่ำคืนนี้ก็ยังคงเป็นการแสดงที่น่าตื่นเต้นของนักแสดง นักกายกรรม นักเล่นกล และอื่นๆ อีกมากมาย $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ เกี่ยวกับการแสดง\n\n"
 ep2_wedding_ewan.0001.desc.t1.love.diligent:0 ""ไชโย! ไชโย! พอให้เพลินใจโดยไม่ #EMP ฟุ่มเฟือย#! เกินไป!" [char_1.GetFirstNameNoTooltip] ร้องอุทาน"
 ep2_wedding_ewan.0001.desc.t1.love.shy:0 ""เป็นการดีที่มีความตื่นเต้นเป็นฉากหลังโดยไม่รบกวนการสนทนาทั้งหมด" [char_1.GetFirstNameNoTooltip] กระซิบกระซาบ"
 ep2_wedding_ewan.0001.desc.t1.love.humble:0 ""จำนวนนักแสดงที่สมบูรณ์แบบ เหมาะสมดีแล้ว" [char_1.GetFirstNameNoTooltip] พยักหน้าอย่างพอใจ"
 ep2_wedding_ewan.0001.desc.t1.love.content:0 "$ep2_wedding_ewan.0001.desc.t1.love.humble$"
 ep2_wedding_ewan.0001.desc.t1.love.honest:0 ""ข้าดีใจที่ไม่ค่อยมีนักแสดงมากนัก" [char_1.GetFirstNameNoTooltip] ขมวดคิ้ว "โดยทั่วไปแล้วเป็นพวกน่ารำคาญ""
 ep2_wedding_ewan.0001.desc.t1.love.just:0 "$ep2_wedding_ewan.0001.desc.t1.love.honest$"
 ep2_wedding_ewan.0001.desc.t1.love.craven:0 ""ข้ามักจะกระวนกระวายเล็กน้อยหากการแสดง #EMP โลดโผน#! เกินไป" [char_1.GetFirstNameNoTooltip] หัวเราะเบาๆ"
 ep2_wedding_ewan.0001.desc.t1.love.paranoid:0 ""พวกนักแสดงเป็นคนเอาแน่เอานอนไม่ได้ เท่านี้ก็พอแล้ว — เสี่ยงเกินไปที่จะมีมากเกินไปในที่เดียว" [char_1.GetFirstNameNoTooltip] พยักหน้า"
 ep2_wedding_ewan.0001.desc.intro.normal:0 "ฝูงนักดนตรี นักกายกรรมตีลังกา และนักแสดงอันงดงามกำลังมอบความบันเทิงยามค่ำคืน สร้างความตื่นเต้นให้กับแขกทั่วทั้งห้องโถง $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ เกี่ยวกับการแสดง\n\n"
 ep2_wedding_ewan.0001.desc.t2.love.content:0 ""อา ความรื่นเริงในปริมาณที่พอเหมาะพอดี ข้าคิดว่านะ" [char_1.GetFirstNameNoTooltip] หัวเราะ"
 ep2_wedding_ewan.0001.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0001.desc.t2.love.content$"
 ep2_wedding_ewan.0001.desc.t2.love.generous:0 ""ดีที่ได้เห็นความหลากหลายในการแสดงบ้าง" [char_1.GetFirstNameNoTooltip] พูดเนิบๆ "บ่อยครั้งที่ผู้คนมักจะตระหนี่เกี่ยวกับเรื่องเหล่านี้""
 ep2_wedding_ewan.0001.desc.t2.love.calm:0 ""ต้องใช้ความคิดอย่างมากในการสร้างสมดุลที่เหมาะสมของเสียงรบกวนรอบข้าง" [char_1.GetFirstNameNoTooltip] ครุ่นคิด "เป็นการดีที่ได้เห็นบ้างโดยไม่มีความ #EMP วุ่นวาย#! มากเกินไป""
 ep2_wedding_ewan.0001.desc.t2.love.patient:0 "$ep2_wedding_ewan.0001.desc.t2.love.calm$"
 ep2_wedding_ewan.0001.desc.t2.love.fickle:0 ""ข้าไม่เคยรู้เลยว่าต้องการอะไรจากนักแสดงกันแน่" [char_1.GetFirstNameNoTooltip] หัวเราะ "ดังนั้นข้าต้องบอกว่าระดับนี้รู้สึกดีสำหรับข้า""
 ep2_wedding_ewan.0001.desc.t2.love.cynical:0 ""จำนวนนักแสดงที่ถูกต้องและไม่มากไปกว่านั้น" [char_1.GetFirstNameNoTooltip] กล่าวอย่างเย็นชา "ดี ข้าทนพวกพยายามเกินเหตุไม่ได้""
 ep2_wedding_ewan.0001.desc.intro.good:0 "ห้องโถงเต็มไปด้วยขบวนแห่อันอึกทึกครึกโครมของคณะนักแสดง นักดนตรีเต้นรำ และนักต้มตุ๋นแปลกตา สร้างความพึงพอใจให้กับแขกจำนวนมาก $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ เกี่ยวกับการแสดง\n\n"
 ep2_wedding_ewan.0001.desc.t3.love.lazy:0 ""ตีลังกาสิ!" [char_1.GetFirstNameNoTooltip] ตะโกนใส่นักกายกรรมที่กำลังโลดเต้น "สาบานต่อ [char_1.GetFaith.HealthGodName] ข้า #EMP รัก#! งานเลี้ยงดีๆ!""
 ep2_wedding_ewan.0001.desc.t3.love.gregarious:0 "$ep2_wedding_ewan.0001.desc.t3.love.lazy$"
 ep2_wedding_ewan.0001.desc.t3.love.arrogant:0 ""นี่สิ #EMP นี่แหละ#! ที่ข้าชอบ!" [char_1.GetFirstNameNoTooltip] หัวเราะลั่น "งานที่ยิ่งใหญ่ ไม่สิ #EMP งดงามอลังการ#!""
 ep2_wedding_ewan.0001.desc.t3.love.ambitious:0 "$ep2_wedding_ewan.0001.desc.t3.love.arrogant$"
 ep2_wedding_ewan.0001.desc.t3.love.deceitful:0 ""ข้าเคารพนักแสดงมาก" [char_1.GetFirstNameNoTooltip] ครุ่นคิด "ต้องใช้ทักษะในการเปลี่ยนความเท็จให้เป็นอาชีพที่ทำเงินได้""
 ep2_wedding_ewan.0001.desc.t3.love.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t3.love.deceitful$"
 ep2_wedding_ewan.0001.desc.t3.love.brave:0 ""ใช่ๆ เจ้าเล่นดนตรีขณะลอยตัวได้ อย่าขี้ขลาดสิ!" [char_1.GetFirstNameNoTooltip] หัวเราะ พลางพูดจาหาเรื่องนักดนตรี "มันไม่สนุกหรอกถ้าไม่มี #EMP อันตราย#! เล็กน้อย""
 ep2_wedding_ewan.0001.desc.t3.love.trusting:0 ""คนแปลกหน้าเหล่านี้เล่นกลอะไรแปลกใหม่ เช่นนี้" [char_1.GetFirstNameNoTooltip] หัวเราะ "ข้าเกือบจะหวังว่าบางคนจะมาอยู่กับข้า""
 ep2_wedding_ewan.0001.desc.midtro:0 "\n\n"
 ep2_wedding_ewan.0001.desc.t1.hate.lazy:0 ""หืมม ข้าค่อนข้างหวังว่าจะได้อะไรที่... หรูหรากว่านี้หน่อย..." [char_2.GetFirstNameNoTooltip] ครวญคราง"
 ep2_wedding_ewan.0001.desc.t1.hate.gregarious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.lazy$"
 ep2_wedding_ewan.0001.desc.t1.hate.arrogant:0 ""บาห์ ถึงแม้จะพอใช้ได้ แต่มันก็แทบจะไม่ใช่ภาพที่ข้าคาดหวังไว้เลย" [char_2.GetFirstNameNoTooltip] คร่ำครวญ"
 ep2_wedding_ewan.0001.desc.t1.hate.ambitious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.arrogant$"
 ep2_wedding_ewan.0001.desc.t1.hate.deceitful:0 ""บอกตามตรง ข้าหวังไว้มากกว่านี้เล็กน้อย" [char_2.GetFirstNameNoTooltip] บ่น "ข้าพบว่าคนประเภทนี้น่าทึ่ง""
 ep2_wedding_ewan.0001.desc.t1.hate.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t1.hate.deceitful$"
 ep2_wedding_ewan.0001.desc.t1.hate.brave:0 ""ควรจะมีมากกว่านี้" [char_2.GetFirstNameNoTooltip] บ่น "ไม่กี่คนนี้ไม่เพียงพอที่จะทำอะไรที่กล้าหาญจริงๆ ได้""
 ep2_wedding_ewan.0001.desc.t1.hate.trusting:0 ""ข้าหวังว่าจะมีความหลากหลายมากกว่านี้ บอกตามตรง" [char_2.GetFirstNameNoTooltip] คร่ำครวญ "ท่านสามารถหาคนทำงานประเภทนี้เพิ่มได้จากเมืองเก่าๆ ทั่วไปอยู่แล้ว""
 ep2_wedding_ewan.0001.desc.t2.hate.ambitious:0 ""ก็พอใช้ได้ ข้าเดาว่านะ" [char_2.GetFirstNameNoTooltip] พูดอย่างฉุนเฉียว "ข้าแค่ชอบความโอ้อวดที่น่าประทับใจอย่างแท้จริงมากกว่ามาตรการครึ่งๆ กลางๆ เหล่านี้""
 ep2_wedding_ewan.0001.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0001.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0001.desc.t2.hate.greedy:0 ""บาห์ มีมากเกินไปที่จะชื่นชมความประหยัด แต่ก็ไม่มากพอที่จะเพลิดเพลินกับการแสดงเหรียญของคนอื่น" [char_2.GetFirstNameNoTooltip] คร่ำครวญ"
 ep2_wedding_ewan.0001.desc.t2.hate.wrathful:0 ""บอกตามตรง ข้าคาดหวังความเร่งรีบและความวุ่นวายจากงานนี้มากกว่านี้เล็กน้อย" [char_2.GetFirstNameNoTooltip] พูดขึ้นจมูก"
 ep2_wedding_ewan.0001.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0001.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0001.desc.t2.hate.stubborn:0 ""ในความคิดของข้า นี่ควรจะเป็นการเฉลิมฉลองสำหรับพิธี" [char_2.GetFirstNameNoTooltip] ให้ความเห็น "ดังนั้นมันควรจะเข้ากับความสำคัญของมันและจัดเต็มที่""
 ep2_wedding_ewan.0001.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0001.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0001.desc.t3.hate.diligent:0 ""ข้าแค่คิดว่าทั้งหมดนี้มันมากเกินไปหน่อย" [char_2.GetFirstNameNoTooltip] บ่น "ความ... เหลาะแหละ... มากมายเหลือเกิน...""
 ep2_wedding_ewan.0001.desc.t3.hate.shy:0 ""ข้าแทบไม่ได้ยินความคิดของตัวเองเลย" [char_2.GetFirstNameNoTooltip] กระซิบกระซาบ "มันช่าง... ท่วมท้นเหลือเกิน...""
 ep2_wedding_ewan.0001.desc.t3.hate.humble:0 ""มันดี แต่มันค่อนข้างอวดดีไปหน่อย" [char_2.GetFirstNameNoTooltip] พูดขึ้นจมูก "ข้าอยากมีพื้นที่คุยมากกว่านี้หน่อย""
 ep2_wedding_ewan.0001.desc.t3.hate.content:0 "$ep2_wedding_ewan.0001.desc.t3.hate.humble$"
 ep2_wedding_ewan.0001.desc.t3.hate.honest:0 ""#EMP นักแสดง#! [char_2.GetFirstNameNoTooltip] คร่ำครวญ "พวกโกหกมืออาชีพทั้งนั้น เราน่าจะมีน้อยกว่านี้ในโอกาสสำคัญ เช่นนี้""
 ep2_wedding_ewan.0001.desc.t3.hate.just:0 "$ep2_wedding_ewan.0001.desc.t3.hate.honest$"
 ep2_wedding_ewan.0001.desc.t3.hate.craven:0 ""ระวัง!" [char_2.GetFirstNameNoTooltip] ถ่มน้ำลาย หลบลูกบอลโยนที่ขว้างมา "พวกทหารรับจ้างบ้าบิ่น กินข้าวของข้าอย่างปลอดภัยยังไม่ได้เลย...""
 ep2_wedding_ewan.0001.desc.t3.hate.paranoid:0 ""ใบหน้าแปลกๆ มากเกินไป 'เครื่องมือ' ประหลาดๆ มากเกินไป" [char_2.GetFirstNameNoTooltip] สาปแช่ง "อย่างคนนั้น! นั่นดาบปลอมที่กำลังกลืนลงไป หรือว่าเป็นนักฆ่าที่ซุ่มซ่อนอยู่?""
 ep2_wedding_ewan.0001.a:0 ""เห็นได้ชัดว่า [char_1.GetFirstNameNoTooltip] พูดถูก""
 ep2_wedding_ewan.0001.a.host:0 ""[char_1.GetFirstNameNoTooltip] ดีใจมากที่ท่านชอบมัน!""
 ep2_wedding_ewan.0001.b:0 ""ข้าต้องเห็นด้วยกับ [char_2.GetFirstNameNoTooltip]""
 ep2_wedding_ewan.0001.b.host:0 ""ข้าจินตนาการไว้ต่างออกไปตอนที่จ้างพวกเขามา [char_2.GetFirstNameNoTooltip]""
 ep2_wedding_ewan.0001.c:0 "สายตาคุกคามของข้าจับจ้องไปที่ [intent_target.GetFirstNameNoTooltip]..."
 ep2_wedding_ewan.0001.c.tt:0 "สายตาของท่าน ทำให้ [intent_target.GetFirstNameNoTooltip] ประหม่า"
 ep2_wedding_ewan.0001.d:0 "ข้าสนใจความบันเทิงจริงๆ มากกว่า"

 ep2_wedding_ewan.0011.t:0 "อาหารเลิศรสสำหรับ..."
 ep2_wedding_ewan.0011.desc.intro.bad:0 "ตามมาตรฐานที่สมเหตุสมผล อาหารในค่ำคืนนี้เป็นการผสมผสานที่น่าตื่นเต้นของเนื้อสัมผัส รสชาติ และความตระการตา แม้ว่านี่จะเป็นโอกาสพิเศษอย่างยิ่ง $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ เกี่ยวกับอาหารที่จัดเตรียมไว้\n\n"
 ep2_wedding_ewan.0011.desc.t1.love.temperate:0 ""สาบานต่อ [char_1.GetFaith.HealthGodName] อาหาร #EMP เลิศรส#! จริงๆ!" [char_1.GetFirstNameNoTooltip] กล่าวอย่างกระตือรือร้น "หลากหลายตามที่ความเหมาะสมเรียกร้อง โดยไม่ตามใจปากมากเกินไป!""
 ep2_wedding_ewan.0011.desc.t1.love.humble:0 ""เป็นเรื่องสำคัญที่จะตามใจตัวเองบ้างเป็นครั้งคราว" [char_1.GetFirstNameNoTooltip] ครุ่นคิด "และนี่คือวิธีที่ข้าชอบทำพอดี""
 ep2_wedding_ewan.0011.desc.t1.love.content:0 "$ep2_wedding_ewan.0011.desc.t1.love.humble$"
 ep2_wedding_ewan.0011.desc.t1.love.impatient:0 ""อะฮ่า อาหารชูกำลังที่สำคัญมาทันเวลาพอดี" [char_1.GetFirstNameNoTooltip] ร้องอุทาน "ยอดเยี่ยม! ข้าทนอาหารจานเล็กๆ นับพันไม่ได้""
 ep2_wedding_ewan.0011.desc.t1.love.paranoid:0 ""อืมม ระดับกำลังดี" [char_1.GetFirstNameNoTooltip] กล่าว พลางพลิกชิ้นอาหารหนาๆ "การตก แต่งที่หรูหราเกินไปเป็นการเชื้อเชิญยาพิษ""
 ep2_wedding_ewan.0011.desc.t1.love.stubborn:0 ""อาหารจานเดิมอีกจาน" [char_1.GetFirstNameNoTooltip] หัวเราะ "ข้ารู้ว่าข้าชอบอะไร และข้าชอบสิ่งที่พวกเขากำลังเสิร์ฟ!""
