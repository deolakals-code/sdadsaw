 ep2_wedding_ewan.0051.d.custom.every_lazy_guest:0 "แขก [GetTrait('lazy').GetName( reference )] ทุกคน"
 ep2_wedding_ewan.0051.e:0 ""#EMP ผับ#! ท่านว่า..."
 ep2_wedding_ewan.0051.f:0 ""#EMP ร้านเค้ก#! ท่านว่า..."
