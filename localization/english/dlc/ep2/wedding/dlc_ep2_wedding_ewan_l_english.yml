 ep2_wedding_ewan.0071.t:0 "คำสาบานในชั่วขณะ"
 ep2_wedding_ewan.0071.desc:0 ""[ROOT.Char.GetFirstNameNoTooltip]," เจ้าเหนือหัวของข้า [liege.GetTitledFirstName] ครุ่นคิด "ข้าค่อนข้างชอบท่านเสมอมา ท่านทำงานหนักเพื่อเอาใจข้า และชื่อเสียงของท่านก็แผ่ขยายไปทั่ว [liege.GetPrimaryTitle.GetNameNoTier] เหมือนกิ่งก้านของต้นไม้ร่มรื่น"\n\nข้าพยักหน้า สันนิษฐานว่า [liege.GetWomanMan] คงจะเพลิดเพลินกับงานรื่นเริงเล็กน้อยขณะที่ [liege.GetSheHe] พูดพร่ำต่อไป\n\n"ข้ามีข้อเสนอ — ท่านชอบเอาใจข้า ข้าชอบที่จะเกี่ยวข้องกับท่าน ท่านว่าอย่างไรถ้าท่านจะพูดจาดีๆ เกี่ยวกับข้าให้ผู้ชื่นชมของท่านฟัง และเป็นการแลกเปลี่ยน ข้าจะ ทำให้เป็นที่รู้กันว่าท่านได้รับความสนใจเป็นพิเศษจากข้า?""
 ep2_wedding_ewan.0071.a:0 "ฟังดูเป็นการแลกเปลี่ยนที่ยุติธรรมยิ่งกว่าสำหรับข้า!"
 ep2_wedding_ewan.0071.b:0 "ขอบคุณ แต่ไม่ล่ะ ขอบคุณ"
