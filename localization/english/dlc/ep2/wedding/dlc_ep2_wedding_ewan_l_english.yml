 ep2_wedding_ewan.0051.n.tt:0 "ท่านฟังทุกคำ. สุดท้าย. คำ."

 ep2_wedding_ewan.0052.t:0 "ธุรกิจที่ยังไม่เสร็จสิ้น: ได้กำไร"
 ep2_wedding_ewan.0052.desc.intro:0 "หลายปีก่อน ข้าตกลงที่จะให้ทุนสนับสนุนกิจการที่เสนอโดย [dolt.GetFirstNameNoTooltip] บอกตามตรง ข้าเกือบลืมเรื่องนี้ไปแล้ว —"
 ep2_wedding_ewan.0052.desc.dolt_availability.dead:0 "โดยเฉพาะอย่างยิ่งเมื่อ [dolt.GetFirstNameNoTooltip] ตายและจากไปแล้วในทุกวันนี้"
 ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned:0 "ไม่น้อยไปกว่านั้น เพราะ [dolt.GetFirstNameNoTooltip] ไม่อยู่ในฐานะที่จะจัดการอะไรได้มากนักในตอนนี้"
 ep2_wedding_ewan.0052.desc.dolt_availability.free:0 "[dolt.GetFirstNameNoTooltip] แทบไม่ได้พยายามให้ข้าลงทุนต่อไปหลังจากเงินก้อนแรกเลย"
 ep2_wedding_ewan.0052.desc.midtro:0 "\n\nอย่างไรก็ตาม จดหมายฉบับหนึ่งมาถึงเมื่อเช้านี้ ประกาศความสำเร็จที่ไม่คาดคิดของกิจการของเรา"
 ep2_wedding_ewan.0052.desc.drunkard:0 "โรงเตี๊ยมเล็กๆ ได้เติบโตขึ้นเป็นสถานประกอบการดื่มกินที่เจริญรุ่งเรือง"
 ep2_wedding_ewan.0052.desc.hashishiyah:0 "แหล่งซ่องสุมฮาชิชได้กลายเป็นบ้านแห่งความเกียจคร้านที่เจริญรุ่งเรือง"
 ep2_wedding_ewan.0052.desc.rakish:0 "ซ่องโสเภณีเล็กๆ ได้เติบโตขึ้นเป็นบ่อแห่งความสุขที่ดิ้นรน"
 ep2_wedding_ewan.0052.desc.reclusive:0 "คฤหาสน์ส่วนตัวนั้น น่าขันที่มีชื่อเสียงอย่างเงียบๆ — แม้ แต่ขุนนางที่มีชื่อเสียงที่สุดก็ดูเหมือนจะสามารถหายตัวไปที่นั่นได้สักพัก"
 ep2_wedding_ewan.0052.desc.flagellant:0 "ทุ่งเสาเฆี่ยนตีได้กลายเป็นนิคมแห่งความเจ็บปวดที่ชำระล้างและเสริมสร้าง ซึ่งเห็นได้ชัดว่ามีความน่าดึงดูดใจอย่างน่าประหลาดใจ"
 ep2_wedding_ewan.0052.desc.profligate:0 "จดหมาย #EMP ยังคง#! ล้มเหลวในการอธิบายว่าธุรกิจของเราคืออะไร #EMP จริงๆ#! แต่สิ่งสำคัญคือดูเหมือนว่าจะมีกำไร"
 ep2_wedding_ewan.0052.desc.journaller:0 "ห้องคัดลอกเอกสารได้เติบโตพอที่จะรับงานจากผู้อุปถัมภ์ที่ร่ำรวยเป็นประจำ"
 ep2_wedding_ewan.0052.desc.athletic:0 "โรงยิมได้รับความนิยมอย่างล้นหลามจากขุนนางชั้นผู้น้อย อัศวินพเนจร และ... #EMP นักพเนจร#! ที่ร่ำรวย กำลังมองหาสภาพแวดล้อมในการซ้อมรบและฝึกฝนโดยไม่ต้องมีนิคมของตนเอง"
 ep2_wedding_ewan.0052.desc.outro:0 "\n\nหลังจากได้รับผลตอบแทนที่ดีจากเงินของเรา [dolt.GetFirstNameNoTooltip] ได้คืนส่วนแบ่งผลกำไรของข้าอย่างซื่อสัตย์"
 ep2_wedding_ewan.0052.desc.outro.dolt_unavailable:0 "\n\nหลังจากได้รับผลตอบแทนที่ดีจากเงินของเรา ผู้ดูแลที่ดูแลการดำเนินงานได้คืนส่วนแบ่งผลกำไรของข้าอย่างซื่อสัตย์"
 ep2_wedding_ewan.0052.a:0 "ข้าคิดว่าข้าจะชดใช้ #EMP ทั้งหมด#! ของการลงทุนของข้า"
 ep2_wedding_ewan.0052.b:0 "แน่นอน ท้ายที่สุดแล้ว ข้าเป็นอัจฉริยะทางธุรกิจ"
 ep2_wedding_ewan.0052.c:0 "ความประหลาดใจที่น่ายินดีอย่างไม่คาดคิด!"

 ep2_wedding_ewan.0053.t:0 "ธุรกิจที่ยังไม่เสร็จสิ้น: ขาดทุน"
 ep2_wedding_ewan.0053.desc.intro:0 "$ep2_wedding_ewan.0052.desc.intro$"
 ep2_wedding_ewan.0053.desc.dolt_availability.dead:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.dead$"
 ep2_wedding_ewan.0053.desc.dolt_availability.imprisoned:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned$"
 ep2_wedding_ewan.0053.desc.dolt_availability.free:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.free$"
 ep2_wedding_ewan.0053.desc.midtro:0 "\n\nน่าประหลาดใจ จดหมายนิรนามฉบับหนึ่งมาถึงเมื่อเช้านี้ แจ้งให้ข้าทราบถึงการทำลายล้างครั้งสุดท้ายของกิจการของเราในเหตุเพลิงไหม้ที่น่าเศร้า"
 ep2_wedding_ewan.0053.desc.drunkard:0 "ดูเหมือนว่าชื่อเสียงที่ไม่ดีของผับจะแย่ลงเรื่อยๆ นำไปสู่ลูกค้าที่ไม่ดี และในที่สุด ชาวบ้านนิรนามบางคนก็จัดการเรื่องนี้ด้วยตัวเอง"
 ep2_wedding_ewan.0053.desc.hashishiyah:0 "แหล่งซ่องสุมฮาชิชล้มเหลวในการดึงดูดลูกค้าใหม่ และในที่สุดก็ยอมจำนนต่อเปลวไฟเมื่อมีคนทำตะเกียงล้มและไม่สังเกตเห็นเป็นเวลาหลายนาที"
 ep2_wedding_ewan.0053.desc.rakish:0 "ซ่องโสเภณีเล็กๆ ทำได้ดีอยู่พักหนึ่ง จนกระทั่งตกเป็นเหยื่อของสิ่งที่สามารถอธิบายได้ว่าเป็นโรคติดต่อทางเพศสัมพันธ์ชนิดใหม่ที่ร้ายแรงอย่างน่าสะพรึงกลัว เปลวไฟเป็นทางเลือกเดียวที่จะชำระล้างมัน"
 ep2_wedding_ewan.0053.desc.reclusive:0 "หลังจากล้มเหลวในการดึงดูดความสนใจอย่างมีนัยสำคัญ ตำแหน่งที่แน่นอนของคฤหาสน์ส่วนตัวนั้น น่าขันที่หายไป มีเพียงเหตุเพลิงไหม้โดยบังเอิญโดยกลุ่มโจรป่าที่ตั้งรกรากอยู่เท่านั้นที่ย้ายซากปรักหักพังของมัน"
 ep2_wedding_ewan.0053.desc.flagellant:0 "ตลาดที่คาดการณ์ไว้สำหรับผู้ที่ต้องการความสมหวังทางจิตวิญญาณผ่านความเจ็บปวดชำระล้างไม่เคยเกิดขึ้นจริง และทุ่งเสาเฆี่ยนตีก็กลายเป็นทุ่งฟืนราคาถูก ไม่เคยมีคนบาปเพียงพอเมื่อท่านต้องการพวกเขาในทุกวันนี้"
 ep2_wedding_ewan.0053.desc.profligate:0 "สิ่งที่ถูกเผาทำลาย ที่ไหน หรืออย่างไรนั้นลึกลับพอๆ กับข้อเสนอเริ่มต้น มีเพียงควัน เถ้าถ่าน และความสับสนเท่านั้นที่เหลืออยู่"
 ep2_wedding_ewan.0053.desc.journaller:0 "แม้จะมีค่าจ้างมากมาย แต่ก็พิสูจน์แล้วว่าเป็นไปไม่ได้ที่จะหาผู้คัดลอกที่มีทักษะและรู้หนังสือที่เต็มใจที่จะทำงานหนักผ่านบันทึกประจำวันที่รวบรวมไว้ของ [dolt.GetFirstNamePossessive] ห้องคัดลอกเอกสารไม่เคยเกิดขึ้นจริง"
 ep2_wedding_ewan.0053.desc.athletic:0 "ดูเหมือนว่าคนส่วนใหญ่ที่ต้องการฝึกร่างกายก็กำลังมองหาเรื่องทะเลาะกับคนอื่นที่ทำ เช่นเดียวกัน หลังจากการดวลที่กลายเป็นการฆาตกรรมหลายครั้ง โรงยิมก็ยอมจำนนต่อการจลาจลที่ทำลายอาคารราบเป็นหน้ากลอง"
 ep2_wedding_ewan.0053.desc.outro:0 "\n\nข้าไม่น่าให้ทุนสนับสนุนคนโง่เง่า เช่น [dolt.GetFirstNameNoTooltip] เลย"
 ep2_wedding_ewan.0053.a.alive:0 "กร๊าซซ ข้าต้องการให้คนโง่นั่นถูกล่ามโซ่!"
 ep2_wedding_ewan.0053.a.dead:0 "น่าเสียดายที่ [dolt.GetSheHe] ตายเกินกว่าจะบีบคอได้"
 ep2_wedding_ewan.0053.b:0 "นี่คงเป็นสิ่งที่คาดการณ์ไว้แล้ว"

 ep2_wedding_ewan.0061.t:0 "ถึง [oldling.Custom2('RelationToMeShort', relative )|U] สุดที่รักของข้า!"
 ep2_wedding_ewan.0061.desc.intro:0 "แม้จะมีงานรื่นเริง แต่สีหน้าสยดสยองอย่างแท้จริงก็ปรากฏขึ้นอย่างรวดเร็วบนใบหน้าของ [relative.GetTitledFirstName] ขณะที่ [relative.Custom2('RelationToMeShort', oldling )] ของ [relative.GetHerHis] [oldling.GetTitledFirstName] เริ่มยืนขึ้นอย่างสั่นเทา — ถ้วยอยู่ในมือ\n\n"
 ep2_wedding_ewan.0061.desc.arrogant:0 "[oldling.GetFirstNameNoTooltip] ซึ่งเป็นที่รู้จักในฐานะคนขี้โม้และขี้อวด เริ่มต้นการพูดจาเสียดสีที่ยืดยาวเกี่ยวกับบทบาทที่ [oldling.GetSheHe] มีในการเลี้ยงดู [relative.Custom('GetBrideGroom')] เต็มไปด้วยเรื่องน่าอายในวัยเด็กและเรื่องตลกที่น่าอึดอัดใจ"
 ep2_wedding_ewan.0061.desc.honest:0 "คนส่วนใหญ่จะถือว่าชื่อเสียงด้านความซื่อสัตย์ของ [oldling.GetFirstNamePossessiveNoTooltip] เป็นพร แต่ที่นี่กลับพิสูจน์ได้ว่า... เข้าใจผิด โดย [oldling.GetWomanMan] ชราผู้มีเจตนาดีเล่าเรื่องราวที่น่าอายที่สุดจากวัยเด็กของ [relative.Custom('GetBrideGroom')] อย่างโหยหา"
 ep2_wedding_ewan.0061.desc.deceitful:0 "เป็นนักเล่านิทานในยามที่ดีที่สุด สุนทรพจน์ของ [oldling.GetFirstNamePossessiveNoTooltip] เกี่ยวกับวัยเด็กของ [relative.Custom('GetBrideGroom')] นั้น ไม่ถูกต้องอย่าง #EMP น่าอื้อฉาว#! เล็กน้อย ตอนเกี่ยวกับลาดูเหมือนจะไม่จำเป็นเป็นพิเศษ"
 ep2_wedding_ewan.0061.desc.gregarious:0 "ชอบงานเลี้ยงในวัยเยาว์ของ [oldling.GetHerHis] สุนทรพจน์ของ [oldling.GetFirstNamePossessiveNoTooltip] เป็นรายการเรื่องเล็กๆ น้อยๆ ที่เชื่อมโยงกันและวกวนเกือบจะไม่มีที่สิ้นสุด โดยมีเพียงเรื่องที่น่าอายที่สุดเท่านั้นที่เกี่ยวข้องกับ [relative.Custom('GetBrideGroom')]"
 ep2_wedding_ewan.0061.desc.ambitious:0 "โดดเด่นด้วยแรงผลักดันและความทะเยอทะยานของ [oldling.GetHerHis] เสมอ สุนทรพจน์ของ [oldling.GetFirstNamePossessiveNoTooltip] ทำให้แน่ใจว่าได้ให้เครดิตแก่ [oldling.GetHerselfHimself] อย่างเพียงพอสำหรับการเลี้ยงดูที่ประสบความสำเร็จ ซึ่งนำ [relative.Custom('GetBrideGroom')] มาถึงจุดนี้ แม้จะมีวัยเด็กที่น่าอึดอัดใจ (และเห็นได้ชัดว่าเต็มไปด้วยสิว)"
 ep2_wedding_ewan.0061.desc.diplomat:0 "เป็นที่รู้จักในด้านลิ้นเงินของ [oldling.GetHerHis] เห็นได้ชัดว่า [oldling.GetFirstNameNoTooltip] ไม่สามารถต้านทานโอกาสที่จะเล่าเรื่องราวชีวิตในวัยเด็กของ [relative.Custom('GetBrideGroom')] และบทเรียนมากมายที่ [oldling.GetSheHe] พยายามสอน [relative.GetHerHim] ได้ โดยทั่วไปแล้วไม่ประสบความสำเร็จ ตามคำบอกเล่าของ [oldling.GetHerHim]"
 ep2_wedding_ewan.0061.desc.poet:0 "ในชะตากรรมที่เลวร้ายยิ่งกว่าความตายสำหรับผู้ชมในวงกว้าง ดูเหมือนว่า [oldling.GetFirstNameNoTooltip] ได้ [oldling.GetHerselfHimself] แต่งบทกวีที่ยาวและแข็งทื่อเกี่ยวกับช่วงเวลาวัยเด็กที่... น่ารักน่าเอ็นดูที่สุดของ [relative.Custom('GetBrideGroom')]"
 ep2_wedding_ewan.0061.desc.sadistic:0 "ด้วยสิ่งที่สามารถเป็นได้เพียงความอาฆาตพยาบาทอย่างแท้จริงที่เขียนไว้ [oldling.Custom('MaskFace_BehindAcross')] [oldling.Custom('MaskFace')] ของ [oldling.GetHerHis] [oldling.GetFirstNameNoTooltip] เริ่มต้นการบรรยายที่ละเอียด #EMP อย่างทรมาน#! เกี่ยวกับวัยเด็กของ [relative.Custom('GetBrideGroom')] เรื่องเล็กๆ น้อยๆ ส่วนตัวมีมากมายและตรงไปตรงมา"
 ep2_wedding_ewan.0061.desc.drunkard:0 "โซเซในที่ที่ [oldling.GetSheHe] ยืนอยู่ [oldling.GetFirstNameNoTooltip] เริ่มพูดจาไม่ชัดถึงความทรงจำที่เลือนลางของ [oldling.GetHerHis] เกี่ยวกับวัยเด็กของ [relative.Custom('GetBrideGroom')] ความประทับใจอาจจะมากไปหน่อย แต่ก็ ทำให้การแสดงมีชีวิตชีวาอย่างแน่นอน"
 ep2_wedding_ewan.0061.desc.hashishiyah:0 "ในช่วงเวลาที่น่าอึดอัดใจ [oldling.GetFirstNameNoTooltip] ดูเหมือนจะลืมไปว่าทำไม [oldling.GetSheHe] ถึงยืนขึ้น กระพริบตาผ่านดวงตาที่แดงก่ำ จากนั้น บางอย่างก็เข้าที่ และการบรรยายเกี่ยวกับวัยเด็กของ [relative.Custom('GetBrideGroom')] ที่อย่างน้อยครึ่งหนึ่งเป็นการหัวเราะคิกคักก็เริ่มขึ้น"
 ep2_wedding_ewan.0061.desc.skill.diplomacy:0 "พูดเก่งเสมอ [oldling.GetFirstNameNoTooltip] เห็นได้ชัดว่ารอคอยสิ่งนี้: สุนทรพจน์ของ [oldling.GetHerHis] ลดลงอย่างรวดเร็วกลายเป็นการเปรียบเทียบที่ซับซ้อนสำหรับชีวิตของ [relative.Custom('GetBrideGroom')] ซึ่งบางทีอาจจะน้อยกว่าการอุปถัมภ์ที่ประจบประแจงเล็กน้อย"
 ep2_wedding_ewan.0061.desc.skill.learning:0 "เป็น [relative.GetWomanMan] ที่มีการศึกษา สุนทรพจน์ของ [oldling.GetFirstNamePossessiveNoTooltip] เป็นความยุ่งเหยิงของการอ้างอิงทางวรรณกรรมและเรื่องตลกเชิงปรัชญาชั้นสูง เพียง แต่หยุดเป็นครั้งคราวสำหรับเรื่องเล็กๆ น้อยๆ ที่น่าอายจากวัยเด็กของ [relative.Custom('GetBrideGroom')]"
 ep2_wedding_ewan.0061.desc.old:0 "ไม่ค่อยกระฉับกระเฉงนักสำหรับอายุของ [oldling.GetHerHis] สุนทรพจน์ของ [oldling.GetFirstNamePossessiveNoTooltip] เป็นการพูดพล่ามที่วกวนของช่วงเวลาวัยเด็กที่น่าอับอายที่สุดของ [relative.Custom('GetBrideGroom')] และสิ่งต่างๆ #EMP เคย#! ดีกว่ามากแค่ไหนในตอนนั้น"
 ep2_wedding_ewan.0061.desc.very_old:0 "เป็น [oldling.GetWomanMan] ที่แก่มาก [oldling.GetFirstNameNoTooltip] มีเรื่องเล็กๆ น้อยๆ #EMP มากมาย#! เกี่ยวกับ [relative.Custom('GetBrideGroom')] ที่จะนำออกมา และนั่นคือสิ่งที่ [oldling.GetSheHe] ทำโดยพื้นฐานแล้ว ไม่ค่อยมีความเชื่อมโยงกันมากนัก เป็นเพียงกระแสความทรงจำในวัยเด็กและเรื่องตลกในครอบครัว"
 ep2_wedding_ewan.0061.desc.outro:0 "\n\n[relative.GetFirstNameNoTooltip] ดูเหมือน [relative.GetSheHe] อยากจะตาย"
 ep2_wedding_ewan.0061.a:0 ""ขอบใจท่าน [oldling.GetFirstNameNoTooltip] สำหรับคำกล่าวที่ #EMP ไพเราะ#! นั่น...""
 ep2_wedding_ewan.0061.b:0 "เริ่มปรบมืออย่างสุภาพเพื่อหยุด [oldling.GetHerHim]"
 ep2_wedding_ewan.0061.b.tt.success:0 "ท่านบังคับให้ [oldling.GetFirstNameNoTooltip] นั่งลง"
 ep2_wedding_ewan.0061.b.tt.failure:0 "[oldling.GetSheHe|U] ยังคงดำเนินต่อไปโดยไม่คำนึงถึง"
 ep2_wedding_ewan.0061.c:0 "ยิ้มและทนทุกข์ทรมานต่อไป"
 ep2_wedding_ewan.0061.d:0 "โห่ร้องและส่งเสียงเชียร์ให้พูดต่อ"
 ep2_wedding_ewan.0061.d.tt.crit_success:0 "[oldling.GetFirstNameNoTooltip] เริ่มต้นเรื่องราว #EMP ยาวเหยียด#!"
 ep2_wedding_ewan.0061.d.tt.success:0 "[oldling.GetFirstNameNoTooltip] มีกำลังใจขึ้น"
 ep2_wedding_ewan.0061.e:0 "กระตุ้นให้ [oldling.GetFirstNameNoTooltip] พูดต่อ"
 ep2_wedding_ewan.0061.e.tt.crit_success:0 "$ep2_wedding_ewan.0061.d.tt.crit_success$"
