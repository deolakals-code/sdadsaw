 ep2_wedding_ewan.0051.h:0 ""#EMP สถานที่พักผ่อนส่วนตัว#! ท่านว่า..."
 ep2_wedding_ewan.0051.i:0 ""#EMP ทุ่ง#! เสาเฆี่ยนตี ท่านว่า..."
 ep2_wedding_ewan.0051.i.tt.deviant:0 "ตัวเลือกนี้มีให้ เนื่องจาก [secret|E] [secret.GetName] ของท่าน"
 ep2_wedding_ewan.0051.j:0 ""และเราจะขาดทุนไม่ได้เลย? เลยเหรอ?""
