 ep2_wedding_ewan.0021.desc.t1.hate.generous:0 "$ep2_wedding_ewan.0021.desc.t1.hate.honest$"
 ep2_wedding_ewan.0021.desc.t1.hate.just:0 ""ข้าเดาว่ามันอยู่ในมาตรฐานที่ค่อนข้างสูง" [char_2.GetFirstNameNoTooltip] พูดขึ้นจมูก "ข้าแค่คาดหวังมากกว่านี้เล็กน้อย""
 ep2_wedding_ewan.0021.desc.t2.hate.ambitious:0 ""หืมม" [char_2.GetFirstNameNoTooltip] พูดอย่างฉุนเฉียว "เป็นการเสียศักยภาพที่ดีไปเปล่าๆ มีอะไรให้ดูมากมายที่นี่ ทำไม #EMP ไม่#! ทำให้มันไปไกลกว่านี้?""
 ep2_wedding_ewan.0021.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0021.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t2.hate.greedy:0 ""ค่าใช้จ่ายที่แสดงมากเกินไปที่จะเคารพ" [char_2.GetFirstNameNoTooltip] พูดพ่นลม "ไม่มากพอที่จะเพลิดเพลินอย่างแท้จริง ข้าผิดหวัง""
 ep2_wedding_ewan.0021.desc.t2.hate.wrathful:0 ""ข้าชอบมันพอสมควร" [char_2.GetFirstNameNoTooltip] พูดพ่นลม "แต่ข้าจะชอบมันมากกว่านี้มากถ้ามีมันทั้งหมดมากกว่านี้เล็กน้อย""
 ep2_wedding_ewan.0021.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0021.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0021.desc.t2.hate.stubborn:0 ""พิธีการเป็นสิ่งสำคัญ และนี่ก็ยังคงเป็นส่วนหนึ่งของพิธีการ" [char_2.GetFirstNameNoTooltip] พูดพ่นลม "มันควรจะใหญ่กว่า ดีกว่า สวยกว่า ทั้งหมดนั้น""
 ep2_wedding_ewan.0021.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0021.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0021.desc.t3.hate.content:0 ""บอกตามตรง ข้าพบว่าทั้งหมดนี้ค่อนข้างเหนื่อย" [char_2.GetFirstNameNoTooltip] คร่ำครวญ "ข้าไม่รู้ด้วยซ้ำว่าอะไรคือที่นั่งและอะไรคือประติมากรรมตก แต่ง""
 ep2_wedding_ewan.0021.desc.t3.hate.lazy:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.hate.humble:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.hate.compassionate:0 ""อืมม ข้าไม่แน่ใจ" [char_2.GetFirstNameNoTooltip] พูดขึ้นจมูก "ทั้งหมดนี้ไม่รู้สึกเหมือนเป็นการเบี่ยงเบนความสนใจจากพิธีการไปหน่อยหรือ?""
 ep2_wedding_ewan.0021.desc.t3.hate.arbitrary:0 ""มันดีจริงๆ เหรอ?" [char_2.GetFirstNameNoTooltip] คร่ำครวญ "ทั้งหมดนี้จะแพงแค่ไหนกันเชียว?""
 ep2_wedding_ewan.0021.a:0 ""บาห์ ข้าชอบความคิดเชิงบวกของ [char_1.GetFirstNamePossessiveNoTooltip] มากกว่า""
 ep2_wedding_ewan.0021.a.host:0 ""ข้าเลือกของตก แต่งหลายชิ้นด้วยตัวเอง [char_1.GetFirstNameNoTooltip]""
 ep2_wedding_ewan.0021.b:0 ""ข้าเกรงว่าท่านพูดถูก [char_2.GetFirstNameNoTooltip]""
 ep2_wedding_ewan.0021.b.host:0 ""[char_2.GetFirstNameNoTooltip] พูดถูก — มันไม่ใช่สิ่งที่ข้าคิดไว้""
 ep2_wedding_ewan.0021.c:0 "[intent_target.GetFirstNameNoTooltip] ดูเหงาเหลือเกิน..."
 ep2_wedding_ewan.0021.d:0 "อย่าเข้าไปยุ่ง"

 ep2_wedding_ewan.0031.t:0 "มื้อค่ำแห่งการสังสรรค์"
 ep2_wedding_ewan.0031.desc.intro:0 "มีผู้คนมากมายให้พบเจอในงานเหล่านี้เสมอ ใบหน้าใหม่ๆ ให้พบปะ คนรู้จักเก่าๆ ให้ทักทาย ทั้งหมดท่ามกลางความเร่งรีบและความวุ่นวายของงานเลี้ยงที่คึกคัก\n\nเพียงแค่นั่งอยู่ตรงนี้ ข้าก็เห็น"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour:0 "ผู้ปกครองเพื่อนบ้านของข้า"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal:0 "เพื่อนข้าในบังคับร่วมของข้า"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal:0 "ข้าในบังคับผู้สวามิภักดิ์ของข้า"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege:0 "เจ้าเหนือหัวโดยตรงของข้า"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler:0 "ผู้ปกครองต่างแดน,"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_backup:0 "[char_1.GetLadyLord] ผู้มีชื่อเสียง,"
 ep2_wedding_ewan.0031.desc.midro:0 "[char_1.GetTitledFirstName] ดูเหมือนต้องการเพื่อนคุยที่ดีกว่านี้เล็กน้อย และ"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_neighbour:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_covassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_vassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_liege:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_other_ruler:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_backup:0 "[char_2.GetLadyLord] ผู้มีชื่อเสียง,"
 ep2_wedding_ewan.0031.desc.outro:0 "[char_2.GetTitledFirstName] อยู่ในอารมณ์ดีและร่าเริง\n\nคนใดคนหนึ่งก็น่าสนใจที่จะทำความรู้จักให้ดีขึ้นเล็กน้อย และตอนนี้ #EMP ก็#! เป็นเวลาสำหรับการผจญภัยทางสังคม..."
 ep2_wedding_ewan.0031.a:0 ""[conversationalist_neighbour.GetFirstNameNoTooltip] ดีใจที่ได้พบท่าน!""
 ep2_wedding_ewan.0031.b:0 ""อาา [conversationalist_covassal.GetFirstNameNoTooltip] ข้าดีใจที่ท่านมา...""
 ep2_wedding_ewan.0031.c:0 ""ยินดีเสมอ [conversationalist_vassal.GetFirstNameNoTooltip]""
 ep2_wedding_ewan.0031.d:0 ""[conversationalist_liege.GetLadyLord|U] [conversationalist_liege.GetFirstNameNoTooltip] ท่านให้เกียรติเรา!""
 ep2_wedding_ewan.0031.e:0 ""[conversationalist_other_ruler.GetFirstNameNoTooltip] ไม่คาดคิดว่าจะได้พบท่านที่นี่""
 ep2_wedding_ewan.0031.f:0 ""[conversationalist_backup.GetFirstNameNoTooltip] ท่านสบายดีหรือ?""
 ep2_wedding_ewan.0031.g:0 "มีงานเลี้ยงอยู่! ทำไมต้องสนใจแค่บทสนทนาเดียว?"
 ep2_wedding_ewan.0031.h:0 "เอ่อ มีคนอื่นที่ข้าอยากคุยด้วยมากกว่า"

 ep2_wedding_ewan.0041.t:0 "กล่าวสุนทรพจน์! กล่าวสุนทรพจน์!"
 ep2_wedding_ewan.0041.desc.intro:0 "งานเลี้ยง แต่งงานทุกงานเป็นเจ้าภาพการกล่าวสุนทรพจน์จำนวนมากที่ #EMP ยืดยาว#! อย่างแท้จริง บางครั้งยาว บางครั้งสั้น บางครั้งจริงใจ บางครั้งหลอกลวง วนเวียนไปมาทั่วห้องโถง คั่นอาหาร แต่ละคอร์สของงานเลี้ยงเป็นระลอก\n\nเมื่อใกล้ถึงตาของข้า ข้าก็สงสัย — ข้าควรพิจารณาคู่บ่าวสาว หรือ"
 ep2_wedding_ewan.0041.desc.murder:0 "เยาะเย้ยเหยื่อในอนาคตของข้า [intent_target.GetFirstNameNoTooltip] สักหน่อย?"
 ep2_wedding_ewan.0041.desc.seduce:0 "บางทีอาจจะแค่เกี้ยวพาราสีผู้พิชิตในอนาคตของข้า [intent_target.GetFirstNameNoTooltip]?"
 ep2_wedding_ewan.0041.desc.diplomacy:0 "แค่พยายามดึงดูดความสนใจด้วยคารมคมคายของข้า?"
 ep2_wedding_ewan.0041.desc.matchmaking:0 "กล่าวคำชื่นชมสักสองสามคำแก่ [intent_target.GetFirstNameNoTooltip]?"
 ep2_wedding_ewan.0041.desc.mischief:0 "พยายามสร้างความตื่นเต้นเล็กน้อย?"
 ep2_wedding_ewan.0041.desc.recreation:0 "มุ่งเน้นไปที่งานรื่นเริง?"
 ep2_wedding_ewan.0041.desc.outro:0 "\n\nท้ายที่สุดแล้ว มันง่ายที่ความหมายสองแง่สองง่ามจะหายไปสำหรับคนส่วนใหญ่ในทะเลคำพูดนี้..."
 ep2_wedding_ewan.0041.a:0 "สรรเสริญคู่บ่าวสาวตามที่คาดหวัง"
 ep2_wedding_ewan.0041.b:0 "สรรเสริญงานเลี้ยง"
 ep2_wedding_ewan.0041.c:0 "ข่มขู่ [intent_target.GetFirstNameNoTooltip] โดยนัย"
 ep2_wedding_ewan.0041.d:0 "ชี้นำสุนทรพจน์ไปทาง [intent_target.GetFirstNameNoTooltip] อย่างแนบเนียน"
 ep2_wedding_ewan.0041.d.tt.success:0 "[intent_target.GetFirstNameNoTooltip] ชื่นชมคำใบ้"
 ep2_wedding_ewan.0041.d.tt.failure:0 "[intent_target.GetSheHe|U] อับอายอย่างเหลือเชื่อ"
 ep2_wedding_ewan.0041.e:0 "แสดงทักษะการพูดของท่าน"
 ep2_wedding_ewan.0041.e.tt.success:0 "สุนทรพจน์ที่ยอดเยี่ยม"
 ep2_wedding_ewan.0041.e.tt.failure:0 "สุนทรพจน์ที่พอใช้ได้"
 ep2_wedding_ewan.0041.f:0 "กล่าวถึงคุณสมบัติที่ดีของ [intent_target.GetFirstNamePossessiveNoTooltip]"
 ep2_wedding_ewan.0041.g:0 "บอกใบ้ถึงความจริงที่อาจผิดกฎหมายเล็กน้อย"
 ep2_wedding_ewan.0041.g.tt.success:0 "นั่น... นั่นเรื่องจริงหรือ?"
 ep2_wedding_ewan.0041.g.tt.failure:0 "ช่างเป็นคำโกหกที่เห็นได้ชัดว่าน่ารังเกียจ"
 ep2_wedding_ewan.0041.h:0 "นั่งลงอย่างเงอะงะโดยไม่พูดอะไร"
 ep2_wedding_ewan.0041.i:0 "พูดอะไรหวานๆ แต่เป็นไปตามหน้าที่"

 ep2_wedding_ewan.0051.t:0 "และอีกเรื่องหนึ่ง"
 ep2_wedding_ewan.0051.desc.intro:0 "ทุกงานเลี้ยง ต้องมีเสมอ — ทุกๆ งานเลี้ยง ต้องมีคนพูดมาก น่ารำคาญ เกิดมาต่ำต้อย ต้อนคนเข้ามุมที่ไม่ยอม #EMP เงียบ#! สักที\n\nคราวนี้เป็น [dolt.GetFirstName] และ [dolt.GetSheHe] กำลัง"
 ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch:0 "พยายามอย่างยิ่งที่จะให้ข้าลงทุน 'ทรัพยากรอันมากมายในฐานะ [ROOT.Char.GetLadyLord]-[ROOT.Char.GetTitleAsNameNoTooltip] ผู้สูงศักดิ์' ของข้าใน [dolt.GetHerHis]"
 ep2_wedding_ewan.0051.desc.drunkard:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ การซื้อสิ่งที่เห็นได้ชัดว่าเป็นสถานประกอบการดื่มกินแบบชนบทที่ #EMP มีเสน่ห์#!"
 ep2_wedding_ewan.0051.desc.hashishiyah:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ การซื้อแหล่งซ่องสุมเค้กฮาชิชที่ถูกกล่าวหาอย่างไม่เป็นธรรม"
 ep2_wedding_ewan.0051.desc.rakish:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ การซื้อซ่องโสเภณีที่มีพนักงานที่สวยที่สุดจากสุดขอบโลก"
 ep2_wedding_ewan.0051.desc.reclusive:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ แผนการระดมทุนสร้างคฤหาสน์ที่แทบจะเข้าไม่ถึง สามารถมอบความสันโดษให้กับขุนนางที่มีชื่อเสียงที่สุดได้"
 ep2_wedding_ewan.0051.desc.flagellant:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ แผนการสำหรับ... #EMP ทุ่ง#! เสาเฆี่ยนตี ที่สามารถส่งผ่านความเจ็บปวดชำระล้างร่วมกันของผู้สำนึกผิดหลายสิบคน"
 ep2_wedding_ewan.0051.desc.profligate:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ แผนการที่อธิบายได้ไม่ดีนักเพื่อ... ข้า... ข้าประมวลผลไม่ได้ด้วยซ้ำว่า [dolt.GetSheHe] ต้องการเงินไปทำอะไร"
 ep2_wedding_ewan.0051.desc.journaller:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ การก่อตั้งห้องคัดลอกเอกสาร ซึ่งเห็นได้ชัดว่าจะประกอบด้วยผลงานของ #EMP [dolt.GetHerHis]#! เป็นส่วนใหญ่ อย่างน้อยก็ในตอนแรก"
 ep2_wedding_ewan.0051.desc.athletic:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ แนวคิดสำหรับโรงยิมสาธารณะรูปแบบใหม่ ซึ่งเน้นการฝึกสมรรถภาพทุกประเภทตลอดช่วงการออกกำลังกาย"
 ep2_wedding_ewan.0051.desc.diligent:0 "หมกมุ่นอยู่กับงานประจำวันอย่างแท้จริง [dolt.GetWomanMan] ดูเหมือนจะไม่รู้เลยว่าจะพูดคุยเกี่ยวกับเรื่องอื่นนอกเหนือจากงานที่น่าเบื่อที่สุดได้อย่างไร หรือแม้ แต่ตระหนักว่าไม่ใช่ทุกคนที่สนใจชีวิตที่น่าเบื่อและไร้ความสุขของ [dolt.GetHerHis]"
 ep2_wedding_ewan.0051.desc.patient:0 "ไม่ลดละ ข้าได้ลองทุกหัวข้อที่ข้าคิดได้ ข้าได้ลองถอนตัว ข้าได้ลองให้คนอื่นเข้ามาเกี่ยวข้อง แต่ [dolt.GetSheHe] ดูเหมือนจะมุ่งมั่นที่จะตามล่าข้าด้วยความไม่ลดละอันน่าสะพรึงกลัว"
 ep2_wedding_ewan.0051.desc.impatient:0 "ไม่มีความอดทนกับเรื่องใดๆ ทันทีที่ข้าพยายามมีส่วนร่วมในหัวข้อหนึ่ง เราก็ไปหัวข้อถัดไป โดยไม่มีความเชื่อมโยงใดๆ ระหว่างกัน เป็นเพียงการระดมความคิดที่ไม่ต่อเนื่องชั่วนิรันดร์ ตลอดไป"
 ep2_wedding_ewan.0051.desc.arrogant:0 "หลงตัวเองอย่างสมบูรณ์และน่าสังเวช บทสนทนาของเราเต็มไปด้วยความหน้าซื่อใจคด ความคิดที่ไม่รอบคอบ และความโง่เขลาธรรมดาๆ แต่ [dolt.GetWomanMan] ก็เชื่อมั่นอย่างเต็มที่ว่า [dolt.GetSheHe] เป็นอัจฉริยะทางสังคมที่น่าทึ่ง"
 ep2_wedding_ewan.0051.desc.arbitrary:0 "สับสนอย่างลึกซึ้ง คำพูดของ [dolt.GetHerHis|U] เห็นได้ชัดว่าสมเหตุสมผลสำหรับ #EMP [dolt.GetHerHim]#! แต่สำหรับข้าแล้วมันฟังดูแทบจะไม่เกี่ยวข้องกันเลย? เป็นเวลาครึ่งชั่วโมงแล้วที่พยายามคิดว่าส่วนของข้าในบทสนทนานี้คืออะไร"
 ep2_wedding_ewan.0051.desc.zealous:0 "พูดพร่ำเพรื่อไปเรื่อยๆ และเรื่อยๆ และ #EMP เรื่อยๆ#! เกี่ยวกับความผูกพันส่วนตัวของ [dolt.GetHerHis] กับศรัทธาของ [dolt.GetHerHis] และวิธีที่ข้าควรพยายามปล่อยให้แสงสว่างที่แท้จริงของ [dolt.GetFaith.random_GoodGodNames] เข้ามาในใจข้า [dolt.GetSheHe|U] ไม่ได้ถามคำถามเดียวเกี่ยวกับความเชื่อ #EMP ของข้า#!"
 ep2_wedding_ewan.0051.desc.fickle:0 "ทั้งมุ่งมั่นที่จะเสนอแผนการให้ข้าและไม่เต็มใจที่จะยึดมั่นในแนวคิดเดียวโดยสิ้นเชิง แต่กลับเป็นการเดินขบวนที่ไม่รู้จบของอาเจียนทางวาจาที่ครึ่งๆ กลางๆ ซึ่งค่อยๆ กลืนกินความปรารถนาที่จะมีชีวิตอยู่ของข้า"
 ep2_wedding_ewan.0051.desc.vengeful:0 "หมกมุ่นอยู่กับการลงโทษอย่างรุนแรงต่อคู่แข่งที่น่าสงสารและไร้ชื่อบางคนสำหรับการดูถูกที่รับรู้ได้ ทำไมข้าถึงจำเป็นสำหรับการวางแผนที่บ้าคลั่งนี้ ข้าไม่รู้เลย"
 # My continued apologies for the poetry randomiser.
 ep2_wedding_ewan.0051.desc.poet:0 "สิ่งที่ชั่วร้ายที่สุด: กวีที่ไม่ดีพร้อมผู้ชมที่ถูกจับเป็นเชลย บทกวีที่ [dolt.GetSheHe] กำลัง 'ลองใช้' กับข้าไม่ใช่บทกวีด้วยซ้ำ เป็นเพียงบทกวีคู่ที่แทบจะไม่คล้องจองกันโดยไม่มีสัมผัสหรือฉันทลักษณ์"
 ep2_wedding_ewan.0051.desc.outro:0 "\n\nข้าจะกรีดร้อง"
 ep2_wedding_ewan.0051.a:0 "ค่อยๆ ออกจากบทสนทนา"
 ep2_wedding_ewan.0051.a.tt.success:0 "ท่านปลีกตัวออกมาได้"
 ep2_wedding_ewan.0051.a.tt.failure:0 "มัน #EMP ไม่มีวัน#! จบสิ้น"
