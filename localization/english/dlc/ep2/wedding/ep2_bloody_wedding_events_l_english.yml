 ep2_wedding.0957.desc_ending:0 "\n\nดวงตาของข้าเต็มไปด้วยน้ำตาจากการสูญเสีย[spouse_2.GetHerHis] แต่ในใจของข้ามีเพียงความเกลียดชัง\n\nข้าจะแก้แค้น ไม่ทางใดก็ทางหนึ่ง"
