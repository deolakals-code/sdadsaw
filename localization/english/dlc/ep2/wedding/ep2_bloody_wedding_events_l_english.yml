 ep2_wedding.0204.desc.intro:0 "บทสนทนาอันร่าเริงของข้าสิ้นสุดลงอย่างกะทันหันเมื่อ"
 ep2_wedding.0204.desc.family.non_spouse:0 "ข้าเห็นกลุ่มทหารรับจ้างเดินตรงมาทางเรา #EMP ชู่ว์#! ดาบถูกชักออกมา รอยยิ้มของพวกเขาบ่งบอกถึงโศกนาฏกรรมของเรา\n\n"บอกลาครอบครัวของเจ้าเสีย [spouse_2.GetTitledFirstName]""
 ep2_wedding.0204.desc.family:0 "$ep2_wedding.0204.desc.family.non_spouse$ พวกเขากล่าว ก่อนจะจ่อดาบเข้าที่คอของข้าเอง"
 ep2_wedding.0204.desc.solo:0 "ข้าราชสำนักคนหนึ่งหัวเราะมากเกินไป แปลกเกินไป ข้ามองไปที่[mercenary_1.GetHerHim]และเห็นว่า[mercenary_1.GetSheHe]กำลังจ่อมีดเข้าที่หน้าอกของข้า "ขอให้ท่านโชคดี""
