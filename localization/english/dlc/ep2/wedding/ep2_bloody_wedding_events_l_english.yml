 ep2_wedding.0956.desc:0 "$ep2_wedding_departure_intro$\n\n[host.GetTitledFirstName]เข้ามาหาข้า เสียงของ[host.GetHerHis]ยังคงเต็มไปด้วยความโศกเศร้า: "หัวใจของข้าหนักอึ้งกับการสูญเสีย[spouse_2.GetTitledFirstName] ข้าขออภัยสำหรับการเฉลิมฉลองอันเลวร้ายนี้""
 ep2_wedding.0956.a:0 "ข้าแค่ดีใจที่ไม่ใช่ข้า"
