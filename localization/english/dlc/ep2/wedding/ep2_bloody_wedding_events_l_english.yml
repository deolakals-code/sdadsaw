l_english: 
 
 # BLOODY WEDDING 
 ep2_wedding.0101.t:0 "กระทั่งความตาย..."
 ep2_wedding.0101.desc.intro:0 "แขกเหรื่อทั้งหมดรวมตัวกันในลาน วันนี้ช่างเป็นวันที่แดดจ้าและงดงาม ข้ามองไปยัง[dummy_gender.GetWomenMen]ของข้า — ทหารองครักษ์ที่ข้าสัญญาไว้ในฐานะเจ้าภาพผู้มีเมตตา #EMP ติดอาวุธหนัก#! อีกไม่นาน การเตรียมการของข้าจะสัมฤทธิ์ผล\n\nข้าเห็น[spouse_2.GetTitledFirstName]มาถึง พร้อมกับคณะผู้ติดตามของ[spouse_2.GetHerHis]"
 ep2_wedding.0101.desc.spouse:0 ". สมรสกัน — เพียงแค่วันเดียว"
 ep2_wedding.0101.desc.bad:0 ": ตัวตนอันน่ารังเกียจ เช่นนี้ต้องถูกกำจัด"
 ep2_wedding.0101.desc.good:0 "... ข้าขออภัย ที่รักของข้า"
 ep2_wedding.0101.a:0 "สมาชิกทุกคนของตระกูล[spouse_2.GetHouse.GetNameNoTooltip]ต้องถูกกำจัดให้สิ้นซาก"
 ep2_wedding.0101.a_lowborn:0 "สมาชิกทุกคนของครอบครัวนี้ต้องถูกกำจัดให้สิ้นซาก"
 ep2_wedding.0101.b:0 "ข้าจะเอาเพียงชีวิตของ[spouse_2.GetFirstNamePossessiveNoTooltip]เท่านั้น"
 ep2_wedding.0101.c:0 "คืนวิวาห์ — โอกาสอันเหมาะเจาะ"
 ep2_wedding.0101.d:0 "ข้าทำ เช่นนี้ไม่ได้ ไม่ใช่ที่นี่ ไม่ใช่ตอนนี้"
 ep2_wedding.0101.a.tt:0 "งานวิวาห์เริ่มต้นขึ้น... และมันจะถูกจดจำไปตลอดกาล"
 ep2_wedding.0101.c.tt:0 "ทางเลือกที่เป็นส่วนตัว"
 ep2_wedding.0101.d.tt:0 "งานวิวาห์เริ่มต้นขึ้น และไม่มีอันตรายใดเกิดขึ้น"
 ep2_wedding.0200.desc.murder:0 "$ep2_wedding.0200.desc.murder_intro$"ข้าฯ ซาบซึ้งในความเมตตาของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] มันช่าง ทำให้ข้าฯ ปิติยินดียิ่งนักขอรับ""
 ep2_wedding.0200.desc.murder_intro:0 "ขณะที่แขกเหรื่อเข้าสู่ห้องโถง ข้าถ่วงเวลาตัวเอง พูดคุยกับกลุ่มผู้เข้าร่วมงานเกี่ยวกับ[ROOT.Char.Custom('my_subject_of_interest')] "ช่างเป็นเจ้าภาพที่ใจกว้างเสียจริง!" ข้าได้ยินขณะที่ข้าขอตัวไปยังโต๊ะประธาน ทหารองครักษ์ของข้าอยู่#EMPทุกหนแห่ง#! พร้อมแล้ว ขณะที่ข้านั่งลง ข้าสบตากับ[spouse_2.GetTitledFirstName]:\n\n"
 ep2_wedding.0200.desc.murder_spouse:0 "$ep2_wedding.0200.desc.murder_intro$"อีกไม่นานก็จะเหลือเพียงเรา#EMPสองคน#! ที่รักของข้า" ข้ากล่าว พลางยกจอกขึ้น"
 ep2_wedding.0200.a.murder:0 "#EMP เชิญสำราญ!#!"
 ep2_wedding.0202.t.spouse:0 "...พรากเราจากกัน"
 ep2_wedding.0202.t:0 "...พรากพวกเขาจากกัน"
 ep2_wedding.0202.desc.outro:0 "\n\nข้าส่งสัญญาณให้คนรับใช้ขณะที่ข้ากัด[ROOT.Char.Custom('GetExpensiveDessert')] [dummy_gender.GetWomenMen]ของข้าเข้าสู่ห้องโถง ปลอมตัวเป็นทหารรับจ้าง ประตูถูกล็อคและดนตรีเริ่มบรรเลง ให้การสังหารหมู่เริ่มต้นขึ้น"
 ep2_wedding.0202.desc.intro:0 "แขกเหรื่อกำลังสนทนากันมากมายจนยากที่จะติดตามได้ทั้งหมด [spouse_2.GetTitledFirstName]ถูกรายล้อมไปด้วยกลุ่มข้าราชสำนักผู้กระตือรือร้น ทุกคนต่างชมเชย ซึ่งกันและกัน ไม่ว่าสิ่งรบกวนนี้จะเป็นเรื่องบังเอิญหรือโชคชะตา ข้าก็ไม่อาจบอกได้\n\n"
 ep2_wedding.0202.desc.compassionate:0 "น่าเสียดายที่ต้องมาถึงจุดนี้ ข้าคงไม่อาจทนมองได้"
 ep2_wedding.0202.desc.paranoid:0 "ในที่สุด ศัตรูของข้าก็จะหยุดวางแผนร้ายต่อข้า — ปากของพวกเขาจะปิดสนิทตลอดไป"
 ep2_wedding.0202.desc.zealous:0 "ขอให้วิญญาณของพวกเขาได้รับการไถ่บาปใน[ROOT.Char.GetFaith.NegativeAfterLife]"
 ep2_wedding.0202.desc.sadistic:0 "ข้าแทบรอไม่ไหวที่จะเห็นพื้นหินกลายเป็นสีแดงฉานใต้ฝ่าเท้าของพวกเขา"
 ep2_wedding.0202.desc.craven:0 "ข้าเช็ดเหงื่อบนหน้าผาก #EMPแค่ก#! ก้มหน้าลง [ROOT.Char.GetFirstNameNoTooltip] อย่าให้พวกเขาสงสัย"
 ep2_wedding.0202.desc.arrogant:0 "ข้าเอนหลังพิงเก้าอี้ พยายามไม่ยิ้ม ผู้คนจะจดจำเรื่องนี้ไปอีกนานแสนนาน"
 ep2_wedding.0202.desc.lazy:0 "ข้าดีใจเหลือเกินที่ไม่ต้องลงมือเอง — การฆาตกรรมดูเหมือนจะเป็นงานที่ต้องใช้แรงมาก"
 ep2_wedding.0202.desc.just:0 "ข้าเรียกสิ่งนี้ว่าความยุติธรรม"
 ep2_wedding.0202.desc.cannibal:0 "ข้ากำลังหิวอยู่พอดี..."
 ep2_wedding.0202.desc.wrathful:0 "ขอให้หัวของพวกมันกลิ้งไปทั่วห้องโถงที่พวกมันใส่ร้ายป้ายสี!"
 ep2_wedding.0202.desc.fallback:1 "ข้าพบว่าตัวเองกำลังผิวปากอย่างไม่ใส่ใจ"
 ep2_wedding.0202.a:0 "ตระกูล[spouse_2.GetHouse.GetNameNoTooltip]สิ้นสุดลงที่นี่"
 ep2_wedding.0202.a.lowborn:0 "ตระกูลของเจ้าสิ้นสุดลงที่นี่"
 ep2_wedding.0203.t.spouse:0 "$ep2_wedding.0202.t.spouse$"
 ep2_wedding.0203.t:0 "$ep2_wedding.0202.t$"
 ep2_wedding.0203.desc.intro:0 "เมื่องานเลี้ยงใกล้จะสิ้นสุดลง บทสนทนาเริ่มเงียบหายไป และแขกเหรื่อก็ถูกแบ่งออกเป็นพวกที่เมาเกินไปหรือเหนื่อยเกินไป พวกที่ยังมีสติพอ — หรือเมาพอ — ตอนนี้รายล้อม[spouse_2.GetTitledFirstName] ในความพยายามครั้งสุดท้ายที่จะเอาใจคู่สมรส\n\n"
 ep2_wedding.0203.desc.compassionate:0 "ข้าเพียงหวังว่ามันจะรวดเร็วและไม่เจ็บปวด"
 ep2_wedding.0203.desc.paranoid:0 "ตอนนี้[spouse_2.GetSheHe]จะได้เรียนรู้! ตอนนี้[spouse_2.GetSheHe]จะได้เรียนรู้อย่างแน่นอน! #EMP ทุกคน#! จะได้เรียนรู้!"
 ep2_wedding.0203.desc.zealous:0 "นี่เป็นหนทางเดียวที่จะกำจัดวิญญาณอันเป็นพิษ เช่นนี้"
 ep2_wedding.0203.desc.sadistic:0 "ข้าเลียคมมีด ข้าอยากจะลงมือเองเสียเหลือเกิน..."
 ep2_wedding.0203.desc.cannibal:0 "ข้ามองดูผิวของ[spouse_2.GetHerHis]อย่างใกล้ชิด... ช่างเป็นอาหารอันโอชะ"
 ep2_wedding.0203.desc.craven:0 "ข้าทำไม่ได้... ข้ามองไม่ได้ มันอาจจะเลวร้ายยิ่งกว่าที่ข้าคิด!"
 ep2_wedding.0203.desc.arrogant:0 "ข้าเอนหลังพิงเก้าอี้ จิบ[ROOT.Char.Custom('RegionalDrink')]"
 ep2_wedding.0203.desc.just:0 "มันคือสิ่งที่ต้องทำ"
 ep2_wedding.0203.desc.wrathful:0 "#EMP ตัดหัว[spouse_2.GetHerHis]เสีย ตัดหัวมันซะ!#!"
 ep2_wedding.0203.desc.fallback:0 "" #ปล่อยว่างไว้โดยเจตนา
 ep2_wedding.0203.desc.outro:0 "ข้าราชสำนักคนหนึ่งหัวเราะดังกว่าที่ควรเล็กน้อย ดังกว่าปกติเล็กน้อย [my_agent.GetSheHe|U]ชักกริชออกมา และหัวใจของ[spouse_2.GetFirstNameNoTooltip]ก็เงียบลงอย่างรวดเร็ว เช่นเดียวกับแขกเหรื่อ\n\n"จับตัว[my_agent.GetHerHim]ไว้!" ข้าตะโกน ทั้งที่รู้ดีว่า[my_agent.GetSheHe]จะถูกปล่อยตัวในวันรุ่งขึ้น"
 ep2_wedding.0203.a:0 "โศกนาฏกรรม!"
 ep2_wedding.0300.desc.murder_spouse:0 "เมื่องานเลี้ยงใกล้จะสิ้นสุดลง เทียนดับลงและแขกเหรื่อได้กลับไปยังห้องพักของตน เสียงดังขึ้นอีกครั้งเมื่อถึงเวลาสำหรับคืนวิวาห์ของเรา: "ให้คู่บ่าวสาวได้เฉลิมฉลอง!"\n\nข้า#EMPรอไม่ไหว#! จริงๆ"
 ep2_wedding.3060.t:0 "ค่ำคืนที่ต้องตายเพื่อ"
 ep2_wedding.3060.desc:0 "เตียงที่ปูไว้อย่างหรูหรารอเราอยู่ ขณะที่แสงเทียนส่องกระทบใบหน้าของ[spouse_2.GetTitledFirstNamePossessive] ข้ากลั้นหายใจชั่วครู่ "มานอนกับข้าเถิด ที่รัก" [spouse_2.GetSheHe]กล่าว พลางถอดเสื้อของ[spouse_2.GetHerHis]ออก\n\nแสงจันทร์ส่องสว่างราวกับกลางวัน ข้าลูบคอของ[spouse_2.GetHerHis]ก่อนจะจูบมัน มือของข้า — หากข้าบีบให้แน่นขึ้น ทุกอย่างก็จะจบสิ้น"
 ep2_wedding.3060.a:0 ""เข้ามาใกล้ๆ สิ ที่รักยิ่งของข้า...""
 ep2_wedding.3060.a.success:0 "ท่านบีบคอ[spouse_2.GetShortUIName]"
 ep2_wedding.3060.a.failure:0 "[spouse_2.GetShortUIName]หลุดจากมือท่าน"
 ep2_wedding.3060.b:0 "ข้ารู้จักสมุนไพรบางอย่างที่จะ ทำให้[spouse_2.GetHerHim]เงียบได้ดีกว่านี้"
 ep2_wedding.3060.b.success:0 "ท่านวางยาพิษ[spouse_2.GetShortUIName]สำเร็จ"
 ep2_wedding.3060.b.failure:0 "[spouse_2.GetShortUIName]ค้นพบเจตนาของท่าน"
 ep2_wedding.3060.c:0 "การเคลื่อนไหวที่รวดเร็ว ข้ามีกริชอยู่ใต้หมอนใบนี้"
 ep2_wedding.3060.c.flavor:0 "ให้ข้าปอกผลไม้ให้ท่านนะ ที่รัก!"
 ep2_wedding.3060.c.success:0 "ท่านปาดคอ[spouse_2.GetShortUINamePossessive]"
 ep2_wedding.3060.c.failure:0 "[spouse_2.GetShortUIName]สงสัย"
 ep2_wedding.3060.d:0 "ไม่ ข้าทำไม่ได้"
 ep2_wedding.0301.t:0 "รสขมขื่นที่ตามมา"
 ep2_wedding.0301.desc.family:0 "ร่างกายนอนเกลื่อนห้อง คนรับใช้เตรียมเตียงนอนขณะพึมพำว่าใครคือฆาตกร "ข้าได้ยินมาว่าพวกเขามีศัตรูมากมาย" "ข้าได้ยินมาว่าพวกเขาไม่มีเลย""
 ep2_wedding.0301.desc.agent:0 "ทหารองครักษ์ได้นำตัวสายลับไปแล้ว แต่สีหน้าหวาดกลัวยังคงอยู่บนใบหน้าของแขกเหรื่อ แพทย์คนหนึ่งได้ก้าวออกมาเพื่อปลอบใจ แต่เห็นได้ชัดว่าไม่มีวิธีรักษาบาดแผลจากกริชที่ปักหัวใจ"
 ep2_wedding.0301.desc.wedding_night:0 "ข้าวิ่งไปตามทางเดินไปยังห้องโถงใหญ่ สวมเพียงชุดนอน ก่อนที่ข้าจะเปิดประตู ข้าใช้เวลาครู่หนึ่งเพื่อแสดงสีหน้าโศกเศร้าที่สุด #EMP "ช่วยด้วย! ช่วยด้วย!"#! ข้าร้องไห้ "มีสายลับสังหาร[spouse_2.GetTitledFirstName] ในห้องของเราเอง!""
 ep2_wedding.0301.non_spouse:0 "\n\nเสียงร่ำไห้ของ[spouse_1.GetTitledFirstNamePossessive]ดังก้องไปทั่วห้อง มือของ[spouse_1.GetHerHis|U]กุม[spouse_2.GetFirstNamePossessiveNoTooltip]ไว้อย่างแน่นหนา ไม่ยอมปล่อย"
 ep2_wedding.0301.spouse:1 "\n\n"โอ้ ที่รักของข้า โชคชะตาช่างโหดร้ายกับเราเหลือเกิน!" ข้าร้องไห้ กุมมืออันเย็นเฉียบของ[spouse_2.GetHerHis]ไว้อย่างแน่นหนา "ข้าจะตามหาคนที่ทำ เช่นนี้กับเจ้า และ#EMPกำจัด#! มันเสีย""
 ep2_wedding.0301.spouse_wnight:0 "\n\nความเงียบเข้าปกคลุม ทหารองครักษ์ของข้าเริ่มวิ่งไปยังห้องนอน และข้าซบหน้าลงกับมือ"
 ep2_wedding.0301.a:0 "โชคชะตาอันโหดร้าย โหดร้ายเหลือเกิน"
 ep2_wedding.0302.t:0 "ความโศกเศร้ามาเยือน"
 ep2_wedding.0302.desc.family:0 "เสียงดนตรีขัดจังหวะบทสนทนาอันน่ารักของข้าเกี่ยวกับ[ROOT.Char.Custom('my_subject_of_interest')]กับแขกบางคน ข้าหันไปมองนักแสดง และสายตาของข้าก็สบกับใครบางคนโดยไม่คาดคิด กลุ่มทหารรับจ้างกำลังเดินตรงมายัง[spouse_2.GetTitledFirstName]และครอบครัวของ[spouse_2.GetHerHim]\n\nดาบถูกชักออกมา #EMP "ไม่! ไม่นะ ได้โปรด! ไม่!"#!\n\nร่างล้มลงบนพื้นพร้อมเสียงแหบแห้ง"
 ep2_wedding.0302.desc.agent:0 "เสียงร้องอันแหลมคมขัดจังหวะบทสนทนาอันน่ารักของข้าเกี่ยวกับ[ROOT.Char.Custom('my_subject_of_interest')]กับแขกบางคน #EMP "ไม่!"#! ข้าหันไปเห็น[spouse_2.GetTitledFirstName] พร้อมกริชปักอยู่กลางใจของ[spouse_2.GetHerHis]\n\nทหารองครักษ์รีบพุ่งเข้าหาฆาตกร "จับมัน จับมันไว้!" ข้าได้ยิน[host.GetTitledFirstName]ตะโกน\n\n"
 ep2_wedding.0302.desc.wedding_night:0 "ประตูห้องโถงใหญ่เปิดออกอย่างกะทันหัน และ[spouse_1.GetTitledFirstName]ยืนอยู่ตรงกลาง — หายใจหอบ มือของ[spouse_1.GetHerHis]กุมกรอบประตูไม้อย่างแน่นหนา "ช่วยด้วย... ช่วยด้วย!" [spouse_1.GetSheHe]ร้องไห้ "มีสายลับสังหาร[spouse_2.GetTitledFirstName] ในห้องของเราเอง!"\n\nห้องทั้งห้องเงียบสงัด"
 ep2_wedding.0302.spouse:0 "ข้ารีบเข้าไปหา[spouse_2.GetFirstNameNoTooltip]และกุมมือของ[spouse_2.GetHerHis]ไว้ ยังคงอุ่น "ไม่... หัวใจของข้า... ไม่เร็วขนาดนี้..."
 ep2_wedding.0302.good:0 "[spouse_2.GetFirstNameNoTooltip]ที่รักของข้า... จากไป เช่นนี้"
 ep2_wedding.0302.bad:0 "ข้าไม่ควรพูดว่า[spouse_2.GetSheHe]สมควรได้รับมัน แต่..."
 ep2_wedding.0302.sadistic:0 "ข้าละสายตาจากเลือดไม่ได้... ช่างเป็นงานที่ยอดเยี่ยม"
 ep2_wedding.0302.indifferent:0 "ข้าไม่รู้จัก[spouse_2.GetFirstNameNoTooltip]ดีนัก แต่ไม่มีใครสมควรได้รับชะตากรรม เช่นนี้"
 ep2_wedding.0302.a:0 "โศกนาฏกรรม"
 ep2_wedding.0955.t:0 "รุ่งอรุณสีเลือด"
 ep2_wedding_departure_intro:0 "ห้องโถงดูไม่เหมือนวันก่อนหน้า คนรับใช้ทำความสะอาดโต๊ะแล้ว ไม่มีดนตรี และแขกส่วนใหญ่ก็เดินทางกลับไปแล้ว"
 ep2_wedding.0955.desc.intro:0 "$ep2_wedding_departure_intro$\n\nขณะที่ข้าเตรียมกล่าวคำอำลากับผู้ที่ยังเหลืออยู่"
 ep2_wedding.0955.desc.failed:0 "ข้าเหลือบเห็นใบหน้าของ[spouse_2.GetTitledFirstNamePossessive] กำลังพูดคุยอย่างมีความสุขกับคณะผู้ติดตามของ[spouse_2.GetHerHis]\n\nข้ารู้ว่า[spouse_2.GetSheHe]สงสัยข้า และด้วยเหตุผลที่ดี การสมรสครั้งนี้จะไม่มีวันน่าเบื่อ"
 ep2_wedding.0955.desc.murder:0 "ข้าใช้เวลาครู่หนึ่งคิดถึง[spouse_2.GetTitledFirstName] จากไปแล้ว"
 ep2_wedding.0955.good:0 "มันไม่จำเป็นต้องจบลง เช่นนี้"
 ep2_wedding.0955.bad:0 "ในที่สุด ข้าฯ ก็ไม่ต้องทนเห็นหน้า [spouse_2.Custom2('InsultAdjective', ROOT.Char)] ของ [spouse_2.GetHerHis] อีกต่อไป"
 ep2_wedding.0955.sadistic:1 "หากเพียง แต่ข้าจะบอกทุกคนได้ว่ามันเป็น#EMPข้า#!..."
 ep2_wedding.0955.compassionate:0 "ข้าได้ แต่หวังว่า[ROOT.Char.GetFaith.HighGodName]จะให้อภัยข้า"
 ep2_wedding.0955.indifferent:0 "สิ่งที่ทำไปแล้วก็คือทำไปแล้ว"
 ep2_wedding.0955.a:0 "โล่งใจจริงๆ"
