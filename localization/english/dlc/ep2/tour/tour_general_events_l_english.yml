 tour_general.4001.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: กุมความลับ"
 tour_general.4001.desc:0 "ขณะเยี่ยมเยียน [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))] ของข้า [stop_host_scope.GetTitledFirstName] ที่ปราการของ [stop_host_scope.GetHerHis] ใน [ROOT.Char.GetCurrentLocation.GetName] ดูเหมือนว่าข้าจะพลัดหลงจากกลุ่มทัวร์ ทำให้ข้าอยู่ตามลำพังในห้องพักของ [stop_host_scope.GetHerHis]\n\nบัดนี้ นี่อาจเป็นโอกาสอันดีที่จะได้ #EMP รู้จัก#! [stop_host_scope.GetHerHim] มากขึ้นอีกนิด บางทีข้าควรจะมองไปรอบๆ และดูว่าข้าจะพบสิ่งของ... ที่ไม่ปกติ... ที่น่าสนใจ หรือสิ่งที่ [stop_host_scope.GetSheHe] ไม่ควรต้องการให้ข้าพบหรือไม่?"
