 tour_general.4006.b_passout_tt:0 "ท่านไม่ได้รับข้อมูลใดๆ"
 ##Gain a hook on one of the vassal's close characters
 tour_general.4007.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: กิจกรรมน่าสงสัย"
 tour_general.4007.desc:0 "หลังจากเพิ่งออกจากโรงเตี๊ยมที่ [stop_host_scope.GetTitledFirstName] แนะนำ ข้าพบว่าตัวเองอยู่ข้างนอกในตรอกมืดๆ เสียงแปลกๆ ดังออกมาจากความมืด\n\nขณะที่ข้าเคลื่อนตัวเข้าไปใกล้เสียงอย่างเงียบๆ ด้วยความสงสัยในที่มาของมัน ข้าเหลือบเห็น... [4007_secret_holder.GetTitledFirstName]? [4007_secret_holder.GetSheHe] กำลังทำอะไรอยู่ที่นี่ในตรอกมืดๆ เวลานี้?\n\nข้าพยายามอย่างไร้ผลที่จะมองให้ชัดเจนขึ้นว่า [4007_secret_holder.GetSheHe] กำลังทำอะไรโดยไม่ให้รู้ตัว แต่สิ่งหนึ่งที่แน่นอนคือ [4007_secret_holder.GetTitledFirstNameNoTooltip] กำลังทำสิ่งที่ไม่ดีอยู่"
 tour_general.4007.a:0 "ถ้าข้าขยับเข้าไปใกล้กว่านี้ได้..."
 tour_general.4007.a_secret.t:0 "เรียนรู้ความลับ"
 tour_general.4007.a_secret.desc:0 "ท่านขยับเข้าไปใกล้และเรียนรู้ว่า [4007_secret_holder.GetShortUIName] กำลังทำอะไรอยู่"
 tour_general.4007.a_secret.tt:0 "ท่านเรียนรู้ความลับเกี่ยวกับ [4007_secret_holder.GetShortUIName]"
