 tour_general.4002.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ความลับถูกเปิดเผย"
 tour_general.4002.desc_bedchamber:0 "ห้องนอนของ [stop_host_scope.GetTitledFirstNamePossessive] สะอาดและเป็นระเบียบอย่างน่าประหลาดใจ เตียงนอนยิ่งน่าสงสัย ข้ามองไปรอบๆ ห้องครู่หนึ่ง พยายามมองหาสิ่งที่ผิดปกติ\n\n"
 tour_general.4002.desc_council_chamber:0 "ข้าแอบเข้าไปในห้องสภาของ [stop_host_scope.GetTitledFirstNamePossessive] อย่างเงียบเชียบ ตาและหูคอยระวังเสียงหรือการเคลื่อนไหวใดๆ ที่บ่งชี้ว่าข้าจะถูกจับได้ ห้องดูเหมือนห้องสภาธรรมดาๆ ขณะที่ข้าเดินไปมา ค้นหาตามชั้นวางและยกเอกสารที่กระจัดกระจายอยู่\n\n"
 tour_general.4002.desc_shrine:0 "[stop_host_scope.GetFaith.HouseOfWorship] เงียบสงัดอย่างน่าขนลุกขณะที่ข้าค้นหาข้อมูลตามโถงต่างๆ ห้องดูธรรมดาและปกติที่สุด ขณะที่ข้าเลี้ยวอีกครั้ง ตลอดเวลาคอยเงี่ยหูฟังว่ามีใครมาหรือไม่\n\n"
 tour_general.4002.desc_kitchen:0 "ขณะที่ข้าเข้าใกล้ห้องครัว ข้าแน่ใจว่าห้องว่างเปล่าก่อนที่จะเข้าไป ข้ามองไปรอบๆ อย่างรวดเร็วเพื่อทำความคุ้นเคย ห้องใต้ดินดูเหมือนเป็นสถานที่ที่มีแนวโน้มจะเก็บความลับได้\n\n"
 tour_general.4002.desc_deviant:0 "ทันใดนั้นข้าสังเกตเห็นรอยแตกในผนัง และค่อยๆ ดึงสิ่งที่กลายเป็นภาพวาดหลายภาพของ... #EMP โอ้พระเจ้า#!... พวกนอกรีตกำลังมีส่วนร่วมในพฤติกรรมเบี่ยงเบนประเภทหนึ่ง\n\nมีสิ่งของบางอย่างติดอยู่ด้วย ซึ่งข้าไม่อยากแตะต้อง"
 tour_general.4002.desc_homosexual:0 "ข้าขยับเข้าไปใกล้เตียงมากขึ้น สอดมือเข้าไปใต้ขอบที่นอนที่ยัดนุ่นและพบ... จดหมายจาก[stop_host_scope.GetTitledFirstNameNoTooltip] ในจดหมาย ดูเหมือนว่า[stop_host_scope.GetSheHe]กำลังสารภาพความรักของ[stop_host_scope.GetHerHis]ต่อ[stop_host_scope.GetWomanMan]อีกคน?! \n\nหือ ใครจะเดาได้ล่ะ"
 tour_general.4002.desc_murder_attempt:0 "ขณะที่ข้าเพ่งมองไปที่โต๊ะเครื่องแป้ง ข้าสังเกตเห็นกระจกอันมีค่าติดอยู่ในเนื้อไม้บริสุทธิ์ ข้าโน้มตัวเข้าไปมองด้านหลังและพบถุง... บางอย่าง\n\nข้าเปิดถุงออกเพื่อค้นพบข้อมูลโดยละเอียดเกี่ยวกับการพยายามฆาตกรรมเมื่อเร็วๆ นี้! ข้ารีบเก็บถุงกลับเข้าที่"
 tour_general.4002.desc_cannibal:0 "ข้าผลักประตูเปิดออกพร้อมเสียงเอี๊ยดเบาๆ และมองเข้าไปในห้องที่มีแสงสลัว เมื่อเข้าไปข้างใน ข้าสังเกตเห็น... กะโหลกมนุษย์? วางอยู่บนเคาน์เตอร์ฝั่งตรงข้าม? นั่นคือ... ข้าพลันสำลักกับกลิ่นที่รุนแรงและสังเกตเห็นมือ\n\nมือถูกแยกออกจากร่าง #EMP เนื้อคน#!?"
 tour_general.4002.desc_lover:1 "ข้าสะดุดเล็กน้อย ลูบมือไปตามผนังและดึงโคมไฟเพื่อไม่ให้ล้ม น่าประหลาดใจที่มันเลื่อนลงมาอย่างราบรื่น เผยให้เห็นช่องเปิดในผนัง\n\nโพรงนั้นเต็มไปด้วย... จดหมายรักของ [stop_host_scope.GetTitledFirstNamePossessive]? ถึง #EMP ชู้รัก#!?"
 tour_general.4002.desc_murder:0 "สายตาของข้ากวาดไปตามขอบหน้าต่างขณะที่สังเกตเห็นส่วนหนึ่งของผนังที่ดูผิดที่ผิดทางเล็กน้อย ข้าขยับเข้าไปใกล้และดึงสิ่งที่ดูเหมือนจะเป็นกริชเปื้อนเลือดพร้อมกับจดหมายจาก [stop_host_scope.GetTitledFirstNameNoTooltip] ถึงตัวแทนที่คาดหวังในการก่อ #EMP ฆาตกรรม!#!\n\nข้ารีบเก็บสิ่งของกลับเข้าที่ซ่อน"
 tour_general.4002.desc_non_believer:0 "ข้ามองไปที่แท่นบูชาที่ปลายห้อง ม่านใต้โต๊ะมีบางอย่างยื่นออกมาข้างใต้... ข้าดึงมันออกมาและพบ — ชุดข้อเขียนที่ขีดเขียนไว้ ซึ่งให้รายละเอียดเกี่ยวกับความกังขาของ [stop_host_scope.GetTitledFirstNamePossessive] ต่อ [stop_host_scope.GetFaith.HighGodName]\n\nข้าถอยหลังไปสองสามก้าว [stop_host_scope.GetTitledFirstNameNoTooltip] — #EMP ผู้ไม่เชื่อ#!?"
 tour_general.4002.desc_incest:0 "ข้าขยับเข้าไปใกล้ประตูห้องใต้ดิน ซึ่งแง้มอยู่เล็กน้อย และโน้มตัวเข้าไปเพื่อมองดูว่ามีอะไรอยู่ข้างใน ตาของข้าเบิกกว้างและข้ารีบกระโดดถอยหลังไปสองสามฟุต พยายามอยู่อย่างเงียบๆ และทำความเข้าใจกับสิ่งที่เพิ่งเห็น\n\n[stop_host_scope.GetTitledFirstNameNoTooltip]? กำลังมีความสัมพันธ์ทางเพศกับ... กับ... #EMP ญาติสนิท#!?"
 tour_general.4002.desc_witch:0 "ป้ายผ้าผืนหนึ่งที่แขวนอยู่บนผนังดูเบี้ยวเล็กน้อย... ข้าแตะป้ายผ้านั้น ซึ่ง ทำให้ตำราเวทมนตร์สีดำเล่มเล็ก แต่ประณีตหล่นลงบนพื้นพร้อมเสียงตุ้บเบาๆ\n\n[stop_host_scope.Custom('MagicPracticeTerm')|U]?"
 tour_general.4002.desc_embezzler:0 "เมื่อข้าลูบมือไปตามด้านข้างของโต๊ะ ข้ารู้สึกถึงบางอย่างที่ด้านล่างของเคาน์เตอร์ ข้าดึงมันออกมาเพื่อพบ... เอกสารภาษี?\n\nไม่ นี่คือเอกสารที่ให้รายละเอียดเกี่ยวกับทองคำที่ถูกยักยอกจากคลังสมบัติของ #EMP คนอื่น#! เข้าสู่คลังสมบัติของ [stop_host_scope.GetTitledFirstNamePossessive] การยักยอก!"
 tour_general.4002.a:0 "นี่จะใช้การได้ดี..."
 tour_general.4002.a_deviant:0 "เพื่อนผู้ผลักดันบรรทัดฐาน!"
 tour_general.4002.a_homosexual_female:0 "เพื่อนหญิงรักหญิง!"
 tour_general.4002.a_homosexual_male:0 "เพื่อนชายรักชาย!"
 tour_general.4002.a_homosexual:0 "เพื่อนผู้ร่าเริง!"
 tour_general.4002.a_cannibal:0 "เพื่อนนักชิม!"
 tour_general.4002.a_non_believer:0 "เพื่อนผู้แสวงหาความจริง!"
 tour_general.4002.a_incest:0 "เพื่อนผู้รักไร้ขีดจำกัด!"
 tour_general.4002.a_witch:0 "เพื่อน [stop_host_scope.Custom('SisterBrother')]!"
 #You find ... bupkis
 tour_general.4003.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ไม่มีอะไรให้ดูที่นี่"
 tour_general.4003.desc_faux_bedchamber:0 "ขณะที่ข้าแอบมองเข้าไปในห้องบรรทม ข้ารับใช้ผู้หนึ่ง ซึ่งกำลังง่วนอยู่กับการทำความสะอาดห้องก็เข้ามาหา [servant_gender.GetSheHe|U] โบกมือให้ข้าเข้าไปใกล้ๆ อย่างเห็นได้ชัด\n\n"ท่าน [ROOT.Char.GetLadyLord] ทราบเคล็ดลับในการพับผ้าปูที่นอนให้ #EMP เรียบกริบ#! หรือไม่ขอรับ/เจ้าค่ะ?" คนรับใช้เอ่ยถาม พลางมองข้าอย่างคาดหวัง\n\nข้าถอนหายใจแผ่วเบาขณะกล่าวขอตัวและออกจากห้องไป"
 tour_general.4003.desc_faux_council_chamber:0 "ห้องสภาแทบจะว่างเปล่า ปราศจากข้อมูลหรือความลับใดๆ ที่น่าสนใจให้ข้าได้เรียนรู้โดยสิ้นเชิง\n\nขณะที่ข้าหันหลังกลับ ข้าก็สะดุ้งด้วยเสียงจากด้านหลัง "ให้ข้าบอกเคล็ดลับการรักษาโต๊ะให้ไร้ฝุ่นแก่ท่าน [ROOT.Char.GetLadyLord] เถิด..."\n\nข้าแสร้งทำเป็นไม่ได้ยินขณะรีบออกจากห้องไป"
 tour_general.4003.desc_faux_shrine:0 "ข้าเดินเตร่ไปตามโถงของ [stop_host_scope.GetFaith.HouseOfWorship] มองไปรอบๆ อย่างระมัดระวังเพื่อหาสิ่งที่น่าสงสัย แต่กลับไม่พบอะไรเลย\n\nขณะค้นหาในบริเวณนั้น ข้าบังเอิญพบคนรับใช้คนหนึ่ง ซึ่งยืนกรานที่จะบอกความลับของการ... ขัดดีบุกผสมตะกั่วให้ข้าฟัง\n\nข้าปฏิเสธอย่างสุภาพ"
 tour_general.4003.desc_faux_kitchen:0 "ห้องครัวรก ราวกับว่าพนักงานเพิ่งทำงานเตรียมอาหารมื้อต่อไปเสร็จ ข้าเลี้ยวไปยังห้องเก็บของใต้ดิน ชะโงกศีรษะเข้าไปดู\n\nข้าเหลือบเห็นคนรับใช้คนหนึ่งอยู่ข้างใน กำลังง่วนอยู่กับการกอง [stop_host_scope.Custom('get_region_root_vegetable_plural')] [servant_gender.GetSheHe|U] มองข้าอย่างสงสัย แล้วอ้าปาก [servant_gender.GetHerHis]:\n\n"เคยมีใครบอกความลับเกี่ยวกับ [stop_host_scope.Custom('get_region_root_vegetable_plural')] ให้ท่านฟังไหม ท่าน [ROOT.Char.GetLadyLord]?"\n\nข้ามองคนรับใช้ด้วยความกังขา แล้วหันหลังเดินออกจากห้องครัวไป"
 tour_general.4003.a:0 "ช่างน่าผิดหวังเสียจริง"
 #You got caught!
 tour_general.4004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ถูกจับได้!"
 tour_general.4004.desc_bedchamber_caught:0 "ข้าเพิ่งเข้าไปในห้องนอนและเริ่มมองไปรอบๆ ทันใดนั้นประตูฝั่งตรงข้ามของห้องก็เปิดออก เผยให้เห็น [stop_host_scope.GetTitledFirstName] ตัวเป็นๆ [stop_host_scope.GetSheHe|U] มองข้า ดวงตาเบิกกว้างเล็กน้อยด้วยความประหลาดใจ\n\nจากนั้นดวงตาของ [stop_host_scope.GetHerHis] ก็หรี่ลง ข้ารู้สึกถึงความตื่นตระหนกเล็กน้อยขณะพยายามสงบสติอารมณ์"
 tour_general.4004.desc_council_chamber_caught:0 "ทันทีที่ข้าเข้าไปในห้องสภา ข้าก็ได้ยินเสียงฝีเท้าใกล้เข้ามาอย่างรวดเร็ว ข้าเหงื่อแตกพลั่กขณะรีบพยายามไปยังอีกด้านหนึ่งของห้องเพื่อซ่อนตัว แต่ล้มเหลวอย่างน่าสังเวช\n\nสายตาของ [stop_host_scope.GetTitledFirstName] จับจ้องมาที่ข้าขณะที่ [stop_host_scope.GetSheHe] ร้องเรียก: "อยู่นี่เอง [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า!" ดวงตาของ [stop_host_scope.GetHerHis|U] หรี่ลงขณะที่ [stop_host_scope.GetSheHe] พิจารณาข้าและความพยายามของข้าที่จะวางตัวเป็นกลาง"
 tour_general.4004.desc_shrine_caught:0 "ข้าเข้าไปใน [stop_host_scope.GetFaith.HouseOfWorship] เดินไปตามโถงเล็กน้อย — แล้วขณะที่ข้าเลี้ยวอีกมุมหนึ่ง ข้าก็เกือบจะ #EMP ชนเข้ากับ#! [stop_host_scope.GetTitledFirstName] อย่างจัง หัวใจข้าแทบหยุดเต้น\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] หันกลับมา ประหลาดใจที่ถูกรบกวน เช่นนี้ เมื่อ [stop_host_scope.GetSheHe] ตระหนักว่าใครเกือบชน [stop_host_scope.GetHerHim] ดวงตาของ [stop_host_scope.GetHerHis] ก็หรี่ลง "ข้ากำลังตามหาท่านอยู่ [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า""
 tour_general.4004.desc_kitchen_caught:0 "ห้องครัวมีแสงสลัวและมืดคลุ้ม, ขณะที่ข้าค่อยๆ เดินสำรวจไปทั่วห้องขนาดพอเหมาะ ข้าโน้มตัวเข้าไปดูสูตรอาหารที่ขีดเขียนไว้, เมื่อข้าได้ยินเสียงเอี๊ยดอ๊าดด้านหลัง — และข้าก็หันกลับไปทันที, เพียงเพื่อจะพบว่า [stop_host_scope.GetTitledFirstName] กำลังเดินออกมาจากห้องใต้ดิน\n\n[stop_host_scope.GetSheHe|U] มองมาที่ข้า, เห็นได้ชัดว่าประหลาดใจ เช่นเดียวกับที่ข้ารู้สึก จากนั้น [stop_host_scope.GetHerHis] ก็หรี่ตาลง: "[ROOT.Char.Custom('FormOfAddressForLiege')|U]... ?""
 tour_general.4004.desc_outro:0 "\n\n "... ท่านไปทำอะไรมา?" [stop_host_scope.GetTitledFirstNameNoTooltip] ถามด้วยน้ำเสียงซักไซ้"
 tour_general.4004.a:0 "เอ่อ เอ่อ ข้ากำลังตามหาท่านอยู่!"
 tour_general.4004.a_diplomacy:0 "โอ้ #EMP อยู่นี่#! เอง"
