l_english: 
 #Tour General Events
 ##Bilateral Vassal Events
 #Vassal: Your liege just suggested to purge all local cats/dogs
 tour_general.1003.t:0 "$activity_tour$: ข้อเสนอเกี่ยวกับเดรัจฉาน"
 tour_general.1003.desc_purge_cats:0 "ขณะเยี่ยมชมพื้นที่ [visiting_liege.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] ของข้า เพิ่งประกาศความรังเกียจอย่างรุนแรง [visiting_liege.GetHerHis] ต่อแมวและสัตว์จำพวกเดียวกัน"
 tour_general.1003.desc_purge_dogs:0 "ขณะเยี่ยมชมพื้นที่ [visiting_liege.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] ของข้า เพิ่งประกาศความรังเกียจ [visiting_liege.GetHerHis] ต่อสุนัขพันธุ์ทางชั้นต่ำและสุนัขทั่วไป"
 tour_general.1003.desc_pet_cat_outro:0 "เมื่อเรากลับไปยังที่พักของข้า แมวของข้า [ROOT.Char.Custom('CatStoryName')] ก็เดินเข้ามาหาข้าพร้อมเสียงครางอย่างใจกว้าง อย่างที่ [ROOT.Char.Custom('CatStorySheHe')] มักทำเมื่อข้ากลับถึงบ้าน\n\nขณะที่ข้าลูบหูและหนวดอันอ่อนนุ่มของ [ROOT.Char.Custom('CatStoryHerHis')] อย่างแผ่วเบา ข้ารู้สึกถึงสายตาของ [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] ที่แผดเผาอยู่ด้านหลัง ข้าตระหนักขึ้นมาทันทีว่าการกำจัดแมว #EMP ทั้งหมด#! หมายความว่าอย่างไร และท้องของข้าก็ปั่นป่วน\n\n"ข้า #EMP คงจะ#! พอใจกับตัวอย่างที่น่ารังเกียจตัวนั้นตรงนั้น" [visiting_liege.GetTitleAsNameNoTooltip] พูดเบาๆ ด้วยน้ำเสียงหวานเลี่ยนน่าคลื่นไส้"
 tour_general.1003.desc_pet_dog_outro:0 "เมื่อเรากลับไปยังที่พำนักของข้า สุนัขของข้า [ROOT.Char.Custom('DogStoryName')] ก็วิ่งเข้ามาหาข้าด้วยดวงตาที่ใจดีและทักทายข้าด้วยการคลอเคลียตามพิธีการ\n\nสายตาอันแหลมคมของ [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] เคลื่อนไปมาระหว่างตัวข้ากับสุนัขขณะที่ข้าลูบหลังหูของ [ROOT.Char.Custom('DogStoryName')] อย่างรักใคร่ ข้าแข็งทื่อไปชั่วขณะ ตระหนักว่าการกำจัดสุนัข #EMP ทั้งหมด#! หมายความว่าอย่างไร\n\n"ข้า #EMP คงจะ#! พอใจกับตัวอย่างที่น่าขยะแขยงตัวนั้นตรงนั้น" [visiting_liege.GetTitledFirstNameNoTooltip] พูดเบาๆ ด้วยน้ำเสียงหวานเลี่ยนน่าคลื่นไส้"
 tour_general.1003.desc_default_outro:0 "\n\nเมื่อกลับถึงห้องพัก เราหยิบเครื่องดื่มและข้าครุ่นคิดถึงสถานการณ์ที่ยากลำบาก ข้ารู้สึกได้ถึงสายตาของ [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] ที่จ้องมองมา รอคอยคำตอบของข้าต่อคำถามเรื่องการฆ่าล้างเผ่าพันธุ์เดรัจฉาน"
 tour_general.1003.a_cat:0 "โอ้ [ROOT.Char.Custom('CatStoryName')]..."
 tour_general.1003.a_dog:0 "เจ้าเป็น [ROOT.Char.Custom('DogStoryGirlBoy')] ที่ดี [ROOT.Char.Custom('DogStoryName')]..."
 tour_general.1003.a_cat.flavor:0 "การเสียสละของ [ROOT.Char.Custom('CatStoryNamePossessive')] จะช่วยชีวิตแมวที่เหลือ"
 tour_general.1003.a_dog.flavor:0 "การเสียสละของ [ROOT.Char.Custom('DogStoryNamePossessive')] จะช่วยชีวิตสุนัขที่เหลือ"
 tour_general.1003.b:0 "มากำจัด [visiting_liege.Custom('HateCatsDogs')] จรจัดกันเถอะ"
 tour_general.1003.c:0 "ข้าไม่ต้องการมีส่วนร่วมในเรื่องนี้"

 ##Vassal Events
 #Find secret/hook on your liege/key member of liege's court
 tour_general.2000.t:0 "$activity_tour$: เปิดเผยความลับ"
 tour_general.2000.desc_intro:0 "กองไฟปะทุและแตกดังเปรี๊ยะๆ ขณะที่การเฉลิมฉลองของเราสำหรับ[visiting_liege.GetTitledFirstName]ดำเนินต่อไปจนถึงช่วงเช้ามืด ข้าเดินไปมาพูดคุยเล็กน้อยและแบ่งปันเครื่องดื่มกับผู้คนในคณะผู้ติดตามของ[visiting_liege.GetHerHis]\n\nในมุมที่ห่างไกลกว่าของบริเวณกองไฟ ข้าสังเกตเห็น[visiting_liege.Custom2('RelationToMeShort', SCOPE.sC('2000_secret_holder'))]ของ[visiting_liege.GetTitledFirstNamePossessiveNoTooltip] [2000_secret_holder.GetTitledFirstName] เห็นได้ชัดว่าเมาแอ๋และคว้าหาเครื่องดื่มอีกแก้วอย่างเลื่อนลอย\n\nขณะที่ข้าเข้าไปใกล้ ข้าได้ยิน[2000_secret_holder.GetHerHim]พึมพำ: "
 tour_general.2000.desc_liege:0 ""โอ้ [visiting_liege.GetTitledFirstNameNoTooltip] เหตุใดท่านจึงต้องชื่นชอบ...""
 tour_general.2000.desc_self:0 ""[2000_secret_holder.GetFirstNameNoTooltip] ตั้งสติหน่อย! หยุดคร่ำครวญถึง...""
 tour_general.2000.desc_outro:0 "[2000_secret_holder.GetSheHe] หยุด[2000_secret_holder.GetHerselfHimself]อย่างรวดเร็วเมื่อ[2000_secret_holder.GetSheHe]สังเกตเห็นการปรากฏตัวของข้า"
 tour_general.2000.a:0 "โอ้ ข้าก็มีความยากลำบากของตัวเอง ท่านรู้ไหม..."
 tour_general.2000.a_liege:0 "โอ้ #EMP ข้า#! จะไม่บอกใคร..."
 tour_general.2000.a_spill_beans.t:0 "เรียนรู้ความลับ"
 tour_general.2000.a_spill_beans.desc:0 "หลอกล่อความลับจาก [2000_secret_holder.GetShortUIName] ได้สำเร็จ"
 tour_general.2000.a_liege_beans.tt:0 "ท่านเรียนรู้ความลับเกี่ยวกับ [visiting_liege.GetShortUIName]"
 tour_general.2000.a_self_beans.tt:0 "ท่านเรียนรู้ความลับเกี่ยวกับ [2000_secret_holder.GetShortUIName]"
 tour_general.2000.a_unsuccessful.t:0 "ความผิดที่สามารถใช้เป็นข้อต่อรองได้"
 tour_general.2000.a_unsuccessful.desc:0 "[2000_secret_holder.GetShortUIName] เริ่มสงสัยท่าน"
 tour_general.2000.b:0 "เดินจากไปตอนนี้ดีกว่า"
 #Help liege entourage member, gain scheme progress
 tour_general.2001.t:0 "$activity_tour$: สถานการณ์ที่ไม่สะดวก"
 tour_general.2001.desc_hashish:0 "ข้าพบ [2001_precarious_entourage_character.GetTitledFirstName] ขณะตรวจสอบรถม้าของคณะผู้ติดตามเจ้าเหนือหัว [2001_precarious_entourage_character.GetSheHe|U] ดูเหมือนจะจู้จี้ผิดปกติ ดวงตากลอกไปมาขณะที่ [2001_precarious_entourage_character.GetSheHe] ยังคงอยู่ไม่สุขกับบางอย่างในกระเป๋าของ [2001_precarious_entourage_character.GetHerHis]\n\nข้าโน้มตัวเข้าไป สังเกตเห็นรอยแดงในดวงตาของ [2001_precarious_entourage_character.GetHerHis] เมื่อ [2001_precarious_entourage_character.GetSheHe] เงยหน้ามองข้าและยิ้มอย่างเคอะเขิน: "[ROOT.Char.GetTitledFirstNameNoTooltip] ขออภัยในสภาพอันน่าสมเพชของข้า ข้าดูเหมือนจะทำ... ยา บางอย่างหายไป ท่านพอจะทราบอะไรเกี่ยวกับ #EMP สมุนไพร#! นั้นหรือไม่?""
 tour_general.2001.desc_privy:0 "ระหว่างทางผ่าน [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] เพื่อไปพบกับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] ผู้มาเยือน [visiting_liege.GetTitledFirstName] ข้าพลันได้ยินเสียงตะโกนอู้อี้ ข้าหยุดฟัง แล้วเริ่มเคลื่อนตัวไปยังทิศทางของเสียงตะโกน\n\nมันนำข้าไปยังส้วมในตรอกแคบๆ แห่งหนึ่ง ที่ ซึ่งข้าได้ยินเสียงเรียกขอความช่วยเหลือ: "ข้าชื่อ [2001_precarious_entourage_character.GetTitledFirstName] และดูเหมือนว่าข้าจะ... ติดอยู่" เสียงนั้นสารภาพ"
 tour_general.2001.desc_outro:0 "\n\n"หากท่านกรุณาช่วยข้า ข้าสามารถแบ่งปันข้อมูลอันมีค่าเกี่ยวกับราชสำนักของเราได้..." [2001_precarious_entourage_character.GetSheHe] อ้อนวอน"
 tour_general.2001.a:0 "รอเดี๋ยว ข้าจะช่วยท่านออกมา"
 tour_general.2001.a_hashish:0 "ให้ข้าดูว่าข้าจะทำอะไรได้บ้าง"
 tour_general.4004.a_discreet.t:0 "สำเร็จเรื่องส้วม"
 tour_general.4004.a_discreet.desc:0 "ท่านช่วย [2001_precarious_entourage_character.GetShortUIName] ออกจากส้วมได้อย่างสง่างาม"
 tour_general.4004.a_stained.t:0 "เปรอะเปื้อน"
 tour_general.4004.a_stained.desc:0 "ชุดคลุมตัวโปรดของท่านเปรอะเปื้อนในความพยายาม"
 tour_general.2001.a_success.t:0 "ความสำเร็จของแผนการเพิ่มขึ้น"
 tour_general.2001.a_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] แบ่งปันข้อมูลที่น่าสนใจเกี่ยวกับ [2001_scheme_target.GetShortUIName]"
 tour_general.2001.a_secrecy.t:0 "ความลับของแผนการเพิ่มขึ้น"
 tour_general.2001.a_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] แบ่งปันข้อมูลเกี่ยวกับเส้นทางลับ"
 tour_general.2001.b:0 "กัญชาสักหน่อยคงจะดีในตอนนี้"
 tour_general.2001.b_super_success.t:0 "ความสำเร็จของแผนการเพิ่มขึ้นอย่างมาก"
 tour_general.2001.b_super_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] แบ่งปันข้อมูลที่มีค่าอย่างยิ่งเกี่ยวกับ [2001_scheme_target.GetShortUIName]"
 tour_general.2001.b_super_secrecy.t:0 "ความลับของแผนการเพิ่มขึ้นอย่างมาก"
 tour_general.2001.b_super_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] แบ่งปันข้อมูลเกี่ยวกับอุโมงค์ลับ"
 tour_general.2001.b_spaceout.t:0 "เหม่อลอย"
 tour_general.2001.b_spaceout.desc:0 "ท่านและ [2001_precarious_entourage_character.GetShortUIName] เหม่อลอยไปโดยสิ้นเชิง"
 tour_general.2001.c:0 "ข้า... ไม่ นี่ไม่คู่ควร"

 ##Bilateral Liege Events
 #Liege: You are a fanatical cat/dog person
 tour_general.3003.t_cat:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: โลกของแมวเหมียว"
 tour_general.3003.t_dog:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: โลกของสุนัข"
 tour_general.3003.desc_love_cats:0 "ขณะเดินเตร่ไปตามถนนของ [ROOT.Char.GetCurrentLocation.GetName] โดยมี [stop_host_scope.GetTitledFirstName] อยู่เคียงข้างข้า สุนัขพันธุ์ทางจรจัดตัวหนึ่งเข้ามาหาข้า เมื่อข้ามองไปไกลตามถนน มีลูกสุนัขบ้าทั้งครอกวิ่งไปมาและก่อความวุ่นวาย\n\nข้าเบ้ปากด้วยความรังเกียจ เจ้า #EMP สัตว์#! พวกนั้น ขาดความสง่างามตามธรรมชาติของแมว ดมก้นตัวเองและผู้อื่น เลีย... #EMP อึ๋ย#!... เห็นได้ชัดว่าพวกมันเป็นสิ่งมีชีวิตที่ด้อยกว่า และในสถานที่แห่งนี้ พวกมันเป็นตัวก่อความรำคาญอย่างแน่นอน\n\nไม่ สถานที่แห่งนี้จะดีขึ้นหากกำจัดสัตว์รบกวนเหล่านี้"
 tour_general.3003.desc_love_dogs:0 "ขณะสำรวจถนนของ [ROOT.Char.GetCurrentLocation.GetName] โดยมี [stop_host_scope.GetTitledFirstName] อยู่เคียงข้างข้าอย่างเต็มใจ ทันใดนั้นมีบางอย่างตกลงมาบนหัวของข้า #EMP บางอย่างแหลมๆ#!\n\nข้ารีบคว้าสิ่งที่กลายเป็นแมวที่ดุร้ายและน่ารังเกียจมาก ซึ่งขู่ฟ่อขณะข่วนใบหน้าของข้า ข้าถอยหลังไปสองสามก้าวตามสัญชาตญาณและปล่อยเจ้าสัตว์ร้ายลงอย่างไม่นุ่มนวล\n\nเจ้าสัตว์ร้ายที่หลอกลวง ไม่น่าไว้วางใจ... ชั่วร้าย ข้ามองขึ้นไปเห็นฝูงของพวกมันรวมตัวกันอยู่ที่ปลายถนน ทั้งหมดจ้องมองข้าด้วยสายตาชั่วร้าย นี่จะไม่ได้ผล"
 tour_general.3003.a:0 "เราต้องกำจัด [ROOT.Char.Custom('HateCatsDogs')] ที่ชั่วร้ายเหล่านี้ออกจากเมืองนี้"
 tour_general.3003.a_host_decides.tt:0 "[stop_host_scope.GetShortUIName] ตัดสินใจว่าจะเกิดอะไรขึ้นต่อไป"
 tour_general.3003.a_potential_outcome_agree:0 "[stop_host_scope.GetShortUIName] ช่วยท่านฆ่า [ROOT.Char.Custom('HateCatsDogs')]"
 tour_general.3003.a_potential_outcome_offer_up_pet:0 "[stop_host_scope.GetShortUIName] เสนอ [ROOT.Char.Custom('HateCatDog')] ของ [stop_host_scope.GetHerHis] เอง"
 tour_general.3003.a_potential_outcome_disagree:0 "[stop_host_scope.GetShortUIName] จะ #EMP ไม่#! ช่วยท่านฆ่า [ROOT.Char.Custom('HateCatsDogs')]"
 tour_general.3003.b:0 "คิดดูอีกที ไปทำอย่างอื่นกันเถอะ"
 tour_general.3003.b_cynical:0 "ไม่ล่ะ นี่จะ ทำให้เลอะเทอะเกินไป"
 tour_general.3003.fanatic_subjects_approve.tt:0 "ข้าราชบริพารผู้รัก [visiting_liege.Custom('GetCatDog')] ของท่านเห็นชอบกับการกระทำนี้"
 tour_general.3003.compassionate_subjects_disapprove.tt:0 "ข้าราชบริพารผู้มีความเมตตาของท่านไม่เห็นชอบกับการกระทำนี้"

 #Liege: Did you vassal decide to help you kill cats/dogs?
 tour_general.3004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ความชั่วร้ายที่จำเป็น"
 tour_general.3004.desc_intro_sacrifice:0 "การกระทำเสร็จสิ้นแล้ว สัตว์ร้ายที่อาศัยอยู่ในที่พำนักของ [stop_host_scope.GetTitledFirstNamePossessive] ถูกกำจัดแล้ว และตอนนี้ถูกแสดงเป็นตัวอย่างเตือนใจที่ตะแลงแกงของ [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 tour_general.3004.desc_intro:0 "บัดนี้การกระทำเสร็จสิ้นแล้ว ซากสัตว์ถูกกองไว้ข้างตะแลงแกงของ [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และกองไฟเล็กๆ กำลังลุกไหม้เพื่อกำจัดสัตว์ที่น่ารังเกียจเหล่านี้ให้สิ้นซาก"
 tour_general.3004.desc_vassal_sacrifice:0 "\n\nข้าชื่นชมที่ [stop_host_scope.GetSheHe] ได้สติ [stop_host_scope.GetHerHis] และยอมมอบสัตว์สกปรกตัวนั้นมา ข้าควรไปล้างตัวเสียหน่อย ใครจะรู้ว่ามันนำพาโรคอะไรมาบ้าง"
 tour_general.3004.desc_vassal_help:0 "\n\nข้าชื่นชมที่ [stop_host_scope.GetTitledFirstName] รีบมาช่วยเหลือข้าทันทีและเริ่มรวบรวมสัตว์ที่น่าสังเวชเหล่านั้น บัดนี้ข้าสามารถนอนหลับได้อย่างสบายใจ โดยรู้ว่าอาณาจักรปลอดภัยขึ้นเล็กน้อย"
 tour_general.3004.desc_no_help:0 "\n\nไม่ใช่ว่าคนขี้ขลาด [stop_host_scope.GetTitledFirstName] จะช่วยอะไรได้ ข้าพ่นลมหายใจขณะครุ่นคิดถึงการไม่เชื่อฟังที่กระทำโดย [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))] ของข้า อย่างน้อยตอนนี้ข้ารู้แล้วว่า [stop_host_scope.GetSheHe] ยืนอยู่จุดไหน"
 tour_general.3004.desc_outro:0 "\n\nขณะที่ข้าเดินไปยังห้องอาบน้ำที่จัดเตรียมไว้ในห้องพัก ข้าเห็น [ROOT.Char.Custom('GetCatDog')] จรจัดตัวหนึ่ง กำลังมองดูภาพที่ตะแลงแกงอย่างสงสัย ข้ายิ้มให้ [ROOT.Char.Custom('GetFelineCanine')] และพยักหน้า: "ทุกอย่างเรียบร้อยแล้ว เจ้าตัวน้อย""
 tour_general.3004.a:0 "มันเสร็จสิ้นแล้ว"

