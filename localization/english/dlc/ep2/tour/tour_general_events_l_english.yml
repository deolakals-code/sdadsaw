 tour_general.4000.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: ขบวนแห่อันน่าสังเวช"
 tour_general.4000.desc:0 "ถนนสายหลักของ [ROOT.Char.GetCurrentLocation.GetName] เต็มไปด้วยผู้คนชาว [stop_host_scope.GetCulture.GetNameNoTooltip] กระตือรือร้นที่จะได้เห็น [ROOT.Char.GetTitleAsNameNoTooltip|U] ของพวกเขา\n\nเมื่อรู้ถึงจุดประสงค์ของ [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] ของข้า ข้าเหลือบมองนักโทษจากคณะผู้ติดตามของข้า ซึ่งถูกเข้าแถวและล่ามโซ่ไว้ในขบวนที่เริ่มอยู่ด้านหลังข้าพอดี ชาวเมืองเหล่านี้จำเป็นต้องเคารพข้าและรู้ว่าจะเกิดอะไรขึ้นกับผู้ที่ก้าวล่วง\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parade_master'))] ของข้า [parade_master.GetTitledFirstName] มองข้าอย่างคาดหวัง ดาบอยู่ในมือ รอสัญญาณให้เริ่มแห่นักโทษไปตามถนน"
