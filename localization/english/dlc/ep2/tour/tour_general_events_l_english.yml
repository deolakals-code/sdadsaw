 tour_general.4004.a_diplomacy_convinced.desc:0 "ท่านสามารถโน้มน้าว [stop_host_scope.GetShortUIName] ได้สำเร็จ"
 tour_general.4004.a_diplomacy_nonconvinced.t:0 "ไม่น่าเชื่อถือ"
 tour_general.4004.a_diplomacy_nonconvinced.desc:0 "ท่านโน้มน้าว [stop_host_scope.GetShortUIName] ไม่สำเร็จ"
 tour_general.4004.a_diplomacy_snooping.t:0 "เจ้าเหนือหัวสอดรู้สอดเห็น"
 tour_general.4004.a_diplomacy_snooping.desc:0 "ท่านจับได้ว่าเจ้าเหนือหัวของท่านกำลังสอดแนมรอบๆ ปราการของท่าน"
 tour_general.4004.b:0 "ข้ากำลังรอ #EMP ท่าน#! อยู่..."
 #Come across a drunk vassal servant, gain scheme buff/s
 tour_general.4006.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: วางแผนขณะเมา"
 tour_general.4006.desc:1 "หลังจากถูก [stop_host_scope.GetTitledFirstName] พาไปโน่นมานี่รอบ [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ทั้งวัน ข้าตัดสินว่าสมควรแล้วที่จะได้ใช้เวลายามเย็นโดยไม่มี [stop_host_scope.GetHerHim] ดังนั้นคณะผู้ติดตามของข้าจึงผ่อนคลายที่โรงเตี๊ยมท้องถิ่น\n\nขณะที่ข้ากวาดสายตาไปทั่วกลุ่มคนเมามายที่แผ่กระจาย — ใบหน้าที่แดงก่ำใบหน้าหนึ่งโดดเด่นกว่าใคร มันเป็นของคนรับใช้คนหนึ่งของ [stop_host_scope.GetTitledFirstNamePossessiveNoTooltip]\n\nข้าโน้มตัวเข้าไปใกล้ขณะที่คนขี้เมาพร่ำเพ้อต่อไป: "โอ้ ข้าสามารถบอกท่านได้สองสามเรื่องเกี่ยวกับ [stop_host_scope.GetTitleTierName]! มากกว่าสองสามเรื่อง...""
 tour_general.4006.a:1 "ว่าต่อไปสิ..."
