 tournament_events.6051.t:0 "$tournament_events.6050.t$"
 tournament_events.6051.foot:0 "ข้าพยายามก่อวินาศกรรมเกราะของ [sabotage_target.GetTitledFirstNamePossessive] ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะดำเนินต่อไป ทำให้จุดหนังที่ยึดส่วนประกอบต่างๆ อ่อนแอลงโดยหวังว่ามันจะสึกหรอ"
 tournament_events.6051.archery:1 "ข้าพยายามก่อวินาศกรรมคันธนูของ [sabotage_target.GetTitledFirstNamePossessive] ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะดำเนินต่อไป โดยเปลี่ยนแรงดึงของสายธนูอย่างแนบเนียนเพื่อ ทำให้ [sabotage_target.GetHerHim] เสียสมาธิ"
 tournament_events.6051.pugilism:0 "ข้าพยายามก่อวินาศกรรมผ้าพันมือของ [sabotage_target.GetTitledFirstNamePossessive] ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะดำเนินต่อไป โดยทาด้วยขี้ผึ้งที่ระคายเคืองเพื่อ ทำให้ [sabotage_target.GetHerHim] เสียสมาธิ"
 tournament_events.6051.horse:0 "ข้าพยายามวางยาม้าของ [sabotage_target.GetTitledFirstNamePossessive] ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะดำเนินต่อไป โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ"
 tournament_events.6051.horse_race:0 "ข้าพยายามวางยาม้าแข่งของ [sabotage_target.GetTitledFirstNamePossessive] #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะเริ่มขึ้น โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ"
 tournament_events.6051.falconry:0 "ข้าพยายามวางยานกของ [sabotage_target.GetTitledFirstNamePossessive] ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะเริ่มขึ้น โดยปนเปื้อนอาหารของมันขณะที่ผู้ติดตามอัศวินหลับ"
 tournament_events.6051.success:0 "\n\nความอดทนของข้าสัมฤทธิ์ผลในที่สุด ข้าทำการสับเปลี่ยนโดยไม่ ทำให้เกิดความสงสัยและหลบหนีไปในยามค่ำคืน เมื่อถึงรุ่งเช้า ข้าก็โล่งใจที่ไม่พบเสียงกระซิบใดๆ เกี่ยวกับแผนการของข้า"
 tournament_events.6051.detected:0 "\n\nทันทีที่ข้ากำลังจะจากไป งานที่ระมัดระวังของข้าใกล้จะเสร็จสมบูรณ์ ข้าหันไปพบผู้ดูแลของ [sabotage_target.GetFirstNamePossessiveNoTooltip] อ้าปากค้าง ก่อนที่ข้าจะทันได้ตอบโต้ [sabotage_target.GetSheHe] ก็รีบวิ่งไปบอกเจ้านายของ [sabotage_target.GetHerHis]!"
 tournament_events.6051.failure:0 "\n\nอนิจจา ระหว่างความฉลาดหลักแหลมของ [sabotage_target.GetHerHis] และโชคร้ายของข้า ความพยายามเหล่านี้ไม่ได้ทำอะไรเลยนอกจากเพิ่มความสงสัยในการเล่นสกปรกในหมู่ผู้เข้าแข่งขัน ซึ่งตอนนี้ระมัดระวังตัวมากขึ้นกว่าเดิม"
 tournament_events.6051.disqualified:0 "\n\nไม่นานข้าก็ถูกตัดสิทธิ์..."
 tournament_events.6051.forgiven:0 "\n\nโชคดีที่ข้าได้รับอนุญาตให้เข้าร่วมต่อไป..."
 tournament_events.6051.a:0 "ทุกอย่างยุติธรรม"
 tournament_events.6051.a.disqualified:0 "ให้ตายสิ..."
 tournament_events.6051.a.detected:0 "ช่างโชคร้ายอะไร เช่นนี้..."
 tournament_events.6051.a.failure:0 "ให้ตายสิ..."

 tournament_events.6052.t:0 "$tournament_events.6050.t$"
 tournament_events.6052.host:1 "ผู้ดูแลของข้าอ้างว่าจับ [sabotage_actor.GetTitledFirstName] หนึ่งในผู้เข้าแข่งขันในการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName] ที่กำลังจะมาถึง พยายามก่อวินาศกรรมข้าในงาน!\n\n"
 tournament_events.6052.guest:0 "[sabotage_target.GetTitledFirstName] หนึ่งในผู้เข้าแข่งขันในการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] ที่กำลังจะมาถึง ได้กล่าวหา [sabotage_actor.GetTitledFirstName] ว่าเล่นสกปรก แม้กระทั่งก่อนวันงาน!\n\n"
 tournament_events.6052.foot:1 ""[sabotage_actor.GetSheHe|U] กำลังดัดแปลงเกราะของ [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat] ทำให้จุดหนังที่ยึดส่วนประกอบต่างๆ อ่อนแอลงโดยหวังว่ามันจะสึกหรอระหว่างการประลอง!""
 tournament_events.6052.archery:2 ""[sabotage_actor.GetSheHe|U] กำลังดัดแปลงคันธนูของ [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat] โดยเปลี่ยนแรงดึงของสายธนูอย่างแนบเนียน""
 tournament_events.6052.pugilism:1 ""[sabotage_actor.GetSheHe|U] กำลังดัดแปลงผ้าพันมือของ [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat] โดยทาด้วยขี้ผึ้งที่ระคายเคือง""
 tournament_events.6052.horse:1 ""[sabotage_actor.GetSheHe|U] กำลังพยายามวางยาม้าของ [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat] โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ""
 tournament_events.6052.horse_race:1 ""[sabotage_actor.GetSheHe|U] กำลังพยายามวางยาม้าแข่งของ [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat] #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ""
 tournament_events.6052.a:0 "การโกงจะไม่ได้รับการยอมรับ"
 tournament_events.6052.a.host:0 "การโกงต้องถูกตัดสิทธิ์!"
 tournament_events.6052.b:0 "มาเถิด มันไม่เป็นอันตราย"
 tournament_events.6053.t:0 "$tournament_events.6050.t$"
 tournament_events.6053.desc:0 "ก่อนที่การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] จะเริ่มขึ้น มีคนถูกจับได้คาหนังคาเขาว่ากำลังก่อวินาศกรรม!"
 tournament_events.6053.foot:1 ""[sabotage_actor.GetTitledFirstName] กำลังดัดแปลงเกราะของ [sabotage_target.GetTitledFirstNamePossessive] ทำให้จุดหนังที่ยึดส่วนประกอบต่างๆ อ่อนแอลงโดยหวังว่ามันจะสึกหรอระหว่างการประลอง!""
 tournament_events.6053.archery:2 ""[sabotage_actor.GetTitledFirstName] กำลังดัดแปลงคันธนูของ [sabotage_target.GetTitledFirstNamePossessive] โดยเปลี่ยนแรงดึงของสายธนูอย่างแนบเนียนเพื่อ ทำให้ข้าเสียสมาธิ""
 tournament_events.6053.pugilism:1 ""[sabotage_actor.GetTitledFirstName] กำลังดัดแปลงผ้าพันมือของ [sabotage_target.GetTitledFirstNamePossessive] โดยทาด้วยขี้ผึ้งที่ระคายเคืองเพื่อ ทำให้ข้าเสียสมาธิ""
 tournament_events.6053.horse:1 ""[sabotage_actor.GetTitledFirstName] กำลังพยายามวางยาม้าของ [sabotage_target.GetTitledFirstNamePossessive] โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ""
 tournament_events.6053.horse_race:1 ""[sabotage_actor.GetTitledFirstName] กำลังพยายามวางยาม้าแข่งของ [sabotage_target.GetTitledFirstNamePossessive] #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#! โดยเปลี่ยนอาหารในคอกเป็นชุดที่ปนเปื้อนขณะที่ผู้ติดตามอัศวินหลับ""
 tournament_events.6053.disqualified_target:0 "\n\n[host.GetTitledFirstName] ได้ตัดสิทธิ์เจ้าคนเลวทรามนั้นออกจากการแข่งขันอย่างยุติธรรมแล้ว ช่างกล้า!"
 tournament_events.6053.disqualified:0 "\n\nเป็นที่เข้าใจได้ว่า [host.GetTitledFirstName] ได้ตัดสิทธิ์ [sabotage_actor.GetHerHim] ออกจากการแข่งขัน สร้างความยินดีให้กับเหยื่อที่ [host.GetHerHis] ตั้งใจไว้เป็นอย่างมาก"
 tournament_events.6053.forgiven_target:0 "\n\n[host.GetTitledFirstName] ได้ให้อภัยเจ้าคนเลวทรามนั้นอย่างน่าโมโห ซึ่งจะยังคงได้รับอนุญาตให้แข่งขันต่อไป! ช่างกล้า!"
 tournament_events.6053.forgiven:0 "\n\nน่าประหลาดใจที่ [host.GetTitledFirstName] ไม่ได้ดำเนินการใดๆ กับ [sabotage_actor.GetHerHim] โดยปัดเรื่องนี้ทิ้งไป"
 tournament_events.6053.a:0 "ไร้ยางอาย!"
 tournament_events.6500.t:1 "$tournament_header$ สิ่งที่เราทำเพื่อความรัก"
 tournament_events.6500.desc:0 "ความพยายามของข้าที่จะดึงดูดความสนใจของ [woo_target.GetTitledFirstName] ไม่ได้ถูกมองข้ามไป แต่หัวใจของ [woo_target.GetHerHis] ยังไม่เปิดรับข้า\n\n"ข้าไม่ใช่ [woo_target.Custom('GirlBoy')] บางคน เป็นสิ่งไร้เดียงสาให้ขุนนางไล่ตามแล้วทอดทิ้ง แสดงให้ข้าเห็น — พิสูจน์ให้ข้าเห็น — ความรักของท่าน แล้วเราจะคุยกัน..."\n\n"แสดงให้ท่านเห็น?" ข้าสอบถาม "...ท่านจะให้ข้าทำ เช่นนั้นได้อย่างไร?"\n\nคำตอบของ [woo_target.GetFirstNamePossessiveNoTooltip] มาอย่างรวดเร็ว: "จงแพ้การแข่งขัน""
 tournament_events.6500.a:0 "ตามที่ท่านกล่าว ที่รัก [woo_target.GetFirstNameNoTooltip]"
 tournament_events.6500.b:0 "ไม่มีเกียรติยศในความพ่ายแพ้!"
 tournament_events.6510.t:0 "เสน่ห์แห่งชัยชนะ"
 tournament_events.6510.opening:0 "ช่วงเวลาพักผ่อนในงานประลอง ทำให้ข้ามีเวลาเหลือเฟือที่จะวางแผนพบกับ [woo_target.GetFirstName]"
 tournament_events.6510.married:0 "มันง่ายที่จะ ทำให้แน่ใจว่า [woo_target.GetPrimarySpouse.GetWifeHusband] ของ [woo_target.GetHerHis] [woo_target.GetPrimarySpouse.GetTitledFirstName] จะอยู่ที่อื่น"
 tournament_events.6510.currentspouse:0 "โอกาสที่จะพิสูจน์ความทุ่มเทของข้าต่อ [woo_target.GetWomanMan] ของข้า!"
 tournament_events.6510.desc:0 "\n\n"ขอแสดงความยินดีที่ชนะการแข่งขัน [ROOT.Char.Custom('GetRandomWonContest')|l] ท่าน [ROOT.Char.GetTitledFirstName]" [woo_target.GetSheHe] เสนออย่างสุภาพ "มันช่างเป็นภาพที่น่าตื่นตาตื่นใจ"\n\nมีประกายตาที่แท้จริงในดวงตาของ [woo_target.GetHerHis] ข้ามั่นใจ"
 tournament_events.6510.a:0 "ข้าทำทั้งหมดเพื่อ #EMP ท่าน#! ท่าน [woo_target.GetLadyLord] ของข้า"
 tournament_events.6510.a.tt:0 "#F ดึงดูดใจด้านอารมณ์ของ [woo_target.GetFirstNamePossessiveNoTooltip]#!."
 tournament_events.6510.b:0 "โอ้ นั่นรึ? มันไม่มีอะไรเลยจริงๆ"
 tournament_events.6510.b.tt:0 "#F ดึงดูดใจด้านหยิ่งทะนงของ [woo_target.GetFirstNamePossessiveNoTooltip]#!."
 tournament_events.6510.c:0 "ข้าโชคดี: คู่ต่อสู้ของข้าต่อสู้ได้ดี"
 tournament_events.6510.c.tt:0 "#F ดึงดูดใจด้านถ่อมตนของ [woo_target.GetFirstNamePossessiveNoTooltip]#!."
 tournament_events.6510.d:0 "[ROOT.Char.GetFaith.HighGodName] ตอบคำอธิษฐานของข้าด้วยความโปรดปรานของ [ROOT.Char.GetFaith.HighGodHerHis]"
 tournament_events.6510.d.tt:0 "#F ดึงดูดใจด้านศาสนาของ [woo_target.GetFirstNamePossessiveNoTooltip]#!."
 tournament_events.6511.reply_dedicate:0 "[woo_actor.GetSheHe|U] ตอบอย่างหน้าไม่อายว่า [woo_actor.GetSheHe] ทำทั้งหมดเพื่อข้า!\n\n"
 tournament_events.6511.reply_dismiss:0 "[woo_actor.GetSheHe|U] ตอบอย่างไม่ใส่ใจว่าข้าไม่ควรเอ่ยถึงเรื่องเล็กน้อย เช่นนั้นด้วยซ้ำ\n\n"
 tournament_events.6511.reply_praise:0 "[woo_actor.GetSheHe|U] ตอบอย่างรวดเร็วว่า [woo_actor.GetSheHe] เพียงแค่โชคดี คู่ต่อสู้ของ [woo_actor.GetHerHis] ไม่ได้ด้อยไปกว่า [woo_actor.GetSheHe]\n\n"
 tournament_events.6511.reply_god:0 "[woo_actor.GetSheHe|U] ตอบอย่างจริงจังว่า [woo_actor.GetSheHe] รู้สึกขอบคุณที่ได้รับความโปรดปรานจาก [woo_actor.GetFaith.HighGodName]\n\n"
 tournament_events.6511.opening:0 "ข้าพบกับ [woo_actor.GetTitledFirstName] ที่ศาลา และแสดงความยินดีสำหรับชัยชนะของ [woo_actor.GetHerHis] ในการแข่งขัน [ROOT.Char.Custom('GetRandomWonContest')|l]\n\n"
 tournament_events.6511.dedicate:0 "$tournament_events.6511.reply_dedicate$ข้าอดไม่ได้ที่จะหน้าแดงกับการจีบอย่างโจ่งแจ้งนี้..."
 tournament_events.6511.dismiss:0 "$tournament_events.6511.reply_dismiss$ช่างเป็น [woo_actor.GetWomanMan] ที่กล้าหาญ..."
 tournament_events.6511.praise:0 "$tournament_events.6511.reply_praise$ช่างถ่อมตนเสียจริง..."
 tournament_events.6511.god:0 "$tournament_events.6511.reply_god$เป็น [woo_actor.GetWomanMan] ที่มีศรัทธาโดยแท้"
 tournament_events.6511.fallback:0 "[woo_actor.GetSheHe|U] เพียงแค่ยิ้มให้ข้าอย่างรู้ทัน และข้าพบว่ามันยากที่จะละสายตา"
 tournament_events.6511.a:0 "ข้าปฏิเสธไม่ได้ว่า [woo_actor.GetSheHe] มีเสน่ห์บางอย่าง..."

 tournament_events.6512.dedicate:0 "$tournament_events.6511.reply_dedicate$ข้าอดไม่ได้ที่จะรู้สึกอึดอัดใจ..."
 tournament_events.6512.dismiss:0 "$tournament_events.6511.reply_dismiss$ช่างหยิ่งทะนงเสียจริง..."
 tournament_events.6512.praise:0 "$tournament_events.6511.praise$เรียนรู้ที่จะรับคำชมเสียบ้างเถิด!"
 tournament_events.6512.god:0 "$tournament_events.6511.god$ช่างน่าเบื่ออะไร เช่นนี้..."
 tournament_events.6512.fallback:0 "[woo_actor.GetSheHe|U] เพียงแค่ยิ้มให้ข้าอย่างรู้ทัน ทำให้ข้า #EMP รู้สึกอึดอัดใจอย่างยิ่ง#!."
 tournament_events.6512.a:0 "ช่างเป็น [woo_actor.GetWomanMan] ที่น่าขัน"
 tournament_events.6513.reply:0 "[woo_target.GetTitledFirstName] ดูเหมือนจะตอบสนองต่อคำตอบของข้าอย่างอบอุ่น"
 tournament_events.6513.dedicate:0 "$tournament_events.6513.reply$ หน้าแดงขณะที่ [woo_target.GetSheHe] หัวเราะอย่างเขินอาย"
 tournament_events.6513.dismiss:0 "$tournament_events.6513.reply$ เกือบจะมองข้าด้วยสายตาใหม่"
 tournament_events.6513.praise:0 "$tournament_events.6513.reply$ ตอบว่า [woo_target.GetSheHe] มั่นใจว่ามันเป็นมากกว่าโชค"
 tournament_events.6513.god:0 "$tournament_events.6513.reply$ ตอบว่า [woo_target.GetFaith.HighGodName] ต้องประสงค์ เช่นนั้นจริงๆ"
 tournament_events.6513.fallback:0 "$tournament_events.6513.reply$ จ้องมองลึกเข้าไปในดวงตาของข้า"
 tournament_events.6513.desc:0 "\n\nเมื่อ [woo_target.GetSheHe] จากไป ความตึงเครียดก็เห็นได้ชัดในทุกคำทักทาย — ข้ารู้ว่าข้าจะหาคำพูดที่เหมาะสมเพื่อเอาชนะใจ [woo_target.GetHerHim] ได้!"
 tournament_events.6513.a:0 "ข้าคิดว่า [woo_target.GetSheHe] ติดเบ็ดแล้ว..."
 tournament_events.6514.reply:0 "คำตอบของข้าดูเหมือนจะไม่สร้างความประทับใจให้ [woo_target.GetTitledFirstName]"
 tournament_events.6514.dedicate:0 "$tournament_events.6514.reply$, เพราะ [woo_target.GetSheHe] หลบสายตาข้าเมื่อ [woo_target.GetSheHe] ขอบคุณข้าและรีบจากไป [woo_target.GetHerHis]"
 tournament_events.6514.dismiss:0 "$tournament_events.6514.reply$, เพราะ [woo_target.GetSheHe] กลอกตา [woo_target.GetHerHis] อย่างไม่ใส่ใจ"
 tournament_events.6514.praise:0 "$tournament_events.6514.reply$ เพราะ [woo_target.GetSheHe] หมดความสนใจอย่างรวดเร็ว รู้สึกท้อแท้กับคำพูดของข้า"
 tournament_events.6514.god:0 "$tournament_events.6514.reply$ เพราะ [woo_target.GetSheHe] เหม่อลอย ดูเหมือนจะฟังเพียงครึ่งเดียว"
 tournament_events.6514.fallback:0 "$tournament_events.6513.reply$ เพราะ [woo_target.GetSheHe] ไม่สามารถจากไปจากข้าได้เร็วกว่านี้"
 tournament_events.6514.desc:0 "\n\nเมื่อยืนอยู่ตามลำพังหลังจากที่ [woo_target.GetHerHis] กล่าวคำอำลา ข้าอดไม่ได้ที่จะรู้สึกเหมือนคนโง่สำหรับการก้าวพลาดอย่างสิ้นเชิง เช่นนี้..."
 tournament_events.6514.a:0 "ข้าคิดอะไรอยู่...?"
 tournament_events.6900.t:1 "$tournament_header$ นักรบทวนท้องถิ่น"
 tournament_events.6900.desc:0 "เมื่อสำรวจเหล่าขุนนางชั้นผู้น้อยที่รวมตัวกันใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ข้าก็พบ [local_lancer.GetWomanMan] ประเภทที่ข้าต้องการพอดี\n\n"
 tournament_events.6900.new:0 "[local_lancer.GetFullName] เป็น [local_lancer.GetWomanMan] ขี่ม้าท้องถิ่นที่มีประสบการณ์พอสมควร เป็นที่รู้จักในแถบนี้ด้วยความกล้าหาญของ [local_lancer.GetHerHis] แม้จะมีสถานะต่ำต้อย — เป็น [ROOT.Char.Custom('MountedWarriorTerm')] จากสายตระกูลต่างจังหวัดที่ถูกลืมเลือน"
 tournament_events.6900.pool:0 "[local_lancer.GetFullName] เป็นนักรบขี่ม้าพเนจรที่มีประสบการณ์พอสมควร เดินทางจากราชสำนักหนึ่งไปยังอีกราชสำนักหนึ่งเพื่อแสวงหา [ROOT.Char.GetLadyLord] ที่จะรับใช้ โดยปกติแล้ว [local_lancer.GetWomenMen] เช่นนี้ไม่น่าไว้วางใจ แต่ความสามารถของ [local_lancer.GetHerHis] นั้นเห็นได้ชัดในทันที"
 tournament_events.6900.closing:0 "\n\nขณะที่ข้าเข้าใกล้เพื่อแนะนำตัว [bidder.GetTitledFirstName] ก็ปรากฏตัวขึ้นข้างๆ [local_lancer.GetHerHim] เห็นได้ชัดว่ามีความคิด เช่นเดียวกับข้า..."
 tournament_events.6900.a:0 "มั่นใจได้เลย ข้าจะจ่ายดีกว่า"
 tournament_events.6900.a.success:0 "[local_lancer.GetFirstNameNoTooltip] ถูกขับเคลื่อนด้วยเหรียญ"
 tournament_events.6900.a.failure:0 "[local_lancer.GetFirstNameNoTooltip] ชอบ [bidder.GetFirstNameNoTooltip] มากกว่า"
 tournament_events.6900.b:0 "[local_lancer.GetFirstNameNoTooltip] ท่านจะได้นั่งในศาลาใหญ่ของข้า!"
 tournament_events.6900.b.success:0 "[local_lancer.GetFirstNameNoTooltip] แสวงหาความพึงพอใจทางโลก"
 tournament_events.6900.c:0 "มาเถิด ท่านอยากจะรับใช้แค่ #EMP [bidder.GetTitleAsNameNoTooltip]#! จริงๆ หรือ?"
 tournament_events.6900.c.success:0 "[local_lancer.GetFirstNameNoTooltip] เป็นคนทะเยอทะยาน"
 tournament_events.6900.d:0 "หลีกไป [bidder.GetFirstNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip] ของท่านมาก่อน"
 tournament_events.6900.e:0 "ข้าจะไม่ต่อรองเรื่อง [ROOT.Char.Custom('MountedWarriorTerm')]"

 tournament_events.7000.t:1 "$tournament_header$ จงเป็น [ROOT.Char.GetWomanMan|U]!"
 tournament_events.7000.desc:2 "ข้าทักทายกลุ่ม [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] ขณะที่พวกเขาเดินผ่านข้าไป คนหนึ่งที่เดินล้าหลังคนอื่นๆ ทำให้ข้าหยุดชะงัก เมื่อหมุนตัวกลับ ข้าก็เรียกตามร่างนั้นไป\n\nพวกเขาอยู่ในชุดเกราะที่ไม่มีรูปทรง ไม่พอดีตัว ดวงตาเบิกกว้างและหวาดกลัวอย่างเห็นได้ชัดภายใต้หมวกเกราะ #EMP บางอย่าง#! ไม่ถูกต้องที่นี่ เมื่อก้าวไปข้างหน้า ข้าก็กระชากหมวกเกราะออกก่อนที่พวกเขาจะมีโอกาสตอบโต้\n\nยืนอยู่ตรงหน้าข้า มองไปรอบๆ อย่างลับๆ ล่อๆ เพื่อดูว่ามีใครสังเกตเห็นหรือไม่ ไม่ใช่ใครอื่นนอกจาก [mulan.GetWomanMan]! แต่งตัวเป็น [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] เสียด้วย วางแผนที่จะ #EMP แข่งขัน#! ในฐานะ [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] ด้วยซ้ำ!"
 tournament_events.7000.a:0 "ข้าจะเก็บความลับของเจ้าไว้"
 tournament_events.7000.a.tt:1 "เข้าร่วม [activity.GetShortName]"
 tournament_events.7000.b:0 "ข้าต้องการใช้บริการของคนอย่างเจ้า"
 tournament_events.7000.b.tt:0 "กลายเป็น [mulan.Custom('KnightCulture')] ของท่าน"
 tournament_events.7000.c:0 "ทหาร! #EMP ทหาร!#! มี #EMP [mulan.GetWomanMan]#! อยู่ในงานประลองของเรา!"

