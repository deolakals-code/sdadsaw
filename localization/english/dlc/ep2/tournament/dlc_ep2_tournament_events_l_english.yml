 tournament_events.6012.t:0 "$tournament_events.6010.t$"
 tournament_events.6012.poison:0 "ข้ากำลังเพลิดเพลินกับการพูดคุยเกี่ยวกับการแข่งขันที่กำลังจะมาถึงกับผู้เข้าร่วมบางคน ทันใดนั้นข้าก็รู้สึกว่าอวัยวะภายในปั่นป่วนและหายใจติดขัด\n\n"
 tournament_events.6012.thug:0 "ข้าออกจากเต็นท์ของข้า หลังจากใช้เวลาช่วงเย็นพูดคุยเกี่ยวกับตัวเต็งกับผู้เข้าร่วมคนอื่นๆ ทันใดนั้นข้าก็สัมผัสได้ถึงร่างหนึ่งอยู่ข้างหลังข้า\n\n"
 tournament_events.6012.death:0 "เทพเจ้า นี่มันไฟอะไรอยู่ในตัวข้า! "ช-ช่วยด้วย!"" ข้าพูดตะกุกตะกัก ใบหน้าที่โง่เขลาของคนรู้จักจ้องมองมาที่ข้า"
 tournament_events.6012.ill:0 "ข้าทรุดตัวลง กุมท้อง ขณะที่ถูกรายล้อมไปด้วยผู้เห็นเหตุการณ์ที่กังวล "ช่วยด้วย ห-หาหมอ!" ข้าพยายามพูดตะกุกตะกัก"
 tournament_events.6012.slain:0 "ก่อนที่ข้าจะทันได้หัน ราวกับว่าม้าเตะข้าลงไปกองกับพื้น ร่างสวมผ้าคลุมกดข้าไว้ แทงกริชเข้าหาหัวใจข้า!"
 tournament_events.6012.caught:0 "ข้าก้าวหลบไปทันทีที่ชายคนนั้นพุ่งเข้ามาหาข้า ทำให้เขาเสียหลักก่อนที่ข้าจะกดเขาลงกับพื้น กริชที่ส่องประกายปักอยู่ในโคลน"
 tournament_events.6012.escape:0 "ฝีเท้าหนักๆ ของร่างสวมผ้าคลุมใกล้เข้ามา ข้าหมุนตัวอย่างแรงเมื่อพวกเขาเข้าใกล้ ทำให้พวกเขาล้มลงกับพื้น และวิ่งหนีเข้าไปในหมู่เต็นท์ที่ซับซ้อน"
 tournament_events.6012.a.death:0 "#EMP *สำลัก*#! ช- #weak ช่วย...!"
 tournament_events.6012.a.ill:0 "ข-ข้าแค่ ต-ต้องการนอนพัก"
 tournament_events.6012.a.poison:0 "เครื่องดื่มพวกนี้มันบาป!"
 tournament_events.6012.a.slain:0 "#weak ใคร...?!#!?"
 tournament_events.6012.a.caught:0 "#EMP ใครส่งเจ้ามา?!"
 tournament_events.6012.a:0 "ข้าจะไม่เป็นไร..."
 tournament_events.6013.t:0 "$tournament_events.6010.t$"
 tournament_events.6013.death:0 "ข้ารีบวิ่งตามหลัง [murder_target.GetHerHim] ให้เงียบที่สุดเท่าที่จะทำได้ คว้าศีรษะของ [murder_target.GetHerHis] และปาดดาบเข้าที่คอของ [murder_target.GetHerHis]\n\n[murder_target.GetSheHe|U] สำลักและดิ้นรนขณะที่ข้าวิ่งหนีเข้าไปในเขาวงกตของเต็นท์"
 tournament_events.6013.fallback:0 "ข้ารีบวิ่งตามหลัง [murder_target.GetHerHim] ให้เงียบที่สุดเท่าที่จะทำได้ แต่ [murder_target.GetFirstName] ได้ยินเสียงข้าเข้ามาและหันกลับมา จ้องมองด้วยตาเบิกกว้างไปที่กริชที่ส่องประกายของข้า\n\n[murder_target.GetSheHe|U] วิ่งหนีด้วยพลังงานที่เพิ่งค้นพบ ทำให้ข้าหายใจไม่ออก และหายตัวเข้าไปในเขาวงกตของเต็นท์"
 tournament_events.6013.a.death:0 "นั่นน่าจะจัดการได้!"
 tournament_events.6013.a:0 "ไม่นะ!"
 tournament_events.6014.t:0 "$tournament_events.6010.t$"
 tournament_events.6014.desc:0 "ขณะที่ข้าเดินกลับไปที่เต็นท์ของข้า กุมสีข้างอย่างอ่อนแรง [murder_target.GetHerHis] ก็วิ่งเข้ามาข้างหลังข้า!"
 tournament_events.6014.death:0 "ก่อนที่ข้าจะทันได้ตอบโต้ [murder_target.GetSheHe] ก็ดึงศีรษะข้าไปข้างหลังและจ่อกริชเข้าที่คอข้า!"
 tournament_events.6014.fallback:0 "ข้าหมุนตัวกลับ ทำให้ [murder_target.GetHerHim] ล้มลงกับพื้นพร้อมเสียงครวญคราง และวิ่งตรงเข้าไปในเขาวงกตของเต็นท์"
 tournament_events.6014.a.death:0 "อะไร- #EMP ม-!#! *เสียงครืดคราด*"
 tournament_events.6014.a:0 "นั่นมัน... ไม่... #EMP [murder_actor.GetFirstNameNoTooltip]#!!"

 tournament_events.6050.t:1 "$tournament_contest_header$ การก่อวินาศกรรม"
 tournament_events.6050.desc:0 "ข้าสาบานกับตัวเองว่าจะชนะการแข่งขันในงานประลองนี้ และข้าอดไม่ได้ที่จะพิจารณาวิธีการที่ไม่... #EMP 'ยุติธรรม'#! เพื่อให้ได้รางวัลจากการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l]\n\nข้ามั่นใจว่าคู่ต่อสู้ของข้าก็จะทำ เช่นเดียวกัน หากพวกเขามีความคิด - ใครจะรู้ บางทีพวกเขาอาจจะทำไปแล้วก็ได้?"
