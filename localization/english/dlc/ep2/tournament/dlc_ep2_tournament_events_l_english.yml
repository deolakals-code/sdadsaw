l_english: 
 ##### TOURNAMENT #####

 tournament_events.0050.t:0 "การมาถึงงานประลอง"
 tournament_events.0050.desc:0 "ข้ามาถึงสถานที่จัดงานประลองแล้ว ณ [activity.GetCurrentPhase.GetLocation.GetName]!\n\nแม้ผู้ร่วมงานยังมาไม่ครบ แต่ฝูงชนมากมายเดินขวักไขว่ท่ามกลางบรรยากาศอันมีสีสัน ทุกคนต่างตั้งตารอชมการแสดงทักษะและความสามารถที่จะมีขึ้น\n\n"
 tournament_events.0050.murder:0 "สำหรับข้าแล้ว มีความทะเยอทะยานที่ยิ่งใหญ่กว่าเพียงแค่การหาความสำราญ หากข้าดำเนินแผนการได้ถูกต้อง [starting_intent.GetFirstName] จะไม่มีชีวิตรอดไปจนถึงพิธีปิด..."
 tournament_events.0050.seduce:0 "ภารกิจแรกสุดสำหรับข้า แน่นอนว่าคือการเอาชนะใจของ [starting_intent.GetFirstName]!"
 tournament_events.0050.befriend:0 "จะมีสภาพแวดล้อมใดที่ดีไปกว่านี้ในการสร้างมิตรภาพอันแน่นแฟ้นกับ [starting_intent.GetFirstName]!"
 tournament_events.0050.win:0 "ไม่มีเวลาให้เสียเปล่า ข้าต้องเริ่มเตรียมตัว! ข้าต้องเป็นผู้ชนะ ไม่ว่าจะต้องแลกด้วยอะไรก็ตาม!"
 tournament_events.0050.recruit:0 "ข้าเห็นผู้ที่มีแววเหมาะสมจะเข้าร่วมกองทัพ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้ามากมายแล้ว!"
 tournament_events.0050.relax:0 "มีสถานที่ไม่กี่แห่งที่จะยอดเยี่ยมเท่าการประลองในการผ่อนคลายความเครียดและหาความสำราญ และข้าตั้งใจจะใช้ประโยชน์จากมันอย่างเต็มที่!"
 tournament_events.0050.a:0 "ข้ารอให้มันเริ่มไม่ไหวแล้ว!"

 # START
 tournament_events.0100.t:1 "$tournament_header$ พิธีเปิด"
 tournament_events.0100.desc:0 "ในที่สุดงานประลองก็มาถึง!\n\n"
 tournament_events.0100.host:0 "ผู้คนมากมายหลั่งไหลมายังอาณาเขตของข้าใน [activity.GetCurrentPhase.GetLocation.GetName] กระตือรือร้นที่จะพิสูจน์คุณค่าของตนหรือเพียงแค่เพลิดเพลินกับการชม"
 tournament_events.0100.contestant:0 "เช่นเดียวกับคนอื่นๆ ที่หลั่งไหลมายัง [activity.GetCurrentPhase.GetLocation.GetName] รอคอยการแข่งขันที่จะมาถึงอย่างใจจดใจจ่อ ข้าก็กำลังยุ่งอยู่กับการเข้าสังคมและเตรียมอุปกรณ์ของข้า"
 tournament_events.0100.spectator:0 "ผู้คนมากมายหลั่งไหลมายังอาณาเขตของ [host.GetTitledFirstNamePossessive] ใน [activity.GetCurrentPhase.GetLocation.GetName] ทั้งเพื่อแข่งขัน และ เช่นเดียวกับข้า เพื่อรับความบันเทิง"
 tournament_events.0100.closing:1 "\n\nดวงอาทิตย์ลอยสูงขึ้นบนท้องฟ้า และเงาก็สั้นลง หากข้าจะเข้าแข่งขันในรายการ [activity.GetCurrentPhase.GetPhase.GetName] ข้าต้องแน่ใจว่าจะผ่านเข้ารอบ มันจะเริ่มในไม่ช้า"
 tournament_events.0100.a:0 "ไม่มีเวลาให้เสียเปล่า!"

 # END
 tournament_events.0150.t:1 "$tournament_header$ บทสรุป"
 tournament_events.0150.desc:0 "ดวงอาทิตย์ลับขอบฟ้าในวันสุดท้ายของงานประลอง และฝูงชนเริ่มแยกย้าย ข้าครุ่นคิดถึงผลลัพธ์:\n\n"
 tournament_events.0150.melee:0 "ทีมของ [melee_winner.GetTitledFirstNamePossessive|U] เป็นผู้ชนะในการประลองแบบตะลุมบอน\n"
 tournament_events.0150.melee_self:0 "ทีมของข้าเป็นผู้ชนะในการประลองแบบตะลุมบอน\n"
 tournament_events.0150.archery:0 "[archery_winner.GetTitledFirstName|U] มีฝีมือยิงธนูยอดเยี่ยมที่สุดในการแข่งขันยิงธนู\n"
 tournament_events.0150.archery_self:0 "ข้ามีฝีมือยิงธนูยอดเยี่ยมที่สุดในการแข่งขันยิงธนู\n"
 tournament_events.0150.recital:0 "ความเชี่ยวชาญในบทกวีของ [recital_winner.GetTitledFirstNamePossessive|U] ทำให้พวกเขาเป็นผู้ชนะที่คู่ควรในการประกวดบทกวี\n"
 tournament_events.0150.recital_self:0 "ความเชี่ยวชาญในบทกวีของข้า ทำให้ข้าเป็นผู้ชนะที่คู่ควรในการประกวดบทกวี\n"
 tournament_events.0150.joust:0 "[joust_winner.GetTitledFirstName|U] หักทวนนับไม่ถ้วนเพื่อพิสูจน์ฝีมือในการประลองทวนบนหลังม้า\n"
 tournament_events.0150.joust_self:0 "ข้าหักทวนนับไม่ถ้วนเพื่อพิสูจน์ฝีมือในการประลองทวนบนหลังม้า\n"
 tournament_events.0150.wrestling:0 "[wrestling_winner.GetTitledFirstName|U] เป็นคู่ต่อสู้ที่ไม่อาจต้านทานได้และคว้าอันดับหนึ่งในการแข่งขันมวยปล้ำ\n"
 tournament_events.0150.wrestling_self:0 "ข้าเป็นคู่ต่อสู้ที่ไม่อาจต้านทานได้และคว้าอันดับหนึ่งในการแข่งขันมวยปล้ำ\n"
 tournament_events.0150.duel:0 "ความเหนือชั้นด้านเพลงดาบของ [duel_winner.GetTitledFirstNamePossessive|U] ทำให้พวกเขาคว้ารางวัลในการประลองดาบ\n"
 tournament_events.0150.duel_self:0 "ความเหนือชั้นด้านเพลงดาบของข้า ทำให้ข้าคว้ารางวัลในการประลองดาบ\n"
 tournament_events.0150.board_game:0 "สติปัญญาอันเฉียบแหลมของ [board_game_winner.GetTitledFirstNamePossessive|U] เอาชนะคู่ต่อสู้ทั้งหมดและชนะการแข่งขันเกมกระดาน\n"
 tournament_events.0150.board_game_self:0 "สติปัญญาอันเฉียบแหลมของข้าเอาชนะคู่ต่อสู้ทั้งหมดและชนะการแข่งขันเกมกระดาน\n"
 tournament_events.0150.horse_race:0 "ม้าของ [horse_race_winner.GetTitledFirstNamePossessive|U] เข้าเส้นชัยเป็นอันดับแรกในการแข่งม้า\n"
 tournament_events.0150.horse_race_self:0 "ม้าของข้าเข้าเส้นชัยเป็นอันดับแรกในการแข่งม้า\n"
 tournament_events.0150.murdersuccess:1 "\n[finishing_intent.GetFirstName] ได้รับจุดจบอันสมควรแล้ว\n"
 tournament_events.0150.murderfailure:1 "\n[finishing_intent.GetFirstName] หนีรอดเงื้อมมือข้าไปได้ในครั้งนี้\n"
 tournament_events.0150.seducesuccess:1 "\nการเกลี้ยกล่อมทางกายของข้าต่อ [finishing_intent.GetFirstName] ประสบความสำเร็จ\n"
 tournament_events.0150.seducefailure:1 "\n[finishing_intent.GetFirstName] ต่อต้านการเกลี้ยกล่อมทางกายของข้า\n"
 tournament_events.0150.befriendsuccess:1 "\n[finishing_intent.GetFirstName] และข้ากลายเป็นมิตรสหายที่ดีต่อกัน!\n"
 tournament_events.0150.befriendfailure:2 "\n[finishing_intent.GetFirstName] และข้ายังไม่ได้สร้างมิตรภาพอันแน่นแฟ้น\n"
 tournament_events.0150.winsuccess:1 "\nข้าบรรลุเป้าหมายในการชนะการแข่งขัน!\n"
 tournament_events.0150.winfailure:1 "\nข้าไม่สามารถชนะการแข่งขันได้\n"
 tournament_events.0150.knightsuccess:2 "\nข้าเสริมกำลังพลให้แก่กองทัพ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้า\n"
 tournament_events.0150.knightfailure:2 "\nข้าไม่สามารถหาผู้ที่มีคุณสมบัติเหมาะสมเข้าร่วมกองทัพ [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ของข้าได้\n"
 tournament_events.0150.end:1 "\nข้าตั้งตารอคอยครั้งต่อไป!"
 tournament_events.0150.a:0 "ช่างเป็นโอกาสอันยอดเยี่ยม!"
 tournament_events.0150.b:0 "บางทีอาจกล่าวสักสองสามคำ ในฐานะที่ข้าเป็นเจ้าภาพ..."
 tournament_events.0150.c:0 "[tournament_champion.GetFirstNameNoTooltip] สมควรได้รับรางวัลพิเศษสำหรับชัยชนะของ [tournament_champion.GetHerHis]!"
 tournament_events.0150.b.success:0 "คำพูดของท่านนำมา ซึ่งเสียงชื่นชม"
 tournament_events.0150.b.failure:0 "ไม่มีใครให้ความสนใจมากนัก"
 tournament_events.0150.legendseeddrop: "\nเป็นครั้งที่สามแล้วที่ข้าชนะการแข่งขัน เรื่องราวความสำเร็จของข้ากำลังแพร่กระจายไปไกล\n"

 tournament_events.0160.t:0 "$tournament_header$ ของรางวัล"
 tournament_events.0160.desc:0 "การแข่งขันสิ้นสุดลงแล้ว และรางวัลที่ข้าประกาศไว้คือการมอบมือของ [marriage_prize.GetTitledFirstNamePossessive] ให้แก่ผู้ชนะที่คู่ควรนั้น เหล่าผู้เข้าแข่งขัน — หรือ [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)] ของข้า... ก็ยังไม่ลืม\n\n"
 tournament_events.0160.a:0 "ดูเหมือนว่าข้าชนะเจ้าด้วยตัวเองนะ [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)]!"
 tournament_events.0160.b:0 "ขอแสดงความยินดีด้วย [bachelor_1.GetFirstNameNoTooltip]!"
 tournament_events.0160.c:0 "[bachelor_2.GetFirstNameNoTooltip] จะเป็น [marriage_prize.Custom('GetBrideGroom')] ที่ดี [bachelor_2.GetFirstNameNoTooltip]!"
 tournament_events.0160.d:0 "ดูแล [marriage_prize.GetHerHim] ให้ดีนะ [bachelor_3.GetFirstNameNoTooltip]!"
 tournament_events.0160.e:0 "ข้า... เปลี่ยนใจแล้ว"
 tournament_events.0160.f:0 "ข้าไม่ได้หมายถึงตัวเอง..."
 tournament_events.0160.g:0 "เอาเถอะ..."

 tournament_events.0161.desc:0 "การแข่งขันสิ้นสุดลงแล้ว และรางวัลที่ [host.GetTitledFirstNamePossessive] ประกาศไว้คือการมอบมือของ [marriage_prize.GetTitledFirstNamePossessive] ให้แก่ผู้ชนะที่คู่ควรนั้น เหล่าผู้เข้าแข่งขัน — หรือ [host.GetHerHis] [ROOT.Char.Custom2('RelationToMeShort', marriage_prize)]... ก็ยังไม่ลืม\n\n"
 tournament_events.0161.a:0 "มาเถิด ที่รัก!"
 tournament_events.0161.b:0 "น่าโมโหสิ้นดี"
 tournament_events.0161.c:0 "เอาเถอะ..."
 # ACCIDENT PING
 tournament_events.0701.t:1 "$tournament_contest_header$ อุบัติเหตุ"
 tournament_events.0701.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', accident_victim)] ของท่าน [accident_victim.GetName] เสียชีวิตจากอุบัติเหตุคทาประหลาดระหว่างการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l]!"
 tournament_events.0701.a:0 "น่าเศร้าสลด..."
 tournament_accident_death_msg_title:0 "การเสียชีวิตจากอุบัติเหตุ"

 # CONTESTANT INVALIDATION
 tournament_events.0800.t:1 "$tournament_contest_header$ การถอนตัว"
 tournament_events.0800.wounded:0 "ข้าเกรงว่าบาดแผลของข้ารุนแรงเกินกว่าจะแข่งขันต่อไปได้ ข้าคงทำผลงานได้ไม่ดีในสภาพนี้ และไม่ควรเสี่ยงต่อการบาดเจ็บเพิ่มเติม..."
 tournament_events.0800.disease:0 "ข้าเกรงว่าอาการป่วยของข้ารุนแรงเกินกว่าจะแข่งขันต่อไปได้ ข้าคงทำผลงานได้ไม่ดีในสภาพนี้ และไม่ควรท้าทายความพิโรธของหมอ..."
 tournament_events.0800.health:0 "ข้าเกรงว่าธาตุในกายของข้าจะจำกัดข้าจากการแข่งขันต่อไป ข้าคงทำผลงานได้ไม่ดีในสภาพนี้ และไม่ควรท้าทายความพิโรธของหมอ..."
 tournament_events.0800.a:0 "ข้าไปต่อไม่ไหว"
 tournament_events.0800.b:0 "ไม่มีทาง ข้าทำได้!"

 tournament_events.0801.t:0 "$tournament_events.0800.t$"
 tournament_events.0801.desc:0 "[contest_withdrawal.GetTitledFirstName] ได้ถอนตัวจากการแข่งขันอย่างเป็นทางการแล้ว"
 tournament_events.0801.wounded:0 "ดูเหมือนว่าบาดแผลของ [contest_withdrawal.GetHerHis] รุนแรงเกินกว่าจะเสี่ยงแข่งขันต่อไป"
 tournament_events.0801.disease:0 "ดูเหมือนว่าอาการป่วยของ [contest_withdrawal.GetHerHis] รุนแรงเกินกว่าจะแข่งขันต่อไป"
 tournament_events.0801.health:0 "ดูเหมือนว่าธาตุในกายของ [contest_withdrawal.GetHerHis] ไม่สมดุลเกินกว่าจะแข่งขันต่อไป"
 tournament_events.0801.a:0 "น่าเสียดาย"

 # WAGERING
 tournament_events.1000.t:1 "$tournament_contest_header$ วางเดิมพัน"
 tournament_events.1000.desc:0 "ข้ามองเจ้ามือรับแทงใต้แสงสลัวของโรงเตี๊ยม พลางครุ่นคิดถึงอัตราต่อรองที่เขาตะโกนข้ามหัวเหล่านักพนันที่เดินขวักไขว่\n\n"
 tournament_events.1000.horse_race:0 ""[wager_top_contestant.Custom('ContestHorseRaceGender')] ของ [wager_top_contestant.GetTitledFirstNamePossessive] #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#! เป็นตัวเต็ง! สี่ต่อหนึ่งสำหรับ #EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#!!""
 tournament_events.1000.fallback:0 ""[wager_top_contestant.GetTitledFirstName] เป็นตัวเต็งของ [activity.GetCurrentPhase.GetPhase.GetName]! สี่ต่อหนึ่งสำหรับ [wager_top_contestant.GetNameNoTooltip]!""
 tournament_events.1000.a:0 "ชิ ข้าจะเดิมพันตัวเอง!"
 tournament_events.1000.a.horse:0 "ม้าที่ดีที่สุดของข้า #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! ชนะได้"
 tournament_events.1000.a.best_horse:0 "ใช่ #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! จะชนะ!"
 tournament_events.1000.b:0 "[wager_top_contestant.GetFirstNameNoTooltip] เป็นเดิมพันที่ปลอดภัย"
 tournament_events.1000.b.horse:0 "#EMP [wager_top_contestant.Custom('GetContestHorseRaceName')]#! เป็นเดิมพันที่ปลอดภัยจริงๆ"
 tournament_events.1000.c:0 "แต่ ทว่า [wager_second_contestant.GetFirstNameNoTooltip] ก็เป็นอันดับสองที่สูสี"
 tournament_events.1000.c.horse:0 "แต่ ทว่า '[wager_second_contestant.Custom('GetContestHorseRaceName')]' ของ [wager_second_contestant.GetFirstNamePossessiveNoTooltip] ก็เป็นอันดับสองที่สูสี"
 tournament_events.1000.d:0 "ยอดฝีมือของข้า [wager_champion_contestant.GetFirstNameNoTooltip] จะได้รับชัยชนะ!"
 tournament_events.1000.e:0 "หืม [wager_underdog_contestant.GetFirstNameNoTooltip] เป็นม้านอกสายตาที่ไม่น่าเป็นไปได้"
 tournament_events.1000.e.horse:0 "#EMP [wager_underdog_contestant.Custom('GetContestHorseRaceName')]#! ของ [wager_underdog_contestant.GetFirstNamePossessiveNoTooltip] เป็นม้านอกสายตาที่ไม่น่าเป็นไปได้"
 tournament_events.1000.f:0 "ข้าจะได้อัตราต่อรองเท่าไหร่สำหรับ [ROOT.Char.Custom2('RelationToMeShort', wager_flavor_contestant)] ของข้า [wager_flavor_contestant.GetFirstNameNoTooltip]?"
 tournament_events.1000.f.horse:0 "ข้าจะได้อัตราต่อรองเท่าไหร่สำหรับม้าของ [ROOT.Char.Custom2('RelationToMePossessive', wager_flavor_contestant)] ข้า #EMP [wager_flavor_contestant.Custom('GetContestHorseRaceName')]#!?"
 tournament_events.1000.g:0 "ข้ารู้สึกดีเกี่ยวกับ '[mysterious_stranger.GetFirstNameNoTooltip] แห่ง [attending_barony.GetNameNoTierNoTooltip]'"
 tournament_events.1000.g.horse:0 "ข้ารู้สึกดีเกี่ยวกับ #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#! ของ [mysterious_stranger.GetFirstNamePossessiveNoTooltip]"
 tournament_events.1000.h:0 "ไม่ นี่เป็นความคิดที่ไม่ดี..."

