 # PASSAGE OF ARMS
 tournament_events.1100.t:1 "การท้าประลองผ่านทาง"
 tournament_events.1100.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)] ของข้า [pas_darmes_instigator.GetFullName] กระสับกระส่ายขณะรอการแข่งขันเริ่ม หรือเพียงแค่อยากแสดงฝีมือของ [pas_darmes_instigator.GetHerHis] จึงได้ประกาศ 'การท้าประลองผ่านทาง' ที่ชานเมือง [activity.GetCurrentPhase.GetLocation.GetName]\n\n"#EMP หาก [pas_darmes_instigator.Custom('MountedWarriorTerm')] ผู้มีร่างกายสมบูรณ์คนใดต้องการผ่านทาง จงเผชิญหน้ากับข้า หรือไม่ก็จงอัปยศ!#!"\n\nว่ากันว่า [pas_darmes_instigator.GetSheHe] เก็บเดือยรองเท้าของผู้ที่ [pas_darmes_instigator.GetSheHe] เอาชนะได้ทุกคน และสตรีใดที่ต้องการผ่านทางโดยไม่มีผู้คุ้มกันต้องทิ้งของที่ระลึกไว้ เพื่อให้นางส่งคนมาเอาคืนในภายหลัง"
 tournament_events.1100.a:0 "นี่สิถึงจะเป็น #EMP [ROOT.Char.Custom('MountedWarriorTerm')]#! อย่างแท้จริง!"
 tournament_events.1100.b:0 "น่าสนุกอะไร เช่นนี้!"
 tournament_events.1100.c:0 "ข้าต้องไปดู [pas_darmes_instigator.GetWomanMan] ผู้นี้!"
 tournament_events.1100.d:0 "เรื่องโง่เขลา เช่นนี้เป็นสิ่งต้องห้าม"
 pas_darmes_token_claim_tt:0 "ทุกคนที่เป็น [spouse|E] บิดามารดา และ [child|E] ของ [pas_darmes_victim.GetName]"

 tournament_events.1101.t:0 "$tournament_events.1100.t$"
 tournament_events.1101.desc:0 "ไม่ต้องสงสัยเลยว่าถูกดึงดูดมายังการแข่งขันของข้าด้วยคำมั่นสัญญาแห่งเกียรติยศและคู่ต่อสู้จำนวนมาก [pas_darmes_instigator.Custom('MountedWarriorTerm')]ชาวต่างชาติได้ประกาศ 'การผ่านแดนด้วยอาวุธ' ใกล้กับ[activity.GetCurrentPhase.GetLocation.GetName]\n\n[pas_darmes_instigator.GetSheHe|U] เรียก[pas_darmes_instigator.GetHerselfHimself]ว่า '[pas_darmes_instigator.GetFullName]' และอ้างว่ามาจากดินแดน[exotic_origin.GetDeJureLiege.GetAdjectiveNoTooltip]อันห่างไกล [ROOT.Char.Custom('MountedWarriorTerm')]คนใดก็ตามที่ต้องการผ่านค่ายของ[pas_darmes_instigator.GetHerHis]จะต้องประลองทวนกับ[pas_darmes_instigator.GetHerHim] - มิฉะนั้นจะต้องสละศักดิ์ศรีของตน\n\nการถูกปฏิบัติ เช่นนี้โดยนักผจญภัยชาวต่างชาติย่อมสร้างความโกรธเคืองให้กับขุนนางชาว[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]อย่างแน่นอน"
 tournament_events.1101.a:0 "ดีแล้ว นักสู้ของเราต้องตื่นตัวอยู่เสมอ"
 tournament_events.1101.b:0 "ข้าไม่คิด เช่นนั้น ขับไล่คนพเนจรผู้นี้ออกไป"
 tournament_events.1101.c:1 "นั่นคือ $knight_culture_player_no_tooltip_lowercase$ ที่แท้จริง! ช่างเป็นแรงบันดาลใจ!"

 tournament_events.1102.t:0 "$tournament_events.1100.t$"
 tournament_events.1102.desc:0 "ด้วยความกระตือรือร้นที่จะพิสูจน์[pas_darmes_instigator.GetHerselfHimself] [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)]ของข้า [pas_darmes_instigator.GetFullName] ได้ประกาศ 'การผ่านแดนด้วยอาวุธ' ปิดกั้นเส้นทางหลักเข้าสู่[activity.GetCurrentPhase.GetLocation.GetName]\n\n[pas_darmes_instigator.GetSheHe|U] มาพร้อมกับ[ROOT.Char.Custom2('RelationToMeShort', pas_darmes_2)]ของข้า [pas_darmes_2.GetFullName] และกลุ่มขุนนางชั้นผู้น้อยชาว[pas_darmes_instigator.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]ที่มีบางอย่างต้องพิสูจน์\n\nข้าได้รับแจ้งว่าพวกเขาได้ประกาศคำสาบานว่าจะหักทวนสามร้อยเล่มก่อนที่พวกเขาจะถือว่าภารกิจของพวกเขาเสร็จสมบูรณ์"
 tournament_events.1102.a:0 "ขอให้พวกเขาโชคดี"
 tournament_events.1102.a.tt:0 "การท้าประลองผ่านทางใน [activity.GetCurrentPhase.GetLocation.GetName] จะดำเนินต่อไป"
 tournament_events.1102.b:0 "ไม่อยู่ใน [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] #EMP ของข้า#!"
 tournament_pas_darmes_forbidden_tt:0 "การท้าประลองผ่านทางใน [activity.GetCurrentPhase.GetLocation.GetName] จะสิ้นสุดลง"

 tournament_events.1120.t:2 "ได้มาอย่างยากลำบาก"
 tournament_events.1120.desc:0 "[pas_darmes_instigator.GetTitledFirstName] [pas_darmes_instigator.Custom('MountedWarriorTerm')] ผู้โอ้อวด ซึ่งเฝ้าทางผ่านของ [pas_darmes_instigator.GetHerHis] โดยท้าทายทุกคนที่เข้ามา ได้ต่อสู้มากเกินไปหนึ่งครั้ง\n\nว่ากันว่า [pas_darmes_victim.GetTitledFirstName] ได้ ทำให้ [pas_darmes_victim.GetHerHim] ได้รับบาดเจ็บสาหัส เปิดทางให้เหล่าขุนนางผ่านไปได้อย่างอิสระอีกครั้ง"
 tournament_events.1120.a:0 "นี่คือความเสี่ยงของชีวิตอันกล้าหาญ"
 tournament_events.1120.a.dead:0 "เป็นการจากไปอย่างมีเกียรติ"

 tournament_events.1130.opening:0 "[pas_darmes_victim.Custom2('AppropriateGreeting', ROOT.Char)]"
 tournament_events.1130.desc:0 "ขณะเดินทางไปยัง [activity.GetCurrentPhase.GetLocation.GetName] พร้อมกับคนรับใช้ของข้า [pas_darmes_instigator.GetFullName] ได้หยุดขบวนของเราและเรียกร้องของที่ระลึกส่วนตัวอย่างอุกอาจ...\n\nข้าไม่มีทางเลือกอื่นนอกจากมอบของที่ระลึกบ้าๆ นั่นให้ [pas_darmes_instigator.GetHerHim]... [pas_darmes_instigator.GetSheHe|U] บอกว่าหากข้าต้องการมันคืน ข้าต้องส่งผู้ท้าชิงไปหา [pas_darmes_instigator.GetHerHis]"
 tournament_events.1130.a:0 "ต้องทำอะไรสักอย่างแล้ว"

 tournament_events.1140.t:2 "ศักดิ์ศรีของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 tournament_events.1140.desc:0 "ขณะที่ข้าขี่ม้าสูดอากาศ ชื่นชมความคึกคักของ [activity.GetCurrentPhase.GetLocation.GetName] ข้าเห็นนักสู้ผู้โอ้อวดคนนั้น '[pas_darmes_instigator.GetFullName]' กำลังปกป้องค่าย 'การท้าประลองผ่านทาง' ของ [pas_darmes_instigator.GetHerHis]\n\n"
 tournament_events.1140.skilled:0 "ผู้ท้าชิงที่น่าสมเพชบางคนเดินโซซัดโซเซไปตามถนนขณะที่[pas_darmes_instigator.Custom('MountedWarriorTerm')]กลับไปยังที่นั่งของ[pas_darmes_instigator.GetHerHis]อย่างพึงพอใจ ชื่นชมเดือยที่[pas_darmes_instigator.GetSheHe]เพิ่งเก็บมาได้\n\n"
 tournament_events.1140.unskilled:0 "[pas_darmes_instigator.Custom('MountedWarriorTerm')] ที่พึงพอใจอย่างยิ่งเดินผ่านข้าไป โค้งคำนับแสดงความเคารพ ขณะที่ [pas_darmes_instigator.GetFirstNameNoTooltip] เฝ้ามองจากที่นั่งของ [pas_darmes_instigator.GetHerHis] เห็นได้ชัดว่าเจ็บปวดจากความพ่ายแพ้\n\n"
 tournament_events.1140.wounded:0 "บอบช้ำและฟกช้ำ [pas_darmes_instigator.GetSheHe] ทำหน้าบูดบึ้งด้วยความเจ็บปวดของ[pas_darmes_instigator.GetHerHis]ขณะที่ข้าเข้าใกล้ "ท่านไม่สามารถชนะได้ทั้งหมดหรอก" [pas_darmes_instigator.GetSheHe] หัวเราะเบาๆ หรี่ตามองข้า"
 tournament_events.1140.fallback:0 "[pas_darmes_instigator.GetSheHe|U] กระโดดลุกขึ้นเมื่อ [pas_darmes_instigator.GetSheHe] เห็นข้า กระตือรือร้นที่จะต่อสู้อีกครั้ง แต่ก็ตระหนักได้อย่างรวดเร็วว่าข้าเป็นใคร [pas_darmes_instigator.GetFirstNameNoTooltip] หรี่ตามองข้าพลางยิ้ม แล้วโค้งคำนับ "ยินดีที่ได้พบ [ROOT.Char.Custom('FormOfAddressForLiege')] แห่ง [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].""
 tournament_events.1140.a:0 "ให้ข้าแสดงให้เจ้าดูว่า #EMP [ROOT.Char.GetTitleAsNameNoTooltip|l]#! ประลองทวนอย่างไร"
 tournament_events.1140.a.wounded:0 "และเจ้าก็จะไม่ชนะครั้งนี้ เช่นกัน"
 tournament_events.1140.a.success:0 "ท่านเอาชนะ [pas_darmes_instigator.GetNameNoTooltip]"
 tournament_events.1140.a.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] เอาชนะท่าน"
 tournament_events.1140.b:0 "เจ้าเป็นนักรบผู้ยิ่งใหญ่ ข้าต้องการเจ้า"
 tournament_events.1140.b.success:0 "ท่านโน้มน้าว [pas_darmes_instigator.GetNameNoTooltip] ได้สำเร็จ"
 tournament_events.1140.b.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] ปฏิเสธข้อเสนอของท่าน"
 tournament_events.1140.c:0 "ข้าคิดว่าพอแล้ว"
 tournament_events.1140.d:0 "ทำต่อไป!"

 tournament_events.1141.t:0 "$tournament_events.1140.t$"
 tournament_events.1141.desc:0 "กลุ่มผู้มุงดูรวมตัวกันขณะที่[pas_darmes_instigator.GetFirstName]และข้าขึ้นม้า เข้าประจำตำแหน่ง โดยไม่ลังเล [pas_darmes_instigator.GetSheHe]ก็พุ่งเข้าใส่ทันที ลดทวนลง ท่ามกลางฝุ่นตลบและเสียงกีบม้าดังกึกก้อง!\n\nข้าควบม้าไปข้างหน้า จดจ่อความสนใจทั้งหมดไปที่ปลายทวนที่แกว่งไปมา ซึ่งพุ่งเข้ามาหา[pas_darmes_instigator.GetHerHim]"
 tournament_events.1141.win:0 "\n\nด้ามทวนของข้าแตกละเอียดกระทบโล่ของ [pas_darmes_instigator.GetHerHis] พร้อมเสียงดังสนั่น ส่งผลให้ [pas_darmes_instigator.GetHerHim] เอนหลังบนอานม้าขณะที่ข้าควบผ่านไป"
 tournament_events.1141.lose:0 "\n\nข้ารู้สึกถึงด้ามทวนของ [pas_darmes_instigator.GetHerHis] แตกละเอียดกระทบโล่ของข้าพร้อมเสียงดังสนั่น ส่งผลให้ข้าเอนหลังบนอานม้าขณะที่ [pas_darmes_instigator.GetSheHe] ควบผ่านไป"
 tournament_events.1141.kill_me:0 "\n\nใบหน้าของข้าพลันรู้สึกร้อนและเปียกชื้น ข้าพยายามพูด แต่แทบจะลืมตาไม่ขึ้น ใบหน้าที่กังวลของ [pas_darmes_instigator.GetFirstNamePossessiveNoTooltip] ลอยเข้ามาในสายตาขณะที่โลกรอบตัวดับมืดลง..."
 tournament_events.1141.beat_me:0 "\n\n[pas_darmes_instigator.GetSheHe|U] ดึงข้าให้ลุกขึ้น ปัดเศษไม้จากเกราะของข้า "เจ้าสู้ได้ดี - แต่เจ้าแพ้" [pas_darmes_instigator.GetSheHe|U] ยิ้ม ยื่นมือออกมา"
 tournament_events.1141.kill_them:0 "\n\nเมื่อถึงจุดสิ้นสุดของการวิ่ง ข้านำม้าของข้ากลับมาพร้อมรอยยิ้ม มองหา[pas_darmes_sinstigator.GetFirstNameNoTooltip] ข้าเห็นร่างที่เหยเกของ[pas_darmes_instigator.GetHerHis]คว่ำหน้าอยู่ในฝุ่น ม้ากำลังคลอเคลียอยู่ที่เท้าของ[pas_darmes_instigator.GetHerHis]"
 tournament_events.1141.beat_them:0 "\n\nข้ารีบวนกลับไป ดึง [pas_darmes_instigator.GetHerHim] ให้ลุกขึ้นและตรวจดูบาดแผล "ข้าไม่เป็นไร" [pas_darmes_instigator.GetHerHis] คำราม "นี่ เดือยรองเท้าของข้า""
 tournament_events.1141.a:0 "แค่รอยถลอก..."
 tournament_events.1141.a.death:0 "#weak *เสียงครืดคราด*#!"
 tournament_events.1141.b:0 "ข้าบอกแล้วว่าจะแสดงให้เจ้าดู!"
 tournament_events.1141.b.death:0 "[pas_darmes_instigator.GetFirstNameNoTooltip]? #EMP [pas_darmes_instigator.GetFirstNameNoTooltip]?!#!"

 tournament_events.1150.t:1 "$tournament_header$ การกอบกู้เกียรติยศ"
 tournament_events.1150.desc:0 "[pas_darmes_instigator.GetTitledFirstName] นั่งอยู่ข้างถนน ลับคมดาบของ [pas_darmes_instigator.GetHerHis] ขณะที่ข้าเข้าใกล้ค่ายอันซอมซ่อของ [pas_darmes_instigator.GetHerHis]\n\n"อา ข้าสงสัยอยู่ว่าเมื่อไหร่ท่านจะมา ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ที่เคารพ" [pas_darmes_instigator.GetSheHe] ยิ้มเยาะ ดึงเสื้อผ้าชิ้นหนึ่งออกจากเข็มขัดของ [pas_darmes_instigator.GetHerHis] "มาเพื่อชิงสิ่งนี้คืนสินะ ข้าเดา?"\n\n"
 tournament_events.1150.skilled:0 "ข้าทราบดีถึงชื่อเสียงด้านการต่อสู้ของ [pas_darmes_instigator.GetWomanMan] ผู้นี้ แต่ความหยิ่งผยองของ [pas_darmes_instigator.GetHerHis] จะเป็นเหตุให้ [pas_darmes_instigator.GetHerHis] พินาศ"
 tournament_events.1150.unskilled:0 "[pas_darmes_instigator.GetWomanMan] ผู้นี้เป็นที่รู้กันว่ามีความกล้าบ้าบิ่นมากกว่าฝีมือ แต่ข้าก็ไม่ควรประมาท [pas_darmes_instigator.GetHerHim]"
 tournament_events.1150.wounded:0 "อย่างไรก็ตาม บาดแผลของ [pas_darmes_instigator.GetHerHis] ย่อม ทำให้ข้าได้เปรียบอย่างแน่นอน..."
 tournament_events.1150.fallback:0 "เกียรติยศของข้าถูกท้าทายโดยเพียงแค่ [ROOT.Char.Custom('MountedWarriorTerm')]..."
 tournament_events.1150.a:0 "มาเถิด มาประลองทวนกัน"
 tournament_events.1150.a.wounded:0 "ข้าจะมอบบาดแผลให้อีกแผล: แผลที่จะ ทำให้เจ้าจดจำ #EMP ข้า#! ไปตลอดกาล"
 tournament_events.1150.a.success:0 "ท่านเอาชนะ [pas_darmes_instigator.GetTitledFirstNameNoTooltip]"
 tournament_events.1150.a.failure:0 "[pas_darmes_instigator.GetTitledFirstNameNoTooltip] เอาชนะท่าน"
 tournament_events.1150.b:0 "เก็บเศษผ้าของเจ้าไว้เถิด ท่าน [pas_darmes_instigator.Custom('MountedWarriorTerm')] ผู้ประเสริฐ"
 # FLAVOR
 tournament_events.1200.t:2 "การตำหนิทางศาสนา"
 tournament_events.1200.desc:0 "ขณะที่เหล่าขุนนางและสามัญชนเตรียมตัวอย่างตื่นเต้นสำหรับการแข่งขันและความบันเทิงที่กำลังจะมาถึง [angry_clergy.GetTitledFirstName] แสดงความไม่พอใจของเหล่า [angry_clergy.GetFaith.AltPriestTermPlural] อย่างชัดเจน\n\n"งานประลองนี้เป็นพาหนะแห่งบาป; ชาว [angry_clergy.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดีจะตายในการแสวงหาความภาคภูมิใจ; หลั่งเลือดของกันและกันเพื่อของประดับเล็กน้อย; ละทิ้ง [angry_clergy.GetFaith.PositiveAfterLife] เพื่อชื่อเสียง"\n\n"ความโน้มเอียงเหล่านี้ควรถูกควบคุม หันไปต่อสู้กับศัตรูของ [angry_clergy.GetFaith.HighGodNamePossessive] ไม่ใช่ถูกโหมกระพือและดับลงด้วยความทะนงตน""
 tournament_events.1200.a:0 "พวกเขาปกป้องชาว [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] ไม่ได้หากไม่มีการฝึกฝน!"
 tournament_events.1200.a.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] เชื่อแล้ว"
 tournament_events.1200.a.failure:0 "ท่านเปลี่ยนใจ [angry_clergy.GetTitledFirstNamePossessiveNoTooltip] ไม่ได้"
 tournament_events.1200.b:0 "จากที่นั่งของข้า ท่านจะเห็นคุณธรรมของการแข่งขัน"
 tournament_events.1200.b.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] ยอมรับแล้ว"
 tournament_events.1200.b.failure:0 "[angry_clergy.GetTitledFirstNameNoTooltip] ดูถูกดูแคลน"
 tournament_events.1200.c:0 "เป็นประเด็นที่ดี ข้าจะไม่เข้าแข่งขัน"
 tournament_events.1200.d:0 "โอ้ พอเถอะ ท่าน [angry_clergy.GetFaith.PriestNeuter] ปล่อยให้พวกเขาสนุกเถิด"
 tournament_events.1230.t:2 "จากผ้าขี้ริ้วสู่เสื้อเกราะ"
 tournament_events.1230.desc:0 "ขณะที่ข้าเดินตรวจตราบริเวณงานประลอง ซึมซับบรรยากาศและวิเคราะห์เทคนิคของผู้เข้าแข่งขันที่กำลังฝึกซ้อม [battle_peasant.GetWomanMan] คนหนึ่งสะดุดตาข้า\n\nทุกการเคลื่อนไหวของ [battle_peasant.GetHerHis|U] เปี่ยมไปด้วยความสง่างาม ประสิทธิภาพ และความสมดุล จัดการหุ่นฟางและคู่ซ้อมได้อย่างง่ายดาย\n\nเมื่อข้าเรียก [battle_peasant.GetHerHim] เพื่อถามว่า [battle_peasant.GetSheHe] สืบเชื้อสายมาจากตระกูลขุนนางใด ดวงตาของ [battle_peasant.GetHerHis] เบิกกว้าง ก่อนจะก้มหน้าลงกับพื้น "ท-ท่าน [ROOT.Char.GetLadyLord]! ข้าเป็นเพียงชาวนา ไม่มีอะไรมากไปกว่านั้น" เขาพูดตะกุกตะกัก โค้งคำนับอย่างลึกซึ้ง"
 tournament_events.1230.a:0 "ไม่ เจ้าจะเป็นยอดฝีมือของข้า!"
 tournament_events.1230.b:0 "ดวงชะตาของเจ้าเปลี่ยนไปแล้ว ท่าน [battle_peasant.Custom('MountedWarriorTerm')]"
 tournament_events.1230.b.tt:0 "กลายเป็น [battle_peasant.Custom('KnightCulture')] ของท่าน"
 tournament_events.1230.c:0 "ข้าต้องเห็นเจ้าแข่งขัน! ข้าจะเป็นผู้อุปถัมภ์เจ้าเอง"
 tournament_events.1230.c.tt:1 "เข้าร่วม [activity.GetShortName] ของท่าน"
 tournament_events.1230.d:0 "อั่ก #EMP ชาวนา?!#! น่าเสียดายอะไร เช่นนี้..."
 tournament_events.1230.d.tt:0 "[battle_peasant.GetName] หายตัวไป"
 tournament_events.1240.t:1 "$tournament_header$ แด่ผู้ชนะ"
 tournament_events.1240.desc:1 "ขณะครุ่นคิดถึงรางวัลที่เป็นไปได้ที่ข้าสามารถมอบให้แก่ผู้ชนะการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName] การมอบมือของ [ROOT.Char.Custom2('RelationToMe', prize_child_1)] ที่ยังไม่ได้ แต่งงานของข้า [prize_child_1.GetFirstName] ก็ผุดขึ้นมาในใจ\n\nแต่ ทว่า... หากสามัญชนเป็นผู้ชนะ..."
 tournament_events.1240.a:1 "ข้าตัดสินใจแล้วว่า [prize_child_1.GetFirstNameNoTooltip] จะ แต่งงานกับผู้ชนะ"
 tournament_events.1240.b:0 "[prize_child_2.GetFirstNameNoTooltip] เหมาะสมกว่า"
 tournament_events.1240.c:0 "ควรจะเป็น [prize_child_3.GetFirstNameNoTooltip]"
 tournament_events.1240.d:0 "นี่ไม่ใช่วิธีที่เราทำกัน"
 tournament_events.1240.betrothal_tt:0 "หากถูกต้อง ผู้ชนะจะได้หมั้นหมายกับ [marriage_prize.GetTitledFirstName]"
 tournament_events.1240.marry_tt:0 "หากถูกต้อง ผู้ชนะจะได้ แต่งงานกับ [marriage_prize.GetTitledFirstName]"

 tournament_events.1250.t:1 "$tournament_header$ ของแทนใจ"
 tournament_events.1250.desc:0 "เป็นธรรมเนียมที่จะเสริมสร้างกำลังใจให้แก่ผู้เป็นที่รักด้วยของแทนใจ ของที่ระลึกเล็กๆ น้อยๆ ที่พวกเขาจะสวมใส่เข้าสู่การประลองให้ทุกคนได้เห็น\n\nคำถามเดียวคือผู้เข้าแข่งขันคนใดที่คู่ควรกับความรักของข้ามากที่สุด..."
 tournament_events.1250.a:0 "ข้าจะมอบให้ [favor_recipient_1.GetFirstNameNoTooltip]"
 tournament_events.1250.b:0 "[favor_recipient_2.GetFirstNameNoTooltip] คู่ควร"
 tournament_events.1250.c:0 "มันจะตกเป็นของ [favor_recipient_3.GetFirstNameNoTooltip]"
 tournament_events.1250.d:0 "ไม่มีผู้ใดคู่ควรกับความโปรดปรานของข้า..."
 tournament_events.1250.favor_tt:0 "[favor_recipient.GetUIName] ได้รับของแทนใจจากท่าน"
 tournament_favor_accepted_title:0 "รับของแทนใจแล้ว"
 tournament_favor_rejected_title:0 "ปฏิเสธของแทนใจ"
 tournament_favor_accepted_desc:0 "[THIS.Char.GetSheHe|U] รับของแทนใจจากท่าน"
 tournament_favor_rejected_desc:0 "[THIS.Char.GetSheHe|U] ปฏิเสธของแทนใจจากท่าน"
 tournament_events.1251.t:0 "$tournament_events.1250.t$"
 tournament_events.1251.discrete:0 "ในช่วงเวลาที่ค่อนข้างสงบ ห่างจากบริเวณหลักของงานประลอง ข้าพบว่าตัวเองอยู่ตามลำพังกับ [favor_recipient.Custom2('RelationToMe', favor_giver)] ของข้า [favor_giver.GetTitledFirstName] ซึ่งมีแววตาซุกซนที่ยากจะต้านทาน\n\n"
 tournament_events.1251.open:0 "ขณะยืนอยู่ในบริเวณงาน ชมการฝึกซ้อมและการเตรียมการ ข้าได้ยินเสียงหวานๆ ดังมาจากข้างหลัง "[ROOT.Char.GetTitledFirstName]!" [favor_recipient.Custom2('RelationToMe', favor_giver)] ของข้า [favor_giver.GetTitledFirstName] รีบเข้ามาหาข้าพร้อมกับถือเสื้อผ้าชิ้นหนึ่ง\n\n"
 tournament_events.1251.many:0 "สาบานต่อ [favor_recipient.GetFaith.HouseholdGodName] ข้าเริ่มนับไม่ถ้วนแล้วว่าได้รับของแทนใจมากี่ชิ้น - หากเพียง แต่พวกเขารู้เรื่องของกันและกัน..."
 tournament_events.1251.two:0 "นี่เป็นของแทนใจชิ้นที่สองที่ข้าได้รับ! ข้าจะทำอย่างไรกับเศษผ้าเหล่านี้ทั้งหมด"
 tournament_events.1251.one:0 "[favor_giver.GetSheHe|U] ผูกของแทนใจไว้ที่แขนของข้า ยิ้มพลางกล่าวว่า "สวมสิ่งนี้เมื่อท่านเข้าแข่งขัน มันจะนำโชคดีมาให้!""
 tournament_events.1251.favor_tt:0 "ของแทนใจ แต่ละชิ้นที่สวมใส่จะ #positive_value เพิ่ม#! โอกาสในการชนะ [contests|E] เล็กน้อย"
 tournament_events.1251.a.spouse:0 "ขอบคุณ ที่รัก"
 tournament_events.1251.a.consort:0 "โอ้ ช่างน่าประทับใจ"
 tournament_events.1251.a.lover:0 "เจ้าช่างเหลือเกิน ที่รักของข้า"
 tournament_events.1251.a:0 "ข้าจะสวมใส่มันอย่างภาคภูมิใจ ท่าน [favor_giver.GetLadyLord] ของข้า"
 tournament_events.1251.b:0 "เอาของสิ่งนั้นออกไปจากตัวข้า"
 tournament_events_equip_favor_tt:0 "สวมใส่ของแทนใจของท่าน"
 tournament_events_destroy_favor_tt:0 "[THIS.Char.GetShortUIName|U] ทิ้งของแทนใจของท่าน"
 tournament_events.1252.t:2 "ของแทนใจที่คุ้นเคย"
 tournament_events.1252.desc:0 "ตั้งแต่เห็นของแทนใจจากผู้ชื่นชมผูกอยู่ที่แขนของ [favor_recipient.GetTitledFirstNamePossessive] เมื่อวานนี้ ข้าก็ขบคิดมาตลอดว่าทำไมมันถึงดูคุ้นเคยนัก...\n\nเมื่อ [ROOT.Char.Custom2('RelationToMe', favor_giver)] ของข้า [favor_giver.GetTitledFirstName] ทักทายข้าเมื่อเช้านี้ ข้าก็ตระหนักได้ทันที - ข้าคิดว่ามันเป็นของ [favor_giver.GetHerHim]!"
 tournament_events.1252.a:0 "ข้าต้องรู้ให้ได้!"
 tournament_events.1252.a.tt:0 "ท่านเผชิญหน้ากับ [favor_giver.GetFirstNameNoTooltip] เกี่ยวกับของแทนใจ"
 tournament_events.1252.b:0 "ไม่... เหลวไหลสิ้นดี..."
 tournament_events.1253.t:0 "$tournament_events.1252.t$"
 tournament_events.1253.desc:0 "[favor_investigator.GetTitledFirstName] บุกเข้ามาในห้องของข้า กวาดตามองไปรอบห้อง สายตาที่ร้อนรนของ [favor_investigator.GetHerHis] ในที่สุดก็จับจ้องมาที่ข้า\n\n"บอกความจริงข้ามา ของแทนใจที่ห้อยอยู่บนแขนของ [favor_recipient.GetTitledFirstNamePossessive] เป็นของเจ้ารึเปล่า?""
 tournament_events.1253.a:0 "#weak ...ใช่เจ้าค่ะ/ขอรับ#!."
 tournament_events.1253.b:0 "อะไรนะ? อย่าไร้สาระน่า!"
 tournament_events.1254.t:0 "$tournament_events.1252.t$"
 tournament_events.1254.desc:0 "[favor_giver.GetFirstName] หันหนีไปในระหว่างที่ข้าถามคำถามถาโถม พิงโต๊ะอย่างอ่อนแรง\n\nในที่สุด [favor_recipient.GetSheHe]ก็ค่อยๆ หันกลับมา และทำลายความเงียบอย่างนุ่มนวล: "จริง - มันคือของแทนใจของข้าที่[favor_recipient.GetTitledFirstName]สวมอยู่...""
 tournament_events.1254.a:0 "ม-มันเป็น เช่นนั้นรึ?"
 tournament_events.1254.b:0 "#EMP มันเป็นเช่นนั้นรึ?!#!"
 tournament_events.1255.t:0 "$tournament_events.1252.t$"
 tournament_events.1255.desc:0 "[favor_giver.GetTitledFirstName] ปฏิเสธความเกี่ยวข้องใดๆ กับ [favor_recipient.GetTitledFirstName] และเห็นได้ชัดว่ารู้สึกขุ่นเคืองกับข้อกล่าวหา "ข้าแทบจะไม่รู้จัก [favor_recipient.GetWomanMan] ผู้นั้นด้วยซ้ำ!"\n\nไม่ว่า [favor_giver.GetSheHe] จะพูดอะไร เมล็ดพันธุ์แห่งความสงสัยก็ได้ถูกหว่านลงไปแล้ว..."
 tournament_events.1255.a:0 "ข้าจะทำอะไรได้อีกเล่า?"
 tournament_events.1255.a.tt:0 ""เวลาเท่านั้นที่จะบอกได้...""
 tournament_events.1260.t:2 "การรักษาสันติภาพ"
 tournament_events.1260.desc:0 "ด้วยขุนนางและ [ROOT.Char.Custom('MountedWarriorTermPlural')] จำนวนนับไม่ถ้วนที่มารวมตัวกันในที่เดียว การทะเลาะวิวาทกันอยู่ตลอดเวลาจึงไม่ใช่เรื่องน่าแปลกใจนัก เมื่อข้อพิพาทเก่าๆ ปะทุขึ้นอีกครั้งและความหยิ่งทะนงก็กระตุ้นให้เกิดความขัดแย้ง\n\n"
 tournament_events.1260.rival:0 ""ฟังนะ ไอ้ [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))] ปลิ้นปล้อน!" [duelist_1.GetFirstName] คำราม ขณะที่ [duelist_2.GetTitledFirstName] ลูบคลำด้ามจับ [duelist_2.Custom('SignatureWeaponNameOrType')] ของ [duelist_2.GetHerHis] อย่างคุกคาม ไม่มีผู้ใดแน่ใจว่าเรื่องเริ่มขึ้นได้อย่างไร\n\nโดยปกติแล้ว การอวดเบ่งเล็กๆ น้อยๆ เหล่านี้มักจบลงอย่างเลวร้ายที่สุดแค่ตาเขียว แต่การทะเลาะวิวาทอันน่าสะพรึงกลัวของ [duelist_1.GetTitledFirstNamePossessive] กับ [duelist_2.GetTitledFirstName] กลับขู่ว่าจะ ทำให้งานทั้งหมดมัวหมอง"
 tournament_events.1260.fallback:0 ""ฟังนะ ไอ้ [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))] ปลิ้นปล้อน!" [duelist_1.GetFirstName] คำราม ขณะที่ [duelist_2.GetFirstNameNoTooltip] ลูบคลำด้ามดาบของ [duelist_2.GetHerHis] อย่างคุกคาม\n\nโดยปกติแล้ว การอวดเบ่งเล็กๆ น้อยๆ เหล่านี้มักจบลงอย่างเลวร้ายที่สุดแค่ตาเขียว แต่การทะเลาะวิวาทอันน่าสะพรึงกลัวนี้กลับขู่ว่าจะ ทำให้งานทั้งหมดมัวหมอง ไม่มีผู้ใดบอกได้ว่าเรื่องเริ่มขึ้นได้อย่างไร"
 tournament_events.1260.a:0 "พอได้แล้ว! ที่นี่ไม่ใช่ค่ายโจร!"
 tournament_events.1260.b:0 "มาเถิด อย่า ทำให้เจ้าภาพของท่านต้องอับอาย"
 tournament_events.1260.c:0 "ออกไป! นำตัวพวกก่อปัญหาเหล่านี้ออกไป!"
 tournament_events.1260.d:0 "จัดการ [second_duelist.GetHerHim] ซะ [preferred_duelist.GetFirstNameNoTooltip]!"
 tournament_events.1260.duel_toast:0 "[duel_winner.GetTitledFirstName] ชนะการประลอง"
 tournament_events.1260.peace_toast:0 "นักประลองยอมถอย"
 tournament_events.1260.duel_tt:0 "การประลองดำเนินต่อไป ทำให้ [duelist_1.GetFirstName] หรือ [duelist_2.GetFirstName] บาดเจ็บ"
 tournament_events.1270.t:1 "$tournament_header$ นักกีฬาที่ดี"
 tournament_events.1270.winner:0 "ข้าเห็น [congratulate_winner.GetTitledFirstName] รายล้อมไปด้วยผู้ชื่นชมในศาลาใหญ่ ไม่ต้องสงสัยเลยว่ากำลังคุยโวเกี่ยวกับชัยชนะของ [congratulate_winner.GetHerHis] ในการแข่งขัน [congratulate_winner.Custom('GetRandomWonContest')|l] และรางวัลที่ [congratulate_winner.GetSheHe] ได้รับไป"
 tournament_events.1270.matcher:0 "ข้าเห็น [congratulate_winner.GetTitledFirstName] ในศาลาใหญ่ ไม่ต้องสงสัยเลยว่ากำลังคุยโวเรื่องที่เอาชนะข้าได้ในการประลองของเรา"
 tournament_events.1270.desc:0 "\n\nมารยาทเรียกร้องให้ข้าทักทาย [congratulate_winner.GetHerHim] เมื่อข้าเดินผ่าน - โอกาสที่จะแถลงต่อสาธารณะต่อหน้าแขกที่เรียงรายอยู่..."
 tournament_events.1270.a:0 "ไชโยสามครั้งแด่ผู้ชนะเลิศ!"
 tournament_events.1270.b:0 "ขอแสดงความยินดีด้วย [congratulate_winner.GetFirstNameNoTooltip] ท่านสมควรได้รับมันแล้ว!"
 tournament_events.1270.c:0 "อา [congratulate_winner.GetFirstNameNoTooltip] โชคชะตาช่างทำงานอย่างลึกลับเสียจริง..."
 tournament_events.1270.d:0 "ข้าเพิ่งนึกขึ้นได้ ข้าต้องไปที่อื่น"
 tournament_events.1270.nickname_toast:0 "ชื่อนี้ติดปากไปแล้ว"
 tournament_events.1280.t:1 "$tournament_header$ มาตรฐานหละหลวม"
 tournament_events.1280.desc:1 "ฝูงชนทั้งสามัญชนและขุนนางต่างหลั่งไหลมายังลานประลอง แย่งชิงกันเพื่อหาจุดชมวิวที่ดีของการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName]\n\nเสียงครวญครางอันน่าสะพรึงกลัวดังแทรกเสียงจอแจอันน่าตื่นเต้น — อัฒจันทร์ที่รับน้ำหนักผู้ชมมากเกินไปพังทลายลงพร้อมเสียง #EMP ดังสนั่น#! เหยื่อจำนวนมากที่กรีดร้องร่วงหล่นหายไปจากสายตา\n\nขณะที่การกล่าวโทษกันไปมา [ROOT.Char.Custom2('RelationToMeShort', intercessor)] ของข้า [intercessor.GetName] คัดค้านอย่างแข็งขันที่จะลงโทษช่างก่อสร้างอัฒจันทร์: "นี่เป็นการกระทำของ [intercessor.GetFaith.HighGodName] ไม่มีอะไรอื่น!""
 tournament_events.1280.a:0 "ประหารชีวิตพวกที่เรียกตัวเองว่า '#EMP ช่างก่อสร้าง#!' เหล่านี้ซะ!"
 tournament_events.1280.b:0 "เราต้องดูแลผู้สูญเสีย"
 tournament_events.1280.c:0 "บางครั้งภัยพิบัติก็หลีกเลี่ยงไม่ได้..."
 tournament_events.1290.t:2 "อันธพาลที่จัดการไม่ได้"
 tournament_events.1290.desc:0 "ตื่น แต่เช้าด้วยเสียงสัญญาณเตือนภัย ตอนนี้ข้าเฝ้าดูชาวเมืองที่สิ้นหวังช่วยกันสาดน้ำใส่อาคารที่กำลังลุกไหม้ของ [fire_holding.GetBaronyNameExplicitly] ขณะที่ [fire_holder.GetTitledFirstName] อธิบายอย่างโกรธเคือง\n\n"กลุ่มผู้ติดตามอัศวินที่เมา [ROOT.Char.Custom('RegionalAlcoholicDrink')] และคึกคะนองจากการแข่งขันได้จุดไฟเผาแผงลอยของพ่อค้าหลังจากการโต้เถียงกัน..." [fire_holder.GetSheHe] เดือดดาล "นี่จะต้องใช้เวลาหลายเดือนในการสร้างขึ้นใหม่!"\n\nนี่ไม่ใช่วิธีที่ข้าต้องการให้งานประลองของข้าเป็นที่จดจำ..."
 tournament_events.1290.a:0 "เหล่าผู้ติดตามอัศวินต้องชดใช้ความสนุกของพวกเขา"
 tournament_events.1290.b:0 "ข้าจะรับผิดชอบค่าซ่อมแซมเอง"
 tournament_events.1290.c:0 "ข้าเกรงว่ามันเป็นเพียงหนึ่งในเรื่องเหล่านั้น..."

 tournament_events.1300.t:1 "$tournament_header$ ใต้ปีกของ [old_knight.GetHerHis|U]"
 tournament_events.1300.desc:1 ""ไม่ใช่ ไม่เชิง ขยับเท้าถอยหลังเล็กน้อยเพื่อทรงตัวและเหวี่ยง #EMP ผ่าน#! เป้าหมาย และ... ใช่! สมบูรณ์แบบ! ทำได้ดีมาก [young_knight.Custom('GetLassLad')]!"\n\nตรงหน้าข้า ทหารผ่านศึกเฒ่าผมหงอก [old_knight.GetFirstName] กำลังฝึกฝน [young_knight.GetFirstName] เห็นได้ชัดว่ากำลังถ่ายทอดความรู้ที่ได้รับจาก [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] คนหนึ่งไปยังอีกคนหนึ่ง [old_knight.GetFirstNameNoTooltip] เห็นข้าขณะที่ข้าเข้าใกล้\n\n"อรุณสวัสดิ์ ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า! ข้ากำลังช่วย [young_knight.GetFirstNameNoTooltip] ที่นี่ให้สมบูรณ์แบบในท่วงท่าของ [young_knight.GetHerHis] ท่านมีนักรบหนุ่มที่มีพรสวรรค์อยู่ในมือแล้ว!" [young_knight.GetFirstNameNoTooltip] พยายามและล้มเหลวที่จะซ่อนรอยยิ้มที่เขินอาย แต่ยินดีต่อคำชมจากอาจารย์ของ [young_knight.GetHerHis]"
 tournament_events.1300.a:0 "ยอดเยี่ยม! ทำต่อไป!"
 tournament_events.1300.b:0 "บางที #EMP ข้า#! ควรจะรับหน้าที่นี้เอง จริงๆ แล้ว"
 tournament_events.1300.b.success:0 "[young_knight.GetFirstNameNoTooltip] ได้รับ #color_white 10#! [GetTrait('tourney_participant').GetName( GetNullCharacter )] $game_concept_trait_level_track_xp$ ใน $game_concept_trait_level_track$ แบบสุ่ม"
 tournament_events.1300.b.failure:0 "[young_knight.GetFirstNameNoTooltip] เสีย #color_white 5#! [GetTrait('tourney_participant').GetName( GetNullCharacter )] $game_concept_trait_level_track_xp$ ใน $game_concept_trait_level_track$ แบบสุ่ม"
 tournament_events.1300.c:0 "ท่านจะกรุณาสอนข้าด้วยได้หรือไม่?"

 tournament_events.1310.t:2 "แขกผู้ทรงเกียรติ"
 tournament_events.1310.desc:1 "เสียงแตรอันดังกระหึ่มก้องไปในอากาศ ม้าส่งสารตัวหนึ่งวิ่งเหยาะๆ ผ่านข้าไป คลี่ม้วนกระดาษออก\n\n"ฟังทางนี้ ฟังทางนี้! ในวันที่ดีที่สุดนี้ เราได้รับพรด้วยการปรากฏตัวของผู้มีพรสวรรค์อย่างแท้จริง [famous_knight.GetSheHe|U] ได้พิชิตผู้ท้าชิงทั้งหมดจากไอร์แลนด์ถึงคาเธ่ย์! เป็นเกียรติและสิทธิพิเศษของข้าที่จะแนะนำผู้มีทักษะมากที่สุด ผู้สง่างามที่สุด ผู้เก่งกาจที่สุดในโลก: [famous_knight.GetTitledFirstName]!"\n\nร่างหนึ่งพุ่งผ่านผู้ส่งสารไป หยุดม้าของ [famous_knight.GetHerHis] อย่างกะทันหัน แสงอาทิตย์ที่สาดส่องลงมาส่องสว่าง [famous_knight.GetHerHim] ดุจรัศมี เสียงโห่ร้องของฝูงชนที่รวมตัวกันแทบจะ ทำให้พื้นดินสั่นสะเทือน"
 tournament_events.1310.a:0 "ช่างเป็นเกียรติอย่างยิ่งที่ได้ท่านมาที่นี่ [famous_knight.GetFirstNameNoTooltip]!"
 tournament_events.1310.b:1 "บางทีพวกเขาอาจจะสอนอะไรข้าสักอย่างสองอย่างได้?"
 tournament_events.1310.b.critsuccess:0 "[famous_knight.GetFirstNameNoTooltip] สอนเทคนิคบางอย่างให้ท่าน"
 tournament_events.1310.b.success:0 "ท่านได้รับเคล็ดลับเล็กน้อย"
 tournament_events.1310.b.failure:0 "ท่านไม่เข้าใจคำสอนของ [famous_knight.GetFirstNamePossessiveNoTooltip]"
 tournament_events.1310.c:0 "ขออภัย ใครนะ?"

 tournament_events.1311.t:2 "สับสนปนเป"
 tournament_events.1311.desc:0 ""โปรดทราบ ท่านผู้ใดที่เดินเตร่อยู่แถวนี้!" เสียงของผู้ส่งสารดังแทรกฝูงชนที่เดินขวักไขว่อยู่รอบงานประลอง และผู้คนจำนวนไม่น้อยหันไปทางเสียงนั้น\n\n"ขอให้ทราบโดยทั่วกันว่าผู้ที่กำลังเข้าสู่สนามในขณะนี้คือ... คือ..." ผู้ส่งสารหอบเล็กน้อย กวาดตามองฝูงชนเพื่อหานามที่เห็นได้ชัดว่าถูกลืมไปแล้ว\n\n"คือ... ท่านหญิงที่รัก- เอ่อ ท่าน #EMP ขุนนาง#! ที่รัก- เอ่อ..." มือของผู้ส่งสารกำและคลายออกอย่างกระตุก ความตื่นตระหนกที่ลืมนามของ [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')] ที่กำลังถูกแนะนำนั้นชัดเจนราวกับกลางวัน [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')] ผู้นั้น [forgotten_knight.GetTitledFirstName] เข้าใกล้ผู้ประกาศข่าวที่กำลังตัวสั่นด้วยใบหน้าดุจอสุนีบาต"
 tournament_events.1311.a:0 "[forgotten_knight.GetFirstNameNoTooltip]! ข้าขอเสนอผู้ส่งสารคนใหม่ให้ท่านได้หรือไม่?"
 tournament_events.1311.b:0 "ผู้ส่งสารคนนั้นคงต้องการงานใหม่..."
 tournament_events.1311.b.tt:0 "ผู้เข้าร่วม [GetTrait('compassionate').GetName( GetNullCharacter )] ทุกคนได้รับความเห็น #color_green +25#! ต่อท่าน"
 tournament_events.1311.c:0 "ฮ่า! พวกเขาลืม #EMP ชื่อ#! ของ [forgotten_knight.GetHerHis]!"
 tournament_events.1312.t:2 "เสน่ห์ต่างแดน"
 tournament_events.1312.desc:0 "เสียงโอ้และอ้า ตามด้วยเสียงปรบมือ ดึงดูดความสนใจของข้าขณะเดินผ่านฝูงชนกลุ่มเล็กๆ ด้วยความสนใจ ข้าจึงเบียดตัวเข้าไปท่ามกลางพวกเขา\n\nณ ศูนย์กลางของพวกเขายืน [foreign_knight.GetWomanMan] ผู้หนึ่ง ดาบชักออกมาครึ่งหนึ่งจากฝัก อวดด้ามดาบที่ไม่ธรรมดาของอาวุธให้แก่สามัญชนที่ตกตะลึง เห็นได้ชัดว่า [foreign_knight.GetSheHe] ไม่ใช่คนจากแถบนี้: สำเนียงของ [foreign_knight.GetHerHis] ไพเราะและเป็นภาษาต่างถิ่น เมื่อ [foreign_knight.GetSheHe] เห็นข้า [foreign_knight.GetSheHe] ก้มศีรษะลงอย่างเคารพ ก่อนจะหันกลับไปหาฝูงชน\n\n"เอาล่ะ ข้าจะแสดงกลดาบจากบ้านเกิดของข้าให้พวกท่านดูเป็นอย่างไร?" ฝูงชนโห่ร้องอีกครั้งอย่างอึกทึก"
 tournament_events.1312.a:0 "ท่านอยากได้เจ้าเหนือหัวคนใหม่หรือไม่?"
 tournament_events.1312.a.success:0 "[foreign_knight.GetFirstNameNoTooltip] ตกลงเข้าร่วม"
 tournament_events.1312.a.failure:0 "[foreign_knight.GetFirstNameNoTooltip] ปฏิเสธท่าน"
 tournament_events.1312.b:0 "ช่างเป็นตัวละครที่น่าทึ่ง!"
 tournament_events.1312.c:0 "[foreign_knight.GetSheHe|U] ก็แค่เป็นคนต่างชาติ แล้วอย่างไรเล่า?"

 tournament_events.1320.t:0 "เหรียญสีแดง"
 tournament_events.1320.desc:0 "ข้ากำลังเดินทางกลับจากห้องสุขา เลี้ยวลดไปมาระหว่างเต็นท์สองหลัง ทันใดนั้นมือหนึ่งก็ตบเข้าที่ปากข้าอย่างแรงจากด้านหลัง\n\n"เงียบไว้เมื่อข้าอนุญาตให้เจ้าพูด เจ้าทำได้หรือไม่?" การตอบรับที่อู้อี้ของข้า ทำให้เสียงนั้นพอใจ และข้าหมุนตัวกลับไปพบคนแปลกหน้าในชุดที่ไม่ธรรมดา สิ่งของเล็กๆ ชิ้นหนึ่งถูกยัดใส่มือข้าทันที\n\n"ข้าต้องการให้ดูแลสิ่งนี้ มันมีความสำคัญอย่างยิ่งต่อข้า ข้าจะกลับมาเอามัน หากข้าไม่กลับมา..." รอยยิ้มที่เหนื่อยล้าอย่างประหลาดปรากฏขึ้นบนปากของคนแปลกหน้า "...ก็ถือว่าเป็นของขวัญจากข้าให้แก่ท่าน\n\nข้ามองลงไป ในฝ่ามือของข้ามีเหรียญทองคำ แต่เป็นสี #EMP แดง#! อย่างน่าประหลาด มันวางอยู่อย่างทื่อๆ ค่อนข้างอุ่นเมื่อสัมผัส"
 tournament_events.1320.a:0 "ข้าจะเก็บสิ่งนี้ไว้ให้ท่าน"
 tournament_events.1320.b:0 "ข้าไม่ต้องการสิ่งนี้!"

 tournament_events.1321.t:0 "เหรียญที่ยืมมา"
 tournament_events.1321.desc:0 "ขณะมองข้ามถ้วยของข้าในระหว่างที่กำลังพักดื่มระหว่างการประลอง ข้าเห็นร่างในผ้าคลุมที่คุ้นตาอย่างประหลาดเดินเข้ามาหา\n\n"ข้าเชื่อว่าท่านมีของบางอย่างที่เป็นของข้า" บุคคลนั้นก้าวเข้ามาในแสงสว่างราวกับไม่คุ้นเคยกับความจ้าของมัน "เหรียญนั่น [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านยังเก็บมันไว้มิใช่หรือ?"\n\nเมื่อดึงมันออกมาจากกระเป๋า โลหะก็สะท้อนแสงเป็นประกายกลางแดด ดูเหมือนว่ามันจะแดงขึ้นกว่าเดิม เป็นสีแดงเข้มดั่งโกเมน ร่างนั้นยิ้มจากใต้ผ้าคลุม\n\n"ข้าขอขอบคุณอย่างสุดซึ้ง จากก้นบึ้งของหัวใจ นี่สำหรับความลำบากของท่าน" พวกเขายื่นมือออกมาเพื่อรับมัน แต่มืออีกข้างกลับยื่นถุงที่หนักอึ้งไปด้วยทองคำมาให้"
 tournament_events.1321.a:0 "มาที่ราชสำนักของข้า ข้าต้องการความสามารถของท่าน"
 tournament_events.1321.b:0 "ยินดีที่ได้ทำธุรกิจด้วย สหายข้า"
 tournament_events.1321.c:0 "หืม ข้าว่าไม่ดีกว่า"
 tournament_events.1321.c.tt:0 "นี่รู้สึกเสี่ยง..."

 tournament_events.1322.t:0 "คุ้มค่ากับความเสี่ยงหรือไม่?"
 tournament_events.1322.desc:0 "ความโกรธเกรี้ยวอย่างรุนแรงที่ปรากฏบนใบหน้าของคนแปลกหน้า ทำให้ข้าตกใจและ ทำให้ทหารองครักษ์ของข้าก้าวไปข้างหน้า ชักอาวุธออกมา ริมฝีปากของร่างนั้นบิดเบี้ยวขณะที่พวกเขาลดผ้าคลุมลง ด้วยความรังเกียจและเย้ยหยัน\n\n"ท่านเห็นหน้าข้าแล้ว" [unusual_stranger.GetSheHe|U] กล่าว "ข้าจะบอกชื่อของข้าให้ท่านทราบด้วย ความปรารถนาสูงสุดของข้าในตอนนี้คือให้ท่านนอนไม่หลับในตอนกลางคืน คิดว่า [unusual_stranger.GetFirstName] จะแก้แค้นท่านอย่างสาสมได้อย่างไร อาจจะเป็นเวลาหลายปีนับจากนี้ แต่ข้าไม่เคยลืม และข้าหวังเพียงตอนนี้ว่าท่านจะไม่ลืม เช่นกัน"\n\n"จำไว้ว่า: #EMP จะต้องมีการชำระแค้น#! [unusual_stranger.GetSheHe|U] ดึงผ้าคลุมกลับขึ้นมา ดึงเสื้อคลุมให้แน่นขึ้นรอบตัว [unusual_stranger.GetHerHis] ก่อนที่จะหายตัวกลับเข้าไปในฝูงชน"
 tournament_events.1322.a:0 "ข้า... ข้ามั่นใจว่ามันจะเรียบร้อยดี"

 tournament_events.1330.t:0 "รุ่นต่อไป"
 tournament_events.1330.desc:0 ""ขอให้โชคดี [ROOT.Char.Custom('FormOfAddressForLiege')]!" ข้ารับรู้ถึงเสียงตะโกนจากสมาชิกของฝูงชนที่มาชุมนุมกันด้วยการโบกมืออย่างขอบคุณ "และขอให้เจ้าโชคดี เช่นกัน [heir.GetFirstName]!"\n\n"พวกเขาหมายความว่ากระไร?" ข้าถาม [heir.GetFirstNameNoTooltip] ที่กำลังก้าวเดินอยู่ข้างๆ "เหตุใดพวกเขาจึงต้องอวยพรให้เจ้าโชคดีด้วย?" ท่าทางประหม่าของ [heir.GetHerHis|U] ให้คำตอบสำหรับคำถามนั้นอย่างรวดเร็ว\n\n"ข้า... ข้าต้องการเข้าแข่งขัน!" [heir.GetSheHe|U] ยืนกราน "ท่านก็เข้าร่วม เหตุใดข้าจะทำบ้างไม่ได้?" ข้าหยุดกึก [heir.GetFirstNameNoTooltip] สะดุดจนเกือบหยุดข้างๆ ข้าอย่างไม่มั่นคง ความกล้าหาญของ [heir.GetHerHis] สลายไปเล็กน้อยเมื่อเผชิญกับปฏิกิริยาของข้า"
 tournament_events.1330.a:0 "เจ้าต้องเข้าใจ เจ้ามีค่าเกินกว่าจะเสี่ยง"
 tournament_events.1330.b:0 "ช่างเป็นเกียรติอย่างยิ่งที่มี [heir.Custom('GetDaughterSon')] เช่นนี้!"
 tournament_events.1330.c:0 "ข้าห้าม! ไปถอนตัวเดี๋ยวนี้!"
 tournament_events.1330.d:0 "...อย่าบอก [spouse.GetMotherFather] ของเจ้านะ"

 tournament_events.1331.t:0 "เพื่อครอบครัว?"
 tournament_events.1331.desc:0 ""[ROOT.Char.GetFirstName]! ท่านคือ [ROOT.Char.GetWomanMan] ที่ข้าอยากเจอพอดี!" [dynast.GetFirstName] รีบเข้ามาหาข้า "เราต้องคุยกัน คืออย่างนี้ ข้าได้ยินมาว่าท่านลงชื่อเข้าร่วมการประลองที่จะถึงนี้ และ เอ่อ..."\n\nท่าทีเฉยเมยของข้า ทำให้ท่าทีของ [dynast.GetFirstNamePossessiveNoTooltip] ต่อสถานการณ์แข็งกร้าวขึ้นอย่างชัดเจน [dynast.GetSheHe|U] ยืดตัว [dynast.GetHerselfHimself] ขึ้นเต็มความสูง [dynast.GetHerHis]\n\n"ท่านต้องถอนตัว ข้าคือประมุขแห่ง [dynast.GetDynastyName] และข้าสั่ง! เพื่อประโยชน์ของวงศ์ตระกูลเรา!" ขณะที่ [dynast.GetSheHe] ตำหนิข้า ข้ามองกลับไปยังที่ที่สีของผู้เข้าแข่งขันถูกชักขึ้น รวมถึงสีของ [dynast.GetFirstNamePossessiveNoTooltip] อย่างคาดเดาได้"
 tournament_events.1331.a:0 "การข่มขู่ใช้ไม่ได้ผลกับข้า [dynast.GetFirstNameNoTooltip]"
 tournament_events.1331.b:0 "แน่นอน อะไรก็ได้เพื่อ #EMP 'ครอบครัว'#!."
 tournament_events.1331.c:0 "ท่านต้องการทบทวนคำพูดของท่านหรือไม่ [dynast.GetFirstNameNoTooltip]?"
 tournament_events.1331.d:0 "ข้าจะไม่ยอมถูกบีบบังคับเพื่อประโยชน์ของท่าน!"
 tournament_events.1331.e:0 "ข้าจะถอนตัว หากข้าต้องทำ"

 tournament_events.1332.t:0 "การให้และรับ"
 tournament_events.1332.desc:0 "ข้าเห็น [powerful_vassal.GetFirstName] กำลังก้าวมาหาและหลับตาลงชั่วครู่ด้วยความผิดหวัง เมื่อข้าลืมตาขึ้นอีกครั้ง [powerful_vassal.GetSheHe] ก็อยู่ตรงหน้าข้า จ้องมองข้าด้วยรอยยิ้มเสแสร้งที่ปิดบังแววตาไม่เป็นมิตรไว้ไม่อยู่\n\n"[ROOT.Char.GetFirstName] [ROOT.Char.Custom('FormOfAddressForLiege')] ช่าง #EMP ยอดเยี่ยม#! กระไร เช่นนี้ที่ได้เห็นท่านที่นี่และเข้าร่วมการแข่งขัน!" [powerful_vassal.GetSheHe|U] คว้าแขนข้าและพาเราเดินเลี่ยงออกจากฝูงชนเล็กน้อยเพื่อพูดคุยเป็นการส่วนตัว "ฟังนะ ข้าต้องการความช่วยเหลือ" ท่าทีเสแสร้งของ [powerful_vassal.GetHerHis|U] เกือบจะพังทลายลงเมื่อข้ากลอกตา\n\n"ข้าอยากทำผลงานให้ดีในการประลองนี้ และในฐานะหนึ่งในข้าหลวงที่ทรงอำนาจที่สุดและ #EMP ภักดีที่สุด#! ของท่าน ข้าสงสัยว่าข้าจะสามารถพึ่งพาความช่วยเหลือจากท่านได้หรือไม่""
 tournament_events.1332.a:0 "ท่านภักดีจริงๆ ใช่หรือไม่?"
 tournament_events.1332.b:0 "ภักดีที่สุด ท่านว่าอย่างนั้นรึ?"
 tournament_events.1332.c:0 "กระเป๋าของข้ารู้สึกว่างเปล่าเล็กน้อยเมื่อเร็วๆ นี้..."
 tournament_events.1332.d:0 "เพื่อท่าน [powerful_vassal.GetFirstNameNoTooltip]? อะไรก็ได้"
 tournament_events.1332.e:0 "ท่านจะต้องดูแลตัวเอง"

 # SPECTATOR EVENTS
 tournament_events.1400.t:1 "$tournament_header$ เรื่องเล็กน้อย"
 tournament_events.1400.desc:0 "การเป็นส่วนหนึ่งของฝูงชนในงานกีฬาอาจเป็นเรื่องน่ายินดีอย่างแท้จริง บรรยากาศ เสียง และภาพ แต่ปัญหาก็คือ บางครั้งมันก็นำมา ซึ่งข้อเสียพอๆ กับข้อดี\n\nข้อเสียอย่างหนึ่งเพิ่งปรากฏขึ้น เมื่อข้าพบว่าตัวเองติดอยู่หลังร่างใหญ่ของ [tall_person.GetFirstName] ข้าเอนตัวไปทางหนึ่ง แล้วก็อีกทางหนึ่ง แต่ขนาดที่ใหญ่โตของ [tall_person.GetHerHis] บดบังการแข่งขันเกือบทั้งหมด\n\nข้าถอนหายใจเสียงดังและกระทืบเท้า [tall_person.GetFirstNameNoTooltip] ไม่ขยับ เสียงเชียร์ดังขึ้นเมื่อมีบางสิ่งที่ยิ่งใหญ่และน่าตื่นเต้นเกิดขึ้น ความโกรธของข้าเริ่มคุกรุ่น"
 tournament_events.1400.a:0 "ข้าจะ ทำให้เจ้า #EMP คุกเข่า#! ดู!"
 tournament_events.1400.a.fight:0 "การต่อสู้ อย่างน้อยก็จะแก้ปัญหาได้ไม่ทางใดก็ทางหนึ่ง..."
 tournament_events.1400.b:0 "ขอประทานโทษ ท่านช่วย #EMP ขยับ#! หน่อยได้หรือไม่?"
 tournament_events.1400.b.success:0 "[tall_person.GetFirstNameNoTooltip] ยอมอย่างไม่เต็มใจ"
 tournament_events.1400.b.failure:0 "[tall_person.GetFirstNameNoTooltip] ปฏิเสธ"
 tournament_events.1400.c:0 "ท่านอยากจะต่อสู้เพื่อข้าหรือไม่?"
 tournament_events.1400.c.success:0 "[tall_person.GetFirstNameNoTooltip] เข้าร่วมกับท่าน"
 tournament_events.1400.c.failure:0 "[tall_person.GetFirstNameNoTooltip] ปฏิเสธ"
 tournament_events.1400.d:0 "ช่างเถิด"

 tournament_events.1401.t:1 "$tournament_header$ เรื่องใหญ่โต"
 tournament_events.1401.desc:0 "ช่างเป็นวันที่ดีอะไร เช่นนี้! ตำแหน่งของข้าที่อยู่แถวหน้าสุดของฝูงชน ทำให้ข้าได้เห็นภาพการแข่งขันที่ไม่มีใครเทียบได้ ทุกอย่างเป็นไปด้วยดี จนกระทั่งข้ารู้สึกถึงแรงดึงเล็กน้อยที่เสื้อผ้าของข้า เมื่อมองลงไปที่การเคลื่อนไหวนั้น ข้าเห็นร่างหนึ่ง ซึ่งเล็กกว่าข้ามาก กำลังพยายามจะผ่านไป\n\nเมื่อพวกเขาสังเกตเห็นสายตาของข้าจับจ้องอยู่ที่[smol_person.GetHerHim] [smol_person.GetFirstName]ก็ยืดตัวตรงและเริ่มอ้อนวอนแก้ต่างให้[smol_person.GetHerHis]\n\n"ท่าน... ตัว #EMP ใหญ่#! มาก!!" [smol_person.GetSheHe] พยายาม ชี้ไปที่รูปร่างที่แตกต่างกันของเรา "ข้ามองไม่เห็นอะไรเลย! ได้โปรด ข้าขอยืนข้างหน้าท่านได้ไหม?""
 tournament_events.1401.a:0 "ฮ่า ฮ่า! ไม่ได้"
 tournament_events.1401.a.success:0 "ท่านกันพวกเขาออกไปได้สำเร็จ"
 tournament_events.1401.a.failure:0 "[smol_person.GetFirstNameNoTooltip] แอบผ่านไปได้"
 tournament_events.1401.b:0 "เอาล่ะ เข้ามาสิ"

 tournament_events.1402.t:1 "$tournament_header$ สัมปทานที่สูญเปล่า"
 tournament_events.1402.desc:0 "การแข่งขันตรงหน้าข้ากำลังถึงจุดสุดยอด ผู้เข้าร่วมแข่งขันสูสีกัน ข้าจับราวไม้ด้านหน้าและตะโกนแสดงความชื่นชมพร้อมกับฝูงชนที่เหลือ อย่างไรก็ตาม เสียงตะโกนนั้นกลับกลายเป็นเสียงร้องที่ติดขัดอย่างรวดเร็วเมื่อข้ารู้สึกว่ามีบางอย่างไหลลงมาตามกระดูกสันหลัง ของเหลวบางชนิด... บางอย่างที่ทั้งร้อน #EMP และ#! เย็น อย่างไรกัน?\n\nข้าหมุนตัวกลับไปพบกับ [drinking_spectator.GetFirstName] ถ้วยของ [drinking_spectator.GetHerHis] แกว่งไปมาพร้อมกับของเหลวที่ไม่ปรากฏชื่อที่เหลืออยู่ ซึ่งกำลังไหลลงมาตามหลังข้า\n\n"นี่แน่ะ ดูทางหน่อยสิ!" [drinking_spectator.GetSheHe] พูดเสียงอู้อี้ พลางชี้มาที่ข้าอย่างกล่าวหาด้วยถ้วย "ท่านควรจะระวังให้มากกว่านี้!"
 tournament_events.1402.a:0 "ข้าเลี้ยงท่านอีกแก้วเป็นอย่างไร?"
 tournament_events.1402.b:0 "ทหาร! เอาไอ้ [drinking_spectator.Custom2('InsultNoun', ROOT.Char)] [drinking_spectator.Custom2('InsultAdjective', ROOT.Char)] นี่ออกไปให้พ้นสายตาข้า!"
 tournament_events.1402.c:0 "ท่านพูดถูก ความผิดข้าเอง!"

 tournament_events.1403.t:1 "$tournament_header$ ฝูงชนที่หวาดกลัว"
 tournament_events.1403.desc:0 "ฝูงชนเอนตัวเข้ามาขณะที่ผู้เข้าแข่งขันเตรียมพร้อม แต่บรรยากาศกลับถูกตัดผ่านอย่างเฉียบคมด้วยเสียงกรีดร้อง [realm_priest.GetFirstName] ได้บุกเข้ามาในสนาม\n\n"พวกเจ้า #EMP กล้าดี#! อย่างไรถึงดูเรื่องไร้สาระ เสียเวลา #EMP สกปรก#! นี่!!" [realm_priest.GetSheHe] คำราม หันไปหาทีละคน น้ำลายกระเซ็นออกจากริมฝีปากของ [realm_priest.GetHerHis] ขณะที่ [realm_priest.GetSheHe] กล่าวประณามพวกเขา "พวกเจ้าควรใช้เวลาน้อยลงที่นี่และใช้เวลามากขึ้นในการสักการะบูชา!"\n\nทะเลผู้คนสั่นไหวเล็กน้อย สัมผัสได้ถึงเศษเสี้ยวของความจริงในคำพูดนั้น ก่อนที่เสียงที่กล้าหาญและโกรธเกรี้ยวสองสามเสียงจะดังตอบโต้กลับ กระแสความคิดเห็นของสาธารณชนถาโถมเข้าใส่ [realm_priest.GetFirstNameNoTooltip] อย่างดุเดือด แต่ [realm_priest.GetSheHe] ยืนหยัด [realm_priest.GetHerHis] พื้นที่ ส่งเสียงคำพูดที่เกรี้ยวกราดของ [realm_priest.GetHerHis]"
 tournament_events.1403.a:0 "[realm_priest.GetFirstNameNoTooltip] พูดถูก พวกเจ้าคนบาป!"
 tournament_events.1403.b:0 "โห่! #EMP โห่ฮิ้วววว!#!"
 tournament_events.1403.c:0 "บางทีข้าควรปล่อยให้เรื่องนี้คลี่คลายไปเอง"

 tournament_events.1404.t:1 "$tournament_header$ ผู้หมายปองที่มีศักยภาพ"
 tournament_events.1404.desc:0 "ขณะที่ข้านั่งลงใกล้แถวหน้าของฝูงชนกับ [ROOT.Char.Custom2('RelationToMeShort', gossip_friend)] [gossip_friend.GetFirstName] เหล่าผู้เข้าแข่งขันก็วิ่งเหยาะๆ ผ่านหน้าเราไป [gossip_friend.GetFirstNameNoTooltip] สะกิดข้าสองสามครั้ง ชี้ไปที่ผู้เข้าแข่งขันสองคนด้วยท่าทางศีรษะที่ไม่ค่อยแนบเนียนนัก\n\n"ท่านคิดอย่างไรกับสองคนนั้น?" [gossip_friend.GetSheHe] พูด พลางกลั้นเสียงหัวเราะอย่างดีใจ "คนไหนคือคนที่ #EMP ท่าน#! เลือก?" เห็นได้ชัดจากคิ้วที่ขยับยุกยิกเกินไปของ [gossip_friend.GetHerHis] ว่า [gossip_friend.GetSheHe] ไม่ได้ถามว่าข้าคิดว่าใครจะชนะ\n\n"ดูสิ ดูสิ พวกเขากำลังเดินเข้ามาใกล้! พูดอะไรสักอย่างสิ! ดังพอที่พวกเขาจะได้ยิน!""
 tournament_events.1404.a:0 ""ไม่มีใครเทียบความงามของ #EMP ท่าน#! ได้เลย""
 tournament_events.1404.b:0 ""ฮ่า! ท่านทำได้ดีกว่าทั้งสองคนในสนามรบแห่งความรักเสียอีก!""
 tournament_events.1404.c:0 ""#BOL โอ้มายก้อด นั่นคือ [knight_1.GetFirstNameNoTooltip] รูปงามคนนั้นรึเปล่า?!#!""
 tournament_events.1404.d:0 ""#BOL ว้าว แค่ #EMP ดู#! [knight_2.GetFirstNameNoTooltip] สิ!#!""
 tournament_events.1404.e:0 ""#EMP ชู่ว์ ชู่ว์!#! #DIE1 พอ #EMP ได้แล้ว#! [gossip_friend.GetFirstName]!#!""

 tournament_events.1405.t:1 "$tournament_header$ [flirty_onlooker.Custom('GetLassLad')|U] ผู้โชคดี"
 tournament_events.1405.desc:0 "สายตาของข้ากวาดไปทั่วฝูงชน ความจอแจทั่วไปไหลเวียนอยู่รอบตัวข้า ผู้ชมทุกคนกำลังสนทนาหรือให้กำลังใจผู้เข้าแข่งขัน ยกเว้นคนหนึ่ง ข้าสังเกตเห็น\n\n[flirty_onlooker.GetFirstName] กำลังจ้องมองมาที่ข้าโดยตรง สายตาของเราประสานกันก่อนที่[flirty_onlooker.GetSheHe]จะหลบสายตาทันที กวาดสายตาของ[flirty_onlooker.GetHerHis]ไปที่อื่นที่ไม่ใช่ข้า ปกติข้าคงจะสงสัย แต่ริมฝีปากที่เม้มไว้และการเหลือบมองกลับมาตลอดเวลาเพื่อตรวจสอบว่าข้ายังคงเฝ้าดูอยู่หรือไม่นั้นบอกเล่าเรื่องราวที่แตกต่างออกไปในกรณีนี้"
 tournament_events.1405.a:0 "ข้อมูลที่เป็นประโยชน์สำหรับอนาคต!"
 tournament_events.1405.b:0 "แหม แหม แหม..."
 tournament_events.1405.b.tt:0 "ส่งยิ้มเล็กน้อยและขยิบตาให้ [flirty_onlooker.GetFirstNameNoTooltip] เป็นการตอบแทน"
 tournament_events.1405.c:0 "ข้ามาที่นี่เพื่อดู ไม่ใช่มาจีบ!"

 tournament_events.1406.t:1 "$tournament_header$ ประสบการณ์ใหม่"
 tournament_events.1406.desc:0 "ขณะเบียดเสียดฝูงชน ศีรษะเล็กๆ ของ [root_child.GetFirstNamePossessive] หันไปมาตลอดเวลา ซึมซับภาพและเสียงทั้งหมด [root_child.GetSheHe|U] สั่นสะท้านด้วยความตื่นเต้น ดึงมือข้าและชี้ไปที่ผู้เข้าร่วมที่รีบวิ่งผ่านไป\n\nข้าดึง [root_child.GetHerHim] เข้ามาเบาๆ แต่ [root_child.GetSheHe] ยังคงดึงออกไป ไม่สามารถควบคุมความตื่นเต้นของ [root_child.GetHerHis] ได้เมื่อเผชิญกับสถานการณ์ใหม่ๆ เช่นนี้"
 tournament_events.1406.a:0 ""ตั้งใจเรียนเถิด ลูก""
 tournament_events.1406.b:0 ""มาเถิด ขึ้นขี่คอพ่อ/แม่สิ!""
 tournament_events.1406.c:0 ""ข้าก็ตื่นเต้นเหมือนกัน [root_child.GetFirstNameNoTooltip]!""

 tournament_events.1407.t:1 "$tournament_header$ ปกป้องเกียรติยศ"
 tournament_events.1407.desc:0 "นั่น [competing_family.GetSheHe] อยู่นั่น! [ROOT.Char.Custom2('RelationToMeShort', competing_family)] ของข้า [competing_family.GetFirstName] กำลังแข่งขันในการแข่งขันนี้ และในที่สุดข้าก็สามารถมองเห็น [competing_family.GetHerHim] ในฝูงชนของผู้เข้าแข่งขันได้ ทันทีที่ข้าอ้าปากเพื่อตะโกนให้กำลังใจ ข้าก็ได้ยินเสียงอื่น\n\n"เฮ้ [competing_family.GetFirstNameNoTooltip]! กลับไปซะตอนนี้เลยดีกว่า จะได้ไม่ต้องลำบากพวกเราทุกคน!"\n\nข้ามองไปรอบๆ ท่ามกลางผู้ชมที่หัวเราะคิกคักเพื่อหา [shouting_fan.GetFirstName] ที่กำลังเตรียมคำสบประมาทชุดต่อไป"
 tournament_events.1407.a:0 "เจ้าเพิ่งพูดว่าอะไรนะ?!"
 tournament_events.1407.a.success:0 "ท่านชนะการต่อสู้"
 tournament_events.1407.a.failure:0 "ท่านแพ้การต่อสู้"
 tournament_events.1407.b:0 "สู้เขา [competing_family.GetFirstNameNoTooltip]! ชัยชนะเป็นของท่าน!"
 tournament_events.1407.b.success:0 "ท่านตะโกนกลบเสียง [shouting_fan.GetFirstNameNoTooltip] ได้สำเร็จ"
 tournament_events.1407.b.failure:0 "ท่านตะโกนกลบเสียง [shouting_fan.GetFirstNameNoTooltip] ไม่สำเร็จ"
 tournament_events.1407.c:0 "เอาเถอะ หวังว่า [competing_family.GetFirstNameNoTooltip] จะไม่เก็บไปใส่ใจ..."

 tournament_events.1408.t:0 "$tournament_header$ ดับกระหาย"
 tournament_events.1408.desc:0 "ดวงอาทิตย์สาดแสงลงมาขณะที่ข้าชมการแข่งขันดำเนินต่อไปจากจุดชมวิวที่แถวหน้าของฝูงชน วันนี้อากาศร้อนเกินไป หรือบางทีข้าอาจจะ แต่งตัวหนาเกินไป?\n\nข้ากำลังครุ่นคิดเกี่ยวกับเรื่องนี้เมื่อเห็นพ่อค้าหนุ่มผู้มีหัวการค้าแบกถังเครื่องดื่มที่ไม่ทราบชนิดไว้บนไหล่ข้างหนึ่ง เห็นได้ชัดว่าเสนอขายให้กับผู้คนที่เดินผ่านไปมาเพื่อแลกกับเหรียญ ปากของข้าแห้งผากทันที หากเพียง แต่ข้าจะไปถึงที่นั่นได้โดยไม่เสียจุดยืนของข้า...\n\nข้ามองไปรอบๆ อย่างสิ้นหวังเพื่อหาคำตอบ แต่เห็นเพียง [drinking_fan.GetFirstName] เดินกลับไปยังจุดยืนของ [drinking_fan.GetHerHis] ในฝูงชน พร้อมเครื่องดื่มในมืออย่างมั่นคง"
 tournament_events.1408.a:0 ""ข้าขอซื้อต่อจากท่านได้หรือไม่?""
 tournament_events.1408.a.tt:0 "นี่อาจจะต้องใช้การเกลี้ยกล่อมเล็กน้อย..."
 tournament_events.1408.b:0 "บางทีถ้าข้ารีบ..."
 tournament_events.1408.b.success:0 "ท่านรีบไปหาเครื่องดื่มและกลับมาได้อย่างง่ายดาย"
 tournament_events.1408.b.failure:0 "ท่านซื้อเครื่องดื่ม แต่เสียจุดยืนไป"
 tournament_events.1408.b.criticalfailure:0 "ท่านเสียจุดยืนและพ่อค้าก็เดินจากไป"
 tournament_events.1408.c:0 "ข้าคงต้องทนเอา"

 tournament_events.1409.t:0 "$tournament_header$ คนที่น่าเชียร์"
 tournament_events.1409.desc:0 "ข้าขยับตัวหลีกทางให้ใครบางคนผ่านไป แต่ทันทีที่ข้าทำ เช่นนั้น พวกเขาก็เริ่มพูดคุย\n\n"อา ท่าน [ROOT.Char.GetTitledFirstName]! ไม่นึกว่าจะเจอท่านที่นี่!" ข้าอ้าปากจะตอบ แต่ [friendly_fan.GetFirstName] เร็วกว่า "ข้าไม่คิดว่าท่านจะมีคนโปรดใช่ไหม? คนที่ท่านคิดว่าจะคว้าชัยชนะกลับบ้าน? ส่วนข้า ข้ารู้สึกดีเกี่ยวกับ [fan_favourite.GetFirstName]!"\n\nข้าพิจารณาทางเลือกของข้าสักครู่ บางทีอาจจะดีที่สุดที่จะเห็นด้วย?"
 tournament_events.1409.a:0 ""แน่นอน! ต้องเป็น [fan_favourite.GetFirstNameNoTooltip] อยู่แล้ว!""
 tournament_events.1409.b:0 ""เห็นๆ กันอยู่ว่าต้องเป็น [other_favourite.GetFirstNameNoTooltip] ไอ้ [friendly_fan.Custom2('InsultNoun', ROOT.Char)]!""
 tournament_events.1409.c:0 "บางทีถ้าข้าแค่ยิ้มและพยักหน้า..."

 tournament_events.1410.t:0 "$tournament_header$ แฟนๆ ที่ไม่พอใจ"
 tournament_events.1410.desc:0 "เหนือเสียงโห่ร้องของฝูงชน ข้าได้ยินเสียงการทะเลาะวิวาทที่กำลังก่อตัวขึ้นอย่างชัดเจน เมื่อชะเง้อคอไปมองด้านหลัง ข้าเห็นร่างสองร่าง แต่ละคนกำเสื้อผ้าของอีกฝ่ายไว้ ไม่แน่ชัดว่าข้อพิพาทนี้เกี่ยวกับเรื่องใด แต่กลุ่มคนดูที่โหวกเหวกก็ได้ก่อตัวเป็นวงล้อมเล็กๆ แล้ว\n\n"ไอ้ [fan_2.Custom2('InsultNoun', SCOPE.sC('fan_1'))] [fan_2.Custom2('InsultAdjective', SCOPE.sC('fan_1'))]!" [fan_1.GetFirstName] ถ่มน้ำลาย สบถขณะที่ [fan_1.GetSheHe] ยืดตัวเต็มความสูงของ[fan_1.GetHerHis] [fan_2.GetFirstName] ตอบโต้ในทำนองเดียวกัน\n\n"แกมันคนชั้นต่ำและเป็น [fan_1.Custom2('InsultNoun', SCOPE.sC('fan_2'))]! ข้าจะควักไส้แกออกมา!" ทั้งสองกำลังตั้งท่าสู้กันอย่างชัดเจน"
 tournament_events.1410.a:0 ""พอได้แล้ว!""
 tournament_events.1410.a.tt:0 "การพยายามเข้าไปห้ามอาจเสี่ยง แต่ข้าต้องทำ #EMP บาง#! อย่าง..."
 tournament_events.1410.a.success:0 "ท่านห้ามได้สำเร็จ"
 tournament_events.1410.a.failure:0 "ท่านได้รับบาดเจ็บจากการทะเลาะวิวาทที่ตามมา"
 tournament_events.1410.b:0 ""มาเถิด! นี่ไม่ใช่เวลาหรือสถานที่สำหรับการต่อสู้!""
 tournament_events.1410.b.success:0 "คำพูดที่สงบสติอารมณ์ของท่านได้ผล"
 tournament_events.1410.b.failure:0 "ทั้งคู่ยังคงต่อสู้กันต่อไป"
 tournament_events.1410.c:0 "ใช่! ตี [fan_1.GetHerHim] เลย!"
 tournament_events.1410.c.fan1:0 "[fan_1.GetFirstNameNoTooltip] ชนะการต่อสู้"
 tournament_events.1410.c.fan2:0 "[fan_2.GetFirstNameNoTooltip] ชนะการต่อสู้"

 # INTENT EVENTS
 tournament_events.6000.t:1 "$tournament_header$ ด้วยทุกวิถีทาง"
 tournament_events.6000.desc:0 "การประลองยุทธ์คือสถานที่อันสมบูรณ์แบบที่จะกำจัดไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)] [murder_target.GetTitledFirstName] นั่นให้พ้นไปจากข้าและโลกใบนี้ - อันตรายที่แฝงเร้นซุ่มซ่อนอยู่ทุกหัวมุม และข้อสงสัยต่างๆ ก็จะถูกปัดเป่าไปด้วยความถี่ของอุบัติเหตุ\n\n"
 tournament_events.6000.again:0 "[murder_target.GetTitledFirstName] ยังมีชีวิตอยู่...\n\n"
 tournament_events.6000.deferred:0 "ข้าได้รอคอยเวลาด้วยความอดทนอันน่าชื่นชม... รอคอยช่วงเวลาที่สมบูรณ์แบบที่จะโจมตี [murder_target.GetTitledFirstName]..."
 tournament_events.6000.foot:0 "การแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] ใกล้เข้ามาแล้ว และคมดาบอาบยาพิษในมือที่ถูกต้องสามารถสังหาร [murder_target.GetHerHim] ได้ในทันที...\n\n"
 tournament_events.6000.joust:0 "ทวนสำหรับการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] ถูก ทำให้ปลอดภัยด้วยปลายทู่ แต่การเตรียมการเปลี่ยนอย่างระมัดระวังด้วยทวนที่อันตรายกว่าอาจไม่มีใครสังเกตเห็น...\n\n"
 tournament_events.6000.self_match:0 "มันง่ายเกินไปที่จะดัดแปลงอุปกรณ์ของข้า ลบล้างมาตรการความปลอดภัยที่กำหนดโดยงานประลอง และสังหาร [murder_target.GetFirstNameNoTooltip] ต่อหน้าฝูงชน..."
 tournament_events.6000.patsy_match:0 "ข้าเพียงแค่ต้องดัดแปลงอุปกรณ์ของ [murder_match.GetFirstNamePossessive] ก่อนที่ [murder_match.GetSheHe] จะเผชิญหน้ากับ [murder_target.GetFirstNameNoTooltip] และภาวนาให้ดวงดาวเป็นใจ..."
 tournament_events.6000.injuries:0 "การบาดเจ็บที่เป็นไปได้"
 tournament_events.6000.a:0 "เป็นโอกาสที่น่าสนใจ"
 tournament_events.6000.b:0 "ใช่ ความผิดจะตกอยู่ที่ [murder_match.GetFirstNameNoTooltip]"
 tournament_events.6000.c:0 "ข้าจะสังหารเจ้าโง่นั่น!"
 tournament_events.6000.d:0 "ยังก่อน..."
 tournament_events.6000.e:0 "มันเสี่ยงเกินไป..."
 tournament_events.6000.success:0 "การก่อวินาศกรรมของท่านสำเร็จ"
 tournament_events.6000.failure:0 "การก่อวินาศกรรมของท่านไม่ได้ผล"
 tournament_events.6000.success_tt:0 "[murder_target.GetFirstNameNoTooltip] ถูกสังหารโดย [murder_match.GetFirstNameNoTooltip]"
 tournament_events.6000.blame:0 "ข้อกล่าวหาใดๆ จะตกอยู่ที่ [murder_match.GetShortUIName]"
 tournament_events.6000.imprisonment_tt:0 "เนื่องจาก [murder_target.GetFirstNameNoTooltip] เป็นเจ้าภาพ [murder_match.GetFirstNameNoTooltip] อาจถูกจำคุก"
 tournament_events.6001.t:0 "$tournament_events.6050.t$"
 tournament_events.6001.foot:0 "ข้าถูใบมีดด้วยยาพิษร้ายแรง พลางครุ่นคิดถึงคำสัญญาของนักเล่นแร่แปรธาตุที่ขายยาปรุงที่เหม็นเน่าให้ข้า ก่อนที่จะเก็บมันเข้าฝักอย่างระมัดระวัง"
 tournament_events.6001.horse:0 "ข้าเปลี่ยนทวนในคลังอาวุธเมื่อค่ำคืนมาถึง พวกมันนอนอยู่ในความมืด รอคอยเสียงแตรแห่งรุ่งอรุณ"
 tournament_events.6001.success_patsy:0 "\n\nหลังจากช่วงเวลาแห่งความตึงเครียดที่หัวใจเต้นแรง ข้าก็จากไป! หากโชคดี [murder_match.GetFirstName] จะไม่สังเกตเห็นจนกว่าจะสายเกินไป..."
 tournament_events.6001.success:0 "\n\nอุปกรณ์ที่ดัดแปลงอย่างแยบยลของข้าพร้อมสำหรับการแข่งขัน [activity.GetCurrentPhase.GetPhase.GetName|l] แล้ว ข้าเพียงแค่ต้องแน่ใจว่าข้าใช้มันอย่างถูกต้อง..."
 tournament_events.6001.failure:0 "\n\nอนิจจา เมื่อข้ากลับมาในเช้าวันรุ่งขึ้น เห็นได้ชัดว่าผู้ดูแลที่ฉลาดหลักแหลมสังเกตเห็นฝีมือของข้า - ความพยายามเหล่านี้ไม่ได้ทำอะไรเลยนอกจากเพิ่มความสงสัยในการเล่นสกปรก และเหล่าผู้ติดตามอัศวินก็ระมัดระวังตัวมากขึ้นกว่าเดิม"
 tournament_events.6001.closing:0 "\n\nวันของเจ้าจะมาถึงเร็วกว่าที่เจ้าคิด [murder_target.GetFirstName]..."
 tournament_events.6001.a:0 "และข้ารอไม่ไหวแล้ว..."
 tournament_events.6001.b:0 "ชิชะ..."
 tournament_events.6010.t:1 "$tournament_header$ สังหารคู่แข่ง"
 tournament_events.6010.desc:0 "เมื่อสิ้นสุดวัน ข้าสอดแนมคู่แข่งของข้า [murder_target.GetName] เห็นได้ชัดว่าสบายใจ ผ่อนคลายอยู่กับเพื่อนฝูง การแข่งขันนี้เป็นโอกาสที่สมบูรณ์แบบสำหรับ #EMP อุบัติเหตุ#! ที่จะเกิดขึ้นกับ [murder_target.GetHerHim]...\n\nในสภาพแวดล้อมที่ผ่อนคลาย เช่นนี้ ไม่น่าจะยากที่จะใส่บางอย่างลงในถ้วยของ [murder_target.GetHerHis]"
 tournament_events.6010.a:0 "ข้ารู้จักร้านขายยาอยู่ใกล้ๆ"
 tournament_events.6010.a.flavor:0 "[murder_target.GetFirstNameNoTooltip] จะได้พบกับยาพิษอีกชนิด!"
 tournament_events.6010.a.success:0 "คู่แข่งของท่านดื่มเครื่องดื่มแก้วสุดท้ายของ [murder_target.GetHerHis]"
 tournament_events.6010.a.ill:0 "ธาตุในกายของคู่แข่งของท่านถูกรบกวน"
 tournament_events.6010.a.failure:0 "คู่แข่งของท่านดูเหมือนจะไม่ได้รับผลกระทบ"
 tournament_events.6010.b:0 "พวกคนไร้ค่าที่ข้าเห็นก่อนหน้านี้อยู่ที่ไหน?"
 tournament_events.6010.b.flavor:0 "ไม่มีสิ่งใดมีประโยชน์ไปกว่าคนสิ้นหวัง..."
 tournament_events.6010.b.success:0 "คู่แข่งของท่านถูกสังหาร"
 tournament_events.6010.b.caught:0 "คู่แข่งของท่านปราบอันธพาลได้"
 tournament_events.6010.b.failure:0 "คู่แข่งของท่านหลบหนีอันธพาลไปได้"
 tournament_events.6010.c:0 "นี่ไม่ได้ผลหรอก..."

 tournament_events.6011.t:0 "$tournament_events.6010.t$"
 tournament_events.6011.poison:0 "ข้ารีบกลับมาจากร้านขายยา ซึ่งซื้อเรื่องหนูในคอกม้าของข้าเร็วเกินไป\n\nขณะที่บาร์เทนเดอร์ผู้ขยันขันแข็งเติมถ้วย มันง่ายอย่างน่าตกใจที่จะแอบใส่ยาปรุงลงในถ้วยของ [murder_target.GetFirstNamePossessive]\n\n"
 tournament_events.6011.thug:0 "อันธพาลรับเหรียญของข้า ตกลงตามเงื่อนไขของข้าด้วยการยอมจำนนอย่างหยาบกระด้าง และยืนยันการพยักหน้าอย่างแนบเนียนของข้าในทิศทางของ [murder_target.GetTitledFirstName]\n\n"
 tournament_events.6011.death:0 "บางทีอาจน่ากังวลยิ่งกว่า คือความเร็วที่ [murder_target.GetSheHe] ล้มลงหลังจากดื่มยาเข้าไป ดิ้นทุรนทุรายด้วยความเจ็บปวด สำลักขอความช่วยเหลือ"
 tournament_events.6011.ill:0 "ข้ากลั้นหายใจขณะที่ [murder_target.GetSheHe] ยกถ้วยขึ้นจดริมฝีปากของ [murder_target.GetHerHis] และลิงโลดในความสำเร็จอยู่ชั่วครู่ แต่มันก็ไม่เป็น เช่นนั้น ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)] นั่นแค่มีไข้ และคงจะรอดชีวิต"
 tournament_events.6011.second_chance:0 "น่ารำคาญที่ยาพิษดูเหมือนจะ ทำให้ [murder_target.GetWomanMan] สับสนเท่านั้น แต่เมื่อตาม [murder_target.GetHerHim] ออกไปข้างนอก ข้าพบว่าตอนนี้เราอยู่ตามลำพังในจุดที่เงียบสงัดภายในบริเวณงานประลอง\n\nนี่อาจเป็นโอกาสสุดท้ายของข้าที่จะบรรลุเป้าหมาย..."
 tournament_events.6011.ache:0 "มันออกฤทธิ์อย่างรวดเร็ว: ข้ามองดูขณะที่ผู้อุปถัมภ์รายล้อมไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)] ที่กำลังคร่ำครวญ แต่ไม่นานก็เป็นที่ประจักษ์ชัดว่าขวดยาไม่ได้มีฤทธิ์รุนแรงดังที่สัญญาไว้\n\nอย่างดีที่สุด [murder_target.GetSheHe] ก็แค่ต้องใช้ค่ำคืนอันเลวร้ายในส้วม... "
 tournament_events.6011.slain:0 "ข้าแทบจะนอนไม่หลับรอข่าว แต่ในใจข้าก็โล่งใจแล้วที่ได้กำจัดคู่แข่งของข้า\n\nเมื่อรุ่งสางมาถึง ทั่วทั้ง [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ต่างพูดถึงการโจมตีอันน่าสยดสยองต่อ [murder_target.GetFirstNameNoTooltip] ซึ่งถูกพบว่าถูกควักไส้ตายอยู่บนถนนโดยยาม มีกริชเปื้อนเลือดอยู่ข้างกาย [murder_target.GetHerHis]"
 tournament_events.6011.caught:0 "ข้าแทบจะนอนไม่หลับรอข่าว ความกลัวที่ไร้รูปแบบกัดกินหัวใจข้าจนถึงเช้า\n\nผู้ดูแลของข้าเคาะประตูเมื่อรุ่งสาง แจ้งข้าว่า [murder_target.GetFirstNameNoTooltip] อ้างว่า [murder_target.GetSheHe] เอาชนะอันธพาลที่พยายามจะสังหาร [murder_target.GetHerHim] ในตอนกลางคืน และกล่าวว่าข้าอยู่เบื้องหลัง"
 tournament_events.6011.escape:0 "ข้าแทบจะนอนไม่หลับรอข่าว แน่ใจว่ามีบางอย่างผิดพลาด\n\nหัวใจข้าคิดถูก [murder_target.GetFirstNameNoTooltip] ยังมีชีวิตอยู่ และข่าวความพยายามสังหาร [murder_target.GetHerHis] โดยคนแปลกหน้าสวมผ้าคลุมได้แพร่กระจายไปทั่ว [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 tournament_events.6011.a.death:0 "นั่นมันเกือบจะ #EMP ง่าย#! เกินไป..."
 tournament_events.6011.a.ill:0 "ยังมีความหวัง..."
 tournament_events.6011.a.slain:0 "เป็นเรื่องที่น่ารังเกียจจริงๆ"
 tournament_events.6011.a.caught:0 "เจ้าพวกจรจัดน่ารังเกียจ"
 tournament_events.6011.a:0 "โชคชะตาเล่นตลกอะไร เช่นนี้"
 tournament_events.6011.b:0 "ข้าต้องลงมือเดี๋ยวนี้"
 tournament_events.6011.b.success:0 "ท่านสังหารคู่แข่งของท่าน"
