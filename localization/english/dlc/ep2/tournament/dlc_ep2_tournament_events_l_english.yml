 tournament_events.6050.c.horse_race:0 "#EMP [sabotage_target_3.Custom('GetContestHorseRaceName')]#! ของ[sabotage_target_3.GetFirstNamePossessiveNoTooltip] ต้องถูกทำให้สงบลง"
