 contest_events.0911.wrathful:0 "ข้ายอมจำนนต่อความโกรธ ทุบตี [wrathful_victim.GetFirstName] อย่างไม่หยุดยั้งขณะที่ [wrathful_victim.GetSheHe] พยายามทนรับการโจมตีของข้า\n\n"
 contest_events.0911.melee:0 "[activity.GetCurrentPhase.GetPhase.GetName|l] หยุดลงทันที ขณะที่ผู้เกี่ยวข้องทุกคนหยุดอ้าปากค้างเมื่อ [wrathful_contestant.GetFirstName] ล้ม [wrathful_victim.GetFirstName] ลงกับพื้นด้วยเสียงคำราม ทุบตี [wrathful_victim.GetHerHim] อย่างบ้าคลั่ง\n\n"
 contest_events.0911.wrestling:0 "ไม่นานหลังจากการต่อสู้ [activity.GetCurrentPhase.GetPhase.GetName|l] ของพวกเขา [wrathful_contestant.GetTitledFirstName] ก็รู้สึกหงุดหงิดกับ [wrathful_victim.GetTitledFirstName] สูญเสียการควบคุมตนเองทั้งหมดและพุ่งเข้าใส่ [wrathful_victim.GetHerHim] ลงกับพื้น\n\n"
