 contest_events.0800.joust:1 "ผู้เข้าแข่งขันขี่ม้ารอบสนามประลอง ผู้รับใช้ถืออาวุธของพวกเขาสูงขึ้น ขณะที่ผู้ประกาศแจ้งการเริ่มการประกวด เหล่าผู้ติดตามวิ่งไปมา ประดับประดาด้วยสีของเจ้าเหนือหัวของพวกเขา ถืออุปกรณ์และเสบียงสำหรับการต่อสู้ข้างหน้า\n\n"
 contest_events.0800.wrestling:1 "เรียงรายอยู่รอบผืนทราย ผู้เข้าแข่งขันที่ไม่สวมเสื้อวอร์มอัพสำหรับการต่อสู้ของพวกเขาขณะที่ผู้ประกาศแจ้งการเริ่มการประกวด ผู้เข้าแข่งขันบางคนถูฝุ่นใส่ตัวเอง คนอื่นๆ เลือกใช้น้ำมัน ทั้งหมดมองหาความได้เปรียบเพียงเล็กน้อยในการต่อสู้ที่จะมาถึง\n\n"
 contest_events.0800.duel:1 "ผู้เข้าแข่งขันเดินขบวนเข้าสู่สนาม เข้าประจำที่รอบสี่เหลี่ยมประลอง ขณะที่ผู้ประกาศแจ้งการเริ่มการประกวด เวทีสี่เหลี่ยมกำลังถูกตรวจสอบอยู่เบื้องหลัง ถูกเขย่าและสั่น เพื่อให้แน่ใจว่าจะไม่ยุบหากผู้เข้าแข่งขันชนเข้ากับมัน\n\n"
 contest_events.0800.board_game:1 "ผู้เข้าแข่งขันเข้าประจำที่โต๊ะเล่นเกม ปัดเบาะรองนั่งและขอเครื่องดื่ม ขณะที่ผู้ประกาศแจ้งการเริ่มการประกวด ตัวเกมเองถูกจัดวางบนโต๊ะขาหยั่ง ตัวหมากถูกขัดจนเงาวับ\n\n"
 contest_events.0800.desc:0 "ระดับเสียงและระดับความดังที่หลากหลายของเสียงเชียร์ของฝูงชนไม่ทิ้งข้อสงสัยว่าใครคือตัวเต็ง"
 contest_events.0800.vs:2 "\n\nสำหรับการต่อสู้ครั้งแรกของข้า ข้าถูกจับคู่กับ [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)] ของข้า [versus_contestant.GetName]"
 contest_events.0800.champion_self: "แชมป์เปี้ยนของข้า [contest_champion.GetFirstName] และข้าจะแสดงให้พวกคนหยาบคายเหล่านี้เห็นว่าอะไรเป็นอะไร!\n\n"
