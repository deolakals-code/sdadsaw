 mysterious_stranger_wrestling:2 "ผู้มาใหม่ชื่อ [mysterious_stranger.GetFirstName] ซึ่งมีชื่อเสียงในท้องถิ่นของ [mysterious_stranger.GetHerHis] ได้มาถึง แสวงหาชื่อเสียงให้ [mysterious_stranger.GetHerselfHimself]"
