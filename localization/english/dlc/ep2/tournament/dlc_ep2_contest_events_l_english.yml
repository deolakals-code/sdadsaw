l_english: 
 ##### CONTEST #####

 ### SHARED
 contest_events_opening_prize_desc:1 ""แด่ผู้ชนะ: [newly_created_artifact.GetType|l] นี้ ด้วยความเอื้อเฟื้อจากเจ้าภาพผู้มีน้ำใจของเรา: [host.GetTitledFirstName]!""
 contest_events_marriage_prize_desc:1 ""แด่ผู้ชนะ การสมรสกับ [marriage_prize.GetTitledFirstName] ตามประกาศิตของเจ้าภาพผู้มีน้ำใจของเรา: [host.GetName]!""
 contest_events_opening_intent_contestant:0 "[intent_scope.GetName] กำลังแข่งขันในการประกวดด้วย"
 contest_events_opening_intent_contestant_team:0 "ข้าสังเกตว่า [intent_scope.GetName] ถูกจัดให้อยู่ในทีมของข้า..."
 contest_events_opening_intent_contestant_opposing:0 "ข้าสังเกตว่า [intent_scope.GetName] ถูกจัดให้อยู่ในทีมฝ่ายตรงข้าม..."
 contest_events_opening_intent_spectator:1 "\n\n[intent_scope.GetName] ไม่ได้แข่งขันในการประกวด"
 contest_events_opening_intent_contestant_horse_race:0 "[intent_scope.GetName] ได้ส่ง [intent_scope.Custom('ContestHorseRaceGender')] ของ [intent_scope.GetHerHis] #EMP [intent_scope.Custom('GetContestHorseRaceName')]#! เข้าร่วมด้วย"
 contest_events_closing_win_winner:0 "\n\nข้าได้พิสูจน์คุณค่าของตนอย่างไร้ข้อกังขา!"
 contest_events_closing_win_contestant:0 "\n\nข้าต้องพยายามให้หนักขึ้นหากจักคว้าชัยชนะในการประลองยุทธ์นี้!"
 tournament_events_murder_sabotage_contest_tt:0 "จะง่ายขึ้นที่จะสังหาร [murder_target.GetFirstName] โดย 'อุบัติเหตุ' ในการประกวดที่กำลังจะมาถึง"
 contest_events_closing_marriage_valid_host_only:1 "\n\nด้วยโชคชะตาที่พลิกผัน และทักษะอันปฏิเสธมิได้ ข้าคือ [marriage_prize.Custom('GetBrideGroom')] ที่เหมาะสมเพียงผู้เดียว..."
 contest_events_closing_marriage_valid:1 "ขึ้นอยู่กับข้าว่าจะรักษาคำพูดหรือไม่..."
 contest_events_closing_marriage_wedding_host:0 "\n\n""ตามคำตัดสินของ [host.GetHerHis] เอง [host.GetTitledFirstNameNoTooltip] ได้สมรสกับ [host.Custom2('RelationToMeShort', marriage_prize)] ของ [host.GetHerHis] [marriage_prize.GetFirstNamePossessive] ในฐานะผู้ชนะ!"
 contest_events_closing_marriage_wedding:0 "\n\n""ตามสัญญา [host.GetTitledFirstNameNoTooltip] ได้มอบ [host.Custom2('RelationToMeShort', marriage_prize)] ของ [host.GetHerHis] [marriage_prize.GetFirstNamePossessive] ให้สมรสกับ [contest_winner.GetFirstNameNoTooltip]!"
 contest_events_closing_marriage_betrothal_host:0 "\n\n""ตามคำตัดสินของ [host.GetHerHis] เอง [host.GetTitledFirstNameNoTooltip] ได้หมั้นหมาย [host.Custom2('RelationToMeShort', marriage_prize)] ของ [host.GetHerHis] [marriage_prize.GetFirstName] ในฐานะผู้ชนะ!"
 contest_events_closing_marriage_betrothal:1 "\n\n""ตามสัญญา [host.GetTitledFirstNameNoTooltip] ได้เสนอการหมั้นหมายของ [host.Custom2('RelationToMe', marriage_prize)] ของ [host.GetHerHis] [marriage_prize.GetFirstNamePossessive] ให้แก่ [contest_winner.GetFirstNameNoTooltip]!""
 contest_events_closing_marriage_reneged_winner:1 "\n\n"[host.GetTitledFirstNameNoTooltip] ปฏิเสธอย่างน่าอับอายที่จะรักษาสัญญาเรื่องรางวัลคือการสมรสกับ [host.Custom2('RelationToMe', marriage_prize)] ของ [host.GetHerHis] [marriage_prize.GetFirstNamePossessive]! นี่ถือเป็นการดูหมิ่นผู้ชนะอย่างแท้จริง!"
 contest_events_closing_marriage_invalid_slots:0 "$contest_events_closing_marriage_invalid$ อย่างไรเสีย [contest_winner.GetWomanMan] ก็ต้องการคู่ครองเพียงเท่านี้"
 contest_events_closing_marriage_invalid_family:0 "$contest_events_closing_marriage_invalid$ คงไม่เหมาะที่ [marriage_prize.GetWomanMan] จะสมรสกับ [marriage_prize.Custom2('RelationToMeShort', contest_winner)] ของ [marriage_prize.GetHerHis]"
 contest_events_closing_marriage_invalid:1 "\n\nดูเหมือนโชคชะตาได้กำหนดว่ารางวัลที่สัญญาไว้คือการสมรสกับ [host.Custom2('RelationToMeShort', marriage_prize)] ของ [host.GetTitledFirstNamePossessive] [marriage_prize.GetFirstNamePossessive] นั้นมิอาจเป็นไปได้"
 contest_events_closing_marriage_host_refused:0 "\n\nมีเพียง [host.GetTitledFirstName] [host.GetHerselfHimself] เท่านั้นที่เป็นคู่ครองที่เหมาะสม และ [host.GetSheHe] ตัดสินใจที่จะไม่สมรสกับ [host.Custom2('RelationToMeShort', marriage_prize)] ของ [host.GetHerHis]"

 contest_events_closing_marriage_host:0 "ด้วยโชคชะตาที่พลิกผัน และทักษะอันปฏิเสธมิได้ ข้าพบว่าตนเองอยู่ในหมู่ผู้ชนะที่มีสิทธิ์..."
 contest_events_closing_marriage_three:0 "[bachelor_1.GetFullName], [bachelor_2.GetFullName], และ [bachelor_3.GetFullName] ล้วนกระตือรือร้นที่จะ แต่งงาน และเป็นผู้ชนะที่ได้รับชัยชนะในสิทธิของตนเอง"
 contest_events_closing_marriage_two:0 "[bachelor_1.GetFullName] และ [bachelor_2.GetFullName] ต่างเป็นคู่ที่เหมาะสม เป็นผู้ชนะที่ได้รับชัยชนะในสิทธิของตนเอง"
 contest_events_closing_marriage_one:0 "ดูเหมือนว่า [bachelor_1.GetFullName] เป็นคู่ครองที่เหมาะสมเพียงผู้เดียว"
 contest_events_closing_marriage_none:0 "อย่างไรก็ตาม ไม่มีผู้ชนะคนใดเป็นคู่ครองที่มีสิทธิ์..."

 every_tournament_attendee_tt:0 "ผู้เข้าร่วมการประลองยุทธ์ทุกคน"
 ### RACE ###
 # START
 contest_events.0500.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: การประกวดเริ่มขึ้น"
 contest_events.0500.horse_race:1 "ม้าที่ดีที่สุดใน [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ประดับประดาด้วยสีของเจ้าของ ถูกนำเดินรอบ [activity.Custom('ContestHorseRaceTrack')] ขณะที่ผู้ประกาศแจ้งการเริ่มการประกวด เหล่าผู้ขี่เดินไปมารอคอยสัตว์ร้ายมาถึง บ้างยืดเส้นยืดสาย บ้างจ้องมองกันและกัน\n\n"
 contest_events.0500.contestant_horse:0 "ม้าที่เร็วที่สุดของข้า #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! ไม่ได้รอดพ้นสายตาของนักเพาะพันธุ์และนักพนัน\n\n"
 contest_events.0500.closing:0 "ไม่มีอะไรดีไปกว่าการแข่งที่ดี"
 mysterious_stranger_horse_race:0 "ดูเหมือนว่า [mysterious_stranger.Custom('ContestHorseRaceGender')] ของ [mysterious_stranger.GetFullNamePossessive] #EMP [mysterious_stranger.Custom('GetContestHorseRaceName')]#! ได้ดึงดูดสายตาของหลายคนในฐานะผู้เข้าแข่งขันที่ไม่น่าเป็นไปได้\n\n"
 contest_events.0500.a.contestant:0 "นี่จะเป็นการแข่งที่น่าดูชมทีเดียว"
 contest_events.0500.a:0 "ช่างเป็นการแสดงที่น่าตื่นตา"
 contest_events.0500.b:0 "ข้ามีการเดิมพันที่ต้องวาง..."
 contest_events.0500.c:0 "ม้าของข้า #EMP จะต้อง#! ถูกส่งเข้าแข่ง!"
 contest_events.0500.d:0 "[rival_contestant.GetTitledFirstNamePossessiveNoTooltip] จะ #EMP ไม่ได้#! วิ่ง"
 contest_events.0500.e:0 "ต้องมีวิธีที่จะนำม้าของข้าเข้าแข่งให้ได้..."
 contest_events_place_wager_tt:2 "วางเดิมพัน [gold_i|E][gold|E] กับผู้ชนะการประกวด [contest|E] [activity.GetCurrentPhase.GetPhase.GetName]"
 # END
 contest_events.0505.t:2 "ผู้ชนะการประกวด"
 contest_events.0505.t.horse_race:1 "$tournament_phase_horse_race$: $contest_events.0505.t$"
 contest_events.0505.horse_race:1 "ม้าของ [contest_winner.GetShortUINamePossessiveNoFormat|U] #EMP [contest_winner.Custom('GetContestHorseRaceName')|U]#! ข้ามเส้นชัยขณะที่ฝูงชนโห่ร้อง ตามมาติดๆ ด้วย #EMP [second_place.Custom('GetContestHorseRaceName')|U]#! ของ [second_place.GetShortUINamePossessiveNoFormat] และ #EMP [third_place.Custom('GetContestHorseRaceName')|U]#! ของ [third_place.GetShortUINamePossessiveNoFormat]!!\n\n"
 contest_events.0505.first_horse:1 "ใช่แล้ว #EMP [ROOT.Char.Custom('GetContestHorseRaceName')|U]#!! เจ้า [ROOT.Char.Custom('ContestHorseRaceGender')] แสนสวย!"
 contest_events.0505.first_maydan:0 "ใช่แล้ว #EMP ซาบิก#! ของข้า!! เจ้า [ROOT.Char.Custom('ContestHorseRaceGender')] แสนสวย!!"
 contest_events.0505.second_horse:0 "เกือบแล้ว #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!..."
 contest_events.0505.second_maydan:0 "เกือบแล้ว #EMP มุตาบัรริซ#! ของข้า เกือบแล้ว..."
 contest_events.0505.third_horse:0 "ที่สาม... ทำได้ดี #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! เจ้าได้ตำแหน่งที่ดีที่สุดที่แย่ที่สุด..."
 contest_events.0505.third_maydan:0 "#EMP มุจัลลี#!... เชื่อข้าเถอะ ข้าพอใจได้มากกว่านี้..."
 contest_events.0505.contestant_horse:1 "#EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! ไม่ได้อันดับเลยด้วยซ้ำ ข้าจะต้องเตรียมตัวให้ดีกว่านี้ในครั้งหน้า!"
 contest_events.0505.spectator:0 "เป็นงานที่น่าตื่นเต้น!"
 contest_events.0505.a.winner:0 "ข้า [ROOT.Char.GetTitleAsNameNoTooltip] ของท่าน ชนะแล้ว!"
 contest_events.0505.a.marriage:0 "ข้าคิดว่ารางวัลคงจะพอ"
 contest_events.0505.a:0 "ทำได้ดี [contest_winner.GetTitledFirstNameNoTooltip]"
 contest_events.0505.b:0 "[ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip] ข้าชนะเพื่อท่าน!"
 contest_events.0505.c.winner:0 "ดูเหมือนว่าเราจะต้อง แต่งงานกัน [marriage_prize.GetFirstNameNoTooltip]"
 contest_events.0505.c:0 "ทำได้ดี มือของ [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] เป็นของท่านแล้ว"
 contest_events.0505.d.winner:0 "ข้าชนะ! ข้าชนะ #EMP จริงๆ#! แล้ว!"
 contest_events.0505.d.second:0 "เกือบแล้ว..."
 contest_events.0505.d.loser:0 "ยังมีครั้งหน้าเสมอ..."
 contest_events.0505.d:0 "โชคต้องเข้าข้าง [contest_winner.GetHerHim]"

 contest_events.0510.t:0 "$tournament_contest_header$ รอบสุดท้าย"
 contest_events.0510.desc:0 "ม้ายังคงควบไปรอบสนามแข่ง ผู้ขี่ที่เหลือดึงบังเหียนม้าเพื่อกระตุ้นให้เร็วขึ้น เป็นการแข่งที่มีเหตุการณ์มากมายแล้ว ข้าคิด พลางนึกถึงตอนที่"
 contest_events.0510.flavor_1:0 "ผู้ขี่ของข้าตกจากอานม้า เพียงเพื่อจะฟื้นตัวและกระโดดกลับขึ้นไปใหม่\n\n"
 contest_events.0510.flavor_2:0 "ข้าเชียร์ผู้ขี่ของข้าอย่างบ้าคลั่ง\n\n"
 contest_events.0510.flavor_3:0 "ผู้ขี่สองคนและม้าของพวกเขาชนกัน\n\n"
 contest_events.0510.flavor_4:0 "ฝูงชนเกือบจะก่อจลาจล\n\n"
 contest_events.0510.flavor_5:0 "ผู้ขี่ของข้าพุ่งเข้าด้านในของสนามแข่ง ได้เปรียบอย่างมาก\n\n"
 contest_events.0510.flavor_6:0 "ม้าหลายตัวชนกัน ทำให้ผู้ขี่สามคนตกรอบในคราวเดียว\n\n"
 contest_events.0510.flavor_7:0 "ม้าของข้าถูกม้าของคู่แข่งชน\n\n"
 contest_events.0510.flavor_8:0 "ผู้ชมทุกคนหลงใหลในจ็อกกี้ที่สวยงาม\n\n"
 contest_events.0510.flavor_9:0 "ชาวบ้านคนหนึ่งวิ่งเปลือยกายเข้ามาในสนามแข่ง\n\n"
 contest_events.0510.flavor_fallback:0 "เหลืออีกเพียงรอบเดียวเท่านั้น! ข้าโน้มตัวข้ามขอบอัฒจันทร์และตะโกนบอกผู้ขี่ของข้าขณะที่กลุ่มม้าวิ่งผ่าน"
 contest_events.0510.a:0 ""จ่ายเพิ่มถ้าเจ้าชนะ!""
 contest_events.0510.b:0 ""ตีพวกมัน! ที่หน้า!""
 contest_events.0510.c:0 ""คว้าบังเหียนพวกมัน!""
 contest_events.0510.d:0 ""ไป! #EMP เร็วขึ้น!#!""

 contest_events.0530.t:0 "$tournament_contest_header$ ม้าสำหรับสนามแข่ง"
 contest_events.0530.pivotal_success:0 "กลอุบายของผู้ขี่ของข้าได้ผล! ม้าของข้าพุ่งไปข้างหน้าขณะที่พวกมันเลี้ยวโค้งสุดท้ายเข้าสู่ทางตรง เหลือเวลาอีกเพียงไม่กี่อึดใจ...\n\n"
 contest_events.0530.pivotal_neutral:0 "ยากที่จะบอกว่าคำแนะนำของข้าสร้างความแตกต่างได้มากน้อยเพียงใด และม้าทั้งหมดเลี้ยวโค้งสุดท้ายเข้าสู่ทางตรงโดยรวมกันเป็นกลุ่มก้อน\n\n"
 contest_events.0530.pivotal_failure:0 "เสียสมดุลและประหลาดใจกับเสียงเรียกของข้า ผู้ขี่ของข้าโซเซและเกือบจะล้ม ม้าของข้าเสียหลักเล็กน้อยขณะที่พวกมันเลี้ยวโค้งสุดท้ายเข้าสู่ทางตรง นี่จะต้องสูสีกันมาก...\n\n"
 contest_events.0530.ptv_close:0 "แทบจะเป็นไปไม่ได้ที่จะบอกว่าใครจะคว้าชัยชนะ พวกมันสูสีกันมาก!"
 contest_events.0530.ptv_top:0 "ม้าของข้ากำลังควบหนีกลุ่มที่ไล่ตาม! ถ้ามันสามารถต้านทานคู่แข่งได้ เราจะชนะ!"
 contest_events.0530.ptv_top_spectator:0 "ม้าของ [pivotal_contestant.GetFirstNamePossessive] ควบหนี! สิ่งที่พวกเขาต้องทำตอนนี้คือเข้าเส้นชัย!"
 contest_events.0530.ptv_bottom:0 "ม้าของข้าอยู่ท้ายสุด และข้ารู้สึกว่าชัยชนะกำลังหลุดลอยไป เราต้องการบางอย่าง #EMP อะไรก็ได้#!..."
 contest_events.0530.ptv_bottom_spectator:0 "ม้าของ [pivotal_contestant.GetFirstNamePossessive] ดูเหมือนจะพ่ายแพ้แล้ว [pivotal_contestant.GetSheHe|U] ต้องการบางอย่าง #EMP อะไรก็ได้#!..."
 contest_events.0530.ptv_top_half:0 "ม้าของข้าอยู่ในกลุ่มผู้นำอย่างสบายๆ แต่มันก็เป็นการแข่งขันที่สูสี เราต้องการแรงผลักดันอีกครั้งเพื่อคว้าชัยชนะ!"
 contest_events.0530.ptv_top_half_spectator:0 "ม้าของ [pivotal_contestant.GetFirstNamePossessive] อยู่ในครึ่งบน แต่มันก็เป็นการแข่งขันที่สูสี เกียรติยศยังคงรออยู่"
 contest_events.0530.ptv_bottom_half:0 "ม้าของข้าถูกขวางอยู่ในกลุ่มที่สองของนักวิ่ง แต่ชัยชนะยังไม่พ้นสายตา หากผู้ขี่ของข้าสามารถหาช่องว่างได้ บางทีเราอาจจะยังสามารถคว้าชัยชนะได้..."
 contest_events.0530.ptv_bottom_half_spectator:0 "ม้าของ [pivotal_contestant.GetFirstNamePossessive] ถูกขวางอยู่ใกล้ท้าย แต่ยังไม่จบ การกระทำเพียงครั้งเดียวอาจพลิกสถานการณ์ให้พวกเขาได้..."
 contest_events.0530.ptv_fallback:1 "การแข่งขันดำเนินไปสู่บทสรุป ม้าแทบจะยืดคอออกไปเพื่อไปให้ถึงเส้นชัย"
 contest_events.0530.spectator:0 "\n\nเหงื่อกระเซ็นจากม้าที่กำลังควบขณะที่พวกมันเลี้ยวโค้งสุดท้าย ผู้ขี่กระตุ้นพวกมันด้วยเสียงที่แหบแห้งขณะที่ฝูงชนโห่ร้องและตะโกนใส่ฉากนั้น"
 contest_events.0530.final:0 "\n\nฝูงชนโห่ร้องถึงขีดสุด เหล่าผู้ขี่กระตุ้นม้าของตนพร้อมเพรียงกัน เส้นชัยใกล้เข้ามาแล้ว"
 contest_events.0530.a:0 "อีกเฮือกเดียว!"
 contest_events.0530.b:0 "อีกไม่ไกลแล้ว!"

 contest_events.0520.t:0 "ม้าศึก"
 contest_events.0520.desc:0 "การแข่งม้าใกล้เข้ามาแล้ว และความคิดที่จะส่งม้าศึกของข้า #EMP [ROOT.Char.Custom('WarhorseStoryName')]#! แทนที่จะเป็นม้านักแข่งของข้า #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! ก็อยู่ในใจข้ามาหลายวันแล้ว\n\nข้าคงไม่ได้ขี่ [ROOT.Char.Custom('HorseStoryHerHim')] ด้วยตัวเอง แต่ [ROOT.Char.Custom('HorseStorySheHe')] ก็มีจิตวิญญาณอยู่ดี..."
 contest_events.0520.a:0 "#EMP [ROOT.Char.Custom('WarhorseStoryName')]#! จะไม่ ทำให้ข้าผิดหวัง"
 contest_events.0520.b:0 "ไม่ สถานที่ของ [ROOT.Char.Custom('HorseStoryHerHis')] คือในสนามรบ"
 contest_horse_race_enter_war_horse_tt:0 "ส่งม้าศึกของท่านเข้าร่วมการแข่งม้า"
 ### TEAM ###
 # START
 contest_events.0600.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: การประกวดเริ่มขึ้น"
 contest_events.0600.melee:1 "มีการแบ่งแยกที่ชัดเจนระหว่างสองทีม ซึ่งยืนอยู่ตรงข้ามกัน เยาะเย้ยขณะเตรียมอุปกรณ์และกระซิบแผนการ ม้าถูกเตรียมพร้อมอยู่เบื้องหลัง ม้าศึกร้องเสียงดังและส่งเสียงฮึดฮัด มันจะเป็นวันทำงานที่โหดร้าย\n\n"
 contest_events.0600.contestant:1 "ทีมของข้ามั่นใจว่าจะเอาชนะกลุ่มคนขี้โอ้อวดของ [other_team_captain.GetTitledFirstNamePossessive] ได้!\n\n"
 contest_events.0600.champion_self:1 "แชมป์เปี้ยนของข้า [contest_champion.GetFirstName] และข้าจะแสดงให้ [other_team_captain.GetTitledFirstName] เห็นว่าอะไรเป็นอะไร!\n\n"
 contest_events.0600.champion:1 "แชมป์เปี้ยนของข้า [contest_champion.GetFirstName] จะแสดงให้ [other_team_captain.GetTitledFirstName] เห็นว่าอะไรเป็นอะไร!\n\n"
 contest_events.0600.neither_qualify:1 "ทั้งข้าและแชมป์เปี้ยนของข้า [contest_champion.GetFirstName] ไม่ผ่านเข้ารอบ"
 contest_events.0600.champion_qualify:0 "แชมป์เปี้ยนของข้า [contest_champion.GetFirstName] ไม่ผ่านเข้ารอบในครั้งนี้"
 contest_events.0600.self_qualify:0 "ขณะที่ข้าก้าวไปหาผู้ตัดสินเพื่อยืนยันตำแหน่งของข้า ข้าถูกปฏิเสธ: ข้าไม่ผ่านเข้ารอบในครั้งนี้"
 contest_events.0600.closing:0 "นี่น่าจะดี"
 contest_events.0600.a:0 "สู่สนาม!"
 contest_events.0600.a.contestant:0 "เกียรติยศจะเป็นของเรา!"
 contest_events.0600.captains_tt:0 "[my_team_captain.GetShortUIName|U] และ [other_team_captain.GetShortUIName] เป็นกัปตันทีม เนื่องจาก [rank|E] และประสบการณ์"
 contest_events.0600.team_tt:0 "ท่านอยู่ในทีมของ [my_team_captain.GetShortUINamePossessive]"
 # END
 contest_events.0605.t.melee:0 "$tournament_phase_melee$: $contest_events.0605.t$"
 contest_events.0605.t:2 "ผู้ชนะการประกวด"
 contest_events.0605.desc:3 "เสียงแตรดังขึ้น ฝูงชนโห่ร้อง ผู้เข้าแข่งขันเริ่มรวมตัวกัน การประกวดสิ้นสุดลงแล้ว และช่วงเวลาแห่งความรุ่งโรจน์ของทีมหนึ่งกำลังจะมาถึง ผู้ประกาศก้าวออกมา เสียงดังก้องไปทั่วฉาก\n\n"หลังจากผ่านการทดลองมากมาย ความยากลำบากบางประการ และเหนือสิ่งอื่นใดคือการแข่งขันที่เต็มไปด้วยจิตวิญญาณอย่างแท้จริง เราก็ได้ผู้ชนะของเรา: ทีมของ [contest_winner.GetTitledFirstNamePossessive] เอาชนะทีมของ [second_place.GetTitledFirstNamePossessive] ในการประกวด!"\n\n"
 contest_events.0605.desc.winner:0 "เล่นได้ดีทุกคน! ได้เวลาฉลองแล้ว!"
 contest_events.0605.desc.loser:0 "ข้าไม่สามารถนำทีมไปสู่ชัยชนะได้ในครั้งนี้..."
 contest_events.0605.desc.team_winner:0 "เกมที่ดี! ไม่มีอะไรดีไปกว่าความตื่นเต้นของชัยชนะ!"
 contest_events.0605.desc.team_loser:0 "โอ้ ไม่เป็นไร... เราคงต้องฝึกหนักขึ้นสำหรับครั้งหน้า..."
 contest_events.0605.desc.spectator:0 "กีฬาที่น่าตื่นเต้น แม้กระทั่งสำหรับผู้ชม!"
 contest_events.0605.a.host_winner:0 "[ROOT.Char.GetTitleAsNameNoTooltip] นั้นไม่มีใครเทียบได้!"
 contest_events.0605.a.host_loser:0 "แม้ แต่ [ROOT.Char.GetTitleAsNameNoTooltip] ก็ไม่สามารถชนะได้ทั้งหมด..."
 contest_events.0605.a.winner:0 "เราทำได้ เราชนะ!"
 contest_events.0605.a.loser:0 "เราจะเอาคืนเจ้าในครั้งหน้า!"
 contest_events.0605.a:0 "ช่างเป็นกีฬาที่วุ่นวาย"

 contest_events.0610.t:0 "$tournament_contest_header$ เข้าสู่การต่อสู้"
 contest_events.0610.desc:0 "เงาทอดยาวขณะที่การต่อสู้ดำเนินต่อไป การต่อสู้ลดน้อยลงเมื่อผู้เข้าแข่งขันเดินกะเผลกออกไป ข้าหมุนม้า พลางนึกถึงสิ่งที่เกิดขึ้นจนถึงตอนนี้ เช่น ตอนที่"
 contest_events.0610.flavor_1:0 "ข้าเสียอารมณ์และทุบคู่แข่งอีกคนจนเลือดอาบ\n\n"
 contest_events.0610.flavor_2:0 "นายกเทศมนตรีของชุมชนท้องถิ่นโกรธจัดหลังจากการทะเลาะวิวาทลุกลามไปตามถนน\n\n"
 contest_events.0610.flavor_3:0 "อาวุธของข้าถูกกระแทกหลุดจากมือ ทำให้ข้าต้องรีบคว้ามันกลับมา\n\n"
 contest_events.0610.flavor_4:0 "วิญญาณหลงทางที่น่าหลงใหลเดินเข้ามาในการต่อสู้\n\n"
 contest_events.0610.flavor_5:0 "ข้าได้รับสิทธิ์ในการเรียกค่าไถ่จำนวนมาก!\n\n"
 contest_events.0610.flavor_6:0 "เมื่อต้องการพักผ่อน ข้าได้หลบภัยชั่วคราวในที่หลบภัย\n\n"
 contest_events.0610.flavor_7:0 "ข้าเผชิญหน้ากับนักรบชื่อดังและรอดชีวิตมาเล่าเรื่องได้\n\n"
 contest_events.0610.flavor_8:0 "ข้าซ่อนตัวอยู่ในต้นไม้ วางกับดักสำหรับผู้สัญจรไปมาที่ไม่สงสัย\n\n"
 contest_events.0610.flavor_9:0 "ข้าควบม้าผ่านการต่อสู้ มองดูคนอื่นตกจากหลังม้า\n\n"
 contest_events.0610.flavor_10:0 "ข้าค้นพบอัศวินลึกลับที่มีทักษะยอดเยี่ยมกำลังต่อสู้ฝ่าฟันการต่อสู้\n\n"
 contest_events.0610.flavor_11:0 "ข้าถูกอัศวินฝ่ายตรงข้ามสามคนล้อม\n\n"
 contest_events.0610.flavor_12:0 "ข้าช่วยสมาชิกในตระกูลจากสถานการณ์อันตราย\n\n"
 contest_events.0610.flavor_fallback:0 "เหตุการณ์กำลังจะถึงจุดไคลแม็กซ์อย่างชัดเจน ขณะที่แนวรบที่เหนื่อยล้าถูกจัดขึ้นอีกครั้ง โอกาสที่จะประทับตราของข้าในการประกวดนี้คือตอนนี้"
 contest_events.0610.a:0 "ข้าจะคว้าชัยชนะของทหาร!"
 contest_events.0610.b:0 ""ตามข้ามา! สู่ชัยชนะ!""
 contest_events.0610.c:0 "บางที ถ้าเราล่อพวกเขามาที่นี่..."
 contest_events.0610.d:0 "บางทีเราควรจะแค่ขี่ม้าผ่านไป?"
 contest_events.0610.d.tt:0 "ลูกเต๋าถูกทอดแล้ว ข้าไม่ควรไปรบกวนมัน"

 contest_events.0620.t:0 "$tournament_contest_header$ การโจมตีครั้งสุดท้าย"
 contest_events.0620.pivotal_success:0 "กลอุบายเป็นการโจมตีที่น่าทึ่ง! กระแสเปลี่ยนไปในทางที่ทีมของข้าได้เปรียบ ผู้ขี่หลายคนหลุดออกมาขณะที่เราเอาชนะปีกของพวกเขา ควบม้าไปยังค่ายของฝ่ายตรงข้าม เราได้ แต่หวังว่าพวกเขาจะไปถึงก่อนที่สิ่งเดียวกันจะเกิดขึ้นกับเรา\n\n"
 contest_events.0620.pivotal_neutral:0 "ยากที่จะบอกว่าการเดิมพันครั้งสุดท้ายของข้าสร้างความแตกต่างได้มากน้อยเพียงใด มันไม่ได้ ทำให้เราเสียเปรียบอย่างแน่นอน แต่การต่อสู้ที่หนักหน่วงยังคงอยู่ในสภาพเดิม\n\n"
 contest_events.0620.pivotal_failure:0 "ในฐานะกลยุทธ์ มันแทบจะไม่ใช่สิ่งที่ดีที่สุดของข้า แม้ว่าข้าจะไม่บรรยายถึงสถานการณ์ของเราว่าหายนะโดยสิ้นเชิง แต่ทีมศัตรูที่เจาะทะลุศูนย์กลางของเราและเริ่มควบม้าไปยังค่ายที่ไม่มีการป้องกันของเราอาจส่งสัญญาณถึงจุดจบของโอกาสของเราได้\n\n"
 contest_events.0620.ptv_close:0 "แทบจะเป็นไปไม่ได้ที่จะบอกว่าฝ่ายใดใกล้จะได้รับชัยชนะมากที่สุด ยังมีทุกอย่างให้เล่น"
 contest_events.0620.ptv_close_spectator:0 "ทั้งสองทีมเกือบจะเท่ากัน! ใครจะชนะขึ้นอยู่กับเส้นยาแดงผ่าแปด"
 contest_events.0620.ptv_top:0 "ทีมของข้าอยู่ในสภาพที่ดีกว่าอย่างชัดเจน! ชัยชนะใกล้เข้ามาจนข้าสัมผัสได้!"
 contest_events.0620.ptv_top_spectator:0 "ทีมของ [pivotal_contestant.GetFirstNamePossessive] อยู่ในอำนาจสูงสุดอย่างชัดเจน! สิ่งที่พวกเขาต้องทำตอนนี้คือเข้าเส้นชัย!"
 contest_events.0620.ptv_bottom:0 "ทีมของข้ากำลังแพ้ และเห็นได้ชัด ข้ารู้สึกว่าชัยชนะกำลังหลุดลอยไปอย่างมั่นคง แต่แน่นอน มันจะต้องใช้ความพยายามอย่างมากในการชนะจากจุดนี้..."
 contest_events.0620.ptv_bottom_spectator:0 "ทีมของ [pivotal_contestant.GetFirstNamePossessive] ดูบอบช้ำและเกือบจะพ่ายแพ้แล้ว มันจะต้องใช้ความพยายามอย่างมหาศาลในการชนะจากจุดนี้..."
 contest_events.0620.ptv_top_half:0 "ทีมของข้ากำลังชนะ แต่มันก็เป็นการแข่งขันที่สูสี เราแค่ต้องอดทนไว้!"
 contest_events.0620.ptv_top_half_spectator:0 "ทีมของ [pivotal_contestant.GetFirstNamePossessive] กำลังนำหน้าอยู่เล็กน้อย แต่มันก็เป็นการแข่งขันที่สูสี เกียรติยศยังคงรออยู่"
 contest_events.0620.ptv_bottom_half:0 "เรากำลังแพ้ แต่ชัยชนะยังไม่พ้นสายตา แค่ความพยายามครั้งสุดท้าย...!"
 contest_events.0620.ptv_bottom_half_spectator:0 "ทีมของ [pivotal_contestant.GetFirstNamePossessive] กำลังแพ้ แต่ยังไม่จบ การกระทำเพียงครั้งเดียวอาจพลิกสถานการณ์ให้พวกเขาได้..."
 contest_events.0620.ptv_fallback:0 "การต่อสู้หมุนวนต่อไป ใกล้เข้ามาเรื่อยๆ สู่บทสรุป"
 contest_events.0620.spectator:0 "\n\nเสียงโลหะกระทบกันเป็นจังหวะยังคงดังแหวกอากาศ ผู้ชมที่เรียงรายอยู่ห่างๆ ที่ขอบของการต่อสู้ กระตุ้นผู้ที่พวกเขาชื่นชอบ แม้ว่าผู้เข้าแข่งขันจะตกเป็นเหยื่อของค่าไถ่และความพินาศมากขึ้นเรื่อยๆ"
 contest_events.0620.final:0 "\n\nข้าเห็นผู้ประกาศเริ่มเดินเข้ามาในสนามเพื่อส่งสัญญาณสิ้นสุดงาน จุดจบใกล้เข้ามาแล้ว"
 contest_events.0620.a:0 "อีกเฮือกเดียว!"
 contest_events.0620.b:0 "อีกไม่นานแล้ว!"
 ### TURN ###
 # START
 contest_events.0700.t:1 "[activity.GetCurrentPhase.GetPhase.GetName]: การประกวดเริ่มขึ้น"
 contest_events.0700.archery:1 "ฝูงชนผู้เข้าแข่งขันที่หลากหลายเดินไปมาบริเวณเป้าธนู เปรียบเทียบคันธนูและแลกเปลี่ยนเรื่องราวการยิงที่ดีที่สุดของพวกเขา เสียงคันธนูง้างและเสียงสายธนูดีดดังไปไกล แทรกแซงเสียงจอแจ กลิ่นยางสนลอยผ่านอากาศที่นิ่งสงบ\n\n"
 contest_events.0700.recital:0 "ผู้เข้าแข่งขันเดินไปมาในเต็นท์หลัก วอร์มเสียงและท่องจำบทกวีขณะที่ฝูงชนเต็มอัฒจันทร์\n\n"
 contest_events.0700.contestant:2 "หูของข้าผึ่งขึ้นเมื่อชื่อของข้าถูกเอ่ยถึง ลอยมาตามสายลมอ่อนๆ นั่นอาจเป็นสัญญาณที่ดีหรือไม่ดีก็ได้..."
 contest_events.0700.champion:1 "บางทีแชมป์เปี้ยนของข้า [contest_champion.GetName] อาจจะ ทำให้ข้าภูมิใจ\n\n"
 contest_events.0700.closing:0 "ขอให้ผู้ที่เก่งที่สุดชนะ!"
 contest_events.0700.a:0 "ข้าสงสัยว่าใครจะชนะ!"
 contest_events.0700.a.contestant:0 "ถึงเวลาแสดงทักษะของข้าให้โลกเห็นแล้ว"
 contest_events.0700.b:0 "ข้ามีการเดิมพันที่ต้องวาง..."
 contest_events.0700.c:0 "ข้า #EMP จะต้อง#! เข้าร่วมการประกวดของข้าเอง"
 contest_events.0700.d:0 "[rival_contestant.GetTitledFirstNameNoTooltip] ไม่เหมาะที่จะแข่งขัน"
 contest_events.0700.e:0 "ถ้าข้าสามารถหาคนที่เหมาะสมที่จะคุยด้วยได้..."
 mysterious_stranger_archery:0 "ดูเหมือนว่าชาวบ้านที่ไม่รู้จักชื่อ [mysterious_stranger.GetFirstName] จะเป็นที่พูดถึงใน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ตั้งแต่ฝึกซ้อมที่เป้าธนู\n\n"
 mysterious_stranger_recital:0 "ผู้มาใหม่ชื่อ '[mysterious_stranger.GetFirstName] ซึ่งไม่เคยเป็นที่รู้จักในหมู่นักกวีและนักขับลำนำของ [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] มาก่อน ได้รับความสนใจอย่างมากในปีนี้\n\n"
