 contest_events.1100.t:0 "$activity_tournament$: โชคชะตาแห่งความบ้าคลั่ง"
 contest_events.1100.desc:0 "ตะเกียกตะกายฝ่าความโกลาหลอลหม่านที่ปกคลุม [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] หลบหลีกและเคลื่อนผ่านทั้งมิตรและศัตรู ในที่สุดข้าก็มองเห็น [murder_actor.Custom2('RelationToMeShort', murder_target)] ของข้า [murder_target.GetTitledFirstName] และ [murder_target.GetHerHis] ก็หันหลังให้ข้า!\n\nข้าเข้าใกล้โดยไม่มีผู้ใดเห็น คู่ต่อสู้คนอื่นกำลังดึงความสนใจทั้งหมดของ [murder_target.GetHerHis] ไป ท่ามกลางเสียงอึกทึกและความสับสนวุ่นวายนี้ ไม่มีผู้ใดสนใจข้า...\n\nข้าได้ตัวเจ้าแล้ว ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)]!"
 contest_events.1100.a:0 "หลบสิ่งนี้สิ!"
 contest_events.1100.b:0 "นี่ไม่สมเกียรติ..."
 contest_events.1101.t:0 "$contest_events.1100.t$"
 contest_events.1101.desc:0 "ข้าพุ่งเข้าหา [murder_target.GetHerHim] ลดระยะห่าง [murder_actor.Custom('signature_weapon')] ชูสูง และฟาดลงด้วยกำลังทั้งหมด!"
 contest_events.1101.miss:0 "\n\nในชั่วขณะนั้นเอง ไอ้ปีศาจ [murder_target.Custom2('InsultAdjective', ROOT.Char)] ก็หลบการแทงหยั่งเชิงจากศัตรูอีกคนของ [murder_target.GetHerHis] และ [murder_actor.Custom('signature_weapon')] ของข้าก็พุ่งปักลงไปในดิน\n\nข้ารีบตั้งหลัก ในขณะที่ [murder_target.GetTitledFirstName] คำรามลั่น "ไอ้ชาติชั่วที่น่าสมเพช!" ใบหน้าที่บูดบึ้งของ [murder_target.GetHerHis|U] หายลับไปในความชุลมุน ขณะที่เราทั้งคู่ต่างกระโจนเข้าตั้งรับในส่วนของตน"
 contest_events.1101.wound:0 "\n\n[murder_target.GetSheHe|U] ขยับตัวเล็กน้อย ทันทีที่การโจมตีของข้าปะทะเข้ากับหมวกเกราะของ [murder_target.GetHerHis] ทำให้ [murder_actor.Custom('signature_weapon')] ของข้าแฉลบออกไป\n\n[murder_target.GetTitledFirstName] ร้องโหยหวนด้วยความเจ็บปวดพลางหันมาทางข้า ดวงตาของ [murder_target.GetHerHis] เบิกกว้างเมื่อจำได้\n\nข้าได้ยิน [murder_target.GetHerHim] คราง "ไอ้ [murder_actor.Custom2('InsultNoun', SCOPE.sC('murder_target'))] สารเลว" ก่อนที่ [murder_target.GetSheHe] จะล้มฟุบลง และพายุแห่งการต่อสู้ตะลุมบอนก็แยกเราออกจากกัน"
 contest_events.1101.kill:0 "\n\nการโจมตีของข้าปะทะเข้ากับหมวกเกราะของ [murder_target.GetHerHis] อย่างจัง มันดังลั่นราวกับระฆัง ขณะที่ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)] นั่นล้มฟุบลงไปกองกับพื้นราวกับกระสอบมันฝรั่ง\n\nคู่ต่อสู้ของ [murder_target.GetHerHis|U] คำรามขอบคุณข้า ก่อนที่สีหน้ากังวลจะฉายชัดบนใบหน้าของเขา ข้าเหลือบไปเห็นดวงตาของ [murder_target.GetTitledFirstNamePossessive] ขณะที่มวลชนที่สับสนวุ่นวายแยกเราออกจากกัน พวกมันไม่แสดงแววว่าจำได้เลย"
 contest_events.1101.a:0 ""ระวังหลังไว้ล่ะ ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)]!""
 contest_events.1101.b:0 ""ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)] ดวงแข็งนัก!""
 contest_events.1101.c:0 ""ไอ้ [murder_target.Custom2('InsultNoun', ROOT.Char)]!""
 contest_events.1102.t:0 "$contest_events.1100.t$"
 contest_events.1102.desc:0 "รายล้อมไปด้วยเพื่อนและศัตรู ข้าทำดีที่สุดเพื่อรักษาสติในการต่อสู้ที่หมุนวนไปทั่ว [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] ปัดป้องการโจมตีที่มุ่งมาที่ข้าโดยคู่ต่อสู้ที่มุ่งมั่น"
 contest_events.1102.miss:0 "\n\nขณะที่ข้าหลบการแทง เช่นนั้น [murder_actor.Custom('signature_weapon')] ก็หวีดหวิวลงมาจากด้านหลัง พลาดข้าไปเพียงไม่กี่นิ้ว ข้าเว้นระยะห่างจากคู่ต่อสู้ทั้งสอง เห็นว่าอาวุธนั้นเป็นของใครอื่นไม่ได้นอกจาก [murder_actor.GetTitledFirstName] ซึ่งใบหน้าที่บึ้งตึงบัดนี้ละลายหายไปในฝูงชน!"
 contest_events.1102.wound:0 "\n\nทันใดนั้นข้าก็ถูกจับไม่ทันตั้งตัวด้วยการโจมตีที่งุ่มง่าม แต่มุ่งมั่นจากด้านหลัง กระทบหมวกเกราะของข้าและ ทำให้ข้าโซเซ\n\nเมื่อข้าหันกลับไป คำรามด้วยความเจ็บปวด ข้าเห็น [murder_actor.GetTitledFirstName] รำคาญอย่างเห็นได้ชัดที่ [murder_actor.GetSheHe] ไม่ได้สร้างความเสียหายมากกว่านี้ หายไปในมวลชนที่โกลาหล ก่อนที่ข้าจะล้มลง"
 contest_events.1102.kill:0 "\n\nชั่วขณะต่อมา ประสาทสัมผัสของข้าก็มึนงง หูอื้อ โลกรีบเข้ามาหาข้าอย่างช้าๆ ขณะที่ข้าล้มลง นอนแผ่อยู่บนพื้นขรุขระ ข้าเหลือบเห็นใบหน้าของ [murder_actor.GetSheHe] แต่ไม่สามารถเชื่อมโยงอะไรได้ก่อนที่โลกจะมืดลง"
 contest_events.1102.a:0 "เจ้าสารเลว!"
 contest_events.1102.b:0 "ไอ้ [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] สารเลว!"
 contest_events.1102.c:0 "#weak *เสียงครืดคราด*#!"
 contest_events.1110.t:1 "โอกาสโจมตี"
 contest_events.1110.desc:1 "ข้ารอคอยโอกาสที่จะสังหาร [murder_target.GetTitledFirstName] อย่างอดทน และบัดนี้ช่วงเวลาของข้าอาจมาถึงแล้ว\n\n[activity.GetCurrentPhase.GetPhase.GetName] จะเป็นฉากบังหน้าที่ยอดเยี่ยมสำหรับอุบัติเหตุเล็กน้อย..."
 contest_events.1110.a:0 "หลบ #EMP สิ่งนี้#!!"
 contest_events.1110.b:0 "นี่มันมากเกินไป!"
 contest_events.1131.t:1 "$tournament_contest_header$ การต่อสู้ถึงตาย"
 contest_events.1131.team:0 "แม้ว่า [ROOT.Char.Custom2('RelationToMeShort', portrait_scope)] ของข้า [portrait_scope.GetTitledFirstName] - ไอ้ [portrait_scope.Custom2('InsultNoun', ROOT.Char)] นั่น - จะถูกจัดให้อยู่ทีมเดียวกับข้าในการต่อสู้ตะลุมบอน แต่เมื่อข้าล่าถอยเข้าไปในตรอกเพื่อพักหายใจ และพบว่าตนเองอยู่ตามลำพังกับ [portrait_scope.GetHerHim] เราทั้งคู่ต่างก็เข้าใจกันและกัน"
 contest_events.1131.enemy:0 "วิ่งผ่าน [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] สอดแนมล่วงหน้าทีมของข้า ข้าเลี้ยวหัวมุมและพบว่าตัวเองสบตากับ [ROOT.Char.Custom2('RelationToMeShort', portrait_scope)] ของข้า [portrait_scope.GetTitledFirstName] ซึ่งทำหน้าที่เดียวกันในฝ่ายตรงข้าม"
 contest_events.1131.desc:0 "\n\nข้าเห็นในท่าทางของ [portrait_scope.GetHerHis] ความมุ่งมั่นเดียวกัน - ความเกลียดชังเดียวกัน - ที่ [portrait_scope.GetSheHe] ต้องเห็นในตัวข้า...\n\nมีทางออกเพียงทางเดียวจากสิ่งนี้"
 contest_events.1131.win:0 "ท่านเอาชนะ [portrait_scope.GetFirstNameNoTooltip]"
 contest_events.1131.lose:0 "[portrait_scope.GetFirstNameNoTooltip] เอาชนะท่าน"
 contest_events.1131.a:0 "#EMP ตายซะ!#!"
 contest_events.1131.b:0 "อ๊ากกกก!"
 contest_events.1131.b.flavor:0 "#EMP หนีไปปปปป!#!"
 contest_events.1133.t:0 "$contest_events.1131.t$"
 contest_events.1133.fled_both:0 "ข้าหันหลังและวิ่งเร็วเท่าที่เท้าจะพาไป ร้องเรียกความสนใจจากทีมของข้า\n\nเพียงแค่สุดถนนข้าจึงมองย้อนกลับไปและเห็น [portrait_scope.GetFirstName] อยู่ไกลๆ อับอายพอๆ กับข้า\n\nข้าจะไม่พูดอะไรถ้า [portrait_scope.GetSheHe] ไม่พูด..."
 contest_events.1133.chase_team:0 "ก่อนที่ข้าจะทันได้ตอบโต้ [portrait_scope.GetFirstName] ก็วิ่งหนีไปยังทางออก ร้องเรียกขอความช่วยเหลือจากเพื่อนร่วมทีมของเราอย่างแหลมคม"
 contest_events.1133.chase_enemy:0 "ก่อนที่ข้าจะทันได้ตอบโต้ [portrait_scope.GetFirstName] ก็วิ่งหนีไปยังทางออก ร้องเรียกขอความช่วยเหลือจากเพื่อนร่วมทีมของ [portrait_scope.GetHerHis] อย่างแหลมคม"
 contest_events.1133.fled_team:0 "ข้าวิ่งไปยังทางออก วิ่งตรงกลับไปยังส่วนที่เหลือของทีม และความปลอดภัยหลังโล่ของพวกเขา"
 contest_events.1133.fled_enemy:0 "ข้าวิ่งไปยังทางออก วิ่งเต็มฝีเท้าไปยังทิศทางของเพื่อนร่วมทีมและร้องเรียกการสนับสนุนจากพวกเขา"
 contest_events.1133.fled:0 "\n\nที่ปลายถนนข้ามองย้อนกลับไป และเห็นว่า [portrait_scope.GetFirstName] ยอมแพ้แล้ว [portrait_scope.GetSheHe] หอบหายใจ จ้องมองข้า"
 contest_events.1133.chase:0 "\n\n[portrait_scope.GetSheHe|U] เร็วกว่าที่ [portrait_scope.GetSheHe] ดู และหายไปที่ปลายถนนเมื่อข้ายอมแพ้ หอบหายใจ..."
 contest_events.1133.fight:0 "อ่านใจกันและกัน เราทั้งคู่พุ่งเข้าใส่กัน ดาบของ [portrait_scope.GetFirstNamePossessive] และของข้าฟาดฟันอย่างดุเดือดขณะที่เราแลกเปลี่ยนการปัดป้อง"
 contest_events.1133.nothing:0 "\n\nการต่อสู้ถูกขัดจังหวะอย่างรวดเร็วด้วยการมาถึงของคนอื่นๆ ทำให้เราจ้องมองกันข้ามเลน"
 contest_events.1133.wound_self_fled:0 "\n\n[portrait_scope.GetSheHe|U] ทำให้ข้าบาดเจ็บเล็กน้อยก่อนที่ข้าจะพ้นระยะเอื้อม โชคดีที่นั่นคือทั้งหมดที่ [portrait_scope.GetSheHe] สามารถทำได้..."
 contest_events.1133.wound_self:0 "\n\nไอ้ [portrait_scope.Custom2('InsultNoun', ROOT.Char)] นั่นชิงความได้เปรียบจากข้า ทำร้ายข้าตอนเผลอ ก่อนที่คนอื่นจะมาถึง"
 contest_events.1133.wound_enemy_fled:0 "\n\nข้าทำได้เพียง ทำให้ [portrait_scope.GetHerHim] บาดเจ็บเล็กน้อยก่อนที่ [portrait_scope.GetSheHe] จะพ้นระยะเอื้อม เดินกะเผลกไปยังสหายของ [portrait_scope.GetHerHis] เจ้าคนขี้ขลาด..."
 contest_events.1133.wound_enemy:0 "\n\nขณะที่ประกายไฟกระเด็น ข้าเห็นโอกาส ทำให้ [portrait_scope.GetHerHi] บาดเจ็บเล็กน้อยอย่างแรงก่อนที่ [portrait_scope.GetSheHe] จะฟื้นตัว แม้ว่าคนอื่นๆ จะมาถึงก่อนที่เราจะดำเนินการต่อได้..."
 contest_events.1133.kill_fled:0 "\n\nขณะที่ไอ้ [portrait_scope.Custom2('InsultAdjective', ROOT.Char)] นั่นหันหลังหนี [portrait_scope.GetSheHe] ก็เสียหลักล้มลงกับพื้นอย่างงุ่มง่าม ทุกอย่างจบสิ้นลงก่อนที่เสียงร้องขอความเมตตาของ [portrait_scope.GetHerHis] จะเปล่งออกมาจนสุด..."
 contest_events.1133.kill:0 "\n\nการปะทะกันอย่างบ้าคลั่งของเราทวีความรุนแรงขึ้นเหมือนพายุเฮอริเคน การปะทะกันของเหล็กกล้าและประกายไฟที่ลุกโชน ขณะที่เราก้าวเท้า ทันใดนั้นข้าก็ได้เปรียบ และเราทั้งคู่รู้ว่ามันจบลงแล้ว — เร็วเท่าที่มันเริ่มต้น"
 contest_events.1133.a.both_fled:0 "อะแฮ่ม"
 contest_events.1133.a.wound:0 "เจ้าคนโชคดี! ข้าจะจัดการเจ้า!"
 contest_events.1133.a.kill:0 "มันจบแล้ว"
 contest_events.1133.a:0 "เกือบไปแล้ว..."
 ### ARCHERY ###
 # TRAGEDY
 contest_events.1520.t:1 "$tournament_contest_header$ โศกนาฏกรรมที่เป้าธนู"
 contest_events.1520.opening:0 "ข้าก้าวขึ้นไปที่เส้น ดึงลูกธนูออกจากถัง และค่อยๆ ง้างคันธนู จ้องมองไปตามก้านธนูที่เป้าหมายอันห่างไกล\n\nในขณะที่ข้าตัดสินใจ ปล่อยมือ ทันใดนั้นร่างหนึ่งก็โผล่ออกมาจากด้านหลังเป้า!"
 contest_events.1520.skilled:0 "การยิงตรงเป้า พุ่งตรงไปยังพวกเขา!\n\n"
 contest_events.1520.unskilled:0 "การยิงพลาดเป้าอย่างแน่นอน แต่กลับเบี่ยงตรงไปยังพวกเขา!\n\n"
 contest_events.1520.desc:1 "เสียงอ้าปากค้างดังขึ้นจากผู้ชม และหลังจากสิ่งที่ดูเหมือนชั่วนิรันดร์ ร่างนั้นก็ล้มลง ครวญครางอย่างอ่อนแรง ไม่นานผู้รับใช้ก็ยืนยันสิ่งที่เลวร้ายที่สุด: ชาวนาตายสนิทแล้ว — ไม่มีคะแนนสำหรับลูกธนู #EMP นั้น#!..."
 contest_events.1520.a:0 "ครอบครัวจะได้รับการดูแล"
 contest_events.1520.b:0 "อย่าให้สิ่งนี้มาทำลายความสนุกของเราเลย"
 contest_events.1520.c:0 "ข้าคิดว่านั่นเพียงพอแล้วสำหรับการยิงธนูสำหรับข้า..."
 contest_events.1521.t:0 "$contest_events.1520.t$"
 contest_events.1521.desc:0 "[contestant.GetTitledFirstName] ก้าวขึ้นไปที่เส้น ดึงลูกธนูออกจากถัง และค่อยๆ ง้างคันธนูของ [contestant.GetHerHis] ตาข้างหนึ่งหรี่ลง รู้สึกถึงทางไปยังเป้าหมาย\n\nในขณะที่ [contestant.GetSheHe] ปล่อยลูกธนู เงาร่างหนึ่งก็โผล่ออกมาจากด้านหลังเป้าทันที!\n\n"
 contest_events.1521.resigned:0 "\n\n[contestant.GetFirstNameNoTooltip] ได้สละสิทธิ์โดยสมัครใจจากการประกวด Archery เพื่อเป็นการให้เกียรติแก่วิญญาณที่โชคร้าย"
 contest_events.1521.dismissed:0 "\n\n[contestant.GetFirstNameNoTooltip] รีบปัดอุบัติเหตุทิ้งไป รอคอยอย่างใจร้อนที่จะยิงครั้งต่อไป"
 contest_events.1521.compensated:0 "\n\n[contestant.GetFirstNameNoTooltip] จ่ายเงินช่วยเหลือเล็กน้อยจากกระเป๋าของ [contestant.GetHerHis] เอง สำหรับครอบครัวของผู้เสียชีวิต"
 contest_events.1521.a:0 "น่าเศร้า"
 # NAIL
 contest_events.1530.t:1 "$tournament_contest_header$ ตรงหัวตะปู"
 contest_events.1530.desc:0 "ข้ายืดสายธนูสองสามครั้งเพื่อวอร์มอัพ และหายใจเข้าลึกๆ\n\nรวบรวมการควบคุมทั้งหมด ข้าง้างคันธนูขึ้นไปในอากาศ ค่อยๆ ลดระดับลงให้ตรงกับเป้าหมาย ทันทีที่ลูกธนูออกจากปลายนิ้ว ข้าก็รู้สึกได้โดยสัญชาตญาณว่าการยิงนั้นดี\n\nชั่วครู่ต่อมา เสียงปิงที่น่าพอใจก็ยืนยัน: ข้ายิงโดนหัวตะปูของเป้าหมายพอดี!"
 contest_events.1530.a:0 "ใช่แล้ว!"
 contest_events.1531.t:0 "$contest_events.1530.t$"
 contest_events.1531.desc:0 "[contestant.GetTitledFirstName] ยืดสายธนูสองสามครั้งเพื่อวอร์มอัพ และหายใจเข้าลึกๆ\n\nรวบรวมการควบคุมทั้งหมดของ [contestant.GetHerHis] [contestant.GetSheHe] ง้างคันธนูขึ้นไปในอากาศ ค่อยๆ ลดระดับลงให้ตรงกับเป้าหมาย ทันทีที่ลูกธนูออกจากปลายนิ้วของ [contestant.GetHerHis] ก็ชัดเจนว่าการยิงนั้นดี\n\nชั่วครู่ต่อมา เสียงปิงที่น่าพอใจก็ยืนยัน: [contestant.GetSheHe] ยิงโดนหัวตะปูของเป้าหมายพอดี!"
 contest_events.1531.a:0 "โชคดี..."
 # BAD DAY
 contest_events.1540.t:1 "$tournament_contest_header$ วันที่แย่"
 contest_events.1540.desc:0 "ข้ารวบรวมลูกธนูอย่างมั่นใจ เข้าประจำที่หน้าเป้าหมายและซึมซับบรรยากาศ ฝูงชนเงียบลงขณะที่ข้าปรับท่าทางให้สมบูรณ์แบบและง้างคันธนู\n\nการยิงครั้งแรกพลาดไปเพียงเส้นยาแดงผ่าแปด ปักลงไปในเป้าดิน การยิงครั้งที่สองหวีดหวิวข้ามเป้าหมายไปหลายไมล์ การยิงครั้งที่สามตกลงห่างจากข้าไปสองสามหลา เกิดจากการปล่อยที่ไม่ดี\n\n"
 contest_events.1540.unskilled:0 "ฝูงชนหัวเราะคิกคักขณะที่ข้าเดินกลับ ไม่สามารถซ่อนความรำคาญได้ ข้าต้องการฝึกฝนเพิ่มเติม..."
 contest_events.1540.sabotage:0 "ข้าแค่ไม่เข้าใจ! ข้าสามารถยิงโดนเป้าหมายได้เมื่อฝึกซ้อม เว้น แต่... ข้ามองคันธนูของข้าอย่างสงสัย..."
 contest_events.1540.a:0 "มันก็เป็น เช่นนั้นเอง"
 contest_events.1541.t:0 "$contest_events.1540.t$"
 contest_events.1541.desc:0 "[contestant.GetTitledFirstName] หยิบลูกธนูอย่างมั่นใจ เข้าประจำที่ [contestant.GetHerHis] หน้าเป้าหมาย ฝูงชนเงียบกริบขณะที่ [contestant.GetSheHe] จัดท่าทาง [contestant.GetHerHis] ให้สมบูรณ์แบบและขึ้นสายธนู\n\nลูกแรกพลาดเป้าไปเพียงเส้นยาแดง ปักเข้ากับเนินดิน ลูกที่สองหวีดหวิวข้ามเป้าไปไกลลิบ ลูกที่สามตกลงห่างจาก [contestant.GetHerHim] ไม่กี่หลา หลุดออกจากคันธนู เพราะปล่อยสายไม่ดี\n\n"
 contest_events.1541.unskilled:0 "ฝูงชนหัวเราะคิกคักขณะที่ [contestant.GetSheHe] เดินกลับ ไม่สามารถซ่อนความรำคาญของ [contestant.GetHerHis] ได้ [contestant.GetSheHe|U] ต้องการฝึกฝนเพิ่มเติม!"
 contest_events.1541.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] สับสนอย่างเห็นได้ชัด "ข้าแค่ไม่เข้าใจ! ข้าไม่ได้แย่ขนาดนั้น!" [contestant.GetSheHe] ร้องเสียงแหลม ตรวจสอบคันธนูของ [contestant.GetHerHis] อย่างสงสัย"
 contest_events.1541.a:0 "มันเกิดขึ้นได้"
 # MYSTERIOUS
 contest_events.1550.t:1 "$tournament_contest_header$ [contestant.GetFirstNameNoTooltip] ฮู้ด"
 contest_events.1550.desc:1 "ฝูงชนเงียบลงขณะที่ [contestant.GetTitledFirstName] ง้างลูกธนูแรกของ [contestant.GetHerHis] ตื่นเต้นที่จะได้เห็นว่า [contestant.GetWomanMan] ผู้นี้เก่งเหมือนข่าวลือที่แพร่สะพัดในสนามประลองหรือไม่\n\n"
 contest_events.1550.good:0 "แม้ แต่ข่าวลือที่บ้าคลั่งที่สุดก็ไม่สามารถเทียบได้กับการแสดงของ [contestant.GetHerHis] เหมือนการเต้นรำ [contestant.GetWomanMan] ผู้นี้ส่งลูกธนู แต่ละลูกเข้ากลางเป้าหมายอย่างง่ายดาย ผ่าก้านธนูของ [contestant.GetHerHis] เองและ ทำให้ฝูงชนคลั่งไคล้"
 contest_events.1550.normal:1 "สำหรับคำพูดทั้งหมด [contestant.GetHerHis] เป็นนักธนูที่ธรรมดาอย่างเห็นได้ชัด ไม่มีการตำหนิ [contestant.GetHerHim] แต่คะแนนของ [contestant.GetHerHis] ก็ไม่มีอะไรน่าโอ้อวด เทียบเท่ากับผู้เข้าแข่งขันที่ฝึกฝนนน้อยที่สุดบางคน"
 contest_events.1550.bad:0 "พวกเขาค่อนข้างผิดหวัง หลังจากการแสดงที่น่าตกใจของการพลาดเป้าและความผิดพลาด อาจมีคนสงสัยว่า [contestant.GetWomanMan] ผู้นี้เคยถือคันธนูมาก่อนหรือไม่ ไม่ต้องพูดถึงการใช้มัน"
 contest_events.1550.a:0 "ไชโย!"
 contest_events.1550.a.good:0 "น่าตื่นตาตื่นใจ"
 contest_events.1550.a.bad:0 "น่าผิดหวัง"
 contest_events.1550.b:0 "ข้าต้องพบ [contestant.GetHerHim]!"
 contest_events.1550.b.tt:0 "ท่านจะพยายามสนทนากับ [contestant.GetFirstName]"
 contest_events.1550.c:0 "หึ"
 contest_events.1550.d:0 "มีคนสนุกกับการหลอกลวงเราอย่างแน่นอน"
 contest_events.1553.t:1 "$contest_events.1550.t$"
 contest_events.1553.desc:0 "ขณะที่ [contestant.GetFirstName] ถูกนำตัวมาโดยผู้ติดตามของข้า [marshal.GetTitledFirstName] ก็พลันตะโกนขึ้นมา "เฮ้! ข้ารู้จักเจ้า! จับมันไว้!"\n\n"[contestant.GetWomanMan] ผู้นี้คือหัวหน้าของเหล่าโจรชั่วในท้องถิ่น [ROOT.Char.Custom('FormOfAddressForLiege')]!" [marshal.GetFirstName] ตะคอกอย่างเกรี้ยวกราด "พวกมันซ่อนตัวอยู่ใน [activity.GetCurrentPhase.GetLocation.GetTerrain.GetNameNoTooltip|l] ขโมยปศุสัตว์และปล้นสะดมผู้สัญจรไปมาผู้บริสุทธิ์"\n\n"เรื่องโกหก!" นักธนูสวนกลับอย่างท้าทาย "เราเพียงนำทรัพย์สินของผู้มั่งมีกลับคืนสู่เจ้าของที่แท้จริง: นั่นคือประชาชน!""
 contest_events.1553.a:0 "ขัง [contestant.GetHerHim] ไว้!"
 contest_events.1553.b:0 "การประหารชีวิตในที่สาธารณะน่าจะใช้ได้"
 contest_events.1553.c:0 "เจ้าได้รับการอภัยโทษ [contestant.GetFirstNameNoTooltip] อย่าเสียโอกาสนี้ไป"
 contest_events.1553.d:0 "ชดใช้ความผิดของเจ้า - ในการรับใช้ข้า"
 contest_events.1554.t:1 "$contest_events.1550.t$"
 contest_events.1554.desc:0 "ผู้ติดตามที่ข้าส่งไปรับ [contestant.GetFirstName] กลับมาอย่างสับสน\n\nดูเหมือนว่านักธนูจะรีบออกจากสนามไปทันทีที่ลูกธนูของ [contestant.GetHerHis] หมด - ไม่มีร่องรอยของ [contestant.GetHerHim] ตั้งแต่นั้นมา..."
 contest_events.1554.a:0 "อะไรกันเนี่ย..."
 ### HORSE RACE ###
 contest_events.3000.t:1 "$tournament_contest_header$ กองทับถม"
 contest_events.3000.desc:3 "ผู้ขี่ของ [contestant_1.GetFirstNamePossessive] กำลังควบม้าไปตามสนามแข่ง\n\nในวินาทีสุดท้ายพวกเขาก็เอียงไปด้านข้างอย่างเลินเล่อ ไถลไปตามฝุ่น ทำให้ผู้ขี่ม้าของ [contestant_2.GetFirstName] และ [contestant_3.GetFirstNamePossessive] ไม่มีเวลาหยุด!\n\nเสียงครวญครางเป็นเอกฉันท์ของฝูงชนดังไปทั่วอากาศก่อนที่ม้าและผู้ขี่ทั้งสามจะชนกัน\n\n"
 contest_events.3000.a:0 "โอ๊ย"
 contest_events.3000.b:0 ""[contestant_1.GetFirstNameNoTooltip]! เจ้าปล่อยให้เรื่องนี้เกิดขึ้นได้อย่างไร?!""
 contest_events.3010.t:0 "$tournament_contest_header$ จ็อกกี้ทึ่ม"
 contest_events.3010.desc:1 "การเฝ้าดูผู้ขี่ของ [enemy_competitor.GetNamePossessive] บนหลังม้าของพวกเขาก็เหมือนกับการเฝ้าดูก้อนหินกลิ้งข้ามจัตุรัสหมู่บ้าน พวกเขาขี่เหมือนคนบ้าอย่างแท้จริง และโชคไม่ดีที่ผู้ขี่ของข้าเอง [jockey.GetFirstName] ตกเป็นเหยื่อของการแข่งที่รุนแรงและงุ่มง่าม\n\nด้วยเสียงร้องอย่างเจ็บปวดและเสียงดังกร๊อบ ม้าของข้าถูกกระแทกเข้ากับกำแพงสนามแข่ง และข้ามั่นใจว่าขาของ [jockey.GetFirstNamePossessiveNoTooltip] ได้รับความเสียหาย"
 contest_events.3010.a:0 ""นี่มันผิดกฎอย่างเห็นได้ชัด!""
 contest_events.3010.a.success:0 "ท่านโน้มน้าวผู้ตัดสินให้ลงโทษจ็อกกี้ได้สำเร็จ"
 contest_events.3010.a.failure:0 "ท่านโน้มน้าวผู้ตัดสินไม่สำเร็จ"
 contest_events.3010.b:0 "ข้าจะอนุโลมให้"
 contest_events.3020.t:0 "$tournament_contest_header$ จ็อกกี้ผู้มีอัธยาศัยดี"
 contest_events.3020.desc:0 "ในหมู่ชาวบ้านที่เข้าร่วมการแข่งขัน ไม่มีความลับว่าใครเป็นที่โปรดปรานของพวกเขา ชาวนาจ้องมองผู้ขี่ของ [enemy_competitor.GetNamePossessive] ด้วยความรักและความชื่นชมเท่าๆ กัน พวกเขาเป็นลมเมื่อม้าควบผ่านและเชียร์เมื่อ [enemy_competitor.GetFirstNameNoTooltip] ยกย่องผู้ขี่ของ [enemy_competitor.GetHerHis] ต่อฝูงชน [enemy_competitor.GetSheHe|U] เฝ้าดูการแข่งขันอย่างพึงพอใจ รู้ว่าผู้ขี่ของ [enemy_competitor.GetHerHis] ได้รับการสนับสนุนอย่างเต็มที่จากฝูงชน\n\nข้าสงสัย: บางทีด้วยการให้กำลังใจที่เหมาะสม ข้าอาจจะสามารถหันเหความสนใจของฝูงชนไปยังผู้ขี่ #EMP ของข้า#! [jockey.GetFirstName] แทนได้หรือไม่?"
 contest_events.3020.a:0 ""ดูเถิด! ผู้ขี่ผู้สูงศักดิ์ของข้า!""
 contest_events.3020.a.success:0 "ท่านหันเหฝูงชนไปยังผู้ขี่ของท่านได้สำเร็จ"
 contest_events.3020.a.failure:0 "ฝูงชนไม่ประทับใจ"
 contest_events.3020.b:0 ""ท่านรู้วิธีเลือกพวกเขา [enemy_competitor.GetFirstNameNoTooltip]""
 contest_events.3020.c:0 "ข้าจะพบ [enemy_competitor.GetHerHim] หลังการแข่งขันเพื่อการคลุกคลีที่ดี"
 contest_events.3030.t:0 "$tournament_contest_header$ ดังที่ [ROOT.Char.GetFaith.CreatorName|U] สร้าง [naked_peasant.GetHerHim|U]"
 contest_events.3030.desc:0 "ขณะที่ม้าเตรียมพร้อมที่จะแข่ง ฝูงชนทั้งหมดกำลังเชียร์และร้องเพลงให้นักแข่งคนโปรดของพวกเขา นั่นคือ จนกระทั่งพวกเขาทั้งหมดอ้าปากค้างก่อนที่จะเงียบสนิท [naked_peasant.GetWomanMan] เปลือยกายวิ่งออกมาในสนามแข่งและกำลังอวดทุกสิ่งที่ [ROOT.Char.GetFaith.CreatorName|U] มอบให้ [naked_peasant.GetHerHim] ตั้งแต่หัวจรดเท้า\n\nฝูงชนเริ่มโห่ไล่สิ่งมีชีวิตที่หุนหันพลันแล่นนี้ทันทีและขว้างปาสิ่งของใดๆ ที่พวกเขาสามารถหาได้ใส่ [naked_peasant.GetHerHim]"
 contest_events.3030.a:0 "น่าขยะแขยง! ทหาร!"
 contest_events.3030.b:0 "ฮ่า! ช่างเป็นการแสดง!"
 contest_events.3030.c:0 "ข้าจะเข้าร่วมกับ [naked_peasant.GetHerHim]! นี่ดูเหมือนจะสนุก!"
 contest_events.3030.d:0 "การเปลือยกายไม่ใช่บาป!"
 contest_events.3030.a.success:0 "ท่านโน้มน้าวฝูงชนได้สำเร็จ"
 contest_events.3030.a.failure:0 "ฝูงชนไม่สะทกสะท้าน"
 contest_events.3030.e:0 "ให้ม้าเหยียบย่ำ [naked_peasant.GetHerHim]"
