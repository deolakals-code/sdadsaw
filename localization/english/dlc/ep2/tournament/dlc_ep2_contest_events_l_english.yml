 contest_events.4500.t:1 "$tournament_contest_header$ การล้มที่น่าเศร้า"
 contest_events.4500.desc:0 "ข้าเกือบจะกระโดดโลดเต้นด้วยความดีใจ เฝ้าดูม้าแข่งของข้า #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! รักษาตำแหน่งในกลุ่มผู้นำ\n\nขณะที่พวกมันเข้าใกล้จุดสิ้นสุดของรอบอีกรอบ หัวใจของข้าก็หล่นวูบเมื่อ [ROOT.Char.Custom('ContestHorseRaceGender')] ของข้าและผู้ขี่ของ [ROOT.Char.Custom('ContestHorseRaceHerHis')] ล้มลงทันที หายไปในฝุ่น!\n\nเมื่อคนอื่นๆ ผ่านไป หลีกเลี่ยงหายนะได้อย่างหวุดหวิด #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! ก็พยายามดิ้นรนเพื่อยืนขึ้น - ชัดเจนว่า [ROOT.Char.Custom('ContestHorseRaceSheHe')] ไม่สามารถไปต่อได้..."
 contest_events.4500.unskilled:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] ไม่ใช่ม้าที่ดีที่สุด แตความอับอายนี้จะ ทำให้ชื่อเสียงของข้าในฐานะนักเพาะพันธุ์ม้าแข่งมัวหมอง..."
 contest_events.4500.sabotage:0 "ข้าแค่ไม่เข้าใจ! #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! เป็นหนึ่งในม้าที่ดีที่สุด! เว้น แต่... ข้ามองอัฒจันทร์อย่างสงสัย..."
 contest_events.4500.a:0 "บ้าจริง"
