 contest_events.0871.pivotal_failure:0 "ข้าพยายามโยนคู่ต่อสู้ แต่ทันทีที่ข้าทำ ข้าก็ถูกเหวี่ยงไปในอากาศเอง ข้าลงพื้นอย่างแรง ลมออกจากปอดพร้อมเสียงครวญคราง และข้าก็ต้องป้องกันทันที พยายามไม่ให้ถูกกดลง\n\n"
 contest_events.0871.ptv_close:0 "การต่อสู้สูสีกันมาก ความผิดพลาดเพียงครั้งเดียวของใครคนใดคนหนึ่งอาจจบลงได้ในทันที"
 contest_events.0871.ptv_close_spectator:0 "การต่อสู้สูสีกันมาก! ความผิดพลาดเพียงครั้งเดียวของคู่แข่งคนใดคนหนึ่งอาจจบลงได้ในทันที"
