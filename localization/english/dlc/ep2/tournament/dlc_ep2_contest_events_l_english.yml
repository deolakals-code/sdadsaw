 contest_events.0872.pivotal_success:0 "เสียงดังสนั่นดังขึ้นเมื่ออาวุธของข้ากระทบหมวกเกราะ คู่ต่อสู้ของข้าโซเซถอยหลังอย่างมึนงง ข้าตามไปอย่างรวดเร็ว หลอกซ้าย ตีขวาอย่างแรง ข้าบุกเข้าไปขณะที่คู่ต่อสู้ถอยหลังอย่างสิ้นหวัง ดาบของข้าแทบจะไม่ถูกปัดป้องด้วยระยะห่างเพียงเล็กน้อย\n\n"
