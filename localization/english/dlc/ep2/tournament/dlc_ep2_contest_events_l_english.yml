 contest_horse_race_crashed_out_log:1 "ม้าของ [CHARACTER.GetTitledFirstName] [CHARACTER.Custom('GetContestHorseRaceName')] ล้มและถอนตัวจากการแข่งขัน"
 contest_events.4501.t:0 "$contest_events.1540.t$"
 contest_events.4501.desc:0 "[contestant.GetTitledFirstName] กระโดดโลดเต้นด้วยความดีใจเฝ้าดูม้าแข่งของ [contestant.GetHerHis] #EMP [contestant.Custom('GetContestHorseRaceName')]#! รักษาตำแหน่งในกลุ่มผู้นำ\n\nขณะที่พวกมันเข้าใกล้จุดสิ้นสุดของรอบอีกรอบ [contestant.Custom('ContestHorseRaceGender')] และผู้ขี่ของ [contestant.Custom('ContestHorseRaceHerHis')] ล้มลงทันที หายไปในฝุ่น! [contestant.GetFirstNameNoTooltip] เสียใจอย่างมาก\n\nเมื่อคนอื่นๆ ผ่านไป หลีกเลี่ยงหายนะได้อย่างหวุดหวิด #EMP [contestant.Custom('GetContestHorseRaceName')]#! ก็พยายามดิ้นรนเพื่อยืนขึ้น - ชัดเจนว่า [contestant.Custom('ContestHorseRaceSheHe')] ไม่สามารถไปต่อได้...\n\n"
 contest_events.4501.unskilled:0 "ข้าไม่คิดว่าจะมีใครวางเดิมพันกับม้าของ [contestant.GetTitledFirstNamePossessiveNoTooltip] อีกในเร็วๆ นี้..."
 contest_events.4501.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] สับสนอย่างเห็นได้ชัด "ข้าแค่ไม่เข้าใจ! #EMP [contestant.Custom('GetContestHorseRaceName')]#! เป็นหนึ่งในม้าที่ดีที่สุด!" [contestant.GetSheHe] กรีดร้อง มองอัฒจันทร์อย่างสงสัย"
 contest_events.4501.a:0 "มันเกิดขึ้นได้"
 # CHEER
 contest_events.4600.t:1 "$tournament_contest_header$ การให้กำลังใจอย่างกระตือรือร้น"
 contest_events.4600.desc:0 "ข้าเฝ้าดูม้าควบผ่านอัฒจันทร์ ซึมซับกลิ่นฝุ่นที่ฟุ้งกระจาย เสียงโห่ร้องของฝูงชน เสียงกีบม้าจำนวนมากที่ดังกระหึ่ม\n\n"
 contest_events.4600.wager_entrant:0 "แม้ว่าข้าจะส่ง [ROOT.Char.Custom('ContestHorseRaceGender')] ของข้า [ROOT.Char.Custom('GetContestHorseRaceName')] เข้าแข่ง สายตาของข้าก็จับจ้องไปที่ #EMP [wager_owner.GetTitledFirstNamePossessive]#! ของ [wager_owner.GetTitledFirstNamePossessive] และจ็อกกี้ของ [wager_owner.Custom('ContestHorseRaceHerHis')] พลางคิดถึงเหรียญที่ข้าอาจจะชนะ..."
 contest_events.4600.wager:1 "ข้าติดตาม [wager_owner.Custom('ContestHorseRaceGender')] #EMP [wager_owner.Custom('GetContestHorseRaceName')]#! ของ [wager_owner.GetTitledFirstNamePossessive] และผู้ขี่ของ [wager_owner.Custom('ContestHorseRaceHerHis')] อย่างตั้งใจ ฝันถึงเหรียญที่ข้าอาจจะชนะ..."
 contest_events.4600.entrant:1 "[ROOT.Char.Custom('ContestHorseRaceGender')] ของข้า #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! กำลังรักษาฝีเท้าขณะที่รอบดำเนินไป ผู้ขี่ของ [ROOT.Char.Custom('ContestHorseRaceHerHis')] แข่งขันได้ดีกับผู้ขี่คนอื่นๆ"
 contest_events.4600.a:0 "วิ่ง! วิ่งสิ เจ้าม้าแก่!"
 contest_events.4600.b:0 "สู้ๆ #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!!"
 contest_events.4600.b.wager:0 "สู้ๆ #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!"
 contest_events.4600.c:0 "ใจเย็นๆ..."

 ### RECITAL ###
 contest_events.5000.t:0 "การขับลำนำที่อึกทึก"
 contest_events.5000.desc:0 "[enemy.GetFirstName] ยิ้มเยาะเย้ยอย่างหยิ่งยโสมาทางข้าขณะที่ [enemy.GetSheHe] ขึ้นเวที และใช้เวลาไม่นานข้าก็รู้ว่าทำไม บรรทัดแรกเป็นการดูถูกข้าอย่างร้ายแรง และที่เหลือก็ตามมา!\n\nเสียงเชียร์ เสียงโห่ร้องของฝูงชนดังเต็มหูข้า ข้าไม่มีทางเลือกอื่นนอกจากตอบโต้ด้วยบทกวีของข้าเองเพื่อต่อต้านเกียรติของ [enemy.GetFirstNamePossessiveNoTooltip]! บทเปิดของข้ามีความสำคัญอย่างยิ่ง\n\n"#POE จริงอยู่ที่ [enemy.GetFirstNameNoTooltip] สัมผัสได้ไม่เหมือนใคร! อย่างไรก็ตาม..."
 contest_events.5000.shagged_your_mum:0 "#POE ...ข้าได้นอนกับมารดาของ [enemy.GetHerHis]!""
 contest_events.5000.shagged_your_dad:0 "#POE ...ข้าได้นอนกับบิดาของ [enemy.GetHerHis]!""
 contest_events.5000.licentious:0 "#POE ...[enemy.GetSheHe] เป็นคนรักที่เสเพล!""
 contest_events.5000.stupid:0 "#POE ...จิตใจของ [enemy.GetHerHis] ไม่สามารถทื่อกว่านี้ได้!""
 contest_events.5000.ugly:0 "#POE ...ใบหน้าของ [enemy.GetHerHis] ไม่สามารถหยาบกร้านกว่านี้ได้!""
 contest_events.5000.success:0 "บทกวีของท่านชนะใจฝูงชน"
 contest_events.5000.failure:0 "บทกวีของท่านไม่มีผล"
 contest_events.5010.t:0 "สูญหายในการแปล"
 contest_events.5010.desc:0 "[enemy.GetFirstName] จ้องมองข้าอย่างตั้งใจ ม้วนกระดาษและปากกายังคงอยู่ในมือ [enemy.GetSheHe|U] หายใจเข้าลึกๆ และเริ่มพ่นเรื่องไร้สาระที่ข้าไม่มีหวังจะเข้าใจ\n\nเห็นได้ชัดว่าสิ่งที่ [enemy.GetSheHe] กำลังพูดมีความสำคัญต่อ [enemy.GetHerHim] มากขณะที่ [enemy.GetSheHe] ยังคงจ้องมองข้าอย่างตั้งใจ ขณะที่สมาชิกบางคนของฝูงชนที่เงียบสงัดอ้าปากค้างและกระซิบ ไม่ต้องสงสัยเลยว่ากำลังแปลบทกวีให้เพื่อนฟัง"
 contest_events.5010.a:0 "ตอบโต้ด้วยคำดูถูก!"
 contest_events.5010.b:0 "ข้าต้องพยายามเข้าใจ"
 contest_events.5020.t:0 "บทกวีอันทรงคุณธรรม"
 contest_events.5020.desc:0 "ฝูงชนโห่ร้องและเชียร์ขณะที่ข้าเสร็จสิ้นการขับลำนำล่าสุด ผลงานที่ออกแบบมาเพื่อมุ่งเป้าไปที่เกียรติของ [enemy.GetFirstNamePossessive] และแสดงให้ทุกคนเห็นว่าปัญญาของข้ายิ่งใหญ่เพียงใด! ไม่มีข้อสงสัยในใจของใครว่าใครคือผู้ชนะที่ชัดเจน แต่ในความรู้สึกอิ่มเอมใจอย่างแท้จริงในขณะนั้น ข้ารู้สึกอยากจะปล่อยบทกวีใหม่ให้ฝูงชนที่ชื่นชอบข้า"
 contest_events.5020.a:0 "อีกบทกวีคงไม่เสียหาย!"
 contest_events.5020.b:0 "ข้าควรจะโค้งคำนับและจากไป"
 contest_events.5030.t:0 "บทกวีห้าบรรทัดที่ง่อยเปลี้ย"
 contest_events.5030.desc:0 "ข้าถอนหายใจอย่างมีชัยขณะที่ข้าจบบทกวีสุดท้ายของการขับลำนำ ข้าเตรียมพร้อมสำหรับเสียงปรบมือดังสนั่นของผู้ชม เพียงเพื่อพบว่าสนามประลองเงียบสงัด เว้นแต่เสียงลมหวีดหวิวผ่านต้นไม้\n\nนี่คือหายนะ แต่บางทีสถานการณ์นี้อาจแก้ไขได้ด้วยบทกวีใหม่ที่ แต่งและขับลำนำได้ทันที"
 contest_events.5030.a:0 ""ข้ามีอีกบท!""
 contest_events.5030.b:0 "ยอมรับความพ่ายแพ้"
 ### BOARD GAME ###
 contest_events.5500.t:1 "$tournament_contest_header$ การรบกวนที่คดเคี้ยว"
 contest_events.5500.desc:0 "ความเงียบนั้น ดังสนั่น: [versus_contestant.GetTitledFirstName] กำลังครุ่นคิดถึงการเคลื่อนไหวครั้งต่อไปของ [versus_contestant.GetHerHis] มานานราวกับชั่วนิรันดร์ ดวงตาจ้องมองกระดาน [activity.Custom('ContestBoardGameType')] อย่างตั้งใจใต้คิ้วที่ขมวด\n\nเห็นได้ชัดว่า [versus_contestant.GetWomanMan] ต้องการชนะ\n\nเมื่อความคิดที่จะรบกวน [versus_contestant.GetHerHim] ผุดขึ้นในหัว ก็ยากที่จะปัดเป่า..."
 contest_events.5500.a:0 "ข้ารู้สึกคันคอ..."
 contest_events.5500.b:0 "ถ้าเพียง แต่ข้าจะสลัดอาการไอที่น่ารำคาญนี้ได้..."
 contest_events.5500.success:0 "[versus_contestant.GetFirstNameNoTooltip] พยายามอย่างหนักเพื่อมีสมาธิ"
 contest_events.5500.mixed:0 "ท่านกระตือรือร้นเกินไปเล็กน้อย"
 contest_events.5500.failure:0 "ท่านเกือบจะสำลัก"
 contest_events.5500.nothing:0 "[versus_contestant.GetFirstNameNoTooltip] ไม่สนใจ"
 contest_events.5500.c:0 "อา ทำนองเพลงของนักดนตรีคนนั้นเป็นอย่างไรนะ?"
 contest_events.5500.d:0 "เล่ห์เหลี่ยมราคาถูกอยู่ต่ำกว่าข้า"
 contest_events.5510.t:1 "$tournament_contest_header$ การอาละวาดบนโต๊ะ"
 contest_events.5510.desc:0 "โต๊ะพลิกคว่ำพร้อมเสียง #EMP ดังสนั่น#! ส่งตัวหมาก [activity.Custom('ContestBoardGameType')] กระเด็นไปทั่ว\n\nอารมณ์ของ [versus_contestant.GetFirstNamePossessive] เปลี่ยนไปอย่างกะทันหันเมื่อหลายตาก่อน ขณะที่ [versus_contestant.GetSheHe] ตระหนักว่าความผิดพลาดง่ายๆ ได้ตัดสินเกมให้เข้าข้างข้าไปแล้ว\n\n"ใช่ ใช่ ท่านชนะ [ROOT.Char.GetTitledFirstName]!" [versus_contestant.GetSheHe] คร่ำครวญ "#EMP มีความสุขไหม?!#!""
 contest_events.5510.a:0 "เก็บมันขึ้นมา! ข้าต้องทำการเคลื่อนไหวครั้งสุดท้าย!"
 contest_events.5510.b:0 "พฤติกรรมที่ไม่เป็นนักกีฬา เช่นนี้เป็นสิ่งที่ยอมรับไม่ได้!"
 contest_events.5510.c:0 "มาเถอะ กลับไปสองสามตาก่อน"
 contest_events.5510.d:0 "ท่านรู้ไหม ท่านน่าจะยอมแพ้ไปเลย..."
 contest_events.5520.t:0 "กลยุทธ์ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 contest_events.5520.desc:0 "จ้องมองกระดาน [activity.Custom('ContestBoardGameType')] อย่างเงียบๆ ขณะที่ [versus_contestant.GetFirstName] พิจารณาการเคลื่อนไหวครั้งต่อไปของ [versus_contestant.GetHerHis] ทันใดนั้นข้าก็เห็นมัน\n\nเสียสมาธิในการวางกลยุทธ์อย่างเกียจคร้าน ข้าได้มองข้ามช่องโหว่ที่จะ ทำให้ข้าได้เปรียบอย่างชัดเจน ตราบใดที่คู่ต่อสู้ของข้าไม่ได้คาดการณ์ไว้\n\nข้าระวังไม่แสดงอาการใดๆ ออกมา เกรงว่าจะดึงดูดความสนใจ สแกนดวงตาของ [versus_contestant.GetFirstNamePossessive] เพื่อหาการรับรู้หรือการหลอกลวงของกับดัก..."
 contest_events.5520.a:1 "$tournament_contest_header$ อย่างนุ่มนวล อย่างนุ่มนวล..."
 contest_events.5520.a.success:0 "การซ้อมรบเป็นการรัฐประหาร"
 contest_events.5520.a.failure:0 "การซ้อมรบย้อนกลับ"
 contest_events.5520.b:0 "ข้าว่า ท่านค่อนข้างจะเปิดเผยนะ ท่านรู้ไหม"
 contest_events.5520.c:0 "มันเป็นกลอุบาย กลยุทธ์ปัจจุบันของข้าถูกต้องแล้ว"
 contest_events.5530.t:0 "ความคล่องแคล่วของมือ"
 contest_events.5530.desc:0 "เกม [activity.Custom('ContestBoardGameType')] ดูเหมือนจะดำเนินไปอย่างสมบูรณ์แบบ ข้ากำลังคิดล่วงหน้าสาม สี่ หรืออาจจะห้าตาของคู่ต่อสู้ ทันใดนั้น [versus_contestant.GetFirstName] ก็ทำการเคลื่อนไหวที่ ทำให้กลยุทธ์ที่ซับซ้อนของข้าละลายหายไปเหมือนเกล็ดหิมะในเปลวเทียน\n\nข้าหมดทางเลือกโดยสิ้นเชิง ถ้าข้าไม่ทำอะไรที่บุ่มบ่าม ข้าจะแพ้การแข่งขันอย่างแน่นอน!"
 contest_events.5530.a:0 "ตัวหมากพิเศษคงไม่มีใครสังเกตเห็น..."
 contest_events.5530.a.success:0 "ท่านโกงทางไปสู่ชัยชนะได้สำเร็จ"
 contest_events.5530.a.failure:0 "การหลอกลวงของท่านถูกสังเกตเห็น"
 contest_events.5530.b:0 ""จริงๆ แล้ว มีกฎที่คลุมเครือนี้...""
 contest_events.5530.c:0 "ข้าจะไม่โกง!"
 contest_events.5540.t:0 "$tournament_contest_header$ กำลังเหนือสมอง"
 contest_events.5540.desc:0 "ดูเหมือนว่ากลยุทธ์อันยิ่งใหญ่ของข้ากำลังพังทลาย และ [versus_contestant.GetFirstName] กำลังได้เปรียบอย่างรวดเร็ว หากนี่เป็นเรื่องของการสงคราม ข้าคงจะพิจารณาการยอมจำนนอย่างเมตตา ข้ารู้สึกถึงความโกรธที่เดือดพล่านอยู่ภายในและกำปั้นของข้าแน่นพอที่จะ ทำให้เลือดออกได้\n\nขณะที่ [versus_contestant.GetSheHe] เอื้อมมือไปหยิบตัวหมากของ [versus_contestant.GetHerHis] ดวงตาที่พึงพอใจของ [versus_contestant.GetHerHis] ก็สบกับตาของข้า และใบหน้าของ [versus_contestant.GetHerHis] ก็เปลี่ยนเป็นสีหน้าตกใจและหวาดกลัว\n\nบางทีข้าอาจจะใช้ช่วงเวลานี้ข่มขู่ [versus_contestant.GetHerHim] ไม่ให้ทำการเคลื่อนไหวครั้งต่อไป"
 contest_events.5540.a:0 ""แตะตัวหมากนั้นแล้วข้าจะหักนิ้วเจ้า""
 contest_events.5540.a.success:0 "คู่ต่อสู้ของท่านยอมแพ้การแข่งขัน"
 contest_events.5540.a.failure:0 "คู่ต่อสู้ของท่านไม่สะทกสะท้าน"
 contest_events.5540.b:0 "ข้าจะไม่ ทำให้ตัวเองเสื่อมเสียเกียรติ"
 contest_events.5550.t:0 "$tournament_contest_header$ กฎของ [versus_contestant.GetCulture.GetNameNoTooltip]!"
 contest_events.5550.desc:0 "ข้าจับตาดู [activity.Custom('ContestBoardGameType')] อย่างใกล้ชิดขณะที่คู่ต่อสู้เตรียมทำการเคลื่อนไหวครั้งต่อไป น่าตกใจที่ [versus_contestant.GetFirstName] หยิบตัวหมากของ [versus_contestant.GetHerHis] ขึ้นมาและ... ทำผิดกฎต่อหน้าข้า!\n\n"นี่มันเล่ห์เหลี่ยมอะไรกัน?" ข้าคัดค้าน!\n\n"โอ้ ขออภัย" คู่ต่อสู้ของข้าวางมือลงบนโต๊ะอย่างพึงพอใจ "ข้าเข้าใจว่าเรากำลังเล่นตามกฎของ [versus_contestant.GetCulture.GetName]""
 contest_events.5550.a:0 "กรรมการ!"
 contest_events.5550.a.success:0 "กรรมการตัดสินตามกฎของ [ROOT.Char.GetCulture.GetName]"
 contest_events.5550.a.failure:0 "กรรมการตัดสินตามกฎของ [versus_contestant.GetCulture.GetName]"
 contest_events.5550.b:0 ""ได้โปรด สอนกฎของ [versus_contestant.GetCulture.GetNameNoTooltip] เหล่านี้ให้ข้าที""
