 contest_events.0705.desc:1 "เสียงแตรดังขึ้น ฝูงชนโห่ร้อง ผู้เข้าแข่งขันเริ่มรวมตัวกัน การประกวดสิ้นสุดลงแล้ว และช่วงเวลาแห่งความรุ่งโรจน์ของใครบางคนกำลังจะมาถึง ผู้ประกาศก้าวออกมา เสียงดังก้องไปทั่วฉาก\n\n"หลังจากผ่านการทดลองมากมาย ความยากลำบากบางประการ และเหนือสิ่งอื่นใดคือการแข่งขันที่เต็มไปด้วยจิตวิญญาณอย่างแท้จริง เราก็ได้ผู้เข้ารอบสามคนสุดท้ายของเรา ในอันดับที่สาม ผู้กล้าหาญ [third_place.GetTitledFirstName] อันดับที่สองอย่างสูสี [second_place.GetTitledFirstName]! แน่นอนว่านั่น ทำให้เราเหลือผู้ชนะของเรา [contest_winner.GetTitledFirstName]!"\n\n"
 contest_events.0705.first:0 "ข้ารู้อยู่แล้วว่าข้าสามารถชนะได้!"
 contest_events.0705.second:0 "อันดับสอง ข้าคิดว่าข้าคงบ่นไม่ได้"
 contest_events.0705.third:0 "อา ข้าเป็นผู้ชนะที่ได้รับชัยชนะน้อยที่สุด..."
 contest_events.0705.contestant:0 "ข้าจะแสดงให้พวกเขาเห็น - ครั้งหน้า"
 contest_events.0705.spectator:0 "การแสดงทักษะที่สนุกสนานที่สุด!"
 contest_events.0705.first_champion:0 "ไม่มีใครสามารถเอาชนะ [contest_champion.GetTitledFirstName] ได้!"
 contest_events.0705.second_champion:0 "[contest_champion.GetTitledFirstName] ทำให้ข้าภูมิใจ"
 contest_events.0705.third_champion:0 "ไม่ใช่แชมป์เปี้ยน แต่อย่างน้อย [contest_champion.GetTitledFirstName] ก็เกือบจะ..."
 contest_events.0705.contestant_champion:0 "แชมป์เปี้ยนของข้า [contest_champion.GetTitledFirstName] ไม่สามารถติดอันดับหนึ่งในสามได้..."
 contest_events.0705.spectator_champion:0 "แชมป์เปี้ยนของข้า [contest_champion.GetTitledFirstName] ไม่ได้แข่งขัน"
 contest_events.0705.a.winner:0 "ใช่แล้ว! [ROOT.Char.GetTitleAsNameNoTooltip] ของท่านได้รับชัยชนะ!"
 contest_events.0705.a.marriage:0 "ข้าเปลี่ยนใจแล้ว แค่รางวัลสำหรับท่านก็พอ"
 contest_events.0705.a:0 "ทำได้ดี [contest_winner.GetTitledFirstNameNoTooltip]"
 contest_events.0705.b:0 "ข้าทำทั้งหมดเพื่อ [ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip]!"
 contest_events.0705.c.winner:0 "ดูเหมือนว่าเราจะต้อง แต่งงานกัน [marriage_prize.GetFirstNameNoTooltip]"
 contest_events.0705.c:0 "ทำได้ดี มือของ [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] เป็นของท่านแล้ว"
 contest_events.0705.d.winner:0 "ข้าชนะ! ข้าชนะ #EMP จริงๆ#! แล้ว!"
