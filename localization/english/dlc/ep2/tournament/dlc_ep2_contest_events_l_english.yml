 contest_events.0820.contestant:0 "ไม่มีเวลาเตรียมตัวอีกแล้ว โดย [ROOT.Char.GetFaith.WarGodName] ข้าจะแสดงให้คู่ต่อสู้ของข้าเห็นสักสองสามอย่าง!\n\n"
 contest_events.0820.vs_resigned:0 "การต่อสู้ครั้งต่อไปของข้าควรจะเป็นกับ [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)] ของข้า [versus_contestant.GetTitledFirstName] แต่ [versus_contestant.GetSheHe] ได้ยอมแพ้แล้ว!\n\n"
