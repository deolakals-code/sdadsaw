 contest_events.0872.pivotal_failure:0 "การแทงที่เหนื่อยล้าของข้าพลาดเป้า คู่ต่อสู้ของข้าไม่แม้ แต่จะหลบการพยายามที่ไม่แม่นยำนั้นอย่างดูถูก แทนที่จะเป็น เช่นนั้น ข้าพบว่าตัวเองต้องป้องกันทันที ปัดป้องการโจมตีครั้งแล้วครั้งเล่าโดยไม่สามารถตอบโต้ด้วยการโจมตีของตัวเองได้ ข้าถอยหลังอย่างสิ้นหวัง หลบหลีกและหลบหลีก อะไรก็ได้เพื่ออยู่ในเกม\n\n"
