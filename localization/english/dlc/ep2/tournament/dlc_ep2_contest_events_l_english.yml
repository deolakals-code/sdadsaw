 contest_events.0820.woo_vow:0 "ข้าสแกนอัฒจันทร์อย่างสุขุม มองหา [woo_target.GetTitledFirstName] และเห็น [woo_target.GetHerHim] จ้องมองข้าอย่างเศร้าสร้อยอย่างรวดเร็ว - [woo_target.GetSheHe] ดูเหมือนจะแน่ใจว่าข้าจะแข่งขัน..."
