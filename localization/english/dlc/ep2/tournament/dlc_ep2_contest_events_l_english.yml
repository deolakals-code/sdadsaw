 contest_events.0710.t:0 "$tournament_contest_header$ ยิงเข้าเป้า"
 contest_events.0710.desc:0 "พลบค่ำเริ่มคลืบคลานเข้ามาอย่างช้าๆ แต่มั่นคงขณะที่การแข่งขันดำเนินต่อไป เสียงสายธนูดีดเป็นจังหวะที่ไม่สม่ำเสมอ ข้าพิงคันธนู พิจารณาเส้นทางที่การประกวดนี้ดำเนินไปจนถึงตอนนี้ เช่น ตอนที่"
 contest_events.0710.flavor_1:0 "คู่แข่งอีกคนสร้างเรื่องเกี่ยวกับความไม่เงียบในระหว่างตาของพวกเขา\n\n"
 contest_events.0710.flavor_2:0 "ผู้ยืนดูคนหนึ่งถูกลูกธนูปักอย่างน่าเศร้า\n\n"
 contest_events.0710.flavor_3:0 "ข้ายิงลูกธนูเข้ากลางเป้าพอดี\n\n"
 contest_events.0710.flavor_4:0 "ข้ายิงลูกธนูหมุนวนไปไม่ถึงเป้า\n\n"
 contest_events.0710.flavor_5:0 "คนแปลกหน้าลึกลับมาถึงงาน ทำให้เกิดข่าวลือมากมาย\n\n"
 contest_events.0710.flavor_6:0 "ลมเริ่มพัดแรง ทำให้ข้าต้องด้นสด\n\n"
 contest_events.0710.flavor_7:0 "ข้าเบื่อกลางการประกวด และลังเลกับความปรารถนาที่จะก่อความวุ่นวาย\n\n"
 contest_events.0710.flavor_8:0 "ข้าตัดสินใจว่าการประกวดต้องการความมีชีวิตชีวาเล็กน้อย\n\n"
 contest_events.0710.flavor_9:0 "ลูกธนูถูกเบี่ยงเบนระหว่างทางไปยังเป้าและปักคู่แข่งอีกคน\n\n"
 contest_events.0710.flavor_fallback:0 "การแข่งขันเริ่มจะสิ้นสุดลงแล้ว ขณะที่ลูกธนูยังคงพุ่งเข้า — และผ่าน — เป้าธนู หากข้าจะสร้างผลกระทบใดๆ ต่อไปจากนี้ ข้าต้องลงมือเดี๋ยวนี้"
 contest_events.0710.a:0 "ข้าเป็นหนึ่งเดียวกับคันธนูของข้า!"
 contest_events.0710.b:0 "การ 'จัดหา' ลูกธนูที่ดีกว่าจะ ทำให้ข้าได้เปรียบ..."
 contest_events.0710.c:0 "ด้วยลม เช่นนี้ วิถีนี้ก็น่าจะเพียงพอ"
 contest_events.0710.d:0 "การยิงครั้งสุดท้ายของข้าควรจะเป็นปกติ ข้าคิด"

 contest_events.0711.t:0 "$tournament_contest_header$ คำพูดถึงผู้มีปัญญา"
 contest_events.0711.desc:0 "ค่ำคืนเริ่มคลืบคลานเข้ามาในฉาก แต่คบเพลิงส่องสว่างการแข่งขันขณะที่มันดำเนินต่อไป ข้าพูดกับตัวเองเบาๆ เตรียมริมฝีปากสำหรับรอบต่อไปขณะที่ข้ารำลึกถึงเหตุการณ์ที่เกิดขึ้นจนถึงตอนนี้ เช่น ตอนที่"
 contest_events.0711.flavor_1:0 "คู่แข่งอีกคนมีบทกวีที่คล้ายกับของข้าอย่างน่าสงสัยก่อนที่ข้าจะขึ้นเวที\n\n"
 contest_events.0711.flavor_2:0 "คู่แข่งอีกคนสามารถลอกเลียนบทกวีที่เป็นที่รู้จักกันดีได้\n\n"
 contest_events.0711.flavor_3:0 "ข้าต้องรับมือกับอาการตื่นเวที\n\n"
 contest_events.0711.flavor_4:0 "ท้องฟ้าเปิดออกและ ทำให้ทั้งผู้เข้าแข่งขันและผู้ชมเปียกโชก\n\n"
 contest_events.0711.flavor_5:0 "ข้าเห็นโอกาสที่จะดูถูกคู่แข่งอีกคนในบทกวี\n\n"
 contest_events.0711.flavor_6:0 "เกียรติของข้าถูกคู่แข่งอีกคน ทำให้มัวหมอง และข้าต้องตอบโต้ในทำนองเดียวกัน\n\n"
 contest_events.0711.flavor_7:0 "บทกวีของข้าไปได้ดีมากจนข้ารู้สึกว่าต้องตามด้วยบทกวีอีกบททันที\n\n"
 contest_events.0711.flavor_8:0 "บทกวีของข้าไปได้แย่มากจนข้ารู้สึกว่าต้องบรรเทามันด้วยบทกวีอีกบททันที\n\n"
 contest_events.0711.flavor_fallback:0 "ข้าก้าวไปข้างหน้าเพื่อรับตาของข้า ขึ้นบันไดไปยังเวที ถึงเวลาสำหรับบทกวีสุดท้ายแล้ว"
 contest_events.0711.a:0 "เพลงสั้นๆ เกี่ยวกับการหาเงินและการใช้ชีวิตที่ดี"
 contest_events.0711.b:0 "เล่าเรื่องสงครามและชัยชนะให้ฝูงชนฟัง!"
 contest_events.0711.c:0 "วิงวอนต่ออำนาจที่สูงกว่า"
 contest_events.0711.d:0 "มา ทำให้มันปลอดภัยและเรียบง่ายกันเถอะ"

 contest_events.0720.t:0 "$tournament_contest_header$ ตึงเครียด"
 contest_events.0720.pivotal_success:0 "ข้าก้าวไปข้างหน้า ง้าง เล็ง ดึง และปล่อย ลูกธนูหวีดหวิวผ่านอากาศ ปักลึกลงไปในเป้า ฝูงชนโห่ร้อง ไม่มีการโต้เถียงใดๆ มันเป็นแต้มใหญ่ที่เข้าข้างข้า!\n\n"
 contest_events.0720.pivotal_neutral:0 "การยิงของข้าตรงเป้า แต่ไม่ตรงเป้าอย่างที่ข้าต้องการ มันปักเข้าเป้า แต่เพียงแค่ขอบๆ มันจะไม่ทำร้ายข้า แต่ก็คงไม่ให้เครดิตข้ามากนัก\n\n"
 contest_events.0720.pivotal_failure:0 "ขณะที่ข้าดึงสายธนูมาที่คาง ข้ารู้สึกถึงการสั่นเล็กน้อยในแขน ข้าปล่อยด้วยความตื่นตระหนก แต่ความเสียหายได้เกิดขึ้นแล้ว ลูกธนูพุ่งออกไปอย่างป่าเถื่อน ส่ายไปมาในอากาศ ก่อนที่จะหวีดหวิวผ่านเป้าไป! ฝูงชนคร่ำครวญ และข้าเอามือกุมศีรษะ\n\n"
 contest_events.0720.ptv_close:0 "แทบจะเป็นไปไม่ได้ที่จะบอกว่าใครกำลังชนะ ข้าเป็นหนึ่งในผู้นำอย่างแน่นอน แต่เราทุกคนเกือบจะสูสีกัน!"
 contest_events.0720.ptv_close_spectator:0 "มันสูสีกันมากที่ด้านบน ผู้นำสูสีกัน!"
 contest_events.0720.ptv_top:0 "ข้ากำลังชนะ! ชัยชนะใกล้เข้ามาแล้ว!"
 contest_events.0720.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] กำลังชนะอย่างชัดเจน! ตราบใดที่ [pivotal_contestant.GetHerHis] ยังคงสงบสติอารมณ์ได้ ชัยชนะก็เกือบจะแน่นอนแล้ว!"
 contest_events.0720.ptv_bottom:0 "ข้าล่องลอยอยู่ห่างไกลจากผู้นำ มันจะต้องใช้โชคอย่างมากในการชนะจากจุดนี้..."
 contest_events.0720.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] ดูเหมือนจะพ่ายแพ้แล้ว มันจะต้องใช้โชคอย่างมากในการชนะจากจุดนี้..."
 contest_events.0720.ptv_top_half:0 "ข้าอยู่ในครึ่งบน แต่ข้าไม่ได้นำ ด้วยโชคเล็กน้อย นี่อาจจะยังกลายเป็นชัยชนะได้..."
 contest_events.0720.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังนำหน้าอยู่เล็กน้อย แต่ [pivotal_contestant.GetSheHe] ยังไม่ชนะ เกียรติยศยังคงรออยู่"
 contest_events.0720.ptv_bottom_half:0 "ข้าถูกทิ้งให้อยู่ในครึ่งล่างของกระดานผู้นำ แต่ชัยชนะยังไม่พ้นสายตาโดยสิ้นเชิง..."
 contest_events.0720.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] ถูกทิ้งให้อยู่ในครึ่งล่างของกระดานผู้นำ แต่ชัยชนะยังไม่พ้นสายตาโดยสิ้นเชิง..."
 contest_events.0720.ptv_fallback:0 "ลูกธนูถูกปล่อยออกไปมากขึ้น ผู้เข้าแข่งขันที่สิ้นหวังปล่อยลูกธนูเกือบจะเร็วเท่าที่ได้รับอนุญาต"
 contest_events.0720.spectator:0 "\n\nเสียงสาปแช่งเมื่อสายธนูเสียดสีกับแขน เสียงดีดจากสายธนู ไม่ว่าจะขาดหรือดังก็ตาม สะท้อนไปทั่วบริเวณ ฝูงชนเข้าสู่จังหวะ: ความเงียบสงัดเมื่อผู้เข้าแข่งขันก้าวขึ้นมา เสียงเชียร์ดังสนั่นเมื่อลูกธนูถูกปล่อยออกไป"
 contest_events.0720.final:0 "เหลือลูกธนูอีกเพียงไม่กี่ลูกสำหรับผู้เข้าแข่งขัน แต่ละคน จุดจบใกล้เข้ามาแล้ว"
 contest_events.0720.a:0 "ง้างครั้งสุดท้าย..."
 contest_events.0720.b:0 "ง้างครั้งสุดท้าย!"

 contest_events.0721.t:0 "$tournament_contest_header$ เชี่ยวชาญในบทกวี"
 contest_events.0721.pivotal_success:0 "ข้าจบการแสดงบทกวีสุดท้าย แต่ฝูงชนไม่ได้รอจนจบ เสียงเชียร์กลบคำพูดของข้า ดอกไม้ตกลงมารอบตัวข้าบนเวทีขณะที่ข้าเดินลงไป\n\n"
 contest_events.0721.pivotal_neutral:0 "บทกวีสุดท้ายของข้าได้รับเสียงเชียร์และเสียงปรบมือ แต่ขณะที่ข้าเดินลงจากเวที ข้าอดไม่ได้ที่จะรู้สึกว่าข้ายังไม่ได้แสดงความสามารถอย่างเต็มที่\n\n"
 contest_events.0721.pivotal_failure:0 "ข้าจบบทกวีด้วยกำปั้นที่ชูขึ้นและความมั่นใจที่ดังสนั่น อย่างไรก็ตาม ฝูงชนเพียงแค่ปรบมืออย่างสุภาพ สลับกับเสียงไอเล็กน้อย ไหล่ของข้าตกขณะที่ข้าออกจากเวที ความหวังของข้ากำลังริบหรี่...\n\n"
 contest_events.0721.ptv_fallback:0 "ผู้เข้าแข่งขันเข้าแถวรอขึ้นเวทีมากขึ้นเรื่อยๆ ขยับเท้าไปมาอย่างประหม่า"
 contest_events.0721.spectator:0 "\n\nคำเดียวที่ผิดที่ก็เพียงพอที่จะ ทำให้ฝูงชนคร่ำครวญอย่างสิ้นหวังในตอนนี้ ในขณะที่การนำเสนอที่เฉียบคม ทำให้เกิดเสียงปรบมือดังสนั่น ผู้ชมกระทืบเท้าและเชียร์ขณะที่ผู้เข้าแข่งขันเข้าใกล้เวที บรรยากาศที่ร้อนแรงกำลังดำเนินไป"
 contest_events.0721.final:0 "เหลือผู้เข้าแข่งขันอีกเพียงไม่กี่คน และเวลาก็เหลือน้อยลงไปอีก ทุกอย่างขึ้นอยู่กับสิ่งนี้"
 contest_events.0721.a:0 "บทกวีสุดท้าย..."
 contest_events.0721.b:0 "บทกวีสุดท้าย!"

