 contest_events.0910.t:1 "$tournament_contest_header$ ควบคุมไม่อยู่"
 contest_events.0910.melee:0 "เลือดของข้าเดือดพล่านเมื่อดูอัศวินประลองทุบคู่ต่อสู้ ขณะที่ทุกโอกาสแห่งเกียรติยศถูกขโมยไปจากข้าโดยเพื่อนร่วมทีมหรือการถอยหนีอย่างรวดเร็ว\n\nในที่สุด [wrathful_victim.GetTitledFirstName] ก็ล้มลงในโคลนที่เท้าของข้า เสียสมดุลจากการโจมตีที่ทะเยอทะยานเกินไป ดาบอยู่ไกลเกินเอื้อม\n\n"เจ้าเกือบจะโดนหัวข้า!" ข้าคำราม จ้องมอง [wrathful_victim.GetHerHim] คนโง่อยู่ในความเมตตาของข้า"
 contest_events.0910.wrestling:0 "[wrathful_victim.GetTitledFirstName] และข้าวนเวียนกันมานานราวกับชั่วนิรันดร์ อบอยู่ใต้แสงแดดยามเที่ยง\n\nทุกครั้งที่ข้าเคลื่อนไหว [wrathful_victim.GetSheHe] ก็ดิ้นหลุดจากกริปของข้าในวินาทีสุดท้าย และข้าก็ใกล้จะหมดความอดทนแล้ว\n\nทันทีที่ข้ากำลังจะพุ่งเข้าใส่เจ้าหมู [wrathful_victim.GetFirstNameNoTooltip] ก็สะดุด เปิดช่องให้โจมตีได้อย่างสมบูรณ์"
 contest_events.0910.duel:0 "$contest_events.0910.melee$"
 contest_events.0910.a:0 "ข้าจะสอนบทเรียนให้เจ้า เจ้าตัวเล็กน่าสังเวช...!"
