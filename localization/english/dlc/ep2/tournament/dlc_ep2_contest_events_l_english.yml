 contest_events.5570.desc:0 "ข้าจดจ่ออยู่กับกระดานหมากรุกอย่างตั้งใจ และผู้ชมทั้งหมดก็นั่งเงียบกริบด้วยความคาดหวัง เช่นกัน ทันใดนั้น ด้วยเสียงโลหะดังแคร้ง ความสนใจของผู้ชมทั้งหมดก็ถูกดึงไปยังผู้ติดตามโง่ๆ ที่เพิ่งทำชุดอาวุธและเกราะหล่นลงกับพื้น\n\nไม่มีใครมองกระดาน ตอนนี้เป็นโอกาสของข้าที่จะพลิกเกมโดยการยุ่งกับตัวหมาก!"
