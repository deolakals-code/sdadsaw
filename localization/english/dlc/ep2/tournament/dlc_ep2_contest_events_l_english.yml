 contest_events.0825.safe:0 "ด้วยความกลัวความอับอาย หรืออาจถูกขับเคลื่อนด้วยแรงจูงใจอื่น [resign_target.GetTitledFirstName] ได้ยอมแพ้ต่อคู่ต่อสู้ของ [resign_target.GetHerHis] [versus_contestant.GetTitledFirstName] ในการประกวด [activity.GetCurrentPhase.GetPhase.GetName|l]\n\n"
