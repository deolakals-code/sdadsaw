 contest_events.0820.vs_final:0 "ข้าได้เข้ารอบชิงชนะเลิศแล้ว! [versus_contestant.GetTitledFirstName] คือสิ่งเดียวที่ขวางกั้นระหว่างข้ากับชัยชนะ\n\n"
