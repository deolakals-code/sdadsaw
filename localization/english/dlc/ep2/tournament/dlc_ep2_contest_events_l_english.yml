 contest_events.0860.t:0 "$tournament_contest_header$ เต็มกำลัง"
 contest_events.0860.desc:0 "ธงพลิ้วไหวในสายลม ขโมยลมหายใจของฝูงชนไปชั่วขณะขณะที่ข้าควบคุมม้า ข้ายกทวนขึ้นขณะที่เหตุการณ์ก่อนหน้าของการประกวดเล่นซ้ำในใจ เช่น ตอนที่"
 contest_events.0860.flavor_1:0 "ข้าต่อสู้ฝ่าฟันอาการบาดเจ็บหลังจากถูกโจมตีอย่างรุนแรงที่สีข้าง\n\n"
 contest_events.0860.flavor_2:0 "คู่ต่อสู้ของข้าถูกกระแทกตกจากหลังม้าอย่างแรง\n\n"
 contest_events.0860.flavor_3:0 "คู่ต่อสู้ของข้าพยายามใช้ทวนขนาดมหึมา\n\n"
 contest_events.0860.flavor_4:0 "คู่ต่อสู้ของข้าเข้ามาหาข้าขอประลองบนพื้นดิน\n\n"
 contest_events.0860.flavor_5:0 "คู่ต่อสู้ผู้สูงศักดิ์ของข้าพยายามประลองทวนแม้จะมีบาดแผลร้ายแรง\n\n"
 contest_events.0860.flavor_6:0 "คู่ต่อสู้ของข้าขอผ่านอย่างเมตตา\n\n"
 contest_events.0860.flavor_7:0 "ข้าพูดคุยกับคนดูแลม้าที่ยุ่งเหยิงของคู่ต่อสู้\n\n"
 contest_events.0860.flavor_8:0 "ฝูงชนโห่ไล่ข้าขณะที่ข้าเตรียมตัวประลองทวน\n\n"
 contest_events.0860.flavor_9:0 "ข้าให้คู่ต่อสู้ยืมทวนหลังจากที่พวกเขาทวนหมด\n\n"
 contest_events.0860.flavor_10:0 "คู่แข่งอีกคนตกจากหลังม้า ได้รับบาดเจ็บน่าสยดสยอง\n\n"
 contest_events.0860.flavor_fallback:0 "คู่ต่อสู้ของข้าเข้าแถวที่ปลายอีกด้านของสนามประลอง นี่แหละ"
 contest_events.0860.a:0 "บางทีถ้าข้าตีหัวพวกเขา..."
 contest_events.0860.b:0 "เล็งสูง ไปต่ำ"
 contest_events.0860.c:0 "ข้าคิดว่าข้าเห็นสัญญาณในการผ่านครั้งก่อน..."
 contest_events.0860.d:0 "ไม่มีเล่ห์เหลี่ยม แค่เล็งไปที่โล่"

 contest_events.0861.t:0 "$tournament_contest_header$ ถูกกด"
 contest_events.0861.desc:0 "ฝูงชนโห่ร้องต้องการเลือดขณะที่ข้าเดินโซเซไปข้างหน้าเพื่อเผชิญหน้ากับคู่ต่อสู้อีกครั้ง ข้าปาดเลือดสีแดงออกจากหน้าผากและพิจารณาการต่อสู้จนถึงตอนนี้ ครุ่นคิดถึงตอนที่"
 contest_events.0861.flavor_1:0 "ข้าพยายามระบุจุดอ่อนของคู่ต่อสู้ก่อนหน้านี้\n\n"
 contest_events.0861.flavor_2:0 "คู่ต่อสู้ของข้าหยุดเพื่อเล่นกับฝูงชน\n\n"
 contest_events.0861.flavor_3:0 "ข้าใช้ฝุ่น ทำให้คู่ต่อสู้ตาบอด\n\n"
 contest_events.0861.flavor_4:0 "ข้าใช้เล่ห์เหลี่ยมสกปรกบางอย่าง เพื่อให้สำเร็จ\n\n"
 contest_events.0861.flavor_5:0 "สมาชิกของฝูงชนให้ความช่วยเหลือที่ไม่คาดคิดแก่ข้า\n\n"
 contest_events.0861.flavor_6:0 "คู่ต่อสู้ร่างท้วมของข้าท้าทายข้าด้วยความใหญ่โตของพวกเขา\n\n"
 contest_events.0861.flavor_7:0 "คู่ต่อสู้ของข้าและข้าลงเอยในท่าทางที่ค่อนข้างเร้าอารมณ์\n\n"
 contest_events.0861.flavor_8:0 "เพื่อนของคู่ต่อสู้กล่าวหาว่าข้าโกง\n\n"
 contest_events.0861.flavor_9:0 "ข้าวิเคราะห์คู่ต่อสู้ เพื่อให้แน่ใจว่าจะสำเร็จ\n\n"
 contest_events.0861.flavor_10:0 "นิ้วของข้าหลุดออกจากข้อต่อ\n\n"
 contest_events.0861.flavor_11:0 "คู่ต่อสู้ของข้าจิ้มตาข้า\n\n"
 contest_events.0861.flavor_12:0 "คู่ต่อสู้ของข้า น้ำลายฟูมปาก กัดจมูกข้า\n\n"
 contest_events.0861.flavor_13:0 "ข้าตบมือปิดหูคู่ต่อสู้ ทำให้แก้วหูแตก\n\n"
 contest_events.0861.flavor_fallback:0 "เพื่อทำการเคลื่อนไหวของข้า\n\n"
 contest_events.0861.a:0 "ตับนั่นดูเปราะบาง..."
 contest_events.0861.b:0 ""มา! มาประลองกันเยี่ยงนักรบ!""
 contest_events.0861.c:0 "หลอกต่ำ ไปสูง"
 contest_events.0861.d:0 "ทำให้มันง่าย ทำให้มันปลอดภัย"

 contest_events.0862.t:0 "$tournament_contest_header$ การตอบโต้"
 contest_events.0862.desc:0 "เสียงโลหะกระทบกันดังสนั่นขณะที่ดาบสองเล่มขูดไปตามความยาวของกันและกัน ประกายไฟส่องแสงระยิบระยับขณะที่ตกลงสู่พื้น ข้ามองหาความได้เปรียบ พลางนึกถึงตอนที่"
 contest_events.0862.flavor_3:0 "ดาบของคู่ต่อสู้ของข้ากระเด็นเข้าไปในฝูงชน\n\n"
 contest_events.0862.flavor_4:0 "ข้าเตะคู่ต่อสู้ที่หว่างขาตามสัญชาตญาณ\n\n"
 contest_events.0862.flavor_5:0 "ข้าพบว่าตัวเองได้เปรียบอย่างมากและตัดสินใจว่าจะใช้มันให้ดีที่สุดอย่างไร\n\n"
 contest_events.0862.flavor_6:0 "คู่ต่อสู้ของข้าพยายามติดสินบนข้า\n\n"
 contest_events.0862.flavor_7:0 "ข้าต้องเลือกระหว่างการตอบโต้และการป้องกันคู่ต่อสู้ที่ก้าวร้าว\n\n"
 contest_events.0862.flavor_8:0 "ข้าเห็นโอกาสที่จะใช้มืออีกข้างระหว่างการประลอง\n\n"
 contest_events.0862.flavor_9:0 "ข้าพบว่าตัวเองกำลังต่อสู้ในเสื้อคลุมของนักประลอง\n\n"
 contest_events.0862.flavor_10:0 "ข้าพิจารณาที่จะ ทำให้คู่ต่อสู้เสียสมาธิด้วยคำพูด\n\n"
 contest_events.0862.flavor_11:0 "ข้าใช้ประโยชน์จากประสบการณ์ #EMP อันใกล้ชิด#! ของข้ากับสมาชิกในครอบครัวของคู่ต่อสู้คนหนึ่ง\n\n"
 contest_events.0862.flavor_fallback:0 "เราเข้าหากันอีกครั้ง เราทั้งคู่บอบช้ำ ทั้งคู่เหนื่อยล้า และมีผู้ชนะได้เพียงคนเดียว\n\n"
 contest_events.0862.a:0 "ข้าต้องจำการฝึกฝนของข้า"
 contest_events.0862.b:0 ""อะไร? เจ้า #EMP กลัว#! รึ?""
 contest_events.0862.c:0 "การหลอกลวงครั้งสุดท้ายอาจตัดสินสิ่งนี้..."
 contest_events.0862.d:0 ""มาเถอะ มาสู้กัน""

 contest_events.0863.t:0 "$tournament_contest_header$ ตรวจสอบ"
 contest_events.0863.desc:1 "เสียงคลิกเบาๆ ของตัวหมากที่เคลื่อนไหวรบกวนความสงบ เราเข้าสู่ช่วงท้ายเกมแล้ว และเกมก็แขวนอยู่บนเส้นด้าย ข้าครุ่นคิดถึงสิ่งที่เกิดขึ้นแล้ว เช่น ตอนที่"
 contest_events.0863.flavor_1:0 "ข้าพยายาม ทำให้คู่ต่อสู้เสียสมาธิด้วยเกมจิตวิทยา\n\n"
 contest_events.0863.flavor_2:0 "คู่ต่อสู้ของข้าคว่ำโต๊ะทั้งหมดด้วยเสียงดังสนั่น\n\n"
 contest_events.0863.flavor_3:0 "ข้าเห็นโอกาสที่จะทำการเคลื่อนไหวที่เสี่ยง แต่คุ้มค่า\n\n"
 contest_events.0863.flavor_4:0 "ข้าเห็นและครุ่นคิดถึงช่องทางที่จะโกง\n\n"
 contest_events.0863.flavor_5:0 "ข้าข่มขู่คู่ต่อสู้ให้ทำการเคลื่อนไหวที่ไม่ดี\n\n"
 contest_events.0863.flavor_6:0 "คู่ต่อสู้ของข้าเรียกร้องให้ข้าเคารพการตีความกฎของพวกเขา\n\n"
 contest_events.0863.flavor_fallback:0 "ตัวหมากเคลื่อนไหวอย่างเงียบเชียบ เร่งรีบ เราทั้งคู่ไม่มีเวลานานที่จะบังคับให้ชนะ\n\n"
 contest_events.0863.a:0 "บางทีข้าอาจจะดึงความรู้ด้านการสงครามมาใช้ได้?"
 contest_events.0863.b:0 ""เจ้าดูมั่นใจในตัวเองมากนะ...""
 contest_events.0863.c:0 "บางทีถึงเวลาสำหรับการเคลื่อนไหวที่กล้าหาญ?"
 contest_events.0863.d:0 "การเล่นอย่างปลอดภัยคือการเคลื่อนไหวที่ถูกต้อง"

 contest_events.0870.t:0 "$tournament_contest_header$ โจมตีเข้าเป้า"
 contest_events.0870.pivotal_success:0 "อย่างแรก เสียงของการชน จากนั้น ชั่วครู่ต่อมา การสั่นสะเทือนขึ้นมาที่แขนของข้า จากนั้น ทันใดนั้น เสียงอีกเสียงหนึ่ง: เสียงโห่ร้องของฝูงชน ทวนของข้าโจมตีเข้าเป้าอย่างแรง แตกละเอียดบนโล่ของคู่ต่อสู้ ที่น่าสังเกตยิ่งกว่านั้นคือ พวกเขาพลาดเป้าโดยสิ้นเชิง!\n\n"
 contest_events.0870.pivotal_neutral:0 "แม้ว่าเราทั้งคู่จะเริ่มต้นได้ดี แขนของข้าก็สั่นและลดลง เฉือนผ่านโล่ของคู่ต่อสู้ไป การผ่อนปรนเพียงอย่างเดียวคือคู่ต่อสู้ของข้าพลาดสูงเท่าที่ข้าพลาดต่ำ เสียงคร่ำครวญของฝูงชนดังสนั่น\n\n"
 contest_events.0870.pivotal_failure:0 "ข้าเฝ้าดูปลายทวนของข้าเข้าใกล้ เข้าใกล้ และ... #EMP พลาด#! โล่ของคู่ต่อสู้ ชั่วครู่ต่อมาข้าถูกกระแทกถอยหลังในอานม้า ทวนแตกละเอียดกับโล่ของข้าเอง เสียงโห่ร้องของฝูงชนเป็นคำสาปแช่งต่อหูของข้า\n\n"
 contest_events.0870.ptv_close:0 "ถึงเวลาสำหรับการผ่านครั้งสุดท้ายแล้ว ทุกอย่างขึ้นอยู่กับสิ่งนี้"
 contest_events.0870.ptv_top:0 "ข้าอยู่ข้างบน แต่ยังเหลือการประลองทวนอีกครั้ง สิ่งที่ข้าต้องการคือการเสมอในการผ่านครั้งสุดท้ายนี้..."
 contest_events.0870.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] ขึ้นนำ แต่ยังเหลือการผ่านครั้งสุดท้าย..."
 contest_events.0870.ptv_bottom:0 "ข้าตามหลังอยู่มาก และบอบช้ำและฟกช้ำด้วย ความหวังเดียวของข้าคือการโจมตีคู่ต่อสู้แรงพอที่พวกเขาจะไม่สามารถดำเนินการต่อได้ แต่มันจะต้องใช้ปาฏิหาริย์..."
 contest_events.0870.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] ดูเหมือนจะพ่ายแพ้แล้ว เว้น แต่จะมีการพลิกกลับอย่างน่าทึ่ง แน่นอนว่านี่ถูกกำหนดไว้แล้ว"
 contest_events.0870.ptv_top_half:0 "ข้ากำลังชนะ แต่ยังมีเรื่องที่น่ากังวลอีกมาก แม้ แต่การโจมตีเพียงครั้งเดียวก็สามารถจบการประกวดนี้โดยเข้าข้างข้าหรือพวกเขาได้"
 contest_events.0870.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังชนะ แต่มันก็เป็นการแข่งขันที่สูสี เกียรติยศยังคงรออยู่"
 contest_events.0870.ptv_bottom_half:0 "ข้าตามหลังคะแนนอยู่ แต่ข้ายังสามารถพลิกกลับมาได้ เหลืออีกหนึ่งการผ่านให้เสร็จสิ้น โอกาสอีกครั้งสำหรับเกียรติยศ..."
 contest_events.0870.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังแพ้ แต่ยังไม่จบ การกระทำเพียงครั้งเดียวอาจพลิกสถานการณ์ให้ [pivotal_contestant.GetHerHim] ได้..."
 contest_events.0870.ptv_fallback:1 "การผ่านครั้งสุดท้ายของรอบใกล้เข้ามาแล้ว ขณะที่ม้าทั้งสองเริ่มควบ"
 contest_events.0870.spectator:0 "\n\nรอบสุดท้ายของการประลองทวนนั้นวุ่นวาย: ผู้ชมเยาะเย้ยและตะโกน แพทย์รักษาผู้บาดเจ็บ และความร้อนของฝูงชนที่แออัด ทำให้ทุกอย่างถึงขีดสุด"
 contest_events.0870.final:0 "\n\nเสียงกีบม้าดังสนั่น ทวนลดต่ำลง ฝูงชนโห่ร้อง"
 contest_events.0870.winner_start:0 "เรารีเซ็ตครั้งสุดท้าย และขณะที่ม้าของข้าควบเข้าหา [versus_contestant.GetFirstName] ข้ารู้สึกดีเกี่ยวกับการประลองทวนครั้งนี้"
 contest_events.0870.loser_start:0 "เรารีเซ็ตอีกครั้ง แต่ขณะที่ข้าพุ่งเข้าไป มีบางอย่างรู้สึกผิดปกติ จังหวะของม้า หรือวิธีที่เกราะของข้าสวมอยู่"
 contest_events.0870.winner_break:0 "ทวนของข้าโจมตีเข้าเป้า ตรงเข้าโล่ของ [versus_contestant.GetHerHis] ด้วยเสียงดังสนั่นและการระเบิดของเศษไม้ ขณะที่ทวนของ [versus_contestant.GetHerHis] เองพุ่งผ่านข้าไป นั่นคือแต้มทั้งหมดที่ข้าต้องการ!"
 contest_events.0870.winner_unhorse:0 "ทวนของข้าจับ [versus_contestant.GetHerHim] เต็มหน้าอก โยน [versus_contestant.GetHerHim] ลงกับพื้นท่ามกลางเศษไม้ขณะที่ม้าของข้าควบต่อไป"
 contest_events.0870.loser_break:0 "ทวนของข้าเบี่ยงออกจากเป้าหมายในวินาทีสุดท้าย และข้ารู้สึกว่า [versus_contestant.GetHerHis] โจมตีเข้าเป้า กระแทกโล่ของข้าก่อนเสียงดังสนั่นและการระเบิดของเศษไม้"
 contest_events.0870.loser_unhorse:0 "ข้าไม่สามารถอยู่บนเป้าหมายได้ขณะที่เราเข้าใกล้ และข้าเห็นทวนของ [versus_contestant.GetHerHis] หาทางอ้อมโล่ของข้า ตรงเข้าหน้าอกของข้า มึนงงอยู่บนพื้น ข้าได้ยิน [versus_contestant.GetHerHim] ควบม้าต่อไปอย่างมีชัย"
 contest_events.0870.a:0 "การประลองทวนครั้งสุดท้ายของรอบกำลังเรียกหา"
 contest_events.0870.b:0 "การประลองทวนครั้งสุดท้ายสำหรับรอบ!"

 contest_events.0871.t:0 "$tournament_contest_header$ การโยน"
 contest_events.0871.pivotal_success:0 "มือบนไหล่ของพวกเขา การสะดุดที่คล่องแคล่วและการเหวี่ยงอันยิ่งใหญ่ เราล้มลงกับพื้น เสียงทั้งหมดคือเสียงหายใจหอบ และไกลออกไปคือเสียงโห่ร้องของฝูงชน ข้าตะเกียกตะกายขึ้นไปบนคู่ต่อสู้ พยายามกดดันเพื่อความได้เปรียบ\n\n"
