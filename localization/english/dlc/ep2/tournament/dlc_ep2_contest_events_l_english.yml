 contest_events.0872.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังแพ้การต่อสู้นี้ ไม่มากนัก บางที แต่ [pivotal_contestant.GetSheHe] ต้องทำอะไรบางอย่างเร็วๆ นี้"
 contest_events.0872.ptv_fallback:0 "เหล็กปะทะเหล็กขณะที่ดาบปะทะกันอีกครั้ง"
 contest_events.0872.spectator:0 "\n\nทั้งสองหันเข้าหากันอีกครั้ง และประกายไฟสว่างไสวในเวลากลางวัน เสียงอ้าปากค้างจากฝูงชนดังขึ้นพร้อมๆ กับเสียงการโจมตีจากดาบ"
 contest_events.0872.final:0 "เสียงคำราม เสียงดังกระทบกัน เสียงตะโกนของฝูงชน คอรัสที่โหดร้ายสู่จุดจบของการประลองนี้"
 contest_events.0872.winner_start:0 "ข้าสัมผัสได้ถึงชัยชนะ และรีบคว้ามันมาก่อนที่ [versus_contestant.GetFirstName] จะฟื้นตัว"
 contest_events.0872.loser_start:0 "[versus_contestant.GetFirstName] เปลี่ยนกลยุทธ์ทันที และข้าสัมผัสได้ว่าจุดจบใกล้เข้ามาแล้ว"
 contest_events.0872.winner_yield:0 "[versus_contestant.GetSheHe|U] อ่อนแรงภายใต้การโจมตีที่ถาโถมของข้า แทบจะไม่สามารถรักษาท่าทางด้วยการป้องกันของ [versus_contestant.GetHerHis] จนกระทั่งในที่สุด [versus_contestant.GetSheHe] ก็ถอยออกไป ยอมแพ้"
 contest_events.0872.winner_disarm:0 "ข้าจับส่วนแข็งของดาบของ [versus_contestant.GetHerHis] ด้วยการโจมตีครั้งสุดท้ายของการโจมตีที่รวดเร็ว ทำลายกริปของ [versus_contestant.GetHerHis] และส่งอาวุธหมุนลงไปในฝุ่น"
 contest_events.0872.loser_yield:0 "ข้าแทบจะไม่สามารถรักษาการป้องกันของข้าจากการโจมตีที่แม่นยำของ [versus_contestant.GetHerHis] ได้ พลังงานของข้าหมดลงอย่างรวดเร็ว ข้ายกแขนขึ้นเพื่อยอมแพ้ แทนที่จะยืดเยื้อสิ่งที่หลีกเลี่ยงไม่ได้"
 contest_events.0872.loser_disarm:0 "ข้าทำดีที่สุดเพื่อรักษาการป้องกันของข้าจากการโจมตีที่ถาโถมของ [versus_contestant.GetHerHis] แต่ครั้งสุดท้ายจับดาบของข้าอย่างงุ่มง่าม ทำลายกริปของข้าและกระแทกมันลงไปในฝุ่น"
 contest_events.0872.a:0 "อีกครั้งเดียว..."
 contest_events.0872.b:0 "อีกครั้งเดียว!"

 contest_events.0873.t:0 "$tournament_contest_header$ ช่วงท้ายเกม"
 contest_events.0873.pivotal_success:0 "ข้าอดไม่ได้ที่จะปล่อยให้ใบหน้าของข้าแตกออกครู่หนึ่งและยิ้มขณะที่คู่ต่อสู้ของข้าตกลงไปในกับดักที่ข้าได้วางไว้อย่างสมบูรณ์แบบ ไม่กี่ตาต่อมา และข้าได้กดดันช่องโหว่ให้กลายเป็นความได้เปรียบ\n\n"
 contest_events.0873.pivotal_neutral:0 "คู่ต่อสู้ของข้าไม่สนใจกับดักที่ข้าได้วางไว้ แต่ข้าก็สังเกตเห็นและหลบหลีกกับดักที่วางไว้สำหรับข้า เช่นกัน การเคลื่อนไหวที่ตึงเครียดอีกสองสามตาพิสูจน์ว่าไร้ผลสำหรับเราทั้งคู่ เกมอยู่ในภาวะที่ค่อนข้างจะเสมอกันขณะที่เราเคลื่อนเข้าสู่ช่วงท้าย\n\n"
 contest_events.0873.pivotal_failure:0 "ทันทีที่มือของข้าออกจากตัวหมาก ข้าก็รู้ว่าข้าทำพลาด และกับดักที่วางไว้อย่างมีศิลปะของคู่ต่อสู้ก็ถูกเปิดออก ไม่กี่ตาต่อมาและข้าก็เสียเปรียบอย่างชัดเจนจากความผิดพลาดของข้า ถูกบังคับให้อยู่ในตำแหน่งที่ข้าไม่ต้องการเลย\n\n"
 contest_events.0873.ptv_close:0 "เกมนี้จะจบลงอย่างไรเป็นเรื่องที่ใครๆ ก็เดาได้ ขอบเขตของชัยชนะนั้นเล็กมาก และต้นทุนของความผิดพลาดก็สูงมาก"
 contest_events.0873.ptv_top:0 "ข้ากำลังชนะด้วยคะแนนที่ห่างกันพอสมควร หากข้าสามารถกดดันความได้เปรียบนี้อย่างหนัก ชัยชนะก็อยู่ใกล้แค่เอื้อมแน่นอน!"
 contest_events.0873.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] กำลังชนะด้วยคะแนนที่ห่างกันพอสมควร หาก [pivotal_contestant.GetSheHe] สามารถกดดันความได้เปรียบนี้อย่างหนัก ชัยชนะก็อยู่ใกล้แค่เอื้อมแน่นอน!"
 contest_events.0873.ptv_bottom:0 "ข้ากำลังแพ้ และตำแหน่งของข้าก็แย่ลงเกือบทุกตา มันจะต้องใช้ปาฏิหาริย์บางอย่างในการชนะจากจุดนี้..."
 contest_events.0873.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] กำลังแพ้ และตำแหน่งของพวกเขาก็แย่ลงเกือบทุกตา มันจะต้องใช้ปาฏิหาริย์บางอย่างในการชนะจากจุดนี้..."
 contest_events.0873.ptv_top_half:0 "ข้ากำลังชนะ แต่มันยังไม่แน่นอน ความผิดพลาดใดๆ อาจมีราคาแพง"
 contest_events.0873.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังชนะ แต่มันยังไม่แน่นอน ความผิดพลาดใดๆ อาจมีราคาแพง"
 contest_events.0873.ptv_bottom_half:0 "ข้ากำลังแพ้ แต่ตำแหน่งของข้ายังไม่สิ้นหวัง หากข้าสามารถหาช่องโหว่ได้..."
 contest_events.0873.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] กำลังแพ้ แต่ตำแหน่งยังไม่สิ้นหวัง หาก [pivotal_contestant.GetSheHe] สามารถหาช่องโหว่ได้..."
 contest_events.0873.ptv_fallback:0 "ตำแหน่งของกระดานยังคงซับซ้อนมากขึ้น แต่กลับง่ายขึ้นเมื่อเส้นทางและกลยุทธ์ที่เป็นไปได้ถูกปิดกั้น"
 contest_events.0873.spectator:0 "\n\nคิ้วขมวดลึกขณะที่เกมดำเนินไปอย่างไม่หยุดยั้ง ผู้ชมรักษาความเงียบสงัดเพื่อหลีกเลี่ยงการรบกวน หรือแย่กว่านั้นคือการเปิดเผยการเคลื่อนไหวที่เป็นไปได้ ซึ่งจะเป็นประโยชน์ต่อผู้ที่พวกเขาชื่นชอบ"
 contest_events.0873.final:0 "เสียงคลิกเบาๆ มากขึ้น ความเครียดทางจิตใจมากขึ้น ช่วงท้ายเกมกำลังดำเนินไปอย่างดี"
 contest_events.0873.winner_start:0 "ไม่นานก็ชัดเจนว่าไม่มีทางกลับสำหรับ [versus_contestant.GetFirstName]"
 contest_events.0873.loser_start:1 "ชั่วครู่ต่อมา ข้าก็ตระหนักถึงอันตรายของตำแหน่งของข้าในที่สุด [versus_contestant.GetFirstName] ล่อข้ามาตั้งแต่ต้น!"
 contest_events.0873.winner_surprise:0 "[versus_contestant.GetSheHe|U] ตกลงไปในกับดักของข้าพอดี ไม่สังเกตเห็นตอนจบที่ข้าวางแผนไว้อย่างรอบคอบ ด้วยท่าทางที่ไม่แยแส การเคลื่อนไหวครั้งสุดท้ายของข้าคลิกเข้าที่บนกระดาน"
 contest_events.0873.winner_grind:1 "ข้าบดขยี้ [versus_contestant.GetHerHim] อย่างไม่หยุดยั้ง เคลื่อนเข้าสู่ชัยชนะขณะที่ตำแหน่งของ [versus_contestant.GetHerHis] อ่อนแอลงอย่างช้าๆ แต่ไม่อาจแก้ไขได้"
 contest_events.0873.loser_surprise:1 "[versus_contestant.GetSheHe|U] ล่อข้าให้ติดกับดักมาครึ่งเกมแล้ว รอเวลาของ[versus_contestant.GetHerHis]ขณะที่ข้าพลาดท่า ตอนนี้ ไม่มีทางหนีแล้ว"
 contest_events.0873.loser_grind:1 "ดูเหมือนว่าทุกการเคลื่อนไหวที่ข้าทำคือการประนีประนอม เสียเปรียบทีละนิ้วให้กับการเล่นที่เหนือกว่าของ [versus_contestant.GetHerHis] ไม่นานนัก ตำแหน่งของข้าก็ไม่อาจรักษาไว้ได้"
 contest_events.0873.a:0 "เหลืออีกเพียงไม่กี่ตา..."
 contest_events.0873.b:0 "เหลืออีกเพียงไม่กี่ตา!"
