coronation_events.6150.supp: ""เปลี่ยนความนับถือของ [neighbor.GetFirstNamePossessiveNoTooltip] ให้เป็นการยอมจำนน!""
coronation_events.6150.supp.success: "[neighbor.GetTitledFirstNameNoTooltip] ถูกพูดคุยให้ยอมเป็นข้าหลวง"
coronation_events.6150.supp.fail: "[neighbor.GetTitledFirstNameNoTooltip] ปฏิเสธการทูตอย่างไม่เป็นทางการ"
coronation_events.6150.d: ""โน้มน้าวให้ [neighbor.GetTitledFirstNameNoTooltip] ส่งเครื่องบรรณาการ""
coronation_events.6150.d.success: "[neighbor.GetTitledFirstNameNoTooltip] ยินดีต้อนรับอำนาจเหนือของท่าน"
coronation_events.6150.d.fail: "[neighbor.GetTitledFirstNameNoTooltip] รู้สึกอื้อฉาว"
coronation_events.6150.e: ""รวบรวมสภาของข้า และรวมจิตใจของพวกเขาให้เป็นหนึ่งเดียว""

