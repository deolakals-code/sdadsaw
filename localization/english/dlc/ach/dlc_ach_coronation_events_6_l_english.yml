 coronation_events.6120.t: "คำปฏิญาณต่อ [host.GetFaith.BishopNeuterPlural|U]"
 coronation_events.6120.desc_cathedral: "กลิ่นกำยานอบอวลในอากาศ ขณะที่ขบวนแห่ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้าเคลื่อนเข้าสู่วิหาร"
 coronation_events.6120.desc_holy_site: "กลิ่นหอมศักดิ์สิทธิ์ลอยอวลในอากาศ ขณะที่ขบวนแห่ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้าเคลื่อนเข้าสู่ [ROOT.Char.GetFaith.HouseOfWorship]"
 coronation_events.6120.desc_generic_intro: "ผ่านประตู [host.Custom('ResidenceBuilding')] ขบวนแห่ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้าเคลื่อนขบวนไปยังแท่นบูชาศักดิ์สิทธิ์ ที่ ซึ่งมีผู้ประกอบพิธีรออยู่"
 coronation_events.6120.desc_low_magnificence: "เหล่าขุนนางและ [host.GetFaith.AltPriestTermPlural] ต่างเบียดเสียดและนินทาว่าร้ายกันขณะเข้าที่ เสียงสวดมนต์ศักดิ์สิทธิ์อันแผ่วเบาเพียงไม่กี่เสียงเปล่งออกมาอย่างยากลำบาก"
 coronation_events.6120.desc_high_magnificence: "เหล่าขุนนาง [host.GetFaith.AltPriestTermPlural] และข้าต่างเข้าประจำที่อย่างสงบเสงี่ยมท่ามกลางเสียงสวดมนต์ศักดิ์สิทธิ์อันปลุกเร้าจิตวิญญาณที่ดังขึ้นและแผ่วลง"
 coronation_events.6120.desc_generic_mid: "เหล่าขุนนางเปิดทางให้ [host.GetFaith.AltPriestTermPlural] เดินออกมา เสียงของพวกเขาเปล่งเป็นหนึ่งเดียวในบทสวดอันศักดิ์สิทธิ์"
 coronation_events.6120.desc_anointment: "\n\nบัดนี้ ถึงพิธีการยื่นคำร้องของ [host.GetFaith.BishopNeuterPlural] ขณะที่ [hof.GetTitledFirstNameRegnal] เฝ้ามองอย่างตั้งใจ"
 coronation_events.6120.desc: "\n\nบัดนี้ ถึงพิธีการยื่นคำร้องของ [host.GetFaith.BishopNeuterPlural]"
 coronation_events.6120.desc_low_clergy: "ข้าถูกดูแคลนโดยเหล่าทรราชผู้น้อยเหล่านี้ ผู้ ซึ่งส่งคำร้องขออันศักดิ์สิทธิ์ของพวกเขาราวกับเป็นคำสบประมาท\n\n"ผู้รับใช้แห่ง [ROOT.Char.GetFaith.HighGodName] เจ้าสำนึกในบาปมหันต์ของเจ้าหรือไม่? เจ้าจะปฏิญาณที่จะละทิ้งกิเลสทางโลกเพื่อปกป้อง [host.GetFaith.AltPriestTermPlural] อันเป็นที่รักของ [ROOT.Char.GetFaith.HighGodNamePossessive] หรือไม่?""
 coronation_events.6120.desc_high_clergy: "ข้าเป็นที่เคารพยำเกรงของเหล่าผู้ไกล่เกลี่ยต่อสิ่งศักดิ์สิทธิ์เหล่านี้ และพวกเขาได้วิงวอนด้วยความเคารพบูชาว่า:\n\n"มหา [host.GetTitleAsName] ท่านจะพิทักษ์ผู้มีศรัทธาและปกป้องสิทธิ์ของ [host.GetFaith.AltPriestTermPlural] แห่ง [ROOT.Char.GetFaith.HighGodNamePossessive] หรือไม่?""
 coronation_events.6120.desc_mid_clergy: "ข้าเป็นบุคคลที่ไม่แน่นอนสำหรับนักบวชเหล่านี้ และพวกเขาก็ส่งคำร้องขอตามธรรมเนียมด้วยความสนใจอย่างแท้จริง\n\n"ท่านจะพิทักษ์ผู้มีศรัทธาในฐานะ [ROOT.Char.GetTitleAsName] ของพวกเขาหรือไม่? ท่านจะรักษาสิทธิ์และอภิสิทธิ์ของ [host.GetFaith.AltPriestTermPlural] แห่ง [ROOT.Char.GetFaith.HighGodNamePossessive] หรือไม่?""
 coronation_events.6120.a: "#EMP "ข้าจะเป็นค้อนทุบตีผู้ไร้ศรัทธา!"#!"
 coronation_events.6120.a.flavor: "การสาบานด้วยความเกลียดชังอย่างที่สุดว่าจะกำจัดพวกนอกรีตและผู้ไม่เชื่อในพระเจ้าจะ ทำให้ [host.GetFaith.AltPriestTermPlural] พอใจ... และ ทำให้การครองราชย์ของข้าเริ่มต้นบนเส้นทางอันชอบธรรม!"
 coronation_events.6120.b: "บิดเบือนคำตอบตามธรรมเนียมให้เข้าข้างข้า"
 coronation_events.6120.b.flavor: "ช่างเป็นเส้นบางๆ ระหว่างการสัญญาว่าจะซื่อสัตย์ต่อ [ROOT.Char.GetFaith.PriestNeuterPlural] เหล่านี้... กับการวางอาณัติของข้าจาก [ROOT.Char.GetFaith.HighGodName] ให้อยู่เหนือพวกเขา..."
 coronation_denying_clergy_modifier: "ขูดรีดนักบวช"
 coronation_denying_clergy_modifier_desc: "แทนที่จะทำหน้าที่เป็นผู้รับใช้ศรัทธา ผู้ปกครองผู้นี้กลับใช้อำนาจครอบงำชนชั้นนักบวชและรายได้ของพวกเขา"
 coronation_events.6120.c_begrudging: "ข้าจะพูดถ้อยคำนั้น อย่างที่ข้าต้องทำ"
 coronation_events.6120.c_christian: ""ข้าจะปกป้องคริสตจักรศักดิ์สิทธิ์ของพระคริสต์""
 coronation_events.6120.c: ""ข้าจะปกป้องผู้ซื่อสัตย์ของ [ROOT.Char.GetFaith.HighGodNamePossessive]""
 coronation_swore_persecution_modifier: "คำปฏิญาณแห่งการข่มเหง"
 coronation_swore_persecution_modifier_desc: "ส่วนสำคัญในพิธีราชาภิเษกของผู้ปกครองผู้นี้คือคำสาบานอันดุร้ายที่ยากจะลืมเลือนว่าจะตามล่าผู้ไม่เชื่อในพระเจ้า"

 coronation_events.6121.t_kurultai: "คูรุลไท"
 coronation_events.6121.t: "การร้องขอของเหล่าขุนนาง"
 cultural_acceptance_favored_during_oath: "การแสดงความเคารพ ซึ่งกันและกันระหว่างการปฏิญาณตนในพิธีราชาภิเษก"
coronation_events.6121.desc_kurultai: "ไม่มีเสียงใดเพียงเสียงเดียวที่ร้องตะโกนตำแหน่ง [ROOT.Char.GetTitleAsNamePossessive] ต่อท้องฟ้าสีครามชั่วนิรันดร์! ไม่มีมือ #EMP เพียงข้างเดียว#! ที่ชูธงหางม้า! เหล่านายแห่งเผ่าทั้งปวง ที่มารวมกันใน [Glossary( 'คูรุลไต', 'KURULTAI_GLOSS' )] นี้ ต้องให้ความเห็นชอบต่อ [ROOT.Char.GetSheHe] ผู้ที่จะควบม้าของพวกเขาเข้าสู่สงคราม"
KURULTAI_GLOSS: "สภาของเหล่าจ้าวแห่งอาชา ซึ่งมารวมตัวกันเพื่อเลือกผู้ปกครองคนใหม่ท่ามกลางงานเลี้ยง การแข่งขันมวยปล้ำและยิงธนู บ่อยครั้งที่การทัพทางทหารครั้งใหญ่จะถูกวางแผนในโอกาสเหล่านี้"
coronation_events.6121.desc_byzantine: "เหล่าขุนนางออกมาถวายความเคารพต่อ [Glossary( 'ออโตครากตอร์', 'AUTOKRATOR_GLOSS')] ของพวกเขา หากเราอยู่ในสนามรบ และพวกเขาเป็นทหาร ข้าคงจะถูกยกขึ้นเหนือโล่ขัดเงาอันใหญ่ ที่นี่ พวกเขาเลื้อยคลานเข้ามาจุมพิตเข่าของข้า"
coronation_events.6121.desc_generic_intro: "เหล่าข้าหลวงแห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ออกมาแสดงความจงรักภักดี ทีละคนชูมือที่แบออก ทีละคนก้มลงจุมพิตแสดงความสวามิภักดิ์"
coronation_events.6121.desc_low_approval: "\n\nแต่... เหล่าข้าหลวงของข้าละเลยท่าทีแห่งความเคารพ บางคนพ่นเสียง "#EMP [ROOT.Char.GetFirstNameNicknamed] น่ะรึ? [vassal_2.Custom('CulturalCurse')|U]!"#! และขัดจังหวะถ้อยคำอันควร [vassal_1.GetTitledFirstNameNicknamed] จ้องมองข้าด้วยสายตาอาบยาพิษระหว่างกล่าวคำปฏิญาณ [vassal_2.GetTitledFirstNameNicknamed] กล้าพกอาวุธต่อหน้าข้า และแทบไม่กระซิบกระซาบเลย"
coronation_events.6121.desc_high_approval: "\n\nข้ายังไม่ได้เป็น [ROOT.Char.GetTitleAsNameNoTooltip] อย่างถูกต้องด้วยซ้ำ แต่ก็มีความจงรักภักดีในคำร้องขอเหล่านี้ที่สามารถสั่นคลอนหัวใจใดๆ ก็ได้ เสียงอันยิ่งใหญ่ของอาณาจักรสั่นเครือด้วยความรู้สึก และใบหน้าของพวกเขาก็เปล่งประกายด้วยความหวัง!"
coronation_events.6121.desc_mid_approval: "\n\nขณะที่พวกเขาเข้ามา ข้าครุ่นคิด... กับลมหายใจที่เอ่ยคำว่า "[ROOT.Char.GetTitleAsName]" ข้าไม่รู้สึกถึงความรักใคร่ หรือแม้ แต่ร่องรอยของความภักดี..."
coronation_events.6121.a: ""ผู้เห็นต่างเหล่านี้เป็นหุ่นเชิดของอำนาจต่างชาติ!""
coronation_events.6121.a.flavor: "คำพูดปลุกปั่นความกลัวของท่านจะไม่เหลือทางเลือกให้ผู้ไม่หวังดีนอกจากต้องละทิ้งพันธมิตรต่างชาติของพวกเขา"
coronation_events.6121.b: "ข้าต้องชื่นชมผู้ที่ยังใหม่ต่อธรรมเนียมเหล่านี้"
coronation_events.6121.b_flavor: "ข้าลุกขึ้น และให้เกียรติแก่เหล่าเจ้านายชนกลุ่มน้อยแห่งอาณาจักร!"
coronation_events.6121.c: "ผู้สนับสนุนของข้าอยู่กับข้า!"
coronation_events.6121.d: ""จงดูเถิด เหล่ากบฏ! #EMP พลังแห่ง [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ของเจ้า!#!""
coronation_events.6121.d_flavor: "[vassal_2.GetTitledFirstNameNoTooltip] ชักดาบของ [vassal_2.GetHerHis] ต่อหน้าข้า — #EMP ข้าจะทำให้ [vassal_2.GetHerHim] ต้องใช้มัน!#!"
coronation_events.6121.e_low: "พวกเขาเกลียดข้า แต่ก็หยุดข้าไม่ได้"
coronation_events.6121.e_high: "การยอมจำนนอย่างที่สุด ช่างเป็นภาพที่งดงาม"
coronation_events.6121.e_mid: "เหล่านี้คือข้าหลวงของข้า ป้อมปราการแห่งการปกครองของข้า"
coronation_events.6121_duel_tt: "#V ประลอง#! [vassal_2.GetShortUIName]\n@death_icon! #X การประลองนี้สู้จนตาย!#!\n[prowess|E] ของท่าน: [prowess_i]#V [host.GetProwess]#!\n[prowess|E] ของ [vassal_2.GetFirstNamePossessive]: [prowess_i]#V [vassal_2.GetProwess]#!"

coronation_events.6122.t: "การเรียกร้องต่อมวลชน"
coronation_events.6122.desc_intro_foreign: "บุคคลอาวุโสในหมู่ [host.Custom('GetLocalCommonerTermPlural')] แห่ง [location.GetTitle.GetNameNoTierPossessive] เป็นกลุ่มถัดไปที่เดินสับเปลี่ยนเข้ามา เป็นตัวแทนของไพร่ฟ้าข้าแผ่นดิน [host.GetPrimaryTitle.GetAdjective] ทั่วไปของข้าที่ไม่ได้มาด้วยตนเอง [host.GetFaith.BishopNeuter] ได้เตือนผู้อาวุโสที่หลังค่อมเหล่านี้ถึงอำนาจและสิทธิ์ขาดอันยิ่งใหญ่ของข้า และขอความเห็นชอบเชิงสัญลักษณ์จากพวกเขาในการที่ข้าจะก้าวขึ้นเป็น [ROOT.Char.GetTitleAsName] โดยชอบธรรม\n\n"
coronation_events.6122.desc_intro: "บุคคลอาวุโสในหมู่ [host.Custom('GetLocalCommonerTermPlural')] แห่ง [location.GetTitle.GetNameNoTierPossessive] เป็นกลุ่มถัดไปที่เดินสับเปลี่ยนเข้ามา ผู้ให้ความเห็นชอบจากสามัญชน [host.GetFaith.BishopNeuter] ได้เตือนผู้อาวุโสที่หลังค่อมเหล่านี้ถึงอำนาจและสิทธิ์ขาดอันยิ่งใหญ่ของข้า และถามว่าพวกเขาจะยอมรับข้าเป็น [ROOT.Char.GetTitleAsName] โดยชอบธรรมหรือไม่\n\n"
coronation_events.6122.desc_high_approval_christian: "ขณะที่พวกเขาเปล่งถ้อยคำตามธรรมเนียม เสียงอื่นก็ดังเข้าหูข้า นอก [ROOT.Char.GetFaith.HouseOfWorship] ออกไป ฝูงชนที่รอคอยกำลังร้องเพลง [Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )] ในนามของข้า ด้วยเสียงอันยิ่งใหญ่ที่ดังกระหึ่ม วิญญาณหลายร้อยดวงกำลังสวดภาวนาเพื่อข้า!"
coronation_events.6122.desc_high_approval: "ขณะที่พวกเขาเปล่งถ้อยคำ เสียงอื่นก็ดังเข้าหูข้า นอก [ROOT.Char.GetFaith.HouseOfWorship] ออกไป ฝูงชนที่รอคอยต่างโห่ร้องด้วยความยินดีปรีดา ผู้คนหลายร้อยเรียกชื่อข้าซ้ำแล้วซ้ำเล่า:\n\n"#EMP [ROOT.Char.GetFirstName]! [ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!#!""
coronation_events.6122.desc_low_approval: "พวกเขาเปล่งถ้อยคำด้วยเสียงสั่นเครือ ภายใต้เสียงคำรามที่ดังขึ้นเรื่อยๆ นอก [ROOT.Char.GetFaith.HouseOfWorship] ออกไป เหล่าคนจนผู้มอมแมมแห่ง [location.GetTitle.GetNameNoTier] ต่างโห่ร้อง: ช่างเป็นเสียงที่น่าสะพรึงกลัว! มีบางอย่างรบกวนพวกเขา การทะเลาะวิวาทไร้สติ ความขัดแย้งในท้องถิ่น... หรือบางที อาจเป็น [ROOT.Char.GetTitleAsNameNoTooltip] คนใหม่ที่พวกเขาชิงชัง"
coronation_events.6122.desc_mid_approval: "พวกเขาเปล่งถ้อยคำตามธรรมเนียมได้ดีพอสมควร และข้าก็สัญญาว่าจะให้ความคุ้มครองเป็นการตอบแทน — เพราะอาณัติของข้าขยายไปไกลกว่า [ROOT.Char.GetFaith.PriestNeuterPlural] และขุนนางผู้สูงศักดิ์ และบ้านของข้า ท่ามกลาง [capital_p.Custom('TerrainTypeProvince')] แห่ง [capital_p.GetTitle.GetNameNoTierPossessive] ก็มีสามัญชนชาว [capital_p.GetCulture.GetName] อาศัยอยู่มากมาย"
coronation_events.6122.a: "ขอให้ผู้ที่อยู่ที่นี่อย่าได้ลืมเลือนวันนี้เลย!"
coronation_events.6122.a.flavor: "ผู้คนที่จงรักภักดีเหล่านี้สมควรได้รับการปรากฏตัวของข้า! และขนมปังจาก [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเขา!"
coronation_events.6122.b: "พอได้แล้วกับการต่อต้าน ทุกคนที่พูดออกมาต้องถูกทุบตี"
coronation_events.6122.b.flavor: "ขอให้ม็อบที่ส่งเสียงดังนี้ และทุกคนในแผ่นดิน ได้เจอกับรองเท้าบู๊ตของ [host.Custom('GetFighterTermPossessive')]!"
coronation_events.6122.c_low: "แต่ข้าปกครองอยู่เหนือพวกเขาทั้งหมด"
coronation_events.6122.c_high: "พวกเขาช่าง #EMP อ้อนวอน#! ให้ข้าปกครองเสียนี่กระไร!"
coronation_events.6122.c_mid: "ข้าเป็นเกียรติอย่างยิ่ง"
coronation_events.6122.c_v_low_humble: "ชะตากรรมของชาวบ้านตาดำๆ ทำให้ข้าสะเทือนใจ"
coronation_events.6122.c_v_low: "พวกไพร่ชั้นต่ำสกปรก"

 coronation_events.6123.t: "สามความเห็นชอบ"
 coronation_events.6123.desc_intro: "จนกว่า [host.GetFaith.BishopNeuterPlural] ขุนนาง [host.GetPrimaryTitle.GetAdjective] และสามัญชนจะได้ทำหน้าที่ตามธรรมเนียมของตน [host.GetFirstName] ก็ยังไม่ใช่ [host.GetTitleAsNameNoTooltip|l] ที่แท้จริง การปกครองของ [host.GetHerHis|U] จะไม่ยุติธรรมหากปราศจากการยอมรับจากพวกเขา\n\nเริ่มแรก เหล่า [ROOT.Char.GetFaith.PriestNeuterPlural]"

 coronation_events.6123.desc_low_clergy: "พวกเขาเชิดคางอย่างหน้าซื่อใจคด บังคับให้ [host.GetTitleAsNameNoTooltip|l] ไม่เพียง แต่ต้องสาบานว่าจะพิทักษ์ผู้ศรัทธาชาว [host.GetFaith.GetAdherentName] แต่ยังต้องสำนึกในบาปของ [host.GetHerHis] ด้วย"
 coronation_events.6123.desc_high_clergy: "พวกเขาชื่นชมความรักอันยิ่งใหญ่ของ [host.GetTitleAsNamePossessiveNoTooltip|l] ผู้เปี่ยมศรัทธา ในการพิทักษ์ [host.GetFaith.GetAdherentNamePlural] อย่างชื่นชม และขอให้ [host.GetSheHe] กลายเป็นผู้ชนะเลิศอันยิ่งใหญ่ของพวกเขา"
 coronation_events.6123.desc_mid_clergy: "พวกเขาเรียกร้องให้ [host.GetTitleAsNameNoTooltip|l] เคารพสิทธิ์อันศักดิ์สิทธิ์ของพวกเขา และปกป้องผู้มีศรัทธา [host.GetFirstNameNoTooltip] ก็ยินยอม"

coronation_events.6123.desc_then: "จากนั้น"
coronation_events.6123.desc_pop_foreign: "[host.Custom('GetLocalCommonerTermPlural')] ในท้องถิ่นก็เป็นตัวแทนของสามัญชนชาว [host.GetPrimaryTitle.GetAdjective] และ"
 coronation_events.6123.desc_low_populace: "ผู้อาวุโสแห่ง [location.GetTitle.GetBaseNameNoTier] ออกมา ตัวสั่นด้วยความกลัว ขณะที่การจลาจลโหมกระหน่ำอยู่นอก [ROOT.Char.GetFaith.HouseOfWorship] ฝูงชนที่นี่ไม่มีความรักให้ [host.GetTitleAsNameNoTooltip|l] เลย\n\n"
 coronation_events.6123.desc_high_populace: "ผู้อาวุโสแห่ง [location.GetTitle.GetBaseNameNoTier] จ้องมอง [host.GetTitleAsNameNoTooltip|l] ด้วยความยำเกรง ขณะที่มวลชนภายนอกสรรเสริญพระนาม [host.Custom('GetTitleTierAdjective')] ของ [host.GetHerHis]\n\n"
 coronation_events.6123.desc_mid_populace: "ผู้อาวุโสแห่ง [location.GetTitle.GetBaseNameNoTier] เปล่งเสียงแหบพร่าแสดงการยอมรับเชิงสัญลักษณ์ และ [host.GetTitleAsNameNoTooltip|l] ก็สัญญาว่าจะมอบความรักดั่ง [host.Custom('GetMaternalPaternal')] ให้แก่ประชาชนชั้นล่าง\n\n"

 coronation_events.6123.desc_low_vassals: "เหล่าข้าหลวงของ [host.GetFirstNamePossessiveNoTooltip] เดินย่างสามขุมเข้ามาอย่างมืดมน ส่วนใหญ่แทบไม่สนใจที่จะกล่าวถ้อยคำแห่งความภักดี ท่ามกลางท่าทีแห่งความเกลียดชัง"
 coronation_events.6123.desc_high_vassals: "เหล่าข้าหลวงของ [host.GetFirstNamePossessiveNoTooltip] ก้าวออกมาเพื่อร้องขอ: ส่วนใหญ่เปล่งประกายด้วยความหวัง และสาบานความภักดีและความรักอย่างจริงใจ"
 coronation_events.6123.desc_mid_vassals: "เหล่าข้าหลวงของ [host.GetFirstNamePossessiveNoTooltip] ก้าวไปข้างหน้าเพื่อจุมพิตและสาบานความสวามิภักดิ์ บางคนให้เกียรติการกระทำนี้อย่างสูงส่ง; บ้างก็พึมพำอย่างเศร้าสร้อยและไม่ละสายตาจากผงธุลี"

 coronation_events.6123.desc_end_vassal: "ในที่สุด ก็ถึง... ตาข้า"
coronation_events.6123.desc_end_spectator: "พิธีดำเนินต่อไป... และต่อไป"
 coronation_events.6123.a: "ข้าตะโกนคำปฏิญาณของข้า #EMP ด้วยความภักดีอย่างที่สุด!#!"
 coronation_events.6123.a_flavor: "เปล่งเสียงของท่านเถิด สหายของข้า! โห่ร้องพระนามอันรุ่งโรจน์ของ [host.GetTitleAsNamePossessiveNoTooltip|l] องค์ใหม่ของเรา!"
 coronation_events.6123.b: "ข้าจะสร้างเรื่องอื้อฉาวด้วยการดูถูกเหยียดหยาม"
 coronation_events.6123.b_flavor: "พิธีเล็กๆ ของ [host.GetFirstNamePossessiveNoTooltip] เรียกร้องให้ข้ายอมจำนนรึ? ข้าขอสร้างความตื่นตะลึงให้ผู้สนับสนุนที่น่าสังเวชของเขา และถ่มน้ำลายใส่หน้า [host.GetHerHis] ดีกว่า!"
 coronation_events.6123.c_vassal_resents: "ข้าพึมพำอะไรก็ตามที่เป็นธรรมเนียม"
 coronation_events.6123.c_vassal_pleased: "ข้าคุกเข่าให้ [host.GetFirstNameNoTooltipRegnal] [host.GetTitleAsNameNoTooltip] ที่แท้จริง"
 coronation_events.6123.c_vassal_neutral: "ข้าคุกเข่าต่อหน้า [host.GetTitleAsNameNoTooltip] ของข้า"
 coronation_events.6123.c_likes_disrespect: "ข้าหลวงของ [host.GetFirstNamePossessiveNoTooltip] มองเห็นทะลุละครตบตานี้..."
 coronation_events.6123.c_dislikes_disrespect: "[host.GetTitleAsNameNoTooltip] ของพวกเขาสมควรได้รับสิ่งที่ดีกว่านี้!"
 coronation_events.6123.c_dislikes_loyalty: "หนอน [host.GetPrimaryTitle.GetAdjectiveNoTooltip] พวกนี้สมควรอยู่บนพื้นดิน..."
 coronation_events.6123.c_likes_loyalty: "หลักฐานแห่งเกียรติยศของพวกเขา และคุณธรรมของ [host.GetFirstNamePossessiveNoTooltip]"
