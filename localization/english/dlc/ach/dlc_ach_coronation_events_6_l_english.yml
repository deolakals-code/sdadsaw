coronation_events.6001.t: "เสียงของเราและยุคสมัย"
coronation_events.6001.desc: "#EMP "ผู้เป็นหนึ่งในหมู่หัวหน้าเผ่า! [ROOT.Char.GetTitleAsName] ด้วยสัตย์สาบานอันศักดิ์สิทธิ์และการแซ่ซ้องของเหล่าเผ่า!"#!\n\n[loyal_vassal.GetTitledFirstName] ตวัดดาบของ [loyal_vassal.GetHerHis] มาทางข้า มือวางบนหัวใจ [loyal_vassal.GetSheHe|U] หยุดตะโกน และกล่าวคำมั่นอันหนักแน่น\n\n"เราไม่รู้จัก [old_de_jure.GetBaseName] ใน [loyal_vassal.GetPrimaryTitle.GetBaseNameNoTier]: เรารัก [ROOT.Char.GetPrimaryTitle.GetName] และผู้คนของข้าขอสาบานว่าจะให้เกียรติมันตลอดไป! #EMP ตลอดไป!#!""
coronation_events.6001.a: ""จงฟังข้าให้ดี ข้าจะสร้างอนาคตให้พวกเรา""
coronation_events.6001.b: ""ภราดรภาพนี้ต้องคงอยู่สืบไป!""
coronation_events.6001.c: "และช่วย 'สมาพันธรัฐ' อันน่าขันของเราให้อยู่รอด...? ไม่"
coronation_events.6001.c.flavor: "ไม่ ในเมื่อข้าสามารถเป็น [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริง ดั่ง เช่นในอดีต..."

coronation_events.6010.t: "[host.GetSheHe|U] ผู้พิทักษ์"
coronation_events.6010.desc: "ชุมชนบริเวณชานเมือง [location.GetTitle.GetBaseNameNoTier] กำลังลุกไหม้\n\n"พวกปล้นสะดม" [host.Custom('KnightCultureNoTooltipLowercase')] ชาว [host.GetPrimaryTitle.GetAdjective] อธิบาย "พวกนอกคอกจากเผ่า [assailer.GetTitleAsName] แห่ง [assailer.GetPrimaryTitle.GetNameNoTier] ส่งพวกมันมาที่นี่ จ่ายเงินให้พวกเดนมนุษย์มาดูแคลน [host.GetTitleAsName] แห่งสมาพันธรัฐของเรา"\n\n"[host.GetTitledFirstNameNoTooltip] ขึ้นครองบัลลังก์ #EMP เพียงลำพัง#!," หัวหน้าเผ่าคนหนึ่งพึมพำ "ข้าเกรงว่า เราจะโหยหาวันที่ผู้คนของเราร่วมกันเผชิญหน้ากับความชั่วร้าย...""
coronation_events.6010.a: "#EMP "นักรบของข้ายังคงต่อสู้เพื่อเราทุกคน!"#!""
coronation_events.6010.b: ""บัลลังก์ของเรามิใช่สิ่งศักดิ์สิทธิ์...""
coronation_events.6010.b.flavor: "...และการอ้างสิทธิ์ในบัลลังก์ก็มิใช่ความอยุติธรรมอันใด"
coronation_events.6010.c: ""หาก #EMP ข้า#! ได้รับการรับฟัง ความอัปยศเหล่านี้คงจบสิ้น!""
coronation_events.6010.d: "เราทุกคนควรสาบานตนเฝ้าระวังดั่ง เช่นกาลก่อน"

