coronation_events.6000.t: "การรวมตัวของสมาพันธรัฐ"
coronation_events.6000.desc: "หยาดน้ำตาเปล่งประกายในดวงตาของเหล่าผู้นำเผ่าสหายข้า — น้ำตาแห่งความปีติและเสียงหัวเราะ!\n\nในหมู่พวกเรา [host.GetFirstName] ผู้เป็น[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))]ของข้า ยืนอยู่อย่างถ่อมตน มิได้ชูคอเหนือผู้ใดดั่งจักรพรรดิต่างแดนผู้เย็นชา [host.GetTitleAsName]ของเราหยอกล้อกับม้าของ[other_vassal.GetFirstNamePossessiveNoTooltip] จนกระทั่งสัตว์ตัวนั้นงับเข้าที่นิ้วของ[host.GetHerHim] และเหล่าขุนนางอย่างพวกเราก็พากันหัวเราะร่วนอย่างเสรี!\n\nเราอาจมิได้ยืนหยัดในแนวรบเยี่ยงผู้ทัดเทียมกันอย่างแท้จริงอีกต่อไป แต่... เรายังคงเป็น [host.GetPrimaryTitle.GetDefinitiveName] และวันนี้นั้นเป็นของเรา"
 coronation_events.6000.a: ""ข้าขอสาบาน ณ บัดนี้ — #EMP สมาพันธรัฐจงเจริญ ตลอดไป!#!""
 coronation_events.6000.a.flavor: "อย่าให้ช่วงเวลานี้เป็นปีแห่งความเสื่อมโทรมของ [host.GetPrimaryTitle.GetNameNoTooltip]! แต่จงเป็นการกำเนิดใหม่อย่างแท้จริง!"
 coronation_events.6000.b: ""มาเถิด ครอบครัวข้า: จงไปทำความรู้จักกับญาติร่วมสาบานของเจ้า!""
 coronation_events.6000.b.flavor: "ด้วยเสียงหัวเราะของเหล่านักรบและรอยยิ้มของเหล่าสตรี ครอบครัวของข้าจะจุดประกายงานเลี้ยงราชาภิเษกนี้"
 coronation_events.6000.c: "เวลาอาจผันแปร แต่เราทั้งผองยังคงเป็นหนึ่งเดียว"
