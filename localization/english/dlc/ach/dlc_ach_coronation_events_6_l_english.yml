coronation_events.6110.desc_old_artifact: "\n\n[crowning_artifact.GetName] อันวิจิตรและงดงามนี้ จะถูกมอบให้แก่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ตลอดไปหรือไม่? ในเมื่อเรามีเครื่องทรงแห่งอธิปไตยอยู่แล้ว: [old_title_artifact.GetName]?"
coronation_events.6110.desc_no_old_artifact: "\n\nด้วยพิธีนี้ [crowning_artifact.GetName] อันเป็นที่รักของข้า จะถูกมอบให้แก่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ตลอดไปหรือไม่?"
coronation_events.6110.desc_no_old_artifact_plural: "\n\n[crowning_artifact.GetName] อันเป็นที่รักของข้า จะถูกมอบให้แก่ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ตลอดไปหรือไม่? หรือบางที อาจเป็น [crowning_artifact_2.GetName]...?"
coronation_events.6110.a: "#EMP โอ้ [crowning_artifact.GetNameNoTooltip] — โอ้ ความรุ่งโรจน์แห่งความรุ่งโรจน์!#!"
