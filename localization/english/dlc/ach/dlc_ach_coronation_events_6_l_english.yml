coronation_house_candidates_log: "[house|E] [root_scope.GetHouse.GetName] สร้างความประทับใจให้ทุกคน และทายาทของตระกูลได้รับ #P 20#! [candidate_score|E] ของ [GetLaw('confederation_elective_succession_law').GetName] เป็นเวลา #high 10 ปี#!"
