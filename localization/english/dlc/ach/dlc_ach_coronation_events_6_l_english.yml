coronation_events.6011.t: "อุดมการณ์ร่วมกัน"
coronation_events.6011.desc: ""[assailer.GetName] นำเพลิงผลาญมาเยือน! เพื่อเหยียดหยามพิธีสวมมงกุฎของท่าน เพื่อนบ้านโสมมของเราได้ส่งผู้ปล้นสะดมเดินทางมาแต่ไกล!" [loyal_vassal.GetName] ผู้เป็น[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))]ของข้า ร้องตะโกน หลังจากนำข้ามายังสถานที่แห่งการสบประมาทของ[assailer.GetTitledFirstNamePossessiveNoTooltip]นี้\n\nเพิงพักซอมซ่อเพียงหยิบมือภายนอก [location.GetName] คือทั้งหมดที่กำลังลุกไหม้ ทว่า[loyal_vassal.GetTitledFirstNameNoTooltip]กลับสั่นสะท้านด้วยความเคียดแค้น\n\n"[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ยังคง #EMP มีความหมายเสมอ#!" [loyal_vassal.GetSheHe] สบถสาบาน "และข้ายังคงพร้อมเสมอที่จะปกป้องมัน! โปรดรับคำสัตย์แห่งนักรบของข้า! พวกสวะ[assailer.GetPrimaryTitle.GetAdjective] — และผู้ใดก็ตาม — จะต้องเผชิญหน้ากับกองรบของข้า หากพวกมันกล้ามาทำให้ดินแดนของเราต้องแปดเปื้อน!""
coronation_events.6011.a: ""วางอาวุธของเจ้าลง จงศรัทธาในสันติสุขของ [ROOT.Char.GetFaith.HighGodNamePossessive]""
coronation_events.6011.a.flavor: "สมาพันธรัฐของเราได้สะสมเสบียงไว้พร้อมรบ... แทนที่จะทำ เช่นนั้น เราสามารถเติมเต็ม [ROOT.Char.GetFaith.HouseOfWorshipPlural] ด้วยเครื่องสังเวย"
coronation_events.6011.b: ""ทั้งเด็กและผู้ใหญ่: อย่าให้นักรบคนใดอยู่เฉย""
coronation_events.6011.b.flavor: "ในบ้านของเรา เหล่าเยาวชนผู้กระตือรือร้นมิได้ใฝ่ฝันถึงสงครามและการผจญภัยดอกหรือ? ให้เรารวบรวมพวกเขาเข้าด้วยกัน เพื่อที่วันหนึ่งเราจะได้เรียกพวกเขาเข้าสู่สมรภูมิ!"
coronation_events.6011.c: ""จงสู้กับข้า ผู้กล้าแกร่งที่สุดแห่ง [loyal_vassal.GetCulture.GetCollectiveNounNoTooltip]!""
coronation_events.6011.d_house: ""[ROOT.Char.GetHouse.GetName|U] พิทักษ์อาณาจักรนี้""
coronation_events.6011.d: ""พักผ่อนเถอะ การเฝ้าระวังเป็นหน้าที่ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] เจ้า""

