coronation_events.6140.c_flavor: "กิจการ [ROOT.Char.GetPrimaryTitle.GetAdjective] ย่อมต้องใช้เวลาของข้าไปมาก แต่การได้เป็นคู่สมรส [host.Custom('GetTitleTierAdjective')] แห่ง [host.GetPrimaryTitle.GetNameNoTier]... นั่นก็เป็นเรื่องสำคัญ"
