coronation_events.6140.t: "คู่สมรสของ [host.GetTitleAsNamePossessiveNoTooltip]"
# Spouse is root
coronation_events.6140_desc_intro_spouse: "เมื่อพิธีกรรมการขึ้นครองบัลลังก์ของ [host.GetTitleAsNamePossessive] เสร็จสิ้น คู่สมรส [host.Custom('GetTitleTierAdjective')] ก็จะต้องได้รับการสถาปนาอย่างถูกต้อง\n\n"
coronation_events.6140_desc_polygamous_spouse: "เมื่อพิธีกรรมการขึ้นครองบัลลังก์ของ [host.GetTitleAsNamePossessive] เสร็จสิ้น คู่สมรสอาวุโสสูงสุดในบรรดาคู่สมรส [host.Custom('GetTitleTierAdjective')] ก็จะต้องได้รับการสถาปนาอย่างถูกต้อง\n\n"
coronation_events.6140_desc_spouse: "ขณะที่ [spouse.Custom2('RelationToMe', SCOPE.sC('host'))] ของข้ามองดู ข้าก็ถูกนำเข้าสู่พิธีกรรม [host.GetPrimaryTitle.GetAdjective]"
coronation_events.6140_desc_foreign_wife_no_court_spouse: "การเลี้ยงดูแบบ [spouse.GetCulture.GetName] ของข้า ไม่ได้เตรียมข้าให้พร้อมสำหรับพิธีกรรม [host.GetCulture.GetName] อันแปลกประหลาดท่ามกลางคำสวดภาวนา [host.GetFaith.GetAdjective]... ข้าพูดภาษา [host.GetCulture.GetLanguage.GetName] ไม่ได้ และต้องท่องคำสาบานจากความทรงจำเกี่ยวกับเสียงของมันเท่านั้น"
coronation_events.6140_desc_foreign_wife_spouse: "การเลี้ยงดูแบบ [spouse.GetCulture.GetName] ของข้า ไม่ได้เตรียมข้าให้พร้อมสำหรับพิธีกรรม [host.GetCulture.GetName] อันแปลกประหลาดท่ามกลางคำสวดภาวนา [host.GetFaith.GetAdjective]... ข้าพูดภาษา [host.GetCourtLanguage.GetName] ไม่ได้ และต้องท่องคำสาบานจากความทรงจำเกี่ยวกับเสียงของมันเท่านั้น"
coronation_events.6140_desc_lowly_wife_spouse: "พวกเรา สมาชิกผู้ถ่อมตนแห่ง [spouse.GetHouse.GetName] แทบจะไม่เคยได้เป็นสักขีพยานในกระบวนการอันสูงส่ง เช่นนี้ คำปฏิญาณตนที่คลุมเครือต่อ [host.GetFaith.random_GoodGodNames] ที่ข้าต้องให้ พิสูจน์แล้วว่าเป็นความท้าทายอยู่บ้าง..."
coronation_events.6140_desc_regal_wife_spouse: "ข้ามาจากเชื้อสายอันรุ่งโรจน์: พวกเรา [spouse.Custom('GetDaughterSon')] แห่ง [spouse.GetHouse.GetName] คือปรมาจารย์ด้านพิธีการ และข้าก็วางตนด้วยความเคร่งขรึมและสง่างาม"
coronation_events.6140_desc_mid_wife_spouse: "ข้ากล่าวถ้อยคำตามธรรมเนียม และกล่าวถ้อยคำอย่างหรูหราถึง [host.GetFirstNameNoTooltip], [host.GetFaith.HighGodName] และหน้าที่ของข้าต่ออาณาจักรของ [spouse.Custom2('RelationToMePossessive', SCOPE.sC('host'))]"
coronation_events.6140_desc_crown_spouse: "\n\nอีกไม่นาน — และด้วยพิธีอันยิ่งใหญ่ — มงกุฎที่คู่ควรกับ [spouse.Custom('WifeHusband')] [host.Custom('GetTitleTierAdjective')] ของ [host.GetFirstNamePossessiveNoTooltip] ก็ถูกสวมลงบนศีรษะของข้า [host.GetPrimaryTitle.GetName|U] โห่ร้องยินดีแก่เราขณะที่เรานั่งบัลลังก์คู่กัน"
coronation_events.6140_desc_neutral_spouse: "\n\nอีกไม่นาน — และด้วยพิธีอันยิ่งใหญ่ — ข้าถูกนำไปยังสถานที่อันทรงเกียรติเคียงข้าง [host.GetFirstNamePossessiveNoTooltip] และข้าก็นั่งบัลลังก์ในฐานะ [spouse.Custom('WifeHusband')] [host.Custom('GetTitleTierAdjective')] ของ [host.GetHerHis]"
# For everyone else
coronation_events.6140_desc: "เมื่อพิธีกรรมการขึ้นครองบัลลังก์ของ [host.GetTitleAsNamePossessive] เสร็จสิ้น คู่สมรส [host.Custom('GetTitleTierAdjective')] ก็จะได้รับการสถาปนาอย่างถูกต้องในฐานะ [spouse.GetTitleAsName]\n\n"
coronation_events.6140_desc_polygamous: "เมื่อพิธีกรรมการขึ้นครองบัลลังก์ของ [host.GetTitleAsNamePossessive] เสร็จสิ้น คู่สมรสอาวุโสสูงสุดในบรรดาคู่สมรส [host.Custom('GetTitleTierAdjective')] ก็จะได้รับการสถาปนาอย่างถูกต้องในฐานะ [spouse.GetTitleAsName]\n\n"
coronation_events.6140_desc_guest: "[spouse.Custom('WifeHusband')] ของ [host.GetTitledFirstNamePossessiveRegnal] ประกอบพิธีกรรมด้วย [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)] อันเป็นเอกลักษณ์"
coronation_events.6140_desc_host: "[host.Custom2('RelationToMe', SCOPE.sC('spouse'))] ของข้า ประกอบพิธีกรรมด้วย [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)] อันเป็นลักษณะเฉพาะของ [spouse.GetHerHis]"
coronation_events.6140_desc_foreign_wife_no_court: "การเลี้ยงดูแบบ [spouse.GetCulture.GetName] ของ [spouse.GetHerHis|U] แทบไม่ได้เตรียม [spouse.GetHerHim] ให้พร้อมสำหรับพิธีกรรม [host.GetCulture.GetName] ท่ามกลางคำสวดภาวนา [host.GetFaith.GetAdjective]: [spouse.GetSheHe] ท่องคำสาบานภาษา [host.GetCulture.GetLanguage.GetName] จากความทรงจำเกี่ยวกับเสียงของมันเท่านั้น"
coronation_events.6140_desc_foreign_wife: "การเลี้ยงดูแบบ [spouse.GetCulture.GetName] ของ [spouse.GetHerHis|U] แทบไม่ได้เตรียม [spouse.GetHerHim] ให้พร้อมสำหรับพิธีกรรม [host.GetCulture.GetName] ท่ามกลางคำสวดภาวนา [host.GetFaith.GetAdjective]: [spouse.GetSheHe] ท่องคำสาบานภาษา [host.GetCourtLanguage.GetName] จากความทรงจำเกี่ยวกับเสียงของมันเท่านั้น"
coronation_events.6140_desc_lowly_wife: "ชาติกำเนิดอันต่ำต้อยของ [spouse.GetHerHis|U] ถูกเผยออกมาบ้าง เมื่อ [spouse.GetFirstName] ตะกุกตะกักกับคำปฏิญาณตนที่คลุมเครือต่อ [host.GetFaith.random_GoodGodNames]..."
coronation_events.6140_desc_regal_wife: "เป็นเครื่องพิสูจน์ถึงเชื้อสายอันรุ่งโรจน์ของ [spouse.GetHerHis] [spouse.GetFirstName] ลุกขึ้นกล่าวคำปฏิญาณของ [spouse.GetHerHis] ด้วยความเคร่งขรึมและสง่างาม"
coronation_events.6140_desc_mid_wife: "ในฐานะ [spouse.Custom('DaughterSon')] แห่ง [spouse.GetHouse.GetName] ถ้อยคำที่ [spouse.GetFirstNamePossessive] กล่าวออกมา [host.Custom2('QuirkAdverbPosOrNeg', spouse.MakeScope.Char)] แสดงให้เห็นถึงภูมิหลัง [spouse.GetCulture.GetName] อันสูงศักดิ์ของ [spouse.GetHerHis]"
coronation_events.6140_desc_crown: "\n\nในไม่ช้า — และด้วยพระราชพิธีอันยิ่งใหญ่ — มงกุฎของ[spouse.GetFirstNamePossessiveNoTooltip]ก็ถูกสวมลงบนศีรษะของ[spouse.GetHerHis]เป็นครั้งแรก [host.GetPrimaryTitle.GetDefinitiveName|U] แซ่ซ้องสรรเสริญ[spouse.GetTitleAsNameNoTooltip]ของพวกเขา"
coronation_events.6140_desc_neutral: "\n\nอีกไม่นาน — และด้วยพิธีการอันยิ่งใหญ่ — [spouse.GetFirstNameNoTooltip] ก็ถูกนำตัวไปยังที่อันทรงเกียรติของ[spouse.GetHerHis]เคียงข้างข้า, และ [spouse.GetSheHe] ก็ขึ้นครองบัลลังก์ในฐานะ [spouse.GetTitleAsNameNoTooltip] แห่ง [host.GetPrimaryTitle.GetNameNoTier]"
coronation_events.6140.a_like: "น่าเศร้า ข้าต้องกำจัด [spouse.GetWomanMan] [spouse.Custom('ComplimentAdjective')] ผู้นี้..."
coronation_events.6140.a_dislike: "ข้า #EMP ต้อง#! กำจัด [spouse.GetWomanMan] [spouse.Custom('InsultAdjective')] ผู้นี้..."
