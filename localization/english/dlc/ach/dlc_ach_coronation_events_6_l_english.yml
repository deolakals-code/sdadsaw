coronation_events.6140.aa_fail: "[spouse.GetSheHe|U] ทนทุกข์กับพิธีกรรมนอกรีตเพื่อท่าน"
coronation_events.6140.aa.flavor: "[spouse.GetFirstNameNoTooltip] มองไม่เห็นหรือว่า ด้วยหัตถ์อันศักดิ์สิทธิ์ของ [anointer.GetTitledFirstNamePossessiveNoTooltipRegnal] เอง พิธีนี้ได้ยอมรับ [spouse.GetHerHim] ว่าเป็นหนึ่งในผู้ศรัทธา [host.GetFaith.GetAdjectiveNoTooltip] แล้ว? [spouse.GetWifeHusband]  ของข้าควรยอมรับการเปลี่ยนศาสนาของ [spouse.GetHerHis]!"
anointment_available_because_magnificence_tt: "#EMP #low ตัวเลือกนี้มีให้ เนื่องจาก [coronation_magnificence|E] ของ [anointment|E] ของท่าน"

ach_yearly_crown_name: "มงกุฎราชกกุธภัณฑ์ของ [owner.GetFirstNamePossessiveNoTooltipRegnal]"
ach_yearly_crown_desc: "ได้รับมอบหมายอย่างเร่งรีบโดย [owner.GetName] เพื่อใช้ในพิธีราชาภิเษก [owner.Custom('GetTitleTierAdjective')] ของ [owner.GetHerHis] มงกุฎพิธีการนี้มีสัญลักษณ์ [owner.GetCulture.GetName] อันโดดเด่น — อันเป็นแบบฉบับของช่างฝีมือแห่ง [owner.GetCapitalLocation.GetName] — ท่ามกลางอัญมณีอันสมถะ"
ach_yearly_regalia_name: "เครื่องราชกกุธภัณฑ์ราชาภิเษกของ [owner.GetFirstNamePossessiveNoTooltipRegnal]"
ach_yearly_regalia_desc: "จัดหาโดยครัวเรือน [owner.Custom('GetTitleTierAdjective')] ก่อนพิธีราชาภิเษกของ [owner.GetNamePossessive] เครื่องราชกกุธภัณฑ์นี้อ้างถึงความซื่อสัตย์ [owner.GetFaith.GetAdjective] ต่อ [owner.GetFaith.random_GoodGodNames] และอำนาจบัญชาอันสูงส่งเหนือชาว [owner.GetCulture.GetName] ในระดับที่เท่าเทียมกัน"

coronation_events.6150.t: "ผู้ไกล่เกลี่ยของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
coronation_events.6150.desc: ""โอ้ [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitleAsName] ใบหน้าของท่านคือสิ่งที่ทุกคนจับจ้อง เสียงของท่านคือเสียงแห่งพิธีศักดิ์สิทธิ์นี้!" [advisor.GetTitledFirstName] [advisor.GetCouncilTitle] ของข้า กล่าวเยินยอ "เหล่าประมุขผู้ยิ่งใหญ่และ [ROOT.Char.Custom('GetLowOfficialPlural')] มากมายได้มาพิจารณารัชสมัยของท่าน... และจุดยืนของพวกเขาต่อหน้า [ROOT.Char.GetTitleAsNameNoTooltip] องค์ใหม่แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]"\n\n"ขณะที่ท่านกำลังยุ่งอยู่กับถ้อยคำทางการ กับกิจธุระทางการ... #EMP ข้า#! ว่างที่จะทำงานในมุมเงียบๆ และโน้มน้าวเจตจำนงของท่านต่อคน เช่น... [neighbor.GetName] หรือไม่?""
coronation_events.6150.a: ""วิงวอนขอความภักดีของ [disobedient_vassal.GetFirstNamePossessiveNoTooltip] ในนามของข้า""
coronation_events.6150.a.flavor: "ข่าวคราวการวิงวอนของข้าจะแพร่สะพัด ถึงความอบอุ่นและความอ่อนโยนที่สัญญาไว้จากใจข้า... แต่ สาบานต่อ [ROOT.Char.GetFaith.HighGodName] ข้าจะต้องได้ความนอบน้อมของ [disobedient_vassal.GetFirstNamePossessiveNoTooltip]!"
coronation_events.6150.b: ""พาท่านผู้มาเยือนคนสำคัญของเราทัวร์อย่างไม่เป็นทางการ!""
coronation_events.6150.b.flavor: "การปรากฏตัวของบุคคลสำคัญผู้ทรงอำนาจจะ ทำให้ [location.GetNameNoTooltip] ทั้งหมดตื่นเต้น! พาพวกเขาไปชมสมบัติ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้า และขอให้ความทรงจำถึงความเคารพยำเกรงอันสูงส่งของพวกเขาไม่ถูกลืมเลือน!"
coronation_tour_of_notables_modifier: "ได้รับเกียรติจากผู้มีอำนาจ"
coronation_tour_of_notables_modifier_desc: "ความทรงจำยังคงสดใหม่ถึงเหล่าผู้ปกครองผู้ทรงอำนาจที่เดินผ่านท่ามกลางประชากรท้องถิ่น และคุกเข่าลงด้วยความยำเกรงต่อสมบัติของท้องถิ่น"
coronation_events.6150.c: ""[confederation.GetName] ทำให้ข้าขุ่นเคือง...""
coronation_events.6150.c.flavor: "...โชคดีที่ สมาชิกของมันได้เดินทางมาที่นี่ และดวงตาที่แวววาวของพวกเขาทรยศว่าพวกเขาจะละทิ้งความภักดีเพื่อทองคำ!"
