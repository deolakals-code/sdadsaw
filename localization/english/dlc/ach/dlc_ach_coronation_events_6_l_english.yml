coronation_events.6102.desc_mid_east_asian_ending_japan_guest: "ราชโองการถูกประกาศ, เหล่าเสนาบดีสาบานตนเข้ารับตำแหน่ง, และ [Glossary( 'สามสิ่งศักดิ์สิทธิ์', 'THREE_SACRED_TREASURES_GLOSS' )] ถูกเปิดเผย, ดัง เช่นที่ต้องเป็นเสมอมา. และ, ในที่สุด, ตราประทับ [host.Custom('GetTitleTierAdjective')|U] อันยิ่งใหญ่ก็ได้รับการถวาย"
coronation_events.6102.desc_mid_east_asian_ending_guest: "ราชโองการถูกประกาศ, เหล่าเสนาบดีสาบานตนเข้ารับตำแหน่ง, และสมบัติโบราณถูกเปิดเผย, ดัง เช่นที่ต้องเป็นเสมอมา. และ, ในที่สุด, ตราประทับ [host.Custom('GetTitleTierAdjective')|U] อันยิ่งใหญ่ก็ได้รับการถวาย"
coronation_events.6102.desc_high_guest: "แต่... [host.GetSheHe] แทบไม่ได้ประกอบพิธีเพียงลำพัง! จากท่อระบายน้ำที่ต่ำที่สุดไปจนถึงหอคอยที่สูงที่สุด เสียงโห่ร้องดังสนั่นกึกก้องไปในอากาศ — ราวกับเสียงร้องของคนหลายพันคนอาจสั่นสะเทือน [host.Custom('ResidenceBuilding')] นี้จนราบเป็นหน้ากลอง!\n\n[host.GetFirstNameNoTooltipRegnal] ขึ้นครองบัลลังก์ไม่ใช่ในฐานะ [host.GetWomanMan] แต่ในฐานะ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ไม่ใช่ในฐานะมนุษย์ปุถุชน แต่ — ดังที่ไพร่ฟ้าข้าแผ่นดินของ [host.GetHerHis] ขับขานและร้องเพลง — เป็นของขวัญจาก [host.GetFaith.HighGodName] แก่ปวงชน [host.GetPrimaryTitle.GetAdjective]"
coronation_events.6102.desc_low_guest: "หนทางช่างยาวไกล... และเงียบงัน แต่ละย่างก้าวสะท้อนก้องดั่งหยดน้ำในห้วงลึกอันไร้ที่สิ้นสุด [anointer.GetName] พร้อมด้วยน้ำตาในดวงตาของนักบวช [anointer.GetHerHis] เริ่มต้นบทเพลงสวด:\n\n"#EMP [host.GetFaith.random_GoodGodNames] โปรดช่วยเราด้วย! จากห้วงลึก จากความสิ้นหวัง: โปรดช่วยเหล่าลูกหลานแห่ง [host.GetPrimaryTitle.GetNameNoTier]! โปรดไว้ชีวิตเราเถิด โอ้ [host.GetFaith.HighGodName] ความอ้างว้างแห่ง [host.GetFaith.NegativeAfterLife]! ขอให้ [host.GetTitleAsNameNoTooltip|l] ของเราต่อต้านความชั่วร้ายของมนุษย์!#!"\n\nขณะที่ปวงชน [host.GetPrimaryTitle.GetAdjectiveNoTooltip] หวาดกลัวและโศกเศร้า [host.GetTitledFirstNameNoTooltipRegnal] ก็ขึ้นครองบัลลังก์"
coronation_events.6102.desc_mid_guest: "คำอธิษฐานจากริมฝีปากของ [host.GetHerHis] ผสมผสานกับเสียงสวดที่ดังขึ้น [host.GetSheHe] และไพร่ฟ้าข้าแผ่นดินของ [host.GetHerHis] อธิษฐานร่วมกัน: "#EMP [host.GetFaith.random_GoodGodNames] โปรดคุ้มครอง [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] นี้ภายใต้ [host.GetFaith.PositiveAfterLife] ตลอดไป บัดนี้และชั่วนิรันดร์! ตราบนานเท่านาน! โปรดอวยพร โอ้ [host.GetFaith.random_GoodGodNames] ความแข็งแกร่งแห่ง [host.GetTitleAsName]!#!"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] ก้มคำนับต่ำ [host.GetNameNoTooltipRegnal] เข้าสู่ที่นั่งอันศักดิ์สิทธิ์ สถานที่แห่งอำนาจของ [host.GetHerHis] #EMP "ทรงพระเจริญ [host.GetFirstNameNoTooltipRegnal]!"#! ทุกคนโห่ร้อง "#EMP ด้วยประสงค์แห่ง [host.GetFaith.HighGodName] [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
coronation_events.6102.a_guest_neg: "[host.GetSheHe|U] คือมลทินบนบัลลังก์สูงส่งของ [host.GetHerHis]"
coronation_events.6102.a_guest_pos: "เกียรติแด่บัลลังก์ [host.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
coronation_events.6102.a_guest: "พิธีเสร็จสิ้นแล้ว [host.GetTitleAsNameNoTooltip] ได้ถูกสร้างขึ้นแล้ว"
coronation_events.6102.a_host_neg: "#EMP นี่#! คือการเริ่มต้นรัชสมัยของข้ารึ...?"

