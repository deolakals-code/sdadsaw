coronation_events.6130.t: "น้ำมันศักดิ์สิทธิ์"
# Intro
coronation_events.6130.desc.intro: "ช่วงเวลาศักดิ์สิทธิ์สุดท้ายใกล้เข้ามาแล้ว"
 coronation_events.6130.papal_intro_host: "แต่ก่อนอื่น การ แต่งตั้งด้วยน้ำมันศักดิ์สิทธิ์ เครื่องหมายแห่งการยอมรับของ [anointer.GetTitledFirstNamePossessiveRegnal]: ไม่เพียง แต่ตัวข้าในฐานะผู้ปกครอง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] แต่ในฐานะสมาชิกระดับสูงของผู้ที่พระคริสต์ทรงเลือก"
coronation_events.6130.papal_intro_guest: "แต่ก่อนอื่น การเจิม: เครื่องหมายแห่งอาณัติของ [host.GetTitledFirstNamePossessiveRegnal] จากพระเจ้า [anointer.GetTitledFirstNameRegnal] [anointer.GetHerselfHimself] ถือน้ำมันศักดิ์สิทธิ์ และรับบทบาทเป็นศาสดาซามูเอลสำหรับกษัตริย์เดวิด [host.GetPrimaryTitle.GetAdjective] ผู้นี้"
coronation_events.6130.abrahamic_intro_host: "ก่อนอื่น ข้าต้องได้รับการ แต่งตั้งด้วยน้ำมันศักดิ์สิทธิ์ ได้รับมอบหมายให้เป็นผู้นำของผู้ซื่อสัตย์ต่อ [host.GetFaith.HighGodNamePossessive] ในฐานะผู้อยู่เหนือฝูงแกะทั่วไป"
coronation_events.6130.abrahamic_intro_guest: "ก่อนอื่น [host.GetTitledFirstNameRegnal] ต้องได้รับการ แต่งตั้งด้วยน้ำมันศักดิ์สิทธิ์ ได้รับการยกย่องเหนือผู้ซื่อสัตย์ต่อ [host.GetFaith.HighGodNamePossessive] ที่เหลือ และดูแลดวงวิญญาณในอาณาจักรของ [host.GetHerHis]"
coronation_events.6130.dharmic_intro_host: "ได้ถวายเครื่องบูชาแล้ว [Glossary( 'ราชสูยะ', 'RAJASUYA_GLOSS' )] ได้เริ่มขึ้น: บัดนี้ คือพิธี [Glossary( 'อภิเษก', 'ABHISHEKA_GLOSS' )] อันศักดิ์สิทธิ์ ข้าสวดมนต์พระเวท และผู้ถือน้ำศักดิ์สิทธิ์สิบเจ็ดอย่างมารวมตัวกัน"
coronation_events.6130.dharmic_intro_guest: "ได้ถวายเครื่องบูชาแล้ว [Glossary( 'ราชสูยะ', 'RAJASUYA_GLOSS' )] ได้เริ่มขึ้น: บัดนี้ คือพิธี [Glossary( 'อภิเษก', 'ABHISHEKA_GLOSS' )] อันศักดิ์สิทธิ์ [host.GetTitledFirstNameRegnal] สวดมนต์พระเวท และผู้ถือน้ำศักดิ์สิทธิ์สิบเจ็ดอย่างมารวมตัวกันรอบ [host.GetHerHim]"
RAJASUYA_GLOSS: "ชุดพิธีกรรมที่ปฏิบัติกันทั่วไปเพื่อสถาปนากษัตริย์ในศาสนาสายธรรม #G ราชสูยะ#! รวมถึงองค์ประกอบต่างๆ เช่น การประพรมด้วยน้ำศักดิ์สิทธิ์ การรับคันธนูพร้อมลูกธนูสามดอก การเหยียบบนหนังเสือ และเกมลูกเต๋า"
ABHISHEKA_GLOSS: "พิธีกรรมโบราณของศาสนาสายธรรมที่กษัตริย์หรือผู้อาวุโสจะได้รับการประพรมด้วยน้ำที่รวบรวมจากแม่น้ำศักดิ์สิทธิ์และสี่มุมชายฝั่งของอินเดีย พิธีกรรมนี้เกี่ยวข้องกับการขึ้นครองราชย์"
coronation_events.6130.generic_intro_host: "แต่ก่อนอื่น การ แต่งตั้งด้วยน้ำมันศักดิ์สิทธิ์ เครื่องหมายแห่งการยอมรับของ [anointer.GetTitledFirstNamePossessiveRegnal]: ไม่เพียง แต่ตัวข้าในฐานะผู้ปกครอง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] แต่ในฐานะที่เป็นหนึ่งในผู้ศรัทธาที่โปรดปรานของ [host.GetFaith.HighGodNamePossessive]"
coronation_events.6130.generic_intro_guest: "แต่ก่อนอื่น การเจิม: เครื่องหมายแห่งอาณัติของ [host.GetTitledFirstNamePossessiveRegnal] จาก [host.GetFaith.HighGodName] [anointer.GetTitledFirstNameRegnal] [anointer.GetHerselfHimself] ถือน้ำมันศักดิ์สิทธิ์"

# Bit about priest
