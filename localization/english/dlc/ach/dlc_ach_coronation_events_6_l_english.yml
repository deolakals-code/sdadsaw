# actual anointing happens
coronation_events.6130.anointing_abrahamic_host_disrespectful: "แต้มน้ำมันสีทองกลิ่นฉุนลงบนตัวข้า บนมือที่ยื่นออกไป ศีรษะ อก ไหล่ และข้อพับแขนของข้า... การเจิมนี้มอบให้แก่ศาสดา [host.GetFaith.PriestNeuterPlural] และกษัตริย์\n\n"
coronation_events.6130.anointing_abrahamic_host: "แต้มน้ำมันสีทองกลิ่นหอมหวานอันศักดิ์สิทธิ์ลงบนตัวข้า บนมือที่สั่นเทา ศีรษะ อก ไหล่ และข้อพับแขนของข้า... การเจิมนี้แบ่งปันโดยเหล่าศาสดา [host.GetFaith.PriestNeuterPlural] และกษัตริย์\n\n"
coronation_events.6130.anointing_abrahamic_guest: "แต้มน้ำมันสีทองอันศักดิ์สิทธิ์ลงบน [host.GetFirstNameNoTooltip] บนมือ ศีรษะ อก ไหล่ และข้อพับแขนของ [host.GetHerHis]... พรสำหรับเหล่าศาสดา [host.GetFaith.PriestNeuterPlural] และกษัตริย์\n\n"
coronation_events.6130.anointing_dharmic_host: "นำผู้ประกอบพิธีอภิเษกของข้า จากหม้อทองคำบังเกิดน้ำทิพย์แห่งชีวิต พวกเขาโปรยปรายสายน้ำอันเจิดจ้าไปทั่วร่างกายข้า และนำความทรงจำอันหอมหวานของแม่น้ำสรัสวดี คงคา และท้องทะเลมาให้\n\n"
coronation_events.6130.anointing_dharmic_guest: "นำผู้ประกอบพิธีอภิเษก จากหม้อทองคำบังเกิดน้ำทิพย์แห่งชีวิต พวกเขาโปรยปรายสายน้ำอันเจิดจ้าไปทั่ว [host.GetFirstNameNoTooltip]\n\n"

# Ending
coronation_events.6130.ending_abrahamic_host_zealous: "ผิวของข้าเปล่งประกายด้วยความเห็นชอบจาก [host.GetFaith.HighGodName]"
coronation_events.6130.ending_abrahamic_host_cynical: "ข้าได้รับความเห็นชอบจาก [host.GetFaith.HighGodNamePossessive] และข้ารู้สึกตัวเหนียวมาก"
coronation_events.6130.ending_abrahamic_guest_zealous: "ผิวของ [host.GetTitleAsNamePossessiveNoTooltip] เปล่งประกายด้วยความเห็นชอบจาก [host.GetFaith.HighGodName]"
coronation_events.6130.ending_abrahamic_guest_cynical: "ผิวที่มันเยิ้มของ [host.GetTitleAsNamePossessiveNoTooltip] คือการรับรองชั้นดีจากผู้ศรัทธา"
coronation_events.6130.ending_dharmic_host: "โดยเหล่าเทพธิดาแห่งแม่น้ำและเทพเจ้าแห่งท้องทะเล โดย [ROOT.Char.GetFaith.WaterGodName] โดย [host.GetFaith.FertilityGodName] ข้าได้รับเกียรติในฐานะ [host.GetTitleAsName]"
coronation_events.6130.ending_dharmic_guest: "โดยเหล่าเทพธิดาแห่งแม่น้ำและเทพเจ้าแห่งท้องทะเล โดย [host.GetFaith.WaterGodName] โดย [host.GetFaith.FertilityGodName] [host.GetFirstNameNoTooltip] ได้รับเกียรติในฐานะ [host.GetTitleAsName]"

coronation_events.6130.a: "จากน้ำมันศักดิ์สิทธิ์ — #EMP สู่ไฟศักดิ์สิทธิ์!#!"
