 coronation_events.6020.t: "สุนัขสงครามสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.6020.desc: ""จะให้เรายิ้มได้อย่างไร?" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('supporter'))] ของข้า [supporter.GetName] คำราม "ดื่ม [ROOT.Char.Custom('RegionalDrink')] สรรเสริญสันติภาพ หวังถึงอนาคตของอาณาจักร..."\n\n[supporter.GetSheHe|U] จ้องเขม็งไปยังกลุ่มขุนนาง [foe.GetPrimaryTitle.GetAdjective] ที่น่าสงสัย\n\n"... ในขณะที่ #EMP เหล่าหนอนบ่อนไส้#! จ้องมองเราอย่างชั่วร้ายและวางแผนโค่นล้มท่าน [ROOT.Char.GetTitleAsName] ของข้า!" [supporter.GetSheHe] ถ่มน้ำลาย "โปรดอนุญาตให้ข้าเป่าเขาสงคราม! ข้าจะอัด [foe.GetName] ให้น่วม ไม่พลาดแน่!""
 coronation_events.6020.a: ""จงกวาดต้อนผู้คนจากดินแดนของเจ้าเข้ากองทัพ และจงโจมตี!""
 coronation_events.6020.b: ""จงทุ่มสรรพกำลังของ [supporter.GetPrimaryTitle.GetNameNoTierNoTooltip] เพื่อความพ่ายแพ้ของ [foe_2.GetTitledFirstNamePossessiveNoTooltip]!""
 coronation_events.6020.c: ""จงขยี้ [foe.GetTitledFirstNameNoTooltip] ข้าอนุญาต""
 coronation_events.6020.d: ""[foe_2.GetTitledFirstNameNoTooltip] คือศัตรูของเจ้า!""
 coronation_events.6020.e: ""มาเถอะๆ ความเร่าร้อน เช่นนี้เหมาะกับโต๊ะอาหารของข้ามากกว่า""

coronation_supporter_declares_war_log_title: "ผู้สนับสนุนถูกปล่อยเข้าสู่สงคราม"
coronation_supporter_declares_war_log: "ด้วยอำนาจและการสนับสนุนจากราชบัลลังก์ [supporter.GetShortUIName] ท้าทาย [supporter_war_target.GetShortUIName] เข้าสู่สงคราม"
coronation_events.6030.t: "สหายของ [host.GetTitleAsNameNoTooltip] องค์ใหม่"
coronation_events.6030.t_feast: "สหายของ [host.GetTitleAsNameNoTooltip]"
coronation_events.6030.desc: ""โอ้ ใช่ [ROOT.Char.GetFirstName]" [host.GetTitledFirstName] พึมพำอย่างมีเลศนัย "มัน #EMP ดี#! จริงๆ ที่ได้เป็น [host.GetTitleAsNameNoTooltip]..."\n\nเบื้องหน้าเราคือห้องที่เต็มไปด้วยเนื้อหนังมังสา เหล่านางบำเรอหน้าแดงอย่างเชื้อเชิญ ขณะที่ [host.GetFirstNameNoTooltip] หันมาหาข้าด้วยรอยยิ้มลามก "[host.GetTitleAsNameNoTooltip] ต้องใจกว้าง [fearsome_courtesan.GetWomenMen] เหล่านี้ ผู้ร่วมเฉลิมฉลองเหล่านี้... สามารถเป็นของท่านได้ เป็นของท่านในค่ำคืนนี้ หรือหลายค่ำคืน... [fearsome_courtesan.Custom('GirlBoyPlural')] เหล่านี้กระตือรือร้นที่จะแบ่งปัน #EMP พรสวรรค์#! ของพวกเขากับท่าน""
coronation_events.6030.a: "[fearsome_courtesan.GetWomanMan] ผู้น่าเกรงขามนั่น: [fearsome_courtesan.GetSheHe] สามารถ #EMP ขยี้ข้าได้!#!"
coronation_events.6030.a_flavor: "โอ้ อยากจะขาดใจตายในมือของ [fearsome_courtesan.GetHerHis]!"
coronation_events.6030.a_thighs: "โอ้ อยากจะขาดใจตายระหว่างเรียวขาของ [fearsome_courtesan.GetHerHis]!"
coronation_events.6030.b: "คนนี้เป็นเด็กหนุ่ม #EMP ร้ายกาจ#!..."
coronation_events.6030.b_minx: "ส่วนคนนี้ แม่สาวน้อย #EMP เจ้าเล่ห์#!..."
coronation_events.6030.b_flavor: "ริมฝีปากที่แสยะยิ้มของ [cunning_courtesan.GetHerHis|U] คงจะแฝงไว้ด้วยคำโกหกอันหอมหวาน..."
coronation_events.6030.c: "ชายสูงวัยผู้เฉลียวฉลาด มือของเขาดั่งหนังฟอก..."
coronation_events.6030.c_dame: "สตรีสูงวัยผู้ปราดเปรื่อง มากเล่ห์เหลี่ยม และเคร่งขรึม..."
coronation_events.6030.c_flavor: "ใครสักคนที่คอยบอก #EMP ข้า#! ว่าต้องทำอะไรบ้าง เพื่อเปลี่ยนบรรยากาศ... [experienced_courtesan.GetWomanMan] ผู้เจนโลก เพื่อนำทางข้าด้วยสัมผัสที่รู้ใจ"
coronation_events.6030.d: "สองพี่น้องรูปงามรึ? ข้าจะเอาทั้งคู่!"
coronation_events.6030.d_sisters: "สองพี่น้องโฉมงามรึ? ข้าจะเอาทั้งคู่!"
coronation_events.6030.d_flavor: "เพราะ... [host.GetTitleAsNameNoTooltip] ใจกว้างมิใช่หรือ?"
coronation_events.6030.e_expose: "การมักมากในกามอันเลวทราม! ทุกคนจะต้องได้ยินเรื่องนี้!"
coronation_events.6030.e: "บางที เราอาจจะแค่สนทนาเรื่องบทกวี..."
coronation_host_orgy_exposed_log_title: "[host.GetTitledFirstNamePossessive] ถูกจับได้ขณะอยู่กับเหล่านางบำเรอ"
coronation_host_orgy_exposed_log: "การละเล่นทางเพศเพื่อเฉลิมฉลองของ [host.GetTitledFirstNamePossessive] ถูกเปิดโปงและประณามโดย [exposer.GetTitledFirstName]"
host_has_courtesan_hooks_tt: "#weak [host.GetShortUIName] มี [hooks|E] ต่อเหล่านางบำเรอเหล่านี้ทั้งหมด#!"


coronation_events.6100.t: "การสวมมงกุฎของ [host.GetFirstNameNoTooltipRegnal]"
# Host loc
coronation_events.6100.desc_intro: "สัญลักษณ์ [host.Custom('GetTitleTierAdjective')] ถูกนำออกมา"
coronation_events.6100.desc_byzantine: "[Glossary( 'คลามิส', 'CHLAMYS_GLOSS' )] สีม่วง—ส่องประกายเรืองรองในแสงเทียนนับพัน—ถูกคลุมลงบนไหล่ของข้า #EMP "สรรเสริญพระเจ้าผู้สูงสุด!"#! ผู้ที่มารวมกันร้องตะโกน #EMP "และสันติสุขบนผืนพิภพ!"#! พระราชาคณะสวดด้วยน้ำเสียงเคร่งขรึม: "ในพระนามแห่งพระบิดา พระคริสต์ [Glossary( 'พันโทคราเทอร์', 'PANTOKRATOR_GLOSS')] และพระจิตอันศักดิ์สิทธิ์ ข้าขอมอบหมายให้เจ้า [host.GetFirstNameRegnal] ปกครองในฐานะ [Glossary( 'ออกุสตอส', 'AUGOUSTOS_GLOSS')] แห่ง [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] และผู้เลี้ยงแกะผู้ซื่อสัตย์ของพระเจ้า""
coronation_events.6100.desc_byzantine_femme: "[Glossary( 'คลามิส', 'CHLAMYS_GLOSS' )] สีม่วง—ส่องประกายเรืองรองในแสงเทียนนับพัน—ถูกคลุมลงบนไหล่ของข้า #EMP "สรรเสริญพระเจ้าผู้สูงสุด!"#! ผู้ที่มารวมกันร้องตะโกน #EMP "และสันติสุขบนผืนพิภพ!"#! พระราชาคณะสวดด้วยน้ำเสียงเคร่งขรึม: "ในพระนามแห่งพระบิดา พระคริสต์ [Glossary( 'พันโทคราเทอร์', 'PANTOKRATOR_GLOSS')] และพระจิตอันศักดิ์สิทธิ์ ข้าขอมอบหมายให้เจ้า [host.GetFirstNameRegnal] ปกครองในฐานะ [Glossary( 'ออกุสตา', 'AUGOUSTOS_GLOSS')] แห่ง [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] และผู้เลี้ยงแกะผู้ซื่อสัตย์ของพระเจ้า""
CHLAMYS_GLOSS: "เสื้อคลุมผ้าไหมเนื้อหนาที่สวมใส่โดยขุนนางไบแซนไทน์ สัญลักษณ์แห่งอำนาจฝ่ายอาณาจักรเหนือรัฐจักรวรรดิ ยึดไว้ด้วยเข็มกลัดฟิบูล่า #G คลามิส#! มีแผงประดับอัญมณีขนาดใหญ่เรียกว่า #EMP tablia#! ซึ่งสงวนไว้สำหรับจักรพรรดิเมื่อทำด้วยทองคำ"
coronation_events.6100.desc_christian: "[host.Custom('GetRegionalSword')] อันแวววาวถูกคาดไว้ที่สะโพกของข้า คทาแห่งอำนาจอธิปไตย—ถูกยื่นมาในมือข้า นิ้วของข้ากุมรอบ [Glossary( 'ลูกโลกประดับกางเขน', 'GLOBUS_CRUCIGER_GLOSS')]; [Glossary( 'อาร์มิลส์', 'ARMILLS_GLOSS')] และ [Glossary( 'พาลเลียม', 'PALLIUM_GLOSS')] ถูกสวมใส่บนร่างกายข้า เสียงสวดมนต์ยังคงดำเนินต่อไป"
coronation_events.6100.desc_high: "[host.Custom('GetRegionalSword')] อันเปล่งประกายถูกคาดไว้ที่สะโพกของข้า อัญมณีอันงดงาม เสื้อคลุมอันรุ่งโรจน์ ถูกสวมใส่บนร่างกายข้า เหล่าผู้ที่ดีที่สุดของ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]—[host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดน—ต่างเปล่งเสียงสวดมนต์บทสุดท้าย และคำสุดท้าย: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] อันเป็นที่รักของเรา!#!""
coronation_events.6100.desc_low: "[host.Custom('GetRegionalSword')] เก่าๆ ถูกคาดไว้ที่สะโพกของข้า อัญมณีสีฉูดฉาด เสื้อคลุมเก่าๆ ถูกสวมใส่บนร่างกายข้า แม้ แต่เหล่าผู้ร่วมงานหน้าบึ้งตึงของ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]—[host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดนอันน่าสังเวชนี้ แม้ แต่พวกเขา—ก็ยังพึมพำสวดมนต์บทสุดท้าย และกล่าวคำสุดท้าย: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
coronation_events.6100.desc_generic: "[host.Custom('GetRegionalSword')] อันเปล่งประกายถูกคาดไว้ที่สะโพกของข้า อัญมณีที่ประดับประดา เสื้อคลุมอันหนักอึ้ง ถูกสวมใส่บนร่างกายข้า เหล่าขุนนางของ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]—[host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดน—ต่างสวดมนต์บทสุดท้าย และคำสุดท้าย: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
coronation_events.6100.desc_ending_byzantine_cynical: "\n\nด้วยเกียรติแห่งสมบัติ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่าต่อหน้า [crowner.GetTitledFirstNameRegnal] [crowner.GetSheHe|U] อ้างว่าเป็น เพราะพระคุณของพระคริสต์ที่ข้าได้ปกครอง ว่าเป็น เพราะความเมตตาของพระเจ้าเพียงผู้เดียวที่ปกป้อง [ROOT.Char.GetPrimaryTitle.GetTierAsName]... แต่ข้าคือผู้เลี้ยงแกะของประชาชน ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip] ชะตากรรมของ [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] อยู่ในมือข้า เพียงผู้เดียว..."
coronation_events.6100.desc_ending_byzantine: "\n\nด้วยเกียรติแห่งสมบัติโบราณ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่าต่อหน้า [crowner.GetTitledFirstNameRegnal] และต่อหน้าพระคริสต์— เพราะข้าปกครองด้วยพระคุณอันศักดิ์สิทธิ์ และด้วยความเมตตาของพระองค์ที่ [ROOT.Char.GetPrimaryTitle.GetTierAsName] ยังคงอยู่ และในที่สุด..."
coronation_events.6100.desc_ending_non_abrahamic_vassal: "\n\nด้วยเกียรติแห่งสมบัติ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่า เพื่อรัดเกล้าแห่ง [host.GetPrimaryTitle.GetTierAsName] ของข้า สัญลักษณ์ของ [host.GetPrimaryTitle.GetNameNoTierNoTooltip] นับจากนี้ไปจะอยู่... เหนือข้าเสมอ"
coronation_events.6100.desc_ending_non_abrahamic: "\n\nด้วยเกียรติแห่งสมบัติ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่า... เป็นครั้งสุดท้าย เพื่อ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ข้ากำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] ไม่ก้มหัวให้ผู้ใด"
coronation_events.6100.desc_ending_vassal: "\n\nด้วยเกียรติแห่งสมบัติ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่า เพื่อ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ข้ากำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] ก้มหัวให้ [host.GetLiege.GetTitleAsName] [host.GetLiege.GetPrimaryTitle.GetAdjective] และ [host.GetFaith.HighGodName]"
coronation_events.6100.desc_ending: "\n\nด้วยเกียรติแห่งสมบัติ [host.Custom('GetTitleTierAdjective')] ข้าคุกเข่า... เป็นครั้งสุดท้าย เพื่อ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ข้ากำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] ก้มหัวให้เพียง [host.GetFaith.HighGodName] เท่านั้น"

# Guest loc
coronation_events.6100.desc_byzantine_guest: "ฉลองพระองค์ [Glossary( 'คลามิส', 'CHLAMYS_GLOSS' )] สีม่วง — สุกสกาวกลางแสงเทียนนับพัน — ถูกคลุมลงบนพระอังสาของ [host.GetFirstNamePossessiveRegnal] #EMP "พระสิริรุ่งโรจน์จงมีแด่พระเจ้าในสูงสุด!"#! เหล่าผู้ร่วมชุมนุมโห่ร้อง #EMP "และสันติสุขบนแผ่นดิน!#!" พระสังฆราชกล่าวสวด: "ในพระนามแห่งพระบิดา พระคริสต์ [Glossary( 'พันโทคราเทอร์', 'PANTOKRATOR_GLOSS')] และพระจิตอันศักดิ์สิทธิ์ ข้าพเจ้าขอมอบหมายให้ [host.GetFirstNameRegnal] ปกครองในฐานะ [Glossary( 'ออกุสตอส', 'AUGOUSTOS_GLOSS')] แห่ง [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] และผู้เลี้ยงแกะผู้ซื่อสัตย์ของพระเจ้า""
coronation_events.6100.desc_byzantine_femme_guest: "ฉลองพระองค์ [Glossary( 'คลามิส', 'CHLAMYS_GLOSS' )] สีม่วง — สุกสกาวกลางแสงเทียนนับพัน — ถูกคลุมลงบนพระอังสาของ [host.GetFirstNamePossessiveRegnal] #EMP "พระสิริรุ่งโรจน์จงมีแด่พระเจ้าในสูงสุด!"#! เหล่าผู้ร่วมชุมนุมโห่ร้อง #EMP "และสันติสุขบนแผ่นดิน!#!" และพระสังฆราชกล่าวสวด: "ในพระนามแห่งพระบิดา พระคริสต์ [Glossary( 'พันโทคราเทอร์', 'PANTOKRATOR_GLOSS')] และพระจิตอันศักดิ์สิทธิ์ ข้าพเจ้าขอมอบหมายให้ [host.GetFirstNameRegnal] ปกครองในฐานะ [Glossary( 'ออกุสตา', 'AUGOUSTOS_GLOSS')] แห่ง [Glossary( 'โรไมออย', 'ROMAIOS_GLOSS' )] และผู้เลี้ยงแกะผู้ซื่อสัตย์ของพระเจ้า""
coronation_events.6100.desc_christian_guest: "[host.Custom('GetRegionalSword')] อันแวววาวถูกคาดไว้ที่สะโพกของ [host.GetFirstNamePossessive] คทาแห่งอำนาจอธิปไตย — ถูกยกขึ้นไว้ในมือของ [host.GetHerHis] นิ้วของ [host.GetHerHis|U] กำรอบ [Glossary( 'ลูกโลกประดับกางเขน', 'GLOBUS_CRUCIGER_GLOSS')]; [Glossary( 'อาร์มิลส์', 'ARMILLS_GLOSS')] และ [Glossary( 'พาลเลียม', 'PALLIUM_GLOSS')] ถูกสวมเข้ากับร่างกายของ [host.GetHerHis] เสียงสวดมนต์ยังคงดำเนินต่อไป"
coronation_events.6100.desc_high_guest: "[host.Custom('GetRegionalSword')] อันส่องประกายถูกคาดไว้ที่สะโพกของ [host.GetFirstNamePossessive] อัญมณีอันงดงามและเสื้อคลุมอันรุ่งโรจน์ถูกสวมใส่แด่ [host.GetHerHim] เหล่าหัวกะทิแห่ง [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — อันได้แก่ [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดนนั้น — ต่างเปล่งเสียงสวดภาวนาเป็นหนึ่งเดียว และบทสุดท้าย: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] อันเป็นที่รักของเรา!#!""
coronation_events.6100.desc_low_guest: "[host.Custom('GetRegionalSword')] เก่าคร่ำคร่าถูกคาดไว้ที่สะโพกของ [host.GetFirstNamePossessive] อัญมณีสีสันฉูดฉาด ฉลองพระองค์ที่เก่าซีดถูกสวมทับบน [host.GetHerHim] แม้ แต่เหล่าเจ้าบ้านผู้บึ้งตึงแห่ง [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของ [host.GetHerHis] — เหล่า [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดนอันน่าสังเวชนั้น แม้ แต่พวกเขา — ก็ยังพึมพำบทสวดสุดท้าย และกล่าวปิดท้ายว่า: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
coronation_events.6100.desc_generic_guest: "[host.Custom('GetRegionalSword')] อันเรืองรองถูกคาดไว้ที่สะโพกของ [host.GetFirstNamePossessive] อัญมณีที่ร้อยเรียง ฉลองพระองค์อันหนักอึ้งถูกสวมทับบนร่างกายของ [host.GetHerHis] เหล่าขุนนางแห่ง [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ของ [host.GetHerHis] — เหล่า [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] และ [host.Custom('KnightCulturePluralNoTooltipLowercase')] แห่งดินแดนนั้น — ต่างสวดภาวนาบทสุดท้ายพร้อมเพรียงกัน และกล่าวปิดท้ายว่า: "#EMP [host.GetFaith.HighGodName] โปรดทอดพระเนตร [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
coronation_events.6100.desc_ending_byzantine_guest: "\n\n[host.GetFirstNameNoTooltipRegnal] ผู้ประดับด้วยสมบัติ [host.Custom('GetTitleTierAdjective')] โบราณ คุกเข่าลงเบื้องหน้า [crowner.GetTitledFirstNameRegnal] และเบื้องหน้าพระคริสต์ — ด้วยพระหรรษทานอันศักดิ์สิทธิ์ [host.GetSheHe] จึงได้ปกครอง และด้วยพระเมตตาอันสูงส่ง [ROOT.Char.GetPrimaryTitle.GetTierAsName] จึงยังคงดำรงอยู่ และในที่สุด..."
coronation_events.6100.desc_ending_non_abrahamic_vassal_guest: "\n\n[host.GetFirstNameNoTooltipRegnal] ผู้ประดับด้วยสมบัติ [host.Custom('GetTitleTierAdjective')] คุกเข่าลง สำหรับมงกุฎแห่ง [host.GetPrimaryTitle.GetTierAsName] ของ [host.GetHerHis] สัญลักษณ์แห่ง [host.GetPrimaryTitle.GetNameNoTierNoTooltip] จักอยู่... เหนือ [host.GetHerHim] ตลอดไปนับจากนี้"
coronation_events.6100.desc_ending_non_abrahamic_guest: "\n\n[host.GetFirstNameNoTooltipRegnal] ผู้ประดับด้วยสมบัติ [host.Custom('GetTitleTierAdjective')] คุกเข่าลง... เพียงครั้งนี้ ครั้งสุดท้าย สำหรับ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ [host.GetSheHe] กำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] จะไม่ก้มหัวให้ผู้ใด"
coronation_events.6100.desc_ending_vassal_guest: "\n\n[host.GetFirstNameNoTooltipRegnal] ผู้ประดับด้วยสมบัติ [host.Custom('GetTitleTierAdjective')] คุกเข่าลง สำหรับ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ [host.GetSheHe] กำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] จะก้มหัวให้ [host.GetLiege.GetTitleAsName] แห่ง [host.GetLiege.GetPrimaryTitle.GetAdjective] และต่อ [host.GetFaith.HighGodName]"
coronation_events.6100.desc_ending_guest: "\n\n[host.GetFirstNameNoTooltipRegnal] ผู้ประดับด้วยสมบัติ [host.Custom('GetTitleTierAdjective')] คุกเข่าลง... เพียงครั้งนี้ ครั้งสุดท้าย สำหรับ [host.GetTitleAsName] แห่ง [host.GetPrimaryTitle.GetNameNoTier] [host.GetTitleAsNameNoTooltip|l] ที่ [host.GetSheHe] กำลังจะกลายเป็นอย่างแท้จริง: [host.GetSheHe] จะก้มหัวให้เพียง [host.GetFaith.HighGodName] เท่านั้น"

 GLOBUS_CRUCIGER_GLOSS: "ลูกโลก 'ทรงกางเขน' โดยทั่วไปทำจากโลหะล้ำค่า ใช้ถือไว้ในมือเป็นส่วนหนึ่งของเครื่องราชกกุธภัณฑ์ และเป็นสัญลักษณ์แห่งอำนาจของพระผู้ไถ่เหนือโลกทั้งปวง"
 ARMILLS_GLOSS: "กำไลต้นแขนประกอบพิธีการอันวิจิตรหนึ่งคู่ สำหรับสวมบนแขนของพระสังฆราชหรือกษัตริย์ #G Armills#! จะถูกประดับด้วยภาพอย่างการฟื้นคืนพระชนม์และการตรึงกางเขนของพระคริสต์"
 PALLIUM_GLOSS: "ฉลองพระองค์คลุมอันสง่างามของกษัตริย์ เป็นอาภรณ์ประเภทเดียวกับ #G loros#! ของจักรวรรดิกรีก และ #G pallia#! ที่เจ้าหน้าที่โบสถ์สวมใส่"

coronation_events.6100.a: "มงกุฎถูกสวมลงบนหน้าผากของข้า"
coronation_events.6100.a_guest: "มงกุฎถูกสวมลงบนหน้าผากของ [host.GetHerHis]"
coronation_events.6100.a_guest_low: "มงกุฎถูกสวมลง... แต่จะนานสักเท่าใด?"
coronation_events.6100.a_flavor_decent: "และแล้ว [Glossary( 'มงกุฎราชาภิเษก', 'CORONATION_CROWN_GLOSS')] แห่ง [host.GetPrimaryTitle.GetAdjectiveNoTooltip] ก็ถูกสวมลงอย่างมั่นคง"
coronation_events.6100.a_flavor_low_guest: "บนศีรษะของ [host.GetFirstNameNoTooltipRegnal] [Glossary( 'มงกุฎราชาภิเษก', 'CORONATION_CROWN_GLOSS')] แห่ง [host.GetPrimaryTitle.GetAdjectiveNoTooltip] ดูค่อนข้างแปลกประหลาด..."
coronation_events.6100.a_flavor_low: "ท่ามกลางพิธีอันเลวร้ายนี้ ข้าแทบไม่รู้สึกยินดีกับสัมผัสของ [Glossary( 'มงกุฎราชาภิเษก', 'CORONATION_CROWN_GLOSS')] แห่ง [host.GetPrimaryTitle.GetAdjectiveNoTooltip] เลย..."
coronation_events.6100.a_flavor_giant: "โอ้ [host.GetFaith.HighGodName] — [crowner.GetTitledFirstNameNoTooltip] แทบจะยัด [Glossary( 'มงกุฎราชาภิเษก', 'CORONATION_CROWN_GLOSS')] เล็กจิ๋วนี้ลงไม่ได้!"
coronation_events.6100.a_flavor_adolescent: "ดูสิ: [Glossary( 'มงกุฎราชาภิเษก', 'CORONATION_CROWN_GLOSS')] ของข้า! และ — #EMP โอ้#! — มันแทบจะหล่นลงมาปิดตาข้าอยู่แล้ว..."
CORONATION_CROWN_GLOSS: "มงกุฎที่ใช้ในพิธีราชาภิเษก ในบางกรณี ก็เป็นมงกุฎที่ใช้ในชีวิตประจำวัน #G มงกุฎราชาภิเษก#! อาจเป็นของโบราณที่ฝุ่นจับ ซึ่งจะถูกนำเสนอในโอกาสพิเศษเพียงครั้งเดียว"

coronation_events.6101.desc_crowning_intro: "บ้างก็ว่าเป็นการโอหังไร้ยางอายสำหรับ [host.GetTitleAsName] ที่จะยกมงกุฎขึ้นสูงและสวมมันลงบนหน้าผากของ [host.GetHerHis] เอง และในการกระทำนั้น ก็ได้ประกาศ #EMP [host.GetHerselfHimself]#! ท่ามกลางกษัตริย์ผู้ถูกเลือกโดย [host.GetFaith.HighGodNamePossessive] บนผืนปฐพี\n\n"
coronation_events.6101.desc_no_being_crowned_intro: "[host.GetTitleAsName|l] เมื่อ [host.GetSheHe] อยู่ในชุดพิธีการและเพียบพร้อมด้วยความเห็นชอบของประชาชนของ[host.GetHerHis]... อาจสวมมงกุฎให้ [host.GetHerselfHimself] นั่นคือวิถีของเรา แม้ว่า [host.GetFaith.BishopNeuterPlural] บางคนจะอิจฉาสิทธิ์ [host.Custom('GetTitleTierAdjective')] นี้ก็ตาม\n\n"
# Host loc
coronation_events.6101.desc_crowning_priests_iberian: "#EMP ฮ่า!#! พวกเรา #EMP ชาวไอบีเรีย#! ไม่เห็นด้วย เรากล่าวถ้อยคำอันนอบน้อมต่อพระเจ้าและ #EMP la Santísima Virgen María#! จากนั้นเราก็ทำตามที่เราประสงค์!"
coronation_events.6101.desc_crowning_priests_high: "กระนั้น [host.GetFaith.PriestNeuterPlural] ผู้คลางแคลงใจเพียงไม่กี่คนกำลังขับขานเสียงแหลม และจ้องมองอย่างเกรงขามขณะที่ข้าเริ่มพิธี"
coronation_events.6101.desc_crowning_priests_low: "แท้จริงแล้ว ภายใต้เสียงกระซิบกระซาบของฝูงชน [host.GetFaith.PriestNeuterPlural] ต่างพึมพำสาปแช่งอย่างมืดมน"
coronation_events.6101.desc_crowning_priests_mid: "จงไปสู่[host.GetFaith.NegativeAfterLife]เถิด เหล่าผู้ไม่หวังดีต่อข้า! ข้าไม่ต้องการ [host.GetFaith.PriestNeuter]"
coronation_events.6101.desc_words_christian: "ข้าจับมงกุฎประดับกางเขนไว้ในนิ้ว — พลางกล่าว "#EMP ข้าแต่พระเจ้า พระองค์ทรงอยู่เหนือกษัตริย์ทั้งปวง อาณาจักรแห่งสวรรค์และโลกทั้งหมดเป็นของพระองค์#! " และอื่นๆ — ข้าสวมมงกุฎให้ตนเองเป็นนายแห่ง [host.GetPrimaryTitle.GetNameNoTier]\n\n"
coronation_events.6101.desc_words_generic: "ข้าจับแถบโลหะประดับอัญมณีไว้ในนิ้ว พลางกล่าวสุนทรพจน์ต่อ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ทั้งปวง ข้าสัญญาว่าจะเฝ้าระวัง มอบความยุติธรรม และความแข็งแกร่ง — และข้าสวมมงกุฎให้ตนเองเป็นนายแห่ง [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
coronation_events.6101.desc_ending_humble: "ด้วยย่างก้าวที่เชื่องช้าและเคร่งขรึม ข้าเข้าใกล้บัลลังก์ที่รออยู่ มันไม่ใช่เรื่องเล็กเลยที่จะได้เป็น [host.GetTitleAsNameNoTooltip|l]"
coronation_events.6101.desc_ending: "ในที่สุด ข้าก็เข้าใกล้บัลลังก์อธิปไตยในฐานะ [host.GetTitleAsNameNoTooltip|l] ที่ข้าควรจะเป็นมาโดยตลอด"
# Guest loc
coronation_events.6101.desc_crowning_priests_high_guest: "กระนั้น [host.GetFaith.PriestNeuterPlural] ผู้คลางแคลงใจเพียงไม่กี่คนกำลังขับขานเสียงแหลม และจ้องมองอย่างเกรงขามขณะที่ [host.GetFirstName] [host.Custom('FormalComplimentAdjective')] เริ่มพิธี"
coronation_events.6101.desc_crowning_priests_low_guest: "แท้จริงแล้ว ภายใต้เสียงกระซิบกระซาบของฝูงชน ข้าได้ยิน [host.GetFaith.PriestNeuterPlural] พึมพำสาปแช่งอย่างมืดมน"
coronation_events.6101.desc_crowning_priests_mid_guest: "กระนั้น เหล่า [host.GetFaith.PriestNeuterPlural] ดูเหมือนจะเต็มใจยอมรับพิธีนี้ บางที ผู้ปกครองบางคนใน [host.GetFaith.ReligiousText] อาจเคยทำ เช่นเดียวกัน"
coronation_events.6101.desc_words_christian_guest: "จับมงกุฎประดับกางเขนไว้ในนิ้วของ [host.GetHerHis] — พลางกล่าว "#EMP ข้าแต่พระเจ้า พระองค์ทรงอยู่เหนือกษัตริย์ทั้งปวง อาณาจักรแห่งสวรรค์และโลกทั้งหมดเป็นของพระองค์#! " และอื่นๆ — [host.GetFirstNameRegnal] สวมมงกุฎให้ [host.GetHerselfHimself] เป็นนายแห่ง [host.GetPrimaryTitle.GetNameNoTier]\n\n"
coronation_events.6101.desc_words_generic_guest: "[host.GetFirstNameRegnal] จับแถบโลหะประดับอัญมณีไว้ในนิ้วของ [host.GetHerHis] พลางกล่าวสุนทรพจน์ต่อ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ทั้งปวง [host.GetSheHe|U] สัญญาว่าจะเฝ้าระวัง มอบความยุติธรรม และความแข็งแกร่ง — และ [host.GetSheHe] สวมมงกุฎให้ [host.GetHerselfHimself] เป็นนายแห่ง [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
coronation_events.6101.desc_ending_humble_guest: "ด้วยย่างก้าวที่เชื่องช้าและเคร่งขรึม [host.GetTitleAsNameNoTooltip] เข้าใกล้บัลลังก์ที่รออยู่ของ [host.GetHerHis] ความยิ่งใหญ่ของสิ่งที่ [host.GetSheHe] ได้ทำลงไป สิ่งที่ [host.GetSheHe] ได้กลายเป็น ทำให้ใบหน้าของ [host.GetHerHis] มืดลง"
coronation_events.6101.desc_ending_guest: "[host.GetTitleAsNameNoTooltip] เข้าใกล้บัลลังก์อธิปไตยของ [host.GetHerHis] อย่างภาคภูมิใจ"
# Option loc
coronation_events.6101.a_guest_neg: "และ เช่นนั้น เราก็ได้เฝ้าดู [host.GetWomanMan] ผู้บิดเบี้ยวหลงรัก[host.GetHerselfHimself]"
coronation_events.6101.a_guest_pos: "[host.GetTitleAsNameNoTooltip] ผู้ชอบธรรม ไชโย!"
coronation_events.6101.a_guest: "[host.GetSheHe|U] สวมมันแล้ว และ [host.GetSheHe] ก็จะใส่มัน"
coronation_events.6101.a: "ขอให้ข้าได้นั่งตรงนี้ไปอีกหลายปี"
coronation_events.6101.a_oh_noes: "มันคงสายเกินไปที่จะหันหลังกลับแล้ว ข้าว่า..."

coronation_events.6102.t: "การขึ้นครองบัลลังก์ของ [host.GetFirstNameNoTooltipRegnal]"
coronation_events.6102_middle: "\n\nข้าก้าวออกไปเพียงลำพังสำหรับพิธีการสูงสุดนี้ ประดับประดาด้วยเครื่องราชกกุธภัณฑ์แรกเริ่มของข้า"
coronation_events.6102.desc_high_east_asian: "เสียงระฆังอันกังวานบ่งบอกถึงการก้าวย่างครั้งประวัติศาสตร์ของข้า เหล่าเสนาบดีผู้ยำเกรงของข้า และราชทูตต่างแดน — เพียงไม่กี่คนที่ได้รับเกียรติในชั่วขณะนี้ — ต่างหมอบกราบอยู่เบื้องล่าง [host.GetTitleAsName] ผู้ยิ่งใหญ่ ขึ้นครองบัลลังก์แห่งการปกครองของ [host.GetHerHis]\n\n"
coronation_events.6102.desc_low_east_asian: "แสงไฟดับมอดลงพร้อมกับการมาถึงของข้าหรือไร? ท้องพระโรงอันยิ่งใหญ่กลับมืดมิด เกือบจะดำสนิท มีเพียงใบหน้าที่ก้มต่ำ ซึ่งข้าเดินผ่านเท่านั้นที่ส่องประกาย ซีดขาวราวกับกระดูก กดแนบชิดกับพื้นราวกับว่าผู้คนแห่ง [host.GetPrimaryTitle.GetNameNoTier] ได้สิ้นชีพไปแล้ว\n\n"
coronation_events.6102.desc_mid_east_asian: "ทุกสิ่งดำเนินไปตามข้อกำหนดอันสอดประสานของพิธีโบราณ เหล่าข้าราชบริพารและเสนาบดีทั้งหลายต่างหมอบกราบอยู่เบื้องหน้าข้า; ข้าขึ้นครองบัลลังก์แห่งการปกครองของข้า\n\n"
coronation_events.6102.desc_high_east_asian_ending_japan: "ในสามจังหวะอันสอดประสาน ราชโองการอันทรงอำนาจได้ถูกเปล่งออกมา การสวามิภักดิ์อันแรงกล้าได้บังเกิด และ [Glossary( 'สามสิ่งศักดิ์สิทธิ์', 'THREE_SACRED_TREASURES_GLOSS' )] ถูกนำเสนอเบื้องหน้าข้า ตราประทับ [host.Custom('GetTitleTierAdjective')|U] เป็นของข้าแล้ว และทุกสิ่งใน [host.GetPrimaryTitle.GetNameNoTier] ก็ล้วนถูกต้องดีงาม"
coronation_events.6102.desc_high_east_asian_ending: "ในสามจังหวะอันสอดประสาน ราชโองการอันทรงอำนาจได้ถูกเปล่งออกมา การสวามิภักดิ์อันแรงกล้าได้บังเกิด และสมบัติโบราณอันศักดิ์สิทธิ์ถูกนำเสนอเบื้องหน้าข้า ตราประทับ [host.Custom('GetTitleTierAdjective')|U] เป็นของข้าแล้ว และทุกสิ่งใน [host.GetPrimaryTitle.GetNameNoTier] ก็ล้วนถูกต้องดีงาม"
coronation_events.6102.desc_low_east_asian_ending_japan: "เสียงประกาศราชโองการดังอู้อี้, [Glossary( 'สามสิ่งศักดิ์สิทธิ์', 'THREE_SACRED_TREASURES_GLOSS' )] ถูกนำเสนอ, แต่ขณะที่ข้านั่งอยู่บนบัลลังก์ [host.Custom('GetTitleTierAdjective')]... ความคิดของข้ากลับเลื่อนลอยและมืดมน..."
coronation_events.6102.desc_low_east_asian_ending: "เสียงประกาศราชโองการดังอู้อี้, โบราณวัตถุอันเต็มไปด้วยฝุ่นถูกนำเสนอ, แต่ขณะที่ข้านั่งอยู่บนบัลลังก์ [host.Custom('GetTitleTierAdjective')]... ความคิดของข้ากลับเลื่อนลอยและมืดมน..."
coronation_events.6102.desc_mid_east_asian_ending_japan: "ราชโองการถูกประกาศ, เหล่าเสนาบดีสาบานตนเข้ารับตำแหน่ง, และ [Glossary( 'สามสิ่งศักดิ์สิทธิ์', 'THREE_SACRED_TREASURES_GLOSS' )] ถูกเปิดเผย, ดัง เช่นที่ต้องเป็นเสมอมา. และ, ในที่สุด, ตราประทับ [host.Custom('GetTitleTierAdjective')|U] อันยิ่งใหญ่ก็เป็นของข้า"
coronation_events.6102.desc_mid_east_asian_ending: "ราชโองการถูกประกาศ, เหล่าเสนาบดีสาบานตนเข้ารับตำแหน่ง, และสมบัติโบราณถูกเปิดเผย, ดัง เช่นที่ต้องเป็นเสมอมา. และ, ในที่สุด, ตราประทับ [host.Custom('GetTitleTierAdjective')|U] อันยิ่งใหญ่ก็เป็นของข้า"
THREE_SACRED_TREASURES_GLOSS: "เครื่องราชกกุธภัณฑ์แห่งญี่ปุ่น กล่าวกันว่าถูกนำมายังโลกโดยผู้พิชิตในตำนานของญี่ปุ่น บรรพบุรุษศักดิ์สิทธิ์แห่งองค์จักรพรรดิ สมบัติเหล่านี้เป็นตัวแทนของคุณธรรมหลักสามประการ: #EMP Ame-no-Murakumo-no-Tsurugi#! — 'ดาบสวรรค์แห่งเมฆาชุมนุม' — เป็นสัญลักษณ์ของความกล้าหาญ, กระจกสำริด #EMP ยาตะ โนะ Kagami#! สะท้อนถึงสติปัญญา, และอัญมณีรูปหยาดน้ำตา #EMP ยาซาคานิ โนะ Magatama#! เป็นอุดมคติแห่งความเมตตา"
coronation_events.6102.desc_high: "แต่... ข้าไม่ได้อยู่คนเดียว จากท่อระบายน้ำที่ต่ำที่สุดไปจนถึงหอคอยที่สูงที่สุด เสียงโห่ร้องดังสนั่นกึกก้องไปในอากาศ — ราวกับเสียงร้องของคนหลายพันคนกำลังทำลาย [host.Custom('ResidenceBuilding')] อันยิ่งใหญ่นี้ #EMP สั่นสะเทือนมันจนราบเป็นหน้ากลอง!#!\n\nข้าขึ้นครองบัลลังก์ไม่ใช่ในฐานะ [host.GetWomanMan] แต่ในฐานะ [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ไม่ใช่ในฐานะมนุษย์ปุถุชน แต่ — ดังที่ไพร่ฟ้าข้าแผ่นดินของข้าขับขานและร้องเพลง — เป็นของขวัญจาก [host.GetFaith.HighGodName] แก่ปวงชน [host.GetPrimaryTitle.GetAdjective] เป็นการวิงวอนต่อ [host.GetFaith.PositiveAfterLife]!"
coronation_events.6102.desc_low: "หนทางช่างยาวไกล... และเงียบงัน แต่ละย่างก้าวสะท้อนก้องดั่งหยดน้ำในห้วงลึกอันไร้ที่สิ้นสุด [anointer.GetName] พร้อมด้วยน้ำตาในดวงตาของนักบวช [anointer.GetHerHis] เริ่มต้นบทเพลงสวดอันเก่าแก่:\n\n"#EMP [host.GetFaith.random_GoodGodNames] โปรดช่วยเราด้วย! จากห้วงลึก จากความสิ้นหวัง: โปรดช่วยเหล่าลูกหลานแห่ง [host.GetPrimaryTitle.GetNameNoTier]! โปรดไว้ชีวิตเราเถิด โอ้ [host.GetFaith.HighGodName] ความอ้างว้างแห่ง [host.GetFaith.NegativeAfterLife]! ขอให้ [host.GetTitleAsNameNoTooltip|l] ของเราต่อต้านความชั่วร้ายของมนุษย์!#!"\n\nเบื้องหน้าการชุมนุมที่วุ่นวายนี้ ข้าขึ้นครองบัลลังก์"
coronation_events.6102.desc_mid: "คำอธิษฐานจากริมฝีปากของข้าผสมผสานกับเสียงสวดที่ดังขึ้น ไพร่ฟ้าข้าแผ่นดินและข้าอธิษฐานร่วมกัน: "#EMP [host.GetFaith.random_GoodGodNames] โปรดคุ้มครอง [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] นี้ภายใต้ [host.GetFaith.PositiveAfterLife] ตลอดไป บัดนี้และชั่วนิรันดร์! ตราบนานเท่านาน! โปรดอวยพร โอ้ [host.GetFaith.random_GoodGodNames] ความแข็งแกร่งแห่ง [host.GetTitleAsNameNoTooltip]!#!"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] ก้มคำนับต่ำ ข้าเข้าสู่ที่นั่งอันศักดิ์สิทธิ์ สถานที่แห่งอำนาจของข้า #EMP "ทรงพระเจริญ [host.GetFirstNameNoTooltipRegnal]!"#! ทุกคนโห่ร้อง "#EMP ด้วยประสงค์แห่ง [host.GetFaith.HighGodName] [host.GetTitleAsNameNoTooltip|l] ของเรา!#!""
