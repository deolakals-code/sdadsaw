 coronation_events.6110.desc_2: "ที่ข้าจะต้องสวมใส่ — ถูกชโลมด้วยพรแห่งคำอธิษฐาน [ROOT.Char.GetFaith.PriestNeuterPlural] เตรียมเครื่องประดับอันวิจิตรของข้าด้วยท่าทางตามพิธีกรรมและการวิงวอนต่อ"
