l_english: 
 coronation_events_klank.1001.t: "ฝูงชนผู้ศิวิไลซ์อย่างน่าสงสัย"
 coronation_events_klank.1001.desc: "เหล่าคนพาล คนจรจัด อสูรร้าย ล้วน แต่เป็น เช่นนั้น... วนเวียนดั่งอีแร้ง รอคอยจังหวะฉกชิงเนื้อของพวกมัน แต่พวกมันมิอาจรอดพ้นสายตาอันระแวดระวังของข้าได้\n\nนั่นปะไร พวกมันอยู่นั่น [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] [first_culture_char.GetFullName] เจ้าเล่ห์ของข้า แต่งกายด้วยอาภรณ์ [first_culture_char.GetCulture.GetName] อันวิจิตรที่สุด และ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] [second_culture_char.GetFullName] คดในข้องอในกระดูกของข้า ในเครื่อง แต่งกาย [second_culture_char.GetCulture.GetName] อันน่าทึ่งไม่แพ้กัน บทสนทนาอันไร้สาระ หรือแผนการร้ายที่กำลังก่อตัว?\n\nอย่างน้อย รูปโฉมอันฉูดฉาดของพวกมันก็ช่วย แต่งเติมสีสันให้วันนี้ ดั่งฝูงนกเจ้าเล่ห์"
 coronation_events_klank.1001.a: ""เจ้าทั้งสอง! คุกเข่าต่อหน้า [ROOT.Char.GetTitleAsNameNoTooltip] ของพวกเจ้า!""
 coronation_events_klank.1001.b: "พวกต่างแดนเหล่านั้นไม่สมควรได้รับความสนใจจากข้า"

 coronation_events_klank.1002.t: "ฝูงชนผู้ศิวิไลซ์อย่างน่าอัศจรรย์"
 coronation_events_klank.1002.desc: "[ROOT.Char.GetPrimaryTitle.GetName] นั้นกว้างใหญ่ไพศาลและเปี่ยมด้วยข้าแผ่นดินผู้ภักดีทุกหมู่เหล่า แน่นอนว่า ไม่ใช่ทุกคนที่ภักดีถึงเพียงนั้น แต่ก็มากพอที่จะสร้างความมั่นคงไปอีกหลายปี\n\nนั่นปะไร พวกเขากำลังสนทนากันอย่างลึกซึ้ง: แน่นอนว่า กำลังกล่าวถึงความเมตตาในการปกครองของข้า ความรุ่งเรืองแห่งอาณาจักรของข้า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] [first_culture_char.GetFullName] ผู้ภักดีของข้า แต่งกายด้วยอาภรณ์ [first_culture_char.GetCulture.GetName] อันวิจิตรที่สุด และ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] [second_culture_char.GetFullName] ผู้ที่ข้าไว้ใจ ในเครื่อง แต่งกาย [second_culture_char.GetCulture.GetName] อันน่าทึ่งไม่แพ้กัน\n\nรูปโฉมอันฉูดฉาดของพวกเขาช่วย แต่งเติมสีสันให้วันนี้ ดั่งฝูงวิหคอันงดงาม"
 coronation_events_klank.1002.a: "พยักหน้าให้พวกเขาเป็นการรับรู้"
 coronation_events_klank.1002.b: "ต้อนรับเหล่าผู้ทรงเกียรติอย่างจริงใจ"

 coronation_events_klank.1003.t: "รุ่งอรุณใหม่ คุกใต้ดินเก่า"
 coronation_events_klank.1003.desc: "อา, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_of_executee'))] [child_of_executee.GetName] ของข้า... นี่ไม่ใช่ครั้งแรกที่ [child_of_executee.GetHouse.GetName] มายืนอยู่เบื้องหน้า [ROOT.Char.GetHouse.GetName] โดยไม่แน่ใจในชะตากรรมของ [child_of_executee.GetHerHis]\n\n[executed_previous_holder.GetTitleAsNameNoTooltip] คนก่อนแห่ง [child_of_executee.GetPrimaryTitle.GetNameNoTier], [executed_previous_holder.GetFirstName], [executed_previous_holder.GetDeathReason] เหตุผลที่แท้จริงของการประหารนั้นถูกปิดตายในหลุมศพของ [executed_previous_holder.GetHerHis] นับตั้งแต่การตายของ [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('executor_ancestor'))] ข้า เป็นเวลาหลายปี แทนที่จะเป็นคติประจำตระกูล, #weak [child_of_executee.GetHouse.GetMotto]#!, ตระกูล [child_of_executee.GetHouse.GetNameNoTooltip] กลับมีความอัปยศและความโกรธแค้นเขียนไว้ด้วยเลือดบนธงของพวกเขา\n\nการปรากฏตัวของ [child_of_executee.GetFirstNamePossessiveNoTooltip] ในวันนี้ อาจมองได้ว่าเป็นการยอมจำนนอย่างนอบน้อม หรือเป็นการท้าทาย"
 coronation_events_klank.1003.a: ""ในฐานะ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] ที่ดี ข้าให้อภัยเจ้า""
 coronation_events_klank.1003.b: "ความกลัวฝังลึกอยู่ในสายเลือดของเรา"
 coronation_events_klank.1003.c: ""นี่คือการเริ่มต้นของประเพณีอันยอดเยี่ยม ทหาร!""

 coronation_events_klank.1004.t: "ฝูงชนผู้สวมมงกุฎ"
 coronation_events_klank.1004.desc.intro: "ช่างเป็นความปิติยินดียิ่งที่ได้เห็นสหายผู้ปกครองของข้า:"
 coronation_events_klank.1004.desc.intro_many_kings: "พิธีราชาภิเษกของข้าคือเหตุการณ์สำคัญแห่งปี แห่งทศวรรษอย่างแท้จริง! ช่างเป็นความปิติยินดียิ่งที่ได้เห็นสหายผู้ปกครองมากมายของข้า ในหมู่พวกเขามี:"
 coronation_events_klank.1004.desc.second_king: "[first_king.GetName] และ [second_king.GetName]."
 coronation_events_klank.1004.desc.third_king: "[first_king.GetName], [second_king.GetName] และ [third_king.GetName]."
 coronation_events_klank.1004.desc.fourth_king: "[first_king.GetName], [second_king.GetName], [third_king.GetName] และ [fourth_king.GetName]."
 coronation_events_klank.1004.desc.fifth_king: "[first_king.GetTitledFirstNameRegnal], [second_king.GetTitledFirstNameRegnal], [third_king.GetTitledFirstNameRegnal], [fourth_king.GetTitledFirstNameRegnal] และ [fifth_king.GetTitledFirstNameRegnal]."
 coronation_events_klank.1004.desc.extoll_reign_intent: "\n\nพวกเขาจะดูยอดเยี่ยมในระหว่างพิธีราชาภิเษกของข้า ยืนอยู่ด้านหลัง เป็นพยานต่อการขึ้นครองราชย์ #EMP ของข้า#! ด้วยว่ามีมงกุฎประดับอัญมณีมากมายบนโลกอันดีงามของ [ROOT.Char.GetFaith.HighGodNamePossessive] แต่จะมี [ROOT.Char.GetTitleAsNameNoTooltip] ที่แท้จริงเพียงหนึ่งเดียว"
 coronation_events_klank.1004.desc.empower_loyalists_intent: "\n\nแท้จริงแล้ว ข้ามิอาจหวังพยานในพิธีราชาภิเษกที่ดีกว่านี้ได้ ข้าเพียงต้องพูดคุยกับผู้ที่มีใจอบอุ่นให้ข้า และสร้างความสัมพันธ์อันยั่งยืนระหว่างราชสำนักของเรา"
 coronation_events_klank.1004.desc.other_intent: "\n\nแท้จริงแล้ว ข้ามิอาจหวังพยานในพิธีราชาภิเษกที่ดีกว่านี้ได้ ผลรวมของความมั่งคั่ง อำนาจ และความสง่างามที่เราร่วมกันนั้นหาที่เปรียบมิได้"
 coronation_events_klank.1004.desc.outro: "\n\nการปรากฏตัวของเหล่าประมุขเหล่านี้เป็นทั้งพรและโอกาส ความคู่ควรแห่งราชันของข้าจะถูกแสดงให้ประจักษ์ตั้งแต่วันแรกจนถึงวันสุดท้ายของการครองราชย์"
 coronation_events_klank.1004.a: "พวกเขาทั้งหมดจะอยู่ใต้ข้า"
 coronation_events_klank.1004.a_tt: "#weak [prestige|E] และ [legitimacy|E] ที่ได้รับจะแปรผันตามจำนวน [kings|E] และ [emperors|E] [independent|E] ที่เข้าร่วม [coronation|E] ของท่าน#!"
 coronation_events_klank.1004.b: ""ข้ายินดีที่พวกท่านทุกคนอยู่ที่นี่""
 coronation_events_klank.1004.c: "ข้าจะดีกว่าพวกเขา"
 coronation_events_klank.1004.d: ""ยินดีต้อนรับ สหายของข้า!""

 forced_to_kneel_opinion: "ถูกบังคับให้คุกเข่า"

 coronation_events_klank.1005.t: "เรื่องเล่าแห่งสงครามที่พ่ายแพ้"
 coronation_events_klank.1005.desc: "[friendly_king.GetName] ตะโกนใส่หูของ [npc_guest.GetNamePossessive] มาสักพักแล้ว\n\n"และข้าขอบอกท่านเลยว่า ไม่มีผู้ใดชั่วช้ายิ่งกว่า [unfriendly_king.GetName]! [war_memory.GetDescription] เพียง เพราะ [unfriendly_king.GetSheHe] ขายบุตรชายของ [unfriendly_king.GetHerHis] และอนาคตของ [unfriendly_king.GetPrimaryTitle.GetName] ให้กับ [friendly_king.GetFaith.DevilName]! แต่ข้ามีแผน! ข้าแค่ต้องการดาบดีๆ และพันธมิตร สักหนึ่ง สอง หรือสามคน และข้าจะล้างแค้น [unfriendly_king.GetHerHim]!"\n\nนี่ไม่ใช่ครั้งแรกของ [friendly_king.GetFirstNamePossessiveNoTooltip] ที่พูดถึงความอยุติธรรมที่ [friendly_king.GetHerHim] ได้รับอย่างแน่นอน แต่วันนี้... อาจเป็นครั้งสุดท้าย"
 coronation_events_klank.1005.a: "รับฟังเรื่องราวความทุกข์ระทมของ [friendly_king.GetHerHis]"
 coronation_events_klank.1005.b: ""ความยุติธรรมไม่ใช่สิ่งที่เจ้าจะอ้างสิทธิ์ได้""
 coronation_events_klank.1005.flavor: "เก็บดาบของท่านเสีย [friendly_king.GetTitledFirstNameNoTooltip] มันไม่เป็นผลดีต่อท่านเลย เพราะใจของท่านหนักอึ้ง และจิตใจของท่านก็มืดมัว"
 coronation_events_klank.1005.c: ""เราจะร่วมกันสอนบทเรียนที่มิอาจลืมเลือนให้ [unfriendly_king.GetHerHim]""
 coronation_events_klank.1005.c.tooltip: "#high ท่าน#! และ [friendly_king.GetShortUIName] อาจเรียกหากันเพื่อเข้าร่วม [war|E] ใดๆ ต่อต้าน [unfriendly_king.GetShortUIName] เป็นเวลา #high 6 ปี#!"
 coronation_events_klank.1005.c.vengeful: ""ไม่มีผู้ใดเข้าใจท่านได้ดีกว่านี้อีกแล้ว การล้างแค้นจะเป็นของเรา!""
 coronation_events_klank.1005.other_player_informed_tt: "[unfriendly_king.GetTitledFirstName] จะได้รับแจ้งเกี่ยวกับผลลัพธ์นี้"
 coronation_events_klank.1005.d: ""ข้ายินดีที่ท่านมีหูของ [npc_guest.GetFirstNamePossessiveNoTooltip] #EMP ตลอด. ทั้ง. สัปดาห์.#!""

 coronation_events_klank.1006.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 coronation_events_klank.1006.desc: "ข้ามีความยินดีที่จะแจ้งให้ท่านทราบว่า ในระหว่างพิธีราชาภิเษกของ [coronation_host.GetHerHis] [coronation_host.GetName] ผู้รุ่งโรจน์ ได้โน้มน้าวให้ [friendly_king.GetName] ล้มเลิกภารกิจล้างแค้นอันผิดพลาดของ [friendly_king.GetHerHis] หลังจากชัยชนะอันชอบธรรมของท่านใน [war_memory.GetName]"
 coronation_events_klank.1006.a: "น่าสนใจ"

 coronation_events_klank.1007.t: "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 coronation_events_klank.1007.desc: "ข้าเสียใจที่ต้องแจ้งให้ท่านทราบว่า ในระหว่าง [coronation_activity.GetName] ของ [coronation_host.GetName] [coronation_host.GetSheHe] และ [friendly_king.GetName] ได้ทำข้อตกลงที่จะเข้าร่วมกองกำลังต่อต้านท่าน เพื่อรับใช้ภารกิจล้างแค้นอันผิดพลาดของ [friendly_king.GetTitledFirstNamePossessiveNoTooltip] หลังจากชัยชนะอันชอบธรรมของท่านใน [war_memory.GetName]"
 coronation_events_klank.1007.a: "น่ากังวล"

 coronation_events_klank.1008.t: "[dynasty_king.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetDynasty.GetNameNoTooltip]"
 coronation_events_klank.1008.desc.friendly: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] ผู้ยิ่งใหญ่ของข้า ได้ละทิ้งที่นั่งอันแสนสุขสบายใน [dynasty_king.GetPrimaryTitle.GetName] เพื่อเฉลิมฉลองพิธีราชาภิเษกของข้า การปรากฏตัวของ [dynasty_king.GetHerHis|U] ที่นี่เป็นสัญญาณของการสนับสนุน ความไว้วางใจ และสายสัมพันธ์แห่งสายเลือดที่มีร่วมกัน"
 coronation_events_klank.1008.desc.hostile: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] [ROOT.Char.Custom('InsultAdjective')] ของข้า ได้เลื้อยคลานออกมาจากรังอันน่ารังเกียจของ [dynasty_king.GetHerHis] ใน [dynasty_king.GetPrimaryTitle.GetName] เพื่อมาทำลายพิธีราชาภิเษกของข้าอย่างแน่นอน การปรากฏตัวของ [dynasty_king.GetHerHis|U] ที่นี่เป็นภาพที่น่าตกตะลึง ด้วยว่าไม่มีมนุษย์ผู้ใดที่ห่างไกลจากความสูงส่งของข้าเท่านี้อีกแล้ว นอกจากสายเลือดแล้ว ก็ไม่มีสิ่งใดที่ผูกพันเราไว้"
 coronation_events_klank.1008.desc.neutral: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] ของข้า ได้เดินทางมาจาก [dynasty_king.GetPrimaryTitle.GetName] เพื่อเป็นพยานในพิธีราชาภิเษกของข้า"
 coronation_events_klank.1008.desc.outro: "\n\n#EMP "[ROOT.Char.GetHouse.GetMotto]"#!, ถ้อยคำเหล่านี้ได้นำทาง [ROOT.Char.GetDynasty.GetName] มาหลายชั่วอายุคน บรรพบุรุษของเราได้ยึดถือมันฝ่าฟันอุปสรรคนานัปการ ไม่ว่าจะร่วมกันหรือลำพัง มันก็ขึ้นอยู่กับข้าและ [dynasty_king.GetTitledFirstName] ที่จะสืบสานมันต่อไป"
 coronation_events_klank.1008.a: "ข้ามีความยินดียิ่งที่ได้พบท่านที่นี่"
 coronation_events_klank.1008.b: "$coronation_events_klank.1008.a$"
 coronation_events_klank.1008.c: "ยินดีต้อนรับ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] ของข้า"
 coronation_events_klank.1008.d: "$coronation_events_klank.1008.c$"
 coronation_events_klank.1008.e: "ท่านจะเป็นพยานในการขึ้นครองราชย์ของ [ROOT.Char.GetDynasty.GetNameNoTooltip] ที่แท้จริง"
 coronation_events_klank.1008.f: "คุกเข่า! มิฉะนั้นจะเหลือ [dynasty_king.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetDynasty.GetNameNoTooltip] น้อยลงหนึ่งคน"
 coronation_events_klank.1008.g: "ข้าคือ [ROOT.Char.GetDynasty.GetNameNoTooltip] ที่แท้จริง"
 happened_because_intent_tt: "#EMP #low เหตุการณ์นี้เกิดขึ้นเพราะเจตนา [THIS.Char.GetInvolvedActivityIntent.GetName] ของท่าน#!#!"


 coronation_events_klank.1009.t: "ในห้วงเวลาแห่งการต่อสู้ดิ้นรน"
 coronation_events_klank.1009.desc: "[left_struggle.GetName] และ [right_struggle.GetName] ถกเถียงกันอย่างดุเดือดมาหลายวันแล้ว ช่วงเวลาช่างยากลำบาก: ทั้งอาณาจักร ทั้งภูมิภาค ถูกกลืนกินด้วยการต่อสู้ดิ้นรนที่ยาวนานหลายทศวรรษ\n\n"เหล่า [first_struggle_faith.GetAdherentNamePlural] กำลังรอโอกาสที่จะโจมตี [right_struggle.GetFaith.GetAdherentNamePlural] ในขณะที่ [first_struggle_culture.GetCollectiveNoun] ยืนดูอยู่เฉยๆ! [host.GetTitledFirstName] มิอาจผ่านพ้นอุปสรรคนี้ไปได้!"\n\n[right_struggle.GetTitledFirstName] หยุดหายใจชั่วครู่ ขณะที่ [left_struggle.GetTitledFirstName] รวบรวมความคิดเพื่อโต้กลับ ช่างเป็นช่วงเวลาที่เหมาะเจาะสำหรับข้าที่จะสอดแทรก"
 coronation_events_klank.1009.a: ""[char_struggle.GetNameNoTooltip] รอได้ คืนนี้ จงเพลิดเพลินกับพิธีราชาภิเษกของข้า""
 coronation_events_klank.1009.b: ""เงียบซะ ผู้บ่อนทำลาย""
 coronation_events_klank.1009.c: ""ในยาม [char_struggle.GetCurrentPhase.GetNameNoTooltip] เราสนับสนุน [host.GetTitledFirstNameNoTooltip]""
 coronation_events_klank.1009.d: ""[host.GetTitledFirstNameNoTooltip] อ่อนแอเกินไปสำหรับยาม [char_struggle.GetCurrentPhase.GetNameNoTooltip]""
 coronation_events_klank.1009.e: ""พวกเจ้าผิดทั้งคู่""

 coronation_guest_struggle_support_log_title: "การสนับสนุนในยามต่อสู้ดิ้นรน"
