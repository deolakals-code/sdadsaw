 coronation_guest_struggle_undermine_log_title: "ความขัดแย้งในยามต่อสู้ดิ้นรน"
 coronation_guest_struggle_undermine_log: "[CHARACTER.GetTitledFirstName|U] ได้แสดงความไม่ไว้วางใจของ [CHARACTER.GetHerHis] ต่อ [TARGET_CHARACTER.GetTitledFirstName] ในยามยากลำบากนี้ต่อสาธารณะ"

 ach_enlightened_centrist: "ย่อมมีทางที่สามเสมอ"
 ach_enlightened_centrist_desc: "ตัวละครนี้พยายามหาทางสายกลาง แม้ว่ามันจะไม่เป็นที่พอใจของผู้คนรอบข้าง"

 coronation_events_klank.1010.t: "ชะตากรรมแห่งเปอร์เซีย"
 coronation_events_klank.1010.desc.intro_detractor: "ช่างเป็นวันที่ดีใน [location.GetName] อันรุ่งโรจน์, ห่างไกลจาก [caliph.GetName] [caliph.Custom('InsultAdjective')] [ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] จะรุ่งเรืองอย่างแท้จริงได้ หากมิใช่ เพราะ [caliph.Custom('InsultNoun')] [caliph.Custom('InsultAdjective')] ผู้นั้น.\n\n"
 coronation_events_klank.1010.desc.intro_supporter: "ช่างเป็นวันที่ดีใน [location.GetName] อันรุ่งโรจน์ ได้รับพรจาก [ROOT.Char.GetFaith.HighGodName] ได้รับพรจาก [caliph.GetName] [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetPrimaryTitle.GetNameNoTier] จะรุ่งเรืองอย่างแท้จริงหาก [ROOT.Char.GetFaith.GetAdherentName] ทุกคนตระหนักถึงปัญญาและศรัทธาอันแก่กล้าของ [caliph.GetTitleAsNameNoTooltip] ดัง เช่นที่ข้าเป็น\n\n"
 coronation_events_klank.1010.desc.intro_caliph: "ช่างเป็นวันที่ดีใน [location.GetName] อันรุ่งโรจน์ โดยมีพิธีราชาภิเษก [ROOT.Char.Custom('ComplimentAdjective')] ของ [caliph.GetNamePossessive] ใกล้เข้ามา [ROOT.Char.GetPrimaryTitle.GetName|U] จะรุ่งเรืองอย่างแท้จริงหาก [ROOT.Char.GetFaith.GetAdherentName] ทุกคนตระหนักถึงปัญญาและศรัทธาอันแก่กล้าของ [caliph.GetTitleAsNameNoTooltip] ดัง เช่นที่ข้าเป็น\n\n"
 coronation_events_klank.1010.desc.mid_supporter: ""หนึ่งในผู้บ่อนทำลายของ [caliph.GetHerHis] ได้ลอบเข้ามาในพิธีราชาภิเษกนี้และพร่ำเพ้ออย่างไม่ปะติดปะต่อเกี่ยวกับเล่ห์อุบายของ [struggle_participant.GetFaith.DevilName] อนาคตของเปอร์เซีย ปัญญาของ [struggle_participant.GetFaith.HighGodName] และกลิ่นหอมอันน่าภิรมย์ของเท้า [caliph.GetTitleAsNamePossessiveNoTooltip] "
 coronation_events_klank.1010.desc.mid_detractor: "หนึ่งในผู้สนับสนุนของ [caliph.GetHerHis] ได้ลอบเข้ามาในพิธีราชาภิเษกนี้และพร่ำเพ้ออย่างไม่ปะติดปะต่อเกี่ยวกับเล่ห์อุบายของ [struggle_participant.GetFaith.DevilName] อนาคตของเปอร์เซีย ปัญญาของ [struggle_participant.GetFaith.HighGodName] และกลิ่นเท้าของ [caliph.GetTitleAsNamePossessiveNoTooltip] "
 coronation_events_klank.1010.outro: "เอาล่ะ ถึงเวลาที่ข้าต้อง ทำให้ [struggle_participant.GetHerHim] เข้าใจให้ถูกต้อง\n\n"สันติสุขจงมีแด่ท่าน [struggle_participant.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l] การเห็นหน้าท่าน ทำให้ข้าเจ็บปวด [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l] ท่านต้อง...""
 coronation_events_klank.1010.a: ""จงทิ้งความเชื่อผิดๆ ของท่านเสีย""
 coronation_events_klank.1010.b: ""จงรู้ไว้ว่า [persian_struggle.GetCurrentPhase.GetName] นั้นขัดแย้งต่อ [ROOT.Char.GetHouse.GetName]""
 coronation_events_klank.1010.c: ""จงยอมรับว่าการผ่อนปรนเป็นหนทางเดียวที่เป็นไปได้""
 coronation_events_klank.1010.d: ""คุกเข่าต่อหน้าเคาะลีฟะฮ์ที่แท้จริง!""
 coronation_events_klank.1010.e: ""ออกไปคร่ำครวญข้างนอกซะ!""
 coronation_events_klank.1010.b.catalyst_unrest: "ท่านจะเปิดใช้งาน [struggle_catalyst|E] ไปสู่ [struggle_persia_phase_unrest|E]"
 coronation_events_klank.1010.b.catalyst_concession: "ท่านจะเปิดใช้งาน [struggle_catalyst|E] ไปสู่ [struggle_persia_phase_concession|E]"
 coronation_events_klank.1010.b.catalyst_stabilization: "ท่านจะเปิดใช้งาน [struggle_catalyst|E] ไปสู่ [struggle_persia_phase_stabilisation|E]"

 coronation_events_klank.1011.t: "ความกว้างใหญ่ไพศาลของ [ROOT.Char.GetPrimaryTitle.GetName]"
 coronation_events_klank.1011.desc: "ดินแดนภายใต้การปกครองของข้าแทบจะไร้ที่สิ้นสุด และความทะเยอทะยานของข้าก็ เช่นกัน เหล่าข้าหลวงที่ทรงอำนาจที่สุดของข้าอยู่ที่นี่: [first_char.GetTitledFirstName], [second_char.GetTitledFirstName] และ [third_char.GetTitledFirstName] ทั้งหมดพร้อมที่จะคุกเข่าต่อหน้าข้า ทั้งหมดรอคอยวิสัยทัศน์ของข้าสำหรับอนาคตของเรา การครองราชย์ของข้าจะกำหนดทิศทาง [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ทั้งหมดไปอีกหลายทศวรรษ หลายชั่วอายุคน นี่คือช่วงเวลาที่เหมาะที่สุดที่จะประกาศความทะเยอทะยานอันยิ่งใหญ่ในฐานะประมุข\n\nแม้จะไม่เป็นที่นิยม การรวบอำนาจเข้าสู่ศูนย์กลางอาณาจักรอาจมอบดาบอันทรงพลังในมือข้า และทองคำในกระเป๋าข้า แต่เหล่าข้าหลวงของข้า หากได้รับเอกราชและทรัพยากร ก็อาจเป็นโล่อันแข็งแกร่งและปกป้องข้าจากภัยคุกคาม..."
 coronation_events_klank.1011.a: "ข้าคือ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 coronation_events_klank.1011.a.custom_tooltip: "@alert_icon! ท่านจะเริ่มกระบวนการรวมศูนย์อำนาจ. หลังจาก #V 10#! ปี, ท่านจะเก็บเกี่ยวผลตอบแทน:\n$EFFECT_LIST_BULLET$เพิ่ม [development_i][development|E] ใน [domain|E] ของท่าน\n$EFFECT_LIST_BULLET$ลด [development_i][development|E] ใน [domains|E] ของ [vassals|E]\n$EFFECT_LIST_BULLET$การเปลี่ยนแปลงขึ้นอยู่กับ [skills|E] [stewardship_i][stewardship|E] และ [learning_i][learning|E] ของท่าน"
 custom.ten_most_powerful_vassals: "ข้าหลวงที่ทรงอำนาจที่สุดสิบคนของท่านที่เข้าร่วมพิธีราชาภิเษก"
 coronation_events_klank.1011.a.county_modifier: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะได้รับ [modifier|E] [GetModifier('ach_realm_centralization_county_lvl_1').GetNameWithTooltip] เป็นเวลา 10 ปี"
 custom.coronation_events_klank.1011.a.disrespect: "[vassals|E] #V ผู้บ่อนทำลาย#! ของท่าน ที่ได้รับผลกระทบจากแผนของท่าน"
 custom.coronation_events_klank.1011.a.respect: "[vassals|E] อื่นๆ ของท่าน ที่ได้รับผลกระทบจากแผนของท่าน"
 coronation_events_klank.1011.b: "หากปราศจากข้าหลวงที่เข้มแข็ง ข้าก็ไม่มีอะไรเลย"
 coronation_events_klank.1011.b.custom_tooltip: "@alert_icon! ท่านจะเริ่มกระบวนการกระจายอำนาจและเพิ่มการปกครองตนเอง. หลังจาก #V 10#! ปี, ท่านจะเก็บเกี่ยวผลตอบแทน:\n$EFFECT_LIST_BULLET$เพิ่ม [development_i][development|E] ใน [domains|E] ของ [vassals|E]\n$EFFECT_LIST_BULLET$การเปลี่ยนแปลงขึ้นอยู่กับทักษะ [stewardship_i][stewardship|E] และ [diplomacy_i][diplomacy|E] ของท่าน"
 coronation_events_klank.1011.b.county_modifier: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะได้รับ [modifier|E] [GetModifier('ach_realm_autonomy_county_lvl_1').GetNameWithTooltip] เป็นเวลา 10 ปี"
 custom.coronation_events_klank.1011.b.disrespect: "$custom.coronation_events_klank.1011.a.disrespect$"
 custom.coronation_events_klank.1011.b.respect: "$custom.coronation_events_klank.1011.a.respect$"
 coronation_events_klank.1011.c: "อาณาจักรของข้าดีอยู่แล้วอย่างที่มันเป็น"

 coronation_events_klank.1012.t: "แผนการรวบอำนาจสู่ศูนย์กลางอันยิ่งใหญ่ของ [host.GetTitledFirstNamePossessive]"
 coronation_events_klank.1012.desc: "ระหว่างพิธีราชาภิเษกของ [host.GetHerHis], [host.GetName] ได้ประกาศแผนการอันยิ่งใหญ่และทะเยอทะยานที่จะเสริมสร้างความแข็งแกร่งให้อาณาจักรโดยมุ่งเน้นไปที่แกนกลางของ [host.GetPrimaryTitle.GetName], ซึ่งบังเอิญเป็นโดเมนส่วนตัวของ [host.GetTitledFirstNamePossessive] ทรัพยากรที่จำเป็นย่อมต้องมาจากที่ใดที่หนึ่ง, เพราะไม่มีสิ่งใดในโลกนี้ที่อุดมสมบูรณ์อย่างแท้จริงนอกจากพระคุณของ [ROOT.Char.GetFaith.HighGodName] ดังนั้น, สิ่งนี้จึงต้องแลกมาด้วยการสูญเสียของพื้นที่รอบนอก, เช่น โดเมนของข้าเอง!\n\nการอาศัยอยู่ในอาณาจักรที่ทรงอำนาจ, ภายใต้ [host.GetTitleAsNameNoTooltip] ผู้ทรงอำนาจ, ก็มีข้อดีของมัน — แต่จะเกิดอะไรขึ้นหากอำนาจนี้ถูกใช้อย่างไม่ถูกต้องในอนาคต, ใช้เพื่อต่อต้านข้า? [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ที่แข็งแกร่งคือสาเหตุแห่งความภาคภูมิใจ... และ, บางที, อาจเป็นความกังวล"
 coronation_events_klank.1012.a: "ข้าคือผู้รับใช้ที่ถ่อมตนที่สุดของ [host.GetTitledFirstNamePossessive]"
 coronation_events_klank.1012.b: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] สามารถอยู่รอดได้โดยไม่ต้องมีความคิดของ [host.GetTitleAsNamePossessiveNoTooltip]"
 coronation_events_klank.1012.b.desc: "[domain|E] ของท่านจะไม่ถูกลด [development|E] ใน 10 ปี"
 coronation_events_klank.1012.ten_year_plan: "หลังจาก 10 ปี [development|E] ของ [domains|E] ของท่านและ [vassals|E] เพื่อนของท่านจะลดลง ในขณะที่ [liege|E] ของท่านจะได้รับประโยชน์ การเปลี่ยนแปลงที่แท้จริงขึ้นอยู่กับทักษะ [stewardship|E] และ [learning|E] ของ [liege|E] ท่าน"

 coronation_events_klank.1013.t: "แผนการกระจายอำนาจอันยิ่งใหญ่ของ [host.GetTitledFirstNamePossessive]"
 coronation_events_klank.1013.desc: "ระหว่างพิธีราชาภิเษกของ [host.GetHerHis], [host.GetName] ได้ประกาศแผนการอันยิ่งใหญ่และทะเยอทะยานที่จะเสริมสร้างความแข็งแกร่งให้อาณาจักรโดยมุ่งเน้นไปที่พื้นที่รอบนอกของ [host.GetPrimaryTitle.GetNamePossessive], ซึ่ง รวมถึงโดเมนของข้าด้วย ทรัพยากรที่จำเป็นย่อมต้องมาจากที่ใดที่หนึ่ง, เพราะไม่มีสิ่งใดในโลกนี้ที่อุดมสมบูรณ์อย่างแท้จริงนอกจากพระคุณของ [ROOT.Char.GetFaith.HighGodName] [host.GetTitleAsNameNoTooltip] ได้เสนออย่างกรุณาที่จะแบ่งปันความมั่งคั่งจากโดเมนของ [host.GetHerHis] ให้กับทั่วทั้งอาณาจักร"
 coronation_events_klank.1013.a: "$coronation_events_klank.1012.a$"
 coronation_events_klank.1013.b: "$coronation_events_klank.1012.b$"
 coronation_events_klank.1013.b.desc: "[domain|E] ของท่านจะไม่ถูกเพิ่ม [development|E] ใน 10 ปี"
 coronation_events_klank.1013.ten_year_plan: "หลังจาก 10 ปี [development|E] ของ [domains|E] ของท่านและ [vassals|E] เพื่อนของท่านจะเพิ่มขึ้น การเปลี่ยนแปลงที่แท้จริงขึ้นอยู่กับทักษะ [stewardship|E] และ [diplomacy|E] ของ [liege|E] ท่าน"

 coronation_events_klank.1014.t: "การรวบอำนาจสู่ศูนย์กลาง [ROOT.Char.GetPrimaryTitle.GetName]: บทสรุป"
 coronation_events_klank.1014.desc: "สิบปีที่แล้ว ในพิธีราชาภิเษกของข้า ข้าได้กำหนดเส้นทางสำหรับ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] ผ่านความเจ็บปวดและความยากลำบาก ความมั่งคั่งได้หลั่งไหลเข้าสู่โดเมนของข้าโดยตรง ในขณะที่ข้าหลวงของข้าต้องทนทุกข์ แต่มันก็คุ้มค่า\n\nบัดนี้ถึงเวลาเก็บเกี่ยวผลตอบแทนจากการดูแลของข้า และจากความเฉียบแหลมที่ข้าได้บรรลุวิสัยทัศน์อันยิ่งใหญ่"
 coronation_events_klank.1014.county_effect: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะถูกลด [development|E] ลง 20%"
 coronation_events_klank.1014.a: "ยอดเยี่ยม!"
 coronation_events_klank.1014.b: "นี่ยังไม่สิ้นสุด"
 coronation_events_klank.1014.development_gain: "การปฏิรูปของท่านได้ริบ [development|E] ไปจาก [domains|E] ของ [vassal|E] ของท่าน, รวมทั้งสิ้น #P [ROOT.Char.MakeScope.Var('development_lost').GetValue]#! [skills|E] [stewardship|E] และ [learning|E] ของท่าน ช่วยให้ท่านสามารถแจกจ่าย #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! ของมันใน [domain|E] ของท่าน"
 custom.ten_most_powerful_vassals.1014: "[vassals|E] ที่อยู่ภายใต้การปฏิรูปของท่าน:"
 coronation_events_klank.1014.b.county_effect: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะได้รับ [modifier|E] [GetModifier('ach_realm_centralization_county_lvl_2').GetNameWithTooltip] เป็นเวลา 10 ปี"

 coronation_events_klank.1015.t: "การกระจายอำนาจ [ROOT.Char.GetPrimaryTitle.GetName]: บทสรุป"
 coronation_events_klank.1015.desc: "สิบปีที่แล้ว ในพิธีราชาภิเษกของข้า ข้าได้กำหนดเส้นทางสำหรับ [ROOT.Char.GetPrimaryTitle.GetNameNoTier] เหล่าข้าหลวงของข้าได้เจริญรุ่งเรือง เนื่องจากนโยบายอันชาญฉลาดของข้า ในขณะที่โดเมนของข้าเองกลับไม่ได้รับการพัฒนา แต่มันก็คุ้มค่า\n\nบัดนี้ถึงเวลาเก็บเกี่ยวผลตอบแทนจากการดูแลของข้า ความเฉียบแหลมของข้า และการทูตอันคล่องแคล่วที่บรรลุวิสัยทัศน์อันยิ่งใหญ่ของข้า"
 coronation_events_klank.1015.county_effect: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะได้รับ [development|E] เพิ่มขึ้น #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#!, เนื่องจาก [skills|E] [stewardship|E] และ [diplomacy|E] ของท่าน"
 coronation_events_klank.1015.a: "$coronation_events_klank.1014.a$"
 coronation_events_klank.1015.b: "$coronation_events_klank.1014.b$"
 custom.ten_most_powerful_vassals.1015: "$custom.ten_most_powerful_vassals.1014$"
 coronation_events_klank.1015.b.county_effect: "ทุก [county|E] ใน [domain|E] ของพวกเขาจะได้รับ [modifier|E] [GetModifier('ach_realm_autonomy_county_lvl_2').GetNameWithTooltip] เป็นเวลา 10 ปี"

 ach_realm_centralization_vassal_lvl_1: "การปฏิรูปรวบอำนาจ: แบกรับภาระ"
 ach_realm_centralization_vassal_lvl_1_desc: "ข้าหลวงนี้เป็นผู้ใต้บังคับบัญชาในการปฏิรูปรวบอำนาจของนายเหนือหัวสูงสุด"
 ach_realm_centralization_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_centralization_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
 ach_realm_centralization_county_lvl_1: "การปฏิรูปรวบอำนาจ: แหล่งทรัพยากร"
 ach_realm_centralization_county_lvl_1_desc: "เคาน์ตีนี้กำลังแบกรับภาระการปฏิรูปรวบอำนาจของนายเหนือหัวสูงสุด ทรัพยากรที่ปกติใช้สำหรับการพัฒนาท้องถิ่น บัดนี้กำลังหลั่งไหลไปยังเมืองหลวง"
 ach_realm_centralization_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_centralization_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_centralization_liege_lvl_1: "การปฏิรูปรวบอำนาจ: สถาปนิกผู้ยิ่งใหญ่"
 ach_realm_centralization_liege_lvl_1_desc: "ตัวละครนี้มีวิสัยทัศน์อันยิ่งใหญ่สำหรับอนาคตของอาณาจักร ไม่ว่าจะต้องแลกด้วยอะไร หรือเหล่าข้าหลวงที่แบกรับภาระจะคิดอย่างไร ทักษะการดูแลและการเรียนรู้ของพวกเขาจะเป็นผู้ตัดสินผลลัพธ์ของการปฏิรูป"
 ach_realm_centralization_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_centralization_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_realm_autonomy_vassal_lvl_1: "การปฏิรูปกระจายอำนาจ: ผู้รับผลประโยชน์"
 ach_realm_autonomy_vassal_lvl_1_desc: "ข้าหลวงนี้เป็นผู้ใต้บังคับบัญชาในการปฏิรูปกระจายอำนาจของนายเหนือหัวสูงสุด"
 ach_realm_autonomy_vassal_lvl_2: "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_autonomy_vassal_lvl_2_desc: "$ach_realm_autonomy_vassal_lvl_1_desc$"
 ach_realm_autonomy_county_lvl_1: "การปฏิรูปกระจายอำนาจ: เป้าหมาย"
 ach_realm_autonomy_county_lvl_1_desc: "เคาน์ตีนี้เป็นเป้าหมายของการปฏิรูปกระจายอำนาจของนายเหนือหัวสูงสุด ทรัพยากรที่ปกติหลั่งไหลไปยังเมืองหลวง บัดนี้กำลังถูกแบ่งปันกับเหล่าข้าหลวง"
 ach_realm_autonomy_county_lvl_2: "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_autonomy_county_lvl_2_desc: "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_autonomy_liege_lvl_1: "การปฏิรูปกระจายอำนาจ: สถาปนิกผู้ยิ่งใหญ่"
 ach_realm_autonomy_liege_lvl_1_desc: "ตัวละครนี้มีวิสัยทัศน์อันยิ่งใหญ่สำหรับอนาคตของอาณาจักร ที่ ซึ่งทุกมุมเมืองจะงดงามดัง เช่นเมืองหลวง ทักษะการดูแลและการทูตของพวกเขาจะเป็นผู้ตัดสินผลลัพธ์ของการปฏิรูป"
 ach_realm_autonomy_liege_lvl_2: "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_autonomy_liege_lvl_2_desc: "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_no_reforms_modifier: "อาณาจักรอันยิ่งใหญ่"
 ach_no_reforms_modifier_desc: "อาณาจักอันกว้างใหญ่ไพศาลของตัวละครนี้ถือว่าสมบูรณ์แบบอย่างที่มันเป็น โดยไม่จำเป็นต้องมีการปฏิรูปใดๆ ผู้ปกครองสามารถผ่อนคลายและเพลิดเพลินกับความงดงามของมันได้"

 coronation_events_klank.1016.t: "[host.Custom('GirlBoy')|U] ผู้กลายมาเป็น [host.GetTitleAsNameNoTooltip]"
 coronation_events_klank.1016.desc: "[teller.GetName] จบเรื่องเล่าอันแปลกประหลาดของ [teller.GetHerHis] เกี่ยวกับ [supporter.Custom('GetRandomRegionalBird')] ที่กำลังเล่นกับ [supporter.Custom('RandomWeirdObject')] บนซาก [supporter.Custom('RegionalFarmAnimal')] [listener.GetName] ดูเหมือนจะเพลิดเพลินอยู่ห่างๆ\n\nถึงตาข้าแบ่งปันเรื่องเล่าบ้าง และข้ามีเรื่องที่สมบูรณ์แบบ ข้าจะเล่าให้พวกเขาฟังเมื่อ [memory.GetDescription] เมื่อครั้งที่เจ้าภาพผู้เมตตาของเรายังเป็นเพียงเด็ก"
 coronation_events_klank.1016.desc.supporter: "เพราะเป็นที่ชัดเจนว่า [host.GetTitledFirstName] ถูกกำหนดมาเพื่อความยิ่งใหญ่เสมอ และสักวันหนึ่งเราจะได้เป็นพยานในการขึ้นครองบัลลังก์ของ [host.GetHerHis]"
 coronation_events_klank.1016.desc.detractor: "เพราะเป็นที่ชัดเจนว่า [host.GetTitledFirstName] ถูกกำหนดมาเพื่อสิ่งอื่นใดนอกจากบัลลังก์ วิบัติจงเกิดแก่ข้าแผ่นดินในอนาคตของ [host.GetHerHis] ทั้งปวง"
 coronation_events_klank.1016.a: ""[host.GetTitleAsNameNoTooltip] ผู้ไม่คู่ควร ตั้งแต่เยาว์วัย""
 coronation_events_klank.1016.b: ""[host.GetTitleAsNameNoTooltip] ผู้คู่ควร ตั้งแต่เยาว์วัย""
 coronation_events_klank.1016.c: "ที่จริงแล้ว ข้าจะพูดถึง แต่ตัวเองเท่านั้น"
 coronation_events_klank.1016.d: "ข้าจะเล่ามันตามที่เกิดขึ้นจริง"
custom.every_king_plus_attendee: "[activity_guest|E] ทุกคนที่มี [title_tier|E] [king|E] หรือสูงกว่า"
