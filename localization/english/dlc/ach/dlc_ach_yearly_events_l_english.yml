l_english: 

 ach_yearly_events.1001.t: "เรื่องการคลัง"
 ach_yearly_events.1001.desc: "ในฐานะ [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] แห่งนายเหนือหัวของข้า [liege.GetTitledFirstName] จึงเป็นหน้าที่ของข้าที่จะถวายคำแนะนำ [liege.GetHerHim] เกี่ยวกับการจัดการคลัง ส่วนสำคัญส่วนหนึ่งคือการอธิบายข้อดีและข้อเสียของพฤติกรรมการใช้จ่ายบางอย่าง\n\n"บอกข้าอีกทีสิ" [liege.GetSheHe] ตรัสถาม "ข้อเสีย #EMP ที่แท้จริง#! ของการออมเงินของอาณาจักรคืออะไรกัน? แน่นอนว่า มันย่อมดีมิใช่หรือที่จะเก็บออมไว้ใช้ในยามยาก?"\n\nอืม. [liege.GetSheHe|U] ตรัสมิได้ผิด แต่มันเป็นมุมมองที่เรียบง่ายเกินไปนัก..."
 ach_yearly_events.1001.a: ""หากพระองค์มิทรงแน่ใจ #EMP ข้า#! ขอจัดการให้พระองค์เอง...""
 ach_yearly_events.1001.a.success: "[liege.GetFirstNameNoTooltip] ทรงมอบเหรียญให้ด้วยความยินดี"
 ach_yearly_events.1001.a.failure: "[liege.GetFirstNameNoTooltip] ทรงสงสัยในแผนการของเจ้า"
 ach_yearly_events.1001.b: "การระมัดระวังเป็นแนวทางปฏิบัติที่ถูกต้องแล้ว"
 ach_yearly_events.1001.c: "[liege.GetTitleAsNameNoTooltip] สมควรมีชีวิตที่ดี!"
 ach_yearly_events.1001.d: "บางทีแนวทางที่สมดุลอาจดีที่สุดกระมัง?"
 ach_yearly_events.1001.d.success: "[liege.GetFirstNameNoTooltip] ทรงชื่นชมในความรอบคอบของเจ้า"
 ach_yearly_events.1001.d.failure: "[liege.GetFirstNameNoTooltip] ทรงเย้ยหยันความเป็นกลางของเจ้า"

 ach_fence_sitter_modifier: "ผู้โลเล"
 ach_fence_sitter_modifier_desc: "ตัวละครนี้เป็นที่รู้จักดีในเรื่องความลังเลไม่ตัดสินใจ และมีชื่อเสียงฉาวโฉ่ในด้านการปฏิเสธที่จะผูกมัดตนเอง"
 ach_spending_advice_modifier: "คำแนะนำการใช้จ่าย"
 ach_spending_advice_modifier_desc: "ตัวละครนี้เชี่ยวชาญในการให้คำแนะนำทางการเงินที่หลักแหลม"
 ach_cautious_spender_modifier: "นักใช้จ่ายผู้ระมัดระวัง"
 ach_cautious_spender_modifier_desc: "ตัวละครนี้กุมบังเหียนถุงเงินไว้แน่น"
 ach_extravagant_spender_modifier: "นักใช้จ่ายฟุ่มเฟือย"
 ach_extravagant_spender_modifier_desc: "ตัวละครนี้ใช้จ่ายอย่างหรูหราฟุ่มเฟือย ในยามที่จำเป็น"
 ach_budgeting_mentor_modifier: "ที่ปรึกษาด้านงบประมาณ"
 ach_budgeting_mentor_modifier_desc: "ตัวละครนี้เป็นผู้เชี่ยวชาญด้านการคลังที่รู้จักกันดี สามารถสอนผู้อื่นถึงวิธีใช้เหรียญของตนอย่างชาญฉลาดที่สุด"
 ach_balanced_budget_modifier: "งบประมาณสมดุล"
 ach_balanced_budget_modifier_desc: "ตัวละครนี้ได้รับประโยชน์จากการเงินที่บริหารจัดการเป็นอย่างดี"

 ach_yearly_events.1002.t: "แหล่งซ่องสุมหนู"
 ach_yearly_events.1002.desc: "ในฐานะ [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] แห่ง [liege.GetPrimaryTitle.GetNameNoTier] ข้าสาบานตนว่าจะดึงหางเหล่าข้าหลวงที่นอกลู่นอกทาง เพื่อป้องกันเหล่าหนูโสโครกที่แพร่พันธุ์ใน [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] ไม่ให้รวมตัวกันเป็นฝูงใหญ่...\n\nขณะที่ [faction.GetName] กำลังรวบรวมกำลัง ผู้เห็นต่าง เช่น [faction_member.GetName] ก็เดินทางไปทั่วสารทิศ กระซิบกระซาบเข้าหูที่บอบบาง\n\n"[unjoined_vassal.GetPrimaryTitle.GetNameNoTier] แข็งแกร่ง และหิวโหย" ผู้ทรยศเร่งเร้า [unjoined_vassal.GetTitleAsNameNoTooltip] ของตน [unjoined_vassal.GetFirstName] "จงเชื่อมั่นในความแข็งแกร่งนี้ ความหิวโหยนี้... และในพวกเรา""
 ach_yearly_events.1002.a: "เจตนารมณ์อันโสโครกนี้ต้องถูกโดดเดี่ยว"
 ach_yearly_events.1002.b: "$ach_yearly_events.1002.a$"
 ach_yearly_events.1002.b.success: "เจ้าวางยาความคิดก่อกบฏ"
 ach_yearly_events.1002.b.failure: "การตำหนิอย่างเย้ยหยันของเจ้าล้มเหลว"
 ach_yearly_events.1002.c: "ข้าเป็นข้ารับใช้ขนาดนั้นเชียวหรือ? เสียงของข้าต้องมีผู้รับฟัง!"
 ach_yearly_events.1002.c.flavor: "ข้าคือเสียงหลักในอาณาจักร และเป็นเสียงหลักในหมู่ผู้ #EMP คัดค้าน#! ด้วย!"
 ach_yearly_events.1002.d: "หนูต้องถูกจัดการ... ทีละตัว"
 ach_yearly_events.1002.d.flavor: "ในฐานะ [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] ข้ามีอิทธิพลพอที่จะ ทำให้กบฏ [faction_member.GetTitleAsNameNoTooltip] ผู้นี้เงียบเสียงลงได้"
 
 ach_chancellor_isolating_factions_modifier: "อัครเสนาบดีโดดเดี่ยวกลุ่มก๊ก"
 ach_chancellor_isolating_factions_modifier_desc: "ผู้สนับสนุนผู้ปกครองผู้นี้ใช้ทักษะ ทำให้เหล่ากบฏและผู้บ่อนทำลายกลายเป็นที่รังเกียจ\n#weak [vassals|E] มีโอกาสน้อยลงที่จะเข้าร่วม [factions|E]#!"
 
 chancellor_isolates_factions_title: "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] บั่นทอนการสนับสนุนกลุ่มก๊ก"
 chancellor_isolates_factions_desc: "[ROOT.Char.GetTitledFirstName] เปลี่ยนทิศทางการสนทนาในหมู่ข้าหลวงของเจ้าให้เป็นประโยชน์ต่อเจ้า"
 chancellor_removes_faction_member_title: "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] ปลอบประโลมสมาชิกกลุ่มก๊ก"
 chancellor_removes_faction_member_desc: "[ROOT.Char.GetTitledFirstName] พิสูจน์ตนว่าเป็นปฏิปักษ์ตัวฉกาจต่อข้าหลวงผู้เห็นต่างของเจ้า"
 
 ach_yearly_events.1003.t: "นายเหนือทัพพ่าย"
 ach_yearly_events.1003.desc: "ความขัดแย้งของนายเหนือหัวข้ากับ [foe.GetPrimaryTitle.GetNameNoTier] ยังคงยืดเยื้อ ในฐานะ [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] ของ [liege.GetHerHis] ข้าวางแผนการส่งกำลังบำรุง เกณฑ์ [liege.Custom('GetLocalCommonerTermPlural')] เข้ารับราชการ ระงับความไม่สงบในท้องถิ่น... ทว่าบัดนี้พลม้าส่งสาส์นนำข่าวร้ายมา\n\nณ [battle_province.GetName] เหล่า [liege.Custom('KnightCulturePluralNoTooltip')|l] แห่ง [liege.GetPrimaryTitle.GetNameNoTier] พ่ายแพ้ แนวรบของ [commander.GetNamePossessive] ถูกตีแตก และกองทัพทั้งหมดของเราต้องแตกพ่ายหนีตายอย่างสิ้นหวัง บัดนี้ ขณะที่ [liege.Custom('GetFighterTermPlural')] ของเราหลบหนี กองทัพของ [foe.GetNamePossessive] ก็กำลังรุกคืบเข้าสู่ [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\n\nเหล่าที่ปรึกษาของข้าเร่งเร้าให้ข้าทำหน้าที่ให้สมกับตำแหน่ง; ให้กุมบังเหียนแห่งหายนะนี้ด้วยกำปั้นที่สวมเกราะ"
 ach_yearly_events.1003.a: "บัดนี้ ความแข็งขันของ [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] เป็นที่ต้องการ!"
 ach_yearly_events.1003.b: "[ROOT.Char.Custom('KnightCulturePluralNoTooltip')]! #EMP พวกเจ้าจงควบม้าไปช่วย [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!#!"
 ach_yearly_events.1003.c: "ข้าจะรวบรวมกองทัพที่แตกพ่าย"
 ach_yearly_events.1003.c.success: "ผู้รอดชีวิตรวมตัวกันภายใต้ธงของ [liege.GetTitledFirstNamePossessiveNoTooltip]"
 ach_yearly_events.1003.c.failure: "น้อยคนนักที่จะขานรับการเรียกของเจ้า"
 ach_yearly_events.1003.d: "จงโบยเหล่าผู้รอดชีวิตสำหรับความล้มเหลวของพวกมัน"
 ach_yearly_events.1003.d.flavor: "...และ [liege.GetTitleAsNameNoTooltip] งี่เง่านั่นด้วย หาก [liege.GetSheHe] ปากมากว่านี่เป็นความผิด #EMP ของข้า#! น่ะ!"
 
marshal_joins_war_title: "จอมพลเข้าร่วมสงคราม"
marshal_joins_war_desc: "ความพ่ายแพ้ย่อยยับของเจ้าปลุกเร้า [marshal.GetTitledFirstName] ให้เข้าร่วม!"
marshal_joins_war_title_foe: "จอมพลของศัตรูเข้าร่วมสงคราม"
marshal_joins_war_desc_foe: "ความพ่ายแพ้ย่อยยับของ [liege.GetShortUINamePossessive] ปลุกเร้า [marshal.GetShortUIName] จอมพลของ [liege.GetHerHis] ให้เข้าร่วม [combat_war.GetName]"

 marshal_aids_troop_recovery_title: "[Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] รวบรวมกำลังพลที่พ่ายแพ้"
 marshal_aids_troop_recovery_desc: "[ROOT.Char.GetTitledFirstName] ตอบสนองอย่างแข็งขันต่อความพ่ายแพ้ของกองทัพเจ้า"
 ach_marshal_reconstituting_army_modifier: "จอมพลฟื้นฟูกองทัพ"
 ach_marshal_reconstituting_army_modifier_desc: "ผลจากความพ่ายแพ้อย่างโหดเหี้ยม จอมพลของตัวละครนี้พยายามอย่างหนักเพื่อฟื้นฟูกองทัพให้กลับสู่สภาพพร้อมรบ"
 
 custom.every_liege_domain_county: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$ทุก [county|E] ใน [domain|E]"
 custom.every_liege_lending_vassal: "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$ทุก [powerful_vassal|E] ที่มี [gold|E] ตามกำหนด"
 
 ach_yearly_events.1004.t: "ถุงเงินใบใหญ่ที่เหี่ยวแฟบ"
 ach_yearly_events.1004.desc: "นายเหนือหัวผู้ยากจนของข้า [liege.GetTitledFirstName] และข้า [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] ของ [liege.GetHerHis] มีโอกาสได้พูดคุยกัน... แม้ว่า... ขณะที่ฝูงชนกำลังเดือดดาลเกี่ยวกับความว่างเปล่าของคลัง [liege.Custom('GetTitleTierAdjective')] ก็ตาม\n\n"ดูพวกเขาสิ ร่ำร้องโหยหาเกียรติยศใหม่!" [liege.GetTitledFirstNameNoTooltip] ตีความอย่างเข้าข้างตนเอง\n\n"เราจะเอาอะไรไปไขว่คว้าเกียรติยศหรือ?" ข้าถาม "หอกหุ้มทอง? ลูกธนูประดับอัญมณี? ทรัพย์สมบัติของอาณาจักรถูกใช้ไปหมดแล้ว เหลือเพียง #EMP เกียรติยศ#!..."\n\n"
 ach_yearly_events.1004.desc_end: ""ก็แค่ความคิดเพ้อฝัน!" [liege.GetSheHe] ตอบ "ข้ารู้สถานะของคลังดีเกินไป...""
 ach_yearly_events.1004.desc_harsh: ""เจ้าคือ [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] ของข้า" [liege.GetSheHe] ตอบ "ไปหาทองมา ไปหาอัญมณีมา""
 ach_yearly_events.1004.a: ""ข้าสามารถรีดไถจากข้าหลวงของท่านและรับผิดชอบ แต่เพียงผู้เดียว""
 ach_yearly_events.1004.a.flavor: "เมื่อคลังอ่อนแอ ข้าคิดว่า [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] จำต้องแข็งแกร่ง... และเป็นที่เกลียดชัง"
 ach_yearly_events.1004.b: "จากความขยันหมั่นเพียรและกาลเวลา ความมั่งคั่งอาจก่อกำเนิด"
 ach_yearly_events.1004.b.success: "เจ้าปฏิรูปการปกครองท้องถิ่นอย่างชำนาญ"
 ach_yearly_events.1004.b.failure: "สัญชาตญาณของเจ้าไร้ประโยชน์อย่างน่าตกใจ"
 ach_yearly_events.1004.c: "จากความขยันหมั่นเพียรและกาลเวลา ความมั่งคั่งย่อมก่อกำเนิด"
 ach_yearly_events.1004.d: ""เมื่อผู้คนของท่านเริ่มอดอยาก ก็ส่งพวกเขามาหาข้า""
 ach_yearly_events.1004.d.flavor: "ไม่มีหน้าที่ใดสามารถบังคับให้ข้าซ่อมแซมถุงเงินที่ยับเยินของลูกหนี้ผู้นี้ได้..."
 
 ach_stewardship_bankruptcy_modifier: "การบริหารที่มุ่งเน้นความเจริญรุ่งเรือง"
 ach_stewardship_bankruptcy_modifier_desc: "ขณะที่การล้มละลายคุกคามอาณาจักร กฎหมายท้องถิ่นก็เข้มงวดขึ้น และการเกณฑ์แรงงานถูกเปลี่ยนไปเป็นงานพลเรือน"
 
 ach_welcoming_lieges_creditors_modifier: "ต้อนรับผู้ยากไร้"
 ach_welcoming_lieges_creditors_modifier_desc: "ประชากรในท้องถิ่นเพิ่มขึ้น: การจัดการทางการเงินที่ผิดพลาดที่อื่นผลักดันให้ครอบครัวต่างๆ ย้ายถิ่นฐานมาที่นี่"
 
 steward_aids_financial_recovery_title: "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] แสวงหาความมั่นคงทางการคลัง"
 steward_aids_financial_recovery_desc: "[ROOT.Char.GetTitledFirstName] ปฏิรูป [domain|E] ของเจ้า เพื่อตอบสนองต่อปัญหาทางการเงินของเจ้า"
 steward_gathers_emergency_tithe_title: "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] รวบรวมภาษีข้าหลวง"
 steward_gathers_emergency_tithe_desc: "เพื่อจัดการกับปัญหาคลังของเจ้า [ROOT.Char.GetTitledFirstName] ได้รวบรวมการเรียกเก็บที่ไม่ธรรมดานี้และแบกรับความผิดทั้งหมดไว้"
 
 custom.every_scope_faction_member: "สมาชิก #high [faction.GetName]#! ทุกคน"

 ach_yearly_events.1005.t: "[ROOT.Char.GetTitleAsNameNoTooltip] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 ach_yearly_events.1005.desc: ""หลายปีผ่านไปนับตั้งแต่การขึ้นครองบัลลังก์ [ROOT.Char.GetPrimaryTitle.GetName] ของท่าน ท่านคือองค์อธิปัตย์ที่แท้จริงของดินแดนเหล่านี้ ผู้พิทักษ์ประชาชนที่อาศัยอยู่ในอาณาจักรของข้า"\n\nถ้อยคำของ [messenger.GetNamePossessive] เต็มไปด้วยความเชื่อมั่น ความห่วงใยของ [messenger.GetHerHis|U] ต่ออาณาจักรของข้าเป็นของจริง\n\n"ทว่าหน้าผากของท่านยังคงว่างเปล่า ไร้มงกุฎที่ได้รับการเจิม พระหัตถ์ว่างเปล่า ปราศจากเครื่องราชกกุธภัณฑ์อันศักดิ์สิทธิ์ แม้จะไม่มีผู้ใดกล้าท้าทายการปกครองของท่าน แต่ท่าน #EMP ต้อง#! จัดพิธีราชาภิเษกที่เหมาะสม มิฉะนั้น ข้าเกรงกลัวต่ออนาคตของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]""
 ach_yearly_events.1005.a: "ไปตามช่างเหล็กมาให้ข้า"
 ach_yearly_events.1005.b: "จงเริ่มการเตรียมการ"
 ach_yearly_events.1005.c: "ข้าจะจัดในภายหลัง"

 ach_yearly_events.1010.t: "การยอมรับใน [ROOT.Char.Custom('GetTitleTierAdjective')|U]"
 ach_yearly_events.1010.desc: "ข้าได้กลายเป็น [ROOT.Char.GetTitleAsName] แห่ง [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]: บุคคลผู้ยิ่งใหญ่และน่าเกรงขามในหมู่มวลมนุษย์ เจตจำนงของข้ากำหนดชะตากรรมของผู้คนนับพันในทุกการกระทำ\n\nในฐานะเจ้าแห่ง [title.GetNameNoTier] ข้าได้รับสิทธิ์ในการปกครอง"
 ach_yearly_events.1010.desc_vassals: "แต่บัดนี้ ผู้คนชาว [title.GetAdjectiveNoTooltip] และทุกคนที่อยู่ภายใต้ธงอันยิ่งใหญ่ของ [ROOT.Char.GetPrimaryTitle.GetName] เหล่า [ROOT.Char.Custom('GetLocalCommonerTermPlural')] ชาว [vassal_title_1.GetAdjective] เหล่าขุนนางชาว [vassal_title_2.GetAdjective]... ไพร่ฟ้าข้าแผ่นดินชาว [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] เหล่านี้ ต้องยอมรับสถานะ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้า"
 ach_yearly_events.1010.desc_no_vassals: "แต่บัดนี้ เหล่าขุนนางชาว [title.GetAdjectiveNoTooltip] และปวงชนผู้อยู่ใต้ปกครองทั้งหมดที่อยู่ภายใต้ธงอันยิ่งใหญ่ของ [ROOT.Char.GetPrimaryTitle.GetName]... ไพร่ฟ้าข้าแผ่นดินชาว [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] เหล่านี้ ต้องยอมรับสถานะ [ROOT.Char.Custom('GetTitleTierAdjective')] ของข้า"
 ach_yearly_events.1010.desc_outro_regalia: "\n\nข้าต้องประกอบพิธีสาบานตนอันรุ่งโรจน์ครั้งใหม่ และสร้างความชอบธรรมให้แก่เครื่องราชกกุธภัณฑ์อันสูงส่งของข้า"
 ach_yearly_events.1010.desc_outro_crown: "\n\nข้าต้องประกอบพิธีสาบานตนอันรุ่งโรจน์ครั้งใหม่ และสร้างความชอบธรรมให้แก่มงกุฎอันสูงส่งของข้า"
 ach_coronation_suggestion_tt: "เจ้าควรพิจารณาจัด [coronation|E]"
 ach_yearly_events.1010.a: "ถึงเวลาสำหรับพิธีราชาภิเษกอีกครั้งที่ยิ่งใหญ่กว่าเดิม"
