l_english: 
 ##################################################
 # #Misc
 fp1_berserk_roar_evtopt:0 "#BER รว๊ากกกก!#!"

 ##################################################
 # #Ordinary Events
 fp1_yearly.0001.t:0 "ทาสหลบหนี"
 fp1_yearly.0001.desc:1 "ทาสเป็นส่วนหนึ่งของชีวิตในวัฒนธรรม [ROOT.Char.GetCulture.GetNameNoTooltip] มนุษย์ชั้นต่ำ ถูกจับมาจากต่างแดน หรือเกิดจากทาสเอง พวกเขาทำงานในทุ่งนาของเราและดูแลบ้านเรือนของเรา\n\nในทางทฤษฎี\n\nเมื่อคืนนี้ ทาสคนหนึ่งตัดสินใจว่า [dummy_gender.GetSheHe] ทนไม่ไหวแล้ว และหนีไป เอาเครื่องประดับมีค่าไปด้วยเต็มอ้อมแขน [dummy_gender.GetHerHim]! ที่แย่ไปกว่านั้น [scapegoat.Custom2('MyCharacterIntroduction',ROOT.Char)] #EMP เห็น#! ทาสวิ่งเข้าไปในความมืด และไม่คิดจะบอกใคร จนกระทั่งเช้า"
 fp1_yearly.0001.gold_stays_lost.tt:0 "เงินของท่านสูญหายไป"
 fp1_yearly.0001.a:0 "ส่งรูปพรรณสัณฐานไปทุกหมู่บ้าน!"
 fp1_yearly.0001.a.tt_success:0 "ทาสถูกพบเห็นและจับกุม"
 fp1_yearly.0001.a.tt_failure:0 "ทาสหลุดรอดไปพร้อมกับเงินของท่าน"
 fp1_yearly.0001.b:0 "เอาเสื้อคลุมมา, ข้าจะตามล่า [dummy_gender.GetHerHim] ด้วยตัวเอง"
 fp1_yearly.0001.b.tt_success:0 "ท่านจับทาสได้ก่อนที่พวกเขาจะหนีไปไกล"
 fp1_yearly.0001.b.tt_failure:0 "$fp1_yearly.0001.a.tt_failure$"
 fp1_yearly.0001.c:0 "[scapegoat.GetFirstNameNoTooltip], นี่เป็นความผิดของเจ้า, ดังนั้นเจ้าต้องจ่าย!"
 fp1_yearly.0001.d:0 "ข้าให้อภัยเจ้า, [scapegoat.GetFirstNameNoTooltip] เรื่องแบบนี้เกิดขึ้นได้"

 fp1_yearly.0011.t:0 "เสียงเรียกร้องให้ประกาศว่า [offensive_courtier.GetFirstNameNoTooltip] เป็นนีธิง"
 fp1_yearly.0011.desc:1 "ขบวนของคนสำคัญในท้องถิ่นจาก [capital_barony.GetNameNoTier] ใช้เวลาทั้งวันเดินขบวนผ่านโถงของข้า, แต่ละคนมีความคับข้องใจที่ไม่เหมือนกันต่อ [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('offensive_courtier'))] ของข้า, [offensive_courtier.GetTitledFirstName]\n\nบางคนบ่นเกี่ยวกับพฤติกรรมของ [offensive_courtier.GetHerHis], คนอื่นบ่นเรื่องเกียรติของ [offensive_courtier.GetHerHis], แต่ทุกคนเห็นพ้องต้องกันในสิ่งหนึ่ง: [offensive_courtier.GetSheHe] เป็นความอัปยศต่อราชสำนัก\n\nมวลชนผู้ไร้การศึกษาเรียกร้องไม่น้อยไปกว่าการประกาศว่าเป็นนีธิง, ขับไล่ [offensive_courtier.GetHerHim] ออกไป"
 fp1_yearly.0011.desc.priest:0 "[priest.Custom2('MyCharacterIntroduction',ROOT.Char)|U] ยืนกรานว่าพฤติกรรมของ [offensive_courtier.GetHerHis] นั้น #EMP จริงๆ แล้ว#! ค่อนข้างเคร่งศาสนา, แต่ชาวเมืองที่เกรี้ยวกราดอ้างว่า [priest.GetFirstNameNoTooltip] เพียงแค่ไม่ต้องรับมือกับผลที่ตามมาของ "คุณธรรม" เช่นนั้น"
 fp1_yearly.0011.a:0 "พวกเขาพูดถูก, [offensive_courtier.GetSheHe] ต้องถูกตัดขาดและเนรเทศ!"
 fp1_yearly.0011.b:0 "พวกเขาพูดถูก, [offensive_courtier.GetSheHe] ต้องถูกเนรเทศ!"
 fp1_yearly.0011.c:0 "พวกชาวนา! [offensive_courtier.GetFirstNameNoTooltip] ไม่มีความผิด"
 fp1_yearly.0011.d:0 "นี่ไม่ใช่เรื่องสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip]..."

 fp1_yearly.0021.t:0 "เรื่องคอขาดบาดตาย"
 fp1_yearly.0021.desc.intro:0 "การโต้เถียงล่าสุดระหว่าง $knight_culture_player_plural_no_tooltip_lowercase$ สองคนของข้า, [first_knight.GetTitledFirstName] และ [second_knight.GetTitledFirstName], ได้บานปลายอย่างรุนแรง เห็นได้ชัดว่า,"
 fp1_yearly.0021.desc.doggo:1 "[first_knight.GetFirstNameNoTooltip] แทงสุนัขของ [second_knight.GetFirstNamePossessiveNoTooltip] โดยบังเอิญขณะที่พวกเขาล่า [ROOT.Char.Custom('GetAnimalType')] ด้วยกัน, และ [second_knight.GetFirstNameNoTooltip] ปฏิเสธที่จะให้ [first_knight.GetFirstNameNoTooltip] เพียงแค่จ่ายเงินซื้อตัวใหม่ให้"
 fp1_yearly.0021.desc.spit_of_land:0 "[first_knight.GetFirstNameNoTooltip] ซื้อที่ดินผืนเล็กห่างไกลที่ [second_knight.GetFirstNameNoTooltip] อ้างว่าเป็นของ [second_knight.GetHerHim] ที่ดินผืนนั้นไร้ค่า, เว้น แต่ว่ามันถูกกล่าวหาว่าปลูกกะหล่ำปลีที่ดีที่สุดใน [capital_barony.GetNameNoTierNoTooltip] ทั้งหมด"
 fp1_yearly.0021.desc.unrepeatable_insult:0 "พวกเขาเริ่มสาดคำสบประมาทใส่กันโดยไม่มีเหตุผล, และ [first_knight.GetFirstNameNoTooltip] พูดบางอย่างที่ไม่อาจกล่าวซ้ำได้เกี่ยวกับ [second_knight.GetFirstNameNoTooltip], แพะ, และเขาดื่มเหล้าชั้นดี"
 fp1_yearly.0021.desc.escalating_prank_war:0 "มันเริ่มต้นจากการแข่งขันเอาชนะกันอย่างไม่มีพิษภัย, แต่ละคนเล่นตลกที่น่าทึ่งมากขึ้นเรื่อยๆ กับอีกฝ่าย, และความสนุกค่อยๆ กลายเป็นความโกรธแค้นอย่างแท้จริง"
 fp1_yearly.0021.desc.religious_differences:0 "มันมาจากความแตกต่างทางศรัทธาธรรมดาๆ, โดยทั้ง [first_knight.GetFaith.GetAdherentName] และ [second_knight.GetFaith.GetAdherentName] ต่างก็จ้องจะเอาเรื่องกันเกี่ยวกับธรรมชาติของสิ่งศักดิ์สิทธิ์"
 fp1_yearly.0021.desc.stolen_pig:0 "ประเด็นสำคัญของความขัดแย้งคือหมูรางวัลตัวมหึมา, ซึ่ง [first_knight.GetFirstNameNoTooltip] ขโมยมาจาก [second_knight.GetFirstNameNoTooltip] หรือ [second_knight.GetFirstNameNoTooltip] จาก [first_knight.GetFirstNameNoTooltip] บอกตามตรง, ด้วยเสียงตะโกนทั้งหมด, มันค่อนข้างไม่ชัดเจน"
 fp1_yearly.0021.desc.defiled_longboat.woman:0 "[unfortunate_knight.GetFirstNameNoTooltip] พบ [defiling_knight.GetFirstNameNoTooltip] กำลัง #EMP เพลิดเพลิน#! กับ [defiling_knight.GetHerselfHimself] ด้วยหัวเรือยาวของ [unfortunate_knight.GetFirstNamePossessiveNoTooltip], ทำลายทั้งสีและรัศมีอันน่าเกรงขามในอดีตของมันอย่างสิ้นเชิง"
 fp1_yearly.0021.desc.defiled_longboat:1 "[defiling_knight.GetFirstNameNoTooltip] #EMP เพลิดเพลิน#! กับ [defiling_knight.GetHerselfHimself] อย่างไม่อาจบรรยายได้ทั่วทุกที่นั่งในเรือยาวของ [unfortunate_knight.GetFirstNamePossessiveNoTooltip], ทิ้งให้เรือทั้งลำ #EMP เหม็นคลุ้ง#! ไปหมด"
 fp1_yearly.0021.desc.board_game:0 "ทั้งสองกำลังเล่นเกมฮเนฟาตาฟล์ (hnefatafl) และเริ่มโต้เถียงกันเกี่ยวกับกฎที่แน่นอน ในเวลาไม่กี่นาที, กระดานก็ถูกปัดทิ้งและหมัดก็ปลิวว่อน"
 fp1_yearly.0021.desc.outro:0 "\n\nบัดนี้, $knight_culture_player_plural_no_tooltip_lowercase$ ทั้งสองได้ท้าทายกันอย่างเปิดเผยเพื่อทำโฮล์มกัง (holmgang) การดวลจะต้องน่าทึ่งอย่างแน่นอน, แต่ในฐานะสมาชิกที่สาบานตนในครัวเรือนของข้า, พวกเขาต้องการอนุญาตจากข้าเพื่อดำเนินการต่อสู้"
 fp1_yearly.0021.a:0 "พวกเขาอาจต่อสู้กันเรื่องนี้หากพวกเขาต้องการ"
 fp1_yearly.0021.a.tt_success:0 "[first_knight.GetFirstNameNoTooltip] ชนะโฮล์มกัง"
 fp1_yearly.0021.a.tt_failure:0 "[second_knight.GetFirstNameNoTooltip] ชนะโฮล์มกัง"
 fp1_yearly.0021.b:0 "ไร้สาระ! ข้าห้าม!"
 fp1_yearly.0021.b.tt_success:0 "คำสั่งของท่านปลูกฝังการเชื่อฟังอย่างหวาดกลัว"
 fp1_yearly.0021.b.tt_failure:0 "$knight_culture_player_plural_no_tooltip_lowercase$ ของท่านยอมรับอย่างไม่เต็มใจ แต่เยาะเย้ยท่าน"
 fp1_yearly.0021.c:0 "แน่นอน, และข้าจะพนันข้าง [first_knight.GetFirstNameNoTooltip] ด้วย"
 fp1_yearly.0021.c.tt_success:0 "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.c.tt_failure:0 "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0021.d:0 "ตามสบายเลย, แม้ว่าข้าจะพนันข้าง [second_knight.GetFirstNameNoTooltip]"
 fp1_yearly.0021.d.tt_failure:0 "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.d.tt_success:0 "$fp1_yearly.0021.a.tt_failure$"

 fp1_yearly.0031.t:0 "เรื่องโม้โอ้อวดที่โต๊ะอาหาร"
 fp1_yearly.0031.desc.intro:1 "เป็นค่ำคืนที่ยาวนานเหลือเกินในหมู่สหายของ [lying_warrior.GetFirstName] นักพเนจรแวะพักที่ [capital_barony.GetBaseNameNoTierNoTooltip] ค้างคืน, จ่ายค่าที่พักด้วยเรื่องราวการผจญภัยของ [lying_warrior.GetHerHis] ที่ยาวนานถึง #EMP หลายชั่วโมง#!.\n\n"
 fp1_yearly.0031.desc.sunk_longboat:0 ""... ดังนั้นข้าจึงอยู่ที่นั่น, กลางทะเลเหนือ, เรือยาวกำลังจม เพราะของปล้นที่มากเกินไป ให้ตายสิ. เอาล่ะ, ข้าเอามันไปด้วยไม่ได้, ดังนั้นข้าจึงกระโดดลงไปในน้ำและว่ายน้ำไปนอร์เวย์!""
 fp1_yearly.0031.desc.wrestled_whale:0 ""... รู้ว่าข้าต้องทิ้งลูกเรือ, หรือสู้กับวาฬด้วยตัวเอง. คว้ามีดของข้า, พุ่งลงไปในมหาสมุทร, และปล้ำกับสัตว์ร้ายเข้าฝั่งด้วยมือเดียว!""
 fp1_yearly.0031.desc.charged_city_fruit_knife:0 ""... ศัตรูหนึ่งหมื่นคนอยู่ในนั้น, ติดอาวุธด้วยดาบโค้ง, และข้ามีเพียงมีดเล็กๆ สำหรับปอกผลไม้. #EMP ข้าทำได้#!, ขอบคุณมีดปอกผลไม้คู่ใจของข้า!""
 fp1_yearly.0031.desc.charged_city:0 ""... บุกตรงไปยังกำแพงเมือง, ปีนขึ้นไปข้างในโดยไม่มีอุปกรณ์ช่วย, และฟันฝ่าเข้าไปในพระราชวัง. หลอมมงกุฎของกษัตริย์ลงเพื่อจ่ายค่ารองเท้าคู่ใหม่""
 fp1_yearly.0031.desc.kept_iceland_afloat:1 ""... และถ้ายักษ์สองตน #EMP ได้#! ทำโฮล์มกังกันจริงๆ, ไอซ์แลนด์คงจมลงสู่ทะเลอย่างแน่นอน. โชคดีที่ข้าพูดเกลี้ยกล่อมพวกเขาได้, จริงๆ นะ""
 fp1_yearly.0031.desc.wooed_heir:1 ""... [disparaged_king.GetTitledFirstNamePossessive] [invented_heir.Custom('GetDaughterSon')], ตอนนี้ #EMP นั่น#! คือสิ่งที่ดีที่สุดที่ข้าเคยมี. [disparaged_king.GetTitledFirstNameNoTooltip] ไม่ค่อยชอบข้าเท่าไหร่หลังจากนั้น, และข้าหนีออกจากราชสำนักของ [disparaged_king.GetHerHis] อย่างรวดเร็ว, ข้าจะบอกเจ้าอย่างนั้น!""
 fp1_yearly.0031.desc.hunted_troll:1 ""... แน่นอน, บาดแผลล่าสุดนี้มาจากโทรลล์นั่นเอง. ตัวใหญ่เท่าบ้าน, เงียบเหมือนหนู, กรงเล็บเหมือนลูกนอกสมรสของ [lying_warrior.GetFaith.DevilName] ถึงกระนั้น, แทงอะไรนานพอ, มันก็ตาย""
 fp1_yearly.0031.desc.outro:1 "\n\nเรื่องแล้วเรื่องเล่า, ตำนานยังคงดำเนินต่อไป, แต่ละเกร็ดเล็กเกร็ดน้อยยาวนานและยิ่งใหญ่กว่าครั้งก่อน"
 fp1_yearly.0031.a:0 "ท่าน #EMP ต้อง#! อยู่ที่ราชสำนัก, [lying_warrior.GetFirstNameNoTooltip]!"
 fp1_yearly.0031.b:0 "เรื่องเหล่านี้ฟังดู... เกินจริงไปหน่อย"
 fp1_yearly.0031.b.tt_success:0 "คำโกหกของ [lying_warrior.GetFirstNamePossessiveNoTooltip] ถูกเปิดโปง"
 fp1_yearly.0031.b.tt_failure:0 "[lying_warrior.GetFirstNameNoTooltip] พูดจาจนท่านตามไม่ทัน"
 fp1_yearly.0031.c:1 "ช่วยพูดถึงการต้อนรับของเราในทางที่ดี ณ จุดแวะพักต่อไปของท่านด้วย!"

 fp1_yearly.0041.t:0 "นักสำรวจจากแดนใต้"
 fp1_yearly.0041.desc:2 "[explorer.GetFirstName], นักสำรวจ, นักวิชาการ, และทูตจาก [sponsoring_liege.GetTitledFirstName] แห่ง [sponsoring_liege.GetPrimaryTitle.GetName] ได้เดินทางท่องเที่ยวในดินแดนของข้าเมื่อเร็วๆ นี้ [explorer.GetFaith.GetAdherentNameNoTooltip] ผู้คงแก่เรียนและเคร่งศาสนา, [explorer.GetSheHe] เก็บบันทึกรายละเอียดเกี่ยวกับประสบการณ์ของ [explorer.GetHerHis], ส่งจดหมายกลับไปยังบ้านเกิดของ [explorer.GetHerHis] เป็นครั้งคราวเพื่อรายงานเกี่ยวกับชีวิต ณ ขอบโลกแห่งนี้\n\n[explorer.GetFirstNameNoTooltip] ได้มาถึง [capital_barony.GetNameNoTierNoTooltip] แล้ว, และขออนุญาตหยุดพักสองสามวันเพื่อสังเกตการณ์ประเพณีท้องถิ่นของเราและพูดคุยกับผู้อาวุโสที่ฉลาดที่สุดของเรา\n\nแม้จะมีลักษณะที่เป็นทางการของคำขอของ [explorer.GetHerHis], น้ำเสียงของ [explorer.GetFirstNamePossessiveNoTooltip] ก็ #EMP เต็มไปด้วย#! การดูถูกเหยียดหยาม"
 fp1_yearly.0041.a:1 "บางที [explorer.GetSheHe] อาจจะสังเกตการณ์พิธีบล็อต (blot) เล็กๆ ของเราได้?"
 fp1_yearly.0041.a.tt_success:0 "พิธีของท่านสร้างความประทับใจให้ [explorer.GetFirstNameNoTooltip]"
 fp1_yearly.0041.a.tt_failure:0 "วิถีนอกรีตของท่าน ทำให้ [explorer.GetFirstNameNoTooltip] รังเกียจ"
 fp1_yearly.0041.b:0 "บอกข้าเพิ่มเติมเกี่ยวกับ... [explorer.GetFaith.HighGodName] นี้สิ?"
 fp1_yearly.0041.c:0 "เราไม่มีที่สำหรับชาวต่างชาติหัวสูงในราชสำนัก #EMP ของข้า#!"

 fp1_yearly.0051.t:0 "ผู้ตายที่ไม่สงบ"
 fp1_yearly.0051.desc:1 "การตายของ [draugr.GetTitledFirstNamePossessive] เมื่อไม่นานมานี้ไม่ได้ผ่านไปโดยไม่มีใครสังเกตเห็นจากสามัญชนแห่ง [capital_county.GetNameNoTier] ไม่ว่า [draugr.GetSheHe] จะเป็นอะไรก็ตาม, [draugr.GetFirstNameNoTooltip] ไม่เป็นที่นิยมในหมู่ชาวนาท้องถิ่น, และกลายเป็นเรื่องปกติที่ความเจ็บป่วยทุกอย่างในแผ่นดินจะถูกตำหนิว่าเป็น เพราะศพเดินได้ของ [draugr.Custom('WomanManPossessive')]\n\nดูเหมือนจะไม่มีสัปดาห์ใดผ่านไปโดยไม่มีชาวนา, คนตัดไม้, และคนตักมูลสัตว์ทุกคนในระยะใกล้เคียงเมืองหลวงบ่นเกี่ยวกับเดราเกอร์ (draugr) ของ [draugr.GetFirstNamePossessiveNoTooltip]\n\n#EMP ต้อง#! ทำอะไรสักอย่าง"
 fp1_yearly.0051.a:0 "ข้าจะไปเยี่ยมหลุมศพของ [draugr.GetHerHis] ด้วยตนเอง"
 fp1_yearly.0051.a.tt:0 "ท่านตัดสินใจไปตรวจสอบด้วยตนเอง..."
 fp1_yearly.0051.b:0 "แค่ขุดศพขึ้นมาแล้วเผามันซะ"
 fp1_yearly.0051.b.body_destroyed:0 "ชาวนาปรีดา"
 fp1_yearly.0051.b.list:0 "ครอบครัวและสหายของ [draugr.GetFirstNameNoTooltip]"
 fp1_yearly.0051.c:0 "บางทีเราอาจแก้ปัญหานี้ด้วยคาถาป้องกันได้?"
 fp1_yearly.0051.c.tt_success:0 "ยาและคาถาของท่าน ทำให้ชาวนาวางใจ"
 fp1_yearly.0051.c.tt_failure:0 "พิธีกรรมของท่านไม่เพียงพอ"
 fp1_yearly.0061.t:0 "$fp1_yearly.0051.t$: ฝูงหมาป่า"
 fp1_yearly.0061.desc:0 "คณะผู้ติดตามของข้าและตัวข้าแทบจะยังไม่ถึงหลุมศพของ [draugr.GetFirstNamePossessiveNoTooltip] เมื่อเสียงคำรามแรกดังสะท้อนออกมาจากข้างใน\n\nขณะที่หมาป่าตัวใหญ่ที่สุดที่ข้าเคยเห็นบีบตัวออกมาทางเข้าที่มืดมิด, ฝูงที่เหลือของมันดูเหมือนจะผุดขึ้นมาจากพื้นดินเอง ต้องมีเป็นสิบตัวหรือมากกว่านั้น, แต่ละตัวใหญ่เท่าคน, และวิ่งสุดฝีเท้ามาจากทุกทิศทางแล้ว\n\nชาวนาคิดผิดเรื่องเดราเกอร์, แต่ไม่ใช่เรื่องคำสาป!"
 fp1_yearly.0061.a:0 "ทหาร! มาหาข้า!"
 fp1_yearly.0061.a.tt_success:0 "ท่านรวบรวมคนของท่านและสังหารหมาป่า!"
 fp1_yearly.0061.a.tt_failure:0 "ท่านหนีรอดมาได้อย่างหวุดหวิด"
 fp1_yearly.0061.b:0 "หนีเร็ว!"
 fp1_yearly.0062.t:0 "$fp1_yearly.0051.t$: หมี"
 fp1_yearly.0062.desc:0 "หลุมศพของ [draugr.GetFirstNamePossessiveNoTooltip] นั้นหนาวเย็นและมืดมน แม้ว่าทั้งคณะผู้ติดตามของข้าและตัวข้าจะไม่เห็นศพเดินได้ใดๆ, แต่มีรอยขีดข่วนยาวลึกบนผนังบางส่วน, และกระดูกปศุสัตว์เกลื่อนพื้น\n\nเสียงกรอบแกรบอย่างกะทันหันจากมุมหนึ่งดึงดูดสายตาข้า, และสิ่งที่ข้าคิดว่าเป็นกองใบไม้เริ่มลุกขึ้นยืน, เผยให้เห็นหมีตัวใหญ่ที่สุดที่ข้าเคยเห็น, สูงเก้าหรือสิบเอลส์ (ells) ได้อย่างง่ายดาย มันกระพริบตาใส่เราอย่างง่วงงุน, ดูเหมือนเกือบจะเป็นมิตร\n\nแล้วมันก็คำราม"
 fp1_yearly.0062.a:0 "ข้าจะ ทำให้เจ้ากลายเป็นพรม!"
 fp1_yearly.0062.a.tt_success:0 "ท่านสังหารอสูรร้าย"
 fp1_yearly.0062.a.tt_failure:0 "คณะผู้ติดตามของท่านลากท่านหนีจากความตายที่แน่นอน"
 fp1_yearly.0062.b:0 "$fp1_yearly.0061.b$"
 fp1_yearly.0063.t:0 "$fp1_yearly.0051.t$: นีธิง"
 fp1_yearly.0063.desc:0 "หลุมศพของ [draugr.GetFirstNamePossessiveNoTooltip] ไม่มีอสูรร้าย, ไม่มีเครื่องบูชาในหลุมศพ, หรือแม้ แต่ศพ การค้นหาบริเวณนั้นครู่หนึ่งพบ [draugr.GetFirstNameNoTooltip] ถูกทิ้งคว่ำอยู่ในคูน้ำและถูกคลุมด้วยใบไม้อย่างหยาบๆ ห่างออกไปเล็กน้อย\n\nแทนที่จะเป็น เช่นนั้น, หลุมศพดูเหมือนจะถูกดัดแปลงเป็นที่อยู่อาศัยชั่วคราว, ซึ่งคนนอกกฎหมายที่ชั่วร้ายบางคนได้ยึดมาจากมืออันเย็นเฉียบของผู้ตาย\n\nขณะที่ข้ากำลังหารือกับคณะผู้ติดตามว่าจะทำอย่างไร, เสียงผิวปากอย่างร่าเริงก็ดังขึ้นในระยะไกล, ใกล้เข้ามาเรื่อยๆ คนพาลกำลังเข้ามาใกล้!"
 fp1_yearly.0063.a:0 "ทุกคน, เงียบ, ชิดกำแพง!"
 fp1_yearly.0063.a.tt_success:0 "กับดักได้ผล"
 fp1_yearly.0063.a.tt_failure:0 "[draugr_nithing.GetFirstNameNoTooltip] สังเกตเห็นว่ามีบางอย่างผิดปกติและวิ่งหนีไป"
 fp1_yearly.0063.a.tt_failure.draugr_nithing_escapes:0 "[draugr_nithing.GetFirstNameNoTooltip] เร่ร่อนไปในถิ่นทุรกันดาร, สร้างปัญหาต่อไป"
 fp1_yearly.0063.b:0 "เสียเวลาของข้าจริงๆ!"
 fp1_yearly.0064.t:0 "$fp1_yearly.0051.t$: เด็กกำพร้า"
 fp1_yearly.0064.desc:0 "ชาวนาอาจยืนกรานว่าศพเดินได้ของ [draugr.GetFirstNamePossessiveNoTooltip] กำลังขโมยอาหารของพวกเขา, สาปแช่งปศุสัตว์ของพวกเขา, และเกาะหน้าต่างของพวกเขาในตอนกลางคืน, แต่เมื่อข้าไปถึงหลุมศพของ [draugr.GetHerHis], ข้าพบสัตว์ร้ายที่แตกต่างกันมาก\n\nท่ามกลางรังที่ทำจากขนสัตว์ที่ถูกขโมยมาและอาหารที่กินไปครึ่งหนึ่ง มีเด็กกำพร้านั่งอยู่, จ้องมองมาที่ข้า, ตาเบิกกว้างด้วยความหวาดกลัวอย่างที่สุด"
 fp1_yearly.0064.a:0 "ไปให้พ้น, เด็กน้อย เจ้าอยู่ที่นี่ไม่ได้"
 fp1_yearly.0064.a.tt:0 "[draugr_orphan.GetFirstNameNoTooltip] เดินหายไปในถิ่นทุรกันดาร..."
 fp1_yearly.0064.b:0 "เด็กหรือไม่, จับโจรผู้นี้เข้าคุกใต้ดิน!"
 fp1_yearly.0064.c:0 "มาที่ราชสำนักเถิด, [Select_CString(draugr_orphan.IsFemale,'เด็กหญิง','เด็กชาย')]: หลุมศพไม่ใช่ที่สำหรับคนเป็น"
 fp1_yearly.0064.d:0 "แน่นอน... แน่นอนว่าเด็กทุกคนสมควรได้รับ [ROOT.Char.GetMotherFather]?"
 fp1_yearly.0065.t:0 "$fp1_yearly.0051.t$: เงียบสงบในที่สุด"
 fp1_yearly.0065.desc:0 "หลุมศพของ [draugr.GetFirstNamePossessiveNoTooltip] ยังคงเหมือนเดิมเมื่อ [draugr.GetSheHe] ถูกฝัง เช่นเดียวกับหลุมศพอื่นๆ ทุกหลุมที่ชาวนาให้ข้าตรวจสอบ\n\nข้าไม่พบสิ่งใดในถ้ำที่ถูกกล่าวหาว่าต้องสาป, ป่าที่ถูกโทรลล์สิงสู่, หรือถ้ำของยักษ์: หลังจากผ่านไปสองสามสัปดาห์, ข้าเริ่มสงสัยว่าเราแน่ใจแค่ไหนว่าอสูรร้าย เช่นนั้นมีอยู่ #EMP จริง#!?\n\nอย่างน้อยการออกกำลังกายก็ดีต่อข้า"
 fp1_yearly.0065.a:0 "บางทีอาจเป็นลม?"
 fp1_yearly.0065.a.locals_grumble:0 "ชาวนาไม่พอใจ"

 fp1_yearly.0071.t:0 "ในสถานที่ลึกล้ำแห่งโลก"
 fp1_yearly.0071.desc.intro:0 "ชาวนาแห่ง [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] เป็นพวกเชื่อโชคลาง, มักจะมาหาข้าพร้อมกับคำกล่าวอ้างเรื่องพ่อมด, ยักษ์, และเทพเจ้าปลอมตัวมา\n\nโดยปกติ, ข้าไม่สนใจคำกล่าวอ้าง เช่นนั้นว่าเป็นเรื่องเหลวไหลของสามัญชน, แต่คราวนี้พวกเขานำหลักฐานมา:"
 fp1_yearly.0071.desc.troll_type.bear:0 "เด็กชาวนาหนุ่ม, ศีรษะของเขาถูกบดขยี้จนเป็นผงและเนื้อเละ, และพ่อแม่ที่ร่ำไห้ผู้เห็นเหตุการณ์การตายของเขา"
 fp1_yearly.0071.desc.troll_type.wolf:0 "ซากศพของนายพรานชื่อดัง, หน้าอกถูกฉีกกระชาก, เนื้อหัวใจอ่อนนุ่มถูกกัดกิน"
 fp1_yearly.0071.desc.troll_type.wolverine:0 "กองกระดูกและเศษเนื้อฉีกขาดที่พวกเขายืนยันว่าเมื่อเร็วๆ นี้คือหญิงชราซักผ้า"
 fp1_yearly.0071.desc.troll_type.lynx:0 "หมูที่ถูกฆ่าเป็นสิบตัว, แต่ละตัวถูกฉีกกระชากอย่างระมัดระวังเกินกว่าจะเป็นฝีมือของสัตว์ป่าที่ไม่ประสานงานกัน, แต่เห็นได้ชัดว่าเป็นฝีมือกรงเล็บมากกว่ามีด"
 fp1_yearly.0071.desc.troll_type.moose:0 "ซากแกะเปื้อนเลือด, เห็นได้ชัดว่าถูกฉีกกระชาก แต่ไม่ได้ถูกกิน, หรือแม้ แต่เคี้ยว, ถูกฉีกเป็นชิ้นๆ อย่างหยาบๆ โดยไม่มีกรงเล็บใดที่ข้าเคยเห็น"
 fp1_yearly.0071.desc.outro.loveli_lakes:0 "\n\nข้าตรวจสอบความยุ่งเหยิงเพียงครู่เดียวเมื่อ [loveli_lakes.GetTitledFirstName] ก้าวออกมา\n\n"นี่ไม่ใช่โทรลล์, [ROOT.Char.GetFirstNameNoTooltip], นี่เป็นฝีมือของมูส (møøse) ดุร้าย! ข้ารู้จักสัตว์ร้ายตัวนี้ดี, รวมถึงการกัดที่น่ารังเกียจของมัน, และจะสลักรอยของข้าไว้บนซากศพของมัน""
 fp1_yearly.0071.desc.outro.fallback:0 "\n\nชาวบ้านยืนกรานว่านี่ไม่ใช่อะไรอื่นนอกจากฝีมือของโทรลล์, และเรียกร้องให้ข้าค้นหาป่าใกล้เคียงเพื่อส่งคนไปจัดการกับสิ่งมีชีวิตนั้น"
 fp1_yearly.0071.a:0 "ข้าจะฆ่าสัตว์ร้ายตัวนั้นด้วยตัวเอง!"
 fp1_yearly.0071.a.tt:0 "ท่านออกเดินทางพร้อมกับกลุ่มนักรบ"
 fp1_yearly.0071.b:0 "[marshal.GetTitledFirstNameNoTooltip], จัดการเรื่องนี้"
 fp1_yearly.0071.b.tt_success:0 "จอมพลของท่านและกองทหารของ [marshal.GetHerHis] ตามล่าอสูรร้าย"
 fp1_yearly.0071.b.tt_failure:0 "สัตว์ร้ายหลบหนี [marshal.GetFirstNameNoTooltip] ไปได้"
 fp1_yearly.0071.c:0 "ฟังดูเหมือนหมี จัดการกันเองเถอะ, พวกขี้ขลาด"
 fp1_yearly.0081.hunt_invalidated:0 "การล่าโทรลล์แห่ง [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] ยุติลง"
 fp1_yearly.0081.hunt_invalidated.tt:0 "สถานการณ์ที่ไม่คาดฝันเรียกร้องความสนใจของท่านไป"
 fp1_yearly.0081.desc.prelude:0 "ป่ากระซิบเบาๆ ขณะที่เราเดินไปข้างหน้า, โอบกอดกลุ่มผู้ติดตามเล็กๆ ของข้าไว้ในอ้อมกอดอันมืดมิด ข้าคิดว่าเป็นเพียงสายลม, แต่บางคนบอกว่าโทรลล์ร้องเพลงเหมือนสายลมเมื่ออยู่ตามลำพัง...\n\nมีการหายตัวไปหลายครั้งใกล้กับทุ่งโล่งนี้, ทำให้เป็นที่พักพิงที่เป็นไปได้ของสัตว์ร้าย อย่างน้อย, นั่นคือสิ่งที่ชาวบ้านพูด\n\n"
 fp1_yearly.0081.desc.finisher:0 "ไม่ใช่โทรลล์, แต่ยังคงเป็นเหยื่อของเรา!"
 fp1_yearly.0081.t:0 "$fp1_yearly.0071.t$: ความตายสูงตระหง่าน"
 fp1_yearly.0081.desc:0 "$fp1_yearly.0081.desc.prelude$เสียงคำรามที่ดังสนั่นหวั่นไหวสะท้อนไปทั่วป่าละเมาะ, และสิ่งที่ข้าคิดว่าเป็นก้อนหินก็ผงาดขึ้น, เผยให้เห็นหมีที่ #EMP สูงตระหง่าน#! อย่างแท้จริง\n\n$fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0081.a:0 "ความตายจงมาสู่เจ้า, อสูรร้าย!"
 fp1_yearly.0081.a.tt_success:0 "ท่านสังหารหมี"
 fp1_yearly.0081.a.tt_failure:0 "หมีฉีกท่านเป็นสองซีก"
 fp1_yearly.0081.b:0 "#BER รว๊ากกกก!#!"
 fp1_yearly.0081.b.tt:0 "ท่านฉีกสัตว์ร้ายออกเป็นสองซีกด้วยความโกรธคลั่ง"
 fp1_yearly.0081.c:0 "ลุกขึ้น, #EMP ลุกขึ้น#! สู้มัน, เจ้าหมาป่าแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
 fp1_yearly.0081.c.tt_success:0 "ท่านสร้างแรงบันดาลใจให้ทหารของท่านฆ่าหมี"
 fp1_yearly.0081.c.tt_failure:0 "สัตว์ร้ายทำร้ายท่านและหลบหนีไป"
 fp1_yearly.0081.c.tt_failure.tt:0 "ท่านได้รับบาดเจ็บสาหัส #warning ถาวร#!"
 fp1_yearly.0081.d:0 "#EMP หนีเร็ววววว!#!"
 fp1_yearly.0082.t:0 "$fp1_yearly.0071.t$: ความตายอันรวดเร็ว"
 fp1_yearly.0082.desc:0 "$fp1_yearly.0081.desc.prelude$มีเสียงคำรามที่ ทำให้เลือดเย็นยะเยือกอยู่ข้างหลังเรา, เสียงฝีเท้าที่ย่ำเบาๆ, แล้วใครบางคนที่อยู่ท้ายขบวนก็กรีดร้อง ข้าหมุนตัวทันเวลาพอดีที่จะหลบหมาป่ายักษ์, ขนของมันเป็นสีเงินประปรายด้วยอายุและสีแดงด้วยเลือด, ขณะที่มันพุ่งผ่านไป $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0082.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0082.a.tt_success:0 "ท่านสังหารหมาป่า"
 fp1_yearly.0082.a.tt_failure:0 "หมาป่าฉีกคอหอยท่าน"
 fp1_yearly.0082.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0082.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0082.c:0 "รวมพล! ตั้งวงกลม!"
 fp1_yearly.0082.c.tt_success:0 "ท่านดักจับ, ต้อนจนมุม, และฆ่าหมาป่า"
 fp1_yearly.0082.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0082.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0082.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0083.t:0 "$fp1_yearly.0071.t$: ความตายอันบ้าคลั่ง"
 fp1_yearly.0083.desc:0 "$fp1_yearly.0081.desc.prelude$สิ่งแรกที่เราเห็นเกี่ยวกับสัตว์ร้ายคือมันกำลังฉีกคอหอยของทหารทางซ้ายของข้า: ก้อนขนและฟันที่เคลื่อนไหวรวดเร็ว ซึ่งใหญ่กว่าสุนัขเพียงเล็กน้อย แต่เร็วกว่าดาบที่พุ่งลงมา วูล์ฟเวอรีนที่บ้าคลั่ง! $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0083.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0083.a.tt_success:0 "ท่านกำจัดวูล์ฟเวอรีน"
 fp1_yearly.0083.a.tt_failure:0 "วูล์ฟเวอรีนฉีกไส้พุงท่านออกมา"
 fp1_yearly.0083.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0083.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0083.c:0 "มีกระท่อมล่าสัตว์อยู่ใกล้ๆ นี้, ถอยกลับไปขอความช่วยเหลือ!"
 fp1_yearly.0083.c.tt_success:0 "ท่านล่อมันเข้าไปใกล้กระท่อมและเอาชนะมันด้วยจำนวน"
 fp1_yearly.0083.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0083.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0083.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0084.t:0 "$fp1_yearly.0071.t$: ความตายอันเงียบงัน"
 fp1_yearly.0084.desc:0 "$fp1_yearly.0081.desc.prelude$ข้าแข็งทื่อ ไม่รู้ว่าทำไมมันถึงไม่เห็นเรา, แต่ข้า #EMP พอจะ#! มองเห็นร่างที่หมอบอยู่ของแมวป่าลิงซ์ที่อีกฟากหนึ่งของทุ่งโล่ง ก้าวที่ไม่ระวังอีกก้าวหนึ่งอาจเป็นก้าวสุดท้ายของข้า $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0084.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0084.a.tt_success:0 "ท่านสังหารแมวป่าลิงซ์"
 fp1_yearly.0084.a.tt_failure:0 "แมวป่าลิงซ์หักคอท่าน"
 fp1_yearly.0084.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0084.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0084.c:0 "เงียบ! เจ้าสองคน, ตีขนาบมัน, เราจะไล่มันไปทางเจ้า..."
 fp1_yearly.0084.c.tt_success:0 "ท่านชิงไหวชิงพริบและเอาชนะแมวป่าลิงซ์ได้"
 fp1_yearly.0084.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0084.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0084.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0085.t:0 "$fp1_yearly.0071.t$: ความตายอันอาละวาด"
 fp1_yearly.0085.desc.loveli_lakes:0 "โดยมี [loveli_lakes.GetTitledFirstName] นำทาง, เป็นการเดินทางสั้นๆ ไปยังถ้ำในป่าของสัตว์ร้ายที่บ้าคลั่ง\n\nหวังว่าเราจะโชคดีพอที่จะจับมันได้ตอนหลับ, แต่เราทำไม่ได้, และอสูรร้ายมหึมาที่ดุร้ายก็ผงาดขึ้นเมื่อเราเข้าสู่ทุ่งโล่งของมัน, สูงกว่า [ROOT.Char.GetWomanMan] ถึงสองเท่าได้อย่างง่ายดาย\n\nมันหายใจไม่สม่ำเสมอ, ดวงตาของมันกลอกไปมาด้วยความป่วยไข้ทางจิตใจอย่างรุนแรง, กีบเท้าผ่ากระทืบพื้น\n\nแล้วมันก็พุ่งเข้าใส่"
 fp1_yearly.0085.desc.fallback:0 "$fp1_yearly.0081.desc.prelude$ความเงียบแตกสลายด้วยเสียง #EMP โครมคราม#! อันดังสนั่น ขณะที่มูส (moose) มหึมาที่บ้าคลั่งพุ่งเข้ามาในฉาก, สูงกว่า [ROOT.Char.GetWomanMan] ถึงสองเท่า, รูจมูกบานออกด้วยฟองและโทสะ $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0085.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0085.a.tt_success:0 "ท่านสังหารมูสด้วยดาบ"
 fp1_yearly.0085.a.tt_failure:0 "มูสบดขยี้กระดูกท่าน"
 fp1_yearly.0085.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0085.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0085.c:0 "จุดอ่อนอยู่ที่ฐานคอ! ใช้หอกและธนูเท่านั้น!"
 fp1_yearly.0085.c.tt_success:0 "ท่านสังหารมูสลงได้โดยไม่ถูกเหยียบย่ำ"
 fp1_yearly.0085.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0085.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0085.d:0 "$fp1_yearly.0081.d$"

 fp1_yearly.0091.t:0 "พาหนะอันคู่ควรแก่ [ROOT.Char.GetTitleAsNameNoTooltip]"
 fp1_yearly.0091.desc:0 "เรือยาว (longship) ของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] บอกอะไรได้มากมายเกี่ยวกับ [ROOT.Char.GetHerHim] มันบอกว่า [ROOT.Char.GetSheHe] ร่ำรวยเพียงใด, ประสบความสำเร็จเพียงใด, ภาพลักษณ์ใดที่ [ROOT.Char.GetSheHe] ต้องการฉายให้โลกภายนอกเห็น\n\nข้ามองดูเรือลำปัจจุบันของข้าและเห็นว่ามัน... ขาดตกบกพร่อง ราวกับจะตอกย้ำความคิดนั้น, เชือกส่วนหนึ่งหลุดออกมาพร้อมเสียงดังแคร็ก, เรือทั้งลำลั่นเอี๊ยดอ๊าดอย่างน่ากลัวขณะที่มันกระจายแรงกดดันใหม่\n\nการสั่งต่อเรือลำใหม่นั้นง่ายพอ, แต่การเปลี่ยนทดแทนง่ายๆ นั้นดีพอแล้วหรือ? ข้าไม่สมควรได้รับเรือที่บอกเล่าเรื่องราว #EMP ของข้า#! ให้โลกได้รับรู้หรอกหรือ?"
 fp1_yearly.0091.a:0 "เลเวียธาน, เพื่อบรรทุกของที่ปล้นมาได้ของข้า!"
 fp1_yearly.0091.b:0 "อสูรร้าย, เพื่อข่มขวัญข้าในบังคับของข้า!"
 fp1_yearly.0091.c:0 "มังกร, เพื่อคำรามชื่อของข้า!"
 fp1_yearly.0091.d:0 "ข้าไม่ต้องการเรือราคาแพง"

 fp1_yearly.0101.t:0 "เกมปริศนาทายคำ"
 fp1_yearly.0101.desc:0 "ปริศนาเป็นงานอดิเรกอันเป็นที่รักในหมู่ชาว [ROOT.Char.GetCulture.GetNameNoTooltip] ผู้เล่นสองคนหรือมากกว่าจะแลกเปลี่ยนปัญหายากๆ ที่เพิ่มขึ้นเรื่อยๆ, มักจะเป็นคำคล้องจองและเต็มไปด้วยอุปมาอุปไมยหรือตำนาน\n\nในวันหนึ่งที่ยาวนานและเกียจคร้านเป็นพิเศษ, [riddler.Custom2('MyCharacterIntroduction',ROOT.Char)] คิดที่จะท้าทายข้าเล่นเกม, โดยมีผู้คนในราชสำนักเกือบครึ่งหนึ่งเฝ้าดูอยู่"
 fp1_yearly.0101.a:0 "เจ้าทดสอบ #EMP วาทศิลป์#! ของข้ารึ? นี่ต้องสนุกแน่!"
 fp1_yearly.0101.a.tt_success:0 "ท่านชนะเกม"
 fp1_yearly.0101.a.tt_failure:0 "[riddler.GetFirstNameNoTooltip] เอาชนะท่าน"
 fp1_yearly.0101.a.every_courtier_and_guest:0 "ทุก [courtier|E] และ [guest|E]"
 fp1_yearly.0101.b:0 "ข้าคิดว่าข้าเคยอ่านหนังสือเกี่ยวกับปริศนามาบ้าง..."
 fp1_yearly.0101.c:0 "เริ่มแรก: ใครไม่มีสมองและกำลังจะไปคุกใต้ดิน?"
 fp1_yearly.0101.c.tt:0 "ผู้คนอาจจดจำปฏิกิริยาที่เกินเหตุของท่าน..."
 fp1_yearly.0101.c.tt_nickname:0 "ข้าราชบริพารของท่านกระซิบกระซาบอยู่ข้างหลังท่าน..."
 fp1_yearly.0101.d:0 "ขอบใจ, แต่ข้าคือ [ROOT.Char.GetTitleAsNameNoTooltip], และข้ามีสิ่งที่ต้องทำ"

 fp1_yearly.0111.t:0 "ต้องสาป"
 fp1_yearly.0111.desc.intro:0 "[accursed.GetTitledFirstName] เงียบขณะที่ข้าเดินไปรอบๆ เสาโทเทมหนังม้าที่หันหน้าไปทางห้องพักของ [accursed.GetHerHis], ตรวจสอบมันจากทุกมุม [accursed.GetSheHe|U] พูดถูก, มันคือเสานีธิง (nithing pole) อย่างแน่นอน, คำสาป #EMP อันทรงพลัง#! ที่คุกคามชีวิตของ [accursed.GetHerHis]\n\nอักษรรูนที่สลักอยู่บนด้ามของมัน"
 fp1_yearly.0111.desc.skill.intrigue_high:0 "#color_blue_gray สลับซับซ้อนและวิจิตร, สัญญาถึงจุดจบที่บิดเบี้ยวและเจ็บปวด#!."
 fp1_yearly.0111.desc.skill.learning_high:0 "#color_blue_gray ลึกและเปื้อนเลือด, เห็นได้ชัดว่าทำโดยพ่อมดผู้คงแก่เรียน#!."
 fp1_yearly.0111.desc.skill.intrigue_low:0 "#color_blue_gray โหดร้ายแต่วกวน, ราวกับความคิดอันเปื้อนเลือดของคนพาลนั้นเลื่อนลอย#!."
 fp1_yearly.0111.desc.skill.learning_low:0 "#color_blue_gray อยู่ในสภาพย่ำแย่และชุ่มโชกไปด้วยเลือด, สัญญาณของพ่อมดมือสมัครเล่น#!."
 fp1_yearly.0111.desc.skill.fallback:0 "#color_blue_gray อ่านไม่ออก#!."
 fp1_yearly.0111.desc.first_connector:0 "ข้อความที่แท้จริงของคำสาป"
 fp1_yearly.0111.desc.trait_1.lazy_or_arbitrary:0 "#color_blue_gray บ่งบอกถึงความลังเลและความเกียจคร้าน#!,"
 fp1_yearly.0111.desc.trait_1.wrathful_or_impatient:0 "#color_blue_gray เดือดพล่านไปด้วยความโกรธที่ไม่สงบ#!,"
 fp1_yearly.0111.desc.trait_1.calm_or_patient:0 "#color_blue_gray สงบและแยบยลจนน่าสะพรึงกลัว#!,"
 fp1_yearly.0111.desc.trait_1.sadistic_or_arrogant:0 "#color_blue_gray บ่งบอกถึงอัตตาอันยิ่งใหญ่หรือจินตนาการอันน่าสะพรึงกลัว#!,"
 fp1_yearly.0111.desc.trait_1.callous_or_ambitious:0 "#color_blue_gray บ่งบอกถึงการไม่ใส่ใจมนุษย์ผู้อื่นโดยสิ้นเชิง#!,"
 fp1_yearly.0111.desc.trait_1.deceitful_or_craven:0 "#color_blue_gray บิดเบี้ยวและวกวนกลับไปกลับมาซ้ำๆ#!,"
 fp1_yearly.0111.desc.trait_1.brave_or_trusting:0 "#color_blue_gray โดดเด่นและสะดุดตา, มั่นใจในความชอบธรรมของตน#!,"
 fp1_yearly.0111.desc.trait_1.paranoid_or_vengeful:0 "#color_blue_gray ดูเหมือนจะเต็มไปด้วยความเกลียดชังส่วนตัวอย่างที่สุด#!,"
 fp1_yearly.0111.desc.trait_1.fallback:0 "#color_blue_gray เป็นความยุ่งเหยิงแบบสุ่ม#!,"
 fp1_yearly.0111.desc.second_connector:0 "จบลงด้วยน้ำเสียง"
 fp1_yearly.0111.desc.trait_2.lazy_or_arbitrary:0 "ที่ #color_blue_gray ค่อนข้างจะเป็นจุดจบที่ไม่น่าตื่นเต้นและอธิบายได้ไม่ดี#!."
 fp1_yearly.0111.desc.trait_2.wrathful_or_impatient:0 "ของ #color_blue_gray ความโกรธที่ขีดเขียนอย่างเร่งรีบ#!."
 fp1_yearly.0111.desc.trait_2.calm_or_patient:0 "ของ #color_blue_gray ความหลีกเลี่ยงไม่ได้อันน่าสะพรึงกลัว#!."
 fp1_yearly.0111.desc.trait_2.sadistic_or_arrogant:0 "ของ #color_blue_gray อัจฉริยภาพอันน่าสะพรึงกลัว#!."
 fp1_yearly.0111.desc.trait_2.callous_or_ambitious:0 "ของ #color_blue_gray ความโหดร้าย, ไร้ความปรานี, และเป็นที่สิ้นสุด#!."
 fp1_yearly.0111.desc.trait_2.deceitful_or_craven:0 "ของ #color_blue_gray ความขี้ขลาดอันบิดเบี้ยว#!."
 fp1_yearly.0111.desc.trait_2.brave_or_trusting:0 "ของ #color_blue_gray ความมั่นใจอย่างตรงไปตรงมาในชะตากรรมของ [accursed.GetFirstNamePossessiveNoTooltip]#!."
 fp1_yearly.0111.desc.trait_2.paranoid_or_vengeful:0 "ที่ #color_blue_gray โทษ [accursed.GetFirstNameNoTooltip] สำหรับชะตากรรมของ [accursed.GetHerHis]#!."
 fp1_yearly.0111.desc.trait_2.fallback:0 "ของ #color_blue_gray จุดจบที่ไม่น่าตื่นเต้น#!."
 fp1_yearly.0111.desc.outro:0 "\n\nเราไม่มีพยาน, และไม่มี #color_blue_gray หลักฐาน#! ใดๆ นอกจากเสาคำสาปเอง"
 fp1_yearly.0111.tt.correct_guess:0 "หากการคาดเดาของท่านถูกต้อง"
 fp1_yearly.0111.tt.wrong_guess:0 "หากการคาดเดาของท่านผิด"
 fp1_yearly.0111.tt.correct_accusation:0 "ท่านพบหลักฐานมากมายเกี่ยวกับความผิดของ [culprit.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0111.tt.correct_accusation.tt:0 "[accursed.GetTitledFirstName] ได้รับการปลดปล่อยจากคำสาปและรู้สึกขอบคุณตลอดไป"
 fp1_yearly.0111.tt.false_accusation:0 "ข้อกล่าวหาของท่านพิสูจน์ว่าไม่มีมูล"
 fp1_yearly.0111.tt.false_accusation.tt:0 "[accursed.GetTitledFirstName] เชื่อมั่นว่าจุดจบของ [accursed.GetHerHis] จะมาถึงในไม่ช้าอย่างเจ็บปวด"
 fp1_yearly.0111.a:0 "นี่มันบ่งบอกถึง [suspect_a.GetTitledFirstNameNoTooltip]!"
 fp1_yearly.0111.b:0 "บางที... [suspect_b.GetTitledFirstNameNoTooltip]..."
 fp1_yearly.0111.c:0 "[suspect_c.GetTitledFirstNameNoTooltip] ดูเหมือนจะเป็นไปได้"
 fp1_yearly.0111.d:0 "[accursed.GetFirstNameNoTooltip], เจ้ามองไม่เห็นหรือว่าทั้งหมดอยู่ในใจของเจ้า?"
 fp1_yearly.0111.d.tt_success:0 "ท่านพูดเกลี้ยกล่อม [accursed.GetFirstName] ได้สำเร็จ"
 fp1_yearly.0111.d.tt_failure:0 "[accursed.GetSheHe|U] เสียสติ"
 fp1_yearly.0111.e:0 "อย่ากังวลไปเลย, ข้ามีคาถาแก้!"

