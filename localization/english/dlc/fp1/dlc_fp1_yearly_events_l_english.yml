 # #Flavour Events
 fp1_yearly.0501.t:0 "ออกเรือ"
 fp1_yearly.0501.desc:0 "มีเหตุผลมากมายที่ข้าจะล่องเรือในน่านน้ำใกล้ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] ในยามสงบ: เพื่อแสดงอำนาจ, เพื่อขัดขวางโจรสลัด, หรือแม้ แต่เพียงเพื่อตกปลาหรือเพลิดเพลินกับลมทะเล\n\nเราอยู่ในการเดินทางเล็กๆ เช่นนั้นเมื่อข้าสังเกตเห็นเรือท้องถิ่นลำหนึ่งกำลังโคลงเคลงอยู่ในระยะไกล\n\nแม้จะมองจากที่นี่, ก็เห็นได้ชัดว่ามันได้รับความเสียหายขณะออกปล้นสะดม, ลูกเรือของมันแทบจะไม่สามารถ ทำให้มันลอยอยู่ได้ขณะที่พวกเขาวิดน้ำออกด้วยถ้วยเงินและชามเซรามิก ภาพนั้นคงจะน่าขบขันหากไม่ร้ายแรงนัก"
 fp1_yearly.0501.a:0 "หยุดและพยายามช่วยพวกเขา!"
 fp1_yearly.0501.a.tt_success:0 "ท่านช่วยลูกเรือไว้ได้"
 fp1_yearly.0501.a.tt_failure:0 "เรือจมพร้อมลูกเรือทั้งหมด"
 fp1_yearly.0501.b:0 "เราสามารถเก็บของที่ปล้นมาได้ถ้าเราฆ่าผู้รอดชีวิต..."
 fp1_yearly.0501.b.tt_success:0 "ท่านบุกยึดเรือได้อย่างง่ายดาย"
 fp1_yearly.0501.b.tt_failure:0 "ผู้รอดชีวิตหลบหนีขึ้นฝั่งไปได้"
 fp1_yearly.0501.c:0 "แล่นเรือผ่านไปเฉยๆ เถอะ"

 fp1_yearly.0511.t:0 "กลิ่นเหม็นแห่งความสำเร็จ"
 fp1_yearly.0511.desc:0 "#EMP กลิ่นนี้ทนไม่ได้เลยจริงๆ#!.\n\nเป็นเวลาหนึ่งเดือนเต็มแล้วตั้งแต่ [stinker.GetFirstName] ล้ม [ROOT.Char.Custom('GetAnimalType')] ตัวนั้นลงได้ขณะล่าสัตว์, และ [stinker.GetSheHe] #EMP ยังคง#! ถือหัวที่เต็มไปด้วยหนอนของมันไปกับ [stinker.GetHerHim]\n\nทุกคนใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] เบื่อหน่ายกับมัน, แต่ [stinker.GetSheHe] ปฏิเสธที่จะกำจัดสิ่งต้องสาปนั้น\n\nดูเหมือนว่าข้าราชบริพารที่เหลือทนไม่ไหวแล้วในที่สุด, และบังคับให้ [stinker.GetHerHim] มาหาข้าเพื่อขอคำตัดสิน"
 fp1_yearly.0511.a:0 "มันดีมาก, [stinker.GetFirstNameNoTooltip] ดีมากๆ, จริงๆ"
 fp1_yearly.0511.b:0 "ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.HealthGodName], และ [ROOT.Char.GetFaith.HouseholdGodName] ด้วย, กำจัด #EMP มัน#! ซะ!"
 fp1_yearly.0511.c:0 "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0511.d:0 "ถ้าเราหาถ้วยรางวัล #EMP ใหม่#! ให้เจ้าในคืนพรุ่งนี้ล่ะ?"
 fp1_yearly.0511.e:0 "ใช่, [stinker.GetFirstNameNoTooltip], มันเหม็น ตอนนี้โปรดออกไป"

 fp1_yearly.0521.t:0 "เลือดบนหิมะ"
 fp1_yearly.0521.desc:0 "มันมาจากไหนไม่รู้, กระแทกเข้าที่ขมับของข้าอย่างจัง ข้าไม่เห็นแม้ แต่วัตถุที่พุ่งเข้ามา, ไม่ต้องพูดถึงการพยายามหลบ, และชั่วขณะหนึ่งข้าเซ, ตาพร่ามัว\n\nเสียงหัวเราะคิกคักแหลมดังขึ้นข้างหลังข้า, และข้าหมุนตัว\n\n[child.GetFirstName] ลุกขึ้นจากที่ซ่อนของ [child.GetHerHis], ก้อนหิมะอีกก้อนกำอยู่ในมือเล็กๆ อันร้ายกาจของ [child.GetHerHis] แล้ว"
 fp1_yearly.0521.a:0 "ยิงได้ดี! มานี่เจ้าตัวแสบ!"
 fp1_yearly.0521.a.tt:0 "ท่านและ [child.GetFirstNameNoTooltip] ปาก้อนหิมะใส่กันจนปลายนิ้วแข็ง"
 fp1_yearly.0521.b:0 "#EMP โอ้! ไม่นะ! เจ้าโดนข้าแล้ว!#!"
 fp1_yearly.0521.b.tt:0 "ท่านปล่อยให้ [child.GetFirstNameNoTooltip] ปาใส่ท่านจนพอใจ [child.GetHerHis]"
 fp1_yearly.0521.c:0 "เจ้าคิดว่าเจ้าสามารถเผชิญหน้า #EMP ข้า#! ใน #EMP สงครามหิมะ#! ได้รึ!?"
 fp1_yearly.0521.c.tt:0 "เด็กหรือไม่, นี่คือการต่อสู้และท่านตั้งใจจะชนะ!"
 fp1_yearly.0521.c.tt_success:0 "ท่านเอาชนะเด็กได้สำเร็จ"
 fp1_yearly.0521.c.tt_failure:0 "[child.GetFirstNameNoTooltip] เอาชนะท่านได้อย่างราบคาบ"
 fp1_yearly.0521.d:0 "เรียกนั่นว่าการซุ่มโจมตีรึ? กลยุทธ์ #EMP ที่แท้จริง#! ต้องใช้ #EMP ความฉลาดหลักแหลม#!!"
 fp1_yearly.0521.d.tt:0 "ท่านชนะสงครามหิมะได้อย่างง่ายดาย"
 fp1_yearly.0521.e:0 "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0521.e.tt:0 "ก้อนหิมะจุดชนวนความโกรธคลั่งของท่าน"
 fp1_yearly.0521.f:0 "ข้ายุ่งอยู่, [child.GetFirstNameNoTooltip] ไปกวนคนอื่นเถอะ"

 fp1_yearly.0531.t:0 "ตระกูล [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] บนน้ำแข็ง"
 fp1_yearly.0531.desc:0 ""[ROOT.Char.Custom('GetMaPa')|U]!" [child.GetFirstName] ร้อง พลางดึงแขนเสื้อข้าเกือบทันทีที่เราก้าวไปถึงสระน้ำ "ไม่ดีเลย ข้ามันไร้ประโยชน์ ข้าเล่นสเก็ตไม่ได้ น้ำแข็งเกลียดข้า"\n\nการเหลือบมองอย่างรวดเร็วบ่งชี้ว่า [child.GetSheHe] อาจจะพูดถูก: สถานที่นั้นดูเหมือนกองทัพเดินทัพผ่าน ด้วยปริมาณน้ำแข็งที่แตกละเอียด ซึ่ง [child.Custom('GetDaughterSon')] ของข้าทิ้งไว้ในเส้นทาง [child.GetHerHis]"
 fp1_yearly.0531.a:0 "มันง่าย! นี่, ให้ข้าอธิบายให้เจ้าฟัง..."
 fp1_yearly.0531.a.tt_success:0 "[child.GetFirstNameNoTooltip] ได้รับความมั่นใจและความสมดุล"
 fp1_yearly.0531.a.tt_failure:0 "ท่านเพียงแค่ ทำให้ [child.GetHerHim] หงุดหงิดมากขึ้น"
 fp1_yearly.0531.b:0 "เราไม่มีคนรับใช้ให้เจ้ารบกวนรึ?"
 fp1_yearly.0531.c:0 "ไปเล่นข้างในเถอะ, เจ้าจะเป็นหวัด"

 fp1_yearly.0541.t:0 "อสูรร้ายแห่ง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_yearly.0541.desc:0 ""[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า" [courtier.GetTitledFirstName] พ่นลมหายใจขณะที่ [courtier.GetSheHe] เดินเข้ามาหาข้า ลาก [child.Custom('GetDaughterSon')] [child.GetFirstName] ของข้ามาด้วยหู [child.GetHerHis]\n\n"เด็กเหลือขอนี่คอยซุ่มอยู่ตามมุมต่างๆ สวมหนัง [ROOT.Char.Custom('GetAnimalType')] เป็นชุด แล้วกระโดดออกมาตะโกน ทำให้ผู้คนตกใจแทบสิ้นสติ!""
 fp1_yearly.0541.a:0 "นี่, บอกตามตรง, มันตลกสิ้นดี"
 fp1_yearly.0541.b:0 "[child.GetFirstNameNoTooltip], เจ้าจะต้องถูกลงโทษ"
 fp1_yearly.0541.c:0 "เจ้ารังแก #EMP [child.Custom('GetDaughterSon')]#! ของข้ารึ? เจ้าถูกเนรเทศ!"
 fp1_yearly.0541.d:0 "ข้าไม่สนใจจริงๆ, #EMP อย่างสุดซึ้ง#!"

 fp1_yearly.0551.t:0 "ธุรกิจคาวปลา"
 fp1_yearly.0551.desc:0 "มันเริ่มต้นจากการปฏิบัติเป็นครั้งคราว นิสัยที่ไม่ปกติ, แต่ข้าเป็น [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] ที่ดี, และ [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] คนไหนที่ไม่เคยกินปลาเฮอร์ริ่งเน่าๆ ในช่วงเวลาของ [ROOT.Char.GetHerHis]?\n\nอย่างไรก็ตาม, ในช่วงสองสามสัปดาห์ที่ผ่านมา, ความชอบของ [antisocialite.GetTitledFirstNamePossessive] ต่อปลาที่ #EMP เน่าเสีย#! อย่างสิ้นเชิงได้เปลี่ยนจากความแปลกประหลาดที่พอทนได้ไปสู่การมีอยู่ทุกหนทุกแห่งที่ส่งกลิ่นเหม็น\n\nเช้านี้, เมื่อข้าค้นพบสิ่งที่ [antisocialite.GetSheHe] ทำกับส้วม, ข้าตัดสินใจว่าข้าทนไม่ไหวแล้ว ข้าพบ [antisocialite.GetHerHim] ในโถง, ใบหน้าเปียกโชกไปด้วยน้ำเกลือเหม็นเน่า, ลูกตาปลาครึ่งหนึ่งหยดลงมาตามคางของ [antisocialite.GetHerHis] อย่างเกียจคร้าน"
 fp1_yearly.0551.a:0 "นั่งลง, [antisocialite.GetFirstNameNoTooltip] เราต้องคุยกัน"
 fp1_yearly.0551.a.tt_success:0 "ท่านอธิบายประเด็นของท่านได้อย่างฉะฉาน"
 fp1_yearly.0551.a.tt_failure:0 "[antisocialite.GetFirstNameNoTooltip] รู้สึกถูกดูหมิ่นอย่างไม่น่าเชื่อ"
 fp1_yearly.0551.b:0 "บางทีข้าอาจจะแค่ย้ายห้องพักของข้า?"
 fp1_yearly.0551.b.tt:0 "[antisocialite.GetFirstNameNoTooltip] จะยังคงส่งกลิ่นเหม็นไปทั่วสถานที่"
 fp1_yearly.0551.b_alt:0 "ทำ... ทำไมเจ้าถึงมีของนั่นอีก?"
 fp1_yearly.0551.b_alt.tt:0 "ท่านและ [antisocialite.GetFirstNameNoTooltip] ส่งกลิ่นเหม็นไปทั่วสถานที่ด้วยกัน"
 fp1_yearly.0551.c:0 "รู้อะไรไหม? คุกใต้ดิน #EMP เดี๋ยวนี้#!."
 fp1_yearly.0551.d:0 "น่าเสียดายจริงๆ, ดูเหมือนว่าความสนใจของข้าเป็นที่ต้องการ #EMP อย่างยิ่ง#! ที่อื่น!"

 fp1_yearly.0561.t:0 "แขนข้าปะทะแขนเจ้า"
 fp1_yearly.0561.desc:1 ""ว่าอย่างไร, [ROOT.Char.GetFirstNameNoTooltip]?" [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] เรอระหว่างการดื่มจากเหยือกของ [knight.GetHerHis] [knight.Custom('GetYoungMiddleAgedOld')] [knight.GetWomanMan] เบ่งกล้ามของ [knight.GetHerHis] อย่างภาคภูมิใจ\n\n"คิดว่าเจ้าจะเอาชนะข้าในการงัดข้อได้รึ? เอาเลย, ใครถึงสามก่อนชนะ"\n\nช้อนของข้าหยุดกลางคันระหว่างทางไปปาก, แต่โรงเตี๊ยมก็ระเบิดเสียงเชียร์และโห่ร้องอย่างอึกทึก, สมาชิกชั้นผู้น้อยในคณะผู้ติดตามของข้ากระตือรือร้นที่จะเป็นสักขีพยานในการประลอง"
 fp1_yearly.0561.a:0 "เจ้าท้าทายข้ารึ?"
 fp1_yearly.0561.a.tt_success:0 "ท่านเอาชนะ [knight.GetFirstNameNoTooltip]"
 fp1_yearly.0561.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] ชนะ"
 fp1_yearly.0561.b:0 "#EMP *หักข้อนิ้ว*#!"
 fp1_yearly.0561.b.tt:0 "ท่านชนะสามครั้งรวดได้อย่างง่ายดาย"
 fp1_yearly.0561.c:0 "แน่นอน, ข้ารู้เคล็ดลับอยู่บ้าง..."
 fp1_yearly.0561.c.tt_success:0 "ท่านโกงจนได้ชัยชนะอย่างน่าทึ่ง"
 fp1_yearly.0561.c.tt_failure:0 "[knight.GetFirstNameNoTooltip] ค้นพบการหลอกลวงของท่าน"
 fp1_yearly.0561.d:0 "[knight.GetFirstNameNoTooltip], ข้ากำลังกินอยู่ ไปกวนคนอื่นเถอะ"

 fp1_yearly.0571.t:0 "การทำลายทรัพย์สินเล็กน้อย"
 fp1_yearly.0571.desc:0 ""[ROOT.Char.GetTitledFirstNameNoTooltip]!"" [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ร้อง ข้างหลัง [courtier.GetHerHim], [courtier.GetWomanMan] ดึง [child.Custom('GetDaughterSon')] ของข้า [child.GetFirstName], ทั้งสองคนมัว แต่ทำหน้าบึ้งใส่กันจนแทบไม่ได้สบตากับข้า\n\n"เด็กคนนี้ถูกจับได้ว่าทำลายศิลาจารึกอักษรรูน (runestone) ของท่านใน [vandal_site.GetNameNoTier], วาดรูปอวัยวะเพศบนตัวหนอนและขีดเขียนสิ่งสกปรกแทนคำพูด""
 fp1_yearly.0571.a:0 "ปล่อย [child.Custom('GirlBoy')] ไว้กับข้า, ข้าจะคุยกับ [child.GetHerHim]"
 fp1_yearly.0571.tt_success:0 "[child.GetFirstNameNoTooltip] เห็นความผิดพลาดในวิถีทางของ [child.GetHerHis]"
 fp1_yearly.0571.tt_failure:0 "[child.GetFirstNameNoTooltip] ไม่เข้าใจว่าปัญหาคืออะไร"
 fp1_yearly.0571.b:0 "ข้าจะปรับค่าซ่อมแซมจากของ #EMP ของเจ้า#!, [child.GetFirstNameNoTooltip]!"
 fp1_yearly.0571.b.tt:0 "ศิลาจารึกอักษรรูนได้รับการซ่อมแซม"
 fp1_yearly.0571.b.2:0 "ไม่เป็นไร, ข้าจ่ายได้"
 fp1_yearly.0571.c:0 "[child.GetSheHe|U] เป็นแค่เด็ก, [courtier.GetFirstNameNoTooltip], ใจเย็นๆ"

 fp1_yearly.0581.t:0 "เมื่อข้าเติบใหญ่"
 fp1_yearly.0581.desc.intro:0 "ความเจ็บปวดอย่างกะทันหันและรุนแรงที่ด้านหลังหน้าแข้งของข้าตามมาด้วยเสียงกรีดร้องที่ ทำให้เลือดเย็นยะเยือกจากข้างหลังข้า ข้าหมุนตัว, พร้อมที่จะป้องกันตัวเอง, และเผชิญหน้ากับร่างเล็กๆ ของ [child.GetFirstName] ที่ถือไม้ท่อนหนาเป็นกระบอง"
 fp1_yearly.0581.desc.victim:0 "ข้างหลัง [child.GetHerHim] ยิ้มเยาะ [victim.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 fp1_yearly.0581.desc.outro:0 "\n\n"จงกลัวข้า! ไวกิงผู้น่าสะพรึงกลัว [child.GetFirstNameNoTooltip] มาเพื่อทองคำและพระของเจ้าแล้ว!" [child.Custom('GetDaughterSon')] ของข้ากรีดร้อง, พร้อมกับตีเข้าที่เข่าของข้า หมวกหม้อดีบุกของ [child.GetHerHis|U] เลื่อนลงมาปิดตาของ [child.GetHerHis], ดังนั้นสิ่งที่ข้าเห็นทั้งหมดคือรอยยิ้มฟันหลอที่ยิ้มให้ข้า\n\n"[ROOT.Char.Custom('GetMaPa')|U], ข้าเป็น [child.Custom('ShieldPersonFemaleMale')] ได้ไหมเมื่อข้าโตขึ้น?""
 fp1_yearly.0581.a:0 "ลูกข้า, เจ้าจะ ทำให้โลกทั้งใบ #EMP สั่นสะเทือน#!."
 fp1_yearly.0581.a.tt:0 "[child.GetFirstNameNoTooltip] มีแนวโน้มที่จะกลายเป็น [GetTrait('shieldmaiden').GetName(child.Self)] มากขึ้นอย่างมีนัยสำคัญ"
 fp1_yearly.0581.b:0 "เป้าหมายอันสูงส่ง! รับไปเลย, เจ้าคนพาล!"
 fp1_yearly.0581.b.tt:0 "$fp1_yearly.0581.a.tt$"
 fp1_yearly.0581.c:0 "บางที, ถ้าเจ้าพิสูจน์ตัวเองกับ [victim.GetFirstNameNoTooltip]..."
 fp1_yearly.0581.d:0 "หยุดรบกวนข้าด้วยความฝันโง่ๆ"
 fp1_yearly.0581.e:0 "ฮ่า! เราจะได้เห็นกัน, เจ้าตัวเล็ก"

 fp1_yearly.0591.t:0 "เสียงดังโหวกเหวกในการประชุมทิง"
 fp1_yearly.0591.desc:1 "การประชุมทิง (Ting-meet) เป็นงานที่จำเป็นสำหรับ [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีทุกคน, โดย [dummy_gender.GetWomenMen] อิสระทุกคนในพื้นที่จะมารวมตัวกันเพื่อหารือเกี่ยวกับกิจการท้องถิ่น, ตลาด, และแย่งชิงสิทธิพิเศษนี้หรือนั้น\n\nตามที่คาดไว้กับการรวมตัวครั้งใหญ่ เช่นนี้, พวกเขามีแนวโน้มที่จะร้อนแรง, และการประชุมทิงครั้งนี้ก็ไม่มีข้อยกเว้น\n\nข้าพยายามติดตามรายละเอียดท่ามกลางเสียงตะโกนทั้งหมด, แต่ดูเหมือนว่า [dummy_gender.GetWomenMen] จาก [county_a.GetNameNoTier]"
 fp1_yearly.0591.desc.border_dispute:0 "กำลังทะเลาะกันเรื่องหมู่บ้านตามแนวชายแดนกับ [county_b.GetNameNoTier], โดยทั้งสองกลุ่มอ้างสิทธิ์ในที่ดิน"
 fp1_yearly.0591.desc.stolen_flocks:0 "กล่าวหาผู้มีอิทธิพลคนสำคัญจาก [county_b.GetNameNoTier] ว่าขโมยฝูงสัตว์ของพวกเขา"
 fp1_yearly.0591.desc.kidnapped_child:0 "กำลังกรีดร้องใส่คู่กรณีจาก [county_b.GetNameNoTier] ที่ถูกกล่าวหาว่าลักพาตัวเด็ก"
 fp1_yearly.0591.desc.drunken_arson:0 "กำลังประท้วงความบริสุทธิ์ของตนในการวางเพลิงหลายครั้งขณะเมาสุราใน [county_b.GetNameNoTier]"
 fp1_yearly.0591.desc.lost_dog:0 "อ้างว่าสุนัขสัญลักษณ์ของหมู่บ้านถูกขโมยโดยคนพาลขี้อิจฉาจาก [county_b.GetNameNoTier]"
 fp1_yearly.0591.desc.disrupted_wedding:0 "เรียกร้องค่าชดเชยสำหรับงาน แต่งงานที่ตกอยู่ในความโกลาหลโดยแขกที่เมามายจาก [county_b.GetNameNoTier]"
 fp1_yearly.0591.desc.suspicious_will:0 "กำลังยืนกรานในความถูกต้องของพินัยกรรมที่ยกที่ดินผืนใหญ่ใน [county_b.GetNameNoTier] ให้พวกเขา"
 fp1_yearly.0591.desc.sheltered_criminal:0 "ได้ให้ที่พักพิงแก่อาชญากรจาก [county_b.GetNameNoTier]"
 fp1_yearly.0591.desc.bad_luck:0 "กำลังร้องไห้ว่าพวกเขาถูกสาปแช่งโดยผู้ใช้เวทมนตร์จาก [county_b.GetNameNoTier]"
 fp1_yearly.0591.desc.fly_tipping:0 "กำลังดื้อรั้นเกี่ยวกับการทิ้งขยะของเมืองตามแนวชายแดนกับ [county_b.GetNameNoTier]"
 fp1_yearly.0591.a:0 "ผู้คนแห่ง [county_a.GetNameNoTierNoTooltip] พูดถูก"
 fp1_yearly.0591.b:0 "[county_b.GetNameNoTierNoTooltip] ได้รับการสนับสนุนจากข้า!"
 fp1_yearly.0591.c:0 "[dummy_gender.GetWomenMen] ที่ดีแห่ง [county_a.GetNameNoTierNoTooltip] จะยอมรับสิ่งนี้จาก #EMP [county_b.GetNameNoTierNoTooltip]#! รึ?"
 fp1_yearly.0591.d:0 "เดี๋ยวพวกเขาก็เหนื่อยกันไปเองในที่สุด"

 fp1_yearly.0601.t:0 "ส่วนที่ยากที่สุดของการปกครอง"
 fp1_yearly.0601.desc:0 "โดยธรรมชาติแล้ว, การประชุมทิง (Ting-meet) มักจะ #EMP น่าเบื่อ#! อย่างยิ่ง\n\nหากอารมณ์ไม่ปะทุและไม่มีใครแสดงท่าทีเกินจริง, มันก็เป็นเพียงรายชื่อยาวๆ ของ [dummy_gender.GetWomenMen] อิสระชั้นผู้น้อยที่หารือเกี่ยวกับเรื่องเล็กน้อยและยืนตากฝน แต่ในฐานะ [ROOT.Char.GetTitleAsNameNoTooltip], ข้าจำเป็นต้องอยู่ที่นี่\n\nแก่ลงทุกวินาที\n\nเฝ้าดู [dummy_gender.GetWomenMen] แห่ง [county.GetNameNoTier] พูดคุยกันจนตายไปข้างหนึ่ง\n\nปรารถนาสงครามเพื่อช่วยข้าให้พ้นจากนรกบนดินนี้"
 fp1_yearly.0601.a:0 "ต้อง. ตั้งสติ. ไว้"
 fp1_yearly.0601.a.tt_success:0 "ท่านฝ่าฟันไปได้และยังคงสงบนิ่ง"
 fp1_yearly.0601.a.tt_failure:0 "ท่านทรุดตัวลงจากเก้าอี้"
 fp1_yearly.0601.b:0 "ข้าสามารถทำสิ่งที่มีประโยชน์มากมายด้วยเวลานี้..."
 fp1_yearly.0601.c:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.d:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.e:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.f:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.g:0 "นี่มันไร้ประโยชน์, ข้าจะไปงีบ"
 fp1_yearly.0601.g.nickname:0 "การแสดงตลกของท่าน ส่งผลให้มีฉายาใหม่"

 fp1_yearly.0611.t:0 "นำโดยเป็นแบบอย่าง"
 fp1_yearly.0611.desc:0 ""[ROOT.Char.Custom('GetMaPa')|U]!" [child_b.GetFirstNameNoTooltip] กรีดร้อง วิ่งเข้ามาหาข้า ร้องไห้ โดยมี [child_a.GetFirstNameNoTooltip] ที่ดูรู้สึกผิดตามมาด้วย แผลขนาดใหญ่ปรากฏบนใบหน้า [child_b.Custom('GetDaughterSon')] ของข้า ตื้น แต่ยังคงมีเลือดไหลซึม "[child_a.GetSheHe|U] ตีข้าด้วยดาบ #EMP จริง#! บอกว่า [child_a.GetSheHe] จะเป็นนักรบเหมือนท่าน!"\n\n[child_a.GetFirstNameNoTooltip] ไม่กล้าสบตา [child_a.GetHerselfHimself] กับข้า\n\n"มันเป็นอุบัติเหตุ เราแค่เล่นกัน..."
 fp1_yearly.0611.a:0 "ฟังนะ, #EMP สงคราม#! ไม่ใช่ #EMP เกม#!!"
 fp1_yearly.0611.a.tt_success:0 "[child_a.GetFirstNameNoTooltip] เข้าใจและกล่าวขอโทษ"
 fp1_yearly.0611.a.tt_failure:0 "การพูดคุยของท่านเพียงอย่างเดียวก่อให้เกิดความรู้สึกขมขื่น"
 fp1_yearly.0611.b:0 "ฮ่า! เจ้ากำลังเจริญรอยตาม [ROOT.Char.Custom('GetMaPa')] เฒ่าของเจ้า, [child_a.GetFirstNameNoTooltip]!"
 fp1_yearly.0611.c:0 "เอาล่ะ, [child_b.GetFirstNameNoTooltip], ให้ข้าสอนวิธีป้องกันตัวจากคนพาลให้เจ้า"
 fp1_yearly.0611.d:0 "เด็กๆ, เอาเรื่องนี้ไปให้พี่เลี้ยงของเจ้า"

 fp1_yearly.0621.t:0 "ของเล่นใหม่แวววาว"
 fp1_yearly.0621.desc:0 "เราเพิ่งขนของที่ปล้นมาสดๆ ชิ้นสุดท้ายลงจากเรือเมื่อ [child.Custom('GetDaughterSon')] ของข้า [child.GetFirstName] มาถึง, ยิ้มกว้างและขอให้เล่าเรื่อง ข้าฟัน [dummy_gender.GetWomenMen] ไปกี่คน? เมื่อไหร่ [child.GetSheHe] จะได้ไปปล้นสะดมด้วย? ข้าเห็นมังกรทะเลบ้างไหม?\n\nคำถามถาโถมไม่สิ้นสุด จนกระทั่ง [child.Custom('GirlBoy')] เห็นถ้วยเงินขนาดใหญ่วางอยู่บนหีบสมบัติที่ใหญ่ที่สุด, เลือดแห้งของเจ้าของคนก่อนยังคงค่อยๆ ลอกออกจากด้านข้าง\n\n"[ROOT.Char.Custom('GetMaPa')|U], นั่นสวยจัง! ข้า... ข้าขอมันได้ไหม?""
 fp1_yearly.0621.a:0 "แน่นอนเจ้าเอามันไปได้!"
 fp1_yearly.0621.b:0 "ตอนนี้ไม่ได้: บางทีเมื่อเจ้าโตขึ้น, เจ้าอาจจะหามาได้ด้วยตัวเอง"
 fp1_yearly.0621.c:0 "ไปให้พ้น! นี่สำหรับผู้ใหญ่!"

 fp1_yearly.0631.t:0 "แนวคิดเย้ยหยัน"
 fp1_yearly.0631.desc:0 "เมื่อกลับมาจากการปล้นสะดมที่ประสบความสำเร็จ, [ROOT.Char.GetCulture.GetNameNoTooltip][cynic.GetWomanMan] ที่ดีทุกคนรู้ว่าต้องเสียสละส่วนหนึ่งของสิ่งที่ได้มาให้กับ [ROOT.Char.GetFaith.PantheonTerm]\n\n[ROOT.Char.GetCulture.GetNameNoTooltip] ที่ดีทุกคนยกเว้น [cynic.GetTitledFirstName], นั่นคือ\n\nขณะที่พวกเราที่เหลือกำลังแบ่งของที่ปล้นมาได้, โอ้อวดถึงชิ้นที่ดีที่สุดของเราและหารือกันว่าชิ้นไหนที่เราจะมอบให้เพื่อขอบคุณสำหรับโชคลาภและลมที่พัดเป็นใจ, ข้าสังเกตเห็นว่า [cynic.GetSheHe] ยังคงเงียบ\n\nเมื่อเผชิญหน้ากับ [cynic.GetWomanMan], [cynic.GetSheHe] ถึงกับยอมรับว่า: "ข้าไม่เห็นมือของ [cynic.GetFaith.PantheonTerm] ในการปล้นสะดมของเราเลย, [ROOT.Char.GetTitleAsNameNoTooltip] ของข้า, เห็นเพียงมือของข้าเองที่ทำงานของข้าเอง ส่วนแบ่งของข้ามีไว้สำหรับข้า""
 fp1_yearly.0631.a:0 "[cynic.GetFirstNameNoTooltip], เจ้าใกล้จะหมิ่นประมาทแล้ว!"
 fp1_yearly.0631.a.tt_success:0 "ท่านประสบความสำเร็จในการ ทำให้ [cynic.GetHerHim] อับอาย"
 fp1_yearly.0631.a.tt_failure:0 "[cynic.GetFirstNameNoTooltip] ทำให้ท่านดูเป็นคนโง่"
 fp1_yearly.0631.b:0 "อืม, ความคิดดี ทุกเล็กน้อยช่วยได้..."
 fp1_yearly.0631.c:0 "เอ๊ะ, ไม่ใช่เรื่องของข้า"

 fp1_yearly.0641.t:0 "คู่ควรแก่มหาสมุทร"
 fp1_yearly.0641.desc:0 "เรือยาว (Longship) เป็นหัวใจสำคัญของอำนาจของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ในหลายๆ ด้าน หากไม่มีทางออกสู่ทะเล, เราจะเป็นอะไรได้นอกจากหมาป่าที่ติดกับ, ไม่สามารถล่าหรือท่องไปได้?\n\nด้วยความตื่นตระหนกไม่น้อย, การตรวจสอบเรือที่เก็บไว้ล่าสุดของข้าแสดงให้เห็นว่าหลายลำเริ่มขึ้นราและผุพัง, ลำเรือที่ต่อกันอย่างระมัดระวังตกอยู่ในอันตรายที่จะแตกออกจากกันเมื่อกลับลงสู่น้ำ"
 fp1_yearly.0641.a:0 "ค่าซ่อมมันคงไม่แพงขนาดนั้นหรอก..."
 fp1_yearly.0641.a.tt:0 "เรือได้รับการซ่อมแซมโดยไม่มีปัญหา"
 fp1_yearly.0641.b:0 "[neighbour.GetTitledFirstNameNoTooltip] ไม่มีกองเรือที่ค่อนข้างใหม่กว่ารึ?"
 fp1_yearly.0641.b.tt_success:0 "ท่านขโมยเรือที่ดีที่สุดของ [neighbour.GetFirstNamePossessiveNoTooltip] ได้สำเร็จ"
 fp1_yearly.0641.b.tt_failure:0 "ท่านถูกจับได้และต้องหลบหนี"
 fp1_yearly.0641.c:0 "มันจะประหยัดในระยะยาวถ้าจ่ายเพื่อสิ่งที่ดีที่สุดตอนนี้"
 fp1_yearly.0641.d:0 "บ๊ะ, ปล่อยให้มันเน่าไป จะเสียหายอะไร?"

 fp1_yearly.0651.t:0 "เลเวียธาน"
 fp1_yearly.0651.desc:0 "เป็นการสมควรที่ [ROOT.Char.GetTitleAsNameNoTooltip] ที่แข็งแกร่งจะใช้เวลาในทะเล, สัมผัสอากาศเค็มบนใบหน้าของ [ROOT.Char.GetHerHis] และมีเรือชั้นดีอยู่ใต้เท้าของ [ROOT.Char.GetHerHis] วันนี้เห็นเรือส่วนตัวของข้าและกองเรือคุ้มกันขนาดเล็กออกฝึกซ้อม, ฝึกฝน, และเพื่อความเพลิดเพลิน\n\nการเดินทางสั้นๆ เป็นการเปลี่ยนแปลงที่น่าตื่นเต้นจากชีวิตที่ [ROOT.Char.Custom('GetCourt')], เมื่อเราสังเกตเห็นมัน: กลุ่มน้ำพุในระยะไกล, ตามด้วยเกาะเล็กๆ ที่มีเนื้อสีม่วงเข้มกลิ้งออกมาจากคลื่น\n\nสัตว์ร้ายที่ยิ่งใหญ่ที่สุดแห่งห้วงลึกทั้งปวง\n\n#EMP วาฬ#!."
 fp1_yearly.0651.a:0 "เอาฉมวกมา!"
 fp1_yearly.0651.a.tt_success:0 "ท่านสังหารวาฬและลากมันขึ้นฝั่ง"
 fp1_yearly.0651.a.tt_failure:0 "สัตว์ร้ายหนีรอดจากท่านไปได้"
 fp1_yearly.0651.b:0 "ให้คนอื่นจัดการ, แค่นำซากมาให้ข้า"
 fp1_yearly.0651.c:0 "ช่างเป็นเหยื่อที่ #EMP ยิ่งใหญ่#! เสียนี่กระไร!"
 fp1_yearly.0651.c.tt:0 "ท่านเผชิญหน้ากับเลเวียธาน #EMP ที่แท้จริง#! แห่งห้วงลึก"
 fp1_yearly.0651.c.tt_success:0 "$fp1_yearly.0651.a.tt_success$"
 fp1_yearly.0651.c.tt_failure:0 "$fp1_yearly.0651.a.tt_failure$"
 fp1_yearly.0651.d:0 "สิ่งมีชีวิตอันสง่างามน่าเกรงขาม, ปล่อยมันไป"
 fp1_yearly.0651.d.tt:0 "วาฬเป็นอิสระ"

 fp1_yearly.0661.t:0 "ความท้าทายแปลกใหม่"
 fp1_yearly.0661.desc:0 ""ทั้งหมดที่ข้ากำลังพูด, [ROOT.Char.GetTitledFirstNameNoTooltip], คือสกีนั้นสนุกแม้จะไม่ได้ล่าสัตว์ มันไม่ควรจะแปลกประหลาดนักที่จะเล่นสกีเพื่อความสุข, ไม่ใช่แค่ประโยชน์ใช้สอย", [knight.GetTitledFirstName] พูดพึมพำที่โต๊ะอาหารเย็น\n\nข้ารู้สึกเหมือนอยู่ในบทสนทนานี้มาทั้งชีวิต [knight.Custom('WomanManPossessive')] หมกมุ่น\n\n"เราควรลองดู, ตอนนี้, ในขณะที่หิมะหนาและสดใหม่! มีเนินเขาสูงชันอยู่ไม่ไกลจากที่นี่ ข้าพนันได้เลยว่าข้าสามารถไปถึงด้านล่างก่อนเจ้า, และเราทั้งคู่จะมีช่วงเวลาที่ดี!""
 fp1_yearly.0661.a:0 "ช่างแปลกประหลาด! ข้ารับคำท้า"
 fp1_yearly.0661.a.tt_success:0 "มันสูสี, แต่ท่านชนะ!"
 fp1_yearly.0661.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] ไถลไปสู่ชัยชนะ"
 fp1_yearly.0661.a.2:0 "ออกไปท่ามกลางหิมะรึ? ข้ารับคำท้า"
 fp1_yearly.0661.a.2.tt:0 "ท่านไถลไปสู่ชัยชนะได้อย่างง่ายดาย"
 fp1_yearly.0661.b:0 "อืมมม, บางทีข้าอาจจะใช้ #EMP ความได้เปรียบ#! เล็กน้อย..."
 fp1_yearly.0661.b.tt_success:0 "ท่านได้ชัยชนะ #EMP อย่างง่ายดาย#!"
 fp1_yearly.0661.b.tt_failure:0 "ท่านถูกจับได้ว่าทำลายสกีของ [knight.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0661.c:0 "การเล่นสกี #EMP แข่งขัน#!? โดยไม่มีการล่าสัตว์รึ? ฟังดูน่าเบื่อ"

 fp1_yearly.0671.t:0 "ทางลาดลื่น"
 fp1_yearly.0671.desc:0 ""[ROOT.Char.Custom('GetMaPa')|U]!" [child.GetFirstNameNoTooltip] ตะโกน, เข้ามาที่หูของข้าโดยตรง ตาของข้าเปิดขึ้นอย่างไม่เต็มใจ, ทีละข้าง นั่นเป็นวิธีหนึ่งในการปลุก, ข้าเดาว่า\n\nเด็กเล็กข้างเตียงของข้ากำลังสั่นสะท้านด้วยความตื่นเต้น, กำถุงมือและถาดไม้ราคาแพงไว้\n\n"ข้างนอกหิมะตกและข้าอยากไป #EMP เล่นเลื่อนหิมะ#!! ท่านจะพาข้าไปไหม?""
 fp1_yearly.0671.a:0 "ฮ่า, แค่ให้ข้าลากโต๊ะออกมาให้เรา!"
 fp1_yearly.0671.b:0 "มาเถอะ, ไปเอาถาดจากพ่อครัวกัน!"
 fp1_yearly.0671.c:0 "ไปถาม [sibling.Custom('SisterBrother')] ของเจ้าสิ"
 fp1_yearly.0671.d:0 "ไปให้พ้น, [ROOT.Char.GetMotherFather] กำลังพักผ่อน"

 fp1_yearly.0681.t:0 "เหตุใดข้าจึงไปไม่ได้?"
 fp1_yearly.0681.desc:0 "$knight_culture_player_plural_no_tooltip_lowercase$ ของข้าและตัวข้ากำลังเพลิดเพลินกับค่ำคืนอันดีงามใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], แบ่งปันเรื่องราวการต่อสู้เก่าๆ และการปล้นสะดมในอดีต, หัวเราะ, โอ้อวด, และโดยทั่วไปแล้วจมดิ่งลงไปในถ้วยของเรา เป็นช่วงเวลาที่ดี, สรุปได้\n\nอย่างเลือนลาง, ข้าสังเกตเห็นเงาที่อ้อยอิ่งอยู่รอบประตูห้องทำงานของข้า, และเรียกผู้บุกรุกเข้ามา มือต่างๆ เอื้อมไปจับด้ามดาบทั่วห้อง\n\nแทนที่จะเป็นนักฆ่า, [child.Custom('GetDaughterSon')] ของข้า [child.GetFirstName] ก็ปรากฏตัวขึ้น, ใบหน้ามุ่งมั่น, [child.Custom('HandHands')] กำแน่นเป็น [child.Custom('Fist_ArticleBlank')][child.Custom('FistFists')] เล็กๆ\n\n"[ROOT.Char.Custom('GetMaPa')|U], ข้าอยากไปปล้นสะดมด้วย! มันไม่ยุติธรรมที่ข้าถูกทิ้งไว้ข้างหลังเพียง เพราะข้ายังเด็ก!""
 fp1_yearly.0681.a:0 "ข้ากำลังทิ้งเจ้าไว้เพื่อปกป้อง [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], โอเคไหม?"
 fp1_yearly.0681.b:0 "#EMP ฮ่า!#! เจ้าจะไม่มีวันเป็นนักรบ #EMP ที่แท้จริง#!, เด็กน้อย"
 fp1_yearly.0681.b.haughty_knights:0 "ทุก [knight|E] ที่หยิ่งยโส"
 fp1_yearly.0681.c:0 "เราจะคุยกันเรื่องนี้เมื่อเจ้าโตขึ้น"

 fp1_yearly.0691.t:0 "ความพยายามไถ่บาป"
 fp1_yearly.0691.desc:0 "เวลาดึกแล้วเมื่อ [knight.GetTitledFirstName] เข้ามาหาข้า, กระเป๋าสะพายที่บรรจุของเต็มเปี่ยมพาดอยู่บนหลังของ [knight.GetHerHis]\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip], ข้าเสียใจที่ต้องบอกท่านเรื่องนี้, แต่ข้าไม่สามารถรับใช้ท่านต่อไปได้\n\n"นับตั้งแต่การปล้นสะดมที่ [county.GetNameNoTier], ข้าถูกครอบงำด้วยความรู้สึกผิดต่อการกระทำของข้า, และทาส [knight.GetFaith.GetAdherentName] ของข้าบอกข้าว่ามีเพียงการยอมรับ [knight.GetFaith.HighGodName] เข้ามาในใจเท่านั้นที่จิตวิญญาณของข้าจะได้รับการช่วยให้รอด\n\n"ด้วยหัวใจที่หนักอึ้ง ข้าต้องออกจากราชสำนักอันบาปหนาของท่านและสิ่งเลวร้ายที่ข้าทำในการรับใช้ท่าน""
 fp1_yearly.0691.a:0 "แน่นอนว่าข้าสามารถพูดเกลี้ยกล่อมให้ท่านออกจากศรัทธาต่างถิ่นนี้ได้?"
 fp1_yearly.0691.a.tt_success:0 "ท่านนำ [knight.GetFirstNameNoTooltip] กลับสู่แสงสว่าง"
 fp1_yearly.0691.a.tt_failure:0 "[knight.GetSheHe|U] ปฏิเสธที่จะรับฟังเหตุผล"
 fp1_yearly.0691.b:0 "[knight.GetFaith.GetReligion.GetNameNoTooltip]? เจ้าเสียสติไปแล้ว ทหาร!"
 fp1_yearly.0691.b.same_faith_courtiers_and_guests:0 "[courtiers|E] และ [guests|E] ที่มี [faith|E] เดียวกัน"
 fp1_yearly.0691.c:0 "เจ้าอาจจากไปหากเจ้าต้องการ"

 ##################################################
 # #Special Events
 fp1_yearly.1001.t:0 "คนแปลกหน้าในราชสำนัก"
 fp1_yearly.1001.desc.intro:0 "หลายครั้งในช่วงสองสามวันที่ผ่านมา, ข้าสังเกตเห็นคนพเนจรลึกลับ, [stranger.GetFirstName], ที่ราชสำนัก ข้าจำใบหน้าของ [stranger.GetHerHis] ไม่ได้ และจำการประกาศการมาถึงของ [stranger.GetHerHis] ไม่ได้\n\n"
 fp1_yearly.1001.desc.behaviour_1.sneaks:0 "[stranger.GetSheHe|U] ลอบเข้ามาในสถานที่,"
 fp1_yearly.1001.desc.behaviour_1.leaves_early:0 "[stranger.GetSheHe|U] มักจะออกจากอาหารค่ำเร็วเสมอ,"
 fp1_yearly.1001.desc.behaviour_1.earnest:0 "[stranger.GetSheHe|U] ใช้เวลาหลายชั่วโมงในการสนทนาอย่างจริงจังกับข้าราชบริพาร,"
 fp1_yearly.1001.desc.behaviour_1.confident:0 "[stranger.GetSheHe|U] เดินอย่างมั่นใจ #EMP ทุกหนทุกแห่ง#!,"
 fp1_yearly.1001.desc.behaviour_1.talkative:0 "[stranger.GetSheHe|U] ใช้เวลาหลายชั่วโมงพูดคุยกับใครก็ตามและทุกคน,"
 fp1_yearly.1001.desc.behaviour_1.eats_their_fill:0 "[stranger.GetSheHe|U] ไม่เคยเหลืออาหารแม้ แต่น้อยในมื้อค่ำ,"
 fp1_yearly.1001.desc.behaviour_2.sneaks:0 "และลอบเข้ามาในสถานที่จนดึกดื่น"
 fp1_yearly.1001.desc.behaviour_2.leaves_early:0 "และไม่เคยอยู่ที่อาหารค่ำนานเกินกว่าที่ [stranger.GetSheHe] จำเป็นต้องอยู่"
 fp1_yearly.1001.desc.behaviour_2.earnest:0 "และใช้เวลาหลายชั่วโมงในการสนทนาอย่างจริงจังกับข้าราชบริพารของข้า"
 fp1_yearly.1001.desc.behaviour_2.confident:0 "และเดินอย่างมั่นใจ #EMP ทุกหนทุกแห่ง#!"
 fp1_yearly.1001.desc.behaviour_2.talkative:0 "และใช้เวลาหลายชั่วโมงพูดคุยกับใครก็ตามที่บังเอิญผ่านทางของ [stranger.GetHerHis]"
 fp1_yearly.1001.desc.behaviour_2.eats_their_fill:0 "และไม่เคยเหลืออาหารแม้ แต่น้อยในมื้อค่ำ"
 fp1_yearly.1001.desc.outro:0 "บางที [stranger.GetSheHe] อาจไม่มีอะไร, แต่บางอย่างเกี่ยวกับ [stranger.GetHerHim] ทำให้ข้ารู้สึกไม่สบายใจ\n\nคนพเนจรคนหนึ่งสามารถก่อความวุ่นวายอะไรได้ในหนึ่งหรือสองวัน?"
 fp1_yearly.1001.probably_harmless.tt:0 "สิ่งนี้จะมีผลกระทบน้อยที่สุด"
 fp1_yearly.1001.guest_of_honour.tt:0 "สิ่งนี้จะมีผลกระทบ #EMP อย่างมาก#!"
 fp1_yearly.1001.mysterious_stranger_disappears.tt:0 "คนแปลกหน้าลึกลับหายตัวไป..."
 fp1_yearly.1001.a:0 "[stranger.GetSheHe|U] คงไม่มีพิษภัย"
 fp1_yearly.1001.b:1 "คนพเนจรรึ? ข้าจะ ทำให้ [stranger.GetHerHim] เป็นแขกผู้มีเกียรติ!"
 fp1_yearly.1001.c:0 "ทหาร! โยนขอทานนั่นออกไป!"
 fp1_yearly.1011.t:0 "$fp1_yearly.1001.t$: โกธิ"
 fp1_yearly.1011.desc.critical_preamble:0 "ความแปลกประหลาดของ [stranger.GetNamePossessiveNoTooltip] เพิ่มขึ้นตามสัดส่วนของการดูแลที่ดีของ [stranger.GetHerHis], แต่ความผิดปกติของ [stranger.GetHerHis] ไม่เคยน่าตกใจ หลังจากตัดสินใจที่จะปล่อยมันไป, ข้าตกใจเมื่อ [stranger.GetNameNoTooltip] ปรากฏตัวในคืนหนึ่ง, โดยไม่มีการเตือน, ในห้องส่วนตัวของข้า\n\n"
 fp1_yearly.1011.desc.critical_epilogue:0 "\n\nเช่นนั้น, [stranger.GetNameNoTooltip] ก็หายไป, และข้ารู้โดยสัญชาตญาณว่าจะไม่พบร่องรอยใดๆ ของ [stranger.GetHerHim] ในตอนเช้า"
 fp1_yearly.1011.desc.standard_preamble:0 "[stranger.GetNameNoTooltip] ยังคงด้อมๆ มองๆ อยู่รอบราชสำนัก, แต่ [stranger.GetSheHe] ดูเหมือนจะทำอะไรเพียงเล็กน้อยนอกจากการ ทำให้ผู้คนรู้สึกอึดอัดอย่างเลวร้ายที่สุด นั่นคือ, จนกระทั่งคืนที่ [stranger.GetSheHe] ปรากฏตัวในห้องส่วนตัวของข้าหลังความมืด\n\n"
 fp1_yearly.1011.desc.standard_epilogue:0 "\n\nเร็วเท่าที่ [stranger.GetSheHe] มาถึง, [stranger.GetFirstNameNoTooltip] ก็ละลายหายไปในเงา หน่วยค้นหาไม่พบอะไรเลย, แม้ แต่เศษเสี้ยว, และข้าเหลือเพียงคำถาม"
 fp1_yearly.1011.desc.separate_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$"ผู้ไร้ศรัทธา!" คนอกตัญญูกรีดร้อง "เจ้าคิดว่าเจ้าสามารถซื้อศรัทธาของข้าด้วยมารยาทบนโต๊ะอาหารที่ดีและหมอนขนห่านได้รึ?! ข้าคือ [stranger.GetFaith.GetAdherentNameNoTooltip] ที่แท้จริง, และข้าจะไม่มีวันละทิ้งเทพเจ้าเก่าแก่! แทนที่จะเป็น เช่นนั้น, ข้าจะบอก [ROOT.Char.GetFaith.PriestNeuterPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ทุกคนของเจ้าว่าเจ้าให้ที่พักพิงแก่คนนอกรีต!"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.separate_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$"หากข้าเป็น [stranger.GetWomanMan] ที่ต่ำต้อยกว่านี้, ข้าคงฆ่าเจ้าที่นี่เดี๋ยวนี้สำหรับศรัทธาที่ดูหมิ่นศาสนาของเจ้า โชคดีสำหรับเจ้า, เกียรติของข้ามีค่ามากกว่าชีวิตของเจ้า, และข้าพอใจกับการเผยแพร่คำสอนของ [stranger.GetFaith.HighGodName] ที่ราชสำนักของเจ้า"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$"เจ้าบูชาเทพเจ้าอย่างไม่เหมาะสม, [ROOT.Char.GetFirstNameNoTooltip], แต่เจ้าให้เกียรติพวกเขาเป็นอย่างดี ถึง แม้ว่าศรัทธาของเจ้าจะขัดใจแอซีร์ (Aesir), แต่เจ้าก็ได้ ทำให้เทพผู้ถูกแขวน (Hanged One) พอใจ, และข้า, กริมเนียร์ (Grímnir), จะแจ้งให้ [stranger.GetFaith.PriestNeuterPlural] แห่งแผ่นดินทราบ"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$"เจ้าบูชาเทพเจ้าอย่างไม่เหมาะสม, และเจ้าล้มเหลวในการมองเห็นความเป็นพระเจ้าที่แท้จริงภายในราชสำนักของเจ้า, แม้ว่ากริมเนียร์ (Grímnir) จะด้อมๆ มองๆ อยู่ตามทางเดินและนั่งอยู่ที่โต๊ะของเจ้า ข้าสงสารเจ้า, [ROOT.Char.GetWomanMan] น้อย, เพราะเจ้าจะ #EMP ไม่มีวัน#! ได้เห็นโถงวัลฮัลล์ (Valhalla) ของข้า!"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_faith.critical:0 "$fp1_yearly.1011.desc.critical_preamble$"การต้อนรับของท่านน่ายกย่อง, [ROOT.Char.GetFirstNameNoTooltip], และข้าเห็นว่าท่านทั้งฉลาดหลักแหลม, เคร่งศาสนา, หรือทั้งสองอย่าง ไม่ว่าทางใด, [stranger.GetFaith.PriestNeuterPlural] ผู้ชาญฉลาดแห่งแผ่นดินจะรู้ว่าท่านเป็นเจ้าภาพให้กริมเนียร์ (Grímnir), และปฏิบัติต่อจ้าวแห่งแอซีร์ (Aesir) เป็นอย่างดี"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_faith.standard:0 "$fp1_yearly.1011.desc.standard_preamble$"เจ้าถูกจับตามองโดยสายตาผู้อาวุโส, [ROOT.Char.GetFirstNameNoTooltip], และพบว่าขาดตกบกพร่อง", [stranger.GetFirstNameNoTooltip] ร้อง, น้ำลายกระเด็นไปทั่ว "กริมเนียร์ (Grímnir) เดินเตร่อยู่ในราชสำนักของเจ้า, และเจ้าไม่ทำอะไรเลย, ไม่เห็นอะไรเลยรึ? [stranger.GetFaith.PriestNeuterPlural] แห่งแผ่นดินจะรู้ว่าท่านได้รับการมาเยือนจากแอซีร์ (Aesir), และเทพเจ้ากำลังเฝ้าดูท่านเพื่อการปรับปรุง!"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.a:0 "แน่นอนว่านั่นไม่สามารถเป็น #EMP พระบิดา#! (All-Father) ได้จริงๆ?"
 fp1_yearly.1011.b:0 "ไอ้สารเลว!"
 fp1_yearly.1011.possible_converts_specific_list:0 "อย่างน้อยหนึ่ง [courtier|E]"
 fp1_yearly.1012.t:0 "$fp1_yearly.1001.t$: มิชชันนารี [stranger.GetFaith.GetAdjectiveNoTooltip]"
 fp1_yearly.1012.desc.preamble:0 "[stranger.GetNameNoTooltip] พิสูจน์ว่าเป็นแขกที่มีชีวิตชีวาและคงแก่เรียน, ใช้เวลาเย็นแล้วเย็นเล่าในการสนทนาที่ยาวนานกับข้าราชบริพารที่เหลือ\n\nคืนนี้, [stranger.GetSheHe] มาเยี่ยมข้า, รอยยิ้มกว้างปรากฏชัดเจนบนใบหน้าของ [stranger.GetHerHis]\n\n"
 fp1_yearly.1012.desc.same_faith_epilogue:0 "\n\n[stranger.GetFirstNameNoTooltip] หยุดชะงัก, ไม่แน่ใจ "หากท่านต้องการ, ข้าจะเป็นเกียรติอย่างยิ่งที่จะอยู่ที่ราชสำนักของท่านเป็นการถาวร?""
 fp1_yearly.1012.desc.different_faith.critical:0 "$fp1_yearly.1012.desc.preamble$"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! เป็นเวลานานแล้วที่ข้าได้รับการดูแลอย่างดี เช่นนี้, และข้าขอขอบคุณท่านสำหรับการต้อนรับ ทว่า, ข้าเกรงว่าข้าต้องสารภาพบางสิ่งกับท่าน: ข้าคือ [stranger.GetFaith.GetAdherentNameNoTooltip], ผู้รับใช้แห่ง [stranger.GetFaith.HighGodName], และข้าได้ให้การศึกษาแก่เหล่าข้าแผ่นดินของท่านในคำสอนของ [stranger.GetFaith.HighGodHerHis]""
 fp1_yearly.1012.desc.different_faith.standard:0 "$fp1_yearly.1012.desc.preamble$"[ROOT.Char.GetTitleAsNameNoTooltip] ของข้า, ข้ารู้ว่าท่านไม่ได้มองข้าในแง่ดีเป็นพิเศษอยู่แล้ว, แต่ข้าเกรงว่าข้ามาที่นี่พร้อมกับคำสารภาพ ตลอดเวลาที่ข้าอยู่ที่ราชสำนักของท่าน, ข้าได้หารือเกี่ยวกับผลงานของ [stranger.GetFaith.HighGodName] กับราษฎรของท่าน, ให้การศึกษาแก่ใครก็ตามที่จะรับฟังในศรัทธา [stranger.GetFaith.GetAdjectiveNoTooltip]""
 fp1_yearly.1012.desc.same_faith.critical:1 "$fp1_yearly.1012.desc.preamble$"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้มีเมตตา! ข้าขอขอบคุณที่ปฏิบัติต่อข้าเป็นอย่างดีตลอดเวลาที่ข้าอยู่ที่นี่ ในฐานะ [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] ผู้เคารพนับถือและเพื่อนร่วม [stranger.GetFaith.GetAdherentNameNoTooltip], ข้าได้เขียนจดหมายถึงนักเทววิทยาผู้มีอิทธิพลทั่วอาณาจักรเพื่อสรรเสริญความศรัทธาของท่าน"$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.desc.same_faith.standard:0 "$fp1_yearly.1012.desc.preamble$"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าไม่ได้ซื่อตรงต่อท่านเสียทั้งหมด แม้ข้าจะดูเหมือนขอทาน, แต่แท้จริงแล้วข้าคือ [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)], และข้าได้ใช้เวลาในราชสำนักให้การศึกษาและบรรยายเกี่ยวกับผลงานของ [stranger.GetFaith.HealthGodName] แม้ท่านอาจมิได้ส่งเสริมการนี้, ข้าขอขอบคุณท่านที่แสดงไมตรีจิตต่อข้า เช่นนี้"$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.a:0 "บอกข้าเพิ่มเติมเกี่ยวกับ... [stranger.GetFaith.GetNameNoTooltip] นี้สิ..."
 fp1_yearly.1012.a.recoup_lost_piety.tt:0 "[piety|E] ทั้งหมดที่ใช้ไปในการเป็นเจ้าภาพให้มิชชันนารีจะได้รับคืน"
 fp1_yearly.1012.b:0 "เจ้า #EMP อะไรนะ#!? ออกไป เดี๋ยวนี้"
 fp1_yearly.1012.c:0 "เจ้า [stranger.Custom2('InsultAdjective', ROOT.Char)] [stranger.Custom2('InsultNoun', ROOT.Char)]! #EMP ทหาร!#! จับกุม [stranger.GetHerHim]!"
 fp1_yearly.1012.d:0 "ข้ารับการรับใช้ของเจ้า"
 fp1_yearly.1012.e:0 "ข้ามีที่ปรึกษาและนักเทววิทยาเพียงพอแล้ว, ขอบใจ"
 fp1_yearly.1012.possible_converts_specific_list:1 "$fp1_yearly.1011.possible_converts_specific_list$"
 fp1_yearly.1013.t:0 "$fp1_yearly.1001.t$: นีธิง"
 fp1_yearly.1013.desc.critical:0 "#EMP หายนะ!#!\n\n[stranger.GetNameNoTooltip] ตอบแทนน้ำใจไมตรีของข้าด้วยการปล้นข้าในตอนกลางคืน, หยิบฉวยโลหะเงางามหรือสิ่งทอแปลกถิ่นทุกชิ้นที่ [stranger.GetSheHe] หาได้ก่อนที่จะควบม้าที่ดีที่สุดของข้าหนีไป!"
 fp1_yearly.1013.desc.standard:0 "[stranger.GetNameNoTooltip] หลบหนีไปในยามค่ำคืน โดยนำของมีค่าทั้งหมดที่[stranger.GetSheHe]สามารถคว้าไปด้วยมือเล็กๆ สกปรกของ[stranger.GetHerHis]ได้ติดตัว[stranger.GetHerHim]ไปด้วย"
 fp1_yearly.1013.desc.outro:1 "\n\nดูเหมือนว่าคนแปลกหน้าลึกลับนั้นจริงๆ แล้วคือนีธิง (nithing) ที่กำลังหลบหนี: ถูกตัดสินว่ามีความผิดในอาชญากรรมที่ถือว่าเลวร้ายมากจน [stranger.GetSheHe] ตอนนี้ไร้คำสาบาน, ไร้เกียรติ, และถือว่าตายตามกฎหมายโดยครอบครัวของ [stranger.GetHerHis] การดูถูกนี้บาดลึก"
 fp1_yearly.1013.desc.outro.sodomite:0 "\n\nดูเหมือนว่าคนแปลกหน้าลึกลับนั้นจริงๆ แล้วคือนีธิง (nithing) ที่กำลังหลบหนี: ถูกขับไล่ออกจากชุมชน, [stranger.GetSheHe] เร่ร่อนจากราชสำนักหนึ่งไปยังอีกราชสำนักหนึ่ง, แสวงหาที่หลบภัย\n\nเมื่อข้าราชบริพารของข้าพิสูจน์ว่าอนุรักษ์นิยมพอๆ กับเจ้าภาพคนสุดท้ายของ [stranger.GetHerHis], [stranger.GetSheHe] ก็หนีไปแทนที่จะอยู่และทนทุกข์ทรมาน"
 fp1_yearly.1013.a:0 "คำสาปแช่ง!"
 fp1_yearly.1013.a.sodomite:0 "ที่จะมีชีวิต เช่นนั้น..."
 fp1_yearly.1013.b:0 "ข้าจะไม่หยุดพักจนกว่าจะพบนีธิงนั่น!"
 fp1_yearly.1014.t:0 "$fp1_yearly.1001.t$: นักรบ"
 fp1_yearly.1014.desc.critical:0 "[stranger.GetNameNoTooltip] ดูประหลาดใจอย่างยินดีที่ได้รับการปฏิบัติประหนึ่งแขกผู้มีเกียรติ, และเข้าหาข้าเป็นการส่วนตัวเมื่อสิ้นวัน\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], ข้าไม่ได้ซื่อตรงต่อท่านเสียทั้งหมด แม้ข้าอาจดูอ่อนแอ, แต่แท้จริงแล้ว, ข้าคือนักรบผู้มีชื่อเสียงน่าเกรงขาม! ข้ากำลังมองหานายเหนือหัวที่คู่ควรกับการรับใช้ของข้า, และการปฏิบัติตนของท่าน ทำให้ข้าเชื่อว่าอาจเป็นท่าน""
 fp1_yearly.1014.desc.standard:0 "[stranger.GetNameNoTooltip] ยังคงวนเวียนอยู่ที่ราชสำนักอยู่พักหนึ่ง, ในที่สุดก็สามารถจัดการเข้าเฝ้าเป็นการส่วนตัวกับข้าได้\n\n"[ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่, ข้าปรารถนาที่จะเสนอดาบของข้าให้ท่าน ข้าคือนักรบพเนจรที่กำลังมองหาเจ้าเหนือหัวที่ดีมาเป็นเวลานาน, และการพักอยู่ที่ราชสำนักของท่าน ทำให้ข้าคิดว่านั่นอาจเป็นท่าน""
 fp1_yearly.1014.desc.outro:0 "\n\nไม่ใช่กระบวนการปกติในการได้มา ซึ่ง $knight_culture_player_plural_no_tooltip_lowercase$, แน่นอน, แต่มัน #EMP ก็#! น่าปลื้มใจที่ผ่านการท้าทายของ [stranger.GetHerHis]"
 fp1_yearly.1014.a:0 "ยอดเยี่ยม! ท่านจะคุ้มค่ากับค่าจ้างของท่านอย่างแน่นอน!"
 fp1_yearly.1014.b:0 "ข้ามีนักรบที่มีความสามารถมากมายที่ไม่ทดสอบความอดทนของข้า"
 fp1_yearly.1015.t:0 "$fp1_yearly.1001.t$: คนพเนจร"
 fp1_yearly.1015.desc.critical:0 "[stranger.GetFirstNameNoTooltip] สับสน, ท่วมท้น, และปลาบปลื้มกับการปฏิบัติที่ [stranger.GetSheHe] ได้รับ การได้รับการยกย่องว่าเป็นขุนนางชั้นผู้น้อยดูเหมือนจะเป็นประสบการณ์ใหม่โดยสิ้นเชิงสำหรับ [stranger.GetHerHim], และใช้เวลาพอสมควรกว่าที่ความจริงจะปรากฏ"
 fp1_yearly.1015.desc.standard:0 "[stranger.GetFirstNameNoTooltip] ยังคงไม่เป็นอันตรายพอ, คาดเดาได้ว่าจะก่อความวุ่นวายเพียงเล็กน้อยในช่วงเวลาสั้นๆ ของ [stranger.GetHerHis] ในครัวเรือนของข้า จนกระทั่งข้าได้ยิน [stranger.GetHerHim] สนทนาอย่างเงียบๆ ข้าจึงเข้าใจ"
 fp1_yearly.1015.desc.outro:0 "\n\nดูเหมือนว่า [stranger.GetSheHe] จริงๆ แล้ว #EMP เป็น#! เพียงคนพเนจรที่หลุดเข้ามาในกำแพง!\n\nขณะที่ข้ากำลังครุ่นคิดว่าจะทำอย่างไร, [stranger.GetFirstNameNoTooltip] ก็มาหาข้า, ถอดหมวกในมือ, และขอร้องให้ได้รับอนุญาตให้อยู่เป็นการถาวร"
 fp1_yearly.1015.a:0 "แน่นอนท่านอยู่ได้"
 fp1_yearly.1015.b:0 "อะไรนะ?! อุกอาจ, ออกไป!"

 fp1_yearly.1062.t:0 "ชีวิตที่น่าจดจำ: [ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1062.desc:0 "การเสียชีวิตล่าสุดของ [ship_funeral_candidate.Custom2('MyCharacterIntroduction',mourner)] ทำให้ผู้เป็นที่รัก [ship_funeral_candidate.GetHerHis] โศกเศร้ากับการสูญเสีย [ship_funeral_candidate.GetWomanMan] ผู้ยิ่งใหญ่\n\nในฐานะหนึ่งในผู้ที่ใกล้ชิดกับผู้ตายมากที่สุด ข้าสามารถรับหน้าที่จัดงานศพที่เหมาะสมได้\n\nเป็นประเพณีในหมู่ [ship_funeral_candidate.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดีที่เราจะฝังศพผู้สูงศักดิ์ที่สุดของเราด้วยเรือ เพื่อนำพาพวกเขาไปยัง [ship_funeral_candidate.GetFaith.PositiveAfterLife] ได้ดียิ่งขึ้น และแน่นอนว่า [ship_funeral_candidate.GetFirstNameNoTooltip] สมควรได้รับเกียรติอันสูงส่งนี้?"
 fp1_yearly.1062.a:0 "เรือหินสัญลักษณ์ขนาดเล็กก็เพียงพอแล้ว"
 fp1_yearly.1062.a.tt:0 "การเตรียมงานศพเริ่มต้นขึ้น..."
 fp1_yearly.1062.b:0 "เรือหินอันยิ่งใหญ่, เพื่อสร้างความประทับใจให้ [ship_funeral_candidate.GetFaith.WarGodName] ดียิ่งขึ้น!"
 fp1_yearly.1062.c:0 "เรือใบที่ตก แต่งอย่างหรูหรา; [ship_funeral_candidate.GetFirstNameNoTooltip] สมควรได้รับสิ่งที่ดีที่สุด"
 fp1_yearly.1062.d:0 "ทั้งหมดนี้ #EMP แพง#! อย่างอุกอาจ..."
 fp1_yearly.1063.t:0 "$fp1_yearly.1062.t$"
 fp1_yearly.1063.desc.intro:0 "ข้ายืนอยู่หน้าฝูงชนผู้โศกเศร้ากลุ่มเล็กๆ, กวาดสายตาไปทั่วผู้สูญเสียที่ร่ำไห้ แต่ละคน, และเริ่มกล่าวสุนทรพจน์\n\n"[ship_funeral_candidate.GetFirstNameNoTooltip]""
 fp1_yearly.1063.desc.achievements.title.duchy:0 "[ship_funeral_candidate.GetTitleAsNameNoTooltip] ที่ดีงาม,"
 fp1_yearly.1063.desc.achievements.title.kingdom:0 "[ship_funeral_candidate.GetTitleAsNameNoTooltip] ที่สง่างาม,"
 fp1_yearly.1063.desc.achievements.title.empire:0 "[ship_funeral_candidate.GetTitleAsNameNoTooltip] ที่งดงาม,"
 fp1_yearly.1063.desc.achievements.prestige.high:0 "[ship_funeral_candidate.GetWomanMan] ผู้มีชื่อเสียง,"
 fp1_yearly.1063.desc.achievements.prestige.very_high:0 "[ship_funeral_candidate.GetWomanMan] ผู้สูงส่ง,"
 fp1_yearly.1063.desc.achievements.prestige.max:0 "[ship_funeral_candidate.GetWomanMan] ผู้เป็นตำนานอย่างแท้จริง,"
 fp1_yearly.1063.desc.achievements.piety.high:0 "ผู้รับใช้ที่อุทิศตนของ [ship_funeral_candidate.GetFaith.HighGodName],"
 fp1_yearly.1063.desc.achievements.piety.very_high:0 "แบบอย่างที่ไม่มีใครเทียบได้ของคุณธรรม [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.piety.max:0 "สัญลักษณ์ที่แท้จริงของศรัทธา [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.partying:0 "บ่อเกิดแห่งความร่าเริงและเสียงหัวเราะ,"
 fp1_yearly.1063.desc.achievements.lifestyles.duelling:0 "นักดวลที่อันตรายอย่างแท้จริง,"
 fp1_yearly.1063.desc.achievements.lifestyles.hunting:0 "นักแม่นปืนที่ดีที่สุดใน [hunting_lands.GetNameNoTierNoTooltip] ทั้งหมด,"
 fp1_yearly.1063.desc.achievements.lifestyles.magickerationing:0 "ผู้เชี่ยวชาญในศาสตร์ลึกลับ,"
 fp1_yearly.1063.desc.achievements.single.intro:0 "มีความมุ่งมั่นที่ไม่เหมือนใคร บางทีนั่นอาจเป็นเหตุผลที่ [ship_funeral_candidate.GetSheHe] ถูกพิจารณาว่าเป็น"
 fp1_yearly.1063.desc.achievements.single.outro:0 "ความสำเร็จที่ [ship_funeral_candidate.GetSheHe] อาจไม่มีใครเทียบได้""
 fp1_yearly.1063.desc.achievements.double.intro:0 "เป็นบุคคลที่มีพรสวรรค์หายากและมีความสนใจหลากหลาย ทั้ง"
 fp1_yearly.1063.desc.achievements.double.connector:0 "และ"
 fp1_yearly.1063.desc.achievements.double.outro:0 "ไม่มีสิ่งใดสามารถเติมเต็มช่องว่างที่การสูญเสียของ [ship_funeral_candidate.GetHerHis] ทิ้งไว้ในชีวิตของเราได้""
 fp1_yearly.1063.desc.achievements.triple.intro:0 "เป็นหลายสิ่งหลายอย่าง [ship_funeral_candidate.GetSheHe|U] เป็น "
 fp1_yearly.1063.desc.achievements.triple.connector:0 "$fp1_yearly.1063.desc.achievements.double.connector$"
 fp1_yearly.1063.desc.achievements.triple.outro:2 "แต่สำหรับข้า, สิ่งแรกและสำคัญที่สุด, [ship_funeral_candidate.GetSheHe] คือ [ship_funeral_candidate.Custom2('RelationToMe', mourner)] ของข้า เราจะไม่มีวันได้เห็นคน เช่น [ship_funeral_candidate.GetHerHis] อีก""
 fp1_yearly.1063.desc.ship_stone_small:0 "\n\nเนินดินฝังศพด้านหลังข้ามีแบบจำลองขนาดเล็กของเรืออยู่แล้ว, ลากเส้นด้วยหินป้ายหลุมศพที่มีน้ำหนักและเต็มไปด้วยก้อนกรวด, ถูกฝังอยู่ใต้หลุมศพดินที่มีน้ำหนักแล้ว"
 fp1_yearly.1063.desc.ship_stone_grand:0 "\n\nเนินดินฝังศพขนาดใหญ่ด้านหลังข้ามีแบบจำลองขนาดมหึมาของเรืออยู่แล้ว, ลากเส้นด้วยศิลาจารึกอักษรรูนและเต็มไปด้วยก้อนกรวด, หินขนาดใหญ่ แต่ละก้อนบอกเล่าเรื่องราวจากชีวิตของผู้ตาย"
 fp1_yearly.1063.desc.ship_wood_ornate:0 "\n\nเนินดินฝังศพด้านหลังข้ามีเรือที่สร้างขึ้นตามวัตถุประสงค์อยู่แล้ว, ผลิตภัณฑ์จากไม้แปลกถิ่นและช่างต่อเรือที่ดีที่สุดของเรา มันจะไม่มีวันล่องเรือในมหาสมุทรของมนุษย์, แต่อาจ ทำให้ [ship_funeral_candidate.GetFaith.PantheonTerm] พอใจและนำพรมาสู่ผู้ตาย"
 fp1_yearly.1063.desc.outro:0 "\n\nผู้ติดตามนำสมบัติฝังศพชิ้นสุดท้ายเข้ามา, จากนั้น, ในที่สุด, ศพของ [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip] ก็ถูกวางลงบนแท่นวางศพ"
 fp1_yearly.1063.trigger_failure.tt:0 "สถานการณ์ได้ยกเลิกงานศพสาธารณะของ [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.1063.a:0 "ปิดเนินดิน"

 fp1_yearly.1071.t:0 "สะอาดเป็นประกาย"
 fp1_yearly.1071.desc:0 "ผู้คน [ROOT.Char.GetCulture.GetNameNoTooltip] นั้น, มีชื่อเสียง, ในเรื่องความสะอาดอย่างพิถีพิถัน\n\nหนึ่งในความสุขที่ยิ่งใหญ่ของชีวิตคือการได้ยินแม้กระทั่งศัตรูที่ร้ายกาจที่สุดของเรายอมรับอย่างขมขื่นว่าไม่มีเคราของผู้ชายคนใดที่หวีได้ดีกว่า, ไม่มีผมของ [ROOT.Char.Custom('WomanManPossessive')] คนใดที่สระด้วยสบู่เป็นประจำมากกว่า, ไม่มีใบหน้าของ [ROOT.Char.GetWomanMan] คนใดที่ขัดถูจนปราศจากตำหนิได้เท่ากับ [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] ที่ดี\n\nวันนี้เป็นวันอาบน้ำ, แต่ข้ารู้สึกว่าการเปลี่ยนแปลงกิจวัตรอาจจะดีต่อข้า ท้ายที่สุด, ถ้า [ROOT.Char.GetCulture.GetNameNoTooltip] ทุกคนดูแลตัวเองเป็นอย่างดี, มันไม่สมควรหรือที่ [ROOT.Char.GetTitleAsNameNoTooltip] จะเป็นคนที่ดูแลตัวเอง #EMP ดีที่สุด#!?"
 fp1_yearly.1071.a:0 "สุขอนามัยคือกุญแจสู่อายุยืน!"
 fp1_yearly.1071.b:0 "ข้าเดาว่าข้าอาจจะดูแลเป็นพิเศษเล็กน้อย..."
 fp1_yearly.1071.c:0 "แค่ตามปกติก็พอแล้ว"

 fp1_yearly.1081.t:0 "นักสำรวจจากแดนตะวันตก"
 fp1_yearly.1081.desc.intro:0 "ยามเย็นของข้าหมดไปกับนักสำรวจสูงวัย [norse_explorer.GetFirstName] ผู้ปรารถนาจะเล่าเรื่องราวแปลกใหม่เกี่ยวกับการผจญภัยและการสำรวจของพวกเขาในมหาสมุทรแอตแลนติกให้ข้าฟัง\n\nแม้จะอายุ [norse_explorer.GetHerHis] มากแล้ว ดวงตาของ [norse_explorer.GetFirstNamePossessiveNoTooltip] ยังคงเฉียบคมขณะที่ [norse_explorer.GetSheHe] เล่าให้ข้าฟังถึง"
 fp1_yearly.1081.desc.greenland:1 "ดินแดนของ $norse_collective_noun$ ที่ยากจนและดิ้นรน ซึ่งอาศัยอยู่ในหิมะใกล้กับยอดสุดของโลก ดินแดนนั้นหนาวเย็นจนเป็นน้ำแข็งจนพวกเขาต้องนำเข้าไม้ทั้งหมด, และกินเนื้อและปลาเกือบทั้งหมด"
 fp1_yearly.1081.desc.vinland:0 "ดินแดนที่อยู่ไกลไปทางตะวันตกเท่ากับที่คาเธ่ย์ (Cathay) อยู่ทางตะวันออก, ที่ ซึ่งองุ่นและข้าวสาลีเติบโตอย่างอิสระจนดูเหมือนจะหว่านเมล็ดเอง, และเหล้าองุ่นนั้นไม่มีใครเทียบได้ ชาวบ้าน แต่ละคนเป็นนักรบที่น่าเกรงขาม, ไม่ยอมให้มีการบุกรุก"
 fp1_yearly.1081.desc.antilia:0 "เกาะที่ตั้งรกรากโดยผู้ลี้ภัยชาว [antilia_culture.GetNameNoTooltip] $christianity_religion_adherent_plural$ ที่ร่ำรวย, อาศัยอยู่ในปราสาทที่ป้องกันอย่างดี, พวกเขาสืบเชื้อสายมาจากผู้ลี้ภัยที่หนีออกจากไอบีเรีย (Iberia) ในระหว่างการรุกรานของชาวมัวร์ (Moorish Invasion)"
 fp1_yearly.1081.desc.fortunate_isles.hellenist:0 "ดินแดนส่วนแยกสุดท้ายที่ยังหลงเหลืออยู่ของ $hellenic_pagan$, เกาะเล็กๆ ทางตะวันตกที่มีประชากรเป็น $greek_collective_noun$ ซึ่งมีความคล้ายคลึงกับ $b_athens$ โบราณมากกว่า $b_constantinople$ สมัยใหม่ ชาวบ้านใช้เวลาทั้งวันในการหารือเกี่ยวกับปรัชญาและเฉลิมฉลองความรุ่งโรจน์ของชาวโอลิมเปียน (Olympians)!"
 fp1_yearly.1081.desc.fortunate_isles.other:0 "ที่หลบภัยของ $hellenic_pagan_adherent_plural$ นอกรีตกลุ่มสุดท้ายที่เหลืออยู่, เลียนแบบบรรพบุรุษที่ห่างไกลของพวกเขาใน $b_athens$ และ $b_thebes$ อย่างหยาบๆ ชาวบ้านใช้เวลาไปวันๆ อย่างเกียจคร้าน, หารือเกี่ยวกับปรัชญาแปลกๆ และปฏิบัติศรัทธาอันหยาบช้าของพวกเขา"
 fp1_yearly.1081.desc.st_brendans_island:0 "เกาะที่ซ่อนอยู่หลังหมอกประหลาด, ที่ ซึ่งเวลาดูเหมือนจะผ่านไปช้ากว่าภายนอก เกี่ยวกับความลึกลับเพิ่มเติมของเกาะ, [norse_explorer.GetFirstNameNoTooltip] ยังคงปิดปากเงียบ, แม้ว่าบางครั้งน้ำตาจะคลอเบ้าของ [norse_explorer.GetHerHis]"
 fp1_yearly.1081.desc.isle_of_the_blessed.christian:0 "เกาะที่เต็มไปด้วย $breton_collective_noun$ ผู้เคร่งศาสนา, สวดมนต์และใช้ชีวิตอย่างสงบเงียบ ศรัทธาของพวกเขาแข็งแกร่งมาก, แต่ละคนมีภูมิคุ้มกันต่ออาวุธของมนุษย์, ได้รับการปกป้องอย่างสมบูรณ์โดย [norse_explorer.GetFaith.HighGodName]"
 fp1_yearly.1081.desc.isle_of_the_blessed.other:0 "เกาะที่เต็มไปด้วย $breton_collective_noun$ ผู้เคร่งศาสนา, อุดมไปด้วยสมบัติทองคำ ศรัทธาของพวกเขาแข็งแกร่งมาก, มันเติมเต็มเกาะด้วยบทสวดที่ไพเราะแม้หลังจากที่ลูกเรือของ [norse_explorer.GetFirstNamePossessiveNoTooltip] สังหารพวกเขาด้วยดาบ"
 fp1_yearly.1081.desc.ard_majhulah:1 "ดินแดนแปลกประหลาด, กล่าวถึงเฉพาะในตำราอิสลามเก่าแก่, คิดว่าสูญหายไปหลายปี ชาวบ้าน แต่ละคนมีกองทองคำและเงินมากมายจนพวกเขาใช้ทำไม้จิ้มฟันและทอเสื้อผ้า"
 fp1_yearly.1081.desc.the_sticky_sea:0 "ทะเลอันโศกเศร้าภายในมหาสมุทรแอตแลนติก, ความยุ่งเหยิงของน้ำที่เหนียวเหนอะหนะและเหม็น, ที่ ซึ่งงูและสาหร่ายทะเลสมคบคิดกันเพื่อลากกะลาสีไปสู่ความตาย มีเพียงลูกเรือที่แข็งแกร่งที่สุดเท่านั้นที่มีโอกาสดึงตัวเองให้เป็นอิสระ"
 fp1_yearly.1081.desc.purple_islands:0 "กลุ่มเกาะที่อยู่ไกลออกไปทางใต้, เต็มไปด้วยดอกไม้สีสันสดใส, หลายชนิดเป็นเฉดสีม่วงแปลกตา, ปราศจากร่องรอยของชีวิตมนุษย์โดยสิ้นเชิง ความงามอันน่าขนลุกของสถานที่แห่งนี้ชักจูงแม้กระทั่งกะลาสีที่แข็งกร้าวให้นอนลงและตาย, อย่างสงบสุขกับโลก"
 fp1_yearly.1081.desc.hy_brasil:0 "เกาะที่ยังคงมองไม่เห็นเป็นส่วนใหญ่, ถูกขังอยู่หลังหมอกที่ มืดทึบ ยกเว้นวันเดียวทุกๆ เจ็ดปี แม้ในวันเดียวที่หมอกอนุญาตให้เดินทาง, ก็ยังไม่มีกะลาสีคนใดขึ้นฝั่งได้สำเร็จ"
 fp1_yearly.1081.desc.thule:0 "ดินแดนอันกว้างใหญ่ทางเหนือสุดขั้ว, ที่ ซึ่งสสารทั้งหมดสลายตัว มนุษย์หายใจเอาน้ำและดินได้ง่ายพอๆ กับอากาศ, วาฬมหึมาว่ายผ่านพื้นดินและท้องฟ้า, และความแตกต่างทั้งหมดกลายเป็นเรื่องทางวิชาการ"
 fp1_yearly.1081.desc.great_ireland.abrahamic:0 "ดินแดนที่อยู่ไกลไปทางตะวันตก, ที่ ซึ่งผู้อยู่อาศัยสวมใส่ แต่สีขาว, ถือหอกอันโหดร้าย, และต่อสู้อย่างดุเดือดต่อกันและกันและแม้กระทั่งแขกผู้สูงศักดิ์ที่สุด ชาวบ้านบูชาเทพเจ้าโบราณนอกรีต, ที่ถูกลืมเลือนไปนานโดย [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip] ที่คิดถูก"
 fp1_yearly.1081.desc.great_ireland.other:0 "ดินแดนที่อยู่ไกลไปทางตะวันตก, ที่ ซึ่งผู้อยู่อาศัยสวมใส่ แต่สีขาว, ถือหอกอันโหดร้าย, และต่อสู้ด้วยความแข็งแกร่งและความดุร้ายที่ผิดมนุษย์ ความเก่งกาจของพวกเขาเป็นตำนานมาก, ไม่มีนักรบคนใดของดินแดนนี้เคยล้มลงด้วยคมดาบต่างถิ่น"
 fp1_yearly.1081.desc.sunset_empire:0 "จักรวรรดิที่อยู่อีกฟากหนึ่งของจุดที่กว้างที่สุดของมหาสมุทรแอตแลนติก, ดินแดนแห่งเลือด, กะโหลกศีรษะ, และผู้พิชิตที่หิวโหย, ซุ่มซ่อนอยู่ใต้ขอบฟ้าตะวันตก เจ้านายที่โหดร้ายของมันรอคอยแร็กนาร็อก (Ragnarok) เอง, เมื่อพวกเขาตั้งใจจะฉีกหัวใจที่เต้นอยู่ของ [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip] ที่ดีทุกคน"
 fp1_yearly.1081.desc.outro:0 "\n\nแม้ว่าเวลาจะดึกแล้ว, [norse_explorer.GetFirstNameNoTooltip] ดูเหมือนจะเต็มใจที่จะเล่าต่อหากข้าต้องการ"
 fp1_yearly.1081.a:0 "น่าทึ่ง โปรด, อีกครั้ง, ตั้งแต่ต้น!"
 fp1_yearly.1081.b:0 "ท่านไม่สามารถ #EMP เป็นไปได้#! ที่จะบอกความจริงแก่ข้า, [norse_explorer.GetWomanMan] เฒ่า"
 fp1_yearly.1081.c:0 "เรื่องราวของดินแดนห่างไกลนั้นผ่อนคลายเสมอ..."
 fp1_yearly.1081.c.sunset_empire:0 "บางทีเราควรหยุดเรือที่แล่นไปทางตะวันตก..."
