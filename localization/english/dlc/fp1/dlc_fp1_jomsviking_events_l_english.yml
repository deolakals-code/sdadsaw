l_english: 
 # Jomsvikings offer a Retainer
 fp1_jomsvikings.0001.t:0 "ความช่วยเหลือจาก [leader.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0001.desc.intro:0 "ประจำการ ณ ป้อมปราการแห่ง [leader.GetCapitalLocation.GetTitle.GetNameNoTier], [leader.GetPrimaryTitle.GetNameNoTier] คือภาคีนักรบผู้อุทิศตนเพื่อปกป้องวิถีดั้งเดิมแห่งศรัทธา [leader.GetFaith.GetName] ต่อต้านการเปลี่ยนแปลง, ความไร้เกียรติ, และศรัทธาต่างถิ่น\n\nด้วยความศรัทธาและคุณธรรมของข้า, [leader.GetTitledFirstName] ได้ส่งผู้ติดตามสองคนมาให้ข้าเลือก: [retainer_a.GetFirstName],"
 fp1_jomsvikings.0001.desc.zealous:0 "ผู้ปล้นสะดมโบสถ์นับร้อย,"
 fp1_jomsvikings.0001.desc.wrathful:0 "ผู้เคยฉีกหมีออกเป็นสองซีก,"
 fp1_jomsvikings.0001.desc.impatient:0 "ผู้เร็วดุจสายฟ้า,"
 fp1_jomsvikings.0001.desc.arrogant:0 "ผู้เกือบจะได้เป็น [leader.GetTitleAsNameNoTooltip] คนต่อไป,"
 fp1_jomsvikings.0001.desc.brave:0 "ผู้เอาชนะโทรลล์ด้วยมือเปล่า,"
 fp1_jomsvikings.0001.desc.ambitious:0 "ผู้ปรารถนาจะตายอย่างรุ่งโรจน์ที่สุด,"
 fp1_jomsvikings.0001.desc.diligent:0 "ผู้ไม่เคยหยุดฝึกฝน,"
 fp1_jomsvikings.0001.desc.gregarious:0 "ผู้ผูกมิตรกับเหล่าทวยเทพ,"
 fp1_jomsvikings.0001.desc.stubborn:0 "ผู้ทลายภูผาด้วยหินทีละก้อน,"
 fp1_jomsvikings.0001.desc.fickle:0 "ผู้ ซึ่งจิตใจอันแปรปรวนหลอกลวงได้แม้กระทั่ง [leader.GetFaith.DevilName] [leader.GetFaith.DevilHerselfHimself],"
 fp1_jomsvikings.0001.desc.vengeful:0 "ผู้ไม่เคยปล่อยให้ความแค้นใดไม่ได้รับการชำระ,"
 fp1_jomsvikings.0001.desc.viking:0 "ผู้สังหารชาวนาวันละสิบคนในต่างแดน,"
 fp1_jomsvikings.0001.desc.connector:0 "หรือ [retainer_b.GetFirstName],"
 fp1_jomsvikings.0001.desc.outro:0 "พร้อมด้วยคำชมเชยจาก [leader.GetHerHis] สำหรับความภักดีของข้า\n\nคนหนึ่งจะอยู่, และอีกคนจะกลับไปยัง [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0001.a:0 "[retainer_a.GetFirstNameNoTooltip] ดูเป็นนักวางกลยุทธ์ที่น่าเกรงขาม!"
 fp1_jomsvikings.0001.b:0 "[retainer_b.GetFirstNameNoTooltip] ช่างเป็นนักรบที่น่าเกรงขามเสียนี่กระไร..."
 fp1_jomsvikings.0001.c:0 "ข้ามีนักรบมากมายอยู่แล้ว, ขอบใจ"

 # Jomsvikings terrorise their neighbours
 fp1_jomsvikings.0011.t.reformed_norse:0 "พิโรธแห่งวิถีดั้งเดิม"
 fp1_jomsvikings.0011.t.reformed_other:0 "พิโรธแห่งเทพเจ้าเก่าแก่"
 fp1_jomsvikings.0011.t.fallback:0 "โจรสลัด [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0011.desc.intro:0 "หายนะ! การจู่โจมสายฟ้าแลบโดย [leader.GetTitledFirstName] แห่ง [leader.GetPrimaryTitle.GetNameNoTier] ณ [target_county.GetNameNoTier] คุกคามว่าจะเผาครึ่งหนึ่งของเคาน์ตีให้วอดวาย!\n\n"
 fp1_jomsvikings.0011.desc.ideological_reformist:0 "ประณามว่า [ROOT.Char.GetFaith.GetName] เป็นความวิปริตอันชั่วร้ายต่อศรัทธาแห่งบรรพชนของเรา, โจรสลัดต้องสาปเหล่านี้กำลังสังหารหมู่ [ROOT.Char.GetFaith.PriestNeuterPlural] ของเรา, เผาทำลาย [ROOT.Char.GetFaith.HouseOfWorshipPlural] ของเรา, และอ้างว่าทำทั้งหมดนี้ในนามของ [leader.GetFaith.HighGodName]!"
 fp1_jomsvikings.0011.desc.ideological_other:0 "[leader.GetFaith.GetAdherentNamePlural] ผู้คลั่งศาสนาเหล่านี้, ถือว่า [ROOT.Char.GetFaith.GetReligion.GetName] เป็นภัยคุกคามต่อวิถีชีวิตของพวกเขา นอกเหนือจากการปล้นสะดมเพียงอย่างเดียว, ผู้รุกรานกำลังสังหาร [ROOT.Char.GetFaith.PriestNeuterPlural], เผา [ROOT.Char.GetFaith.HouseOfWorshipPlural], และกรีดร้องอย่างบ้าคลั่งเกี่ยวกับเทพเจ้าจอมปลอมของพวกเขา"
 fp1_jomsvikings.0011.desc.economic:0 "แม้ว่า [leader.GetPrimaryTitle.GetNameNoTierNoTooltip] จะไม่ได้มีความแค้นเคืองเป็นพิเศษต่อ [ROOT.Char.GetFaith.GetAdherentName] เช่นข้า, พวกเขายังคงต้องพึ่งพาการปล้นสะดมเพื่อความอยู่รอด, และดินแดนของข้าเป็นเป้าหมายที่น่าเย้ายวน บางที... บางทีการจ่ายส่วย (gafol) อย่างหนักให้พวกเขาอาจจะยังช่วยให้ราษฎรของข้ารอดพ้นได้กระมัง?"
 fp1_jomsvikings.0011.desc.outro:0 "\n\nไม่มีเวลาที่จะระดมกองทัพ ข้าสามารถโจมตีด้วยกำลังพลเท่าที่มีอยู่ในมือ, หรือข้าจะกัดฟันทนจนกว่าพวกเขาจะจากไป"
 fp1_jomsvikings.0011.a:0 "รวบรวมใครก็ตามที่เรามี, จับอาวุธ!"
 fp1_jomsvikings.0011.a.tt_success:0 "โจรสลัดถูกตัดขาดและทำลายล้าง"
 fp1_jomsvikings.0011.a.tt_failure:0 "[leader.GetTitledFirstNameNoTooltip] สร้างความหายนะขณะที่ [leader.GetSheHe] หลบหนี"
 fp1_jomsvikings.0011.b.benefactor:0 "บางที [benefactor.GetTitledFirstNameNoTooltip] อาจจะแค่ส่ง [ROOT.Char.GetFaith.PriestNeuterPlural] ใหม่มาให้เราได้กระมัง?"
 fp1_jomsvikings.0011.b.fallback:0 "น่าเสียดาย, แต่เราสามารถนำเข้า [ROOT.Char.GetFaith.PriestNeuterPlural] ทดแทนได้..."
 fp1_jomsvikings.0011.c:0 "รวบรวมส่วย (gafol); มันถูกกว่าในระยะยาว"
 fp1_jomsvikings.0011.c.tt:0 "[leader.GetTitledFirstName] ถอยทัพไปโดยไม่มีเหตุการณ์ใด"
 fp1_jomsvikings.0011.d:0 "นี่มันเป็นอะไรไปไม่ได้นอกจากปัญหาท้องถิ่น?"
 fp1_jomsvikings.0011.d.tt:0 "เจ้าปล่อยให้ [target_county.GetNameNoTier] ถูกเผาทำลาย"

 # Jomsvikings send Event Troops
 fp1_jomsvikings.0021.t:0 "เจรจากับโจรสลัด"
 fp1_jomsvikings.0021.desc:0 "ข้าต้อนรับคณะผู้แทนอันเป็นกลุ่มอันธพาลไร้ระเบียบจาก [leader.GetPrimaryTitle.GetNameNoTier] ด้วยความเคลือบแคลงใจอยู่บ้าง, ซึ่งนำจดหมายจาก [leader.GetTitledFirstName] มามอบให้\n\nผู้รุกรานและปล้นสะดมอันดุร้ายทั้งทางทะเลและทางบก, ผู้คลั่งศาสนาเหล่านี้คือโจรสลัดที่ฉาวโฉ่และอันตรายที่สุดในโลก\n\nเช่นเดียวกับ [ROOT.Char.GetFaith.GetAdherentName] ที่ดีทุกคน, ข้าได้ฟังเรื่องราวความศรัทธาและความเก่งกาจของพวกเขาด้วยความรู้สึกทั้งยำเกรงและหวาดกลัว บัดนี้ดูเหมือนว่า [leader.GetTitleAsNameNoTooltip] ของพวกเขากำลังเสนอให้ข้าบัญชาการกลุ่มอาสาสมัครกลุ่มนี้, โดยมีเงื่อนไขว่าข้าต้องใช้พวกเขาเพื่อบุกปล้นและสะดมเพื่อ [ROOT.Char.GetFaith.PantheonTerm]"
 fp1_jomsvikings.0021.a:0 "โจรสลัดที่รับคำสั่งรึ? น่าสนใจ..."
 fp1_jomsvikings.0021.a.tt:0 "[army|E] จะรวม [men_at_arms|E] $jomsviking_pirates$ ที่ฆ่ายากเป็นพิเศษ"
 fp1_jomsvikings.0021.b:0 "เอาแค่กะลาสีที่มีชื่อเสียงก็พอ, ข้าคิดว่า"
 fp1_jomsvikings.0021.b.tt:0 "[army|E] จะรวม [men_at_arms|E] $bondi$ ที่สามารถเกณฑ์ได้"
 fp1_jomsvikings.0021.c:0 "ข้าชอบทหารที่มีระเบียบวินัย... มากกว่านี้หน่อย"

 # Jomsvikings challenge a Dishonorable Norse Pagan Ruler to Holmgang
 fp1_jomsvikings.0041.t:0 "ความอัปยศต่อทวยเทพ"
 fp1_jomsvikings.0041.desc:0 ""#EMP [ROOT.Char.GetFirstNameNoTooltip]#!!" [leader.GetTitledFirstName] คำรามลั่นขณะที่ [leader.GetSheHe] พรวดพราดเข้ามาในห้องบัลลังก์ของข้า, ในสภาพกึ่งเปลือย\n\n"วิถีอันบาปหนาและความไร้เกียรติอย่างโจ่งแจ้งของเจ้าคือความอัปยศต่อ [leader.GetFaith.GetAdherentNamePlural] ทั่วทุกหนแห่ง, และ [leader.GetPrimaryTitle.GetNameNoTier] จะไม่ทนอีกต่อไป! ไม่มีข้อแก้ตัว, ไม่มีเล่ห์เหลี่ยม, เราจะโฮล์มกัง, #EMP ที่นี่#! และ #EMP เดี๋ยวนี้#!!"\n\nด้วยความงุนงง, ทหารยามของข้ากำอาวุธไว้แน่น, พร้อมที่จะเข้าจัดการผู้บุกรุกได้ทุกเมื่อ\n\nไม่ว่าข้าจะทำสิ่งใด, ข่าวการกระทำของข้าย่อมแพร่สะพัดไปทั่วโลกอย่างไม่ต้องสงสัย"
 fp1_jomsvikings.0041.a:0 "ข้าจะส่งเจ้าไปวัลฮัลล์พร้อมรอยยิ้ม!"
 fp1_jomsvikings.0041.a.tt:0 "ท่านเข้าสู่ [single_combat_fight|E] ทันที"
 fp1_jomsvikings.0041.a.tt_success:0 "ท่านชนะการประลอง"
 fp1_jomsvikings.0041.a.tt_failure:0 "[leader.GetTitledFirstName] ชนะการประลอง"
 fp1_jomsvikings.0041.b:0 "เจ้ามันโง่ที่มาคนเดียว ทหาร!"
 fp1_jomsvikings.0041.b.tt_success:0 "[leader.GetTitledFirstName] ถูกล่ามโซ่และลากตัวไปยังคุกใต้ดิน"
 fp1_jomsvikings.0041.b.tt_failure:0 "[leader.GetTitledFirstName] หลบหนีไปได้อย่างอาจหาญ"
 fp1_jomsvikings.0041.c:0 "เจ้ารู้ตัวไหมว่าเจ้าเป็นแค่โจรสลัดจอมโอ้อวด? ไปให้พ้น"

 fp1_jomsvikings.0042.trigger_failure:0 "การประลองของท่านกับ [leader.GetTitledFirstNameNoTooltip] เป็นโมฆะ"

 fp1_jomsvikings.0044.t:0 "$fp1_jomsvikings.0041.t$: การยืนยันความชอบธรรม"
 fp1_jomsvikings.0044.desc:0 "เมื่อร่างไร้วิญญาณของ [leader.GetTitledFirstName] กองอยู่แทบเท้าข้า, ห้องบัลลังก์ก็เงียบสงัดราวป่าช้า ไม่ได้ยินแม้เสียงกระซิบ, ไม่มีเสียงลมหายใจใดนอกจากเสียงหอบหายใจของข้าเอง\n\nข้าค่อยๆ สวมเสื้อผ้ากลับคืน\n\nข้าสบตากับทุกคนที่ยังอยู่ในห้องนี้ทีละคน"
 fp1_jomsvikings.0044.a:0 "มี #EMP ใครอื่น#! อยากลองดีอีกไหม?"
 fp1_jomsvikings.0044.b:0 "ความชอบธรรมในการปกครองของข้าได้รับการพิสูจน์อีกครั้ง!"
 fp1_jomsvikings.0044.c:0 "นี่แสดงให้เห็นว่าศรัทธา [leader.GetFaith.GetNameNoTooltip] นั้นไร้ค่าเพียงใด..."

 # Jomsvikings Destroyed
 fp1_jomsvikings.1001.t:0 "ความเสื่อมถอยแห่งวิถีดั้งเดิม"
 fp1_jomsvikings.1001.desc.intro:0 "ด้วยการล่มสลายของป้อมปราการสุดท้าย, [title.GetNameNoTier] ได้ถูกทำลายล้างจนสิ้นซาก\n\n"
 fp1_jomsvikings.1001.desc.reformed_asatru_exists:0 "แม้จะพยายามอย่างสุดความสามารถในการยับยั้งกระแสแห่งการเปลี่ยนแปลง, ความแตกแยกก็มาถึงศรัทธาของพวกเขา, เช่นเดียวกับที่เคยเกิดขึ้นกับศาสนาคริสต์และอิสลามมาก่อน\n\nไม่ว่าฝ่ายปฏิรูปจะได้รับชัยชนะ หรือผู้ศรัทธาจะตกอยู่ภายใต้อิทธิพลของความเชื่อต่างถิ่น, "
 fp1_jomsvikings.1001.desc.fallback:0 "ท้ายที่สุด, พวกเขาก็ไม่แข็งแกร่งพอที่จะต้านทานกระแสแห่งศรัทธาต่างถิ่นได้, และ"
 fp1_jomsvikings.1001.desc.outro:0 "บัดนี้ดูเหมือนว่า [leader.GetFaith.GetName] จะต้องถูกทอดทิ้งสู่กองขยะแห่งประวัติศาสตร์อย่างหลีกเลี่ยงไม่ได้"
 fp1_jomsvikings.1001.holy_order_destroyed:0 "[title.GetNameNoTier] ได้ถูกทำลายแล้ว"
 fp1_jomsvikings.1001.a:0 "ทวยเทพทอดทิ้งเราแล้ว!"
 fp1_jomsvikings.1001.a.tt:0 "ยมส์ไวกิงจะไม่มอบพรแก่ผู้ศรัทธาอีกต่อไป"
 fp1_jomsvikings.1001.b:0 "หมดเสี้ยนหนามไปเสียที!"
 fp1_jomsvikings.1001.b.tt:0 "ยมส์ไวกิงจะไม่ปล้นสะดมผู้ไร้ศรัทธาอีกต่อไป"
 fp1_jomsvikings.1001.c:0 "ยมส์-ใครนะ?"
 fp1_jomsvikings.1001.c.tt:0 "$fp1_jomsvikings.1001.b.tt$"
