l_english: 
 # Holding a grand sacrifice.
 fp1_other_decisions.0001.t:0 "[blotter.Custom('GruesomeFestivalName')|U]อันยิ่งใหญ่"
 fp1_other_decisions.0001.desc:0 "แม้ว่า[blotter.Custom('GruesomeFestivalNamePlural')]ที่เล็กกว่าจะจัดขึ้นในหลายโอกาสตลอดทั้งปี แต่ทุกๆ ทศวรรษ [gf_faith.GetAdherentNamePlural]แห่ง[blotter.GetPrimaryTitle.GetNameNoTierNoTooltip]จะมารวมตัวกันเพื่อเฉลิมฉลองอย่างยิ่งใหญ่ และที่สำคัญที่สุดคือ การ#EMP สังเวย#! อันยิ่งใหญ่\n\nแม้ว่าเลือดจำนวนมากจะหลั่งไหลเพื่อ[gf_faith.PantheonTerm] แต่เนื้อของเครื่องสังเวยจะตกเป็นของผู้ศรัทธา งานเลี้ยงอันอุดมสมบูรณ์ เช่นนี้มักจะนำไปสู่งานเลี้ยงที่น่าเหลือเชื่อ\n\nแน่นอนว่าเรื่อง เช่นนี้มีค่าใช้จ่ายสูง และแน่นอนว่าไม่จำเป็นต้องเชิญ#EMP [gf_faith.GetAdherentNamePluralNoTooltip]#! ทั้งหมด..."
 fp1_other_decisions.0001.a.capital:0 "บางทีอาจจะแค่ผู้คนใน[capital_county.GetNameNoTierNoTooltip]และราชสำนัก?"
 fp1_other_decisions.0001.a.other:1 "ผู้คนใน[fallback_location.GetNameNoTierNoTooltip]รักษาศรัทธาได้ดีพอที่จะเป็นเจ้าภาพให้เรา"
 fp1_other_decisions.0001.b:0 "[blotter.Custom('WomenMenPeople_GenderPreference')]อิสระทุกคนในอาณาเขตของข้าจงมา!"
 fp1_other_decisions.0001.c:0 "ทุก[blotter.Custom('LadyLordNoble_GenderPreference')|U]และสามัญชนใน[blotter.GetPrimaryTitle.GetTierAsNameNoTooltip]ได้รับเชิญ!"
 fp1_other_decisions.0001.d:0 "คิดดูอีกที นี่มันแพงเกินไป..."
 ## ^Technically, the two loc keys above should use gf_faith, but we permit blotter to think of the event through their personal world-view.
 fp1_other_decisions.0001.prep_start.tt:0 "การเตรียมการสำหรับ[blotter.Custom('GruesomeFestivalName')]เริ่มต้นขึ้น..."
 fp1_other_decisions.0001.prep_continue.tt:0 "การเตรียมการสำหรับ[blotter.Custom('GruesomeFestivalName')]ดำเนินต่อไป..."

 fp1_other_decisions.0002.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0002.desc.intro:0 "[blotter.Custom('GruesomeFestivalName')]สามารถเป็นได้ทั้งเรื่องใหญ่และเรื่องเล็ก\n\nตามประเพณี ยัง รวมถึงการสังเวยทั้งมนุษย์และสัตว์ นักโทษหลายคนจะถูกถวายแด่[gf_faith.PantheonTerm] บางทีอาจ รวมถึงตัวเลือกพิเศษของข้าเอง ชีวิตของพวกเขาถูกมอบให้เป็นเครื่องบรรณาการแด่[gf_faith.PantheonTerm]\n\nแม้ว่าความเชื่อของ[gf_faith.GetNameNoTooltip]จะเรียกร้องสิ่งนี้"
 fp1_other_decisions.0002.desc.vassals_dislike_humsac:0 "มีคนในหมู่ข้าในบังคับของข้าที่พบว่าความคิดนี้ป่าเถื่อน"
 fp1_other_decisions.0002.desc.counties_dislike_humsac:0 "มีสามัญชนในอาณาจักรของข้าที่พบว่าความคิดนี้น่ารังเกียจ"
 fp1_other_decisions.0002.desc.courtiers_dislike_humsac:0 "มีบางคนในราชสำนักที่รังเกียจความคิดนี้อย่างยิ่ง"
 fp1_other_decisions.0002.desc.fallback:0 "จริงๆ แล้วมันไม่ใช่ข้อกำหนดที่เข้มงวด"
 fp1_other_decisions.0002.desc.outro:0 "และพิธีสามารถดำเนินต่อไปได้ด้วยการสังเวยสัตว์เพียงอย่างเดียวหากข้าต้องการหลีกเลี่ยงความขัดแย้ง"
 fp1_other_decisions.0002.a:0 "การสังเวยสัตว์ที่เหมาะสมก็น่าจะเพียงพอแล้ว"
 fp1_other_decisions.0002.animals_only.regular.opinion:0 "การได้รับ[opinion|E]และ[county_opinion|E]กับ[gf_faith.GetAdherentNamePlural]จะน้อยกว่าการสังเวยมนุษย์"
 fp1_other_decisions.0002.animals_only.appeased_humsac_haters:0 "ข้าแผ่นดินที่ไม่สนับสนุนการสังเวยมนุษย์จะไม่สูญเสีย[opinion|E]หรือ[county_opinion|E]"
 fp1_other_decisions.0002.animals_only.regular.piety:0 "#positive_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i]จะได้รับ$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.regular.piety.loss:0 "#negative_value [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i]จะสูญเสีย$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.b:0 "จงนำสัตว์เดรัจฉานหรือสัตว์ปีกมาสำหรับทุก[blotter.Custom('WomanManPerson_GenderPreference')]!"
 fp1_other_decisions.0002.animals_only.magnificent.opinion:0 "การได้รับ[opinion|E]และ[county_opinion|E]กับ[gf_faith.GetAdherentNamePlural]จะเทียบเท่ากับการสังเวยมนุษย์"
 fp1_other_decisions.0002.animals_only.magnificent.piety:0 "#positive_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i]จะได้รับ$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.magnificent.piety.loss:0 "#negative_value [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i]จะสูญเสีย$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.c:0 "ประเพณีมีความสำคัญ [gf_faith.PantheonTerm|U]จะได้ลิ้มรสเลือดมนุษย์"
 fp1_other_decisions.0002.human_sacrifice.regular.opinion:0 "การได้รับ[opinion|E]และ[county_opinion|E]กับ[gf_faith.GetAdherentNamePlural]จะเทียบเท่ากับการสังเวยสัตว์อย่างยิ่งใหญ่"
 fp1_other_decisions.0002.animals_only.offended_humsac_haters:0 "ข้าแผ่นดินที่ไม่สนับสนุนการสังเวยมนุษย์จะสูญเสีย[opinion|E]และ[county_opinion|E]อย่างมาก"
 fp1_other_decisions.0002.human_sacrifice.regular.piety:0 "#positive_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i]จะได้รับ$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.regular.piety.loss:0 "#negative_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i]จะสูญเสีย$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.optional_victim_picker:0 "ท่านอาจเลือก[designate_chief_sacrifice_article|E]จากบรรดา[prisoners|E]ของท่านได้"
 fp1_other_decisions.0002.human_sacrifice.become_cannibal:0 "ท่านจะกลายเป็น[GetTrait('cannibal').GetName( GetNullCharacter )]ที่[blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0002.d:0 "มีเพียงเครื่องสังเวยที่ดีที่สุดเท่านั้นที่จะทำได้: ทั้ง[blotter.Custom('WomanManPerson_GenderPreference')]และสัตว์..."
 fp1_other_decisions.0002.human_sacrifice.magnificent.opinion:0 "การได้รับ[opinion|E]และ[county_opinion|E]กับ[gf_faith.GetAdherentNamePlural]จะสูงที่สุดเท่าที่จะเป็นไปได้"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety:0 "#positive_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i]จะได้รับ$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety.loss:0 "#negative_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i]จะสูญเสีย$fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.blot_invalidation.tt:0 "[blotter.Custom('GruesomeFestivalName')|U]ถูกบังคับให้ยกเลิก"
 fp1_other_decisions.0002.blot_invalidation.costs_recouped.tt:0 "[gold|E]ส่วนใหญ่และ[prestige|E]ทั้งหมดของข้าได้รับการชดเชยคืน"
 fp1_other_decisions.0002.piety_gain.rump:0 "ที่[blotter.Custom('GruesomeFestivalName')]"

 fp1_other_decisions.0003.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.desc.intro.small:0 "แม้ว่าการรวมตัวจะมีขนาดเล็ก แต่บรรยากาศที่[blotter.Custom('GruesomeFestivalName')]ก็เต็มไปด้วยความกระตือรือร้น โดยมี[gf_faith.GetAdherentNamePlural]ที่มีความสุขเบียดเสียดและเยาะเย้ยขณะที่"
 fp1_other_decisions.0003.desc.intro.medium:0 "[gf_faith.HouseOfWorship]เต็มไปด้วย[gf_faith.GetAdherentNamePlural]ที่มีความสุขและส่งเสียงเชียร์จนล้นหลาม ทุกคนโห่ร้องขณะที่"
 fp1_other_decisions.0003.desc.intro.large:0 "แขกที่[blotter.Custom('GruesomeFestivalName')]มีจำนวนมากจนปกคลุมพื้นที่รอบๆ [gf_faith.HouseOfWorship] ส่งเสียงโห่ร้องดังสนั่นขณะที่"
 fp1_other_decisions.0003.desc.animals.regular:0 "ขบวนสัตว์สังเวยที่น่านับถือถูกนำไปยังแท่นบูชา\n\n"
 fp1_other_decisions.0003.desc.animals.magnificent:0 "ขบวนสัตว์สังเวยอันยิ่งใหญ่ถูกต้อนไปยังแท่นบูชา\n\n"
 fp1_other_decisions.0003.desc.humans.regular.sans_chief:0 "กลุ่มนักโทษที่หวาดกลัวถูกเดินขบวนไปยังแท่นบูชา โดยมีสัตว์ตามหลัง\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.sans_chief:0 "กลุ่มนักโทษที่ดูน่าเกรงขามและปศุสัตว์อันงดงามถูกเดินขบวนไปยังแท่นบูชา\n\n"
 fp1_other_decisions.0003.desc.humans.regular.plus_chief:0 "[sacrifice.GetFirstName]ถูกลากขึ้นไปบนแท่นบูชา เป็นคนแรกของนักโทษหลายคนและสัตว์ร้ายอีกมากมาย\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.plus_chief:0 "[sacrifice.GetFirstName]ถูกลากขึ้นไปบนแท่นบูชา เป็นคนแรกสุดในแถวยาวของคนและสัตว์ร้ายที่ทอดยาวออกไปนอกประตู\n\n"
 fp1_other_decisions.0003.desc.sacrifice.named.norse_cannibals:0 "[sacrifice.GetSheHe|U]ดิ้นรนอย่างไร้ประโยชน์ขณะที่[sacrifice.GetSheHe]ถูกรัดคอจนตาย แล้วจึงถูกรีดเลือด $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$ $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$"
 fp1_other_decisions.0003.desc.sacrifice.named.cannibals:0 "[sacrifice.GetSheHe|U]ถูก ทำให้สลบโดยใช้กำลังก่อน $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$"
 fp1_other_decisions.0003.desc.sacrifice.named.norse:0 "[sacrifice.GetSheHe|U] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$ $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$"
 fp1_other_decisions.0003.desc.sacrifice.named.fallback:0 "[sacrifice.GetSheHe|U]ดิ้นรนอย่างน่าชื่นชม จนกระทั่งลำคอของ[sacrifice.GetHerHis]ถูกเชือด\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse_cannibals:0 "เหยื่อรายแรกดิ้นรนอย่างไร้ผล และการรัดคอของ[sacrifice.GetHerHis]ก็รวดเร็ว $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$ $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.cannibals:0 "[blotter.Custom('SacrificeTerm')]คนแรกถูกลากไปยังแท่นบูชาและถูก ทำให้สลบโดยใช้กำลัง $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse:0 "[blotter.Custom('SacrificeTerm')]คนแรก $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$ $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.fallback:0 "[blotter.Custom('SacrificeTerm')]มนุษย์คนแรกยังคงดิ้นรน จนกระทั่งลำคอของ[sacrifice.GetHerHis]ถูกควักออก\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.animal.norse:0 "[blotter.Custom('GruesomeFestivalAnimalPreference')] แต่ละตัวถูกนำออกมาทีละตัว ถูกรัดคอจนตายและรีดเลือด เนื้อจะถูกนำไปเผาไฟ แล้วจึงนำไปเลี้ยงฉลอง $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$"
 fp1_other_decisions.0003.desc.sacrifice.animal.fallback:0 "[blotter.Custom('GruesomeFestivalAnimalPreference')] แต่ละตัวถูกนำออกมาทีละตัว คอของพวกมันถูกเชือดอย่างรวดเร็ว และร่างของพวกมันถูกส่งมอบให้กับพ่อครัวและฝูงชนที่หิวโหย"
 fp1_other_decisions.0003.desc.outro.faithful:0 "\n\nช่างเป็นภาพที่คู่ควรแก่[gf_faith.PantheonTerm]อย่างแท้จริง"
 fp1_other_decisions.0003.desc.outro.political:0 "\n\nข้าอาจไม่ได้นับถือศรัทธาเดียวกัน แต่ข้าแผ่นดินที่มีความสุขย่อมนำมา ซึ่ง[blotter.GetTitleAsNameNoTooltip]ที่มีความสุข"
 fp1_other_decisions.0003.happy_characters_list:0 "[character|E]ชาว[gf_faith.GetName]ทุกคนที่ได้รับเชิญ"
 fp1_other_decisions.0003.happy_titles_list:0 "[county|E]ชาว[gf_faith.GetName]ทุกแห่งที่ได้รับเชิญ"
 fp1_other_decisions.0003.unhappy_characters_list:0 "[character|E]ทุกคนใน[realm|E]ที่ไม่ประกอบพิธีสังเวยมนุษย์"
 fp1_other_decisions.0003.unhappy_titles_list:0 "[county|E]ทุกแห่งใน[realm|E]ที่ไม่ประกอบพิธีสังเวยมนุษย์"
 fp1_other_decisions.0003.attendee_became_cannibal:0 "ท่านเข้าร่วมงานเลี้ยงกินเนื้อคนของ[blotter.GetTitledFirstNamePossessiveNoTooltip]"
 fp1_other_decisions.0003.a:0 "แด่[gf_faith.HighGodName]! แด่[gf_faith.FertilityGodName]! แด่[gf_faith.WealthGodName]!"
 fp1_other_decisions.0003.b:0 "นี่ดูเหมือนจะเป็นโอกาสอันยอดเยี่ยมที่จะสร้างความประทับใจให้กับเหล่าขุนนาง"
 fp1_other_decisions.0003.b.nobility_list:0 "ขุนนาง [gf_faith.GetName] ทุกคนที่ได้รับเชิญ ซึ่งมี [rank|E] อย่างน้อย [count|E]"
 fp1_other_decisions.0003.b.clergy_list:0 "นักบวช [gf_faith.GetName] ทุกคนที่ได้รับเชิญ ซึ่งมี [rank|E] อย่างน้อย [count|E] และ [GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] ของท่าน"
 fp1_other_decisions.0003.c:0 "ถึงเวลาคลุกคลีกับพวกไพร่สามัญ!"
 fp1_other_decisions.0003.d:0 "ข้าขอตัวกลับก่อน ข้าทำ#EMP พอแล้ว#! เท่าที่เป็นอยู่"
 fp1_other_decisions.0003.e:0 "แด่[gf_faith.HighGodName]! ข้าออกเสียงถูกต้องหรือไม่?"
 fp1_other_decisions.0003.f:0 "[gf_faith.GetAdherentNamePluralNoTooltip]เหล่านี้มีศรัทธาที่น่าดึงดูดใจจริงๆ..."

 fp1_other_decisions.0004.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0004.desc:0 "มีคนในดินแดนของข้าที่เชื่อในการจัดสังหารหมู่สังเวยอันยิ่งใหญ่เพื่อเทพเจ้าในจินตนาการของพวกเขา ศรัทธา[blotter.GetFaith.GetAdjective]อันรู้แจ้งของข้าเองไม่สนับสนุนการฆ่าสัตว์ เช่นนั้น แต่คุณสมบัติที่น่าสงสัยของ[blotter.Custom('GruesomeFestivalNamePlural')]หลายอย่างคือพวกมันขึ้นอยู่กับการมีส่วนร่วมอย่างแข็งขันของ[blotter.GetTitleAsNameNoTooltip]\n\nข้าไม่จำเป็นต้องเปลี่ยนมานับถือความเชื่อของพวกเขาเพื่อบริหารจัดการวิถีทางของพวกเขา แต่มันจะ ทำให้ข้าได้เพื่อนมากมายในหมู่ข้าแผ่นดินที่ไม่ค่อยรู้แจ้งของข้า ทั้งชาวนาและขุนนาง หากตกลงที่จะจัด[blotter.Custom('GruesomeFestivalName')]อันยิ่งใหญ่เพื่อศรัทธาของพวกเขา"
 fp1_other_decisions.0004.a:1 "[option_1.GetAdherentNamePlural]อาจคุ้มค่าที่จะเอาใจ..."
 fp1_other_decisions.0004.b:1 "ดังนั้น[option_2.GetAdherentNamePlural]จะ#EMP สนับสนุน#! ข้าจริงๆ หรือ?"
 fp1_other_decisions.0004.c:0 "เทศกาล[option_3.GetAdjective]มีเสน่ห์บางอย่าง"
 fp1_other_decisions.0004.d:0 "นี่จะเป็น อย่างดีที่สุด ก็คือการนอกรีต#EMP อย่างที่สุด#!"

 # Copy-paste labels.
 fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl:0 "เลือดทั้งหมดถูกรวบรวมไว้ในชาม และ[gf_faith.PriestNeuterPlural]ใช้มันทาผนังของ[gf_faith.HouseOfWorship] ทั้งภายในและภายนอก"
 fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation:0 "เนื้อที่กินได้ถูกแล่ออกไปสำหรับงานเลี้ยง ในขณะที่ส่วนที่เหลือจะไปที่ต้นไม้แขวนคอด้านนอก และ[blotter.Custom('SacrificeTerm')]คนต่อไปก็ถูกลากออกมา"
 fp1_other_decisions.0003.desc.sacrifice.norse_throttling:0 "ดิ้นทุรนทุรายอย่างดุเดือดขณะที่[gf_faith.PriestNeuterPlural]รัดคอเอาชีวิตของ[sacrifice.GetHerHis]ไป แสงใน[sacrifice.Custom('EyeEyes')]ของ[sacrifice.GetHerHis]คงอยู่ จนกระทั่งสัตว์ตัวแรกถูกฆ่า ศพมนุษย์ไปที่ต้นไม้แขวนคอ สัตว์ไปที่กองไฟทำอาหาร"
 fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter:0 "ถูก ทำให้หมดสติ เพื่อให้ร่างกายผ่อนคลาย ความกลัวจะ ทำให้เนื้อเสีย จากนั้น [gf_faith.PriestNeuterPlural]ก็ลงมา แล่เนื้อชุ่มฉ่ำสำหรับหม้อปรุงอาหาร แม้ ในขณะที่[blotter.Custom('SacrificeTerm')]คนต่อไปถูกนำออกมา ยังคงกรีดร้อง"
 fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling:0 "เพื่อนนักโทษของ[sacrifice.GetHerHis|U]มองดูด้วยความสยดสยองขณะที่ศพถูกควักไส้ออกมา โดยรู้ว่าตาของพวกเขาจะมาถึง บางทีพวกเขาอาจอิจฉาการตายที่สะอาดกว่าของสัตว์ ซึ่งตรงไปที่กองไฟทำอาหารหลังความตาย"

 fp1_other_decisions.0011.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0011.desc.intro:0 "[blotter.Custom('GruesomeFestivalNamePlural')|U]เป็นส่วนสำคัญของศรัทธา[gf_faith.GetName] และ[blotter.Custom2('MyCharacterIntroduction', ROOT.Char)]กำลังจัดงานรวมตัว เช่นนี้\n\nมันจะเป็นงานใหญ่ เข้าร่วมโดย[gf_faith.GetAdherentNamePluralNoTooltip]ทั้งหมดของ[blotter.GetPrimaryTitle.GetNameNoTier] ทั้งขุนนางและสามัญชน"
 fp1_other_decisions.0011.desc.cannibal_blot:0 "เช่นเดียวกับพิธีกรรมพิเศษหลายอย่าง การบริโภคเนื้อคนตามพิธีกรรมจะเป็นข้อบังคับสำหรับคนในสถานะของข้า"
 fp1_other_decisions.0011.desc.fallback:0 "อาหาร ความบันเทิง และอื่นๆ จะจ่ายโดย[blotter.GetTitledFirstNameNoTooltip]ทั้งหมด"
 fp1_other_decisions.0011.desc.outro:0 "\n\nแม้ว่าข้าจะยุ่ง แต่ทูตที่อธิบายความหมกมุ่นของข้าก็เป็นเรื่องปกติ อย่างไรก็ตาม หากข้าต้องการดูหมิ่น[blotter.GetTitleAsNameNoTooltip]ของข้า ข้าก็สามารถส่งคำตอบกลับไปไม่ได้เลย..."
 fp1_other_decisions.0011.a:0 "เป็นการสุภาพที่จะสละเวลาสักวัน"
 fp1_other_decisions.0011.b:0 "ช่างหัว[blotter.GetFirstNameNoTooltip]และม้าที่ผู้ส่งสารของ[blotter.GetHerHis]ขี่มาเถอะ"
 fp1_other_decisions.0011.b.tt:0 "[blotter.GetFirstNameNoTooltip]อาจสังเกตเห็นการหายไปของท่านในที่สุด"
 fp1_other_decisions.0011.c:0 "เนื้อศักดิ์สิทธิ์! ข้ารอชิมครั้งแรกไม่ไหวแล้ว..."
 fp1_other_decisions.0011.d:0 "ข้าจะไป แต่ข้าจะไม่กินเนื้อคน"
 fp1_other_decisions.0011.e:0 "ไม่มีทางใน[gf_faith.NegativeAfterLife]ที่ข้าจะไป#EMP นั่น#!!"
 fp1_other_decisions.0011.e.tt:0 ""
 fp1_other_decisions.0012.t:0 "$fp1_other_decisions.0001.t$: ใบหน้าที่หายไป"
 fp1_other_decisions.0012.desc.intro:0 "ไม่ใช่เรื่องแปลกที่ข้าแผ่นดินคนสำคัญจะพลาดแม้ แต่[blotter.Custom('GruesomeFestivalName')]อันยิ่งใหญ่ แต่ทูตที่เหมาะสมเพื่ออธิบายเหตุผลและเข้าร่วมแทนถือเป็นเรื่องสุภาพ\n\n"
 fp1_other_decisions.0012.desc.multiple_decliners:0 "[decliner_1.GetTitledFirstName]และคนอื่นๆ อีกหลายคน"
 fp1_other_decisions.0012.desc.single_decliner:0 "[decliner_1.GetTitledFirstName]"
 fp1_other_decisions.0012.desc.outro:0 "หายไปอย่างเห็นได้ชัดและไม่ได้ส่งข้อความมาก่อน นี่เป็นการดูหมิ่นอำนาจของข้าอย่างชัดเจน หากไม่ผิดกฎหมายเสียทีเดียว"
 fp1_other_decisions.0012.a:0 "สาปแช่งและระเบิด[decliner_1.GetTitledFirstNameNoTooltip]!"
 fp1_other_decisions.0012.a.decliner_toast.t:0 "[blotter.GetTitledFirstNameNoTooltip]สังเกตเห็นการหายไปของท่านที่[blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0012.b:0 "ช่างหัวพวกมันทั้งหมด!"
 fp1_other_decisions.0012.b.all_decliners_list:0 "[vassals|E]ทั้งหมดที่ปฏิเสธ"
 fp1_other_decisions.0012.c.singular:0 "เอ๊ะ การสูญเสียของ[decliner_1.GetHerHis]"
 fp1_other_decisions.0012.c.plural:0 "เอ๊ะ การสูญเสียของพวกเขา"

 fp1_other_decisions.0021.t:0 "การดูหมิ่นศาสนาขั้นสูงสุด"
 fp1_other_decisions.0021.desc:0 "ข่าวที่น่าสะพรึงกลัวจาก[sacrificer.GetPrimaryTitle.GetNameNoTierNoTooltip]! ดูเหมือนว่า[sacrificer.Custom('GetUnbelieverName')]ผู้ชั่วร้าย [sacrificer.GetShortUIName] ได้สังเวยขุนนาง[sacrificed_hof.GetTitledFirstName]ให้กับศรัทธาอันน่าขยะแขยงของ[sacrificer.GetHerHis]\n\n"
 fp1_other_decisions.0021.desc.allows_holy_wars:0 "แล้ว เส้นเลือดของ[sacrificed_hof.GetFaith.GetAdherentNamePlural]ผู้คลั่งไคล้ทุกหนแห่งก็ลุกไหม้ด้วยความโกรธแค้นอันชอบธรรม!\n\nการดูถูกนี้ไม่อาจปล่อยให้ผ่านไปโดยไม่ถูกลงโทษ และทุกโรงเตี๊ยม ป้อมปราการ และวังที่คำพูดของ[sacrificed_hof.GetFaith.WarGodName]มีอิทธิพล ต่างก็เต็มไปด้วยการพูดคุยเรื่องสงครามศักดิ์สิทธิ์"
 fp1_other_decisions.0021.desc.disallows_holy_wars:0 "แม้ในช่วงเวลาที่ยากลำบากนี้ เราต้องจดจำวิถีทางของ[sacrificed_hof.GetFaith.HighGodName] และไม่หลั่งเลือดโดยเปล่าประโยชน์ ไม่มีอะไรจะนำ[sacrificed_hof.GetTitledFirstNameNoTooltip]กลับมาได้ และ[sacrificed_hof.GetSheHe]คงต้องการให้เราร่ำไห้ถึง[sacrificed_hof.GetHerHim]อย่างชอบธรรมและสงบสุข"
 fp1_other_decisions.0021.a.zealous:0 "นี่มันการดูหมิ่นศาสนาอะไรกัน?!"
 fp1_other_decisions.0021.a.cynical:0 "หากไม่มีอะไรอื่น นี่คือการดูถูกประชาชนของเรา!"
 fp1_other_decisions.0021.a.fallback:0 "น่ากลัวอะไร เช่นนี้!"
 fp1_other_decisions.0021.cheaper_holy_wars.tt:0 "[holy_wars|E]ต่อต้าน[sacrificer.GetShortUIName]ตอนนี้ถูกลงอย่างมาก"
 fp1_other_decisions.0021.easier_holy_wars.tt:0 "[holy_wars|E]ต่อต้าน[sacrificer.GetShortUIName]ต้องการ[piety_levels|E]น้อยกว่าปกติ"
 fp1_other_decisions.0021.ghw_target_preference.tt:0 "[great_holy_wars|E]มีแนวโน้มที่จะต่อต้าน[sacrificer.GetShortUIName]มากขึ้น"

 fp1_other_decisions.0022.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0022.desc:0 "ดูเหมือนว่า[unlucky_guest.GetFaith.GetAdherentNamePlural]ของโลกจะไม่พอใจการสังเวย[unlucky_guest.GetTitleAsNameNoTooltip]จอมปลอมของพวกเขาโดยข้าเท่าใดนัก\n\n"
 fp1_other_decisions.0022.desc.disallows_holy_wars:0 "จริงตามศรัทธาที่รักสงบของพวกเขา พวกเขาดูเหมือนจะพอใจที่จะรวมตัวกันและสวดภาวนาเงียบๆ ต่อ[unlucky_guest.GetFaith.HighGodName]ของพวกเขา แทนที่จะแสวงหาการแก้แค้นที่นองเลือด"
 fp1_other_decisions.0022.desc.allows_holy_wars:0 "จริงตามศรัทธาที่รักสงครามของพวกเขา มีหลายคนในหมู่พวกเขาที่เรียกร้องหัวข้า และเทศนาสงครามศักดิ์สิทธิ์จนกว่าอาณาจักรของข้าจะถูกกวาดล้างไปจากพื้นโลก"
 fp1_other_decisions.0022.a.pacifists:0 "ฮ่า บางที[unlucky_guest.GetFaith.HighGodName]อาจจะลงโทษข้า?"
 fp1_other_decisions.0022.a.craven:0 "นี่... อาจเป็นความผิดพลาด"
 fp1_other_decisions.0022.a.fallback:0 "ปัดโธ่ ให้พวกมันมา!"

 fp1_other_decisions.0023.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0023.desc.intro:0 "[unlucky_guest.GetFaith.GetAdherentNamePlural]ทุกหนแห่งตกตะลึง [unlucky_guest.GetShortUIName]อันเป็นที่รักของเราถูกสังเวยให้กับ[gf_faith.GetAdherentNamePlural]ผู้ชั่วร้าย และที่แย่กว่านั้นคือ โดย#EMP คำสั่งด่วน#! ของคนของเราเอง\n\n"
 fp1_other_decisions.0023.desc.has_excommunication:0 "[blotter.GetShortUIName]ถูกบัพพาชนียกรรมทันทีและการกระทำที่ดูหมิ่นศาสนาของ[blotter.GetHerHis]ถูกประณามต่อ[unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip]ที่ดีทุกคน"
 fp1_other_decisions.0023.desc.does_not_have_excommunication:0 "[unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip]ผู้ชอบธรรมทุกคนเรียกร้องให้[blotter.GetShortUIName] ขอให้ชื่อของ[blotter.GetHerHis]ถูกสาปแช่ง ถูกขับไล่ออกจากศรัทธา"
 fp1_other_decisions.0023.desc.outro:0 "ขอให้[unlucky_guest.GetFaith.NegativeAfterLife]กลืนกิน[blotter.GetHerHim]ไป!"
 fp1_other_decisions.0023.a:0 "นี่เป็นสิ่งที่ให้อภัยไม่ได้!"
 fp1_other_decisions.0023.b:0 "พวกเขาเป็น#EMP [blotter.GetWomanMan]#! แบบไหนกัน?!"

 fp1_other_decisions.0024.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0024.desc.intro:0 "อะไรเข้าสิงข้า? สมุนของ[unlucky_guest.GetFaith.DevilName]ตนใดหยั่งรากในสมองข้า จนข้ายอมให้ตัวเอง#EMP ประณาม#! การสังเวย[unlucky_guest.GetShortUIName]ต่อเทวรูปต่างชาติอย่างเปิดเผย? การดูหมิ่นศาสนาของข้าเป็นเรื่องซุบซิบในมื้อค่ำของ[unlucky_guest.GetFaith.GetAdherentName]ผู้ชอบธรรมทุกคนทั่วโลก!\n\n"
 fp1_other_decisions.0024.desc.has_excommunication:0 "ไม่จำเป็นต้องมีหมายบัพพาชนียกรรมมาถึง เพื่อให้[unlucky_guest.GetFaith.PriestNeuterPlural]ปฏิเสธที่จะรับฟังบาปของข้า"
 fp1_other_decisions.0024.desc.does_not_have_excommunication:0 "แม้ แต่[unlucky_guest.GetFaith.PriestNeuterPlural]ที่สังเกตน้อยที่สุดก็จะไม่สบตาข้า"
 fp1_other_decisions.0024.desc.outro:0 "ข้าหลงทางและถูกสาปแช่งเท่าที่[unlucky_guest.GetFaith.GetReligion.GetName]เกี่ยวข้อง"
 fp1_other_decisions.0024.a:0 "#EMP ข้าทำอะไรลงไป?!#!"
 fp1_other_decisions.0024.b:0 "[unlucky_guest.GetSheHe|U]เป็นเพียง[unlucky_guest.GetWomanMan] ไม่ใช่เทพเจ้า!"
 fp1_other_decisions.0024.c:0 "เป็นข้าแผ่นดินของข้า ไม่ใช่ข้า!"

 fp1_other_decisions.0063.t:0 "$game_concept_designate_chief_sacrifice_chief_sacrifice$เสียชีวิตก่อน[ROOT.Char.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0063.desc:0 "[designated_sacrifice.GetTitledFirstNameNoTooltip]เสียชีวิตก่อนที่[designated_sacrifice.GetSheHe]จะถูกสังเวย"

 fp1_other_decisions.0101.t.root_title:0 "ศิลาจารึกผ่านยุคสมัย"
 fp1_other_decisions.0101.t:0 "$fp1_other_decisions.0101.t.root_title$: หัวข้อ"
 fp1_other_decisions.0101.desc:0 "ศิลาจารึกทุกหลักบอกเล่าเรื่องราวเหตุการณ์สำคัญในชีวิตของผู้สร้าง ตั้งแต่ชาวนาที่เล็กที่สุดไปจนถึง[ROOT.Char.GetTitleAsNameNoTooltip] เช่นข้า ศิลาบันทึกทุกสิ่ง\n\nอนุสาวรีย์นี้จะกล่าวถึงสิ่งใด?"
 fp1_other_decisions.0101.a:0 "[ROOT.Char.Custom2('RelationToMeShort',ancestor)]ผู้ล่วงลับของข้า [ancestor.GetFirstNameNoTooltip]"
 fp1_other_decisions.0101.a.tt:0 "ศิลาจารึกจะกล่าวถึงครอบครัวผู้ล่วงลับของท่าน..."
 fp1_other_decisions.0101.b:0 "บางทีอาจเป็นศัตรูผู้พ่ายแพ้ของข้า [foe.GetTitledFirstNameNoTooltip]?"
 fp1_other_decisions.0101.b.tt:0 "ศิลาจารึกจะกล่าวถึงชัยชนะในการพิชิตของท่าน..."
 fp1_other_decisions.0101.c:0 "การขึ้นครองบัลลังก์[new_title.GetNameNoTierNoTooltip]ของข้า!"
 fp1_other_decisions.0101.c.tt:0 "ศิลาจารึกจะกล่าวถึงวิธีที่ท่านขึ้นมาปกครอง..."
 fp1_other_decisions.0101.d:0 "ท่านต้องการให้ข้าจ่าย#EMP เท่าไหร่#! สำหรับก้อนหินทาสีขนาดยักษ์?"

 fp1_other_decisions.0111.t:0 "$fp1_other_decisions.0101.t.root_title$: สถานที่"
 fp1_other_decisions.0111.desc.intro:0 "เมื่อข้าตัดสินใจได้แล้วว่าจะใส่อะไรลงบนศิลาจารึกของข้า คำถามยังคงอยู่: จะวางไว้ที่ไหน?\n\n"
 fp1_other_decisions.0111.desc.ancestor:0 "อนุสรณ์สถานสำหรับครอบครัว เช่น [ancestor.GetFirstName] ส่งเสริมความเคารพและความจงรักภักดี ควรวางไว้ในพื้นที่ที่ไม่ค่อยคิดถึงข้า ที่ ซึ่งข้าสามารถเป็นตัวอย่างของการอุทิศตนและการรับใช้ต่ออำนาจที่สูงกว่าได้"
 fp1_other_decisions.0111.desc.conquest:0 "อนุสรณ์สถานแห่งชัยชนะ เช่น ชัยชนะของข้าเหนือ[foe.GetTitledFirstName] เป็นเครื่องเตือนใจถึงจุดจบอันรุ่งโรจน์ของสงคราม ควรวางไว้ในพื้นที่ที่ต้องการการส่งเสริมให้ร่วมมือ"
 fp1_other_decisions.0111.desc.promotion:0 "อนุสาวรีย์แห่งการสถาปนา เช่น การขึ้นเป็น[ROOT.Char.GetTitleAsNameNoTooltip]แห่ง[new_title.GetNameNoTierNoTooltip]ของข้า ส่งเสริมให้ผู้คนรับใช้ผู้ปกครองของตนทั้งในยามทุกข์และสุข ควรวางไว้ในเขตเมือง ที่ ซึ่งเยาวชนจำนวนมากขึ้นสามารถได้รับแรงบันดาลใจให้ออกมาเกณฑ์ทหาร"
 fp1_other_decisions.0111.desc.outro:0 "\n\nแน่นอนว่า มีจุดหนึ่งหรือสองจุดผุดขึ้นมาในใจ..."
 fp1_other_decisions.0111.a:0 "[location_a.GetNameNoTierNoTooltip|U]น่าจะเป็นที่ที่ดี"
 fp1_other_decisions.0111.b:0 "[location_b.GetNameNoTierNoTooltip|U]ดูเหมือนจะดีพอ?"
 fp1_other_decisions.0111.c:0 "[location_c.GetNameNoTierNoTooltip|U]เป็นตัวเลือกที่ดี!"
 
 fp1_other_decisions.1000.t:0 "ถูกสังเวย!"
 fp1_other_decisions.1000.desc:0 "ข้ากำลังเผชิญหน้ากับฝูงชนที่สวดมนต์ สายตาทุกคู่จับจ้องมาที่ข้า [blotter.GetFirstName]ยืนอยู่แถวหน้าพร้อมรอยยิ้มบนใบหน้าของ[blotter.GetHerHis] เตรียมพร้อมที่จะจบชีวิตข้า\n\n"มหาเทพ[blotter.GetFaith.HighGodName]! โปรดรับเครื่องสังเวยนี้!" [blotter.GetSheHe]ตะโกน\n\nนี่คือจุดจบของข้า\n\nความมืดมิดเข้ามา\n\nมันจบแล้ว"
 fp1_other_decisions.1000.a:0 "ข้าจะไปพบเจ้าใน[ROOT.Char.GetFaith.NegativeAfterLife]!"
