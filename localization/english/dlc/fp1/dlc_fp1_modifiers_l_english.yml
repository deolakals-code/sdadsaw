 # #Religion Modifiers
 gruesome_festivals_designated_sacrifice_fp1_modifier:0 "ใกล้จะถูกบูชายัญ"
 gruesome_festivals_designated_sacrifice_fp1_modifier_desc:0 "ตัวละครนี้คือ [designate_chief_sacrifice_chief_sacrifice|E] ที่ถูกกำหนดไว้"
 fp1_jomsvikings_caused_faith_crisis_modifier:0 "วิกฤตศรัทธา"
 fp1_jomsvikings_caused_faith_crisis_modifier_desc:0 "การทะเลาะวิวาทกับผู้นำของคณะนักบวชศักดิ์สิทธิ์ ทำให้ตัวละครนี้สงสัยในความเชื่อของตน"
