l_english: 
 ##################################################
 # #General Character Modifiers
 high_king_of_the_seas_fp1_modifier:0 "มหาราชาแห่งท้องทะเล"
 high_king_of_the_seas_fp1_modifier_desc:0 "ตัวละครนี้คือผู้ปกครองทะเลเหนืออันไร้ข้อโต้แย้ง เป็นเจ้าแห่งทะเลผู้ยิ่งใหญ่สูงสุด"
 high_queen_of_the_seas_fp1_modifier:0 "มหาราชินีแห่งท้องทะเล"
 high_queen_of_the_seas_fp1_modifier_desc:0 "$high_king_of_the_seas_fp1_modifier_desc$"
 defiant_high_king_conversion_boost_modifier:0 "มหาราชาผู้ท้าทาย"
 defiant_high_king_conversion_boost_modifier_desc:1 "ตัวละครนี้นับถือเทพเจ้าเก่าแก่ และจะทำทุกวิถีทางเพื่อแสดงให้ผู้อื่นเห็นว่าควรทำ เช่นกัน\n\nเพิ่มความเร็วในการ [convert_county|E] อย่างมีนัยสำคัญต่อ [faiths|E] ที่ [organized|E]"
 defiant_high_queen_conversion_boost_modifier:0 "มหาราชินีผู้ท้าทาย"
 defiant_high_queen_conversion_boost_modifier_desc:0 "$defiant_high_king_conversion_boost_modifier_desc$"
 scandinavian_adventurer_fp1_modifier:0 "ไวกิ้งพลัดถิ่น"
 scandinavian_adventurer_fp1_modifier_desc:0 "ตัวละครนี้หนีออกจากสแกนดิเนเวียพร้อมกองทัพอันธพาลและนักผจญภัย แสวงหาการสร้างอาณาจักรในที่อื่น"
 nithing_fp1_modifier:0 "นิธิง"
 nithing_fp1_modifier_desc:0 "ตัวละครนี้ไม่มีค่าใดๆ ต่อ $north_germanic_group_collective_noun$ ถือเสมือนตายแล้ว ต่ำต้อยยิ่งกว่าทาส"
 stingy_host_fp1_modifier:0 "เจ้าบ้านขี้เหนียว"
 stingy_host_fp1_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่าปฏิเสธแม้กระทั่งอาหารร้อนๆ แก่บุคคลที่ไม่สำคัญในราชสำนักของตน"
 generous_host_fp1_modifier:0 "เจ้าบ้านใจกว้าง"
 generous_host_fp1_modifier_desc:0 "ตัวละครนี้เป็นที่รู้กันว่าปฏิบัติต่อผู้พเนจรด้วยความเคารพ ความสุภาพ และอาหารร้อนๆ"
 phantom_island_trivia_fp1_modifier:0 "ปริศนาแห่งแอตแลนติก"
 phantom_island_trivia_fp1_modifier_desc:0 "ตัวละครนี้จดจำเรื่องเล่าอันน่าสนใจมากมายเกี่ยวกับเกาะลึกลับแห่งแอตแลนติก"
 phantom_island_critique_fp1_modifier:0 "นักคิดเชิงวิพากษ์"
 phantom_island_critique_fp1_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักในเรื่องความกังขาต่อเรื่องเล่าเกินจริงที่กะลาสีบางคนเล่า"
 exotic_foreign_lord_fp1_modifier:0 "เจ้าต่างแดนผู้แปลกตา"
 exotic_foreign_lord_fp1_modifier_desc:0 "ตัวละครนี้เป็นที่รู้จักในโลกอิสลามในฐานะเจ้าเหนือหัวของอาณาจักรนอกรีตอันแปลกประหลาดและน่าสนใจ"
 horrifying_foreign_lord_fp1_modifier:0 "เจ้าต่างแดนผู้น่าสะพรึงกลัว"
 horrifying_foreign_lord_fp1_modifier_desc:0 "เรื่องเล่าแพร่สะพัดไปทั่วโลกอิสลามเกี่ยวกับพิธีบูชายัญนอกรีตอันน่าสะพรึงกลัวที่แพร่ระบาดในอาณาจักรของตัวละครนี้"
 draugr_healthy_hiking_fp1_modifier:0 "การเดินป่าเพื่อสุขภาพ"
 draugr_healthy_hiking_fp1_modifier_desc:0 "ตัวละครนี้ใช้เวลามากมายอย่างเปล่าประโยชน์ในการเดินป่าในดินแดนของตนเพื่อล่าอสูรกาย"
 ultimate_blasphemer_modifier:0 "ผู้หมิ่นศาสนาขั้นสูงสุด"
 ultimate_blasphemer_modifier_desc:0 "ตัวละครนี้บูชายัญ [head_of_faith|E] ของตนเองแก่เทพเจ้าของ [faithpossessive|E] อื่น ไม่มีผู้ใดถือว่าพวกเขาเป็นสมาชิกที่แท้จริงของผู้ศรัทธา"
 embraced_local_traditions_modifier:0 "ยอมรับประเพณีท้องถิ่น"
 embraced_local_traditions_modifier_desc:0 "ตัวละครที่เคยเป็นชาวสแกนดิเนเวียผู้นี้ได้ยอมรับวัฒนธรรมและศรัทธาของบ้านเกิดใหม่ แม้ว่าพวกเขายังคงสามารถสร้าง #V ศิลาจารึกอักษรรูน#! ได้"
 settled_norse_dynasty_modifier:0 "ราชวงศ์ที่ตั้งรกราก"
 settled_norse_dynasty_modifier_desc:0 "ราชวงศ์สแกนดิเนเวียนี้ได้ตั้งรกรากในดินแดนต่างถิ่น\n#weak ตราบใดที่ตัวปรับแต่งนี้ยังคงอยู่ ผู้ปกครองของราชวงศ์นี้จะไม่ตกเป็นเป้าหมายของนักผจญภัยชาวสแกนดิเนเวีย#!"
 fp1_focusing_on_rule_modifier:0 "มุ่งเน้นการปกครอง"
 fp1_focusing_on_rule_modifier_desc:0 "ตัวละครนี้กำลังมุ่งเน้นไปที่การปกครอง และเพียงการปกครองเท่านั้น โดยละทิ้งความต้องการอื่น ๆ ในชีวิต"
 fp1_ignoring_annoyances_modifier:0 "เมินเฉยต่อสิ่งรบกวน"
 fp1_ignoring_annoyances_modifier_desc:0 "ตัวละครนี้ไม่มีเวลาสำหรับสิ่งรบกวนและความเพ้อฝันเล็กน้อยแบบเด็ก ๆ"
 fp1_avoiding_the_snow_modifier:0 "หลีกเลี่ยงหิมะ"
 fp1_avoiding_the_snow_modifier_desc:0 "ตัวละครนี้ถูกตำหนิว่าใช้เวลาอยู่ท่ามกลางความหนาวเย็นมากเกินไป"
 fp1_daydreaming_about_diplomacy_modifier:0 "ฝันกลางวันเรื่องการเมือง"
 fp1_daydreaming_about_diplomacy_modifier_desc:0 "ตัวละครนี้ใช้เวลาส่วนใหญ่ในการวางแผนนโยบายทางการทูตในใจ"
 fp1_daydreaming_about_martial_modifier:0 "ฝันกลางวันเรื่องกลยุทธ์"
 fp1_daydreaming_about_martial_modifier_desc:0 "ตัวละครนี้ใช้เวลาส่วนใหญ่ในการวางแผนสงครามในอนาคตในใจ"
 fp1_daydreaming_about_stewardship_modifier:0 "ฝันกลางวันเรื่องทองคำ"
 fp1_daydreaming_about_stewardship_modifier_desc:0 "ตัวละครนี้ใช้เวลาส่วนใหญ่ในการวางแผนการเก็บภาษีในอนาคตในใจ"
 fp1_daydreaming_about_intrigue_modifier:0 "ฝันกลางวันเรื่องแผนการ"
 fp1_daydreaming_about_intrigue_modifier_desc:0 "ตัวละครนี้ใช้เวลาส่วนใหญ่ในการประเมินในใจว่าใครคือรายต่อไป"
 fp1_daydreaming_about_learning_modifier:0 "ฝันกลางวันเรื่องหนังสือ"
 fp1_daydreaming_about_learning_modifier_desc:0 "ตัวละครนี้ใช้เวลาส่วนใหญ่ในการนึกถึงตำราเล่มโปรด"
 fp1_excellent_longships_modifier:0 "เรือยาวชั้นเลิศ"
 fp1_excellent_longships_modifier_desc:0 "กองเรือของตัวละครนี้แล่นฝ่าคลื่นราวกับคมดาบผ่าพระ"
 fp1_rotting_longships_modifier:0 "เรือยาวผุพัง"
 fp1_rotting_longships_modifier_desc:0 "กองเรือของตัวละครนี้แทบจะออกทะเลไม่ได้"
 fp1_flagship_leviathan_modifier:0 "เรือธงเลเวียธาน"
 fp1_flagship_leviathan_modifier_desc:0 "เรือยาวส่วนตัวของตัวละครนี้ #EMP ใหญ่โตมโหฬาร#! สามารถบรรทุกของริบได้จำนวนมหาศาลอย่างไม่น่าเชื่อ"
 fp1_flagship_monster_modifier:0 "เรือธงอสูรกาย"
 fp1_flagship_monster_modifier_desc:0 "เรือยาวส่วนตัวของตัวละครนี้ประดับด้วยงานแกะสลักรูปสัตว์ร้าย อสูรกาย ตำนาน และความทุกข์ทรมาน รูปแกะสลักหลายชิ้นคล้ายคลึงกับข้าในบังคับและศัตรูของพวกเขา"
 fp1_flagship_dragon_modifier:0 "เรือธงพญานาค"
 fp1_flagship_dragon_modifier_desc:0 "เรือยาวส่วนตัวของตัวละครนี้เป็นดั่งเรื่องราวในตำนาน รูปลักษณ์อันโดดเด่นเป็นที่รู้จักไปทั่วโลก"
 fp1_cursed_by_nithing_pole_modifier:0 "ถูกสาปโดยเสานิธิง"
 fp1_cursed_by_nithing_pole_modifier_desc:0 "ตัวละครนี้ถูกสาปแช่งถึงตายโดยเสานิธิง พวกเขา #EMP รู้#! ว่าชะตากรรมกำลังมาถึง เพียง แต่ไม่รู้ว่าเมื่อใด และความกลัวกำลังกัดกินพวกเขา #EMP ทั้งเป็น#!."
 fp1_bathing_health_modifier:0 "การอาบน้ำอย่างเคร่งครัด"
 fp1_bathing_health_modifier_desc:0 "ตัวละครนี้รักษากำหนดการอาบน้ำอย่างไม่มีที่ติ ล้างมือก่อนอาหาร และมีผ้าขนหนูร้อนสำหรับแขกเสมอ"
 fp1_bathing_attraction_modifier:0 "การนำเสนออันไร้ที่ติ"
 fp1_bathing_attraction_modifier_desc:0 "ตัวละครนี้ได้รับการดูแลอย่างดีเยี่ยมเสมอ: ฟันขูด ผมหวี หูแคะ ผิวล้าง และไม่มีแม้ แต่เสียงกระซิบของเหา"
 fp1_yearly_0071_troll_victory_bear_modifier:0 "ผู้สังหารหมี"
 fp1_yearly_0071_troll_victory_bear_modifier_desc:0 "ตัวละครนี้มีชื่อเสียงว่าได้สังหารโทรลล์ หรือหมีที่ใหญ่ที่สุดในโลก"
 fp1_yearly_0071_troll_victory_wolf_modifier:0 "ผู้สังหารหมาป่า"
 fp1_yearly_0071_troll_victory_wolf_modifier_desc:0 "ตัวละครนี้สังหารหมาป่าที่ว่องไวมากจนชาวบ้านเชื่อว่าเป็นโทรลล์"
 fp1_yearly_0071_troll_victory_wolverine_modifier:0 "ผู้สังหารวูล์ฟเวอรีน"
 fp1_yearly_0071_troll_victory_wolverine_modifier_desc:0 "ตัวละครนี้สังหารวูล์ฟเวอรีนที่ดุร้ายมากจนชาวบ้านเชื่อว่าเป็นโทรลล์ ทำให้ป่าปลอดภัย"
 fp1_yearly_0071_troll_victory_lynx_modifier:0 "ผู้สังหารลิงซ์"
 fp1_yearly_0071_troll_victory_lynx_modifier_desc:0 "ตัวละครนี้สังหารลิงซ์ที่เงียบเชียบมากจนชาวบ้านเชื่อว่าเป็นโทรลล์"
 fp1_yearly_0071_troll_victory_moose_modifier:0 "ผู้สังหารกวางมูส"
 fp1_yearly_0071_troll_victory_moose_modifier_desc:0 "ตัวละครนี้สังหารกวางมูสที่ดุร้ายมากจนชาวบ้านเชื่อว่าเป็นโทรลล์"
 fp1_yearly_0551_absent_lord_modifier:0 "ผู้ปกครองที่ไม่ค่อยอยู่"
 fp1_yearly_0551_absent_lord_modifier_desc:0 "ตัวละครนี้ ด้วยเหตุผลบางประการ ดูเหมือนจะไม่เคยอยู่ที่ราชสำนักของตนเองเลย โดยเฉพาะช่วงเวลาอาหารเย็น"
 fp1_abased_before_highgod_modifier:0 "ที่ ซึ่งอำนาจที่แท้จริงสถิต"
 fp1_abased_before_highgod_modifier_desc:0 "ตัวละครนี้ปฏิเสธที่จะสวมมงกุฎ โดยยืนกรานว่าอำนาจ #EMP ที่แท้จริง#! อยู่ในพระเจ้าเท่านั้น"
 harald_tanglehairs_vow_modifier:0 "คำสาบานแห่งผมพันกัน"
 harald_tanglehairs_vow_modifier_desc:0 "ตัวละครนี้ได้ให้คำสาบานตลอดชีวิต: พวกเขาจะไม่ตัดหรือหวีผมจนกว่าจะได้เป็นกษัตริย์องค์แรกแห่งนอร์เวย์"
 harald_tanglehairs_reminder_modifier:0 "คำสาบานแห่งผมพันกันที่สำเร็จแล้ว"
 harald_tanglehairs_reminder_modifier_desc:0 "ตัวละครนี้ทำคำสาบานตลอดชีวิตสำเร็จ: ไม่ตัดหรือหวีผมจนกว่าจะได้เป็นกษัตริย์แห่งนอร์เวย์ พวกเขายังคงทำต่อไปเพื่อเป็นเครื่องเตือนใจถึงการเดินทางของพวกเขา"
 harald_tanglehairs_vow_broken_modifier:0 "คำสาบานแห่งผมพันกันที่ผิดสัญญา"
 harald_tanglehairs_vow_broken_modifier_desc:0 "ตัวละครนี้ล้มเหลวในการทำคำสาบานตลอดชีวิตให้สำเร็จ: เนื่องจากพวกเขาไม่ได้เป็นกษัตริย์องค์แรกแห่งนอร์เวย์ พวกเขาจึงไม่อาจตัดหรือหวีผมได้อีกเลย"
 fp1_0511_carries_stinking_trophy_modifier:0 "ถ้วยรางวัลเหม็นคลุ้ง"
 fp1_0511_carries_stinking_trophy_modifier_desc:0 "ตัวละครนี้มีถ้วยรางวัลเน่าเปื่อยที่เต็มไปด้วยหนอนติดตามไปทุกที่ที่พวกเขาไปอย่างแท้จริง บางคนอ้างว่ากลิ่นเหม็นฟุ้งกระจายไปไกลหลายไมล์"
 fp1_reprieve_from_sa_modifier:0 "การผ่อนผันจากนักผจญภัยสแกนดิเนเวีย"
 fp1_reprieve_from_sa_modifier_desc:0 "ด้วยวิธีใดวิธีหนึ่ง ตัวละครนี้ได้รับช่วงเวลาพักผ่อนจากฝูงไวกิ้งที่ไม่หยุดยั้ง\n$EFFECT_LIST_BULLET$ จะไม่ถูกโจมตีโดยนักผจญภัยสแกนดิเนเวียไร้ที่ดิน"

 ##################################################
 # #Shieldmaiden Character Modifiers
 shieldmaiden_level_martial_1_fp1_modifier:0 "ผู้บัญชาการผู้มีประสบการณ์"
 shieldmaiden_level_martial_1_fp1_modifier_desc:0 "ตัวละครนี้ทำงานหนักกว่าหลายคนเพื่อพัฒนาความสามารถในการบัญชาการทหาร"
 shieldmaiden_level_martial_2_fp1_modifier:0 "ผู้บัญชาการผู้ช่ำชอง"
 shieldmaiden_level_martial_2_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_3_fp1_modifier:0 "ผู้บัญชาการผู้กรำศึก"
 shieldmaiden_level_martial_3_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_1_fp1_modifier:0 "นักสู้ผู้มีประสบการณ์"
 shieldmaiden_level_prowess_1_fp1_modifier_desc:0 "ตัวละครนี้ดูเหมือนจะไม่เคยหยุดฝึกฝนดาบเลย"
 shieldmaiden_level_prowess_2_fp1_modifier:0 "นักสู้ผู้มีชื่อเสียง"
 shieldmaiden_level_prowess_2_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_3_fp1_modifier:0 "นักสู้ในตำนาน"
 shieldmaiden_level_prowess_3_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_1_fp1_modifier:0 "นักแทงข้างหลังเจ้าเล่ห์"
 shieldmaiden_level_intrigue_1_fp1_modifier_desc:0 "ตัวละครนี้มองหาโอกาสที่จะเอาเปรียบศัตรูอยู่เสมอ"
 shieldmaiden_level_intrigue_2_fp1_modifier:0 "นักแทงข้างหลังฉาวโฉ่"
 shieldmaiden_level_intrigue_2_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_3_fp1_modifier:0 "นักแทงข้างหลังชื่อกระฉ่อน"
 shieldmaiden_level_intrigue_3_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"

 ##################################################
 # #County Modifiers
 nithing_exiled_fp1_modifier:0 "นิธิงท้องถิ่นถูกเนรเทศ"
 nithing_exiled_fp1_modifier_desc:0 "ชุมชนท้องถิ่นพักผ่อนอย่างปลอดภัยเมื่อรู้ว่าคนพาลได้รับการลงโทษอย่างยุติธรรม"
 nithing_harboured_fp1_modifier:0 "ให้ที่พักพิงแก่นิธิงท้องถิ่น"
 nithing_harboured_fp1_modifier_desc:0 "ชุมชนท้องถิ่นเกลียดชังการสนับสนุนคนพาลที่เป็นที่รู้จักของเจ้าเหนือหัวของพวกเขา"
 nithing_in_limbo_fp1_modifier:0 "ความตึงเครียดทางชนชั้น"
 nithing_in_limbo_fp1_modifier_desc:0 "องค์ประกอบบางอย่างของราชสำนักปะทะกับชุมชนท้องถิ่นเป็นประจำ"
 draugr_remedies_succeeded_fp1_modifier:0 "ดรอเกอร์ถูกขับไล่"
 draugr_remedies_succeeded_fp1_modifier_desc:0 "ไม่ว่าจะด้วยวิธีใดก็ตาม ศพคืนชีพที่หลอกหลอนเคาน์ตีนี้อย่างแน่นอนได้รับการจัดการแล้ว"
 draugr_remedies_failed_fp1_modifier:0 "ดรอเกอร์หลอกหลอนชาวบ้าน"
 draugr_remedies_failed_fp1_modifier_desc:0 "แม้จะพยายามอย่างสุดความสามารถของผู้มีชีวิต เคาน์ตีนี้ก็เต็มไปด้วยโรคระบาด คำสาป และโชคร้าย"
 draugr_monstrous_wolfpack_fp1_modifier:0 "เสียงหอนในยามค่ำคืน"
 draugr_monstrous_wolfpack_fp1_modifier_desc:0 "ฝูงหมาป่าที่หิวโหยและก้าวร้าวผิดปกติย่องไปในป่าของเคาน์ตีนี้ ฉีกทึ้งปศุสัตว์และผู้สัญจรโดดเดี่ยว"
 draugr_monstrous_bear_fp1_modifier:0 "ป่าที่ไม่ปลอดภัย"
 draugr_monstrous_bear_fp1_modifier_desc:0 "หมีขนาดมหึมาโจมตีแบบสุ่มในเคาน์ตีนี้ บางครั้งเอาไปแค่วัว บางครั้งสังหารทั้งครอบครัว"
 draugr_nithing_fp1_modifier:0 "นอกกฎหมายผีสิง"
 draugr_nithing_fp1_modifier_desc:0 "บางคนเรียกพวกเขาว่าศพเดินได้ คนอื่น ๆ เป็นเพียงขโมยเงียบ ๆ แต่ทุกคนเห็นพ้องกันว่าผีขี้ขโมยคอยก่อกวนชาวบ้าน"
 draugr_nothing_found_fp1_modifier:0 "ชาวนาเชื่องมงาย"
 draugr_nothing_found_fp1_modifier_desc:0 "แม้ว่าเจ้าเหนือหัวของพวกเขาจะพยายามพิสูจน์เป็นอย่างอื่น ชาวบ้านท้องถิ่นก็ยังยืนกรานว่าพวกเขาถูกศพคืนชีพตามล่า"
 capital_of_rus_opinion_modifier:0 "เมืองหลวงที่กำลังเติบโต"
 capital_of_rus_opinion_modifier_desc:0 "การหลั่งไหลเข้ามาอย่างต่อเนื่องของสินค้า พ่อค้า และทาสในเคาน์ตีนี้ ทำให้ผู้คนพึงพอใจอย่างที่สุด"
 capital_of_rus_misc_benefits_modifier:0 "เมืองหลวงวารันเจียน"
 capital_of_rus_misc_benefits_modifier_desc:0 "นิคมนี้คือศูนย์กลางระดับภูมิภาค #EMP แห่งเดียว#! สำหรับชาวสลาฟและชาวนอร์ส และได้รับประโยชน์มากมายจากการเป็นที่อยู่ของกลุ่มนักผจญภัย ผู้พิชิต และโจรสลัดนับไม่ถ้วน"
 held_grand_sacrifice_fp1_modifier:0 "เข้าร่วมพิธีบูชายัญครั้งใหญ่"
 held_grand_sacrifice_fp1_modifier_desc:0 "ชาวนาในเคาน์ตีนี้พักผ่อนอย่างสบายใจ โดยรู้ว่าเทพเจ้าพอใจผู้ที่ถวายเครื่องบรรณาการ"
 commoners_grand_sacrifice_fp1_modifier:0 "เข้าร่วมพิธีบูชายัญครั้งใหญ่ของประชาชน"
 commoners_grand_sacrifice_fp1_modifier_desc:0 "ชาวนาในเคาน์ตีนี้ยังคงพูดถึงวิธีที่พวกเขาปะปนกับขุนนางอย่างอิสระในงานเลี้ยงอันยิ่งใหญ่ครั้งล่าสุดที่จัดขึ้นเพื่อเป็นเกียรติแก่เทพเจ้าของพวกเขา"
 held_human_sacrifice_fp1_modifier:0 "หวาดกลัวต่อการบูชายัญมนุษย์"
 held_human_sacrifice_fp1_modifier_desc:0 "ชาวนาลุกฮือต่อต้านการถูกปกครองโดยตัวละครที่ประกอบพิธีกรรมฆาตกรรมมนุษย์คนอื่น"
 trade_instead_of_raid_fp1_modifier:0 "ความเชื่อมโยงระหว่างผู้ปล้นและผู้ค้า"
 trade_instead_of_raid_fp1_modifier_desc:0 "เคาน์ตีนี้ได้รับประโยชน์อย่างมากจากการค้าขายกับผู้ที่อาจเป็นผู้ปล้นแทนที่จะต่อสู้กับพวกเขา ชาวบ้านที่ร่ำรวยที่สุดสวมเสื้อผ้าและเครื่องประดับแปลกตาที่ฉีกมาจากดินแดนต่างถิ่น"
 fp1_stele_ancestors_strong:0 "ศิลาจารึกอักษรรูนบรรพบุรุษ"
 fp1_stele_ancestors_strong_custom_desc:1 "[ROOT.Char.Custom2_Title('SteleCommemoratesAncestors', SCOPE.sTitle('stele_location'))]"
