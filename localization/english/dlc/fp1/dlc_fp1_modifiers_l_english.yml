 fp1_yearly_0591_levy_modifier:1 "ได้รับการสนับสนุนที่สภาทิง"
 fp1_yearly_0591_levy_modifier_desc:1 "เรื่องดราม่าเล็กน้อยที่สภาทิงท้องถิ่นเมื่อเร็ว ๆ นี้ ทำให้เคาน์ตีนี้ได้รับที่ดินชายแดน ทำให้เกิดหมู่บ้านใหม่ ๆ ขึ้น"
 fp1_yearly_0591_building_modifier:1 "ได้รับการพิสูจน์ความถูกต้องที่สภาทิง"
 fp1_yearly_0591_building_modifier_desc:1 "อำนาจทางการเมืองที่สภาทิงท้องถิ่น ทำให้เคาน์ตีนี้สามารถอ้างสิทธิ์ในดินแดนชายแดนเล็ก ๆ หลายแห่ง ทำให้มีพื้นที่กว้างขวางในการขยายถิ่นฐานที่มีอยู่"
 fp1_yearly_0591_spurned_modifier:0 "รู้สึกถูกเมิน"
 fp1_yearly_0591_spurned_modifier_desc:1 "ชาวบ้านในเคาน์ตีนี้รู้ #EMP แน่ชัด#! ว่าเจ้าเหนือหัวของพวกเขาชอบเคาน์ตีคู่แข่งมากกว่าของตน"
 fp1_yearly_0591_otherwise_occupied_modifier:0 "ติดธุระอื่น"
 fp1_yearly_0591_otherwise_occupied_modifier_desc:0 "เคาน์ตีนี้ยุ่งเกินไปกับการต่อสู้กับคู่แข่งข้างบ้านจนไม่สามารถปลุกปั่นความไม่สงบต่อต้านเจ้าเหนือหัวของตนได้"
 fp1_yearly_0071_troll_attacks_modifier:0 "การโจมตีของโทรลล์"
 fp1_yearly_0071_troll_attacks_modifier_desc:0 "มี... #EMP บางสิ่ง#! อยู่ในป่าของเคาน์ตีนี้ น่าสะพรึงกลัว และถึงขั้นสังหารชาวบ้าน"
 fp1_mann_pirate_capital_modifier:0 "นครที่ถูกขโมย"
 fp1_mann_pirate_capital_modifier_desc:0 "เมืองหลวงท้องถิ่นได้รับฉายานี้มาด้วยเลือด ความกลัว และความเหนื่อยยาก ความเหนื่อยยากนั้นมาจากท้องถิ่น แต่เลือดและความกลัวนั้นนำเข้ามาจากต่างประเทศ เป็นประจำ"
 fp1_trade_events_foreign_architects_modifier:0 "สถาปนิกต่างชาติ"
 fp1_trade_events_foreign_architects_modifier_desc:0 "สถาปนิกต่างชาตินำรูปแบบและเทคนิคการก่อสร้างล่าสุดมาจากต่างประเทศ"
 fp1_trade_events_foreign_architects_no_growth_modifier:0 "ความช่วยเหลือจากต่างชาติ"
 fp1_trade_events_foreign_architects_no_growth_modifier_desc:0 "สถาปนิกต่างชาตินำรูปแบบล่าสุดมาจากต่างประเทศ แม้ว่าพวกเขาจะทำอะไรได้เพียงเล็กน้อยเพื่อปรับปรุงอาคารท้องถิ่นที่ซับซ้อน"
 fp1_trade_events_raid_consultants_modifier:0 "ผู้ปล้นผู้ช่ำชองประจำถิ่น"
 fp1_trade_events_raid_consultants_modifier_desc:0 "กลุ่มผู้ปล้นผู้ช่ำชองได้รับค่าจ้างพิเศษเพื่อปกป้องเคาน์ตีนี้จากพวกเดียวกัน"

 ##################################################
 # #Dynasty Modifiers
 fp1_legacy_of_piracy_modifier:0 "มรดกแห่งการปล้นสะดม"
 fp1_legacy_of_piracy_modifier_desc:0 "ราชวงศ์นี้สืบเชื้อสายล่าสุดมาจากโจรสลัดและผู้ปล้นที่ยิ่งใหญ่ที่สุดแห่งยุค ทะเล เกลือ และควันอยู่ในสายเลือดและบนริมฝีปากของพวกเขาเสมอ\n\nสามารถ [raid|E] ได้ โดยไม่คำนึงถึงประเภท [government|E]\nสามารถ $game_concept_raid$ ข้ามทะเลและแล่นเรือในแม่น้ำสายหลักได้"

