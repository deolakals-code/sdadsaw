l_english: 
 secure_high_kingdom_north_sea_decision:0 "สถาปนาราชอาณาจักรทะเลเหนืออันยิ่งใหญ่"
 secure_high_kingdom_north_sea_decision_desc:0 "ราชอาณาจักร $k_england$, $k_denmark$, และ $k_norway$ นั้นเข้ากันได้อย่างเป็นธรรมชาติ มั่งคั่ง ดุร้าย และผูกพันกันด้วยการค้าและสายเลือดขุนนาง หากเพียง แต่มีผู้ใดสามารถเอาชนะความเป็นปัจเจกของพวกเขาได้ ผสานทั้งสามเข้าด้วยกันอย่างถาวร..."
 secure_high_kingdom_north_sea_decision_tooltip:1 "ผูกมัด $k_england$, $k_denmark$, และ $k_norway$ ให้เป็น[realm|E]หนึ่งเดียว[de_jure|E]"
 secure_high_kingdom_north_sea_decision_confirm:0 "เหนือสิ่งอื่นใด มหาราชันย์!"
 secure_high_kingdom_north_sea_decision_solve_danelaw:0 "ปัจจุบัน $k_danelaw$ มี[counties|E]ตาม[de_jure|E] และ $k_england$ จะต้องถูกรวมส่วนก่อน"
 secure_high_kingdom_north_sea_scripted_effect.daneland_reabsorbed.tt:0 "[duchies|E]ทั้งหมดของ $k_daneland$ ที่[completely_controlled|E]จะถูก[de_jure_drift_drifted|E]กลับคืนสู่ $k_england$"
 secure_high_kingdom_north_sea_scripted_effect: "ท่านได้รับ [strong_hook|E] #weak (ความภักดี)#! ต่อ [powerful_vassals|E]"
 secure_high_kingdom_north_sea_custom_powerful_vassals: "ทุก [powerful_vassal|E]"
 secure_high_kingdom_denmark_held_years: "ถือครอง [temp_scope.GetName] เป็นเวลา #V 10#! ปี #weak (ปัจจุบัน [SCOPE.ScriptValue('north_sea_held_value')|0V])#!"
 secure_high_kingdom_neustria: "ท่านได้รับ[title|E] #V อาณาจักรนูสเตรีย#!"
 secure_high_kingdom_custom_every_coastal: "ทุก [province|e] ชายฝั่ง"
 north_sea_kingdom_coastal_modifier: "สันติภาพนอร์ดิก"

 found_capital_of_the_rus_decision:0 "สถาปนาราชธานีแห่งรุส"
 found_capital_of_the_rus_decision_desc:0 "ชาวนอร์สผู้กล้าได้หลั่งไหลออกจากสแกนดิเนเวียและผ่านแม่น้ำอันอุดมสมบูรณ์ของชาวสลาฟผู้ดุร้ายทางตะวันออก แม้ว่าถิ่นฐานและอาณาจักรน้อยใหญ่นับไม่ถ้วนจะแย่งชิงอำนาจกัน ทั้งสลาฟและนอร์ส แต่มีเพียง#EMP หนึ่งเดียว#! เท่านั้นที่สามารถเป็นตัวแทนของการรวมสองชนชาติได้อย่างแท้จริง..."
 found_capital_of_the_rus_decision_tooltip:0 "สถาปนาราชธานีของท่านให้เป็นบ้านที่แท้จริงสำหรับชาวรุสทั้งปวง"
 found_capital_of_the_rus_decision_confirm:0 "ราชธานีอันยิ่งใหญ่ชั่วนิรันดร์!"
 found_capital_of_the_rus_decision_before_last_date:0 "วันที่คือ 1100.1.1 หรือก่อนหน้านั้น"

 elevate_mann_and_the_isles_decision:0 "ยกระดับราชอาณาจักรแห่งมานน์และหมู่เกาะ"
 elevate_mann_and_the_isles_decision_desc:0 "$c_isle_of_man$ ตั้งอยู่ในทำเลที่ไม่เหมือนใครเพื่อเป็นที่หลบภัยสำหรับนักปล้นชาวนอร์ส สามารถเข้าถึงไม่เพียง แต่หมู่เกาะบริเตนเท่านั้น แต่ยัง รวมถึงยุโรปตะวันตกทั้งหมดด้วย\n\nสิ่งที่ต้องการคือใครสักคนที่จะนำทางไวกิ้งผู้ดีงามทั้งหลาย เพื่อตระหนักถึงศักยภาพและปูเกาะแห่งนี้ด้วยทองคำและเหล็กกล้า!"
 elevate_mann_and_the_isles_decision_tooltip:0 "กลายเป็นผู้ปกครองโจรสลัดที่อื้อฉาวที่สุดตลอดกาล"
 elevate_mann_and_the_isles_decision_confirm:0 "สู่ความอื้อฉาวและความอมตะ!"

 hold_gruesome_festival_decision_blot_name:0 "จัดพิธีบล็อตอันยิ่งใหญ่"
 hold_gruesome_festival_decision_fallback_name:0 "จัดพิธีสังเวยอันยิ่งใหญ่"
 hold_gruesome_festival_decision_desc.gf_humsac_practitioner:0 "ถึงเวลาแล้วที่ทุกคนใน[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]จะมารวมตัวกันเพื่อทำพิธีสังเวยแด่[ROOT.Char.GetFaith.PantheonTerm] พิธีกรรมเหล่านี้ไม่เพียง แต่ผูกมัดผู้ศรัทธาเข้าด้วยกัน แต่ยังยืนยันตำแหน่งของข้าในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip]แห่งดินแดนทั้งหมด"
 hold_gruesome_festival_decision_desc.non_gf_practioner:0 "มีคนในหมู่ข้าแผ่นดินของข้าที่ประกอบพิธีกรรมสังเวยอันยิ่งใหญ่ ซึ่งได้รับพรจาก[GetPlayer.GetTitleAsNameNoTooltip]ของพวกเขา การตกลงที่จะดำเนินการแม้เพียงรูปแบบที่จำกัดก็จะ ทำให้ข้าได้รับความเห็นชอบจากพวกเขาอย่างไม่ต้องสงสัย แม้ว่าการยอมรับประเพณีที่... ป่าเถื่อนกว่าของพวกเขาอาจ ทำให้ข้าถูกดูหมิ่นจากผู้ที่รังเกียจวิถีทางของพวกเขาก็ตาม"
 hold_gruesome_festival_decision_tt:1 "ท่านจัดมหกรรม [Select_CString( Character.IsLocalPlayer, GetPlayer.Custom('GruesomeFestivalName') , '$gruesomefestivalname_festival|q$' )] อันยิ่งใหญ่, ซึ่งประกอบด้วย:\n#indent_newline:0 $EFFECT_LIST_BULLET$ การตัดสินใจขนาดของมหกรรม\n#indent_newline:0 $EFFECT_LIST_BULLET$ การเลือกสิ่งสังเวย, แม้กระทั่งการเลือกหนึ่งใน [prisoners|E] ของท่านเป็น [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ การได้รับหรือสูญเสีย [county_opinion|E] และ [opinion|E] ของ [character|E] ขึ้นอยู่กับ [core_tenets|E] แห่ง [faith|E] ของเหล่าข้าแผ่นดินของท่าน"
 hold_gruesome_festival_decision_tt.piety_gain:0 "#indent_newline:0 ได้รับ[piety|E] เนื่องจากท่านเป็น[GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tt.piety_lose:0 "#indent_newline:0 #EMP สูญเสีย#! [piety|E] เนื่องจากท่านเป็น[GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tooltip:0 "ท่านเชิญข้าแผ่นดินของท่านให้เข้าร่วมในพิธีกรรมอันศักดิ์สิทธิ์และมีค่าใช้จ่ายสูง"
 hold_gruesome_festival_decision_confirm:0 "ในความตาย การเกิดใหม่"

 raise_stele_decision_name:0 "สร้างศิลาจารึกอักษรรูน"
 raise_stele_decision_desc:0 "เป็นธรรมเนียมในหมู่ชาว[GetPlayer.GetCulture.GetNameNoTooltip]ที่จะสร้างอนุสาวรีย์แกะสลักเพื่อรำลึกถึงเหตุการณ์สำคัญ การตายของบุคคลอันเป็นที่รัก การยุติข้อพิพาท การได้มา ซึ่งที่ดิน และอื่นๆ บางทีข้าอาจได้รับประโยชน์จากศิลา เช่นนี้..."
 raise_stele_decision_tt.effects_list:0 "[counties|E]แห่งหนึ่งของท่านจะได้รับ[modifiers|E]อย่างใดอย่างหนึ่งต่อไปนี้:\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_ancestors_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_conquest_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_promotion_strong').GetNameWithTooltip]"
 raise_stele_decision_tt.variable_strength:0 "ปัจจัยปรับเปลี่ยนทั้งหมดจะแข็งแกร่งขึ้นเมื่อสร้างขึ้นใน[cultures|E]ที่ใช้อักษรรูน"
 raise_stele_decision_tooltip:0 "จ่ายค่าแกะสลักศิลาจารึกอักษรรูนในเคาน์ตีแห่งหนึ่งของท่าน"
 raise_stele_decision_confirm:0 "แต่จะสลักสิ่งใดเล่า?"
 fp1_raise_runestone_vassals:0 "$EFFECT_LIST_BULLET$[direct_vassals|E]ทั้งหมดที่ใช้อักษรรูนด้วย"

 raise_stele_decision_ancestor:0 "ท่านมีบรรพบุรุษที่เพิ่งเสียชีวิต"
 raise_stele_decision_victory:0 "ท่านเพิ่งพิชิตดินแดนมา"
 raise_stele_decision_rank:0 "ท่านเพิ่งได้รับยศ"

 forge_the_jomsvikings_decision:0 "ก่อตั้งยมส์ไวกิง"
 forge_the_jomsvikings_decision_desc:0 "วิถีเก่ากำลังจะตายลง ทุกวัน ผู้นับถือศาสนาอับราฮัมล่อลวงคนเล็กคนน้อยของเราด้วยคำสัญญาถึงชีวิตนิรันดร์สำหรับทุกคน นักผจญภัยและผู้ตั้งถิ่นฐานของเรายอมรับเทพเจ้าต่างถิ่นไม่ว่าพวกเขาจะไปที่ใด และแม้ แต่นักปฏิรูปในสแกนดิเนเวียก็ต้องการ ทำให้เราเหมือนกับผู้คนแห่งกางเขนและจันทร์เสี้ยวมากขึ้น\n\nไม่เอาอีกแล้ว [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip]ผู้ภักดีทั้งหลายต้องรวมตัวกัน เพื่อป้องกันการเปลี่ยนแปลงและการดูหมิ่นศาสนา!"
 forge_the_jomsvikings_decision.tt.is_in_correct_region:0 "อยู่ใน[region|E] [GetGeographicalRegion('dlc_fp1_region_non_scandinavian_southern_baltic').GetName]"
 forge_the_jomsvikings_decision.tt.empty_castle_or_city:1 "ต้องมีที่ดิน[castle|E]หรือ[city|E]ว่างอย่างน้อยหนึ่งแห่ง นอกเหนือจาก[county_capital|E]"
 forge_the_jomsvikings_decision_tooltip:0 "ก่อตั้งกลุ่มไวกิงผู้เคร่งศาสนาเพื่อปกป้องวิถีเก่า"
 forge_the_jomsvikings_decision_confirm:0 "วัลฮัลลาสำหรับผู้คู่ควรเท่านั้น!"
 fp1_valid_norse_faith_for_jomsvikings_trigger_tt:0 "[THIS.Char.GetFaith.GetName]เป็นส่วนหนึ่งของ[religion|E][GetReligionByKey('germanic_religion').GetAdjective]และยังไม่ปฏิรูป"
