l_english: 
 action_can_challenge_to_single_combat:0 "สามารถท้าประลองอาชญากรได้"
 action_can_challenge_to_single_combat_label:0 "ท่านสามารถท้า [recipient.GetShortUINameNoTooltip] สู่ $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
 action_can_challenge_to_single_combat_desc:1 "[recipient.GetUIName] ได้ก่อ [crimes|E] ต่อท่าน ([recipient.GetImprisonmentReasons( actor.Self )]) แต่ไม่สามารถถูก [imprisoned|E] ได้ ทำให้ท่านสามารถท้า [recipient.GetHerHim] สู่ [trial_by_combat|E] ได้$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_click:0 "#I คลิกเพื่อท้าประลอง [recipient.GetHerHim]#!"
 action_can_challenge_to_single_combat_combined_group_label:0 "สามารถท้าอาชญากรสู่ $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_combined_group_name:0 "สามารถท้าอาชญากรสู่ $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_combined_group_description:1 "[characters|E] อื่นๆ ได้ก่อ [crimes|E] ต่อท่าน ([recipient.GetImprisonmentReasons( actor.Self )]) แต่ไม่สามารถถูก [imprisoned|E] ได้ ทำให้ท่านสามารถท้าพวกเขาสู่ [trials_by_combat|E] ได้$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_combined_unimportant:0 "@warning_icon! #X ไม่มีอาชญากรคนใดมีความสำคัญต่อท่าน#!"
 action_can_challenge_to_single_combat_unimportant:0 "@warning_icon! #X [recipient.GetSheHe|U] ไม่มีความสำคัญต่อท่าน#!"
 action_can_challenge_to_single_combat_HELP:0 "\n\n#help ในฐานะ [ruler|E] ท่านไม่จำเป็นต้องท้าทาย [criminal|E] ทุกคน และอาจเป็นประโยชน์ที่จะรอจนกว่าจะมีโอกาส [imprison|E] พวกเขาแทน จงระวังการท้าทาย $game_concept_characters$ ที่มี [prowess|E] สูง เนื่องจาก [trials_by_combat|E] ทั้งหมดจะต่อสู้กันแบบ [single_combat_fight_plural|E]#!"
 
 action_can_make_shieldmaiden:0 "สามารถ แต่งตั้งนักรบโล่ได้"
 action_can_make_shieldmaiden_label:0 "ท่านสามารถ แต่งตั้ง [recipient.GetShortUINameNoTooltip] เป็น [recipient.Custom('ShieldPersonFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
 action_can_make_shieldmaiden_desc:0 "[recipient.GetUIName] มี [skill|E] [prowess|E] สูง และจะยอมรับการเป็น [recipient.Custom('ShieldPersonFemaleMale')|U]$action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_click:0 "#I คลิกเพื่อแต่งตั้งเป็น [recipient.Custom('ShieldPersonFemaleMale')|U]#!"
 action_can_make_shieldmaiden_combined_group_label:0 "สามารถ แต่งตั้ง [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_name:0 "สามารถ แต่งตั้ง [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_description:0 "สมาชิก [close_family|E] หลายคนมี [skill|E] [prowess|E] สูง และจะยอมรับการเป็น [recipient.Custom('ShieldPersonsFemaleMale')|U]$action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_HELP:1 "\n\n#help การมี [recipient.Custom('ShieldPersonFemaleMale')|U] อย่างน้อยหนึ่งคนมีประโยชน์อย่างยิ่ง พวกเขาจะพัฒนาทักษะอย่างต่อเนื่อง และอาจช่วยท่านให้รอดพ้นจาก [scheme|E] [GetScheme('murder').GetTypeName] ได้\n\nอย่างไรก็ตาม ท่านไม่ควรแต่งตั้งสมาชิก [close_family|E] ทุกคนเป็น [recipient.Custom('ShieldPersonFemaleMale')|U] เว้นแต่ท่านจะมี [prestige|E] มากเกินกว่าจะรู้ว่าต้องทำอะไรกับมัน#!"
