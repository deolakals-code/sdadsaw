 SteleCommemoratesPromotion_AweInspiring:0 "$SteleCommemoratesPromotion_Intro$. พิธีนี้สร้างความน่าเกรงขามให้กับทุกคน $SteleCommemoratesCarver$."
 SteleCommemoratesPromotion_Majestic:1 "$SteleCommemoratesPromotion_Intro$. มีผู้ปกครองเพียงไม่กี่คนที่เทียบได้กับความสง่างามของ [second.MakeScope.Var('stele_commissioner').Char.GetHerHis] $SteleCommemoratesCarver$."
