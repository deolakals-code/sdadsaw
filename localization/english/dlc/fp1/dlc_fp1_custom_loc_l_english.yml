 SteleCommemoratesConquest_Intro:1 "สร้างขึ้นเพื่อ [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] เพื่อเป็นเครื่องหมายแห่งชัยชนะของ [second.MakeScope.Var('stele_commissioner').Char.GetHerHis] เหนือ [second.MakeScope.Var('stele_container').Char.GetTitledFirstNameNicknamed]"
 SteleCommemoratesConquest_Bloody:0 "$SteleCommemoratesConquest_Intro$. สงครามครั้งนี้เป็นหนึ่งในสงครามที่นองเลือดที่สุดในประวัติศาสตร์ $SteleCommemoratesCarver$."
 SteleCommemoratesConquest_Glorious:0 "$SteleCommemoratesConquest_Intro$. การพิชิตครั้งนี้เป็นชัยชนะอันรุ่งโรจน์ $SteleCommemoratesCarver$."
