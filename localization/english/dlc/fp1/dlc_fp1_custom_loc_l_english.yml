 SteleCommemoratesPromotion_Intro:1 "สร้างขึ้นเพื่อ [second.MakeScope.Var('stele_commissioner').Char.GetTitledFirstNameNicknamed] เพื่อเป็นเครื่องหมายแห่งการสืบทอดบัลลังก์แห่ง [second.MakeScope.Var('stele_container').Title.GetNameNoTier] ของ [second.MakeScope.Var('stele_commissioner').Char.GetHerHis]"
