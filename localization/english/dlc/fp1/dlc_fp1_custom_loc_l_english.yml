 SteleCommemoratesCarver:1 "[second.MakeScope.Var('stele_carver').Char.GetFirstNameNoTooltip] สลักไว้"

 SteleCommemoratesAncestors_Intro:1 "สร้างขึ้นเพื่อ [second.MakeScope.Var('stele_container').Char.GetTitledFirstNameNicknamed] โดย [second.MakeScope.Var('stele_container').Char.Custom2('RelationToMeShort',second.MakeScope.Var('stele_commissioner').Char)] ของ [second.MakeScope.Var('stele_container').Char.GetHerHis]"
 SteleCommemoratesAncestors_GenericFallback:0 "$SteleCommemoratesAncestors_Intro$. ดวงวิญญาณอันงดงาม ผู้เป็นที่ระลึกถึงอย่างสุดซึ้ง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_ChildFallback:0 "$SteleCommemoratesAncestors_Intro$. จากเราไปเร็วเกินควร $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Diplomat:1 "$SteleCommemoratesAncestors_Intro$. ขอให้ลิ้นเงินลิ้นทองของ [second.MakeScope.Var('stele_container').Char.GetHerHis] คงอยู่ชั่วนิรันดร์ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_FamilyFirst:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีสิ่งใดมีค่าต่อ [second.MakeScope.Var('stele_container').Char.GetHerHim] ยิ่งกว่าครอบครัว $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_August:1 "$SteleCommemoratesAncestors_Intro$. โลกนี้ต่ำต้อยลงเมื่อปราศจากบุคคลอันสูงส่งของ [second.MakeScope.Var('stele_container').Char.GetHerHis] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Reveler:1 "$SteleCommemoratesAncestors_Intro$. ขอให้ [second.MakeScope.Var('stele_container').Char.GetSheHe] เฉลิมฉลองตลอดไปใน [second.MakeScope.Var('stele_container').Char.GetFaith.PositiveAfterLife] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Blademaster:1 "$SteleCommemoratesAncestors_Intro$. แท้จริงแล้ว ไม่มีผู้ใดหยุดยั้งคมดาบของ [second.MakeScope.Var('stele_container').Char.GetHerHis] ได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Hunter:0 "$SteleCommemoratesAncestors_Intro$. ไม่เคยมีผู้ใดยิงแม่นเท่าในแผ่นดิน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Strategist:1 "$SteleCommemoratesAncestors_Intro$. สมองของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] เคลื่อนไหวเร็วกว่าที่ศัตรูใดจะคาดเดาได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Overseer:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีสิ่งใดรอดพ้นสายตาอันเฉียบคมของ [second.MakeScope.Var('stele_container').Char.GetHerHis] ไปได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Gallant:0 "$SteleCommemoratesAncestors_Intro$. ไม่เคยมีดวงวิญญาณใดสูงส่งเท่านี้มาก่อน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Architect:1 "$SteleCommemoratesAncestors_Intro$. อาคารและอนุสาวรีย์ของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] จะคงอยู่ยืนยงกว่าพวกเราทุกคน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Administrator:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีสิ่งใดหายใจในอาณาเขตของ [second.MakeScope.Var('stele_container').Char.GetHerHis] โดยที่ [second.MakeScope.Var('stele_container').Char.GetHerHim] ไม่รู้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Avaricious:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีสิ่งใดจูงใจ [second.MakeScope.Var('stele_container').Char.GetHerHim] ได้มากเท่ากับเสียงกระทบกันของเหรียญเงิน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Schemer:1 "$SteleCommemoratesAncestors_Intro$. ความคดเคี้ยวในจิตใจของ [second.MakeScope.Var('stele_container').Char.GetHerHis] ทำให้แม้ แต่สายลับที่เก่งที่สุดก็ยังสับสน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Seducer:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] หักอกคนมานับไม่ถ้วน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Torturer:1 "$SteleCommemoratesAncestors_Intro$. โลกยินดีที่ได้พ้นจากการปฏิบัติอันน่าสะพรึงกลัวของ [second.MakeScope.Var('stele_container').Char.GetHerHis] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Scholar:1 "$SteleCommemoratesAncestors_Intro$. ถ้อยคำและปัญญาของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] จะคงอยู่ชั่วนิรันดร์ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Theologian:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เป็นที่รักของ [second.MakeScope.Var('stele_container').Char.GetFaith.HighGodName] ยิ่งกว่ามนุษย์คนใดที่ยังมีชีวิตอยู่ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Mystic:1 "$SteleCommemoratesAncestors_Intro$. ขอให้ [second.MakeScope.Var('stele_container').Char.GetSheHe] พบความสงบสุขหลังม่านที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] ข้ามผ่านบ่อยครั้ง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Physician:1 "$SteleCommemoratesAncestors_Intro$. การรักษาอันชาญฉลาดของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] ช่วยชีวิตผู้คนนับไม่ถ้วน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Herbalist:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] นำความลับของแหล่งเห็ดโปรดของ [second.MakeScope.Var('stele_container').Char.GetHerHis] ไปสู่หลุมศพ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Lustful:1 "$SteleCommemoratesAncestors_Intro$. ความใคร่ของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] ได้รับการดับสนองในที่สุด $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Chaste:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ไม่จำเป็นต้องกังวลเกี่ยวกับการล่อลวงทางเนื้อหนังอีกต่อไป $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Gluttonous:1 "$SteleCommemoratesAncestors_Intro$. ตลอด [second.MakeScope.Var('stele_container').Char.GetAge] ปี [second.MakeScope.Var('stele_container').Char.GetSheHe] ไม่เคยข้ามมื้ออาหารเลยสักครั้ง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Temperate:1 "$SteleCommemoratesAncestors_Intro$. ความพอประมาณนำทาง [second.MakeScope.Var('stele_container').Char.GetHerHim] ในทุกสิ่ง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Greedy:1 "$SteleCommemoratesAncestors_Intro$. ขอให้ [second.MakeScope.Var('stele_container').Char.GetSheHe] พบความมั่งคั่งในความตายที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] ปรารถนาในชีวิต $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Generous:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เป็นที่จดจำในด้านความเอื้อเฟื้อเผื่อแผ่ [second.MakeScope.Var('stele_container').Char.GetHerHis] ด้วยเหรียญ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Lazy:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] บางครั้งไม่ทำอะไรเลยเป็นเวลาหลายปีติดต่อกัน $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Diligent:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] พูดเสมอว่า [second.MakeScope.Var('stele_container').Char.GetSheHe] สามารถพักผ่อนได้เมื่อ [second.MakeScope.Var('stele_container').Char.GetSheHe] ตาย $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Wrathful:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีใครชกต่อยโดยไม่คาดคิดได้ดีเท่า [second.MakeScope.Var('stele_container').Char.GetHerHim] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Calm:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เป็นมหาสมุทรแห่งความสงบ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Patient:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ไม่มีเวลาเหลือให้รอคอยอีกต่อไป $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Impatient:1 "$SteleCommemoratesAncestors_Intro$. ความเร่งรีบที่จะไปไหนมาไหนของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] ได้หยุดลงในที่สุด $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Arrogant:1 "$SteleCommemoratesAncestors_Intro$. ไม่เคยมีใครกล่าวหา [second.MakeScope.Var('stele_container').Char.GetHerHim] อย่างผิดๆ ว่าขาดความภาคภูมิใจในตนเอง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Humble:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] อ่อนน้อมถ่อมตนเหมือนหนู $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Deceitful:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] จะไม่มีวันโกหกอีก $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Honest:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ไม่เคยพูดเท็จเลยตั้งแต่เกิดจนตาย $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Craven:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] หนีจากหลายสิ่งหลายอย่าง แต่ไม่มี [second.MakeScope.Var('stele_container').Char.GetWomanMan] ใดหนีความตายพ้น $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Brave:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ยืนหยัดต่อสู้กับศัตรูทั้งปวงด้วยความกล้าหาญ แม้กระทั่งความตาย $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Shy:1 "$SteleCommemoratesAncestors_Intro$. แม้จะมีน้อยคนที่ได้เห็นตัวตนที่แท้จริง แต่ก็จะไม่มีใครได้เห็น เช่น [second.MakeScope.Var('stele_container').Char.GetHerHis] อีก $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Gregarious:1 "$SteleCommemoratesAncestors_Intro$. มิตรสหายมากมายของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] จะคิดถึง [second.MakeScope.Var('stele_container').Char.GetHerHim] ตลอดไป $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Ambitious:1 "$SteleCommemoratesAncestors_Intro$. ความทะเยอทะยานของ [second.MakeScope.Var('stele_container').Char.GetHerHis|U] ไม่มีขอบเขต เว้น แต่สิ่งเดียว $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Content:1 "$SteleCommemoratesAncestors_Intro$. ไม่ว่า [second.MakeScope.Var('stele_container').Char.GetSheHe] จะเป็นอะไรก็ตาม [second.MakeScope.Var('stele_container').Char.GetSheHe] ก็ตายอย่างพอใจ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Arbitrary:1 "$SteleCommemoratesAncestors_Intro$. ขอให้กฎของ [second.MakeScope.Var('stele_container').Char.GetFaith.DeathDeityName] ปฏิบัติต่อ [second.MakeScope.Var('stele_container').Char.GetHerHim] ดีกว่าที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] ปฏิบัติต่อกฎของผู้มีชีวิต $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Just:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ปฏิบัติตามกฎหมายอย่างเคร่งครัด $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Cynical:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ไม่เคยเชื่อใน [second.MakeScope.Var('stele_container').Char.GetFaith.PositiveAfterLife] และแน่นอนว่าพำนักอยู่ใน [second.MakeScope.Var('stele_container').Char.GetFaith.NegativeAfterLife] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Zealous:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เป็น [second.MakeScope.Var('stele_container').Char.GetWomanMan] ที่มีศรัทธาอันแรงกล้าท่วมท้น $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Paranoid:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เห็นศัตรูอยู่ทุกหนแห่ง แต่ไม่อาจหลีกเลี่ยงสิ่งที่หลีกเลี่ยงไม่ได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Trusting:1 "$SteleCommemoratesAncestors_Intro$. ไม่เคยสงสัย [second.MakeScope.Var('stele_container').Char.GetSheHe] คิดถึง แต่สิ่งที่ดีที่สุดของทุกคนเสมอ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Compassionate:1 "$SteleCommemoratesAncestors_Intro$. ขอให้ประวัติศาสตร์เมตตาต่อ [second.MakeScope.Var('stele_container').Char.GetHerHim] เหมือนที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] เมตตาต่อผู้อื่น $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Callous:1 "$SteleCommemoratesAncestors_Intro$. ในชีวิต [second.MakeScope.Var('stele_container').Char.GetSheHe] ไม่เคยใส่ใจความรู้สึกของผู้อื่น และในความตาย ไม่มีใครใส่ใจ [second.MakeScope.Var('stele_container').Char.GetHerHis] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Sadistic:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] ล่าเหยื่อเพื่อนมนุษย์ [second.MakeScope.Var('stele_container').Char.GetHerHis] ด้วยความยินดีอย่างโหดเหี้ยม $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Stubborn:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetWomanMan] ผู้มีความมุ่งมั่น [second.MakeScope.Var('stele_container').Char.GetSheHe] ปฏิเสธที่จะเปลี่ยนใจ [second.MakeScope.Var('stele_container').Char.GetHerHis] เพื่อใคร $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Fickle:1 "$SteleCommemoratesAncestors_Intro$. ทุกคนรู้ว่าความคิดเห็นของ [second.MakeScope.Var('stele_container').Char.GetHerHis] พัดไปตามลม $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Vengeful:1 "$SteleCommemoratesAncestors_Intro$. ไม่มีใครเก็บความแค้นได้เหมือน [second.MakeScope.Var('stele_container').Char.GetHerHim] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Forgiving:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetWomanMan] ผู้มีความรักอันไม่มีที่สิ้นสุด ไม่มี ความแค้นใดที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] ไม่สามารถให้อภัยได้ใน [second.MakeScope.Var('stele_container').Char.GetHerselfHimself] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Drunkard:1 "$SteleCommemoratesAncestors_Intro$. ไม่ว่าจะดีหรือร้าย มีน้อยคนนักที่จะดื่มจน [second.MakeScope.Var('stele_container').Char.GetHerHim] เมาหัวราน้ำได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Hashishiyah:1 "$SteleCommemoratesAncestors_Intro$. ด้วยจิตใจที่ผ่อนคลาย มีเพียงเล็กน้อยที่รบกวน [second.MakeScope.Var('stele_container').Char.GetHerHim] ในขณะที่ [second.MakeScope.Var('stele_container').Char.GetSheHe] สามารถเข้าถึงคลังเค้กของ [second.MakeScope.Var('stele_container').Char.GetHerHis] ได้ $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Rakish:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetSheHe|U] เป็นลูกค้ารายโปรดของสถานประกอบการอันทรงเกียรติหลายแห่ง $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Reclusive:1 "$SteleCommemoratesAncestors_Intro$. บางคนอ้างว่า [second.MakeScope.Var('stele_container').Char.GetSheHe] ไม่มีอยู่จริง แต่มีเพียงไม่กี่คนที่ยืนยันว่าเคยเห็น [second.MakeScope.Var('stele_container').Char.GetHerHim] $SteleCommemoratesCarver$."
 SteleCommemoratesAncestors_Irritable:1 "$SteleCommemoratesAncestors_Intro$. [second.MakeScope.Var('stele_container').Char.GetWomanMan] ผู้มีอารมณ์ฉุนเฉียว [second.MakeScope.Var('stele_container').Char.GetSheHe] ถูกอธิบายอย่างดีว่าเป็นเทียนที่เผาไหม้ทั้งสองด้าน $SteleCommemoratesCarver$."
