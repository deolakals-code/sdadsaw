l_english: 
 fp1_yearly.2000.t:0 "ความกระหายการเดินทาง"
 fp1_yearly.2000.desc:0 ""ลูกจะไปแล้ว [parent.GetMotherFather] ลูกกับ [lover_of_child.GetFirstNameNoTooltip] #EMP รักกัน#!!"\n\nข้ากลอก [ROOT.Char.Custom('EyeEyes')] ใส่ [child_to_leave.GetFirstNameNoTooltip] [child_to_leave.Custom('GetDaughterSon')] โง่เขลาของข้ากำลังทำอะไร #EMP อีกแล้ว?#!\n\n"[lover_of_child.GetFirstNameNoTooltip] กับลูกจะออกไปผจญภัย! โลกกว้างใหญ่ และมีเกียรติยศรออยู่! ลูกอยากจะตะโกน #EMP '[child_to_leave.GetHouse.GetMotto]'#! ให้โลกรู้ จนกว่ามันจะจดจำชื่อของลูก!"\n\nเห็นได้ชัดว่า [child_to_leave.Custom('GetDaughterSon')] #EMP สุดที่รัก#! ของข้ากำลังจริงจัง ข้าจะต้องทำอะไรสักอย่าง"
 fp1_yearly.2000.a:0 ""มานี่สิ [child_to_leave.Custom('GetDaughterSon')] ที่รัก พ่อ/แม่เชื่อว่าถึงเวลาสำหรับ #EMP รักต้องสู้#! บ้างแล้ว""
 fp1_yearly.2000.b:0 ""ฟังนะ มี #EMP เกียรติยศ#! ให้แสวงหาที่บ้าน""
 fp1_yearly.2000.c:0 ""บางที #EMP สิ่งนี้#! อาจ ทำให้เจ้าลืมเรื่องการจากไป?""
 fp1_yearly.2000.d:0 ""เจ้าจะกลับมา อีกไม่นานเจ้าจะเห็น...""
 fp1_yearly.2000.d.tt:0 "#weak "...เจ้าจะจำได้ว่าเจ้าเป็นของข้า"#!"
 fp1_yearly.2000.a.tt:0 "#V ประลอง#! กับ [child_to_leave.GetFirstName] เพื่อให้ [child_to_leave.GetHerHim] อยู่ต่อ!\n#weak การประลองนี้ #EMP ไม่#! ถึงตาย#!\nหากท่านชนะ ท่านจะได้รับ [prestige_i] [prestige|E]\n\n[prowess|E] ของท่าน: [prowess_i]#V [parent.GetProwess]#!\n[prowess|E] ของ [child_to_leave.GetFirstNamePossessive]: [prowess_i]#V [child_to_leave.GetProwess]#!"
 fp1_yearly.2000.c.tt:0 "[child_to_leave.GetFirstName] อยู่ที่ [court|E] ของท่าน"
 fp1_yearly.2000.b.tt:0 "อยู่ที่ [court|E] ของท่าน"
 lust_for_adventure:0 "ความกระหายการผจญภัย"
 lust_for_adventure_desc:0 "ตัวละครนี้กระหายการผจญภัยและการเดินทาง พวกเขาไม่น่าจะกลับไปยังราชสำนักของบิดามารดา"
 mellowed_spirit:0 "จิตวิญญาณที่อ่อนโยนลง"
 mellowed_spirit_desc:0 "ตัวละครนี้ถูกบิดามารดาเกลี้ยกล่อมว่าการผจญภัยไม่ใช่สำหรับพวกเขา และที่ของพวกเขาคือที่บ้าน"
 fp1_yearly.2003.t:0 "ความกระหายการเดินทาง: รักต้องสู้"
 fp1_yearly.2003.desc:0 ""ข้ายอมแล้ว! ข้ายอมแล้ว [parent.GetMotherFather]! พอแล้ว!" [child_to_leave.Custom('GetDaughterSon')] ของข้าร้องอุทาน\n\n"ลูกจะอยู่ที่นี่ในราชสำนัก [lover_of_child.GetFirstNameNoTooltip] ไม่สำคัญไปกว่าชีวิตของลูก!" [child_to_leave.GetFirstNameNoTooltip] กล่าว โดย [lover_of_child.GetFirstNameNoTooltip] มองอย่างไม่เห็นด้วย\n\nในที่สุด ดูเหมือนว่า [child_to_leave.GetFirstNameNoTooltip] จะเริ่มมีเหตุผล!"
 fp1_yearly.2003.a:0 ""[parent.GetMotherFather|U] รู้ดีที่สุด [child_to_leave.Custom('GirlBoy')] ที่รัก""
 fp1_yearly.2003.b:0 ""และเลิกกับไอ้ '[lover_of_child.GetFirstNameNoTooltip]' นั่นซะด้วย!""
 fp1_yearly.2000.trigger_failure:0 "การประลองของข้ากับ [child_to_leave.GetFirstNameNoTooltip] ได้สิ้นผลไปแล้ว"
 fp1_yearly.2004.t:0 "ความกระหายการเดินทาง: พ่ายแพ้ยับเยิน"
 fp1_yearly.2004.desc:0 "ข้าถูกล้มลง อ่อนแรงจากการต่อสู้ ขณะที่ [child_to_leave.GetFirstNameNoTooltip] เข้ามาหาข้าพร้อมอาวุธในมือ\n\n"ลูกบอกท่านแล้ว ลูกจะ #EMP ไป#! [parent.GetMotherFather] สำหรับความลำบากของลูก ลูกจะเอาถุงเงินจากคลังสมบัติไปด้วย ลูกแน่ใจว่าท่านเข้าใจ"\n\nข้าทำอะไรไม่ได้นอกจากมองดู [child_to_leave.Custom('GetDaughterSon')] ของข้าจากไป โดยมี [lover_of_child.GetFirstNameNoTooltip] ควงแขนข้างหนึ่ง และ #EMP ทองคำของข้า#! อยู่ในมืออีกข้าง"
 fp1_yearly.2004.a:0 "ลูกอกตัญญู..."
 fp1_yearly.2000.b.success:0 "[child_to_leave.GetFirstNameNoTooltip] ล้มเลิกความหวังและความฝันของ [child_to_leave.GetHerHis]"
 fp1_yearly.2000.b.failure:0 "[child_to_leave.GetFirstNameNoTooltip] ไม่เชื่อในเหตุผลของท่าน"

 fp1_yearly.2100.t:0 "การแข่งขันอันดุเดือด"
 fp1_yearly.2100.desc:0 ""เจ้า [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]! เจ้า [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultNoun', SCOPE.sC('lover_1'))]! [lover_2.Custom2('InsultSentence', SCOPE.sC('lover_1'))|U], เจ้า [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]!" [lover_1.GetFirstName] กรีดร้องสุดเสียงของ[lover_1.GetHerHis]\n\nดูเหมือนเหล่าชู้รักของท่านกำลังทะเลาะกันอย่างรุนแรง\n\n"[lover_1.Custom2('PointOfRidicule', SCOPE.sC('lover_2'))] ของเจ้า ทำให้ [lover_quarrel_target.GetHerHim] ต้องขยะแขยง, เจ้า [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))] [lover_quarrel_target.GetFirstNameNoTooltip] ไม่มีทางรัก [lover_1.Custom2('InsultAdjective', SCOPE.sC('lover_2'))] [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))] อย่างเจ้าได้หรอก! #EMP [lover_quarrel_target.GetSheHe|U] จะต้องเป็นของข้าแต่เพียงผู้เดียว!#!" [lover_2.GetFirstName] ตะโกน, พลางชัก [lover_2.Custom('SignatureWeaponArticle')] [lover_2.Custom('signature_weapon')] จากเข็มขัดของ [lover_2.GetHerHis]...\n\nงานนี้มีนองเลือดแน่"
 fp1_yearly.2100.a:0 "นองเลือด #EMP น่าตื่นเต้น!#! ใช่แล้ว! สู้เพื่อความรักของข้า!"
 fp1_yearly.2100.b:0 "นี่มัน #EMP บ้าไปแล้ว!#! ข้าขอร้องเจ้า โปรดหยุดเรื่องนี้ทันที!"
 fp1_yearly.2100.c:0 "ข้าจะหยุดพวกเจ้าเอง!"
 fp1_yearly.2100.a.tt:0 "[lover_1.GetFirstName] และ [lover_2.GetFirstName] #V ประลอง#! กันจนตาย"
 fp1_yearly.2100.b.tt:0 "[lover_1.GetFirstName] และ [lover_2.GetFirstName] ใจเย็นลง"
 fp1_yearly.2101.t:0 "การแข่งขันอันดุเดือด: หัวใจสลาย"
 fp1_yearly.2101.desc:0 ""ตอนนี้เจ้าเป็นของข้า แต่เพียงผู้เดียว, [lover_quarrel_target.GetFirstNameNoTooltip] [lover_quarrel_target.Custom('RomanticComplimentAdjective')] ของข้า! เจ้า [lover_2.Custom2('InsultNounSexual', SCOPE.sC('winning_lover'))] [losing_lover.GetFirstName] นั่นจะไม่ได้มาขวางทางเราระหว่างเราอีกต่อไป!" [winning_lover.GetFirstName] กระซิบด้วยเสียงหวาน ขณะที่ [winning_lover.GetSheHe] วาง [winning_lover.GetHerHis] [winning_lover.Custom('signature_weapon')] ลงบนพื้น\n\n"มาเถิด, [lover_quarrel_target.Custom('RomanticComplimentNoun')] [lover_quarrel_target.Custom('RomanticComplimentAdjective')] ของข้า เรื่องบ้า ๆ นี่มันน่าเหนื่อยหน่าย, เหตุใดเราไม่ปลีกตัวไปที่ [ROOT.Char.Custom('GetChamber')] ของท่านเล่า?" [winning_lover.GetFirstNameNoTooltip] แนะนำอย่างยั่วยวน"
 fp1_yearly.2101.a:0 "โอ้ [winning_lover.Custom('RomanticComplimentNoun')] ของข้า! เจ้ารู้วิธีเกี้ยว [lover_quarrel_target.GetWomanMan] จริงๆ!"
 fp1_yearly.2101.b:0 "[losing_lover.GetFirstNameNoTooltip] ไม่นะ! #EMP เจ้าจะต้องชดใช้สำหรับเรื่องนี้ [winning_lover.GetFirstNameNoTooltip]!#!"
 fp1_yearly.2101.c:0 "เกลือกกลิ้งบนกองฟางรึ? ทำไมจะไม่ล่ะ"
 fp1_yearly.2101.d:0 "แค่... ทิ้งข้าไว้ตอนนี้"
 fp1_yearly.2100.b.success:0 "คำพูดที่เปี่ยมด้วยความรักของท่าน ทำให้ทั้งคู่สงบลง"
 fp1_yearly.2100.b.failure:0 "คำพูดของท่านไร้ผล"
 fp1_yearly.2100.c.success:0 "ท่านแยกผู้ทะเลาะวิวาทออกจากกัน"
 fp1_yearly.2100.c.failure:0 "ท่านไปไม่ทันเวลา"
 fp1_yearly.2100.c.tt:0 "ท่านหยุด [lover_1.GetFirstName] และ [lover_2.GetFirstName] จากการต่อสู้"
 
 fp1_yearly.2200.t:0 "เบอร์เซิร์กเกอร์ผู้เบื่อหน่าย"
 fp1_yearly.2200.desc:0 ""จงดูเถิด! ข้าคือ [new_berserker.GetFirstNameNoTooltip] ผู้ [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))|U] — นำถังเบียร์เอล [new_berserker.Custom('AttractionWomanManMultiple')] และ [new_berserker.Custom('FavoriteTreatDemand')] มาให้ข้า! มิฉะนั้นเจ้ากล้าท้าทายความโกรธเกรี้ยวของข้ารึ!?" [new_berserker.GetWomanMan] กรีดร้องใส่ฝูงชนที่รวมตัวกัน\n\nเห็นได้ชัดว่านักรบร่างใหญ่นี้เบื่อหน่าย และกำลังมองหาเรื่องเดือดร้อน บางทีความโกรธเกรี้ยวของ [new_berserker.GetHerHis] อาจนำไปใช้ประโยชน์ในกองทัพของข้าได้ดีกว่า?\n\n"ไม่มีใครกล้าเผชิญหน้ากับข้ารึ? ขี้ขลาด! ข้าอยากจะสู้ให้ตายกันไปข้าง..."
 fp1_yearly.2200.a:0 "ไม่มีใครเรียกข้าว่าคนขลาด, เจ้า [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))] [new_berserker.Custom2('InsultNoun', ROOT.Char)]!"
 fp1_yearly.2200.b:0 "ข้าจะนำ [new_berserker.Custom('FavoriteTreatDemand')] มาให้เจ้ามากมาย — หากเจ้าเข้าร่วมกองทัพข้า"
 fp1_yearly.2200.c:0 "เรากำลังจะออกปล้นเร็วๆ นี้ ทำไมเจ้าไม่เข้าร่วมในฐานะ [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] ของข้าล่ะ?"
 fp1_yearly.2200.d:0 "ยาม! หยุด [new_berserker.GetWomanMan] นั่น!"
 fp1_yearly.2200.a.tt:0 "#V ประลอง#! กับ [new_berserker.GetFirstName] เพื่อให้ [new_berserker.GetHerHim] รับใช้เป็น [potential_employer.Custom('KnightCultureNoTooltipLowercase')] ของท่าน!\n#weak การประลองนี้ #EMP ไม่#! ถึงตาย#!\nแม้ว่าท่านจะแพ้ บางทีความโกรธเกรี้ยวของ [new_berserker.GetFirstNamePossessiveNoTooltip] อาจจะสงบลง...\n\n[prowess|E] ของท่าน: [prowess_i]#V [potential_employer.GetProwess]#!\n[prowess|E] ของ [new_berserker.GetFirstNamePossessive]: [prowess_i]#V [new_berserker.GetProwess]#!"
 fp1_yearly.2200.c.success:0 "[new_berserker.GetFirstNameNoTooltip] ตกลงเข้าร่วมกองทัพของท่าน"
 fp1_yearly.2200.c.failure:0 "[new_berserker.GetFirstNameNoTooltip] อาละวาดไปทั่วราชสำนักของท่าน"
 fp1_yearly.2200.fail.tt:0 "[new_berserker.GetFirstNameNoTooltip] ทำร้าย [potential_victim.GetFirstName] ด้วยความโกรธเกรี้ยวของ [new_berserker.GetHerHis]!"
 hurt_someone_close_to_me_crime:0 "ทำร้ายคนใกล้ชิดของข้า"
 fp1_yearly.2200.d.success:0 "[new_berserker.GetFirstNameNoTooltip] ถูกสังหาร"
 fp1_yearly.2200.trigger_failure:0 "การประลองของข้ากับ [new_berserker.GetFirstNameNoTooltip] ได้สิ้นผลไปแล้ว"
 fp1_yearly.2203.t:0 "เบอร์เซิร์กเกอร์ผู้เบื่อหน่าย: ความโกรธที่สงบลง"
 fp1_yearly.2203.desc:0 ""เจ้าแข็งแกร่งกว่าที่เห็น!" [new_berserker.GetFirstNameNoTooltip] พูดตะกุกตะกัก\n\n[new_berserker.GetWomanMan] นอนจมกองเลือดอยู่บนพื้น ความโกรธเกรี้ยวของ [new_berserker.GetHerHis] สงบลง... ในตอนนี้\n\n"ข้ายินดีที่จะต่อสู้เคียงข้างท่าน ร่วมกันเราจะ #EMP ไร้เทียมทาน!#!" เขาตะโกน"
 fp1_yearly.2203.a:0 ""ข้าขออภัย แต่เส้นทางของเจ้าสิ้นสุดที่นี่""
 fp1_yearly.2203.b:0 ""ข้าเป็นเกียรติที่จะต่อสู้เคียงข้างท่าน!""
 fp1_yearly.2203.c:0 ""เจ้าสร้างความเสียหายมากพอแล้ว ไปเสีย เดี๋ยวนี้""
 fp1_yearly.2204.t:0 "เบอร์เซิร์กเกอร์ผู้เบื่อหน่าย: ยักษ์ใจดี"
 fp1_yearly.2204.desc:0 ""ข้าขออภัย" [new_berserker.GetFirstNameNoTooltip] กล่าวด้วยน้ำเสียงสะเทือนอารมณ์ "ข้าโกรธเมื่อหิว"\n\n[new_berserker.GetWomanMan] ร่างใหญ่ยื่นมือของ [new_berserker.GetHerHis] มาช่วยพยุงข้าขึ้น ความโกรธเกรี้ยวของ [new_berserker.GetHerHis] ดูเหมือนจะสงบลง... ในตอนนี้\n\n"ข้าสนุกกับการต่อสู้ของเรา ข้ายินดีเข้าร่วมกับท่าน สหาย" เขากล่าว"
 fp1_yearly.2204.a:0 ""และข้ายินดีต้อนรับท่าน สหาย!""
 fp1_yearly.2204.b:0 ""ได้โปรด ไปเสียเถอะ...""
 
 grizzled_veterans:0 "ทหารผ่านศึกผู้กรำศึก"
 glory_seekers:0 "ผู้แสวงหาเกียรติยศ"
 fp1_yearly.2300.t:0 "ผู้แสวงหาเกียรติยศ"
 fp1_yearly.2300.desc:0 "โรงเตี๊ยมใน [tavern_location.GetNameNoTier] มีนักรบผู้แสวงหาเกียรติยศหลั่งไหลเข้ามาในช่วงหลัง\n\nในหมู่พวกเขา — กลุ่มทหารผ่านศึกเก่าแก่และกรำศึก ฮัสคาร์ลที่กำลังมองหา [recruiting_character.Custom('MistressMaster')] คนใหม่\n\nนอกจากนี้ยังมีชายหนุ่มผู้กระตือรือร้นจำนวนมากที่พูดไม่หยุดเกี่ยวกับการแสวงหาเกียรติยศในดินแดนต่างแดน\n\nบางทีข้าควรจะจ้างพวกเขาบางคน?"
 fp1_yearly.2300.a:0 "ข้าจะนำฮัสคาร์ลเข้ามาในครัวเรือนของข้า"
 fp1_yearly.2300.b:0 "ชายหนุ่มยังไม่มีประสบการณ์ — แต่มีจำนวนมาก!"
 fp1_yearly.2300.c:0 "ถึงเวลาขึ้นราคาเบียร์เอลเป็นสองเท่า!"
 fp1_yearly.2300.d:0 "เข้าร่วมกับข้า นักรบผู้กล้าหาญ! ข้าจะนำพวกเจ้าไปสู่ชัยชนะ!"
 huscarls_tt:0 "#F ฮัสคาร์ลเป็นนักสู้แนวหน้าที่แข็งแกร่ง สามารถสร้างความเสียหายอย่างมากแก่กองทหารที่อ่อนแอกว่า#!"
 bondi_tt:0 "#F บอนดิมีความยืดหยุ่นและเก่งกาจในการต่อสู้ในที่ราบหรือพื้นที่เกษตรกรรมในดินแดนต่างแดน#!"
 
 fp1_yearly.2400.t:0 "การเตรียมการล่าสัตว์"
 fp1_yearly.2400.desc:0 "ป่ากำลังเรียกหาข้า นานเกินไปแล้วที่ข้าไม่ได้ล่าสัตว์ครั้งสุดท้าย ที่นั่น ใน [ROOT.Char.Custom('TerrainType')] ของ [hunting_province.GetName] มี [ROOT.Char.Custom('GetAnimalPlural')] [ROOT.Char.Custom('GetAnimalAdjective')] มากมาย หนึ่งในนั้นคงจะดีสำหรับโต๊ะอาหารค่ำของข้าคืนนี้!\n\nแต่มีบางอย่างขาดหายไป หอกล่าสัตว์ของข้าเก่าและทื่อเกินไปหรือ? หรือเป็นเพื่อนร่วมทางที่ข้าขาด?\n\nข้าควรเตรียมตัวให้ดี"
 fp1_yearly.2400.a:0 "สุนัขล่าเนื้อตัวใหม่คือสิ่งที่ข้าต้องการ!"
 fp1_yearly.2400.eagle: "อินทรีสำหรับล่าสัตว์สักตัว คงจักรับใช้ข้าได้เป็นอย่างดี!"
 fp1_yearly.2400.b:0 "หอกที่ตีขึ้นใหม่ และลูกธนูติดขนนกกา"
 fp1_yearly.2400.c:0 "สิ่งที่ข้ามีก็เพียงพอแล้ว ข้าแค่ต้องการเวลาเตรียมตัว"
 fp1_yearly.2400.free_hunt:1 "[GetActivityType('activity_hunt').GetName] ครั้งต่อไปของท่านจะไม่เสีย [gold|E]"
 brand_new_hunting_tools:0 "เครื่องมือล่าสัตว์ใหม่เอี่ยม"
 brand_new_hunting_tools_desc:0 "ตัวละครนี้ใช้ทองคำจำนวนมากไปกับอุปกรณ์ล่าสัตว์ใหม่"
 
 fp1_yearly.2500.t:0 "ศิลาจารึกอักษรรูนลามก"
 fp1_yearly.2500.desc:0 "หลังจากเดินทางไกลผ่าน [runestone_location.Custom('TerrainTypeCountyScope')] ของ [runestone_location.GetNameNoTier] ข้าก็มาถึงที่ตั้งของศิลาจารึกอักษรรูนของตระกูลข้า แม้ดูเหมือนว่าข้าจะไม่ได้อยู่คนเดียว แขกของข้า [deviant_guest.GetTitledFirstName] ก็อยู่ที่นี่ด้วย — [deviant_guest.GetSheHe] หาที่นี่เจอได้อย่างไร!?\n\n"มันไม่ใช่สิ่งที่เห็นนะขอรับ/เพคะ ท่าน [ROOT.Char.GetTitleTierName]!" [deviant_guest.GetSheHe] อ้าง\n\nความจริงที่ว่า [deviant_guest.GetSheHe] เปลือยกายครึ่งท่อน และกำลังถูไถ [deviant_guest.GetHerselfHimself] อย่างแรงกับ #EMP ศิลาจารึกอักษรรูนของตระกูลข้า#! บอกข้าว่า อันที่จริงแล้ว มันคือสิ่งที่เห็นนั่นแหละ"
 
 fp1_yearly.2600.t:0 "ความพิโรธแห่งชาวเหนือ"
 fp1_yearly.2600.desc:0 ""[ROOT.GetCharacter.GetFirstNameNoTooltip] ท่านเป็นนักรบผู้ยิ่งใหญ่ แต่ศัตรูของท่าน #EMP เกรงกลัว#! ท่านอย่างแท้จริงหรือ?" [berserker_teacher.GetFirstName] กล่าว\n\nข้าเคยเห็น [berserker_teacher.GetFirstNameNoTooltip] ปลุกความโกรธเกรี้ยวเหนือมนุษย์ของ [berserker_teacher.GetHerselfHimself] ในสนามรบ และข้าเคยเห็นศัตรูนับไม่ถ้วนหนีไปต่อหน้าร่างที่คำรามของ [berserker_teacher.GetHerHis] การได้เห็นเบอร์เซิร์กเกอร์กังของ [berserker_teacher.GetFirstNamePossessiveNoTooltip] เปรียบเสมือนการได้เห็นความพิโรธของ [ROOT.GetCharacter.GetFaith.HighGodName] [ROOT.GetCharacter.GetFaith.HighGodHerselfHimself]\n\n"มาร่วมกับข้าหน้ากองไฟเถิด มาปลุกความโกรธเกรี้ยวของท่านกัน" [berserker_teacher.GetSheHe|U] กวักมือเรียก"
 fp1_yearly.2600.a:0 "ขอข้าไปเอาหนังหมีก่อน!"
 fp1_yearly.2600.b:0 "ไม่ ข้าชอบที่จะควบคุมตนเองได้อย่างเต็มที่"
 fp1_yearly.2600.a.tt:0 "พยายามที่จะเป็น [GetTrait('berserker').GetName( GetNullCharacter )]\n#weak อาจมีความเสี่ยง...#!"
 fp1_yearly.2600.b.tt:0 "สละโอกาสที่จะเป็น [GetTrait('berserker').GetName( GetNullCharacter )]"
 fp1_yearly.2601.desc:0 "เรานั่งข้างกองไฟ สวดมนต์คำศักดิ์สิทธิ์ — ข้ากัดฟันและหลับตา ความสั่นสะท้านแล่นผ่านร่างของข้า มีบางอย่างกำลังก่อตัวขึ้นภายในตัวข้า... โอบกอดข้า\n\nข้าตื่นขึ้นจากความคลั่ง "
 fp1_yearly.2601.success_no_one_harmed:0 "[berserker_teacher.GetFirstName] อยู่ข้างกายข้า\n\n"ท่านปลุกความโกรธที่น่าประทับใจอย่างแท้จริง! ท่อนซุงเหล่านั้นไม่มีทางสู้ได้เลย!" [berserker_teacher.GetFirstNameNoTooltip] ยิ้มกว้าง\n\nเห็นได้ชัดว่าข้าทำงานอย่างบ้าคลั่งตลอดทั้งคืน! อย่างน้อยเราก็จะไม่ขาดฟืนไปหลายสัปดาห์..."
 fp1_yearly.2601.success_harm_close_one:0 "[berserker_teacher.GetFirstName] จับไหล่ข้าไว้\n\n"ตั้งสติ! [harmed_victim.GetFirstName] ไม่ใช่ศัตรูของท่าน!" [berserker_teacher.GetFirstNameNoTooltip] กรีดร้อง\n\nด้วยนามแห่ง [ROOT.GetCharacter.GetFaith.HighGodName] ข้าทำอะไรลงไป!?"
 fp1_yearly.2601.success_kill_berserker:0 "ศพที่ถูกทำลายยับเยินของ [berserker_teacher.GetFirstNamePossessive] อยู่ข้างกายข้า ข้ามองไปที่กำปั้นที่กำแน่นของข้า ทั้งสองข้างกำขวานเปื้อนเลือด...\n\nด้วยนามแห่ง [ROOT.GetCharacter.GetFaith.HighGodName] ข้าทำอะไรลงไป!?"
 fp1_yearly.2601.success_kill_everyone:0 "เลือดอยู่รอบตัวข้า ทุกคนตายแล้ว #EMP ทุกคนตายแล้ว!#!\n\n#EMP ข้าทำอะไรลงไป!?#!"
 fp1_yearly.2601.fail_fall_asleep:0 "รู้สึกสดชื่นเหมือนทารกแรกเกิด! [berserker_teacher.GetFirstName] มองข้าด้วยสายตาไม่เห็นด้วย\n\n"งีบหลับสบายดีไหม? และข้าคิดว่าท่านมีแวว..." [berserker_teacher.GetFirstNameNoTooltip] กล่าว พลางส่ายหน้า [berserker_teacher.GetHerHis]\n\nข้าเดาว่าความคลั่งของข้าเป็นเพียงความฝัน!"
 fp1_yearly.2601.a:0 "ข้ารอการต่อสู้ครั้งต่อไปไม่ไหวแล้ว!"
 fp1_yearly.2601.b:0 "นี่ต้องเป็นฝีมือของ [ROOT.Char.GetFaith.TricksterGodName] แน่ๆ..."
 fp1_yearly.2601.c:0 "โอ้ ช่างเถอะ! อย่างน้อยข้าก็รู้สึกดี!"
 
