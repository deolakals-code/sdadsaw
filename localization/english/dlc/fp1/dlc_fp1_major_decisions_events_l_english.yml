l_english: 
 # Securing the High Kingdom of the North Sea
 fp1_major_decisions.0001.t:0 "มหา[founder.Custom('GetQueenKing')]แห่งอุดรทิศ"
 fp1_major_decisions.0001.desc:0 "เป็นความทะเยอทะยานของข้ามานานแล้วที่จะรวมราชอาณาจักรอันยิ่งใหญ่แห่งทะเลเหนือไว้ภายใต้มงกุฎเดียวอันถาวร เป็นเวลาหลายปีที่ข้าตรากตรำ ทำงาน เพื่อให้ได้รับการยอมรับในฐานะผู้ปกครองผู้ยิ่งใหญ่ของ แต่ละอาณาจักรของข้า และในวันนี้ข้าก็ได้ ทำให้ความฝันของข้าเป็นจริง\n\nหลังจากได้คำสัตย์สาบานที่ร่างไว้อย่างรอบคอบถึงความจงรักภักดีที่ไม่สิ้นสุดจากข้าในบังคับคนสำคัญ ทั้งชาวแซกซอน ชาวนอร์เวย์ และชาวเดน ต่างยอมรับตำแหน่งของข้าในฐานะมหา[founder.Custom('GetQueenKing')] ผู้เป็นเจ้าเหนือหัวแห่งทะเลเหนืออย่างไม่มีข้อโต้แย้ง\n\nบางทีลูกหลานของข้าอาจจะยังคงปกครองอาณาจักรต่างๆ เป็นหนึ่งเดียวกันต่อไป บางทีพวกเขาอาจจะไม่ทำ โชคดีที่มันไม่สำคัญอีกต่อไปแล้ว\n\nไม่ว่าใครจะสวมมงกุฎที่เล็กกว่า #EMP ทั้งหมด#! จะต้องก้มหัวให้แก่[founder.GetTitleAsNameNoTooltip]แห่ง[founder.GetHouse.GetBaseNameNoTooltip]!"
 fp1_major_decisions.0001.a:0 "อาณาจักรอันยิ่งใหญ่ที่ยั่งยืน!"
 fp1_major_decisions.0002.t:0 "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0002.desc:0 "เป็นเวลาหลายปีแล้วที่เจ้าเหนือหัวของข้า [founder.Custom('GetQueenKing')] [founder.GetFirstName] ได้แสดงให้เห็นอย่างชัดเจนว่า[founder.GetSheHe]ปรารถนาให้อาณาจักรของ[founder.GetHerHis]ดำรงอยู่ต่อไปหลังจาก[founder.GetHerHim]\n\nแม้ว่าอาณาจักรของเราจะผูกพันกันด้วยสายสัมพันธ์ทางเครือญาติและความขัดแย้ง แต่ระยะทางและความแตกต่างที่แท้จริงระหว่างอาณาจักรเหล่านั้น ทำให้เป้าหมายนี้ดูเหมือนจะบรรลุไม่ได้\n\nวันนี้ ข้อสงสัยเหล่านี้ได้รับการพิสูจน์แล้วว่าไม่มีมูล เมื่อ[founder.GetFirstNameNoTooltip]ได้แจกจ่ายคำสัตย์สาบานที่เขียนขึ้นเป็นเวลาหลายปีถึงความจงรักภักดีที่ผูกมัด ซึ่งกันและกันระหว่างข้าในบังคับทั้งหมดของอาณาจักร\n\n$title_high_kingdom$แห่ง$e_north_sea$ได้ถือกำเนิดขึ้นแล้ว!"
 fp1_major_decisions.0002.a:0 "ทรงพระเจริญแด่[founder.GetTitleAsNameNoTooltip]!"
 fp1_major_decisions.0002.b:0 "[founder.Custom('GetQueenKing')]จอมปลอม ซ้ำแล้วซ้ำเล่า"

 fp1_major_decisions.0003.t:0 "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0003.desc:0 "เป็นความทะเยอทะยานที่เปิดเผยมานานแล้วของ[founder.GetFirstName] [founder.Custom('GetQueenKing')]แห่ง$k_norway$, $k_england$, และ$k_denmark$ ที่จะ ทำให้แน่ใจว่าอาณาจักรของ[founder.GetHerHis]จะไม่แตกสลายเมื่อ[founder.GetHerHis]สิ้นพระชนม์\n\nวันนี้ หลังจากหลายปีแห่งการปกครองและการเจรจาที่ตึงเครียด ในที่สุด[founder.GetSheHe]ก็ได้สมความปรารถนา\n\nข้าในบังคับของทั้งสามอาณาจักรได้ตกลงกันว่า ไม่ว่าใครจะนั่งบนบัลลังก์ของ แต่ละอาณาจักร ทุกคนจะต้องก้มหัวให้แก่[founder.GetTitleAsNameNoTooltip]"
 fp1_major_decisions.0003.a:0 "อาณาจักรสำหรับชาว[ROOT.GetCharacter.GetFaith.GetNameNoTooltip]ผู้ดีงามทั้งปวง!"
 fp1_major_decisions.0003.b:0 "ขอทรงคุ้มครองเราเถิด โอ้ [ROOT.GetCharacter.GetFaith.HighGodName] จากพระพิโรธของ[founder.GetFirstNameNoTooltip]!"
 fp1_major_decisions.0003.c:0 "[founder.GetSheHe|U]เป็นเพียงคนเถื่อนจอมโอ้อวด!"

 # Founding the Capital of the Rus'
 fp1_major_decisions.0011.t:0 "ราชธานีสำหรับชาวรุสทั้งปวง"
 fp1_major_decisions.0011.desc:0 "จากแม่น้ำ$river_volga$ถึงแม่น้ำ$river_dnieper$และไกลออกไป ชาววารังเจียนล่องเรือไปตามแม่น้ำและเส้นทางต่างๆ ในดินแดนของ$east_slavic_group_collective_noun$ เราปล้นสะดม เราพิชิต เราผสมผสานกับคนท้องถิ่น เมื่อเรารู้สึกว่าจำเป็น เราก็ก่อตั้งถิ่นฐานใหม่ หรือยึดครองด้วยกำลัง\n\nจนถึงวันนี้ ศูนย์กลางเล็กๆ เหล่านี้ต่างแข่งขันกันเพื่อดึงดูดนักผจญภัยและขุนศึก แสวงหาความเป็นใหญ่ที่แท้จริงเหนือชาวรุสที่เหลือ\n\nไม่เอาอีกแล้ว! ด้วยการกระทำอันยิ่งใหญ่และชื่อเสียงอันดุร้ายของข้า ข้าจะดึงดูดทั้งชาวนอร์สและชาวสลาฟ สร้างราชธานีที่คู่ควรแก่[founder.GetPrimaryTitle.GetNameNoTier]!"
 fp1_major_decisions.0011.a:0 "$c_kiev$จะเป็นราชธานีที่ดีเยี่ยม!"
 fp1_major_decisions.0011.b:0 "[new_rus_capital.GetNameNoTierNoTooltip]คือแหล่งกำเนิดความยิ่งใหญ่ของเราอย่างแท้จริง!"
 fp1_major_decisions.0012.t:0 "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0012.desc:0 "ด้วยอำนาจแห่งนามและชื่อเสียงของ[founder.GetHerHis] เจ้าเหนือหัวของข้า [founder.GetTitledFirstName] ได้เริ่มสถาปนาราชธานีอันยิ่งใหญ่ที่[new_rus_capital.GetNameNoTier] [founder.GetSheHe|U]หวังว่า สักวันหนึ่ง ถิ่นฐานแห่งนี้จะเป็นศูนย์กลางของดินแดนรุสทั้งหมด"
 fp1_major_decisions.0012.a:0 "ราชธานีที่คู่ควร!"
 fp1_major_decisions.0012.b:0 "บาห์! ไม่มีอะไรมากไปกว่ารังของพวกเดนคนและเหล่าร้าย"
 fp1_major_decisions.0013.t:0 "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0013.desc:0 "ด้วยอำนาจแห่งนามและชื่อเสียงของ[founder.GetHerHis] [founder.GetTitledFirstName] ขุนศึกป่าเถื่อน ได้เรียกร้องความจงรักภักดีจากชาววารังเจียนพเนจรและชาวสลาฟผู้กระหายเลือดทั้งปวง\n\nแม้กระทั่งตอนนี้ นักผจญภัย โจรสลัด นักปล้นสะดม และโจร ต่างรวมตัวกันภายใต้ธงของ[founder.GetHerHis] ทำให้ประชากรของ[new_rus_capital.GetNameNoTier]เพิ่มขึ้นอย่างมาก"
 fp1_major_decisions.0013.a:0 "[new_rus_capital.GetNameNoTierNoTooltip]นี้ฟังดู... รุ่งเรือง..."
 fp1_major_decisions.0013.b:0 "พวกเขาก็ยังเป็นแค่ชาวต่างชาติล้าหลัง"
 fp1_major_decisions.0013.c:0 "ข้าไม่เห็นว่าเรื่องนี้เกี่ยวข้องกับข้าอย่างไร?"

 #Elevating the Kingdom of Mann & the Isles
 fp1_major_decisions.0021.t:0 "อาณาจักรแห่งโจรสลัด"
 fp1_major_decisions.0021.desc:0 "เป็นเวลาหลายปีที่ข้าได้ล่องเรือไปตามทางน้ำของโลก ปล้นสะดม จู่โจม และทำลายล้าง ข้าได้ขโมยทองคำมากกว่าที่กษัตริย์ส่วนใหญ่เคยเห็น และชื่อของข้าถูกสาปแช่งตั้งแต่ทะเลไอริชไปจนถึงคาเธ่ย์\n\nข้าคือ[founder.GetWomanMan]ที่อื้อฉาวที่สุดที่ยังมีชีวิตอยู่ หายนะแห่งท้องทะเล อย่างไม่ต้องสงสัย และได้ทุ่มเททรัพย์สินที่ปล้นมาและชื่อเสียงของข้าให้กับการตั้งถิ่นฐานอย่างหนักและการเสริมสร้างความแข็งแกร่งของ$c_isle_of_man$\n\nผู้คนทั่วโลกประณามข้าว่าเป็นโจรสลัดที่ชั่วร้ายที่สุดเท่าที่พวกเขาเคยได้ยินมา\n\nแต่พวก#EMP เขา#! เคยได้ยินชื่อข้า"
 fp1_major_decisions.0021.a:0 "ข้าคือ[founder.GetLadyLord|U]แห่งโลหิตและทองคำ!"
 fp1_major_decisions.0021.b:0 "ในที่สุด ความฝันของข้าก็สำเร็จ..."
 fp1_major_decisions.0022.t:0 "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0022.desc:0 "เป็นเวลาหลายปีแล้วที่เป็นความลับที่เปิดเผยว่า[founder.GetFirstName]ปฏิเสธที่จะยอมรับหรือรับมงกุฎใดๆ ยกเว้นเพียงหนึ่งเดียว: [founder.GetPrimaryTitle.GetNameNoTier]\n\nหัวใจของ[founder.GetHerHis|U]ตั้งมั่นอยู่กับสิ่งนี้นานจนดูเหมือนว่าเจ้าเหนือหัวของข้าได้อุทิศชีวิตของ[founder.GetHerHis]เพื่อสร้างความชอบธรรมให้กับอำนาจและอิทธิพลของบ้านเกิดที่เป็นเกาะของ[founder.GetHerHis]\n\nหลังจากการปล้นสะดม สงคราม และการสังหารหมู่ทั่วไปนับไม่ถ้วน [founder.GetSheHe]ก็ประสบความสำเร็จ\n\nว่ากันว่าอัญมณี แต่ละเม็ดในมงกุฎใหม่ของ[founder.GetHerHis]ถูกนำมาจากการปล้นสะดมที่แตกต่างกัน บางคนในราชสำนักกระซิบกันว่ายังมีช่องว่างสำหรับ[founder.GetTitledFirstNameNoTooltip]ให้เติมเต็ม"
 fp1_major_decisions.0022.a:0 "ลองคิดถึงทองคำทั้งหมดที่เราจะได้สิ!"
 fp1_major_decisions.0022.b:0 "#EMP [founder.GetTitleAsNameNoTooltip]#!? [founder.GetSheHe|U]เลวร้ายยิ่งกว่าบารอนโจร!"
 fp1_major_decisions.0023.t:0 "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0023.desc:0 "แม้ แต่ชาวนาที่ต่ำต้อยที่สุดในหมู่เกาะบริเตนก็เคยได้ยินเรื่องราวของ[founder.GetFirstName]ผู้น่าสะพรึงกลัว หายนะแห่งท้องทะเล และภารกิจตลอดชีวิตของ[founder.GetHerHis]เพื่อได้รับการยอมรับสำหรับอาณาจักรในฝันของ[founder.GetHerHis]ที่เต็มไปด้วยโจรสลัดปล้นสะดม\n\nเป็นตำนานที่สร้างความหวาดกลัวให้กับทั้งขุนนางและทาสติดที่ดินผู้ต่ำต้อย แต่ดูเหมือนว่าเส้นแบ่งระหว่างตำนานและประวัติศาสตร์จะเลือนลางไปเมื่อไม่นานมานี้\n\nณ วันนี้ #EMP [founder.GetTitleAsNameNoTooltip]#! [founder.GetFirstNameNoTooltip]ได้ประกาศว่างานตลอดชีวิตของ[founder.GetHerHis]เสร็จสมบูรณ์แล้ว\n\nบริทานเนียนับอาณาจักรใหม่บนชายฝั่ง และมันน่าสะพรึงกลัวยิ่งนัก"
 fp1_major_decisions.0023.a:0 "[founder.GetSheHe|U]จะไม่มาปล้น#EMP เรา#! ใช่ไหม?"
 fp1_major_decisions.0023.b:0 "ไม่มากไปกว่า[founder.GetTitleAsNameNoTooltip]แห่งโจร!"

 # Forging the Jomsvikings
 fp1_major_decisions.0031.t:0 "การก่อตั้งยมส์ไวกิง"
 fp1_major_decisions.0031.desc:0 "ด้วยอำนาจและบารมีของข้า ข้าได้รวบรวมกลุ่ม[founder.GetFaith.GetAdherentNamePlural]ที่โหดเหี้ยมและคลั่งศาสนาที่สุดในสแกนดิเนเวียทั้งหมด และหล่อหลอมพวกเขาให้เป็นภราดรภาพ[leader.Custom('SisterBrother')]นักรบ!\n\nข้ามผืนน้ำทะเล ในดินแดนของชาวสลาฟและชาวบอลต์ $d_jomsvikings$เหล่านี้จะเจริญรุ่งเรือง การปล้นสะดมและความขัดแย้งกับคนท้องถิ่นจะ ทำให้พวกเขาดุร้าย และส่งเสริมให้เฉพาะผู้ติดตามที่คู่ควรเท่านั้นที่จะแสวงหาพวกเขา\n\nในทางกลับกัน พวกเขาจะตอบแทนเกียรติยศด้วยนักรบและของที่ปล้นมา และลงโทษคนขี้ขลาด ผู้เปลี่ยนศาสนา และนักปฏิรูป\n\nนับจากวันนี้จนถึงแร็กนาร็อก [founder.GetFaith.GetNameNoTooltip]จะคงอยู่ต่อไป"
 fp1_major_decisions.0031.a.cynical:0 "ตราบใดที่พวกเขายังทำสงครามให้ข้า..."
 fp1_major_decisions.0031.a.fallback:0 "วิถีเก่าคือวิถีที่ดีที่สุด!"
 fp1_major_decisions.0032.t:0 "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.0032.desc:0 "ในความพยายามที่จะหยุดยั้งกระแสของผู้เปลี่ยนศาสนาอับราฮัมและความคิดปฏิรูปที่น่าตกใจของยาร์ลที่มองโลกในแง่ร้ายบางคน [founder.Custom2('MyCharacterIntroduction',ROOT.Char)]ได้รวบรวมกลุ่ม[founder.GetFaith.GetAdherentNamePlural]ผู้คลั่งศาสนาเข้าเป็นภราดรภาพ[leader.Custom('SisterBrother')]นักรบอย่างเป็นทางการโดยมีเจตนาที่จะปกป้องวิถีเก่า\n\nประจำการอยู่ในป้อมปราการอันยิ่งใหญ่แห่ง$b_jomsberg$ เหล่าผู้เป็นแบบอย่างแห่งคุณธรรม[founder.GetFaith.GetAdjectiveNoTooltip]เหล่านี้ตั้งใจที่จะล่องเรือในทะเลบอลติก ให้รางวัลแก่ความศรัทธาและลงโทษความไร้เกียรติและความขี้ขลาด"
 fp1_major_decisions.0032.a:0 "เกียรติภูมิและโลหิตแด่[founder.GetFaith.HighGodName]!"
 fp1_major_decisions.0032.b:0 "งั้น พวกเขาคือโจรสลัด?"
 fp1_major_decisions.0033.t:0 "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.0033.desc.autofounded:0 "[founder.GetTitledFirstName] นักผจญภัยชาวนอร์ดิกผู้กล้าหาญ ได้เปิดฉากการรุกรานอย่างโหดเหี้ยมต่อ[victim.GetTitledFirstName] กวาดล้างดินแดน[coup_target.GetNameNoTier]ไปจาก[victim.GetHerHim]ในการโจมตีที่ไม่คาดคิด\n\nสิ่งที่ ทำให้เรื่องนี้ไม่ธรรมดาคือการรุกรานดูเหมือนจะมีแรงจูงใจทางศาสนา: [founder.GetFirstNameNoTooltip]ได้ร่วมมือกับผู้คลั่งศาสนา[founder.GetFaith.GetAdjective]ชื่อ[leader.GetFirstNameNoTooltip]เพื่อจัดตั้งภราดรภาพ[leader.Custom('SisterBrother')]นักรบที่พวกเขาเรียกว่า$d_jomsvikings$"
 fp1_major_decisions.0033.desc.decision_founded:0 "หลังจากหลายปีของการรณรงค์ [founder.GetTitledFirstName] ผู้คลั่งศาสนา[founder.GetFaith.GetAdjective] ในที่สุดก็ได้รวบรวมผู้ติดตามมากพอที่จะ ทำให้ความฝันของ[founder.GetHerHis]เป็นจริง: ที่ป้อมปราการที่เพิ่งสร้างใหม่ของ$b_jomsberg$ [founder.GetSheHe]ได้รวบรวมภราดรภาพ[leader.Custom('SisterBrother')]นักรบใหม่เพื่อปกป้องศรัทธาของ[founder.GetHerHis]\n\n$d_jomsvikings$ได้ถือกำเนิดขึ้นแล้ว"
 fp1_major_decisions.0033.desc.outro:0 "\n\nกลุ่มอ้างว่าพวกเขาจะบังคับใช้วิถีเก่า โจมตีชาวอับราฮัม นักปฏิรูป และเพแกนคู่แข่งเหมือนกัน กวาดล้างอย่างนองเลือดไปทั่วผืนน้ำทะเลบอลติก"
 fp1_major_decisions.0033.a:0 "ทุกคนจะได้รู้ถึงพระพิโรธของ[founder.GetFaith.HighGodNamePossessive]!"
 fp1_founder_founded_the_jomsviking_tt:0 "[holy_order|E]แห่ง[faith|E]ของ[founder.GetTitledFirstNamePossessiveNoTooltip]ได้ถูกก่อตั้งขึ้น\n$EFFECT_LIST_BULLET$[founder.GetFirstNameNoTooltip]กลายเป็น[holy_order_patron|E]ของคณะ"
 fp1_major_decisions.0033.b.competition:0 "หืม คู่แข่งงั้นรึ?"
 fp1_major_decisions.0033.b.heathens:0 "#EMP *ถอนหายใจ*#! ... พวกนอกรีตนักปล้นอีกแล้วรึ?"

 # Canute-'em-Up
 fp1_major_decisions.1001.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip]แห่งทะเลเหนือ"
 fp1_major_decisions.1001.desc.dumb:0 "ข้าใช้ชีวิตอย่างมีเสน่ห์พอสมควร ในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip] ทุกคนรู้จักข้าว่าเป็นผู้มีปัญญา มีเมตตา และ#EMP ทรงพลัง#! เกินกว่าจะวัดได้ ราวกับว่าโลกทั้งใบถือว่าข้าเป็น[ROOT.Char.Custom('GetDaughterSon')]คนโปรดของ[ROOT.Char.GetFaith.HighGodNamePossessive]\n\nข้าราชบริพารทุกคนของข้าเห็นด้วยและบอกข้าบ่อยครั้ง โดยเฉพาะอย่างยิ่ง[sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)]\n\nทำไมนะ [sycophant.GetFirstNameNoTooltip]ถึงกับอ้างว่ากระแสน้ำเองก็เชื่อฟังคำสั่งของข้า และจะหันกลับเพียงแค่เสียงกระซิบจากข้า..."
 fp1_major_decisions.1001.desc.smart:0 "ในฐานะ[ROOT.Char.GetTitleAsNameNoTooltip] ข้าพบว่าตัวเอง#EMP ถูกรายล้อม#! ไปด้วยผู้คนที่พยายามอย่างยิ่งที่จะบอกข้าว่าข้ายิ่งใหญ่และทรงพลังเพียงใด\n\nโดยปกติ ข้าจะปัดเป่ามันทิ้งไป: การประจบสอพลอดังกล่าวเป็นเพียงสิ่งที่คาดหวังสำหรับผู้สิ้นหวังเมื่อได้สัมผัสกับตำแหน่งของข้า\n\nอย่างไรก็ตาม วันนี้มันได้มาถึงจุดที่#EMP ทนไม่ได้#! แล้ว [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)]เห็นสมควรที่จะขัดจังหวะข้าในตอนเช้าเพื่อบอกข้าว่า[sycophant.GetSheHe]คิดว่ากระแสน้ำเองก็จะหันกลับเพียงแค่คำสั่งของข้า\n\nแม้ว่าความไม่จริงที่น่าคลื่นไส้อย่างเห็นได้ชัดของทั้งหมดนี้ แต่มันก็ ทำให้ข้าเกิดความคิดขึ้นมา..."
 fp1_major_decisions.1001.a:0 "ไปที่ชายหาด!"
 fp1_major_decisions.1001.a.tt:0 "ท่านและราชสำนักของท่านเดินทางไปที่ชายทะเล..."
 fp1_major_decisions.1001.b:0 "แม้ แต่คำหวานก็เป็นเพียงคำพูด"
 fp1_major_decisions.1002.t:0 "$fp1_major_decisions.1001.t$"
 fp1_major_decisions.1002.desc.dumb:0 "เรานั่งอยู่ริมทะเลตลอดบ่าย ราชสำนักของข้าสั่นเทาจากลมเหนือที่หนาวเย็นและขมขื่น\n\nนาทีแล้วนาทีเล่า ชั่วโมงแล้วชั่วโมงเล่า ข้าประกาศก้องต่อมหาสมุทร: เจ้าจะผ่านไปไม่ได้! ข้าคือ[ROOT.Char.GetTitleAsNameNoTooltip]ของเจ้า และข้าไม่ลดตัวลงไปเปียกปอนด้วยน้ำมือของเจ้า!\n\nอย่างดื้อรั้น น้ำค่อยๆ คืบคลานเข้ามาใกล้ขึ้นเรื่อยๆ จนเริ่มซัดสาดที่เท้าของข้า ผู้ติดตามของข้าดูอึดอัด แต่ละคนปฏิเสธที่จะสบตาข้า สันนิษฐานว่า#EMP ละอายใจ#! ที่ต้องเป็นพยานในช่วงเวลาแห่งความ#EMP อ่อนแอ#! อย่างที่สุดของผู้ปกครองของพวกเขา"
 fp1_major_decisions.1002.desc.smart:0 "เมื่อไม่มีอะไรทำในวันนี้ ข้าบังคับให้ราชสำนัก#EMP ทั้งหมด#! ของข้าใช้เวลาช่วงบ่ายริมทะเล เฝ้าดูข้า นั่งอยู่บนบัลลังก์ในชุดราชาภิเษก กรีดร้องใส่ทะเลให้หยุดการเคลื่อนตัวเข้าฝั่ง\n\nไม่ต้องบอกก็รู้ว่าน้ำไม่ยอมฟัง\n\nหลังจากห้านาที ผู้ติดตามของข้าเข้าใจเจตนาของข้า\n\nหลังจากห้าชั่วโมง เมื่อคลื่นซัดสาดเท้าข้าในที่สุด พวกเขาก็เข้าใจถึงความมุ่งมั่นของข้า\n\nข้าคือ[ROOT.Char.GetTitleAsNameNoTooltip] และข้าจะไม่เป็นคนโง่ของใคร"
 fp1_major_decisions.1002.a:0 "ข้าเป็นเพียง[ROOT.Char.GetWomanMan]มนุษย์ และข้ารู้ขีดจำกัดของข้า พวกเจ้าก็ควรรู้ เช่นกัน"
 fp1_major_decisions.1002.b:0 "ดูสิว่าอำนาจของ[ROOT.Char.Custom('GetQueenKing')]นั้น#EMP ไร้ค่า#! เพียงใดเมื่อเทียบกับ[ROOT.Char.GetFaith.HighGodName]!"
 fp1_major_decisions.1002.c:0 "#EMP หนีเร็ว!#! ทะเลได้ร่วมมือกับ[ROOT.Char.GetFaith.DevilName]!"
 fp1_major_decisions.1002.d:0 "เจ้าลูกหมาทะเลจอมโอหัง! ส่งแส้นั่นมาให้ข้า!"
 fp1_major_decisions.1002.d.tt:0 "ท่านเฆี่ยนน้ำจนยอมจำนน"
 fp1_major_decisions.1002.e:0 "บางทีอาจมีอะไรให้ข้าเชี่ยวชาญมากกว่าแค่การปกครอง..."

 # The True King of Norway
 fp1_major_decisions.1011.t:0 "กษัตริย์แห่ง$k_norway$"
 fp1_major_decisions.1011.desc.intro:0 "หลายปีก่อน ข้าได้ให้คำสัตย์สาบานว่าจะไม่ตัดผมเลย จนกว่าข้าจะได้ตำแหน่งอันสูงส่งของกษัตริย์แห่ง$k_norway$"
 fp1_major_decisions.1011.desc.gyda:0 "เพื่อความรักที่มีต่อ[gyda.GetTitledFirstName]"
 fp1_major_decisions.1011.desc.oath:0 "เพื่อเกียรติภูมิแห่งตระกูลของข้าและมรดกของลูกหลานข้า"
 fp1_major_decisions.1011.desc.outro:0 "ข้าจะพิชิตอาณาจักรร้อยแห่ง\n\nบัดนี้ภารกิจเสร็จสิ้นแล้ว และข้าไม่ต้องผูกมัดที่จะไว้ผมยาวรุงรังนี้อีกต่อไป\n\nคำถามยังคงอยู่: ข้าจะทำอย่างไรกับผมของข้า?"
 fp1_major_decisions.1011.a:0 "คำสาบานของข้าสำเร็จแล้ว!"
 fp1_major_decisions.1011.b:0 "[gyda.GetFirstNameNoTooltip]และข้าจะได้อยู่ด้วยกันในที่สุด!"
 fp1_major_decisions.1011.c:0 "ผมของข้ายังคงอยู่ มันเป็นเครื่องหมายของความยากลำบากทั้งหมดที่ข้ารู้จัก"
 fp1_major_decisions.1011.c.tt:0 "ท่านจะยังคงเป็นที่รู้จักในนาม$nick_tanglehair$" # Note: $nick_tanglehair$ should be translated elsewhere if needed, e.g., "ผมพันกัน"
 fp1_major_decisions.1012.t:0 "[king_of_norway.GetTitledFirstNameNoTooltip]อ้างสิทธิ์ใน$k_norway$ก่อน"
