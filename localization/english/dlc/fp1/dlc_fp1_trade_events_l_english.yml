l_english: 

 ##################################################
 # #Misc Keys
 TRUCE_TRADE_DEAL:1 "\nการสงบศึกลงนามเพื่อแลกกับการยุติการปล้นสะดม"

 ##################################################
 # #Standard Trade Events
 fp1_trade_events.0000.t:0 "ปล้นหรือค้า"
 fp1_trade_events.0002.t:1 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0002.desc:0 "ขณะที่กองทหารของข้าและตัวข้าเตรียมเข้าปล้นสะดมดินแดนแห่ง [county.GetNameNoTierNoTooltip], หน่วยสอดแนมชุดแรกของเรารายงานกลับมา\n\nดูเหมือนว่าเมืองต่างๆ ในท้องถิ่นจะมั่งคั่ง, แต่หลายแห่งมีป้อมปราการแข็งแกร่ง, และเราอาจถูกกองทัพที่มุ่งแก้แค้นจับได้ก่อนที่จะสามารถบุกเข้าสู่เป้าหมายที่น่าเย้ายวนที่สุดได้\n\nทุกอย่างยังไม่สิ้นหวัง: ศิลปะของการปล้นสะดมที่ดีคือการฉวยโอกาส, และเราอาจสามารถจัดการค้าขายและเรียกส่วยเพื่อแลกกับการยั้งดาบของเราไว้ได้"
 fp1_trade_events.0002.a:0 "บางที [county.GetHolder.GetTitleAsNameNoTooltip] ในท้องถิ่นอาจจะยอมรับข้อเสนอ?"
 fp1_trade_events.0002.a.accepted:0 "หากข้อเสนอของท่านได้รับการยอมรับ"
 fp1_trade_events.0002.a.rejected:0 "หากข้อเสนอของท่านถูกปฏิเสธ"
 fp1_trade_events.0002.a.tt:0 "ท่านยังคงปล้นสะดม [county.GetNameNoTierNoTooltip] ต่อไป"
 fp1_trade_events.0002.b:0 "การสงบศึกกับ [county.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip] ผู้ปกครองอาจมีค่าประเมินมิได้..."
 fp1_trade_events.0002.c:0 "ใช่, เรา #EMP อาจจะ#! ทำเงินจากการค้าขายได้ ปล้นมันต่อไปเถอะ"
 fp1_trade_events.0002.c.tt:0 "$fp1_trade_events.0002.a.tt$"
 fp1_trade_events.0002.d:0 "คนขี้ขลาดตาขาวแบบ #EMP ศักดินา#! ประเภทไหนกันที่หาเงินโดยไม่ปล้นสะดม?"
 fp1_trade_events.0002.d.tt:0 "ท่านปล้นสะดม [county.GetNameNoTierNoTooltip] และปฏิเสธที่จะคิดถึงการค้าขายแทนการปล้นสะดมไปตลอดชีวิต"

 fp1_trade_events.0003.t:1 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0003.desc:0 "ฝูงชนไร้ระเบียบของโจรสลัด, โจรป่า, และเหล่าคนพาลติดอาวุธหนักอื่นๆ ได้เข้าสู่ [county.GetNameNoTierNoTooltip], นำโดย [raider.GetFirstName]!\n\nในตอนแรก, หน่วยสอดแนมของข้าคิดว่าพวกเขามาเพื่อปล้นสะดม, แต่ทูตจาก [raider.GetTitleAsNameNoTooltip] ของพวกเขากลับอ้างว่าพวกเขาจะยินดีค้าขายแทน กองกำลังของพวกเขามั่งคั่งไปด้วยของที่ปล้นมาได้, ทั้งเก่าและใหม่, และนี่จะเป็นโอกาสให้คนท้องถิ่นได้ซื้อสินค้าแปลกถิ่นจากทั่วโลก\n\nความนัยนั้นชัดเจน ค้าขายภายใต้เงื่อนไขที่น่าพอใจแล้วพวกเขาจะจากไปอย่างสันติ, หรือปฏิเสธข้อเสนอของพวกเขาแล้วพวกเขาจะเอาสิ่งที่ต้องการไป"
 fp1_trade_events.0003.a:0 "ข้อเสนอที่ไม่คาดคิด, แต่ยินดีต้อนรับอย่างยิ่ง"
 fp1_trade_events.0003.a.tt_success:0 "ข้อเสนอของท่านได้รับการยอมรับ!"
 fp1_trade_events.0003.b:0 "#EMP ค้าขาย#!? กับพวกโจรเหล่านี้รึ?!"
 fp1_trade_events.0003.b.tt_failure:0 "ข้อเสนอของท่านถูกปฏิเสธ!"

 fp1_trade_events.0011.t:0 "$fp1_trade_events.0000.t$: ข้อตกลงที่สะดวกสบาย"
 fp1_trade_events.0011.desc.subsequent_renewal:0 "เป็นเวลาหลายทศวรรษ"
 fp1_trade_events.0011.desc.first_renewal:0 "เป็นเวลาหลายปี"
 fp1_trade_events.0011.desc.outro:0 "แล้ว, ข้ามีความเข้าใจอันดีกับ [recipient.GetTitledFirstName] นักปล้นของข้าเก็บอาวุธไว้ในเข็มขัดในดินแดนของ [recipient.GetHerHis], และราษฎรของ [recipient.GetHerHis] ซื้อสินค้าฟุ่มเฟือยแปลกถิ่นที่เรายึดมาจากอาณาจักรที่ไม่ค่อยมีการทูตนัก\n\nอย่างไรก็ตาม, เงื่อนไขของข้อตกลงของเราใกล้จะหมดอายุแล้ว, และหลายคนในคณะผู้ติดตามของข้าลังเลที่จะละทิ้งช่องทางการค้าที่สะดวกสบายของพวกเขา\n\nบางที [recipient.GetFirstNameNoTooltip] อาจจะเปิดรับการขยายเวลา?"
 fp1_trade_events.0011.a:0 "ข้อเสนออันยิ่งใหญ่!"
 fp1_trade_events.0011.a.accepted:0 "ข้อเสนอของท่านได้รับการยอมรับ"
 fp1_trade_events.0011.a.rejected:0 "ข้อเสนอของท่านถูกปฏิเสธ"
 fp1_trade_events.0011.b:0 "เรื่องนี้ดำเนินมาถึงจุดสิ้นสุดแล้ว..."
 fp1_trade_events.0011.b.tt:0 "ข้อตกลงจะหมดอายุไปอย่างเงียบๆ"

 fp1_trade_events.0012.t:0 "$fp1_trade_events.0011.t$"
 fp1_trade_events.0012.desc.subsequent_renewal:0 "$fp1_trade_events.0011.desc.subsequent_renewal$"
 fp1_trade_events.0012.desc.first_renewal:0 "$fp1_trade_events.0011.desc.first_renewal$"
 fp1_trade_events.0012.desc.outro:0 "ข้อตกลงของข้ากับ [raider.GetTitledFirstName] ยังคงมั่นคง: [raider.GetSheHe] ล่ามสุนัขของ [raider.GetHerHis] ไว้ในดินแดนของข้า, และพ่อค้าของข้าซื้อของที่ [raider.GetSheHe] ปล้นมาจากที่อื่น\n\nเมื่อใกล้ถึงเวลาสิ้นสุดข้อตกลง, [raider.GetFirstNameNoTooltip] ได้ติดต่อมาเพื่อสอบถามเกี่ยวกับการขยายเวลา\n\nเป็นการส่วนตัว, นักรบที่ร่ำรวยหลายคนของ [raider.GetHerHis] ได้เสนอของขวัญชั้นดีหากข้ายังคงให้พวกเขาเข้าถึงตลาดของเราได้อย่างอิสระ เช่นนี้ต่อไป, และมัน #EMP ก็#! ดีที่ไม่ต้องกังวลเกี่ยวกับนักปล้นชาว [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] ที่โกรธแค้นมาปล้นสะดมชนบท..."
 fp1_trade_events.0012.a:0 "ข้อเสนอที่น่าพอใจอย่างยิ่ง!"
 fp1_trade_events.0012.a.tt_success:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0012.b:0 "ข้าพอแล้วกับ [raider.GetWomanMan] ผู้นี้"
 fp1_trade_events.0012.b.tt:0 "$fp1_trade_events.0011.b.tt$"
 fp1_trade_events.0012.b.tt_failure:0 "$fp1_trade_events.0011.a.rejected$"

 fp1_trade_events.0021.t:0 "$fp1_trade_events.0000.t$: ผู้มาเยือนจากแดนไกล"
 fp1_trade_events.0021.desc:0 "ข้อตกลงการค้าของข้ากับ [partner.GetTitledFirstName] ทำให้มั่นใจได้ว่ามีกระแสพ่อค้าและขุนนางชั้นผู้น้อยของข้าเดินทางไปยังดินแดนของ [partner.GetHerHis] อย่างต่อเนื่อง, เพื่อขายของที่ปล้นมาและนำเข้าสินค้าฟุ่มเฟือยจากต่างแดน\n\nสิ่งที่พบเห็นได้น้อยกว่ามากคือคณะเดินทางจาก [partner.GetPrimaryTitle.GetNameNoTier] ที่เดินทางมายัง [ROOT.Char.GetPrimaryTitle.GetNameNoTier], ซึ่งมักจะเป็นเหตุการณ์สำคัญใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] การได้เห็นชาวต่างชาติที่ห่างไกลจำนวนมากโดยที่มือไม่ได้ถูกมัดนั้นเป็นเรื่องยาก\n\nผู้นำของคณะเดินทางดังกล่าวสามารถเข้าเฝ้าเพื่อขอการอุปถัมภ์ได้: [priest.GetFaith.PriestNeuter] ผู้มีวาทศิลป์ และพ่อค้าผู้มีหัวคิดเฉียบแหลม"
 fp1_trade_events.0021.a:0 "ข้าต้องการคนมานับเหรียญของข้า..."
 fp1_trade_events.0021.b:0 "ยินดีต้อนรับสู่การรับใช้ของข้า, [priest.GetFirstNameNoTooltip]!"
 fp1_trade_events.0021.c:0 "แล้วนั่นใครที่ติดตามเจ้ามาด้านหลัง?"
 fp1_trade_events.0021.d:0 "ไปให้พ้น, ชาวต่างชาติ, ข้อตกลงของข้ามีไว้กับ [partner.GetFirstNameNoTooltip]"

 fp1_trade_events.0031.t:0 "$fp1_trade_events.0021.t$"
 fp1_trade_events.0031.desc:0 "นักปล้นของ [raider.GetTitledFirstNameNoTooltip] เป็นกลุ่มที่น่าสะพรึงกลัว พอที่จะ ทำให้ข้ามักจะขอบคุณที่เรานับถือกันและกันในฐานะมิตรที่ระมัดระวังมากกว่าศัตรูที่นองเลือด\n\nหนึ่งในผู้ก่อการร้ายรองที่ #EMP โหดเหี้ยม#! กว่าของ [raider.GetHerHis] ที่นับรวมอยู่ในหมู่พวกเขาคือ [warrior.GetFirstName] นักปล้นที่มีชื่อเสียงไม่น้อย\n\nเมื่อ [warrior.GetSheHe] ขอเข้าเฝ้า ข้าคาดหวังว่าจะมีการลอบสังหารครึ่งหนึ่ง แต่ก็ #EMP ประหลาดใจอย่างน่ายินดี#! ที่พบว่านักรบหนุ่มผู้ทะเยอทะยานปรารถนาที่จะเสนอบริการ [warrior.GetHerHis]"
 fp1_trade_events.0031.a:0 "นักดาบ [warrior.GetWomenMen] แห่ง [raider.GetPrimaryTitle.GetNameNoTierNoTooltip] นั้นเป็นตำนาน!"
 fp1_trade_events.0031.b:0 "ไปให้พ้น, โจร"

 fp1_trade_events.0041.t:0 "$fp1_trade_events.0000.t$: คู่สงครามพร้อมผลประโยชน์"
 fp1_trade_events.0041.desc:0 "ข้อตกลงของข้ากับ [partner.GetTitledFirstName] เป็นประโยชน์ร่วมกัน, แต่บางครั้งข้าก็สงสัยว่ามันบรรลุศักยภาพสูงสุดแล้วหรือยัง ดินแดนของข้าต้องการสัมผัสจากช่างก่ออิฐและช่างไม้ผู้ช่ำชองของ [partner.GetHerHis], และ แม้ว่า [partner.GetSheHe] จะปลอดภัยจากนักปล้นของข้า, แต่คนอื่นๆ อีกมากไม่มีข้อตกลง เช่นนั้น\n\nด้วยการใช้จ่ายร่วมกันเล็กน้อยเพื่ออำนวยความสะดวกในการเดินทางของคนรับใช้ของเรา, เราสามารถแก้ปัญหาสองอย่างนี้ร่วมกันได้: [partner.GetFirstNameNoTooltip] ส่งช่างฝีมือที่มีทักษะมารับใช้ข้าชั่วคราว, และเป็นการตอบแทน, ข้าให้ [partner.GetHerHim] ยืมตัวนักปล้นสูงวัยและผู้ตั้งถิ่นฐานที่กระตือรือร้นไปเป็นที่ปรึกษาเพื่อช่วยรักษาดินแดนของ [partner.GetHerHis] ให้ปลอดภัย"
 fp1_trade_events.0041.foreign_architects_growth.tt:0 "[counties|E] [domain|E] ที่ยังไม่พัฒนาของท่าน"
 fp1_trade_events.0041.foreign_architects_no_growth.tt:0 "[counties|E] [domain|E] ของท่านที่มี [development|E] อย่างน้อย 15"
 fp1_trade_events.0041.partner_gets_raid_aid.tt:0 "หนึ่งใน [duchies|E] ที่เปราะบางของ [partner.GetFirstNamePossessiveNoTooltip] จะถูก [raid|E] ได้ยากขึ้น"
 fp1_trade_events.0041.raider_gets_civic_aid.tt:0 "[domain|E] ของ [raider.GetFirstNamePossessiveNoTooltip] ได้รับการเติบโตของ [development|E] และส่วนลดการก่อสร้าง"
 fp1_trade_events.0041.partner.benefiting_counties.tt:0 "[counties|E] ใน [duchy|E] ที่ระบุชื่อ"
 fp1_trade_events.0041.a.advanced:0 "พวกเขาสามารถสร้างวังให้ข้าในรูปแบบ [partner.GetCulture.GetNameNoTooltip] ได้หรือไม่?"
 fp1_trade_events.0041.a.fallback:0 "มือที่เรียนรู้มานั้นยินดีต้อนรับเสมอ..."
 fp1_trade_events.0041.a.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0041.a.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0041.b:0 "ให้เรื่องนี้เป็นไปอย่างไม่เป็นทางการเถอะ"

 fp1_trade_events.0051.t:0 "$fp1_trade_events.0041.t$"
 fp1_trade_events.0051.desc:0 "คู่ค้าของข้าในบางครั้ง, [raider.GetTitledFirstName], ได้ส่งข่าวเกี่ยวกับข้อเสนอที่น่าสนใจ แม้ว่าจะเป็นความจริงที่ดินแดนของข้าปลอดภัยจากนักปล้นของ [raider.GetHerHis], แต่ก็ไม่เป็นความจริงสำหรับเหล่าร้ายและคนพเนจรอื่นๆ อีกมาก, ในขณะที่ดินแดนของ [raider.GetHerHis] ยากจนและด้อยพัฒนา\n\nหากเราทั้งคู่รับผิดชอบค่าเดินทางสำหรับคนรับใช้ของเรา, [raider.GetFirstNameNoTooltip] เสนอโครงการแลกเปลี่ยนประเภทหนึ่ง: นักรบผ่านศึกและผู้ตั้งถิ่นฐานจากดินแดนของ [raider.GetHerHis] จะถูกส่งมาช่วยปกป้องชายแดนที่เปราะบางแห่งหนึ่งของข้าจากโจรที่มักน้อยกว่า, และช่างก่ออิฐและช่างไม้ที่มีทักษะจากอาณาจักรของข้าจะไปรับใช้ในอาณาเขตของ [raider.GetHerHis]"
 fp1_trade_events.0051.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0051.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0051.a:0 "[option_1.GetNameNoTierNoTooltip] ต้องการผู้เชี่ยวชาญ..."
 fp1_trade_events.0051.b:0 "[option_2.GetNameNoTierNoTooltip] อาจเป็นสถานที่ที่ดีสำหรับพวกเขา?"
 fp1_trade_events.0051.c:0 "ข้าคิดว่าข้าอยากจะเสริมกำลัง [option_3.GetNameNoTierNoTooltip] มากกว่า"
 fp1_trade_events.0051.d:0 "ช่างเป็นข้อเสนอที่อุกอาจเสียนี่กระไร!"

 ##################################################
 # Special Trade Events
 fp1_trade_events.1131.t:0 "ภัยคุกคามจากชาวเหนือ"
 fp1_trade_events.1131.desc:0 "ฝูงชนของโจรสลัดที่ไม่ปะติดปะต่อกัน, เสรีชนไร้ที่ดิน, ลูกคนรองที่สิ้นหวัง และเหล่าคนพาลอื่นๆ ที่คละเคล้ากันได้เข้าร่วมกับ [attacker.GetFirstName] ในการโจมตีที่ [attacker.GetHerHis] เสนอต่อที่ดินของข้า\n\nแม้ว่าขนาดของกองกำลังจะน่าเกรงขาม, แต่พวกเขาขาดระเบียบวินัยหรือความภักดี, โดยทหารรับจ้าง แต่ละคนที่รวบรวมมาต่างมุ่งเน้นไปที่สิ่งที่พวกเขาสามารถได้รับจากสงครามเป็นอันดับแรกและสำคัญที่สุด\n\nต่างจากศัตรูทั่วไป, อาจเป็นไปได้ที่จะจัดการโดยตรงกับผู้บุกรุก บางทีอาจมีการต่อรองเกิดขึ้นได้..."
 fp1_trade_events.1131.a:0 "ไม่มีวัน! กลับไปยังบ้านแดนนรกเยือกแข็งของเจ้าซะ, ไอ้สวะ!"
 fp1_trade_events.1131.b:0 "หากเป็นที่ดินที่พวกเขาต้องการ, ทำไมไม่ให้พวกเขาล่ะ?"
 fp1_trade_events.1131.c:0 "จากประสบการณ์ของข้า, ทหารชอบทองคำมากกว่าเกียรติยศ..."
 fp1_trade_events.1131.c.tt:0 "ท่านจ่ายส่วย (gafol) โดยตรงให้กับกองทหารของ [attacker.GetFirstNamePossessiveNoTooltip] เพื่อให้พวกเขาสลายตัว"
 fp1_trade_events.1131.d:0 "เราจะขับไล่ผู้บุกรุกเหล่านี้เหมือนที่เราเคยทำมาเสมอ"
 fp1_trade_events.1131.d.tt:0 "ท่านต่อสู้กับชาวนอร์ดด้วยวิธีดั้งเดิม"

 fp1_trade_events.1171.t:0 "$fp1_trade_events.0000.t$: ความช่วยเหลืออันศักดิ์สิทธิ์"
 fp1_trade_events.1171.desc:0 "แม้จะเริ่มต้นภายใต้สถานการณ์ที่ #EMP ผิดปกติ#!, ความสัมพันธ์ของข้ากับ [partner.GetTitledFirstName] ก็แข็งแกร่งขึ้นตามกาลเวลาเท่านั้น\n\nแข็งแกร่งกว่าที่ข้าจินตนาการไว้เสียอีก, ดูเหมือนว่า, เนื่องจากจดหมายฉบับสุดท้ายของ [partner.GetHerHis] แสดงความกังวลอย่างจริงใจต่อชะตากรรมของจิตวิญญาณของข้า\n\nในความพยายามที่จะชักจูงให้ข้าเปลี่ยนมานับถือ [partner.GetFaith.GetName], [partner.GetFirstNameNoTooltip] กำลังเสนอการ แต่งงานกับ [partner.GetHerHis] [prospective_spouse.Custom('GetDaughterSon')], พิธีอันยิ่งใหญ่เพื่อต้อนรับข้าเข้าสู่ศรัทธา, #EMP และ#! สินสอดอันงดงาม"
 fp1_trade_events.1171.a:0 "[partner.GetSheHe|U] #EMP ช่าง#! มีเหตุผลที่น่าสนใจจริงๆ..."
 fp1_trade_events.1171.b:0 "ช่างเป็นการแสดงออกที่ยอดเยี่ยม! เพื่อมิตรภาพอันยั่งยืน!"
 fp1_trade_events.1171.b.tt:0 "ผลกระทบทั้งหมดข้างต้น, รวมถึง..."
 fp1_trade_events.1171.c.cynical:0 "ปัดโธ่, ข้าคาดหวังสินบนที่ดีกว่านั้น"
 fp1_trade_events.1171.c.fallback:0 "ไม่มีสินบนใดๆ สามารถล่อลวงข้าให้ออกจาก [raider.GetFaith.GetNameNoTooltip] ได้"
