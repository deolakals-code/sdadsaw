l_english: 
 court_new.0001.t: "ดาบแขวนเหนือศีรษะ"
 court_new.0001.desc.intro: "ข้าได้ยินเสียงดังแคร็ก! เมื่อส่วนหนึ่งของนั่งร้านหักและร่วงลงสู่พื้น เฉียดคนรับใช้ไปเพียงนิดเดียว หากมิใช่ เพราะสัญชาตญาณอันว่องไวของ [bodyguard_candidate.GetFirstName]"
 court_new.0001.desc.murdered: "ข้าถูกเตือนใจอย่างรุนแรงถึงการฆาตกรรมอันน่าสยดสยองของ[murdered_person.GetName] ซึ่งถูกพรากไปก่อนเวลาอันควรของ[murdered_person.GetHerHis]"
 court_new.0001.desc.murderer: "ข้าพลันระลึกถึงแผนการฆาตกรรมของ [murder_dude.GetName] ทรชนผู้ชั่วช้าสามานย์"
 court_new.0001.desc.paranoid: "ระยะหลังนี้ ข้ามักเห็นเงาแวบผ่านหางตา เป็นภูตผีปีศาจที่มีเจตนาฆาตกรรมอย่างไม่ต้องสงสัย เหตุการณ์ล่าสุดนี้ยิ่งตอกย้ำความรู้สึกถึงภยันตรายที่ใกล้เข้ามา"
 court_new.0001.desc.outro: "\n\nนี่อาจเป็นแผนการชั่วร้ายอีกครั้งกระมัง? ชีวิตของ [ROOT.Char.GetTitleAsNameNoTooltip] ช่างเต็มไปด้วยภยันตรายที่เลวร้ายที่สุดนานัปการ ราวกับมีดาบที่ติดตั้งไว้อย่างไม่มั่นคงห้อยอยู่เหนือศีรษะข้าตลอดเวลา รอวันที่จะร่วงหล่นลงมาเมื่อใดก็ได้\n\nหากเพียง แต่ข้ามีใครสักคนคอยระแวดระวังให้ ผู้พิทักษ์สังขารของข้าสักคน ชายผู้นั้น [bodyguard_candidate.GetFirstName] ช่างเป็นบุคคลที่ขยันหมั่นเพียรและแข็งแกร่งอย่างแท้จริง บางทีข้าควร แต่งตั้ง [bodyguard_candidate.GetHerHim] ให้ดำรงตำแหน่งนั้น"
 court_new.0001.a: "[bodyguard_candidate.GetFirstNameNoTooltip] จะเป็นองครักษ์ที่ยอดเยี่ยม"
 court_new.0001.a.murderer: "ข้าไม่ใช่ฆาตกรเพียงคนเดียวในสถานที่แห่งนี้..."
 court_new.0001.b: "ข้ามั่นใจว่าข้าจะปลอดภัยดีโดยไม่มี [bodyguard_candidate.GetHerHim]"
