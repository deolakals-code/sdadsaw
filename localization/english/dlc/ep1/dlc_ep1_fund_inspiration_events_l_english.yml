 fund_inspiration.9001.t:0 "แรงบันดาลใจสิ้นสุดลง"
 fund_inspiration.9001.desc:1 "หายนะ! ท่าน [inspiration_owner.GetTitledFirstName] ผู้รับผลประโยชน์ของข้า ได้ถึงแก่กรรมแล้ว [inspiration_owner.GetSheHe|U] [inspiration_owner.GetDeathReason] ก่อนที่ [inspiration_owner.GetSheHe] จะสามารถเติมเต็มความฝันของ [inspiration_owner.GetHerHis]– เติมเต็มความฝัน #EMP ของข้า#! ได้!\n\n"
 fund_inspiration.9001.desc_weapon:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถตีผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_armor:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถสร้างผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_book:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถเขียนผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_weaver:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถทอผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_adventurer:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่าการผจญภัยของ [inspiration_owner.GetHerHis] จะมอบอะไรให้ข้าได้บ้าง..."
 fund_inspiration.9001.desc_artisan:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถสร้างผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_smith:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถตีผลงานชิ้นเอกแบบใดได้..."
 fund_inspiration.9001.desc_alchemy:0 "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถสร้างหรือค้นพบสิ่งมหัศจรรย์แบบใดได้..."
 fund_inspiration.9001.desc_research: "บัดนี้ข้าจะไม่มีวันรู้เลยว่า [inspiration_owner.GetSheHe] สามารถทำการค้นพบอะไรได้บ้าง..."
 fund_inspiration.9001.a:0 "ช่างเป็นโศกนาฏกรรม!"
 fund_inspiration.9001.a_tt:0 "ท่านหยุดให้ทุนสนับสนุนแรงบันดาลใจของท่าน [inspiration_owner.GetTitledFirstNamePossessive]"

 fund_inspiration.9002.desc:1 "หายนะ! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ถูกจับเป็นเชลยและไม่สามารถทำงานเพื่อเติมเต็มความฝันของ [inspiration_owner.GetHerHis] ที่จะ"
 fund_inspiration.9002.desc_weapon:0 "ตีอาวุธ"
 fund_inspiration.9002.desc_armor:0 "สร้างเกราะ"
 fund_inspiration.9002.desc_book:0 "เขียนตำรา"
 fund_inspiration.9002.desc_weaver:0 "ทอผลงานชิ้นเอก"
 fund_inspiration.9002.desc_adventurer:0 "ออกผจญภัย"
 fund_inspiration.9002.desc_artisan:0 "สร้างสิ่งที่งดงาม"
 fund_inspiration.9002.desc_smith:0 "ตีผลงานชิ้นเอก"
 fund_inspiration.9002.desc_alchemy:0 "เปิดเผยความลึกลับของโลกนี้"
 fund_inspiration.9002.desc_research: "พัฒนานวัตกรรมทางวิทยาศาสตร์ต่อไป"

 fund_inspiration.9003.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ไม่ใช่ข้าราชสำนักของข้าอีกต่อไป ดังนั้นข้าจึงไม่สามารถสนับสนุนความฝันของ [inspiration_owner.GetHerHis] ที่จะ"
 
 fund_inspiration.9004.desc:0 "ท่าน [inspiration_owner.GetTitledFirstName] กลับมายังราชสำนักของข้า ไม่นานนักหลังจากที่ท่าน [inspiration_owner.GetTitledFirstName|U] จากไป"
 fund_inspiration.9004.desc_adventurer_tired_of_europe:0 "\n\nขณะที่ [inspiration_owner.GetSheHe] กลับเข้ามาในราชสำนักของข้า [inspiration_owner.GetSheHe] ก้มลงจูบพื้นดิน แล้วก็รองเท้าของข้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าจะเป็นหนี้บุญคุณท่านตลอดไปที่อนุญาตให้ข้ากลับสู่อารยธรรม... ห่างไกลจากดินแดนที่มืดมนและเต็มไปด้วยเนื้อสัตว์ที่เรียกว่ายุโรป""
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp:0 "กองดิน ใบไม้ และโคลนที่เดินโซเซมาถึงห้องราชสำนักของข้า ข้ารู้สึกว่าเวลาของข้าหมดลงแล้ว บางทีข้าอาจสวดภาวนาไม่พอ แต่เมื่อคนรับใช้ของข้าสาดน้ำถังหนึ่งใส่มัน สิ่งสกปรกก็ถูกชะล้างออกไปเผยให้เห็นท่าน [inspiration_owner.GetTitledFirstName] กลับมาจากหนองบึง [inspiration_owner.GetSheHe|U] รีบวิ่งมาจูบเท้าข้าทันที "ข้าทนไม่ไหวอีกต่อไปแล้ว และข้าดีใจเหลือเกินที่ได้กลับมาสู่โลกอารยะ"\n\nดังนั้น"
 fund_inspiration.9004.a:0 "ตั้งสติหน่อย"

 change_artifact_quality_effect_gain:1 "[artifact|E] ที่ผลิตผ่าน [inspiration.GetName] ของ [artifact_quality_scope.GetShortUINamePossessive|U] จะมี #P คุณภาพสูงขึ้น#!"
