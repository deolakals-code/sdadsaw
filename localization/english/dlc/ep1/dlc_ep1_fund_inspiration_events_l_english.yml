 fund_inspiration.0021.scale.tt:0 "ให้การป้องกันที่ดี แต่ยืดหยุ่นน้อยกว่าแบบอื่นเล็กน้อย"
 fund_inspiration.0021.lamellar:0 "เจ้าจงสร้างเกราะลาเมลลาร์ที่แข็งแรง"
 fund_inspiration.0021.lamellar.tt:0 "เกราะยืดหยุ่นที่ให้การป้องกันยอดเยี่ยมในราคาที่ดีเยี่ยม"
