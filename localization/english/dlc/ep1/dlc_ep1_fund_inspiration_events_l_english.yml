 # Artifact modifications: motto
 fund_inspiration.7010.t:0 "$fund_inspiration.title$ คติพจน์สำหรับยุคสมัย"
 fund_inspiration.7010.desc:0 "ข้าได้ยิน [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] พึมพำกับ [inspiration_owner.GetHerselfHimself] จากอีกฟากของห้องโถง "ข้าต้องการบางสิ่งที่ยิ่งใหญ่ บางสิ่งที่ #EMP สุดยอด#! เพื่อ ทำให้ผลงานของข้าโดดเด่นกว่ามวลชนที่ไร้แรงบันดาลใจ แต่ อะไรล่ะ อะไรดี?"\n\nเมื่อดวงตาที่เปี่ยมไปด้วยจิตวิญญาณของ [inspiration_owner.GetHerHis] สบกับข้า [inspiration_owner.GetSheHe] ก็ยิ้มกว้างและโบกมือให้ข้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U]! เป็นความคิดที่ยอดเยี่ยมอะไร เช่นนี้! #EMP สมบูรณ์แบบ#! พอดี! ท่านคิดอย่างไรกับการเพิ่มคำขวัญประจำตระกูลของท่านลงในผลงานที่ท่านสั่งทำ?""
 fund_inspiration.7010.a:0 "แน่นอน ฟังดูน่ารักดี!"
 fund_inspiration.7010.b:0 "มันโง่เขลาและไม่จำเป็น"
 artifact_motto_inscribed:0 "[newly_created_artifact.GetDesc]\n\nคติพจน์ของตระกูล [owner.GetHouse.GetName] #EMP '[owner.GetHouse.GetMotto]'#! ถูกจารึกไว้อย่างสง่างามที่ด้านหนึ่ง"
 artifact_motto_written:0 "[newly_created_artifact.GetDesc]\n\nคติพจน์ของตระกูล [owner.GetHouse.GetName] #EMP '[owner.GetHouse.GetMotto]'#! ถูกเขียนด้วยรูปแบบที่ตก แต่งอย่างหรูหราบนหน้าแรก"
 artifact_motto_woven:0 "[newly_created_artifact.GetDesc]\n\nคติพจน์ของตระกูล [owner.GetHouse.GetName] #EMP '[owner.GetHouse.GetMotto]'#! ถูกทอไว้อย่างสง่างามเหนือฉากหลัก"
