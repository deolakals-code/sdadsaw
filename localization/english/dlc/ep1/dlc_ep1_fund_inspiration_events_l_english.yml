 fund_inspiration.0061.cabinet:0 "สร้างตู้ที่สวยงาม แต่ใช้งานได้จริง"
 fund_inspiration.0061.diwan:0 "ดิวานที่สวยงามและสะดวกสบาย"
 fund_inspiration.0061.table:0 "ข้าอยากได้โต๊ะที่หรูหรา แต่ก็แข็งแรง!"
 fund_inspiration.0061.throne:0 "สร้างบัลลังก์อันยิ่งใหญ่คู่ควรกับโถงของข้า!"
 fund_inspiration.0061.scientific_apparatus:0 "บางทีอาจเป็นเครื่องมือแห่งการเรียนรู้และความรู้?"
