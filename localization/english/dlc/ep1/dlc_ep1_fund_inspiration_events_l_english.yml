 change_artifact_book_content_quality_effect_gain:1 "เนื้อหาของตำรา [artifact|E] น่าจะมี #P คุณภาพสูงขึ้น#!"
 change_artifact_book_content_quality_effect_loss:1 "เนื้อหาของตำรา [artifact|E] น่าจะมี #N คุณภาพต่ำลง#!"

 fund_inspiration.9005.t:0 "ธุรกิจที่ยังไม่เสร็จสิ้น"
 fund_inspiration.9005.desc_intro:0 "[inherited_insp_owner.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inherited_insp_owner'))] ของข้า ขอคุยด้วยท่ามกลางความสับสนวุ่นวายของการสืบทอด \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ก่อนที่ [old_ruler.GetHerHis] จะสิ้น [old_ruler.GetTitledFirstNameRegnal] ได้มอบหมายงานให้ข้า ข้ากำลังอยู่ระหว่าง [inherited_insp_owner.Custom('InspirationTypeDescription')] ให้ [old_ruler.GetHerHim]" \n\n"
 fund_inspiration.9005.desc_multiple:0 ""ช่างฝีมือคนอื่นๆ ก็ทำงานอยู่ เช่นกัน และพวกเราอยากทราบว่าท่านจะสนับสนุนความพยายามของพวกเราหรือไม่""
 fund_inspiration.9005.desc_single:0 ""งานได้เริ่มไปแล้ว และคงน่าเสียดายหากไม่ ทำให้เสร็จ...""
 fund_inspiration.9005.a:0 "งานจะดำเนินต่อไป!"
 fund_inspiration.9005.b:0 "สิ่งฟุ่มเฟือยเหล่านี้จะสิ้นสุดลง"
 inherited_inspiration_continue_tt:0 "ท่านจะสนับสนุนงานที่ท่าน [old_ruler.GetTitledFirstNamePossessiveRegnal] มอบหมาย"
 inherited_inspiration_end_tt:0 "#X ทองที่ลงทุนไปจะสูญหายทั้งหมด#!"

