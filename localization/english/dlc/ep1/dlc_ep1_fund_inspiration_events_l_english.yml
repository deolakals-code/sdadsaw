 # Alchemy
 fund_inspiration.8001.t:0 "$fund_inspiration.title$ ความหลงใหลในโลหะ"
 fund_inspiration.8001.desc:0 "ข้าพบ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังก้มมองบีกเกอร์ที่บรรจุผงสีเหลืองประหลาด ล้อมรอบด้วยแผ่นหนังและตัวอย่างแร่บางชนิด\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! โปรดดูนี่ เห็นไหมว่ากำมะถันนี้เปลี่ยนสีอย่างไร? นั่นเป็นสัญญาณของการแปรธาตุ มันอาจสร้างเงิน หรือแม้ แต่ทองคำ! หรือดูนี่สิ ว่ามันทำปฏิกิริยากับปรอทอย่างไร? มหัศจรรย์... และแร่นี้ มันมีธรรมชาติเป็นสารหนู ซึ่ง– เอ่อ ข้าขออภัย ฝ่าบาท มันมีเรื่องให้ศึกษามากมายเหลือเกิน! บางทีอาจจะมากเกินไป""
 fund_inspiration.8001.a:0 "เมื่อครู่เจ้าว่าอะไรเกี่ยวกับทองคำนะ?"
 fund_inspiration.8001.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นการศึกษา [inspiration_owner.GetHerHis] ไปที่การสร้างทองคำ"
 fund_inspiration.8001.b:0 "เจ้าว่าเงินรึ?"
 fund_inspiration.8001.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นการศึกษา [inspiration_owner.GetHerHis] ไปที่การสร้างเงิน"
 fund_inspiration.8001.c:0 "ปรอทช่างน่าหลงใหลอย่างแท้จริง"
 fund_inspiration.8001.c.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นการศึกษา [inspiration_owner.GetHerHis] ไปที่ปรอท"
 fund_inspiration.8001.d:0 "เจ้าพูดว่าสารหนูรึ?"
 fund_inspiration.8001.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นการศึกษา [inspiration_owner.GetHerHis] ไปที่สารหนู"
 
 fund_inspiration.8011.t:0 "$fund_inspiration.title$ ความฝันสีทอง"
 fund_inspiration.8011.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เรียกข้าไปที่ห้องทดลองของ [inspiration_owner.GetHerHis] พลางพูดเพ้อเจ้อเกี่ยวกับการค้นพบครั้งใหม่ในการวิจัยของ [inspiration_owner.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่านอยู่นี่! ยอดเยี่ยม โปรดดื่มนี่" [inspiration_owner.GetFirstNameNoTooltip] เชิญข้าเข้าไปในห้องและไปยังโต๊ะที่เกลื่อนไปด้วยแผ่นหนังและบีกเกอร์ มันเป็นหนึ่งในบีกเกอร์เหล่านี้ ที่บรรจุส่วนผสมสีทองบางอย่าง ที่ [inspiration_owner.GetSheHe] ให้ข้าดื่ม "ตอนนี้ มันยังอยู่ในระหว่างดำเนินการ แต่ #EMP มันควรจะ#! มีผลที่น่าทึ่งอย่างแท้จริง!"\n\nหลังจากรออยู่หลายชั่วโมง สิ่งที่ข้ารู้สึกมีเพียงอาการปวดหัวตุบ ๆ คลื่นไส้ และเวียนศีรษะ"
 fund_inspiration.8011.a:0 "เรื่องตลกนี้ควรจะสอนบทเรียนที่เป็นประโยชน์แก่เจ้าบ้าง"
 fund_inspiration.8011.b:0 "โยนนักต้มตุ๋นผู้นี้ลงคุกใต้ดิน!"
 fund_inspiration.8011.c:0 "เจ้ากล้าวางยาพิษข้ารึ?! เจ้าจะต้องถูกแขวนคอ เพราะการนี้!"

 fund_inspiration.8012.t:0 "$fund_inspiration.title$ คริสตจักรและนักต้มตุ๋น"
 fund_inspiration.8012.desc:0 "ข้ากำลังโน้มตัวเหนือโต๊ะ ฟังนักเล่นแร่แปรธาตุของข้า [inspiration_owner.GetTitledFirstName] อธิบายการทดลองล่าสุดของ [inspiration_owner.GetHerHis] เมื่อ [court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] พรวดพราดเข้ามาในห้อง\n\n"งั้นก็จริงน่ะสิ ที่ท่าน #EMP ใช้#! เวลาอยู่กับ... #EMP พวกนอกรีต#! นี่!!" [court_chaplain.GetFirstNameNoTooltip] จ้องมองชามและภาพประกอบที่กระจายอยู่ตรงหน้าเรา และดวงตาของ [court_chaplain.GetHerHis] ก็เย็นชายิ่งขึ้น\n\n"เรื่องนี้ต้องหยุด [ROOT.Char.Custom('FormOfAddressForLiege')] นักต้มตุ๋นคนนี้กำลังชักนำท่านไปในทางที่ผิด!""
 fund_inspiration.8012.a:0 "เจ้าเป็นรึ? เจ้าทำได้อย่างไร?! ออกไปจากอาณาจักรของข้า"
 fund_inspiration.8012.b:0 "[inspiration_owner.GetSheHe|U] กำลังนำข้าไปสู่การรู้แจ้ง!"
 fund_inspiration.8012.b.success:0 "ท่านสามารถโน้มน้าว [court_chaplain.GetFirstNameNoTooltip] ได้"
 fund_inspiration.8012.b.failure:0 "[court_chaplain.GetFirstNameNoTooltip] ไม่เชื่อ"
 fund_inspiration.8012.c:0 "[inspiration_owner.GetSheHe|U] ไม่ได้ทำ เช่นนั้นอย่างแน่นอน"

 fund_inspiration.8013.t:0 "$fund_inspiration.title$ สมบัติแห่งการเล่นแร่แปรธาตุ"
 fund_inspiration.8013.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]" นักเล่นแร่แปรธาตุของข้า [inspiration_owner.GetTitledFirstName] แทบจะวิ่งมาหาข้า ดีใจราวกับเด็ก\n\n"ข้าพบหนังสือเล่มนี้ตอนไปตลาดที่ [barony_market.GetName] มันเป็นหนังสือที่อ้างถึงนักเล่นแร่แปรธาตุในตำนาน จาบีร์ อิบน์ ฮัยยาน – ปรมาจารย์ผู้นั้น! อย่างน้อยก็ตามที่พ่อค้าบอก... ถึงกระนั้น ลองจินตนาการถึงขุมความรู้ที่อยู่ในนี้สิ!""
 fund_inspiration.8013.a:0 "ขอบใจ ข้าจะศึกษาสิ่งนี้"
 fund_inspiration.8013.a_tt:0 "ท่านเก็บหนังสือเล่มนี้ไว้"
 fund_inspiration.8013.b:0 "ข้าเชื่อว่าเจ้าจะใช้ประโยชน์จากหนังสือเล่มนี้ได้ดี"
 fund_inspiration.8013.b_tt:0 "ท่านมอบหนังสือให้ [inspiration_owner.GetShortUINameNoTooltip]"
 fund_inspiration.8013.c:0 "ช่างเป็นการค้นพบที่ยอดเยี่ยม! มันต้องขายได้ราคางามแน่"

 fund_inspiration.8014.t:0 "$fund_inspiration.title$ [inspiration_owner.GetWomanMan|U] นักคิด"
 fund_inspiration.8014.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเหมือนจะไม่เคยทำการทดลองหรือผลิตสิ่งใดเป็นชิ้นเป็นอันเลย [inspiration_owner.GetSheHe|U] เอา แต่นั่งริมหน้าต่าง จ้องมอง วันแล้ววันเล่า\n\nเมื่อข้าทวงถามว่าแท้จริงแล้วข้ากำลังสนับสนุนอะไรอยู่ [inspiration_owner.GetSheHe] ก็แค่ยักไหล่และชี้ออกไปนอกหน้าต่าง "ข้ากำลังครุ่นคิดถึงธรรมชาติของโลก [ROOT.Char.Custom('FormOfAddressForLiege')] มันเป็นโลกที่กว้างใหญ่ ดังนั้นจึงมีเรื่องให้พิจารณามากมาย!""
 fund_inspiration.8014.a:0 "ข้าไม่ได้จ่ายเงินให้เจ้ามานั่งเฉยๆ!"
 fund_inspiration.8014.b:0 "ใช้เวลาของเจ้าเถิด"
 fund_inspiration.8014.c:0 "ข้าจะไม่เสียทองคำไปกับเรื่องไร้สาระนี้!"
 fund_inspiration.8014.c.tt:0 "ท่านขายอุปกรณ์เล่นแร่แปรธาตุทั้งหมดที่ท่านซื้อมา"

 fund_inspiration.8015.t:0 "$fund_inspiration.title$ ในความโศกเศร้า"
 fund_inspiration.8015.desc:0 ""นักเล่นแร่แปรธาตุมีอำนาจเหนือสสารทั้งปวง พวกเขาสามารถสร้างสิ่งมหัศจรรย์ได้ แล้วชีวิตจะต่างกันอย่างไร? [loved_one.GetFirstName] จะต่างกันอย่างไร?!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เพียงแค่ส่ายศีรษะของ[inspiration_owner.GetHerHis] ไม่สนใจความเศร้าโศกของข้า วิทยาศาสตร์จะมีประโยชน์อะไรหากไม่สามารถให้พรข้อนี้แก่ข้าได้?\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าไม่สามารถสร้างปาฏิหาริย์ เช่นนั้นได้ ทว่า ข้าพบว่าหูที่เปิดรับฟังสามารถเป็นเวทมนตร์ในตัวมันเองได้เมื่อความโศกเศร้าคืบคลาน โปรดนั่งลง""
 fund_inspiration.8015.a:0 "แต่– ข้า– ท่านพูดถูก... ขอบใจ"
 fund_inspiration.8015.b:0 "ไม่ เจ้าจะต้องนำ [loved_one.GetHerHim] กลับมาให้ข้า!"
 fund_inspiration.8015.b.tt:0 "[inspiration_owner.GetShortUINameNoTooltip] จะพยายามทำสิ่งที่เป็นไปไม่ได้"

 fund_inspiration.8016.desc:0 "ย่างก้าวของข้าเบาหวิวขณะเดินทางไปยังห้องทดลองของนักเล่นแร่แปรธาตุ [inspiration_owner.GetTitledFirstNamePossessive] โอ้ [loved_one.GetFirstName] ในที่สุดข้าก็จะได้พบเจ้าอีกครั้ง! ทว่า เมื่อ [inspiration_owner.GetTitledFirstNameNoTooltip] เปิดประตู หัวใจของข้าก็หล่นวูบเมื่อเห็นสีหน้าของ [inspiration_owner.GetHerHis] และเหตุใด [inspiration_owner.GetSheHe] จึงไม่ยอมให้ข้ามองเข้าไปในห้อง?\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้า ทำให้ท่านผิดหวัง ได้โปรด อย่า–"\n\nข้าผลัก [inspiration_owner.GetHerHim] ผ่านเข้าไปในห้องทดลอง และสิ่งที่ข้าเห็น... ข้าไม่อาจเข้าใจมันได้ เส้นเอ็น กองเนื้อ ผงและสมุนไพร ทั้งหมดชุ่มโชกไปด้วยเลือดและกระจัดกระจายอยู่ในวงกลมบนพื้น และบนสุดนั้น มีปอยผมเพียงเส้นเดียว ซึ่งเป็นเฉดสีเดียวกับที่ประดับอยู่บนศีรษะของ [loved_one.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.8016.a:0 "ข้า... ข้าคิดว่าข้ากำลังจะอาเจียน"
 fund_inspiration.8016.b:0 "เจ้ากล้าเยาะเย้ยความโศกเศร้าของข้ารึ? ทหาร! จับกุม [inspiration_owner.GetHerHim]!"

 fund_inspiration.8017.t:0 "$fund_inspiration.title$ กลุ่มศึกษา"
 fund_inspiration.8017.desc:0 "ข้าพเจ้าพบ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] และ [court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] กำลังสุมหัวกันเหนือโต๊ะ เปรียบเทียบสิ่งที่ดูเหมือนหินบด\n\n"ท่านเห็นไหม" [inspiration_owner.GetFirstNameNoTooltip] กล่าว "เมื่อท่านให้ความร้อนแก่ผงนี้ มันจะดำก่อน แต่ #EMP จากนั้น#!– โอ้ สวัสดี ข้า แต่[ROOT.Char.GetLadyLord]"\n\n[court_tutor.GetFirstNameNoTooltip] เงยหน้าขึ้นเมื่อได้ยินคำทักทายและมีท่าทีละอายใจเล็กน้อย [court_tutor.GetSheHe] ควรจะกำลังเตรียมการบรรยายสำหรับวันพรุ่งนี้"
 fund_inspiration.8017.a:0 "เป็นการดีที่พวกเจ้าแบ่งปันความรู้"
 fund_inspiration.8017.b:0 "น่าละอายทั้งคู่ กลับไปทำงาน!"

 fund_inspiration.9000.t:0 "$fund_inspiration.title$ โจรบนเส้นทาง"
 fund_inspiration.9000.desc:0 ""นายท่าน นักผจญภัย [adventurer.GetFirstName] ส่งข่าวมา!" คนรับใช้ร้องอุทาน ยื่นจดหมายออกมา\n\n"เป็นเวลาสิบวันสิบคืนแล้วที่ข้าและคณะซ่อนตัวอยู่ โจร [bandit.GetLadyLord] [bandit.GetFirstName] ได้ตั้งด่านขวางถนนที่เราต้องเดินทาง — ท่านแนะนำว่าอย่างไร? ความระมัดระวัง? หรือเราควรสู้กับพวกเขา โดยเชื่อมั่นว่า [adventurer.GetFaith.HighGodName] จะคุ้มครองเราให้ปลอดภัย? ลงนาม [adventurer.GetFirstName]" ข้อความบนกระดาษหนังกล่าว\n\nดูเหมือนว่า [adventurer.GetSheHe] กำลังตกอยู่ในสถานการณ์ที่ยากลำบากทีเดียว"
 fund_inspiration.9000.a:0 "จงซ่อนตัวต่อไป ในที่สุดพวกมันก็จะจากไป"
 fund_inspiration.9000.b:0 "ไม่กล้า ก็ไม่มีเกียรติ! ทำให้พวกมันชดใช้ที่ ทำให้ข้าเสียเวลา"
 fund_inspiration.9000.c:0 "ทองคำนี้น่าจะเพียงพอเป็นสินบน เพื่อให้พวกเจ้าผ่านไปได้"
 artifact_bandit_skull:0 "กะโหลกของโจร-[killed.GetLadyLord|U] [killed.GetTitledFirstName] ผู้ ซึ่งถูกสังหารโดยนักผจญภัย [creator.GetTitledFirstName] ใน [background_wilderness_scope.GetName] และต่อมาได้มอบเป็นของขวัญแก่ [owner.GetTitledFirstName] มันมีรอยยิ้มอันน่าสะพรึงกลัวและเบ้าตาที่ว่างเปล่าไร้ชีวิต"
 fund_inspiration.9000.b.critical_success:0 "[adventurer.GetFirstNameNoTooltip] สังหาร [bandit.GetFirstNameNoTooltip] อย่างกล้าหาญ"
 fund_inspiration.9000.b.boil_skull:0 "[adventurer.GetFirstNameNoTooltip] ต้มและทำความสะอาดกะโหลกของ [bandit.GetFirstNamePossessiveNoTooltip] และส่งมาให้ท่านเพื่อใช้เป็น [court_artifact|E]"
 fund_inspiration.9000.b.success:0 "[adventurer.GetFirstNameNoTooltip] ขับไล่โจรออกไปได้สำเร็จ"
 fund_inspiration.9000.b.failure:0 "[adventurer.GetFirstNameNoTooltip] ได้รับบาดเจ็บจาก [bandit.GetFirstNameNoTooltip]"
 fund_inspiration.9000.b.critical_failure:0 "[adventurer.GetFirstNameNoTooltip] ถูกสังหารโดย [bandit.GetFirstNameNoTooltip]"
 fund_inspiration.9000.a.critical_success:0 "[adventurer.GetFirstNameNoTooltip] หลบหนีไปในตอนกลางคืน... และขโมยทองคำของ [bandit.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.9000.a.success:0 "[adventurer.GetFirstNameNoTooltip] หลบหนีไปในตอนกลางคืน"
 fund_inspiration.9000.a.failure:0 "[adventurer.GetFirstNameNoTooltip] ถูกจับได้ขณะพยายามลอบผ่านค่าย"
 
 fund_inspiration.9100.t:0 "$fund_inspiration.title$ [adventurer.Custom('GetAnimalPlural')|U] [adventurer.Custom('GetAnimalAdjective')|U] ใน [background_wilderness_scope.Custom('TerrainTypeProvince')|U]"
 fund_inspiration.9100.desc:0 ""ข้า แต่[ROOT.Char.GetLadyLord|U] มีสาส์นจากนักผจญภัยของท่าน [adventurer.GetFirstName]" คนรับใช้กล่าว พลางยื่นม้วนสาส์นให้ข้าพเจ้า\n\n"การค้นหาของข้าพเจ้าได้นำข้าพเจ้ามายัง [background_wilderness_scope.Custom('TerrainTypeProvince')] แห่ง [background_wilderness_scope.GetName] ที่นี่ขึ้นชื่อว่าชุกชุมไปด้วย [adventurer.Custom('GetAnimalType')] แต่ข้าพเจ้ามีเหตุผลอันดีที่จะคิดว่าเป้าหมายของข้าพเจ้าอยู่ใกล้แล้ว! โปรดคาดหวังการกลับมาของข้าพเจ้าในไม่ช้า ลงนาม [adventurer.GetFirstNameNoTooltip]" ข้อความในสาส์นระบุ\n\n[adventurer.GetSheHe|U] ช่างทะเยอทะยานเสียจริงที่เลือกเส้นทางอันเสี่ยงภัย เช่นนี้..."
 fund_inspiration.9100.a:0 "ความรู้ของ [adventurer.GetFirstNamePossessiveNoTooltip] น่าจะเพียงพอที่จะ ทำให้ [adventurer.GetHerHim] ปลอดภัย..."
 fund_inspiration.9100.b:0 "ขอ [ROOT.Char.GetFaith.HighGodName] คุ้มครอง ข้าหวังว่า [adventurer.GetSheHe] จะไม่ต้องสู้กับมันสักตัว!"
 fund_inspiration.9100.c:0 "[adventurer.GetFirstNameNoTooltip] เป็นคนรอบคอบ พวกเขาจะใช้เส้นทางอ้อมที่ยาวกว่า"
 fund_inspiration.9100.a.success:0 "[adventurer.GetFirstNameNoTooltip] หลีกเลี่ยง [adventurer.Custom('GetAnimalPlural')|U] ใดๆ ได้สำเร็จ"
 fund_inspiration.9100.a.failure:0 "[adventurer.GetFirstNameNoTooltip] ถูกโจมตีโดย [adventurer.Custom('GetAnimalType')]!"
 fund_inspiration.9100.b.success:0 "[adventurer.GetFirstNameNoTooltip] สังหาร [adventurer.Custom('GetAnimalType')] ป่าที่กำลังพุ่งเข้ามา"
 fund_inspiration.9100.b.failure:0 "[adventurer.GetFirstNameNoTooltip] ถูกกำราบโดย [adventurer.Custom('GetAnimalType')] ป่าที่กำลังพุ่งเข้ามา"
 fund_inspiration.9100.b.maimed:0 "[adventurer.GetFirstName] พิการโดย [adventurer.Custom('GetAnimalType')]"
