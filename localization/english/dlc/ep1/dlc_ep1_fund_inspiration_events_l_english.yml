 fund_inspiration.0041.option_nature:0 "สิ่งที่แสดงความงามอันดิบเถื่อนของธรรมชาติ"
 fund_inspiration.0041.option_history:0 "สิ่งที่แสดงประวัติศาสตร์ของ [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 fund_inspiration.0041.option_life:0 "ภาพแทนชีวิตในดินแดนของข้า"

 #fund_inspiration.0042.desc: ""Thank you for putting your trust in me, [ROOT.Char.Custom('FormOfAddressForLiege')]! [inspiration_owner.GetTitledFirstName] smiles and continues "The idea I have for [inspiration_owner.Custom('InspirationTypeDescription')] is glorious indeed, and is sure to impress all of your courtiers and foreign guests!"\n\n"As soon as I am done, I shall send word to you so that you may be the first to gaze upon my work."

 fund_inspiration.0042.t:0 "ให้ทุนสนับสนุนแรงบันดาลใจช่างทอ"

# Adventurer
 fund_inspiration.0051.desc:0 ""อย่าได้กังวล [ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่ของข้า" [inspiration_owner.GetTitledFirstName] คำนับอย่างมีจริตจะก้านและ [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))]\n\n"ข้าจะออกไปผจญภัยและสำรวจโลกแทนท่าน ในขณะที่ท่านยังคงปกครองดินแดนของท่านต่อไป สิ่งที่ข้าจะนำกลับมานั้นจะมีคุณภาพสูงส่ง จนท่านจะรู้สึกถึงความสำเร็จของข้าที่ #EMP แผ่ซ่าน#! ผ่านของที่ระลึกจากการผจญภัยของข้า!"\n\nมีความเงียบเล็กน้อยก่อนที่ [inspiration_owner.GetSheHe] จะกล่าวต่อ "ในเรื่องนั้น มีพื้นที่ใดในโลกที่ท่านสนใจหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?""
