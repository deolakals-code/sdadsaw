 fund_inspiration.0021.desc:0 ""ท่านจะไม่เสียใจที่สนับสนุนข้า [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] รับรองกับข้าว่า [inspiration_owner.GetSheHe] จะสร้างผลงานชิ้นเอก แต่ก็ให้ความสำคัญกับความคิดเห็นของข้า เช่นกัน "โปรดบอกข้าเถิด ท่านปรารถนาเกราะประเภทใด?""
