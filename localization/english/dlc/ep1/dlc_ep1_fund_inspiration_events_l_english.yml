# Tapestry
 fund_inspiration.0041.desc:0 ""ขอบคุณที่ไว้วางใจในตัวข้า [ROOT.Char.Custom('FormOfAddressForLiege')]! [inspiration_owner.GetTitledFirstName] ยิ้มและกล่าวต่อ "ความเชื่อมั่นของท่านไม่ผิดที่ผิดทาง ด้วยข้าได้ใช้เวลาหลายปีฝึกฝนเทคนิคและทอพรมกับผ้าม่านอันงดงามอย่างแท้จริงไว้บ้างแล้ว"\n\n"แต่สำหรับท่าน ข้าคิดว่าพรมผนังน่าจะดีที่สุด — ผืนที่ทออย่างดีสามารถดึงดูดความสนใจของห้องและบอกเล่าบางสิ่งเกี่ยวกับเจ้าของได้ คำถามเดียวคือ พรมผนังควรแสดงภาพอะไร?""
 fund_inspiration.0041.option_battle:0 "เครื่องบรรณาการแด่ชัยชนะของข้าในสมรภูมิ [ROOT.Var('epic_battle_location').Province.GetNameNoTooltip]"
