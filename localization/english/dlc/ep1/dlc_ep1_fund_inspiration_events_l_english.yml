 # INSPIRATION ONGOING 
 fund_inspiration.title:1 "แรงบันดาลใจ:"
 fund_inspiration.2001.t:1 "$fund_inspiration.title$ ขอเงินทุน"
 fund_inspiration.2001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนกรานว่าเงินทุนที่ข้ามอบให้ [inspiration_owner.GetHerHim] นั้นไม่เพียงพอที่จะสร้างสิ่งประดิษฐ์ที่คู่ควรกับฐานะของข้า\n\n"ด้วยทองอีกเพียงเล็กน้อย ข้าสามารถสร้างสิ่งที่ #EMP งดงามอย่างแท้จริง#! ได้!""
 fund_inspiration.2001.a:0 "เท่าไหร่ก็ได้ตามที่เจ้าต้องการ!"
 fund_inspiration.2001.b:0 "ใช้เท่าที่มีไปก่อน"

 fund_inspiration.2002.t:0 "$fund_inspiration.title$ ขอ... วัตถุดิบ"
 fund_inspiration.2002.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กล้าดีถึงขนาดเรียกข้าไปยังห้องที่น่าสังเวชและเหม็นเน่าของ [inspiration_owner.GetHerHis]\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] งานกำลังคืบหน้า แต่ถ้าข้ามีชิ้นส่วนเพิ่มอีกสักหน่อย... วัสดุจาก #EMP มนุษย์#! ข้าสามารถสร้างสิ่งที่ #EMP น่าทึ่งอย่างแท้จริง#! ได้ ข้าต้องการคนที่ยังมีชีวิต อย่างน้อยก็ในตอนแรก"\n\nขณะที่ [inspiration_owner.GetFirstName] สิ้นสุดคำขอของ [inspiration_owner.GetHerHis] "
 fund_inspiration.2002.desc.fingernails:0 "สายตาของข้าจับจ้องไปที่เครื่องมือเปื้อนเลือดและเล็บที่ถูกฉีกออกกระจัดกระจายอยู่บนโต๊ะของ [inspiration_owner.GetHerHis]"
 fund_inspiration.2002.desc.potions:1 "สายตาของข้าเหม่อมองไปยังโต๊ะและชั้นวางที่เต็มไปด้วยชิ้นส่วนสัตว์ลึกลับ ของเหลวสีสันสดใส และพืชที่ดูอันตราย"
 fund_inspiration.2002.desc.blind:0 "ข้าได้ยินเสียงครวญครางและสะอื้นเบาๆ จากคนอื่นในห้อง หลังจากสะอึกหลายครั้ง เสียงอาเจียนที่ฟังดูเจ็บปวดก็ตามมาพร้อมกับกลิ่นกรดรุนแรงของอาเจียน"
 fund_inspiration.2002.a:0 ""ใช้คนในคุกใต้ดินของข้าตามที่เจ้าเห็นสมควร""
 fund_inspiration.2002.b:1 ""นี่ เหรียญสำหรับลักพาตัวชาวบ้านสองสามคน""
 fund_inspiration.2002.c:0 ""ชายแดนอยู่ไม่ไกล ไปลักพาตัวชาวบ้านต่างชาติมา""
 fund_inspiration.2002.toast_outcome.negative:0 "หลักฐานชี้ว่าท่านเป็นสาเหตุของการหายตัวไปของชาวบ้าน"
 fund_inspiration.2002.toast_outcome.positive:0 "ท่านรอดพ้นจากการลักพาตัวชาวบ้าน"
 fund_inspiration.2002.d:0 "ปฏิเสธคำขอของท่าน [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]"

 fund_inspiration.2003.t:0 "$fund_inspiration.title$ การขัดจังหวะ"
 fund_inspiration.2003.desc:0 ""สาบานต่อ #EMP [inspiration_owner.GetFaith.HighGodName]#! เจ้า [previous_inspired.GetWomanMan]! ปล่อยข้าไว้คนเดียว!"\n\nบรรยากาศอันเงียบสงบถูกทำลายลงด้วยเสียงตะโกนของ [inspiration_owner.GetFirstName] ขณะที่ [inspiration_owner.GetSheHe] บุกเข้ามาในลานบ้าน ท่าน [previous_inspired.GetFirstName] ตามมาอย่างรวดเร็ว แต่หยุดเมื่อ [previous_inspired.GetSheHe] เห็นข้า\n\n"[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U] โปรดพูดให้ [inspiration_owner.GetFirstNameNoTooltip] เข้าใจหน่อย! ข้าพยายามช่วย [inspiration_owner.GetHerHim] เนื่องจากข้ามีประสบการณ์บางอย่างที่อาจปรับปรุงงานของ [inspiration_owner.GetHerHis] ได้!""
 fund_inspiration.2003.a:0 "โน้มน้าวให้ [inspiration_owner.GetFirstNameNoTooltip] ฟัง [previous_inspired.GetFirstNameNoTooltip]"
 fund_inspiration.2003.b:1 ""มาเถอะ อย่างน้อยก็ฟัง [previous_inspired.GetHerHim] หน่อย""
 fund_inspiration.2003.c:0 "สั่งให้ [previous_inspired.GetFirstNameNoTooltip] ปล่อย [inspiration_owner.GetFirstNameNoTooltip] ไว้ตามลำพัง"
 fund_inspiration.2003.toast_outcome.positive:0 "[inspiration_owner.GetFirstNameNoTooltip] ฟัง [previous_inspired.GetFirstNameNoTooltip]"
 fund_inspiration.2003.toast_outcome.refusal:0 "[inspiration_owner.GetFirstNameNoTooltip] ปฏิเสธที่จะฟัง"
 fund_inspiration.2003.toast_outcome.negative:0 "[previous_inspired.GetFirstNameNoTooltip] ให้ข้อเสนอแนะที่ไม่ดี"

 fund_inspiration.2004.t:0 "$fund_inspiration.title$ คุณภาพสูงสุด"
 fund_inspiration.2004.desc_metal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูโลหะนั่นสิ! ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_fabric:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูผ้านั่นสิ! เส้นใย ความลึกของสี... ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_thread:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูด้ายนั่นสิ! ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน""
 fund_inspriation.2004.desc_paint: "ใต้ฝ่า [ROOT.Char.GetLadyLord] ของข้า ดูเม็ดสีนั่นสิ! ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_wood:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูไม้นั่นสิ! ลายไม้ ความหนาแน่น... ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน!""
 fund_inspiration.2004.desc_paper:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูกระดาษนั่นสิ! ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_ink:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูหมึกนั่นสิ! สีสัน ความอิ่มตัว... ข้าไม่เคยเห็นคุณภาพดี เช่นนี้มาก่อน!""
 fund_inspiration.2004.desc_alchemy_metal:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูนั่นสิ! ข้าไม่เคยเห็นแร่บริสุทธิ์ เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_elixirs:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูบีกเกอร์เหล่านั้นสิ! ข้าไม่เคยเห็นแก้วใส เช่นนี้มาก่อน""
 fund_inspiration.2004.desc_fallback:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] ดูนั่นสิ! ข้าไม่เคยเห็นวัสดุชั้นดี เช่นนี้มาก่อน""
 fund_inspiration.2004.desc:0 "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] แยกตัวออกจากขบวนตลาดของเราเพื่อเข้าไปหาพ่อค้าที่ขายสินค้าที่เป็นที่ต้องการ รู้สึกปลาบปลื้มกับการค้นพบของ [inspiration_owner.GetHerHis]\n\n"ด้วยสิ่งนี้ โครงการของข้าจะก้าวไปสู่ระดับใหม่ ข้าสามารถสร้างสิ่งที่ #EMP มหัศจรรย์อย่างแท้จริง#! ได้! โปรดเถิด ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] มอบของขวัญนี้แก่ข้า""
 fund_inspiration.2004.a:0 "โครงการของเจ้าคุ้มค่าแก่การลงทุน!"
 fund_inspiration.2004.b:0 "แน่นอน แต่เราน่าจะได้ราคาที่ยุติธรรมนะ?"
 fund_inspiration.2004.b.success:0 "พ่อค้าถูกโน้มน้าวให้ลดราคา"
 fund_inspiration.2004.b.failure:0 "พ่อค้าไม่ถูกโน้มน้าว"
 fund_inspiration.2004.c:0 "แน่นอน ทหาร ยึดสิ่งที่ [inspiration_owner.GetFirstNameNoTooltip] ต้องการ"
 fund_inspiration.2004.d:0 "เจ้าคิดว่าข้าทำมาจากเงินหรือ?"
 
 fund_inspiration.2005.t:1 "$fund_inspiration.title$ เตาหลอมใหม่"
 fund_inspiration.2005.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยใบหน้าบึ้งตึง คิ้วไหม้ และโลหะบิดงอ\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าไม่ได้ตั้งใจลบหลู่ แต่โรงตีเหล็กของท่านนี่..."
 fund_inspiration.2005.desc_weapon:0 "เอาเป็นว่าถ้าท่านต้องการให้ [inspiration_owner.Custom('ArtifactWeaponType')] ใช้งานได้เลย"
 fund_inspiration.2005.desc_armor:1 "เอาเป็นว่าถ้าท่านต้องการให้ [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] ใช้งานได้เลย"
 fund_inspiration.2005.desc_smith:0 "เอาเป็นว่าถ้าท่านต้องการให้ [inspiration_owner.Custom('InspirationSmithType')] สง่างามเลย"
 fund_inspiration.2005.desc_ending:0 "ท่านจะต้องลงทุนซื้ออันใหม่""
 fund_inspiration.2005.a:0 "แน่นอน อะไรก็ได้ที่เจ้าต้องการ"
 fund_inspiration.2005.b:0 "มันเป็นเตาหลอมที่ดีเยี่ยม!"

 fund_inspiration.2006.t:0 "$fund_inspiration.title$ บัณฑิตพเนจร"
 fund_inspiration.2006.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName] ของข้า พา [scholar_character.GetWomanMan] ผู้หนึ่งมาต่อหน้าข้า ยิ้มแย้มและสรรเสริญเยินยอ\n\n"นี่คือ [scholar_character.GetTitledFirstName] นักวิชาการผู้ทรงคุณวุฒิในแวดวงของข้า"\n\n[scholar_character.GetWomanMan] ผู้นั้นคำนับและแสดงท่าทีทั้งยินดีและเขินอายในคราวเดียวกัน "ได้โปรด ไม่จำเป็นต้องขนาดนั้น ข้ามาที่นี่เพื่อรับใช้ท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] หากท่านพอใจ""
 fund_inspiration.2006.a:0 "ข้าพอใจ โปรดช่วยเหลือ [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2006.b:0 "แน่นอน ท่านจะเป็นอาจารย์ส่วนตัวของข้า"
 fund_inspiration.2006.c:0 "ท่านจะหาบ้านที่นี่ไม่ได้"

 fund_inspiration.2021.desc:1 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยืนกรานว่าการจะสร้างชุดเกราะที่คู่ควรกับ [ROOT.Char.GetTitleAsNameNoTooltip] ผู้รุ่งโรจน์อย่างข้า [inspiration_owner.GetSheHe] จะต้องการเงินทุนเพิ่ม\n\n"[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U] ไม่ใช่ของถูกที่จะสร้าง แค่วัสดุก็... นี่ไม่ใช่เวลาที่จะตระหนี่ [ROOT.Char.Custom('FormOfAddressForLiege')]!""
 fund_inspiration.2021.a:0 "เจ้าจะได้เงินไป"
 fund_inspiration.2021.b:0 "ข้าจะไม่ให้ทองเจ้าอีก"

 fund_inspiration.2030.t:0 "$fund_inspiration.title$ คำพูดที่เป็นมิตร"
 fund_inspiration.2030.desc:0 "สหายของข้า ท่าน [friend.GetTitledFirstName] หยุดข้าในโถงด้วยรอยยิ้มกว้าง \n\n"อ่า #EMP นั่น#! ท่านอยู่นี่เอง [ROOT.Char.GetFirstNameNoTooltip]! ข้าเพิ่งคุยกับท่าน [inspiration_owner.GetTitledFirstName]! ข้าได้ยินว่า [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] ให้ท่าน — ข้าอดไม่ได้ที่จะไปเยี่ยม [inspiration_owner.Custom('GetInspirationTypeRoom')] ของ [inspiration_owner.GetHerHis]!" \n\n"ข้าคุยกับ [inspiration_owner.GetHerHim] เกี่ยวกับวิธีที่จะตอบสนองความคาดหวังของท่าน ข้าคิดว่าท่านจะชอบผลลัพธ์!""
 fund_inspiration.2030.a:0 ""โอ้! ขอบคุณ [friend.GetFirstNameNoTooltip]!""

 fund_inspiration.2040.t:0 "$fund_inspiration.title$ การก่อวินาศกรรม"
 fund_inspiration.2040.desc:0 "เสียงร้องอย่างหัวเสียของ [inspiration_owner.GetTitledFirstNamePossessive] ทำลายช่วงเวลาอันเงียบสงบ: "ข้าจะ [inspiration_owner.Custom('InspirationTypeDescription')] ต่อไปได้อย่างไร ในเมื่อ [inspiration_owner.Custom('GetInspirationTypeTool')] ของข้าหายไปตลอด?!" \n\n[inspiration_owner.GetSheHe|U] รีบวิ่งมาหาข้า "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ทุกครั้งที่ข้ามีความคืบหน้า ดูเหมือนจะมีบางอย่างผิดพลาด! ข้ามั่นใจว่ามีคนในราชสำนักกำลังยุ่งเกี่ยวกับงานของข้า!" \n\n[inspiration_owner.Custom('GetInspirationOwnerType')] ผู้นั้นถอนหายใจอย่างฉุนเฉียวและเดินกระทืบเท้ากลับไปที่ [inspiration_owner.Custom('GetInspirationTypeRoom')] ของ [inspiration_owner.GetHerHis]"
 fund_inspiration.2040.a:0 "ช่างเป็นมือสมัครเล่น"
 fund_inspiration.2040.b:0 "ข้าจ่ายเงินเพื่อคุณภาพ ไม่ใช่ละคร!"
 fund_inspiration.2040.c:0 "จะเป็นไปได้ไหม... ไม่... #EMP ท่าน [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.c.tt:0 "ผู้ก่อกวนถูกจับกุม"
 fund_inspiration.2040.c.flavor:0 "ถึงเวลาวางกับดัก!"
 fund_inspiration.2040.c.success:0 "ท่านจับผู้ก่อวินาศกรรมได้"
 fund_inspiration.2040.c.failure:0 "ผู้ก่อวินาศกรรมหลบหนีท่านไปได้"
 ep1_fund_inspiration_2040_scheme_modifier:0 "การกระทำลับๆ"
 ep1_fund_inspiration_2040_scheme_modifier_desc:0 "ตัวละครนี้เป็นนักย่องเบาที่เก่งกาจ"

 fund_inspiration.2041.desc:0 "หลังอาหารค่ำ ข้าซุ่มรอใกล้ห้องของท่าน [inspiration_owner.GetTitledFirstNamePossessive] พร้อมทหารองครักษ์จำนวนหนึ่ง เฝ้าดูทางเดินขณะที่ [ROOT.Char.Custom('FortifiedBuilding')] มืดลง \n\nขณะที่ข้ากำลังคิดจะยอมแพ้ แสงสั่นไหวก็เต้นรำลงมาตามทางเดิน ตามด้วยเงาร่างในเสื้อคลุม\n\nร่างมืดผลักประตูห้อง [inspiration_owner.Custom('GetInspirationTypeRoom')] เปิดออกและตรวจสอบทางเดินอย่างลับๆ อีกครั้ง ใบหน้าของ [rival.GetHerHis] สว่างขึ้นด้วยแสงตะเกียงน้ำมันที่ริบหรี่: ท่าน [rival.GetTitledFirstName]!"
 fund_inspiration.2041.a:0 ""อะฮ่า! ไปยังคุกใต้ดิน!""
 fund_inspiration.2041.b:0 ""โยน [rival.GetHerHim] ออกไปจาก [ROOT.Char.Custom('FortifiedBuilding')]!""
 fund_inspiration.2041.c:0 "ข้าจะจัดการเรื่องนี้ด้วยวิธีของข้าเอง..."

 fund_inspiration.2050.t:0 "$fund_inspiration.title$ ความเห็นที่ผ่านการพิจารณา"
 fund_inspiration.2050.desc:0 "[inspiration_owner.Custom('GetInspirationOwnerType')] ของข้า ท่าน [inspiration_owner.GetTitledFirstName] รายงานความคืบหน้าของ [inspiration_owner.GetHerHis] ให้ข้าฟัง พร่ำบ่นเกี่ยวกับข้อจำกัดของ [inspiration_owner.Custom('GetInspirationTypeTool')] และ [inspiration_owner.Custom('GetInspirationTypeStation')] ขณะที่ความคิดอันกล้าหาญสำหรับ [inspiration_owner.Custom('GetInspirationTypeObject')] ของข้าวนเวียนอยู่ในหัว... \n\n[inspiration_owner.Custom('GetInspirationTypeVerb')|U] อาจไม่ใช่ความถนัดส่วนตัว #EMP ของข้า#! แต่นั่นไม่ได้หมายความว่าข้าจะไม่มีสิทธิ์แสดงความคิดเห็นว่าเงินของข้าถูกใช้อย่างไร!"
 fund_inspiration.2050.a:0 "ข้ามีข้อเสนอแนะสองสามอย่าง..."
 fund_inspiration.2050.b:0 "ภูมิหลังของข้าให้ข้อมูลเชิงลึกที่ไม่เหมือนใครแก่ข้า"
 fund_inspiration.2050.c:0 "ท่านเคยพิจารณามุมมอง #EMP นี้#! หรือไม่?"
 fund_inspiration.2050.d:0 "ให้ข้าดูภาพร่างของท่านหน่อย..."
 fund_inspiration.2050.e:0 "ไม่ ท่าน [inspiration_owner.GetFirstNameNoTooltip] รู้ว่า [inspiration_owner.GetSheHe] กำลังทำอะไรอยู่"
 fund_inspiration.2050.success:0 "ความคิดของท่านใช้ได้ผลดี"
 fund_inspiration.2050.nothing:0 "ท่านถูกเพิกเฉย"
 fund_inspiration.2050.failure:0 "ความคิดของท่านไม่ดี"
 fund_inspiration_half_refund_tt:0 "ครึ่งหนึ่งของการลงทุนของท่านจะถูกส่งคืน:"
 fund_inspiration_quarter_refund_tt:0 "หนึ่งในสี่ของการลงทุนของท่านจะถูกส่งคืน:"

 fund_inspiration.2060.t:0 "$fund_inspiration.title$ สมบัติของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 fund_inspiration.2060.desc.religious:0 "ความศรัทธาของข้าถูกใช้เป็นตัวอย่างโดยทุกคน ตั้งแต่กษัตริย์ผู้ยิ่งใหญ่ไปจนถึงขอทานผู้ต่ำต้อย และด้วยเหตุนั้น สาวกจึงตามมา"
 fund_inspiration.2060.desc.fame:0 "การกระทำของข้าถูกกล่าวถึงด้วยความเคารพและความอิจฉาทั่วโลก ตั้งแต่ราชสำนักต่างแดนไปจนถึงโรงเตี๊ยมในหมู่บ้าน และด้วยเหตุนั้น ผู้สนับสนุนจึงตามมา"
 fund_inspiration.2060.desc.court:0 "ราชสำนักอันหรูหราของข้าเป็นที่ชิงชังและเฉลิมฉลองไปทั่วโลก ทุกคนปรารถนาที่จะเทียบเคียงและเพลิดเพลินกับความงดงามของมัน และด้วยเหตุนั้น ผู้ชื่นชมจึงตามมา"
 fund_inspiration.2060.desc:0 "\n\nวันนี้ ท่าน [donator.GetTitledFirstName] ได้รับการนำเข้าเฝ้า และแนะนำในฐานะตัวแทนของ "
 
 fund_inspiration.2060.desc.brotherhood:0 "คณะ [donator.Custom('SisterBrother')] [donator.GetFaith.GetAdjectiveNoTooltip] เล็กๆ จาก [barony_scope.GetNameNoTierNoTooltip] ใน [barony_scope.GetDeJureLiege.GetNameNoTier]\n\n"
 fund_inspiration.2060.desc.abbey:0 "[donator.GetFaith.HouseOfWorship] [donator.GetFaith.GetAdjectiveNoTooltip] เล็กๆ แห่ง [barony_scope.GetAdjectiveNoTooltip] ใน [barony_scope.GetDeJureLiege.GetNameNoTier]\n\n"
 fund_inspiration.2060.desc.mercenary:1 "กองทหารรับจ้าง [donator.GetCulture.GetNameNoTooltip] เล็กๆ จาก [barony_scope.GetNameNoTierNoTooltip] ใน [barony_scope.GetDeJureLiege.GetNameNoTier]\n\n"
 fund_inspiration.2060.desc.guild:0 "สมาคม [donator.Custom('dummy_peasant_profession')] เล็กๆ จาก [barony_scope.GetNameNoTierNoTooltip] ใน [barony_scope.GetDeJureLiege.GetNameNoTier]\n\n"
 fund_inspiration.2060.piety:0 ""ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ศักดิ์สิทธิ์ที่สุด!"
 fund_inspiration.2060.saoshyant:0 ""เซาชยันต์แห่งสวรรค์!"
 fund_inspiration.2060.savior:0 ""ผู้ช่วยให้รอดอันศักดิ์สิทธิ์!"
 fund_inspiration.2060.saint:0 ""นักบุญผู้เป็นที่เคารพ!"
 fund_inspiration.2060.prestige:0 ""โอ้ ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยอดเยี่ยม!"
 fund_inspiration.2060.grandeur:1 ""โอ้ ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ไร้เทียมทาน!"
 fund_inspiration.2060.desc_outro:0 "สหายของข้าและข้าได้ยินถึง [inspiration_owner.Custom('GetInspirationTypeObject')] อันน่าอัศจรรย์ที่กำลังสร้างขึ้นเพื่อท่าน และปรารถนาที่จะบริจาคให้กับ [inspiration_owner.Custom('GetInspirationOwnerType')] ของท่าน! มันจะเป็นเกียรติอย่างยิ่งแก่พวกเรา ฝ่าบาท — พวกเราเก็บออมมาหลายเดือน!""
 fund_inspiration.2060.a:0 ""เป็น #EMP ข้า#! ต่างหากที่ได้รับเกียรติ""
 fund_inspiration.2060.b.religious:0 ""ไม่ โปรดเถิด ท่าน [donator.Custom('NunMonk')] ผู้ใจดี เก็บไว้เถอะ""
 fund_inspiration.2060.b.prestige:0 ""ไม่ ข้าปฏิเสธ! เก็บไว้เถอะ สหาย!""
 fund_inspiration.2060.c:0 ""มีแค่นี้หรือ?""

 ep1_fund_inspiration_2070_accept_modifier:0 "รับของขวัญแล้ว"
 ep1_fund_inspiration_2070_accept_modifier_desc:0 "เคาน์ตีนี้ยินดีที่มีส่วนร่วมในสิ่งประดิษฐ์อันล้ำค่าของผู้ปกครอง"
 ep1_fund_inspiration_2070_refuse_modifier:0 "ปฏิเสธของขวัญ"
 ep1_fund_inspiration_2070_refuse_modifier_desc:0 "เคาน์ตีนี้ไม่พอใจที่ของขวัญถูกปฏิเสธ แต่ตอนนี้มีเงินทุนเหลือเฟือ"
 ep1_fund_inspiration_2070_mock_modifier:0 "เยาะเย้ยของขวัญ"
 ep1_fund_inspiration_2070_mock_modifier_desc:0 "เคาน์ตีนี้ไม่พอใจที่ของขวัญถูกผู้ปกครองเยาะเย้ย"

 fund_inspiration.2070.t:0 "$fund_inspiration.title$ อัญมณีมีตำหนิ"
 fund_inspiration.2070.desc:0 "เนื่องจากมัว แต่ยุ่งกับกิจการในราชสำนัก ข้าจึงปล่อยให้ข่าวจาก [inspiration_owner.Custom('GetInspirationOwnerType')] ของข้า ท่าน [inspiration_owner.GetTitledFirstName] ล่าช้าออกไปเรื่อยๆ"
 fund_inspiration.2070.desc.stalled:0 "ตอนนี้งาน [inspiration_owner.Custom('GetInspirationTypeObject')] ของข้าหยุดชะงักไปโดยสิ้นเชิง และดูเหมือนว่าข้าไม่ได้เป็นฝ่ายผิดทั้งหมด...\n\n"
 fund_inspiration.2070.desc.wasted:0 "ตอนนี้งานหลายสัปดาห์บน [inspiration_owner.Custom('GetInspirationTypeObject')] ของข้าสูญเปล่าไป และดูเหมือนว่าข้าไม่ได้เป็นฝ่ายผิดทั้งหมด...\n\n"
 fund_inspiration.2070.desc.lunatic:0 "ข้าได้รับแจ้งเกี่ยวกับอาการหลงผิดและพฤติกรรมผิดปกติของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] เปลี่ยนใจตลอดเวลาและเริ่มต้นใหม่ และเทคนิค [inspiration_owner.Custom('GetInspirationTypeTool')] ที่แปลกประหลาดของ [inspiration_owner.GetHerHis]"
 fund_inspiration.2070.desc.possessed:0 "ข้าได้รับแจ้งเกี่ยวกับอารมณ์แปรปรวนตลอดเวลาของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ซึ่งอาการที่แย่ที่สุดทำลายงานหนักทั้งหมดของ [inspiration_owner.GetHerHis] ด้วยความคลั่งไคล้ในความสงสัยในตนเองและความโกรธ"
 fund_inspiration.2070.desc.depressed:0 "ข้าได้รับแจ้งว่า [inspiration_owner.GetFirstNameNoTooltip] ใช้เวลาวัน [inspiration_owner.GetHerHis] ทั้งวันอยู่บนเตียง จมอยู่กับความเศร้าโศกที่แผ่ซ่าน ไม่สามารถเผชิญหน้ากับวันใหม่ได้"
 fund_inspiration.2070.desc.drunkard:0 "ข้าได้รับแจ้งว่าท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ใช้เงินทุนของ [inspiration_owner.GetHerHis] ดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] และทำตัวตลกในโรงเตี๊ยมของ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 fund_inspiration.2070.desc.hashishiyah:0 "ข้าได้รับแจ้งเกี่ยวกับปริมาณฮาชิชจำนวนมากที่ท่าน [inspiration_owner.GetFirstNameNoTooltip] ใช้เงินทุนของ [inspiration_owner.GetHerHis] ซื้อ ก่อนที่จะขัง [inspiration_owner.GetHerselfHimself] ไว้ในความมืด"
 fund_inspiration.2070.desc.rakish:0 "ข้าได้รับแจ้งเกี่ยวกับการหายตัวไปตลอดเวลาของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] จาก [inspiration_owner.Custom('GetInspirationTypeRoom')] ของ [inspiration_owner.GetHerHis] ตามคำบอกเล่าทั้งหมด ใช้เวลาและเงินทุนของข้าในซ่องโสเภณีของ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 fund_inspiration.2070.desc.profligate:0 "ข้าได้รับแจ้งเกี่ยวกับการใช้จ่ายอย่างหุนหันพลันแล่นของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ที่ตลาด ซึ่ง [inspiration_owner.GetSheHe] ได้ผลาญเงินอุปถัมภ์ของ [inspiration_owner.GetHerHis] ไปกับความคิดฟุ่มเฟือยที่ไม่ได้ผล"
 fund_inspiration.2070.desc.improvident:0 "ข้าได้รับแจ้งเกี่ยวกับการบริจาคอย่างหุนหันพลันแล่นของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] และสาเหตุต่างๆ ที่ [inspiration_owner.GetSheHe] ได้ใช้เงินอุปถัมภ์ของข้าไปแทนที่จะเป็นงานของ [inspiration_owner.GetHerHis]"
 fund_inspiration.2070.desc.irritable:0 "ข้าได้รับแจ้งเกี่ยวกับอารมณ์ฉุนเฉียวของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ซึ่งหากไม่มีข้าคอยควบคุม ก็ได้กีดกันผู้ที่สามารถแก้ไขข้อผิดพลาดและความเข้าใจผิดของ [inspiration_owner.GetHerHis] ออกไป"
 fund_inspiration.2070.desc.comfort_eater:0 "ข้าได้รับแจ้งถึงความอยากอาหารที่ไม่สิ้นสุดของ[inspiration_owner.GetFirstNamePossessiveNoTooltip] และการใช้จ่ายเงินทุนของข้าไปกับเค้กและขนมหวานจากตลาดของ[inspiration_owner.GetHerHis]"
 fund_inspiration.2070.desc.reclusive:0 "ข้าได้รับแจ้งว่าแทบไม่มีใครเห็นท่าน [inspiration_owner.GetFirstNameNoTooltip] เลยนับตั้งแต่การพบกันครั้งล่าสุดของเรา ถูกกักขังอยู่ใน [inspiration_owner.Custom('GetInspirationTypeRoom')] ของ [inspiration_owner.GetHerHis] ซึ่งหากไม่มีคำแนะนำ [inspiration_owner.GetSheHe] ก็ได้เบี่ยงเบนไปจากแผนที่ตกลงกันไว้อย่างสิ้นเชิง"
 fund_inspiration.2070.desc.wounded:0 "ข้าได้รับแจ้งเกี่ยวกับบาดแผลเปิดของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ซึ่ง ทำให้ [inspiration_owner.GetHerHim] ต้องนอนอยู่บนเตียง บิดตัวด้วยความเจ็บปวด และพบว่าตัวเองหวังว่า [ROOT.Char.GetFaith.DeathDeityName] จะอดทนกับ [inspiration_owner.GetHerHim]..."
 fund_inspiration.2070.desc.pregnant:0 "ข้าได้รับแจ้งเกี่ยวกับการตั้งครรภ์ของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] อาการปวดเมื่อยและเคลื่อนไหวไม่ได้ ทำให้ [inspiration_owner.GetHerHim] ไม่สามารถทำงานได้..."
 fund_inspiration.2070.desc.sick:0 "ข้าได้รับแจ้งเกี่ยวกับอาการป่วยที่ ทำให้ร่างกายอ่อนแอของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ซึ่ง ทำให้ [inspiration_owner.GetHerHim] มักจะนอนป่วยและไม่มีอารมณ์ทำงาน"
 fund_inspiration.2070.desc_outro:0 "\n\nในที่สุดข้าก็สั่งให้นำตัว [inspiration_owner.GetSheHe] มาเข้าเฝ้า"
 fund_inspiration.2070.a:0 ""ดูแลให้ทุกอย่างกลับสู่ปกติ""
 fund_inspiration.2070.b:0 ""ข้ารู้ว่าท่านกำลังทำดีที่สุดแล้ว ท่าน [inspiration_owner.GetFirstNameNoTooltip]""
 fund_inspiration.2070.c:0 ""มันควรจะเป็นผลงานชิ้นเอก และเร็วๆ นี้!""
 fund_inspiration.2070.d:0 ""ออกไปจาก [ROOT.Char.Custom('FortifiedBuilding')] นี้เดี๋ยวนี้ เจ้าคนไร้ค่า""

 fund_inspiration.2080.t:0 "$fund_inspiration.title$ อิสรภาพทางความคิดสร้างสรรค์"
 fund_inspiration.2080.antiquarian:0 ""นี่มันไร้สาระ!" ท่าน [rival.GetTitledFirstName] ประท้วง "ในฐานะผู้ดูแลของสะสมส่วนตัวของ [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] ข้ามีความรับผิดชอบในการรับรองคุณภาพงานของท่าน!""
 fund_inspiration.2080.artificer:0 ""เหลวไหลสิ้นดี!" [rival.GetTitledFirstName] คัดค้าน "ข้าพเจ้าเป็นช่างฝีมือ[rival.GetWomanMan] ที่ได้รับความไว้วางใจจาก [ROOT.Char.GetTitleAsNameNoTooltip]! ข้าพเจ้าอาจช่วยได้ หากท่านเพียง แต่ให้ข้าพเจ้าได้เห็นผลงานของท่าน!""
 fund_inspiration.2080.desc:0 "\n\n"ท่านจะได้เห็นมันเมื่อมันเสร็จแล้ว!" ท่าน [inspiration_owner.GetTitledFirstName] โต้กลับ "ท่านควรปล่อยให้ [inspiration_owner.GetWomanMan] ทำงานของ [inspiration_owner.GetHerHis] เมื่อ [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] เหมาะสมกับราชวงศ์!""
 fund_inspiration.2080.a:0 ""[rival.GetFirstNameNoTooltip] #EMP จะ#! ทำให้แน่ใจในคุณภาพของมัน, [inspiration_owner.GetFirstNameNoTooltip]""
 fund_inspiration.2080.b:0 ""ทำหน้าที่ของเจ้าไปเถิด, [rival.GetFirstNameNoTooltip]""
 fund_inspiration.2080.success:0 "[rival.GetFirstNameNoTooltip] ปรับปรุงผลงานของ [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.2080.failure:0 "[rival.GetFirstNameNoTooltip] ขัดขวาง [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2080.c:0 "ถึงเวลาสูดอากาศบริสุทธิ์แล้ว"

 fund_inspiration.2090.t:0 "$fund_inspiration.title$ สัมผัสของ [event_spouse.GetWifeHusband|U]"
 fund_inspiration.2090.desc:0 "ข้าเห็น[event_spouse.GetWifeHusband]ของข้า [event_spouse.GetFirstName] กำลังพูดคุยอย่างตื่นเต้นกับ[inspiration_owner.GetTitledFirstName] แจกแจงความคิดและข้อเสนอแนะสำหรับ[inspiration_owner.Custom('GetInspirationTypeObject')]ของ[inspiration_owner.GetHerHis] [inspiration_owner.Custom('GetInspirationOwnerType')]ของข้าแทบจะไม่สามารถซ่อนความรังเกียจของ[inspiration_owner.GetHerHis]ได้ เห็นได้ชัดว่ารำคาญการแทรกแซงของคู่สมรสของข้า \n\n"...และ ในขณะที่ท่านกำลัง[inspiration_owner.Custom('InspirationTypeDescription')]" [event_spouse.GetSheHe] กล่าวต่อไป "มันอาจจะเข้ากันได้ดีกับ[inspiration_owner.Custom('GetInspirationTypeObject')]เก่าของ[event_spouse.GetMotherFather]ของข้า!" \n\nส่วนหนึ่งของจิตวิญญาณของ[inspiration_owner.GetFirstNamePossessiveNoTooltip]ดูเหมือนกำลังจะตาย"
 fund_inspiration.2090.a:0 ""ฟังให้ดี ท่าน [inspiration_owner.GetFirstNameNoTooltip] — ต้องรับฟัง [event_spouse.GetWifeHusband] ของข้า!""
 fund_inspiration.2090.b:0 ""มาเถอะ ที่รัก ปล่อยให้เป็นหน้าที่ของผู้เชี่ยวชาญ""
 fund_inspiration.2090.success:0 "ท่าน [event_spouse.GetFirstNameNoTooltip] ปรับปรุงงานของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.2090.failure:0 "ท่าน [event_spouse.GetFirstNameNoTooltip] ขัดขวางท่าน [inspiration_owner.GetFirstNameNoTooltip]"

 fund_inspiration.2100.t:0 "$fund_inspiration.title$ ช่างฝีมือขี้อิจฉา"
 fund_inspiration.2100.desc:0 "ท่าน [inspiration_owner.GetTitledFirstName] [inspiration_owner.Custom('GetInspirationOwnerType')] ของข้า นั่งจ้องมองข้ามอาหารเย็นของ [inspiration_owner.GetHerHis] ไปยังท่าน [other_inspiration_owner.GetTitledFirstName] คู่แข่งในการอุปถัมภ์ของข้า \n\nแม้ว่าปกติจะเก็บตัวอย่างปลอดภัย ครุ่นคิดเกี่ยวกับ [inspiration_owner.Custom('GetInspirationTypeStation')] ของ [inspiration_owner.GetHerHis] ท่าน [inspiration_owner.GetFirstNameNoTooltip] ก็ ทำให้อารมณ์เสียอย่างรวดเร็วเมื่อถึงเวลารับประทานอาหาร \n\nคืนนี้ [inspiration_owner.GetSheHe] ก็ระเบิดออกมาในที่สุด:"
 fund_inspiration.2100.desc.funds:0 ""ทำไมท่าน [other_inspiration_owner.GetFirstNameNoTooltip] ถึงได้รับเงินทุนมากกว่าข้า? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! แล้วไง?""
 fund_inspiration.2100.desc.rival:0 ""ข้าไม่อยากจะเชื่อว่าท่านจะผลาญคลังเพื่อเจ้า [other_inspiration_owner.Custom2('InsultNoun', SCOPE.sC('inspiration_owner'))] นั่น [other_inspiration_owner.GetFirstNameNoTooltip] ท่านไปจ้างคนตักอุจจาระยังได้ผลลัพธ์ที่ดีกว่า!""
 fund_inspiration.2100.desc.fallback:0 ""ท่านควรทิ้งภาระที่ไร้ประโยชน์นี้ไป ใต้เท้า ท่าน [other_inspiration_owner.GetFirstNameNoTooltip] ไม่รู้ด้วยซ้ำว่าปลายด้านไหนของ [other_inspiration_owner.Custom('GetInspirationTypeTool')] คือด้านที่ถูกต้อง ไม่ต้องพูดถึงทางไป [other_inspiration_owner.Custom('GetInspirationTypeRoom')] ของ [other_inspiration_owner.GetHerHis] เลย""
 fund_inspiration.2100.a:0 ""งานของท่านมีค่าสำหรับข้า ท่าน [inspiration_owner.GetFirstNameNoTooltip]""
 fund_inspiration.2100.b:0 ""ข้าจะให้เงินทุนเท่ากัน พอใจไหม?""
 fund_inspiration.2100.c:0 ""มาเถอะ มีเรื่องอะไรหรือ?""
 fund_inspiration.2100.d:0 ""หยุดเรื่องโง่ๆ นี้เสียที""
 fund_inspiration.2100.c.leave:0 "ท่าน [inspiration_owner.GetFirstNameNoTooltip] ละทิ้งงานของ [inspiration_owner.GetHerHis]"
 fund_inspiration.2100.c.worse:0 "ท่าน [inspiration_owner.GetFirstNameNoTooltip] สูญเสียแรงจูงใจ"
 fund_inspiration.2100.success:0 "ท่านไกล่เกลี่ยเรื่องราวได้"
 fund_inspiration.2100.failure:0 "ท่าน ทำให้ความขัดแย้งแย่ลง"

 fund_inspiration.2110.t:0 "$fund_inspiration.title$ เพื่อนนักเลง"
 fund_inspiration.2110.desc:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_vassal'))] ของข้า ท่าน [generous_vassal.GetTitledFirstName] ทักทายข้า: "ยินดีที่ได้พบ [generous_vassal.Custom2('RelationToMeShort', ROOT.Char)]! ข้าได้ยินเรื่องการอุปถัมภ์ของท่านต่อท่าน [inspiration_owner.GetFirstName] [inspiration_owner.Custom('GetInspirationOwnerType')] พวกเขากล่าวว่า [inspiration_owner.GetSheHe] กำลัง [inspiration_owner.Custom('InspirationTypeDescription')] ที่คู่ควรกับ [ROOT.Char.GetTitleAsNameNoTooltip]" \n\nโปรดรับสิ่งนี้และมอบให้ [inspiration_owner.GetHerHim] "
 fund_inspiration.2110.desc.part.2: "ข้าไม่อยากพลาดโอกาสที่จะช่วยเหลือในการสร้างผลงานชิ้นเอก!" \n\n"
 fund_inspiration.2110.desc.part.2.research: "ข้าไม่อยากพลาดโอกาสนี้ที่จะมีส่วนร่วมในการค้นพบทางวิทยาศาสตร์ครั้งใหม่!\n\n"
 fund_inspiration.2110.desc.generous:0 "ท่าน [generous_vassal.GetFirstNameNoTooltip] มีชื่อเสียงในด้านความเอื้อเฟื้อเผื่อแผ่ และดูเหมือนว่า [generous_vassal.GetSheHe] ได้พบช่องทางใหม่สำหรับการใช้จ่ายของ [generous_vassal.GetHerHis]..."
 fund_inspiration.2110.desc.dweeb:0 "ท่าน [generous_vassal.GetFirstNameNoTooltip] สนใจในหลายสิ่งหลายอย่าง ในหมู่พวกนั้นคือสิ่งประดิษฐ์ล้ำค่าและจิตใจที่ผลิตพวกมันขึ้นมา..."
 fund_inspiration.2110.desc.dweeb.research: "ท่าน [generous_vassal.GetFirstNameNoTooltip] สนใจในหลายสิ่งหลายอย่าง ในหมู่พวกนั้นคือเทคโนโลยีและจิตใจที่คิดค้นพวกมันขึ้นมาเป็นครั้งแรก..."
 fund_inspiration.2110.desc.friend:0 "ท่าน [generous_vassal.GetFirstNameNoTooltip] ยิ้มอย่างอบอุ่น ถุงเหรียญห้อยจากมือของ [generous_vassal.GetHerHis]"
 fund_inspiration.2110.desc.rich:0 "ท่าน [generous_vassal.GetFirstNameNoTooltip] ผู้น่าสงสารคงมีเงินมากกว่าที่ [generous_vassal.GetSheHe] รู้ว่าจะทำอะไรกับมัน..."
 fund_inspiration.2110.a:0 ""ช่างใจกว้างอะไร เช่นนี้!""
 fund_inspiration.2110.b:0 ""โอ้ ข้าจะ #EMP ทำให้แน่ใจ#! ว่า [inspiration_owner.GetSheHe] ได้รับมัน!""
 fund_inspiration.2110.b.flavor:0 "นี่น่าจะมีประโยชน์..."
 fund_inspiration.2110.c:0 ""ไม่ โปรดเถิด เก็บไว้เถอะ!""
 # ( ͡° ͜ʖ ͡°)
 fund_inspiration.2120.t:0 "$fund_inspiration.title$ อยู่ดึก"
 fund_inspiration.2120.desc:0 "เวลาหายไปใน [inspiration_owner.Custom('GetInspirationTypeRoom')] ของท่าน [inspiration_owner.GetFirstNamePossessive] ดื่ม [ROOT.Char.Custom('RegionalAlcoholicDrink')] ขณะที่เราพูดคุยกันอย่างตื่นเต้นเกี่ยวกับ [inspiration_owner.Custom('GetInspirationTypeObject')] ที่ [inspiration_owner.GetSheHe] กำลัง [inspiration_owner.Custom('GetInspirationTypeVerb')] ให้ข้า ข้ากำลังจินตนาการไปเอง หรือว่ามีความตึงเครียด... ที่ไม่อาจบรรยายได้? \n\n"
 fund_inspiration.2120.desc.me:0 "จิตใจของข้าล่องลอย ซึมซับความแปลกประหลาดเล็กๆ น้อยๆ ของร่างกาย [inspiration_owner.GetHerHis] ริมฝีปากที่หัวเราะของ [inspiration_owner.GetHerHis]... ข้าวางมือลงบนมือของ [inspiration_owner.GetHersHis] [inspiration_owner.Custom('GetInspirationTypeTool')] หลุดจากนิ้วที่สั่นเทาของ [inspiration_owner.GetHerHis] ขณะที่ข้าจ้องมองเข้าไปในดวงตาที่สวยงามเหล่านั้นอย่างโหยหา \n\n"
 fund_inspiration.2120.desc.them:0 "เวลาล่วงเลยไปมากแล้วเมื่อ [inspiration_owner.Custom('GetInspirationOwnerType')] ของข้า วาง [inspiration_owner.Custom('GetInspirationTypeTool')] ของ [inspiration_owner.GetHerHis] ลง ดื่มอึกใหญ่จากถ้วยของ [inspiration_owner.GetHerHis] และยิ้มให้ข้าอย่างรู้ทัน คือ... [inspiration_owner.GetSheHe]... ? \n\n"
 fund_inspiration.2120.desc.them_into_alot:0 "[inspiration_owner.GetSheHe|U] กระโจนเข้าสู่อ้อมแขนของข้าเหมือนสัตว์ป่า ทำให้ [inspiration_owner.Custom('GetInspirationTypeStation')] กระเด็นไปทั่วห้อง"
 fund_inspiration.2120.desc.them_into:1 "ในตัว [inspiration_owner.GetHerHim] ข้าพบความปรารถนาอันแรงกล้า เช่นเดียวกัน: [inspiration_owner.GetSheHe] ล้มลงในอ้อมกอดอันอบอุ่นของข้า..."
 fund_inspiration.2120.desc.me_zealous_homosexuality:0 "นี่มันผิด สาบานต่อ [ROOT.Char.GetFaith.HighGodName] ข้าไม่อาจยอมจำนนต่อการล่อลวงอันเป็นบาปเหล่านี้ได้..."
 fund_inspiration.2120.desc.me_zealous_adultery:0 "ไม่ [ROOT.Char.GetFaith.ReligiousText] ชัดเจน! การล่วงประเวณีเป็นบาป! นี่คือการล่อลวงของ [ROOT.Char.GetFaith.DevilName]!"
 fund_inspiration.2120.desc.me_unattracted:0 "ทันใดนั้น ท่าน [inspiration_owner.GetFirstNameNoTooltip] ก็ก้าวเข้ามา กอดข้า! แขนของข้ารีบหยุด [inspiration_owner.GetHerHim] บางทีอาจแรงเกินไป... ความอบอุ่นของ [inspiration_owner.GetHerHis|U] เย็นลงทันที กลายเป็นความสับสนและความกลัว"
 fund_inspiration.2120.desc.me_chaste:0 "[inspiration_owner.GetSheHe|U] ก้าวเข้ามา ดึงข้าเข้าสู่อ้อมกอดอันอบอุ่นของ [inspiration_owner.GetHerHis] ร่างกายของข้าตอบตกลง แต่หัวใจของข้ากรีดร้องปฏิเสธ..."
 fund_inspiration.2120.desc.me_into:0 "ข้าปฏิเสธไม่ได้ว่ามีบางอย่างก่อตัวขึ้นในตัวข้า หัวใจของข้าเต้นเร็วขึ้นและข้าพบว่าตัวเองกำลังกอด [inspiration_owner.GetHerHim] ไว้ในอ้อมแขนขณะที่ [inspiration_owner.GetSheHe] กอดตอบ... นี่มัน #EMP เกิดอะไรขึ้น#!?"
 fund_inspiration.2120.desc.me_into_alot:0 "ไม่ต้องสงสัยเลยในเจตนาของ [inspiration_owner.GetHerHis]! ข้าแทบจะควบคุมตัวเองไม่ได้ขณะที่ข้าปัด [inspiration_owner.Custom('GetInspirationTypeStation')] ของ [inspiration_owner.GetHerHis] ออกไป"
 fund_inspiration.2120.a:0 ""มานี่สิ ที่รัก""
 fund_inspiration.2120.e:0 ""โอ้... ท่าน [inspiration_owner.GetFirstNameNoTooltip]...""
 fund_inspiration.2120.f.chaste:0 ""นี่ไม่ใช่สำหรับข้า...""
 fund_inspiration.2120.f:0 ""ข้า... ต้องไปแล้ว!""
 fund_inspiration.2120.h:0 ""เร็วเข้า ประตู!""
 fund_inspiration.2120.i:0 ""โอ้! ข้าไม่ใช่...""
 fund_inspiration.2120.j:0 ""ไม่! [ROOT.Char.GetFaith.ReligiousText] ห้ามการรวมกันนี้...""
 fund_inspiration.2120.k.me:0 ""ไม่! ข้าทำไม่ได้... การล่วงประเวณีเป็นบาป!""
 fund_inspiration.2120.k.them:0 ""ไม่ ข้าไม่อาจล่อลวง [inspiration_owner.GetHerHim] ให้ล่วงประเวณีได้..."
 fund_inspiration.2120.l:0 ""เดี๋ยวก่อน... เจ้า #EMP กล้า#! อย่างไรกัน?!""
 fund_inspiration.2120.m:0 ""ปล่อยข้า เจ้าคนบาปเสเพล!""
 fund_inspiration.2120.leave_flavor:0 "ท่านรีบจากไป"

 fund_inspiration.2130.t:0 "$fund_inspiration.title$ แรงกระตุ้นที่ไม่แน่นอน"
 fund_inspiration.2130.desc:1 "ข้าชนเข้ากับท่าน [inspiration_owner.GetTitledFirstName] [inspiration_owner.Custom('GetInspirationOwnerType')] ของข้า ที่ดูเคร่งขรึมมาก หวังว่า [inspiration_owner.GetSheHe] จะไม่นำข่าวร้ายเกี่ยวกับ [inspiration_owner.Custom('GetInspirationTypeObject')] อันงดงามที่ [inspiration_owner.GetSheHe] ควรจะเตรียมพร้อมให้ข้าในไม่ช้า \n\n"โอ้ ท่านอยู่นี่เอง ใต้เท้า... ข้าติดขัดในงานของข้า — ไม่ใช่เรื่องใหญ่อะไร! ความคิดของข้าหยุดนิ่งเมื่อความกดดันเพิ่มขึ้น!" [inspiration_owner.GetSheHe|U] หัวเราะอย่างประหม่า \n\n"ข้าแค่ต้องการ... แรงบันดาลใจ! ใต้เท้า [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่ ท่านพอจะมี... ตัวอย่างก่อนหน้านี้ให้ข้าตรวจสอบได้หรือไม่?""
 fund_inspiration.2130.a.library:0 ""ไปยังห้องสมุด!""
 fund_inspiration.2130.a.armory:0 ""ไปยังคลังอาวุธ!""
 fund_inspiration.2130.a.hall:0 ""ไปยังโถงใหญ่!""
 fund_inspiration.2130.a.tt:0 "คุณภาพหรือความคืบหน้าของ [inspiration|E] ของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] อาจได้รับการปรับปรุง"
 fund_inspiration.2130.a.flavor:0 "เราต้องหาอะไรมาช่วยได้แน่!"
 fund_inspiration.2130.b:0 ""ข้ารู้ว่าท่านต้องการอะไร!""
 fund_inspiration.2130.b.great:0 "แรงบันดาลใจของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] เติบโตขึ้น"
 fund_inspiration.2130.b.good:1 "แรงบันดาลใจของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] กลับมา"
 fund_inspiration.2130.b.nothing:0 "แรงบันดาลใจของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] หลับใหล"
 fund_inspiration.2130.b.bad:0 "แรงบันดาลใจของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] หนีไป"
 fund_inspiration.2130.b.terrible:0 "แรงบันดาลใจของท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ตายไป"
 fund_inspiration.2130.b.flavor:0 "เราจะสนุกกันแค่ไหน!"
 fund_inspiration.2130.c:0 ""อ่า ข้ามีตัวยาที่ใช่เลย""
 fund_inspiration.2130.c.dead:1 "ท่าน [inspiration_owner.GetFirstNamePossessiveNoTooltip] ล้มลงตาย"
 fund_inspiration.2130.c.flavor:0 "ขวดสีแดงนั่นอยู่ไหน..."
 fund_inspiration.2130.d:0 ""แรงบันดาลใจที่แท้จริงมาจากภายใน""
 
 fund_inspiration.2131.t:0 "$fund_inspiration.title$ เก่าไปใหม่มา"
 fund_inspiration.2131.desc_library_unused:0 "ด้วยการออกแรงครั้งสุดท้าย ท่าน [inspiration_owner.GetTitledFirstName] และข้าก็บุกเข้าไปในห้องสมุดที่เต็มไปด้วยฝุ่นของข้า — ห้องที่ข้าแทบไม่มีเหตุผลให้เข้ามา\n\n"
 fund_inspiration.2131.desc_library:0 "ข้าพา ท่าน [inspiration_owner.GetTitledFirstName] เข้าไปในห้องสมุดที่ดูแลอย่างดีของข้า ชี้ให้ดูหนังสือและยาที่น่าสนใจบางเล่มที่จัดแสดงอยู่\n\n"
 fund_inspiration.2131.desc_armory_unused:0 "ทหารที่ตกใจพา ท่าน [inspiration_owner.GetTitledFirstName] และข้าเข้าไปในคลังอาวุธที่ไม่เป็นระเบียบของข้า — ข้าไม่เคยลงมาที่นี่เลย!\n\n"
 fund_inspiration.2131.desc_armory:0 "ท่าน [inspiration_owner.GetTitledFirstName] และข้าถูกนำเข้าไปในคลังอาวุธที่กว้างขวางของข้า ที่ ซึ่งข้าชี้ให้ดูของชิ้นโปรดบางชิ้นของข้า บอกใบ้ถึงเรื่องราวของพวกมัน\n\n"
 fund_inspiration.2131.desc_great_hall_low:0 "ขณะที่ข้าพา ท่าน [inspiration_owner.GetTitledFirstName] ชมของแปลกๆ อย่างรวดเร็ว ข้าก็นึกขึ้นได้ว่าโถงใหญ่ของข้าไม่ได้ยิ่งใหญ่เท่าที่ควรจะเป็น\n\n"
 fund_inspiration.2131.desc_great_hall:0 "ข้าพา ท่าน [inspiration_owner.GetTitledFirstName] ชมรอบโถงใหญ่ของข้า ภูมิใจในความหรูหราและสมบัติต่างๆ ที่จัดแสดงอยู่"
 fund_inspiration.2131.desc_antiquarian:0 "ท่าน [second.GetTitledFirstName] ยืนกรานที่จะมาและเฝ้าดูจากระยะไกล ทำหน้าเหยเกทุกครั้งที่วัตถุถูกจับอย่างไม่เหมาะสมหรือระบุผิด\n\n"
 fund_inspiration.2131.artificer:0 "ท่าน [second.GetTitledFirstName] ติดตามมาอย่างมีความสุข สนใจในกระบวนการสร้างสรรค์ของเพื่อนร่วมอาชีพของ [second.GetHerHis] เสมอ\n\n"
 fund_inspiration.2131.desc_equipped:0 "[inspiration_owner.Custom('GetInspirationOwnerType')] หยุดชั่วคราว ราวกับตกตะลึง ตรวจสอบ [artifact_1.GetName] ของข้า "อ่า งดงามมาก ใต้เท้า... ข้า... ข้าสามารถใช้ [inspiration_owner.Custom('GetInspirationMaterialType')] ของมันได้หรือไม่?""
 fund_inspiration.2131.desc_unequipped:0 "ในร้านค้านั่นเองที่ [inspiration_owner.Custom('GetInspirationOwnerType')] หยุดกะทันหัน ตรวจสอบ [artifact_1.GetName] ของข้าอย่างใกล้ชิด "ใช่... [inspiration_owner.Custom('GetInspirationMaterialType')] น่าจะใช้ได้... ท่าน... ยังต้องการสิ่งนี้อยู่หรือไม่? ใต้เท้า?""
 fund_inspiration.2131.desc_fallback:1 "[inspiration_owner.GetSheHe|U] เดินวนรอบห้องสองสามรอบก่อนจะกลับมาหาข้าด้วยท่าทีเศร้าสร้อย "ใต้เท้า ไม่มีอะไรที่นี่ที่โดดเด่นสำหรับข้าเลย... มีอย่างอื่นอีกไหม?""
 fund_inspiration.2131.a:0 ""[artifact_1.GetNameNoTooltip]? ตกลง..."
 fund_inspiration.2131.b:0 ""แล้ว [artifact_2.GetNameNoTooltip] ของข้าล่ะ?""
 fund_inspiration.2131.c:0 ""ต้องมีขยะกองอยู่บ้างสิ...""
 fund_inspiration.2131.c.good:0 "ท่านพบ [inspiration_owner.Custom('GetInspirationMaterialType')] คุณภาพดี"
 fund_inspiration.2131.c.nothing:0 "ท่านไม่พบอะไรเลย"
 fund_inspiration.2131.c.bad:0 "ท่านพบ [inspiration_owner.Custom('GetInspirationMaterialType')] ที่แย่มาก"
 fund_inspiration.2131.d:0 ""ท่านแค่ดูเฉยๆ""
 fund_inspiration.2131.d.great:1 "ท่าน [inspiration_owner.GetNameNoTooltip] พบขุมทรัพย์"
 fund_inspiration.2131.d.good:1 "ท่าน [inspiration_owner.GetNameNoTooltip] พบ [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.d.nothing:1 "ท่าน [inspiration_owner.GetNameNoTooltip] ไม่พบอะไรเลย"
 fund_inspiration.2131.d.bad:1 "ท่าน [inspiration_owner.GetNameNoTooltip] พบ [inspiration_owner.Custom('GetInspirationMaterialType')] คุณภาพต่ำ"
 fund_inspiration.2131.d.terrible:1 "ท่าน [inspiration_owner.GetNameNoTooltip] พบ [inspiration_owner.Custom('GetInspirationMaterialType')] ที่แย่มาก"
 fund_inspiration.2131.e:0 ""ท่าน [second.GetFirstNameNoTooltip]! มีข้อเสนอแนะอะไรไหม?""
 fund_inspiration.2131.f:0 ""เสียเวลาจริงๆ!""

 fund_inspiration.3001.t:0 "$fund_inspiration.title$ งานเขียนนอกรีต"
 fund_inspiration.3001.desc_opening:0 "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้องพร้อมกับกองกระดาษในมือ ตามมาด้วย [inspiration_owner.GetTitledFirstName] ที่มีท่าทีร้อนรน พยายามแย่งงานเขียนคืนจากมือของ [court_chaplain.GetHerHis]\n\n"
 fund_inspiration.3001.desc_witch:0 ""[inspiration_owner.GetWomanMan] ผู้นี้กำลังเขียนถึง [ROOT.Char.GetFaith.WitchGodName] #EMP [ROOT.Char.GetFaith.WitchGodName]#!!"
 fund_inspiration.3001.desc_cannibal:0 ""[inspiration_owner.GetWomanMan] ผู้นี้กำลังเขียนถึง #EMP การกินเนื้อคน#!!"
 fund_inspiration.3001.desc_torturer:0 ""[inspiration_owner.GetWomanMan] ผู้นี้กำลังเขียนถึงเรื่องวิปริตผิดมนุษย์ การกระทำอันโหดร้ายทารุณ!"
 fund_inspiration.3001.desc_lustful:0 ""[inspiration_owner.GetWomanMan] ผู้นี้กำลังเขียนถึงเรื่องวิปริตผิดมนุษย์ การกระทำอันลามก!"
 fund_inspiration.3001.desc_other:0 ""[inspiration_owner.GetWomanMan] ผู้นี้กำลังเขียนถึงเรื่องนอกรีต!"
 fund_inspiration.3001.desc_ending:0 "พร้อมภาพประกอบ! ข้าสันนิษฐานได้เพียงว่าท่านไม่ทราบเรื่องนี้ [ROOT.Char.Custom('FormOfAddressForLiege')]" \n\n[inspiration_owner.GetTitledFirstNameNoTooltip] สบถและพุ่งเข้าไปแย่งกระดาษอีกครั้ง แต่ [court_chaplain.Custom('CouncilPosition')] ของข้าหลบได้\n\n"แต่บัดนี้ เมื่อนักเขียนชั่วร้ายผู้นี้ถูกเปิดโปง ท่านย่อมต้องอุทิศหนังสือเล่มนี้แด่ [ROOT.Char.GetFaith.HighGodName] ตามสมควร""
 fund_inspiration.3001.a:0 "แน่นอน ข้าไม่รู้เลยว่า [inspiration_owner.GetSheHe] กำลังเขียนเรื่อง เช่นนี้"
 fund_inspiration.3001.a_tt:0 "[inspiration_owner.GetShortUIName] จะเขียนเกี่ยวกับศรัทธาแทน [inspiration_owner.Custom('ArtifactBookSubject')]"
 fund_inspiration.3001.b:0 "สิ่งที่สมควรคืออะไรเจ้ารู้หรือไม่? คือการที่เจ้าเลิกยุ่งกับ [inspiration_owner.GetHerHim] เสีย!"
 fund_inspiration.3001.c:0 "ภาพประกอบพวกนั้นดูจืดชืด... เอาทองคำนี้ไปซื้อหมึกใหม่เถิด"

 fund_inspiration.3011.t:0 "$fund_inspiration.title$ หัวข้อการทหาร"
 fund_inspiration.3011.desc_opening_1:0 "ข้าพบ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ท่ามกลางม้วนตำราและเอกสาร กำลังพลิกหน้ากระดาษอย่างรวดเร็ว\n\n"
 fund_inspiration.3011.desc_opening_2:0 "ข้าพบ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ท่ามกลางม้วนตำราและเอกสาร กุมศีรษะด้วยมือ [inspiration_owner.GetHerHis]\n\n"
 fund_inspiration.3011.desc_opening_3:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าพเจ้าพร้อมม้วนตำราและเอกสารเต็มอ้อมแขน [inspiration_owner.GetHerHis]\n\n"
 fund_inspiration.3011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! มีศาสตร์การสงครามมากมายที่ควรค่าแก่การใส่ใจ ทั้งกลยุทธ์ องค์ประกอบของกองทหาร การรบ... ข้าไม่รู้ด้วยซ้ำว่าจะเริ่มจากตรงไหน!""
 fund_inspiration.3011.a:0 "ข้าต้องการให้ตำรานี้ให้ความรู้หรือเป็นประโยชน์ต่อกองทัพ"
 fund_inspiration.3011.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น กลยุทธ์และการจัดกระบวนทัพ"
 fund_inspiration.3011.b:0 "บางทีอาจเป็นเรื่องที่พาดพิงถึงแง่มุมอันสูงส่งของหัวข้อนี้"
 fund_inspiration.3011.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น อัศวินธรรมและความเก่งกาจ"
 fund_inspiration.3011.d:0 "หัวข้อใดที่แรงบันดาลใจของเจ้าปรารถนา?"
 fund_inspiration.3011.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะตัดสินใจเลือกหัวข้อของตำราได้อย่างอิสระ"

 fund_inspiration.3012.t:0 "$fund_inspiration.title$ หัวข้อการทูต"
 fund_inspiration.3012.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! มีศาสตร์การทูตมากมายที่ควรค่าแก่การใส่ใจ ทั้งความประพฤติในราชสำนัก ความสัมพันธ์ #EMP บทกวี#!... ข้าไม่รู้ด้วยซ้ำว่าจะเริ่มจากตรงไหน!""
 fund_inspiration.3012.a:0 "บางทีอาจเป็นเรื่องที่เกี่ยวข้องกับชีวิตในราชสำนัก"
 fund_inspiration.3012.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น พันธมิตรและวาทศิลป์"
 fund_inspiration.3012.b:0 "ข้าต้องการให้ตำรานี้ให้ความบันเทิง!"
 fund_inspiration.3012.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น การผจญภัยและความบันเทิง"

 fund_inspiration.3013.t:0 "$fund_inspiration.title$ หัวข้อเชิงวิชาการ"
 fund_inspiration.3013.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! มีหลายด้านที่ควรค่าแก่การใส่ใจ ทั้งศาสนา การศึกษา... ไม่ต้องพูดถึงศิลปะการเขียนเลย!""
 fund_inspiration.3013.a:0 "ภารกิจนี้ควรรับใช้ [ROOT.Char.GetFaith.HighGodName]!"
 fund_inspiration.3013.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น เทววิทยาและบทสวดมนต์"
 fund_inspiration.3013.b:0 "ข้าต้องการให้ตำรานี้ให้ความรู้ หรืออย่างน้อยก็ให้ความบันเทิง!"
 fund_inspiration.3013.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น ประวัติศาสตร์และบทกวี"

 fund_inspiration.3014.t:0 "$fund_inspiration.title$ หัวข้อการดูแลจัดการ"
 fund_inspiration.3014.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! มีศาสตร์การคลังมากมายที่ควรค่าแก่การใส่ใจ ทั้งกฎหมาย การค้า #EMP เงินทอง#!... ข้าไม่รู้ด้วยซ้ำว่าจะเริ่มจากตรงไหน!""
 fund_inspiration.3014.a:0 "จงมุ่งเน้นไปที่เรื่องที่เกี่ยวข้องกับการปกครองอาณาจักร"
 fund_inspiration.3014.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น กฎหมายและการปกครอง"
 fund_inspiration.3014.b:0 "ข้าสนใจเรื่องการพัฒนา!"
 fund_inspiration.3014.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น สิ่งปลูกสร้างและการเก็บภาษี"

 fund_inspiration.3015.t:0 "$fund_inspiration.title$ หัวข้อการวางอุบาย"
 fund_inspiration.3015.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! มีศาสตร์เล่ห์กลมากมายที่ควรค่าแก่การใส่ใจ ทั้งการวางแผน การยั่วยวน การชักจูง... ข้าไม่รู้ด้วยซ้ำว่าจะเริ่มจากตรงไหน!""
 fund_inspiration.3015.a:0 "ข้าต้องการก้าวนำหน้า #EMP ทุกคน#!!"
 fund_inspiration.3015.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น การวางแผนร้ายและการชักใย"
 fund_inspiration.3015.b_men:0 "ข้าต้องการให้บุรุษล้มลงแทบเท้าข้า!"
 fund_inspiration.3015.b_women:0 "ข้าต้องการให้สตรีล้มลงแทบเท้าข้า!"
 fund_inspiration.3015.b_both:0 "ข้าต้องการให้ทุกคนปรารถนาข้า!"
 fund_inspiration.3015.b_none:0 "ข้าต้องการเชี่ยวชาญการยั่วยวน"
 fund_inspiration.3015.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะมุ่งเน้นงานเขียน [inspiration_owner.GetHerHis] ไปที่หัวข้อต่างๆ เช่น ตัณหาและศิลปะแห่งการยั่วยวน"

 fund_inspiration.3030.t:0 "$fund_inspiration.title$ ความเกลียดชังที่เย็นลง"
 fund_inspiration.3030.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ได้เชิญข้าพเจ้ามาหารือเกี่ยวกับหัวข้อของตำราที่ [inspiration_owner.GetSheHe] กำลังเขียนให้ข้าพเจ้า\n\n"
 fund_inspiration.3030.desc:0 ""ข้าพเจ้าอดสังเกตไม่ได้ถึงความเป็นปฏิปักษ์ที่เย็นลงระหว่างท่านกับ [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] ท่านยังต้องการอุทิศตำราเล่มนี้ให้กับความเกลียดชังที่ท่านมีต่อ [prev_nemesis.GetHerHim] หรือไม่?""
 fund_inspiration.3030.desc_dead:0 ""บัดนี้เมื่อ [prev_nemesis.Custom2('YourCharacterIntroduction', ROOT.Char)] ได้จากไปแล้ว ท่านยังต้องการอุทิศตำราเล่มนี้ให้กับความเกลียดชังที่ท่านเคยมีต่อ [prev_nemesis.GetHerHim] หรือไม่?""
 fund_inspiration.3030.a:0 "ความเกลียดชังที่ข้ารู้สึกยังไม่ได้เย็นลงขนาดนั้น"
 fund_inspiration.3030.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] ยังคงเขียนเกี่ยวกับความเกลียดชังของท่านที่มีต่อ [prev_nemesis.GetTitledFirstName]"
 fund_inspiration.3030.b:0 "[prev_nemesis.GetSheHe|U] ไม่คู่ควรกับความพยายาม"

 fund_inspiration.3031.t:0 "$fund_inspiration.title$ ความรักที่ร่วงโรย"
 fund_inspiration.3031.desc:0 ""ข้าอดสังเกตไม่ได้ว่า [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] ไม่ได้อยู่ในความโปรดปราน #EMP สูงสุด#! ของท่านอีกต่อไป [ROOT.Char.Custom('FormOfAddressForLiege')] ท่านยังต้องการอุทิศหนังสือเล่มนี้ให้กับความรักที่ท่านมีต่อ [prev_soulmate.GetHerHim] หรือไม่?""
 fund_inspiration.3031.desc_dead:0 ""ความเจ็บปวดจากการสูญเสีย [prev_soulmate.Custom2('YourCharacterIntroduction', ROOT.Char)] คงยังสดใหม่... ท่านยังต้องการอุทิศตำราเล่มนี้ให้กับความรักที่ท่านเคยมีต่อ [prev_soulmate.GetHerHim] หรือไม่?""
 fund_inspiration.3031.a:0 "ความรักจะเป็น เช่นไรหากปราศจากความปรารถนาและการสูญเสีย?"
 fund_inspiration.3031.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] ยังคงเขียนเกี่ยวกับความรักที่ท่านเคยมีร่วมกับ [prev_soulmate.GetTitledFirstName]"
 fund_inspiration.3031.b:0 "[prev_soulmate.GetSheHe|U] ไม่คู่ควรกับความพยายาม"

 fund_inspiration.4001.t:0 "$fund_inspiration.title$ เส้นยืนและเส้นพุ่ง"
 fund_inspiration.4001.desc:0 ""[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] #EMP ทำลาย#! อาภรณ์ใหม่ของข้า!"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] บุกเข้ามาในห้อง ตามมาด้วยช่างทอผ้า เสื้อผ้าที่ [courtier.GetSheHe] ถืออยู่ในมือ [courtier.GetHerHis] ถูกตัดจนเละจนข้าบอกไม่ได้ว่าเดิมทีมันคืออะไร\n\n"ท่านทำเกินไปแล้ว! ข้าเพียงแค่กำลังศึกษาลายทอของผ้า มันสำคัญต่องานของข้า""
 fund_inspiration.4001.a:0 "เจ้าทำเกินไปแล้ว หากจำเป็นก็จงศึกษาเสื้อผ้าของตัวเอง!"
 fund_inspiration.4001.b:0 "หาก [inspiration_owner.GetSheHe] บอกว่าจำเป็น มันก็คือจำเป็น"

 # Weaver is being too much of a modernist 
 fund_inspiration.4010.t:1 "$fund_inspiration.title$ องค์ประกอบในสีแดง น้ำเงิน และ [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.4010.desc:0 "ข้าไปตรวจดูโรงทอผ้าของข้าเพื่อดูความคืบหน้าของพรมแขวนผนัง ข้างในมีข้าราชสำนักอยู่สองสามคน พวกเขากำลังตรวจดูผนัง มือไพล่หลัง พรมแขวนผนังที่จัดแสดงอยู่นั้นเป็นการแต้มสีที่แปลกประหลาด ผืนหนึ่งมีรอยเปื้อนดูเก้งก้าง อีกผืนเป็นสีขาวมีสี่เหลี่ยมสองสามอัน อีกผืนมีเส้นพันกันหมุนวน นี่มันศิลปะประเภทใดกัน?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip] ชี้ไปที่ส่วนที่ดูเหมือนรอยเปื้อน "สีน้ำตาลสกปรกตัดกับสีขาวนี้ไม่ได้สื่อถึงความรุนแรงที่มีอยู่ในตัวมนุษย์หรอกหรือ?"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] พยักหน้า "ข้าคิดว่ามันแสดงถึง [inspiration_owner.GetTitledFirstNameNoTooltip] ที่กำลังต่อต้านวัยเด็ก [inspiration_owner.GetHerHis] - มันดูเหมือนรูปร่างของมารดา [inspiration_owner.GetHerHis]""
 fund_inspiration.4010.a:0 "พยักหน้าเข้าใจและชมเชยศิลปิน"
 fund_inspiration.4010.b:0 ""น่าขยะแขยง! ข้าต้องไปดูศิลปะแบบดั้งเดิมเดี๋ยวนี้""
 fund_inspiration.4010.b.tt:0 "เงินลงทุนของท่านจะถูกส่งคืนและงานจะถูกยกเลิก"
 fund_inspiration.4010.c:0 ""[child.GetTitledFirstNameNoTooltip] ก็ทำแบบนั้นได้!""

 fund_inspiration.5011.desc:0 ""ถึงเวลาแล้วที่ข้าจะต้องออกเดินทางผจญภัย [ROOT.Char.GetTitleTierName]ของข้า" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คำนับเท่าที่[inspiration_owner.GetSheHe]จะทำได้ ในขณะที่แบกกระเป๋าหนักอึ้ง\n\n"ก่อนที่ข้าจะไป โปรดบอกข้าด้วย มีอะไรเป็นพิเศษที่ท่านต้องการให้ข้าจับตามองในระหว่างการเดินทางของข้าหรือไม่?""
 fund_inspiration.5011.a:0 "นำบางสิ่งจากสัตว์ต่างถิ่นมาให้ข้า กะโหลกหรือหนังสัตว์"
 fund_inspiration.5011.b:0 "ข้าต้องการเครื่องประดับเล็กๆ น้อยๆ ที่ทำจากวัสดุที่หาไม่ได้ที่นี่"
 fund_inspiration.5011.c:0 "พรมแขวนผนัง หรืองานศิลปะที่ ทำให้ข้าปรารถนาจะได้ไปที่นั่น"
 fund_inspiration.5011.d:0 "ข้าเชื่อในสัญชาตญาณของเจ้าว่าจะนำสิ่งดีๆ มาให้ข้า"
 fund_inspiration.5011.e:0 "ข้าต้องการครอบครองบางสิ่งที่พิเศษอย่างแท้จริง!"

 fund_inspiration.5021.t:0 "$fund_inspiration.title$ การเปลี่ยนทิศทาง"
 fund_inspiration.5021.desc:1 "นักเดินทางผู้หนึ่งอ้างว่าเป็นลูกจ้างภายใต้ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ถูกนำตัวมาเข้าเฝ้าข้า พร้อมถือสาส์นจากนักผจญภัยผู้นั้น\n\n"อย่าได้กังวลไปเลย ท่าน [ROOT.Char.GetLadyLord] ผู้ยิ่งใหญ่ เพราะ [inspiration_owner.GetTitledFirstNameNoTooltip] สบายดี ข้านำข่าวเกี่ยวกับความเป็นไปได้ที่จะสนับสนุนทุนสำหรับการผจญภัยที่ยิ่งใหญ่กว่าเดิมมาแจ้ง! คืออย่างนี้ [inspiration_owner.GetTitledFirstNameNoTooltip] เลี้ยวผิดที่ไหนสักแห่ง และตอนนี้อยู่ใกล้กับ [adventuring_location.GetNameNoTier]"\n\nสหายร่วมเดินทางของ [inspiration_owner.GetFirstNamePossessiveNoTooltip] คลี่แผนที่สกปรกออกมาให้ข้าดูว่าพวกเขาไปอยู่ที่ใด "[inspiration_owner.GetSheHe|U] มีทุนทรัพย์เพียงพอที่จะเดินทางไปยัง [inspiration_owner.Custom('InspirationAdventureDestination')] ตามแผน แต่เสนอว่าหากมีทุนเพิ่มเติม [inspiration_owner.GetSheHe] จะสามารถติดตามข่าวลือในท้องถิ่นและนำวัตถุโบราณอันยิ่งใหญ่กลับมาได้!""
 fund_inspiration.5021.a:0 "นี่มันไร้สาระ! ข้าจะไม่ให้ทุนสนับสนุน #EMP การเดินทางตามใจตัวเอง#!! ของพวกเขา"
 fund_inspiration.5021.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] กลับไปทำสิ่งที่ [inspiration_owner.GetSheHe] ตั้งใจจะทำ"
 fund_inspiration.5021.b:0 "ชีวิตคือการผจญภัย จงสำรวจพื้นที่นั้นเพื่อหาสิ่งประดิษฐ์!"
 fund_inspiration.5021.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] สำรวจ [adventuring_location.GetNameNoTierNoTooltip]"

## Postcards from your Adventurer by Isabella Welch

#Steppe

 fund_inspiration.6001.t:0 "ทุ่งหญ้าสเตปป์และอานม้าควบผ่านใจข้า"
 fund_inspiration.6001.desc:1 "ข้าขี่ม้ามาหลายเดือนแล้ว บั้นท้ายข้าคงไม่มีวันหายดี! ข้าติดใจรสชาตินมม้าหมักและการนอนใต้ฟ้าเปิดเสียแล้ว\n\nพร้อมกับผู้ส่งสารนี้ ข้าส่งปลายหัวม้าแกะสลักของโมรินคูร์มาให้ — หัวม้าประดับที่วางอยู่บนเครื่องดนตรี บางทีท่านอาจมีประโยชน์สำหรับมัน"
 fund_inspiration.6001.a:0 "ข้าจะเก็บสิ่งนี้ไว้!"
 fund_inspiration.6001.b:0 "ส่งไปให้นักดนตรีประจำราชสำนัก"

#India

 fund_inspiration.6002.t:0 "การเดินทางท่องอินเดียของข้าดำเนินต่อไป!"
 fund_inspiration.6002.desc:0 "ข้าแทบจะตาบอดด้วยอัญมณีทั้งหมดที่ราชสำนักที่ข้าไปเยือนนำมาให้ข้าชม ข้าพบว่าตัวเองโหยหาความสกปรกของถนนที่เปิดโล่ง\n\nข้าได้ส่งผู้ส่งสารพร้อมของขวัญที่ไร้รสนิยมเป็นพิเศษที่ข้าได้รับมา — เครื่องประดับหัวเสือบนแหวน พร้อมอัญมณีเป็นดวงตา ท่านเคยเห็นอะไรที่ฉูดฉาด เช่นนี้หรือไม่?"
 fund_inspiration.6002.a:0 "ข้าค่อนข้างชอบมันนะ เขาพลาดเอง"
 fund_inspiration.6002.b:0 "น่าเกลียด! แยกชิ้นส่วนแล้วขายอัญมณีเสีย"

#Africa

 fund_inspiration.6003.t:0 "ข้าฝันถึงทะเลทราย"
 fund_inspiration.6003.desc:0 "ใต้เท้าของข้าพเจ้า การเดินทางสู่แอฟริกาของข้ากำลังดำเนินอยู่ และข้าได้เข้าร่วมขบวนอูฐที่เดินทางข้ามความกว้างของแผ่นดิน\n\nข้าส่งเครื่องประดับชิ้นหนึ่งที่เพื่อนร่วมเดินทางคนหนึ่งมอบให้ข้ามาให้ท่าน — สร้อยคอที่ละเอียดอ่อนที่สุดประดับด้วยลูกปัดเปลือกไข่นกกระจอกเทศ ข้าเดาว่าท่านคงไม่เคยเห็นนกกระจอกเทศ"
 fund_inspiration.6003.a:0 "ของดีนี่! ข้าจะสวมมันเอง"
 fund_inspiration.6003.b:1 "ข้าจะมอบมันให้ [event_spouse.GetTitledFirstNameNoTooltip]"

#Middle East

 fund_inspiration.6004.t:0 "อา ที่จะเป็นผู้แสวงบุญ"
 fund_inspiration.6004.desc:0 "การเดินทางของข้าผ่านตะวันออกกลางส่วนใหญ่เกี่ยวข้องกับการต่อสู้กับฝูงพ่อค้าเร่ตามเส้นทางแสวงบุญ\n\nบ่อยครั้ง เพื่อไม่ให้ภารกิจของข้าล่าช้าเกินไป ข้ายอมแพ้และซื้อเครื่องประดับเล็กๆ น้อยๆ ของพวกเขา ข้าได้ส่งผู้ส่งสารนำของไร้ค่ามาให้ท่านแล้ว บางทีมันอาจจะให้ความบันเทิงบ้าง"
 fund_inspiration.6004.a:0 "นักผจญภัยที่ใช้เส้นทางธรรมดาจะมีประโยชน์อะไร?"
 fund_inspiration.6004.b:0 "นี่เป็นเครื่องประดับเล็กๆ น้อยๆ ที่สวยงาม..."

#Europe

 fund_inspiration.6005.t:0 "การผจญภัยของข้าเปียกโชก"
 fund_inspiration.6005.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าพบของศักดิ์สิทธิ์เล็ก ๆ น้อย ๆ สองสามชิ้นในการผจญภัยของข้า ซึ่งข้าได้ส่งมากับผู้ส่งสารนี้ แต่ข้าไม่แน่ใจว่าข้าจะค้นพบสิ่งใดต่อไป\n\nชาวยุโรปเป็นสิ่งมีชีวิตที่เหม็นที่สุดเท่าที่ข้าเคยพบมา ตอนเด็ก ข้าฝันถึงทุ่งหญ้าสีเขียวขจีและน่ารื่นรมย์ แต่ข้ามั่นใจว่าครึ่งหนึ่งของโลกนี้ทำจากโคลน หากท่านเป็นนายผู้เมตตา โปรดส่งข่าวเรียกข้ากลับไปด้วย"
 fund_inspiration.6005.a:0 "นี่ไม่ใช่วันหยุด! ทำภารกิจต่อไป!"
 fund_inspiration.6005.b:0 "น่าสงสาร ข้าคิดว่ารางวัลเหล่านี้คงจะเพียงพอ"
 fund_inspiration.6005.b.tt:0 "ท่านอนุญาตให้ [inspiration_owner.GetTitledFirstName] กลับบ้าน"

#Asia minor

 fund_inspiration.6006.t:0 "ทักทายจากอานาโตเลีย"
 fund_inspiration.6006.desc:0 "การเดินทางของข้าทั่วเอเชียไมเนอร์ ทำให้ข้าติดใจรสชาติเนื้อแกะ โยเกิร์ต และมะเขือยาว และข้าได้ส่งสูตรอาหารบางอย่างมาพร้อมกับผู้ส่งสารนี้\n\nข้าได้รับเข็มกลัดทองคำประดับด้วยม้าน้ำจากเจ้าภาพคนหนึ่ง ซึ่งข้าส่งมาให้ท่านด้วย ข้ามั่นใจว่าการเดินทางของข้าจะนำสิ่งมหัศจรรย์มาให้ในไม่ช้า"
 fund_inspiration.6006.a:0 "สั่งให้พ่อครัวของเราเตรียมอาหารเหล่านี้ทันที!"
 fund_inspiration.6006.b:0 "[inspiration_owner.GetSheHe|U] ดูเหมือนจะสนุกกับการเดินทางครั้งนี้มากเกินไป..."

# Miniature furniture events by Isabella Welch

#Artisan gives you a tiny chest and loses the tiny key
 fund_inspiration.6100.t:1 "$fund_inspiration.title$ ผู้ปกครองจำลอง"
 fund_inspiration.6100.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คว้าความสนใจของข้าอย่างร่าเริง "[ROOT.Char.Custom('FormOfAddressForLiege')|U] ข้าทำหีบต้นแบบขนาดจิ๋วที่ท่านสั่งเสร็จแล้ว พร้อมกลไกกลอนที่ใช้งานได้"\n\n[inspiration_owner.GetSheHe|U] ยื่นฝ่ามือของ [inspiration_owner.GetHerHis] ออกมา และบนนั้นมีหีบใบเล็กจิ๋ว พร้อมใบไม้สีทองและกุญแจที่เล็กเท่าเมล็ดข้าว\n\n"มีอัญมณีอยู่ข้างใน ลองดูสิ" ขณะที่ [inspiration_owner.GetSheHe] ส่งมันมา กุญแจก็หลุดระหว่างนิ้วของ [inspiration_owner.GetHerHis] และปลิวหายไป แม้ [inspiration_owner.GetSheHe] จะพยายามคลำหา แต่ก็ไม่พบวี่แววของมันเลย"
 fund_inspiration.6100.a:0 "จบเรื่องตลกนี้เสีย ทำลายหีบและคืนอัญมณีของข้ามา!"
 fund_inspiration.6100.b:0 "มันยังคงมีเสน่ห์ ข้าคิดว่าข้าจะเก็บมันไว้"

 # The tiny box

 fund_inspiration.6101.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยื่นกล่องเล็กๆ ใบหนึ่งออกมา มีลายแกะสลักละเอียดราวเส้นผมสลักอยู่บนนั้น "ต้นแบบสำหรับงานสั่งทำล่าสุดของท่าน ข้าไม่อยากให้มันสูญเปล่า เราอาจหาประโยชน์ให้ของน่ารักชิ้นนี้ได้"\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] หูผึ่ง "เราสามารถใส่ของศักดิ์สิทธิ์แห่งยุคสมัยของเราไว้ข้างในแล้วฝังไว้ที่ไหนสักแห่ง — สร้างของที่ระลึกให้ลูกหลานในอนาคตได้เปิดเผย!""
 fund_inspiration.6101.a:0 "ข้าจะเก็บภาพเหมือนขนาดจิ๋วของข้าไว้ข้างใน"
 fund_inspiration.6101.b:0 "ข้าจะเขียนบทกวีเล็กๆ และผนึกไว้ข้างใน"
 fund_inspiration.6101.c:0 "ข้าอยากจะเก็บมันไว้กับตัวเองมากกว่า"

# Stepping on the tiny sculpture

 fund_inspiration.6102.desc:0 "ข้ากำลังเตรียมตัวเข้านอน เมื่อความเจ็บปวดแสบร้อนแล่นผ่านเท้าข้า\n\nเมื่อตรวจสอบ ข้าพบว่ามีประติมากรรมขนาดจิ๋วฝังอยู่ในเนื้อฝ่าเท้าของข้า โดยมีเท้าของมันยื่นออกมา\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มองข้าอย่างเขินอายจากประตูที่ใกล้ที่สุด "ข้าขออภัย นั่นคือต้นแบบสำหรับงานสั่งทำล่าสุดของท่าน ข้าคงทำมันหล่น""
 fund_inspiration.6102.a:0 ""ดึงมันออกไปแล้วเอามันไปให้พ้นสายตาข้า!""
 fund_inspiration.6102.b:0 ""หมอหลวงควรมาดูเรื่องนี้""
 fund_inspiration.6102.c:0 "ดึงมันออกเองแล้วเก็บใส่กระเป๋า"
 fund_inspiration.6102.cure_toast:0 "ของจิ๋วถูกดึงออกอย่างปลอดภัย"
 fund_inspiration.6102.failure_toast:0 "ของจิ๋วที่ดื้อรั้น"
 fund_inspiration.6102.failure_toast_desc:0 "ชิ้นส่วนแขนหายเข้าไปในส่วนลึกของเท้าท่าน"

# Being shown the tiny cabinet


 fund_inspiration.6103.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คำนับ "ข้าอยากได้คำวิจารณ์เกี่ยวกับตู้ที่ข้ากำลังประดิษฐ์ให้ท่าน [ROOT.Char.Custom('FormOfAddressForLiege')]" \n\n[inspiration_owner.GetSheHe|U] พาข้าไปยังที่ทำงานของ [inspiration_owner.GetHerHis] ที่ ซึ่งมีเพียงตู้เก่า ๆ ที่เต็มไปด้วยฝุ่นและผุพังอย่างน่าเป็นห่วง\n\n"โอ้ นั่นไม่ใช่ชิ้นงาน" [inspiration_owner.GetSheHe] เปิดตู้เก่าซอมซ่อ และข้างในไม่มีอะไรเลยนอกจากตู้จำลองขนาดจิ๋ว — หรูหรา ประดับหินและปิดทอง แต่สูงประมาณนิ้วของข้า "ท่านคิดว่าอย่างไร?""
 fund_inspiration.6103.a:0 "เพื่อประโยชน์ของเจ้าเอง นี่ควรเป็นเพียงต้นแบบเท่านั้น"
 fund_inspiration.6103.b:0 "โอ้ มันสมบูรณ์แบบ! ข้าชอบมันมาก!"

# Artisan gives you the tiny throne

 fund_inspiration.6104.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] นำกล่องเล็ก ๆ มาให้ข้า และมอบมันให้ข้าด้วยรอยยิ้ม\n\nขณะที่ข้าเปิดของขวัญ ข้าคาดหวังว่าจะได้อัญมณี แหวน หรือเครื่องแกะสลัก แต่ที่น่าประหลาดใจคือ ข้างในเป็นบัลลังก์จำลองขนาดจิ๋ว เล็กเสียจนมีเพียงหนูเท่านั้นที่จะนั่งได้\n\n"ต้นแบบสำหรับที่นั่งใหม่ของท่าน [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าคิดว่ามันจะ ทำให้ท่านขบขัน""
 fund_inspiration.6104.a:0 "ช่างมีเสน่ห์อะไร เช่นนี้! ข้าจะเก็บสิ่งนี้ไว้!"
 fund_inspiration.6104.b:0 "ดีมาก แต่จงทำงานต่อไปเถิด"
 fund_inspiration.6104.c:0 "ข้า #EMP โตเกินไป#! ที่จะเล่นของเล่นแล้ว"

 # Artisan and ROOT play with their miniatures
 
 fund_inspiration.6105.desc:1 "ข้ากำลังถือกล่องเฟอร์นิเจอร์ขนาดจิ๋วของข้าอย่างภาคภูมิใจผ่าน [ROOT.Char.Custom('FortifiedBuilding')] พลางสงสัยว่าจะจัดแสดงพวกมันไว้ที่ใดดีที่สุด เมื่อข้าชนเข้ากับ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)]\n\nเมื่อ [inspiration_owner.GetSheHe] เห็นข้างในกล่อง [inspiration_owner.GetSheHe] เช็ดน้ำตาออกจากดวงตา [inspiration_owner.GetHerHis] "[ROOT.Char.GetWomanMan] ผู้มีรสนิยม ตามข้ามา"\n\n[inspiration_owner.GetSheHe|U] พาข้าไปยังโรงทำงาน [inspiration_owner.GetHerHis] และนำลังลับออกมา ข้างในมีฉากจำลอง หุ่นจำลอง และภูมิประเทศขนาดจิ๋วหลายสิบชิ้น "ข้าได้คิดค้นเกมขึ้นมา — การรบปิดล้อมในจินตนาการ ท่านจะร่วมเล่นกับข้าหรือไม่?""
 fund_inspiration.6105.a:0 "ข้าคิดว่าเจ้าจะไม่มีวันถามเสียอีก!"
 fund_inspiration.6105.b:0 "เอ่อ บางทีอาจเป็นครั้งหน้า"

# Weaver is being too much of a modernist 
 fund_inspiration.6200.t:1 "$fund_inspiration.title$ องค์ประกอบในสีแดง น้ำเงิน และ [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.6200.desc:2 "ข้าไปตรวจดูโรงทอผ้าของข้าเพื่อดูความคืบหน้าของพรมแขวนผนัง ข้างในมีข้าราชสำนักอยู่สองสามคน พวกเขากำลังตรวจดูผนัง มือไพล่หลัง พรมแขวนผนังที่จัดแสดงอยู่นั้นเป็นการแต้มสีที่แปลกประหลาด ผืนหนึ่งมีรอยเปื้อนดูเก้งก้าง อีกผืนเป็นสีขาวมีสี่เหลี่ยมสองสามอัน อีกผืนมีเส้นพันกันหมุนวน นี่มันศิลปะประเภทใดกัน?\n\n[artistic_courtier_1.GetTitledFirstName] ชี้ไปที่ส่วนที่ดูเหมือนรอยเปื้อน "สีน้ำตาลสกปรกตัดกับสีขาวนี้ไม่ได้สื่อถึงความรุนแรงที่มีอยู่ในตัวมนุษย์หรอกหรือ?"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] พยักหน้า "ข้าคิดว่ามันแสดงถึง [ROOT.Char.GetTitledFirstNameNoTooltip] ที่กำลังต่อต้านวัยเด็ก [ROOT.Char.GetHerHis] - มันดูเหมือนรูปร่างของมารดา [ROOT.Char.GetHerHis]""
 fund_inspiration.6200.a:0 "พยักหน้าเข้าใจและชมเชยศิลปิน"
 fund_inspiration.6200.b:0 ""น่าขยะแขยง! ข้าต้องไปดูศิลปะแบบดั้งเดิมเดี๋ยวนี้""
 fund_inspiration.6200.b.tt:0 "เงินลงทุนของท่านจะถูกส่งคืนและงานจะถูกยกเลิก"
 fund_inspiration.6200.c:0 ""[child.GetTitledFirstNameNoTooltip] ก็ทำแบบนั้นได้!""


#Poet is uninspired, does not feel they understand love at the moment by Isabella Welch

 fund_inspiration.6300.t:0 "$fund_inspiration.title$ บทกวีอันเศร้าสร้อย"
 fund_inspiration.6300.intro:0 "ข้าบังเอิญพบ [inspiration_owner.GetTitledFirstName] ที่โต๊ะทำงาน [inspiration_owner.GetHerHis] กำลังจ้องมองออกไปนอกหน้าต่าง โดยมีร่างที่ขีดฆ่าทิ้งมากมายอยู่ตรงหน้า [inspiration_owner.GetHerHim]\n\n"
 fund_inspiration.6300.no_relationship_desc:0 ""ความคิดที่ว่าจะมีใครสักคนรักข้าเป็นไปไม่ได้ ไม่เคยมีสักครั้งที่ข้ากระซิบถ้อยคำแห่งความรู้สึกกับใครสักคนที่ตอบรับความรู้สึกนั้น"\n\n"ด้วยเหตุนี้ ข้าจึงไม่ได้เขียนให้ท่าน — ข้าเพียง แต่นับคืนวันที่ข้าไม่ได้นอนกับใครและสิ้นหวัง""
 fund_inspiration.6300.no_love_desc:0 ""แม้ว่าปกติจะไม่มีอะไร ทำให้ข้าตื่นเต้นได้เท่าตัวอักษร แต่ที่น่าประหลาดใจคือ ตอนนี้ข้าไม่รู้สึกถึงความปรารถนาใด ๆ เลย"\n\n"ขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')] ข้าไม่สามารถเขียนเกี่ยวกับความรักได้ แรงบันดาลใจได้ทอดทิ้งข้าไปแล้ว""
 fund_inspiration.6300.homosexual_desc:0 ""อา [ROOT.Char.Custom('FormOfAddressForLiege')] แม้ว่าข้าจะใช้เวลาหลายชั่วโมงพยายาม แต่งผลงานโรแมนติกที่คู่ควรกับการอุปถัมภ์ของท่าน แต่ข้ากลับพบว่าตนเองไม่ได้ทำสิ่งใดเลยนอกจากร่ำไห้บนแผ่นหนัง"\n\n"ท่านกำลังขอให้ข้าทำสิ่งที่เป็นไปไม่ได้ ความรักของข้าเป็นประเภทที่ต้องคงอยู่โดยไม่ถูกเขียนถึง""
 fund_inspiration.6300.a:0 "ดี! จงถ่ายทอดความขุ่นเคืองอันหวานอมขมกลืนนั้นออกมา!"
 fund_inspiration.6300.a.failure:0 "ท่าน ทำให้ [inspiration_owner.GetShortUIName] เกลียดชังความรัก"
 fund_inspiration.6300.a.success:0 "ท่านโน้มน้าวให้ [inspiration_owner.GetShortUIName] เขียนถึงความรัก"
 fund_inspiration.6300.b:0 "เอาล่ะ ข้าพอมีเวลาว่างครึ่งชั่วโมง"
 fund_inspiration.6300.c:0 "เป็นไปไม่ได้! โลกไม่เห็นเสน่ห์ในวาทศิลป์ของเจ้าได้อย่างไร?"
 fund_inspiration.6300.d:0 "แต่มันคือความรักที่จะต้องใช้ชีวิตอยู่กับมัน"
 fund_inspiration.6300.e:0 "จงเขียนความจริงของเจ้า ข้าอวยพรให้แรงบันดาลใจทุกประการ"
 fund_inspiration.6300.f:0 "แต่งเรื่องขึ้นมาสิ! ทุกคนที่เขียนเรื่องความรักล้วนเป็นนักต้มตุ๋น"

#Poet sends you a book on same sex love if you requested it, as a side project by Isabella Welch

#fund_inspiration.6301.lover_t: "My [ROOT.Custom('LoverPetName')],"
#fund_inspiration.6301.friend_t: "My dearest ally,"
 fund_inspiration.6301.t:0 "$fund_inspiration.title$ สหายรักของข้า"
 fund_inspiration.6301.lover_desc:0 "คืนที่ท่านบอกให้ข้าเขียนจากใจ ข้าพบว่าข้าเขียนได้ แต่เรื่องของท่านเท่านั้น ให้ข้าเล่นบทผู้ร้ายเถิด หากศรัทธาเรียกความรักแบบของเราว่าชั่วร้าย"
 fund_inspiration.6301.friend_desc:0 "ข้าไม่เคยรู้สึกว่าถ้อยคำของข้าไหลลื่นเหมือนตอนที่ท่านบอกให้ข้าเขียนเรื่องราวความรักตามที่ข้าประสบ"
 fund_inspiration.6301.female_desc:0 "\n\nนี่คือบทกวีเกี่ยวกับแม่มดที่ตกหลุมรักราชินี ซึ่งหลงทางในป่าใกล้กระท่อมของนาง"
 fund_inspiration.6301.male_desc:0 "\n\nนี่คือบทลำนำเกี่ยวกับเจ้าชายผู้ดูดาวกับบรรณารักษ์อันเป็นที่รักของเขาทุกคืนบนยอดหอสมุด ฝันถึงการรักกันบนสวรรค์"
 fund_inspiration.6301.crime_desc:0 "ช่างเป็นอาชญากรรมที่สวยงาม"
 fund_inspiration.6301.a:0 "ข้าจะทะนุถนอมมัน แต่จะเก็บไว้เป็นความลับ"
 fund_inspiration.6301.b:0 "ช่างโลกปะไร ข้าจะจัดการอ่านบทกวี!"
# Adventurer hasn't actually gone on the adventure!
 fund_inspiration.6400.t:1 "$fund_inspiration.title$ เที่ยวผับ"
 fund_inspiration.6400.desc:0 "ระหว่างการเยี่ยมชมโรงเตี๊ยมใน [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ข้าเหลือบเห็นผู้อุปถัมภ์คนหนึ่งเป็นศูนย์กลางของความสนใจทั้งหมด\n\n[inspiration_owner.GetSheHe|U] ดูทรุดโทรมกว่าผู้อุปถัมภ์คนอื่นๆ และมีกลิ่นเหมือน [inspiration_owner.GetSheHe] อยู่ที่นั่นมานานแล้ว ที่น่าตกใจคือ ข้าจำนักผจญภัยของข้า [inspiration_owner.GetTitledFirstName] ได้ ซึ่งดูเหมือนจะยังไม่ได้ออกจากบ้านเกิดหลังจากได้รับทุนสนับสนุนมาหลายเดือน!\n\n"และสำหรับการเดินทางครั้งต่อไปของข้า ข้าจะข้ามทะเลแดงในอึกเดียว!" [inspiration_owner.GetSheHe] ดื่มไวน์แดงทั้งแก้วทันที และเสียงเชียร์ก็ดังไปทั่วโรงเหล้า"
 fund_inspiration.6400.a:0 "ออกไปจากที่นี่แล้วออกเดินทางเสีย!"
 fund_inspiration.6400.b:0 "นักต้มตุ๋น! ข้าจะไม่จ่ายค่าเหล้าให้เจ้าอีกต่อไป!"
 fund_inspiration.6400.a.success:0 "ท่านโน้มน้าวให้นักผจญภัยรวบรวมสติ [inspiration_owner.GetHerselfHimself]"
 fund_inspiration.6400.a.success_continue:0 "การผจญภัยดำเนินต่อไป!"
 fund_inspiration.6400.a.failure:0 "นักผจญภัยหนีไปพร้อมทองคำ!"

 fund_inspiration.6500.t:0 "$fund_inspiration.title$ นำดนตรีสู่ป่าดงดิบ"
 fund_inspiration.6500.introduction:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า พร้อมถ้อยคำที่ประดับประดาเสียจน ข้าสามารถเห็น [inspiration_owner.GetHerHim] ในโรงละครแห่งความคิดของข้า"
 fund_inspiration.6500.desc:0 "\n\n'ข้าได้เดินทางเท้าเข้าไปในป่าดงดิบ เสียงร้องของนกดังกระหึ่มในกะโหลกศีรษะข้า และข้าพบว่ามันเป็นบทเพลงโศกอันน่าสะพรึงกลัวโดยแท้ ชาวบ้านไม่กี่คนที่นี่บอกข้าว่าพวกเขาพบว่ามันเป็นดนตรีที่ไพเราะที่สุด เห็นได้ชัดว่าพวกเขาไม่เคยได้ยินผลงานของ [court_musician.GetTitledFirstNameNoTooltip]\n\n'ข้าลองเล่นทำนองเพลงหนึ่งของ [court_musician.GetHerHis] ด้วยปี่ต้นอ้อของพวกเขา และชาวบ้านก็ไล่ข้าออกจากเมืองของพวกเขาและกรีดข้าด้วยใบมีดอาบยาพิษ แม้ว่าข้าจะรอดชีวิตมาได้ ข้าก็คิดว่า "หากข้าตายขณะนำดนตรีเชมเบอร์มาสู่ป่าดงดิบ ก็ช่างมันเถิด!""
 fund_inspiration.6500.action:0 "\n\n'ท่านคงจินตนาการได้ว่าข้าทำอะไรต่อไป...'"
 fund_inspiration.6500.a:0 "เจ้าเริ่มร้องเพลง และเอาชนะใจพวกเขาได้!"
 fund_inspiration.6500.b:0 "เจ้าหนีไปยังดินแดนที่เจริญกว่า"
 fund_inspiration.6500.c:0 "แมวใหญ่ตัวหนึ่งกระโดดเข้ามาขวางระหว่างเจ้ากับผู้โจมตี!"
 fund_inspiration.6500.a.success:0 "นักผจญภัย ทำให้ชาวป่าหลงเสน่ห์"
 fund_inspiration.6500.a.failure:0 "นักผจญภัย ทำให้ชาวป่ารำคาญ"
 fund_inspiration.6500.b.success:0 "นักผจญภัยหนีไปอย่างรวดเร็ว"
 fund_inspiration.6500.b.failure:0 "นักผจญภัยหนีไม่เร็วพอ"
 fund_inspiration.6500.c.tt:0 "นักผจญภัยช่วยต่อสู้กับเสือดาว"
 fund_inspiration.6500.c.tt_failure:0 "นักผจญภัยได้รับบาดเจ็บขณะพยายามหลบหนี"

 fund_inspiration.6501.t:0 "$fund_inspiration.title$ การเดินทางข้ามแผ่นดิน"
 fund_inspiration.6501.desc:1 "\n\n'เราได้ล่องเรือขึ้นไปตามแม่น้ำรอบๆ เนินเขาที่คดเคี้ยว หลังจากเกิดภัยแล้ง ชาวบ้านบอกเราว่าแม่น้ำที่เราเดินทางมานั้นแห้งขอดไปข้างหน้าเรือของเรา\n\n'แทนที่จะยอมแพ้ หรือหันหลังกลับ เราพยายามทำสิ่งที่เป็นไปไม่ได้ ข้าสั่งให้ลูกเรือเริ่มสร้างระบบรางและรอก และเราเริ่มลากเรือของเราข้ามแผ่นดินไปยังแม่น้ำสายถัดไป มันแล่นไปในทะเลหญ้าและดอกเดซี่"
 fund_inspiration.6501.a:0 "ข้าหวังว่าเจ้าจะหันหลังกลับและยอมขาดทุน"
 fund_inspiration.6501.b:0 "เรือรอดจากการเดินทางมาได้อย่างหวุดหวิด"
 fund_inspiration.6501.b.success:0 "นักผจญภัยลากเรือขึ้นหน้าผา"
 fund_inspiration.6501.b.failure:0 "นักผจญภัยติดอยู่กับการซ่อมเรือที่พัง"
 fund_inspiration.6501.c:0 "ชาวบ้านสงสาร และให้เรือลำใหม่แก่เจ้าในราคาส่วนลด"

 fund_inspiration.6502.t:0 "$fund_inspiration.title$ ความกระหายอันแผดเผา"
 fund_inspiration.6502.desc:0 "\n\n'ข้าไม่ได้อยู่ในทะเลทราย ข้าอยู่ในดินแดนแห่งความฝัน ความแตกต่างระหว่างการตื่นและการหลับได้หายไปแล้ว ผู้นำทางบอกข้าว่าข้าเห็นภาพหลอนในสิ่งที่ข้าปรารถนามากที่สุด สรวงสวรรค์ สระน้ำที่ส่องประกายราวเพชร ประดับด้วยสมบัติที่ริมตลิ่ง\n\n'แทนที่จะเป็น เช่นนั้น [ROOT.Char.Custom('FormOfAddressForLiege')] สิ่งเดียวที่ข้าเห็นคือท่านอยู่ที่นี่กับข้า อยู่ข้างหน้าบนเนินทรายเสมอ กวักมือเรียกให้ข้าไปต่อ และมัน ทำให้ข้าใจสลายที่รู้ว่าทุกย่างก้าวที่ข้าก้าวไปสู่ภาพลวงตานั้น ข้ากลับก้าวห่างไกลจากตัวตนที่แท้จริงของท่านมากขึ้น'"
 fund_inspiration.6502.a:0 "โอ้ ข้ารู้สึกกระหาย เช่นกัน ทั้งที่ข้าไม่ได้อยู่ในทะเลทราย"
 fund_inspiration.6502.b:0 "ข้าอาจพิจารณาความสนใจของเจ้า หากเจ้านำรางวัลอันยิ่งใหญ่มาให้"
 fund_inspiration.6502.c:0 "ข้าโทษว่าเป็น เพราะความร้อน และเผาถ้อยคำเหล่านี้ทิ้งเสีย"

 fund_inspiration.6503.t:0 "$fund_inspiration.title$ เสียงกระซิบแห่งปอนติก"
 fund_inspiration.6503.desc:0 "\n\n'ข้าได้เข้าไปสำรวจในคูร์กัน เนินฝังศพโบราณจากยุคของชาวไซเธียน ม้าที่ตายไปนานแล้วหลายร้อยตัว ถูกสตัฟฟ์ ถนอมสภาพ และตรึงไว้กับผนังให้ยืนตัวตรง แต่ละตัวมีห้องของตัวเอง มันเป็นคอกม้าสำหรับผู้ถูกสาปแช่ง ที่สูญหายไปตามกาลเวลา\n\n'เมื่อรู้ถึงหน้าที่ของข้าในการแสวงหาความรู้เพื่ออาณาจักรของเรา ข้าพิจารณาที่จะขโมยของศักดิ์สิทธิ์จากสุสานเมื่อผู้นำทางของข้าไม่ทันมองเพื่อนำมาให้ท่าน"
 fund_inspiration.6503.a:0 "เจ้าหยิบเครื่องประดับชิ้นหนึ่งใส่กระเป๋า"
 fund_inspiration.6503.b:0 "เจ้านำอานม้าตัวหนึ่งมา เพื่อการศึกษาของเรา"
 fund_inspiration.6503.c:0 "เจ้าไม่กล้ารบกวนผู้ตาย"

 fund_inspiration.6504.t:0 "$fund_inspiration.title$ คนรักของ [inspiration_owner.GetLadyLord|U] [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.6504.desc:0 "\n\n'เอ่อ [ROOT.Char.Custom('FormOfAddressForLiege')] ระหว่างการเดินทาง ข้าได้พักที่ฟาร์มแห่งหนึ่ง ซึ่งดูแลโดย [adventurer_lover.GetTitledFirstName]'"
 fund_inspiration.6504.pregnant:0 "\n\n'ข้าได้สร้างสิ่งประดิษฐ์ชั้นดีขึ้นมาชิ้นหนึ่งขณะอยู่ที่ฟาร์ม! กล่าวคือ เด็กคนหนึ่ง! แม้ว่านี่อาจเป็นการรบกวน แต่ข้าไม่สามารถพา [adventurer_lover.GetTitledFirstName] เดินทางไปกับข้าในสภาพ [adventurer_lover.GetHerHis] ได้ [adventurer_lover.GetSheHe|U] มีทรัพย์สมบัติเพียงน้อยนิด และข้าหวังว่าเราจะสามารถดูแล [adventurer_lover.GetHerHim] ที่ราชสำนักได้'"
 fund_inspiration.6504.female_lover:0 "\n\n'หลังจากอยู่คนเดียวบนท้องถนนมาหลายเดือน [adventurer_lover.GetSheHe] ก็ ทำให้หัวใจข้าหวั่นไหวราวกับสัตว์ในจินตนาการ ข้าอดคิดไม่ได้ว่านี่คือจุดที่ภารกิจของข้าควรจะนำพาข้ามา"
 fund_inspiration.6504.male_lover_homosexual:0 "\n\n'เมื่อพ้นจากสายตาของราชสำนัก ข้าสามารถนอนอยู่ในอ้อมแขนของบุรุษได้หลายคืนติดต่อกัน"
 fund_inspiration.6504.male_lover:0 "\n\n'ข้ากำลังมีความรัก และข้ายอมใช้เวลาหนึ่งสัปดาห์เฝ้ามอง [adventurer_lover.GetHerHim] ตักมูลม้า มากกว่างานเลี้ยงใดๆ ในราชสำนัก"
 fund_inspiration.6504.lover_ultimatum:0 "ข้าไม่สามารถเดินจากฟาร์มนี้ไปได้ โดยรู้ว่าข้าอาจจะไม่ได้จูบ [adventurer_lover.GetHerHim] อีกเลย ไม่ว่า [adventurer_lover.GetSheHe] จะเดินทางมาหาท่านและเข้าร่วมราชสำนักของเรา หรือการเดินทางของข้าจะสิ้นสุดลงที่นี่'"
 fund_inspiration.6504.a:0 "ไปให้พ้น หากเจ้าไม่เคารพการอุปถัมภ์ของข้า"
 fund_inspiration.6504.a.tt:0 "[inspiration_owner.GetTitledFirstName] จะอยู่ที่ฟาร์ม"
 fund_inspiration.6504.b:0 "ข้าจะอนุญาต แต่จงอย่าโทษข้าสำหรับเรื่องอื้อฉาว"
 fund_inspiration.6504.c:0 "เด็กไม่สมควรได้รับความยากจน"
 fund_inspiration.6504.d:0 "ชาวนา? ในราชสำนักของข้า? ไม่มีทาง"

 fund_inspiration.6505.t:0 "$fund_inspiration.title$ บทแห่งชายหาด"
 fund_inspiration.6505.desc:0 "\n\n'ท่ามกลางการหอบหายใจในความร้อนของทะเลทราย ข้าได้ค้นพบแหล่งน้ำอันบริสุทธิ์ ซึ่งเพียงแค่ได้เห็นก็ ทำให้ข้าถอดเสื้อผ้าทั้งหมดออก แทนที่จะถือเป็นความผิด ผู้นำทางของข้ากลับหัวเราะเบาๆ อย่างเข้าใจ และเริ่มร่างภาพข้าลงบนหน้ากระดาษ สหายร่วมเดินทางของเราในคณะโบกกิ่งปาล์มเพื่อพัดให้ข้าเย็นลง เป็นการแสดงความเอาใจใส่\n\n'เราใช้เวลาหลายชั่วโมงอย่างมีความสุขในการเล่นน้ำ ในหมู่บ้านถัดไป ข้าได้จ้างช่างทอผ้าให้บันทึกช่วงเวลาแห่งสรวงสวรรค์นั้น และข้าส่งความทรงจำมาให้ท่านพร้อมกับผู้ส่งสารนี้'"
 fund_inspiration.6505.a:0 "ตาข้า! ตาข้า!"
 fund_inspiration.6505.a_blind:0 "ข้าคงควักลูกตาออก หากข้ายังไม่ตาบอด"
 fund_inspiration.6505.a_one_eyed:0 "ตาข้า! ตาข้า!"
 fund_inspiration.6505.b:0 "ข้าจะแขวนสิ่งนี้ไว้ในห้องนอนของข้า!"
 fund_inspiration.6505.c:0 "ทั้งราชสำนักต้องรู้เรื่องงานอดิเรกแปลกใหม่นี้!"
 fund_inspiration.6505.d:0 "อา ภาพอันศักดิ์สิทธิ์สำหรับผู้คนของเรา!"


# Adventurer unhappy about being in the swamp
 fund_inspiration.6506.t:0 "$fund_inspiration.title$ ความสกปรกที่ไม่สมเหตุสมผล"
 fund_inspiration.6506.introduction:0 "สาส์นฉบับหนึ่งมาถึงจากนักผจญภัยของข้า มันเปรอะเปื้อนไปด้วยโคลนจนข้าต้องใช้มีดกรีดเปิด\n\n"
 fund_inspiration.6506.desc:1 "'ข้า แต่[ROOT.Char.GetLadyLord] ข้าพเจ้าอยู่ในหนองบึงชื้นแฉะ และการร่ำเรียนมาหลายปีของข้าพเจ้าก็มิได้เตรียมข้าพเจ้าให้พร้อมรับมือกับมันเลย ข้าพเจ้ากำลังลุยผ่านโคลนเลนที่ส่งเสียงดังทั้งวันทั้งคืน เมื่อคืนข้าพเจ้าฝันถึงอ้อมกอดของคนรัก และตื่นขึ้นมาพบว่ามีตัวนิวต์อยู่ที่ริมฝีปากแทนที่จะเป็นลิ้น\n\n'ข้าพเจ้าสงสัยว่าพอจะมีโอกาสสักเล็กน้อยหรือไม่ที่ข้าพเจ้าจะได้ไปยังสถานที่ที่ #EMP ศิวิไลซ์#! กว่านี้ เพื่อเป็นเครื่องบ่งชี้ว่าสถานที่แห่งนี้น่ารังเกียจเพียงใด ข้าพเจ้าได้ส่งไข่กบที่วางไว้ในรองเท้าบู๊ตเปียกชุ่มของข้าพเจ้าใส่โหลมาพร้อมกับสาส์นนี้'"
 fund_inspiration.6506.a:0 "มันสร้างลักษณะนิสัย!"
 fund_inspiration.6506.b:0 "หากเจ้าปรารถนาจะไปยังดินแดนที่เชื่องกว่า เจ้าก็ไปได้"

#Adventurer gets bee'd in a meadow
 fund_inspiration.6507.t:0 "$fund_inspiration.title$ ไม่ใช่ผึ้ง!"
 fund_inspiration.6507.introduction:1 "ข้าได้รับสาส์นจากนักผจญภัยของข้า — บรรทัดที่เขียนปะปนกับรอยเลือดกระเซ็น"
 fund_inspiration.6507.desc:0 "\n\n'ทุ่งราบและทุ่งหญ้าที่ข้าท่องไปนั้นประดับประดาอย่างงดงามด้วยสัตว์ป่า ขณะที่ข้าลงจากหลังม้า ก้มลงดมดอกไม้ เงาก็ทาบทับข้าโดย [grumpy_liege.GetTitledFirstName] เจ้าผู้ครองดินแดนเหล่านี้ และเป็น [grumpy_liege.GetWomanMan] ที่ไม่ได้คิดดีกับท่านนัก\n\n'"ตัวอ่อนของ [ROOT.Char.GetTitledFirstNameNoTooltip] จะไม่มาดูดกินในทุ่งหญ้าของข้า"[grumpy_liege.GetSheHe|U] ลงจากหลังม้าและสั่งให้ทหารยามจับกุมข้า พวกเขานำกล่องที่บรรจุรังผึ้งออกมา ซึ่งพวกเขาบังคับสวมหัวข้า! ข้าถูก #EMP ผึ้งต่อย#!! ยังมีเหล็กในฝังอยู่ในตาข้า!''"
 fund_inspiration.6507.a:0 "ข้าจะส่งคำประณามบางอย่างไปให้ [grumpy_liege.GetHerHim]!"
 fund_inspiration.6507.b:0 "ข้าจะเอาหัว [grumpy_liege.GetHerHis] มาเพื่อการนี้!"
 fund_inspiration.6507.c:0 "รอยแผลเป็นจะดูน่ามองทีเดียว!"

#Adventurer studying beavers in the Taiga
 fund_inspiration.6508.t:0 "$fund_inspiration.title$ สถาปนิกแห่งธรรมชาติ"
 fund_inspiration.6508.introduction:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า ผู้ ซึ่งอยู่ในดินแดนอันสดชื่นของป่าไทกา\n\n"
 fund_inspiration.6508.desc:0 "'ข้าใช้เวลาอยู่ท่ามกลางเพื่อนร่วมทางที่ดีที่สุดที่นักเดินทาง [inspiration_owner.GetWomanMan] จะขอได้ — ฝูงบีเวอร์! พร้อมกับผู้ส่งสารนี้ ข้าส่งสมุดภาพร่างโครงสร้างที่พวกมันใช้จับปลาในน้ำมาให้ท่าน! โอ้ อยากจะเป็นสัตว์ฟันแทะกึ่งน้ำเสียจริง!'\n\n"
 fund_inspiration.6508.architect_desc:0 "'ข้ามั่นใจว่าอย่างน้อย [court_architect.GetTitledFirstName] ก็สามารถเรียนรู้บางสิ่งจากสัตว์ที่ฉลาดกว่า [court_architect.GetHerHim]'"
 fund_inspiration.6508.a:0 "ข้าจะศึกษาเรื่องนี้อย่างละเอียดถี่ถ้วน"
 fund_inspiration.6508.b:0 "จริงทีเดียว [court_architect.GetTitledFirstNameNoTooltip] ควรได้รับบทเรียน"
 fund_inspiration.6508.b.tt:0 "[court_architect.GetTitledFirstNamePossessive] ความถนัดในฐานะสถาปนิกเพิ่มขึ้นเล็กน้อย"
 fund_inspiration.6508.c:1 "สัตว์ #EMP ที่น่ารัก#! อะไร เช่นนี้! [child.GetFirstNameNoTooltip] ควรได้หนังสือเล่มนี้!"
 fund_inspiration.6508.d:0 "ทำได้ดี ข้าจะส่งทุนทรัพย์ไปเพื่อขยายการเดินทางของเจ้า"

#Adventurer massively exaggerating what an alligator looks like-floodplains 
 fund_inspiration.6509.t:0 "$fund_inspiration.title$ เสียงกระซิบของอสูรร้าย"
 fund_inspiration.6509.intro_desc:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า ผู้ ซึ่งล่องแพไปตามที่ราบน้ำท่วมถึง"
 fund_inspiration.6509.desc:0 "\n\n'ข้า แต่[ROOT.Char.GetLadyLord] พวกเราถูกตามล่าระหว่างการเดินทางโดยสิ่งมีชีวิตที่น่าสะพรึงกลัวยิ่งนัก ข้าพเจ้าแทบไม่อยากจะเขียนถึงมันเลย\n\n'จระเข้สามารถเติบโตได้ยาวถึงห้าสิบก้าว และเป็นสัตว์ประหลาดที่กลืนล่อตัวหนึ่งของเราเข้าไปทั้งตัว มันเป็นสัตว์ร้ายรูปร่างเพรียว มีลำตัวเป็นรูปลูกศร มีจะงอยปากอยู่ด้านหน้า และหางที่ส่งเสียงดังอยู่ด้านหลัง หนามและปุ่มปมที่ปกคลุมตัวมันมีพิษเมื่อสัมผัส'"
 fund_inspiration.6509.a:0 "เราจะสร้างความประทับใจให้แขกผู้มาเยือนด้วยพรมแขวนผนังรูปอสูรร้ายนี้!"
 fund_inspiration.6509.b:0 "โอ้ มันน่ากลัวเกินกว่าจะเป็นจริง!"
 fund_inspiration.6509.c:0 "ข้ารู้ว่าจระเข้คืออะไร เจ้าโง่!"

#Adventurer meeting a vigilante band who hide in the forest

 fund_inspiration.6510.t:0 "$fund_inspiration.title$ ชายในชุดรัดรูป"
 fund_inspiration.6510.intro_desc:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า ผู้ ซึ่งลอบเร้นผ่านเศษซากในป่า"
 fund_inspiration.6510.desc:1 "\n\n'ขออภัย [ROOT.Char.Custom('FormOfAddressForLiege')] แต่ในป่า ข้าได้พบกับกลุ่มศาลเตี้ยที่ปล้นคนอย่างท่าน พวกเขารวมตัวกันต่อต้านอำนาจเผด็จการของ [enemy_liege.GetTitledFirstName] ผู้ปกครองที่นี่ พวกเขาขโมยของให้ได้มากที่สุดโดยการดักปล้นขุนนาง หัวใจของข้าค่อนข้างจะตกหลุมรักกลุ่มคนที่หลากหลายนี้ และข้าไม่คิดว่าจะกลับไปที่ราชสำนักอีก\n\n'กางเกงรัดรูปของพวกเขาก็ดูดีกว่าแฟชั่นในราชสำนักของท่านมาก และค่อนข้างเหมาะกับข้าด้วย'"
 fund_inspiration.6510.a:0 "บางทีเจ้าอาจช่วยข้าทำอะไรเพื่อคนจนได้มากขึ้น?"
 fund_inspiration.6510.b:0 "หากเจ้าไม่กลับมา ข้าจะส่งนักฆ่าตามล่าเจ้า!"
 fund_inspiration.6510.b.toast_outcome.positive:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] ถูกข่มขู่"
 fund_inspiration.6510.b.toast_outcome.positive.continue:0 "การผจญภัยดำเนินต่อไป"
 fund_inspiration.6510.b.toast_outcome.positive.flee:0 "[inspiration_owner.GetSheHe|U] หนีออกจากราชสำนักของท่าน"
 fund_inspiration.6510.b.toast_outcome.refusal:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] ไม่ประทับใจ"
 fund_inspiration.6510.c:0 "จงมีความสุขกับชีวิตอันสกปรกของเจ้า!"

 fund_inspiration.6511.t:0 "$fund_inspiration.title$ ผู้พเนจรในทะเลหิมะ"
 fund_inspiration.6511.intro_desc:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า และหลังจากสองสามบรรทัดแรก ข้ารู้ว่ามันจะเป็นฉบับสุดท้าย"
 fund_inspiration.6511.old_age:0 "\n\n'วัยชราของข้าได้นำสิ่งมหัศจรรย์มากมายมาสู่ข้าในชั่วชีวิต เมื่อข้าไปถึงยอดเขาที่ปกคลุมด้วยหิมะ ซึ่งข้ากำลังเขียนถ้อยคำเหล่านี้อยู่ สิ่งมีชีวิตเพียงหนึ่งเดียวเหนือทะเลหมอก ข้ารู้ว่าข้าจะไม่ได้เห็นความงาม เช่นนี้อีกตลอดชีวิตที่เหลืออยู่\n\n'ข้าไม่เคยปรารถนาที่จะกลับจากภูเขา และบัดนี้ท่านอาจสันนิษฐานได้ว่าข้าเป็นหนึ่งเดียวกับน้ำแข็งแล้ว อย่าได้ร่ำไห้ เพราะข้าไม่อาจทำเป็นอื่นได้ การเดินทางของข้าสู่ [inspiration_owner.GetFaith.PositiveAfterLife] นั้นมั่นคงดุจธารน้ำแข็ง'"
 fund_inspiration.6511.poor_health:0 "\n\n'บัดนี้ข้าเป็นเพียงสิ่งมีชีวิตที่น่าสังเวชและบิดเบี้ยวเมื่อสุขภาพและร่างกายทรยศข้า แต่ในสภาพ เช่นนี้ ข้าไม่เคยคิดว่าจะสามารถเห็นภาพ เช่นอาณาจักรหิมะแห่งเมฆและหมอกจากยอดเขาได้ ดอกไม้ที่เหี่ยวเฉา เช่นนี้ไม่สมควรได้รับความงามนี้\n\n'เมื่อรู้ว่าเวลาของข้าอาจจะมาถึงในไม่ช้า ข้าได้ตัดสินใจทิ้งตัวเองไว้กับน้ำแข็ง บางทีความหนาวเย็นอาจจะรักษาสภาพข้าให้คงเดิมไว้ได้บ้าง'"
 fund_inspiration.6511.winter:0 "\n\n'ข้าอยู่บนยอดเขาในช่วงเวลาที่โหดร้ายที่สุด เกล็ดหิมะ แต่ละเกล็ดบนแก้มที่ถูกกัดของข้าคือเสียงหัวเราะของฤดูหนาว ผู้ร้าย ข้าเคยเห็นการสู้รบ แต่ไม่มีความรุนแรงใดที่งดงามเท่ากับการต่อสู้กับเลือดในร่างกายของข้าเอง มือข้างถนัดของข้ายังทำงานได้ดีพอที่จะเขียนสิ่งนี้ แต่อีกข้างไม่เป็น เช่นนั้น\n\n'จงรู้ไว้ว่าข้าดีใจอย่างแท้จริงที่ได้เห็นโลกอย่างที่ข้าเห็น และข้ารู้สึกว่าสิ่งมีชีวิตที่เหลืออยู่นั้นยากจนกว่าข้า'"
 fund_inspiration.6511.a:0 "ไม่เคยมีผู้หลงใหลในอันตรายที่แท้จริงไปกว่านี้อีกแล้ว!"


 fund_inspiration.6512.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] แห่งขุนเขา"
 fund_inspiration.6512.intro_desc:0 "ข้าได้รับสาส์นจากนักผจญภัยของข้า และมันปกคลุมไปด้วยฝุ่นสีแดง จากการเดินทาง [inspiration_owner.GetHerHis] ผ่านภูเขาทะเลทราย"
 fund_inspiration.6512.desc:1 "\n\n'ข้าได้ปีนป่ายอสูรร้ายอีกลูกหนึ่ง และบนยอดที่ราบสูงแบนราบหลายพันแห่งนี้ ข้าไม่เห็นสัญญาณว่า [inspiration_owner.GetWomanMan] คนอื่นเคยเหยียบย่ำบนหินก้อนนี้มาก่อน วันนี้ ข้าหาญกล้าปีนขึ้นไปสูงที่สุดเท่าที่ข้าเคยปีนมา\n\n'ข้าคิดว่าหินก้อนนี้ร่ำร้องหานามอันคู่ควร เพื่อรำลึกถึงความสำเร็จนี้ที่ได้รับการดูแลโดย [ROOT.Char.GetTitleAsNameNoTooltip] ที่ดีที่สุดในจักรวาล'"
 fund_inspiration.6512.a:0 "ข้ามั่นใจว่าคนท้องถิ่นได้ตั้งชื่อภูเขานี้แล้ว"
 fund_inspiration.6512.b:0 "'ร็อกกี้' — ช่างเป็นชื่อที่ไร้สาระ!"
 fund_inspiration.6512.c:0 "'คมดาบแห่ง [ROOT.Char.GetFaith.WarGodNamePossessive]'"
 fund_inspiration.6512.d:0 "'ถุงมือแห่ง [ROOT.Char.GetFaith.FateGodNamePossessive]'"
 fund_inspiration.6512.e:0 "ตามชื่อยอดรักของข้า [lover.GetFirstNameNoTooltip]"
 fund_inspiration.6512.f:0 "เขี้ยวแห่ง [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.g:0 "คทาแห่ง [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.h:0 "หายนะแห่ง [rival.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.i:0 "ลืมเรื่องนี้ไปเสีย — นำหินมาให้ข้า!"



 # Artifact modifications: dedication
 fund_inspiration.7001.t:0 "$fund_inspiration.title$ นามที่ควรจดจำ"
 fund_inspiration.7001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยสีหน้าครุ่นคิด "มีใครเป็นคนพิเศษสำหรับท่านหรือไม่ [ROOT.Char.Custom('FormOfAddressForLiege')]?"\n\n[inspiration_owner.GetSheHe|U] คงอ่านความไม่พอใจของข้าต่อคำถามส่วนตัว เช่นนี้ได้จากใบหน้าของข้า เพราะ [inspiration_owner.GetSheHe] กล่าวต่อ: "ข้าหมายถึง มีใครที่ท่านอยากจะอุทิศโบราณวัตถุที่ท่านสั่งทำนี้ให้หรือไม่? มันกำลังออกมาดี แต่คำจารึกที่มีความหมายจะ ทำให้มันรู้สึกเป็นส่วนตัวมากยิ่งขึ้น!""
 fund_inspiration.7001.a:1 "แด่ [dedication_a.GetFirstNameNoTooltip] อันเป็นที่รักของข้า!"
 fund_inspiration.7001.b:1 "เพื่อรำลึกถึง [dedication_b.GetFirstNameNoTooltip]..."
 fund_inspiration.7001.c:0 "มีเพียง [ROOT.Char.GetFaith.HighGodNameAlternate] เท่านั้นที่นำทางข้า!"
 fund_inspiration.7001.d:0 "ไม่จำเป็นต้องมีการอุทิศ"
