 # Banner
 fund_inspiration.1042.desc:0 ""ทางนี้เลย [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ส่งสัญญาณให้คนรับใช้สองคนที่ออกมาจากโรงทอผ้าของ [inspiration_owner.GetHerHis] ถือม้วนผ้ามา \n\n[inspiration_owner.GetSheHe|U] พยักหน้า ธงม้วนคลี่ออก ถูกชูไว้สูงจากไม้แขวน ข้าอดไม่ได้ที่จะทึ่งในรายละเอียดอันประณีตและเส้นสายที่ไร้ที่ติ\n\n"
 fund_inspiration.0043.desc:0 ""พ่ะย่ะค่ะ/เพคะ ท่าน [ROOT.Char.GetLadyLord] ข้าจะปั่นธงอันทรงพลังให้ท่าน!" [inspiration_owner.GetTitledFirstName] ตื่นเต้นอย่างแท้จริงที่ได้ทำงานให้ข้า "เหล่าขุนนางแห่ง [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] รู้จักผลงานของข้าดี แต่นี่เป็นเกียรติครั้งใหม่!"\n\n"เชื่อข้าเถิด นี่จะไม่ใช่แค่ผืนผ้าธรรมดา แต่มันจะเป็นผ้าประดับที่สง่างามที่สุด! ข้าเพียงต้องการทราบว่า ท่านประสงค์ให้ข้าเย็บตราประจำตระกูลใด?""
 fund_inspiration.0043.option_title:0 "ตราอาร์มของ [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|U]"
 fund_inspiration.0043.option_house:0 "สัญลักษณ์ประจำตระกูล [ROOT.Char.GetHouse.GetNameNoTooltip]"
 fund_inspiration.0043.option_dynasty:0 "ตราสัญลักษณ์ของราชวงศ์ [ROOT.Char.GetDynasty.GetNameNoTooltip]"
 fund_inspiration.0043.option_dynasty_tt:0 "คุณภาพธงราชวงศ์ผูกติดอยู่กับ [dynasty_prestige_level|E]"
 # Wall Hanging
 fund_inspiration.0044.t:0 "$commission_artifact_decision$: พรมแขวนผนัง"
 fund_inspiration.0044.desc:0 "นักค้าของเก่าของข้า [antiquarian.GetTitledFirstName] มาถึงตามกำหนดเพื่อรับทุนสำหรับงานที่ข้าสั่งทำ "ถึงเวลาแล้วที่ท่านจะมีของประดับผนังใหม่ ๆ เสียที!" [antiquarian.GetSheHe|U] มองข้าอย่างขวยเขิน \n\n"อะแฮ่ม ข้าจะหาช่างทอฝีมือดีให้ ท่าน [ROOT.Char.GetLadyLord]... ท่านต้องการให้ทำสิ่งใดหรือ?" [antiquarian.GetSheHe|U] คลึงถุงเงินในมือ [antiquarian.GetHerHis] อย่างเหม่อลอย รอคอยการตัดสินใจของข้า"
 fund_inspiration.0044.option_tapestry:0 "พรมแขวนผนังชั้นดีสำหรับห้องโถงของข้า"
 fund_inspiration.0044.option_banner:0 "ข้าต้องการธงใหม่"
 fund_inspiration.you_decide_tapestry_option_tt:0 "[antiquarian.GetTitledFirstName] จะหาช่างทอผ้าเพื่อประดิษฐ์สิ่งประดิษฐ์ของท่าน"

