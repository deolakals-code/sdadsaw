# Artisan
 fund_inspiration.0061.desc:0 ""ขอบคุณที่ให้ทุนสนับสนุนความพยายามนี้ของข้า [ROOT.Char.Custom('FormOfAddressForLiege')]" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พยายามเก็บอาการ แต่ข้าเห็นความตื่นเต้นในดวงตาของ [inspiration_owner.GetHerHis]\n\n"กล่อง รูปสลัก #EMP บัลลังก์#!... มีหลายสิ่งที่ข้าสามารถทำได้! บางทีท่านอาจมีสิ่งใดปรารถนา?""
