 fund_inspiration.7003.t:0 "$fund_inspiration.title$ ใครสักคนที่ต้องสร้างความประทับใจ"
 fund_inspiration.7003.desc:0 "ช่วงหลังนี้ ความพยายามของข้าที่จะสร้างความประทับใจล้มเหลว..."
 fund_inspiration.7003.desc_e:0 "มิตรภาพของข้ากับ [dedication_e.GetTitledFirstName] ยังคงสั่นคลอน"
 fund_inspiration.7003.desc_f:0 "[dedication_f.GetTitledFirstName|U] ยังคงปฏิเสธข้า"
 fund_inspiration.7003.desc_end:0 "มันช่างยุ่งเหยิง\n\nอย่างไรก็ตาม ข้ามีความคิดอันยอดเยี่ยม ข้าจะให้ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] เพิ่มคำอุทิศให้กับผลงานชิ้นเอกที่ [inspiration_owner.GetSheHe] กำลังสร้าง! ผู้รับการอุทิศที่ได้รับการยกยอจะซาบซึ้งใจอย่างสุดซึ้งในความเอื้อเฟื้อเผื่อแผ่และความใจกว้างของข้า และไม่มีทางเลือกอื่นนอกจากจะชอบข้ามากขึ้น!"
 fund_inspiration.7003.a:0 "แด่ [dedication_e.GetFirstNameNoTooltip]!"
 fund_inspiration.7003.b:0 "แด่ [dedication_f.GetFirstNameNoTooltip]!"
 fund_inspiration.7003.c:0 "ข้าจะหาวิธีอื่นเพื่อสร้างความประทับใจให้ใครก็ตามที่ข้าต้องการ"
