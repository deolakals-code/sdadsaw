# (Metal)Smith
 fund_inspiration.0071.desc:0 ""ขอบคุณที่ให้ทุนสนับสนุนความพยายามนี้ของข้า [ROOT.Char.Custom('FormOfAddressForLiege')]!"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] พยายามเก็บอาการ แต่ข้าเห็นความตื่นเต้นในดวงตาของ [inspiration_owner.GetHerHis] ขณะที่ [inspiration_owner.GetSheHe] กล่าวต่อ "ข้าสามารถรังสรรค์โลหะให้เป็น #EMP สิ่งมหัศจรรย์#! ได้ บางทีท่านอาจมีสิ่งใดปรารถนา?""
 fund_inspiration.0071.brooch:0 "ข้าต้องการเข็มกลัดที่สวยงาม!"
 fund_inspiration.0071.regalia:0 "สร้างเครื่องราชกกุธภัณฑ์ที่คู่ควรกับฐานะของข้า"
 fund_inspiration.0071.crown:0 "มงกุฎราชันย์ คู่ควรที่จะประทับบนศีรษะของข้า!"
 fund_inspiration.0071.goblet:0 "ถ้วยดื่มอันวิจิตร"
 fund_inspiration.0071.aquamanile:0 "อความานิลอันหรูหรา สำหรับการชำระล้างตามพิธีกรรม"
 fund_inspiration.0071.incense_burner_sculpture:0 "กระถางธูปอันประณีต"

 fund_inspiration.0072.t:0 "ให้ทุนสนับสนุนแรงบันดาลใจช่างโลหะ"

# Alchemist
 fund_inspiration.0081.desc:0 ""ท่านจะไม่เสียใจที่สนับสนุนข้า [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] คำนับต่อหน้าข้าก่อนจะ [inspiration_owner.Custom('quirk_pos_pp')]\n\n"ทีนี้ ข้าขอบีกเกอร์และกำมะถันได้หรือไม่? ข้ามีเรื่องต้องศึกษาอีกมาก มีด้านใดที่ท่านอยากให้ข้าเริ่มตรวจสอบเป็นพิเศษหรือไม่?""
 fund_inspiration.0081.elixirs:0 "ข้าได้ยินข่าวลือเกี่ยวกับความมหัศจรรย์ของยาอายุวัฒนะ!"
 fund_inspiration.0081.metals:0 "โลหะ ทำให้ข้าหลงใหลเสมอมา"
 fund_inspiration.0081.panacea:0 "ยารักษาทุกโรค ยาครอบจักรวาล!"
 fund_inspiration.0081.immortality:0 "ข้าต้องการมีชีวิตอมตะ"
 fund_inspiration.0081.you_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะศึกษา และผลิต [artifact|E] ตามคำสั่งของท่าน"
 fund_inspiration.0081.they_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] จะศึกษา และผลิต [artifact|E] ตามดุลยพินิจของ [inspiration_owner.GetHerHis]"

