#	INSPIRATION COMPLETED
 fund_inspiration.1001.t:0 "แรงบันดาลใจเป็นจริง"
 fund_inspiration.1001.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยรอยยิ้มกว้าง "ข้าตรากตรำทำงานมาหลายวันหลายคืน และในที่สุดงานของข้าก็เสร็จสิ้น!"\n\n[inspiration_owner.GetSheHe|U] มอบวัตถุที่ห่อด้วยผ้าให้ข้า และเมื่อข้าเปิดสิ่งที่ซ่อนอยู่ภายใน ดวงตาของข้าก็เบิกกว้าง\n\n"
 fund_inspiration.1001.a:0 "นี่มันน่ารักมาก!"
 fund_inspiration.1001.b: "ให้การเตรียมการเริ่มขึ้น"
 fund_inspiration.1001.b.coronation_ready: "ตอนนี้ท่านสามารถจัด [coronation|E] ได้แล้ว"

 fund_inspiration.1071.coronation: "\n\nเมื่อมงกุฎของข้าเสร็จสมบูรณ์ ตอนนี้ข้าสามารถจัดพิธีราชาภิเษกและประสานอำนาจในฐานะองค์อธิปัตย์ได้แล้ว"

 fund_inspiration.1011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยรอยยิ้มกว้าง เหงื่อไหลอาบหน้าผากของ[inspiration_owner.GetHerHis] และเขม่าเปื้อนใบหน้าของ[inspiration_owner.GetHerHis] "ข้าตรากตรำหน้าเตาหลอมมาหลายวันหลายคืน แต่ในที่สุดงานของข้าก็เสร็จสิ้น!"\n\n[inspiration_owner.GetSheHe|U] มอบวัตถุที่ห่อด้วยผ้าให้ข้า และเมื่อข้าเปิดสิ่งที่ซ่อนอยู่ภายใน ดวงตาของข้าก็เบิกกว้าง\n\n"

 fund_inspiration.1021.desc_opening_1:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กวักมือเรียกข้าด้วยรอยยิ้มกว้าง พลางชี้ไปที่แท่นวางชุดเกราะที่คลุมผ้าไว้ "ข้าตรากตรำหน้าเตาหลอมมาหลายวันหลายคืน แต่ในที่สุดงานของข้าก็เสร็จสิ้น!""
 fund_inspiration.1021.desc_opening_2:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กวักมือเรียกข้าไปยังแท่นวางชุดเกราะที่คลุมผ้าไว้ [inspiration_owner.GetSheHe|U] พยายามอย่างหนักที่จะรักษาท่าทีสุขุม แต่ข้าเห็นประกายไฟในดวงตาของ [inspiration_owner.GetHerHis] ขณะที่ [inspiration_owner.GetSheHe] บอกข้าว่างานของ [inspiration_owner.GetHerHis] เสร็จสิ้นแล้ว"
 fund_inspiration.1021.desc:0 "\n\nด้วยท่าทีโอ่อ่า [inspiration_owner.GetSheHe] กระชากผ้าคลุมออก และดวงตาของข้าก็เบิกกว้าง\n\n"
 fund_inspiration.1021.a:0 "งดงามยิ่ง!"
 
 fund_inspiration.1031.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยิ้มและกวักมือเรียกข้าด้วยมือที่เปื้อนหมึก"
 fund_inspiration.1031.desc_crime:0 ""เนื้อหาของตำราค่อนข้างเป็นที่ถกเถียง แต่มันคือผลงานชิ้นเอก ดูสิ!"\n\n"
 fund_inspiration.1031.desc_soulmate_died:0 ""ท่าน [soulmate.GetTitledFirstName] สุดที่รักของท่านอาจจากไปแล้ว แต่ตำราเล่มนี้เป็นเครื่องยืนยันถึงความรักที่ท่านทั้งสองมีต่อกัน"\n\n"
 fund_inspiration.1031.desc_nemesis_died:0 ""[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] อาจจากไปแล้ว แต่ตำราเล่มนี้เป็นเครื่องยืนยันถึงความเกลียดชังที่ท่านมีต่อ [nemesis.GetHerHim]"\n\n"
 fund_inspiration.1031.desc_cat_died:0 ""แมวสุดที่รักของท่านอาจจากไปแล้ว แต่ตำราเล่มนี้ควรจะ ทำให้แน่ใจว่าไม่มีใครลืมแมวชื่อ [inspiration_owner.Custom('CatStoryName')]!"\n\n"
 fund_inspiration.1031.desc_dog_died:0 ""สุนัขสุดที่รักของท่านอาจจากไปแล้ว แต่ตำราเล่มนี้ควรจะ ทำให้แน่ใจว่าไม่มีใครลืมสุนัขชื่อ [inspiration_owner.Custom('DogStoryName')]!"\n\n"
 fund_inspiration.1031.desc_low_content_quality:0 ""ตำราเสร็จแล้ว ข้าหวังว่าผลงานที่เสร็จสมบูรณ์จะบดบังความรู้ที่ข้าขาดไปในหัวข้อนี้ โปรดดูเถิด!"\n\n"
 fund_inspiration.1031.desc:0 ""ตำราของข้า– #EMP ผลงานชิ้นเอก#! ของข้าเสร็จแล้ว! จงดูเถิด"\n\n"
 fund_inspiration.1031.a:0 "ข้าประทับใจ!"

 fund_inspiration.1032.t:0 "ความรู้สึกที่ถูกเขียน"
 fund_inspiration.1032.desc:0 ""[ROOT.Char.Custom('LoverPetName')] ของข้า ข้ามีเรื่องประหลาดใจให้เจ้า!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มอบตำราที่สวยงามให้ข้า และขณะที่ข้าพลิกดู ข้าแทบไม่เชื่อสายตา [inspiration_sponsor.GetSheHe|U] ได้สั่งทำตำราเกี่ยวกับ #EMP พวกเรา#!!\n\n"ปกหนังสือซีดจางเมื่อเทียบกับความงามของเจ้า และเนื้อหาก็เทียบไม่ได้กับความเป็นเพื่อนของเจ้า แต่หน้ากระดาษเหล่านี้บรรจุแก่นแท้ของความรักที่ข้ามีต่อเจ้า""
 fund_inspiration.1032.a:0 "โอ้ [inspiration_sponsor.Custom('LoverPetName')] ของข้า!"

 fund_inspiration.1033.desc:0 ""ข้ามีเรื่องประหลาดใจให้เจ้า!"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] มอบตำราที่สวยงามให้ข้า แต่ขณะที่ข้าพลิกดู ข้าแทบไม่เชื่อสายตา [inspiration_sponsor.GetSheHe|U] ได้สั่งทำตำราเพื่อจุดประสงค์เดียวคือการใส่ร้าย #EMP ข้า#!!\n\n"แม้ไม่มีคำพูดใดในโลกนี้สามารถถ่ายทอดความดูถูกที่ข้ามีต่อเจ้าได้ และไม่มีภาพประกอบใดสามารถวาดภาพความเลวร้ายที่เป็นใบหน้าของเจ้าได้อย่างถูกต้อง ข้าก็ได้พยายามแล้ว ทั้งโลกจะอ่านสิ่งนี้และรู้ว่าเจ้าเลวทรามเพียงใด""
 fund_inspiration.1033.a:0 "เจ้า [inspiration_sponsor.Custom2('InsultNoun', ROOT.Char)] นั่น!"
 fund_inspiration.1033.a_proud:0 "แต่พวกเขา #EMP จะ#! รู้จักข้า!"

 fund_inspiration.1041.desc:0 ""ในนี้ [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ชี้ไปที่ประตูโรงทอผ้าของ [inspiration_owner.GetHerHis] ที่ ซึ่ง [inspiration_owner.GetSheHe] ตรากตรำมาหลายเดือนตามคำสั่งของข้า เมื่อก้าวผ่านประตูเข้าไป ข้าก็อ้าปากค้างขณะจ้องมองผลงานที่แขวนอยู่ตรงหน้า\n\n"

 fund_inspiration.1051.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประกาศการมาถึงของ [inspiration_owner.GetHerHis] ด้วยน้ำเสียงที่ดังอย่างน่าประหลาดใจ [inspiration_owner.GetSheHe|U] ถือห่อที่ห่อด้วยผ้าอย่างแน่นหนาอย่างภาคภูมิใจ\n\n"ข้ากลับมาจาก [inspiration_owner.Custom('InspirationAdventureDestination')] พร้อมกับโบราณวัตถุจากการเดินทางของข้า!"\n\nข้ารับห่อขนาดใหญ่มาไว้ในมือและคลายเชือกก่อนจะลอกผ้าทีละชั้น ข้างใน"
 fund_inspiration.1051_throne.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประกาศการมาถึงของ [inspiration_owner.GetHerHis] ด้วยน้ำเสียงที่ดังอย่างน่าประหลาดใจ [inspiration_owner.GetSheHe|U] นำขบวนแห่อันยิ่งใหญ่มายังบัลลังก์ของท่านอย่างภาคภูมิใจ ด้านหลัง [inspiration_owner.GetHerHim] มีเกวียนกำลังถูกเข็นเข้ามาในห้องโถงว่าราชการของท่าน\n\n"ข้ากลับมาจาก [inspiration_owner.Custom('InspirationAdventureDestination')] พร้อมกับสัญลักษณ์อันยิ่งใหญ่แห่งคุณธรรมของราชวงศ์!"\n\nขณะที่เกวียนเข้ามาใกล้ ข้าก็ตระหนักว่ามันบรรทุกบัลลังก์มา"
 fund_inspiration.1051_ark_covenant.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประกาศการมาถึงของ [inspiration_owner.GetHerHis] ด้วยน้ำเสียงที่ดังอย่างน่าประหลาดใจ [inspiration_owner.GetSheHe|U] นำขบวนแห่อันยิ่งใหญ่มายังบัลลังก์ของท่านอย่างภาคภูมิใจ ด้านหลัง [inspiration_owner.GetHerHim] มีผู้ช่วยหลายคนกำลังแบกสิ่งที่ดูเหมือนกล่องขนาดมหึมา\n\n"ข้ากลับมาจาก [inspiration_owner.Custom('InspirationAdventureDestination')] พร้อมกับรางวัลจากการเดินทางของข้า!"\n\nข้าเดินเข้าไปที่กล่องยักษ์ ขณะที่ผู้ช่วยคนหนึ่งแกะแผ่นกระดานที่ซ่อนสมบัติของมันออก ข้างใน"
 fund_inspiration.1051_cupboard.desc:1 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ประกาศการมาถึงของ [inspiration_owner.GetHerHis] ด้วยน้ำเสียงที่ดังอย่างน่าประหลาดใจ [inspiration_owner.GetSheHe|U] ชี้อย่างภาคภูมิใจไปยังเครื่องเรือนชิ้นหนึ่งที่ผู้ช่วยสองคนกำลังแบกมา\n\n"ข้ากลับมาพร้อมกับโบราณวัตถุจากการเดินทางของข้า!"\n\nข้าเดินเข้าไปที่โบราณวัตถุ ตรวจสอบสิ่งที่ [inspiration_owner.GetWomanMan] ของข้านำมาจาก [inspiration_owner.Custom('InspirationAdventureDestination')]"
 fund_inspiration.1051.desc.skull:1 "คือหัวกะโหลกของ [newly_created_artifact.GetFeatureText( 'animal_skull_type' )] ข้าถามรายละเอียดจาก [inspiration_owner.GetFirstNameNoTooltip] และ [inspiration_owner.GetSheHe] ก็เล่าเรื่องราวว่า [inspiration_owner.GetSheHe] ล้มสัตว์ร้ายขนาดมหึมาได้อย่างไร"
 fund_inspiration.1051.desc.goblet:0 "คือถ้วยดื่ม ข้าถาม [inspiration_owner.GetFirstNameNoTooltip] ว่า [inspiration_owner.GetSheHe] ได้สิ่งนี้มาจากไหน และ [inspiration_owner.GetSheHe] ก็เล่าเรื่องการท้าทายที่น่าขนลุกที่ [inspiration_owner.GetSheHe] มีกับคนแปลกหน้าที่จบลงด้วยการที่คู่ต่อสู้แพ้หลังจากดื่มยาพิษ"
 fund_inspiration.1051.desc.box:0 "คือกล่อง ช่างฝีมือท้องถิ่นมอบสิ่งนี้ให้ [inspiration_owner.GetFirstNameNoTooltip] หลังจากที่ [inspiration_owner.GetSheHe] ช่วย [dummy_gender.GetHerHim] จากฝูงสัตว์ป่า [inspiration_owner.GetSheHe|U] เล่าให้ข้าฟังว่า [inspiration_owner.GetSheHe] ล่อลวงและเอาชนะสัตว์ร้ายที่ดุร้ายให้ตกลงไปตายได้อย่างไร"
 fund_inspiration.1051.desc.hide:1 "คือหนังของ [newly_created_artifact.GetFeatureText( 'animal_hide_type' )] [inspiration_owner.GetFirstNameNoTooltip] เล่าให้ข้าฟังว่า [inspiration_owner.GetSheHe] ล้มสัตว์ร้ายที่ดุร้ายได้อย่างไร ขณะที่ข้ายังคงชื่นชมหนังของสิ่งที่ต้องเป็นสัตว์ที่สง่างาม"
 #fund_inspiration.1051.desc.pillow: "is a soft pedestal pillow. [inspiration_owner.GetFirstNameNoTooltip] tells me of how [inspiration_owner.GetSheHe] helped a master weaver gather all the required materials to make this pillow and all the dangers [inspiration_owner.GetSheHe] faced while doing so."
 fund_inspiration.1051.desc.tapestry:0 "คือพรมแขวนผนัง [inspiration_owner.GetFirstNameNoTooltip] แอ่นอกขณะที่ [inspiration_owner.GetSheHe] เล่าเรื่องราวเกี่ยวกับเพื่อนร่วมเดินทางของ [inspiration_owner.GetHerHis] ซึ่งเป็นช่างตัดเสื้อฝีมือเอก การผจญภัยร่วมกันของพวกเขาเป็นแรงบันดาลใจให้เกิดลวดลายที่เลือกบนพรมแขวนผนังนี้"
 #Epic Artifacts
 fund_inspiration.1051.desc.epic:0 "คือสิ่งประดิษฐ์ที่ไม่เหมือนสิ่งใดที่ข้าเคยเห็นมาก่อน\n\n[inspiration_owner.GetFirstNameNoTooltip] ยิ้มอย่างภาคภูมิใจ: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.ark:0 "คือหีบหินขนาดใหญ่ ข้างในมีแผ่นศิลาจารึกจำนวนหนึ่ง\n\n[inspiration_owner.GetFirstNameNoTooltip] อวดอ้างอย่างภาคภูมิใจ: "นี่คือหีบพันธสัญญา! บรรจุแผ่นศิลาที่โมเสสมอบให้แก่ชาวอิสราเอล"\n\nจากนั้น [inspiration_owner.GetFirstNameNoTooltip] ก็เล่าเรื่องการผจญภัยของ [inspiration_owner.GetHerHis] ใน [inspiration_owner.Custom('InspirationAdventureDestination')] ให้ราชสำนักฟัง เรื่องราวที่เกี่ยวข้องกับศัตรูที่ขับเคลื่อนด้วยอุดมการณ์อันมืดมนและการเยี่ยมชมสถานที่สวยงามหลายแห่ง"
 fund_inspiration.1051.desc.epic.throne:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip] ประกาศอย่างภาคภูมิใจ: "[epic.GetDesc]""
 fund_inspiration.1051.desc.epic.cupboard:0 "\n\nด้วยรอยยิ้มกว้าง [inspiration_owner.GetFirstNameNoTooltip] ประกาศ: "[epic.GetDesc]""
 fund_inspiration.1051.desc.regalia:0 "มีเครื่องราชกกุธภัณฑ์ที่เหมาะสำหรับราชสำนัก\n\n[inspiration_owner.GetFirstNameNoTooltip] ยิ้มอย่างภาคภูมิใจและอธิบายว่า [inspiration_owner.GetSheHe] ได้รับความกตัญญูจากผู้ปกครองท้องถิ่นใน [inspiration_owner.GetCurrentLocation.GetNameNoTooltip] ได้อย่างไร เรื่องราวยาวเหยียดที่จบลงด้วยการที่ผู้ปกครองคนนี้มอบ [newly_created_artifact.GetName] ให้แก่นายของ [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.1051.desc.regalia_2:0 "มีเครื่องราชกกุธภัณฑ์ที่เหมาะสำหรับราชสำนัก\n\n[inspiration_owner.GetFirstNameNoTooltip] ยิ้มอย่างภาคภูมิใจและอธิบายว่านี่เป็นของขวัญจากผู้ปกครองแดนไกลที่ได้ยินถึงความยิ่งใหญ่ของราชสำนักของท่านและปรารถนาที่จะสร้างความประทับใจให้ท่าน"
 fund_inspiration.1051.desc.armor:0 "มีชุดเกราะอยู่\n\n[inspiration_owner.GetFirstNameNoTooltip] เล่าเรื่องราวให้ราชสำนักฟังว่า [inspiration_owner.GetSheHe] ได้ครอบครองชุดเกราะที่ไม่ธรรมดานี้ได้อย่างไร ซึ่ง [inspiration_owner.GetSheHe] กำลังมอบให้ท่าน"
 fund_inspiration.1051.desc.weapon:0 "มี [newly_created_artifact.GetName] อยู่\n\n[inspiration_owner.GetFirstNameNoTooltip] เล่าเรื่องราวต่อว่าอาวุธนี้มาอยู่ในความครอบครองของ [inspiration_owner.GetHerHis] ได้อย่างไร เรื่องราวที่มีการหักมุมมากมาย บางเรื่องก็ไม่น่าเชื่อถือนัก"
 fund_inspiration.1051.desc.necklace:0 "มีสร้อยคออยู่\n\n[inspiration_owner.GetFirstNameNoTooltip] ดูเหมือนจะมีความสุขมากที่สามารถมอบรางวัลนี้ให้ท่านได้ แต่ดูเหมือนจะไม่เต็มใจที่จะขยายความว่าได้มาอย่างไร"
 fund_inspiration.1051.a:0 "นี่มันงดงามยิ่ง!"
 fund_inspiration.1051.b:0 "มันต้องได้รับการดูแลโดย 'คนระดับสูง'"

 fund_inspiration.1061.desc_floor_bound_artifact:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กวักมือเรียกข้าไปยังวัตถุที่คลุมด้วยผ้าด้วยรอยยิ้มกว้างบนใบหน้าของ [inspiration_owner.GetHerHis] "ข้าตรากตรำทำงานมาหลายวันหลายคืน และในที่สุดงานของข้าก็เสร็จสิ้น!"\n\n[inspiration_owner.GetSheHe|U] กระตุกผ้าคลุมออก และดวงตาของข้าก็เบิกกว้างเมื่อเห็นสิ่งที่ซ่อนอยู่ข้างใต้\n\n"
 fund_inspiration.1061.desc:0 ""ทางนี้ [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กวักมือเรียกข้าด้วยรอยยิ้มกว้าง "ข้าตรากตรำทำงานมาหลายวันหลายคืน และในที่สุดงานของข้าก็เสร็จสิ้น!"\n\n[inspiration_owner.GetSheHe|U] มอบวัตถุที่ห่อด้วยผ้าให้ข้า และเมื่อข้ายกผ้าขึ้น ดวงตาของข้าก็เบิกกว้าง\n\n"

 fund_inspiration.1081.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] กวักมือเรียกข้าไปยังโต๊ะทำงานที่รกของ [inspiration_owner.GetHerHis] ด้วยรอยยิ้มกว้างบนใบหน้า"
 fund_inspiration.1081.immortality_fail_desc_opening:0 ""ข้ารู้ว่าข้าเคยบอกว่าข้าสามารถค้นพบวิธีที่จะยืดอายุขัยได้อย่างไม่มีกำหนด แต่น่าเศร้าที่มันไม่ได้เป็น เช่นนั้น"
 fund_inspiration.1081.immortality_fail_desc_young:0 "อย่างไรก็ตาม ข้าสามารถผลิตยาอายุวัฒนะที่จะป้องกันไม่ให้ท่านแก่ชราได้! ในระดับหนึ่ง โปรดลองชิม หรืออย่างน้อยก็ตรวจสอบผลงานของข้า"\n\n"
 fund_inspiration.1081.immortality_fail_desc_old:0 "อย่างไรก็ตาม ข้าสามารถผลิตยาอายุวัฒนะที่จะคืนความกระปรี้กระเปร่าที่หายไปของท่านได้! โปรดลองชิม หรืออย่างน้อยก็ตรวจสอบผลงานของข้า"\n\n"
 fund_inspiration.1081.elixir_desc_desc_young:0 ""การทดลองของข้าประสบผลสำเร็จแล้ว ดูเถิด ยาอายุวัฒนะที่จะป้องกันความแก่ชรา! ในระดับหนึ่ง โปรดดู และบางทีอาจจะลองชิม"\n\n"
 fund_inspiration.1081.elixir_desc_desc_old:0 ""การทดลองของข้าประสบผลสำเร็จแล้ว ดูเถิด ยาอายุวัฒนะที่จะคืนความกระปรี้กระเปร่าที่หายไปของท่าน! โปรดดู และบางทีอาจจะลองชิม"\n\n"
 fund_inspiration.1081.panacea_desc:0 ""มันคือยาครอบจักรวาลที่อิงตามตำรับยาเธริแอคอันเป็นที่ยอมรับ ประกอบด้วยมดยอบ หญ้าฝรั่น ฝิ่น เนื้องูพิษ และส่วนผสมอื่นๆ อีกจำนวนหนึ่ง มันได้พิสูจน์ประสิทธิภาพมานานหลายศตวรรษ และข้าได้ ทำให้มันสมบูรณ์แบบยิ่งขึ้นไปอีก! ดูเถิด"\n\n"
 fund_inspiration.1081.metals_philosophers_stone_desc:0 ""ข้าทำสำเร็จแล้ว! ข้าได้สร้างศิลานักปราชญ์! นี่คือผลงานชิ้นเอกของข้า มรดกทองคำของข้า โปรดดูเถิด!"\n\n"
 fund_inspiration.1081.metals_mercury_desc:0 ""ข้าให้ความร้อนแก่ส่วนผสมของปรอทกับกำมะถันในขวดแก้ว ซึ่ง ทำให้มันระเหยและควบแน่นใหม่ที่ด้านบนของขวดแก้ว จากนั้นเมื่อข้าทุบขวดแก้วและบดสารประกอบที่ได้ ข้าก็ได้สร้างสีแดงสดใส! นี่ ข้าได้บันทึกการค้นพบของข้าไว้แล้ว"\n\n"
 fund_inspiration.1081.metals_arsenic_desc:0 ""ข้าให้ความร้อนแก่แร่สารหนูบางส่วน ซึ่ง ทำให้เกิดผงสีขาวที่ละลายน้ำได้ ข้ามั่นใจว่ามันถึงตายเมื่อกินเข้าไป แต่มันจะไม่ทิ้งร่องรอยของรสชาติหรือกลิ่น! นี่ ข้าได้บันทึกการค้นพบของข้าไว้แล้ว"\n\n"
 fund_inspiration.1081.metals_gold_desc:0 ""ข้าได้สร้างทองคำ! ดังที่นักคิดผู้ยิ่งใหญ่ก่อนหน้าข้าได้ตั้งทฤษฎีไว้ว่าการขาดความชื้นและความร้อนคือข้อบกพร่องของตะกั่ว"\n\nเมื่อข้าขอสังเกตกระบวนการ [inspiration_owner.GetSheHe] ยืนยันว่าทองคำชิ้นเล็กๆ บนโต๊ะนั้นบ่งบอกด้วยตัวมันเอง "แต่แน่นอน ข้าได้บันทึกการค้นพบของข้าไว้แล้ว ดูเถิด"\n\n"
 fund_inspiration.1081.metals_silver_desc:0 ""ข้าได้สร้างเงิน! ดังที่นักคิดผู้ยิ่งใหญ่ก่อนหน้าข้าได้ตั้งทฤษฎีไว้ว่าเงินเกิดจากการให้ความร้อนแก่ทองแดงและโลหะพื้นฐานอื่นๆ จนกระทั่งพวกมันเปลี่ยนเป็นสีขาว"\n\nเมื่อข้าขอสังเกตกระบวนการ [inspiration_owner.GetSheHe] ยืนยันว่าเงินชิ้นเล็กๆ บนโต๊ะนั้นบ่งบอกด้วยตัวมันเอง "แต่แน่นอน ข้าได้บันทึกการค้นพบของข้าไว้แล้ว ดูเถิด"\n\n"
 fund_inspiration.1081.metals_fallback_desc:0 ""ข้าได้รวบรวมข้อมูลเชิงลึกทั้งหมดเกี่ยวกับโลหะพื้นฐานและความรู้เกี่ยวกับการแปรธาตุไว้ในตำราเล่มนี้แล้ว นี่ ดูเถิด"\n\n"
 fund_inspiration.1081.a_elixirs:0 "ข้าจะลองจิบดูเดี๋ยวนี้!"
 fund_inspiration.1081.a:0 "น่าทึ่ง!"

 fund_inspiration.1091.desc: ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] เข้ามาหาข้าด้วยรอยยิ้มพึงพอใจบนใบหน้าของ[inspiration_owner.GetHerHis] "ข้าตรากตรำบนโต๊ะทำงานมาหลายวันหลายคืน แต่ในที่สุดงานของข้าก็เสร็จสิ้น!"\n\n[inspiration_owner.GetSheHe|U] มอบวัตถุที่ห่อด้วยผ้าให้ข้า และเมื่อข้าเปิดสิ่งที่ซ่อนอยู่ภายใน ดวงตาของข้าก็เบิกกว้าง\n\n"
 fund_inspiration.1091.a: "ผลงานชั้นดี! เยี่ยมมาก!"
