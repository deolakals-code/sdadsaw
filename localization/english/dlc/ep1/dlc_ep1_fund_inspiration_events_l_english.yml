 fund_inspiration.7004.t:0 "$fund_inspiration.title$ ข้าหลวงที่ควรจดจำ?"
 fund_inspiration.7004.desc:0 "[dedication_g1.GetTitledFirstName|U] และ [dedication_g2.GetTitledFirstName] เป็นหนึ่งในข้าหลวงที่ทรงอำนาจที่สุดในอาณาจักรของข้า ข้าไม่เคยรู้วิธี ทำให้พวกเขาพอใจ เพื่อที่พวกเขาจะได้ไม่ไปก่อเรื่อง บางทีการประจบสอพลออาจเป็นหนทาง?\n\nใครๆ ก็คงพอใจที่จะมีบางสิ่งสร้างขึ้นในนามของพวกเขา ใช่ไหม? และข้าก็มีสิ่งที่เหมาะสมกำลังสร้างอยู่พอดี! ข้าควรแจ้งให้ [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] ทราบว่าข้ากำลังอุทิศผลงานชิ้นเอก [inspiration_owner.GetHerHis] ให้กับข้าหลวงและที่ปรึกษาที่ #EMP น่าเชื่อถือ#! ของข้า\n\nแต่แล้ว มันก็เป็นสิ่งประดิษฐ์ #EMP ของข้า#! ดังนั้นบางทีข้าควรจะ...?"
 fund_inspiration.7004.a:0 "ไม่! แด่ [dedication_g1.GetFirstNameNoTooltip] และ [dedication_g2.GetFirstNameNoTooltip]!"
 fund_inspiration.7004.b:0 "ท้ายที่สุด ทำไมจะไม่ได้ล่ะ? แด่ตัวข้าเอง!"
 fund_inspiration.7004.c:0 "อย่างไรเสีย การอุทิศก็ถูกประเมินค่าสูงเกินไป"
