 fund_inspiration.7100.t:0 "$fund_inspiration.title$ ทิศทางการสร้างสรรค์"
 fund_inspiration.7100.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! งานสร้างโบราณวัตถุล้ำค่าของท่านกำลังดำเนินไปด้วยดี!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ดูเหมือนจะอารมณ์ดีมากในวันนี้\n\n"ข้าไม่สัญญาอะไรนะ แต่... ถ้าข้าสามารถสร้างผลงานชิ้นเอกที่แท้จริงได้ ท่านอยากให้แนวคิดใดนำทางมือข้า?""
 fund_inspiration.7100.a:0 "เพื่อสร้างความสูญเสียให้ #EMP พวกมัน#! มากขึ้น และให้ #EMP พวกเรา#! น้อยลง"
