 fund_inspiration.0091.desc: "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] ก่อนจะโค้งคำนับลึก "แน่นอน ข้าสามารถขึ้นสายคันธนูให้ท่านได้ [ROOT.Char.GetLadyLord] ของข้า" ความกระตือรือร้นของ [inspiration_owner.GetHerHis] ส่องประกายผ่านความพยายามอันกังวลที่จะรักษาความเป็นทางการ\n\n"แต่ท่านถนัดยิงธนูแบบใดเล่า? ข้าปรารถนาที่จะสร้างสิ่งที่เหมาะสมกับท่านที่สุด""
 fund_inspiration.0091.a: "คันธนูแบบเก่า ๆ ที่ดี แค่นั้นพอ"
 fund_inspiration.0091.b: "สร้างคันธนูยาวอันทรงพลังให้ข้า"
 fund_inspiration.0091.c: "กาวและเอ็นสัตว์ให้พลังรุนแรงที่สุด"
 fund_inspiration.0091.d: "เจ้าต้องส่งมอบกลไกอันยอดเยี่ยมให้ข้า"
 fund_inspiration.0091.tooltip_bow: "$fund_inspiration.0011.tooltip_action$ คันธนู"
 fund_inspiration.0091.tooltip_bow.tt: "ท่านจะได้รับคันธนูเมื่อสิ้นสุด [inspiration|E]"
