# Book
 fund_inspiration.0031.desc:0 ""ขอบคุณที่เชื่อมั่นในตัวข้า [ROOT.Char.Custom('FormOfAddressForLiege')]!" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ยิ้ม [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', inspiration_owner)] ก่อนจะเอียงศีรษะของ [inspiration_owner.GetHerHis]\n\n"ทว่า ข้าไม่แน่ใจว่าควรเขียนเกี่ยวกับสิ่งใด เมื่อเร็ว ๆ นี้ ข้าสนใจหัวข้อที่เกี่ยวข้องกับ [SCOPE.Custom('ArtifactBookSubject')] ท่านคิดว่ามันเหมาะจะเป็นหัวใจหลักของหนังสือหรือไม่?""
 fund_inspiration.0031.education:0 "ตำราเล่มนี้จะเกี่ยวกับ [ROOT.Char.Custom('education_focus')]"
 fund_inspiration.0031.lifestyle_reveler:0 "มาเขียนเกี่ยวกับความสุข เกี่ยวกับ #EMP ชีวิต#! เกี่ยวกับงานเลี้ยงกันเถอะ!"
 fund_inspiration.0031.lifestyle_blademaster:0 "ไม่มีหัวข้อใดคมกริบเท่าเรื่องที่เกี่ยวกับคมดาบ!"
 fund_inspiration.0031.lifestyle_hunter:0 "ให้เป็นเรื่องเกี่ยวกับรายละเอียดของการล่าและสัตว์ป่า!"
 fund_inspiration.0031.lifestyle_mystic:0 "ตำราจะสำรวจแนวทางการใช้ชีวิตที่ไม่ธรรมดาของข้า!"
 fund_inspiration.0031.lifestyle_herbalist:0 "ตำราจะให้รายละเอียดเกี่ยวกับสมุนไพรและพืชพรรณ!"
 fund_inspiration.0031.lifestyle_physician:0 "ร่างกายมนุษย์เป็นหัวข้อที่ควรค่าแก่การเจาะลึก!"
 fund_inspiration.0031.lifestyle_cannibal:0 "ไม่มีสิ่งใดจุดประกาย #EMP ความหิวโหย#! ในการสำรวจของข้าได้เท่าร่างกายมนุษย์"
 fund_inspiration.0031.lifestyle_torturer:0 "มาบันทึกวิธีการมากมายในการทำลายจิตใจและร่างกายของใครบางคนกันเถอะ"
