 invite_a_linguist_desc:0 "เป็นเรื่องจำเป็นอย่างยิ่งที่บุตรหลานของข้าและตัวข้าเองจะต้องพูดภาษาของชนชั้นสูง ข้าสามารถนำครูสอนภาษาที่มีทักษะเข้ามา เพื่อให้แน่ใจในเรื่องนี้ได้"
