l_english: 
 order_mass_eviction_decision:0 "สั่งขับไล่ครั้งใหญ่"
 order_mass_eviction_decision_desc:0 "เป็นที่ทราบกันดีว่าเราขาดห้องพักในราชสำนักที่ [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] และเรามี "แขก" ที่มาขออาศัยอยู่ไม่น้อยที่ฉวยโอกาสจากความเอื้อเฟื้อของข้า— #EMP ของเรา#! \n\nโดยปกติแล้ว การเรียกร้องให้คนเกียจคร้านเหล่านี้ย้ายออกไปถือเป็นการเสียมารยาท แต่หากข้าอ้างว่าเราไม่สามารถให้ที่พักแก่พวกเขาได้..."
 order_mass_eviction_decision.tt.courtier_option:0 "เนื่องจากท่านขาดแคลนที่พักอย่างรุนแรง ท่านอาจเลือกที่จะขับไล่ข้าราชสำนักที่ไม่สำคัญออกไปด้วย"
 order_mass_eviction_decision_tooltip:0 "ส่ง [guests|E] ของท่านกลับบ้าน"
 order_mass_eviction_decision_confirm:0 "พื้นที่นั้นมีค่า!"
 AT_LEAST_ONE_GUEST_TRIGGER:0 "ท่านมี [guest|E] อย่างน้อย 1 คน"
 AT_LEAST_ONE_UNIMPORTANT_COURTIER_TRIGGER:0 "ท่านมี [courtier|E] ที่ไม่สำคัญอย่างน้อย 1 คน"

 exoticise_a_grand_hall_decision:1 "ตก แต่งโถงใหญ่ให้แปลกตา"
 exoticise_a_grand_hall_decision_desc:0 "ราชสำนักของข้าเต็มไปด้วยห้องแล้วห้องเล่า มากพอที่แม้ แต่โถงที่น่าประทับใจบางแห่งของเราก็ไม่ได้ใช้งานตลอดทั้งปี\n\nด้วยสถาปัตยกรรมมากมายให้ตก แต่งและประดับประดา แน่นอนว่าเราสามารถใช้จ่ายฟุ่มเฟือยกับบางสิ่งที่จำลองมาจากรูปแบบที่แตกต่างอย่างสิ้นเชิงได้?"
 exoticise_a_grand_hall_decision_tooltip:0 "ตก แต่งส่วนหนึ่งของวังของท่านใหม่ในรูปแบบของ [royal_court|E] อื่น"
 exoticise_a_grand_hall_decision.tt.you_ponder:0 "ท่านครุ่นคิดถึง [kingdoms|E] และ [empires|E] อื่นๆ..."
 exoticise_a_grand_hall_decision_confirm:0 "ไปตามช่างก่อสร้างมา!"
 exoticise_a_grand_hall_decision.tt.any_valid_empire:0 "[empire|E] ใดๆ ที่มี [royal_court|E] อยู่ใน [diplomatic_range|E]"
 exoticise_a_grand_hall_decision.tt.any_valid_kingdom:0 "[kingdom|E] ใดๆ ที่มี [royal_court|E] อยู่ใน [diplomatic_range|E]"

