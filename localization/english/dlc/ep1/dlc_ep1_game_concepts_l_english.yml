l_english: 
 game_concept_royal_court:0 "ราชสำนักหลวง"
 game_concept_royal_courts:0 "ราชสำนักหลวง"
 game_concept_royal_court_desc:2 "[rulers|E] ผู้โดดเด่นมีชื่อเสียงมากพอที่จะดำรงรักษาราชสำนักหลวง ซึ่งให้การเข้าถึงโบนัสและโอกาสต่างๆ มากมาย\n\nเมื่อ [ruler|E] ที่มี [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], หรือ [GetGovernment( 'tribal_government' ).GetName] กลายเป็น [king|E] หรือ [emperor|E] พวกเขาจะสามารถเข้าถึงราชสำนักหลวงของตนได้\n\nราชสำนักหลวง แต่ละแห่งมี [court_grandeur_level|E] ซึ่งให้ผลประโยชน์ตามชื่อเสียงของราชสำนักหลวง และ [court_type|E] ของราชสำนักหลวงนั้น\n\nผู้ร้องทุกข์, [vassals|E], และ [courtiers|E] อาจปรากฏตัวที่ราชสำนักหลวงของท่าน หรือท่านสามารถ [hold_court|E] เพื่อเชิญผู้ใดก็ตามใน [realm|E] มาแจ้งความคับข้องใจของพวกเขาได้\n\nราชสำนักหลวงยังอนุญาตให้ผู้ปกครองจัดแสดง [court_artifacts|E] และ [inspired|E] [guests|E] อาจปรากฏตัวที่ราชสำนักหลวง เสนอที่จะสร้าง [artifacts|E] ใหม่\n\nเมื่อท่านสิ้นชีพ [player_heir|E] ของท่านจะสืบทอดราชสำนักหลวงของท่าน"
 game_concept_court_grandeur_level:0 "ระดับความโอ่อ่าของราชสำนัก"
 game_concept_court_grandeur_levels:0 "ระดับความโอ่อ่าของราชสำนัก"
 game_concept_grandeur_level:0 "ระดับความโอ่อ่า"
 game_concept_grandeur_levels:0 "ระดับความโอ่อ่า"
 game_concept_court_grandeur_level_desc:2 "ระดับความโอ่อ่าของ [royal_court|E] ให้โบนัสแก่เจ้าของ และจะปลดล็อกเมื่อ [court_grandeur_value|E] ของราชสำนักเพิ่มขึ้น\n\nนอกเหนือจากผลกระทบของ แต่ละระดับแล้ว [realms|E] ขนาดใหญ่ยังถูกคาดหวังให้มีระดับความโอ่อ่าที่สูงขึ้น สิ่งนี้เรียกว่า [court_grandeur_expectations|E]"
 game_concept_court_grandeur:0 "ความโอ่อ่าของราชสำนัก"
 game_concept_grandeur:0 "ความโอ่อ่า"
 game_concept_court_grandeur_value:0 "ค่าความโอ่อ่าของราชสำนัก"
 game_concept_court_grandeur_desc:2 "$game_concept_court_grandeur_value$ ของ [royal_court|E] แสดงให้เห็นว่าราชสำนักมีชื่อเสียงเพียงใด และปลดล็อก [court_grandeur_levels|E] ใหม่เมื่อค่าเพิ่มขึ้น\n\nค่านี้มีช่วงตั้งแต่ 0 ถึง 100 และเมื่อเวลาผ่านไปจะคงที่ที่ค่าพื้นฐาน ค่าพื้นฐานได้รับผลกระทบจากสิ่งต่างๆ เช่น [dynasty_perks|E], จำนวนเงินที่ท่านใช้จ่ายไปกับ [court_amenities|E], และหากท่านมี [court_artifacts|E] อันงดงาม\n\nส่วนหนึ่งของความโอ่อ่าจะสูญเสียไปเมื่อมีการ [succession|E]"
 game_concept_court_amenities:0 "สิ่งอำนวยความสะดวกในราชสำนัก"
 game_concept_court_amenity:0 "สิ่งอำนวยความสะดวกในราชสำนัก"
 game_concept_amenities:0 "สิ่งอำนวยความสะดวก"
 game_concept_court_amenities_desc:1 "$game_concept_court_amenities$ คือมาตรฐานการครองชีพที่กำหนดไว้ใน [royal_court|E]\n\nสิ่งเหล่านี้ถูกกำหนดโดย [ruler|E] ของ [royal_court|E] โดย แต่ละหมวดหมู่ (แฟชั่น, อาหาร, ที่พัก, และข้ารับใช้) มีหลายระดับ การใช้จ่ายมากขึ้นกับสิ่งอำนวยความสะดวกของท่านโดยทั่วไปจะให้ [court_grandeur_value|E] มากขึ้น\n\nผู้ปกครองที่มี [GetGovernment( 'tribal_government' ).GetName] ถูกห้ามไม่ให้เลือกสิ่งอำนวยความสะดวกที่สูงขึ้น"
 game_concept_court_grandeur_expectations:0 "ความคาดหวังความโอ่อ่าของราชสำนัก"
 game_concept_court_grandeur_expectation:0 "ความคาดหวังความโอ่อ่าของราชสำนัก"
 game_concept_grandeur_expectations:0 "ความคาดหวังความโอ่อ่า"
 game_concept_court_grandeur_expectations_desc:2 "ท่านถูกคาดหวังให้มี [court_grandeur_level|E] ที่สูงพอเมื่อเทียบกับ [realm_size|E] ของท่าน\n\nเมื่อ [realm|E] ของท่านใหญ่ขึ้น ไพร่ฟ้าข้าแผ่นดินและโลกภายนอกคาดหวังให้ [royal_court|E] ของท่านมีความโอ่อ่าทัดเทียมกัน\n\nหากท่านไม่เป็นไปตามความคาดหวัง จะมีบทลงโทษต่างๆ เกิดขึ้น ในทางกลับกัน หากท่านเกินความคาดหวัง ท่านจะได้รับโบนัสต่างๆ แทน\n\nความคาดหวังของผู้ปกครอง [GetGovernment( 'tribal_government' ).GetName] จะเท่ากับความโอ่อ่าปัจจุบันของพวกเขาเสมอ"
 game_concept_hold_court:0 "$activity_hold_court$"
 game_concept_holding_court:0 "การออกว่าราชการ"
 game_concept_hold_court_desc:0 "[activity|E] ที่ [vassals|E] และ [courtiers|E] ใน [realm|E] รวมตัวกันที่ [royal_court|E] เพื่อร้องทุกข์ต่อ [liege|E] และแจ้งความคับข้องใจของพวกเขา\n\nสถานการณ์ที่เจ้าเหนือหัวจะถูกเรียกให้ตัดสินมีตั้งแต่ข้อพิพาทเล็กน้อยและความเข้าใจผิดไปจนถึงภัยพิบัติทั่วทั้งอาณาจักร ปัญหาส่วนใหญ่จะมีทางออกที่เป็นประโยชน์ – หากไม่ใช่สำหรับฝ่ายที่เกี่ยวข้อง อย่างน้อยก็สำหรับเจ้าเหนือหัว"
 game_concept_court_type:0 "ประเภทราชสำนัก"
 game_concept_court_types:0 "ประเภทราชสำนัก"
 game_concept_court_type_desc:3 "ในฐานะส่วนหนึ่งของ [royal_court|E] ของพวกเขา [rulers|E] สามารถมี $game_concept_court_type$ ที่กำหนดได้\n\nแต่ละ $game_concept_court_type$ ให้โบนัสแก่ผู้ปกครองและ [court|E] ของตนเอง ขึ้นอยู่กับ [court_grandeur_level|E]\n\n[ethos|E] ของ [culture|E] ของผู้ปกครองเป็นตัวกำหนดว่าพวกเขาสามารถมีประเภทราชสำนักใดได้บ้าง\n\nประเภทราชสำนักต่างๆ คือ:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 
 game_concept_court_type_trait:0 "ลักษณะนิสัยตามประเภทราชสำนัก"
 game_concept_court_type_trait_desc:2 "หลังจากรับใช้เป็นเวลา [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] ปีใน [royal_court|E] [courtier|E] จะได้รับ [trait|E] ที่สะท้อนถึง [court_type|E] ของราชสำนักนั้น\n\nคุณภาพของลักษณะนิสัยนี้ตัดสินจากระยะเวลาที่ [character|E] รับใช้เป็นข้าราชสำนักในราชสำนัก"
 
 game_concept_court_language:0 "ภาษาในราชสำนัก"
 game_concept_court_languages:0 "ภาษาในราชสำนัก"
 game_concept_court_language_desc:1 "ภาษาในราชสำนักคือ [language|E] อย่างเป็นทางการของ [royal_court|E] ซึ่งขุนนางใช้พูดและระบบราชการใช้\n\nค่าพื้นฐานของ [court_grandeur|E] จะเพิ่มขึ้นสำหรับ แต่ละ [county|E] ใน [realm|E] ที่ใช้ภาษาเดียวกัน สำหรับ แต่ละราชสำนักหลวงที่พูดภาษาในราชสำนักเดียวกัน และหากเป็นภาษาแม่ของ [ruler|E]"

 game_concept_inspiration:0 "แรงบันดาลใจ"
 game_concept_inspirations:0 "แรงบันดาลใจ"
 game_concept_inspired:0 "ผู้มีแรงบันดาลใจ"
 game_concept_inspiration_desc:2 "[characters|E] ผู้มีแรงบันดาลใจคือช่างฝีมือผู้ชำนาญที่มี [project|E] ซึ่งอาจเป็นจริงได้หากท่านเป็น [sponsor|E] ของพวกเขา\n\nท่านสามารถใช้ [decision|E] ว่าจ้างสร้างสิ่งประดิษฐ์ล้ำค่า เพื่อจ้างตัวละครดังกล่าว เพื่อสร้าง [artifact|E][SelectLocalization( HasDlcFeature( 'royal_court' ), 'game_concept_inspiration_desc_DLC', '' )]\n\nเมื่อโครงการของพวกเขาเสร็จสมบูรณ์ ผู้อุปถัมภ์จะได้รับผลลัพธ์ ซึ่งโดยปกติคือสิ่งประดิษฐ์ล้ำค่า"
 game_concept_inspiration_desc_DLC:0 "\n\nนอกจากนี้ ตัวละครผู้มีแรงบันดาลใจจะปรากฏตัวเป็นระยะใน [royal_courts|E] โดยเฉพาะอย่างยิ่งในราชสำนักที่มี [court_grandeur_level|E] สูง"
 game_concept_sponsor:0 "ผู้อุปถัมภ์"
 game_concept_sponsored: "ได้รับการอุปถัมภ์"
 game_concept_sponsor_desc:2 "A $game_concept_sponsor$ คือ [ruler|E] ผู้ให้ทุนสนับสนุน [project|E] ของ [character|E] ผู้ [inspired|E]"

 game_concept_artifact:0 "สิ่งประดิษฐ์ล้ำค่า"
 game_concept_artifacts:0 "สิ่งประดิษฐ์ล้ำค่า"
 game_concept_artifact_i: "@artifact_icon!"
 game_concept_artifact_desc:5 "สิ่งประดิษฐ์ล้ำค่าคือวัตถุที่น่าสังเกต ซึ่งให้โบนัสแก่ [character|E] ที่ใช้มัน\n\n[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_artifact_desc_DLC', 'game_concept_artifact_desc_NO_DLC' )]\n\nสิ่งประดิษฐ์ล้ำค่าบางชิ้นมีความพิเศษมากกว่าชิ้นอื่น และมี [rarity|E] สูงกว่า\n\nเช่นเดียวกับ [titles|E] ตัวละครสามารถได้รับ [artifact_claims|E] เหนือสิ่งประดิษฐ์ล้ำค่า และพยายามยึดสิ่งประดิษฐ์ล้ำค่านั้นมาเป็นของตนเอง\n\nสิ่งประดิษฐ์ล้ำค่ายังมี [durability|E]: เมื่อค่านี้ถึงศูนย์ สิ่งประดิษฐ์ล้ำค่าจะถูกทำลาย\n\nสิ่งประดิษฐ์ล้ำค่าจะถูกสืบทอดโดย [player_heir|E] ของเจ้าของเสมอ หากสิ่งประดิษฐ์ล้ำค่าถูกสืบทอดโดยผู้ที่ไม่ใช่ [close_family_member|E] มันจะสูญเสีย [durability|E] หรืออาจถูกทำลายทันที"
 game_concept_artifact_desc_NO_DLC:0 "เนื่องจากสิ่งประดิษฐ์ล้ำค่าถูกสวมใส่หรือพกพาติดตัว จึงเรียกว่า [inventory_artifacts|E]"
 game_concept_artifact_desc_DLC:0 "สิ่งประดิษฐ์ล้ำค่าแบ่งออกเป็นสองประเภท:\n$BULLET_WITH_TAB$[inventory_artifacts|E] ถูกสวมใส่หรือพกพาโดยตัวละคร\n$BULLET_WITH_TAB$[court_artifacts|E] อยู่ภายใน [royal_court|E] ของ [ruler|E]"
 game_concept_court_artifact:0 "สิ่งประดิษฐ์ล้ำค่าในราชสำนัก"
 game_concept_court_artifacts:0 "สิ่งประดิษฐ์ล้ำค่าในราชสำนัก"
 game_concept_court_artifact_desc:3 "สิ่งประดิษฐ์ล้ำค่าในราชสำนักคือ [artifact|E] ที่จัดแสดงใน [royal_court|E] ของ [ruler|E] เช่น พรมผนัง หรือหนังสือภาพประกอบสวยงาม\n\nสิ่งประดิษฐ์ล้ำค่าในราชสำนักเป็นปัจจัยหนึ่งที่กำหนด [court_grandeur|E] ของราชสำนักหลวง\n\nไม่มีการจำกัดจำนวนสิ่งประดิษฐ์ล้ำค่าที่ตัวละครสามารถมีได้ แต่เฉพาะสิ่งที่จัดแสดงในช่องประเภทของมันเท่านั้นที่จะมีผล\n\nท่านสามารถสร้างสิ่งประดิษฐ์ล้ำค่าในราชสำนักใหม่จาก [characters|E] [inspired|E] จากการตัดสินใจว่าจ้างสร้างสิ่งประดิษฐ์ล้ำค่า หรือจากการเลือกที่จะ [reforge|E] [inventory_artifact|E]"
 game_concept_inventory_artifact:0 "สิ่งประดิษฐ์ล้ำค่าในครอบครอง"
 game_concept_inventory_artifacts:0 "สิ่งประดิษฐ์ล้ำค่าในครอบครอง"
 game_concept_inventory_artifact_desc:4 "สิ่งประดิษฐ์ล้ำค่าในครอบครองคือ [artifacts|E] ที่ [character|E] สวมใส่หรือพกพาติดตัว เช่น อาวุธหรือมงกุฎ\n\nไม่มีการจำกัดจำนวนสิ่งประดิษฐ์ล้ำค่าที่ตัวละครสามารถมีได้ แต่เฉพาะสิ่งที่สวมใส่ในช่องประเภทของมันเท่านั้นที่จะมีผล\n\nท่านสามารถสร้างสิ่งประดิษฐ์ล้ำค่าในครอบครองใหม่จาก [characters|E] [inspired|E] หรือจากการตัดสินใจว่าจ้างสร้างสิ่งประดิษฐ์ล้ำค่า"
 game_concept_project:0 "โครงการ"
 game_concept_project_desc:2 "โครงการคือสิ่งที่ [character|E] [inspired|E] ดำเนินการด้วยความช่วยเหลือของ [sponsor|E] เพื่อ ทำให้วิสัยทัศน์ของพวกเขาเป็นจริง โดยปกติอยู่ในรูปแบบของการสร้าง [artifact|E]"
 game_concept_artifact_durability:0 "ความทนทานของสิ่งประดิษฐ์ล้ำค่า"
 game_concept_durability:0 "ความทนทาน"
 game_concept_artifact_durability_desc:2 "[artifact|E] ทุกชิ้นมีความทนทาน เมื่อความทนทานทั้งหมดหมดไป สิ่งประดิษฐ์ล้ำค่าจะถูกทำลาย\n\nความทนทานจะลดลงตามกาลเวลา แต่ก็สามารถสูญเสียไปในเหตุการณ์บางอย่างได้ เช่น [sieges|E] และเมื่อมีการ [succession|E]\n\nความทนทานสามารถฟื้นฟูได้โดยการเลือกที่จะ [reforge|E] หรือ [repair|E] สิ่งประดิษฐ์ล้ำค่า"
 game_concept_artifact_claim:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่า"
 game_concept_artifact_claims:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่า"
 game_concept_artifact_claim_desc:3 "$game_concept_artifact_claim$ แสดงถึงสิทธิ์ตามกฎหมายของบุคคลต่อ [artifact|E]\n\nการมีสิทธิ์เรียกร้องเหนือ [artifact|E] หมายความว่าท่านสามารถดำเนินการต่างๆ ต่อสิ่งประดิษฐ์ล้ำค่านั้น และเจ้าของของมัน หากท่านไม่ได้ครอบครองมันอยู่ในปัจจุบัน (ตัวอย่าง เช่น การใช้ [scheme|E] [GetScheme('steal_back_artifact').GetTypeName])\n\nมี [personal_artifact_claims|E] สำหรับ [character|E] และ [house_artifact_claims|E] สำหรับ [houses|E]\n\nสิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่านั้นง่ายกว่าสิทธิ์เรียกร้อง [title_claims|E]; มันมีอยู่ หรือไม่มีอยู่ พวกมันยังไม่ถูกสืบทอดไปเกินกว่ารุ่นแรก"
 game_concept_personal_artifact_claim:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่าส่วนบุคคล"
 game_concept_personal_artifact_claims:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่าส่วนบุคคล"
 game_concept_personal_artifact_claim_desc:2 "$game_concept_personal_artifact_claim$ คือ [artifact_claim|E] ที่เป็นส่วนตัวของท่าน ตรงข้ามกับ [house_artifact_claim|E]\n\nเมื่อท่านสิ้นชีพ บุตรหลานของท่านจะได้รับสิทธิ์เรียกร้องเหนือสิ่งประดิษฐ์ล้ำค่าทั้งหมดของท่าน\n\nท่านยังได้รับสิทธิ์เรียกร้องเหนือสิ่งประดิษฐ์ล้ำค่าหากมันถูกขโมยระหว่าง [siege|E] หรือ [raid|E]\n\nสิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่าจะไม่ถูกสืบทอด"
 game_concept_house_artifact_claim:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่าของตระกูล"
 game_concept_house_artifact_claims:0 "สิทธิ์เรียกร้องสิ่งประดิษฐ์ล้ำค่าของตระกูล"
 game_concept_house_artifact_claim_desc:1 "หากท่านถือครอง [artifact|E] ไว้นานพอ [house|E] ทั้งหมดของท่านจะได้รับ [artifact_claim|E] เหนือมัน – นั่นคือ $game_concept_house_artifact_claim$\n\nท่านสามารถดำเนินการตาม $game_concept_house_artifact_claim$ ได้ก็ต่อเมื่อสิ่งประดิษฐ์ล้ำค่านั้นไม่ได้ถูกถือครองโดยสมาชิกในตระกูลของท่าน\n\nเมื่อมีการก่อตั้ง [cadet_branch|E] สิทธิ์เรียกร้องของตระกูลที่มีอยู่เหนือสิ่งประดิษฐ์ล้ำค่าที่ถือครองโดยสมาชิกของตระกูลใหม่จะถูกโอนไปยังตระกูลใหม่"
 
 game_concept_court_position:0 "ตำแหน่งในราชสำนัก"
 game_concept_court_position_i: "@court_position_icon!"
 game_concept_court_positions:0 "ตำแหน่งในราชสำนัก"
 game_concept_court_position_desc:2 "$game_concept_court_positions$ คือบทบาทเฉพาะทางที่ [courtiers|E] และ [vassals|E] สามารถได้รับเพื่อช่วยเหลือ [liege|E] ของพวกเขา\n\nผลประโยชน์ที่ท่านได้รับจาก $game_concept_court_positions$ ถูกกำหนดโดย [aptitude|E] ของผู้ดำรงตำแหน่งสำหรับตำแหน่งนั้น\n\nการมอบ $game_concept_court_positions$ นั้นฟรี แต่ท่านต้องจ่ายเงินเดือนเป็น [gold|E] และการเพิกถอนตำแหน่งต้องเสีย [prestige|E]"

 game_concept_aptitude:0 "ความถนัด"
 game_concept_aptitude_desc: "$game_concept_aptitude$ ของ [character|E] กำหนดว่าพวกเขามีประสิทธิภาพเพียงใดในบทบาทต่างๆ ที่ [court|E] บทบาทดังกล่าว รวมถึง [court_positions|E], [diarchs|E], และ [tax_collectors|E]\n\n$game_concept_aptitude$ วัดผลใน 5 ระดับ ตั้งแต่ แย่มาก ไปจนถึง ยอดเยี่ยม ระดับ $game_concept_aptitude$ ของตัวละครเป็นตัวกำหนดโบนัสที่ [liege|E] ได้รับจากการจ้างพวกเขาในบทบาทที่ [court|E]\n\nตัวอย่าง เช่น ตัวละครที่เป็น [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] โดยธรรมชาติแล้วจะมีความพร้อมมากกว่าในการรับใช้เป็น $court_physician_court_position$"
 game_concept_aptitude_i: "#P @aptitude:5:inherit_color!#!"

 game_concept_court_event:0 "เหตุการณ์ในราชสำนัก"
 game_concept_court_events:0 "เหตุการณ์ในราชสำนัก"
 game_concept_court_event_desc:0 "$game_concept_court_event$ คือเหตุการณ์ที่เกี่ยวข้องกับสมาชิกใน [court|E] ของท่าน สามารถดูได้ใน [royal_court|E]"
 game_concept_petition_liege:0 "การร้องทุกข์"
 game_concept_petition_liege_desc:1 "โอกาสสำหรับ [vassals|E] ในการขอความช่วยเหลือจาก [liege|E] ของพวกเขา\n\nสามารถหยิบยกประเด็นปัญหาได้หลากหลาย และขึ้นอยู่กับ [liege|E] ที่จะตัดสินใจว่าจะยอมรับหรือไม่"
 game_concept_pay_homage:0 "การแสดงความจงรักภักดี"
 game_concept_pay_homage_desc:0 "[activity|E] ที่ [vassals|E] สามารถแสดงความจงรักภักดีต่อ [liege|E] ของตนอย่างเป็นทางการ\n\nการแสดงความจงรักภักดีสามารถทำได้หลายวิธี และสามารถให้ [opinion|E], [prestige|E], และ [dynasty_prestige|E] แก่ทั้งสองฝ่าย"

 repair_or_reforge_and_repair:0 "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'repair_and_reforge', 'just_repair' )]"
 repair_and_reforge:0 "[reforge|E] หรือ [repair|E]"
 just_repair:0 "[repair|E]"
 game_concept_reforge_artifact:0 "การหลอมสิ่งประดิษฐ์ล้ำค่าใหม่"
 game_concept_reforge:0 "การหลอมใหม่"
 game_concept_reforge_artifact_desc:0 "[inventory_artifacts|E] บางชิ้นสามารถหลอมใหม่ได้ เปลี่ยนให้เป็น [court_artifacts|E]\n\nท่านต้องมี [GetCourtPositionType('antiquarian_court_position').GetName()] และจ่าย [gold|E] เพื่อหลอม [artifact|E] ใหม่ แม้ว่าสิ่งประดิษฐ์ล้ำค่าที่เก่ากว่าจะมีราคาถูกกว่าในการหลอมใหม่\n\nเช่นเดียวกับเมื่อท่าน [repair|E] [artifact|E] [durability|E] ของมันจะถูกฟื้นฟู\n\nเฉพาะอาวุธ, ชุดเกราะ, มงกุฎ และเครื่องราชกกุธภัณฑ์เท่านั้นที่สามารถหลอมใหม่ได้ และพวกมันจะกลายเป็นสิ่งของบนแท่นเสมอ"
 game_concept_repair_artifact:0 "การซ่อมแซมสิ่งประดิษฐ์ล้ำค่า"
 game_concept_repair:0 "การซ่อมแซม"
 game_concept_repair_artifact_desc: "เมื่อ [artifact|E] มี [durability|E] ต่ำ ท่านสามารถเลือกที่จะซ่อมแซมมันได้\n\nท่านต้องจ่าย [gold|E] เพื่อซ่อมแซมสิ่งประดิษฐ์ล้ำค่า[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_repair_artifact_desc_DLC', '' )]"
 game_concept_repair_artifact_desc_DLC:0 "\n\nอีกทางเลือกหนึ่ง ท่านสามารถเลือกที่จะ [reforge|E] สิ่งประดิษฐ์ล้ำค่าได้"
