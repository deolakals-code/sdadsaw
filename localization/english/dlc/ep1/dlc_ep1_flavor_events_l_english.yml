 ep1_flavor.2030.desc_2_baron:0 "[local_dispute_2.GetFirstName] [local_dispute_2.GetTitleAsNameNoTooltip] แห่ง [local_dispute_2.GetPrimaryTitle.GetNameNoTier],"
 ep1_flavor.2030.desc_2_scholar:0 "[local_dispute_2.GetFirstName] [local_dispute_2.GetWomanMan] ผู้มีชื่อเสียงด้านอักษรศาสตร์ใน [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_2_culture:0 "[local_dispute_2.GetFirstName] โฆษกของชนกลุ่มน้อยชาว [local_dispute_1.GetCulture.GetName] ของ [local_county_1.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_2_faith:0 "[local_dispute_2.GetFirstName] ตัวแทนของชนกลุ่มน้อย [local_dispute_2.GetFaith.GetAdjective] ของ [local_county_2.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_2_judge:0 "[local_dispute_2.GetFirstName] ผู้พิพากษา [local_county_2.GetTierAsNameNoTooltip|l] ที่มีชื่อเสียงของ [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_captain:0 "[local_dispute_2.GetFirstName] นายอำเภอที่มีชื่อเสียงของ [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_merchant:0 "[local_dispute_2.GetFirstName] พ่อค้าคนสำคัญที่ตั้งอยู่ใน [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_outro:0 "ผู้ ซึ่งขัดแย้งกันมาตลอด\n\nจิตใจของข้าหมุนวนอยู่กับรายละเอียดเล็กน้อย และในไม่ช้าก็ชัดเจนว่าไม่มีฝ่ายใดถูก และจะมีเพียงฝ่ายเดียวเท่านั้นที่จะพอใจจากที่นี่..."
