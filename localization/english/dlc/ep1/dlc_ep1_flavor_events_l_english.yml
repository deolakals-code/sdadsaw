 ep1_flavor.2010.innocent:0 "ความผิดยังเป็นที่น่าสงสัย"

# Interservice Rivalry
 ep1_flavor.2020.t:0 "การแข่งขันระหว่างหน่วยงาน"
 ep1_flavor.2020.desc:0 "การแข่งขันที่ดีต่อสุขภาพในหมู่ทหารเป็นเรื่องปกติ แต่ความแตกแยกระหว่าง [SCOPE.Custom('GetMAAType1')] และ [SCOPE.Custom('GetMAAType2')] ของข้านั้นชัดเจน \n\nการพัฒนานี้สะท้อนให้เห็นในความเป็นปรปักษ์ที่เพิ่มขึ้นของนายทหารของพวกเขา [ROOT.Char.Custom('MountedWarriorTermPlural')] [knight_1.GetTitledFirstName] และ [knight_2.GetTitledFirstName] ซึ่งทะเลาะกันต่อหน้าข้าอีกครั้ง \n\n"
 ep1_flavor.2020.desc_knight_1_archers:0 ""...หวังว่าเจ้าคงไม่หมดลูกธนูเสียก่อน แล้วเจ้าจะต้องสู้ #EMP จริงๆ#!""
 ep1_flavor.2020.desc_knight_1_light_cavalry:0 ""...ตีแล้วหนีเหรอ? ดูเหมือน #EMP สะดุ้งแล้วหนี#! มากกว่านะสำหรับข้า!""
 ep1_flavor.2020.desc_knight_1_heavy_infantry:0 ""...ช่าง #EMP กล้าหาญ#! เสียจริง ใส่เกราะตั้งแต่หัวจรดเท้า!""
 ep1_flavor.2020.desc_knight_1_pikemen:0 ""...เป็นอะไรไป กลัวศัตรูเข้ามา #EMP ใกล้#! เกินไปหรือ?""
 ep1_flavor.2020.desc_knight_1_heavy_cavalry:0 ""...ข้าเข้าใจแล้ว: ทำไมต้อง #EMP สู้#! ศัตรู ในเมื่อเจ้าแค่เหยียบย่ำพวกมันได้?""
 ep1_flavor.2020.desc_knight_1_archer_cavalry:0 ""...เจ้าเคย #EMP เห็น#! ศัตรูจริงๆ หรือเปล่า เคลื่อนที่เร็วขนาดนั้น และอยู่ไกลขนาดนั้น?""
 ep1_flavor.2020.desc_knight_1_skirmishers:0 ""...ฝึกซ้อม ทำให้พวกมันอ่อนแอลงสำหรับนักสู้ #EMP ตัวจริง#! อีกแล้วหรือ?""
 ep1_flavor.2020.desc_knight_1_elephant_cavalry:0 ""...อะไรนะ แค่ช้างเหรอ? เจ้าไม่อยากขี่อะไรที่ #EMP ใหญ่กว่า#! นี้หรือ?""
 ep1_flavor.2020.desc_knight_1_camel_cavalry:0 ""ม้าแห่งทะเลทราย? เหมือน #EMP วัว#! มากกว่าถ้าเจ้าถามข้า""
 ep1_flavor.2020.desc_bridge:0 "[knight_2.GetFirstNameNoTooltip] เยาะเย้ย ก่อนที่ [knight_1.GetFirstNameNoTooltip] จะโต้กลับอย่างดุเดือด:"
 ep1_flavor.2020.desc_knight_2_archers:0 ""โอ้ ได้โปรด ข้าจะไม่รับฟังคำสอนเรื่องการต่อสู้จากนายพรานผู้ยิ่งใหญ่""
 ep1_flavor.2020.desc_knight_2_light_cavalry:0 ""ใช่ นั่นมีน้ำหนักมากจริงๆ มาจาก #EMP หน่วยสอดแนม#! ที่ถูกยกย่องเกินจริง""
 ep1_flavor.2020.desc_knight_2_heavy_infantry:0 ""พูดง่าย ขณะที่สวมเกราะโซ่ #EMP หนา#! ขนาดนั้น""
 ep1_flavor.2020.desc_knight_2_pikemen:0 ""โอ้ ไปซ่อนหลังกำแพงเข็มของเจ้าซะ ไอ้โง่""
 ep1_flavor.2020.desc_knight_2_heavy_cavalry:0 ""ปัดโธ่ เจ้าสูญเสียมุมมองที่มีความหมายไปแล้ว อยู่สูงบนหลังม้าศึกตัวมหึมานั่น""
 ep1_flavor.2020.desc_knight_2_archer_cavalry:0 ""ข้าจะไม่ถูกสั่งสอนโดย #EMP คนฝึกม้า#! ที่หลงผิดพร้อมธนู""
 ep1_flavor.2020.desc_knight_2_skirmishers:0 ""มาคุยกับข้าเมื่อเจ้าชักดาบจริงๆ เสียก่อน ไม่ต้องพูดถึงการใช้มัน""
 ep1_flavor.2020.desc_knight_2_elephant_cavalry:0 ""[knight_2.GetWomanMan] ที่ขี่อยู่บนยอดสัตว์ประหลาดงาใหญ่ยักษ์กล่าว""
 ep1_flavor.2020.desc_knight_2_camel_cavalry:0 ""อุ๊ย ถอยไปห่างๆ ข้า กลิ่นอูฐแรงเหลือเกิน""
 ep1_flavor.2020.a:0 ""[SCOPE.Custom('GetMAAType1')] คือกระดูกสันหลังของเรา!""
 ep1_flavor.2020.b:0 ""เราไม่มีอะไรเลยหากไม่มี [SCOPE.Custom('GetMAAType2')] ของเรา!""
 ep1_flavor.2020.c:0 ""จะมีประโยชน์อะไรถ้าขาดอย่างใดอย่างหนึ่งไป?""
 ep1_flavor.2020.c.success:0 "ข้อโต้แย้งของท่านน่าเชื่อถือ"
 ep1_flavor.2020.c.failure:0 "ข้อโต้แย้งของท่านไม่เป็นผล"
 ep1_flavor.2020.d:0 ""พอได้แล้ว พวกเจ้าสองคน""
 ep1_flavor_2020_both_modifier:0 "การยอมรับทางทหาร"
 ep1_flavor_2020_both_modifier_desc:0 "อัศวินของตัวละครนี้ได้รับแรงบันดาลใจจากการยอมรับความสำคัญของกองทหารจากเจ้าเหนือหัวของพวกเขา"
