 # Exotic Arms
 ep1_flavor.2040.t:0 "อาวุธแปลกถิ่น"
 ep1_flavor.2040.desc:1 "พร้อมกับสินค้าแปลกๆ พ่อค้าก็นำเรื่องเล่าสูงส่งจากดินแดนห่างไกลมาด้วย ซึ่งไม่สามารถตรวจสอบได้ เต็มไปด้วยความมหัศจรรย์ \n\nกลุ่มพ่อค้าเร่ชาว [foreign_merchant.GetCulture.GetNameNoTooltip] อ้างว่าได้นำวัตถุ '#EMP [exotic_blade_holder.GetCulture.GetNameNoTooltip]#!' มา ซึ่งกล่าวกันว่ามาจากราชสำนักอันห่างไกลของผู้ปกครองผู้ยิ่งใหญ่: '#EMP [exotic_blade_holder.GetFullNameNoTooltipRegnal]#!' ไม่น้อยไปกว่านั้น \n\n[foreign_merchant.GetTitledFirstName] พ่อค้าผู้นำ ยิ้มอย่างมืดมน,"
 ep1_flavor.2040.desc.artifact:0 ""ข้าเคยเห็น [my_artifact.GetName] ของท่านแล้ว แลกกับมันสิ แล้วข้าจะให้ [exotic_blade.Custom('ArtifactType')|l] ชิ้นเดียวในโลกนี้แก่ท่าน...""
 ep1_flavor.2040.desc.gold:0 ""[exotic_blade.Custom('ArtifactType')|l] ที่ไม่เหมือนใครชิ้นนี้อาจเป็นของท่าน—ในราคาพิเศษแน่นอน—ท่าน [ROOT.Char.GetTitleAsNameNoTooltip] ผู้ยิ่งใหญ่..."\n\nช่างเป็นเรื่องเล่าที่น่าจะเป็นไปได้จริงๆ!"
 ep1_flavor.2040.desc.outro:0 "หากเพียง แต่ข้ามีวิธีตรวจสอบเรื่องราวของพ่อค้าเร่..."
 ep1_flavor.2040.desc.outro_antiquarian:1 "ข้ามองไปที่ [antiquarian.GetTitledFirstName] เพื่อขอคำแนะนำ:"
 ep1_flavor.2040.desc.outro_good_praise:1 ""ไม่ใช่ของปลอมแน่นอน เจ้าเหนือหัวของข้า งานชิ้นนี้เป็นของ [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip] อย่างแท้จริง และมีคุณภาพสูง""
 ep1_flavor.2040.desc.outro_good_unsure:0 ""ข้าไม่คุ้นเคยกับงาน [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip] แต่นี่ดูเหมือนจะทำอย่างประณีต""
 ep1_flavor.2040.desc.outro_good_warning:0 ""ข้าไม่สามารถแนะนำงานชิ้นนี้ได้ เจ้าเหนือหัวของข้า รอย... ค้อน... มันดู... โหยหา" [exotic_blade_holder.GetSheHe|U] พยักหน้าให้ข้าอย่างโง่เขลา"
 ep1_flavor.2040.desc.outro_bad_warning:0 ""[exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip] หรือไม่ก็ตาม นี่เป็นชิ้นงานที่หยาบ เจ้าเหนือหัวของข้า ข้าสงสัยอย่างยิ่งในที่มาที่อ้าง""
 ep1_flavor.2040.desc.outro_bad_unsure:0 ""ข้าลังเลที่จะกล่าวอย่างแน่นอน แต่ข้าไม่เชื่อว่าสิ่งของนี้เป็นไปตามที่อ้าง""
 ep1_flavor.2040.desc.outro_bad_praise:0 ""ช่างเป็นผลงานฝีมือ [exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip] ที่ยอดเยี่ยมอะไร เช่นนี้! ดูสิว่ามันเงางามแค่ไหน!""
 ep1_flavor.2040.a:0 ""ข้าว่าข้าคงต้องยอมแลกกับมัน...""
 ep1_flavor.2040.tt_my:0 "ท่านจะสูญเสีย [my_artifact.GetName] ของท่าน"
 ep1_flavor.2040.tt_exotic:1 "ท่านจะกลายเป็นเจ้าของ [exotic_blade.GetNameNoTooltip]"
 ep1_flavor.2040.toast:0 "[exotic_blade.Custom('ArtifactType')|l] ช่างงดงาม"
 ep1_flavor.2040.toast_poor:0 "[exotic_blade.Custom('ArtifactType')|l] ช่างไร้ประกาย"
 ep1_flavor.2040.b:0 ""ไปเอาถุงเงินของข้ามา!""
 ep1_flavor.2040.c:0 ""ฮ่า! '#EMP [exotic_blade_holder.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]#!'... เรื่องไร้สาระอะไร เช่นนี้! ออกไป!""

 # The Greater Good
 ep1_flavor.2060.t:0 "เพื่อประโยชน์ส่วนรวม"
 ep1_flavor.2060.desc:0 "[detective_scope.GetFirstName] ลูกน้องของ [sandford_scope.GetTitle.GetHolder.GetTitleAsNamePossessiveNoTooltip] ในท้องถิ่น ขอเข้าเฝ้าเป็นการส่วนตัว อ้างว่ารู้ว่าใครอยู่เบื้องหลังการหายตัวไปล่าสุดของ [victim_scope.GetTitledFirstName] และนักเดินทางคนอื่น ๆ ที่มายังราชสำนักของข้า \n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! ข้าได้ค้นพบกลุ่มสมาคมลับที่นำโดย [grocer_scope.GetTitledFirstName] พ่อค้าคนหนึ่ง พวกมันเรียกตัวเองว่า ผู้พิทักษ์แห่ง [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] และพวกที่มันอ้างว่า ทำให้ความยิ่งใหญ่ของ [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] ต้องมัวหมองก็มักจะหายตัวไปในไม่ช้า!" \n\nเมื่อข้าไปตามตัวพ่อค้าคนนั้นมา [grocer_scope.GetSheHe] ปฏิเสธทุกข้อกล่าวหา อ้างว่า [detective_scope.GetWomanMan] ผู้นี้สติฟั่นเฟือนจากการใช้ชีวิตบนถนนอันโหดร้ายของ [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] มานานหลายปี..."
 ep1_flavor.2060.a:0 ""ข้ามั่นใจว่ามีคำอธิบายที่สมเหตุสมผล""
 ep1_flavor.2060.a.tt:0 "[detective_scope.GetFirstName] และ [grocer_scope.GetFirstName] จากไป"
 ep1_flavor.2060.b:0 ""จับกุม [grocer_scope.GetFirstNameNoTooltip] แล้วมาทำงานให้ข้า!""
 ep1_flavor.2060.b.title:0 "คนสอดรู้สอดเห็นที่นองเลือด"
 ep1_flavor.2060.c:0 ""น่าเสียดายที่ท่านต้องเข้ามาเกี่ยวข้อง [detective_scope.GetFirstNameNoTooltip]...""
 ep1_flavor.2060.c.title:0 "ไม่มีโชคในการจับฆาตกรเหล่านั้น"
 ep1_flavor.2060.death_tt:0 "[victim_scope.GetName] หายตัวไปอย่างลึกลับ"

 # When Minds Collide
 ep1_flavor.2070.t:0 "เมื่อความคิดปะทะกัน"
 ep1_flavor.2070.desc.intro:0 "ขณะที่ข้าเดินผ่านห้องสมุด เสียงคร่ำครวญแห่งความไม่พอใจของ [symposium_courtier.GetTitledFirstNamePossessive] กระตุ้นความสนใจของข้า [symposium_courtier.GetSheHe|U] กำลังโต้เถียงกับ [symposium_scholar.GetTitledFirstName] [symposium_scholar.Custom('GetScholarType')|l] ชาว [symposium_scholar.GetCulture.GetNameNoTooltip] ผู้มาเยือน ซึ่งมีชื่อเสียง \n\n"
 ep1_flavor.2070.desc.theo_same_faith:0 ""ท่านกำลังทำผิดพลาด เช่นเดียวกับผู้ริเริ่มชาว [symposium_courtier.GetFaith.GetAdjectiveNoTooltip]," [symposium_courtier.GetFirstNameNoTooltip] เมินหน้า [symposium_courtier.GetHerHis] หนี "แท้จริงแล้ว นี่คือหนทางสู่การนอกรีต" \n\n"ไม่เอาน่า," [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] วิงวอน "แน่นอนว่า [symposium_scholar.GetFaith.HighGodName] มิได้มีเจตนาให้คำสอน [symposium_scholar.GetHerHis] นั้นตายตัว โดยเฉพาะอย่างยิ่งเมื่อปล่อยให้เป็นหน้าที่ของเราที่จะตีความ""
 ep1_flavor.2070.desc.theo_same_faith_diff_cult:0 ""ข้าไม่เคยรู้เลยว่า[symposium_courtier.GetFaith.GetNameNoTooltip]ของชาว[symposium_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip]ได้เบี่ยงเบนไปจากคำสอนของ[symposium_scholar.GetFaith.HighGodNamePossessive]มากเพียงใด!" [symposium_courtier.GetFirstNameNoTooltip] เยาะเย้ย\n\n"ไร้สาระ" [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] ส่ายนิ้วของ[symposium_scholar.GetHerHis] "เป็น[symposium_courtier.GetFaith.GetAdherentNamePluralNoTooltip]ชาว[symposium_courtier.GetCulture.GetNameNoTooltip]ต่างหากที่หลงทาง กลับไปสู่การปฏิบัติแบบพวกนอกศาสนา""
 ep1_flavor.2070.desc.theo_same_relig:0 ""ความแตกต่างระหว่าง [symposium_courtier.GetFaith.GetNameNoTooltip] และ [symposium_scholar.GetFaith.GetNameNoTooltip] เป็นมากกว่าเรื่องทางเทคนิค" [symposium_courtier.GetFirstNameNoTooltip] บรรยาย "การนอกรีตของท่านได้เบี่ยงเบนไปจาก [symposium_courtier.GetFaith.HighGodName]"\n\n"ธรรมชาติที่แท้จริงของ [symposium_courtier.GetFaith.GetReligion.GetNameNoTooltip] ครอบคลุมทั้งสองศรัทธา" [symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] กล่าวอย่างเคร่งขรึม "เป็นคนโง่เขลาที่ ทำให้หุบเหวกลายเป็นร่องน้ำ""
 ep1_flavor.2070.desc.theo_diff_relig:0 ""ข้าไม่เคยเข้าใจคำสอน [symposium_scholar.GetFaith.GetReligion.GetAdjectiveNoTooltip]" [symposium_courtier.GetFirstNameNoTooltip] ครุ่นคิด "[symposium_scholar.GetFaith.HighGodName] ดูเหมือนเป็นบุคคลที่ไม่น่าเชื่อถือเมื่อเทียบกับ [symposium_courtier.GetFaith.HighGodName]"\n\n[symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] ยิ้มอย่างประชดประชัน: "ช่างมีความเข้าใจลึกซึ้งเสียจริง! หากท่านเป็น [symposium_scholar.GetFaith.BishopNeuter] ท่านคงไปถึง [symposium_scholar.GetFaith.PositiveAfterLife] อย่างแน่นอน!""
 ep1_flavor.2070.desc.mystic:0 ""การปฏิบัติอันลี้ลับเหล่านี้ไม่มีที่อยู่ในอาณาจักรของ [symposium_courtier.GetFaith.HighGodNamePossessive]" [symposium_courtier.GetFirstNameNoTooltip] ตำหนิอย่างเคร่งครัด "เป็นเพียงควันและกระจกเงา และการซ่อนตัวอยู่เบื้องหลังความลึกลับ" \n\n[symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] ยิ้มอย่างดูถูก "ท่านเพียงแค่กลัวในสิ่งที่ท่านไม่เข้าใจ และขาดความกล้าหาญหรือสติปัญญาที่จะเรียนรู้""
 ep1_flavor.2070.desc.medicine:0 ""แพทย์มีประโยชน์ของพวกเขา แต่เป็น [symposium_courtier.GetFaith.HighGodName] ผู้มีอำนาจตัดสินสุดท้ายเหนือชีวิตและความตาย" [symposium_courtier.GetFirstNameNoTooltip] คร่ำครวญ "ยาพอกเท่าใดก็ไม่สามารถรักษาจิตวิญญาณได้" \n\n"ข้าเห็นว่าท่านขาดความเข้าใจในวิชาแพทย์" [symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] ถอนหายใจ "หลายคนอาจรอดชีวิตได้หากไม่มีความไม่รู้ เช่นนี้""
 ep1_flavor.2070.desc.ling_same_cult:1 ""งานเขียน [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] นั้นพัฒนาไปไกลกว่าสิ่งใดๆ ที่จะพบได้ใน [symposium_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip]" [symposium_courtier.GetFirstNameNoTooltip] หาว "ท่านต้องเอาหนังสือบางเล่มติดตัวไปด้วยเมื่อท่านจากไป" \n\n"ไม่น่าเชื่อว่าคนเราจะผิดได้ขนาดนี้" [symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] พ่นลมหายใจ "และ ในขณะที่พูดด้วยความมั่นใจ เช่นนั้น...""
 ep1_flavor.2070.desc.ling_diff_cult:1 ""ขอสาบานต่อ [symposium_courtier.GetFaith.HighGodName] ฟังตัวเองสิ!" [symposium_courtier.GetFirstNameNoTooltip] หดตัว "ภาษาถิ่น [symposium_scholar.GetCulture.GetNameNoTooltip] นี้ทำลายภาษาที่สวยงามของ [symposium_courtier.GetCulture.GetLanguage.GetNameNoTooltip] ท่านอาจจะพูดภาษา [ling_cul_1_bonus.GetLanguage.GetNameNoTooltip] ก็ได้!" \n\n[symposium_scholar.GetFirstNameNoTooltip] สงบสติอารมณ์ [symposium_scholar.GetHerselfHimself] "ราชสำนักและลิ้นของ [symposium_ruler.GetTitledFirstNamePossessive] นั้นบริสุทธิ์กว่ามาก เมื่อเทียบกับข้ออ้างเล็กน้อยสำหรับ [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] นี้""
 ep1_flavor.2070.desc.ling_diff_lang:2 ""ภาษาต่างประเทศของท่านขาดความละเอียดอ่อนในการอภิปรายแนวคิดเหล่านี้" [symposium_courtier.GetFirstNameNoTooltip] กล่าวอย่างดูถูก "นี่คือเหตุผลที่ท่านเรียน #EMP [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]#! อย่างแน่นอน" \n\n[symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] กลอกตาและพึมพำคำสาบานภาษา [symposium_scholar.GetCulture.GetLanguage.GetNameNoTooltip] อย่างดูถูกภายใต้ลมหายใจของ [symposium_scholar.GetHerHis]"
 ep1_flavor.2070.desc.fall_alchemy:0 ""อัตราส่วนนี้จะไม่ได้ผล" [symposium_courtier.GetFirstNameNoTooltip] ส่ายหน้า [symposium_courtier.GetHerHis] พลางพิจารณารอยขีดข่วนบนเปลือกไม้ "ทั้งหมดนี้เคยลองทำมาแล้ว" \n\n[symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] ตอบว่า "ทุกคนทำผิดพลาดได้—แม้ แต่นักเล่นแร่แปรธาตุ—พวกเขาอาจพลาดบางอย่างไป""
 ep1_flavor.2070.desc.fall_stars:0 ""ไม่ ไม่ ไม่! ทฤษฎีเหล่านี้ถูกหักล้างไปเมื่อหลายศตวรรษก่อน" [symposium_courtier.GetFirstNameNoTooltip] ขมวดคิ้วด้วยความไม่เชื่ออย่างแท้จริง "ท่านไม่ได้อ่านตำราดาราศาสตร์คลาสสิกหรือ?" \n\n"ท่านอ่านแทนที่จะคิด" [symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] โต้กลับ "ยังมีอีกมากที่เราต้องเรียนรู้""
 ep1_flavor.2070.desc.fall_books:0 ""ท่าน #EMP อ่าน#! หนังสือผิดเล่มอย่างชัดเจน" [symposium_courtier.GetFirstNameNoTooltip] กล่าวอย่างไม่ใส่ใจ "ข้าจะให้รายชื่อหนังสือแนะนำของชาว [symposium_courtier.GetCulture.GetNameNoTooltip]..." \n\n"ไม่เป็นไร" [symposium_scholar.GetWomanMan] [symposium_scholar.Custom('GetYoungMiddleAgedOld')] ตอบอย่างราบเรียบ "เห็นได้ #EMP ชัด#! ว่าไม่มีอะไรมากในนั้น""
 ep1_flavor.2070.a:0 ""ว่าไง ท่านจะอยู่ต่ออีกสักหน่อยไหม [symposium_scholar.GetFirstNameNoTooltip]?""
 ep1_flavor.2070.c:0 ""ท่านผิด: นี่คือเหตุผล""
 ep1_flavor.2070.c.lang:0 ""ท่านเพิ่งพูดในสิ่งที่ข้าคิดว่าท่านพูดหรือเปล่า?""
 ep1_flavor.2070.c.success:0 "ท่านพิสูจน์ว่า [symposium_scholar.GetFirstNameNoTooltip] ผิด"
 ep1_flavor.2070.c.failure:0 "[symposium_scholar.GetFirstNameNoTooltip] ทำให้ท่านอับอาย"
 ep1_flavor.2070.c.tt:0 "[symposium_scholar.GetFirstNameNoTooltip] อาจเข้าร่วมราชสำนักของท่าน"
 ep1_flavor.2070.d:0 ""ข้าคิดว่าถึงเวลาที่ท่านต้องไปแล้ว [symposium_scholar.Custom('GetScholarType')|l]""
 ep1_flavor.2070.e:0 "ออกไป ไอ้คนหมิ่นศาสนา!"
