 # Court of Vipers
 ep1_flavor.2010.t:0 "ราชสำนักอสรพิษ"
 ep1_flavor.2010.desc:0 "ทุกคืน เมื่อเทียนดับลงและ [ROOT.Char.Custom('FortifiedBuilding')] อันมืดมิดเงียบสงัด เสียงกระซิบถึงแผนการที่จะ [real_plot.GetSchemeType.GetTypeNameNoTooltip|l] ข้า ก็หลอกหลอนไปทั่วห้องหับ"
 # SPYMASTER
 ep1_flavor.2010.desc_spy_real:0 "[spymaster.GetCouncilTitleFirstName] ดูเหมือนจะแน่ใจว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] ของข้า [real_plotter.GetTitledFirstName] อยู่เบื้องหลัง... \n\n"
 ep1_flavor.2010.desc_spy_1:0 "[spymaster.GetCouncilTitleFirstName] กล่าวว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] ของข้า [scapegoat_1.GetTitledFirstName] อาจจะ #EMP บางที#! อยู่เบื้องหลัง... \n\n"
 ep1_flavor.2010.desc_spy_2:0 "[spymaster.GetCouncilTitleFirstName] เกือบจะแน่ใจครึ่งหนึ่งว่า [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] ของข้า [scapegoat_2.GetTitledFirstName] อยู่เบื้องหลัง... \n\n"
 # COUNCILLOR 1
 ep1_flavor.2010.desc_1_real:0 "[councillor_1.GetCouncilTitleFirstName] ไม่เห็นด้วยเป็นการส่วนตัว โดยโต้แย้งว่า [real_plotter.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] ของข้า เป็นผู้รับผิดชอบ ขณะที่"
 ep1_flavor.2010.desc_1_1:0 "[councillor_1.GetCouncilTitleFirstName] ไม่เห็นด้วยเป็นการส่วนตัว โดยโต้แย้งว่ากลิ่นเหม็นของ [scapegoat_1.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] ของข้า สมควรได้รับการตรวจสอบ ขณะที่"
 ep1_flavor.2010.desc_1_2:0 "[councillor_1.GetCouncilTitleFirstName] ไม่เห็นด้วยเป็นการส่วนตัว โดยโต้แย้งว่า [scapegoat_2.GetTitledFirstName] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] ของข้า มีท่าทางลับๆ ล่อๆ ขณะที่"
 # COUNCILLOR 2
 ep1_flavor.2010.desc_2_real:0 "[councillor_2.GetCouncilTitleFirstName] กระตุ้นให้ข้าจำคุก [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))] ของข้า [real_plotter.GetTitledFirstName] "คนทรยศที่เห็นได้ชัด" ก่อนที่จะสายเกินไป\n\n"
 ep1_flavor.2010.desc_2_1:0 "[councillor_2.GetCouncilTitleFirstName] กระตุ้นให้ข้าจำคุก [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))] ของข้า [scapegoat_1.GetTitledFirstName] "ผีสางแห่ง [scapegoat_1.GetCurrentLocation.GetNameNoTooltip]" ก่อนที่จะสายเกินไป\n\n"
 ep1_flavor.2010.desc_2_2:0 "[councillor_2.GetCouncilTitleFirstName] กระตุ้นให้ข้าจำคุก [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))] ของข้า [scapegoat_2.GetTitledFirstName] "ปีศาจ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]" ก่อนที่จะสายเกินไป\n\n"
 # CONTEXT
 ep1_flavor.2010.desc_family:0 "เลือดเนื้อเชื้อไขของข้าเองหรือที่กำลังวางแผนต่อต้านข้า?"
 ep1_flavor.2010.desc_consort:0 "ข้ากำลังร่วมเตียงกับคนที่ต้องการให้ข้าตายหรือ?"
 ep1_flavor.2010.desc_councillor:0 "ที่ปรึกษาที่ใกล้ชิดที่สุดคนหนึ่งของข้าต้องการทำร้ายข้าจริงๆ หรือ?"
 ep1_flavor.2010.desc_fallback:0 "ข้าเห็นการทรยศอยู่เบื้องหลังทุกคู่สายตา สอดส่องมือของข้าราชสำนักเพื่อหากริชที่ซ่อนอยู่"
 ep1_flavor.2010.desc_outro:0 "ขอสาบานต่อ [ROOT.Char.GetFaith.HighGodName] ข้าจนปัญญาแล้ว..."
