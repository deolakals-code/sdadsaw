 ep1_flavor.2030.desc_1_culture:0 "[local_dispute_1.GetFirstName] ผู้นำชนกลุ่มน้อยชาว [local_dispute_1.GetCulture.GetName] ของ [local_county_1.GetNameNoTierPossessive],"
