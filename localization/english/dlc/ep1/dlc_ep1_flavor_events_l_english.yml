 ep1_flavor.2010.b.fake_2:0 "ไม่... หรือจะเป็น [scapegoat_2.GetTitledFirstNameNoTooltip]?"
 ep1_flavor.2010.c.real:0 "[real_plotter.GetTitledFirstNameNoTooltip] ต้องอยู่เบื้องหลังเรื่องนี้"
 ep1_flavor.2010.c.fake_1:0 "[scapegoat_1.GetTitledFirstNameNoTooltip] ต้องอยู่เบื้องหลังเรื่องนี้"
 ep1_flavor.2010.c.fake_2:0 "[scapegoat_2.GetTitledFirstNameNoTooltip] ต้องอยู่เบื้องหลังเรื่องนี้"
 ep1_flavor.2010.d:0 "ข้าจะตามสืบเรื่องนี้"
 ep1_flavor.2010.e:0 "ไม่มีอะไรนอกจากข่าวลือ"
 ep1_flavor.2010.e.tt:0 "แผนการต่อต้านท่านจะดำเนินต่อไป"
 ep1_flavor.2010.d.success:0 "ท่านค้นพบผู้กระทำผิดที่แท้จริง"
 ep1_flavor.2010.d.failure:0 "ท่านพบเพียงความสงสัยเพิ่มเติม"
 ep1_flavor.2010.d.success_tt:0 "ผู้บงการที่แท้จริงจะถูกเปิดโปงและจำคุก"
 ep1_2010_failure_modifier:0 "ใยแห่งคำลวง"
 ep1_2010_failure_modifier_desc:0 "ราชสำนักของตัวละครนี้เป็นปมกอร์เดียนแห่งผลประโยชน์ที่วางแผนซับซ้อน"
