l_english: 
 tradition_header:0 "ประเพณี:"
 ep1_flavor.1000.t:0 "$tradition_header$ ขันทีผู้มาเยือน"
 ep1_flavor.1000.desc:0 "ขันทีพเนจรผู้หนึ่งกำลังแนะนำ[eunuch_target.GetHerselfHimself] ที่ราชสำนักของข้าในวันนี้\n\n"คารวะ ท่านผู้ [ROOT.Char.Custom('ComplimentAdjective')] ที่สุด [ROOT.Char.GetTitleTierName]" [eunuch_target.GetSheHe] กล่าวอย่างนอบน้อม\n\n"นามของข้าคือ [eunuch_target.GetFirstName] ผู้พเนจรมีชื่อเสียง — ข้าได้ให้ความรู้แก่เหล่ากษัตริย์นักปราชญ์ผู้สูงศักดิ์ และดูแลฮาเร็มของสุลต่านผู้ยิ่งใหญ่ — บัดนี้ข้ามาที่นี่ เพื่อเสนอการบริการของข้าแก่ท่าน ด้วยค่าธรรมเนียมพอประมาณ"\n\nเป็นตัวละครที่น่าสนใจ บางทีข้าควรจ้าง [eunuch_target.GetHerHim]?"
 ep1_flavor.1000.a:0 "ข้อเสนอที่ยุติธรรม ข้าตกลง"
 ep1_flavor.1000.b:0 "[eunuch_target.GetFirstNameNoTooltip] สหายผู้ [eunuch_target.Custom('ComplimentAdjective')] ของข้า อยู่ต่ออีกสักหน่อยเถิด?"
 ep1_flavor.1000.c:0 "ข้าไม่ต้องการบริการของเจ้า"
 eunuch_moves_tt:0 "[eunuch_target.GetFirstNameNoTooltip] เดินทางต่อไปยัง [new_court.GetBaseName]"
 ep1_flavor.1000.c.success:0 "ท่านโน้มน้าวให้ [eunuch_target.GetFirstNameNoTooltip] อยู่ต่อได้สำเร็จ"
 ep1_flavor.1000.c.failure:0 "[eunuch_target.GetFirstNameNoTooltip] เรียกท่านว่าคนขี้เหนียวและจากไป"
 
 ep1_flavor.1200.t:0 "$tradition_header$ กลเม็ดเคล็ดลับ"
 ep1_flavor.1200.desc:0 "ขันที [eunuch_target.GetFirstName] ก้าวเข้ามาในสายตาข้า [eunuch_target.Custom('quirk_pos_pp')]\n\n"ท่านรู้หลายสิ่งหลายอย่าง ท่าน [ROOT.Char.GetTitleTierName] ผู้ยิ่งใหญ่ แต่มีบางสิ่งที่แม้ แต่จิตใจอันล้ำลึกของท่านก็ไม่อาจหยั่งถึงได้ — ความลับและความรู้ที่ข้ายินดีจะแบ่งปันกับท่าน" [eunuch_target.GetSheHe] กระซิบ\n\n"โดยมีค่าตอบแทน"\n\nแน่นอน ถึงกระนั้น ข้าก็ยังสนใจ"
 ep1_flavor.1200.a:0 "ข้าได้ยินมาว่าท่านรู้ความลับของภาษา?"
 ep1_flavor.1200.b:0 "ข้ามีศัตรูมากมาย ข้าจะกำจัดพวกเขาได้อย่างไร?"
 ep1_flavor.1200.c:0 "อาณาจักรของข้าต้องรุ่งเรือง ข้าจะแน่ใจได้อย่างไรว่ามันจะเป็น เช่นนั้น?"
 ep1_flavor.1200.d:0 "เจ้าคนลวงโลก! ความลับของเจ้าไม่มีอะไรนอกจากเรื่อง แต่ง"
 secrets_of_language_modifier:0 "ความลับแห่งภาษา"
 secrets_of_language_modifier_desc:0 "ตัวละครนี้ได้รับรู้ความลับที่เกี่ยวข้องกับการเรียนรู้ภาษา"
 secrets_of_murder_modifier:0 "ความลับแห่งการแก้แค้น"
 secrets_of_murder_modifier_desc:0 "ตัวละครนี้ได้รับรู้ความลับที่เกี่ยวข้องกับการกำจัดศัตรู"
 secrets_of_the_realm_modifier:0 "ความลับแห่งอาณาจักร"
 secrets_of_the_realm_modifier_desc:0 "ตัวละครนี้ได้รับรู้ความลับที่เกี่ยวข้องกับการจัดการเมืองหลวง"

 ### Court Type Flavor Events

 # The Secret DaughterSon
 ep1_flavor.0001.t:0 "[scion_actual.Custom('GetDaughterSon')|U] ลับ"
 ep1_flavor.0001.desc:0 "เรื่องธุรกิจเล็กน้อยในเมืองนำพาคณะผู้ติดตามและข้า ผู้กระหายและหิวโหย มายังโรงเตี๊ยมเล็กๆ ที่อบอวลไปด้วยควัน\n\nในบรรดาผู้คนทั้งหลาย ข้าคาดไม่ถึงที่สุดว่าจะพบ [scion_parent.GetTitledFirstName] นั่งอยู่ด้านหลัง ปลอมตัวอย่างแย่ๆ ด้วยเสื้อคลุมและหมวกคลุม ข้างๆ [scion_parent.GetHerHim] มี [scion_actual.GetWomanMan] หนุ่มสาวผู้หนึ่งนั่งอยู่ ซึ่ง... เป็นไปไม่ได้!\n\nจากใบหน้าของ [scion_actual.GetHerHis] วิธีที่ [scion_actual.GetSheHe] มองไปรอบห้องด้วยความประหลาดใจ และการเลียนแบบท่าทางอันเป็นเอกลักษณ์ของ [scion_parent.GetFirstNameNoTooltip] ของ [scion_actual.GetHerHis] ข้า #EMP มั่นใจ#! ว่า [scion_actual.GetSheHe] ต้องเป็นลูกนอกสมรสลับๆ ของ [scion_parent.GetTitleAsNameNoTooltip] บางทีอาจได้เห็นโลกภายนอกเป็นครั้งแรก"
 ep1_flavor.0001.a:0 "[scion_parent.GetFirstNameNoTooltip]! ท่านพา [scion_actual.Custom('GetBrideGroom')] มาให้ข้าหรือ?"
 ep1_flavor.0001.a.tt.success:0 "ท่านบังคับเจรจา [marriage|E] [alliance|E] ได้สำเร็จ"
 ep1_flavor.0001.a.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] หนีไปพร้อมกับ [scion_parent.GetHerHis] [scion_actual.Custom('GetDaughterSon')]"
 ep1_flavor.0001.b:0 "[scion_parent.GetFirstNameNoTooltip]! ท่านพา [scion_actual.Custom('GetBrideGroom')] มาให้ [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('prospective_spouse'))] ของข้าหรือ?"
 ep1_flavor.0001.c:0 "ไปตามคนป่าวประกาศมา #EMP เดี๋ยวนี้#!!"
 ep1_flavor.0001.c.tt.success:0 "ท่านพบหลักฐานเพียงพอที่จะพิสูจน์การมีอยู่ของลูกนอกสมรส"
 ep1_flavor.0001.c.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] ปกปิดร่องรอยของ [scion_parent.GetHerHis] ได้ดีเกินไป"
 ep1_flavor.0001.d:0 "อย่ากังวลไปเลย ท่าน [scion_parent.GetTitleAsNameNoTooltip] ท่านวางใจได้ว่าข้าจะลืมว่าเคยเห็นท่าน..."
 ep1_flavor.0001.tt.scion_escapes:0 "[scion_actual.GetFirstName] ถูกพาตัวไปซ่อนและไม่มีใครได้ยินข่าวอีกเลย"
 ep1_flavor.0001.e.no_bastards:0 "เด็ก #EMP ลับ#!? ช่างแปลกประหลาด เราไปกินที่อื่นดีกว่า"
 ep1_flavor.0001.e.fallback:0 "นี่ไม่ใช่ธุระของเรา เราไปกินที่อื่นดีกว่า"

 ep1_flavor.0011.t:0 "ความเละเทะอย่างที่สุด"
 ep1_flavor.0011.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U] มันไม่ใช่อย่างที่เห็นพ่ะย่ะค่ะ!" [diplomat_1.GetTitledFirstName] ร้องขึ้นขณะที่ข้าก้าวเข้าสู่ห้องโถงอาหารโปรดของข้า\n\nสิ่งที่ #EMP เห็น#! ก็คือ [diplomat_1.GetSheHe] ทำห้องเละเทะไปหมด อาหารเกรอะกรังตามผนัง โต๊ะทั้งหลายแทบจะแหลกละเอียด มีคนเอาเก้าอี้ทุกตัวมาซ้อนกันเป็นพีระมิด และร่างอันไม่ได้สติของ [diplomat_2.GetTitledFirstName] (เปลือยเปล่า) ก็นอนหงายอาบซุปอยู่บนเตียง #EMP ของข้า#! เตียงหนึ่ง\n\nนักการทูตทั้งสองเพิ่งมาถึงเมื่อวาน ข้าอนุญาตให้พวกเขาทานอาหารดี ๆ และรับความบันเทิงเบา ๆ ได้ ไม่ใช่งานเลี้ยงที่อึกทึกครึกโครมราวกับจะปลุก [ROOT.Char.GetFaith.NegativeAfterLife|U] ขึ้นมาได้"
 ep1_flavor.0011.a:0 "พวกเจ้าจะต้องจ่ายค่าเสียหายนี้ ไอ้พวกประจบสอพลอ!"
 ep1_flavor.0011.b:0 "เอาล่ะ พวกเจ้าทำเละ พวกเจ้าก็ต้องทำความสะอาด คนรับใช้! เอาไม้ถูพื้นมา!"
 ep1_flavor.0011.c:0 "โอ้ ไม่ งานเลี้ยงนี้ยังไม่จบ: ใครก็ได้เติมถ้วยของข้า!"
 ep1_flavor.0011.d:0 "คืนเดียว? น่าสมเพช! หลีกทางให้ [ROOT.Char.GetTitleAsNameNoTooltip] จอมปาร์ตี้!"
 ep1_flavor.0011.e:0 "ออกจากห้องโถงไปเงียบๆ"
 ep1_flavor.0011.e.tt:0 "ท่านปล่อยให้ทั้งสองเคี่ยวกรำอยู่ในความกลัวของตนเอง"

 ep1_flavor.0021.t:0 "สองอาณาจักรที่ถูกแบ่งแยกด้วยภาษาในราชสำนัก"
 ep1_flavor.0021.desc:1 "เสียงหัวเราะคิกคักดังขึ้นรับข้าขณะเดินเข้าไปในห้อง: เหล่าข้าราชสำนักกลุ่มหนึ่ง นำโดย [nitpicker.GetTitledFirstName] กำลังมุงดูจดหมายล่าสุดจาก [rival_monarch.GetTitledFirstName]\n\n[nitpicker.GetFirstNameNoTooltip] กวักมือเรียกข้าพร้อมกับเสียงหัวเราะลั่น\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U] ท่าน #EMP ต้อง#! อ่านนี่ให้ได้พ่ะย่ะค่ะ! มันมีตราประทับทางการของ [rival_realm.GetNameNoTier] แต่ทุก ๆ คำกลับสะกดราวกับชาวบ้านไม่รู้หนังสือเป็นคนเขียน พวกปัญญาทึบเหล่านั้นแม้ แต่ใช้พยัญชนะให้ถูกยังทำไม่ได้ นับประสาอะไรกับการพูดภาษา [ROOT.Char.GetCourtLanguage.GetName] ดี ๆ และมัน #EMP น่าขันสิ้นดี#!""
 ep1_flavor.0021.a:0 "สาส์นนี้ขาดสระไปครึ่งหนึ่ง! น่ารังเกียจ!"
 ep1_flavor.0021.a.tt:0 "ทั้งสอง [courts|E] สูญเสีย [opinion|E] ต่อกัน [SCOPE.ScriptValue('ep1_flavour_0021_courts_lose_opinion_value')|N0]"
 ep1_flavor.0021.a.tt.success:0 "การสะกดแบบ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] ดีที่สุด!"
 ep1_flavor.0021.a.tt.failure:0 "การสะกดแบบ [rival_monarch.GetPrimaryTitle.GetAdjectiveNoTooltip] ดีที่สุด!"
 ep1_flavor.0021.b:0 "พวกเขาไม่ใช่ญาติทางภาษาของเราหรือ?"
 ep1_flavor.0021.b.tt:0 "ทั้งสอง [courts|E] ได้รับ [opinion|E] ต่อกัน [SCOPE.ScriptValue('ep1_flavour_0021_courts_gain_opinion_value')|P0]"
 ep1_flavor.0021.c:0 "สองราชสำนักสูงศักดิ์ แต่ไม่มีสมองสักนิดระหว่างพวกเขา..."
 ep1_flavor.0021.c.tt:0 "$ep1_flavor.0021.a.tt$"
 cultural_acceptance_courtly_spelling_differences:0 "การทะเลาะกันเรื่องการสะกดคำของชนชั้นสูง"
 cultural_acceptance_courtly_cousins:0 "ชนชั้นสูงผูกพันกันผ่านภาษาในราชสำนักที่ใช้ร่วมกัน"

 ep1_flavor.0031.t:0 "ใหม่ในราชสำนัก"
 ep1_flavor.0031.desc:0 "มีคำกล่าวที่ดีว่าจิตใจที่ยิ่งใหญ่ต้องการประเพณีที่ยิ่งใหญ่ และไม่มีประเพณีการรับน้องนักปราชญ์ใดยิ่งใหญ่ไปกว่าของ [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\n\nสัปดาห์นี้เป็นสัปดาห์แห่งการต้อนรับนักปราชญ์หน้าใหม่ผู้มีความสามารถหลายคนเข้าสู่ราชสำนัก ซึ่งมาจากทั่วทุกมุมของอาณาจักร ทุกคนกำลังถูกทดสอบ #EMP ทางวิชาการ#! ต่างๆ ที่โรงเตี๊ยมท้องถิ่น\n\nสายตาของข้าจับจ้องไปที่ [scholar_1.GetFirstName] ขณะที่ [scholar_1.GetSheHe] มองเครื่องดื่มลึกลับที่มีฟองฟู่ฟ่อง ซึ่งวางอยู่ตรงหน้า [scholar_1.GetHerHim] อย่างน่าสงสัย ด้านหลังนักปราชญ์ผู้ระแวดระวัง [scholar_2.GetFirstName] กำลังเติมเหยือก #EMP ทั้งใบ#! ด้วยของเหลวข้นเหนียว ท่ามกลางเสียงเชียร์และเสียงโห่ร้องจากเพื่อนนักวิชาการของ [scholar_2.GetHerHis]"
 ep1_flavor.0031.a:0 "ดื่มเข้าไป [scholar_1.GetFirstNameNoTooltip]!"
 ep1_flavor.0031.b:0 "เราชอบดื่มกับ [scholar_2.GetFirstNameNoTooltip] เพราะ [scholar_2.GetFirstNameNoTooltip] คือเพื่อนของเรา!"
 ep1_flavor.0031.c:0 "มีบางเทคนิคที่ต้องอาศัยประสบการณ์เท่านั้นจึงจะสอนได้..."
 ep1_flavor.0031.c.tt:0 "ท่านแสดงให้นักปราชญ์หน้าใหม่เห็นว่าต้องทำอย่างไร"
 ep1_flavor.0031.d:0 "พิธีกรรมเหล่านี้ #EMP ไม่เหมาะสม#! กับนักปราชญ์"
 ep1_flavor.0031.inspire.scholar_1.tt:0 "[scholar_1.GetFirstNameNoTooltip] กลายเป็น [inspired|E]"
 ep1_flavor.0031.inspire.scholar_2.tt:0 "[scholar_2.GetFirstNameNoTooltip] กลายเป็น [inspired|E]"

 # Martial Exercise
 ep1_flavor.2000.t:0 "การฝึกซ้อมทางทหาร"
 ep1_flavor.2000.desc_intro:0 "ขณะที่ข้าตรวจค่ายทหารท้องถิ่น เป็นที่ชัดเจนว่า [marshal_scope.GetTitledFirstName] และ [knight_scope.GetTitledFirstName] กำลังพยายามเข้าหาข้า \n\n"เจ้าเหนือหัว เหล่าทหารว่างงานเมื่อสันติภาพมาเยือน กิจกรรมบางอย่างจะช่วยให้พวกเขากระตือรือร้น..." [marshal_scope.GetCouncilTitle] ของข้ากระตุ้น"
 ep1_flavor.2000.desc_archers:0 ""[ROOT.Char.Custom('GetRegionalArcherMAA')|l] นั้นขาดไม่ได้ เราควรแน่ใจว่าลูกธนูของพวกเขาเข้าเป้าเสมอ""
 ep1_flavor.2000.desc_infantry:0 ""[ROOT.Char.Custom('GetRegionalInfantryMAA')|l] ของเรามีความสำคัญต่อชัยชนะ พวกเขาต้องไม่ปล่อยให้อ่อนแอลง""
 ep1_flavor.2000.desc_cavalry:0 ""[ROOT.Char.Custom('GetRegionalCavalryMAA')|l] ของท่านคือทรัพย์สินที่มีค่าที่สุด อย่าปล่อยให้พวกเขากลายเป็นคนสะเพร่า""
 ep1_flavor.2000.desc_archer_cavalry:0 ""พลธนูม้าคือกระดูกสันหลังของเรา การแข่งขันยิงธนูบนหลังม้าจะ ทำให้พวกเขาน่าเกรงขาม""
 ep1_flavor.2000.desc_skirmishers:0 ""[ROOT.Char.Custom('GetRegionalSkirmisherMAA')|l] ผู้มีพรสวรรค์ของเราต้องแข่งขันกัน เพื่อให้พวกเขายิงเข้าเป้าเสมอ""
 ep1_flavor.2000.desc_elephant_cavalry:0 ""ช้างที่น่าเกรงขามนำชัยชนะมาให้เรา พวกมันต้องพร้อมตลอดเวลา""
 ep1_flavor.2000.desc_camel_cavalry:0 ""พลขี่อูฐที่สำคัญคือแกนหลักของกองกำลังของท่าน ท่านต้องให้ความสำคัญกับพวกเขา""
 ep1_flavor.2000.desc_levies:0 ""มวลชนผู้ยากไร้ต้องการกิจกรรม เพื่อให้พวกเขามีร่างกายแข็งแรงและมีประโยชน์เมื่อถูกเรียกตัว""
 ep1_flavor.2000.desc_bridge:0 "\n\n"ไม่ ความพยายามจำเป็นในที่อื่น" [knight_scope.GetFirstNameNoTooltip] แทรกขึ้น,"
 ep1_flavor.2000.desc_outro:0 "\n\nข้าว่าการฝึกฝน #EMP ทำให้#! สมบูรณ์แบบ..."
 ep1_flavor.2000.c:0 ""กีฬาเป็นของชนชั้นสูง และมันเรียกว่าการล่าสัตว์""
 ep1_flavor.2000.culture_tt:0 "ข้าราชสำนักและข้าในบังคับชาว [THIS.Char.GetCulture.GetName] ทุกคน"
