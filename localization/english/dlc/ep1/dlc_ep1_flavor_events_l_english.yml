 ep1_flavor.2030.desc_1_merchant:0 "[local_dispute_1.GetFirstName] พ่อค้าชั้นนำของ [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_bridge:0 "และ"
 ep1_flavor.2030.desc_2_monk:0 "[local_dispute_2.GetFirstName] [local_dispute_2.Custom('NunMonk')] [local_dispute_2.GetFaith.GetAdjectiveNoTooltip] ที่มีชื่อเสียงจาก [local_county_2.GetNameNoTier],"
