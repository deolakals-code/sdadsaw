 # Taking Sides
 ep1_flavor.2030.t:0 "การเลือกข้าง"
 ep1_flavor.2030.desc_intro:0 "ระบบราชการ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] โดยทั่วไปจะดำเนินไปข้างหน้าด้วยแรงผลักดันของตัวเอง แต่บางครั้งปัญหาที่ไม่มีทางออกที่ชัดเจนก็ปรากฏขึ้น \n\nวันนี้คือ"
